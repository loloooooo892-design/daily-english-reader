*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

}

  font-size: 0.6875rem;

}

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;

.swap-btn:hover {

.swap-btn:disabled {

.article-body li {

  text-decoration-thickness: 1px;

}

.article-body em { font-style: italic; }

<script>
var articles = [{"title":"Do a literal monster mash in Dance of Theseus, a strangely undisgusting blend of plastic surgery and Balatro-style fashion battles","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/do-a-literal-monster-mash-in-dance-of-theseus-a-strangely-undisgusting-blend-of-plastic-surgery-and-balatro-style-fashion-battles","category":"gaming","categoryLabel":"Gaming","wordCount":1083,"readingTime":6,"content":"<p>One look?? I don't think so!</p>\n    \n  \n  \n  \n\n            <p>\r\nIt is time to confront the terrible truth that I once took part in a school fashion show. I ran in two categories, Ballroom and Street, a serious test of range for a kid who had only just mastered the daredevil technique of wearing a shirt without a tie. In the Ballroom bracket, I was asked to do a waltz in an Indian wedding gown provided by a local sponsor who, I can only assume, immediately went out of business after the event. In Street, I had to wear a Gap hoodtop and shoot a fire-eater (one of the Cool Teachers) with a Super Soaker, while some other lost soul moonwalked down the runway in a golden suit.\r\n</p>\n<p>\r\nIn retrospect, I am filing all this under the secret umbrella category of God's Greatest Mistake. There is exactly no photographic evidence, and I will thank you not to search for any on Facebook. It's <em>so much</em> less upsetting being a fashion model in <a href=\"https://www.rockpapershotgun.com/games/dance-of-theseus\" target=\"_blank\" rel=\"noopener\">Dance of Theseus</a>, which might sound weird given that in Dance of Theseus, you don't just swap outfits – you graft on new heads, arms and legs, either bought from sniffy griffon dressmakers or moulded together out of seashells, horned skulls, and scraps of shimmering hide. Created by Shanghai-based Citreat Studio, it's a cheerful, colourful and somehow unrevolting life sim RPG with a kind of <a href=\"https://www.rockpapershotgun.com/games/balatro\" target=\"_blank\" rel=\"noopener\">Balatro</a>-esque Frankensteinmaxxing element. I've been playing the demo, and it's both entertaining and a source of endless inspiration. Argh, if only I'd had access to this, when I was 16!!!\r\n</p>\n\n<p>\r\nIn Dance of Theseus you play Thea, a young plastic surgeon who tumbles through a hole and into the realm of monsters, losing an arm during the descent. Thea plonks down square in the middle of a fashion contest. The judges take one look at her bedraggled form and assume that she's a contestant - and what's a girl to do but glob together a new arm, sculpt her own gushing head wounds into a fetching scarlet hairpiece, and get busy racking up 10s. \r\n</p><p>\r\nAt no point in the proceedings does Thea (e.g.) collapse wheezing due to a mixture of blood loss and utter terror. She's a practical soul, and a big ego. No way is she going to be outclassed by a bunch of Grimm Fairytale rejects. Fortunately, Thea makes an immediate friend in Winks, a gabby butterfly creature cruelly derided as the least trendy monster in town. Winks kindly supplies Thea with both a place to stay and a golden crustacean claw to get her modelling career off the ground. \r\n</p>\n<p>\r\nThe game's fashion competitions prove to be a mixture of deckbuilding and simple narrative puzzling. Before each round, you spend Stamina to ask the event's judges which styles they favour – some might suggest you adopt \"the colour of mystery\", or similar wording; others will hint that they'd love you to be an octopus right now. Then, you spend Sanity to stitch together an appropriate body from an inventory of monstrous limbs, picking colours and \"textures\" (such as fleshy or bony) to match the competition's theme. Yes, this is a game with a Sanity bar, but not, so far, a 'madness sim' in the vein of <a href=\"https://www.rockpapershotgun.com/games/darkest-dungeon\" target=\"_blank\" rel=\"noopener\">Darkest Dungeon</a>. It's more like a Tim Burton movie with a touch of Pixar's quippiness. \r\n</p>\n\n<p>\r\nIf you wow the judges, you'll get extra points to spend on \"dance moves\" in a subsequent scoring round. Scoring sees you lining up your body parts and rating them one by one, with dance cards allowing you to jimmy the workings. You can do a waltz (egad! My old nemesis) to change the order of appendages and form a colour combo. Another card might let you transform a tufty yeti arm that clashes with the theme into a tasteful mantis leg. There are also climactic dance-offs against other named characters. During these boss battles, you can play cards to throw your opponent off, and mess with their scoring. Picture 'accidentally' stamping on a rival's scorpion tail with your massive goat hoof.\r\n</p><p>\r\nBetween runway jousts, Thea will retire to the monster village to work on her various looks. This part of the game is a gentle life sim with gaudy dollhouse aesthetics that remind me of noughties Facebook games. You can tour the monster world, buying fancy new elbows and whatnot at the big city store, or dream up your own anatomical eccentricities. There are minigames and resource spots to cycle through: fishing gets you food to replenish your stamina, while visiting the local volcano is how you'll acquire dreamcatchers to restore your sanity. \r\n</p>\n<p>\r\nYou can also go on top-down, grid-based expeditions with a limited number of steps, to gather materials for your outfits. And you can grow a range of unsavoury textiles in your monster garden. Gathering and crafting aside, there are other characters sprinkled around the world map to befriend and romance. In the demo, I really hit it off with a smouldering demonboy called Supay, whose outfits leave little to the imagination in the sense that I think I can see his kidneys. He's been sending me presents. Admittedly, most of the gifts so far are severed heads, but the thought is everything.\r\n</p>\n\nImage credit: Citreat Studio / Rock Paper Shotgun\n\n<p>\r\nI'm enjoying the writing, not least because putting certain conventions for attractiveness under the knife appears to be a priority. Thea's Disney-adjacent complexion is rather downmarket by hellworld standards. \"What about you is pretty?\" sneers an opposing clothes-horse (not an actual horse, though this would be entirely plausible), on the day of your arrival. \"Your golden locks? Your symmetrical face? Your smooth skin? Your itty-bitty waist? The way you smell like citrus and rain? Beauty is about fear. If you don't look like you can make a human scream in terror and run away, then what kind of monster are you?\" What indeed. Again, this would have been great grist for me during my own catwalking days.</p><p>The caption for Thea's replacement arm adds that \"perhaps humanness was always just a mirage, a cleverly constructed optical illusion\". In Dance of Theseus, the illusion is yours to rearrange and distort as you see fit. It turns out that when they said beauty is in the eye of the beholder, they meant the one from D&amp;D. Anyway, I am looking forward to getting my hands on a complete set of mantis limbs. The full game is out… soon. <a href=\"https://store.steampowered.com/app/3581260/Dance_of_Theseus/\" target=\"_blank\" rel=\"noopener\">Read more on Steam.</a>\n</p>"},{"title":"Dolly Parton: Science Icon - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/dolly-parton-science-icon-1284482/","category":"fun","categoryLabel":"Interesting Reads","wordCount":608,"readingTime":4,"content":"<p>When geneticists from the University of Edinburgh successfully cloned the first mammal, they named it Dolly, after the now departed singer/songwriter Dolly Parton. The reason, they said, was that Dolly the sheep had been cloned from the cell of a mammary gland and “we couldn’t think of a more impressive pair of glands than Dolly Parton’s.”  </p><p>Featured Video</p><p>It was crass, but Dolly the human responded with her characteristic Southern charm and class, offering condolences when her namesake passed away. “I was sorry when she died, though I don’t want be cloned myself,” she said in an <a href=\"https://www.theguardian.com/music/2024/oct/31/dolly-parton-reader-interview\" target=\"_blank\" rel=\"noopener\">interview</a> with <em>The Guardian</em>. “I want to get on out of here when I can.” </p><p>And now she has. This low-flying angel with a voice like drizzled honey passed away at the age of 80 from an undisclosed and brief battle with cancer. During her time on Earth, Parton left behind a scientific legacy that extends beyond a sophomoric joke—one defined by her love of humanity, giving heart, and unrelenting optimism. </p><p><strong>Read more: <a href=\"https://nautil.us/why-shouldnt-a-horsefly-be-named-after-beyonc-237702\" target=\"_blank\" rel=\"noopener\">“Why Shouldn’t a Horsefly Be Named After Beyoncé?”</a></strong></p><p>A <a href=\"https://psycnet.apa.org/record/2023-05298-001\" target=\"_blank\" rel=\"noopener\">study</a> published just last year delving into Parton’s song lyrics found that they were brimming with positivity for over half a century. According to the researchers, Parton’s consistently upbeat <em>oeuvre</em> was a rarity for recording artists, especially during a time when sunny sentiments in pop music were dwindling. Similar studies into the works of Bob Dylan and the Beatles found the emotional content of their lyrics soured over time—but not Parton’s.</p><p>And of course there was her philanthropy. </p><p>Famously, Parton donated $1 million to Vanderbilt University to research treatments and vaccines for the novel coronavirus when the pandemic gained steam in 2020. The resulting Dolly Parton COVID-19 Research Fund directly supported research that contributed to the development of Moderna’s COVID-19 vaccine (as well as funding antiviral drug and monoclonal antibody studies). When the jab debuted, Parton was first in line to get “a dose of her own medicine,” posting a <a href=\"https://www.nytimes.com/2021/03/02/world/dolly-parton-moderna-vaccine-covid.html\" target=\"_blank\" rel=\"noopener\">video</a> of herself singing “Jolene,” replacing the temptress’ name with “vaccine.”</p><p>It wasn’t the first or last time Parton lent her voice and financial support to science. In 1994, she donated her song “You Gotta Be My Baby” to a charity album for HIV/AIDS research. In honor of her niece, a leukemia survivor, she <a href=\"https://www.mobihealthnews.com/news/dolly-parton-dies-80-leaves-legacy-beyond-music\" target=\"_blank\" rel=\"noopener\">gave</a> the Pediatric Cancer Program at Tennessee’s Monroe Carell Jr. Children’s hospital $1 million in 2017 and then another $1 million to study infectious diseases in 2022. Her trademark theme park, Dollywood, was also home to the largest non-releasable bald eagle sanctuary in the world. </p><p>But Parton’s greatest contribution might have been through her Imagination Library program. Inspired by her father, who couldn’t read, Parton started the initiative in 1995 to provide free books to kids from birth until age five. Since then, the Imagination LIbrary has expanded to five countries, mailing more than 330 million free books to date. </p><p>Beyond promoting childhood literacy, the effort has offered researchers a sort of natural experiment to <a href=\"https://www.tandfonline.com/doi/full/10.1080/02568543.2024.2322731\" target=\"_blank\" rel=\"noopener\">study</a> the effects of early reading. Kids participating in the program read more often and for longer than their peers, and were also better prepared for kindergarten. Parton said her father may have been <a href=\"https://www.bbc.com/news/articles/c24j39jqy2go\" target=\"_blank\" rel=\"noopener\">prouder</a> of the Imagination Library than the entirety of her career, and her family has requested <a href=\"https://donate.imaginationlibrary.com/\" target=\"_blank\" rel=\"noopener\">donations be made</a> there in lieu of flowers.</p><p>“If your actions create a legacy that inspires others to dream more, learn more, do more, and become more, then, you are an excellent leader,” Dolly Parton once <a href=\"https://archive.org/details/mostimportantthi0000unse_w7q6/page/n137/mode/2up?q=dolly\" target=\"_blank\" rel=\"noopener\">said</a>. </p><p>She lived her life accordingly. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Suzanne C. Grim / Shutterstock</em></p>"},{"title":"Tim Curry, star of The Rocky Horror Picture Show and Stephen King’s It, dies aged 80","source":"Hacker News Best","author":"@Andrew_Pulver","url":"https://www.theguardian.com/film/2026/aug/26/tim-curry-dies-rocky-horror-show-stephen-king-it-legend-film","category":"tech","categoryLabel":"Technology","wordCount":752,"readingTime":4,"content":"<p>Tim Curry, the versatile performer of screen and stage, who made his name as the flamboyant Dr Frank-N-Furter in The Rocky Horror Show, has died aged 80. <a href=\"https://variety.com/2026/film/obituaries-people-news/tim-curry-dead-rocky-horror-picture-show-1236843955/\" target=\"_blank\" rel=\"noopener\">Reports say</a> Curry died at his home in Los Angeles.</p><p>The actor’s manager confirmed to Variety that he died peacefully. No cause of death is known as yet.</p><p>Ironically, Curry’s best-known roles all required a considerable physical transformation, to the extent that he was unrecognisable in all of them. Frank-N-Furter, Rocky Horror’s deranged scientist, saw him daubed in garish makeup and wearing stockings and suspenders, for the stage show (which debuted in 1973) and the film adaptation (released in 1975). In the Ridley Scott-directed fantasy Legend (1985), he was equipped with giant horns and scarlet skin as the Lord of Darkness. And in 1990, Curry was transformed with full-face clown pancake to play Pennywise in the TV miniseries It, based on the <a href=\"https://www.theguardian.com/books/stephenking\" target=\"_blank\" rel=\"noopener\">Stephen King</a> novel.</p><p>Alongside these show-stopping incarnations, Curry enjoyed a successful parallel career in film, TV and theatre. Born in 1946, he earned a degree in drama and English from the University of Birmingham in 1968 and embarked on a stage career. His first significant role was in the original cast for the first West End production of the controversial musical Hair, in 1968 – where he met Richard O’Brien, who would go on to cast him in his own musical, The <a href=\"https://www.theguardian.com/culture/rocky-horror-show\" target=\"_blank\" rel=\"noopener\">Rocky Horror Show</a>. Curry went on to play Tristan Tzara in Tom Stoppard’s Travesties (taking over the role from John Hurt and Robert Powell), and Mozart in the Broadway transfer of Amadeus in 1980. Later highlights included King Arthur in the Broadway run of the Monty Python musical Spamalot.</p><p>Curry worked regularly in film, in roles including that of Robert Graves in Jerzy Skolimowski’s sinister The Shout, and later as Jeremy in the Ian McEwan-scripted political drama The Ploughman’s Lunch. Later, Curry found himself working largely in comedies – including Home Alone 2: Lost in New York, Muppet Treasure Island, Scary Movie 2, and McHale’s Navy – before providing voiceovers for numerous animated films, such as Garfield: A Tail of Two Kitties, A Turtle’s Tale: Sammy’s Adventures and Ribbit.</p><p>Curry was also a regular presence on TV for more than four decades, playing <a href=\"https://www.youtube.com/watch?v=4ZiJ7i-pu5I\" target=\"_blank\" rel=\"noopener\">William Shakespeare</a> in John Mortimer’s six-part biography of the playwright in 1978, Bill Sikes in the 1982 US TV adaptation of Oliver Twist, and the wizard Trymon in the adaptation of Terry Pratchett’s The Colour of Magic in 2008. He voiced a stream of animated series (Duckman, Sonic the Hedgehog, The Mask and Star Wars: The Clone Wars) and was cast in many guest roles in established series, including Psych, Poirot and Criminal Minds.</p><p>“I’ve had the opportunities,” he said to the <a href=\"https://www.theguardian.com/lifeandstyle/ng-interactive/2025/oct/14/risky-is-the-best-way-to-be-tim-curry-sexuality-surviving-stroke-50-years-stardom\" target=\"_blank\" rel=\"noopener\">Guardian in 2025</a>, “and I’m still showing up. You know? I think that’s what you have to do. You have to keep showing up.”</p><p>In 2012, Curry had a stroke while receiving a massage and received brain surgery. He was left with mobility issues and his short-term memory was also affected. “It was an odd thing, because my father had a stroke and died very soon afterwards,” he said. “I knew I had to force myself to relax and just take the opportunity to float a little.”</p><p>In 2025, he released his memoir Vagabond.</p><p>“I’m very aware that I’m lucky,” Curry said last year. “I’m astonished actually at how ambitious I’ve been. I didn’t think of myself as ambitious at all.”</p><p>Luke Evans, who played the role of Dr Frank-N-Furter in the recent Broadway production of The Rocky Horror Show, paid tribute on <a href=\"https://www.instagram.com/p/DcgoohckRw8/?img_index=1\" target=\"_blank\" rel=\"noopener\">Instagram</a>. The actor called him “a force, a bright fierce flame” and “an inspiration”. He added: “There will only be one Tim Curry.”</p><p>Rocky Horror Picture Show co-star Susan Sarandon <a href=\"https://www.instagram.com/p/DchDQAIFA0z/\" target=\"_blank\" rel=\"noopener\">called</a> him a “funny sexy original” in an online post. “Even wheelchair bound he continued to be so sweet and generous with his fans,” she wrote. “Thank you Tim for meaning so much to so many people.”</p><p>Carol Burnett, who starred with Curry in Annie, also paid tribute <a href=\"https://www.instagram.com/reel/DcgnUHrICPR/\" target=\"_blank\" rel=\"noopener\">online</a>. “Nobody could play lovable villains better than he could,” she wrote. “He was a dear friend. I was blessed to know him.”</p><p>Curry’s Clue co-star Michael McKean <a href=\"https://x.com/MJMcKean/status/2092642223091524028\" target=\"_blank\" rel=\"noopener\">shared</a> on X: “My last conversation with Tim Curry was about life and love and laughter. The grim physical state he found himself in has now ended, a blessing. Our blessing was that we had Tim Curry in our lives. RIP, my friend.”</p>"},{"title":"High School's Ordering Parents to Remove Pink \"XX\" Protest Wristbands at Girls' Soccer Game Likely Violated First Amendment","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/26/high-schools-ordering-parents-to-remove-pink-xx-protest-wristbands-at-girls-soccer-game-likely-violated-first-amendment/","category":"law","categoryLabel":"Law","wordCount":1306,"readingTime":7,"content":"<p>Some excerpts from the longish opinion today in <em><a href=\"https://www.ca1.uscourts.gov/sites/ca1/files/opnfiles/25-1442P-01A.pdf\" target=\"_blank\" rel=\"noopener\">Fellers v. Kelley</a></em>, written by First Circuit Judge Sandra Lynch, joined by Judge Jeffrey and Howard:</p><p>The district court analyzed the school playing fields and adjacent parking lot, as appellants requested, under the mode of First Amendment law applicable to limited public fora as to impermissible viewpoint discrimination…. [The] appellee school district argues that this case must be analyzed more in the mode of <em>Tinker</em> v. <em>Des Moines</em> <em>Independent Community School District</em> (1969) … [and other cases that] recognize the particular interests inherent in the public elementary and high school settings, and the necessary discretion given to public school administrators in the difficult job of running public schools….</p> <p>Neither of those two different classic modes of First Amendment analysis, urged on by these opposing parties, is a perfect fit for this public high school speech case, and we note that the Supreme Court has not addressed this precise question. We need not and do not reach the complex question of which (or whether) either of these alternate modes is the appropriate First Amendment type of analytical model for the facts of record here. We conclude that on these facts the differences in analysis would not affect the outcome here….</p> <p>The school's legitimate interest in regulating certain kinds of speech on the playing field sidelines … is not demonstrated by the evidence in this record. There is no evidence that appellants' protest caused a material disruption [which would be relevant under <em>Tinker</em>]. There was no disruption until school officials chose to intervene, after which the referee suspended the game for approximately fifteen minutes and the school officials chose to impose restrictions on appellants' speech and impose sanctions. The appellants did not stage any pregame demonstrations; did not march, shout, chant, or otherwise disrupt the game; and did not confront Tirrell or any other player. Instead, they waited until halftime before donning the \"XX\" wristbands in a passive, silent gesture of protest. There is also no evidence of harassment, given there is no evidence in the record that any player actually saw the wristbands.</p> <p>The lack of any evidence demonstrating harassment also defeats the school district's argument that it had an affirmative duty under Title IX to protect students from the speech in which appellants engaged…. While it is true that appellants chose to protest at the September 17 game <em>because of</em> Tirrell being a player, the record does not contain evidence of appellants engaging in harassment before or during the game. To the contrary, appellants did not shout, chant, make threats, or aggressively gesture at Tirrell to communicate their views against her participation. Nor is there evidence that Tirrell or any other player even saw the wristbands or \"subjectively perceived the environment to be hostile or abusive.\"</p> <p>Principal Fisk did note the challenges that transgender students face generally. But Fisk did not ever explain how appellants' display of the \"XX\" symbol constituted sufficiently severe or pervasive conduct to qualify as harassment under Title IX. And to the extent the district court concluded that the silent wearing of \"XX\" wristbands on the sidelines of a school soccer field, without more, always amounts to harassing speech, we disagree.</p> <p>The school district responds that it may make \"predictive judgment[s]\" to proactively prohibit conduct that it believes will eventually lead to an actionable Title IX claim….. We agree with the general proposition. But the argument fails on the facts of this record…. We need not decide in this appeal whether and under what circumstances passive speech, on other facts, consisting of displaying the \"XX\" symbol on school property during school events could be reasonably thought to be harassing. But appellants' silent display of the \"XX\" symbol at the September 17 game fell short of harassment and disruption, and we conclude that the district court erred in holding that the school's interest in prevention of harassment justified the prohibition.</p> <p>While it is a closer issue, we conclude that the school district likely was not justified in sanctioning the appellants for their passive speech based on its concerns derived from the earlier exchanges with the appellants and other parents. None of appellants' reported discussions, including their possible different methods of protest reported to Bow High School officials by other parents, led to any attempt to \"heckle and intimidate\" Tirrell. And that was evident both before and throughout the game.</p> <p>It is true that Fellers initially attempted to convince his daughter to get the Bow High School players to wear the wristbands, but his daughter informed him that \"she could not get full support from the team and was afraid that it would divide them.\" Fellers's Facebook post made the night before the game encouraged spectators \"to protect the integrity and safety of female athletics\" and \"come out to support our XX Lady Falcons and show your solidarity with our girls' team.\" But the record shows only that the appellants and perhaps others of similar views engaged in a passive protest and only started the protest at halftime. While the school district may make predictive judgments about whether disruption may occur and \"need not be certain of its forecast,\" it cannot use those projections to immediately suppress a passive, silent protest, that did not impair any of the legitimate school administration interests recognized by the Supreme Court.</p> <p>This brings us to the school officials' other stated reasons for sanctioning appellants. Superintendent Kelley stated that the \"XX\" symbol conveyed an \"exclusionary\" message about gender. Principal Fisk, who ordered appellants to remove the wristbands, described the symbol both as \"hateful\" and as \"anti-trans.\" As to these justifications for the sanctions imposed, the record evidence demonstrates the likelihood that the school district imposed sanctions on the appellants' wearing of the wristbands because it disagreed with the protest message conveyed….</p> <p>Although the leading Supreme Court case on viewpoint discrimination in academic limited public fora, involved colleges and not high schools, and involved a limited public forum, both significant differences, <em>Rosenberger</em>'s anguage about viewpoint discrimination is pertinent. \"The government must abstain from regulating speech when the specific motivating ideology or the opinion or perspective of the speaker is the rationale for the restriction.\"</p> <p>The characteristics of the school as a place of learning reinforce that administrators cannot favor one side of a debate involving parental speech on an issue of prominent public concern, and which, in those parents' views, concerned the safety of their children. As the Supreme Court stated in a case involving a high school football game, \"learning how to tolerate diverse expressive activities has always been 'part of learning how to live in a pluralistic society.'\"</p> <p>Judge Julie Rikelman concurred in the judgment, reasoning that <em>Tinker </em>might not prohibit viewpoint-discriminatory speech restrictions, but that in this case the school district had accepted the viewpoint neutrality requirement:</p> <p>The school district accepted that the limited public forum framework applied to the facts here and conceded repeatedly, both in its brief and at oral argument, that it could restrict speech at the September 17 soccer game only for viewpoint neutral reasons…. Although it did urge us to conduct our First Amendment analysis with the principles of <em>Tinker</em> in mind, it did so only in arguing that its actions were reasonable and thus satisfied the [reasonableness] prong of the limited public forum test….</p> <p>With the school district's concession in mind, I agree that the record lacks evidence of actionable harassment or material disruption from the plaintiffs' speech at the September 17 soccer game. The record also demonstrates that school officials likely restricted the XX symbol because they viewed it as \"exclusionary\" and demeaning to transgender students. That amounts to viewpoint discrimination under relevant precedent.</p><p>Del Kolde, Brett Nolan, and Nathan Ristuccia (Institute for Free Speech) and Richard Lehmann (Lehmann Major List, PLLC) represent plaintiffs. were on brief, for appellants.</p>"}];
