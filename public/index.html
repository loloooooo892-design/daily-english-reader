<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>
</head>
<body>
<main class="container">
  <div class="meta" id="meta">
    <span class="category-tag" id="category"></span>
    <span id="source"></span>
    <span id="author-block"></span>
    <span class="sep">·</span>
    <span id="word-count"></span>
    <span class="sep">·</span>
    <span id="reading-time"></span>
  </div>

  <h1 id="title"></h1>

  

  <div class="swap-bar" id="swap-bar" style="display:none">
    <div class="swap-actions">
      <button class="swap-btn" id="skip-btn" onclick="skipArticle()">Skip</button>
      <button class="swap-btn swap-btn-next" id="swap-btn" onclick="nextArticle()">Next article →</button>
    </div>
    <span class="swap-counter" id="swap-counter"></span>
  </div>

  <article class="article-body" id="article-body"></article>

  <footer class="footer">
    <span>Sunday, November 8, 2026</span>
    <a id="original-link" href="#" target="_blank" rel="noopener">Read original ↗</a>
  </footer>

  <div class="archive-link">
    <a href="archive.html">Archive</a>
  </div>
</main>

<script>
var articles = [{"title":"He Trolls AI Labs for a Living. Now They All Want to Work With Him","source":"Wired","author":"@wired","url":"https://www.wired.com/story/wired-world-fair-2026-evan-ratliff-and-husk/","category":"tech","categoryLabel":"Technology","wordCount":551,"readingTime":3,"content":"<p>OpenAI, Anthropic, and xAI have all asked creator Matt Husk to collaborate following the viral success of his videos trolling AI models.</p><p>During the WIRED World Fair on Wednesday, Husk told the crowd “all the big AI companies” have inquired about working with him, including Elon Musk’s xAI, which Husk claimed offered a Tesla for a week if he made videos exclusively for the firm.</p><p>The comedian has gained some 2 million followers combined across Instagram, TikTok, and YouTube, as well as a deal with the talent agency Unicorn, through videoing himself making deadpan requests to <a href=\"https://www.wired.com/tag/chatgpt/\" target=\"_blank\" rel=\"noopener\">ChatGPT’s</a> voice model—asking it to count to 100, or to beatbox, for example. His <a href=\"https://www.wired.com/story/comedians-making-fun-of-ai/\" target=\"_blank\" rel=\"noopener\">viral</a> videos have exposed the weaknesses of <a href=\"https://www.wired.com/tag/openai/\" target=\"_blank\" rel=\"noopener\">OpenAI</a>’s LLM, which comically botches the tasks and swings between sycophancy and gaslighting Husk, and earned him the <a href=\"https://www.fastcompany.com/91527208/husk-viral-influencer-breaks-chatgpt-brain-sam-altman-worst-nightmare\" target=\"_blank\" rel=\"noopener\">title</a> of “Sam Altman’s worst nightmare.”</p><p>In April, Altman, nodding and smiling, admitted on tech podcast <em>Mostly Human</em> that the model’s inability to set an accurate timer was a “known issue” and would be for another year, after being shown a Husk video in which he asked ChatGPT to time him running a mile and found that it measured a span of a few seconds as lasting “around 10 minutes.” When Husk says “I swear I was faster than that,” it replies with a sympathetic tone: “It can feel faster in the moment.”</p><p>During his interview at WIRED World Fair with <em>Shell Game</em> podcast host Evan Ratliff, Husk said OpenAI offered him early access to a patch for the timer issue if he shared his account. He declined. The company had previously emailed Husk asking to collaborate on a video. “They offered me the smallest amount,” he said. “I was just like, ‘No.’” The firm then offered to send him gifts and asked for his home address; Again, Husk declined.</p><p>OpenAI, Anthropic, and xAI (which was recently rolled into SpaceX to create SpaceXAI and then SpaceXSI after President Trump renamed artificial intelligence “super intelligence”) did not respond to requests for comment.</p><p>AI labs are increasingly pitching their products as capable of handling everyday chores. On Tuesday, OpenAI <a href=\"https://openai.com/index/lifeval/\" target=\"_blank\" rel=\"noopener\">announced</a> its model had scored “very highly” on a benchmark built to model its ability to help people in their personal lives, such as meal prep and enrolling a child in kindergarten. “The way they promote it is like ‘It can do anything,’” Husk said, “so I’ll put it to the test—see if it can order bread for me.” In one of his videos, Husk asks AI to help him negotiate some bread on Craigslist down from a starting price of $10,000 to $5. The model accepts a price of $400.</p><p>Husk began publicly trolling chatbots about a year ago. He told Ratliff, a WIRED contributor, at the time he liked to make TikToks asking people questions, but there weren’t many around while he was working his landscaping job, and he ran out of ideas. So he recorded himself telling ChatGPT a nuclear bomb had gone off. The model’s response, “I’m rooting for you,” and advice to take shelter “was not helpful at all,” he said. “I thought it was a pretty bad video,” he told Ratliff, “and the next morning I had 100,00 views, and I was like, ‘Let’s tell it I got hit by a train.’”</p>"},{"title":"Three Novels that Stuck with Chad Harbach","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/three-novels-that-stuck-with-chad-harbach","category":"fun","categoryLabel":"Interesting Reads","wordCount":885,"readingTime":5,"content":"<p><strong>It’s been a crowded year</strong> for keenly anticipated novels, with new works from known quantities such as Marlon James, Rachel Cusk, and Hernan Diaz, to name just a few. But, by my lights, the one that has inspired the keenest feelings of them all is Chad Harbach’s “<a href=\"https://cna.st/affiliate-link/7ZJg7i5XH42aCEuzo8mhSSK1AQyqjUqaNR63K4nQE1ruxm8Gdoen1ymc788ZG4HMyXdq5FbVDxe8Yjwhnjdu54rB5Y2TcpurQWV5nuYJa63bkoT5dacTKxUFdMDucoZZvi9nzccEwihJRHcLs4Ra6Tbm8mJFFwbn3FErkdbXwAnbSK9Wk6CrDxSdvwCGesJyXSk7TvzDMfGyM9iPLPrUGBKYczPX8Reog8KeYX5Xg3jFnviFgMV3S1L3JX6HWWm3dit4X3V5FDiTrR21kQxzcg3UiR5ECSbW3cQ5ruYMr2ENjhBg5y2kTWqAjaPHJcTQH8bNfhHKFrDPqxAjZApZiuGYKSV9FvhWyh6W7RraQpXx3ryyBkz1adwa17XhynNa6SeT799PgTnrjkVWhjV\" target=\"_blank\" rel=\"noopener\"><em>The Brightness</em></a>.” It’s the sequel to “<a href=\"https://cna.st/affiliate-link/5RXFQ35D2cGEc9STqLAjvscDJAwemwBrJvzLi7wDBi8jXU9YZ87rJBrwf8kP4uovs7NwuZuMBU7aS4J5QagRUWpFN8qjvg62t9YBEeFAcDCPTJtLWJtzkg8bNujUcvf1LE2NAgKuSN2gjXebUCubHnmYxzopF3dQ6abuzrL7aWeUuTQWuiAvKzgcxYK68Psuh2LfmeKfk91N7U5mYJcPDUU5twjZXzLVmG9rPQFYz3fyxjCQ4f3nYAHAVDs6W2Cia9DuC74cddYt4BJYtcNgGxMLoVNsxJVUkJxFuYzXaBQZHpUwCvC7NCvfziy1u7aVkBQuZmDazgA3GaygprKKBSXipWrLQ9ipbP2pJuev5BDMrnbj911ANuBLxgxXvn8PRukF46aDP3wdXeF\" target=\"_blank\" rel=\"noopener\"><em>The Art of Fielding</em></a>,” which was published in 2011 to critical acclaim and commercial triumph, and it takes place in the same setting—a liberal-arts college in Wisconsin—but treats readers to some new characters in a new era (complete with a Lana Del Rey cameo). I adored the <a href=\"https://www.nplusonemag.com/issue-54/fiction-drama/the-parties/\" target=\"_blank\" rel=\"noopener\"><em>excerpt</em></a> I read in <em>n+1</em>, so I decided to call Harbach to ask him a few questions about the novel, its predecessor, and his influences.</p><p><em>Our conversation has been edited and condensed.</em></p><p><strong>“The Art of Fielding” entered my consciousness in 2016, when I was a senior in college, and started dating a guy who loved it. What do you think a love for that book tells you about a person?</strong></p><p>What did it say about this man? I mean, maybe he loved baseball. Maybe he loves love. Maybe he has a sensitive soul.</p><p>One thing that was amazing about the many different affectionate responses I received is the range of what readers responded to—some of which I had not even realized until it was reflected back to me. I remember one nice review of the book that basically said, You know what this book primarily is? It is a defense of the liberal-arts education. I had never thought of that, but it’s probably true. The utopian ideal of college is that it’s a place where you can really spend some time dabbling and figuring out who you are. That search for the self is something that I’m very interested in in my novel writing, and college is a fit place for it.</p><p><strong>What sorts of books were you reading when you were working on “The Brightness”? Were there particular novels that really dwelled in your consciousness as you were writing?</strong></p><p>One writer who is mentioned in the book is Edith Wharton—“<a href=\"https://cna.st/affiliate-link/217rUsmTHgFnDwvoQdy8ThvHqJCvsWVjte9ux5k6UoUaeiVfsKqDyukwXPbkWtPQz7tC5fGV8ovbmCAm3dBHse7hPZzNneK4tNk7TnvvUZXrN6cqPeiDLS938jChkMju5QbZsRzLwY9x7ZYZafjzYacv3wG8DuJinyQBw7H5qicmKy5frPjwL9b9SHZ9kF1UyCBEFg9QgW7ZFUPgYx4pQ5RifyM95nYxTKH8ENCV1kqj9eKjVDiMPkWhBns87v3LSHYmJWY6oNBvE9sk9nfWVhitH1xve2DWiMJ2ocdTGjrs8CiozGkH8rAeAv1yZGrJZgDXju8d5YK96WTUABYF5UZTteoZZaGuvVYJfn6T5aoGaJNx5jGSYGts7tXBtuCHjLDQDknhdXWzuu\" target=\"_blank\" rel=\"noopener\"><em>The House of Mirth</em></a>” comes up repeatedly. But I actually think the novel of hers that was most in my mind when I was writing was “<a href=\"https://cna.st/affiliate-link/AipVsHgLTh89Za8tVpwoF2fDgeeX96b4yBJUNSg2vj7bPqHfTXMkfBbxHMXsnK7Uv6subCXdkGxQNN1jL1Yf3kJCizuX7xQAYVBV29tLy5oteLSPcJxpkzLCkLLDkEYY4SSmMsJVLmjDooGYpJwFE5B5KTXEE22HgpgmP5WtfWfg22M7h8EK3gw1Z8eUwDpnmQWUEQZDA2mKYp1RzPaJzVFz8TzKjx6Y93j9rhjCa49gnqga82T82JHfJLmmvfo9FRnQHUMRi8hcLvSo6bmaAYLV9iXFzQUeP33jMqraZ3qyeohsKpYjLf6SX59gT1CD3TeU6gFN1MRc5pQTAntjTH9CZRftoAB8A1xyEBFyGiuECfmmPJLZjzY2T2yh1R2i5vCcdKD1sn9PtPWTjAGkwTd\" target=\"_blank\" rel=\"noopener\"><em>The Custom of the Country</em></a>.”</p><p>Jane Austen’s “<a href=\"https://cna.st/affiliate-link/cpMzueKu8Ccfd7B6sLptxjqJcVA8ZhjkyuFJKYf3AG1m42Y4D32RHMbRobwYNQt6k1WXMZxSH2FwNHMwaNNf5ftxZifaGD2ykpiozBPE4ptRS6LtudqLowu6tJyj8D81rXefTc2BTNoiTsQHeSpHTciNxkhC6FRnzgTYnZdme16DyPYUa1ZYHeHdYULCfuemDuXJoroATLURYihN9b9sBzX9ncH3xN6owSA575r9ee9eEqd44QHL6yMDpWQcknT761zUTMwE7qWgFiXcbdZLnorYdKzFkuZ6rQ21X1NvZVbSh1C79Wvfah2fvggveFEmhH6D79MV9BieEyjqs6EtHxnm5PQiHRrQjKcKmpYpVHpKNQyGpYmqLSMZZR\" target=\"_blank\" rel=\"noopener\"><em>Emma</em></a>” also influenced me a great deal. The setup of that book is that Emma is so brilliant and so charismatic, but, also, just wrong about everything. She’s well-meaning, but her meddling is shaped by the fact that she’s deluded about many things. I think a bit of that mismatch really speaks to some of the events that happen in my novel.</p><p>And then, the third novel would be Henry James’s incredible “<a href=\"https://cna.st/affiliate-link/7ZJg7i5XH42aCEuzo8mhSSK1AQyqjUqaNR63K4nQE1ruxm8Gdoen1ymc788ZG4HMyXdq5FbVDxe8Yjwhnjdu55rBLAP6KMgK6V2hT8PYDSGfXm7dkRqi5GqQGA1W2ftR8Zg9TqtjiAnjJ9pegHmDwLMpaBvFwubbEV1pednUKSUZshKGDdYDXLAV1cDYJKph7PdQeh72fAnjawXrNpYGo7KD5oknWr3gAjVFbUgmg9tqvEQgCiE3RvHJtjLyQaQjHAZrYaFWCg6WRAeyGZ6eRNfvtzC8mmHn1uCuXBTum8vGdaBrKWWXuYmvVcXrGZho8n7DoboXZihEvANtFLVPBDPYKC8P4rF7pWaUsom2ZkHnMg28w9B4RYFq9bkvghKcDLciySZLLYGk1USMjR1\" target=\"_blank\" rel=\"noopener\"><em>The Portrait of a Lady</em></a>.” Which, of course, is about a young woman who has this great liberty and wide-open future before her—a grand vision of what may happen in her life—but for whom things close down in a really chilling way.</p><p><strong>If a person who loved “The Brightness” has already read all those, what should she read next?</strong></p><p>“<a href=\"https://cna.st/affiliate-link/JGMSvp8QkUXHLEFzvUJF6xcvW91FZu1pjx7mtCdk3SKEdTUdUvSxU9f864NxFF1uC7vNCKeQgbkYbHYn7W2NtS9yavRFVaCm2uZRyw8mvXUZHkkB3eFGwrJgzUbNgEDfEyxQ9QdRBxSQfytVTsEMVbie1eGNW2RBRGs8xX4yo7GMsVVdS6otmCmHzjwHwXMXegMNfqXSzriynxFuBZ1xi6veP5NVF8bV8bUDq3dCCFSoJKHPU2ZK8656VNPKWthMxz62n3v7b55nxS63EvyaubGMxBt8tzLqq2BFfsfW1SR2WKgKiDz8BjFnnUP5MS3cQCv89JgitHaXdDvokUEJUTptQ2PRihAxJcPqHt4SjA5xBUb94F7xVy4ercfkotZ1hktUsFFyaHGLMJ33fURSN7DQLcLCq6KS2ZRRAJzasQAtgeuiwbA39hH9R\" target=\"_blank\" rel=\"noopener\"><em>Slow Days, Fast Company</em></a>,” by Eve Babitz. It’s just so magnificent. Of course, the life of Eve Babitz is enough to make anyone feel just hopelessly square. But there is also such lyrical magic in that book. I reread passages and am astounded by what she was able to do.</p><p><strong>I have a final, hard-hitting question for you. Parties are obviously an important part of college, or college as it’s imagined. They’re also integral to the plot of “The Brightness.” You recently had a party at the offices of the magazine you co-founded, <em>n+1</em>. How was it?</strong></p><p>It was incredibly fun. I’ve been away from New York so much in the past couple of years, and it was wonderful to celebrate with my friends here who I don’t see often enough these days. Some of my absolute favorite writers were there, like <a href=\"https://www.newyorker.com/contributors/sam-lipsyte\" target=\"_blank\" rel=\"noopener\"><em>Sam Lipsyte</em></a> and <a href=\"https://www.newyorker.com/contributors/rebecca-curtis\" target=\"_blank\" rel=\"noopener\"><em>Rebecca Curtis</em></a>. All that made it really special. Also, we were projecting the Brewers game, and they were playing in the World Series—something that hadn’t happened since I was six years old.</p><p><strong>For more:</strong> read <a href=\"https://www.newyorker.com/magazine/2026/10/26/the-brightness-chad-harbach-book-review\" target=\"_blank\" rel=\"noopener\"><em>B. D. McClay’s review of “The Brightness.”</em></a></p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Coming soon:</strong></p><ul><li>James Gleick’s new book, “<a href=\"https://cna.st/affiliate-link/4GP5W8kUDRgsVJzLPm57J98MVUbjPcfJMyDph2shhqbnYdUCK76dE9twFdou8EJk2RdrQ5fF2oasJTaumcSKjBWGXREGXtnVLgQh1wQMvGMHDhqRYxjy5byYXujQxmutQpet7Tjv5Z7Kyhp988JrGtBtTiALdquonaDSXhSYUx1TQRvZuJiWLaJB6GW7mhGTS7ADy72uApsjqJzM34uPyt8ceRi4zWHZEnNA62wvPjTbv4i7YyvkMSDKZfvSdhWGgJhA4SCqtwwyKxrtMTbLfYkk2BqTqDb1oSS8vstypprNJiBn97iiSv43BrKSBn1yMm2h4tv35doYW7gPsQxED9nHkwD5yMHQtXGR4GVnh5GUsfigQisSgM4xdJK3CfpZGAPUpft3ozWsXNMfgRbnnVVNJT\" target=\"_blank\" rel=\"noopener\"><em>The Telephone</em></a>,” publishing on November 10th, complicates the history of Alexander Graham Bell’s world-changing machine. Read <a href=\"https://www.newyorker.com/magazine/2026/11/09/the-telephone-james-gleick-book-review\" target=\"_blank\" rel=\"noopener\"><em>Cal Revely-Calder’s review</em></a>. (Or read Sophie Haigney’s <a href=\"https://www.newyorker.com/books/page-turner/an-elegy-for-the-landline-in-literature\" target=\"_blank\" rel=\"noopener\"><em>elegy for the landline in literature</em></a>.)</li></ul><ul><li><p>“<a href=\"https://cna.st/affiliate-link/8rb35zSiDv26Po7z75bUmeByPEpiCm9hLdAGXRHhSHtZijhTPLdiHUSMCYvMkJStRzK8qNArpsLvRGqVsvi7UVFbi9AEvuaQzbt6xjf1BXBkimnsWsFRqtefRoTUQD7DXbAYYXfQ82H1trCndz5TjeLodUNs1CJ5rfBPrSJjiprUM5N23cazwCnCVjfhpbMHcBqkUJdUEUKmZZnkPAj7TNetygvMNZhDEoKuybNV7hcaFpjUAEKbVr3um4riEzLzNaR867MooLpBDZHnAd6Xp2i2GfztZvm8CSgaWqaLQMCvgi33as6SRVczWCZ32bYVYC9vb3CBTbnBWUF1HJiVqQHu96yatTynj9NCcSw24ydPGkDraYSPhLQfnqZkgX9cMJFArddvQJbnnHEXFCZ1FTd2KjztVrWKWwiTYb6fnsKX5zTFm\" target=\"_blank\" rel=\"noopener\"><em>The Absent Woman: The Genius of Janet Malcolm</em></a>,” Eve Sneider’s biography of the <em>New Yorker</em> journalist, is also out on the 10th.</p></li><li><p>And, in other news of icons, the second installment of <a href=\"https://cna.st/affiliate-link/3Cjw7rzrGZesRbhJZMqDHmnMzvPYkXGRTmvoXgoTGLxsPPiqb6yMmSxx7ssViz7uYWsxR4X3tVY8ZUsTouEWvBiWN94EXGic4ZXvyj6ogDBzHCbeSiWKcJDDfsGEke8bSwzg5QHHyegbciofexrZDoiW5zNLNmwAqjA2nB1zVpWF8XwFfMwPsV1Nb6cC1mMA4qCwcELUHqVbUxuurHxTJ7rzy63aAtCorxhxcxorvTw3RyqMLyDxhjYeTYBdAs3AM368ohiomN6xP9MTKDsqiNuKgMZmH4dBeRDLaEJTsGy9j8P3Dv8f7kGXh2khC3MF83zCpA8cMohgKMNoS1Er6oN9R5naRpz4r967Lq3fJ5kLsSDdawZGnuYyPgvLNnBmJHqYSkLxHUDqnUqjD4gApw\" target=\"_blank\" rel=\"noopener\"><em>Cher’s memoirs</em></a> is coming out on the 17th.</p></li><li><p>The new TV series “The Good Daughter,” starring Meghann Fahy and Rose Byrne, is based on <a href=\"https://cna.st/affiliate-link/EAi7madmZTTZPQyHEMsdQmhWyTifBJqgo2ZqjJvMM3dAuSyqZMtsxTGXSxuTFpDggAnZKe3JBBLCpqtDNnqEHZmFLyuLUbD5jKwhx1QF1wUyfVidhg9BEQW2Ty91Ea33EbfSUyf8HLq99bH2sCkKfv2nz5v4eXqLnYJAjY84EHUnsJY3ggmxgfjdLQreEW664zAtzxdoVaFHiXHq6aoQgWKbBLQg21MrVfSnKx87qgaT9E2nSeujJCemDBTvsVLJZ1GAAn6NfppAHgMFRSTmvUM4HJUATQYdeEyc9ZefnEZgDYLi88k9vWJqJ7EJrd6bsHhmyW7D6xEPFMiuD1Wcvm7pjTNAnhuZsbFBnTUVZiacbGHGovkJ61yC8k75seWxgPAcVJmVYpwy\" target=\"_blank\" rel=\"noopener\"><em>the psychological thriller by Karin Slaughter</em></a> and will be available to stream on Peacock on the 12th.</p></li></ul><p><strong>P.S. Daisy Edgar-Jones,</strong> who has acted in many a literary adaptation, <a href=\"https://open.spotify.com/episode/5gze26FcGUpisgvuZC7btF\" target=\"_blank\" rel=\"noopener\"><em>recently shared</em></a> that Jon McGregor’s “<a href=\"https://cna.st/affiliate-link/oxmzN5BRSFNAW5sbbepL3MLCCYFffkx9YLBRQUYC2H6eXaKBDWb6h7XRYcNiG7FK5zvZ5RGxSUgAmy5GYSc2mxP8oA8i7o6CPQbjXwrWWPmeFVw1rhS2Tr9asEyyXJubgTmMLWwC7vjiEchLcyKgWeeEjAiBCNdL4KVBdsWswHS1WYQXtfGXbR5wHxqesgPnRJwhSDUianukg3bCmWD9nuYVxPjcMco9QhdNwqgaaCKo3Qk3GS76vApg76Ki4rXN1WzwptbEsSnnfvJjvJyLRQgb741Dx3pTytA2qzSnyfPPJuEiZ4Q5dUyW9JCWAYDRehJNMzNXBydR5fyW9RRMLBaN9CUhda2tNW4sGAm9uY1HHxTPb3BxJobZ6CDDzsBC9sto8E1kmFgeYh9QRLK7awHK5cPaVfAFntCVvWs\" target=\"_blank\" rel=\"noopener\"><em>If Nobody Speaks of Remarkable Things</em></a>” is one of her favorite books.</p>"},{"title":"Fifth Circuit on Pseudonymity of Libel Defendant (Who Claims She Was Sexually Assaulted)","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/04/fifth-circuit-on-pseudonymity-of-libel-defendant-who-claims-she-was-sexually-assaulted/","category":"law","categoryLabel":"Law","wordCount":821,"readingTime":5,"content":"<p>From <a href=\"https://reason.com/wp-content/uploads/2026/11/Document.pdf\" target=\"_blank\" rel=\"noopener\"><em>Doe v. Roe</em></a>, decided today by Fifth Circuit Judges Jennifer Walker Elrod, Carolyn Dineen King, and Carl Stewart:</p>\n<blockquote><p>After receiving notice of Jane Roe's impending California lawsuit involving allegations of sexual assault and sexual harassment, John Doe sued Roe in the Southern District of Mississippi, alleging that Roe was attempting to extort and defame him. Roe moved to proceed pseudonymously in the Mississippi lawsuit. The district court denied her permission to do so. Roe appeals that decision, raising several concerns with the district court's analysis. Because we agree with some of Roe's arguments, we vacate and remand for the district court to reconsider whether Roe should be allowed to proceed pseudonymously….</p>\n<p>Whenever a party seeks pseudonymity, courts must determine whether \"the normal practice of disclosing the parties' identities yields to a policy of protecting privacy in a very private matter.\" … The district court concluded that Roe was not entitled to pseudonymity … [in part because of] Roe's status as a defendant and waiver…. [But] Roe's defendant status is entitled to no weight in determining the appropriateness of pseudonymity…. A defendant is no less deserving of pseudonymity than a plaintiff simply by virtue of her being haled into court first….</p>\n<p>Roe argues that allegations of sexual assault involve matters of the utmost intimacy [and can thus justify pseudonymity]. We agree. There is no doubt that requiring alleged rape and sexual assault victims to proceed \"under their real identities would require them to disclose information of the utmost intimacy.\" It is no surprise, then, that numerous courts have allowed alleged victims of sexual misconduct to proceed under a pseudonym, \"including when they are defendants being sued for libel and related torts.\"</p></blockquote>\n<blockquote><p>Relatedly, Roe argues that she took affirmative steps to maintain her anonymity, that her identity is not public, and that she has consistently demonstrated a strong desire for confidentiality. She raises these points because the district court found that her privacy interest … was \"weakened\" because the \"cat\" was already \"out of the bag\" with respect to her identity. In so finding, the district court relied on the great detail with which Roe pleaded her California complaint, Doe's public filing of an amended complaint in this case with Roe's real name, Doe's presentation of Roe's real name in open court in this case, and Roe's inadvertent filing of documents with her name in the California case.</p>\n<p>We agree with Roe. To start, we are not persuaded that the proverbial cat is out of the bag here. True, publicly available information cannot be obscured by courts. However, that internet sleuths might speculate that Roe is a particular person because her California complaint \"lines up with [her] public profile\" is not the same as a public broadcasting of Roe's certain identity. As to the fact that Roe's name was a matter of public record for short periods, that was either because of Doe's actions (which Roe objected to), or Roe's inadvertent disclosures which counsel corrected and constituted no waiver (which we address below)….</p>\n<p>Last, Roe argues that she did not waive her right to proceed anonymously. Again, we agree. Roe never waived her ability to request pseudonymity because her conduct does not constitute an \"intentional relinquishment\" of that position. Roe's opposition to Doe's motion to proceed pseudonymously waived nothing because Roe's position was that <em>she </em>should be allowed to proceed pseudonymously while <em>he </em>should not be. And any confusion about Roe's position based on the precise language in her opposition brief was clarified by her own subsequent motions seeking to seal or redact Doe's amended complaint (which used Roe's real name) and to proceed pseudonymously.</p>\n<p>Further, Doe's use of Roe's real name in open court did not constitute waiver on Roe's behalf because, at the time, Doe had already publicly named Roe in his amended complaint, Roe had a pending motion seeking to seal or redact that amended complaint naming her, and Roe objected to the use of her name at the hearing (even if not as fast as a prudent attorney likely should have). Finally, we are not convinced that Roe's inadvertent disclosures of her real name in the California case and on this appeal constitute waiver. The disclosures were unintentional, were made in portions of larger filings, and Roe took steps to correct the errors once becoming aware of them, resulting in the sealing and refiling of the documents. These facts do not demonstrate that Roe intentionally relinquished her request to proceed pseudonymously….</p>\n<p>In light of the clarifications provided in this opinion, we find that it is appropriate to allow the district court to reconsider whether Roe should be permitted to proceed under a pseudonym in this case. {We acknowledge Doe's argument that allowing Roe to proceed under a pseudonym would be prejudicial to him. We think that argument is best left for the district court to address in the first instance on remand.}</p></blockquote>\n<p>Daniel Altaras (Wigdor) represents Roe.</p>"},{"title":"What we've been playing - \"Sniffing out the warehouses on Prawn Island\"","source":"Eurogamer","author":"@eurogamer","url":"https://www.eurogamer.net/what-weve-been-playing-vice-city-zelda-world-of-warcraft-forever","category":"gaming","categoryLabel":"Gaming","wordCount":1140,"readingTime":6,"content":"<p>A few of the things that have us hooked this week.</p>\n    \n  \n  \n  \n\n            <h2>7th November</h2>\n<p>Well, hello! I am once again wearing the Bertie hat in your usual host's absence, so joyous welcomes to our regular feature in which we talk about what we've been playing in recent times. This week, Marie has been revisiting Zelda - although perhaps not the one you might expect - while Dom is rediscovering Vice City of the 80s. Kelsey is playing some very weird cards, Connor is back in WoW - possibly forever - and I'm equally smitten with a different RPG.</p>\n<p>But enough about us, what about you? What have <em>you</em> been playing this week? Do tell all! And don't forget we have <a href=\"https://www.eurogamer.net/topics/what-weve-been-playing\" target=\"_blank\" rel=\"noopener\">an entire archive of previous What We've Been Playings</a> for your leisurely perusal, just in case you forgot what you were playing a year or a month or a week ago. Bye!</p>\n<h2>Inscryption, Nintendo Switch 2</h2>\n\n<p>Once again, I am finally playing a game from my backlog that I should've played years ago, and that's the delightful albeit dark card game <a href=\"https://www.eurogamer.net/games/inscryption\" target=\"_blank\" rel=\"noopener\">Inscryption</a>. There's so much more to this than you'd first expect, and I'm surprised the community has been able to keep the game's best bits under wraps for so long. Ultimately, nothing could've prepared me for Act 2, and my only real qualm with the whole experience is that I wish Act 2 had its own endless roguelike mode; you'd never be able to pull me away from it.</p><p>The game falters a little at the start of Act 3, I'll admit, and I've found myself very frustrated by what is an otherwise relatively easy time. This is down to me missing some rather useful earlier cards that I've since learnt would've made this final stretch much breezier, but oh well. I will still take down the Uberbots one way or another for the love of the game!</p>\n<p><em>-Kelsey</em></p>\n<h2>World of Warcraft: Forever, PC</h2>\n\n<p>I've sunk every free hour I have into World of Warcraft: Forever since its release on Wednesday night. As of writing I am Level 19, waiting for an escort quest to come up in Westfall. So far things seem largely the same as in the original MMO, though the little changes and improvements I've seen have firmly planted a smile on my face.</p><p>This includes the new weather system. Like many others I was caught in a snow storm in Dun Morogh this week, a seemingly random environmental transformation that drastically limits view distance and blankets your screen with the cold stuff. It adds a lot, I think, to the fantasy of the game. I'll be playing this all weekend and for the foreseeable future.</p>\n<p><em>-Connor</em></p>\n<h2>GTA Vice City, PS5</h2>\n\n<p>I'll let you guess why I'm playing this <em>right now</em> of all times. Ahead of <a href=\"https://www.eurogamer.net/gta-6-everything-we-know-so-far-9357\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 6</a>'s launch, I've made it my unofficial job to internalise the map of Vice City. I'm spending time driving around the strip, familiarising myself with the docklands, going for a few rounds of golf up in Leaf Links, and sniffing out the warehouses on Prawn Island. I'm immensely curious how similar the map is in GTA 6, and can't wait to see what's changed in the interceding 40 years in-universe. It's even better having V-Rock blast Iron Maiden and Twisted Sister at me; over the past few evenings, I've been playing this extra loud so it drowns out the sound of local fireworks for the sake of my poor, terrified dog. I don't think he's a fan of Bruce 'the air raid siren' Dickinson's voice - but it's better than all the apocalyptic banging.</p>\n<p><em>-Dom</em></p>\n<h2>The Legend of Zelda: Tears of the Kingdom, Switch 2</h2>\n\n<p>The cold winter nights are drawing in, which calls for blankets, a warm drink, and a nice peaceful game before bed. I don't have an exact reason for going back to <a href=\"https://www.eurogamer.net/zelda-tears-of-the-kingdom-walkthrough-tips-9343\" target=\"_blank\" rel=\"noopener\">Tears of the Kingdom</a>. Perhaps it's me diving into <a href=\"https://www.eurogamer.net/games/the-legend-of-zelda-ocarina-of-time\" target=\"_blank\" rel=\"noopener\">Ocarina of Time</a> that fuelled my curiosity about returning, but what's surprised me the most is there's still so much I didn't see or do in my first 190 hours with it.</p><p>I started again, cleared my save file, and it turns out I've completely forgotten most things about the game - which is by no means a complaint! I'm rather enjoying making the little discoveries that are either brand-new to me, or ones that make me go 'AH-HA, I remember you' (in the case of Gloom Hands, the reaction was 'NOPE, NOPE, NOPE, NOPE.')</p>\n<p>I've also had another surprise. I play in handheld mode mostly, and ToTK was all looking a bit blurry on the <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a>'s screen. So I got the upgrade pack and suddenly everything became beautiful again - Link was in focus, the individual blades of grass in Hyrule Field were clearly whipping in the wind, and the crispy snow around Rito village almost sparkled. I don't often get upgrade packs for games I already own, but this one was worth it.</p>\n<p><em>-Marie</em></p>\n<h2>Queen's Domain, PC</h2>\n\n<p>I suspect this won't be the last time you see me yapping about Queen's Domain here. I've already <a href=\"https://www.eurogamer.net/queens-domain-now-playing\" target=\"_blank\" rel=\"noopener\">enthused about it elsewhere on the site this week</a>, but I've managed to squeeze in a few more hours since then, and it continues to enthrall. Here's a small moment from my most recent go: I'd been fumbling about the Tower of Knowledge for a while at this point, dying slightly more than I'd like to those jabby gargoyle gits and lumbering chimera things, so I thought I'd have a little wander away from the violence and have an explore. That was when I noticed the gap on the bookshelf, wide enough to slot in the mysterious tome - the Ratty Bug Compendium - I'd been wondering about ever since I picked it up elsewhere some five hours earlier.</p><p>Moments later a secret passage had opened, leading out to a balcony overlooking the ocean. Treasure! Exciting! <em>But</em> just as I'm about to go back inside, I notice a little outcrop on the exterior of the tower, seemingly reachable with my sword's magic dashing power. So over I go, discovering an otherwise inaccessible route into an inner chamber. There, I find a lever, which I excitedly pull, only to be rewarded with... nothing at all. Until five minutes or so later, when I discover a secret panel has now opened up on the <em>other</em> side of the tower, granting me access to the treats within. In isolation, it's not a remarkable gaming anecdote, but Queen's Domain is just crammed with these little incremental secrets and surprises, full of clever design that makes exploration feel so rewarding. I've already spotted more enigmas waiting to be cracked, and if Queen's Domain keeps distracting me like this, I might never escape its pull.</p>\n<p><em>-Matt</em></p>"}];
