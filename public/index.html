*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

}

}

}

<script>
var articles = [{"title":"Jensen Huang’s exit puts Nvidia’s support for open source in question","source":"TechCrunch","author":"Rebecca Bellan","url":"https://techcrunch.com/2026/11/12/jensen-huangs-exit-puts-nvidias-support-for-open-source-in-question/","category":"tech","categoryLabel":"Technology","wordCount":750,"readingTime":4,"content":"<p>The open source community just lost one of its strongest advocates. </p>\n<p>Nvidia CEO Jensen Huang <a href=\"https://techcrunch.com/2026/11/12/nvidias-jensen-huang-resigns-chipmaker-names-cfo-colette-kress-as-interim-ceo/\" target=\"_blank\" rel=\"noopener\">resigned</a> Thursday after he admitted to an affair with an alleged Chinese spy, raising concerns about U.S. national security and the motives behind the executive’s support for softer chip export controls on China. </p>\n<p>Huang has been a staunch supporter of open source AI, framing the ecosystem as good for safety, innovation, diffusion, and sovereignty. And as frontier AI labs increasingly move to reduce their reliance on Nvidia and build their own chips, supporting open source is also a good way for the company to diversify its customer base by selling chips to nation-states, enterprises, and any organization that wants to own its own models.</p>\n<p>Still, Huang’s resignation raises questions about whether Nvidia will carry on his legacy by continuing to support the open model community. </p>\n\n<p>Huang’s departure also comes as Nvidia has yet to finalize a deal to acquire open source platform Hugging Face for <a href=\"https://techcrunch.com/2026/09/03/nvidia-confirms-it-will-buy-hugging-face-for-12-9-billion/\" target=\"_blank\" rel=\"noopener\">$13 billion</a>. Hugging Face CEO Clem Delangue said in a post on X that the <a href=\"https://techcrunch.com/2026/11/12/hugging-face-ceo-vows-to-keep-fighting-for-open-source-ai-after-jensen-huangs-exit/\" target=\"_blank\" rel=\"noopener\">company would continue to fight for open source</a>, whatever happens next. </p>\n<p>Nvidia also agreed to pay <a href=\"https://finance.yahoo.com/technology/ai/articles/nvidias-6-billion-deal-poolsides-054000693.html\" target=\"_blank\" rel=\"noopener\">$6 billion for a non-exclusive license</a> for open AI coding startup Poolside’s technology. </p>\n<p>Within Nvidia, Huang pushed for the development of the <a href=\"https://techcrunch.com/2026/10/19/nvidia-launches-new-open-models-to-run-agents-in-the-enterprise-and-on-pcs/\" target=\"_blank\" rel=\"noopener\">Nemotron family</a> of open-weight AI models built for long-running agentic AI systems and reasoning workloads — potential competitors to closed frontier models. One company insider told TechCrunch that they don’t expect a change in leadership to have an impact on Nemotron development. </p>\n<p>Huang also backed companies that would make American open models more competitive, investing in startups like Reflection AI and Thinking Machines Lab.</p>\n<p>Huang’s influence extended beyond Nvidia’s investments and product roadmap. He also emerged as one of the most prominent voices pushing back against Washington’s efforts to restrict the open AI ecosystem. </p>\n<p>Earlier this year, Huang wrote an open letter signed by 25 companies, including Microsoft, Meta, IBM, and Palantir, urging the U.S. government not to over-restrict open-weight AI models, many of which come from China. </p>\n<p>The impetus for that letter was Washington’s debate over how the U.S. should respond to allegations that Chinese AI labs are stealing intellectual property from American counterparts like <a href=\"https://www.anthropic.com/news/position-open-weights-models\" target=\"_blank\" rel=\"noopener\">Anthropic</a> and OpenAI, both of which have <a href=\"https://www.washingtonpost.com/national-security/2026/07/06/why-anthropic-alleges-chinese-firms-are-distilling-knowledge-claude/\" target=\"_blank\" rel=\"noopener\">reportedly</a> appealed directly to Washington on the matter, urging stronger protections. </p>\n<p>That combination of Huang’s personal visibility and Nvidia’s market power made him the strongest counterweight to arguments from closed-model providers like Anthropic and OpenAI, which have advocated for greater restrictions on advanced AI models due to safety reasons. </p>\n<p>Without Huang, the concern among open source community members is that whoever takes over will be more cautious. Nvidia has named CFO Colette Kress as interim CEO. It’s not clear how Kress will approach the Hugging Face deal or support for the open model ecosystem, but founder-driven priorities tend to get a downgrade when leadership changes. </p>\n<p>Huang’s exit could also strengthen the arguments of those in Washington who are arguing for tougher restrictions on Chinese AI companies, particularly as the scandal surrounding his relationship with Alice Huang, the Megaspeed executive and alleged spy, puts <a href=\"https://techcrunch.com/2026/11/09/jensen-huangs-affair-with-alleged-chinese-spy-puts-nvidias-china-ambitions-under-scrutiny/\" target=\"_blank\" rel=\"noopener\">renewed scrutiny</a> on his efforts to loosen chip export controls. </p>\n<p>Restrictions on open-weight models from China could kneecap competition for American companies, the most powerful of which have kept their models closed. </p>\n<p>Still, supporting open source isn’t simply a passion project Huang pursued out of idealism. It’s increasingly central to Nvidia’s business strategy. </p>\n<p>As some of Nvidia’s biggest customers, including Google and OpenAI, develop their own chips, Nvidia has an incentive to cultivate a much broader ecosystem of AI developers and customers. </p>\n<p>More players training, fine-tuning, and running models mean more GPUs sold, and less dependence on a handful of frontier labs.</p>\n<p>Huang may be gone, but Nvidia still needs an open AI ecosystem. The question now is whether that commitment can survive without the man who made it a priority.</p>\n<p>TechCrunch has reached out to Nvidia for comment. </p>\n<p><em>This article has been updated with information from an Nvidia employee. </em></p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Rebecca Bellan is a senior reporter at TechCrunch where she covers the business, policy, and emerging trends shaping artificial intelligence. Her work has also appeared in Forbes, Bloomberg, The Atlantic, The Daily Beast, and other publications. </p>\r\n<p>You can contact or verify outreach from Rebecca by emailing <a href=\"https://techcrunch.com/cdn-cgi/l/email-protection#0a786f686f69696b24686f66666b644a7e6f696269787f64696224696567\" target=\"_blank\" rel=\"noopener\">[email protected]</a> or via encrypted message at rebeccabellan.491 on Signal.</p>\t\n<p>\n\t<a href=\"https://techcrunch.com/author/rebecca-bellan/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"},{"title":"If You Commit a Crime with a Gun, You Might Not Want to Use a Purple Gun with a Blue Laser Sight","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/12/if-you-commit-a-crime-with-a-gun-you-might-not-want-to-use-a-purple-gun-with-a-blue-laser-sight/","category":"law","categoryLabel":"Law","wordCount":769,"readingTime":4,"content":"<p>From <a href=\"https://cases.justia.com/pennsylvania/superior-court/2026-1319-mda-2025.pdf?ts=1793298560\" target=\"_blank\" rel=\"noopener\"><em>Commonwealth v. Ashford</em></a>, decided two weeks ago by a Pennsylvania appellate court, in an opinion by Judge Mary Murray, joined by Judges Timika Lane and Kate Ford Elliott:</p>\n<blockquote><p>The trial court summarized the evidence adduced at Appellant's jury trial …</p>\n<blockquote><p>On February 11, 2023, … [(Ms. South)] was carjacked in Reading City, Berks County, Pennsylvania, by three men in black balaclavas[, one of whom] brandish[ed a] handgun[ ] with <strong>blue laser sights</strong>….</p>\n<p>The evening prior, on February 10, 2023, a video [(\"the video\" or \"the YouTube video\")] was uploaded to the online video sharing platform[,] YouTube[,] depicting Appellant and [two] other men in black balaclavas handling and displaying various <strong>firearms with blue laser sights, including a purple Glock handgun</strong>. [The video was admitted into evidence and played for the jury at trial, albeit without sound.] The video itself is undated, though Appellant appears to be around the same age [in the video and at the time of the offense,] and is depicted wearing the same sweatshirt in which he was apprehended ten days later.</p></blockquote>\n</blockquote>\n<blockquote>\n<blockquote><p>{The video, which is a part of the certified record, remains posted on YouTube. https://www.youtube.com/watch?v=W-IX9rvOflg (last visited Oct. 1, 2026); N.T., 5/15/25, Commonwealth Ex. 1. At several points during the two-minute-long video, Appellant (1) partially removes his facial covering, revealing his face; and (2) is holding a purple Glock handgun equipped with a blue laser sight. The video is accompanied by background music that was created by a rap musician with whom Appellant claims to have no association.} …</p>\n<p>Approximately ten days later, on February 20, 2023, Officer Redinger of the Northwest Regional Police identified Ms. South's stolen car while on patrol in Mount Joy Township, Lancaster County, Pennsylvania. When [Officer Redinger] attempted to pull the car over using lights and sirens, the vehicle fled. Several minutes later, law enforcement officers were eventually able to stop the fleeing vehicle using spike strips. Four male occupants, including Appellant, emerged and fled on foot in different directions[,] in pairs of two.</p>\n<p>Sergeant [Seth] Arnold [(Sergeant Arnold)] of the Northwest Regional Police chased two of the males, including Appellant, behind a nearby residence. Sergeant Arnold was able to apprehend Appellant when [Appellant] tripped and <strong>fell near a trampoline</strong> in the backyard [of a residence].</p>\n<p><strong>When Sergeant Arnold retraced Appellant's path of flight, he observed a bright blue light shining in the grass near the trampoline. </strong>Closer inspection revealed the light to be <strong>emanating from a purple Glock handgun with a blue laser attachment…</strong>.</p></blockquote>\n<p>Appellant contends the trial court's improper admission of the video violated his right to free expression ….</p>\n<p>\"[T]he government generally lacks the authority to restrict expression based on its message, topic, ideas, or content.\" Our Supreme Court has explained that \"First Amendment freedoms apply broadly to different types of expression, including art, poetry, film, and music. Such freedoms apply equally to cultured, intellectual expressions and to crude, offensive, or tawdry ones.\" …</p>\n<p>Here, the trial court determined that no violation of Appellant's right to free expression occurred by the admission of the video:</p>\n<blockquote><p>Necessarily, to raise a colorable claim under … the First Amendment …, speech itself must somehow be restricted or sanctioned by the government…. [In this case,] <strong>Neither the substantive lyrics nor expressive portrayals contained in the YouTube video at issue served as the basis for any of Appellant's criminal convictions. Saliently, Appellant's conviction for firearms not to be carried without a license did not stem from the depiction of Appellant displaying a firearm in the undated YouTube video.</strong> Rather, it was based on the totality of the circumstances indicating his power and intent to control the firearm in the early morning hours of February 20, 2023. <strong>The video was properly admitted solely to introduce its <em>non-expressive</em> aspects. Namely, it was highly probative of the fact that Appellant, having apparently constructively possessed the rare purple Glock with a blue laser sight shortly before the carjacking</strong> [<strong>of Ms. South</strong>]<strong>, was likely to have continued to possess the weapon up to the point at which he discarded the weapon when fleeing from police ten days later.</strong> In short, because the artistic expressions contained in [the] video were not regulated or sanctioned by the Commonwealth in the instant matter, the free speech clauses of neither the federal nor the Pennsylvania Constitution were implicated by the admission of th[e] video at trial.</p></blockquote>\n<p>The trial court's reasoning is supported by the record, and its legal conclusion is sound. We conclude the trial court did not err in admitting the video, and Appellant's constitutional right to free expression was not implicated….</p></blockquote>"},{"title":"Before Dark Souls there was King's Field, and five hours into this brilliant FromSoftware homage, it's already one of my 2026 games of the year","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/queens-domain-now-playing","category":"gaming","categoryLabel":"Gaming","wordCount":1330,"readingTime":7,"content":"<p>The clue, of course, is right there in the title. Developer Freshly Baked Games' Queen's Domain isn't <em>just</em> a retro-fantasy action RPG played in first-person; it's an explicit homage to King's Field, the long-dormant FromSoftware series that - as the precursor to Demon's Souls, Dark Souls, Bloodborne, Sekiro, <a href=\"https://www.eurogamer.net/elden-ring-walkthrough-8042\" target=\"_blank\" rel=\"noopener\">Elden Ring</a>, and all those other Soulslikes - helped shape the modern gaming landscape in its own small way. That, though, is pretty much where my knowledge of the series begins and ends - as much as I love FromSoftware, I've never actually played a King's Field game. I've no idea how Queen's Domain shapes up as Kings Field-like, then, but I do know that, five or so hours in, it's already one of my favourite games this year.</p>\n<p>Queen's Domain begins, as many great games do, on a beach. Our hero, Prince Beriik, has been washed ashore after his expedition ship, on a voyage to the mysterious Isle of Neasied, is destroyed. Beriik is searching for his father, King Gius Abraon, who's vanished on a mission to save the kingdom of Bamaen - after years of peace, the evil Queen Siraatsu's army of the damned is stirring; the dead are rising, legendary beasts are returning, and the creatures of the land have turned feral. But for now, there's simply a beach, the cry of distant gulls, and the gentle breaking of surf upon the shore. Queen's Domain's lore might read like an explosion in a vowel factory, but you certainly can't fault its mood.</p>\n\n<p>There's something, perhaps, of the <a href=\"https://www.eurogamer.net/dread-delusion-now-its-on-consoles-you-really-should-play-it-too\" target=\"_blank\" rel=\"noopener\">superb Dread Delusion</a> in Queen's Domain; specifically in the way both deploy the lo-fi video game aesthetics of the 90s and early 2000s to invoke a more deliberate kind mood: those unnatural low-poly angles, those shimmering lo-res textures, and those rasterised skies creating - when viewed en masse across an expansive interconnected world - a particularly woozy sort of landscape. Here, though, the vibe isn't so much putrescence as chilly isolation, the muted vistas awash in greens, greys, browns, and blues.</p><p>It's a mood sent further off-kilter by the wonderfully odd soundtrack, whose seeping retro synths shift unpredictably from ambient melancholy to thumping dissonance, drawing in everything from parping trumpets to quacking ducks. And then there's the geographic strangeness - the secretly labyrinthine shape of this deceptively compact island - that only grows more apparent the further you explore.</p>\n<p>Once you pick yourself off the beach and wander inland, the path almost immediately forks: to the left a boarded trail, to the right a vast stone door. Up ahead a gated cave mouth, and looming high on the clifftop, a mysterious ancient tower. Queen's Domain is full of these kinds of curiosity piquing landmarks, serving as both orientation points and unspoken goals.</p>\n\n<p>1 of 12 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Queen's Domain isn't exactly what you'd call forthcoming, you see, and early on - in lieu of a more explicit objective - that tower seems like a promising lead. Rusty blade in hand, you plot a likely course, but while there's a sort of logic to the island from afar, the routes between its landmarks are woven in wonderfully convoluted ways. And before you know it, your path has spilled out onto the coast, winding a perilous cliffside route high above the crashing waves. A second option leads further inland, plunging downward into a shadowy glade. And it's only after battling an onslaught of ladybird-rat hybrids and unnerving chicken-crickets (Queen's Domain loves its weird wildlife amalgams) you realise the two routes converge.</p><p>From there, more branches, but always a tangled path; the island's deliberately disorientating design turning navigation and exploration into a fascinating puzzle. And that only increases once you find your first proper sword. Imbued with a powerful darting slash, it's both an offensive tool and - with a break-glass-in-case-of-emergency strafe - an occasionally defensive one. But, it also grants traversal powers, those darting thrusts carrying you across previously impassable gaps. Soon, exploration, initially restricted to ground level, grows increasingly vertiginous, opening up whole new possibilities. You'll bound across treetops, charting a circuitous path around the island, or return to those shattered bridges and see what lies beyond. And that 'what' has frequently managed to surprise me - at one point, an apparently simple ascent turns into a several-hour trawl through a water temple.</p>\n\n<p>1 of 11 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Paths aren't always obvious, either; you'll plunge into a pool of deadly miasma, shuttling forward at the last moment to propel yourself along a carefully concealed pipe, or investigate a previously unreachable overhang only to unearth a secret passageway leading to horrifying depths. And often, you'll stumble across sudden shortcuts, causing routes to unexpectedly fold back on themselves. Truthfully, the freedom is mostly an illusion - the island is carefully designed to prevent you from deviating too far - but the proliferation of secret corners, and the minimal handholding, means the paths you're forging feel like your own. And as you unlock new tools, you realise there's a Metroidvania aspect to these spaces too. It's clever stuff, particularly when more overt puzzles are introduced, feeding further into the traversal rhythms.</p><p>And throughout it all, combat serves as Queen's Domain's drumbeat, punctuating progress with encounters whose wilfully rudimentary systems do, admittedly, take a bit of getting used to. It's not just the deliberate wooliness of it all as Freshly Baked emulates the combat of video games yore, or enemies' merciless in-your-face lock-on once disturbed, it's the limited ways you can respond. You can swing your sword, step outside of an incoming attack (there's nothing so advanced as a dedicated dodge button), and, well, that's pretty much it. And even accounting for enemies' minimal, largely predictable attack patterns, you'll invariably fumble and die.</p>\n\n<p>1 of 11 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>But slowly it evolves into something compelling; a methodical game of feints and opportunistic returns, of goading enemies into attacks so you can, as far as your stamina gauge allows, exploit the resulting window. It's still far baggier than, say, Dark Souls, but it finds an engaging rhythm. Partly that's down to a combat twist that actively encourages restraint: standard weapon swings barely do more than chip damage, but hold the button to charge up your attack, and you'll do substantially more harm. That turns combat into a dance of patient timing, as you try and find the perfect moment to unleash a swing as multiple enemies move in.</p><p>That's just the foundation though. Soon enough, you've got throwing knives (which slowly replenish over time) for kiting, supplementary damage, or picking off sentry-like foes at a distance. There are spears and bludgeons, often with unusual secondary abilities, and it all feeds into a rock-paper-scissors-style damage system that encourages experimentation with your arsenal - especially where bosses are concerned. And the final flourish is an automatic levelling system that doesn't just strengthen your character as you play, it levels individual weapons - eventually causing them to evolve. It encourages engagement with enemies rather than avoidance, and provides a regular sense of progress in a game where the sometimes unforgiving challenge means inevitable repetition.</p>\n<p>Queen's Domain is not, I should stress, a Soulslike, despite some similarities. You don't drop stuff on death, meaning no desperate corpse runs, and while resting and replenishing your energy at crystals resets the world - encouraging some push-your-luck risk-taking - you can save your game independently, creating some welcome breathing room.</p>\n<p>Put all this together and Queen's Domain is a wonderful surprise; a moody, sometimes silly retro throwback that, despite its self-imposed mechanical and aesthetic limitations, feels anything but limited. Five hours or so into its supposedly 40 hours of playtime, its mix of combat, exploration, and puzzling has settled into a properly compelling rhythm - and despite some tricky bits and my own cack-handed frustrations, it keeps pulling me back in again. I've no idea if Queen's Domain is a good King's Field homage, but so far at least, it's a bloody good time.</p>"},{"title":"After the War, They Turned the Cameras on Themselves, in “Allies in Exile”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-new-yorker-documentary/after-the-war-they-turned-the-cameras-on-themselves-in-allies-in-exile","category":"fun","categoryLabel":"Interesting Reads","wordCount":789,"readingTime":4,"content":"<p>In the early, optimistic days of the Syrian revolution, a law student named Hasan Kattan joined a small group of activists in Aleppo who risked their lives to document <a href=\"https://www.newyorker.com/magazine/2025/02/03/a-witness-in-assads-dungeons\" target=\"_blank\" rel=\"noopener\">atrocities</a> that were being carried out by security forces loyal to the then President, Bashar al-Assad. The work exposed Kattan to astonishing violence, often in the form of indiscriminate attacks from above—air strikes, shelling, barrel bombs chucked out of helicopters onto markets and houses. It was not unusual, in the aftermath of an attack, for regime jets to circle back and strike again, to kill or maim anyone who was trying to pull the wounded out of the rubble. Kattan filmed such horrors and posted them online, hoping that the world might pay attention. It was through this terrible work that he met Fadi al-Halabi, another young man with the same documentary impulse and ambitions. They became inseparable friends.</p><p>The war dragged on. Kattan was nearly shot by a sniper; Halabi and his brother Yaman, who also worked as an activist, were nearly buried in an air strike on an underground hospital that was treating victims of a chemical attack. When Assad’s forces looked weak, Russia sent ground troops and fighter jets to support them. The rebel-held half of Aleppo—one of the oldest continuously inhabited cities in the world—became a bombed-out wasteland. By the end of 2016, the remaining opposition-controlled neighborhoods were encircled. Halabi escaped, under bombardment; Kattan, who had recently married, sent his wife to the <a href=\"https://www.newyorker.com/magazine/2026/10/19/my-education-on-the-border-of-the-syrian-war\" target=\"_blank\" rel=\"noopener\">Turkish border area</a> with a group of other women, then followed, by himself, during the final days of the siege. “All I carried out of Aleppo was our footage, the memory of a city that must never be forgotten,” he later said. So began a life of displacement—first in northern Syria, then in southern Turkey.</p><p>In the early hours of February 6, 2023, a devastating earthquake shook the ground in the Turkish-Syrian border areas. Many buildings collapsed, crushing to death people who had recently fled war. Kattan’s wife and two small children survived, but, in the hours after the earthquake, Halabi couldn’t find anyone in his family; he was missing fourteen close relatives in all, including his parents and Yaman. Kattan picked up a camera and filmed his best friend’s dwindling hope, as emergency workers dug through the rubble of the buildings where they had lived, searching for survivors and finding none.</p><p>A year later, Kattan and Halabi were invited to show the resulting film, “Death Without Mercy,” which documented Halabi’s desperate search for his loved ones, at a private screening in London. But anti-Syrian sentiment was on the rise in Turkey, and, as they went through the airport in Istanbul, a Turkish immigration official instructed them to sign a document that they soon realized amounted to a ban on their return. “It looked like a routine administrative procedure that we had to complete before being allowed to continue our journey,” Kattan told me.</p><p>The men arrived in London, afraid and confused. Halabi had no family and nowhere to go; Kattan’s wife and children were still in Turkey. Neither man could return to Syria—it was early 2024, and Assad was still in power. After consulting a lawyer in London, both men applied for asylum in the U.K.</p><p>The two friends shared a room in a hotel for asylum seekers, waiting for appointments that would decide their fates. Neither had wanted to leave Syria, or Turkey, but once again they had ended up in exile, stranded amid circumstances that were beyond their control. Kattan turned to the camera, to document whatever might follow. The footage would eventually become the basis for his film “Allies in Exile,” which was co-directed by Halabi. The days came and went—a hundred days, two hundred, three hundred. Anti-immigrant protests took place outside. “Nothing is harder than the wait—a silence that brings out every memory,” Kattan said.</p><p>Then, in early December, 2024, rebel forces overran the Syrian capital, Damascus. Assad fled to Russia in the dead of night. The war was <a href=\"https://www.newyorker.com/news/the-lede/the-fall-of-assads-syria\" target=\"_blank\" rel=\"noopener\">over</a>. For Kattan and Halabi, the celebration was bittersweet. “If Bashar al-Assad had stepped down at the start, my family would have stayed in Aleppo, and I would not have lost them,” Halabi said. “They would have been the people who helped rebuild Syria.”</p><p><em>This film is produced by Orlando von Einsiedel and supported by the Displacement Film Fund. The D.F.F. is co-founded and led by Cate Blanchett and was established with fellow-supporters to champion and to fund the work of displaced filmmakers. International Film Festival Rotterdam’s Hubert Bals Fund is the management partner, and other partners include Master Mind, Uniqlo, Droom en Daad, the Tamer Family Foundation, the Amahoro Coalition, the U.N.H.C.R., and the SP Lohia Foundation.</em></p>"}];
