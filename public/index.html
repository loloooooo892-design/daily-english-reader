<script>
var articles = [{"title":"John Cusack Goes Graphic","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/16/john-cusack-goes-graphic","category":"fun","categoryLabel":"Interesting Reads","wordCount":631,"readingTime":4,"content":"<p>For the actor John Cusack to deliver an apathetic Cameo performance—Cameo being the service through which regular people hire famous people to make short videos wishing a friend happy birthday, or whatever—feels like the most John Cusack-character thing that John Cusack could do. But “the internet” (meaning Threads) recently turned against him for phoning it in on Cameo. Cusack, however, at sixty years old, still gets plenty amped up about the things that actually interest him.</p><p>Things that currently interest John Cusack include politics, fringe philosopher-artists, and graphic novels, one of which he recently published. “Momo,” illustrated by Ignacio Noé, is Cusack’s noirish seventies road-trip romp about the philosopher-artist Antonin Artaud (per Cusack: “sovereign of the absurd, master of the irrational, lord of the permanent rebellion”), who spent years in French mental institutions. Cusack’s book imagines a scenario in which Artaud fakes his own death and is sprung from an asylum by Jackie Gleason, who then accompanies him and Richard Nixon to the Homestead Air Force Base to check out embalmed alien heads. After that, things get really weird.</p><p>The other day, at Forbidden Planet, a comic-book store near Union Square, Cusack, dressed in black (uniform, not disguise), moved easily among young punks in plaid and Doc Martens and clerks in ironic tees. He said that the artist Damien Hirst (whom he met in the nineties, with Joe Strummer) had turned him on to Noé’s work. “You can always go to Damien and get this Wonka world,” Cusack said, in his flat, gravelly voice, punctuated by a slow lemur blink. He recalled, “Last time I was at his place, he had bought a graveyard in Scotland. And he was building a house out of the headstones. I said, ‘It’s going to be haunted.’ And he said, ‘It will be when I’m fucking done with it.’ ”</p><p>Cusack perused the shelves. “I read ‘Dr. Strange,’ ” he said. “I love the old ‘Creepshow,’ ‘Daredevil.’ ” “Momo” takes place in 1972, when Cusack was six. “But I remember stuff,” he said. “Elvis was on TV, Watergate.” The book came pretty easy: “It was like writing a script, except I had to negotiate a lot less with anybody else. It was like a movie that only existed in my mind.”</p><p>He stood in front of boxed, beefy action figurines and opined on Artaud, who, notably, had freaked out even his Surrealist contemporaries. “He just went all the way,” Cusack said. “And what he wanted was always almost impossible—he wanted performance to be a magic spell. I always thought he was this great avatar that represented success and failure—failure mostly. Like Sid Vicious but much more talented. I always thought that, in a way, he was a wizard.”</p><p>What would an Artaud action figure look like? (He’s known to have had a “magic” walking stick.) Cusack studied a Starman figurine and mused, “I think if we did monetize Artaud as an action figure, he would come out of the primordial abyss and stomp on me.” He walked past a doormat that read “<em>GODZILLA WAS HERE</em>” and featured a big reptilian footprint.</p><p>Heading up Broadway—a former stomping ground, from his N.Y.U. days—Cusack pointed. “That used to be a theatre,” he said. “There was a play where everybody was on wires. They used to come down and grab you.”</p><p>He settled in at a table at Union Square Café, removing his cap and ruffling his hair. “Mômo,” he explained, was a moniker that Artaud gave himself: “It was some alter ego or something.” Cusack said that none of his friends call him by his name. “People called me Carl for a long time,” he said. “Or Doctor, like, a self-proclaimed doctor of whatever.” He ordered an “iced-tea lemonade.” “Like an Arnold Palmer?” the waitress asked.</p>"},{"title":"Who is Colette Kress, Nvidia's new interim CEO?","source":"PC Gamer","author":"Jacob Ridley","url":"https://www.pcgamer.com/hardware/who-is-colette-kress-nvidias-new-interim-ceo/","category":"gaming","categoryLabel":"Gaming","wordCount":747,"readingTime":4,"content":"<p><a href=\"https://www.pcgamer.com/hardware/live/news/nvidia-jen-hsun-scandal/https://www.pcgamer.com/hardware/live/news/nvidia-jen-hsun-scandal/\" target=\"_blank\" rel=\"noopener\">Jensen Huang has resigned</a>, and in his place is a familiar face for anyone that's listened to one of <a href=\"https://www.pcgamer.com/tag/nvidia/\" target=\"_blank\" rel=\"noopener\">Nvidia</a>'s financial calls: it's the company's long-standing CFO, Colette Kress.</p><p>But you might be excused as a gamer for never hearing about her; an earnings call isn't everybody's cup of tea.</p><p>Colette Kress has been <a href=\"https://nvidianews.nvidia.com/bios/colette-kress\" target=\"_blank\" rel=\"noopener\">chief financial officer at Nvidia since 2013</a>. That's 13 years sat alongside Jensen in calls with investors and financial institutions to discuss how the company is doing. Kress has been in the role for the record highs of recent years, and the not-so-record lows of others, like the price plummets of '25, '21, and '18.</p><p>Prior to her role at Nvidia, Kress was SVP and CFO at Cisco for a couple of years and Corporate VP at Microsoft for nearly five. She also worked at Texas Instruments—all the big hitters, then.</p><p>Generally, Kress has stayed out of any contentious issues with the company, only occassionally commenting on the big issues during earnings calls. Like when the <a href=\"https://www.pcgamer.com/nvidia-is-as-frustrated-with-the-lack-of-rtx-30-series-stock-as-you-are/\" target=\"_blank\" rel=\"noopener\">RTX 30-series was out of stock everywhere thanks to cryptocurrency mining</a> (the mining had an impact on the company's financials in a slightly contentious way, too).</p><p>Or <a href=\"https://www.pcgamer.com/hardware/graphics-cards/another-quarter-another-quarterly-update-from-nvidia-that-doesnt-mention-gaming/\" target=\"_blank\" rel=\"noopener\">ceaseless comments on the increasing demand for AI datacentre build out</a>. That's of less interest to gamers, but what do you expect? Nvidia to talk about gaming GPUs in this day and age? It cannot be done.</p><p>In an email to employees in the wake of Jensen Huang's departure, Kress reportedly said (<a href=\"https://x.com/Hadas_Gold/status/2120893006374981684/photo/2\" target=\"_blank\" rel=\"noopener\">via Hadas Gold on X</a>):</p><p>The PC Gamer Circuit Breaker newsletter breaks down the latest PC gaming tech, and finds you the best deals on the best products</p><p>\"I believe deeply in this company and in its future. More than anything, I believe in each of you, in our customers and partners and in the vital role we play every day in the global economy.</p><p>\"The Board, Estaff and I recognize that this has been an extraordinarily difficult period and I want you to know how grateful we are for your resilience, professionalism and continued dedication. Thank you.</p><p>\"... We play a vital role in building the technology that is powering the AI revolution, and we have important work ahead of us. So let's move forward together, with the same determination and commitment that have always defined this company.\"</p><p>Kress also notes there will be a company meeting on November 18—the day after Nvidia's next financial call, which Kress will have been preparing for in her CFO role, and the day of Jensen Huang's meeting with US House leaders.</p><p>Kress will have been chosen for this interim CEO role in some part to steady the markets. It takes a long time to find and finalise a deal to secure a new full-time CEO, especially with a job opening as internationally as important as this one. So someone inside the company had to take the chalice for now. With Kress at the helm, Nvidia will be hoping investors won't be quite as worried about the company's financial future.</p><p>It's the same playbook we saw when Intel ousted then-CEO Brian Krzanich over a consensual relationship he had with an employee, which was against company policy. Krzanich was replaced by Bob Swan as interim CEO, who actually took over as CEO at a later date, before Pat Gelsinger took over from him in 2021. <a href=\"https://www.pcgamer.com/hardware/processors/intel-ceo-pat-gelsinger-retires-leading-intel-has-been-the-honor-of-my-lifetime/\" target=\"_blank\" rel=\"noopener\">Pat then retired in 2024</a>.</p><p>Nvidia will likely look at this as a bit of a cautionary tale: you want stability and leadership, not a revolving door of top execs and no one steering the ship. If the board has any wits about it, it'll be looking for a strong leader with a clear direction for the company and the will to deliver it.</p><p><a href=\"https://truthsocial.com/@realDonaldTrump/posts/117604177898784579\" target=\"_blank\" rel=\"noopener\">President Donald Trump has come out in support</a> of a man who only just managed to escape top corporate life at Apple: Tim Cook.</p><p>Meanwhile the <a href=\"https://chinaselectcommittee.house.gov/media/press-releases/moolenaar-statement-on-jensen-huang-s-resignation-from-nvidia\" target=\"_blank\" rel=\"noopener\">China Select Committee in US Congress</a> backs any leader that \"makes national security its top priority.\"</p><p>So, a true patriot that can also lead teams of top-class engineers <em>and </em>wants to fill the boots of a man that famously didn't take breaks. That'll be easy to find, I'm sure.</p>\n\n<p>Jacob has been writing about PC hardware and technology for over eight years. He earned his first byline at PCGamesN before joining PC Gamer. He spends most of his time building PCs, running benchmarks, and trying his best to learn Linux.</p>"},{"title":"Justices dubious of fee award in eminent domain dispute about interstate pipeline","source":"SCOTUSblog","author":"Ronald Mann","url":"https://www.scotusblog.com/2026/11/justices-dubious-of-fee-award-in-eminent-domain-dispute-about-interstate-pipeline/","category":"law","categoryLabel":"Law","wordCount":758,"readingTime":4,"content":"<p>The argument yesterday in <a href=\"https://www.scotusblog.com/cases/hoffmann-v-wbi-energy-transmission-inc/\" target=\"_blank\" rel=\"noopener\"><em>Hoffmann v. WBI Energy Transmission, Inc.</em></a> left little doubt about how the justices will resolve this one: they seem unlikely to hold that the gas company condemning land for a federally approved pipeline should have to pay attorneys’ fees that the United States would not have to pay if it condemned the land directly.</p><p>The dispute involves the 1947 <a href=\"https://www.ferc.gov/sites/default/files/2021-04/natural_gas_act.pdf\" target=\"_blank\" rel=\"noopener\">Natural Gas Act</a>’s treatment of interstate natural-gas pipelines. When the federal government approves such a pipeline, the Natural Gas Act allows it to acquire the land in which to build the pipeline or leave that to the gas company. In either case, if the landowner does not agree, a suit exercising the federal government’s right of eminent domain can force a transfer of the land for a “necessary right-of-way,” so long as the landowner receives the “<a href=\"https://constitution.congress.gov/browse/essay/amdt5-10-10/ALDE_00013289/\" target=\"_blank\" rel=\"noopener\">just compensation</a>” that the Fifth Amendment requires when property is “taken for public use.”</p><p>The landowners here argue, with some support in the lower courts, that if the pipeline company rather than the United States condemns the land, the pipeline company should be bound by state-law rules that require more compensation than the federal Constitution. In particular, North Dakota law well might require the company to pay the attorneys’ fees of the landowners.</p><p>The justices, though, were having none of it. The air was redolent with skepticism from the moment Robert McNamara rose to press the landowners’ view. Justice Clarence Thomas started off by asking – doubtfully – whether “if the U.S. delegates its power … of eminent domain, you’re saying that it brings with it state law trappings of just compensation?” Chief Justice John Roberts quickly interjected that “it seems to me it’s just a more efficient process to have a private developer get the land under the same terms as the federal government without having to pay the attorneys’ fees that the state wants to insist on.” When McNamara stuck to his position, the chief justice eventually concluded the discussion by commenting: “I don’t understand why this isn’t an easy case.”</p><p>It seemed for a while that several of the justices would offer a slightly different reason to reject McNamara’s argument, with Justice Sonia Sotomayor coming in quickly to press the idea that “you’re trying to separate the right to eminent domain from the right to compensation, correct?” and then pointing to “a[n] 1893 case … in which we said, [it is] a settled principle of universal law that [they are] inseparably connected. … I don’t see how your separation of these principles honors that.”</p><p>For Ketanji Brown Jackson, the problem was McNamara’s assumption “that state law, with respect to just compensation is the default,” and that “it needed to be ousted by congressional expression.” But if that were true, she pointed out, why would Congress have thought it important, in a 1946 condemnation statute adopted just one year before the Natural Gas Act, to take the trouble explicitly to import state law? That statute’s treatment of the condemnation problem appears to contrast sharply with the treatment in the Natural Gas Act just one year later. As Jackson asked pointedly: “What is [that language] doing there if … silence [by Congress means that] state law applies?” Justices Brett Kavanaugh and Amy Coney Barrett pressed McNamara on the same point: they took it as self-evident that the 1946 statute importing state law suggested that a 1947 statute silent on the topic calls for the application of the baseline federal rule emphasized by Thomas and Roberts.</p><p>You have to expect it will be pretty hard to fashion a majority if Justice Thomas and the chief justice on one side see it as an “easy case” against you and Jackson and Sotomayor on the other side are predisposed to reject what you have to say. And nothing in the remainder of the argument suggested any reason to think otherwise. The presentations of Paul Hughes (for the pipeline company) and Zoe Jacoby (for the government) were filled for the most part with softball questions speculating about why lower courts might have found such an obvious question challenging.</p><p>I would not be at all surprised if this was one of the very first decisions from the November session. The share of simple unanimous statutory cases is not so high as it used to be, but this has all the earmarks of a straightforward unanimous affirmance. </p><p><strong>Recommended Citation: </strong>Ronald Mann, <em>Justices dubious of fee award in eminent domain dispute about interstate pipeline</em>, SCOTUSblog (Nov. 10, 2026, 9:30 AM), https://www.scotusblog.com/2026/11/justices-dubious-of-fee-award-in-eminent-domain-dispute-about-interstate-pipeline/</p>"},{"title":"Acer Promo Codes: 40% Off","source":"Wired","author":"@wired","url":"https://www.wired.com/story/acer-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":880,"readingTime":5,"content":"<p>Acer is one of the largest PC manufacturers in the world, perhaps best known for its <a href=\"https://www.wired.com/gallery/best-gaming-monitors/\" target=\"_blank\" rel=\"noopener\">gaming</a> line and budget-friendly options. If you’ve already got your eye on an Acer product like a <a href=\"https://www.wired.com/story/best-laptops/\" target=\"_blank\" rel=\"noopener\">laptop</a> or <a href=\"https://www.wired.com/gal var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
