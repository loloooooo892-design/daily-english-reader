<script>
var articles = [{"title":"Trump Is Losing the Great Electric-Vehicle Race","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/trumps-isolationism-is-losing-the-great-ev-race","category":"fun","categoryLabel":"Interesting Reads","wordCount":1315,"readingTime":7,"content":"<p>Australia plays a number of interesting roles in the world, and one of them is as part of what scientists call a “natural experiment,” in which significant forces can be observed at work outside a laboratory. The nation occupies its own prosperous if smallish continent, linked to Asia by geography and to Europe and the West by history and language, and over time it has shown a certain amount of ideological flexibility. That flexibility is not always wholly admirable: even as Australia has converted so much of its energy system to solar energy that, beginning this month, it has offered free electricity to vast parts of the country for a few hours each day, it has also expanded an already huge climate-wrecking trade in coal and gas to Asia. But it does provide a kind of barometer of commercial and political sentiment, which at the moment indicates how far askew American policy may have gone.</p><p>This spring, as the Australian Broadcasting Corporation recently <a href=\"https://www.abc.net.au/news/2026-07-24/china-dominates-ev-market/106951586?utm_source=abc_news_app&amp;utm_medium=content_shared&amp;utm_campaign=abc_news_app&amp;utm_content=other\" target=\"_blank\" rel=\"noopener\">reported</a>, a shipment of electric vehicles from the Chinese manufacturing giant BYD arrived in Melbourne, aboard a giant purpose-built carrier ship, the BYD Zhengzhou. It carried some five thousand E.V.s, the largest such shipment yet to arrive in the country. Australia once had a thriving car industry, with Holden, a General Motors brand, and Ford Australia battling for supremacy throughout much of the twentieth century. Along the way, they built a spirited rivalry—see the 2023 documentary “Ford v Holden” for both background and great racing scenes—and developed the utility vehicle, after a letter writer asked Ford Australia in 1932 why it didn’t have a model capable of transporting both a family to church on Sunday and “our pigs to market on Monday.”</p><p>But, earlier in this century, Australia’s politicians decided that it was no longer possible to subsidize an industry that was too small to be competitive, especially against its (relatively nearby) Japanese counterpart. Toyota came to dominate car sales in Australia, although perhaps not for long. Chinese E.V.s sold well last month; in fact, according to ABC, BYD is on the cusp of surpassing Toyota as the most popular make in the country. Japan never quite committed to E.V.s; in 2020, Toyota’s legendary leader, Akio Toyoda, called them overhyped and said that regulations pushing E.V.s could make cars unaffordable to average people, and continued to concentrate on building hybrids, the Prius being the best-known example. It now appears that they may have missed the boat, as it were, leaving BYD in the driver’s seat, as it were. “I’m driving one right now,” Riz Akhtar, the founder of the Australian auto-data group Carloop, told ABC. “It costs around $40,000. It’s quiet, it’s comfortable, drives well, and is loaded with technology.” Akhtar also said that his E.V. costs around a quarter less than comparable makes coming to Australia from other countries.</p><p>The story is playing out in a similar way across much of the world. E.V.s account for about half the cars sold in China, but the country’s automakers are producing so many of them that they need to sell them abroad, too. Even before the <a href=\"https://www.newyorker.com/news/the-lede/donald-trumps-ad-lib-strategy-on-iran#intcid=_the-new-yorker-homepage-bkt-a_d0af351d-7a2a-46f1-b6d2-0710cf568af3_cygnus-personalized\" target=\"_blank\" rel=\"noopener\">Iran war</a> began, and gas prices jumped, exports of Chinese E.V.s soared in Southeast Asia and across Africa.</p><p>But not in the United States. This nation could, of course, have been a big player in electric vehicles—Tesla was among the first to really mass-produce them, and the big Detroit companies invested large sums to convert assembly lines. But Tesla’s C.E.O., <a href=\"https://www.newyorker.com/tag/elon-musk\" target=\"_blank\" rel=\"noopener\">Elon Musk</a>, apparently became more interested in extreme politics than in climate science. He helped bankroll the reëlection of Donald Trump, who in turn ended the fuel-economy standards and E.V. incentives that the Biden Administration had proffered, leading Detroit executives to lose heart and write off many of their E.V. investments. Last year, Trump, with a group of those executives standing behind him in the Oval Office, explained his decision to do away with the Biden-era efficiency standards this way:</p><blockquote><p>The greatest scam in American history, the Green New Scam, and it’s a quest to end the gasoline-powered car. This is what they wanted to do even though we have more gasoline than any other country by far.</p></blockquote><p>In Michigan on Monday, he said that the auto industry was “back,” and told autoworkers that “I’ve done more for you than your parents.” Perhaps, but, to the extent that one can discern any strategy in the Trump Administration, it seems to be betting that we can use our vast supplies of oil and our tariff power to pressure other nations into staying with fossil fuel. Indeed, many countries negotiated reductions in their tariff rates by agreeing to buy huge quantities of American liquefied natural gas. But the advent of cheap electricity from the sun and wind threatens that plan; last year, China sold half again as much green-energy tech as the U.S. sold hydrocarbons. Meanwhile, Canada and Mexico have begun to allow the sale of Chinese E.V.s, and they are showing up on the streets of San Diego, as cross-border commuters buy models from some brands for as little as twenty thousand dollars in Tijuana, and drive them to work.</p><p>The U.S. response has been a kind of panic; in this case, a bipartisan one. Representative Debbie Dingell, Democrat of Michigan—whose late husband, Representative John Dingell, made protecting the U.S. auto industry his life’s work—last month <a href=\"https://nypost.com/2026/05/08/lifestyle/chinese-made-cars-keep-coming-to-california-as-congress-considers-crackdown/\" target=\"_blank\" rel=\"noopener\">co-sponsored</a> legislation with her G.O.P. colleagues to ban all Chinese vehicles in the U.S., to prevent Beijing from both “undercutting our workers through massive government subsidies, unfair trade practices, and slave labor” and obtaining Americans’ personal data from the communication technology in the cars. Maybe such actions can work in the short term, but a recent <a href=\"https://www.nbcnews.com/world/asia/chinese-evs-take-world-storm-united-states-rcna344680\" target=\"_blank\" rel=\"noopener\">survey</a> showed that almost forty per cent of Americans are interested in buying a Chinese E.V., which have become staples of YouTube videos, with wide-eyed Americans travelling to Beijing to test out their wild features—the ability to float for half an hour in a flash flood, or to launch a drone from a nest on the roof to scan for traffic jams.</p><p>If the Administration’s strategy “works,” the U.S. will become something of an autarky, producing most of what it needs, as it once did. And, unlike Australia, the U.S. is an enormous country population-wise, so that’s not impossible. Yet that self-sufficiency would come at great cost—environmentally, obviously, but also in a basic openness to the world and to the idea that we’re somewhere near the cutting edge.</p><p>If we do choose to make ourselves into a theme park of internal combustion even as the rest of the world moves on to cleaner, cheaper technologies, it will come with some consolations. After Trump’s announcement of the revised fuel-economy standards, the Transportation Secretary, <a href=\"https://www.newyorker.com/magazine/2025/05/12/kathy-hochuls-turf-war-with-a-reality-tv-star\" target=\"_blank\" rel=\"noopener\">Sean Duffy</a>, mused in an interview on CNBC that it would “actually allow you to bring back the nineteen-seventies station wagon. Maybe a little wood panelling on the side.” And for some perhaps that’s sufficient compensation for abandoning our role in the world. But history offers some caution, in the form of another story about Chinese ships. In the fifteenth century, Admiral Zheng He assembled the largest flotilla the world had ever seen, of more than three hundred “treasure ships,” some of them four hundred feet long, which explored the world, building trade ties and expanding imperial power with legations journeying to and fro. They sailed from Kerala, on India’s Malabar Coast, to, as it happens, the Strait of Hormuz, and up and down the coast of Africa. But, within a few decades, opponents of this opening to the outside world took power and not only ceased the great voyages but demolished the ships that had made them, abolished the offices of the officials who had overseen them, and urged foreign delegations to leave China.</p><p>It was about some six hundred years later that the giant BYD ship reached Australia. ♦</p>"},{"title":"A Free-Exercise Challenge to NY's Medically Assisted-Suicide Law","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/07/29/a-free-exercise-challenge-to-nys-medically-assisted-suicide-law/","category":"law","categoryLabel":"Law","wordCount":639,"readingTime":4,"content":"<p>A group of Catholic healthcare providers has filed a federal lawsuit seeking to enjoin enforcement of New York's new Medical Aid in Dying Act. Among other things, the plaintiffs allege that the Act, which takes effect next month, violates their rights under the First Amendment's Free Exercise Clause.</p>\n<p>The litigation is at a very early stage. New York has not yet responded. Still, if the statutory regime operates as the plaintiffs allege, they appear to have a pretty good free exercise argument.</p>\n<p>The controversy concerns a practice supporters call medical aid in dying and opponents call medically assisted suicide. I will generally use the latter term because it more directly describes the act the statute authorizes: a physician provides medication that a patient may administer to himself to end his life.</p>\n<p>New York's existing Palliative Care Information Act requires physicians and nurse practitioners to offer terminally ill patients information and counseling about end-of-life care options. The new Act authorizes an additional option: a mentally capable adult diagnosed with a terminal illness may request medication to end his life.</p>\n<p>The plaintiffs argue that, taken together, the statutes will require medical providers to offer information and counseling about this option. Providers unwilling to counsel patients themselves must, they say, arrange for someone else to do so, or refer or transfer the patient.</p>\n<p>The lead plaintiffs are the Carmelite Sisters for the Aged and Infirm, an order that cares for elderly and dying people. The Carmelites object not only to prescribing the medication or allowing its use on their premises--in fact, the law does not require the Carmelites to do either. The Carmelites believe that counseling, referral, and transfer would themselves constitute impermissible cooperation with an immoral practice.</p>\n<p>Assuming the law requires what the plaintiffs allege, that forced cooperation would probably qualify as a substantial burden on their religious exercise. Under <em>Hobby Lobby</em>, courts generally may not second-guess a sincere religious judgment about complicity. A court could not simply tell the Carmelites that counseling or referral is too remote from the patient's ultimate decision to count as religiously objectionable.</p>\n<p>But substantial burden is only the beginning. Under <em>Employment Division v. Smith</em>, a neutral and generally applicable law ordinarily does not trigger strict scrutiny.</p>\n<p>The Carmelites argue the new law does not apply generally because it exempts hospices, which also care for terminally ill patients and address end-of-life decisions. If hospices are exempt while Catholic nursing homes are not, comparable institutions receive different treatment. New York will presumably argue that hospices are not similarly situated, perhaps because they play a different role in patient care or enter the process after broader treatment decisions have already occurred.</p>\n<p>If the Carmelites are correct and the law does not apply generally, strict scrutiny would apply. New York would have to show that requiring the Carmelites themselves to provide or arrange the counseling is the least restrictive means of ensuring that patients receive accurate information. That may be difficult. The state could provide a website, telephone service, written notice, independent counseling system, or list of participating providers.</p>\n<p>In short, if the Carmelites' account of the facts and the law proves correct, their Free Exercise Clause claim seems a strong one.</p>\n<p>Behind this case is a profound disagreement about end-of-life care. Supporters emphasize autonomy and compassion for people facing severe suffering. Opponents see medically assisted suicide as inconsistent with the duty to protect life and care for patients.</p>\n<p>These decisions are often excruciating for patients, families, doctors, and caregivers. Abstract principles can seem inadequate in such circumstances.</p>\n<p>But that is not the issue the court is being asked to decide. The question is narrower: whether New York may require religious institutions to participate in medically-assisted suicide in ways that violate their faith.</p>\n<p>I discuss the case in a new Legal Spirits Short Take, available <a href=\"https://lawandreligionforum.org/2026/07/29/legal-spirits-080-a-short-take-on-religious-objections-to-new-yorks-assisted-suicide-law/\" target=\"_blank\" rel=\"noopener\">here</a>.</p>"},{"title":"\"Our business did not grow with our audience\": post-layoffs, Xbox execs are trying to sell a gaming division bounce back by summer 2027","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/our-business-did-not-grow-with-our-audience-post-layoffs-xbox-execs-are-trying-to-sell-a-gaming-division-bounce-back-by-summer-2027","category":"gaming","categoryLabel":"Gaming","wordCount":610,"readingTime":4,"content":"<p>As latest financial report shows revenue was down compared to year</p>\n    \n  \n  \n  \n  \n            <p>Efforts by those now running Xbox to convince onlookers that the gaming division of Microsoft is now in a better place to start hauling in the ever-growing money numbers those overseeing it crave have continued alongside Microsoft first financial report since this month's <a href=\"https://www.rockpapershotgun.com/xbox-are-parting-ways-with-double-fine-arkane-undead-labs-compulsion-and-ninja-theory-in-the-course-of-thousands-of-layoffs\" target=\"_blank\" rel=\"noopener\">mass layoffs</a>. Both Xbox CEO Asha Sharma and her boss Satya Nadella have declared they're looking for the division to be growing financially again by about this time next year.</p>\n<p>\"When it comes to Xbox we are making the necessary decisions required across our content portfolio, platform, and operations to reset the business for long-term growth,\" big boss Nadella said in an earnings call as Microsoft posted their <a href=\"https://www.microsoft.com/en-us/investor/earnings/FY-2026-Q4/press-release-webcast\" target=\"_blank\" rel=\"noopener\">financial results</a> for April 1st to June 30th, 2026. \"We have the best IP in the industry and talented studios around the world, and believe we can bring these strengths together and return the business to growth in Fiscal 2027.\"</p>\n<p>Sharma echoed that in a tweet, declaring: \"In FY26, over 200 million new players came to Xbox and our games, but our business did not grow with our audience. We need to close that gap by investing in what players value. That will take time, but we expect to return to growth by the end of FY27.\"</p> \n<blockquote><p>In FY26, over 200 million new players came to XBOX and our games, but our business did not grow with our audience. We need to close that gap by investing in what players value. That will take time, but we expect to return to growth by the end of FY27.</p>— ASHA (@asha_shar) <a href=\"https://x.com/asha_shar/status/2082595819648373220?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">July 29, 2026</a></blockquote>\n\n<p>Of the two, Nadella's remarks - while naturally corporate and vague - might be the most revealing, with <a href=\"https://kotaku.com/microsoft-ceo-says-xbox-will-return-to-growth-this-fiscal-year-2000720333\" target=\"_blank\" rel=\"noopener\">Kotaku</a> pointing out that in a lengthier statement this time last year he seemed a lot more upbeat about how Xbox we doing and gave specific examples of games and series which had done big numbers. He also shouted out Game Pass' annual revenue. This time, if we put aside referring to mass layoffs as \"necessary decisions required\" for a second, he just vaguely alluded to Xbox having good games and studios without bothering to name any specifically. Then again, maybe it'd have been even more jarring for the exec to be specifically declaring his undying admiration for a studio like Bethesda, Obsidian, or Id Software not long after slicing away chunks of the staff which have made them tick.</p><p>Getting into the specifics of the results which have spurred these 'Ah, we'll get 'em next time' statements, Microsoft reported that Xbox's revenue decreased by $1.7 billion (7%) year-on-year, driven by declines in both content and services and hardware. Content and services revenue was down 5% compared to last year, while hardware was down a whopping 29% as Microsoft struggled to shift consoles.</p>\n<p>With the <a href=\"https://www.rockpapershotgun.com/valve-see-the-great-ram-shortage-getting-worse-just-in-case-you-were-clinging-to-hopes-of-a-cheaper-steam-machine\" target=\"_blank\" rel=\"noopener\">RAM crisis</a> looming over most new hardware the company might look to deploy to try and get that last number up and freshly-slashed studios either being pushed to <a href=\"https://www.rockpapershotgun.com/new-vegas-devs-obsidian-are-reportedly-working-on-a-new-fallout-game-and-only-microsoft-could-make-news-ive-waited-half-my-life-for-taste-this-bitter\" target=\"_blank\" rel=\"noopener\">start on new games</a> or <a href=\"https://www.rockpapershotgun.com/the-goal-is-to-provide-what-we-can-elder-scrolls-online-crown-store-undergoing-changes-due-to-team-bandwidth-in-wake-of-xbox-layoffs\" target=\"_blank\" rel=\"noopener\">fathom how they'll continue to build</a> on their existing ones with less workers at their disposal, I don't see much reason right now to believe in a magical reversal of fortunes over the course of a single year. That's not to say I'm not hopeful for remaining staff that next year brings fewer to no layoffs, if the bigwigs at Microsoft would ever let such a thing happen in this era of cuts seemingly regardless of how well any one game might do or <a href=\"https://www.rockpapershotgun.com/is-microsofts-69-billion-activision-blizzard-deal-paying-off-xbox-boss-asha-sharma-says-its-hard-to-say-how-to-think-about-those-decisions\" target=\"_blank\" rel=\"noopener\">whose strategy</a> might be to blame for it not racking up the numbers anticipated.</p>"},{"title":"Top Squarespace Promo Codes: 20% Off in August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/squarespace-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1320,"readingTime":7,"content":"<p>Squarespace helps small businesses and regular Joe Schmoes to get software help to build their own websites (for both personal and business), even including the commerce side of things with point of sale, inventory, and customer data features (both online or in person). In the age where literally everything is digitized and accessed through the World Wide Web, having an online presence is the most important thing you can do for your business or brand’s growth. Creating a website can be difficult, with the HTMLs and coding and what not—that’s where Squarespace comes in. And we’ve found some of the best Squarespace promo codes and coupons to help you save 10% on new websites, 20% on yearly plans, and up to 50%, while growing your business.</p><h2>Get 10% Off With This WIRED Exclusive Squarespace Promo Code</h2><p>One of the best things about Squarespace is the versatility of it—compared to other website builders, it’s hard to beat in terms of the large number of layout options, user-friendly interface, and the various features available. Some of those features include built-in ecommerce capabilities (for those hoping to sell their work), promotion marketing tools, and booking and appointment handling. WIRED even named Squarespace one of the <a href=\"https://www.wired.com/story/the-best-websites-to-show-off-your-portfolio-of-work/\" target=\"_blank\" rel=\"noopener\">best websites</a> to show off your portfolio of work. Right now, first-time users can get 10% off any website or domain plan, plus a 2 week free trial period. All you need to do is click the coupon above and enter the Squarespace promo code <strong>WIRED10</strong> into the box at checkout to see the savings roll in.</p><h2>Unlock a Free Trial and 36% Off When You Choose a Squarespace Annual Plans</h2><p>Squarespace continues to reign at the top of our list of the <a href=\"https://www.wired.com/story/best-website-builders/\" target=\"_blank\" rel=\"noopener\">best website builders</a>, with features and customizable templates that help any skill level design like a pro. But don’t just take our word, users can start with a free 14-day trial and then make a decision on which plan best suits their personal or business' needs. Squarespace frequently releases discount codes for 20% off new websites, but forget needing one–the easiest way to save up to 36% is by locking in an annual price rather than a pay-as-you-go model with the monthly plan. You’ll need your business to have a website for longevity, so I’d recommend buying long term and saving big.</p><p>Prices per plan range, with the yearly plan discounts of up to $1,520, depending on the plan you choose. With the basic plan, you’ll pay $16 per month, but save 30% when you buy annually. For Core, the midrange tier, you’ll pay $23 per month, billed at $276 annually. Meaning that if you opt for the annual plan, you’ll save over $84 over a year, and over $1,520 with an Advanced annual plan. Plus, if you aren’t sure which service is right for you, Squarespace asks a series of questions to figure out which features you actually need and then it’ll recommend a plan based on your feedback. Additionally, all plans allow you to publish your website on your terms, and come with a free custom domain.</p><h2>Students Get a 50% Off Squarespace Discount Code</h2><p>Like Millennials and Gen Z-ers, Squarespace knows just how important our digital footprint is in this day and age. That's why Squarespace is offering a student discount, where students can get 50% off annual plans to help launch their burgeoning business. All you need to do to get the Squarespace coupon code is verify your student status with Student Beans. Once you’ve verified using the free service, just input the offer code during checkout. Note: authorized students can obtain only one code every 12 months, whether the offer code is redeemed or not.</p><h2>Join Squarespace Circle for 20% Off and 40% Off Referral Discounts</h2><p>Squarespace Circle perks is how ld be a good fit for you (or your business).</p><h2>Get 20% Off Squarespace Acuity Scheduling (Or Try it for Free)</h2><p><a href=\"https://www.squarespace.com/scheduling\" target=\"_blank\" rel=\"noopener\">Squarespace Acuity Scheduling</a> is an online scheduling solution for your business that completes annoying (but necessary) administrative tasks like calendar syncing, automated email and text message reminders, payment processor integrations, and more. <a href=\"https://www.wired.com/story/acuity-scheduling/\" target=\"_blank\" rel=\"noopener\">Read our review here</a> to learn about our experience using the online scheduling service firsthand.</p><p>Plus, you don’t even need a Squarespace website to use Acuity. It includes a separate scheduling page clients can visit to book appointments, and you can embed your Acuity scheduler in almost any website. Then, if you decide to add a website from Squarespace, it’s super easy to use Squarespace’s tools and pre-designed templates. They make it easy, with a free trial option that requires no website or credit card. If you decide on a plan, you’ll save 20% annually on Starter and Standard, and 19% off Premium.</p><h2>Launch Your Business Today With Squarespace Business</h2><p>Knowing where to begin when starting a <a href=\"https://www.squarespace.com/small-business-website\" target=\"_blank\" rel=\"noopener\">small business</a> can be super daunting. Squarespace wants to make that easier, by providing an inclusive, all-in-one platform to help you run your entire business more efficiently. Squarespace has a whole suite of tools to manage and grow the business, with design-forward website templates to get started and customization options to make sure it fits with your business. Plus, there’s AI help available when needed to streamline the entire process.</p><p>Squarespace has basically everything you need to grow your online business: you can sell products, offer services, and book appointments, and Squarespace’s client management systems make booking seamless. You’ll be able to manage inventory, shipping, POS, and more from one convenient dashboard, making all of the moving parts of your <a href=\"https://www.squarespace.com/small-business-website\" target=\"_blank\" rel=\"noopener\">small business</a> a whole lot more manageable.</p><h2>Check Out the New Squarespace AI Website Builder</h2><p>AI is everywhere, and here at WIRED, we know it <a href=\"https://www.wired.com/search/?q=ai&amp;sort=score+desc\" target=\"_blank\" rel=\"noopener\">all too well</a>. Squarespace is jumping on the AI bandwagon, with its new <a href=\"https://www.squarespace.com/websites/ai-website-builder\" target=\"_blank\" rel=\"noopener\">Blueprint AI</a> service, which helps you smartly build your website. It’s free to use, although you need a paid Squarespace account to publish any website you create with Blueprint AI. If that’s not your jam and you prefer to go a little more old school, you can browse pre-built website <a href=\"https://www.squarespace.com/templates\" target=\"_blank\" rel=\"noopener\">templates</a>, including specific designs optimized for various business focuses and needs.</p><p>Squarespace recently <a href=\"https://newsroom.squarespace.com/\" target=\"_blank\" rel=\"noopener\">announced their partnership</a> with perplexity for AI optimization (AIO) tools. This basically means that Squarespace will serve as the website building and hosting partner for Perplexity’s browser, Comet, in an effort to build a seamless transition from AI-powered research to professional business building for users. Customers will be able to get fast guidance on domain registration, brand development, and design recommendations through the Comet AI chatbot.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
