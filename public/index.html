<script>
var articles = [{"title":"Taxi Drivers Rarely Die of Alzheimer’s—How Complex Mental Maps and Spatial Reasoning Protect Your Brain","source":"Nautilus","author":"","url":"https://nautil.us/taxi-drivers-rarely-die-of-alzheimers-how-complex-mental-maps-and-spatial-reasoning-protect-your-brain-1283501/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1052,"readingTime":6,"content":"<p>Taxi and ambulance drivers are less likely than workers in almost any other job to <a href=\"https://doi.org/10.1136/bmj-2024-082194\" target=\"_blank\" rel=\"noopener\">die of Alzheimer’s disease</a>. That was the surprising result of a 2024 study examining the death certificates of nearly 9 million people in the United States.</p><p>Featured Video</p><p>These findings stopped me in my tracks because those two jobs rely on the same thing as my own work: maps.</p><p>I have spent more than two decades staring at maps. Not paper maps on a wall, but digital ones with multiple layers: flood boundaries draped over census blocks, car crash hot spots plotted against road geometry, and satellite readings of rainfall stitched across river basins. Much of my work as a <a href=\"https://scholar.google.com/citations?user=ZJTicOQAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\">civil and environmental engineer</a> is done through <a href=\"https://theconversation.com/mapping-cemeteries-for-class-how-students-used-phones-and-drones-to-help-a-city-count-its-headstones-273154\" target=\"_blank\" rel=\"noopener\">GIS—that is, geographic information systems</a>. Engineers like me hold several spatial relationships in their minds at once, reasoning about where things sit relative to one another across scales ranging from a city block to a whole watershed.</p><p>I always assumed that spatial reasoning across map layers was purely professional. But that study on taxi and ambulance drivers made me wonder whether all that mental work might be doing something good to the brain.</p><p><strong>Taxi driver brains</strong></p><p>Of the 9 million death certificates from January 2020 to December 2022 that researchers examined, taxi and ambulance drivers had the <a href=\"https://doi.org/10.1136/bmj-2024-082194\" target=\"_blank\" rel=\"noopener\">lowest risk of dying from Alzheimer’s disease</a> out of 443 occupations. After adjusting for age, sex, race, ethnicity, and education, roughly 1 in 100 taxi and ambulance drivers died of Alzheimer’s, compared with 1 in 60 people overall.</p><p>This pattern did not extend to other driving jobs. The researchers concluded that the key to reducing the risk of Alzheimer’s was not driving itself but continuous real-time navigation: the constant work of locating yourself in space, tracking a destination and updating a <a href=\"https://theconversation.com/how-does-your-brain-decide-between-the-road-not-taken-or-the-same-old-route-resolving-conflicting-memories-is-key-to-navigation-279435\" target=\"_blank\" rel=\"noopener\">mental map</a> as conditions change. Drivers whose jobs relied on <a href=\"https://doi.org/10.1136/bmj-2024-082194\" target=\"_blank\" rel=\"noopener\">fixed or predetermined routes</a>, like bus drivers and aircraft pilots, didn’t seem to experience a similar advantage.</p><p>Researchers believe the association between navigation-heavy work and lower Alzheimer’s risk centers on the hippocampus, a part of the brain that governs memory and spatial navigation. It’s one of the first brain regions that Alzheimer’s damages: <a href=\"https://doi.org/10.1038/s41582-018-0031-x\" target=\"_blank\" rel=\"noopener\">Problems with spatial navigation and orientation</a> are among the earliest signs of the disease, sometimes surfacing before obvious memory loss.</p><p>In one landmark 2000 study, neuroscientists compared the brains of licensed London taxi drivers with those of people who did not drive cabs. Their findings provided the first evidence via structural imaging that regions of the <a href=\"https://doi.org/10.1073/pnas.070039597\" target=\"_blank\" rel=\"noopener\">adult brain can measurably change</a> under sustained navigational demand. To earn a license, London cabbies must memorize more than 25,000 streets within a 6-mile radius of Charing Cross, a challenge known as “<a href=\"https://tfl.gov.uk/info-for/taxis-and-private-hire/licensing/learn-the-knowledge-of-london\" target=\"_blank\" rel=\"noopener\">The Knowledge</a>” that takes three to four years.</p><p>The researchers found that London taxi drivers had measurably more gray matter in the posterior hippocampus, a brain area tied to storing large-scale spatial maps. That volume <a href=\"https://doi.org/10.1073/pnas.070039597\" target=\"_blank\" rel=\"noopener\">tracked with experience</a>: The longer someone had driven, the larger that part of the brain. The change was built through practice, not inherited. While people who are good at navigation might gravitate to this kind of job, the job itself does have an impact on the brain.</p><p>Together, these two studies make a coherent case: Work that intensively exercises the hippocampus may reshape it, and that reshaping may protect against one of the most feared diseases of aging.</p><p><strong>Where map specialists fit in</strong></p><p>Cartographers, urban planners, and geospatial analysts spend their working days in sustained spatial reasoning. A geographic information system specialist might use a computer to overlap population data on flood exposure maps to find who is at risk, or read satellite imagery to map land cover after a wildfire. Researchers juggle several layers of data, coordinate systems, and scales at once.</p><p>Does spatial reasoning through a screen engage the hippocampus the way moving through a real city does?</p><p>While a taxi driver navigates from inside the scene at street level, GIS researchers picture space from above as a map—what cognitive scientists call <a href=\"https://doi.org/10.1016/j.tics.2006.10.005\" target=\"_blank\" rel=\"noopener\">allocentric reasoning</a>. But these two perspectives overlap in the brain: The hippocampus also builds maps from outside viewpoints, not just from a navigator’s own position.</p><p>Research on cognitive maps points toward the same conclusion as the study on taxi drivers. In 2023, researchers ran a machine learning model on more than 22,500 people in a national dataset and were able to predict which ZIP codes had higher rates of Alzheimer’s with 84 percent accuracy based on how complex the environment was. Those <a href=\"https://doi.org/10.14283/jpad.2023.18\" target=\"_blank\" rel=\"noopener\">living in spatially complex surroundings</a>—the kind that force active map building, such as dense street networks with numerous intersections, diverse points of interest and landmarks, and multiple path options—were less likely to develop Alzheimer’s.</p><p>A follow-up study tied geospatial complexity in one’s environment to greater volume in the brain’s spatial navigation regions. The researchers hypothesized that routinely building cognitive maps <a href=\"https://doi.org/10.1002/dad2.12551\" target=\"_blank\" rel=\"noopener\">exercises the very circuitry</a> that Alzheimer’s attacks first. Repeatedly engaging the cognitive systems involved in spatial navigation could help delay symptoms of disease.</p><p>However, these two studies focus on where people live, not the work people do. Whether spatial reasoning through a screen exercises the same circuitry as real-life city navigation remains untested.</p><p><strong>Protecting your brain</strong></p><p>The implications of whether sustained spatial reasoning protects the brain reach beyond mapmakers and cab drivers. Studies have repeatedly found a link between mentally complex occupations and <a href=\"https://www.alz.org/getmedia/ba1ae239-1461-44ec-bc20-d297db776739/ph-bold-center-science-summary-education.pdf\" target=\"_blank\" rel=\"noopener\">delayed cognitive decline and lower dementia risk</a>, even after accounting for education.</p><p>Research on <a href=\"https://doi.org/10.1016/S1474-4422(12)70191-6\" target=\"_blank\" rel=\"noopener\">cognitive reserve</a>—the brain’s capacity to continue functioning despite disease—can help explain why two people with a similar disease burden can show markedly different levels of cognitive impairment. If demanding spatial thinking protects the brain, then how societies design schooling, professional training, and retirement all become questions of brain health.</p><p>Spatial reasoning <a href=\"http://dx.doi.org/10.1037/a0028446\" target=\"_blank\" rel=\"noopener\">can be trained</a>, and <a href=\"https://www.aag.org/guide-to-geography-programs-and-opportunities/\" target=\"_blank\" rel=\"noopener\">training opportunities</a> are already widespread. GIS and remote sensing instruction are available through geography, engineering, public health, and environmental science programs worldwide.</p><p>If sustained engagement with spatial reasoning can help the brain strengthen the circuitry that Alzheimer’s attacks first, its value reaches well beyond the technical skills it builds. </p><p><em>This article is republished from <a href=\"https://theconversation.com/\" target=\"_blank\" rel=\"noopener\">The Conversation</a> under a Creative Commons license. Read the <a href=\"https://theconversation.com/taxi-drivers-rarely-die-of-alzheimers-how-complex-mental-maps-and-spatial-reasoning-protect-your-brain-286650\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Tasnuva Elahi; with image by THANANIT / Adobe Stock</em></p>"},{"title":"B&H Photo Promo Codes and Deals This August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/bh-photo-coupon/","category":"tech","categoryLabel":"Technology","wordCount":937,"readingTime":5,"content":"<p>B&amp;H Photo is one of our favorite places to shop for camera gear. If you’re ever in New York, head to the store to check out the giant overhead conveyor belt system that brings your purchase from the upper floors to the registers downstairs (yes, seriously, <a href=\"https://www.youtube.com/watch?v=fZaHxjNRT_E\" target=\"_blank\" rel=\"noopener\">here’s a video</a>). Fortunately B&amp;H Photo’s website is here for the rest of us with some good deals on photo gear we love.</p><h2>Save on the Latest Gear at B&amp;H Photo</h2><p>Nikon’s latest midrange full-frame mirrorless camera offers pro-level features without the pro price.</p><p>B&amp;H Photo has plenty of great deals, including Nikon's brand-new <a href=\"https://cna.st/affiliate-link/FtXebJ4xqVaiKDYeeuzwcimsAHa4fYpmCU6KayHJKte1u8GEuc4FQy4K4UZ3GYHRgafvX4vpdmCrSJhj5VwX1LRXYpcmSohBCheGEJBavkre9uxFmVNjKRRTWp8FuTq3kxgytqqbe4sdHh8bihV8Qu9LbLpnV7zzsa7TUYTxwg643sxzb6QEtwnJuudfrzuHxsDzWatN5Jc3S4J43KrWNpUBbsWLvjwJzLpUZ2JuR7mHsuuyav8K1MMoy8BAKrt1hCBrzFexdTp2DFzxVVVs8V8hg1Pfvj7M1ujxGAN9hn6SfSUyFSWRtnqJz9xP9iu3xm6oGUox2jWMbDPVZMnuTsB4BryyCXwQ4L5\" target=\"_blank\" rel=\"noopener\">Z6III full-frame mirrorless camera for $2,196.95 ($300 off)</a>. The Z6III (<a href=\"https://www.wired.com/review/nikon-z6-iii/\" target=\"_blank\" rel=\"noopener\">8/10, WIRED Recommends</a>) is a huge update for the Z6 line, and a great all-around camera for Nikon fans. There are also great deals like the Nikon Zf (<a href=\"https://www.wired.com/review/nikon-zf-mirrorless-camera/\" target=\"_blank\" rel=\"noopener\">8/10, WIRED Recommends</a>) full frame mirrorless camera for $200 off, or the <a href=\"https://cna.st/affiliate-link/3GxwCCDhdURyr1wTfnAJZHxTVqaEAGnbXnHr4p7nino9gjAarBfDWCqw6QQoCpUGHt2X9C6APUQAW7auFmKBdfhxujCXHFznekoYPWYbUYk1jcCHFM54QBsWs7nDQoSwY2vfXGzyXseHvYLS4k6YbMLxcJZioBEXKJPVZPXp9VvbYsmBduSe5UHKXSw4HT8LsvwnRQrNcsN7sqkop1Saq6ZmELsA1KtCxaZhtSL3BJN2UpW4UzFU5ErQJnMQ2MP3BiG9EJ9xk3QaWcHox2tb4KqXptQV8Sx4KYFFfYBhRe3hkAfxVwdHKT3giRWojxTMLg7ByWgsrdAi1qoeshHwxV1rmRg8ys\" target=\"_blank\" rel=\"noopener\">Nikon Z8 for $600 off</a>.</p><p>Nikon’s latest mirrorless camera might look like it’s from the 1980s, but it offers the same image quality as today’s best.</p><p>Not in the market for the latest Nikon cameras? There are plenty of other deals, like our <a href=\"https://www.wired.com/gallery/best-360-cameras/\" target=\"_blank\" rel=\"noopener\">favorite action camera</a>, the <a href=\"https://cna.st/affiliate-link/28iSGvNLVT39oMQNhCLvk4fP2Pz8wB9Tp5caV2wQwUNvNy54GPBjLcnRciLcR1b5VwhcoDiLZFG7KCh8kirjdSUjFqTAsAu6L2ePUDgqioRbzaLo1ZhdRj49ssHBLYuwJmQ2yjXKwZqD7ECRumLNMxfahGZo8oqFf3Y74uzUEHkCAZ3CvR5BZJTTHVCwaiMmhuSgR1KK4qgxCUNaAbGoyd988ZXf9AvjpaizNbabirKzN6HasCx3mtcKq7DXHt9nxfo2WkNBpfkzpw5axS9C6UN7ELyiR3MuhZnBLc57PpXXUqWjujxFbjVHJNfLYoFQFGq9EfT35B1j1E1CKV1aZF4aDapLr1prTStU5\" target=\"_blank\" rel=\"noopener\">GoPro Hero 13 for $70 off</a> (<a href=\"https://www.wired.com/review/gopro-hero-13-black/\" target=\"_blank\" rel=\"noopener\">7/10, WIRED Recommends</a>), and Sony’s a7R V full frame mirrorless <a href=\"https://cna.st/affiliate-link/hVt5qe48J652wmbzoNkNYi2gb47atzkDQYmhVTKt1QWhpBcEHDVUwKmELMVzNrGPHtgNJGJ3u6NGAdb4UqwhWhC9WoLnrPJML2yDvCbkuGoYGTWRzysteyisj4em6Gj6w3wMm9qpx87fWnPLdL3BwQC2qbwEPzW6G6pSVMUCrSJhQYuZmb7NpmFFvZB4xiBAMkCvcVwZ71apdG8VjQGQ7VmwJmCUtP2dsNNZUL7FBmopjpYoRmYMgWkFkACCaaXzgWYDVLAWBZSNDMTwa4j7HKzjXfF1WyLRzonUZ7v463ksir7B3xEeBfWMZcpNmesjheJ1DSCtH8ouKZWRK\" target=\"_blank\" rel=\"noopener\">camera for $400 off</a>.</p><p>The company's latest action camera finally adds magnetic mounting and interchangeable lenses, but the processor and sensor haven't changed in years.</p><h2>Why a B&amp;H Gift Card Makes the Ultimate Tech Gift</h2><p>Not sure what to get the tech or photography lover in your life this holiday season? A <a href=\"https://www.bhphotovideo.com/find/eGiftCard.jsp\" target=\"_blank\" rel=\"noopener\">B&amp;H gift card</a> is a gift people on your list will actually want. B&amp;H has tech for every person in your life, with hundreds of models of cameras, computers, projectors, and more.</p><h2>How Do I Get Free Shipping at B&amp;H?</h2><p>One of the many perks of B&amp;H Photo is their generous free shipping policy. Most orders at B&amp;H over $49 qualify for free expedited shipping to the lower 48 states. The savings just keep coming, as most items totaling under $49 also qualify for free standard shipping in the contiguous US. If for some reason your order doesn't qualify for free shipping, you can review alternative shipping options during checkout—full shipping policy details can be found <a href=\"https://www.bhphotovideo.com/find/HelpCenter/Shipping.jsp\" target=\"_blank\" rel=\"noopener\">here</a>.</p><p>DJI</p><h3>Osmo Action 6</h3><p>DJI</p><h3>Osmo Action 5 Pro</h3><h2>Best Times to Find B&amp;H Promo Codes and Discounts</h2><p>Like most retailers, B&amp;H Photo offers some of their best deals of the year during Black Friday and Cyber Monday, but that doesn’t mean there aren’t other ways to save outside of this sale period. There’s still time to jump on extended holiday sales, with up to $300 24-hour camera discounts, and featured price drops across all accessories. While there may not be any B&amp;H promo codes available at the moment, there are plenty of other ways to save at B&amp;H.</p><p>Insta360</p><h3>Go Ultra Action Camera</h3><p>HoverAir</p><h3>X1 ProMax</h3><h2>Exclusive B&amp;H Student Discounts</h2><p>If you’re a student with an EDU email, sign up for <a href=\"https://www.bhphotovideo.com/find/eduAdvantage.jsp\" target=\"_blank\" rel=\"noopener\">B&amp;H Photo’s student discount program</a>, which offers free shipping on most orders and exclusive discounts.</p><h2>Score Deals on Used and Refurbished Gear</h2><p>B&amp;H Photo also deals in <a href=\"https://www.bhphotovideo.com/c/browse/Used-Equipment/ci/2870/N/4294247188\" target=\"_blank\" rel=\"noopener\">used and refurbished gear.</a> Deals (and conditions) vary, but if you’re looking to save some money, that’s a solid way to go. You can have peace of mind buying secondhand at B&amp;H, because they only sell used equipment that has been tested and proved to be in good working order, as each gadget is tested by expert evaluators to ensure each’s functionality. Plus, there's a 30-day return policy and a 90-day parts and labor warranty. And if you’d rather sell and trade in your used (but functioning) tech, B&amp;H Photo has a hassle-free trade-in program offering competitive prices.</p><p>Ricoh</p><h3>GR IV</h3><p>Leica</p><h3>Q3</h3><h2>Save More With B&amp;H Photo Deal Zone</h2><p>The <a href=\"https://www.bhphotovideo.com/deals-promotions-coupons\" target=\"_blank\" rel=\"noopener\">B&amp;H Photo Deal Zone</a> is one of the best ways to save on your camera and tech purchases. With new, rotating deals updated and added everyday, this is the place to find the best, limited-time prices on B&amp;H Photo gear. Whether you’re in the market for a discounted Lenovo tablet or a Logitech wireless mouse, B&amp;H Photo has the best deals online in one place, making shopping for discounted tech easier than ever.</p><p>Sony</p><h3>A7V Mirrorless Camera</h3><p>Nikon</p><h3>Z5II Camera</h3><h2>Trade-in Your Old Gear at B&amp;H</h2><p>The flip side of B&amp;H Photos used deals is that you can <a href=\"https://www.bhphotovideo.com/find/trade-in.jsp\" target=\"_blank\" rel=\"noopener\">sell your old gear</a>. I put in my old Sony a7 II and was offered $210, which is more than I would have thought. Your offer is contingent on it matching the condition you claim, but if you’ve got gear you aren’t using anymore, this is a way to turn it into some extra cash.</p><p>Sony</p><h3>A7RV</h3><p>Fujifilm</p><h3>Instax Mini Evo</h3><h2>FAQs</h2><p>Does B&amp;H Price Match?</p><p>Yes, you’re in luck! B&amp;H has a price match guarantee against major authorized retailers (like Adorama or Best Buy) for identical, in-stock items.</p><p>Are B&amp;H's \"Used\" and \"Open-Box\" Deals Worth it?</p><p>B&amp;H grades use gear ratings like \"8/10\" or \"9/10\" condition, and often include a warranty period, making it an easy way to get name-brand equipment below new pricing.</p><p>What Is B&amp;H's Return Policy?</p><p>Most items can be returned within 30 days in original condition, just make sure you check the fine print.</p><p>When Are B&amp;H's Biggest Sale Events?</p><p>Make sure you check back often during holidays, like Black Friday/Cyber Monday, Presidents' Day, and manufacturer-driven promotions (Sony, Canon, Nikon rebate periods), which typically offer the biggest discounts.</p>"},{"title":"Supreme Court Term to Start Hot","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/08/06/supreme-court-term-to-start-hot/","category":"law","categoryLabel":"Law","wordCount":625,"readingTime":4,"content":"<p><a href=\"https://www.supremecourt.gov/docket/docketfiles/html/public/25-170.html\" target=\"_blank\" rel=\"noopener\"><em>Suncor Energy (USA), Inc. v. County Commissioners of Boulder County</em></a>, the dispute over whether federal law preempts claims against fossil fuel companies for alleged harms from climate changes exacerbated by the companies' alleged conduct, will be the very first case heard by the Supreme Court <a href=\"https://www.supremecourt.gov/oral_arguments/argument_calendars/MonthlyArgumentCalOctober2026.pdf\" target=\"_blank\" rel=\"noopener\">this October</a>.</p>  <p><em>Suncor</em> is obviously an important environmental case, but its significance is far broader. If the claims are allowed to proceed--and if the plaintiffs are able to overcome the other hurdles to making their case (a significant if)--quite a bit of money could be at stake. In addition, if the justices reach the merits, the case could dramatically alter the law of federal preemption.</p> <p>Given the significance of the case, it should be no surprise that waves of amici filed briefs. By my count, there are forty top-side briefs supporting the fossil-fuel companies' preemption claims, including a brief by the Solicitor General. There are also twenty-eight bottom-side briefs arguing against preemption (including <a href=\"https://reason.com/volokh/2026/08/03/amicus-brief-in-suncor-energy-v-county-commissioners-of-boulder-county/\" target=\"_blank\" rel=\"noopener\">mine</a>).</p> <p>Most discussion of the case--and, indeed, many of the amicus briefs--focus on the policy context. Accordingly, folks who want urgent action to address climate change tend to support the respondents, and those who are skeptical of such policies (or who are concerned about energy prices), support the petitioners. This is understandable, but threatens to obscure the underlying legal issues, as does conspiratorial talk about what shadowy interests are supporting one side or the other.</p> <p>As I try to show in <a href=\"https://reason.com/volokh/2026/08/03/amicus-brief-in-suncor-energy-v-county-commissioners-of-boulder-county/\" target=\"_blank\" rel=\"noopener\">my brief</a>, there is no statute or precedent that supports wholly preempting these cases. This does not mean the claims should succeed, nor does it mean there are no constitutional or other grounds to force a narrowing of the claims. But those other grounds are not encompassed by the question presented and are not being advanced by the petitioners. What is before the Court is whether federal law or the constitution wholly precludes bringing claims under state-law for interstate harms of the sort alleged here. It is a narrow question. It is also one that I think is relatively easy and straightforward. We will see if a majority of the Court agrees.</p>  <p>For those interested, here are my prior posts on this subject:</p> <ul> <li><a href=\"https://reason.com/volokh/2021/10/27/why-state-common-law-nuisance-claims-against-fossil-fuel-companies-are-not-preempted/\" target=\"_blank\" rel=\"noopener\">Why State Common Law Nuisance Claims Against Fossil Fuel Companies Are Not Preempted</a>, Oct. 27, 2021;</li> <li><a href=\"https://reason.com/volokh/2022/08/17/third-circuit-rejects-oil-company-efforts-to-remove-climate-claims-to-federal-court/\" target=\"_blank\" rel=\"noopener\">Third Circuit Rejects Oil Company Efforts to Remove Climate Claims to Federal Court</a>, Aug. 17, 2022;</li> <li><a href=\"https://reason.com/volokh/2023/03/25/oil-companies-fail-to-convince-the-eighth-circuit-climate-cases-should-be-removed-to-federal-court/\" target=\"_blank\" rel=\"noopener\">Oil Companies Fail to Convince the Eighth Circuit Climate Cases Should Be Removed to Federal Court (Updated)</a>, Mar. 25, 2023;</li> <li><a href=\"https://reason.com/volokh/2023/12/11/is-climate-change-going-back-to-the-supreme-court-minnesota-edition/\" target=\"_blank\" rel=\"noopener\">Is Climate Change Going Back to the Supreme Court? (Minnesota Edition) [UPDATED]</a>, Dec. 11, 2023;</li> <li><a href=\"https://reason.com/volokh/2023/12/19/d-c-circuit-rejects-oil-company-attempt-to-remove-districts-climate-suit-to-federal-court/\" target=\"_blank\" rel=\"noopener\">D.C. Circuit Rejects Oil Company Attempt to Remove District's Climate Suit to Federal Court</a>, Dec. 19, 2023;</li> <li><a href=\"https://reason.com/volokh/2023/12/26/william-barr-responds-on-american-petroleum-institute-v-minnesota/\" target=\"_blank\" rel=\"noopener\">William Barr Responds on American Petroleum Institute v. Minnesota</a>, Dec. 26, 2023;</li> <li><a href=\"https://reason.com/volokh/2024/01/08/supreme-court-takes-a-pass-on-minnesota-climate-change-case/\" target=\"_blank\" rel=\"noopener\">Supreme Court Takes a Pass on Minnesota Climate Change Case</a>, Jan. 8, 2024;</li> <li><a href=\"https://reason.com/volokh/2024/05/03/are-state-law-climate-change-tort-suits-preempted-by-federal-law/\" target=\"_blank\" rel=\"noopener\">Are State Law Climate Change Tort Suits Preempted by Federal Law?</a>, May 3, 2024;</li> <li><a href=\"https://reason.com/volokh/2025/01/13/supreme-court-denies-certiorari-in-climate-tort-suits/\" target=\"_blank\" rel=\"noopener\">Supreme Court Denies Certiorari in Climate Tort Suits</a>, Jan. 13, 2025;</li> <li><a href=\"https://reason.com/volokh/2025/03/10/supreme-court-rejects-red-state-attempt-to-sue-blue-states-over-climate-suits/\" target=\"_blank\" rel=\"noopener\">Supreme Court Rejects Red State Attempt to Sue Blue States Over Climate Suits</a>, Mar. 10, 2025;</li> <li><a href=\"https://reason.com/volokh/2025/11/03/william-barr-discovers-the-economics-of-tort-law-and-misrepresents-the-law-governing-interstate-pollution/\" target=\"_blank\" rel=\"noopener\">William Barr Discovers the Economics of Tort Law (and Misrepresents the Law Governing Interstate Pollution)</a>, Nov. 3, 2025;</li> <li><a href=\"https://reason.com/volokh/2025/11/07/placing-climate-tort-litigation-in-context/\" target=\"_blank\" rel=\"noopener\">Placing Climate Tort Litigation in Context (Updated)</a>, Nov. 7, 2025;</li> <li><a href=\"https://reason.com/volokh/2025/12/02/a-second-round-with-william-barr-on-litigation-over-interstate-pollution/\" target=\"_blank\" rel=\"noopener\">A Second Round with William Barr on Litigation Over Interstate Pollution</a>, Dec. 2, 2025;</li> <li><a href=\"https://reason.com/volokh/2026/02/04/court-dismisses-trump-administration-effort-to-block-michigan-climate-lawsuit/\" target=\"_blank\" rel=\"noopener\">Court Dismisses Trump Administration Effort to Block Michigan Climate Lawsuit</a>, Feb. 4, 2026</li> <li><a href=\"https://reason.com/volokh/2026/02/23/climate-change-goes-back-to-the-supreme-court-colorado-edition/\" target=\"_blank\" rel=\"noopener\">Climate Change Goes Back to the Supreme Court -- Colorado Edition</a>, Feb. 23, 2026.</li> <li><a href=\"https://reason.com/volokh/2026/03/06/previewing-suncor-energy-v-boulder-county/\" target=\"_blank\" rel=\"noopener\">Previewing <em>Suncor Energy v. Boulder County</em></a>, Mar. 6, 2026.</li> <li><a href=\"https://reason.com/volokh/2026/08/03/amicus-brief-in-suncor-energy-v-county-commissioners-of-boulder-county/\" target=\"_blank\" rel=\"noopener\">Amicus Brief in Suncor Energy v. County Commissioners of Boulder County</a>, Aug. 3, 2026.</li> </ul>"},{"title":"John Romero says id Software once sold empty Doom boxes to Taiwanese pirates so fans there could have legit copies: 'For us, it was distribution'","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/fps/john-romero-says-id-software-once-sold-empty-doom-boxes-to-taiwanese-pirates-so-fans-there-could-have-legit-copies-for-us-it-was-distribution/","category":"gaming","categoryLabel":"Gaming","wordCount":672,"readingTime":4,"content":"<p>Doom, one of the most influential videogames of all time, was famously distributed via the shareware model: The game's first chapter was completely free, and if you liked it, you sent id Software some money and they mailed you the remaining two episodes.</p><p>What would sometimes happen in those pre-online days, though, is that less-than-scrupulous resellers would offer the shareware version for sale, even though it was meant to be free. For $5 (or whatever, it's been a while), you could take home the <em>hot new shooter from the guys who made Wolfenstein</em>—and sure, you weren't getting the whole thing, but whatever. It's still Doom. Do you want to play it or not?</p><p>You might think that id Software would take issue with people making money on their work while they received nothing, but speaking at QuakeCon today, studio co-founder John Romero said the opposite was true: They were happy to see it happen.</p><p>\"Please do it. Don't give us any money. Just get it out there,\" Romero said about people who made and sold the shareware version of Doom on floppies. \"You would go to the store and you would see 10 different boxes that all had the same shareware Doom in it. <em>I don't care.</em> Give it to everybody, get it out there.</p><p>\"We were totally happy with that. We were doing so much work just getting the game out. We knew in Taiwan that they were copying it: 100%, that was the market back then. So we contacted the biggest pirates there and went, 'Can you buy boxes from us? Really cheap. Really really cheap.' So they bought tons of boxes off of us, so it would be legitimate.</p><p>\"Get it out there, make them feel good. We made money when people would actually order the rest of the game. We didn't try to make money off the shareware [version].\"</p><p>Romero said id viewed it as simply a form of distribution—because again, this was years before the ubiquity of the internet, and most gamers didn't have easy access to this stuff, as we explored in <a href=\"https://www.pcgamer.com/mail-trucks-and-millions-of-dollars-how-shareware-transformed-pc-gaming-forever/\" target=\"_blank\" rel=\"noopener\">our feature on how shareware transformed PC gaming forever</a>.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Doom and other shareware games were available on BBSes, but that meant two things: You had to make a potentially lengthy (and expensive) long distance phone call if you didn't happen to live close enough to a distribution board, and worse, you had to be one of those computer nerd weirdos who actually owned a modem. Believe me, there were not many of us back then. So, dodgy as they might have been, those not-entirely-legit disk-in-a-box distributions were good for id Software and gamers alike.</p><p>That attitude also informed the studio's approach to copy protection, which is something it just didn't bother with.</p><p>\"There's always been a war that's never been won with copy protection, and we didn't want to waste our time with that,\" Romero said. \"If people are going to copy it, they're going to copy it. They might buy it some time later, but—we didn't have money for everything we were playing, so we're like, let's not copy protect it. If people want to play it, they can still figure out how to play it.\"</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"}];
