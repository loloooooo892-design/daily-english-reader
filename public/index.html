*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  flex-wrap: wrap;

}

}

}

<script>
var articles = [{"title":"'I feel like we've built a pyramid on Everest' says Rockstar of GTA 6 meeting impossible expectations","source":"PC Gamer","author":"Morgan Park","url":"https://www.pcgamer.com/games/grand-theft-auto/i-feel-like-weve-built-a-pyramid-on-everest-says-rockstar-of-gta-6-meeting-impossible-expectations/","category":"gaming","categoryLabel":"Gaming","wordCount":551,"readingTime":3,"content":"<p>It is not hyperbole to say that <a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">GTA 6</a> is the most anticipated videogame of all time. That'll happen when one of the most acclaimed game developers of all time takes 13 years to finally put out a new game in one of the most popular series of all time.</p><p>That's a hell of a lot of pressure for the army of developers at Rockstar. In a conversation with our friends at Edge for <a href=\"https://www.gamesradar.com/edge/gtavi-cover/\" target=\"_blank\" rel=\"noopener\">the magazine's big inside look at GTA 6</a>, Rockstar North head of development Aaron Garbut spoke about meeting the series' absurd standards.</p><p>\"We can't just trot out something that's what people might expect, or that was the easy thing to do,\" he says. \"We've not compromised on the scale, the detail, the interactivity, the story, the open world.\"</p><p>Despite the studio's famously secretive posture, Garbut says the team is very much aware of the galactic expectations, and deployed an illustrative metaphor to communicate how he thinks they've managed to meet them.</p><p>\"I feel like we've built a pyramid on Everest.\"</p><p>While my mind instantly goes to an eventual GTA 6 mod that'll let me ride a giant pyramid down the biggest mountain in Leonida (will fake Florida have mountains?), I have little reason to doubt Garbut's claims here. Impressions, leaks, and Rockstar's own communications suggest that GTA 6 is doubling down on the systemic details that elevated <a href=\"https://www.pcgamer.com/red-dead-redemption-2-review/\" target=\"_blank\" rel=\"noopener\">Red Dead Redemption 2</a> from 'GTA with horses' to a crime-forward life sim.</p><p>That game's missions were Rockstar's familiar brand of organized crime, but the things you spent time doing between them were quite new for a mainstream game: Eating, drinking, grooming yourself, camping, browsing, and making small talk with locals. These actions often had some gameplay ramifications, but it was common to perform because it felt like the human thing to do.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Grand Theft Auto has experimented with these little human exercises for a long time—eating healthy in San Andreas, going on dates in GTA 4—but Rockstar's aims for GTA 6 sound like we'll be making little choices like this constantly. Maybe they'll end up being overboard for some, but I for one can't wait to set out on a mission and realize I need to <a href=\"https://www.pcgamer.com/games/grand-theft-auto/gta-6-cars-need-gas-ok-im-finally-on-board/\" target=\"_blank\" rel=\"noopener\">stop for gas</a>.</p><p>There's still no announced PC release date for GTA 6. <a href=\"https://www.pcgamer.com/games/grand-theft-auto/report-claims-grand-theft-auto-6-will-launch-on-pc-sooner-than-anyone-expected/\" target=\"_blank\" rel=\"noopener\">Rumor has it</a> that it won't be a long wait, but we'll believe it when we see it. Rockstar usually puts at least seven months between console and PC versions, and it took a year-and-a-half for <a href=\"https://www.pcgamer.com/grand-theft-auto-5/\" target=\"_blank\" rel=\"noopener\">GTA 5</a> to come to PC.</p>\n\n<p>Morgan has been writing for PC Gamer since 2018, first as a freelancer and currently as a staff writer. He has also appeared on Polygon, Kotaku, Fanbyte, and PCGamesN. Before freelancing, he spent most of high school and all of college writing at small gaming sites that didn't pay him. He's very happy to have a real job now. Morgan is a beat writer following the latest and greatest shooters and the communities that play them. He also writes general news, reviews, features, the occasional guide, and bad jokes in Slack. Twist his arm, and he'll even write about a boring strategy game. Please don't, though.</p>"},{"title":"The R2 SUV is already Rivian’s best-selling vehicle","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/10/29/the-r2-suv-is-already-rivians-best-selling-vehicle/","category":"tech","categoryLabel":"Technology","wordCount":566,"readingTime":3,"content":"<p>Rivian’s new R2 SUV was its best-selling vehicle in the third quarter, the company said Thursday, marking an auspicious start for the all-important EV.  </p>\n<p>While Rivian didn’t say exactly how many R2s it sold over the three-month period, the company is confident enough in the pace of sales that it raised its delivery guidance for Wall Street. Rivian had previously expected to deliver between 65,000 and 70,000 EVs this year. On Thursday, it bumped up that floor to 67,000.</p>\n<p>It’s the second time Rivian has raised its delivery guidance this year, and the company is now on track to break a three-year stalemate during which it struggled to ship more than 50,000 vehicles annually. The company launched the R2 just in June, but it has made a major bet on scaling production of <a href=\"https://techcrunch.com/2026/03/05/rivian-is-betting-its-future-one-of-the-fastest-ev-launches-in-us-history/\" target=\"_blank\" rel=\"noopener\">the lower-cost SUV at a historically quick rate.</a></p>\n<p>The early success of the R2 is also a sign that Rivian is finding new customers despite last year’s loss of the $7,500 federal EV tax credit. The death of that tax credit, along with changes made by the Trump administration to U.S. regulations that supported the growth of EVs, has caused many major automakers to shift their attention back to internal combustion and hybrid vehicles — leaving room in the market for pure-EV companies like Tesla and Rivian.</p>\n<p>“In a U.S. automotive marketplace starved for high-quality EV choice, R2 is an attractively priced option for everyday adventures that is resonating with a broad set of consumers and we expect will be a game changer for Rivian’s long-term growth and profitability,” the company said in a letter to shareholders released Thursday. </p>\n<p>Rivian revealed earlier this month that it built 19,751 vehicles in the third quarter and delivered 19,248. That was roughly 45% more than it delivered in the same period last year and a big jump from the 12,613 vehicles built and 12,194 delivered in the second quarter of 2026. The increase was driven in large part by the company launching a second production shift at its factory in Normal, Illinois.</p>\n<p>Rivian said Thursday that the R2 was responsible for “much of the gain quarter-over-quarter,” but didn’t go into specifics. The company generated $2.2 billion in revenue in the third quarter and suffered a net loss of $913 million — down from $1.2 billion in the same period last year.</p>\n<p>Rivian launched the R2 at a starting price of just under $60,000. A more affordable “premium” trim is supposed to be available later this year that starts at $53,990. Even cheaper versions are slated for 2027, which will be available for as low as $44,990.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Sean O’Kane is a reporter who has spent a decade covering the rapidly-evolving business and technology of the transportation industry, including Tesla and the many startups chasing Elon Musk. Most recently, he was a reporter at Bloomberg News where he helped break stories about some of the most notorious EV SPAC flops. He previously worked at The Verge, where he also covered consumer technology, hosted many short- and long-form videos, performed product and editorial photography, and once nearly passed out in a Red Bull Air Race plane.</p>\r\n<p>You can contact or verify outreach from Sean by emailing <a href=\"https://techcrunch.com/cdn-cgi/l/email-protection#e09385818ece8f8b818e85a0948583888392958e8388ce838f8d\" target=\"_blank\" rel=\"noopener\">[email protected]</a> or via encrypted message at okane.01 on Signal.</p>\t\n<p>\n\t<a href=\"https://techcrunch.com/author/sean-okane/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"},{"title":"Your Cells Keep a Record of Every Workout You’ve Ever Done - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/your-cells-keep-a-record-of-every-workout-youve-ever-done-1286173/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1062,"readingTime":6,"content":"<p>Have you ever taken months off training—maybe due to an injury, a new baby, or crushing work deadlines—and come back convinced you were starting from zero?</p><p>Research from <a href=\"https://publish.illinois.edu/hernandez-saavedra/\" target=\"_blank\" rel=\"noopener\">our team</a> has some good news: At the cellular level, you probably weren’t.</p><p>We found that muscle and liver cells <a href=\"https://doi.org/10.1152/ajpcell.00451.2025\" target=\"_blank\" rel=\"noopener\">store memories from</a> <a href=\"https://doi.org/10.1016/j.molmet.2026.102418\" target=\"_blank\" rel=\"noopener\">every training session</a> in ways that may help improve endurance, control blood sugar levels, and even slow weight regain after inactivity.</p><h2>Use it or lose it? Maybe not</h2><p>For most of the past century, long before fad diets and fancy workout trends took off, exercise was considered one of the <a href=\"https://doi.org/10.1001/jama.2018.14854\" target=\"_blank\" rel=\"noopener\">most effective lifestyle changes</a> to lower the risk of heart disease, Type 2 diabetes, several cancers and early death for people of all ages. But people typically understood exercise as something whose beneficial effects fade away over time: You use it or lose it.</p><p>When you stop training, your maximum oxygen uptake, muscle gains and insulin sensitivity <a href=\"https://doi.org/10.3389/fphys.2023.1334766\" target=\"_blank\" rel=\"noopener\">drift back to where they started</a>, often within weeks. <a href=\"https://odphp.health.gov/our-work/nutrition-physical-activity/physical-activity-guidelines/current-guidelines\" target=\"_blank\" rel=\"noopener\">Physical activity guidelines</a> are built on this fact, which is why they emphasize consistency above all else.</p><p>Consistency, however, is a luxury that roughly <a href=\"http://dx.doi.org/10.15585/mmwr.mm7204a1\" target=\"_blank\" rel=\"noopener\">3 in 4 American adults aren’t able to enjoy</a>. People can experience injuries, illness, pregnancy or jobs that limit their time for or ability to exercise. If adaptation really resets, every time you step into the gym would be as if you’ve never been there before. But that scenario doesn’t match what coaches and returning athletes typically describe: In practice, people who have trained before can <a href=\"https://doi.org/10.1038/s41598-018-20287-3\" target=\"_blank\" rel=\"noopener\">get fit again faster</a> than those who haven’t undergone similar training.</p><p>In recent years, however, scientists have started challenging the concept of “use it or lose it.” New research hints that your cells might <a href=\"https://doi.org/10.1152/ajpcell.00423.2024\" target=\"_blank\" rel=\"noopener\">keep a record of your training history</a> so all of your gains are not completely lost.</p><h2>More than muscle</h2><p><a href=\"https://www.researchgate.net/profile/Yi-Heng-Huang\" target=\"_blank\" rel=\"noopener\">We are</a> <a href=\"https://scholar.google.com/citations?hl=en&amp;user=Gv0CkeMAAAAJ\" target=\"_blank\" rel=\"noopener\">exercise physiologists</a> who study how cells remember exercise. <a href=\"https://publish.illinois.edu/hernandez-saavedra/\" target=\"_blank\" rel=\"noopener\">Our lab</a> and others have shown that the body is able to store a form of exercise memory across different organs.</p><p>To study how this exercise memory works, our team of researchers use an <a href=\"https://doi.org/10.1002/jcsm.12617\" target=\"_blank\" rel=\"noopener\">ON-OFF-ON exercise training protocol</a> in mice, which involves an initial four- to eight-week training period, followed by detraining—a period of no exercise—and a second training bout. This method allows us to examine how cells form a memory of exercise, maintain a record of exercise through detraining, and recall memories of prior training when exposed again to exercise.</p><p>Using this strategy, our team found that <a href=\"https://doi.org/10.1152/ajpcell.00451.2025\" target=\"_blank\" rel=\"noopener\">skeletal muscle memory accelerates muscle growth</a>. Compared to mice with no training history, mice who retrained grew bigger muscles, and the individual muscle fibers inside those muscles grew too. Larger muscle fibers meant that the working cells were themselves getting bigger, rather than the surrounding tissue.</p><p>Looking more closely at these muscle cells, we found that retrained muscle is <a href=\"https://doi.org/10.1152/ajpcell.00451.2025\" target=\"_blank\" rel=\"noopener\">better at matching energy production to demand</a>—meaning, the muscles were better at drawing from energy stores when it’s needed most—and this ability persists without further exercise. This memory held even when the mice ate a high-fat diet, suggesting that prior training can still offer benefits even when diet is working against those gains.</p><p>Muscle isn’t the only body part that learns from exercise. Working muscle needs fuel, and the liver supplies it during and after training sessions.</p><p>My colleagues and I found that <a href=\"https://doi.org/10.1016/j.molmet.2026.102418\" target=\"_blank\" rel=\"noopener\">liver cells also store exercise memory</a> and uses it to feed muscle more efficiently. In both mice and people who trained, stopped, then trained again, their livers released higher levels of a family of <a href=\"https://doi.org/10.1007/s13238-017-0437-z\" target=\"_blank\" rel=\"noopener\">enzymes called carboxylesterases</a>. These enzymes chop up lipids circulating in the blood, delivering fat in a form that muscle can take up and burn as it grows.</p><h2>A record that outlives you</h2><p>Recorded cellular memories of exercise may even be passed down to future generations.</p><p>In mice, we found that three to four weeks of maternal and paternal endurance exercise can <a href=\"https://doi.org/10.2337/db22-0341\" target=\"_blank\" rel=\"noopener\">have a lasting effect on their offspring</a>. Compared to offspring born to sedentary parents, parental exercise granted protection against poor blood sugar levels and excess weight gain for an entire year after birth.</p><p>Researchers have hypothesized numerous ways that prenatal exercise may affect offspring. For example, maternal exercise might allow offspring to <a href=\"https://doi.org/10.1016/j.cmet.2021.03.004\" target=\"_blank\" rel=\"noopener\">spend more time developing in the womb</a> or lead parents to <a href=\"https://doi.org/10.1186/s13006-026-00857-2\" target=\"_blank\" rel=\"noopener\">producer higher quality milk</a>.</p><p>But there remains much to be discovered on how parents influence the health of their children and whether their lifestyle could provide a fitness advantage across generations.</p><h2>Every cell remembers</h2><p>Biology has traditionally granted memory to a short list of cells. <a href=\"https://theconversation.com/where-are-memories-stored-in-the-brain-new-research-suggests-they-may-be-in-the-connections-between-your-brain-cells-174578\" target=\"_blank\" rel=\"noopener\">Neurons store memory</a> in the connections between them. <a href=\"https://theconversation.com/immune-cells-can-adapt-to-invading-pathogens-deciding-whether-to-fight-now-or-prepare-for-the-next-battle-223523\" target=\"_blank\" rel=\"noopener\">Immune cells store memory</a> so they can recognize pathogens faster and more strongly the next time they encounter them.</p><p>Researchers previously <a href=\"https://doi.org/10.1038/s41586-022-04919-3\" target=\"_blank\" rel=\"noopener\">considered all other cells to be memoryless</a>; a cell responds to a signal, then returns to baseline without keeping a record of that interaction. But that assumption is now coming apart.</p><p><a href=\"https://doi.org/10.1038/nature24271\" target=\"_blank\" rel=\"noopener\">Skin stem cells</a> can keep a record of inflammation, allowing them to heal a new wound faster months later. <a href=\"https://doi.org/10.1038/s41586-024-08165-7\" target=\"_blank\" rel=\"noopener\">Human fat cells</a> keep a record of obesity that persists even after substantial weight loss, which may account for why you gain weight faster when switching back to a high-calorie diet—the so-called <a href=\"https://theconversation.com/is-yo-yo-dieting-bad-for-you-heres-what-the-latest-research-shows-278932\" target=\"_blank\" rel=\"noopener\">yo-yo effect</a>.</p><p>We propose that every cell in the body remembers exercise, regardless of how little or how much someone trains. The question is how long these records are stored and whether researchers could prolong or expand each cell’s storage capacity. Better understanding of how cells learn and remember exercise, where they store memories and how those memories are preserved could help improve exercise guidelines for those who cannot exercise for prolonged or consistent periods of time.</p><p>To be clear, none of these findings are evidence for skipping the gym; nothing in our data suggests the effects of past training can substitute for present training. But there is hope that the work you put into getting in shape isn’t completely lost over time.</p><p>Somewhere, deep in your cells, there is a record waiting to be replayed the next time you lace up your running shoes, pick up a pair of dumbbells or want to fulfill a New Year’s resolution. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/your-cells-keep-a-record-of-every-workout-youve-ever-done-and-those-gains-persist-even-after-a-break-from-exercise-291243\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/your-cells-keep-a-record-of-every-workout-youve-ever-done-and-those-gains-persist-even-after-a-break-from-exercise-291243\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Shutterstock</em></p>"},{"title":"Bob Woodward Reveals He Spoke With Justices Stewart, Powell, White, Blackmun, and Rehnquist for \"The Brethren\"","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/10/26/bob-woodward-reveals-he-spoke-with-justices-stewart-powell-white-blackmun-and-rehnquist-for-the-brethren/","category":"law","categoryLabel":"Law","wordCount":1361,"readingTime":7,"content":"<h2><a href=\"https://reason.com/volokh/2026/10/26/bob-woodward-reveals-he-spoke-with-justices-stewart-powell-white-blackmun-and-rehnquist-for-the-brethren/\" target=\"_blank\" rel=\"noopener\">Bob Woodward Reveals He Spoke With Justices Stewart, Powell, White, Blackmun, and Rehnquist for \"The Brethren\"</a>\n\t\t\t\t\t<p>Steven Goldberg, one of Brennan's clerks, provided Woodward with the 75-page case history of U.S.v. Nixon.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t10.26.2026 12:01 PM\n</p>\n\t</h2>\n\t\n\t\t<p>Bob Woodward is publishing a new book, titled \"Secrets,\" that reveals many of the reporter's sources. The Washington Post has published an <a href=\"https://www.washingtonpost.com/investigations/2026/10/26/bob-woodward-spills-secrets-his-journalism-career-new-memoir/\" target=\"_blank\" rel=\"noopener\">in-depth profile</a>.</p>\n<p>Of special interest are the sources Woodward relied on with Scott Armstrong for <em>The Brethren </em>(1979).</p>\n<blockquote>\n\n<p>In the memoir, Woodward clears up another decades-long mystery: Which Supreme Court justices talked to him for the 1979 bestseller \"The Brethren\"? The exposé of the inner workings of the nation's highest court under Chief Justice Warren Burger electrified Washington.</p>\n<p>When the book was published, Woodward and his co-author, Scott Armstrong, disclosed that <a href=\"https://www.washingtonpost.com/archive/politics/1979/12/09/five-brethren-helped-authors/a4d40090-f968-4132-a0db-b8134671e8e8/\" target=\"_blank\" rel=\"noopener\">they had interviewed five of the nine justices</a> on the court, as well as 170 former law clerks, but on the condition that they not be named. Given the court's reputation for maintaining a Sphinxlike silence, \"The Brethren\" ignited a guessing game in Washington and in legal circles around the country, as well as criticism over the book's heavy reliance on anonymous sources.</p>\n\n<p>\"Our use of unnamed sources was a huge point of controversy for the book, but in my 55 years of reporting experience, people rarely shared secrets on the record, particularly at the time something is going on,\" Woodward writes in his memoir.</p>\n<p>Nearly a half-century later, Woodward finally names the five justices who granted interviews: Potter Stewart, Lewis Powell, Byron White, Harry Blackmun and William Rehnquist (all are now deceased). Woodward's memoir explains how he and Armstrong painstakingly cultivated the justices and their former clerks as sources. The authors kept long memos about the interviews, which Woodward draws on to quote the justices at length in his new book.</p>\n</blockquote>\n<p>It is curious that Woodward's sources were all the conservatives on the Court. (During the late 1970s, even after <em>Roe v. Wade</em>, Blackmun was still considered a conservative.) Woodward apparently did not talk with Justices Brennan, Marshall, or Stevens. Indeed, throughout the entire WaPo piece, nearly every one of Woodward's sources were conservatives. (I'll go through more of them below). I wonder what Chief Justice Burger would think if he knew that the other three Nixon appointees were the sources of the leaks.</p>\n<p>Yet, even if Brennan did not talk directly to Woodward, one of Brennan's clerks leaked the critical document about the Watergate Tape Case. Steven Goldberg clerked for Brennan during the 1974-75 Term. Goldberg's co-clerk was Judge Marsha Berzon.</p>\n<blockquote>\n\n<p>Woodward also tells the story of how got his hands on an internal Supreme Court document that was a cornerstone of \"The Brethren\": a confidential 75-page case history chronicling the justices' tense deliberations in U.S. v. Nixon. In an 8-0 decision, the court ruled in the 1974 landmark case that Nixon had to turn over his secret tape recordings in response to a federal subpoena and that, most importantly, the president is not above the law.</p>\n<p>In \"Secrets,\" Woodward writes that he learned about the existence of the case history from Steven P. Goldberg, a former Supreme Court law clerk who died in 2010. But Goldberg was adamant: He couldn't possibly give Woodward a copy.</p>\n<p>Woodward wheedled and coaxed and pleaded. Despite Goldberg's repeated protestations, Woodward talked the clerk into letting him pay a visit to his home late that night.</p>\n<p>Goldberg still refused to cough up the document, however, so Woodward suggested a compromise: How about you read it aloud while I take notes?</p>\n\n<p>\"My plan was to wear him out until I either had enough of it down or he eventually gave it to me,\" Woodward recalls.</p>\n<p>With a sigh, Goldberg started reading from a comfortable living room chair. Woodward smiled and took notes — but he did so very, very slowly and kept asking Goldberg to pause.</p>\n\n<p>After a while, Goldberg fell deeply asleep. Woodward contemplated grabbing the case history from his lap and bolting out the front door, but \"that seemed a little too far, even for me,\" he recalls.</p>\n<p>Instead, he walked over to Goldberg, gave him a slight nudge and informed him that he would take the document and bring it back first thing in the morning.</p>\n\n<p>Goldberg stirred with a look of \"absolute exhaustion\" on his face, according to the memoir. But the former clerk mumbled okay — and that was good enough for Woodward.</p>\n<p>\"Not wanting to disturb him more, I gently took it. I did not want to run out the door but I moved swiftly,\" he writes. \"If I was on a security camera, I wanted to be behaving properly, with whatever might be left of my dignity.\"</p>\n\n<p>Woodward scampered home to read the whole thing. The case history proved invaluable, a \"raw and unforgiving\" and \"Holy Grail\" account of the court's inner workings.</p>\n<p>Before returning it to Goldberg the next day, he stopped at The Post's newsroom to make a photocopy.</p>\n\n</blockquote>\n<p>One wonders if Justice Brennan tacitly or expressly authorized this leak, so long as the document was not provided. While the Chief Justice would often warn that leakers would have their careers ruined, Goldberg did not suffer at all. He would become a law professor at Georgetown, advocating for a strict separation of church and state. Goldberg <a href=\"https://www.washingtonpost.com/archive/local/2010/08/31/obituaries/f7a8baea-eb3b-4087-8c58-c324d837e0e8/\" target=\"_blank\" rel=\"noopener\">died in 2010</a>.</p>\n<p>I doubt Josh Gerstein had to take notes while someone read him the <em>Dobbs </em>opinion aloud.</p>\n<p>There's more. Boyden Gray, a prominent conservative lawyer, was a regular source for Woodward:</p>\n<blockquote>\n\n<p>One such leaker was C. Boyden Gray, who served as White House counsel to George H.W. Bush during Bush's presidency and vice presidency. Woodward describes Gray, who died in 2023, as \"one of my lifelong secret sources.\" He also lived just a block and a half away from Woodward in Georgetown, which made passing sensitive documents much easier.</p>\n<p>One Friday in February 1987, as the Iran-contra scandal was unfolding, Gray walked over to Woodward's house bearing a gift: a three-page memo labeled \"top secret\" regarding an Israeli official involved in the sale of U.S. arms to Iran. According to Woodward, the document contradicted the Reagan administration's public assertions about the scope of its contacts with Iran, and even he wondered at first why Gray had given it to him. He said Gray later explained that \"he knew the memo would get out\" eventually and \"he wanted to get ahead of it.\"</p>\n\n</blockquote>\n<p>Woodward also reveals that President Nixon's lawyers leaked information about their client.</p>\n<blockquote>\n<p>As Nixon's defense counsel, Buzhardt listened to hundreds of hours of conversations that the president had secretly taped in the White House but resisted turning over to prosecutors until he was finally ordered to do so by the Supreme Court. In public, Buzhardt vigorously defended Nixon and was seen as \"the operational man in charge of the Watergate cover-up,\" according to Woodward. In private, however, his assessment of Nixon was caustic.</p>\n<p>\"He flat out lies,\" Buzhardt told Woodward during one of 17 interviews that took place in 1974 and 1975. \"He still to this day thinks that he was not involved in the cover-up.\"</p>\n<p>During the height of Watergate, Garment regularly met Woodward for interviews at a Chinese restaurant in downtown Washington and once brought along a briefcase filled with what the lawyer called \"the really incriminating tapes.\" In the memoir Woodward doesn't say whether he was able to listen to them, but he writes that Garment called the recordings \"infantile\" and \"sick.\" Through them, he added, Nixon was \"letting America into the toilet of his mind.\"</p>\n</blockquote>\n<p>Of all the leaks, these bother me especially. Lawyers have a duty of confidentiality. If they no longer could ethically represent a client, their recourse was to withdraw. It is unconscionable for lawyers to defend their client in court while undermining their client in the press. You wonder why Trump relies on lawyers he can trust. Because those he cannot trust are likely to attack him in the media. Not much has changed.</p>\n<p>I've pre-ordered the book, which will be released in November. I am curious about details concerning his SCOTUS chats.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/10/26/harassment-restraining-order-based-largely-on-speech-critical-of-zoo-veterinarian/\" target=\"_blank\" rel=\"noopener\">NEXT: Harassment Restraining Order Based Largely on Speech Critical of Zoo Veterinarian,</a>\n    </p>"}];
