<script>
var articles = [{"title":"Lawsuit Over Outing of Gay Saudi Residents by Lufthansa in Saudi Arabia Can Proceed","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/31/lawsuit-over-outing-of-gay-saudi-residents-by-lufthansa-in-saudi-arabia-can-proceed/","category":"law","categoryLabel":"Law","wordCount":1293,"readingTime":7,"content":"<p><strong>[1.] </strong>First, the facts from an earlier decision in <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cand.417482/gov.uscourts.cand.417482.37.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Doe v. Deutsche Lufthansa AG</em></a>:</p>\n<blockquote><p>John Doe and Robert Roe are a gay couple who have been in a \"committed, but discreet,\" relationship for 33 years, and who were married in California in 2013. Doe is a United States citizen and California resident who lives in Riyadh, Saudi Arabia most of the year, where he works for a company as legal counsel. Roe is a Saudi Arabian citizen who, until May 2021, was living full-time in Riyadh and working as a result estate [real estate? -EV] investor. Since 1989, Doe and Roe lived together in Saudi Arabia, but they were forced to keep their relationship and sexual orientation hidden because homosexuality has been treated as a capital offense in Saudi Arabia. \"Living very carefully, they successfully kept their 33-year relationship a secret from the government, strangers, employers, friends, and family, alike.\"</p></blockquote>\n<p>In 2021, Doe and Roe were flying on Lufthansa from Riyadh to San Francisco. For complicated reasons related to U.S. COVID-related travel rules, Doe and Roe ended up having to disclose to a senior Lufthansa employee at Riyadh airport (Jamshed) that they were married under U.S. law, and the employee allegedly said that publicly; they also allege that the information about the marriage was conveyed to Saudi authorities.</p>\n<p><strong>[2.]</strong> Now, Judge Susan Illston's <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cand.417482/gov.uscourts.cand.417482.92.0.pdf\" target=\"_blank\" rel=\"noopener\">analysis from this past Friday</a> as to why California law should apply to the case:</p>\n<blockquote><p>Saudi Arabian law is based on religious Sharia law and … homosexuality is a crime in Saudia Arabia, punishable in various ways including imprisonment and the death penalty, … [so] plaintiffs have no recourse under Saudi Arabian law…. In contrast, California's strong public policy supporting gay rights and gay marriage, and prohibiting discrimination based upon sexual orientation, is reflected in the California Constitution, numerous California statutes, and decisions by the California Supreme Court….</p></blockquote>\n<blockquote><p>Lufthansa contends that … Saudi Arabia has an interest in the application of its law to an incident that occurred in its country, and at the time of the incident, Doe was a Saudi Arabian citizen and permanent resident and Roe was and remains a permanent resident of Saudi Arabia. Lufthansa also argues that Saudi Arabia has an interest in \"the enforcement of its own criminal laws and norms within the borders of its own sovereign state.\"</p>\n<p>Plaintiffs argue that Saudi Arabia does not have a legitimate interest in the application of its law for a variety of reasons, but that even if there is a true conflict, there is a narrow \"public policy exception\" to the comity doctrine that applies here. That exception \"precludes application of a foreign state's law where to do so would violate California's public policy,\" and \"is so offensive to our public policy as to be prejudicial to recognized standards of morality and to the general interests of the citizens ….\" <em>Wong v. Tenneco, Inc.</em> (Cal. 1985)….</p>\n<p>[A]ssuming Saudi Arabia has a legitimate interest in the application of its laws, this case fits within the narrow public policy exception to the comity doctrine as set forth in <em>Wong v. Tenneco </em>…. The application of Saudi Arabian law would violate California's strong public policies supporting gay rights and prohibiting discrimination based on sexual orientation, and would violate California's strong public policy recognizing the right to privacy.</p></blockquote>\n<p><strong>[3.] </strong>The court then allowed the Does' public disclosure tort claim to continue:</p>\n<blockquote><p>\"[T]he public disclosure tort contains the following elements: (1) public disclosure (2) of a private fact (3) which would be offensive and objectionable to the reasonable person and (4) which is not of legitimate public concern.\"</p>\n<p>The [Complaint] alleges that plaintiffs went to great lengths to keep their relationship and marriage private, that they disclosed their marriage to Jamshed for the limited and necessary purpose of demonstrating compliance with U.S. immigration requirements, that Jamshed loudly disclosed their marriage in a crowded airport and that Lufthansa disclosed their relationship to the Saudi government….</p>\n<p>Lufthansa also argues that plaintiffs fail to state a claim because plaintiffs' marriage is a matter of public record in California. Citing <em>Cox Broadcasting Corporation v. Cohn</em> (1975), Lufthansa argues that \"the First Amendment precludes recovery for the disclosure of facts that are a matter of public record.\" In that case, the Supreme Court held that a journalist could not be held civilly liable for publishing the name of a deceased sexual assault victim obtained from publicly available court records…. None of the concerns animating <em>Cox</em> are at issue here, as Jamshed is not a journalist, he did not learn of plaintiffs' marriage from public records, and the alleged disclosure here did not provide a \"public benefit.\"</p>\n<p>Finally, Lufthansa asserts that plaintiffs fail to allege that the disclosure was offensive and objectionable to the reasonable person because plaintiffs allege that Roe was required to disclose his marital status to Lufthansa and \"customs authorities\" in order to board the flight to the United States. However, the [Complaint] does not allege that Roe was required to disclose his marital status to customs authorities, but rather that plaintiffs were required to disclose their marital status to Lufthansa for \"confirmation of Doe and Roe's marital status for U.S. immigration entry requirements[.]\" Further, plaintiffs allege that Roe \"[d]iscreetly and quietly\" told Jamshed that plaintiffs were married and that Jamshed reacted in a \"hostile\" manner and loudly and repeatedly disclosed plaintiffs' marital status, including that he \"loudly continued to publicly demean and question Plaintiffs about their relationship solely because they were gay.\"</p>\n<p>Plaintiffs also allege on information and belief that \"Lufthansa actually gave Plaintiffs' private facts to the Saudi Arabian government notwithstanding Lufthansa's knowledge of the likely consequences.\" These allegations are sufficient as a pleading matter, and whether Lufthansa and Jamshed's conduct was offensive and objectionable to the reasonable person is a question of fact….</p></blockquote>\n<p><strong>[4.] </strong>The court also similarly held that plaintiffs had adequately alleged the facts needed for their intentional infliction of emotional distress claim:</p>\n<blockquote><p>The [Complaint] [adequately] alleges that Jamshed and Lufthansa engaged in extreme and outrageous conduct by disclosing plaintiffs' relationship and marriage and that \"Lufthansa was aware that disclosing Plaintiffs' personal information and failure to secure the same in Saudi Arabia would cause Plaintiffs severe hardship and, in particular, would put Roe at significant risk of harm by the Saudi government and create severe emotional distress, which in fact has occurred, proximately and directly causing Roe's severe and life-threatening injuries.\" …</p>\n<p>Lufthansa also argues that because plaintiffs' marital status is a matter of public record and plaintiffs have alleged that their marital status was directly relevant to their ability to travel to the United States in the midst of COVID-19 travel restrictions, the alleged outrageous conduct is based on constitutionally protected speech. However, for the reasons discussed above, the Court finds these arguments lack merit.</p></blockquote>\n<p><strong>[5.] </strong>The court held that plaintiffs had adequately alleged a breach of contract claim, on the theory that \"Lufthansa, which 'is a data processor subject to the privacy and data protection regulations in the European Union's GDPR,' expressly represented that it would comply with the GDPR in the performance of its contract with plaintiffs.\"</p>\n<p><strong>[6.] </strong>And the court held that plaintiffs adequately alleged negligent infliction of emotional distress, on the theory that Lufthansa had breached <strong>\"</strong>a duty to avoid discriminating against its customers\" by \"not sufficiently monitoring, supervising, training and educating its employees concerning the sensitivity of private and confidential information and the probable impact on those victimized by failure to adhere to those standards.\"</p>\n<p>I'm not sure that it's right in this instance, even under California choice-of-law principles, to apply California law to actions by a foreign company in a foreign country; but obviously the court thought it was right.</p>\n<p>Donald Putterman (Putterman | Yu | Wang LLP) represents plaintiffs.</p>"},{"title":"All Rise! Coyote Court Is Now in Session","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/07/all-rise-coyote-court-is-now-in-session","category":"fun","categoryLabel":"Interesting Reads","wordCount":839,"readingTime":5,"content":"<p>Oyez! Oyez! Oyez! All persons having business before this honorable court are admonished to draw near and give their attention, for the court is now sitting. Today, the court will issue a decision in the case Coyote v. Acme. A special judge has been drafted into service. He is the Honorable Michael Levine, a personal-injury attorney known to TV and radio audiences in the New York City and Long Island area as Motorcycle Mike. His chambers are in Islandia, on Long Island, with tennis trophies on the desk and an electric shoe buffer in the corner. Levine will hear the case on a break from deposition prep for a client who fell down a boat ramp at a marina.</p><p><em>CASE SYLLABUS</em>: In the new film “Coyote vs. Acme,” based on a piece published in this magazine in 1990, Mr. Wile E. Coyote alleges that the Acme Corporation’s defective products, including rocket skates, dynamite, and a boulder catapult, caused him such injuries as severe burns, eye bulging, and dissection into three parts. His attorney is played by Will Forte. Levine considered recusal, on the ground that he kind of knows Forte’s father: “I’d go helicopter skiing up in British Columbia. We’d always stay at this lodge called the Monashees Lodge. To ski at the Monashees Lodge, you’ve got to be a pretty serious skier. And Reb Forte always stayed at the Monashees Lodge.” Recusal was declined.</p><p><em>SUBDECISION, ON THE FILM’S ARTISTIC MERITS</em>: Levine held, “I was really conflicted about the coyote because he was likable and then he was not likable. At times, I could really relate to the coyote, and other times I thought he was just diabolical. Ultimately, I think the coyote was going after that roadrunner because it was just instinctually part of its chemistry. It couldn’t help itself, even though it was wrong.” Decision: not bad.</p><p><em>ORAL ARGUMENTS</em>: Acme could invoke the doctrine of foreseeable misuse. “There’s an argument that his use of the rocket shoes to chase a roadrunner was not foreseeable,” Levine said. On the other hand, he went on, “I think Acme knew the products were going to be used for nefarious purposes. They bear responsibility if they’re selling dynamite without knowing who the purchaser of that dynamite is. It wasn’t like the purchaser was a mining company. It was a goddam coyote.”</p><p><em>PRECEDENT</em>: Are there any anvil-related <em>decisis</em> to <em>stare</em>? “Literally hundreds,” Levine said. “I’ll show you one.” He pulled up a video, in which a construction worker is standing on a steel beam, twenty feet off the ground, as another beam is hoisted via crane above his head. “My client is a union worker,” Levine said. “That I-beam, by the way? Sixteen thousand pounds.” Suddenly, something snaps, and the hoisted beam falls. It somehow misses the worker. But the crane fell on the beam he was standing on and knocked him to the ground. Levine shook his head. “People suffer,” he said. Rocket skates had precedent, too. “E-bikes,” he said.</p><p><em>PERSONAL BIASES CONSIDERED</em>: Levine feels for the coyote. His line of work has taught him that danger lurks everywhere. “When I drive my car anywhere on Long Island, I’m, like, O.K., I sued that company over there, I sued that landscaper over there. That municipality? Sued them,” he said. “I’ll tell you a story. I’m driving to work seven years ago, in a really nice Porsche Turbo. I stop at a light. I wake up in the hospital four days later.” A woman going sixty miles an hour rear-ended him and launched his car three hundred feet. “The police thought I was gonna die,” he said. He had twelve broken bones and a bleed in his brain. His bowels were resected. He was back at work seventeen days later, without a spleen. “It’s like an appendix,” he said. “You can live without it.”</p><p><em>JUDICIAL MUSINGS</em>: “The attorney’s advertising in the movie was really effective,” Levine said. The key is to be short and memorable without being unserious. “It’s really easy to remember ‘Call Motorcycle Mike.’ My firm advertised a little bit over the years, but if we advertise on TV as ‘This is Rappaport, Glass, Levine &amp; Zullo,’ who the fuck’s gonna remember that?” There are some exceptions, like Cellino &amp; Barnes. “They had the jingle. And Cellino &amp; Barnes is a two-name firm, so it’s not that hard to remember.”</p><p><em>LEGAL ANALYSIS</em>: “The coyote’s got to have a theory of liability, and he’s got to have severe injuries.” The biggest question, jurisprudentially speaking, was whether the coyote’s injuries warranted compensation. An incident that for others might be fatal—a free fall from a high bridge—affects the coyote for only a brief moment. “He is very resilient,” Levine said. “He goes right back to his old habits. Maybe the damage was psychological, like P.T.S.D. But I think the jury’s gonna say, Give me a break.”</p><p><em>DECISION</em>: “I don’t believe you, coyote. You’ve got to have an injury. Otherwise, you’re wasting my time.” ♦</p>"},{"title":"The Easiest Ways to Share Anything Between Android and iOS","source":"Wired","author":"@wired","url":"https://www.wired.com/story/how-to-share-anything-between-android-and-ios/","category":"tech","categoryLabel":"Technology","wordCount":782,"readingTime":4,"content":"<p>Whisper it quietly, but certain bricks in Apple’s walled garden might be getting taken away.</p><p>Thanks to some recent upgrades added to <a href=\"https://www.wired.com/tag/android/\" target=\"_blank\" rel=\"noopener\">Android</a> by <a href=\"https://www.wired.com/tag/google/\" target=\"_blank\" rel=\"noopener\">Google</a>, it's now easier than ever to share files between an <a href=\"https://www.wired.com/tag/iphone/\" target=\"_blank\" rel=\"noopener\">iPhone</a> and an <a href=\"https://www.wired.com/gallery/best-android-phones/\" target=\"_blank\" rel=\"noopener\">Android phone</a>, without installing any new apps (though that's still an option too).</p><p>So if you need to send a photo, contact card, web link, or anything else, these are the options you have available. As is often the case with Android, they may vary depending on the make and model of your handset, though you should find at least one of these methods works for you.</p><h2>Share Files via AirDrop</h2><p>This is the big one: Google recently figured out a way to <a href=\"https://blog.google/products-and-platforms/platforms/android/quick-share-airdrop/\" target=\"_blank\" rel=\"noopener\">add support for AirDrop</a>—Apple's previously closed-off, device-to-device sharing protocol—to newer Pixel phones. It doesn't appear that Apple was involved in the process, but the company hasn't gotten in Google's way since, and the functionality has been rolled out to other phones (including the recent Pixel and Galaxy handsets).</p><p>Some prep work may be required. On Samsung phones, you need to open Settings, then choose <strong>Connected devices &gt; Quick Share</strong> and enable <strong>Share with Apple devices</strong>—though there's no such toggle switch on Pixel phones—it'll just work right away. It needs enabling on iOS too: From Settings, tap <strong>General &gt; AirDrop</strong>, and <strong>Everyone for 10 Minutes</strong>.</p><p>With that done, whenever you tap the share button anywhere in any Android app, you can choose <strong>Quick Share</strong> from the resulting pop-up panel to communicate with a nearby iPhone. The iPhone should show up in the available devices, so select it to start the transfer—which will still need to be accepted on the iPhone.</p><p>It will work the other way too, starting from AirDrop on an iPhone, as long as the Android device is set up to receive from any other device. From Settings, tap either <strong>Connection preferences</strong> (Google Pixel phones) or <strong>Connected devices</strong> (Samsung Galaxy phones), then select <strong>Quick Share &gt; Who can share with you</strong>.</p><h2>Share Files via QR code</h2><p>Google hasn't stopped with AirDrop on Android. It has also recently pushed out a QR-code-based option for sharing from Android to iOS. It's a bit more clunky than AirDrop, but it'll work no matter what kind of Android phone you've got.</p><p>Again, you need to go through <strong>Quick Share</strong>, which pops up as an option whenever you try to share something in Android—no matter what the app or item you want to share. You won't see an iPhone appear if you don't have the AirDrop functionality, but you should see a <strong>Use QR code</strong> option on the right, under <strong>Share with iPhone and other devices</strong>, which after a few moments shrinks down to just a QR code symbol.</p><p>Tap this option to get your QR code on screen. On the iPhone side, AirDrop still needs enabling (via <strong>General &gt; AirDrop &gt; Everyone for 10 Minutes</strong>), and the iPhone camera can then be pointed at the QR code to get to a special Google web address. That will lead to a simple download page for the shared file or content.</p><p>Google says transferred files remain in the cloud for 24 hours, after which they'll be securely deleted. They don't count toward your Google Drive storage quota, and you can share up to 1,000 files in a single session, to a maximum of 20 iPhones (or iPads or Macs, which also support AirDrop).</p><h2>Other Sharing Options</h2><p>You do have a multitude of sharing options to pick from if you want to get something from Android to iOS. You can simply attach a file to an email, for example, or use a messaging app that supports both Android and iOS, like WhatsApp. Bear in mind that certain messaging apps compress photos and videos before sending, though many apps let you turn compression off in the settings.</p><p>Cloud storage apps are another helpful method you can use, though as with messaging apps you want something that works well on any platform (so not iCloud). <a href=\"https://www.wired.com/story/how-to-free-up-storage-space-in-gmail/\" target=\"_blank\" rel=\"noopener\">Google Drive</a> and Dropbox are two apps that are simple to use, run well on Android and iOS, and have smart sharing features built in, for example.</p><p>For iPhone-to-iPhone and Android-to-Android connections and file transfers, everything is much more straightforward: You can just use AirDrop or Quick Share through the relevant share panels, and the receiving device should pop up (assuming you've set the right availability options, as described above).</p><p>One option you can't use is Bluetooth: Apple locks down Bluetooth on the iPhone to some extent, so while you can connect accessories like wireless earbuds, you can't use it for wireless file transfers.</p>"},{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/the-sunday-papers-825","category":"gaming","categoryLabel":"Gaming","wordCount":708,"readingTime":4,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays are for resting, so I hear, though by the time you read this I’ll have got up at 5:30am to drive my parents-in-law to Gatwick Airport. As such, I’m probably not the best authority on resting, or, indeed, Sundays. Nonetheless, I have gathered some quality game-related articles to help you fill yours.</p>\n<p>Gamescom 2026 was this week, <a href=\"https://www.rockpapershotgun.com/dd-lego-and-mounting-ennui-our-biggest-games-from-gamescom-2026\" target=\"_blank\" rel=\"noopener\">yay and boo</a>, and it was – apparently not for the first time – the scene of multiple dev-targeting laptop thefts. Nicole Carpenter investigates for <a href=\"https://aftermath.site/gamescom-laptop-theft-spree-iam8bit-mimic/\" target=\"_blank\" rel=\"noopener\">Aftermath</a>.</p>\n<blockquote>Laley is not only losing out on the cost of a brand new laptop, but the booth space that will go unused for the rest of the event, which runs through Sunday. It costs nearly €3,000 (roughly $3,500) for the smallest size booth in Gamescom's business area, <a href=\"https://exhibitors.gamescom.global/calc/?L=en&amp;ref=aftermath.site\" target=\"_blank\" rel=\"noopener\">according to its price calculator</a>. Pricing only goes up from there. That's not to mention the cost of travel, hotels, and food for the week in which Laley expected to showcase Mimic. He posted <a href=\"https://x.com/RyanLaley/status/2093280590996869487?ref=aftermath.site\" target=\"_blank\" rel=\"noopener\">an emotional video to social media</a> to share the news that his Gamescom was over. \"As an indie, solo dev, this shit's expensive and hard to do all by yourself,\" Laley said in the clip. \"And to have this happen is beyond frustrating. It's heartbreaking.\"</blockquote>\n<p><a href=\"https://breakingarrows.ghost.io/the-writing-is-the-reward/\" target=\"_blank\" rel=\"noopener\">The writing is the reward</a>, argues Steven Santana. I don’t necessarily have the same beef with stats that this does – often they’re just numerical expressions of actions and interactions that more tangibly tickle the senses. But then, I’ve spent too much time reading lore-snippet item descriptions to disagree further.</p>\n<blockquote>In opposition to text, numbers are hard, precise, stoic monoliths that impose their mathematical certainties on you. Text is fluid, provocative, potent, elegant, blunt, sensual, noxious, vivid, visceral, tangible, abstract, hyperbolic, humorous, and much more.</blockquote>\n<p>The award for Most Interesting GTA 6 Take of the post-Netflix showcase era goes, nepotastically, to friend of RPS Jeremy Peel, whose <a href=\"https://www.gamesradar.com/games/grand-theft-auto/gta-6-might-be-single-player-but-the-coupled-up-life-changes-everything/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a> piece considers the dynamics of its central relationship.</p>\n<blockquote>But what follows is subtler and more powerful than that. Rockstar appears to understand that some of the most important conversations between couples happen in liminal spaces: the car on the way to the party; the elevator up to the rooftop bar. These are moments for team tactics - in which potential issues are raised, fears are voiced, and a shared approach is agreed upfront. Forget couple goals – these two have couple objectives, and they're being reassessed and renegotiated on the fly.</blockquote>\n<p>I remain more interested in reading about <a href=\"https://www.rockpapershotgun.com/games/disco-elysium\" target=\"_blank\" rel=\"noopener\">Disco Elysium</a> than playing it, a personal flaw exacerbated by articles like this: Steven Stoermer revisiting the games soundtrack for <a href=\"https://www.deletedsaves.com/sick-with-longing-in-revachol/\" target=\"_blank\" rel=\"noopener\">Deleted Saves</a>.</p>\n<blockquote>The surrender in the song title is also Harry’s, for when it first plays he is at his lowest point. The Instrument handed Revachol over to a centrist invader whose moralist equivocating has left it in stasis, while Harry is similarly paralyzed. Yet it plays when he steps onto Martinaise’s streets for the first time, dazed but roused nevertheless, with potential opening up before him. The rendition in the game itself is quite different from the official soundtrack — longer and more ambient, with the positivity of the OST version’s back half woven in more ethereally. It is a music cue that I have found to be personally stupefying: it stopped me in my tracks during multiple failed attempts to play through Disco Elysium, overwhelming me with emotion and halting my progress.</blockquote>\n<p>This is an old one, which I’ll hope you’re forgive on the grounds that’s it’s also a good one: Duncan Fyfe’s oral history, for <a href=\"https://www.vice.com/en/article/an-oral-history-of-tim-currys-escape-to-the-one-place-uncorrupted-by-capitalism/\" target=\"_blank\" rel=\"noopener\">Vice</a>, on an infamous piece of <a href=\"https://www.rockpapershotgun.com/games/command-conquer-red-alert-3\" target=\"_blank\" rel=\"noopener\">C&amp;C: Red Alert 3</a> scenery-chewing by the <a href=\"https://deadline.com/2026/08/tim-curry-tributes-luke-evans-josh-gad-1237051310/\" target=\"_blank\" rel=\"noopener\">dearly departed</a> Tim Curry.</p>\n<blockquote>\"SPACE!\" he snarls: throat thrown back, eyes rolling up to face God. Then he looks down the camera - he looks at you - with delirious, high-wire glee. It’s almost gloating, that look: he did it, he finished the line, and there’s nothing you can do about it.</blockquote>\n<p>Music this week is <a href=\"https://youtu.be/bvcVeZgU67s?si=P7HMyaFNoY71baWc\" target=\"_blank\" rel=\"noopener\">oh shit, there’s a new Clutch track</a>? A nice one, too. Thick, chunky rock 'n' roll that requires a trip to Wikipedia to understand what the lyrics are on about, just as a Clutch song should.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
