<script>
var articles = [{"title":"A Neuropsychologist Explains the Importance of Exercise in Fighting Dementia - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/a-neuropsychologist-explains-the-importance-of-exercise-in-fighting-dementia-1286369/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1057,"readingTime":6,"content":"<p>Billions of dollars are being spent on research to find a molecule that will cure Alzheimer’s disease. Yet, as Dr. Louis Bherer explains, adopting certain lifestyle habits could significantly reduce the risk of developing symptoms, in some cases by up to half.</p><p>Bherer is a professor in the Department of Medicine at the Université de Montréal and researcher and director at the EPIC Centre, the preventive medicine and physical activity center at the Institut de Cardiologie de Montréal (Montreal Heart Institute). His work focuses on the impact of lifestyle, physical exercise and cognitive stimulation on the brain health of older adults and patients with cardiovascular disease.</p><p>At his Montréal laboratory, Bherer and his team develop both physical and cognitive exercise programs. The results of their studies corroborate what other research has found on the importance of lifestyle in the prevention of dementia. This factor has been neglected by public health authorities, explains Bherer, who is also laboratory director at the l’Institut universitaire de gériatrie de Montréal (Montreal University Institute of Geriatrics). <em>The Conversation Canada</em> recently spoke to Dr. Bherer.</p><p><strong><a href=\"https://www.ctvnews.ca/health/article/canadian-women-live-longer-but-spend-more-years-in-poor-health-statcan/\" target=\"_blank\" rel=\"noopener\">A new Statistics Canada study</a> indicates a substantial decline in healthy life expectancy in Canada. In 2023, it was 66.9 years, a decrease of 3.5 years from the peak of 70.4 years between 2010 and 2012. Are you surprised?</strong></p><p><strong>Bherer:</strong> Yes and no. But what we do know is that the healthspan-lifespan gap — the gap between life expectancy and healthy life expectancy — is widening. For example, nine out of 10 people have at least one risk factor for cardiovascular disease after the age of 65: being overweight, poor sleep, inactivity, high blood pressure, etc. As life expectancy increases, this means more years in poor health.</p><p>Our lifestyle is not optimal. Stress and anxiety are on the rise. It’s a scourge. What’s more, people are inactive, they have sleep problems, they are neglecting their diet. We eat quickly, and eat fast food or ultra-processed foods. Although the information is there, and available, we don’t always apply it. Nor do we teach our children to. Physical education should be part of the daily school curriculum, and the basics of nutrition should also be taught.</p><p>For that matter, people are quick to turn to pharmaceutical solutions. The popularity of Ozempic is one example. We want to lose weight, but we aren’t addressing the causes of being overweight. We don’t do much to encourage people to change their lifestyle. It is estimated that nearly half of all dementia cases (45 per cent) could be prevented with a healthy lifestyle. <a href=\"https://www.alzint.org/resource/dementia-risk-factors-infographic/\" target=\"_blank\" rel=\"noopener\">Fourteen modifiable risk factors</a> (FRM) have been identified.</p><p><strong>Many people tell themselves: I’m 65 or 70, so it’s too late for me to change my habits. I should have started earlier.</strong></p><p><strong>Bherer:</strong> It’s <a href=\"https://theconversation.com/downsizing-to-an-early-death-why-exercise-is-so-important-as-you-age-123137\" target=\"_blank\" rel=\"noopener\">never too late</a>, even though we know that education (a mitigating factor for dementia) is generally acquired at a young age. This is in contrast to hearing loss, which occurs later in life. Many people do not take it seriously or hide it, yet it’s a factor associated with an increased risk of major cognitive impairment or dementia. And, of course, psychological health plays a major role: a person may be inactive because they feel a little depressed or less motivated, but this increases the risks. We don’t realize that overall health factors are all interrelated. Heart and brain health go hand in hand. What’s good for the heart is good for the brain.</p><p><strong>Your laboratory, which focuses on cognitive health, is located at the Institut de cardiologie de Montréal. What exactly are you doing there?</strong></p><p><strong><strong>Bherer:</strong></strong> We use stimulation programs to assess the impact of exercise on physical and cognitive health. Our participants range in age from 50 to 95, with an average age of between 68 and 70. We follow them for periods ranging from three months to a year. They may have mild cognitive deficits that people around them have noticed, and sometimes they suffer from anxiety, a condition that can impact memory and be a predictor of dementia. Other participants have no cognitive issues, but they are at risk due to high blood pressure, diabetes, etc. Our programs include memory games on phones, for example, which improve cognitive function, particularly psycho-motor speed, as well as physical exercises: stationary bikes, treadmills, muscle strengthening, etc. The best approach is a combination of both.</p><p><strong>What have you observed?</strong></p><p><strong><strong>Bherer:</strong></strong> We are seeing clinically significant improvements. Participants with mild cognitive impairment may see improvements after six months of training, with differences in their attention, alertness and response speed. They are more alert after just a few weeks. We are also seeing an impact on memory, although this takes longer. Using biomarkers, our research attempts to link the parameters that change, both physically and cognitively, to the effects on the brain. With brain imaging, we can measure improvements in blood flow and brain structures, such as the hippocampus, which plays a key role in memory.</p><p>Physical training, which participants do three times a week, stimulates the production of proteins that promote neuroplasticity. When muscles work, they produce and release <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7288608/\" target=\"_blank\" rel=\"noopener\">myokines</a> and other <a href=\"https://observatoireprevention.org/en/2023/10/30/exerkines-mediators-of-the-health-benefits-of-exercise/\" target=\"_blank\" rel=\"noopener\">exerkines</a>. These molecules play an important role in metabolism, inflammation, bone health and even mood. As we often say, exercise is the miracle pill for overall health.</p><p><strong>Many people make profound changes in their lifestyle, but good intentions don’t always last.</strong></p><p><strong><strong>Bherer:</strong></strong> Yes, and that’s a shame, because the positive effects of training disappear within a month or a month and a half. <a href=\"https://theconversation.com/how-quickly-do-we-become-unfit-160500\" target=\"_blank\" rel=\"noopener\">And the older we get, the faster it happens</a>. Ideally, you should choose activities that can be easily integrated into your daily routine. I’m thinking of running, for example, which is a very complete exercise, very easy to do, and inexpensive. Brisk walking is also good, but the idea is to work up a bit of a sweat. And supplement that with some exercises to increase muscle strength and others to improve posture and mobility. This is an important factor in maintaining independence as we age. The fear of falling is a concern for many older people. Balance and posture control exercises, such as yoga, can really make a huge difference to the health and lifestyle of older people. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/im-part-of-the-team-writing-the-next-bible-of-psychiatry-for-the-first-time-the-dsm-will-use-biology-to-understand-mental-disorders-288064\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/a-neuropsychologist-explains-the-importance-of-exercise-in-fighting-dementia-274391\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Harbucks / Shutterstock</em></p>"},{"title":"David Gaider has been working on Owlcat's Expanse RPG: 'The Expanse has long been one of my favourite series, and so obviously I jumped at the opportunity to be involved'","source":"PC Gamer","author":"Fraser Brown","url":"https://www.pcgamer.com/games/rpg/david-gaider-has-been-working-on-owlcats-expanse-rpg-the-expanse-has-long-been-one-of-my-favourite-series-and-so-obviously-i-jumped-at-the-opportunity-to-be-involved/","category":"gaming","categoryLabel":"Gaming","wordCount":531,"readingTime":3,"content":"<p>David Gaider, the creator of Dragon Age's Thedas and co-founder of Summerfall Studios, has been moonlighting on <a href=\"https://www.pcgamer.com/the-expanse-osiris-reborn/\" target=\"_blank\" rel=\"noopener\">The Expanse: Osiris Reborn</a>, lending Owlcat Games his expertise.</p><p>Gaider revealed that he's been working with Owlcat on <a href=\"https://bsky.app/profile/davidgaider.bsky.social/post/3mznkp2wr3c2f\" target=\"_blank\" rel=\"noopener\">Bluesky</a> today, saying, \"Alongside my work at Summerfall, I've also been collaborating with the Owlcat Games team on The Expanse: Osiris Reborn, focusing on certain aspects of the game's narrative. The Expanse has long been one of my favourite series, and so obviously I jumped at the opportunity to be involved.\"</p><p>The Expanse is a bit of a departure for Owlcat, which is known for its elaborate isometric CRPGs like Wrath of the Righteous and Rogue Trader. The Expanse, meanwhile, is more of a cinematic RPG and third-person shooter in the vein of Mass Effect. That said, it's still full of skill checks and roleplaying, and when <a href=\"https://www.pcgamer.com/games/rpg/the-expanse-osiris-reborn-turns-the-best-mass-effect-mission-into-an-entire-game/\" target=\"_blank\" rel=\"noopener\">I played it at Gamescom</a> Owlcat's CRPG legacy was still very much present.</p><p>While Gaider worked on Dragon Age rather than Mass Effect, he's got plenty of experience working on both classic CRPGs (he was a writer on Baldur's Gate 2 and Neverwinter Nights) and their more cinematic successors (he was lead writer on Dragon Age: Origins and Inquisition). I really enjoy Gaider's writing, so this sounds like great news.</p><p>Along with Gaider's announcement, Owlcat has also shown off the new voice for the game's male protagonist and their twin. The studio decided to recast the role after getting feedback from beta players, and settled on voice actor Blythe Melin. You can see him in action in the video below.</p>\n\n<p>An update from the team | The Expanse: Osiris Reborn - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/TF8213pGOrY\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>\"Voicing both the Captain and J has been an incredible joy and a unique challenge compared to the rest of my work voicing in videogames over the years,\" said Melin. Two biologically related characters! It presented a difficult task in itself, because I find it very important to make sure neither character felt one-note-ey or too similar to the other. The more a character talks, especially in a multi-path dialogue route like for this game, the harder the task of making characters feel fleshed out while still having their own flavors and mannerisms.\"</p><p>Melin's previous work includes Wolverine, Aether &amp; Iron, Painkiller and various Hoyoverse games.</p><p>As a fan of Owlcat, The Expanse and Gaider, I'm keen to get my hands on the game again, and thankfully it's not too far off. The Expanse: Osiris Reborn is due in spring 2027.</p>\n\n<p>Fraser is the UK online editor and has actually met The Internet in person. With over a decade of experience, he's been around the block a few times, serving as a freelancer, news editor and prolific reviewer. Strategy games have been a 30-year-long obsession, from tiny RTSs to sprawling political sims, and he never turns down the chance to rave about Total War or Crusader Kings. He's also been known to set up shop in the latest MMO and likes to wind down with an endlessly deep, systemic RPG. These days, when he's not editing, he can usually be found writing features that are 1,000 words too long or talking about his dog. </p>"},{"title":"Choosin' Texas I Can Tell","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/11/03/choosin-texas-i-can-tell/","category":"law","categoryLabel":"Law","wordCount":777,"readingTime":4,"content":"<h2><a href=\"https://reason.com/volokh/2026/11/03/choosin-texas-i-can-tell/\" target=\"_blank\" rel=\"noopener\">Choosin' Texas I Can Tell</a>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t11.3.2026 11:31 PM\n</p>\n\t</h2>\n\t\n\t\t<p>A few moments ago, the networks called the Texas Senate and Governor races for the Democratic candidates. Those outcomes will get a lot of attention. But of significant interest will be the downballot judicial races in Texas.</p>\n<p>This year, four of the nine seats on the Texas Supreme Court were on the ballot. Unless something unexpected happens, all four will lose: Chief Justice Jimmy Blacklock, Justice James P. Sullivan, Justice Kyle Hawkins, and Justice Brett Busby. These are all brilliant judges. Two of them clerked on the United States Supreme Court. Chief Justice Blacklock has been a strong leader, following in the footsteps of Chief Justice Nathan Hecht. But the qualifications do not matter. Everything was on the party line. The Texas Supreme Court will now have five Republican members and four Democratic members. One might expect a number of 5-4 cases for controversial cases. Then again, the Chief Justice is now the administrator of the state court system, which entails some important responsibilities.</p>\n<p>The Texas Court of Criminal Appeals (the court of last resort for criminal cases) had three seats on the ballot. Again, unless something happens, all three will lose. There will still be a six-member conservative majority. I don't see too much changing on that Court.</p>\n<p>Recently, the Fifteenth Court of Appeals was created as a statewide constitutional court. Virtually all suits against the government are routed to that court. (Think of something like the D.C. Circuit.) All three members of that court were on the ballot. Unless something happens, all three will lose. The Court will now have 100% Democratic members. I would expect a lot mandamus suits to the Texas Supreme Court.</p>\n<p>I haven't had time to go through the returns from the local courts, but it appears that most of the incumbent republican judges will lose office. This will be an even bigger bloodbath than 2018, when the Beto wave wiped out nearly all of the Republican judges in Houston, Austin, Dallas, and other large cities. So much judicial experience for non-controversial judges will go down the tube.</p>\n<p>The Governor of Texas is fairly weak, as compared to other states, but he does have the power to appoint new members of the Texas Supreme Court and other courts when vacancies arise. Recently, the Texas legislature created a new Texas Business Court. This court was designed to compete with Delaware. Many of the current Texas business courts are not likely to be reappointed. This election will significantly affect businesses that chose to make Texas their headquarters. Speaking of which…</p>\n<p>The Texas Attorney General Race will also likely go to the Democratic candidate. I would suspect that all of the conservative strategic litigation cases brought by Attorney General Paxton will be dismissed. Indeed, it is conceivable that the new Texas Attorney General would not defend the Texas Ten Commandments Law if cert is granted. (The BIO will be filed soon.) The Texas Attorney General will also not bring original jurisdiction actions before the Supreme Court of Texas. Going forward, all of the strategic forums in Texas will be severely underutilized. The only court where the Texas Attorney General might file cases will be in Austin. I should note that one seat on the Western District of Texas remained vacant for two years, and will likely remain vacant. But beyond the strategic litigation, the Texas Attorney General will now be able to investigate all of the corporations that moved to Texas. There are a lot of them.</p>\n<p>What about judicial nominees? Despite my best efforts, Judge Southwick will get the last laugh. Todd Butler will almost certainly be confirmed. But the Fifth Circuit will likely be a lot quieter, given the lack of Texas Attorney General cases. I also hope this means that Judge Rudofsky will get a vote, as that Eighth Circuit seat would remain vacant for the foreseeable future. Indeed, the Eighth Circuit may be the only viable forum for a Republican AG to bring cases starting in 2028.</p>\n<p>Going forward, Senators Cruz and Talarico will have to agree on blue slips for District Court nominees. Still, I suspect zero nominees will get a vote over the next two years unless there is some deal struck with the Senate Democrats.</p>\n<p>What about Justices Alito and Thomas? They did what Justice Breyer could not--resist the pressure. I hope they live long and prosper.</p>\n<p>Ultimately, I'm reminded of something I tell my students--we are never more than two years away from a midterm election. Despite threats about fascism and totalitarianism, the people are able to effect change.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/11/03/court-orders-plaintiff-to-file-handwritten-opposition/\" target=\"_blank\" rel=\"noopener\">NEXT: Court Orders Plaintiff to File Handwritten Opposition,</a>\n    </p>"},{"title":"RIP Cybertruck. You Were Unloved, Unwanted, and Utterly Absurd","source":"Wired","author":"@wired","url":"https://www.wired.com/story/rip-cybertruck-you-were-unloved-unwanted-and-utterly-absurd/","category":"tech","categoryLabel":"Technology","wordCount":898,"readingTime":5,"content":"<p>Elon Musk, in <a href=\"https://x.com/elonmusk/status/2118591788701421573?a=m0883RRcN9XogrZCiOQ&amp;s=46\" target=\"_blank\" rel=\"noopener\">a post on X</a>, has officially called time on the Cybertruck, stating that “Tesla will be winding down production of the Cybertruck at Gigafactory Texas around the middle of next year to make room for increased <a href=\"https://www.wired.com/story/tesla-cybercab-had-a-quiet-debut/\" target=\"_blank\" rel=\"noopener\">Cybercab</a> production.”</p><p>Produced for less than four years, the polarizing pickup is seemingly dying as it lived, with the news being greeted in a flurry of replies in praise of the EV as well as deriding it. James Star, claiming to be a Tesla employee, <a href=\"https://x.com/SirJamesStar/status/2118592426139091293?s=20\" target=\"_blank\" rel=\"noopener\">posted</a> that it was “the saddest news! Cybertruck (was) the best car Tesla sold,” right next to a user called <a href=\"https://x.com/Capn_Ford/status/2118597344874660010?s=20\" target=\"_blank\" rel=\"noopener\">Captain Ford</a> who simply replied to Musk with “Fuck that shitbox.”</p><p>Tesla has not responded to WIRED’s request for comment and clarification that the Cybertruck will no longer be made at all. The Cybertruck is exclusively made at Gigafactory Texas, as this is apparently the only Tesla facility equipped with the machinery required to manufacture the truck’s unique stainless steel body, which supposedly <a href=\"https://www.wired.com/story/this-is-why-teslas-stainless-steel-cybertrucks-may-be-rusting/\" target=\"_blank\" rel=\"noopener\">started to rust</a> in some cases.</p><p>Despite whipping up a fevered number of reservations—allegedly more than a million according to Musk, who at the end of 2023 crowed that demand was “off the charts!”—the truck failed to sell, shifting <a href=\"https://www.wired.com/story/where-did-the-one-million-people-who-wanted-a-cybertruck-go/\" target=\"_blank\" rel=\"noopener\">less than 50,000 units</a> in total by March last year.</p><p><a href=\"https://evwire.com/p/tesla-cybertruck-production-ends-mid-2027\" target=\"_blank\" rel=\"noopener\">EVWire cites</a> Kelley Blue Book data suggesting that Tesla sold 11,586 Cybertrucks in the first three quarters of this year in the US, down 28 percent year-over-year, adding that Musk’s announcement post came about 80 minutes after Tesla raised US Cybertruck prices and paused new orders for the entry-level Dual-Motor AWD version.</p><p>The Cybertruck proved not only to be wildly unpopular, it was also beset by troubles before it even reached customers. In 2023, WIRED covered a leaked Tesla report dated January 25, 2022, that showed the Cybertruck had <a href=\"https://www.wired.com/story/a-leaked-tesla-report-shows-the-cybertruck-had-basic-design-flaws/\" target=\"_blank\" rel=\"noopener\">basic design flaws</a>, and that the preproduction “alpha” version was struggling with problems with its suspension, body sealing, noise levels, handling, and braking.</p><p>In November 2019, when Musk stepped onto a stage in California to launch his new cyberpunk-styled electric pickup, he decided to demonstrate the strength of the “unbreakable” glass windows by hurling a steel ball at them. In what has now entered into public relations folklore, the demo truck’s windows <a href=\"https://www.bbc.co.uk/news/technology-50513294\" target=\"_blank\" rel=\"noopener\">smashed not once,</a> but twice. Musk swore, then joked: “There’s room for improvement.”</p><p>There most certainly was. In April 2024, a recall was issued for the Cybertruck because its <a href=\"https://www.wired.com/story/cybertruck-recall-accelerator-pad-tesla/\" target=\"_blank\" rel=\"noopener\">accelerator pedal pad</a> could come loose and get trapped by interior trim, which had the frightening potential of pushing the car to full speed.</p><p>In March last year, Tesla had to recall nearly all the Cybertrucks it had then produced because a stainless steel trim panel <a href=\"https://www.wired.com/story/tesla-cybertrucks-made-with-the-wrong-glue-hit-with-yet-another-sticky-recall/\" target=\"_blank\" rel=\"noopener\">could become detached</a> from the vehicle while driving, blaming the problem on the wrong type of glue, a new adhesive “not prone to environmental embrittlement.”</p><p>Back in May this year, Cybertrucks were struck down by the wrong type of grease, which meant that their wheels could <a href=\"https://www.wired.com/story/the-latest-tesla-recall-wheels-may-fall-off-cybertrucks/\" target=\"_blank\" rel=\"noopener\">potentially fall off</a>. In what was then the EV’s 11th recall, it was declared that the Rear Wheel Drive (RWD) Cybertruck Long Range model might have faulty brake rotors. In <a href=\"https://static.nhtsa.gov/odi/rcl/2026/RCLRPT-26V255-4257.pdf\" target=\"_blank\" rel=\"noopener\">a notice</a> posted by the National Highway Traffic Safety Administration, Tesla stated that “brake rotor stud holes may crack and allow the stud to separate from the wheel hub.” Such a situation might have seen some RWD Cybertruck owners merrily driving along only to then be disconcertingly overtaken by their own wheels.</p><p>Musk even tried to get President Donald Trump to buy one of his Cybertrucks, creating an impromptu Tesla showroom on the <a href=\"https://www.wired.com/story/donald-trump-bought-a-dollar90000-tesla-with-37-recall-notices-against-it/\" target=\"_blank\" rel=\"noopener\">White House South Lawn</a>, no less. But, sadly, even President Trump must have smelt something was off about the truck as instead he shunned the pickup and opted for a 200-mph <a href=\"https://www.tesla.com/models/design#overview\" target=\"_blank\" rel=\"noopener\">Model S Plaid</a> in ultra red, clearly impressed with the interior, remarking that “<a href=\"https://news.sky.com/video/looks-good-wow-donald-trump-buys-tesla-car-in-show-of-support-for-elon-musk-13326839\" target=\"_blank\" rel=\"noopener\">Everything’s computer!</a>”</p><p>At the end of 2024, Karl Brauer, executive analyst at car ranking service <a href=\"https://www.iseecars.com/\" target=\"_blank\" rel=\"noopener\">iSeeCars</a>, told WIRED that he’d calculated that the <a href=\"https://www.reuters.com/business/autos-transportation/tesla-is-recalling-over-2400-vehicles-us-nhtsa-says-2024-11-13/\" target=\"_blank\" rel=\"noopener\">Cybertruck’s six recalls to date</a> at the time made the EV “<a href=\"https://www.wired.com/story/cybertrucks-many-recalls-make-it-worse-than-91-percent-of-all-2024-vehicles/\" target=\"_blank\" rel=\"noopener\">worse than 91 percent</a>” of all other 2024 vehicles.</p><p>Yet, despite supposedly being so unreliable, the Cybertruck did find a <a href=\"https://www.wired.com/story/owning-a-cybertruck/\" target=\"_blank\" rel=\"noopener\">small but loyal audience</a>. WIRED profiled a number of owners last year, all fervently in love with their vehicles, but who were periodically <a href=\"https://www.wired.com/story/uncanny-valley-podcast-wired-roundup-satellites-data-leak-cybertrucks-politicized-federal-workers/\" target=\"_blank\" rel=\"noopener\">forced to endure insults</a> and taunts that they were Nazis, perhaps referring to an <a href=\"https://www.wired.com/story/neo-nazis-love-elon-musk-nazi-like-salutes-trumps-inauguration/\" target=\"_blank\" rel=\"noopener\">on-stage gesture Musk made</a> at the start of 2025.</p><p>However, despite evidence seemingly to the contrary, Musk claims he is killing the Cybertruck, not because of its unreliability and staggering unpopularity, but because he wishes to focus instead on Cybercab, an autonomous EV that is central to Tesla’s robotaxi ambitions but itself has had <a href=\"https://www.wired.com/story/tesla-cybercab-officially-launches-today-its-already-under-investigation/\" target=\"_blank\" rel=\"noopener\">a rocky start</a>.</p><p>Currently operating in Austin only, with a fleet supposedly numbered only in the hundreds, Musk apparently wants to ramp up production dramatically since he confirmed on an earnings call the first cab came off the line in February.</p><p>Musk sees Cybercab as very much the vision of Tesla’s future. The CEO has even said that Tesla should no longer be regarded as an automaker but as a <a href=\"https://www.wired.com/story/tesla-going-all-in-on-robotaxis/\" target=\"_blank\" rel=\"noopener\">robotics and autonomous vehicle company</a>. “Cybertruck was an incredible ⁠technology development platform and lives on through Cybercab,” Cybertruck lead engineer Wes Morrill <a href=\"https://x.com/wmorrill3/status/2118598887258644883\" target=\"_blank\" rel=\"noopener\">said on X</a>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
