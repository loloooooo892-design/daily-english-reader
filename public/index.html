*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"Jensen Huang Basically Lit More Than $1 Trillion on Fire in Less Than a Month","source":"Wired","author":"@wired","url":"https://www.wired.com/story/jensen-huang-tanked-a-trillion-dollars-in-less-than-a-month/","category":"tech","categoryLabel":"Technology","wordCount":508,"readingTime":3,"content":"<p>On Thursday morning, Nvidia announced that Jensen Huang <a href=\"https://www.wired.com/story/nvidia-ceo-jensen-huang-steps-down/\" target=\"_blank\" rel=\"noopener\">had resigned from the company</a> that had become, in many ways, synonymous with its chief executive.</p><p>Less than an hour later, when the markets opened, Nvidia’s stock had lost roughly $546 billion in market value. Though it has rebounded somewhat, the last weeks of scandal—including a <a href=\"https://www.nytimes.com/2026/11/11/technology/jensen-huang-nvidia-affair.html?eafs_enabled=false\" target=\"_blank\" rel=\"noopener\">reported second affair</a> with an Nvidia employee—have tanked the chipmaker’s valuation by more than $1 trillion.</p><p>Huang’s very public downfall began in late October, when <a href=\"https://www.nytimes.com/2026/10/29/us/politics/nvidia-china-jensen-huang-trump.html\" target=\"_blank\" rel=\"noopener\">The New York Times reported</a> that the CEO had a “close relationship” with Alice Huang, a former executive at the Singapore-based chip buyer Megaspeed and an alleged asset of China’s Ministry of State Security. (The two are not known to be related.) At that time, Nvidia’s market cap was around $5.2 trillion.</p><p>On November 8, Nvidia announced it was investigating its CEO, after Jensen publicly acknowledged the affair. By the following morning, roughly $1 trillion had been erased since the scandal started.</p><p>If you hang out with a certain type of person who thinks of themselves as a daytrader, they might have talked about “buying the dip” over drinks last weekend. If you believe Nvidia can thrive without Huang, there’s still time! The dip has dipped even further. But the early consensus seems to be that this could be more of a prolonged plunge.</p><p>“Huang is irreplaceable,” Ryan Fedasiuk, a senior fellow at the think tank Foundation for American Innovation, <a href=\"https://www.wired.com/story/jensen-huangs-troubles-leaves-the-ai-industry-reeling/\" target=\"_blank\" rel=\"noopener\">told WIRED last week.</a> “He built Nvidia into the juggernaut it is today, and he was the visionary behind the GPU, which has sustained the intelligence revolution.”</p><p>There are very real questions about what the end of Huang means for the global economy. Not only are Nvidia’s chips used to train most major AI models, but the company has also invested billions in a number of other tech companies. As of an August <a href=\"https://d18rn0p25nwr6d.cloudfront.net/CIK-0001045810/9faa941a-b2b0-4dbc-a660-f7a24e821fca.pdf\" target=\"_blank\" rel=\"noopener\">regulatory filing</a>, Nvidia owned nearly $30 billion worth of Intel stock and roughly $21 billion of SpaceX stock.</p><p>For now, Nvidia’s loss is other chipmakers’ gain. AMD shares are up 28 percent over the past five days, and Broadcom is up nearly 16 percent. Nothing to see here.</p><h2>More Numbers That Illuminate Huang’s Value:</h2><ul><li>Nvidia’s market share of chips used in training frontier AI models: <a href=\"https://siliconanalysts.com/analysis/nvidia-ai-accelerator-market-share-2024-2026\" target=\"_blank\" rel=\"noopener\">roughly 90 percent</a>;</li><li>AI companies in which Nvidia has invested at least $100 million: eight, as of its August filing;</li><li><a href=\"https://www.wired.com/story/jensen-huangs-troubles-leaves-the-ai-industry-reeling/\" target=\"_blank\" rel=\"noopener\">Huang’s pay last year</a>: $36 million;</li><li>Portion of Nvidia owned by Huang: 3.5 percent, as of March—which means the scandal has devalued Huang’s own share of the company by more than $50 billion;</li><li>Reported affairs: three (so far);</li><li>PR firms hired with expertise in sex scandals: <a href=\"https://www.wired.com/story/nvidia-ceo-jensen-huang-hired-a-pr-firm-known-for-handling-sex-scandals-last-year/\" target=\"_blank\" rel=\"noopener\">at least one</a>;</li><li>Huang relatives employed by Nvidia: one son, one daughter, and <a href=\"https://www.theinformation.com/articles/jensen-huangs-son-in-law-became-one-trusted-executives\" target=\"_blank\" rel=\"noopener\">one son-in-law</a>;</li><li>Leather jackets owned: several, including a $960,000 Tom Ford number (<a href=\"https://www.vanityfair.com/story/jensen-huang-debunked-ai-photo?srsltid=AYCX9vKXSffS6MFarHdBxZrrZjjjPniPzs5Oio232XndV8fYQXVwOgj7\" target=\"_blank\" rel=\"noopener\">but not that vintage Saint Laurent jacket everyone was talking about on X</a>).</li></ul><p><em>Update 11/12/26 2:50pm ET: This story has been updated to reflect that a third Jensen Huang affair has been reported.</em></p>"},{"title":"Dear Age-Gap Expert","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/dear-age-gap-expert","category":"fun","categoryLabel":"Interesting Reads","wordCount":623,"readingTime":4,"content":"<p>Dear Age-Gap Expert,</p><p>I’m twenty-six, but I’m dating a veteran of the American Civil War. My boyfriend served in the U.S. Navy’s North Atlantic Blockading Squadron, under the Union commander John Rodgers. Whenever I go out dancing, my boyfriend stays home because he’s “too tired.” Is this something I should just expect of dating an older man?</p><p>Thanks,Civil Disagreement</p><p>Dear Civil Disagreement,</p><p>It’s common for energy levels to decline as people age. Additionally, the American Civil War was particularly exhausting. It’s not surprising that your boyfriend may feel some lingering fatigue. Relationships, however, are about give-and-take. Try alternating Saturday-night activities—that way, you both get to do what you love with the person you love. One week, go to the club; the next, spend some quality time picking maggots out of your boyfriend’s hardtack.</p><p>Best,Age-Gap Expert</p><p>Dear Age-Gap Expert,</p><p>If you’d told me a year ago that I’d be in a committed relationship with a Han Dynasty pig breeder, I would’ve laughed in your face. I knew a guy in college who dated older, but I always figured that he must’ve had a complicated relationship with his father. (Unrelated: my father is a Han Dynasty pig breeder, and we don’t talk.) Now that I’m the one dating an older man, I’m worried that people will think I have “daddy issues.”</p><p>Sincerely,Son of Ham</p><p>Dear Son of Ham,</p><p>Unfortunately, without more information, I can’t determine whether your relationship is Oedipal in nature. There’s no obvious connection between your relationship with your father and your relationship with your boyfriend, aside from their shared age, ancestry, and occupation. But why not refocus your concerns, and examine your preoccupation with what other people think?</p><p>As the son of a Han Dynasty pig breeder, you were raised in great comfort, thanks to your father’s high social status and his abundance of pigs. Compared with the petty shopkeeper or the itinerant trader, you are practically a member of the scholarly gentry. Growing up amid opulence may have jaded you, but I hope it has not distorted your self-worth. My recommendation is simple: Remember your origins. Take comfort in knowing that whoever dares judge you probably has, at best, only one or two pigs.</p><p>Best,Age-Gap Expert</p><p>Dear Age-Gap Expert,</p><p>My girlfriend is from the Bronze Age. I can tell that this makes my parents uncomfortable. How do I prove that my girlfriend loves me for who I am, and not just for my access to, and basic knowledge of, more complex metals?</p><p>Thanks,Going for Bronze</p><p>Dear Going for Bronze,</p><p>Every parent wants to see their child loved for who they really are. And it sounds like your girlfriend wants to be with you not <em>only</em> because of your access to the natural-iron–nickel-alloy meteoric iron but also because of your personality and shared interests. When your parents are around, try to emphasize the things that you and your girlfriend have in common: the use of basic writing systems, for instance.</p><p>Best,Age-Gap Expert</p><p>Dear Age-Gap Expert,</p><p>My boyfriend is eight million years old, and I’m only twenty-three. What should I get him for our anniversary?</p><p>Sincerely,Miocene Mania</p><p>Dear Miocene Mania,</p><p>Your boyfriend has lived through all of human civilization (and then some!). This means that he’s received enough thoughtful cards, vintage tie clips, and couples massages to last a lifetime. Try getting out of your comfort zone and giving him an experience that might remind him of his wayward youth. This could mean closing the Strait of Gibraltar, or subtly increasing the over-all atmospheric carbon dioxide from the modern four hundred and forty parts per million to his more familiar Miocene level of six-fifty. As everyone knows, a high concentration of carbon dioxide is the key to a man’s heart.</p><p>Best,Age-Gap Expert ♦</p>"},{"title":"8 New TV Shows to Watch This Weekend on Netflix, Prime Video, and HBO (November 13-15)","source":"Polygon","author":"@cachiloreto","url":"https://www.polygon.com/new-tv-shows-streaming-this-weekend-netflix-november-13-15/","category":"gaming","categoryLabel":"Gaming","wordCount":1109,"readingTime":6,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/maria-loreto/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Nov 13, 2026, 4:00 PM EST\n                                </p>\n                    \n                                                            \n                                                                        <p>From the return of one of the biggest fantasy series, to a new Netflix horror</p>\n    \n        \n    \n                                                     <p>It’s a big weekend for new TV. <em><a href=\"https://www.polygon.com/visionquest/\" target=\"_blank\" rel=\"noopener\">VisionQuest</a> </em>has concluded its first season, including a post-credits scene with big implications for <a href=\"https://www.polygon.com/avengers-doomsday/\" target=\"_blank\" rel=\"noopener\"><em>Avengers: Doomsday</em></a>. <a href=\"https://www.polygon.com/lotr-rings-of-power/\" target=\"_blank\" rel=\"noopener\"><em>The Lord of the Rings: Rings of Power</em></a> is back with a third season, continuing the story of a Middle-earth set thousands of years before Bilbo and Frodo Baggins. <a href=\"https://www.polygon.com/the-body-review-netflix/\" target=\"_blank\" rel=\"noopener\"><em>The Body</em></a> is also available on Netflix, delivering a fun and campy high school drama with some religious horror thrown in the mix.</p>    \n<p>Thriller lovers have some shows to look forward to. <em>The Good Daught</em>er, a 6-episode series based on Karin Slaughter's bestseller, has just been released. It’s adapted by Slaughter herself, making her the rare novelist who’s also the showrunner for her own story. There’s also <em>12 12 12,</em> starring Anthony Mackie and Jamie Dornan, as two men involved in a high-stakes cat-and-mouse game that starts with a robbery.</p>    \n<p>We have a few picks for lovers of documentary and true crime<em>. Murder in Galicia </em>is streaming on Netflix, telling the story of the murder of 66-year-old Isabel Fuente, who was beaten in her sleep, with her husband claiming that some intruders had gotten inside their house.</p>    <p>There’s also HBO’s<em> Silent Night,</em> a series based on the murders that took place on Christmas Eve in 1976 in a small community in Poland. Lastly, if you want something a little breezier, there’s <em>The Secret Lives of Mormon Wives: Orange County, </em>premiering on Hulu and Disney. Happy watching!</p>    <h2>\n            1 \n        \n                            The Lord of the Rings: Rings of Power\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Prime Video</strong>\n                        </li>\n                    <li>\n                                        Genre: Fantasy\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: Morfydd Clark, Robert Aramayo, Charlie Vickers.\n                        </li>\n            </ul>\n<p><em>The Lord of the Rings: Rings of Power </em>is back with a third season, exploring the tales of Middle-earth thousands of years before the events of <em>The Hobbit </em>and<em> The Lord of the Rings</em>. Season 3 tries to course-correct a series that has never managed to get things right. Set five years after the events of season 2 and billed as a soft reboot to welcome in new watchers, the season finds Sauron establishing his power.</p>    <p>Per our Polygon <a href=\"https://www.polygon.com/rings-of-power-season-3-review/\" target=\"_blank\" rel=\"noopener\">review</a>:</p>    <blockquote>\n                        <p>Prequels always have difficulty justifying their existence since it’s a foregone conclusion how the story will end. Last season, Rings of Power leaned into that inevitability in the same way as the<a href=\"https://www.polygon.com/game-of-thrones/\" target=\"_blank\" rel=\"noopener\"> Game of Thrones</a> prequel<a href=\"https://www.polygon.com/house-of-the-dragon/\" target=\"_blank\" rel=\"noopener\"> House of the Dragon</a>, building a Shakespearean tragedy from the corruption of the dwarf king Durin III (Peter Mullan) and the elven smith Celebrimbor (Charles Edwards). There’s still some of that in season 3 as the island kingdom of Númenor and the dwarven stronghold of Khazad-dûm inch closer to their dark fates. But the show also spends too much time taking the same approach as Solo: A Star Wars Story, providing unnecessary origins for everything from the construction plans of Lothlorien to the origins Gandalf’s hat.</p>    \n            </blockquote><h2>\n            2 \n        \n                            The Body\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Horror-comedy\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: Kristina Bogic, Geena Meszarous, Sara Boustany\n                        </li>\n            </ul>\n<p><em>The Body </em>is set in 2004 and follows a dance team at a Catholic High School located somewhere in the Northeast. After partying too hard and botching a dance initiation ceremony, the girls inspire a mass hysteria in the town, with residents believing they have a saint in their midst.</p>    <p>Per our Polygon <a href=\"https://www.polygon.com/the-body-review-netflix/\" target=\"_blank\" rel=\"noopener\">review</a>:</p>    <blockquote>\n                        <p>One of the best parts of The Body is its many references. Shephard borrows archetypes and textures from films like Bring It On, Mean Girls, and White Chicks. Story-wise, there are clear shades of The Crucible and The Exorcist. The show’s cast of characters take these archetypes and complicate them. With dyed eyebrows and a sweet but alienating approach, Lisbeth feels like Needy from Jennifer’s Body with a dash of Brigitte from Ginger Snaps. Anya and Elise are clear successors to Bring It On’s Torrance and Missy, who raised a generation of queer viewers with their ridiculously charged friendship. But the great thing about The Body is that even though it depicts the aughts and the social concerns of the era, it’s made in 2026, allowing the writers to revisit these tropes and probe further.</p>    \n            </blockquote><h2>\n            3 \n        \n                            The Good Daughter\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Peacock </strong>\n                        </li>\n                    <li>\n                                        Genre: Thriller\n                        </li>\n                    <li>\n                                        Episode count: 6\n                        </li>\n                    <li>\n                                        Cast: Rose Byrne, Meghann Fahy, Brendan Gleeson\n                        </li>\n            </ul>\n<p>Set in Georgia,<em> The Good Daughter</em> follows two estranged sisters reunited by a school shooting that may be closely tied to their past. The women have spent years apart due to an incident in their childhoods, when a group of men broke into their home, killing their mother and leaving one of them gravely injured.</p>    <h2>\n            4 \n        \n                            12 12 12\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Apple TV</strong>\n                        </li>\n                    <li>\n                                        Genre: Crime-thriller\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: Anthony Mackie, Jamie Dornan, Kali Reis\n                        </li>\n            </ul>\n<p>Following a massive heist in Europe, <em>12 12 12 </em>follows three timelines and two main characters: Paul (Jamie Dornan), the skilled criminal who pulled off the heist, and Jack (Anthony Mackie), a disgraced FBI agent with a personal vendetta against Paul.</p>    <h2>\n            5 \n        \n                            Murder in Galicia\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Crime\n                        </li>\n                    <li>\n                                        Episode count: 3\n                        </li>\n                    <li>\n                                        Cast: Tristan Ulloa, Miguel Borines, Carlos Blanco\n                        </li>\n            </ul>\n<p>Based on the real-life crime of Isabel Fuente, “Murder in Galicia” is a scripted series following a seemingly perfect aging couple based in a small town in Spain. After the woman is almost beaten to death after a break-in at their house, a civil guard becomes convinced that the culprit is actually the husband.</p>    <h2>\n            6 \n        \n                            Silent Night\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on HBO Max</strong>\n                        </li>\n                    <li>\n                                        Genre: True crime\n                        </li>\n                    <li>\n                                        Episode count: 6\n                        </li>\n                    <li>\n                                        Cast: Lukasz Simlat, Dariusz Chojnacki, Tomasz Wlosok\n                        </li>\n            </ul>\n<p>Based on a series of notorious crimes that took place on Christmas Eve in a small town in ‘70s Poland, the 6-episode series tells the story of the three murders that were committed on a snowy night in the town, initially staged as a hit-and-run.</p>    <h2>\n            7 \n        \n                            The Secret Lives of Mormon Wives: Orange County\n                    \n       </h2>\n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Reality TV\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: N/A\n                        </li>\n            </ul>\n<p>The spin-off series trades the internet-famous Salt Lake City moms and swaps them for a new location: Orange County. The new reality series follows a new batch of influencers and features moments captured in famous reality TV destinations like Laguna Beach and Huntington Beach.</p>    <h2>\n            8 \n        \n                            Power\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Crime\n                        </li>\n                    <li>\n                                        Episode count: 63\n                        </li>\n                    <li>\n                                        Cast: Omari Hardwick, Joseph Sikora, 50 Cent\n                        </li>\n            </ul>\n<p><em>Power</em>, the Starz series that ran for six seasons, is now available on Netflix in full. The show follows a wealthy New York City club owner who’s also a drug kingpin and is trying to leave his life of crime behind to protect and focus on his family.</p>"},{"title":"The President Nominates Circuit Judges, Not Senators","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/11/11/the-president-nominates-circuit-judges-not-senators/","category":"law","categoryLabel":"Law","wordCount":774,"readingTime":4,"content":"<h2><a href=\"https://reason.com/volokh/2026/11/11/the-president-nominates-circuit-judges-not-senators/\" target=\"_blank\" rel=\"noopener\">The President Nominates Circuit Judges, Not Senators</a>\n\t\t\t\t\t<p>Circuit seats belong to the circuit, and not to the state.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t11.11.2026 1:12 PM\n</p>\n\t</h2>\n\t\n\t\t<p>There has been a momentous shift in the relationship between the President and the Senate, and most people have missed it.</p>\n<p>Let's start with the Eighth Circuit. The Trump Administration interviewed Justice Cody Hiland, but determined he was not up to the task of being a circuit judge, so they offered him a federal district court seat as a consolation prize. Hiland shot back at the White House Counsel and refused the seat. He even wanted to rub it in Trump's face. The White House made a stellar nomination with Judge Lee Rudofsky. Hiland then told <a href=\"https://reason.com/volokh/2026/11/09/justice-cody-hiland-publicly-criticizes-the-president-for-nominating-him-to-district-court-instead-of-eighth-circuit/\" target=\"_blank\" rel=\"noopener\">an entire room of law students</a> about his experience as a lesson that should be learned. But Hiland had a friend in a high place. Senator Boozman of Arkansas lobbied Senator Tillis of North Carolina and Senator Cornyn of Texas to block Judge Rudofsky.</p>\n<p>Apparently there were some discussions between the President and Boozman, and the President folded. Maybe Trump determined that he needed as many judges confirmed before January, so the identity of the judge didn't matter. Maybe Trump didn't want to create more problems with his caucus. Maybe Trump just didn't care. Who knows? Trump withdrew Rudofsky and nominated Hiland. There is no guarantee that Hiland gets a hearing and makes it through the process. We are so late in the game. And frankly, I wouldn't blame some of the other conservative senators from the Eighth Circuit for putting Hiland through the paces at the hearing. It's not clear to me he'll be able to answer all the questions. But regardless of what happens, Senator Boozman won and President Trump lost.</p>\n<p>Now, onto my home, the Fifth Circuit. It is painfully clear there was some sort of deal between Judge Southwick and Senator Wicker. In no universe would the White House have picked Todd Butler without that deal. I've yet to hear anyone provide me a single shred of evidence that he is conservative beyond saying \"All southern lawyers are conservative. Plus he's a Christian.\" What about Nathan Johnson and <a href=\"https://reason.com/volokh/2026/11/08/talaricos-christianity/\" target=\"_blank\" rel=\"noopener\">James Talarico</a>? Moreover, Southwick announced on September 29 that he would take Senior Status, making it virtually impossible for another nominee to be selected.</p>\n<p>Yesterday, I watched Butler's confirmation hearing with interest. He received a few softballs from Senator Grassley, a very warm welcome from Senator Kennedy, and some surprisingly nice questions from Senator Booker about representing police officers. Butler did not seem to understand departmentalism and mis-cited <em>Marbury v. Madison</em>. His answers were not particularly articulate--roughly on par with his oral argument before the Supreme Court. There was no depth or curiosity conveyed.  I actually think Butler tripped up on Senator Blumenthal's questions about January 6 and the election, but it didn't matter. He sailed through. Members of the conservative legal movement have raised doubts about Butler. But there were no tough questions asked by Senators Cruz, Lee, Hawley, Schmidt, or others. Only they know why they stayed out. Senator Wicker prevailed, and the President lost.</p>\n<p>Then there is the bizarre situation in Oklahoma. Someone yesterday asked me if I knew what Senator Armstrong was doing. My response was, \"Who is Senator Armstrong?\" He is the temporary senator appointed to fill Senator Mullins's seat. As Mike Fragoso <a href=\"https://www.nationalreview.com/bench-memos/whats-the-matter-with-oklahoma\" target=\"_blank\" rel=\"noopener\">relays</a>, Armstrong is blocking the nomination of Zach West to the District Court in Oklahoma. This is all about some sort of squabble between West and defeated-AG Drummond. Armstrong returned a blue slip but is now trying to take it back. That's not how things work. If Armstrong prevails here, the President will lose.</p>\n<p>Circuit seats belong to the circuit, and not to the state. It bothers me that \"home state\" senators introduce circuit court nominees. That pageantry reinforces the wrong message. Hiland's seat does not belong to Arkansas and Butler's seat does not belong to Mississippi.</p>\n<p>Unfortunately, Trump's surrender here has created a terrible precedent. Should the Republicans ever again return to power, I would hope this entire process is reconsidered. Circuit court nominees should be treated as \"at large\" seats. Senators can make recommendations, but they cannot dictate who is picked. Worse, judges (like Southwick) should not be allowed to make these deals. We should not tolerate incentive structure where motivated actors can control who represents an entire circuit. Maybe the better approach is to start consulting with <em>all</em> the Senators in a given circuit on possible picks, and then pick the best athlete.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/11/11/school-board-can-order-high-school-teacher-to-remove-hate-has-no-home-here-rainbow-poster/\" target=\"_blank\" rel=\"noopener\">NEXT: School Board Can Order High School Teacher to Remove \"Hate Has No Home Here\" Rainbow Poster</a>\n    </p>"}];
