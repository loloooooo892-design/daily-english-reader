*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

.meta .sep {
  margin: 0 0.4em;

}

h1 {

  display: flex;
  align-items: center;
  justify-content: space-between;

  font-size: 0.8125rem;

.swap-btn:hover {

}

.swap-btn:disabled {

}

.swap-counter {

.article-body p {

.article-body h2, .article-body h3, .article-body h4 {

.article-body h3 { font-size: 1.175rem; }

.article-body blockquote {

}

.article-body ul, .article-body ol {

  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {

  padding-top: 1.5rem;

.footer a {

.archive-link {

.archive-link a {

@media (max-width: 480px) {

<script>
var articles = [{"title":"Trump administration takes important immigration question back to the Supreme Court","source":"SCOTUSblog","author":"Kelsey Dallas","url":"https://www.scotusblog.com/2026/09/trump-administration-takes-important-immigration-question-back-to-the-supreme-court/","category":"law","categoryLabel":"Law","wordCount":682,"readingTime":4,"content":"<p>On Sept. 11, the Trump administration <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-886/423952/20260911150332786_25-886%20-%20Letter%20from%20Petitioners%20Regarding%20Forthcoming%20Dismissal.pdf\" target=\"_blank\" rel=\"noopener\">notified</a> the Supreme Court that <a href=\"https://www.scotusblog.com/cases/genalo-v-black/\" target=\"_blank\" rel=\"noopener\"><em>Genalo v. Black</em></a>, an immigration <a href=\"https://www.scotusblog.com/cases/genalo-v-black/\" target=\"_blank\" rel=\"noopener\">case</a> set to be argued in October, was now moot – that is, no longer a live controversy – and should be dismissed from the oral argument docket. However, U.S. Solicitor General D. John Sauer noted that the administration hoped the justices would still “resolve the questions presented” during the 2026-27 term, explaining that his team would work to “identify[] alternative vehicles” with which to return the issue to the court.</p><p>Ten days later, on Monday, Sept. 21, the administration filed a new <a href=\"https://www.justice.gov/sites/default/files/2026-09/d.c._pet_final.pdf\" target=\"_blank\" rel=\"noopener\">petition for review</a> that covers the same essential ground as the dismissed case. In doing so, however, it skipped over the federal appeals court that would typically weigh in before the Supreme Court. “The Court has previously granted certiorari before judgment to allow a case to replace one that was dismissed,” Sauer wrote, urging the justices to “do the same here.”</p><p>Like <a href=\"https://www.scotusblog.com/cases/genalo-v-black/\" target=\"_blank\" rel=\"noopener\"><em>Genalo v. Black</em></a> before it, <a href=\"https://www.scotusblog.com/cases/genalo-v-dc/\" target=\"_blank\" rel=\"noopener\"><em>Genalo v. D.C.</em></a> addresses due process rights and <a href=\"https://www.law.cornell.edu/uscode/text/8/1226\" target=\"_blank\" rel=\"noopener\">Section 1226(c)</a> of the Immigration and Nationality Act, which requires the detention of noncitizens, including green card holders, who have committed certain crimes and who are awaiting removal proceedings. Specifically, the case asks at what point, if any, noncitizens detained for an extended period under Section 1226(c) have a due process right to a bond hearing under the Fifth Amendment and what the government must show to justify continued detention if such a hearing is indeed required.</p><p>The Supreme Court previously addressed Section 1226(c) in 2018’s <a href=\"https://www.scotusblog.com/cases/jennings-v-rodriguez/\" target=\"_blank\" rel=\"noopener\"><em>Jennings v. Rodriguez</em></a>, holding that the statute itself did not require periodic bond hearings. While weighing that case, the justices considered – but did not resolve – the question of whether, amid a lengthy detention, due process would eventually require such hearings.</p><p>In June, the court granted review in <em>Genalo v. Black </em>to answer that question. The noncitizens in that case, Carol Williams Black and Keisy G.M., had been detained for approximately seven and 21 months, respectively, under Section 1226(c). However, Black had voluntarily left the United States even before the justices agreed to take up the case, while New York Gov. Kathy Hochul <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-886/422591/20260831163920404_25-886%20Brief.pdf#page=75\" target=\"_blank\" rel=\"noopener\">pardoned</a> G.M. in August, which meant he was no longer deportable under the statute. In September, the Trump administration and attorneys for the challengers <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-886/423960/20260911152704886_25-886_Joint_Stipulation_FINAL.pdf\" target=\"_blank\" rel=\"noopener\">agreed</a> that the case should be dismissed.</p><p>The new case, <em>Genalo v. D.C., </em>involves a man identified only as D.C. in court filings, who was born in the Dominican Republic in 1963 and “unlawfully entered the United States” “[a]t an unknown time and place,” according to the <a href=\"https://www.justice.gov/sites/default/files/2026-09/d.c._pet_final.pdf#page=20\" target=\"_blank\" rel=\"noopener\">petition</a>. While in the U.S., D.C. has apparently “been convicted of multiple crimes,” and the Department of Homeland Security detained him under Section 1226(c) in September 2025 after his most recent prison stay ended. In March, D.C. challenged his prolonged detention as a violation of his due process rights, and a federal district court <a href=\"https://cdn.sanity.io/files/pito4za5/production/b9c755d32f5c4dd7aa43326f58ca78cf6a386564.pdf#page=42\" target=\"_blank\" rel=\"noopener\">agreed</a> that he had a constitutional right to a bond hearing. That bond hearing has since taken place, and D.C. was released from DHS custody on <a href=\"https://www.justice.gov/sites/default/files/2026-09/d.c._pet_final.pdf#page=25\" target=\"_blank\" rel=\"noopener\">March 31</a>.</p><p>The Trump administration on Monday asked the Supreme Court to review that district court ruling and return the issue of immigration detention without bond to the 2026-27 oral argument docket. D.C.’s response is due by Oct. 21.</p><p>In a second <a href=\"https://www.scotusblog.com/cases/trump-v-suri/\" target=\"_blank\" rel=\"noopener\">petition for review</a> filed on Monday, the Trump administration asked the justices to address district courts’ authority over claims by a noncitizen challenging the validity of his detention while he awaits removal proceedings, when the claims also go to the validity of the grounds for his removal – an issue that district courts do not have the authority to review. The case centers on the Trump administration’s decision to detain Georgetown University scholar Badar Khan Suri and begin removal proceedings. Suri, an advocate of Palestinian rights, contends that the detention violated his free speech and due process rights.</p><p><strong>Recommended Citation: </strong>Kelsey Dallas, <em>Trump administration takes important immigration question back to the Supreme Court</em>, SCOTUSblog (Sep. 22, 2026, 3:35 PM), https://www.scotusblog.com/2026/09/trump-administration-takes-important-immigration-question-back-to-the-supreme-court/</p>"},{"title":"More Sunshine with Joey Arias and Basil Twist","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/10/05/more-sunshine-with-joey-arias-and-basil-twist","category":"fun","categoryLabel":"Interesting Reads","wordCount":659,"readingTime":4,"content":"<p>Recently, at the <em>HERE</em> Arts Center, near SoHo, the puppeteer Basil Twist, the performance artist Joey Arias, and six unseen puppeteers (“They’re wearing black velvet, hood on, like ninjas,” Twist said) were rehearsing the grand finale of “Arias with a Twist,” their cabaret fantasia from 2008. To the zingy “You Gotta Pull Strings,” from “The Great Ziegfeld,” puppet chorus girls in feathers and fish-nets exited the stage, a Mylar curtain opened, and Arias—Bettie Page bangs, sheer top, Adidas pants—entered, sprawled on a Twistian three-layer cake with showgirls’ legs extending from it like flower petals. Mirrors appeared, the music intensified, and King Kong-size showgirl calves stepped in from stage left and stage right. Meanwhile, the cake wiggled uncertainly. Twist called out, “Can we pause?” He crouched in front of the cake, raising its white fabric frosting. “How can we help?” he asked.</p><p>“Hmm,” the cake said. After they chatted, Twist stood. “Let’s take it from the Mylar curtain!” Triumph: the cake spun like a top, its legs high-kicking in unison. Arias, blissful, waved his own legs in the air.</p><p>The Center’s theatre, named for Twist’s grandmother Dorothy B. Williams, is underground; upstairs, Twist and Arias talked about the revival. “It feels fantastic,” Arias, who wouldn’t disclose his age (“I like to round up to a hundred”), said. “It’s, like, more sunshine, more happiness. It is never, like, ‘Oh, it’s too much beauty! Too much art!’ ”</p><p>Twist, who is fifty-seven, said that they’d written the show quickly, after <em>HERE</em>, Twist’s artistic home, had a sudden cancellation. He’d approached Arias, who had just returned from Las Vegas after an eight-year stint starring in Cirque du Soleil’s “Zumanity.” Arias, a fan of Twist’s productions, was game. “Every time I saw Basil, I was, like, ‘Put me in the show!’ ” he said. They wrote it together. “He goes, ‘What do you want to do?’ ” Arias recalled. “I said, ‘Get abducted by aliens, go on an acid trip, and have a Busby Berkeley finale with a big cake!’ ” They riffed on themes for Arias’s return: A desert? Dalíesque Surrealism? Ooh, a jungle?</p><p>“We got a whole bunch of donated green fabric, and there was suddenly a jungle,” Twist said. “Corduroy, velvet, cotton, silk.”</p><p>The two friends met in the mid-nineties, through Twist’s then boyfriend, whom Arias had met while working at a boutique. “Everybody went to Fiorucci!” Arias said. “This beautiful blond guy—hot pants in the summertime, skating, like, wow!—goes, ‘I’m Bobby Miller. I’m a photographer.’ ” One night, at the club Jackie 60, “Bobby said, ‘I want to introduce you to my boyfriend, Basil Twist.’ ”</p><p>Twist said, “Bobby introduced me to a whole world of night life. I had just returned to New York from puppet school in France.” (Twist was the first American to graduate from l’École Nationale Supérieure des Arts de la Marionnette.) He first came to <em>HERE,</em> with Miller, for “a gay country-Western cabaret called ‘Y’all.’ Bobby was doing his poetry, and I did a little puppet show,” he said. “Later, I did a bigger project here with Mabou Mines. And the Halloween parade also starts outside these doors! By the way, this year, Joey’s going to be the grand marshal.”</p><p>“The daughter of darkness!” Arias said. “I’m representing what the avant-garde, what art, stands for, and that it’s thriving and it’s alive. It’s going to be beautiful.”</p><p>Twist and Arias first performed together at a launch party for the fashion publication <em>MAO MAG</em>. “I have these marionettes of my grandfather’s on display in the case outside the theatre,” Twist said. His grandfather, a bandleader, had several bandleader puppets—Harry James, Cab Calloway, Paul Whiteman, Arturo Toscanini, and Ted Lewis, each playing an instrument. “I thought, I’ll use these puppets for Joey, because I love him.” On a little stage, “they came alive with Joey flirting with them, playing with them.” The puppets return in the revived “Arias with a Twist,” and the chemistry remains.</p>"},{"title":"A long-requested feature no one imagined would ever arrive is coming to Call of Duty: Warzone with Modern Warfare 4's first season","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/call-of-duty-warzone-skin-toggle-modern-warfare-4","category":"gaming","categoryLabel":"Gaming","wordCount":507,"readingTime":3,"content":"<p>Cosmetic surgery.</p>\n    \n  \n  \n  \n  \n            <p>Call of Duty: Modern Warfare 4 is introducing a highly-requested feature to Warzone later this year. With the launch of the game's first season, players will be able to turn off character skins from other Call of Duty games in the free-to-play mode.</p>\n<p>When the filter is turned on, you'll only see Modern Warfare 4 character skins in the lobby and matches. This is notable for a number of reasons, not least because developer <a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-keep-the-receipts\" target=\"_blank\" rel=\"noopener\">Infinity Ward committed to taking an \"authentic\" and \"grounded\" approach to Modern Warfare 4 skins and future collaborations</a>. In other words, all the skins you're going to see will be the ones that exist in Modern Warfare 4.</p>\n<p>\"This all-new filter has been built specifically for the Modern Warfare 4 chapter, giving players more control over the operator skins they see in Call of Duty: Warzone only,\" <a href=\"http://callofduty.com/blog/2026/09/call-of-duty-modern-warfare-4-warzone-season-1-operator-toggle\" target=\"_blank\" rel=\"noopener\">a post on the official blog reads</a>.</p>\n<p>Since its introduction in 2020, Warzone has become a melting pot for yearly Call of Duty releases. The free-to-play mode has accumulated hundreds of character and weapon skins, weapon builds, blueprints and countless cosmetics from various COD titles over the years. Given the differing themes of each game, and each developer's approach to how silly the skins could get, Warzone ended up with an amalgamation of looks that rarely go well together.</p><p>As the size of Warzone's skin wardrobe grew, so too did players' desire for a toggle that prevented them from seeing skins they felt didn't fit with the mode's aesthetic. <a href=\"https://www.eurogamer.net/games/call-of-duty-2024\" target=\"_blank\" rel=\"noopener\">Black Ops 6</a> and 7, for instance, featured collaborations with American Dad, The Boys, Beavis and Butt-Head and many other franchises whose character and look don't fit with Call of Duty's.</p>\n<p>The arrival of the skin toggle is something many thought would never happen, not due to any potential technical hurdles, but simply because a major selling point of those skins is that other players can see you as that character. The filter only turns the skin off for the player who toggles it on, not everyone in the lobby - and crucially not the player who bought said skin.</p>\n<p>It's also worth keeping in mind that there's no way for players to know how many of their teammates and enemies in any given match have the filter on or off, a key point those in favour of the filter's existence have relied on in the past.</p>\n<p>While the filter is welcome, it doesn't stop <a href=\"https://www.eurogamer.net/companies/infinity-ward\" target=\"_blank\" rel=\"noopener\">Infinity Ward</a> and Activision adding skins players may consider wacky or out-of-place down the line. Indeed, this is not a 'smart' filter that identifies which skins fit and which do not; it simply turns off skins from other games all together.</p>\n<p>As it stands, the filter is exclusive to Warzone, but I imagine players will ask for it in Modern Warfare 4 multiplayer if/when post-launch skins arrive which they deem inappropriate for the game's atmosphere.</p>\n<p>Modern Warfare 4 arrives 23rd October on PC, PS5, Xbox Series X/S and <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a>.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 1 more"},{"title":"Tesla delays Roadster 2 event again due to bad weather","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/09/28/tesla-delays-roadster-2-event-again-due-to-bad-weather/","category":"tech","categoryLabel":"Technology","wordCount":565,"readingTime":3,"content":"<p>Tesla is pushing back the reveal of its redesigned, second-generation Roadster once again, this time due to a forecast of severe weather.</p>\n<p>Originally slated for October 1 in Waco, Texas, the event is being pushed to October 15, Tesla said.</p>\n<p>“We’ve been tracking the weather closely with local meteorologists, but given the severe conditions predicted &amp; because this event can only be held outdoors, we’ve made the difficult decision to reschedule,” the company <a href=\"https://x.com/Tesla/status/2104647484169728442\" target=\"_blank\" rel=\"noopener\">wrote</a> in a post on X.</p>\n<p>The event presumably needs to be held outdoors because Tesla has been working on integrating cold gas thrusters from SpaceX that are supposed to make the Roadster fly in some capacity.</p>\n<p>This reveal has been delayed many times before, and Musk has pushed it for months altogether before this scheduled date. At one point, Musk even planned to hold the event <a href=\"https://techcrunch.com/2025/11/06/tesla-delays-reveal-of-production-roadster-2-to-april-fools-day/\" target=\"_blank\" rel=\"noopener\">on April Fools’ Day of this year</a>. He said during Tesla’s annual meeting in 2025 — the same one where he was awarded a $1 trillion pay package — that an April Fools’ Day event would offer him “some deniability” if it got delayed again.</p>\n<p>“Like, I could say I was just kidding,” he said at the time.</p>\n<p>Tesla first showed off its concept of a second-generation Roadster in 2017 at an event where it debuted the Semi, the company’s electric big rig. The new-look roadster was supposed to be the first supercar the company designed from the ground up, as the original Roadster, which got the company its start in the early 2010s, was largely based on the Lotus Elise.</p>\n<p>At the time, Tesla promised the new Roadster was just a few years away. It collected $50,000 deposits from prospective customers of the car, which had an estimated base price of around $200,000. Some people even paid the company $250,000 to reserve one of 1,000 “Founders Series” versions of the supercar.</p>\n<p>The project languished for years, until Musk reportedly tasked the Tesla team with redesigning the second-generation Roadster and committed to the idea of using the SpaceX thrusters.</p>\n<p>The promise of something outrageous like a flying car hasn’t been enough to tame critics of Musk and Tesla. Last year, <a href=\"https://techcrunch.com/2025/11/01/elon-musk-wants-you-to-know-that-sam-altman-got-a-refund-for-his-tesla-roadster/\" target=\"_blank\" rel=\"noopener\">OpenAI CEO Sam Altman</a> wrote on X that “7.5 years has felt like a long time to wait” for his own new Roadster, though Musk claimed Altman had gotten a refund.</p>\n<p>Much like the Roadster will be at this event, the ship date for the vehicle is up in the air. Musk has said he expects it to take a year or more before the new Roadster goes into production after it is finally revealed.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Sean O’Kane is a reporter who has spent a decade covering the rapidly-evolving business and technology of the transportation industry, including Tesla and the many startups chasing Elon Musk. Most recently, he was a reporter at Bloomberg News where he helped break stories about some of the most notorious EV SPAC flops. He previously worked at The Verge, where he also covered consumer technology, hosted many short- and long-form videos, performed product and editorial photography, and once nearly passed out in a Red Bull Air Race plane.</p>\r\n<p>You can contact or verify outreach from Sean by emailing <a href=\"mailto:sean.okane@techcrunch.com\" target=\"_blank\" rel=\"noopener\">sean.okane@techcrunch.com</a> or via encrypted message at okane.01 on Signal.</p>\t\n<p>\n\t<a href=\"https://techcrunch.com/author/sean-okane/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"}];
