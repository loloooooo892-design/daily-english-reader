*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"Recruitment of foreign nationals in Russia-Ukraine War amounts to human trafficking, Amnesty International says","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/recruitment-of-foreign-nationals-in-russia-ukraine-war-amounts-to-human-trafficking-amnesty-international-says/","category":"law","categoryLabel":"Law","wordCount":529,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/recruitment-of-foreign-nationals-in-russia-ukraine-war-amounts-to-human-trafficking-amnesty-international-says/#\" target=\"_blank\" rel=\"noopener\">Recruitment of foreign nationals in Russia-Ukraine War amounts to human trafficking, Amnesty International says</a>\n</strong><p>Amnesty International on Thursday<a href=\"https://www.amnestyusa.org/reports/russia-trafficking-of-foreign-nationals-to-fight-in-ukraine/\" target=\"_blank\" rel=\"noopener\"> condemned</a> Russia’s recruitment of foreign nationals from socioeconomically disadvantaged countries to fight in Ukraine as human trafficking, stating that they were primarily recruited via deceptive job offers, had their immigration status exploited, and were handed over to Russian military forces by third-party actors. </p><p>Commenting on the issue, Agnès Callamard, a French human rights activist and the Secretary General of Amnesty International stated:</p><blockquote><p>The human suffering caused by the trafficking of foreign nationals by Russia, or by those it has enabled and incentivized, is not restricted to the front line in Ukraine. These recruitment networks reach far and wide, into vulnerable communities across the world, leaving a trail of exploitation, loss, and pain far beyond war-torn Ukraine…There must be full accountability for all those directly involved and all those complicit, whether as private recruiters or intermediaries, state officials or military commanders. Wherever <a href=\"https://docs.un.org/en/A/78/172\" target=\"_blank\" rel=\"noopener\">human trafficking</a> has occurred, its victims and survivors should be identified and treated as such, with all evidence collected and preserved in order to pursue those responsible.</p></blockquote><p>Russia has recruited thousands of foreign nationals from low-income countries, as well as migrants and refugees already living in Russia, to fight in its war in Ukraine. Recruitment has frequently involved coercive and exploitative practices. Many recruits were lured by false promises of civilian employment, high salaries, legal status or Russian citizenship, but promptly find themselves on the front lines in Ukraine.</p><p>The <a href=\"https://commonslibrary.parliament.uk/research-briefings/cbp-9476/\" target=\"_blank\" rel=\"noopener\">Russo-Ukrainian war</a> began in February 2014 when Russia occupied and annexed Crimea from Ukraine, following the Ukrainian Revolution. Russia then supported <a href=\"https://www.congress.gov/crs_external_products/R/PDF/R45008/R45008.7.pdf\" target=\"_blank\" rel=\"noopener\">Russian separatist armed groups</a> who started a war in the eastern Donbas region against Ukraine’s military, which was declared occupied in 2018. The current and largest phase of the war began in February 2022, when Russia launched a <a href=\"https://www.huri.harvard.edu/russo-ukrainian-war\" target=\"_blank\" rel=\"noopener\">full-scale invasion</a> of Ukraine and began occupying more of the country. The war has resulted in a <a href=\"https://www.jurist.org/features/2022/03/15/eus-heroic-embrace-of-ukraines-refugees-raises-questions-on-its-treatment-of-syrian-afghan-asylum-seekers/\" target=\"_blank\" rel=\"noopener\">refugee crisis</a> and hundreds of thousands of deaths.</p><p>Today, most enlistees are deployed to the front lines within just two weeks of commencing training, with no military experience required for commitment. The organization pointed out that foreign recruits often<a href=\"https://understandingwar.org/research/russia-ukraine/russian-force-generation-and-technological-adaptations-update-may-30-2025/\" target=\"_blank\" rel=\"noopener\"> lacked preparation and equipment</a>, alongside having limited communication with commanders due to language barriers. It also said the two-week deployment timeline indicates that Russia’s recruitment of foreign nationals is intended primarily to boost front-line numbers rather than to ensure combat readiness. </p><p>Amnesty International is now calling on Russia to immediately end all <a href=\"https://www.jurist.org/news/2025/07/un-experts-call-on-russia-to-end-trafficking-and-forced-labour-exploitation-of-migrant-women/\" target=\"_blank\" rel=\"noopener\">abusive and coercive practices</a> involving the military recruitment of foreign nationals and refugees, and their treatment in training centers and at the front line. States with vulnerable populations bear a responsibility to dismantle human trafficking networks, hold perpetrators legally accountable, and ensure comprehensive restitution for victims of exploitation. </p><p>The prohibition of human trafficking is recognized as a <a href=\"https://opil.ouplaw.com/display/10.1093/law:epil/9780199231690/law-9780199231690-e1437\" target=\"_blank\" rel=\"noopener\">jus cogens norm</a>, which is a non-derogable human right that <a href=\"https://www.euaa.europa.eu/easo-practical-guide-qualification-international-protection/2-act-violation-non-derogable-human-right-or-sufficiently-severe-violation-another-basic-human-right\" target=\"_blank\" rel=\"noopener\">cannot be stripped</a> under any circumstances, including times of war. Additionally, the practice is also barred under <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/protocol-prevent-suppress-and-punish-trafficking-persons\" target=\"_blank\" rel=\"noopener\">Article 3</a> of the Palermo Protocol and <a href=\"https://www.echr.coe.int/documents/d/echr/convention_ENG\" target=\"_blank\" rel=\"noopener\">Article 4</a> of the European Convention on Human Rights (ECHR), which European Courts have <a href=\"https://hudoc.echr.coe.int/eng#{%22itemid%22:[%22001-96549%22]}\" target=\"_blank\" rel=\"noopener\">interpreted to include</a> human trafficking. </p>"},{"title":"What we've been playing - \"Well this is embarrassing, we're wearing the same outfit!\"","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/what-weve-been-playing-well-this-is-embarrassing-were-wearing-the-same-outfit","category":"gaming","categoryLabel":"Gaming","wordCount":943,"readingTime":5,"content":"<p>A few of the games that have us hooked this week.</p>\n    \n  \n  \n  \n\n            <p>Unluckily for you all, Bertie's having a well-earned long weekend (possibly skiing, possibly jumping on the spot, possibly just having a nice lie down after the chaos of it all), meaning you're stuck with me on intro duties for What We've Been Playing this time around.</p>\n<p>And while most of what I <em>personally</em> have been playing is FromSoftware's <a href=\"https://www.eurogamer.net/games/elden-ring-nightreign\" target=\"_blank\" rel=\"noopener\">Nightreign</a> - for reasons that will become clear later - it turns out some of the team's in a bit of a communally Star Wars mood. Both Connor and Chris have come over all tactical, spending the week strategising their way through Zero Company. Dom, meanwhile has been adventuring in considerably different climes, revisiting 2023's Wo Long: Fallen Dynasty.</p>\n<p>Which is us covered, but what about you? What have <em>you</em> been playing this week?</p>\n<p>And if you've ever wondered what we were playing - or indeed what you were playing - in the weeks gone by, you can skip gaily through the pleasant memories of the past by perusing the <a href=\"https://www.eurogamer.net/topics/what-weve-been-playing\" target=\"_blank\" rel=\"noopener\">The What We've Been Playing archive</a>.</p>\n<h3>Star Wars: Zero Company, PS5</h3>\n<p>I'm thoroughly enjoying Star Wars Zero Company, despite a few bugs here and there. I made a disgusting looking main character who I hate, but the game is such a snare that I've already sunk around 15 hours into it and I can't stomach the thought of starting over.</p><p>There are already many thousands of words out there about the finer merits of this wonderful tactics game, so I will instead drill down on a particular thing I love. Kabb Uppercut is a fantastic character for a variety of reasons, but I love him as a brilliant entryway to the game's approach to displacing enemies.</p>\n<p>He, as you can guess, uppercuts people. When you uppercut someone, they get sent flying in a chosen direction, and killing someone with this uppercut gives Kabb all his action points back, which is lovely. As such you're encouraged to look for creative ways to knock people into obstacles for additional damage, or even better, into pits or watery holes for instant kills.</p>\n<p>There is a certain type of enemy (who I shan't spoil as the game has just come out) who can be buffed into an incredibly tough-to-kill foe, especially on the 'hard' difficulty. Shooting them with blasters will trigger reaction melee attacks, so you really want to take them out in as few hits as possible. The perfect answer? Punching them into the water. Bam! And you're good to go.</p>\n<p><em>- Connor</em></p>\n<h3>Star Wars: Zero Company, PC</h3>\n\n<p>Well this is embarrassing, we're wearing the same outfit! I've also been playing Zero Company this week (review incoming I promise!) and, surprise, I also think it's great.</p>\n<p>On PC, performance has been pretty choppy - in fact early on it actually prompted me to take my PC apart and give it a much-needed de-dusting and re-application of some CPU thermal paste. But even after that it can chug at times.</p><p>It's also one of those games that is somehow endearing in its moments of jank. I've been thinking a lot about what makes something lovably cheesy, janky, or whatever else, and what makes that stuff just annoying or disappointing. I'm struggling to find the answer - I think it's just a gut thing, you know when you play it. But Star Wars Zero Company is undoubtedly lovable. Maybe I'll leave it at that for now.</p>\n<p><em>- Chris</em></p>\n<h3>Wo Long: Fallen Dynasty Complete Edition, PS5</h3>\n<p>I'm actually playing a few things I can't talk about this week, but something I can is this overlooked gem. I played the sequel at Gamescom (impressions soon, hold your horses) and it instantly made me start salivating like a feral Chang Gui, forcing me to immediately download the original as soon as I got back home.</p>\n<p>I'm finding it much easier on a second playthrough, maybe because I've been playing nothing but 'parry games' in the interceding two years. If you're a Souls fan, give this a go. It's telling that this is what I gravitated back to after wrapping up Onimusha, hm?</p>\n<p><em>- Dom</em></p>\n<h3>Nightreign, PC</h3>\n\n<p>Okay, look, I absolutely bloody <em>loved</em> FromSoftware's recent The Duskbloods closed network test - which came as a significant surprise given how PvP-averse I usually am where these sorts of things are concerned. I won't go too much into the whys of my love, because I've probably got more to say about it elsewhere, but the upshot is there's been a bit of a Duskbloods-shaped hole in my life since the network test came to an end. And keen to fill it, I found myself thinking, 'Well, if I ended up liking The Duskbloods, maybe I just didn't give Nightreign enough of a chance and I should give it another go'. Which is exactly what I've been doing.</p><p>First time around, back at release, I found Nightreign way too fast and way too hard, particularly as I'd struggled to gather enough interested friends to play it in anything but solo. And while I'm still stuck in the solo boat, and still finding its frenetic pace a lot to adjust to compared to the Fromfests I usually adore, I think I am slowly starting to crack it.</p>\n<p>And yesterday, something clicked; I'm starting to learn how the map works; where I can find vital items like flask upgrades and smithing stones, and when I should be levelling or saving my Souls for revives. Have I got through the first night yet? Have I heckers like, but soon Bell Bearing Hunter, your death will come.</p>\n<p><em>- Matt</em></p>"},{"title":"The Warning Benjamin Netanyahu Ignored","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/the-warning-benjamin-netanyahu-ignored","category":"fun","categoryLabel":"Interesting Reads","wordCount":1193,"readingTime":6,"content":"<p>An Israeli news article on Tuesday morning managed to roil even a war-weary and jaded public. <a href=\"https://www.haaretz.com/israel-news/israel-security/2026-09-08/ty-article-magazine/.highlight/netanyahu-got-an-explicit-warning-before-oct-7-he-didnt-brief-security-chiefs/000001a0-7a3b-d7d5-a9fc-7eff3d0f0000\" target=\"_blank\" rel=\"noopener\">Published in <em>Haaretz</em></a>, its headline read: “Netanyahu Received an Explicit Warning Days Before Oct. 7. He Didn’t Brief Israel’s Security Chiefs.”</p><p>The article, drawn from a new book by the journalists Shlomi Eldar and Ruth Yuval, reveals that, a week and a half before Hamas led the October 7th attacks on Israel, Sheikh Mohamed bin Zayed, the President of the United Arab Emirates, called Benjamin Netanyahu, the Israeli Prime Minister, with a specific warning. During a forty-five-minute conversation, according to the report, bin Zayed cautioned that <a href=\"https://www.newyorker.com/news/the-lede/the-killing-of-yahya-sinwar\" target=\"_blank\" rel=\"noopener\">Yahya Sinwar</a>, Hamas’s leader in Gaza, was “preparing a major event” in the near future. Sinwar was quoted in the article as telling an official from the rival Fatah faction that he was planning a “<em>zilzal</em>”—an “earthquake.”</p><p>Netanyahu seemed untroubled, a close adviser to the Emirati ruler told the journalists. He didn’t update the heads of Israel’s security establishment about the conversation. Instead, he assured bin Zayed that Israel was “prepared for any scenario.” If anything, he said, the “volatile” area was not Gaza but the West Bank. Bin Zayed was so startled that Netanyahu was making light of the situation that he expressed concerns to the C.I.A. director, William J. Burns.</p><p>When the article appeared, Netanyahu denied that such a conversation had ever taken place. But the U.A.E.’s foreign ministry appeared to confirm Eldar and Yuval’s reporting, saying in a statement <a href=\"https://www.haaretz.co.il/news/politics/2026-09-08/ty-article/.premium/000001a0-820e-d4aa-a7fd-f24e25660000\" target=\"_blank\" rel=\"noopener\">reported by <em>Haaretz</em></a> that the two countries maintain “open and direct communication,” exchanging intelligence “when necessary.” Eldar told Israel’s Channel 12 that he and Yuval had based their story on talks with three independent sources and on “a recording and documents” of the conversation between Netanyahu and bin Zayed.</p><p>Newsbreaks in <em>Haaretz</em>, a liberal paper with strong investigative reporting, are often met with silence by much of the country, or brushed off as leftist propaganda by Netanyahu and his mouthpieces in the media. This story seemed to land differently. No event has shaped recent Israeli history more than <a href=\"https://www.newyorker.com/news/dispatch/waking-to-an-attack-from-hamas\" target=\"_blank\" rel=\"noopener\">the October 7th attacks</a> and their aftermath. Netanyahu has refused to take responsibility or issue an apology for the failures in intelligence and policy that led to the worst attacks to ever take place on Israeli soil. But his government, for all of its equivocating, cannot deny that it was in power when they occurred. <em>Ynet,</em> a popular news site, echoed the <em>Haaretz</em> report on its home page on Tuesday—an unusual tribute to a rival newspaper; Channel 12 opened its evening-news edition with the story, calling it “jaw dropping.”</p><p>For Netanyahu, the timing of these revelations is especially damaging: they came seven weeks before an election that will mark the first time Israelis head to the polls since the October 7th attacks, <a href=\"https://www.newyorker.com/news/q-and-a/the-humanitarian-catastrophe-in-gaza\" target=\"_blank\" rel=\"noopener\">Israel’s devastation of Gaza</a>, and <a href=\"https://www.newyorker.com/news/global-notes/the-spectacular-failure-and-ruinous-costs-of-the-iran-war\" target=\"_blank\" rel=\"noopener\">the Iran war</a>. Naftali Bennett, a former Prime Minister and a political rival of Netanyahu’s, went on the radio and called the report “true.” He added that Netanyahu had “ignored” warnings not just from bin Zayed but also from Abbas Kamel, a former head of Egyptian intelligence (as another Israeli journalist had previously reported). Bennett did not specify how he learned of these warnings, but he is said to be on good terms with bin Zayed, and has met with him several times.</p><p>Hours later, every Jewish party leader in the opposition joined Bennett in issuing a rare joint statement. “The public has the right to know: What did Netanyahu know, when did he know, why did he not inform the security establishment, and why did he not act to protect the citizens of Israel?” the statement read. “Netanyahu and his partners in the October 7 government are unfit to continue in office,” it concluded.</p><p>When I reached Eldar, hours after his article was published, he said that, so far, Netanyahu had just issued a denial, “without attacks from the poison machine”—a reference to the Prime Minister’s P.R. operation, which is known for ruthlessly antagonizing his critics. <a href=\"https://www.newyorker.com/magazine/2025/01/20/netanyahus-media-poison-machine\" target=\"_blank\" rel=\"noopener\">Yinon Magal</a>, a popular host on Channel 14, a pro-Netanyahu television network, attempted to dismiss the report as nothing but a media “festival.” But, in a video posted online, Magal mentioned early on Tuesday that he had spoken to Netanyahu about it—a suggestion that there is panic behind the scenes.</p><p>When I asked <a href=\"https://www.newyorker.com/news/q-and-a/the-israeli-ultra-hawks-who-feel-betrayed-by-trumps-iran-deal\" target=\"_blank\" rel=\"noopener\">Shimon Riklin</a>, another media personality who is close to Netanyahu, about the report on Tuesday afternoon, he at first feigned indifference, writing in a text message: “What story?” But, when I replied, he immediately unleashed a torrent of complaints and conspiracy theories. “The attempt to portray a situation in which the Prime Minister is the one who needs to convey a warning to the heads of the Army and the Shin Bet, which is precisely their job, is incredibly ridiculous,” he wrote. “There is no such thing as a direct warning from the head of another country. It simply did not happen. Full stop,” he added. “It’s a cynical and crude attempt to accuse Netanyahu of what the Army chiefs are guilty of when they didn’t wake him up.”</p><p>This is a long-standing argument from the Prime Minister’s surrogates in the media: the security establishment didn’t rouse Netanyahu in time to prevent the attacks. In fact, as records make clear, an intelligence message concerning unusual Hamas activity was transmitted to the Prime Minister’s office early that morning, roughly three hours before the attacks. A recent campaign video from <a href=\"https://www.newyorker.com/magazine/2026/08/03/how-netanyahus-top-general-became-his-strongest-challenger\" target=\"_blank\" rel=\"noopener\">Gadi Eisenkot</a>, a former head of the military who is Netanyahu’s main challenger in the upcoming election, lampooned the idea that the Prime Minister hadn’t received an alert. “Bibi, wake up!” the video repeats, as an A.I.-generated video of a sleeping Netanyahu is overlaid with a list of the many warnings about Hamas’s growing capabilities that went unheeded in the years before October 7th.</p><p>As <em>Haaretz</em> readers saw in the article hard proof of Netanyahu’s disregard for warnings, Dahlia Scheindlin, an Israeli expert on public opinion, cautioned that Netanyahu’s supporters “will no doubt have the opposite reaction.” His base—roughly forty per cent of voters—will read about the warning from the U.A.E. and conclude that “<em>Haaretz</em> always wanted to take Netanyahu down and couldn’t until now, so it came out with something fantastical,” she said.</p><p>Riklin had said as much in his texts, arguing that “the Israeli public is not buying this used and false merchandise.” He predicted that “you will witness a right-wing victory in the upcoming elections.” Still, with polls in Israel so tight that every week a different outcome seems likely—from outright majority for the opposition to a stalemate that triggers another election—even a single percentage point could prove decisive.</p><p>In Scheindlin’s view, Tuesday’s news was an event “that we could in hindsight say tipped” the election in the opposition’s favor. Even if polls end up not moving much, a major story about the failings that led to the Hamas attacks appearing so close to an election has to be bad news for the government. As Scheindlin put it, “You don’t want the election to be about October 7th if you’re Netanyahu.” ♦</p>"},{"title":"Top Canon Promo Codes: 30% Off for September 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/canon-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1304,"readingTime":7,"content":"<p>If you know photography, you know Canon. This super advanced, often pricey gear is made more affordable with the ways to save at Canon we’ve found below. Some of the best ways to save on cameras, printers, accessories, and more is during the Canon holiday sales, with our 10% off Canon promo code, and student discounts on some of the best WIRED-tested ide code, we have a few insider tips for getting a 10% discount. If you’re having gear repaired, you can get a single-use 10% off Canon promo code through the Upgrade Program (valid for 14 days). Canon wants to reward full-time industry professionals with their membership structured by different tiers, which gives professionals huge discounts on and other perks on necessary equipment. To sign up for membership, you have to create a MyCanon account, register existing Canon equipment, and click the Canon Professional Service tab to submit an application. After it's been processed and approved by the Canon team, a Welcome Kit will be shipped within 7-10 business days. Best of all, <a href=\"https://www.usa.canon.com/pro/canon-professional-services\" target=\"_blank\" rel=\"noopener\">Canon Professional Service</a> customers get 10% off online orders. Silver tier is the free program which only requires 10 points.</p><p>The Canon PowerShot G7 X Mark II packs everything you need into a pocketable camera.</p><h2>Get $100 Off the EOS R50 V Body</h2><p>If you’re in the market for a new camera, look no further than the EOS R50 V Body—and when you purchase now, you'll get $100 off plus free shipping. The <a href=\"https://www.usa.canon.com/shop/p/eos-r50-v-body\" target=\"_blank\" rel=\"noopener\">EOS R50 V Body</a> has an interchangeable lens for video shooting, with a redesigned user interface including a Vertical Video tripod mount and Front Record button—perfect for content creators of all types. Plus, there’s “Slow and Fast mode” for more creative control of the video frame rate and playback speed, along with dual pixel CMOS AF II tracking with “Register People Priority” and “Auto People, Animal, and Vehicle Subject Detection.” And even if you’re a novice, there’s easy-to-use automatic exposure and scene modes like “movie,” for close-up demo, smooth skin, movie mode, and color filters.</p><h2>Get New Canon Deals in 2026</h2><p>2026 is well underway and the Canon deals just keep rollin’ in. Some of the best rotating <a href=\"https://www.usa.canon.com/pro/deals\" target=\"_blank\" rel=\"noopener\">Canon deals</a> are $350 in savings when you buy a Cinema EOS C80 Series Camera Body or Cinema EOS C80 Series Lens Kit, $50 in savings when you purchase a XA75 Professional Camcorder, and $300 in savings when you buy a CR-N500 Series PTZ Remote Camera.</p><p>Gear can make or break your home office setup. Here’s our ultimate list of nearly 100 items, from monitors and desks to webcams and chairs.</p><p><a href=\"https://cna.st/p/GmtRfVaykMD7z1SW8r3J5FeBxrVhs2YJ89AWsQofgBQj6T45qzg7C733ks9qXaie5awEDyvHLbQXNJnudtbt2FJTsW5zexBSCJMFcaFp2mRyBWNHPo8PbrkVBFwUPxBQ6J7gBKzvaVCNQxtCrHhEf58X92WcLAQD4E6QXe6yVYX9dmj2hzTERxjYZ5NH6dGxQoRAVHxkBsKNn9LQ7mCH8J3rMnTBGXqG57FJxfcX2QC5sLswdfnJuYvpmAkiehfT3sE578ogJT2ps3dZkriLtrrEuqfh6G2CAvWPniRLdrisRM7Gr9gUGQ3RymHB9Z1YWCCGvcELg1gyDVUdZ6aFQvCvdvgwtW1mfaWwXjwW3W9cd5hFftwc26JTLHdD5vL8ZLDnd6SwCJL1kw7QSvZUtjvr2foQhcwpAQQ8ihr2cV\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Canon</p><p>Canon</p><h3>PowerShot G7 X Mark II</h3><p>Canon point-and-shoot camera.</p><h2>Canon Pros and Students Get up to 30% Off</h2><p>If you’re really serious about upping your camera game, there’s the Gold level membership, which costs $100 a year and gets members 20% off repairs on up to 10 products and complimentary maintenance on up to 5 items. Platinum is next, which is $300 per year and gets you 30% off repair discounts on up to 15 products and maintenance covered on 10 products. The top level is cinema, which costs $1,000 per year and has discounts of 30% off repairs on up to 20 products and maintenance covered on up to 10 products.</p><p>If you’re a photography pro, Canon even has an entire <a href=\"https://cna.st/affiliate-link/MqMVDRsypCNABGWG8LuZ112B2LUqDsQFyncNtZPoKiTwMjBD4LJLCQvkXAXhZ2WYtxS2U2XsDyoqqY9DHLNmWaSegx3PThyj9iGSK9wRY5UUeBnhKwqtK1pcKBxEuPdLu4ZTfE55pugeYvEwU6zCo8hLqzZF3ksRmHn72W4aTnC3oSyFW8k7b6AkEgD6G7Y1JMguue ll of these discounted Canon items are certified by Canon and come with a one-year limited warranty, for added peace of mind.</p><p>Their refurbished selection is an awesome way to save tons of money—plus, these cameras are basically indistinguishable from new models. And since they have different restock schedules, you’ll have a better chance at scoring some of their most coveted models, like a Canon EOS Rebel T7 or <a href=\"https://www.wired.com/gallery/things-we-loved-september-2018/\" target=\"_blank\" rel=\"noopener\">Powershot G7 X.</a></p><p>With sharper resolution and lightning-fast performance, Canon’s latest full-frame mirrorless punches well above its class.</p><h2>Score up to $400 Off With Coupons for Canon Printers and Ink</h2><p>Wanting to upgrade your <a href=\"https://www.wired.com/story/work-from-home-home-office-gear-guide/\" target=\"_blank\" rel=\"noopener\">WFH setup</a>? Now may be the perfect time to work in style for less. Canon’s rotating <a href=\"https://cna.st/affiliate-link/3aDLD4v8PzjSrfXUvrXgLMBhdBoYpvy6kGqdj1qsu27mT1W5CKMdwWYC3kjWRxofWmsUNozRxmTMLr21GqFawYVYmfHnAmgSUm8LcRy2FvoFwVAbgbrBGUvUsMQm4DB6rttVbRSC5XQ8SENNbCWsp8t8NyGCj2VNs5pVa57jHdAv7HaPbouo8VH3uSoANaoQZ74w723B4G4bHWUPF55RnpXa2augbdb8K1AJdVosos3DFbVbLhci7thAyv79yeM7q9PNgxm79mhjQD6DXasP1RDzffs7WJeLhxRuVTTmX6XNddRVjDiR3?xid=fr1754336451364hfh&amp;xid=fr1755526384154bee&amp;xid=fr1762204358016jij&amp;xid=fr1764034273306ddh&amp;xid=fr1765393865761aae\" target=\"_blank\" rel=\"noopener\">printer deals</a> can help you save over $360 on laser, Inkjet, and compact or portable printers, including $124 off MegaTank PIXMA G6020 Wireless All-in-One printers, and $256 off Canon’s brand new <a href=\"https://cna.st/affiliate-link/4NeJabgQykde13qrmPRuhidu9SxXHSLRy4sba59DzJ8w8H9SMXbinJgihfR2RN8oPGZSTaLRybioPvpvqtQdxych5K2qs7fc5xnJZujXutSxS84W5RjYAf7YEfR5dUZVr7YiumJiGCCdS2vSspjS7iTTJxK9zD8P5XKy51i8LrsGEvRNrLvzp3Uw2sbQgDCAmTgS2jiGQgzTPPaUSQEZmJEpYnF8qwwCN1wTTS2UggV6fEhECwGvGjpRaF5PWtWpR7c8vsMp function render() {

  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
