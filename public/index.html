*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

<script>
var articles = [{"title":"Fable's story will be '15-20 hours' long, according to its game director, although the game's life systems are 'limitless'","source":"PC Gamer","author":"Rick Lane","url":"https://www.pcgamer.com/games/rpg/fables-story-will-be-15-20-hours-long-according-to-its-game-director-although-the-games-life-systems-are-limitless/","category":"gaming","categoryLabel":"Gaming","wordCount":504,"readingTime":3,"content":"<p>Throughout all of<a href=\"https://www.pcgamer.com/games/rpg/you-can-just-bypass-fables-complex-nuanced-reputation-system-with-enough-gold/\" target=\"_blank\" rel=\"noopener\"> Fable</a>'s showcases and demonstrations this year, one aspect of it has proved difficult to figure out—how big it's going to be. The original Fable games were decently-sized, but not massive, and monster roleplaying games like<a href=\"https://www.pcgamer.com/elden-ring/\" target=\"_blank\" rel=\"noopener\"> Elden Ring</a> and<a href=\"https://www.pcgamer.com/baldur-s-gate-3/\" target=\"_blank\" rel=\"noopener\"> Baldur's Gate 3</a> have dramatically shifted expectations on what an RPG's scope should be.</p><p>But it turns out that Fable will stick closely to tradition when it comes to its size, with the caveat that players could potentially hang around in Playground's RPG forever depending on how invested they become in the world they help to forge.</p><p>Speaking to<a href=\"https://www.polygon.com/fable-game-length-interview-xbox/\" target=\"_blank\" rel=\"noopener\"> Polygon</a> in a Q&amp;A session, associate game director Will Kennedy explained that Fable will have a total of around 40 hours of things to do in the world. \"We have around 15-20 hours of mainline quest gameplay, we have around 15-20 of side and open-world exploration content gameplay,\" Kennedy said.</p>\n\n<p>Fable - Official Combat Gameplay | gamescom 2026 - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/eEKbR70uSLc\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>That's the traditional baseline for an RPG. But Kennedy also pointed out that Fable's life-systems, which allow players to interact with NPCs, commit crimes, buy property and so forth may significantly expand the runtime. \"And then, of course, the life systems are limitless, so you can play them for as long as you want.\" To this, fellow associate game director Craig Litter added that \"You can literally play it forever if that's what you want to do.\"</p><p>It's worth stating at this point that you can play <em>any </em>game forever if you <em>really </em>want to do that. I could probably play<a href=\"https://www.pcgamer.com/doom/\" target=\"_blank\" rel=\"noopener\"> Doom</a> forever even though the base game is not all that long. Nonetheless, if Fable's life simulation elements put it within touching distance of, say, The Sims, then maybe the 'play it forever' claim isn't so far-fetched.</p><p>We were expecting to find out how Fable shapes up relatively soon. But Playground's long-awaited RPG has been pushed to 2027 in order to avoid the looming behemoth that is<a href=\"https://www.pcgamer.com/games/rpg/fable-director-says-they-arent-scared-of-other-big-games-except-one-its-gta-6-in-case-you-were-living-under-a-rock/\" target=\"_blank\" rel=\"noopener\"> Grand Theft Auto 6</a>. Alongside its life simulation, the reboot is swapping out the series'<a href=\"https://www.pcgamer.com/games/rpg/fable-creator-says-its-a-real-shame-the-reboot-is-dropping-the-horns-or-halo-morality-system/\" target=\"_blank\" rel=\"noopener\"> old morality system</a> for a more nuanced, character-specific reputation system, although you'll apparently be able to<a href=\"https://www.pcgamer.com/games/rpg/you-can-just-bypass-fables-complex-nuanced-reputation-system-with-enough-gold/\" target=\"_blank\" rel=\"noopener\"> bypass it if you're rich enough</a>—just like in real life!</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Rick has been fascinated by PC gaming since he was seven years old, when he used to sneak into his dad's home office for covert sessions of Doom. He grew up on a diet of similarly unsuitable games, with favourites including Quake, Thief, Half-Life and Deus Ex. Between 2013 and 2022, Rick was games editor of Custom PC magazine and associated website <a href=\"http://bit-tech.net/\" target=\"_blank\" rel=\"noopener\">bit-tech.net</a>. But he's always kept one foot in freelance games journalism, writing for publications like Edge, Eurogamer, the Guardian and, naturally, PC Gamer. While he'll play anything that can be controlled with a keyboard and mouse, he has a particular passion for first-person shooters and immersive sims.</p>"},{"title":"What the public thinks of the Supreme Court","source":"SCOTUSblog","author":"Charles Franklin","url":"https://www.scotusblog.com/2026/08/what-the-public-thinks-of-the-supreme-court/","category":"law","categoryLabel":"Law","wordCount":1091,"readingTime":6,"content":"<p>The Marquette Law School Poll, which I direct, conducts six polls each year that track approval of the court and ask for the public’s view on the outcome of cases. Our latest poll, conducted from July 22-29, yielded some fascinating results.</p><p>Overall, 47% of respondents said they approved of the job the Supreme Court is doing and 53% disapproved, a slight change from the court’s 46% approval rating in May. Unsurprisingly in our polarized times, approval of the court was strongly related to partisanship, with 74% of Republicans approving of the court’s performance, compared to 35% of independents and only 22% of Democrats. An even larger range of approval was seen across ideological lines, with approval at 80% among those who describe themselves as very conservative, declining to 72% among the somewhat conservative, then dropping to 42% among moderates, and falling to 17% among the somewhat liberal, and to a mere 5% among very liberal adults.</p><p>As SCOTUSblog readers are well aware, President Donald Trump and his administration have been a prominent part of the court’s merits and emergency dockets over the past term, and views of the court are also filtered through that lens. Among all adults, 55% say the court has almost always or most of the time ruled in favor of Trump or the administration, while 45% say it has done so only some of the time or almost never. </p><p>This relatively close divide also masks a substantial difference in perception by party identification. A majority of Republicans, 63%, say the court favors Trump only some of the time or almost never, while a larger majority of Democrats, 77%, think the court rules for Trump almost always or most of the time. Independents are about evenly divided, with 49% saying the court more often sides with Trump and 51% saying it mostly rules against him.</p><p>Interestingly, while the perception that the court supports Trump is negatively related to approval among independents and Democrats, it has no relationship with approval among Republicans. Independents and Democrats who think the court often sides against Trump are more approving of the court than those who think the court mostly sides with Trump. But for Republicans, approval of the court is exactly the same <em>regardless</em> of perception of the court’s support for the president.</p><p><strong>Table 1: Approval of the court by how often it rules for Trump and by party</strong></p><p><em>Among adults</em></p><p><em>Questions: Overall, how much do you approve or disapprove of the way the U.S. Supreme Court is handling its job? Since the beginning of his second term, how often do you think the Supreme Court has ruled in favor of the Trump administration in cases that have reached the court?</em></p><p>If general opinions such as partisanship, one’s ideology, and the court’s ruling for or against Trump matter for approval of the court, what about the more specific reactions to individual rulings? Here we find that, even though less than 50% of the public supports the court’s performance, at least a bare majority, and often substantial majorities, favored 11 of 13 recent court decisions, with the median decision favored by 62% of adults.</p><p>Although a majority of Democrats favored most of these rulings by the Supreme Court, as did a majority of Republicans, they didn’t entirely agree on which decisions they supported. A majority of Democrats favored an average of 8.1 of the 13 decisions, Republicans 7.9, and independents 7.4. A majority of both parties favored only three of these decisions: the <a href=\"https://www.scotusblog.com/cases/chatrie-v-united-states/\" target=\"_blank\" rel=\"noopener\">decision</a> to limit police access to cell phone locations (which was the most popular of the 13 decisions covered in the survey), <a href=\"https://www.scotusblog.com/cases/united-states-v-hemani/\" target=\"_blank\" rel=\"noopener\">gun possession for drug users</a>, and <a href=\"https://www.scotusblog.com/cases/trump-v-cook/\" target=\"_blank\" rel=\"noopener\">preventing</a> the president from removing a member of the Federal Reserve Board.</p><p>In other cases the partisan divide was a chasm; for example, on whether the Trump administration could <a href=\"https://www.scotusblog.com/cases/noem-v-al-otro-lado/\" target=\"_blank\" rel=\"noopener\">restrict asylum seekers</a>, 81% of Republicans favored the ruling while just 22% of Democrats did. Where Trump, or the Trump administration, is a party to the case, the partisan gap tends to be larger, although in some cases where the court ruled against the administration’s position sizable minorities of Republicans, 39% or more, still favored the decision. Examples include rejecting Trump’s appeal of the <a href=\"https://www.scotusblog.com/cases/trump-v-carroll/\" target=\"_blank\" rel=\"noopener\">E. Jean Carroll verdict</a>, and the administration’s position on <a href=\"https://www.scotusblog.com/cases/learning-resources-inc-v-trump/\" target=\"_blank\" rel=\"noopener\">tariffs</a> and <a href=\"https://www.scotusblog.com/cases/trump-v-barbara/\" target=\"_blank\" rel=\"noopener\">birthright citizenship</a>. There are also cases with substantial Republican majority support and a sizable minority of Democrat support, as in <a href=\"https://www.scotusblog.com/cases/west-virginia-v-b-p-j-2-2/\" target=\"_blank\" rel=\"noopener\">state bans on transgender</a> athletes in women’s sports, as well as whether <a href=\"https://www.scotusblog.com/cases/chiles-v-salazar/\" target=\"_blank\" rel=\"noopener\">a state may ban conversion therapy</a>.</p><p><strong>Table 2: Favor court's decisions by party identification</strong></p><p><em>Among adults. Lighter colors indicate more in favor of decision, darker more opposed.</em></p><p>So does agreement with specific opinions boost overall approval of the court at all? Yes, although the effect is modest in comparison to that of partisanship and ideology. The chart shows the results of a multivariate model of court approval which includes partisanship, ideology, perception of the court favoring the Trump administration, and the number of decisions for which the respondent favored the court’s ruling. The lines plot the probability the respondent approves of the court by party and by the number of decisions the respondent favored. The probability of approval rises from left to right as agreement with decisions increases, and does so for each partisan group, although less steeply among Republicans. This demonstrates that agreement with decisions matters, but the gaps between the lines shows that even perfect agreement with decisions cannot erase the large partisan divides in views of the court.</p><p>Partisanship and ideology are thus the dominant influences on approval of the court, and the prominence of cases involving the Trump administration in the October 2025 Term likely only strengthened that relationship. As recently as July 2021 there was virtually no partisan gap, with 58% of Republicans and 60% of Democrats approving of the court. Since then, partisanship has shaped public opinion much more strongly. As noted, the public is now starkly divided by the perception that the court either mostly rules for or mostly against the president. The individual decisions also play a role, especially among independents and Democrats, although less so among Republicans. Single decisions, even if prominent, such as the tariffs case, must therefore compete for influence against the more persistent forces of party, ideology, and perceived alignment with the Trump administration. And regardless of how the public views each individual decision’s outcome, the latter wins out.</p><p><strong>Recommended Citation: </strong>Charles Franklin, <em>What the public thinks of the Supreme Court</em>, SCOTUSblog (Aug. 27, 2026, 9:30 AM), https://www.scotusblog.com/2026/08/what-the-public-thinks-of-the-supreme-court/</p>"},{"title":"A 12TB Steam “teraleak” spills more than a decade of lost PC gaming history","source":"Hacker News Best","author":"","url":"https://arstechnica.com/gaming/2026/08/a-12tb-steam-teraleak-spills-more-than-a-decade-of-lost-pc-gaming-history/","category":"tech","categoryLabel":"Technology","wordCount":1248,"readingTime":7,"content":"<p><a href=\"https://arstechnica.com/gaming/2026/08/a-12tb-steam-teraleak-spills-more-than-a-decade-of-lost-pc-gaming-history/#main\" target=\"_blank\" rel=\"noopener\">\n  Skip to content\n</a></p>\n            \n  \n    \n      \n        <p>\n    \n  \n  \n    Can’t stop the signal\n  \n</p>\n      \n      <p>\n        Cut content from <em>Portal 2</em>, hints of <em>Half Life 2: Episode 3</em>, and so much more.\n      </p>\n          \n    \n    <p>\n      This weapon, seen in a newly revealed <em>Portal 2</em> prototype, was previously seen in <em>Half-Life 2: Episode 3</em> footage released by Valve.\n              \n          Credit:\n                      <a href=\"https://x.com/HL_Alyx_NoVR/status/2093813696602533978\" target=\"_blank\" rel=\"noopener\">\n          Valve / HL_Alyx_NoVR\n                      </a>\n                  \n          </p>\n  \n  \n    \n<p>Here at Ars, we’re <a href=\"https://arstechnica.com/gaming/2018/07/steam-data-leak-reveals-precise-player-count-for-thousands-of-games/\" target=\"_blank\" rel=\"noopener\">intimately familiar</a> with <a href=\"https://arstechnica.com/gaming/2024/05/leaks-from-valves-deadlock-look-like-a-pressed-sandwich-of-every-game-around/\" target=\"_blank\" rel=\"noopener\">data leaks</a> surrounding Valve’s <a href=\"https://arstechnica.com/gaming/2020/04/valve-responds-to-source-code-leak-csgo-players-are-fine-maybe-not-tf2s/\" target=\"_blank\" rel=\"noopener\">games</a>, <a href=\"https://arstechnica.com/gaming/2019/04/valve-leaks-another-apparent-look-at-its-index-vr-headset/\" target=\"_blank\" rel=\"noopener\">hardware</a>, and <a href=\"https://arstechnica.com/gaming/2024/07/valve-runs-its-massive-pc-gaming-ecosystem-with-only-about-350-employees/\" target=\"_blank\" rel=\"noopener\">the workings of Steam itself</a>. But nothing could have prepared us for this weekend’s “terarelease” encompassing more than 12TB of content related to seemingly every title available on Steam between 2003 and 2013.</p>\n<p>What’s being sold as an “as-complete-as-possible … content server dump” of Steam’s defunct “Steam2” server architecture from that time period is now circulating around via a BitTorrent tracker that Valve seems unlikely to ever completely purge from the Internet. The massive collection includes <a href=\"https://steam2-db.pages.dev/\" target=\"_blank\" rel=\"noopener\">thousands of “depots”</a> representing what seems to be every version of every game uploaded to those old Steam2 servers. That includes public release builds, of course, but in many cases also covers previously unseen pre-release, prototype, and playtest versions of popular titles published by Valve and third-party Steam publishers.</p>\n<h2>Steam2: Electric Boogaloo</h2>\n<p>The reason this weekend’s leaked content cuts off abruptly in 2013 is because that’s when Valve <a href=\"https://developer.valvesoftware.com/wiki/SteamPipe\" target=\"_blank\" rel=\"noopener\">updated its content distribution system from “Steam2” to the current SteamPipe system</a>. In moving from a proprietary file distribution format to standard HTTP file trees, the new system <a href=\"https://www.pcgamesn.com/tf2/what-steampipe\" target=\"_blank\" rel=\"noopener\">removed various update approval bottlenecks</a> on Valve’s end and streamlined update and patch downloads so they only reflected file differentials.</p>\n<p>Publicly accessible early versions of some games released before this SteamPipe transition <a href=\"https://www.reddit.com/r/DataHoarder/comments/1dwx1s8/does_anyone_have_steam_installs_from_before/\" target=\"_blank\" rel=\"noopener\">had been considered lost content by archivists</a>, no longer accessible from Valve itself and living on only as local downloads on aging machines. Apparently, all that content wasn’t as lost as many thought, though. Longtime Valve watcher and dataminer Gabe Follower (<a href=\"https://arstechnica.com/gaming/2024/05/leaks-from-valves-deadlock-look-like-a-pressed-sandwich-of-every-game-around/\" target=\"_blank\" rel=\"noopener\">previously</a>) <a href=\"https://x.com/gabefollower/status/2093847346245230797\" target=\"_blank\" rel=\"noopener\">wrote on social media this weekend</a> that he had “verified that everything in Steam2 Teraleak was obtained via a publicly accessible [API] endpoint. It’s Valve’s fault…”</p>\n<p>Spanish-language <a href=\"https://www.youtube.com/@Scolcer\" target=\"_blank\" rel=\"noopener\">Valve streamer and analyst</a> Scolcer <a href=\"https://x.com/scolcer_/status/2093858629967360017\" target=\"_blank\" rel=\"noopener\">also said on social media</a> (via machine translation) that the teraleak was “obtained from a site that was 100% accessible to the public. It was there for everyone to download. No passwords. Nothing. Hidden in plain sight, but with no protection whatsoever.”</p>\n                  \n    \n\n<p>What’s unclear right now is whether that API and publicly available Steam2 server content were accessed recently or if this weekend’s leak represents content that was privately archived before the 2013 server transition and is just now being made public. “It could more-so be a collection of different people that knew about it and accumulated whatever people had downloaded back then into this massive archive,” said The One Epicplayer, a moderator on the Valve Cut Content (VCC) Discord, which has long followed Valve betas and leaks.</p>\n<p>“I haven’t been filled in on the full details but my suspicion is that these depot [files] were downloaded a long time ago and sat in a private collection,” CrazyBubba, another VCC Discord moderator, told Ars. “There were a <em>lot</em> of leaks a few years back and many folks hoarded files for years. … historically there have been issues with people lording content over other members.”</p>\n<p>A readme file included with the leak offers “warm n good wishes to all hoarders who had stuff from this collection &lt;3″ and encourages users to mirror and share it as widely as possible. On the VCC Discord, a user purporting to be the original uploader of the teraleak (who offered screenshots of a 22TB server upload log among their evidence) wrote that “getting this out really took a significant amount of effort from me and I would like it if it didn’t go to waste.”</p>\n<h2>Now you’re thinking with old Portals</h2>\n<p>Regardless of the hows and whys of the leak, eager gaming communities have wasted no time in digging through the “teraleak” <a href=\"https://hiddenpalace.org/Steam2_Content_Server\" target=\"_blank\" rel=\"noopener\">in search of cut content and playable early versions</a> of many now-classic PC games.</p>\n<p>Multiple playable prerelease versions of <em>Portal 2</em> contain some of the most intriguing cut content discovered so far. Already, teraleak diggers are finding deleted sequences, including <a href=\"https://x.com/TheJeremy__/status/2093817196744933745\" target=\"_blank\" rel=\"noopener\">new dialogue from GLaDOS</a> and <a href=\"https://www.youtube.com/watch?v=5C7zqm7t3v4\" target=\"_blank\" rel=\"noopener\">Aperture CEO Cave Johnson’s consciousness trapped in a cube</a> (“My life is torture, please kill me,” a scratch track version of Johnson says in cut dialogue that was <a href=\"https://combineoverwiki.net/wiki/User:Sandvich18/List_of_scenes_in_Portal_2/The_Reunion\" target=\"_blank\" rel=\"noopener\">previously seen in a text file included with the game</a>). The early development version also apparently includes fun features, like <a href=\"https://x.com/gabefollower/status/2093836902835093984\" target=\"_blank\" rel=\"noopener\">perfectly circular portals</a>, an <a href=\"https://x.com/scolcer_/status/2094026326202024358\" target=\"_blank\" rel=\"noopener\">adhesive gel and slow-motion guns</a>, and <a href=\"https://x.com/HL_Alyx_NoVR/status/2093813696602533978\" target=\"_blank\" rel=\"noopener\">an interesting-looking weapon model</a> that was <a href=\"https://combineoverwiki.net/wiki/Unidentified_Half-Life_2:_Episode_Three_weapon\" target=\"_blank\" rel=\"noopener\">previously seen</a> in <a href=\"https://arstechnica.com/gaming/2024/11/newell-says-he-was-stumped-on-how-to-finish-half-life-2-episode-3/\" target=\"_blank\" rel=\"noopener\">official Valve documentary footage</a> of the unreleased <em>Half-Life 2: Episode 3</em>.</p>\n                  \n    \n        \n\n<p>While there are no playable “<em>Half-Life 3</em> confirmed” depots included in the leak, data trawlers have <a href=\"https://x.com/scolcer_/status/2093884437750587773\" target=\"_blank\" rel=\"noopener\">reportedly found some “ep3” data files</a> seemingly related to <a href=\"https://arstechnica.com/gaming/2016/05/celebrating-ten-years-of-half-life-2-episode-3-not-coming-out/\" target=\"_blank\" rel=\"noopener\">the perpetually delayed expansion</a>. Valve fans are also digging in to <a href=\"https://www.youtube.com/watch?v=3hPjA09_qY8\" target=\"_blank\" rel=\"noopener\">early betas of <em>Left 4 Dead 2</em> and <em>CS: GO</em></a> featuring never-before-seen cut content, and <a href=\"https://x.com/PAPL0CK/status/2093941536484430222\" target=\"_blank\" rel=\"noopener\">some intriguing models and graphics related to <em>F-Stop</em></a>, the <a href=\"https://www.eurogamer.net/over-a-decade-later-we-have-a-snapshot-of-valves-cancelled-portal-sequel-f-stop\" target=\"_blank\" rel=\"noopener\">canceled camera-based game</a> originally planned as a sequel to <em>Portal</em>.</p>\n<p>Aside from Valve’s own published games, the teraleak also includes myriad early versions of titles from the many third-party publishers that were on Steam before 2013. <a href=\"https://hiddenpalace.org/Steam2_Content_Server\" target=\"_blank\" rel=\"noopener\">Betas and prototypes</a> for games <a href=\"https://x.com/AestheticGamer1/status/2093878329682325741\" target=\"_blank\" rel=\"noopener\">ranging from</a> <em>Spore</em> and <em>Dragon Age: Origins</em> to <em>Batman: Arkham Asylum</em>, <em>Sonic the Hedgehog 4</em>, and <em>Spec Ops: The Line</em> are among those that dataminers have already identified for further study. And while that list won’t contain the early versions of those games that stayed on developers’ local computers and office networks, the playtest versions that were often uploaded to Valve’s servers near release often still contain some interesting content.</p>\n<blockquote>\n<p>Habilidades eliminadas de la beta de Portal 2:</p>\n<p>-Gel adhesivo\n-Cámara lenta\n-El weaponizer de Half-Life 2: Episodio 3 probablemente se usaba de placeholder para el arma de pintura <a href=\"https://t.co/qQgfS76EXs\" target=\"_blank\" rel=\"noopener\">pic.twitter.com/qQgfS76EXs</a></p>\n<p>— Scolcer (@scolcer_) <a href=\"https://x.com/scolcer_/status/2094026326202024358?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">August 30, 2026</a></p></blockquote>\n<p>Even though this weekend’s leak doesn’t contain any games released in the last 13 years, the major publishers affected likely still won’t be too happy that Valve’s lax security apparently led to their previously unreleased early work product leaking out to the public (not to mention the piracy implications of releasing such a complete, if outdated, collection of Steam content). The teraleak highlights how Valve’s own servers now serve as an extremely high-profile single point of failure for the security of a massive chunk of PC game development history.</p>\n<p>Some are worried about the legal implications of handling such large quantities of previously private game builds as well. “That archive contains a significant amount of 3rd party content, meaning we are dealing with a dramatically more dangerous situation than if it were just some Valve builds,” longtime Valve watcher Tyler McVicker <a href=\"https://x.com/Tyler_McV/status/2093848662895902856\" target=\"_blank\" rel=\"noopener\">wrote on social media</a>. “Don’t touch it, it’s HOT. Take it from someone who got in trouble for beta stuff in the past.”</p>\n<p>Six years ago, a <a href=\"https://arstechnica.com/gaming/2020/07/nintendo-gigaleak-reveals-classic-nintendo-prototypes-source-code/\" target=\"_blank\" rel=\"noopener\">highly publicized “gigaleak” of Nintendo’s internal development files</a> cast a spotlight on countless previously unknown corners of the company’s history. This weekend’s leak seems poised to do the same for huge portions of PC gaming history.</p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/kyle-orland/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Kyle Orland has been the Senior Gaming Editor at Ars Technica since 2012, writing primarily about the business, tech, and culture behind video games. He has journalism and computer science degrees from University of Maryland. He once <a href=\"https://bossfightbooks.com/collections/books/products/minesweeper-by-kyle-orland\" target=\"_blank\" rel=\"noopener\">wrote a whole book about <em>Minesweeper</em></a>.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/gaming/2026/08/a-12tb-steam-teraleak-spills-more-than-a-decade-of-lost-pc-gaming-history/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    65 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/science/2026/08/el-nino-is-now-stronger-than-at-any-point-in-the-last-1000-years-study-finds/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"},{"title":"How a “Psychic” Horse Named Clever Hans Changed the Way We Do Science - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/how-a-psychic-horse-named-clever-hans-changed-the-way-we-do-science-1284622/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1031,"readingTime":6,"content":"<p>Do you sometimes wish that you had telepathic or other supernormal powers?</p><p>Featured Video</p><p>Around a hundred years ago, some of the greatest minds in philosophy thought there were people who had such abilities. In fact, they even suggested that perhaps horses and dogs could have them too.</p><p>At the turn of the 20th century, many great scientists, psychologists and philosophers became fascinated by the possibility of “psychic phenomena” like telepathy, clairvoyance or ghosts. Many of them, like J.J. Thomson, the 1906 winner of the Nobel prize in physics, performed experiments to <a href=\"https://doi.org/10.1177/14690667211050599\" target=\"_blank\" rel=\"noopener\">test mediums</a>. Others, like the philosopher <a href=\"https://muse.jhu.edu/article/950466\" target=\"_blank\" rel=\"noopener\">C.D. Broad</a>, attended seances and thought about the possibility of precognition – the ability to foresee future events.</p><p>These weren’t just marginal charlatans. Many of them had an impact on philosophy and science in the 20th century. Many of the concepts philosophers of time still argue over today trace back to C.D. Broad, such as the <a href=\"https://academic.oup.com/mind/article-abstract/128/510/527/4317403?redirectedFrom=fulltext\" target=\"_blank\" rel=\"noopener\">growing block theory</a>, which says that the past is real, the present is real, but the future does not yet exist.</p><p>Most of their focus was on the psychic abilities of humans. However, some of these “psychic researchers” went even further and began wondering about the possibility of telepathy in animals.</p><p>The philosopher Friedrich Canning Scott Schiller (1864-1937), who spent most of his career at the University of Oxford, was an active member of the Society for Psychical Research (SPR). He was one of the founders of <a href=\"https://plato.stanford.edu/entries/pragmatism/\" target=\"_blank\" rel=\"noopener\">pragmatism</a>, the philosophical view that the truth of a theory can be judged based on whether it works in practice.</p><p>Schiller engaged in heated discussions about the psychic abilities of animals. His article on “psychical research” for the Encyclopedia Britannica has a section about “equine mathematicians” – horses with supposedly paranormal mathematical abilities that they demonstrated by tapping out solutions to equations with their hooves.</p><p>In 1914, Schiller wrote an article <a href=\"https://iapsop.com/archive/materials/spr_proceedings/spr_journal_v17_1915-16.pdf\" target=\"_blank\" rel=\"noopener\">for the SPR</a> about Rolf, “the thinking dog of Mannheim” (in south-west Germany). <a href=\"https://www.jstor.org/stable/pdf/20543793.pdf\" target=\"_blank\" rel=\"noopener\">Rolf</a> was credited with the ability to tap out answers to mathematical problems with his paw. And, with the help of a spelling code for letters and syllables, Schiller even claimed that the dog managed to produce entire sentences.</p><p>On one occasion, Schiller alleged that the dog professed its Catholic faith to a priest.</p><p>The case of Rolf (and <a href=\"https://iapsop.com/archive/materials/spr_proceedings/spr_journal_v17_1915-16.pdf\" target=\"_blank\" rel=\"noopener\">other “thinking dogs”</a> who suddenly started cropping up elsewhere) caused a dilemma for psychical researchers. Some thought this proved that animals have hidden intellectual powers just like humans. Others, like the Russian scientist <a href=\"https://psycnet.apa.org/record/1950-01665-001\" target=\"_blank\" rel=\"noopener\">Vladimir Bechtereev</a>, suggested that the whole thing can be explained by telepathy.</p><p>Bechtereev went on to make major discoveries about memory and brain structure. In his view, the dog’s owner telepathically communicated all the information to him.</p><p>Schiller believed that his theory of pragmatism could help settle these disputes. He thought there was no point <a href=\"https://iapsop.com/archive/materials/spr_proceedings/spr_journal_v17_1915-16.pdf\" target=\"_blank\" rel=\"noopener\">discussing these things</a> in the abstract. What matters is whether either of the theories can be shown to have practical consequences for how the animal behaves. If Rolf was really so skilled at arithmetic, why does he not use mathematics in everyday life? And if he is a confessed Catholic, why does he not go to church?</p><p>Joseph Banks Rhine (1895-1980) and his wife Louisa (1890-1983) are widely considered to be the founders of the controversial field of parapsychology. They published the influential volume <a href=\"https://uk.bookshop.org/a/15793/9781396323256\" target=\"_blank\" rel=\"noopener\">Extra-Sensory Perception (1934)</a> and founded the Parapsychology Laboratory at Duke University, which has since been shuttered. Their approach of using a large number of tests with multiple subjects has been closely connected with <a href=\"https://ics.uci.edu/%7Ejutts/UttsStatPsi.pdf\" target=\"_blank\" rel=\"noopener\">modern statistics</a>.</p><p>In 1929, the Rhines published an <a href=\"https://psycnet.apa.org/record/1930-00564-001\" target=\"_blank\" rel=\"noopener\">article</a> about the horse Lady Wonder. This horse was seemingly able <a href=\"https://time.com/archive/6885169/manners-morals-detective-story/\" target=\"_blank\" rel=\"noopener\">to make predictions</a>, work out answers to mathematical problems, and tell time, all of this by touching lettered and numbered blocks with her nose.</p><p>The most famous of these mathematically gifted horses was Clever Hans. Just like Lady Wonder in the US, Hans attracted huge crowds to his native Germany, who were eager to witness his arithmetic abilities. This included psychical researchers curious to see whether Hans had supernormal powers, as well as <a href=\"https://link.springer.com/chapter/10.1057/9780230286030_7\" target=\"_blank\" rel=\"noopener\">Carl Stumpf</a> (1848-1936), one of the fathers of modern psychology.</p><p>It was Stump’s research assistant <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3921203/\" target=\"_blank\" rel=\"noopener\">Oskar Pfungst</a> who eventually got to the root of Hans’s miraculous powers. Pfungst observed that Hans could only provide the correct answer when his owner, standing nearby, knew the answer to the question asked – and only when Hans could see him.</p><p>This led Pfungst to conclude that Hans was simply responding to involuntary signals from his owner, signals that his owner did not even realise he was providing. Pfungst thereby discovered the so-called <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S1369848614000855\" target=\"_blank\" rel=\"noopener\">Clever Hans effect</a>. This describes situations where the bad set up of an experiment causes the experimenter to unintentionally influence the subjects they are studying.</p><p>Pfungst’s explanation got rid of the need to appeal to supernormal abilities and partially contributed to the gradual disappearance of psychical research from universities. Like many other psychic phenomena, modern psychology could explain what was going on.</p><p>Although it turned out that these horses and dogs had no such mathematical powers, the studies conducted by psychical researchers helped uncover new knowledge. One surprising example is the development <a href=\"https://labs.biology.ucsd.edu/rifkin/courses/bieb100/w13/Hacking_1988_Isis_Telepathy_-_Origins_of_Randomization_in_Experimental_Design.pdf\" target=\"_blank\" rel=\"noopener\">of randomisation</a> in experiments.</p><p>Randomisation means deciding the order or allocation of things in an experiment by chance, rather than allowing the researcher or participant to choose. It is now a basic part of good experimental design because it helps prevent expectations from influencing the results. Surprisingly, attempts to test telepathy helped drive its development. Researchers realised that if people knew what answer was expected, even tiny unconscious cues could affect the outcome.</p><p>The case of Clever Hans and other “telepathic” animals shows just how turbulent this period of time was for modern science and philosophy. The telephone suddenly made it possible to contact someone on the other side of the world, and the X-ray allowed you to see inside the body. So perhaps it’s not that surprising that some of the greatest minds began to investigate telepathy in animals. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/im-part-of-the-team-writing-the-next-bible-of-psychiatry-for-the-first-time-the-dsm-will-use-biology-to-understand-mental-disorders-288064\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/babies-born-under-sugar-rationing-grew-into-adults-with-lower-cancer-risk-289873\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Wikimedia Commons</em></p>"}];
