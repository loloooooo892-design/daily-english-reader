*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Brazil’s President Faces Down the Online Right","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/brazils-president-faces-down-the-online-right","category":"fun","categoryLabel":"Interesting Reads","wordCount":1485,"readingTime":8,"content":"<p>After President <a href=\"https://www.newyorker.com/magazine/2023/01/30/after-bolsonaro-can-lula-remake-brazil\" target=\"_blank\" rel=\"noopener\">Luiz Inácio Lula da Silva</a> won last week’s <a href=\"https://www.newyorker.com/news/global-notes/lulas-last-dance\" target=\"_blank\" rel=\"noopener\">Presidential election</a> in Brazil, beating the far-right candidate Flávio Bolsonaro by more than four million votes, a friend there sent me a triumphal message: “Next Netanyahu, and then the U.S. midterms!” In the past year and a half, virtually every Latin American government has fallen in line with the Trump Administration, but Lula’s win countered that trend. Among Brazilians on the left, hopes have emerged that his success could begin to reverse a far-right surge in their country and around the world.</p><p>On the same day as Lula’s victory, the pro-Russia strongman Aleksandar Vučić was trounced in Serbia’s elections, and, unlike strongmen elsewhere, he recognized his defeat. In Brazil, Flávio Bolsonaro seemed uncertain how to react to losing. He rejected the results, then seemed to accept them; he made a social-media statement describing himself as Brazil’s legitimate President, then deleted it, then restored an edited version of it. But all the country’s major institutions and political parties have acknowledged that Lula won, as have most nations in the hemisphere, with the exception of Argentina, which is run by the <em>MAGA</em>-friendly President <a href=\"https://www.newyorker.com/magazine/2024/12/09/javier-milei-wages-war-on-argentinas-government\" target=\"_blank\" rel=\"noopener\">Javier Milei</a>.</p><p>In the U.S., Donald Trump hedged his bets: he suggested that the election could have been “rigged,” but also declared, “I like Lula.” Perhaps he was being cautious because Brazil is the biggest economy in Latin America. Or perhaps he fears a knock-on effect. Trends in one country seem increasingly linked to trends in others. The current spasms of unrest in <a href=\"https://www.newyorker.com/news/social-history/a-long-view-of-the-french-protests\" target=\"_blank\" rel=\"noopener\">France</a>, Italy, and Albania have disparate causes, but they all seem linked to an overriding mood of dissatisfaction. The same could be said of the anti-government <a href=\"https://www.newyorker.com/news/q-and-a/what-do-indias-gen-z-protests-mean-for-modi\" target=\"_blank\" rel=\"noopener\">Cockroach Janta</a> movement, in <a href=\"https://www.newyorker.com/news/q-and-a/is-this-the-beginning-of-the-end-of-indian-democracy\" target=\"_blank\" rel=\"noopener\">India</a>, and the recent Gen Z revolts in Bangladesh, Madagascar, and <a href=\"https://www.newyorker.com/news/the-lede/nepals-violent-gen-z-uprising\" target=\"_blank\" rel=\"noopener\">Nepal</a>.</p><p>Social media has played a huge part in these kinds of events, as a means of both connection and combustion. In June, 2016, much of the world was shocked when a slender majority of Brits, concerned about joblessness and immigration and revved up by a nativist web campaign, <a href=\"https://www.newyorker.com/tag/brexit\" target=\"_blank\" rel=\"noopener\">voted to leave the European Union</a>. Three months later, Colombians initially <a href=\"https://www.newyorker.com/news/daily-comment/how-colombias-voters-rejected-peace\" target=\"_blank\" rel=\"noopener\">voted down a peace deal</a> with the <em>FARC</em>, a Marxist guerrilla army that had been fighting the state for more than half a century. The reasons included a false claim, spread by right-wing politicians and social media, that the deal contained an agreement to teach “gender ideology” in primary schools.</p><p>I was in Colombia at the time, and a friend remarked, “First Brexit and now this. This means that Trump will win in November.” About a month later, Trump reached the White House, with a campaign that relied heavily on nativism, racism, and misogyny, as well as blatantly false accusations against his opponent. In 2018, in Brazil, the right-wing former Army captain <a href=\"https://www.newyorker.com/magazine/2019/04/01/jair-bolsonaros-southern-strategy\" target=\"_blank\" rel=\"noopener\">Jair Bolsonaro</a>—Flávio’s father—was elected President. His campaign also played on fears of “gender ideology,” inundating voters with WhatsApp messages claiming that his opponent promoted pedophilia.</p><p>In office, Bolsonaro and Trump were ideological soulmates, espousing anti-environment, pro-development views and fanning hatred of Black people, women, and trans people. Both were extraordinarily cavalier in <a href=\"https://www.newyorker.com/news/q-and-a/the-coronavirus-crisis-in-bolsonaros-brazil\" target=\"_blank\" rel=\"noopener\">dealing with</a> <a href=\"https://www.newyorker.com/news/daily-comment/brazils-covid-19-crisis-and-jair-bolsonaros-presidential-chaos\" target=\"_blank\" rel=\"noopener\"><em>COVID</em>-19</a>; the U.S. had the world’s largest number of reported deaths, with 1.2 million, while Brazil had the second largest, with more than seven hundred thousand.</p><p>The Trump and Bolsonaro stories overlap in eerie ways. Bolsonaro’s first campaign, in 2018, gained new momentum when he was stabbed by an assailant at a rally—a foreshadowing of Trump’s near-assassination in 2024, in Butler, Pennsylvania. Trump’s response to that shooting—“Fight! Fight!”—impressed Elon Musk, who became his largest individual donor and, eventually, his <a href=\"https://www.newyorker.com/magazine/2025/06/23/what-did-elon-musk-accomplish-at-doge\" target=\"_blank\" rel=\"noopener\"><em>DOGE</em> czar</a>. (Musk also began <a href=\"https://www.newyorker.com/podcast/political-scene/elon-musk-is-trying-to-buy-the-midterms-and-he-doesnt-care-who-knows-it\" target=\"_blank\" rel=\"noopener\">openly supporting</a> right-wing movements around the world, using his social-media platform, X, to denigrate Lula and to support Milei and Germany’s extremist <a href=\"https://www.newyorker.com/magazine/2026/09/21/how-to-protect-democracy\" target=\"_blank\" rel=\"noopener\">AfD</a> Party.)</p><p>After the 2020 election, Trump blamed his loss on a Democratic conspiracy to tamper with voting machines, and <a href=\"https://www.newyorker.com/news/our-columnists/this-violent-insurrection-is-what-trump-wanted\" target=\"_blank\" rel=\"noopener\">encouraged</a> supporters to <a href=\"https://www.newyorker.com/news/american-chronicles/the-devastating-new-history-of-the-january-sixth-insurrection\" target=\"_blank\" rel=\"noopener\">assault</a> the <a href=\"https://www.newyorker.com/magazine/2021/01/25/among-the-insurrectionists\" target=\"_blank\" rel=\"noopener\">Capitol</a> to halt the certification of Joe Biden’s victory. Two years later, Bolsonaro lost a reëlection bid to Lula. He, too, had repeatedly claimed that the vote could be rigged. He flew to Florida and conspired with allies in the security forces back home to plot a coup. A week after Lula took office, thousands of Bolsonaro supporters <a href=\"https://www.newyorker.com/news/dispatch/cleaning-up-after-the-bolsonaristas-in-brasilia\" target=\"_blank\" rel=\"noopener\">attacked</a> Brazil’s Supreme Court and National Congress buildings, trying to reinstall him as President.</p><p>Bolsonaro eventually returned to Brazil, where he was <a href=\"https://www.newyorker.com/news/the-lede/brazil-braces-for-a-verdict-on-its-ex-president-and-on-its-democracy\" target=\"_blank\" rel=\"noopener\">convicted</a> of conspiracy and sentenced to twenty-seven years in prison. Later, he was remanded to house arrest on humanitarian grounds. Since he was unable to run for office this year, his son Flávio, a lawyer and legislator in his forties, became a candidate in his place. Flávio said that his goal was to see his father freed and to punish the jurists who had upheld his conviction. He also suggested that he would weaken environmental protections, combat “wokeness,” and encourage development and foreign investment. To ingratiate himself to Trump, he promised to join the Shield of the Americas, a program in which U.S. troops can be deployed to Latin American countries, ostensibly to fight narcotrafficking.</p><p>Brazilian elections generally have two rounds of voting. In this year’s first round, in early October, Bolsonaro came out ahead. But, in an unprecedented three-week social-media campaign, a tech-savvy politician named André Janones enlisted millions of Brazilians to serve in “Lula’s Army.” By synchronizing their messaging, he gained an algorithmic advantage over the right-wing trolls who had dominated Brazil’s social media for years. (One prominent troll operator is Fernando Cerimedo, an Argentinian ally of the Bolsonaros, who was indicted in Brazil for alleged involvement in the coup attempt, although prosecutors ultimately declined to charge him. Since then, Cerimedo has helped Milei get elected, in Argentina, and has aided other right-wing politicians around the Americas. In August, while he was working out of Bolivia’s Presidential palace, he was arrested on suspicion of hiring gunmen to assassinate his girlfriend, who is pregnant. She survived; he remains in jail, and denies all charges against him.)</p><p>Janones’s digital “war” succeeded despite some obstacles. The country’s electoral court twice blocked his WhatsApp channel, at Bolsonaro’s request. But the same court also imposed an injunction on Meta, after Lula’s campaign provided evidence that the company had doctored algorithms to favor Bolsonaro in search results. Although Meta denied this, it acknowledged “technical issues” and promised to fix the problems. The allegations of interference troubled many Brazilians. Walter Salles, the director of “<a href=\"https://www.newyorker.com/culture/the-current-cinema/the-political-drama-of-im-still-here-is-moving-but-airbrushed\" target=\"_blank\" rel=\"noopener\">I’m Still Here</a>,” an acclaimed film about Brazil’s years of military dictatorship, told me recently, “This has probably been happening for some time in past elections throughout South America.”</p><p>After losing the election, Flávio surreptitiously crossed the border into Argentina, boarded a private jet, and fled to Florida, as his father had following his own loss; he was one step ahead of Brazilian police, who want to question him in a money-laundering investigation. He had covert assistance from the Milei government and the Trump Administration; a White House aide evidently helped charter the jet. When he arrived, along with his wife and children, they were allowed entry on parole status, and the State Department said that it plans to issue them visas. It is not yet clear what he intends to do with his time. His father spent his time in the U.S. strolling around a Publix supermarket near Orlando, eating K.F.C., and taking selfies with Brazilian tourists, while plotting a comeback. The younger Bolsonaro may do something similar. Or, like many other Latin American fugitives in Florida, he may live out his days pining for home and playing golf.</p><p>In Brazil, there are signs that Lula’s more inclusive vision is gaining purchase. Erika Hilton, a thirty-three-year-old Black trans woman and a former sex worker, became the most-voted-for female congressional candidate in the country’s history. Ana Elisa Santos, a twenty-one-year-old Black influencer, also won a seat in Congress, despite death threats from white supremacists. Meanwhile, Janones’s services have been requested by the left-leaning Spanish Prime Minister, Pedro Sánchez, who faces a tight race for reëlection in late November. In France, “Janonisme” is being emulated by activists working to counter the influence of the far-right Presidential candidate <a href=\"https://www.newyorker.com/news/q-and-a/what-marine-le-pens-conviction-means-for-french-democracy\" target=\"_blank\" rel=\"noopener\">Marine Le Pen</a>.</p><p>Brazil’s essential polarization has not gone away. Crime rates are high, and the markets, which had risen in the expectation that the market-friendly Bolsonaro would win, plummeted after Lula’s victory. Still, Lula’s supporters feel that there is now a chance to fortify the country’s still fragile democracy. A friend of mine there, who worried about the fate of the Amazon if Bolsonaro won, wrote to me to say, “Much more than the future of Brazilian democracy is at stake. We Latin Americans know that democracies can die, but, in time, they can also be restored. There is a great deal of suffering along the way, but it has been done.” ♦</p>"},{"title":"Atmosfar is a giddy aerial exploration game after the heart of No Man's Sky, but I'm already trying to escape it","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/atmosfar-is-a-giddy-aerial-exploration-game-after-the-heart-of-no-mans-sky-but-im-already-trying-to-escape-it","category":"gaming","categoryLabel":"Gaming","wordCount":1110,"readingTime":6,"content":"<p>Taking flight in early access today</p>\n    \n  \n  \n  \n\n            <p>\r\nOh hi there! Why yes, I am free to chat. Please excuse the wind noise, I'm currently tumbling to my doom in <a href=\"https://www.rockpapershotgun.com/games/atmosfar\" target=\"_blank\" rel=\"noopener\">Atmosfar</a>, after getting lost in a cloud bank and exhausting my fuel. This kind of thing happens to me regularly in Atmosfar - an open world survival game that plays out across clusters of floating islands, with players scooting about in adorable, propellor-powered airships.</p>\n<p>Many of the islands are quite large, with proper landing pads and bases set up by NPC scavengers. Many of them teem with non-human life: rainforests full of nectar droplets and carnivorous plants, meadows of ponderous honking lizards, and mossy grottos where you'll find caches of batteries and possibly get eaten by mantids. It's important to make the most of these larger islands, gathering materials for crafting at your deployable campsite (which straps pleasingly to the back of your whirring fly-mobile). It's <em>particularly</em> important to mine hydrogen crystals you can refine into fuel.</p> \n<p>None of that's for me, though! I am a true spirit of the sky. The only fuel I need is my imagination. The only objective marker I acknowledge is the omnidirectional Call to Adventure. Besides, when you do run out of fuel in Atmosfar, you're actually unlocking two exciting minigames. The first consists of leaping from the cockpit and vainly trying to jetpack to the nearest walkable surface. The second consists of racing to overtake your plummeting airship and re-enter the cockpit before you smash into any islands beneath. I'm playing that second minigame right now. Come to papa, my beautiful turboprop son! Ah, balls.\r\n</p>\n\n<p>1 of 3 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>\r\nAtmosfar is out in Steam early access today, with plans to <a href=\"https://www.rockpapershotgun.com/airborne-open-world-atmosfar-gets-an-early-access-release-date-and-a-trailer-full-of-flying-islands-cloud-cruisers-and-sky-taxis\" target=\"_blank\" rel=\"noopener\">stay in early access for at least nine months</a>. I think it has some juice, though I am admittedly already trying to play it against the grain - and at times, trying to do things its technology doesn't quite allow.</p><p>It casts you as an interplanetary pioneer who, due to some minor infraction, has been locked up in a factory: a dreary opening area with some corpo-satire elements, from which you are soon liberated by an electrical storm. Busting past the sentry drones, you scramble down a cliffside and discover your very first Wasp hovercar. From there, you have more or less free rein of the game's opening biome, though there's a critical path of tutorials and NPC encounters you'll want to follow for the sake of unlocks, like the jetpack.\r\n</p>\n<p>\r\nThe scattered islands do a fair job of luring you from your HUD objectives (the HUD itself is a bit murky, in any case – I struggled to make connections between waypoints and quests in my journal). Even if there's nothing to capital-i Interact with, it's a pleasure to alight on some drifting gobbet of soil and flowers, peer into the crevices, and maybe take a few photos of distant astral mountains.</p>\n<p>The searing emptiness all around makes the design of each island feel more precise and careful, gift-wrapped for the player. I find that I'm most interested in the tinier islands, the ones that were presumably a secondary consideration for developers Apog Labs, and maybe handed off to a junior staffer. I gaze at a random grass tuft and try to guess how much ingenuity went into the placement of something many pilots will totally ignore.\r\n</p>\n\n<p>1 of 3 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>\r\nI'm already chafing against the survival systems a bit, however. Based on a couple of hours of cloudsteading, Atmosfar's core ingredients aren't particularly novel or involving. There's no tree-chopping, thank god, but you will spend many moments pointing your extractor at a nugget of glowing resourcegook, splitting it into plastic sheets and steel girders and so forth.</p><p>Many of the opening missions involve toing and froing between deposits and your airship or camp. It's humdrum stuff. The game's non-player scavengers seem like quest-givers first, characters second. Your inventory size is limited, to begin with. Deeper in, there's the opportunity to construct a huge airbase, the Cloud Cruiser, which I'm really hoping doesn't need refuelling. Although it would be a great joke to accidentally drop one with several co-op buds inside.\r\n</p>\n<p>\r\nI've spent most of my two hours in Atmosfar in headlong retreat from the tutorial quests, trying to reach places I sense I'm not supposed to, without paying my dues to the crafting system. This includes both the ruddier, volcanic areas higher up, which I do believe I can reach, if I bother to refine enough fuel. But I'm more captivated, right now, by what lies beneath.\r\n</p>\n\n<p>\r\nDuring a nighttime mission to gather eggs for some outpost chef, I gave into curiosity and aimed my Wasp straight down, spiralling past lonely stalactites with no creature population, into a swirling turquoise abyss full of bare, indistinct rock. As I descended, the game's tech began to creak and fizzle, as though strained by increasing gravity. My ride's exhaust condensed and flattened into glitchy flakes.</p><p>I ignored the simulation's protests, holding my course like Ahab aiming a harpoon at Moby Dick's kisser, till a \"leaving mission area\" reset timer yanked me up short. I ascended to just above the cut-off point, and gawped at the horizon. A juddering white ring enclosed the world, surrounded by wrinkled LIDAR pulses that made me think of thoughts coursing through brain tissue. \r\n</p>\n<p>\r\nNow, <em>this</em> was an adventure. I flapped around a bit, battling turbulence, and managed to land on one of the weirdly unadorned, formless boulders. Who made this? Some procedural generation system, or did somebody actually have to 'hand-craft' these places that are probably not for serious human inquiry or habitation? I shot a few flares over the side and tried to deploy my campsite, but there was too little space on the boulder. Then the sun rose, slowly staining the milky blue fastness pink, and revealing the crisper silhouettes of the properly designed and navigable islands high above.\r\n</p>\n\n<p>\r\nThat last screenshot is my favourite so far - the rosy, rugged beauty of Atmosfar and the bizarre quirks of its technology reaching a strangely persuasive accord. There's only one issue: I've run out of fuel again. I guess I could yeet myself into the void and reset to the nearest landing pad, but that doesn't feel like something a true Spirit of the Sky would do. I guess I'll have to enlist another RPS scribe as a co-op partner and have them come fetch me. Perhaps they can complete the tutorials first and rock up in one of those Cloud Cruiser things. In the meantime, you can <a href=\"https://store.steampowered.com/app/1798230/ATMOSFAR/\" target=\"_blank\" rel=\"noopener\">get your fill of Atmosfaring via Steam</a>.\r\n</p>"},{"title":"TechCrunch Mobility: A new, bigger AV boom is here","source":"TechCrunch","author":"Kirsten Korosec","url":"https://techcrunch.com/2026/11/01/techcrunch-mobility-a-new-bigger-av-boom-is-here/","category":"tech","categoryLabel":"Technology","wordCount":1136,"readingTime":6,"content":"<p>Welcome back to <strong>TechCrunch Mobility</strong>, your hub for the future of transportation and now, more than ever, the role AI is playing in it. To get this in your inbox, sign up here for free — just click <a href=\"https://techcrunch.com/newsletters/\" target=\"_blank\" rel=\"noopener\">TechCrunch Mobility</a>!</p>\n<p>I’ve joked here and on the Equity and Autonocast podcasts that the autonomous vehicle industry feels a lot like 2016, at least in terms of the buzziness surrounding the sector.</p>\n<p>But a recent conversation with Trucks VC partner <strong>Puneeth Meruva</strong> has me rethinking that comparison. There’s evidence that 2026 is even hotter — at least by certain measures — than those frothy dealmaking days of 2016 and 2017. </p>\n<p>Trucks VC, which specializes in early-stage investing, has fielded pitches from 81 new autonomous vehicle startups so far in 2026 — two-thirds more than last year and enough to surpass the boom years of a decade ago.  The VC firm argues in a new <a href=\"https://www.trucks.vc/blog/avs-are-back-the-new-wave-is-bigger\" target=\"_blank\" rel=\"noopener\">blog post</a> that we’re in the midst of a second, even bigger AV wave fueled by technological breakthroughs. Yes, I’m talking about AI. </p>\n\n<p>“For a long time AV companies were trying to go from what was AV 1.0 to AV 2.0, which is kind of this holy grail end-to-end architecture for AVs,” Meruva told me. “And I think the foundation models now provide a technical architecture that makes those end-to-end systems possible.”</p>\n<p>These foundational models are particularly good at generalizing across different environments and scenarios, potentially making AVs cheaper and faster to deploy. The arrival of powerful open source models like Nvidia’s Alpamayo and Qwen’s general-purpose vision-language-action models has made it even easier for startups to get off the ground.</p>\n<p>The barrier to entry is lower than ever before. Meruva said Trucks is consistently seeing startups deploy within a few months and with less than $1 million raised. (And while Meruva wouldn’t name names, the firm has invested in some of them.)</p>\n<p>Of these 81 startups that pitched Trucks VC, I mistakenly assumed most would be applying their AV tech to construction, warehouse, agriculture, and mining. And yes, those were in the mix. But what surprised me was the growing number of startups pitching pure-play robotaxi businesses. And many are positioning themselves as direct competitors to Waymo. </p>\n<p>As wild and galaxy brain-thinking as that may sound, Meruva thinks there is room for smaller players. </p>\n<p>“In this world, smaller, more niche autonomy companies can compete — maybe they’re not competing with Waymo on a global scale, but maybe they’re competing in specific regions or specific types of routes,” he said.  </p>\n<p>And Meruva doesn’t see the pace flattening. He expects even more AV startups to pitch the firm next year.</p>\n<h2>Deals!</h2>\n\n<p>Regular readers of this newsletter know we’ve been closely following Slate Auto — breaking the original story on <a href=\"https://techcrunch.com/2025/04/08/inside-the-ev-startup-secretly-backed-by-jeff-bezos/\" target=\"_blank\" rel=\"noopener\">Jeff Bezos’ investment</a> way back in April 2025. But the company it spun out of is what got our attention this week. </p>\n<p><strong>Re:Build</strong>, a Massachusetts-based manufacturing accelerator, <a href=\"https://techcrunch.com/2026/10/27/rebuild-which-spun-out-slate-auto-raises-2-1b/\" target=\"_blank\" rel=\"noopener\">raised $2.1 billion</a> to “expand Re:Build’s capacity to manufacture hard tech products and launch new industrial startups.” The investment was led by General Catalyst and JPMorganChase’s Strategic Investment Group. Other investors weren’t disclosed.</p>\n<p>The company, which was co-founded by Amazon’s former commercial CEO Jeff Wilke, has billed itself as “America’s answer to Shenzhen.” </p>\n<p><strong>Other deals …</strong></p>\n<p><strong>Bedrock Robotics</strong> <a href=\"https://techcrunch.com/2026/10/26/this-startups-self-driving-excavators-help-dig-up-600m-in-new-funding/\" target=\"_blank\" rel=\"noopener\">raised $600 million</a> in a funding round that values the autonomous vehicle technology startup at $4.1 billion. CapitalG and Emergence Capital co-led the Series C round. New investors US Innovative Technology Fund (USIT), Bessemer Venture Partners, and Temasek participated in the round, alongside existing investors 8VC, Georgian, Valor Equity Partners, Xora, Eclipse, Perry Creek Capital, and Nvidia.</p>\n<p><strong>DoorDash</strong> has agreed to <a href=\"https://techcrunch.com/2026/10/29/doordash-to-acquire-instacart-for-17b/\" target=\"_blank\" rel=\"noopener\">acquire</a> Instacart for $17 billion. Meanwhile, DoorDash noted in its third-quarter earnings that it has, so far, only received a few hundred orders from <a href=\"https://techcrunch.com/2026/10/30/doordash-said-its-only-received-several-hundred-orders-from-ai-agents/\" target=\"_blank\" rel=\"noopener\">AI agents</a>.</p>\n<p><strong>PreScalar</strong>, a San Francisco-based startup developing software and testing infrastructure for factories, <a href=\"https://www.prescalar.ai/post/we-raised-7-million-to-build-the-software-layer-for-the-modern-factory\" target=\"_blank\" rel=\"noopener\">raised $7 million</a> in seed funding co-led by Dynamo Ventures and BMW i Ventures, with participation from Blue Wire Capital, Uplift Ventures, and Antler. The startup was founded last year by a trio who had stints at Cruise, Google, Rivian, and Waymo. </p>\n<h2>Notable reads and other tidbits</h2>\n\n<p><strong>Elroy Air</strong>, a startup developing autonomous heavy-cargo drones for defense, rapid response, and commercial logistics, hired <a href=\"https://www.businesswire.com/news/home/20261027444412/en/Elroy-Air-Names-Jeremy-Hux-as-Chief-Financial-Officer-as-it-Prepares-to-Go-Public\" target=\"_blank\" rel=\"noopener\">Jeremy Hux</a> as its CFO in preparation for going public.</p>\n<p><strong>Ford</strong> announced <a href=\"https://techcrunch.com/2026/10/27/ford-fathom-will-be-the-cheapest-american-ev-capable-of-powering-a-house/\" target=\"_blank\" rel=\"noopener\">two new EV chargers</a> that will allow its forthcoming Fathom pickup truck to serve as a battery capable of delivering power to the home or grid.</p>\n<p>GM is <a href=\"https://techcrunch.com/2026/10/27/gm-is-embracing-hybrids-now/\" target=\"_blank\" rel=\"noopener\">embracing hybrids</a> now. Times sure have changed! The U.S. automaker is also trying to move past the driver data-selling controversy from several years ago. GM agreed to a <a href=\"https://techcrunch.com/2026/10/29/gm-reaches-220m-settlement-over-selling-drivers-private-data/\" target=\"_blank\" rel=\"noopener\">$220 million settlement</a> with 36 states (its settlement with California and the Federal Trade Commission happened earlier) to settle allegations that it illegally sold private driving behavior and location information to data brokers.</p>\n<p><strong>Kodiak AI</strong> will deliver <a href=\"https://techcrunch.com/2026/10/28/kodiak-lands-first-commercial-deal-to-supply-driverless-trucks-for-public-highways/\" target=\"_blank\" rel=\"noopener\">75 self-driving trucks</a> to freight company DTL Transport starting in 2028. It’s the company’s first binding commercial deal for driverless big rigs that will run on public highways.</p>\n<p><strong>Rivian</strong> reported its third-quarter earnings, and a few items stood out to us. For one, the new R2 has been successful enough for the company to <a href=\"http://techcrunch.com/2026/10/29/the-r2-suv-is-already-rivians-best-selling-vehicle/\" target=\"_blank\" rel=\"noopener\">raise its 2026 delivery guidance</a> by a couple thousands vehicles. Rivian, which had previously expected to deliver between 65,000 and 70,000 EVs this year, bumped up that floor to 67,000. But here is another potentially lucrative development: The $5.8 billion joint venture between Rivian and <strong>Volkswagen Group </strong>is expanding to <a href=\"https://techcrunch.com/2026/10/29/rivian-expands-joint-venture-with-vw-to-include-ai-assistant/\" target=\"_blank\" rel=\"noopener\">include AI assistants</a>. No word yet on whether that means VW will invest even more money into Rivian. </p>\n<p><strong>Tesla</strong> turns to Turo to boost adoption of <a href=\"https://techcrunch.com/2026/10/26/tesla-turns-to-turo-to-boost-adoption-of-full-self-driving-supervised/\" target=\"_blank\" rel=\"noopener\">Full Self-Driving (Supervised)</a>.</p>\n<p><strong>Waymo</strong> and <strong>Toyota</strong> have locked in a manufacturing partnership, officially moving them past the “we’re just talking” phase. Toyota will manufacture <a href=\"https://techcrunch.com/2026/10/30/waymos-next-robotaxi-will-be-a-toyota-bz4x-destined-for-japan-and-the-uk/\" target=\"_blank\" rel=\"noopener\">AV-ready bZ4X vehicles</a> — and integrate Waymo’s self-driving system — at its factory in Japan. The vehicles will be used for robotaxi services in Japan, the U.K., and other international markets. Importantly, the companies hinted that this could eventually lead to a licensing deal in which Waymo AV tech is in personally owned vehicles.</p>\n<h2>One more thing …</h2>\n<p>Last call for founders, investors, and builders based in and around the Boston area. The <a href=\"https://techcrunch.com/events/techcrunch-founder-summit-2026/\" target=\"_blank\" rel=\"noopener\">Founder Summit</a> — a one-day event in Boston — will be held on November 4. And I will be there! This event is really geared toward startup founders, aspiring founders, and investors. Attendees can expect advice-driven talks from VCs and serial founders, plus lots of chances to network. </p>\n<p>For my TechCrunch Mobility readers, here is a 30% discount on tickets. Click <a href=\"https://techcrunch.com/events/techcrunch-founder-summit-2026/tickets/?utm_source=mobility&amp;utm_medium=newsletter&amp;utm_campaign=tcfoundersummit2026&amp;utm_content=ticketsales&amp;promo=mobility30&amp;display=\" target=\"_blank\" rel=\"noopener\">this link</a> and use the code <strong>mobility30</strong>.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"New Brennan Center Report on Curbing Executive Power","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/10/30/new-brennan-center-report-on-curbing-executive-power/","category":"law","categoryLabel":"Law","wordCount":941,"readingTime":5,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/category/law/executive-branch/executive-power/\" target=\"_blank\" rel=\"noopener\">Executive Power</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/10/30/new-brennan-center-report-on-curbing-executive-power/\" target=\"_blank\" rel=\"noopener\">New Brennan Center Report on Curbing Executive Power</a>\n\t\t\t\t\t<p>Many of their recommendations are well-taken.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t10.30.2026 3:02 PM\n</p>\n\t</h2>\n\t\n\t\t <p>The NYU Brennan Center for Justice recently published <a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power\" target=\"_blank\" rel=\"noopener\">a valuable report</a> entitled \"</p> <blockquote><p>With just a signature, presidents can declare a national emergency and unlock special powers contained in more than 130 statutory provisions. These run the gamut from the seemingly trivial to the near-dictatorial, including powers to shut down or take over communications infrastructure, freeze Americans' bank accounts, and control domestic transportation. They are intended for sudden, fast-moving crises that Congress can't address quickly or flexibly enough. But presidents of both parties have stretched the meaning of \"emergency\" far beyond reason, enabling them to draw from a growing stockpile of statutory authorities with few real safeguards.</p> <p>There are currently 51 active states of emergency, and the longest-running has lasted 47 years.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__jsbW7JQqUhHkeujekyzZNfTUbO6P46JCBOrOddvK96Q_1\" target=\"_blank\" rel=\"noopener\">10</a> Any emergency that persists for generations is, by definition, not an emergency; it's a problem that can be addressed through ordinary lawmaking. Yet presidents have used emergency powers to bypass Congress and unilaterally advance their policy goals.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__V2OoeDTvQ8tNlcXl4eOQOVYT89dTzBAHZ6X-hxIYwzc_1\" target=\"_blank\" rel=\"noopener\">11</a></p> <p>The National Emergencies Act once allowed Congress to terminate emergencies with a simple majority vote and without the president's signature. But the Supreme Court struck down that procedure, known as a legislative veto, in 1983. Today, ending an emergency effectively requires a two-thirds majority in both chambers to override a presidential veto.</p> <p>Congress should amend the National Emergencies Act to constrain executive overreach.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__nIAYFT2afP33-Zkawvfrg5QONuuxpXV-BCKJoQuATE_1\" target=\"_blank\" rel=\"noopener\">12</a> Emergency declarations should expire automatically after 30 days unless Congress approves a one-year extension, renewable annually with Congress's assent. And presidents should be required to share detailed reports on their uses of emergency powers. Proposals along these lines have received widespread bipartisan support, with versions of these reforms overwhelmingly passing out of the relevant House and Senate committees in 2024.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__5x70PXnAbQBIvvfKQagfqNDxsx6WU1XKLmAmO03r8ek_1\" target=\"_blank\" rel=\"noopener\">13</a></p> <p>Additionally, Congress should amend specific emergency statutes whose extensive delegations of power and inadequate safeguards make them susceptible to misuse. Of particular concern is the <a href=\"https://www.brennancenter.org/our-work/policy-solutions/checking-presidents-sanctions-powers\" target=\"_blank\" rel=\"noopener\">International Emergency Economic Powers Act</a>, the most frequently invoked presidential emergency authority.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__vK9tOfOw9wGsGiiXu9pSJ2ZABKHlE4szTumbc18PlQ_1\" target=\"_blank\" rel=\"noopener\">14</a> Sanctions imposed under this law can equate to a \"financial death sentence\" lasting years or decades.<a href=\"https://www.brennancenter.org/our-work/policy-solutions/seven-solutions-rein-abuses-executive-power#footnote__EmC-O1VUbbMc0j8bQ80VR9LfycYHf-KbWHVKi58k30_1\" target=\"_blank\" rel=\"noopener\">15</a> Although the Supreme Court blocked Trump's effort to use the law to set global tariffs, the potential for other abuses remains.</p></blockquote> <p>I completely agree, and have previously advocated similar reforms, myself. Brennan is right that IEEPA should be tightened up. While the Supreme Court did rule (in <a href=\"https://www.cato.org/commentary/how-supreme-court-spared-america\" target=\"_blank\" rel=\"noopener\">a case I helped litigate</a>) that IEEPA cannot be used to impose tariffs, it still includes a lot of other dangerous powers.</p> <p>I would add, as I did in <a href=\"https://www.cato.org/commentary/not-everything-emergency\" target=\"_blank\" rel=\"noopener\">this article</a>, that invocations of emergency powers should be subject to  nondeferential judicial review, to ensure that they are used only in the event of genuine emergencies, not bogus ones. Congress would do well to amend relevant emergency statutes to make clear that such nondeferential judicial review is available.</p> <p>I also strongly endorse Brennan's recommendations on constraining laws governing the domestic use of the military. The Supreme Court <a href=\"https://reason.com/volokh/2025/12/25/thoughts-on-the-supreme-court-ruling-against-trump-in-the-illinois-national-guard-case/\" target=\"_blank\" rel=\"noopener\">did strike down</a> Trump's attempts to use bogus pretexts for federalizing the National Guard; the Ninth Circuit<a href=\"https://reason.com/volokh/2026/10/26/ninth-circuit-rules-trump-illegally-federalized-national-guard-in-los-angeles/\" target=\"_blank\" rel=\"noopener\"> recently reinforced that ruling</a> by rejecting the administration's broad definition of what qualifies as a \"rebellion\" justifying federalization. But, as the Brennan report indicates, there is still a lot of potential for abuse, especially when it comes to the Insurrection Act.</p> <p>I also agree with the Brennan report's advocacy of constitutional amendments eliminating presidential immunity from criminal liability for acts undertaken in office, and barring him from pardoning crimes committed by\" members of their inner circle, including immediate family members and senior administration officials\" and those \"convicted of crimes ordered by the president or committed on the president's behalf.\"</p> <p>I doubt that these amendments have much chance of being enacted, given the extreme difficulty of passing any constitutional amendment. On the other hand, the reforms to emergency powers and domestic use of the military can be adopted through ordinary legislation. In some cases, they can also be <a>bolstered by stronger judicial review</a> under existing laws and provisions of the Constitution.</p> <p>I do have a few disagreements with the report. For example, it is not clear to me that the Supreme Court's decision in <em>Trump v. Slaughter</em> goes as far as the authors suggest. The decision's scope <a href=\"https://www.theregreview.org/2026/07/30/shugerman-the-future-of-independent-agencies-adjudication-and-the-civil-service/\" target=\"_blank\" rel=\"noopener\">remains uncertain</a>. Among other things, <a href=\"https://reason.com/volokh/2026/06/29/can-the-supreme-court-slaughter-slaughter-without-cooking-cook/\" target=\"_blank\" rel=\"noopener\">it's not clear how wide a range of federal agencies it applies to and how to reconcile it with <em>Trump v. Cook</em>, decided on the same day</a>. I also think they may overestimate Slaughter's impact, since most federal agencies are already not independent in the sense that there are legal constraints on the presidents' power to fire their heads.</p> <p>I would also have liked to see more recognition that curbing excessive executive power requires curbing the scope of federal power generally. It is virtually impossible to have a federal government that regulates almost every aspect of human activity without simultaneously delegating vast - and often dangerous - discretion to the executive.</p> <p>That said, the vast majority of the Brennan report's recommendations are well-taken. I hope future Democratic administrations and members of Congress act on them.</p> <p>For those keeping score, it's worth noting that Brennan Center emergency powers expert Elizabeth Goitein, one of the authors of the report, is a long-time critic of abuses of emergency powers under Democratic administrations, as well as Republican ones. For example, she<a href=\"https://www.washingtonpost.com/opinions/2022/09/01/biden-student-debt-emergency-powers-are-slippery-slope/\" target=\"_blank\" rel=\"noopener\"> condemned President Biden's attempt to use emergency powers to effectuate massive student loan forgiveness</a>. And so <a href=\"https://www.scotusblog.com/2023/02/dont-let-the-executive-abuse-emergency-powers-to-raid-the-treasury/\" target=\"_blank\" rel=\"noopener\">did I</a>.</p>\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/10/30/amicus-brief-in-onetaste-criminal-prosecution/\" target=\"_blank\" rel=\"noopener\">NEXT: Amicus Brief in OneTaste Criminal Prosecution</a>\n    </p>\n\t<a href=\"https://reason.com/category/law/executive-branch/executive-power/\" target=\"_blank\" rel=\"noopener\">Executive Power</a><a href=\"https://reason.com/tag/donald-trump/\" target=\"_blank\" rel=\"noopener\">Donald Trump</a><a href=\"https://reason.com/tag/emergency-powers/\" target=\"_blank\" rel=\"noopener\">Emergency Powers</a><a href=\"https://reason.com/tag/ieepa/\" target=\"_blank\" rel=\"noopener\">IEEPA</a><a href=\"https://reason.com/category/foreign-policy/military/\" target=\"_blank\" rel=\"noopener\">Military</a>"}];

}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
