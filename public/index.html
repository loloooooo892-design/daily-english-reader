*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;

  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {
  color: var(--accent);

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

.archive-link a {

<script>
var articles = [{"title":"Former Elder Scrolls writer Kurt Kuhlmann is '100% convinced' a load-bearing bit of series lore was inspired by a typo","source":"PC Gamer","author":"Ted Litchfield","url":"https://www.pcgamer.com/games/the-elder-scrolls/former-elder-scrolls-writer-kurt-kuhlmann-is-100-percent-convinced-a-load-bearing-bit-of-series-lore-was-inspired-by-a-typo/","category":"gaming","categoryLabel":"Gaming","wordCount":697,"readingTime":4,"content":"<p>Speaking on the <a href=\"https://frvr.com/blog/news/the-elder-scrolls-never-received-a-new-vegas-style-spin-off-as-bethesda-and-todd-howard-are-very-protective-of-the-iconic-rpg-series/\" target=\"_blank\" rel=\"noopener\">FRVR Podcast</a> last week, former Bethesda writer and designer Kurt Kuhlmann was asked about the concept of \"<a href=\"https://en.uesp.net/wiki/Lore:Dragon_Break\" target=\"_blank\" rel=\"noopener\">Dragon Breaks</a>\"—time getting all weird on account of magic and stuff⁠—in Elder Scrolls lore. The biggest Dragon Break as far as Elder Scrolls fans are concerned: \"The Warp in the West,\" the series' post-facto determination that every ending of The Elder Scrolls Chapter 2: Daggerfall happened at the same time. On account of magic and stuff, you see.</p>\n\n<p>\"It came from the fact that there was this timeline that someone had made⁠—this was from Daggerfall days⁠—and there was this big gap in time. And I'm 100% convinced that, in reality, in our world, that was a typo. Someone just typed a date wrong in the timeline, skipped like 3,000 years or whatever by accident. It's right between the end of one year and another. So the last date in this year, and then the first date [in the next], there's this gap.</p><p>\"And [TES writer Michael Kirkbride] thought that was awesome. So he wrote up the thing about the Dragon Break, and I think he was using that also because there was the issue of Daggerfall [having multiple endings].</p><p>\"Normally, you don't worry about that in a game. If you want to have a sequel refer to the past⁠, you're just going to have to pick one of those [endings] and move on, and just say in the sequel of the game, 'What actually happened was <em>this</em>.' The player could have done all these different things, but we can't have that.</p><p>\"Mike was like, 'No, what we're gonna do: What if all of them happened, and you got <a href=\"https://en.uesp.net/wiki/Lore:Numidium\" target=\"_blank\" rel=\"noopener\">Numidium</a>, and it was all crazy metaphysical stuff. So why not?' Everyone sees all the different endings, and no one knows what really happened, and it's this crazy metaphysical thing.\"</p>\n\n<p>I love this story: Simple serendipity, a workplace oopsie, accidentally setting in motion the continuity and story beats of a billion-dollar franchise. Kirkbride is memetically famous among Elder Scrolls fans as a boundary-pushing loremaster who added a lot of weird flavor to Morrowind, so his affinity for the timey-wimey, fucky-wucky potential of the Dragon Break absolutely scans.</p><p>As far as I can tell, it doesn't seem like the series timeline Kuhlmann mentioned was ever publicly available⁠—this must have been an internal lore bible sort of thing. While TES Arena and Daggerfall designer Ted Peterson would write the in-game book, \"<a href=\"https://en.uesp.net/wiki/Oblivion:The_Warp_in_the_West\" target=\"_blank\" rel=\"noopener\">The Warp in the West</a>,\" for Oblivion, Kirkbride and Kuhlmann appear to have introduced the concept in Morrowind with the books \"<a href=\"https://en.uesp.net/wiki/Lore:Where_Were_You_..._Dragon_Broke\" target=\"_blank\" rel=\"noopener\">Where Were You When the Dragon Broke</a>\" and \"<a href=\"https://en.uesp.net/wiki/Lore:The_Dragon_Break_Re-Examined\" target=\"_blank\" rel=\"noopener\">Dragon Break Re-Examined</a>\" respectively.</p><p>Kuhlmann noted in the podcast that he attempted to introduce more grounded, historiographic ambiguity with his treatment: What if the confusion was a matter of bias, transcription, and record-keeping, rather than metaphysical forces? Of course, Dragon Break Re-Examined also deliberately references events in Morrowind's <em>future</em> as the past, implying the skeptical book itself is yet another example of timey-wimey shenanigans⁠. An all-timer bit, for my money.</p><p>Elder Scrolls aside, the problem of preserving and representing RPG choice across multiple games in a series is something no studio has managed to fully \"solve,\" if such a thing is even possible. I've always appreciated Bethesda's \"fuck it, we ball\" approach to the continuity with stuff like The Warp in the West. See also how Larian's Divinity: Original Sin 2 almost completely contradicts the story of Divinity 2: Ego Draconis (sans Original Sin) from eight years prior. I love RPGs so much, man.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Ted has been thinking about PC games and bothering anyone who would listen with his thoughts on them ever since he booted up his sister's copy of Neverwinter Nights on the family computer. He is obsessed with all things CRPG and CRPG-adjacent, but has also covered esports, modding, and rare game collecting. When he's not playing or writing about games, you can find Ted lifting weights on his back porch. You can follow Ted on <a href=\"https://bsky.app/profile/dilfpatrol.bsky.social\" target=\"_blank\" rel=\"noopener\">Bluesky</a>.</p>"},{"title":"How Fast You Age During 40s May Predict Memory Lapses in Your 50s - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/how-fast-you-age-during-40s-may-predict-memory-lapses-in-your-50s-1285315/","category":"fun","categoryLabel":"Interesting Reads","wordCount":543,"readingTime":3,"content":"<p>Midlife is a busy time—and it comes with plenty of stress. You likely have mounting responsibilities at work, kids that need your attention, parents that may need more care, increasing financial obligations, etc. When you add an aging mind and body on top of all that, it’s a lot to take on. Now, a new <a href=\"http://dx.doi.org/10.1093/gerona/glag202\" target=\"_blank\" rel=\"noopener\">study</a> suggests that how quickly you age during midlife can predict memory lapses a decade later. </p><p>Featured Video</p><p>To probe the relationship between biological aging and memory, researchers from Penn State University collected blood samples from 232 adults who were in their 40s during the 2000s. They tested the samples using two <a href=\"https://nautil.us/a-peek-inside-the-black-box-of-epigenetic-clocks-1283841\" target=\"_blank\" rel=\"noopener\">molecular clocks</a> to determine biological age, as well as a third clock to measure the <em>rate</em> they were aging. This clock, called DunedinPACE, was developed by following a cohort of 1,000 people beginning in the 1970s and tracking changes in 19 biomarkers related to organ integrity every year since.</p><p><strong>Read more: “<a href=\"https://nautil.us/memory-decline-starts-earlier-than-you-might-think-1284669\" target=\"_blank\" rel=\"noopener\">Memory Decline Starts Earlier Than You Might Think</a>”</strong></p><p>“Many of these tests are like your car’s odometer—they tell you how far you’ve gone in terms of age and how much aging-related change has accumulated,” study author David Almeida explained in a <a href=\"https://www.psu.edu/news/research/story/how-quickly-people-age-during-midlife-predicted-memory-lapses-10-years-later\" target=\"_blank\" rel=\"noopener\">statement</a>. “In this study, the useful measure turned out to be more like a car’s speedometer—a measure of how fast your body is aging during midlife.”</p><p>Around 10 years later, the researchers followed up with the group in a series of eight phone interviews, to find out how their memories were holding up. The participants were asked how often they experienced two different kinds of memory lapses: retrospective lapses (forgetting something in the past, like where they put their keys) and prospective lapses (forgetting to do something they planned to do, like take medication), as well as how often these glitches interfered with their lives. </p><p>“Though they may seem similar, prospective memory lapses are both less common and can be more serious than retrospective lapses,” Almeida said. “Misplacing your car keys can be irritating, but it’s often less harmful than missing doses of needed medication or accidentally skipping doctor’s appointments.” </p><p>When they looked for correlations between memory lapses and biological age, however, they didn’t find any. Instead they discovered that those who aged at a more rapid pace during middle age were 18 percent more likely to experience a prospective memory lapse. That means rapid agers may forget something on five more days each month, compared to their peers. And it could be a warning of things to come. According to past <a href=\"https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/alz70856_105687\" target=\"_blank\" rel=\"noopener\">research</a>, frequent prospective memory lapses may be associated with dementia later on.</p><p>Of course, that doesn’t mean you’re automatically doomed if you flake on a doctor’s appointment. Instead, the researchers say, it’s important to be mindful of any cognitive changes during this busy period. They also stress that you shouldn’t be shy about bringing up at your <em>next</em> doctor’s appointment. </p><p>“There are a lot of different physical causes of cognitive decline— from circulation issues to lack of sleep—but there are also a lot of effective solutions,” Almeida said. “If we catch problems early, we can enhance the quality of our lives, possibly for decades.” </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Mono_Abe / Shutterstock</em></p>"},{"title":"Some lessons of open-minded discourse on the Supreme Court","source":"SCOTUSblog","author":"Alexander Heffner ","url":"https://www.scotusblog.com/2026/09/some-lessons-of-open-minded-discourse-on-the-supreme-court/","category":"law","categoryLabel":"Law","wordCount":1097,"readingTime":6,"content":"<p>Ever since the Supreme Court formally recognized the power of judicial review in the landmark 1803 case of <a href=\"https://supreme.justia.com/cases/federal/us/5/137/\" target=\"_blank\" rel=\"noopener\"><em>Marbury v. Madison</em></a>, the be-all and end-all on constitutionality has been the Supreme Court. Informed Americans and readers of SCOTUSblog know that means the court ultimately decides the laws by which we must live, and in that way, it is arguable that nine unelected justices dictate American priorities more so than any president, Senate majority leader, business tycoon, or political pundit. After all, they can override the executive or legislative branches, as well as lower courts and state decisions on federal law, and in recent years have increasingly done so through a \"shadow docket” of decisions that are made without public argument or deliberation.</p><p>For 70 of the 220 years since the Supreme Court asserted its jurisdiction over American law – so nearly one-third of this history – there has been a reliable and consistent platform of discourse about the court (and many other subjects): <a href=\"https://www.thirteen.org/openmind/\" target=\"_blank\" rel=\"noopener\">\"The Open Mind,\" the longest-running series in PBS history and one that my grandfather founded in 1956 and that I have hosted</a> <a href=\"https://www.thirteen.org/openmind/\" target=\"_blank\" rel=\"noopener\">since his death in 2013.</a> From deliberations about <a href=\"https://www.thirteen.org/openmind-archive/civil-rights/the-new-negro-1957-mlk-interview/\" target=\"_blank\" rel=\"noopener\">segregation and discrimination</a> to litigation surrounding <a href=\"https://www.thirteen.org/openmind/government/rescuing-middle-class-republic/5720/\" target=\"_blank\" rel=\"noopener\">monopolies and anti-trust</a>, <a href=\"https://www.thirteen.org/openmind-archive/history/the-destruction-of-privacy-in-america-part-i/\" target=\"_blank\" rel=\"noopener\">privacy in America</a> and <a href=\"https://www.thirteen.org/openmind-archive/free-speech/security-and-freedom-in-an-anxious-age-part-i/\" target=\"_blank\" rel=\"noopener\">the Patriot Act</a>, and <a href=\"https://www.thirteen.org/openmind/media/presidents-twitter-blocks/5879/\" target=\"_blank\" rel=\"noopener\">blocking citizen accounts on Twitter/X</a>, “The Open Mind” – like SCOTUSblog – has been studiously attentive to Supreme Court opinions, dissents, and what, exactly, this all means for our republic. Along the way, our guests have included a who’s who in constitutional theater, including <a href=\"https://www.thirteen.org/openmind-archive/government/active-liberty-by-mr-justice-breyer-part-i/\" target=\"_blank\" rel=\"noopener\">Justice Stephen Breyer</a>, <a href=\"https://www.thirteen.org/openmind-archive/history/robert-h-bork-an-intellectual-feast-part-i/\" target=\"_blank\" rel=\"noopener\">Judge Robert Bork</a>, Circuit Judges <a href=\"https://www.thirteen.org/openmind-archive/the-law/our-courts-and-our-congress/\" target=\"_blank\" rel=\"noopener\">Robert Katzmann</a> and <a href=\"https://www.thirteen.org/openmind-archive/public-affairs/the-decline-of-the-public-intellectual/\" target=\"_blank\" rel=\"noopener\">Richard Posner</a>, Supreme Court advocates <a href=\"https://www.thirteen.org/openmind-archive/free-speech/free-speech-issues-part-i/\" target=\"_blank\" rel=\"noopener\">Floyd Abrams</a> and <a href=\"https://www.thirteen.org/openmind/government/how-to-craft-constitutional-consensus/5079/\" target=\"_blank\" rel=\"noopener\">Neal Katyal</a>, scholars <a href=\"https://www.thirteen.org/openmind-archive/civil-rights/the-permanence-of-racism/\" target=\"_blank\" rel=\"noopener\">Derrick Bell</a> and <a href=\"https://www.thirteen.org/openmind/the-law/equal-unequal-justice/5426/\" target=\"_blank\" rel=\"noopener\">Martha Minow</a>, a shaper of contemporary Supreme Court reporting <a href=\"https://www.thirteen.org/openmind-archive/media/privacy-and-the-press/\" target=\"_blank\" rel=\"noopener\">Anthony Lewis</a>, and a new generation of legal academics like law professors <a href=\"https://www.thirteen.org/openmind/the-law/the-battle-for-constitution/6261/\" target=\"_blank\" rel=\"noopener\">Justin Driver</a>, <a href=\"https://www.thirteen.org/openmind/the-law/how-to-reform-an-unrepresentative-supreme-court/6907/\" target=\"_blank\" rel=\"noopener\">Leah Litman</a>, and <a href=\"https://www.thirteen.org/openmind/the-law/subjective-judges-and-justice/7162/\" target=\"_blank\" rel=\"noopener\">Carissa Byrne Hessick</a>.</p><p>On Wednesday, I will have SCOTUSblog’s founder Amy Howe and executive editor Zachary Shemtob as my guests to discuss the Supreme Court’s 6-3 ideological majority, whether the justices would ever be open to the possibility of reform, transparent ethics standards, the possibility of expansion, and much more.</p><p>Before then, however, I wanted to share several things that I’ve learned from being part of a series that has spent seven decades covering the court.</p><p>First is how gradually, and then all at once, history can change on the court. When “The Open Mind” was first broadcast, Chief Justice Earl Warren had headed the court for only three years and would come to herald an unprecedented progressive era on it. This changed with the Burger era, and then dramatically so with the Rehnquist and Roberts courts. Once on the margins of Supreme Court jurisprudence, originalism, in particular, has sought to halt the emerging practice of Living Constitutionalism. In episodes over the past quarter of a century, viewers can see that pendulum swing – at first incremental and then rapid-fire – from a liberal to conservative majority. Yet this was also contingent. Had Hillary Clinton won both the Electoral College and popular vote in 2016, we might be witnessing a liberal era on the court rather than a conservative super-majority.</p><p>Another enduring subject is cameras in the courtroom. This was one of my grandfather’s favorite subjects to explore. He saw this discussion as essential to Americans' engagement in the branch of government that was becoming increasingly pivotal in deciding the future of their lives. While today there is live audio of oral arguments, I wonder if the Supreme Court had also opened its doors to cameras – as a civic counterpoint to the sensationalistic Court TV coverage – more citizens would have taken sustained interest in the court’s role in our republic. And it is now natural to wonder whether that time may have passed: In today’s era of social media, clips are all too often deployed as ammunition to bolster one side rather than to find common ground.</p><p>This period also corresponded with the increasingly punitive prosecutions and imprisonment of the American people – which has made the United States per capita the most incarcerated nation in the developed world. Although the court has issued surprisingly few decisions in this regard, the fact that one-third of American families have a loved one impacted in the justice system has significant implications for both federal and state law. <a href=\"https://www.thirteen.org/openmind/category/justice-reform/\" target=\"_blank\" rel=\"noopener\">In a series of episodes featuring national</a><a href=\"https://www.thirteen.org/openmind/category/justice-reform/\" target=\"_blank\" rel=\"noopener\"> leaders like Equal Justice Initiative founder Bryan Stevenson as well as local and state reformers, we explored facets of the contemporary justice reform.</a> Our subjects included the death penalty, life sentences, and probation and parole – some areas of the carceral state in which the court has actually spoken.</p><p>Finally, and returning to my first point regarding historical shifts on the court, one of the things that has fascinated me most – and still does not get enough discussion – is that the composition of the court, and, indeed, the fate of our country, is determined by the status of nine individuals’ health (namely, who dies, and when, and who is president and the senate majority leader at any given moment). Even if one believes life tenure for judges is a good thing, today’s model feels more like royal inheritance than republicanism, especially considering that three of the newest justices were appointed by President Donald Trump in his first term, when he lost the nation’s popular vote.</p><p>There is, of course, far more to say about the Supreme Court. But I’ll end with an anecdote. In the 1990s, I was not more than 10 years old when my grandfather took me on my first trip to Washington, D.C. to see the memorials and monuments in all their glory. He also arranged a greeting with Justice Breyer, whom he had <a href=\"https://www.thirteen.org/openmind-archive/public-affairs/how-much-is-a-human-life-worth-part-i/\" target=\"_blank\" rel=\"noopener\">interviewed as the chief judge of his circuit court</a> before his Supreme Court nomination.</p><p>After graciously receiving us in his chambers, Breyer sent me off with an autographed pocket U.S. Constitution. I thanked him and probed innocently: “But, Mr. Justice, don’t you need this?” (Although he didn’t respond at the time, I was later told he found this quite amusing – Breyer is well-known for his “professorial” sense of humor.)</p><p>In truth, we all should be armed with this document and debate often its meaning – clichéd as this may sound, it remains the bedrock of our founding and evolving life as a nation.</p><p><strong>Recommended Citation: </strong>Alexander Heffner , <em>Some lessons of open-minded discourse on the Supreme Court</em>, SCOTUSblog (Sep. 21, 2026, 10:30 AM), https://www.scotusblog.com/2026/09/some-lessons-of-open-minded-discourse-on-the-supreme-court/</p>"},{"title":"Before You Buy an Apple Watch, Read This","source":"Wired","author":"@wired","url":"https://www.wired.com/story/best-apple-watch/","category":"tech","categoryLabel":"Technology","wordCount":1400,"readingTime":7,"content":"<p>As WIRED’s resident wearable tester, I’ve tried enough smartwatches to know there’s life beyond the Apple Watch. I just apparently don’t want it. Maybe it’s because I joined the Apple ecosystem at 10 years old and have been indoctrinated ever since. I’m fluent in iOS, macOS, and watchOS, and for better or worse, the Apple Watch is my default wearable.</p><p>But what’s the best Apple Watch to buy? There are now three models, each with its own set of features, and the differences between them can appear minor even when the prices aren’t. Fortunately, I’ve tested them all; Here’s how the current lineup stacks up.</p><p>For more recommendations, check out our guides to the <a href=\"https://www.wired.com/story/best-apple-watch-bands/\" target=\"_blank\" rel=\"noopener\">Best Apple Watch Bands</a>, the <a href=\"https://www.wired.com/story/best-apple-watch-accessories/\" target=\"_blank\" rel=\"noopener\">Best Apple Watch Accessories</a>, and the <a href=\"https://www.wired.com/gallery/best-smartwatches/\" target=\"_blank\" rel=\"noopener\">Best Smartwatches</a>.</p><p><em>Love WIRED?</em> <a href=\"https://www.google.com/preferences/source?q=wired.com\" target=\"_blank\" rel=\"noopener\"><em>Add us as a preferred source on Google</em></a> <em>to see more of us.</em></p><p><strong>Jump To</strong></p><h2>Best Apple Watch Overall</h2><ul><li><p>Photograph: Boutayna Chokrane</p></li><li><p>Photograph: Boutayna Chokrane</p></li><li><p>Photograph: Boutayna Chokrane</p></li></ul><p>Apple</p><h3>Watch Series 12</h3><p>The <a href=\"https://www.wired.com/review/apple-watch-series-12/\" target=\"_blank\" rel=\"noopener\">Series 12</a> is Apple’s flagship watch. Its biggest upgrade is the new <a href=\"https://www.wired.com/story/apple-watch-series-12-apple-watch-ultra-4/\" target=\"_blank\" rel=\"noopener\">Health Sensing System</a>, which improves the breadth, accuracy, and frequency of its health tracking. The ECG now uses 32 electrodes for better skin contact, up from two on the <a href=\"https://www.wired.com/review/apple-watch-series-11/\" target=\"_blank\" rel=\"noopener\">Series 11</a>, while improved optical sensing and more efficient LEDs deliver more accurate heart-rate readings. The <a href=\"https://www.wired.com/review/apple-watch-series-12/\" target=\"_blank\" rel=\"noopener\">Series 12</a> also tracks your heart rate every five seconds throughout the day and HRV as often as every five minutes, compared with every five minutes for heart rate and roughly every two hours for HRV on the <a href=\"https://www.wired.com/review/apple-watch-series-11/\" target=\"_blank\" rel=\"noopener\">Series 11</a>.</p><p>The <a href=\"https://www.wired.com/review/apple-watch-series-12/\" target=\"_blank\" rel=\"noopener\">Series 12</a> also introduces Apple’s Readiness score, which gives you a snapshot of how prepared your body is for the day based on your recent health and activity data. <a href=\"https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/\" target=\"_blank\" rel=\"noopener\">Audio Intelligence</a> is another major addition, though two of its headline features (Live Rewind and Siri Recap) won’t arrive until later this year.</p><p>Battery life remains rated for up to 24 hours, but charging is faster. Fifteen minutes delivers up to 12 hours of normal use, and five minutes get you up to 10 hours of sleep tracking. Just about the only feature the <a href=\"https://www.wired.com/review/apple-watch-series-11/\" target=\"_blank\" rel=\"noopener\">Series 11</a> lacks is satellite connectivity, but if you don't go off the grid, then it has everything else you need.</p>Specs<strong>Case(s)</strong>42 mm or 46 mm<strong>Display</strong>Wide-angle OLED, Always-on Retina display, up to 2,000 nits<strong>Battery Life</strong>Up to 24 hours (up to 38 hours in Low Power Mode)<strong>GPS</strong>Precision L1 GPS<strong>Finishes</strong><strong>Aluminum:</strong> Dark Bronze, Light Gold, Black, Space Gray; <strong>Titanium:</strong> Radiant Gold, Natural; <strong>Ceramic:</strong> Pearl White, Night Blue<h2>Best Battery Life</h2><ul><li><p>Photograph: Boutayna Chokrane</p></li><li><p>Photograph: Boutayna Chokrane</p></li><li><p>Photograph: Boutayna Chokrane</p></li><li><p>Photograph: Boutayna Chokrane</p></li></ul><p>Apple</p><h3>Watch Ultra 4</h3><p>The <a href=\"https://www.wired.com/review/apple-watch-ultra-4/\" target=\"_blank\" rel=\"noopener\">Ultra 4</a>’s biggest upgrades are its longer battery life, faster charging, and new health-tracking capabilities. It lasts up to 50 hours on a charge—up from 42 hours on the Ultra 3—and up to 84 hours in Low Power Mode. Fast charging gets a boost, with 15 minutes on the charger providing up to 18 hours of normal use and five minutes offering up to 10 hours of sleep tracking. A new <a href=\"https://www.wired.com/story/apple-watch-series-12-apple-watch-ultra-4/\" target=\"_blank\" rel=\"noopener\">Health Sensing System</a> and faster S11 chip enable frequent background heart-rate and HRV tracking, the Readiness score, and Apple’s suite of <a href=\"https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/\" target=\"_blank\" rel=\"noopener\">Audio Intelligence</a> features.</p><p>Beyond those improvements, the <a href=\"https://www.wired.com/review/apple-watch-ultra-4/\" target=\"_blank\" rel=\"noopener\">Ultra 4</a> is essentially the same smartwatch as its predecessor. It remains built for multi-day hikes, water sports, and endurance activities, with water resistance up to 100 meters and a depth gauge rated to 40 meters for recreational scuba diving. Its standout feature remains satellite messaging, which lets you contact emergency services when you’re beyond cellular or Wi-Fi coverage. Fall and crash detection, plus a built-in siren, offer additional precautions to get help when you need it.</p><p>My biggest complaint is that the 49-mm can be too large on slimmer wrists. I’d like a 46-mm option.</p>Specs<strong>Case(s)</strong>49 mm<strong>Display</strong>Wide-angle OLED, Always-on Retina display, up to 3,000 nits<strong>Battery Life</strong>Up to 50 hours (up to 84 hours in Low Power Mode)<strong>GPS</strong>Precision dual-frequency GPS<strong>Finishes</strong><strong>Titanium:</strong> Natural, Black<h2>Best Budget-Friendly Apple Watch</h2><p>Photograph: Adrienne So</p><p>Apple</p><h3>Watch SE 3</h3><p>Apple didn’t update the SE this year, so the <a href=\"https://www.wired.com/story/apple-watch-series-11-se-ultra-3/\" target=\"_blank\" rel=\"noopener\">Watch SE (3rd Gen)</a> remains the most affordable. It’s designed with the S10 chip, which enables many of the health features the SE 2 lacked, such as sleep apnea notifications and skin temperature sensing. It’s compatible with watchOS 27, so you can use the dynamic app grid, the Siri app, and Workout Buddy. It has fast charging, and even though it doesn’t have the <a href=\"https://www.wired.com/review/apple-watch-series-12/\" target=\"_blank\" rel=\"noopener\">Series 12</a>’s 24-hour battery life, former WIRED editor <a href=\"https://www.wired.com/author/adrienne-so/\" target=\"_blank\" rel=\"noopener\">Adrienne So</a> still somehow managed to eke out a full day with it, even with the always-on display.</p><p>The screen is only a 1,000-nit display compared to the 2,000-nit display on the <a href=\"https://www.wired.com/review/apple-watch-series-11/\" target=\"_blank\" rel=\"noopener\">Series 11</a>’s wide-angle OLED display, and it doesn't have the UWB locator chip. You’re missing out on the new features, including the new Readiness score, high-frequency heart-rate and HRV tracking, and <a href=\"https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/\" target=\"_blank\" rel=\"noopener\">Audio Intelligence</a>. It also cannot check your blood oxygen or take <a href=\"https://www.wired.com/story/ecg-apple-watch/\" target=\"_blank\" rel=\"noopener\">an electrocardiogram</a>, nor does it have the latest hypertension notifications.</p>Specs<strong>Case(s)</strong>40 mm or 44 mm (aluminum)<strong>Display</strong>OLED, Always-on Retina display, up to 1,000 nits<strong>Battery Life</strong>Up to 18 hours (up to 32 hours in Low Power Mode)<strong>GPS</strong>GPS<strong>Finishes</strong><strong>Aluminum:</strong> Starlight, Midnight<h2>Compare Top 3 Apple Watches</h2>ProductCase Size(s)Material(s)DisplayGPSBattery LifePrice<a href=\"https://cna.st/affiliate-link/4V7YJyp8h9anS3yFQVVSJNYGRwoo9HCtTnX19yT6ur3XpQcDJ1Yjbw7EuZDCK38LEQaiiM9SufU4PRCRUPY2LqqzpAhsA3Ew9p3pz3vanzCUbXYnP3qm5TSnSb5cR4zhKebGpGSwruyMLT3EyEYt29uycMjVrsqsjXYiCs7NBqtEPdW8cLDMxZ7zEYjt2iP5rXLpQNZVeSBjwPJQoEvh8kg1GJFiUNnmii8AUCPdLcakjeCWTNU848ZK4mNAkdZmDXs3nR89TX51YYhBtR1x1QPtMW3qHxFtNbqNCatQmA\" target=\"_blank\" rel=\"noopener\"><strong>Series 12</strong></a>42 mm or 46 mmAluminum, titanium, or ceramicWide-angle OLED, Always-on Retina display, up to 2,000 nitsPrecision L1 GPSUp to 24 hours$399<a href=\"https://cna.st/affiliate-link/TSeEb3zLmLvAvE5jyzff6KCgGC5KKgmmU2NajLaN7LpAyhnzqDmdhmshgERssSsCetkhFmWfC2iodzRJkxnAf3NkyB7NZUrMVvZiAhWKYfPGXSDYohaTxwB1xJG52pu1V9YMjHHeTRX3gXAitDnDBLeFWU27VAzyxBkcQj4qFbEZ9pYGmxTkUVeA4b9ddkue3SVTDETLAxpz1ujEKxyHM5TBXY4gsLW1MkHV2KNk1UGmnTWKRrq9jUsesMcndRpS9NTcxtBaXmsjHMGS1heUNrJ71mUbZ98C8Va79qXJijX6uuohfag5Xp72NKZRN9ZsiUKkPnDV1whhwzbYTqsbj7FqY2WJsgy3gMYQaAsCwHKWXuUaeEm61xDfcJKkcT3XY7YT6\" target=\"_blank\" rel=\"noopener\"><strong>Ultra 4</strong></a>49 mmTitaniumWide-angle OLED, Always-on Retina ery life in 15 minutes.</p><p><strong><a href=\"https://cna.st/affiliate-link/6JJRoyFH2FdjkDBdpsqtKUfxY2RSq8qYcSwZpH5JZHf6XUGDHBDGvvupUZR5hqTovacjchCQMohFMcteLKpULh59TxJCgkLsGM3fzzox5Ai9WfRZbszX99S7Ta7FbFZnd852ornQJPKrBQXr6irtJcwiTJJVTTW67GfndGZiURrjCiLUuoST9ExfFPLahepMfFNTc7ijkjKGcaJaNmfgyGorDoGZ9FG4b58fNTQQZfyhcMezjgTSMqLor1kjyPiucHEAbCudu5DHGeyPj2NrLP4ovFiq1YS6oEUxAZG1tiU2WR59bjyQPnB2mYrbt1c5eoMq5bWczoo5freF7uNYXXVJAzx2WZYEVKwBeFJ1Pk9xXtnWFdT2YTWfuBcWJyah9jPuMtzJSutR9Uu63zecJfJm5dS5PSZUGGTdTsnfduAtt\" target=\"_blank\" rel=\"noopener\">Apple Watch Ultra 3 for $799</a>:</strong> With no price difference between generations, the Ultra 3 only makes sense if you find it at a significant discount. It has a shorter battery life, rated for up to 42 hours compared with the <a href=\"https://www.wired.com/review/apple-watch-ultra-4/\" target=\"_blank\" rel=\"noopener\">Ultra 4</a>’s 50 hours. You also miss out on <a href=\"https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/\" target=\"_blank\" rel=\"noopener\">Audio Intelligence</a>, high-frequency heart-rate and HRV tracking, and the Readiness score. Otherwise, it’s basically the same outdoor-focused Apple Watch.</p><h2>Avoid These Apple Watches</h2><p>WatchOS 27 only works with the <a href=\"https://www.wired.com/review/apple-watch-series-9/\" target=\"_blank\" rel=\"noopener\">Series 9</a> and newer, so I wouldn’t recommend buying an Apple Watch older than that. With less price variation between generations, I’d also only consider an older Apple Watch if it’s on sale.</p><p>How I Test Apple Watches</p><p>For my initial reviews, I wear each Apple Watch day and night for about a week, using it as I would a typical smartwatch, fitness tracker, and sleep tracker. Afterward, I continue testing for at least another month to evaluate longer-term claims and how useful its wellness data proves to be in practice.</p><p>I sport each watch during workouts, throughout the day, and while sleeping to judge its comfort over time. I also consider screen readability indoors and outdoors, and the responsiveness of the touchscreen and physical controls. I test everyday functions like Siri, music playback, and watchOS to evaluate how intuitive they are to navigate and how well they integrate with the iPhone experience. I track how long the battery lasts with features such as workout tracking, notifications, and sleep tracking enabled. I also note charging speed and how practical it is to maintain throughout a full day and overnight.</p><p>Because the Apple Watch is also a fitness tracker, I use it for a range of activities, including but not limited to runs, rides, and strength training. I compare heart rate readings, workout detection, step counts, and other fitness metrics against previous Apple Watches and competitors (i.e., Oura and Whoop). I also compare sleep tracking with predecessors and competitors, looking at the quality of the data, how useful the metrics are, and whether it provides actionable insights.</p>"}];

function render() {

  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);

  window.scrollTo(0, 0);
}

function nextArticle() {

    currentIndex++;
    render();

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
