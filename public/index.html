goryLabel":"Gaming","wordCount":562,"readingTime":3,"content":"<p>How OD.</p>\n    \n  \n  \n  \n  \n            <p>Metal Gear and Death Stranding creator <a href=\"https://www.eurogamer.net/personas/hideo-kojima\" target=\"_blank\" rel=\"noopener\">Hideo Kojima</a> has spoken about a number of topics concerning <a href=\"https://www.eurogamer.net/physint-kojima-playstation-xbox-publishing-changes\" target=\"_blank\" rel=\"noopener\">Sony's sudden shocking decision to back away from publishing his tactical espionage project, Physint</a>. It was a decision made in June, and though <a href=\"https://www.eurogamer.net/hideo-kojima-loves-sony-playstation-physint\" target=\"_blank\" rel=\"noopener\">Kojima was able to convince Xbox to pick up the Metal Gear successor</a> and continue funding and publishing it, the transition raised a lot of questions.</p>\n<p>One of the most obvious questions being: which platforms will the game be available on? Will it be an Xbox exclusive now, or will it still release on PlayStation?</p>\n<p>\"I don't know the answer to that - that would be a question for Xbox,\" Kojima told <a href=\"https://me.ign.com/en/hideo-kojima-xbox-project/248188/hideo-kojima-reveals-what-happened-with-sony-in-exclusive-first-interview-since-playstation-ditched\" target=\"_blank\" rel=\"noopener\">IGN</a> in an interview. \"In previous updates from Xbox, I thought that they have this kind of stance where they want to deliver to as many gamers as possible, no matter what the platform is.\"</p>\n<p>Xbox has indeed embraced a multi-platform strategy for several years, but that strategy shifted with new CEO Asha Sharma's arrival at the beginning of the year. <a href=\"https://www.eurogamer.net/microsoft-making-more-xbox-games-exclusive-to-give-reason-to-buy-the-console\" target=\"_blank\" rel=\"noopener\">Xbox is now once again embracing exclusives</a>, notably confirming recently that <a href=\"https://www.eurogamer.net/xbox-leadership-on-future-exclusives\" target=\"_blank\" rel=\"noopener\">Xbox  games Gears of War: E-Day and Clockwork Revolution won't be released on PlayStation</a>. However, some games such as <a href=\"https://www.eurogamer.net/forza-horizon-6-ps5-on-track-2026\" target=\"_blank\" rel=\"noopener\">Forza Horizon 6</a> and <a href=\"https://www.eurogamer.net/fable-gets-a-moody-release-date-trailer-at-the-xbox-games-showcase-releasing-february-2027\" target=\"_blank\" rel=\"noopener\">Fable remain in the works for PS5</a>, so there's hope for Physint.</p>\n<p>\"I think all of that will be announced at a later time,\" Kojima added. \"I'm not sure yet, and I can't really say.\"</p>\n\n<p>The other obvious, PlayStation-related question concerns the game's engine. When Kojima left Konami and established his independent Kojima Productions, he spent a lot of time looking for the right engine to build his next project with - the game that would later become Death Stranding.</p><p>The engine that won out belonged to Sony; it was Horizon developer Guerrilla Games' internal engine, which the studio gave to Kojima on the condition his team continues adding to it. <a href=\"https://blog.playstation.com/2017/02/23/the-hideo-kojima-death-stranding-interview-strands-decima-and-guerrilla-games/\" target=\"_blank\" rel=\"noopener\">The engine didn't have a name at that point, but after several modifications, the two parties named it Decima</a>.</p>\n<p>So, will Physint share the same engine as the Death Stranding games - Decima? Kojima's answer is complicated. \"Well, I haven't really decided yet. I'm still experimenting,\" he said, when asked if he had to change the game's engine after Sony dropped the project.</p>\n<p>\"After we decided to team up with Xbox, they said they will give us a lot of technological support. When I went to visit them during the Don Mattrick days, they had so many labs and everything, and they were experimenting on so many things, like state of the art, new, really new, cutting-edge technology.</p>\n<p>\"I was really surprised,\" he added. \"I was thinking, 'There are so many Doc Browns from Back to the Future here!' So I want to use all this new technology. Anything that I can use, I want to use, and I'm looking forward to teaming up with Xbox, but I really haven't decided about the engine.\"</p><p>It's worth noting that Kojima Productions' next project, <a href=\"https://www.eurogamer.net/kojima-and-xbox-team-up-to-show-off-more-od-knock\" target=\"_blank\" rel=\"noopener\">the also Xbox-funded OD: Knock, is being developed on Unreal Engine 5</a>, so there's a chance the studio may decide on Epic's popular engine to develop Physint. But considering OD: Knock does not itself have a release target, we maybe waiting a long while yet to see Physint.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 1 more"},{"title":"Behold, Crawzilla, the Not-Quite-Biggest Crayfish Ever Caught - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/behold-crawzilla-the-not-quite-biggest-crayfish-ever-caught-1285273/","category":"fun","categoryLabel":"Interesting Reads","wordCount":620,"readingTime":4,"content":"<p>Some science is borne out of genuine curiosity, some comes from the desire to meet a pressing need, and some comes from goofing off with your coworkers. A new study <a href=\"http://dx.doi.org/10.1002/ecy.70471\" target=\"_blank\" rel=\"noopener\">published</a> in the journal <em>Ecology</em> is the latter.  </p><p>Featured Video</p><p>Caitlin Bloomer, an environmental scientist at the University of Illinois Urbana-Champaign, found a crayfish so huge, she felt like it might be a record-setter. “I thought, ‘There’s no doubt I have caught the biggest crayfish anyone’s ever seen!’” she said in a <a href=\"https://aces.illinois.edu/news/biologists-compete-over-north-americas-largest-crayfish\" target=\"_blank\" rel=\"noopener\">statement</a>. “I brought it back to campus to show my colleague, naturally bragging about having caught the biggest-ever crayfish. But, as all biologists and sport fisherman do, he took one look and said, ‘No way, I’ve caught bigger.’” </p><p><strong>Read more: “</strong><a href=\"https://nautil.us/when-pigs-fly-crayfish-whistle-and-it-snows-red-snowflakes-234513\" target=\"_blank\" rel=\"noopener\"><strong>When Pigs Fly, Crayfish Whistle, and It Snows Red Snowflakes</strong></a><strong>”</strong></p><p>And that’s how the quest to find the largest crayfish in North America started. Bloomer’s crayfish was a member of the species <em>Lacunicambarus chimera</em>, commonly known as the crawzilla crawdad, and measured 77.5 millimeters from the tip of its head to the bottom of its thorax (just a hair over three inches). To find out how it stacked up, Bloomer and her colleagues asked museum curators and fellow scientists to measure their biggest specimens and send the numbers in.</p><p>They found around 20 specimens in contention for the beefiest crawdad on the continent, but Bloomer’s didn’t earn the top spot. “Mine wasn’t the biggest, but it did make the top 20, so I’m super proud of it,” Bloomer said. “And it was also the only burrowing crayfish to make the list, so I’ll take the win.” </p><p>Instead, the crown went to a Tennessee bottlebrush crayfish housed at West Virginia’s West Liberty University that measured a whopping 86.6 millimeters (around three and a half inches). </p><p>Of course, scientific journals don’t just publish the results of fishing competitions, the team also used the dataset to conduct some sophisticated analyses. They discovered that in general, 80 millimeters seems to represent the upper limit of how large North American crayfish can get. This struck them as a little odd considering they never stop growing over the course of their lives.</p><p>To investigate further, they looked at what factors might be holding these freshwater decapods under that 80 millimeter ceiling. They started by considering Bergmann’s rule, which states that animals within a certain group tend to grow larger in colder environments. Some of their largest specimens came from warm southern ecosystems, so that explanation seemed unlikely. Next, they moved on to Cope’s rule, the idea that animals grow larger over evolutionary time. Unfortunately, large specimens came from both early and late-branching lineages, so no luck there. They also ruled out oxygen availability as a factor, as the biggest specimens were from both free-swimming and burrowing species. </p><p>So what keeps North American crayfish from becoming the <em>kaiju</em> of the creeks? </p><p>According to the team, it’s possible there are physiological constraints restricting growth. Activities like walking and burrowing may become more difficult at larger sizes. Furthermore, crayfish need to molt to grow larger. After ditching their old shells, they’re left sporting thin, fragile shells for a period. </p><p>But the researchers say there’s likely more to the story. Other ecological factors like predation and competition could play a role. They also note that while 80 millimeters seems to be the North American size limit, there are larger crayfish in the Southern Hemisphere. The worldwide heavyweight champion is the Tasmanian giant freshwater crayfish, which can grow to be an eye-popping 120 millimeters (over four and a half inches).</p><p>There’s always a bigger (cray)fish in the pond. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Caitlin Bloomer, University of Illinois Urbana-Champaign</em></p>"},{"title":"An OpenAI Agent Hacked Australia’s Health Service. Their Government Found Out Months Later","source":"Wired","author":"@wired","url":"https://www.wired.com/story/openai-agent-hacked-australias-health-service-their-government-found-out-months-later/","category":"tech","categoryLabel":"Technology","wordCount":539,"readingTime":3,"content":"<p>Australia is investigating whether OpenAI broke the law after <a href=\"https://www.wired.com/story/security-news-this-week-openai-agents-hacked-another-website/\" target=\"_blank\" rel=\"noopener\">an agent hacked</a> into its health statistics portal in the first widely known incident of an AI agent hacking a government website.</p><p>The Australian government is reviewing whether it should involve the federal police after the agent accessed non-public files from the social and health services agency, Services Australia, in June.</p><p>Australia only found out about the incident when <a href=\"https://www.wired.com/tag/openai/\" target=\"_blank\" rel=\"noopener\">OpenAI</a> alerted the government on September 10—almost three months after the hack—by sending an email to a public mailbox. <a href=\"https://www.wired.com/tag/sam-altman/\" target=\"_blank\" rel=\"noopener\">Sam Altman</a> had reportedly not mentioned the incident when he met Australia’s deputy prime minister, Richard Marles, earlier this month, even though OpenAI had been aware since August. The company took “way too long” and the notification should not have just gone through a public inbox, Prime Minister Anthony Albanese said in a press conference in New York on Wednesday. There will also be an inquiry into why Services Australia then took five days to escalate the email to Australia’s Cyber Security Centre.</p><p>OpenAI’s agent had been conducting internet based research into health statistics in a development project by an internal OpenAI research team. When it could not access certain information, the agent attempted alternative ways until it found a work around and gained unauthorized access. It also wrote files to the internal server, which the government is waiting on OpenAI for more technical information on. The government is also investigating whether the agent gained unauthorised access to three additional government websites it interacted with.</p><p>“There will obviously be legal consequences on it,” Albanese said as he disclosed the “unacceptable” incident. He said he had spoken with Altman over the phone earlier that day about his “extreme concern” about the incident and “disappointment” with the nature and length of time the company took to inform the government. While Albanese did not answer whether he had apologised, Altman “clearly accepted that the company had not done good enough,” he said.</p><p>The Australian government currently believes no one’s personal data was accessed, though investigations are ongoing. The website in question is a public-facing statistics portal that contains non-sensitive Medicare information relating to data and statistics such as spending. It was therefore behind much lower levels of security than personal data would have been, Marles said in Sydney. “The impact of the incident is actually relatively minor, but this is a serious incident, obviously, and one that is completely unacceptable,” he cautioned.</p><p>A number of incidents over the summer, including <a href=\"https://www.wired.com/story/openais-hugging-face-hack-debrief-raises-more-questions-than-it-answers/\" target=\"_blank\" rel=\"noopener\">OpenAI agents’ hacking of HuggingFace</a>—highlighting the threat of frontier model agents acting rogue—were raised at the <a href=\"https://www.wired.com/tag/united-nations/\" target=\"_blank\" rel=\"noopener\">United Nations General Assembly</a> this week, with Secretary General António Guterres welcoming calls to control AI. Altman himself had warned the United Nations Security Council earlier on Wednesday about his concern that humans could lose control of these systems.</p><p>“It was a shock that it occurred, because it was real and serious,” Albanese said about the incident. “But it also, I think, was something that had been predicted, including by the AI companies themselves.”</p><p>Australia is establishing a task force to look at the incident and emerging AI cyber threats. It will consider possible law enforcement and legislative responses to ensure that incidents like this don’t happen again.</p>"}];
