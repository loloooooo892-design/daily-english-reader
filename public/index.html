<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"I'm not saying Bethesda are trolling me specifically, but Fallout 4 and Skyrim updates are imminent just as I've modded up the latter for the first time in ages","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/fallout-4-and-skyrim-updates-are-imminent-just-as-ive-modded-up-the-latter-for-the-first-time-in-ages","category":"gaming","categoryLabel":"Gaming","wordCount":565,"readingTime":3,"content":"<p>How have I wronged you Todd?</p>\n    \n  \n  \n  \n  \n            <p>Right, just a couple more location overhauls and there we go. A fresh <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-v-skyrim\" target=\"_blank\" rel=\"noopener\">Skyrim</a> load order created for my first modded toe-dip into Tamriel for quite a while, outside of grabbing the odd article image. Phew, now to relax and sink another 50 hou-wait. <a href=\"https://www.rockpapershotgun.com/games/fallout-4\" target=\"_blank\" rel=\"noopener\">Fallout 4</a> and Skyrim updates are inbound, say Bethesda? Well, that would be my luck, wouldn't it?</p>\n<p>On the evening of August 14th, <strong>a Friday evening no less</strong>, two proclamations were made. Don't do anything stupid and start a wildfire, the <a href=\"https://www.bbc.co.uk/news/articles/cwy4zepzp7eo\" target=\"_blank\" rel=\"noopener\">UK government trumpeted</a> through the entire population's phones. Not long afterwards, Bethesda issued their own alert. Fallout 4 and Skyrim patches incoming, check your load orders. 'Ah, poo', I said, putting aside the twigs with which I'd been building a large bonfire near dense shrubbery.</p>\n<p>The Fallout 4 update's due first, arriving on August 18th and \"focusing on general Creations improvements\". The Skyrim update's just coming soon for now, with Bethesda promising more info once they've ironed out the details. \"As a precaution, prior to these updates we encourage players to log into your game save if you haven’t done so in a while or manually save your load order,\" the studio wrote. \"Once your load order is saved, you’ll be able to re-download your entire Creations list at once when the update is live.\"</p> \n<blockquote><p>On Tuesday, August 18th, a patch will be coming to Fallout 4 focusing on general Creations improvements.</p><p>As a precaution, prior to these updates we encourage players to log into your game save if you haven’t done so in a while or manually save your load order. Once your load… <a href=\"https://t.co/RpZtkHEKqk\" target=\"_blank\" rel=\"noopener\">pic.twitter.com/RpZtkHEKqk</a></p>— Bethesda Game Studios (@BethesdaStudios) <a href=\"https://x.com/BethesdaStudios/status/2088350191699071042?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">August 14, 2026</a></blockquote>\n\n<p>Cue many folks getting immediate flashbacks to <a href=\"https://www.rockpapershotgun.com/ditch-any-fallout-4-mods-which-mess-with-the-main-menu-ahead-of-its-anniversary-edition-update-bethesda-warn\" target=\"_blank\" rel=\"noopener\">Fallout 4's anniversary update</a> and the <a href=\"https://www.rockpapershotgun.com/game-sized-fallout-4-mod-fallout-london-has-been-delayed-indefinitely-by-bethesdas-incoming-next-gen-update\" target=\"_blank\" rel=\"noopener\">fun its next-gen update caused</a> right before massive mod <a href=\"https://www.rockpapershotgun.com/games/fallout-london\" target=\"_blank\" rel=\"noopener\">Fallout: London</a> arrived.</p>\n<p>One would hope - and I say that fully prepared to be wrong - that things won't be anywhere near as bad this time around. These creation-focused updates seem pretty small, and as veteran Fallout 4 modder Thomas 'Otellino' Mitchell was <a href=\"https://x.com/Otellino/status/2088678214436585554\" target=\"_blank\" rel=\"noopener\">quick to point out</a> on whatever you call Twitter these days, mods which rely on script extenders are likely the ones that'll need updating. That's still a headache, given it covers the likes of mods which add new animations and interface overhauls like load order staple <a href=\"https://www.nexusmods.com/skyrim/mods/3863\" target=\"_blank\" rel=\"noopener\">SkyUI</a>.</p><p>That said, the script extenders such mods rely on tend to be <a href=\"https://www.rockpapershotgun.com/fallout-4s-script-extender-has-already-gotten-its-anniversary-update-as-bethesda-battle-creation-issues\" target=\"_blank\" rel=\"noopener\">updated pretty quickly</a> following the arrival of a new game version, leaving folks only waiting for specific mods to be updated. That shouldn't take too long either, depending on when modders get time, unless you're running a mod (typically an older one) that's been abandoned by its creator. In such cases, you might have to go without that particular mod.</p>\n<p>You can, of course, also stop your game from updating to the latest version automatically. Thanks to all those Fallout 4 updates, guides on how to do it for that game specifically are easy to find, such as this one from <a href=\"https://forums.nexusmods.com/topic/13480381-how-to-stop-fallout-4-from-updating-steamgogxbox/\" target=\"_blank\" rel=\"noopener\">Nexus Mods</a>. Personally, I'll just leave Skyrim alone for a few days after the update, then check in to see which of my mods have already been updated themselves.</p>\n<p>Meanwhile, if you're taking part in the ongoing <a href=\"https://www.rockpapershotgun.com/theres-never-been-an-easier-time-to-boycott-microsoft-the-most-boring-video-game-publisher-in-the-business\" target=\"_blank\" rel=\"noopener\">boycott of Microsoft-owned games</a>, you don't have to worry about any of this.</p>"},{"title":"The Great Romance Slump","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/08/14/romance-dating-decline/","category":"fun","categoryLabel":"Interesting Reads","wordCount":509,"readingTime":3,"content":"<p>I used to be in a friend group chat called “Tinder Spinsters,” a group of girls offering support as we navigated the tumultuous dating world. Faith Hill’s chat is named “Lonely Hearts Club,” but are these groups becoming a thing of the past? Are people even still trying? In a 2025 YouGov poll, 69 percent of single respondents said they “rarely” or “never” go on dates. Nowadays, it’s complicated. On the positive side, a relationship is no longer seen as essential for a happy life—women’s interest in men, in particular, has dimmed as their financial independence has grown. But many people would still love to find a partner; they are just finding that modern romance requires a toll “paid in energy, in sanity, in cash, in hours—and not everyone can afford it.”</p>\n<blockquote>\n<p>The hug was the last round, though, and then real life resumed. We mingled, but the intimacy had disappeared. One man told me that he had high emotional intelligence and could tell that I did too—then he suggested that we travel together someday, handed me his business card, and walked away. I gave a few people my phone number, including one man who sent me a picture of his face the very next morning and another who texted me so much (even after a polite rebuff) that I had to block him. One date with another guy resulted, but I wasn’t interested in a second. The perception of abundance had, once again, evaporated into nothing.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on dating \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/11/04/dating-alt-right-conservative-men/\" target=\"_blank\" rel=\"noopener\">‘America is More Divided Than Ever — But How is it Affecting Our Love Lives? I Spent a Year Dating Conservative Men to Find Out’</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tVera Papisova | Cosmopolitan | 27 February, 2025 | 3,786 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“There’s no question that we’re living — and looking for love — in contentious times, where extreme political ideologies have all but divided parts of the dating pool.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/10/14/getting-the-spark-back/\" target=\"_blank\" rel=\"noopener\">Getting the Spark Back</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMagdalene Taylor / Slate / October 12, 2024 / 2,688 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Dating apps destroyed in-person romance. Now they’re trying to revive it.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/07/19/hush-hush-affair/\" target=\"_blank\" rel=\"noopener\">Hush-Hush Affair</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tReeves Weideman | New York | July 1, 2024 | 7,901 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“How the NDA became the defining legal document of our time.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/01/05/did-i-tell-you-about-david/\" target=\"_blank\" rel=\"noopener\">Did I Tell You About David?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDesiree Browne | Midnight &amp; Indigo | January 5, 2023 | 3,976 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“I didn’t know what he was looking for, but what he saw kept him focused on me in a way I wasn’t sure could or should exist.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2019/12/11/this-is-small-talk-purgatory-what-tinder-taught-me-about-love/\" target=\"_blank\" rel=\"noopener\">‘This Is Small Talk Purgatory’: What Tinder Taught Me About Love</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tC.J. Hauser | The Guardian | December 7, 2019 | 3,408 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>Just when she is about to give up on finding real human connection on a dating app, C.J. Hauser meets a mate — who stays in her life for a while.</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2019/10/02/darkness-on-the-edge-of-cougartown/\" target=\"_blank\" rel=\"noopener\">Darkness on the Edge of Cougartown</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSarah Miller | The Cut | October 1, 2019 | 2,235 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>On the brink of 50, Sarah Miller makes peace with being 10 years older than her boyfriend, and stops wasting time wishing she were younger.</p>"},{"title":"AI companies destroy physical books — let’s scan rare books before it’s too late","source":"Hacker News Best","author":"","url":"https://annas-archive.gl/blog/physical-destruction.html","category":"tech","categoryLabel":"Technology","wordCount":641,"readingTime":4,"content":"<p>\n    annas-archive.gl/blog, 2026-08-05\n  </p>\n  <p>A guest post by Anna’s Archive volunteer “u” (translated from Chinese).</p>\n  <p><em><strong>TL;DR:</strong> AI companies are secretly buying, scanning, and destroying millions of physical books to train their models, permanently locking human knowledge inside private corporate servers. Anna’s Archive is urgently calling on volunteers worldwide to scan and upload books before this cultural heritage disappears forever.</em></p>\n  <p>Several AI companies are acquiring large quantities of secondhand books through intermediaries, scanning and destroying them, all to obtain training data “untouched by machines” from before 2022.</p>\n  <p>Anthropic’s “Project Panama” was exposed in a $1.5 billion copyright settlement. In early 2024, they launched this highly confidential project. The company has spent tens of millions of dollars purchasing millions of paper books, scanning them, training its Claude LLM, and then destroying them all. It’s outrageous is that it’s legally permissible, but ethically, it’s an extremely serious crime against humanity.</p>\n  <p>So why destroy physical books? Behind it lies the AI race and the interests of capital:</p>\n  <ol>\n    <li>It prevents these books from being scanned and used for training by competitors.</li>\n    <li>It avoids legal risks.</li>\n    <li>Destroying books is cheaper than lossless scanning.</li>\n  </ol>\n  <p>After AI companies massively scan and destroy physical books, they become the only ones in the world with digital copies. <strong>Knowledge is permanently monopolized on private servers.</strong></p>\n  <p>This battle for old books reveals a paradox: while promising to “make human knowledge accessible,” AI companies are dismantling the most solid carriers of human knowledge. The public may gain more intelligent AI assistants, but at the cost of a vast amount of knowledge resources disappearing from the public domain.</p>\n  <h3>Shadow libraries</h3>\n  <p>As the world’s largest shadow library, Anna’s Archive needs a plan to combat the destruction of physical books by AI companies. After all, the emergence of shadow libraries is the greatest miracle of knowledge sharing in the 21st century. Along with other shadow libraries, we’re building a digital library of Alexandria, an inextinguishable light of humanity.</p>\n  <p>We need the help of volunteers worldwide to scan materials (including books, journal articles, newspapers, magazines, ancient books, rare books, and other materials) from every library and archive around the world and upload them to the shadow library for knowledge preservation, especially those that are easily lost. <strong>If every person scans a book, and there are 10 million volunteers worldwide, we can obtain 10 million pieces of invaluable wealth.</strong></p>\n  <ul>\n    <li>For small scans and uploads, we usually award recognition and lifetime membership to Anna’s Archive.</li>\n    <li>For large-scale scans and uploads of books, we can help pay for the scanning fees and other rewards.</li>\n  </ul>\n  <h3>Time is running out</h3>\n  <p>Since the beginning of 2025, AI-generated content has accounted for more than half of newly published internet content. A frightening reality emerges: if much of the future content consists of AI-generated books and papers, will humans be able to distinguish them? Once AI has absorbed even the last sentence written by humans on paper, all that will remain on the internet will be AI’s own words. In such a world, how can human civilization be preserved?</p>\n  <p>Shadow libraries offer the best answer. If you want the memory of human civilization to no longer be monopolized, if you want future generations to be able to read all of humanity’s wealth for free, if you don’t want publishers making a fortune while authors receive little, then please help us. Please make any contribution you can, whether it’s scanning and uploading books, purchasing books and papers to scan and upload, or donating. With the efforts of all humanity, the monopoly on knowledge will be broken. Each of us can make history.</p>\n  <p>This is a race against time. Our ideal is to scan and upload all the world’s publications before publishers completely block knowledge, and before AI companies scan and destroy all the world’s books and papers.</p>\n  <p>- Anna’s Archive volunteer “u”</p>\n  <p>\n    <em>Relevant tickets for more information: <a href=\"https://software.annas-archive.gl/AnnaArchivist/annas-archive/-/work_items/223\" target=\"_blank\" rel=\"noopener\">#223</a> <a href=\"https://software.annas-archive.gl/AnnaArchivist/annas-archive/-/work_items/187\" target=\"_blank\" rel=\"noopener\">#187</a></em>\n  </p>"},{"title":"Florida Republicans bring Census Bureau challenge to the Supreme Court","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/08/florida-republicans-bring-census-bureau-challenge-to-the-supreme-court/","category":"law","categoryLabel":"Law","wordCount":699,"readingTime":4,"content":"<p>A group of Florida Republicans has <a href=\"https://www.scotusblog.com/cases/university-of-south-florida-college-republicans-v-lutnick/\" target=\"_blank\" rel=\"noopener\">appealed</a> a ruling by a federal court in that state throwing out a lawsuit seeking to require the U.S. Census Bureau to revise its data for the 2020 census. <a href=\"https://www.supremecourt.gov/DocketPDF/26/26-205/418274/20260818151615949_Jurisdictional%20Statement.pdf\" target=\"_blank\" rel=\"noopener\">Arguing</a> that the statistical methods the Census Bureau used in the 2020 census led to inaccurate results, the challengers told the justices that, “[w]ith each decade the census strays further from” the “‘actual Enumeration’” required by the U.S. Constitution, “and statistical adjustment opens the door to political tampering. If no plaintiff can reach the merits,” they argued, “that drift is permanent and unreviewable.”</p><p>The census takes place every 10 years, and the Constitution instructs that it must be “calculated by ‘actual Enumeration.’” A federal law enacted in 1997, known as <a href=\"https://opencasebook.org/casebooks/2606-law-and-algorithms/resources/3.3-pub-l-105119-title-ii-209-nov-26-1997/\" target=\"_blank\" rel=\"noopener\">Section 209</a>, allows anyone “aggrieved by the use of any statistical method in violation of the Constitution or any provision of law ... in connection with” the census to file a lawsuit seeking “declaratory, injunctive, and any other appropriate relief against the use of such method.”</p><p>Because of the COVID-19 pandemic, the Census Bureau relied in part on statistical imputation – using statistics such as administrative records or data for nearby households to predict what missing data would be – instead of direct contact to count people for the 2020 census. A 2022 survey conducted by the bureau suggested that it had undercounted Florida’s population by 3.48%.</p><p>The challengers – which include the University of South Florida College Republicans and U.S. Rep. Byron Donalds, who on Tuesday became the state’s Republican nominee for governor – filed a lawsuit in federal court in which they alleged (among other things) that the bureau’s statistical methods violated the Constitution and cost the state an additional seat in the U.S. House of Representatives.</p><p>A three-judge district court (which Congress designated to hear claims under Section 209) <a href=\"https://cdn.sanity.io/files/pito4za5/production/f2cd0dc34ed46c0d7ad93f1f357f377343a60b8a.pdf#page=51\" target=\"_blank\" rel=\"noopener\">dismissed</a> the group’s claims. The majority first ruled that the challengers did not have a legal right to sue, known as standing. They had not “plausibly allege[d]” that the Census Bureau’s statistical methods actually caused the undercount in Florida in 2020, the majority wrote. And even if the challengers were to prevail, the majority continued, the remedy that they are seeking – “to find and directly contact 18.8 million people whom the Bureau could not find in 2020 and who may live in different places now” – “seems exceedingly impracticable, if not impossible.” This is particularly true, the majority concluded, when the challengers’ lawsuit comes “nearly five years” after the 2020 census, a period during which there has been “substantial changes” in the make-up of Congress “following two federal elections and ongoing nationwide redistricting.”</p><p>The challengers’ lawsuit cannot go forward for the separate reason, the majority added, that it came too late: Federal law establishes a blanket four-year statute of limitations for lawsuits “arising under an Act of Congress enacted after [1990].”</p><p>The challengers appealed to the Supreme Court on Aug. 6 (in a brief that was apparently docketed on Aug. 18). On the question whether they have a right to sue, they pointed to <a href=\"https://supreme.justia.com/cases/federal/us/536/452/\" target=\"_blank\" rel=\"noopener\"><em>Utah v. Evans</em></a>, a 2002 case in which the Supreme Court ruled (among other things) that Utah could pursue its challenge to a statistical method used by the Census Bureau in the 2000 census. “Evans,” they wrote, “is on all fours with this case.” For example, they said, their case “also seeks an injunction requiring recalculation and recertification by the Bureau. And there is a reasonable likelihood that a new count would, as a practical matter, lead to a more favorable apportionment of Representatives to Florida.”</p><p>They also argued that their case is governed by the six-year statute of limitations for lawsuits “against the United States.” They emphasized that the law creating the general four-year statute of limitations specifies that it applies unless “otherwise provided by law.” If Congress wanted to exempt lawsuits like this one from the six-year statute of limitations, they said, it could have done so explicitly – but did not.</p><p>The Census Bureau’s response is due on Sept. 17.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Florida Republicans bring Census Bureau challenge to the Supreme Court</em>, SCOTUSblog (Aug. 19, 2026, 1:21 PM), https://www.scotusblog.com/2026/08/florida-republicans-bring-census-bureau-challenge-to-the-supreme-court/</p>"}];

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';

  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);

  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {

}
