*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

  padding: 0 1.25rem;

.container {
  max-width: 38em;

  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {

  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {

  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

.archive-link a {
  color: var(--accent);
  text-decoration: none;

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {

  .container { padding: 2rem 0 3rem; }

<script>
var articles = [{"title":"Some Realism About Constitutional Remedies Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/","category":"law","categoryLabel":"Law","wordCount":1143,"readingTime":6,"content":"<h2>Introduction</h2>\n<p>The Supreme Court has wavered between two approaches to questions of executive power, which are often labeled institutional formalism and realism.  Formalism treats an institution like the presidency as a “black box” to which the Constitution assigns certain powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  In <em>Trump v. Hawaii</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a> for example, the Supreme Court upheld President Trump’s infamous travel ban<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> by focusing not on the “particular President”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> and his past call for a “complete shutdown of Muslims entering the United States,”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> but rather on “the authority of the Presidency itself.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a>  That is the language of institutional formalism.</p>\n<p>Realism, on the other hand, peers into the “black box,” taking account of how an institution actually works and who actually populates it before defining its powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  At times, the Roberts Court has shown glimmers of a more realist orientation.  In <em>Department of Commerce v. New York</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a> for instance, the Court discredited the Trump Administration’s explanation for why it added a citizenship question to the census by noting that “we are ‘not required to exhibit a naiveté from which ordinary citizens are free.’”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  That is the language of institutional realism.</p>\n<p>One can appreciate the allure of both approaches.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  On the one hand, formalism may feel credulous and impotent in the face of presidential misconduct.  On the other hand, the Court must craft rules of presidential power that will apply long after the incumbent administration has departed.  Wherever one stands on this jurisprudential debate about presidential power, though, we argue in this Essay that a dose of realism is entirely appropriate when it comes to crafting <em>remedies</em> for the executive branch.  Remedies, after all, necessarily straddle “the ideal and the real.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-11\" target=\"_blank\" rel=\"noopener\">11</a>  They aim to effectuate constitutional values in the world as it is.  To achieve that aim, constitutional remedies should take account of the nature and propensities of the administration to which they will be addressed.</p>\n<p>The Essay has three Parts.  In the first Part, we explain why it is generally important to the rule of law that the executive branch “self-apply” legal limits without the involvement of the courts.  We then canvass the evidence that the current President and his Administration lack an ethos of self-application.  Part II explores two remedial questions now vexing the federal courts.  First, the Administration has canceled grants to a broad array of recipients in plain violation of governing statutes and prior obligations of funds.  Second, the Administration has purported to remove numerous officials from independent agencies in violation of statutory removal protections.  In the ensuing challenges to these aggressive actions, the federal courts have faced a choice of remedy: whether an injured party may seek an injunction in district court to undo or to end the unlawful action, or must instead pursue a damages remedy for lost funds or backpay in the Court of Federal Claims (CFC).  We argue that injunctive relief or its functional equivalent in a district court is available in both contexts under existing statutes and precedents.</p>\n<p>Putting the first two Parts together, Part III argues that equitable remedies must be available today to make up for a lack of “self-application” by executive officials.  Monetary remedies alone are inadequate to constrain an executive branch populated by Holmesian “bad” men — that is, people who view the “law” only as a prediction of what a court will force them to do and who do not heed “the vaguer sanctions of conscience.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-12\" target=\"_blank\" rel=\"noopener\">12</a>  A “bad man” Executive facing only damages could achieve all its aims even if the courts ultimately adjudicate its actions to be illegal.</p>\n<p>Enter equity.  Two of the traditional functions of equity are to step in when legal remedies are inadequate and to prevent opportunism.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-13\" target=\"_blank\" rel=\"noopener\">13</a>  If </p>\n<p>an equitable remedy cannot make bad actors good in fact, it can at least force them to abide by a better standard.  In practical terms, “generally equity will order to be done that which ought to have been done.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-14\" target=\"_blank\" rel=\"noopener\">14</a>  That should be the courts’ remedial lodestar when confronted with a bad man.  An injunction, of course, does not need to be <em>issued</em> in every case, but it should at least be <em>available</em> in accord with traditional equitable principles, both as an external check on the Executive and to fortify any voices within the Executive calling for restraint.</p>\n<p>In the end, the adequacy of certain judicial remedies to uphold the rule of law depends on a culture of legality within the executive branch.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-15\" target=\"_blank\" rel=\"noopener\">15</a>  When officials are not committed to that culture, more robust equitable remedies are needed to protect the underlying constitutional principles at issue.  And courts today should indulge some realism about the nature of the current Administration when crafting remedies to keep it within legal bounds.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1834.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Pildes, <em>Institutional Formalism and Realism in Constitutional and Public Law</em>, 2013 Sup. Ct. Rev. 1, 2 (2014).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> 138 S. Ct. 2392 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2418; <em>see</em> <em>id.</em> at 2418–20.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> Pildes, <em>supra</em> note 1, at 2.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> 139 S. Ct. 2551 (2019).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2575 (quoting United States v. Stanchich, 550 F.2d 1294, 1300 (2d Cir. 1977) (Friendly, J.)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> Despite the overlapping terminology, the debate between institutional realism and institutional formalism is analytically distinct from the debate between functionalism and formalism in the separation of powers context.  Pildes, <em>supra</em> note 1, at 21 n.52; <em>see </em>John F. Manning, <em>Separation of Powers as Ordinary Interpretation</em>, 124 Harv. L. Rev. 1939, 1942–44 (2011) (distinguishing functionalism from formalism).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">^</a> Paul Gewirtz, <em>Remedies and Resistance</em>, 92 Yale L.J. 585, 587 (1983).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">^</a> O.W. Holmes, <em>The Path of the Law</em>, 10 Harv. L. Rev. 457, 459 (1897).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Henry E. Smith, <em>Equity as Meta-Law</em>, 130 Yale L.J. 1050, 1076–77 (2021).  As Lord Millett once put it, “equity adopts . . . the ‘good man’ theory of law.”  Peter Millett, <em>Bribes and Secret Commissions</em>, 1 Restitution L. Rev. 7, 20 (1993).  (We thank Sam Bray for this apt reference.)  Indeed, Justice Holmes himself was careful to carve out equity from his “bad man” theory of law.  Holmes, <em>supra</em> note 12, at 462–63.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">^</a> Henry L. McClintock, Handbook of the Principles of Equity § 24, at 53 (2d ed. 1948).  This is often the practical upshot of the familiar “maxim that equity regards that as done which ought to be done.”  <em>Id.</em>\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">^</a> <em>See </em>Nicholas R. Parrillo, <em>The Endgame of Administrative Law: Governmental Disobedience and the Judicial Contempt Power</em>, 131 Harv. L. Rev. 685, 697 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"Data centers were some of the biggest losers in last night's US midterm elections","source":"PC Gamer","author":"Lincoln Carpenter","url":"https://www.pcgamer.com/gaming-industry/data-centers-were-some-of-the-biggest-losers-in-last-nights-us-midterm-elections/","category":"gaming","categoryLabel":"Gaming","wordCount":618,"readingTime":4,"content":"<p>On Tuesday, tens of millions of Americans voted in midterm elections to deliver <a href=\"https://apnews.com/article/midterm-election-house-senate-democrats-republicans-trump-f126e12e05b579a327b98481c0ae2226\" target=\"_blank\" rel=\"noopener\">a sweep of generational Democratic victories</a> in federal and state races, reflecting a leftward electoral shift that's being interpreted as a nationwide rejection of Trumpism.</p><p>But even as Republican candidates and incumbents suffered defeats in what had traditionally been considered some of the party's most entrenched strongholds, the midterms also issued a stinging rebuke to another major source of voter frustration: Data centers. At nearly every opportunity, Americans voted in favor of local ballot measures to halt, slow, or stymie the pace of data center construction in their communities.</p><p>As tracked by <a href=\"http://datacentersontheballot.com/\" target=\"_blank\" rel=\"noopener\">Data Centers on the Ballot</a>, across the 47 local midterm elections in the American cities and townships that featured ballot measures on data center construction, voters favored restrictions on the rate of data center expansion in 38 of the 39 completed counts. Of the eight races that remain open, voters supporting additional data center restrictions are leading in all six of the races with only partial reporting. For the two remaining races, no results have yet been posted.</p><p>Here's the rundown of the types of measures voters are supporting:</p><ul><li>In ten of the closed races, <strong>voters approved adding megawatt caps</strong> for data center projects to their city or town charters. Typically, those towns selected 25 MW caps; for comparison, a planned OpenAI facility in Effingham County, Georgia is <a href=\"https://finance.yahoo.com/technology/ai/articles/openai-wants-rebrand-ai-data-234832494.html\" target=\"_blank\" rel=\"noopener\">expected to demand 3,200 MW</a>. Voters in favor of megawatt caps are leading in two partial counts.</li><li>Ten of the elections included <strong>non-binding advisory questions</strong> posed by village councils and town electors, asking whether voters thought their towns should permit or restrict data center development. In nine closed races, voters voted in favor of restriction; pro-restriction voters are leading in the remaining partial count.</li><li>In seven closed races, voters <strong>rejected rezoning measures</strong> that would permit the construction of data center sites, and voters opposing a similar rezoning decision are leading in another partial count.</li><li>Voters in five races <strong>approved outright bans on new data center constructions</strong>, and a similar ban is leading in one race with partial reporting. In two other races, measures that would require voter approval before new data center construction can progress have either passed or are leading.</li><li>In six other completed races, voters opted for other data center restrictions, like temporary moratoriums and additional conditions on data center tax benefits.</li></ul><p>At time of writing, <em>only one ballot measure</em> that would have introduced data center restrictions failed: In Harwood, North Dakota, voters refused an amendment to the city charter that would have required Harwood to commission an independent review before approving new data center construction or expansion.</p><p>Aside from that one exception, it's not hard to suss out why so many of those measures have passed. <a href=\"https://www.nbcnews.com/politics/2026-elections/exit-polls\" target=\"_blank\" rel=\"noopener\">NBC exit polls</a> show that 56% of yesterday's midterm voters considered AI data centers either \"crucial\" or \"a major factor\" in their choice of Congress person, with data center opponents driven by concerns of environmental toll, energy costs, noise pollution, and—one must imagine—the upward-spiraling cost of RAM.</p><p>From the creators of Edge: A free weekly videogame industry newsletter, featuring in-depth news, expert analysis and exclusive interviews</p>\n\n<p>Lincoln has been writing about games for 12 years—unless you include the essays about procedural storytelling in Dwarf Fortress he convinced his college professors to accept. Leveraging the brainworms from a youth spent in World of Warcraft to write for sites like Waypoint, Polygon, and Fanbyte, Lincoln spent three years freelancing for PC Gamer before joining on as a full-time News Writer in 2024, bringing an expertise in Caves of Qud bird diplomacy, getting sons killed in Crusader Kings, and hitting dinosaurs with hammers in Monster Hunter.</p>"},{"title":"DuckDuckGo pitches itself to schools amid backlash over Google’s AI policy","source":"TechCrunch","author":"Sarah Perez","url":"https://techcrunch.com/2026/11/04/duckduckgo-pitches-itself-to-schools-amid-backlash-over-googles-ai-policy/","category":"tech","categoryLabel":"Technology","wordCount":552,"readingTime":3,"content":"<p><a href=\"https://duckduckgo.com/\" target=\"_blank\" rel=\"noopener\">DuckDuckGo</a> is pitching itself to schools after Google created an opening for the alternative search engine. On Tuesday, Google told schools they could <a href=\"https://techcrunch.com/2026/11/04/google-faces-backlash-for-plan-that-would-turn-off-search-for-schools-that-restrict-ai/\" target=\"_blank\" rel=\"noopener\">turn off Gemini</a>, but it said shutting off its other AI features would <a href=\"https://techcrunch.com/2026/11/03/google-will-let-schools-disable-its-ai-tools-but-not-without-sacrificing-search/\" target=\"_blank\" rel=\"noopener\">cost schools Google Search</a>, as well.</p>\n<p>DuckDuckGo, a company that focuses on user privacy by limiting data collection, clearly sees this as a moment to make inroads in education, where Google has historically dominated. According to figures Google has published in previous years, there are <a href=\"https://blog.google/products-and-platforms/products/education/google-chromebook-feature-update-september-2024/\" target=\"_blank\" rel=\"noopener\">around 50 million Chromebooks</a> in schools, used by students and educators, and its Google Classroom platform serves <a href=\"https://blog.google/products-and-platforms/products/education/google-classroom-anniversary-teachers/\" target=\"_blank\" rel=\"noopener\">over 150 million users</a> globally.</p>\n<p><a href=\"https://x.com/yegg/status/2117677325836075093\" target=\"_blank\" rel=\"noopener\">On X</a>, DuckDuckGo’s founder and CEO, Gabriel Weinberg, pointed to the company’s <a href=\"https://start.duckduckgo.com/duckduckgo-help-pages/get-duckduckgo/deploy-duckduckgo\" target=\"_blank\" rel=\"noopener\">online documentation</a>, explaining how schools can switch their default search engine to DuckDuckGo’s service instead, adding, “get in touch for help.”</p>\n<p>Meanwhile, DuckDuckGo’s chief public affairs officer, Kamyl Bazbaz, issued a stronger statement, <a href=\"https://x.com/KamylBazbaz/status/2117654067090735473\" target=\"_blank\" rel=\"noopener\">writing</a>, “Forcing AI on school children: how a monopolist behaves when they think people are powerless. Prove Google wrong.”</p>\n\n<p>In an email to TechCrunch, DuckDuckGo chastised Google for its decision, adding that Google could easily turn off Search’s AI features for schools if it wanted to. </p>\n<p>The company’s comments come as the American public is weighing how much AI they want to allow into their lives. As Tuesday night’s elections indicate, they <a href=\"https://www.reuters.com/world/us/trumps-midterm-drubbing-demonstrates-power-data-centre-opponents-2026-11-04/\" target=\"_blank\" rel=\"noopener\">don’t want AI data centers</a> built in their towns. But using AI at work and school has become a common practice and requires a more nuanced discussion.</p>\n<p>Knowing that educators have struggled with AI, Google developed technology called “<a href=\"https://techcrunch.com/2025/08/06/google-takes-on-chatgpts-study-mode-with-new-guided-learning-tool-in-gemini/\" target=\"_blank\" rel=\"noopener\">Guided Learning</a>” that is meant to help kids learn by walking through problem-solving steps rather than just providing them with an answer. But educators are still asking for tools that let them remove AI from the learning process altogether.</p>\n<p>After the backlash on Tuesday, Google <a href=\"https://x.com/NewsFromGoogle/status/2117714815477059722?s=20\" target=\"_blank\" rel=\"noopener\">defended</a> its decision, saying it was just responding to schools’ feedback. It said that Gemini, Gemini Notebook, and Search would be off by default, and schools could choose to enable them individually.</p>\n\n<p>The problem, of course, is that Google Search now heavily uses AI, through AI Overviews and a conversational AI Mode that answers users’ queries.</p>\n<p>DuckDuckGo isn’t anti-AI, to be clear — it offers its own set of AI features, including a chat interface called Duck.ai and an AI search assistant.</p>\n<p>However, unlike Google, it provides options to disable these features in both its search and browser settings, the company says. It also offers a dedicated website, <a href=\"https://noai.duckduckgo.com/\" target=\"_blank\" rel=\"noopener\">noai.duckduckgo.com</a>, where AI-assisted answers, AI-generated images, and AI feature suggestions are all turned off.</p>\n<p>That flexibility may be driving demand for its services, as the company <a href=\"https://techcrunch.com/2026/05/26/duckduckgo-installs-are-up-30-as-users-reject-being-force-fed-googles-ai-search/\" target=\"_blank\" rel=\"noopener\">reported earlier this year</a> that its app installs were up 30% as users rejected being force-fed Google’s AI Search.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n<p>\n\t\tSarah has worked as a reporter for TechCrunch since August 2011. She joined the company after having previously spent over three years at ReadWriteWeb. Prior to her work as a reporter, Sarah worked in I.T. across a number of industries, including banking, retail and software.\n</p><p>You can contact or verify outreach from Sarah by emailing <a href=\"https://techcrunch.com/cdn-cgi/l/email-protection#790a180b181109390d1c1a111a0b0c171a11571a1614\" target=\"_blank\" rel=\"noopener\">[email protected]</a> or via encrypted message at sarahperez.01 on Signal.</p> \t\n<p>\n\t<a href=\"https://techcrunch.com/author/sarah-perez/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"},{"title":"Common Scams to Avoid","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/09/common-scams-to-avoid","category":"fun","categoryLabel":"Interesting Reads","wordCount":696,"readingTime":4,"content":"<p><strong>Fake-Grandpa Scam</strong>The doorbell rings, and a man who claims to be your grandpa is standing there. He says that you invited him to dinner. He’s holding a box of candy. He looks and smells like your grandpa, but something seems “off.” Grab the candy and yell, “Nice try, Gramps!,” and slam the door. If he keeps ringing the doorbell, call the police. Later, you remember that you did invite him to dinner, but, still, it was probably a scam.</p><p><strong>“Bridge Out” Scam</strong>You’re driving along and suddenly there’s a barricade and a “Bridge Out” sign. That’s funny; it wasn’t there before. It looks real—of course it does. Somehow the scammers make money by getting you to turn around and go back. Drive around the barricade.</p><p><strong>Listening Scam</strong>An old friend calls you up and says he wants to meet you for a few beers. You’re leery, but you go. It’s a mistake. He’s getting a divorce, and spends two hours telling you how he doesn’t know what he’s going to do. Is there any way you can get those two hours back? You can try, but you’re probably out of luck.</p><p><strong>Tennis-Ball Scam</strong>You take your dog to the park and get out a tennis ball. Your dog jumps up and down, urging you to throw the ball. Against your better instincts, you throw the ball—and immediately realize you’ve been scammed. Even if the dog brings the ball back, it’s just a setup to scam you again and again. Dogs often prey on old people and single people, because they know they’re lonely. Instead of getting a dog, get a teen-ager, as the teen-ager will not get excited by the ball and doesn’t care if you throw it or not.</p><p><strong>“Help Wanted” Scam</strong>You walk by a sign that says “Help Wanted.” You’re in a good mood, so you walk in and offer to help. But it’s a trick! They want to hire you for a job. The next thing you know you’re mopping the floor and watching the clock for quitting time.</p><p><strong>Pretty-Woman Scam</strong>You meet a woman online. A lot of her words are misspelled, but you let it go. She e-mails a photo of herself, and she looks young and pretty. She offers to meet you at the park for a game of tennis. She asks you to bring a pack of tennis balls. When you show up, it’s not a pretty young woman but your dog! He grabs the tennis balls and runs off.</p><p><strong>Free-Ticket Scam</strong>A friend offers to give you a box-seat ticket to a Yankees game. Somehow he “can’t go.” What’s the catch—how much does it cost? He says there’s no catch, it’s free. Then he ups the allure by saying it’s some sort of championship game. You go to the game, but it’s not a very good game, and the Yankees lose. Some friend!</p><p><strong>Bank Scam</strong>A guy you knew in high school calls and says he’s going to rob a bank and wants you to drive the getaway car. You don’t really know him that well, but you say O.K. The robbery is a success and you get away. When you ask him for your share, he says, “Here’s your share,” and pulls out a gun. You say, “That’s not my share, that’s a gun.” After a few minutes of him pointing the gun at you, you realize you’ve been scammed.</p><p><strong>Jury-Duty Scam</strong>The scammers send you a notice that you skipped jury duty and owe a big fine. But you check the dates, and it turns out you were in the courtroom that day, because you were on trial.</p><p><strong>Fake-Kidnapping Scam</strong>You get kidnapped and call your grandfather. You tell him the kidnappers won’t let you go unless he puts a thousand dollars in a box and leaves it at a certain street corner. He agrees and does it. The next morning, you realize that you were just really drunk and got tangled up in some ropes and thought you were kidnapped. You and Grandpa go to the street corner, but the box with the money is gone. Hey, maybe it was a scam! ♦</p>"}];
