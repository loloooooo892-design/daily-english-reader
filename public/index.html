<style>

  --warning-border: #E8C88A;

    --bg: #191C22;

    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;

}

  --text-secondary: #8890A0;

  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;

  --warning-border: #5C4A28;

  --swap-bg-hover: #2F3543;
}

  --text: #2B2F38;

  --accent-light: #E8EDF4;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {

<script>
var articles = [{"title":"Fields of Mistria officially becomes the best farm sim since Stardew Valley with its 1.0 update today","source":"PC Gamer","author":"Lauren Morton","url":"https://www.pcgamer.com/games/life-sim/fields-of-mistria-officially-becomes-the-best-farm-sim-since-stardew-valley-now-that-its-launched-a-1-0-update-today/","category":"gaming","categoryLabel":"Gaming","wordCount":530,"readingTime":3,"content":"<p>Fields of Mistria 1.0 Official Trailer - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/utHOieev6Pk\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>Farm simmers already know what day it is: It's <a href=\"https://www.pcgamer.com/games/life-sim/fields-of-mistria-1-0-update-changes/\" target=\"_blank\" rel=\"noopener\">Fields of Mistria 1.0</a> day. The magical girl-inspired, '90s anime flashback farm sim has been in early access for two years (to the day) and has just launched its full release version with the conclusion of its main story and, way more importantly, matrimony.</p><p>To the dismay of some of my fellow PCG editors and the delight of others, I've been totally incapable of shutting up about Mistria. Farm sims are nominally about planting crops and making cash but what keeps me and all the other life simming freaks coming back is always going to be great artwork and crushable characters. Mistria is drowning in both with its Game Boy Advance-inspired colorful sprites and characters who clawed their way out of my old Shojo Beat mags.</p><p>It's an old anime tropes fest on its face (red-headed <a href=\"https://myanimelist.net/character/209/Kyou_Souma\" target=\"_blank\" rel=\"noopener\">tsundere boy</a>, <a href=\"https://myanimelist.net/character/3935/Musashi\" target=\"_blank\" rel=\"noopener\">arrogant villainess</a>, <a href=\"https://myanimelist.net/character/507/Howl\" target=\"_blank\" rel=\"noopener\">flirtatious rogue</a>, and <a href=\"https://myanimelist.net/character/2030/Usagi_Tsukino\" target=\"_blank\" rel=\"noopener\">blonde protagonist</a> are all here) but Mistria does such an incredible job of layering genuine character insights underneath all of them with a shocking amount of contextual dialogue. Farm sims just don't typically write this much, and I respect the heck out of Mistria for it.</p><p>Today's a great day to start your first farm in Mistrira, but for those of us who'd been vibrating in anticipation—you don't have to start from scratch at all. The new main story quests and final romance and marriage scenes all naturally fall after the progress you've made so far. Even the new Steam achievements are awarded retroactively.</p><p>I'll be writing a scored review of Fields of Mistria just as soon as I have a chance to complete the story and finally choose my spouse, which is the real final boss in this game where I'm dating 10 of the 12 marriage candidates and have only gotten more indecisive. You can wait on the formality of a percentage, but I've made <a href=\"https://www.pcgamer.com/games/life-sim/the-early-access-for-fields-of-mistria-was-better-than-every-other-farm-sim-this-year-by-a-country-mile-thanks-to-its-cast-of-hot-anime-inspired-sweethearts-and-great-dialogue/\" target=\"_blank\" rel=\"noopener\">my opinion</a> known that I think this is one of the <a href=\"https://www.pcgamer.com/games/best-farm-sims-games-like-stardew-valley/\" target=\"_blank\" rel=\"noopener\">best games like Stardew Valley</a> a <a href=\"https://www.pcgamer.com/games/life-sim/the-best-farm-sim-since-stardew-valley-is-on-sale-right-before-its-1-0-launch/\" target=\"_blank\" rel=\"noopener\">few different times</a> over the past two years so you can <a href=\"https://www.pcgamer.com/games/life-sim/oh-no-i-can-t-possibly-decide-who-to-date-in-anime-inspired-farm-sim-fields-of-mistria-when-i-m-already-in-love-with-all-of-them/\" target=\"_blank\" rel=\"noopener\">see where my head's at</a> pretty clearly.</p><p>You can grab <a href=\"https://store.steampowered.com/app/2142790/Fields_of_Mistria/\" target=\"_blank\" rel=\"noopener\">Fields of Mistria on Steam</a> now (no console releases yet, sorry) for $12.59 (£10.61) which, if I can effusively praise it one more time, is a heck of a lot of farm sim for about half the price most other farm sims go for these days.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Lauren has been writing for PC Gamer since she went hunting for the cryptid Dark Souls fashion police in 2017. She joined the PCG staff in 2021, now serving as self-appointed chief cozy games and farmlife sim enjoyer. Her career originally began in game development and she remains fascinated by how games tick in the modding and speedrunning scenes. She likes long fantasy books, longer RPGs, can't stop playing co-op survival crafting games, and has spent a number of hours she refuses to count building houses in The Sims games for over 20 years. </p>"},{"title":"Eric Wareheim, Plant Dad","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/10/eric-wareheim-plant-dad","category":"fun","categoryLabel":"Interesting Reads","wordCount":633,"readingTime":4,"content":"<p>A Queensland bottle tree (<em>Brachychiton rupestris</em>) is not something you would typically find in the chaparral of Southern California. The cartoonishly stout tree would be right at home in a Dr. Seuss book, but it is native to the shrublands of Australia. Even so, one recent morning, a flatbed trailer cruised down the I-5 freeway, with two massive bottle trees secured in its truck bed, and pulled up to Serpentine—a plant-design studio (that is, a high-end nursery) in the Boyle Heights neighborhood of Los Angeles, owned by the comedian and filmmaker Eric Wareheim.</p><p>Wareheim, who stands well over six feet tall and wears a trim beard and square-framed glasses, raced outside to meet the delivery. “Oh, wow!” he yelled, seeing the trees, each more than twenty feet tall, with bulbous trunks nearly nine feet in diameter. “This is the absolute holy grail for me.”</p><p>Wareheim’s botanical obsession began as a hobby after his divorce, in 2024. “Gardening is just so therapeutic,” he said. Somewhere between his day job of making movies and TV (“Tim and Eric’s Billion Dollar Movie,” “Master of None”) and a side hustle blending wine under a label called Las Jaras, he began collecting plants. Soon, they overwhelmed his house.</p><p>“I started having to sell plants because I had no room,” he said. So, with a studio manager, Alexis Florio, he rented a loft, and they began potting desert plants in vintage vessels they sourced from around the world. They also shaped the plants into dramatic forms—sometimes by pruning, other times by leaning a plant away from the sun and letting it twist back toward the light.</p><p>Eventually, they outgrew the space, and they moved their wares into the loft’s parking lot—a wispy fifteen-foot dragon tree ($8,500) that evoked a ballerina mid-jump, a floss-silk tree ($7,500) with five trunks rising from a Willy Guhl saucer like a giant zombie hand coming up through the earth. Word of the oddball plants spread, and commissions rolled in—Martha Stewart, Kelly Wearstler, Flamingo Estate. “Buyers see them as art pieces, not just some green,” Wareheim said.</p><p>The bottle trees on the flatbed were to be the centerpieces of a celebration of Serpentine’s success. Gazing up at them, Wareheim said, “They put them in museums, stadiums, and zoos—that’s it.” Asked how much each one would go for, he answered, “I don’t know. What does it cost for me to spend two years befriending someone?”</p><p>That’s how long it took him to find the two trees, scouring nurseries all over San Diego County. “The whole game is to find that shape,” he said. He discovered this pair growing in the driveway of Hula Tropicals, a plumeria nursery in Bonsall. But the owner didn’t want to sell. Like Hollywood, the plant world is about relationships, so Wareheim spent months returning, buying increasingly larger plants, and gaining the owner’s trust. Finally, a deal was struck, and the bottle trees were dug up.</p><p>During the unloading at Serpentine, there was a hiccup: Wareheim had wanted to display the Brachychitons in a couple of huge limestone saucers that turned out to be too shallow. Plan B was two cement bowls, but they were too narrow. “So Plan C is the box, right?” Wareheim asked his team, pointing to a container made of what looked like Lincoln Logs. “We cut the box down a little bit to make it look nice for tonight.”</p><p>A forklift crane rattled to life and hoisted one of the two-ton Brachychitons. “This is the greatest thing I’ve ever seen!” Wareheim said, watching the tree glide through the air like Fellini’s Jesus over Rome. “Look at that thing!” He stepped closer to the crane operator and said, “I’ll drive.” The operator cracked a smile. “The guys hate me,” Wareheim said. “My humor is so dumb.”</p>"},{"title":"Posting \"I Wish Someone Would In Alive Him\" About Federal Judge Isn't Punishable Threat","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/07/posting-i-wish-someone-would-in-alive-him-about-federal-judge-isnt-punishable-threat/","category":"law","categoryLabel":"Law","wordCount":1223,"readingTime":7,"content":"<p>From Judge Carlos Mendoza (M.D. Fla.) in <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.flmd.449303/gov.uscourts.flmd.449303.49.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>U.S. v. Joudeh</em></a>:</p>\n<blockquote><p>Defendant is charged with one count of transmission of an interstate threat to injure or kill another person in violation of 18 U.S.C. § 875(c). The facts alleged in the Indictment state that Defendant violated this statute via \"an online comment that included the statement, 'I wish someone would in alive him.'\" The Indictment provides no further information as to where or why this comment was posted, to whom it was communicated, or who the referenced \"him\" is in the comment.</p></blockquote>\n<p>The \"him\" was, however, apparently identified in this <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.flmd.449303/gov.uscourts.flmd.449303.32.1.pdf\" target=\"_blank\" rel=\"noopener\">search warrant affidavit</a>:</p>\n<blockquote><p>On June 22, 2025, United States District Court Judge, John L. Badalamenti contacted the United States Marshals Service (USMS) for the Middle District of Florida regarding a threat stemming from reaction to a June 21, 2025, New York Times article called, A White Nationalist Wrote a Law School Paper Promoting Racist Views, It won Him an Award. Judge Badalamenti is an adjunct professor at the University of Florida and taught a seminar class in the fall semester of 2024 on the legal theory originalism.</p>\n<p>The New York Times article focuses on a capstone paper a student wrote for Judge Badalamenti's class. The student's paper, according to the article, argued that the framers of the Constitution intended the phrase We the People to refer exclusively to white people. As such, in the paper, the student argued for the removal of voting rights protections for nonwhite people and issuance of shoot-to-kill orders against criminal infiltrators at the border. The student obtained the book award, which the article describes as meaning the student was designated the best student in the class and was awarded to the student by Judge Badalamenti….</p>\n<p>One of the comments on [a post about the article] was from Instagram user falasteen8090 (Falasteen8090)…. Falasteen8090 commented on [the] post, \"I wish someone would in alive him.\" USMS and Judge Badalamenti suspected that Falsteen8090 meant to say unalive him, meaning kill him….</p></blockquote>\n<p>The court dismissed the indictment, concluding as a matter of law that the post didn't fit within the \"true threats\" exception to the First Amendment:</p>\n<blockquote><p>The Government argues that \"in alive\" is a typographical error that should be interpreted as \"unalive,\" which is a euphemism for kill. Even accepting this construction as true, no reasonable jury could consider this broad, non-detailed wish to be a threat at all, much less a true threat.</p>\n<p>Under certain circumstances, a wish may possibly constitute a true threat. However, in the few cases where an \"I wish\" type of statement constituted a true threat, there were additional statements alleged that provided threatening context.</p>\n<p>For example, in <em>Stock</em>, the indictment alleged that the defendant \"posted a notice on Craig's List\" stating:</p>\n<blockquote><p>i went home loaded in my truck and spend the past 3 hours looking for this douche with the expressed intent of crushing him in that little piece of shit under cover gray impala hooking up my tow chains and dragging his stupid ass down to creek hills and just drowning him in the falls. but alas i can't fine that bastard anywhere … i really wish he would die, just like the rest of these stupid fucking asshole cops. so J.K.P. if you read this i hope you burn in hell. i only wish i could have been the one to send you there.</p></blockquote>\n<p>In addressing the defendant's argument that the final three sentences of this post established that it was not a true threat because \"[m]erely wishing[ ] or hoping that harm would come to another falls outside the scope of\" § 875(c), the Third Circuit reasoned that it was possible for a wish to \"constitute a threat <em>in the right context</em>.\" And then the Third Circuit looked at \"the context of the first and second sentences,\" and determined that \"a reasonable jury could find that [the defendant] did not simply wish that [the victim] would suffer harm, but that he was prepared to commit the act himself.\"</p>\n<p>Similarly, the Eighth Circuit rejected a defendant's argument that he did not make a true threat because he was merely expressing a wish that the President would suffer harm in an email that stated:</p>\n<p>WHATS SO HARD ABOUT A BIRTH RECORD? ONLY NON AMERICAN S STILL TRUST YOU. YOU ARE A CROOK A FEAR MONGEL I HATE YOU AND I HOPE SOMEONE KILLS YOU AND YOUR FAMILY REAL SOON. TO WARN THE NEXT ILLEGAL ALIEN WHO TRIES TO TAKE YOUR PLACE. I WASNT RACISET UNTILL 2008 THANKS NIGGERS! WHITE PEOPLE CAN BE NIGGERS TOO! kill obama MRS OBAMA AND THE 2 LITTLE NIGGER BRAT KIDS!</p>\n<p>In addressing this statement, the Eighth Circuit looked at the context of an additional email the defendant sent to the same recipient in the same timeframe where he wrote \"i would kill obama if i could\" and \"i want to see obama's blood spilled all over the white house make it pink.\" <em>S</em><em>ee also </em><em>U.S. v. Saul</em> (D. Neb. 2020) (denying a motion to dismiss where the defendant posted the following comment on Facebook: \"Some borrow me a gun and a couple hundred rounds of ammo. Wanna get in on this whole mass shooting craze before it dies down. Everybody getting shot at least once. Myself included,\" reasoning that the post provided specific details of what the defendant wanted to do, how he would do it, and why he would do it)….</p>\n<p>[T]he statement alleged in the Indictment is a mere wish that \"someone\" would \"in alive\" an unnamed \"him.\" There is no promise or indication that specific violence will befall someone if a condition occurs. This statement is simply a vague desire that someone was no longer alive. <em>See </em><em>Solomon v. Petray</em> (W.D. Ark. 2013) (\"[T]he mere wish that a person die from a slow and painful disease does not constitute a true threat.\"); <em>U.S. v. Daulong</em> (W.D. La. 1945) (\"If the defendant had simply said that someone should or ought to kill the President, with no declaration or other indication that the speaker intended or would commit the act, it seems clear that this would not amount to a threat.\")….</p>\n<p>The Fifth Circuit in <em>United States v. O'Dwyer </em>(5th Cir. 2011), affirmed the dismissal of an indictment, determining that the following statement was not a true threat as a matter of law: \"Maybe my creditors would benefit from my suicide, but suppose I become 'homicidal'? Given the recent 'security breach' at 500 Poydras Street, a number of scoundrels might be at risk if I DO become homicidal.\" The Fifth Circuit reasoned that the \"statement [was] hypothetical and conditional,\" that it \"did not threaten bodily harm to any particular individual.\"</p>\n<p>The statement at issue here is not specific, not graphic, and not explicitly violent. It does not express an intent to commit harm in the past, present, or future, and there is no other context to explain how this statement could possibly be threatening. Even the comment in <em>O'Dwyer</em>, which was determined not to be a threat as a matter of law, is more threatening than the one alleged here. The statement \"I wish someone would in alive him\" is simply not a threat. No reasonable jury could conclude otherwise….</p></blockquote>\n<p>Fritz Scheller represents defendant, as does Sufia Khalid (Muslim Legal Fund of America).</p>"},{"title":"Top HBO Max Promo Codes This August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/max-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1100,"readingTime":6,"content":"<p>HBO Max is not just for <em>The Sopranos</em> anymore (but it is the only place to stream <em>The Sopranos</em>). Subscription video service HBO Max not only has <em>The Sopranos</em>, but other content from the best entertainment libraries, including: Warner Bros., Discovery Channel, CNN, Cartoon Network, Adult Swim, Animal Planet, and other brands.</p><p>We at WIRED also watch a lot of content—obviously, because we are always testing <a href=\"https://www.wired.com/gallery/best-tvs/\" target=\"_blank\" rel=\"noopener\">TVs</a>, <a href=\"https://www.wired.com/gallery/best-soundbars/\" target=\"_blank\" rel=\"noopener\">soundbars</a>, and <a href=\"https://www.wired.com/gallery/best-4k-streaming-devices/\" target=\"_blank\" rel=\"noopener\">streaming devices</a>—and regularly round up our newest <a href=\"https://www.wired.com/story/hbo-max-best-shows-to-stream-right-now/\" target=\"_blank\" rel=\"noopener\">favorites from HBO Max</a> so that you’ll know what to watch once you nab an HBO Max promo code. Whether you’re wanting to watch an HBO original series like <em>Succession</em> or a smash hit movie like <em>Barbie</em>, HBO Max has the content you’re looking for, and WIRED has the perfect promo codes to help you save on these sometimes-pricey subscription plans.</p><h2>50% Off HBO Max Promo Code for Students</h2><p>Students rejoice, you don’t have to try to mooch off your friends’ parents' HBO Max subscriptions anymore when you want to rewatch Euphoria for the 15th time (...not speaking from personal experience or anything). HBO Max is offering a <a href=\"https://www.max.com/student\" target=\"_blank\" rel=\"noopener\">Student Discount</a>, where you can save and get 50% off subscriptions with a promo code. This means the price is only $5 a month. This discounted plan is eligible for The HBO Max Basic With Ads monthly plan, so you’ll get unlimited access to all of HBO, hit series, movies, news, sports, and more on up to two devices at once.</p><h2>Save 35% by Bundling HBO Max, Disney+ and Hulu</h2><p>This deal is honestly one of the best I’ve ever seen, and I’ve been thinking of switching as well, because with this <a href=\"https://www.max.com/\" target=\"_blank\" rel=\"noopener\">Magic Bundle</a>, you can get HBO Max, Disney+, and Hulu for just $17 a month. (which is crazy because I pay that much alone for my Hulu! Again, I’m convincing myself while writing this that I should switch to this plan.) This crazy good deal is for those three streaming services with ads, but you’ll be saving 35% on the original price. If you’re impatient like me, you can get the same deal without ads for $30 a month, which is definitely higher than with ads but you’re still saving almost $19 a month with this Evergreen deal.</p><p><em>Project Hail Mary</em>, <em>They Will Kill You</em>, and <em>The Long Walk</em> are among the films deserving of your eyeballs this month.</p><h2>HBO Max Deals: Save up to $41</h2><p>Like other streaming services, HBO Max has different tiers at different prices for streaming, so you can choose which one fits you (or your “household;” wink) best. Basic with ads allows you to stream on two devices at once in full HD for $10 a month. Standard is midrange, where you get everything from the previous basic plus 30 available downloads so you can watch on the go, for $17 a month. If you are impatient and a movie/TV buff, you might want to choose the premium, where you can stream on four devices at once, have 4k Ultra HD video quality, Dolby Atmos immersive audio, and 100 downloads to watch on the go for $21 a month.</p><h2>HBO Max New Shows and Films</h2><p>HBO Max is known for being one of the most heralded platforms in entertainment. These new shows and films on HBO Max are sure to be a hit too. We’re most excited for <em>Task</em>, a new series set in the working-class suburbs of Philadelphia, where an FBI agent heads a task force aiming to end the violent robberies led by an unsuspecting family man. There’s also a new GOT spin-off series, <em>A Knight of the Seven Kingdoms</em>, which premiered on January 18. Taking place a century before the events of <em>Game of Thrones</em>, set in an age when the Targaryen line still holds the Iron Throne and the last dragon has not yet passed from living memory. There’s also <em>Chair Company</em> from the oddball mind of Tim Robinson, and <em>IT: Welcome to Derry</em>, a spin off set in the <em>IT</em> universe for fans of horror.</p><p>And especially right now, several of my absolute favorite shows are returning for a brand-new season or their last season. Long-awaited season three of <em>Euphoria</em> returns, with more drug-fueled drama. <em>Hacks</em>, the final season premiered and I’m going to miss the tumultuous relationships that orbit Deborah Vance’s solar system. Like everyone else, I’m libbing out every Thursday with the sexy doctors in <em>The Pitt</em>. Please don’t go, I love you so. Plus, I’ve been loving the new Steve Carell comedy <em>Rooster</em>, about a wholesome but goofy romance writer that begins a tenure at college.</p><p>I missed the GOT boat, and it’s a little too violent for me, but my brother recommended <em>A Knight of the Seven Kingdoms</em>, the newest <em>Game of Thrones</em> spinoff that’s a little lighter and more family-friendly than the first and I think I’m becoming a late bandwagon-er. There’s also <em>The Dark Wizar</em>d, an in-depth four-part documentary about extreme climber Dean Potter that I have in my queue for next weekend.</p><p><em>One Battle After Another</em>, <em>The Smashing Machine</em>, and <em>Sinners</em> are just a few of the movies you should be watching on HBO Max this month.</p><h2>Watch Live Sports at HBO</h2><p>If you’re a sports fan, HBO has the best selection of sports programming, including the NHL, NCAA March Madness, MLB, U.S. Soccer, NASCAR, Unrivaled, Roland-Garros, college football, and premier cycling events. So whether you want to see the live Yankees game, or highlights of College football, you won’t miss an action-packed moment with HBO.</p><p>Tune in to watch the men’s and women’s teams fight to win the 2026 NCAA Division I Basketball championship.</p><h2>Watch Your Favorite Shows on HBO Max for Free</h2><p>Because HBO knows how tempting (and sexy) teasing can be, folks can <a href=\"https://www.max.com/collections/watch-free\" target=\"_blank\" rel=\"noopener\">sample</a> episodes of new and fan-favorite original steamy series, like Euphoria, Industry, or The Idol <a href=\"https://www.max.com/collections/watch-free\" target=\"_blank\" rel=\"noopener\">for free</a> without a subscription. When you inevitably get hooked (too soon after the Euphoria reference?) on that sweet, sweet content, you’ll need an HBO Max subscription to stream the full library. To continue to tease, you can stream nearly endless options, like White Lotus and Heated Rivalry, and my personal faves: The Last of Us, The Penguin, and Hacks, right now. Hurry, you don’t want to miss out on the shows everyone is talking about around the proverbial water cooler.</p><p><em>Lanterns</em>, <em>Dark Matter</em>, and the original <em>Star Trek</em> are just a few of the TV shows you should be watching right now.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
