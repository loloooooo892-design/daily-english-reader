*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  background: var(--bg);
  color: var(--text);

.container {

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;

  color: var(--accent);
  background: var(--accent-light);

  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  text-align: center;
  margin-top: 2rem;
}

.archive-link a {

  text-decoration: none;

.archive-link a:hover {

@media (max-width: 480px) {

<script>
var articles = [{"title":"South Korea urged to extend protections for women after appeal decision in abortion case exposes legal vacuum","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/south-korea-urged-to-extend-protections-for-women-after-appeal-decision-in-abortion-case-exposes-legal-vacuum/","category":"law","categoryLabel":"Law","wordCount":527,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/south-korea-urged-to-extend-protections-for-women-after-appeal-decision-in-abortion-case-exposes-legal-vacuum/#\" target=\"_blank\" rel=\"noopener\">South Korea urged to extend protections for women after appeal decision in abortion case exposes legal vacuum</a>\n</strong><p>On Thursday, Amnesty International <a href=\"https://www.amnesty.org/en/latest/news/2026/07/south-korea-appeal-decision-for-abortion-case-exposes-legal-vacuum/\" target=\"_blank\" rel=\"noopener\">warned</a> that South Korea’s abortion framework did not go far enough to protect women’s reproductive health and rights. Amnesty International’s call for improved protections for women came in response to an appellate decision by the Seoul High Court that acquitted a 26-year-old woman who had been charged with murder, overturning an earlier conviction.</p><p>“While we welcome the court’s decision to acquit the woman who sought abortion, the court’s decision to uphold the convictions of medical staff exposes structural loopholes in access to essential healthcare in South Korea,” HeeKyong Cho, Amnesty International Korea’s executive director said in a statement.</p><p>The Seoul High Court’s decision acquitted Kwon, the 26-year-old woman charged with murder, <a href=\"https://en.sedaily.com/society/2026/07/23/mother-in-36-week-abortion-case-acquitted-on-appeal-doctors\" target=\"_blank\" rel=\"noopener\">determining</a> that she did not know that a doctor would kill the fetus after it emerged alive from her body, and that she had only known that the fetus would be delivered stillborn from her womb. The overturned trial’s ruling, which had sentenced her to prison for three years, suspended for five years, had found that she had been willfully negligent regarding murder. <a href=\"https://www.straitstimes.com/asia/east-asia/south-korean-youtuber-indicted-with-murder-over-late-term-abortion-video?ref=more-on-this-topic\" target=\"_blank\" rel=\"noopener\">According to prosecutors,</a> the fetus was allegedly born alive through a cesarean operation and later placed in a freezer, killing it. The director of the hospital and the operating surgeon were indicted for delivering the fetus and then killing it, and their sentences were reduced but not overturned. In June 2024, Kwon had documented her experience and hospitalization in a Youtube vlog which then went viral.</p><p>“The National Assembly’s failure to amend the abortion law has left pregnant people without clear legal protections and access to essential reproductive healthcare,” Cho said in a statement. Cho also called for the government to remove barriers to accessing safe abortion and amend the Mother and Child Health Act to “prioritize women’s sexual and reproductive health and rights.”</p><p>In 2019, South Korea’s Constitutional Court <a href=\"https://www.straitstimes.com/asia/east-asia/debate-reignites-in-south-korea-over-legalisation-of-abortion-pills\" target=\"_blank\" rel=\"noopener\">overturned a ban on abortions</a>, ruling that criminalization of abortion was unconstitutional because it violated women’s right to bodily autonomy. The court ordered lawmakers to revise the law by the end of 2020. Though <a href=\"https://www.koreatimes.co.kr/southkorea/politics/20260719/abortion-legislation-returns-to-spotlight-after-7-year-limbo\" target=\"_blank\" rel=\"noopener\">the government has yet to pass</a> replacement legislation defining when abortions are permitted, there are several bills pending in the National Assembly that seek to fill the legal vacuum left by the court’s 2019 ruling.</p><p>Amnesty International had <a href=\"https://www.amnesty.org/en/latest/news/2026/03/south-korea-conviction-of-woman-seeking-abortion-exposes-government-failure-to-guarantee-access-to-vital-healthcare/\" target=\"_blank\" rel=\"noopener\">also commented on the case</a> when Kwon was initially convicted. In March, Sarah Brooks, Amnesty International’s Deputy Regional Director, said that the ruling had highlighted “the impossible position pregnant people and medical providers are placed in due to the ongoing legal vacuum surrounding abortion in South Korea.” Brooks had raised concerns that the lack of existing regulation may have restricted access to healthcare and pushed pregnant people towards exploitative and unregulated practices.</p><p>Abortion legislation also recently come into the public eye when President Lee Jae Myung <a href=\"https://www.koreatimes.co.kr/southkorea/politics/20260719/abortion-legislation-returns-to-spotlight-after-7-year-limbo\" target=\"_blank\" rel=\"noopener\">called for loosened restrictions</a> on the abortion pill mifepristone. Without clear legislation, women seeking abortions often seek smuggled drugs on online forums or underground markets. In 2025, Myung’s government had included the legalization of abortion medication in its five-year national policy agenda.</p>"},{"title":"Introducing MAI-Cyber-1-Flash inside MDASH | Microsoft AI","source":"Hacker News Best","author":"","url":"https://microsoft.ai/news/introducing-mai-cyber-1-flash-inside-mdash/","category":"tech","categoryLabel":"Technology","wordCount":631,"readingTime":4,"content":"<p>Picking the right model for the task</p>\n<p>Security is an always-on mission, and given the enormous volume of inbound attacks, token cost is now the real constraint for defenders. MAI-Cyber-1-Flash was designed to efficiently handle up to 90% of all tasks, enabling MDASH to use the larger and most costly models in our fleet (in this case GPT-5.4) for the 10% of exceptionally hard tasks that truly need them.</p>\n<p>The result is that the unified system of MDASH with MAI-Cyber-1-Flash delivers 96% on CyberGym (+12 pt above Mythos).</p>\n<p>This combination delivers a 50% cost saving when compared against our best offering in MDASH today (GPT 5.4 + 5.4 mini + 5.3 codex). That’s the power of a well-tuned, multi-model system with access to uniquely rich historical training data. It ensures you always have the best model at the best price for every task.</p>\n<p>In this new environment, being able to go from identifying a new vulnerability to addressing it in real-time is critical. And while AI remediation of software vulnerabilities is now a key security workflow, there are many jobs to be done by Security practitioners themselves.</p>\n<p>That’s why today we’re also launching <a href=\"http://aka.ms/agenticsecurityblog\" target=\"_blank\" rel=\"noopener\">Perception</a>, our agentic security systems, that provides teams of agents for a variety of security workflows in MDASH, to continuously monitor, patch, and close new threat vectors. Perception will also soon use MAI-Cyber-1-Flash for many more security workflows, beyond the software vulnerability work.</p>\n<p>Three things matter today: Model. Data. Harness.</p>\n<p>We have jointly optimized our world-class models, our unmatched historic data, and our expert-tuned harness to ensure that our customers have a uniquely powerful security offering.</p>\n<p>Model. MAI-Cyber-1-Flash is a compact, code-heavy security model derived from the MAI-Thinking-1 lineage, which was built from scratch, in-house, on the highest quality data. Details in our <a href=\"https://microsoft.ai/pdf/mai-thinking-1.pdf\" target=\"_blank\" rel=\"noopener\">technical report</a>.</p>\n<p>Data. Our deepest advantage. Decades of building world-class security systems now give us trillions of daily signals across identity, endpoint, cloud, and network, and an unmatched record of real exploits and remediations. No one can manufacture this history.</p>\n<p>Harness. <a href=\"https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-tops-leading-industry-benchmark/?msockid=07e1b320223d63fa1e34a47d23db623b\" target=\"_blank\" rel=\"noopener\">MDASH</a>, our multi-agent vulnerability identification and remediation harness, is tuned by the best security experts in the industry, who have created 100+ agents using multiple leading models to find, validate, and remediate vulnerabilities. Agentic code scanning is a critical function in the Security Operating Center and feeds Project Perception, our new agentic security system.</p>\n<p>Built with safety first\n</p>\n<p>Because MAI-Cyber-1-Flash is Microsoft’s first cyber model, we built trust into every layer of the system, from model training to customer deployment. The model was developed with a security-first calibration, rigorously evaluated by Microsoft’s AI Red Team, tested through automated and expert-led adversarial exercises, and independently assessed by a third party.</p>\n<p>Trust extends beyond the model itself. Through MDASH, customers get enterprise-grade controls including Role-Based Controls, tenant isolation, encryption, auditability, and sandboxed execution environments with no internet access. The result is a cyber model that delivers powerful capabilities to defenders while maintaining the governance, security, and control enterprises expect from Microsoft.</p>\n<p>Our hill-climbing machine</p>\n<p>Cybersecurity is not just a data-rich domain; it is a live reinforcement learning loop. Every day, defenders investigate threats, triage alerts, hunt adversaries, remediate vulnerabilities, deploy protections, and learn from the outcome.</p>\n<p>Microsoft sees that loop end to end: vulnerabilities through <a href=\"https://www.microsoft.com/en-us/msrc\" target=\"_blank\" rel=\"noopener\">Microsoft Security Response Center</a>; attacks and defenses across identity, endpoint, cloud, data, browser, and applications; more than 100 trillion security signals every day; and operational insight from 1.6 million customers. Because we can connect actions to outcomes; what was exploitable, what was contained, what was blocked, and what actually worked; we have more than data.</p>\n<p>Our MAI reinforcement learning loop gives us the foundation to build cyber models that improve continuously and become expert cyber defenders. That’ll remain our commitment to our customers for years to come.</p>"},{"title":"Amid the recent Xbox devastation, Microsoft is uncancelling something, which is good news for fans of one of its series at least","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/microsoft-age-of-empires-3-dlc-uncancelled","category":"gaming","categoryLabel":"Gaming","wordCount":517,"readingTime":3,"content":"<p>Poles positioned.</p>\n    \n  \n  \n  \n  \n            <p>Here's something you don't hear very often, especially in a month as destructive as the one Xbox is having: Microsoft is seemingly uncancelling something; specifically its previously announced and then subsequently abandoned Age of Empires 3 DLC, which is now set to arrive this September.</p>\n<p>Microsoft <a href=\"https://www.ageofempires.com/news/new-year-new-age-show-the-rundown/\" target=\"_blank\" rel=\"noopener\">announced a fresh bit of DLC for Age of Empires 3: Definitive Edition</a> back in February 2023. And while it was cagey on the specifics, it offered a release window of \"late 2024\". However, late 2024 brought <a href=\"https://www.ageofempires.com/news/update-age-of-empires-iii-de-dlc-delayed/\" target=\"_blank\" rel=\"noopener\">news of a delay from Microsoft</a>, which wrote, \"With many active projects across the franchise, we'll be pushing out the release for the DLC to a future date.\" Still Age of Empires 3 fans waited and still nothing came, until <a href=\"https://www.ageofempires.com/news/age-of-empires-iii-definitive-edition-dlc-news/\" target=\"_blank\" rel=\"noopener\">word of its cancellation</a> arrived last January. At the time, Microsoft admitted announcing the DLC before the team had even started working on it might have been \"premature\".</p>\n<p>Almost exactly 16 months later, it appears the DLC has been revived. Not only that, it's been given a title - The Baltic Powers - a release date, and first details.</p>\n\n<p>1 of 5 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>\"The Age 3 community has continued to show incredible passion for the game and that enthusiasm hasn't gone unnoticed,\" <a href=\"https://www.ageofempires.com/news/the-baltic-powers-expansion-coming-to-age-of-empires-iii-definitive-edition-join-open-beta/\" target=\"_blank\" rel=\"noopener\">Microsoft wrote on the Age of Empires blog</a>. \"In response to your passion and feedback, we are excited to announce that a brand-new expansion is coming to Age of Empires 3: Definitive Edition on 10th September, 2026.\"</p><p>The Baltic Powers brings two new civilisations - The Danes and the Poles - plus 25 new maps, 50+ hero customisations, and new game modes. All of which promise \"new strategic problems to solve, new matchups to learn, new ways to master the map, and new reasons to return for a game they love.\"</p>\n<p>Going a little deeper, The Poles are said to combine \"lower building costs, civic bonuses, and a booming Folwark economy with battlefield-shaking cavalry options\", while the Danes enable players to \"use the Customs House to leverage shipments from other players from the start, strengthen your economy as you advance through the ages, and defend your territory with Snaphane and Gunboat levies\".</p>\n<p>As for those new game modes, Regicide is - just as it sounds - a race to kill the enemy Regent, while Independence \"removes the safety net of Home City support and challenges you to win through strategy, fundamentals, and battlefield execution.\" Scenarios-wise, there's Commonwealth Charge and Havana Heat. Both those, and other more involved bits relating to the DLC, can be found in Microsoft's announcement.</p>\n<p>Word of a DLC revival for Age of Empires 3 fans is a bit of good news amid the <a href=\"https://www.eurogamer.net/microsoft-xbox-layoffs-2026-double-fine-compulsion-ninja-theory\" target=\"_blank\" rel=\"noopener\">devastation caused by Asha Sharma's recent \"reset\" of Microsoft's gaming division</a>, which will see 3,200 Xbox employees lose their jobs by next July. Since that news broke, Microsoft has been looking to regain control of the narrative, seeding positive new announcements including the <a href=\"https://www.eurogamer.net/xbox-backward-compatibility-on-pc-announced\" target=\"_blank\" rel=\"noopener\">launch of Xbox backward compatibility on PC</a> and a big Bethesda blow-out featuring <a href=\"http://eurogamer.net/elder-scrolls-6-xbox-layoffs-bethesda-reaction\" target=\"_blank\" rel=\"noopener\">vague talk of the long-awaited Elder Scrolls 6</a>.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"A Greenwich Village Dining Room That Feels Far from the TikToking Crowd","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-food-scene/a-greenwich-village-dining-room-that-feels-far-from-the-tiktoking-crowd","category":"fun","categoryLabel":"Interesting Reads","wordCount":1027,"readingTime":6,"content":"<p>Every inch of Somssi is charming: the lace curtains, the vintage baking tins repurposed as wall sconces, the plant-store potted greenery, the mismatched wooden chairs clustered around mismatched wooden tables. It’s the kind of charm that could tip, in less careful hands, into hospitality kitsch—all warmth, no substance. But it would be a mistake to dismiss Somssi’s appeal as mere superficial loveliness: there’s real muscle beneath all the gentility and sweetness, a brawny, almost radical confidence in both the service and the cuisine. Somssi’s managing partner, Ahris Kim, was for many years the director of operations for Na:Eun Hospitality, the group behind the ultra-high-end Korean-inspired tasting counter Atomix, which, for those who care about this sort of thing, was recently named the seventh-best restaurant in North America in the World’s 50 Best rankings. At Somssi, Kim has channelled the group’s high standards into her own deceptively casual concept. The restaurant’s name, pronounced “somm-shi,” means something like “time-honed skill” in Korean, and it earns that title. Dining there put me in mind of what baseball old heads used to call easy power: a display of strength and capability so practiced that it nearly looks like relaxation.</p><p>Na:Eun’s impresarios, Ellia and Junghyun (J.P.) Park, are also partners in Somssi, and the physical space is a long-standing Na:Eun joint, formerly the home of Acru, an Australian-inflected tasting-menu-focussed spot that fizzled out last year. With a bar in front, a hallway-like dining strip, and a cozy back room, the space feels more harmonious with Somssi’s easygoing à-la-carte offerings. Few things on the bistro-style menu look especially novel: you’ve got your pasta, your steak, your increasingly obligatory crudo of scallop (which seems to be rapidly outpacing hamachi as the city’s most predictable raw-seafood medium, and I can’t say I’m mad about it). But every dish gets a twist, or a zing, or a moment of cloud-parting clarity. The scallops here are sliced and pressed to create ragged edges whose tiny tears and ruffles wick up tart rivulets of chilled rhubarb broth, fragrant with makrut lime.</p><p>The menu, designed with J.P. Park, who serves as Somssi’s culinary director, is less overtly Korean than the restaurant’s name and affiliations might lead you to expect. Korean flourishes appear here and there—a mustard-greens kimchi adding an audacious sour edge to a classic bolognese; a fiercely peppercorn-y sauce, evocative of <em>japchae</em>, au poivre-ing a tender <em>picanha</em> steak—but dishes draw on a broad palette of influences. An enormous double mutton chop, rubbed with a sweet and aromatic spice blend, and split lengthwise like a scientific specimen to display its rosy pink interior, is inspired by Chinese cumin lamb. I loved a wedge of caraflex cabbage, roasted to tender sweetness, which arrived hidden under a fluffy pale-yellow duvet of custardy egg-and-crab sauce, rich with the earthy-sulfuric flavor of white pepper: it’s egg foo young, but silkified, sultrified (and now, tragically, no longer on the menu). You can still get your egg fix in fried form: a sunny-side-up specimen comes atop a comforting little bowl of mushrooms and curried rice, a bit bibimbap-ish, a bit Indonesian, the curry blend pleasingly heavy on the coriander. A quartet of Gulf shrimp, shells and heads intact but carefully deveined (this is a nice restaurant, after all), are serried on a swirl of smoky, corn-infused mayonnaise and doused in a gently spicy chile oil. Whether you use a fork and knife or tear the crustaceans apart with your hands, it’s a physically messy dish, in a way that feels intentional, a moment of animal chaos to bring the calculated exuberance of the rest of the menu into relief.</p><p>Beverage-wise, there’s a delightful focus on itsy-bitsy drinks: two-ounce cocktails and spirits, including a terrifically weird selection of after-dinner options. The head sommelier, Jenny Eagleton, guided me to a sip-size pour of a cherry-infused mead made upstate, with notes of lemongrass, rosemary, and piney resin. “Freaky, right?” she said. “But kind of beautiful, too.” It paired satisfyingly with a square slice of olive-oil cake, served with a tangy fruit compote and whipped cream, but my favorite dessert was an ice cream infused with White Rabbit, the Chinese sweet-milk candy, with surprisingly delicate, delicious results.</p><p>Plenty of buzz seems to be accumulating around the cutesily named “Potato, Potato, Potato, and Caviar,” which features a pucklike croquette wrapped tidily in fried ribbons of potato and topped with an inky tiara of roe. I found the dish to be too much, in several ways: too much potato relative to caviar, too much crispiness relative to softness. (Better, if you need a tuber, to go for Somssi’s fries, which come in a brown paper bag so they can be shaken up with your choice of <em>gamtae</em> furikake or a kimchi-spiced cheese powder.) Above all, the overwrought thirty-two-dollar packet of luxury strikes a discordant note in a restaurant that seems, in every other way, to have no need for such clunky signifiers. It’s a dish that makes more sense outside Somssi—I mean literally outside, where this particular stretch of MacDougal is thronged with the TikTok-led, list-driven, clout-chasing hordes who nightly lay siege to the door of Dante, another World’s 50 Best honoree. (It <em>is</em> a spectacular bar, though the atmosphere has curdled, somewhat precipitously, with the arrival of the crowds.)</p><p>Success in restaurants has always been a kind of curse, but the curse seems to have more intense effects now: every mediocre dessert shack commands a line, every reservation is unattainable, and the city—never uncrowded—seems to be, in certain social-media-anointed neighborhoods, as tightly packed as a rush-hour 4 train. Atomix, with just fourteen seats along its chef’s counter, has never been easy to book, but, in the age of reservation scalpers and oligarch concierges, getting a table there has become functionally impossible. One of the most wonderful things about Somssi is how far away it feels from all that noisy jockeying, even if its own tables do move pretty briskly on Resy. Kim is working the floor every night, touching each table with a hello or a smile or a friendly retrieval of a fallen napkin. Her easy power is as exciting as all the hype beyond the doors. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;

  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
