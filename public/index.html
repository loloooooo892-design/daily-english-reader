*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Trump Imposes Harmful and Illegal Section 338 Tariffs Against Many Canadian Imports","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/08/23/trump-imposes-harmful-and-illegal-section-338-tariffs-against-many-canadian-imports/","category":"law","categoryLabel":"Law","wordCount":540,"readingTime":3,"content":"<p>Yesterday, Donald Trump imposed massive 50% tariffs on numerous Canadian imports after trade negotiations with Canada <a href=\"https://www.washingtonpost.com/business/2026/08/23/us-canada-breakdown-shows-limits-trumps-aggressive-trade-strategy/\" target=\"_blank\" rel=\"noopener\">broke down, largely due to the Trump administration's insistence on maintaining earlier 50% tariffs</a> on Canadian aluminum products and other goods.</p> <p>Section 338 was a part of the notorious Smoot-Hawley Tariff Act of 1930, which gravely exacerbated the Great Depression. In <a href=\"https://reason.com/volokh/2026/07/20/trump-imposes-new-illegal-tariffs-on-canada/\" target=\"_blank\" rel=\"noopener\">a previous post</a>, I summarized the reasons why Section 338 tariffs are an illegal usurpation of congressional authority by the president.</p> <p>As Philip Zelikow of the conservative Hoover Institution explained in <a href=\"https://reason.com/volokh/2025/06/03/does-the-smoot-hawley-act-justify-the-trump-tariffs-no-says-philip-zelikow/\" target=\"_blank\" rel=\"noopener\">a guest post</a> here at the VC blog, last year, Section 338 was superseded by new legislation enacted in 1962 and 1974, and is therefore defunct. For that reason, it has not been used to impose tariffs since at least the 1940s.</p> <p>In a more recent <a href=\"https://reason.com/volokh/2026/08/03/prospective-legal-challenges-to-trumps-section-338-tariffs-against-canada/\" target=\"_blank\" rel=\"noopener\">guest post</a>, Georgetown University trade law specialist Peter Harrell explained why the then-planned Canada tariffs are illegal even if Section 338 is <em>not </em>defunct. Trump's tariffs don't meet various requirements for invoking the law. I expect there will be legal challenges to these tariffs, and those challenges will deserve to prevail.</p> <p>This is the latest of a series of efforts by Trump to usurp congressional tariff authority and impose harmful and dangerous trade restrictions that damage the US economy and poison relations with key allies and trading partners, of which Canada is one of the most important. These usurpations include the International Emergency Economic Powers Act (IEEPA) tariffs s<a href=\"https://www.cato.org/commentary/how-supreme-court-spared-america\" target=\"_blank\" rel=\"noopener\">truck down by the Supreme Court</a> in February, in a case I helped bring, the  Section 122 tariffs <a href=\"https://reason.com/volokh/2026/05/07/us-court-of-international-trade-rules-against-trumps-section-122-tariffs/\" target=\"_blank\" rel=\"noopener\"> invalidated</a> by the US Court of International Trade in April (the case has been appealed, and his <a href=\"https://thedispatch.com/article/trump-tariffs-section-301-forced-labor/\" target=\"_blank\" rel=\"noopener\">massive new Section 301 tariffs</a> imposed on the bogus pretext of combating \"forced labor.\"</p> <p>Courts should continue to strike down these power grabs. And, as I explained in my recent <em>Dispatch</em> article on the Section 301 tariffs, they should learn from previous mistakes, and refuse to stay injunctions imposed against illegal tariffs:</p>  <blockquote> <p>Judges can reduce the damage caused by illegal tariffs if they refuse to stay initial rulings blocking them.</p> <p>The Federal Circuit's stay of the initial ruling against the IEEPA tariffs enabled the Trump administration to collect some <a href=\"https://reason.com/volokh/2026/05/20/us-court-of-international-trade-refuses-to-stay-injunction-against-trumps-section-122-tariffs/\" target=\"_blank\" rel=\"noopener\">$166 billion</a> in illegal tariff payments, greatly increasing the harm caused by the policy. Much of the harm caused by illegal tariffs—including lost sales, investment opportunities, and higher prices paid by consumers—cannot be fixed by giving tariff refunds later. Neither can the damage to the U.S. economy. And, as the IEEPA experience shows, even the refunds themselves are not a given. Billions remained <a href=\"https://reason.com/volokh/2026/07/13/tariff-refund-update/\" target=\"_blank\" rel=\"noopener\">unpaid</a> five months after the Supreme Court's decision, and the Trump administration is trying to avoid refunding some of the money.</p> </blockquote>   <p>Blocking illegal tariffs quickly can also <a href=\"https://reason.com/volokh/2026/07/26/how-trumps-tariffs-undermine-us-trustworthiness-and-credibility-and-what-can-be-done-to-stop-it/\" target=\"_blank\" rel=\"noopener\">help reduce the damage to US credibility and relations with trading partners</a>.</p> <p>I would add that Trump's ridiculous trade war with Canada has poisoned relations with one of America's closest and most important allies, and <a href=\"https://thehub.ca/2026/07/14/canadians-fume-americans-shrug-81-of-canadians-see-negative-relationship-with-u-s-while-only-31-of-americans-agree-polling/\" target=\"_blank\" rel=\"noopener\">made traditionally friendly Canadian public opinion overwhelmingly hostile to the US</a>. Damaging our economy and undermining our alliances isn't Making American Great Again. Very much the opposite. The main \"winners\" of this trade war will be America's adversaries, such as China, Russia, and Iran.</p>"},{"title":"Latest alleged GTA 6 leak \"risks tarnishing the reputation of our communities\", say Stop Killing Games after hackers claim pro-consumer motivations","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/latest-alleged-gta-6-leak-risks-tarnishing-the-reputation-of-our-communities-say-stop-killing-games-after-hackers-claim-pro-consumer-motivations","category":"gaming","categoryLabel":"Gaming","wordCount":722,"readingTime":4,"content":"<p>\"Using illegal means to make a point is unacceptable to us\"</p>\n    \n  \n  \n  \n  \n            <p>As you might have seen, there was another alleged <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto-vi\" target=\"_blank\" rel=\"noopener\">GTA 6</a> leak <a href=\"https://www.rockpapershotgun.com/gta-6-footage-once-again-appears-to-leak-online-this-time-because-of-a-group-that-wants-games-like-the-crew-to-have-offline-modes-and-the-end-of-digital-preorders\" target=\"_blank\" rel=\"noopener\">yesterday</a>, with apparent footage of Rockstar's crime sandbox in action spread across the net and in many cases swiftly hit with DMCA takedowns. The group seemingly behind the leakage this time have claimed that their motivations have to do with ranging against anti-consumer practices by publishers, prompting the Stop Killing Games campaign to step in and issue a statement condemning and distancing themselves from the hack.</p>\n<p>If you're out of the loop, the hackers are called Cyberleek and published a manifesto after doing their leakage. In it, they reportedly raged against digital preorders, singleplayer DLC which is already part of the base game but gated off, and called for singleplayer games to come with an \"offline fallback state\" so they can keep going if servers are switched off. The hackerfolk claim to be fighting back against this bad corporate behaviour via a secret project. They've also used the leak to push cryptocurrency in the form of a memecoin, something that definitely doesn't immediately cast serious doubt over their stated benevolent intentions.</p>\n<p>Given Cyberleek's manifesto touches on a number of similar points to those the Stop Killing Games campaign have been pushing to have addressed via new laws aimed at game publishers, it's no surprise they've felt the need to distance themselves and their cause from the hackers.</p>\n<p>\"Do not send these people your money, no matter how much sympathy you may feel for their actions,\" Stop Killing Games wrote in a statement posted to social media. \"This is illegal, and frankly, we feel for everyone at Rockstar having to go through this ordeal again, especially just over a week before Rockstar’s own official 'Extended Look' premieres. Using illegal means to make a point is unacceptable to us and does nothing to protect our right to keep using what we paid for. No matter how strongly you disagree with the decisions of upper management at these companies, there are still thousands of developers who worked hard on this project — and they’re the ones being hit the hardest.\"</p>\n<blockquote><p>A statement on the current GTA 6 Footage leak situation</p><p> Footage from GTA 6 has leaked, and a group of hackers, whom we will deliberately not name here, to avoid giving them further attention, claims responsibility. The footage itself appears to be genuine: Take-Two has already… <a href=\"https://t.co/0rxQFXpdV2\" target=\"_blank\" rel=\"noopener\">pic.twitter.com/0rxQFXpdV2</a></p>— Stop Killing Games Official (@StopKilingGames) <a href=\"https://x.com/StopKilingGames/status/2089892615923622375?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">August 19, 2026</a></blockquote>\n\n<p>\"Channel that frustration into something constructive instead,\" they continued. \"This kind of act is destructive and helps no one, worse, it risks tarnishing the reputation of our communities and our chances to make change. History isn’t on the leaker’s side either: the last person who did this to Rockstar, back in 2022, ended up with an <a href=\"https://www.bbc.co.uk/news/technology-67663128\" target=\"_blank\" rel=\"noopener\">indefinite hospital order</a>. This isn’t a cause worth risking your money or your future on (We seriously doubt that the hack was seriously for that reason).\"</p>\n<p>As with that last GTA 6 hack SKG cited, odds are this one will <a href=\"https://www.rockpapershotgun.com/the-gta-6-leaks-benefit-precisely-no-one\" target=\"_blank\" rel=\"noopener\">benefit nobody in the long run</a>. People might see that GTA 6 does indeed look like a sixth GTA game slightly earlier than they otherwise would have. Rockstar and parent company Take-Two will take whatever action they deem suitable against the hackers. Devs working on GTA 6 will have to endure extra stress in the run up to release. The hackers, on the very slim chance their pro-consumer ideals turn out not to be trolling or hot air, probably won't see any success in threatening publishers into changing course. The only people who benefit will likely be the lawyers who end up hired to oversee whatever legal action comes out of this. Honestly, even the world's lawyers are probably sick of GTA 6 leak drama at this point.</p>\n<p>Hopefully the legal efforts of Stop Killing Games to achieve their goals aren't hampered. If you're looking for ways to genuinely help fight back against big corporate videogames, the staff Rockstar abruptly fired last year have <a href=\"https://www.rockpapershotgun.com/rather-than-calling-for-gta-6-boycott-fired-rockstar-workers-urge-players-to-support-them-in-their-legal-battle-against-the-studio-by-buying-union-merch\" target=\"_blank\" rel=\"noopener\">asked supporters to buy IWGB union merch</a> to aid in financing their legal battle against the company, whom the union have accused of union busting. Rockstar, meanwhile, have insisted the the firings were due to \"confidential information\" being leaked via \"a public forum\".</p>"},{"title":"Meta’s Big Reckoning Is Here","source":"Wired","author":"@wired","url":"https://www.wired.com/story/metas-big-reckoning-is-here/","category":"tech","categoryLabel":"Technology","wordCount":1072,"readingTime":6,"content":"<p>My colleague Paresh Dave and I each spent a day in federal court in Oakland, California, this week, monitoring the latest Meta child safety trial.</p><p>In case you missed it in the spring, Meta (along with YouTube) <a href=\"https://www.nytimes.com/2026/03/25/technology/social-media-trial-verdict.html\" target=\"_blank\" rel=\"noopener\">lost</a> a landmark <a href=\"https://www.wired.com/story/meta-google-youtube-social-media-addiction-trial/\" target=\"_blank\" rel=\"noopener\">social media case</a> in California, in which a jury found the companies liable for harming a young user with certain design features in their apps. Then, earlier this month, Meta was ordered to <a href=\"https://www.wsj.com/tech/meta-ordered-to-pay-942-million-to-address-harm-to-kids-from-social-media-8ba5aab7\" target=\"_blank\" rel=\"noopener\">pay more than $940 million</a> in the state of New Mexico for being a public nuisance and <a href=\"https://www.wired.com/story/meta-child-safety-trial-new-mexico-attorney-general/\" target=\"_blank\" rel=\"noopener\">causing psychological harm</a> to children.</p><p>Now Meta is defending itself in a federal civil trial taking place in the US District Court for the Northern District of California. The plaintiffs in this case are 29 state attorneys general. They’re claiming that Meta violated a federal privacy law protecting children, known as COPPA, by improperly collecting personal information about children under 13 without parental consent. The lead AGs, which span four states—California, Colorado, Kentucky, and New Jersey—also say that Meta made deceptive statements about its platform that were likely to mislead consumers.</p><p>Two specific Meta apps are in focus in this trial: Facebook and Instagram.</p><p>Meta maintains that it satisfied COPPA law requirements in those states, and denies that its statements about how its apps work were deceptive or misleading. It also insists it is protected from liability by Section 230 of the Communications Decency Act of 1996, which essentially says that platforms like Meta aren’t responsible for the content posted on their apps by users.</p><p>I was in the packed courtroom Tuesday to hear opening arguments from both sides, presided over by chief district judge Yvonne Gonzalez Rogers. Per usual, Meta was represented by an army of well-heeled lawyers, who quite ironically kept experiencing technical difficulties with the mic. Megan O’Neill, the deputy attorney general at the California Department of Justice, kicked off the opening statements, laying out how the state AGs believe Meta deliberately hooked kids on its apps and harvested their data.</p><p>O’Neill emphasized that throughout the trial, the jury would be shown just “how many features work both individually and together to keep people in the apps. To draw them in and keep them in for longer. Meta has used these features to draw kids onto the apps, and to keep them coming back.”</p><p>Meta lead attorney Paul Schmidt then laid out the dozens of safety features that have been built into Meta’s apps over the past several years, and he said the company is committed to improving its apps. He also shifted some responsibility onto users, saying there’s no dispute that some kids find their way onto Meta’s apps and that some teens “struggle to manage their time.” And inevitably some people will post negative content on social media apps, Schmidt said.</p><p>Later on Tuesday and then again on Wednesday, the courtroom heard from Arturo Bejar, a former Meta employee and key witness in earlier trials. His main point: Mark Zuckerberg didn’t prioritize youth safety. It was part of company culture during Bejar’s time there that if you had an inkling of an idea for a feature that would spur growth, “you could just test it,” he said. At the same time, he described a culture in which it was “near impossible” to screen products and features for potential harms.</p><p>(On Thursday, the trial was put on pause due to a sick juror.)</p><p>Meta has been embroiled in a remarkable number of scandals over the past decade, many of which have faded from public memory, been chalked up to the cost of doing business, or were settled out of court. The company’s platforms have <a href=\"https://www.wired.com/story/threats-against-politicians-skyrocketed-after-meta-changed-its-speech-rules/\" target=\"_blank\" rel=\"noopener\">played a role</a> in <a href=\"https://www.wired.com/story/meta-hate-speech-lawsuit-ethiopia/\" target=\"_blank\" rel=\"noopener\">stoking violence</a> and <a href=\"https://www.wired.com/story/facebook-militia-organizing-election/\" target=\"_blank\" rel=\"noopener\">swaying</a> <a href=\"https://www.wired.com/story/plaintext-meta-zuckerberg-maga-trump/\" target=\"_blank\" rel=\"noopener\">elections</a>. It has regularly siphoned <a href=\"https://www.wired.com/story/meta-accidentally-let-employees-access-each-others-keystroke-data/\" target=\"_blank\" rel=\"noopener\">personal data</a> from <a href=\"https://www.wired.com/story/meta-smart-glasses-face-recognition-nametag-connections/\" target=\"_blank\" rel=\"noopener\">users</a> in purposefully opaque ways. Not to mention the amount of internal workplace dysfunction at Meta that’s been revealed through depositions, books, and <a href=\"https://www.wired.com/story/mark-zuckerberg-meta-employee-meeting-interrupt-ai/\" target=\"_blank\" rel=\"noopener\">news reports</a> like <a href=\"https://www.wired.com/story/meta-layoffs-bad-vibes-mark-zuckerberg-ai/\" target=\"_blank\" rel=\"noopener\">these</a>.</p><p>All the while, Meta’s formidable technology—the AI that underpins its apps—has successfully kept people hooked. And Meta has monetized its business by keeping their feeds lined with uncannily targeted ads. No amount of scandal can seem to keep Meta’s users away for very long.</p><p>But these recent social media trials have, shall we say, ominous vibes for Meta. So far, Meta’s legal strategy hasn’t proved to be a winning one. Other companies in Meta’s social media cohort, like Snap, TikTok, and YouTube, have opted this year to settle some suits that allege their platforms have harmed kids’ mental health. Meta instead chose to go to trial, only to very publicly lose and pay massive fines.</p><p>It’s not just billions of dollars at stake for Meta in this case (the state AGs are seeking some $200 billion in damages). Meta faces the possibility of having to make changes to core features of its platforms. Those include stricter age-gating and enforcement of existing safety features for younger users, like time limits. Meta might also be compelled to eliminate “likes” and the “endless scroll” for younger users, and offer more algorithmic transparency about how a user’s feed is tuned.</p><p>My colleague Paresh told me after reporting from the courthouse on Wednesday that while a lot of the jurors or potential jurors indicated they barely use Facebook for anything besides Marketplace (relatable!), “they do use Instagram, and many have concerns about their own use or their children’s.” At the same time, Paresh got the sense that the jurors want or expect “parents to have a role in oversight, and not just quickly blame everything on the company.”</p><p>“So there’s something about this trial that could really represent the voice of the zeitgeist around social media usage,” Paresh told me.</p><p>We both agreed that there’s probably no scandal that will make people quit Instagram en masse if they’re already hooked. But if the judge rules in favor of the AGs, based on the evidence presented, then Meta could be held accountable—not for the content it serves on its platform but for <em>how</em> that content is served to younger, more impressionable users. It could force small changes in the company’s growth-at-all-costs ethos and the algorithmic witchcraft with which it juices its apps. And it could change the outcomes for a generation of iPad babies who ostensibly <em>wouldn’t</em> grow up as hooked on Meta’s apps. Maybe.</p><p><em>Paresh Dave contributed to this story.</em></p><p><em>This is an edition of</em> <a href=\"https://www.wired.com/author/steven-levy/\" target=\"_blank\" rel=\"noopener\"><em><strong>Steven Levy’s</strong></em></a> <em><a href=\"https://www.wired.com/newsletter?sourceCode=editarticle\" target=\"_blank\" rel=\"noopener\"><strong>Backchannel newsletter</strong></a>. Read previous newsletters</em> <a href=\"https://www.wired.com/tag/backchannel-nl/\" target=\"_blank\" rel=\"noopener\"><em><strong>here.</strong></em></a></p>"},{"title":"Are You in Danger of Becoming a Robot?","source":"Nautilus","author":"","url":"https://nautil.us/are-you-in-danger-of-becoming-a-robot-1284114/","category":"fun","categoryLabel":"Interesting Reads","wordCount":967,"readingTime":5,"content":"<p>Humans have been performing robot behavior for laughs for at least a century. In the 1936 film <em>Modern Times</em>, Charlie Chaplin <a href=\"https://www.youtube.com/watch?v=6n9ESFJTnHs\" target=\"_blank\" rel=\"noopener\">played</a> a worker who got stuck in factory mode after he left the assembly line, pulling every lever, pushing every button, and twisting every wheel and bolt he saw involuntarily. In the 1960s, the robot dance motored onto dance floors, with its stilted, angular movements and dime stops. Today, <a href=\"https://www.youtube.com/watch?v=z_T81uUeZcM\" target=\"_blank\" rel=\"noopener\">robot dances</a> saturate popular culture and social media: K-pop performances lean into the robot aesthetic, with mechanical choreography, glitchy visual effects and futuristic outfits, and variations of robot dance have <a href=\"https://www.tiktok.com/discover/the-robot-dance-song\" target=\"_blank\" rel=\"noopener\">taken off</a> on TikTok. Some of the performances are so convincing it’s tough to know whether you’re watching a human or a machine.  </p><p>Featured Video</p><p>But the threat of transformation may be more real than we realize. If humans spend too much time connecting with robots, they may start to resemble them in important ways, according to new <a href=\"https://link.springer.com/article/10.1007/s00146-026-03299-w\" target=\"_blank\" rel=\"noopener\">research</a> from the United Kingdom and Scandinavia. The authors of a study in the journal <em>AI &amp; Society</em> propose that when humans interact repeatedly with AI systems that are designed to feel social—particularly chatbots, service robots, and other personal assistants—they may start reshaping themselves to make it easier for a machine or an algorithm to understand them. They call this existential drift “robotoid humanness.” Over time, they say, it could result in a shift not just in communication style but in identity.</p><p>“The risk is not that people will mistake bots for humans, and not that anyone is turning into a robot,” writes study author Inci Toral-Manson, professor of marketing at Birmingham Business School in the U.K., in an email. “It’s quieter than that. It’s that we slowly adjust ourselves to fit what AI can handle.”</p><p>Social bots are already a big part of the lives of many Americans. In the United States, recent surveys found that just over half of adults and about two-thirds of teens had used a chatbot like ChatGPT, Gemini, Claude, or Copilot. And about a third of adults and teens use large language models about once a day. A tiny fraction of teens, about 4 percent, use them “almost constantly.” But it’s less about frequency than about quality, according to Toral-Manson. “Someone who asks a chatbot 20 questions a day about train times is in a very different position from someone who talks to one every night about how their day went,” she says. “The first is using a tool. The second is doing something closer to a relationship, and that’s where the effect we describe would likely show up.”</p><p>The danger lies in the way social bots are built to reward humans over repeated encounters with “frictionless alignment,” Toral-Manson and her colleagues argue. The feedback we get from these bots is fundamentally different from the kind we get from humans, because humans are messy, unpredictable, and will disagree with you, helping you to grow and reconsider who you are, they write. AI systems, on the other hand, are built to be predictable and keep you engaged. “Where human interlocutors furnish heterogeneous and contestable evidence, algorithmic feedback is engineered to converge,” they argue.</p><p><strong>Read more: “<a href=\"https://nautil.us/whats-wrong-with-having-an-ai-friend-1238214\" target=\"_blank\" rel=\"noopener\">What’s Wrong with Having an AI Friend?</a>”</strong></p><p>There are three sets of conditions that will accelerate the mirroring between humans and bots, according to their framework. One is that as algorithmic systems increasingly anticipate what consumers want, they will push a future that’s statistically continuous with the past, reducing the space for actual choice. Second is that if consumers increasingly allow AI to take over writing emails, bios, applications, and dating profiles, they’ll give up authorship over their own lives, creating a larger and more jarring gap between the public self that circulates online and the internal self. And the third is what they call pseudo-intimacy: affirmation on demand disguised as reciprocity. “The consumer is effectively pulled into an interaction that feels like a relationship, which raises the stakes of interpretation, trust, and self-presentation,” they explain.</p><p>Toral-Manson sees early signs that people are shaping themselves to fit their interactions with chatbots. “People change how they speak to a voice assistant,” she says. “They write job applications for the software that screens CVs rather than for a person. Writers now avoid certain words and punctuation marks so they won’t be mistaken for a chatbot.” The people most vulnerable to loss of identity and agency are the ones most exposed to social bots, says Toral-Manson: People who are lonely, unwell, very young, or having a hard time. “Something warm and attentive that’s available at 3 in the morning and never gets bored of you isn’t a trivial thing to be offered.”</p><p>Toral-Manson and her team ground their account in one of the leading cognitive science frameworks for understanding conscious experience called “predictive processing.” That account holds that rather than passively receiving sensory input, the brain is constantly generating expectations about the world and itself and matching sensory impressions against those expectations. According to predictive processing, the self isn’t stable. It’s relational, always being revised as predictions shift, and developing through social encounters that provide “recognition, resistance, and evaluative feedback.”</p><p>While the paper is theoretical, the scientists suggest ways to test their theory. They propose experiments that would measure whether, over repeated conversations with AI, people unconsciously begin to adjust how they express themselves, becoming clearer, more consistent, and more predictable. If the proposed theory is correct, these mirroring effects would be strongest when the robots have the most anthropomorphic and social characteristics. Most of all, the team of scientists is sounding the alarm: The more AI saturates daily life, through service industries and beyond, the more we risk a normalization of “reduced personhood.” </p><p><em>Enjoying </em><a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free </em><a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead image: maryvalery / Adobe Stock</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
