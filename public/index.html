<script>
var articles = [{"title":"Could One Brain Region Be Tied to Feeling Sick All Over? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/could-one-brain-region-be-tied-to-feeling-sick-all-over-1286308/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1444,"readingTime":8,"content":"<p>When you break your foot, the pain is mostly confined to your foot. When you get the flu or another systemic infection, your entire being aches: Lethargy creeps into your limbs, your appetite vanishes, your temperature jags between scorching and chilled to the bone, and you just want to pull the covers over your head.</p><p>This kind of overpowering mind-body malaise is known as “sickness syndrome,” and it’s considered a distinct physiological and emotional state. Scientists believe sickness syndrome helps the body prepare to fight infections, but they don’t fully understand what is happening in the brain when this storm cloud descends.</p><p><strong>Read more: “</strong><a href=\"https://nautil.us/how-to-unlearn-a-disease-235397\" target=\"_blank\" rel=\"noopener\"><strong>How to Unlearn a Disease</strong></a><strong>”</strong></p><p>Recently, a team from across Europe decided to model sickness syndrome by injecting mice with a compound known as prostaglandin E2, or PGE2, which floods the cerebrospinal fluid when the immune system is challenged and is associated with the progression of an inflammatory illness. The researchers mapped resulting changes in the behavior and in the brains of mice.</p><p>When the team of scientists injected the mice with PGE2, the rodents ran fevers, began moving slowly, ate less, and squinted their eyes, a sign of discomfort. But they came back to life before their fevers peaked, which suggests the fever itself was not responsible for their sluggish and low-appetite behavior. Something else was—but what something else?</p><p>The researchers noticed that the injection activated the mice’s body-monitoring network, including the brainstem, the hypothalamus, and the insular cortex, brain regions responsible for managing internal bodily states. They also recorded electrical activity in hundreds of neurons at once in two primary areas of the cortex: The insular cortex, the hub of checking in on the body’s status, and the primary somatosensory cortex, which mostly handles touch and other bodily sensations.</p><p>When they analyzed the patterns they recorded in the neurons, they found that the insular cortex did a better job of predicting sickness than the somatosensory cortex. The finding suggests the brain’s insular cortex keeps a big-picture sense of “I’m sick,” not just a bunch of separate readings of how tired or feverish or achy you are. The team published their <a href=\"http://dx.doi.org/10.1016/j.cub.2026.09.011\" target=\"_blank\" rel=\"noopener\">results</a> recently in <em>Current Biology</em>.</p><p>I spoke with study author Gretel Kamm of King’s College London about what it means to call sickness a whole-brain state and what the findings might tell us about the placebo effect and chronic illness.</p><p><strong>What does it mean to say that sickness is a whole brain state?</strong></p><p>The idea is that when we are sick, many things in our physiology change. We feel awful, we have headaches, body aches, we lose our appetite, we develop a fever. We know that the brain plays an important role in that response, but there are many debates about what that specific role is.</p><p>It could be that different parts of the brain are involved: one part controlling fever, another part controlling appetite, another part controlling pain. But there also might be part of the brain in which all that information is centralized, which generates a universal sense of being unwell.</p><p>Or it could be that all these processes are working in parallel: It’s not only that you have fever, feel awful, lack appetite, it's that you feel something different, which is to be sick. We have evidence that suggests this may be what is happening.</p><p><strong>What kind of sickness does this apply to?</strong></p><p>It’s inflammatory sickness, which can happen either with bacterial or viral infections. But our model is artificial. We don’t use bacteria. We don’t use any viruses. We simply use a compound called prostaglandin E2 that is produced in large amounts when we have viral or bacterial infections in the lungs or other organs. That’s one of the ways the brain knows that an infection is happening.</p><p><strong>Your study focused primarily on how this proxy for infection affects the neocortex. What role does the neocortex play during sickness?</strong></p><p>It’s still unclear. We have evidence that suggests a part of the neocortex known as the insular cortex, on one hand, can generate memories of infections, at least in animal models. It’s also a part of the brain that can help us to associate certain environments with certain immune responses. For example, if you arrive at a place you have been before, it might change how your immune system works.</p><p>There’s also more and more evidence in humans that this part of the cortex plays an important role in what is known as interoception, or an awareness of your internal state, how your body’s doing, if you’re sick or hungry or thirsty. One of the most important things the insular cortex has to do is to keep us alive, so that’s why we decided to try to see what’s going on there.</p><p><strong>Does engagement of the whole brain during sickness help the body recover faster and better?</strong></p><p>Honestly, I don’t have a good answer. There’s more and more evidence that information related to even simple states, like being thirsty, can be found in almost every single part of the brain. Also, with this sickness model, we see that many parts of the brains of mice seem to be activated. But exactly what role the different parts play, or why it’s important for so many parts of the brain to get engaged, there is no good answer as far as I know. There are some hypotheses.</p><p><strong>What are those hypotheses?</strong></p><p>That, for example, when you are sick or thirsty, there are many things that need to be aligned for the brain to help us to survive. We need to stop doing what we are doing. If we are thirsty, we need to refocus on finding water. Maybe we are doing something that allows too much water to escape through evaporation, so we need to stop doing whatever that is.</p><p>The same thing happens with sickness. You refocus, you want to go to bed, you don’t feel like interacting with your friends. Your body temperature changes. The whole body, your motivation, your physiology changes. The whole brain needs to be informed just because you cannot have part of the brain that’s doing one thing and part of the brain that’s trying to do another. Everything needs to be coordinated. So that’s one possibility. Perhaps information is flowing from the neocortex to the rest of the brain so that all of the objectives are aligned and we don’t lose focus.</p><p><strong>Do your findings tell us anything about the placebo effect?</strong></p><p>I never worked with humans, so the direct translation of anything we’ve done so far into humans is pure speculation. But in humans, when we have expectations of something, there is a possibility of a placebo or a nocebo effect. If you are expecting to be sick, if a part of your brain tells you you’re sick, that might influence how you feel.</p><p><strong>How might your findings eventually help us design better treatments for humans?</strong></p><p>This is basic research, but it points to the idea that this particular part of the brain, the insular cortex, might generate a feeling of being unwell. In the future this might be important if you want to find areas to target with medication.</p><p>If you want to say, “Okay, what type of receptors or what type of chemicals are being released by the brain in this area that are generating this representation of being unwell.” Because there may be some pathological conditions in which the brain might think you are sick when you are not. And that might be because the chemistry in that part of the brain is twisted. Maybe it has released too much or too little of certain modulators.</p><p>If there are cases in which people feel unwell, but there is no infection, it’s possible that one of the parts of the brain is not working properly, the insular cortex. Maybe in vulnerable individuals, who feel chronically unwell, the insular cortex is misfiring. Again, this is speculation. We need a lot more information to actually know what is going on. But it might inform research in humans or in patients who are suffering from chronic fatigue or many other diseases that are connected with this chronic feeling of being sick.</p><p>Just be very clear, this is not medical research. There is nothing specific that can be applied to humans at this stage. It’s very basic. It’s another piece of the puzzle pointing to a brain area that might be relevant to a feeling of being unwell in the context of peripheral inflammation or infections, for instance. But future research will tell. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: <a href=\"https://stock.adobe.com/contributor/209028446/yurii?load_type=author&amp;prev_url=detail\" target=\"_blank\" rel=\"noopener\">Yurii</a> / Adobe Stock</em></p>"},{"title":"\"These tools have made it very easy for bad actors to flood things\" - AI video game wikis riddled with errors are taking over, and pushing real fans to the side","source":"Eurogamer","author":"Jay Castello","url":"https://www.eurogamer.net/ai-fan-wikis-errors-complicating-games-culture","category":"gaming","categoryLabel":"Gaming","wordCount":1254,"readingTime":7,"content":"<p>\"These tools have made it very easy for bad actors to crowd out good information...\"</p>\n    \n  \n  \n  \n\n            <p>Recently, I was writing a piece about Nighthawks and wanted to remind myself of some basic information about the companion characters. As I have a thousand times before, I put the question into Google and clicked the first result: the Nighthawks Wiki.</p>\n<p>Of course, wikis aren't necessarily reliable, especially fan-run projects that might not have enough engaged individuals to immediately spot and fix errors. But the \"Nighthawks Wiki\" that I landed on immediately and obviously had deeper issues. Firstly, it wasn't a wiki at all. Rather than being editable by anybody, this website only invited \"corrections\" by email. Secondly, it was full of false information that didn't seem likely to have been added by fans getting their facts slightly wrong, like listing companions and skills that don't exist. It also regularly included unrelated information about the 1981 movie and the Edward Hopper painting, both of the same name, and listed them in its \"sources\" even when they had no relevance to the page in question.</p>\n<p>I don't like to accuse anybody of using generative AI, because its hallmarks are difficult to pin down and are often misattributed to the LLM rather than the human writers it rips off – ask any of us how much we enjoy the em-dash, for example. But, interest piqued by the rate and intensity of apparently made up facts, I managed to trace the domain name to a website building service called Spaceship, which also offers an \"AI Website builder.\" (I emailed the address on the \"wiki\" for comment, but the message bounced.)</p>\n\n<p>A quick search turned up many more similar sites, some of which were actually editable as wikis and others which only called themselves by that name. They typically targeted indie games without gigantic playerbases – the sort of game that people might seek out help with and not find a thriving community ready to provide it.</p><p>It's a problem that Tim Bender, CEO for publishing company Hooded Horse, knows well. Unlike most publishers, Hooded Horse creates wikis for their own games, working with fans to make sure they're well-populated with useful information. But lately the company has had to \"play whack-a-mole\" with AI-generated sites competing for the search results and providing inaccurate information. One of these, for example, appeared for their game Corsair Cove, but was actually part of a <a href=\"https://gamedb.wiki/#wikis\" target=\"_blank\" rel=\"noopener\">more than 20 game scattershot collection</a> operated by a site called GameDB, which the creator <a href=\"https://www.reddit.com/r/TearsofMetal/comments/1vcy23j/discord_ban_for_wiki_creator/\" target=\"_blank\" rel=\"noopener\">admitted to using generative AI</a> to make. \"[Generative AI] enables a run of basically commercial enterprises to mass produce and try to flood the search engine results of games to soak up their traffic,\" says Bender. Attempts to reach GameDB for comment via their public contact email resulted in an error, stating \"the remote server is misconfigured\".</p>\n<p>And the combination of elbowing out legitimate wikis and being full of incorrect information ends up with a lot of frustrated players. \"The whole purpose of putting out a wiki is so when [players] search for help, they end up at a site that helps them. And instead we continually hear from players who stumbled up on these things and got confused and are wondering what's going on,\" says Bender.</p>\n<p>That collection of genAI wikis includes one for the 100-player FPS Wardogs; one of at least five that FlamingMojo, a member of the Independent Game Wiki Network, saw appear in the days after the game's release in September. And he says that the frustration the genAI-created sites causes players also impacts those who are trying to do the legitimate work of creating and maintaining these volunteer-led resources: \"It's hurt our reputation, as players have been misinformed but we haven't created or updated the relevant page yet so they bounce off [wikis] entirely.\"</p>\n\n<p>Fanwikis are already a contested part of games culture. Hosting sites like Fandom dominate the space, and have themselves <a href=\"https://www.theverge.com/2024/2/12/24070287/fandom-wiki-generative-ai-features-quick-answers\" target=\"_blank\" rel=\"noopener\">introduced AI features</a> that had to be rolled back due to their inaccuracies and unpopularity. Many groups have decided to leave these hosts, but those who go independent often <a href=\"https://www.polygon.com/23871726/baldurs-gate-3-bg3-fan-wiki-fextralife/\" target=\"_blank\" rel=\"noopener\">struggle to show up</a> in Google's search rankings underneath the competition from the umbrella sites.</p><p>Whether on a hosting site or independent, fans rarely make any money from the effort they put into their wikis. Either they sacrifice any ad revenue to the bigger platforms, or they pay for their own hosting, which is rarely covered by ads or donations. FlamingMojo, for example, pays for the <a href=\"https://www.eurogamer.net/games/dune-awakening\" target=\"_blank\" rel=\"noopener\">Dune: Awakening</a> Community Wiki out of his own pocket and doesn't run any ads on it.</p>\n<p>But counterintuitively, the low profitability of these kinds of sites only leads to worse outcomes when generative-AI versions are concerned. \"There's not that much ad revenue, but there's going to be a little bit and that's all it takes,\" says Bender. \"Because the barrier is so low, why not just spew out a mountain of it and flood the search results?\"</p>\n<p>It's also possible the generative-AI sites are sometimes aiming for outcomes beyond a little ad revenue. \"Some of them, you don't know what data they're collecting,\" says Bender. In at least one case, a generative-AI site was pointing users to download additional software that offers a paid subscription. The software had been reviewed poorly online and opening the website caused my malware software to kick in and warn me it had been flagged as \"potentially unsafe.\" (None of the sites I attempted to contact for comment responded to my emails.)</p>\n\n<p>Independent wikis also now shoulder a double burden, as generative AI scrapers send huge amounts of traffic their way, potentially affecting site stability. <a href=\"https://analytics.awakening.wiki/share/awakening.wiki?auth=j7Ogjyd0ebDXMcktWm9Dm\" target=\"_blank\" rel=\"noopener\">Publicly available</a> internal data from the Dune: Awakening Community Wiki shows 7m requests in a 30 day period from AI crawlers. (5m of these come from Meta alone. While FlamingMojo is able to tame other scrapers using files that direct them to real pages rather than brute-force trying every link, he's found that Meta simply \"hammers every page multiple times per second\" with no care for \"any sensible ratelimits.\") These scraping waves hit smaller wikis particularly hard, as their maintainers aren't necessarily expecting huge amounts of traffic and don't have the compute capacity to handle huge spikes in visitors.</p><p>\"Independent gaming wikis are in a difficult place,\" says FlamingMojo. As well as competition for SEO, both from corporate sites and now genAI, he says server costs have increased between three- and ten-fold, again due to the impact of genAI. Building a group of people who want to volunteer their time and energy to keep a resource updated isn't easy, although the Dune: Awakening Community Wiki has found success through <a href=\"https://awakening.wiki/Missions\" target=\"_blank\" rel=\"noopener\">gamifying contributions</a>, in affiliation with the developer giving out in-game rewards.</p>\n<p>And, Bender points out, all of this is happening within a much wider context of genAI's impact on the availability of information. \"In a more fundamental way … these tools have made it very easy for bad actors to flood things and crowd out good information which people put dedicated time into. This is just one example of a much broader struggle that, honestly, whatever frustration I feel for this on my end, I'm sure you [journalists] feel at a thousand times that.\"</p>\n<p>But it's possible that, by being one part of the wider issue, fanwiki culture could also hold a sliver of the bigger solution. \"The way we survive the AI pollution is with community,\" says FlamingMojo. \"Many people chipping in a small bit, and feeling a sense of shared ownership.\"</p>"},{"title":"Rivian spinout Also was working on an e-moto project in Kenya — until it walked away","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/11/03/rivian-spinout-also-owns-up-to-mistakes-in-delayed-e-bike-launch/","category":"tech","categoryLabel":"Technology","wordCount":915,"readingTime":5,"content":"<p>Also, the micromobility startup spun out of Rivian in 2025, quietly started and then walked away from an electric two-wheeler pilot project in Kenya earlier this year, as it sought to focus its resources on its consumer e-bike and autonomous vehicle ambitions, TechCrunch has learned.</p>\n<p>The project received grant funding from the Shell Foundation, an independent charity established by the British oil and gas giant Shell plc. A section of the Shell Foundation’s website that has since been removed said the project’s goal was to “enable and de-risk global OEM entry into Africa’s EV market by piloting a locally integrated electric two-wheeler platform in Kenya, with potential to scale across East Africa.”</p>\n<p>According to the deleted section, Also was expected to work on modular battery designs and distributed EV charging, and planned on “developing a purpose-built electric motorcycle for African riders.”</p>\n<p>The opportunity for electric motorcycles seems ripe on the continent, which has a massive two-wheeler market. African mobility company Spiro <a href=\"https://electrek.co/2026/09/15/the-worlds-largest-ev-company-just-partnered-with-an-african-electric-motorcycle-company/\" target=\"_blank\" rel=\"noopener\">recently said</a> it has more than 130,000 electric motorcycles operating across seven countries, along with 2,500 battery-swapping stations. This boom has drawn interest from Chinese mobility companies and investors, which <a href=\"https://electrek.co/2026/09/15/the-worlds-largest-ev-company-just-partnered-with-an-african-electric-motorcycle-company/\" target=\"_blank\" rel=\"noopener\">are pouring resources into the space</a>. </p>\n<p>In a September email, Also told TechCrunch that it had “explored this project” with an unnamed partner, but ultimately “decided to focus on its core roadmap” after completing only “some early-stage work.” Also said the grant funding it received from the Shell Foundation “will follow the project to support its ongoing development,” but declined to offer specifics.</p>\n<p>The Shell Foundation told TechCrunch in an email that the project was “intended to generate evidence on driver income uplift potential, operational performance and commercial viability to deepen the company’s understanding of the market opportunity.” But when TechCrunch asked for more specifics, the Shell Foundation declined, citing a nondisclosure agreement with Also. Days later, the project disappeared from the Shell Foundation’s website.</p>\n<p>During an interview last month at TechCrunch Disrupt, Also co-founder and president Chris Yu said the Kenya pilot project initially made sense given Also’s mission to build small, purpose-built vehicles that are “first and foremost cost-optimized to do the job that needs to be done in a particular market.”</p>\n<p>But other projects took precedence, Yu said, especially the development of small autonomous vehicles — which Also is working on as part of <a href=\"https://techcrunch.com/2026/03/31/rivian-spinoff-also-will-build-autonomous-delivery-vehicles-for-doordash/\" target=\"_blank\" rel=\"noopener\">a partnership with DoorDash</a>.</p>\n<p>“We piloted and ultimately decided, largely because of just urgency and pace around autonomy, frankly, that our attention would be best, in the near term, served fully focused” on that, he said, adding that he thinks there’s a “high chance that autonomy will show up first, and at a broader scale in these types of purpose-built smaller vehicles than at scale in passenger vehicles.”</p>\n<p>Also walked away from the Africa project during a somewhat rocky first year of independence.</p>\n<p>Supply chain problems forced the company to repeatedly delay deliveries of its first product, a premium e-bike called the TM-B, frustrating customers who had reserved one. What made matters worse was Also’s relative silence. The company said little for much of 2026 about when the bikes would arrive — a communication failure its leadership now acknowledges was a mistake.</p>\n<p>“I think we did a pretty poor job communicating to our reservation holders through the summer when they were all waiting, and we got called out for that,” Yu said in the interview. “But I think it’s actually great. It’s really hard to earn the opportunity for people to care, and to tell us what they think, and to help us improve.”</p>\n<p>Getting its first product launch back on track is crucial for Also, which has ambitions far beyond e-bikes. The company plans to sell commercial <a href=\"https://techcrunch.com/2025/10/22/amazon-will-buy-thousands-of-pedal-assist-cargo-vehicles-from-rivian-spinoff-also/\" target=\"_blank\" rel=\"noopener\">cargo bikes to companies like Amazon</a>, including four-wheeled models, and has the partnership with DoorDash. These products are next in the company’s pipeline, Yu said, and represent bigger revenue opportunities.</p>\n<p>But the TM-B comes first. It’s Also’s most visible product to consumers, and its striking design has drawn plenty of curiosity.</p>\n<p>Yu said no single problem was responsible for delaying the bikes, which finally started <a href=\"https://electrek.co/2026/10/04/rivians-delayed-also-e-bikes-are-finally-arriving-to-first-customers-with-mixed-early-feedback/\" target=\"_blank\" rel=\"noopener\">shipping</a> to customers in early October. Instead, Also spent much of the year playing supply chain Whac-A-Mole, a particularly difficult challenge given the TM-B’s complexity. Yu described the bike as “kind of a computer on wheels.”</p>\n<p>At one point, Also found itself competing for the same raw materials used to make printed circuit boards for AI data centers. At other times, the company struggled to navigate certification requirements with different government agencies.</p>\n<p>Yu said the scope of these problems, and the pace at which new ones popped up — almost weekly — made it difficult to give customers reliable updates about why their bikes were delayed.</p>\n<p>“The entire team is like running at a million miles an hour to get these things produced and shipped to customers, and then it’s also really dynamic as well,” he said. “I think what we could have done better is just [say], straight up: ‘We’re chasing down these things, we’ll have an update shortly.’” </p>\n<p>That didn’t happen at first, but Also has steadily improved its communication, earning some goodwill from customers on Reddit. The company will need it as it works through the inevitable kinks that come with a first product. Early customers have already reported problems, including delivery damage and noticeable battery drain.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Will Alito or Thomas Retire if Democrats Win the Senate?","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/02/will-alito-or-thomas-retire-if-democrats-win-the-senate/","category":"law","categoryLabel":"Law","wordCount":880,"readingTime":5,"content":"<p>Will Justice Thomas and/or Alito retire if Democrats take the Senate in tomorrow's election, hoping that the lame-duck Senate will confirm a nominee chosen by President Trump? In recent conversations, I've heard increasing speculation and support for this possibility among some judicial conservatives. And I hear corresponding worry among progressives.</p>\n<p>Both sides think the election may create a brief, very consequential window for a Republican Senate to replace two aging justices. The GOP Senate would have to confirm their replacements before January 3, 2027. <a href=\"https://theconversation.com/republicans-can-confirm-a-supreme-court-justice-if-democrats-take-the-senate-but-at-what-cost-293778\" target=\"_blank\" rel=\"noopener\">There would be political costs and procedural obstacles, but it could be done</a>. Justice Barrett was confirmed by a Republican Senate within a month of her nomination on the eve of the 2020 election.</p>\n<p>The rationale for retirement is straightforward: Don't get trapped in the actuarial straitjacket Justice Ginsburg found herself in when she failed to retire in 2014 (when she was 81). That was her last clear chance of retiring with a Democratic president and Senate.</p>\n<p>Thomas is 78. Alito is 76. Neither has disclosed a serious health risk, and both have indicated they have no plans to retire this year.</p>\n<p>But if Democrats take the Senate (prediction markets currently give them a <a href=\"https://www.cnbc.com/2026/11/02/prediction-market-traders-now-see-nearly-75percent-chance-of-democrats-winning-the-senate.html\" target=\"_blank\" rel=\"noopener\">75% chance</a> to do so) and if they play the sort of constitutional hardball over Supreme Court confirmations that Republicans have played in the past ten years, there's <a href=\"https://www.nytimes.com/2026/10/18/opinion/midterms-congress-trump-democrats.html\" target=\"_blank\" rel=\"noopener\">very little chance the new Senate would confirm any likely Trump nominee.</a> Democrats needn't reject every possible Trump nominee--just those who would be likely to satisfy the conservative legal movement. So the president might not get another Supreme Court appointment before he leaves in January 2029. Calls for the eldest conservative justices to retire would surely intensify.</p>\n<p>It's worse than that for judicial conservatives. If a Democrat wins the White House in 2028, the next opportunity for a Republican president to make an appointment might not come until January 2033. There are some important \"ifs\" packed in there, but they are well within the range of reasonable possibilities.</p>\n<p>In January 2033, Thomas would be 84, Alito 82. Even assuming both remain healthy and active, that's a substantial amount of succession risk for conservatives to accept when they could potentially lock in their seats for another generation this winter.</p>\n<p>A rational justice who prioritizes preserving his seat for something close to his judicial philosophy might well retire. But a rational justice might prioritize (or at least see himself as prioritizing) other things: continued service, jurisprudential influence, institutional reputation, and personal legacy. Justices do not see themselves simply as strategic agents of the political coalitions that produced their appointments.</p>\n<p>For purposes of predicting what Alito and Thomas might do, the Ginsburg example cuts both ways. It illustrates the risks of refusing to retire when one's political allies control the presidency and Senate. At the same time, it illustrates the limits of assuming justices will subordinate their personal preferences regarding tenure, legacy, and judicial responsibility to the interests of that coalition.</p>\n<p>Like Ginsburg, Thomas and Alito would probably resist renewed and intense calls for their immediate retirement. They might figure that:</p>\n<p>(1) one of those additional \"ifs\" won't come to pass—that Republicans will retake the Senate in '28 or retain the White House;</p>\n<p>(2) in any event, they'll outlast whatever period of Democratic control ensues (i.e., the mirror of the Ginsburg gamble);</p>\n<p>(3) they've all but publicly committed themselves to staying on for now (Justice Alito says <a href=\"https://www.bloomberg.com/news/articles/2026-10-06/supreme-court-s-alito-says-democratic-senate-win-won-t-prompt-him-to-retire\" target=\"_blank\" rel=\"noopener\">he will stay on through this term</a> and Justice Thomas may want to <a href=\"https://www.pbs.org/newshour/politics/clarence-thomas-is-now-the-2nd-longest-serving-justice-in-supreme-court-history\" target=\"_blank\" rel=\"noopener\">pass Justice Douglas' record tenure</a>, which would happen in May 2028); and/or</p>\n<p>(4) a lame-duck retirement immediately after an electoral defeat would be seen as an unseemly concession to the sort of overtly political behavior by judges they've long publicly decried.</p>\n<p>Progressives may dismiss this last consideration. Many critics see Thomas and Alito as essentially unscrupulous political actors who wouldn't hesitate to time their retirements in order to preserve another generation of conservative control. But that assumes they understand their own judicial behavior the way their harshest critics understand it. I doubt they do.</p>\n<p>They may regard voting in accordance with their understanding of the Constitution—even when the results consistently advance conservative policy objectives—as fundamentally different from announcing their retirements right after voters have elected a Democratic Senate. On this view, they might think the former is acceptable judicial behavior while the latter is not.</p>\n<p>On the other hand, they could see strategic retirements, which are hardly unprecedented among justices, as distinguishable from the politicized judging they've denounced. Choosing the circumstances and timing of retirement is compatible with their judicial philosophies. And many conservatives might well applaud their retirement decisions as responsible constitutional stewardship.</p>\n<p>But a retirement announced immediately after the election to permit the outgoing Republican majority to confirm a successor, would be unusually conspicuous. Whatever their views about strategic retirement as a general matter, I'm guessing Thomas and Alito would regard the reputation cost to the Court—and to themselves—under these circumstances as too high.</p>\n<p>The irony is that Ginsburg's cautionary example supplies the strongest argument for Thomas and Alito to retire, but also a good reason to doubt they actually will. Justices may be political actors in some respects, but they are not necessarily the political instruments their allies wish them to be.</p>"}];

}

function nextArticle() {

}
