<script>
var articles = [{"title":"Brake problems in GM EVs draw greater federal scrutiny","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/08/24/brake-problems-in-gm-evs-draw-greater-federal-scrutiny/","category":"tech","categoryLabel":"Technology","wordCount":678,"readingTime":4,"content":"<p>General Motors electric vehicles, including ones built in partnership with Honda, are now facing increased scrutiny from the top U.S. auto safety regulator after hundreds of incidents, more than 20 crashes or fires, and at least six injuries.</p>\n<p>The brake problems also extend to some non-EV models, including the Chevy Colorado, GMC Canyon, and the Buick Enclave and Envision. More than 1 million vehicles may be affected.</p>\n<p>The National Highway Traffic Safety Administration (NHTSA) started its investigation in April 2024 after reports of trouble from owners of 2023 model year Cadillac Lyriq vehicles. The agency’s Office of Defects Investigation (ODI) said Monday that it was upgrading this probe to what’s known as an “engineering analysis.” That’s the highest level of investigation that ODI performs, and is often a step the office takes before telling a company to issue a recall.</p>\n<p>The initial complaints ODI received two years ago typically involved owners describing receiving a “Brake System Failure” message when starting up the vehicle, or after coming to a complete stop. GM performed “several internal investigations” into the issue, according to ODI, and determined that the problem was linked to fractures in the spindle of its “eBoost” brake-by-wire system. </p>\n<p>But ODI said on Monday that it kept receiving reports of a loss of braking assistance that were “inconsistent with GM’s description of a spindle failure.” The additional reports described an “immediate loss of brake assist” while a customer was in the process of braking to slow their car down, which the safety regulator said “could result in extended braking distance, which increases the risk of a crash or injury.” ODI said it needs to do a further analysis of the potential for failures in the eBoost system.</p>\n<p>“The safety of our customers is the highest priority for the entire GM team,” the automaker said in a statement. “We take these reports seriously and have conducted a thorough investigation, determining the alleged condition does not present an unreasonable risk to motor vehicle safety. We will continue to cooperate with NHTSA as its investigation proceeds.”</p>\n<p>The eBoost system was introduced in 2019 and gradually rolled out to more models over the years. The system ditches a traditional mechanical link between the brake pedal and the braking system, opting for an electronic one instead. This allows GM to change the brake “feel” in different driving modes. The automaker put eBoost on its most popular EVs, like the Blazer EV, Equinox EV, Cadillac Lyriq, and the Honda Prologue and Acura ZDX, which it made with Honda in a joint venture. The Cruise Origin — the purpose-built electric autonomous vehicle with no steering wheel or pedals, which <a href=\"https://techcrunch.com/2024/07/23/gms-cruise-abandons-origin-robotaxi-takes-583-million-charge/\" target=\"_blank\" rel=\"noopener\">GM abandoned in 2024</a> — also used eBoost.</p>\n<p>In one crash reported to NHTSA, the driver of a 2025 Lyriq said they lost their brakes while trying to pull into a parking space in front of the store. The vehicle drove over the curb and crashed through the store front, coming to rest “mid-way in the store, amidst the furniture and store structure,” according to the driver. </p>\n<p>In another, the driver of a 2024 Blazer EV said they had to “deliberately steer the vehicle into a concrete curb” to slow it down and avoid a “catastrophic intersection collision.” </p>\n<p><em>This story has been updated with a statement from GM.</em></p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Sean O’Kane is a reporter who has spent a decade covering the rapidly-evolving business and technology of the transportation industry, including Tesla and the many startups chasing Elon Musk. Most recently, he was a reporter at Bloomberg News where he helped break stories about some of the most notorious EV SPAC flops. He previously worked at The Verge, where he also covered consumer technology, hosted many short- and long-form videos, performed product and editorial photography, and once nearly passed out in a Red Bull Air Race plane.</p>\r\n<p>You can contact or verify outreach from Sean by emailing <a href=\"mailto:sean.okane@techcrunch.com\" target=\"_blank\" rel=\"noopener\">sean.okane@techcrunch.com</a> or via encrypted message at okane.01 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/sean-okane/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"The court’s clearly established problem","source":"SCOTUSblog","author":"Daniel Harawa","url":"https://www.scotusblog.com/2026/08/the-courts-clearly-established-problem/","category":"law","categoryLabel":"Law","wordCount":932,"readingTime":5,"content":"<p>If a person is convicted of a crime in state court, they can petition a federal court for relief by claiming that their conviction violates the federal constitution. However, the federal court does not get to consider that claim afresh. Rather, the Antiterrorism and Effective Death Penalty Act of 1996 <a href=\"https://www.law.cornell.edu/uscode/text/28/2254\" target=\"_blank\" rel=\"noopener\">requires</a> federal courts to defer to the state court’s ruling on the federal constitutional claim so long as it was not “contrary to, or involved an unreasonable application of, clearly established Federal law, as determined by the Supreme Court of the United States” or “based on an unreasonable determination of the facts in light of the evidence presented in the State court proceeding.”</p><p>Twice this year, the Supreme Court has summarily reversed a federal court of appeals’ grant of such relief for failing to give adequate deference to state courts. In January, it was the U.S. Court of Appeals for the 4th Circuit’s decision in <a href=\"https://www.scotusblog.com/cases/klein-v-martin/\" target=\"_blank\" rel=\"noopener\"><em>Klein v. Martin</em></a>, where the court asserted that the circuit court’s decision was “not consistent with the deference that AEDPA requires.” Then in June, it was the U.S. Court of Appeals for the 2nd Circuit’s turn in <a href=\"https://www.scotusblog.com/cases/mccarthy-v-hernandez/\" target=\"_blank\" rel=\"noopener\"><em>McCarthy v. Hernandez</em></a>, where the court pointed back to <em>Klein </em>to observe that, in its view, sometimes lower courts have “strayed too far from the modest role that AEDPA prescribes,” and reiterated that when they do, it will “summarily reverse[] their decisions.”</p><p>But telling lower courts to defer is easier than telling them what they are supposed to defer to. Thirty years after AEDPA’s enactment, what counts as “clearly established Federal law” remains remarkably unclear.</p><p>If that phrase sounds familiar, it should. It is a close cousin of the “clearly established law” requirement in qualified immunity; a doctrine criticized from every direction for its incoherence, including for how “<a href=\"https://judicature.duke.edu/articles/qualified-immunity-a-shield-too-big/\" target=\"_blank\" rel=\"noopener\">inherently amorphous and unprincipled</a>” the clearly established law standard is. As U.S. Court of Appeals for the 11th Circuit Judge Charles Wilson <a href=\"https://www.law.nyu.edu/sites/default/files/ecm_pro_065089.pdf\" target=\"_blank\" rel=\"noopener\">lamented</a>, “there is remarkably little consensus among the United States circuit courts concerning how to interpret the term ‘clearly established.’”</p><p>Now imagine qualified immunity, only harder. That is the problem federal courts face under AEDPA.</p><p>First, the universe of relevant precedent is dramatically smaller. Unlike in qualified immunity, where it is routinely assumed that circuit precedent can create clearly established law, federal courts of appeals cannot clearly establish law for purposes of habeas review. AEDPA expressly limits the inquiry to federal law “as determined by the Supreme Court.” And the Supreme Court decides only a tiny fraction of the cases presented to it (with the number <a href=\"https://www.scotusblog.com/2026/08/the-latest-on-the-mail-in-voting-and-ballroom-battles/\" target=\"_blank\" rel=\"noopener\">seeming to dwindle by the term</a>), leaving countless scenarios unaddressed by the only body whose decisions count.</p><p>Second, the court has given lower courts conflicting instructions about how specifically its precedent must speak. In its 2022 decision <a href=\"https://www.scotusblog.com/cases/brown-v-davenport/\" target=\"_blank\" rel=\"noopener\"><em>Brown v. Davenport</em></a>, it warned that its “holdings that speak only at a high level of generality” cannot supply a ground for habeas relief. Yet less than three years later, in <a href=\"https://www.scotusblog.com/cases/andrew-v-white/\" target=\"_blank\" rel=\"noopener\"><em>Andrew v. White</em></a>, the court said that “[g]eneral legal principles can constitute clearly established law for purposes of AEDPA so long as they are holdings of this Court.” It’s hard to reconcile these two ideas.</p><p>Indeed, lower-court judges have been begging for guidance since AEDPA was enacted. More than 25 years ago, U.S. Court of Appeals for the 3rd Circuit Judge Theodore McKee <a href=\"https://scholar.google.com/scholar_case?case=460348044835026599&amp;q=171+F.3d+877+&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">decried</a> “the analytical minefield lurking beneath the surface of AEDPA,” including the “unresolved issue” of “the level of specificity the Supreme Court must use in fashioning a rule in order for it to be applied as ‘clearly established Federal law.’” The U.S. Court of Appeals for the 9th Circuit lodged a similar complaint, <a href=\"https://scholar.google.com/scholar_case?case=1135756911039366496&amp;q=200+F.3d+597&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">noting</a> that the “Supreme Court has not defined ‘clearly established’ in the AEDPA context.”</p><p>A quarter-century of decisions has not supplied a satisfying answer. The court has <a href=\"https://scholar.google.com/scholar_case?case=15030129295879755344&amp;q=squarely+address+the+issue+AEDPA&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">said</a> that its precedents must “squarely address[] the issue,” and that lower courts <a href=\"https://scholar.google.com/scholar_case?case=15501756263675033633&amp;q=%E2%80%9Csharpen+a+general+principle+of+Supreme+Court+jurisprudence+into+a+specific+legal+rule%E2%80%9D+&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">cannot</a> “sharpen a general principle of Supreme Court jurisprudence into a specific legal rule.” But it has <a href=\"https://scholar.google.com/scholar_case?case=14658207443609957147&amp;q=%E2%80%9Cto+wait+for+some+nearly+identical+factual+pattern+before+a+legal+rule+must+be+applied.%E2%80%9D+&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">also said</a> that AEDPA does not require courts “to wait for some nearly identical factual pattern before a legal rule must be applied.” And it has even <a href=\"https://scholar.google.com/scholar_case?case=6222938692870218811&amp;q=%E2%80%9Cthe+difference+between+applying+a+rule+and+extending+it+is+not+always+clear.%E2%80%9D&amp;hl=en&amp;as_sdt=6,33\" target=\"_blank\" rel=\"noopener\">acknowledged</a> – without guidance – that “the difference between applying a rule and extending it is not always clear.”</p><p>That concession captures the problem. Every legal rule can be described at different levels of generality, and a judge confronting a new set of facts has to decide whether they are applying an existing holding or extending it. At the same time,<em> </em>the consequences of guessing wrong are not evenly distributed. Define Supreme Court precedent too narrowly, and a prisoner loses, usually without further review. Define it too broadly, grant relief, and a court of appeals invites a <a href=\"https://www.scotusblog.com/2026/02/nuts-and-bolts/\" target=\"_blank\" rel=\"noopener\">summary reversal</a>. The court has already <a href=\"https://www.scotusblog.com/2026/03/the-justices-troubling-message-to-lower-courts/\" target=\"_blank\" rel=\"noopener\">told</a> lower-court judges which kind of error it’s watching for.</p><p>The Supreme Court could fix this. Instead of summarily reversing grants of habeas relief, the court could explain how <em>Brown</em> and <em>Andrew</em> fit together and give substance to the clearly established federal-law standard rather than leaving lower courts to guess.</p><p>Until it does, the cost of the ambiguity falls where it has always fallen: on state prisoners who claim to be languishing in prison in violation of the federal constitution and the federal judges who agree. For a statute built around clearly established law, and with the consequences so dire, that is an awful lot left unsettled.</p><p><strong>Recommended Citation: </strong>Daniel Harawa, <em>The court’s clearly established problem</em>, SCOTUSblog (Aug. 24, 2026, 9:30 AM), https://www.scotusblog.com/2026/08/the-courts-clearly-established-problem/</p>"},{"title":"The Sinking City 2 ditches the thinky stuff for Resident Evil style horror, but I'm yet to decide if this expert mystery developer's latest is truly better for it","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/the-sinking-city-2-now-playing","category":"gaming","categoryLabel":"Gaming","wordCount":1233,"readingTime":7,"content":"<p>Murder moist horrid.</p>\n    \n  \n  \n  \n\n            <p>There's a bit, early on in <a href=\"https://www.eurogamer.net/games/the-sinking-city-2\" target=\"_blank\" rel=\"noopener\">The Sinking City 2</a>, where you enter the waterlogged Miskatonic University. As you teeter around toppled shelves and slalom through sodden tomes, a siren begins to blare. It's the last call for survivors hoping to flee the doomed city of Arkham, after which only a few determined souls remain. It feels like a world in the process of transition as we join it, and that's reflective of the series too.</p>\n<p>The original Sinking City, released back in 2019, saw Ukrainian developer Frogwares building on its detective game roots (the studio is perhaps best known for its Sherlock Holmes adventures) to create a Lovecraftian tale of cosmic horror with an investigatory open-world focus. Its sequel retains the evocative 1920s time period and moody sunken metropolis setting, but it's all change from there. We've a new protagonist in paranormal gumshoe Calvin Rafferty, and the action's now shifted from Oakmont, Massachusetts to Arkham. But the changes run deeper; this follow-up massively downplays the original's deductive spirit and massively ups its combat, shifting firmly into the realm of survival horror. It's a risky gamble - especially given Frogwares' previous struggles to deliver satisfying combat - but seven or so hours in, it's definitely winning me over.</p>\n<p>Not that The Sinking City 2 doesn't find ways to impress from the off. It is, for one, gorgeous. It's a looker from your first glimpse of Arkham's skyline - a tangle of 1920s billboards, huddled brownstone apartments, raised railway lines, historic monuments, and New England spires - and it's equally striking, albeit in a rather soggier, more dilapidated fashion, as you take to the flooded streets in your dinky little boat, watching the buildings drift by. It's a world full of period flourishes - from vacuum tube radios and grandiose art deco lobbies to hinge-bonnet automobiles and half-submerged tram cars. And because it's a city in the grip of cosmic forces, there's room for stranger sights too.</p>\n\n<p>It's an evocative backdrop to The Sinking City 2's retooled action, beginning with a trip to Miskatonic University and the search for an ancient rite that might wake Rafferty's lover from her endless slumber. And while the sequel's boaty business initially suggests a return of its predecessor's semi-open-world tootling, it's all a bit of a ruse, and it quickly turns into a leaner, more focused kind of adventure. Early on, momentum is halting as Rafferty traverses Arkham's accursed floodwaters; charting a linear path until he reaches the next impasse, at which point the shift to survival horror, with all its familiar trappings, is immediate.</p><p>Out of the water, you'll prowl shadowy interiors and rain-drizzled exteriors in an endless search for the usual macguffins - fuses, cogs, keys, and key-like things. You'll hoover up conveniently discarded health and ammo (and gather resources to craft your own, although the crafting system feels a little superfluous here). You'll see faint glimmers of the series' deductive past-life too as you uncover clues to solve puzzles - find the correct sequence of glyphs to activate an arcane contraption, say, or deduce a numerical padlock combination - but it's lightweight stuff, and they're rarely stumpers. And while some clues hint at optional upgrades in previous areas, loosening up the rigid early progression, the balance undoubtedly leans heavily toward action.</p>\n\n<p>1 of 15 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>The good news is Frogwares seems to have cracked the fundamentals of combat this time. There's nothing revelatory about its gunplay - pull a trigger to focus your shot, pull another to fire, do a stomp attack when an enemy goes down, or a stumble-dodge when things get hairy - but it's responsive. And things <em>will</em> get hairy. Arkham's monsters - corpses reanimated by worm-like hosts, scurrying spidery horrors - are skittish things. They'll lurch graspingly forward, dash away around corners then come bounding back, or simply fling themselves at you, making it tricky to hit their weak points or land a toppling knee shot, without burning through ammo.</p><p>And because we're firmly in survival horror mode, tension is built through limitations. Inventory space is small; ammo, health restoratives, and crafting resources are scarce (side note developers: if you're making a game where your health indicator is a massive pulsating red screen border and I'm going to be short on health most of the time, <em>please</em> let me turn the effect off in the settings). And you never quite feel properly equipped for any given situation. It's a familiar survival horror trick, of course, but The Sinking City 2 feels perhaps a little overzealous in its hobbling. Chuck in other quirks - its <em>slightly too</em> confined spaces, its untelegraphed rear ambushes - and there's some early frustration while you figure your way around combat's somewhat counterintuitive rhythms.</p>\n\n<p>1 of 15 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Gradually, though, as I learned to adopt a less fleeted-footed, more doggedly stolid approach to combat, it started to click (boons and weapon upgrades also help), and things shift for the better elsewhere. The oddly staccato pacing of those opening hours dissipates as Frogwares begins to play in larger spaces - a crumbling art deco hotel is an early highlight, and a surprise second-act shift away from the city to a labyrinthine hospital brings a more exploratory focus. And as the pace settles, the mood intensifies into a surprisingly effective bit of horror.</p><p>But even before Frogwaves properly finds its groove, there's plenty to admire in its craftsmanship. Routes might be relatively constricted early on, but they're wonderfully evocative in their roaring 20s dilapidation, winding through the city in unexpected ways: a bar stop-off spills into a traffic-strewn street and a nearby firestation; a graveyard path snakes its way into an adjacent printing house before tumbling out into a waterlogged back alley, up a fire escape, and into neighbouring buildings. And the gentle worldbuilding - the notes, the environmental tableaus, even bits of item flavour text - brings a melancholy life to Arkham as Frogwares seeds snapshots of those who left and those who stayed behind.</p>\n\n<p>1 of 15 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>But as doomed as The Sinking City 2's world may be, there's a lovely sense of fun throughout. One early set-piece sees you charging through a burning building, leading you toward a hole in a wall where a blinking bar sign's few remaining letters amusingly flash the word \"RUN\". A little later, a brief dalliance with an elder god and its hooded worshippers in an abandoned church is an entertaining bit of cosmic silliness (Frogwares very much leans into the mythology's pulpier side here), and I honestly can't get enough of the the Weird Tales-inspired radio broadcasts, read by an actor who appears to be channeling David Lynch from beyond the grave.</p><p>I might only have played half of it so far, but already The Sinking City 2 feels all kinds of transitional. It's a world in shift, and a series in flux - eventually finding a more confident rhythm as it shakes off its first-act ties to its waterlogged past and more fully commits to survival horror, even if I do miss some of the original's more pronounced deduction. And it feels like a transition for Frogwares too. A few wobbles aside, it's a boldly assured departure for the studio, and I'm fascinated to see where the journey takes it - and us - as we venture further into unknown places.</p>"},{"title":"Consider the Oyster Bar","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-food-scene/consider-the-oyster-bar","category":"fun","categoryLabel":"Interesting Reads","wordCount":1203,"readingTime":7,"content":"<p>Lately, I have been considering the oyster. It’s a creature whose life, as M. F. K. Fisher so indelibly put it, is “dreadful but exciting,” and whose arc of birth, existence, death, and consumption have proved to be fertile terrain for humanistic contemplation. But my own recent engagement has been less of an intellectual exercise than a physical one: I have stared down so many oysters this summer, freshly shucked and gleaming. There are many reasons to love oysters on the half shell, but, for me, the most vivid is the concentration they demand, at every step: the selection, the inspection, the ritual application of whatever little sauce or condiment, the spill-avoidant elevation from dish to mouth, the slurp, the swallow. It’s an enlivening, re-embodying thing, eating an oyster, a disruption to the semi-mindlessness that so often accompanies eating, especially at a bar, or with a drink, or alone. You are never alone when you have a chilled, brine-bright oyster glistening snottishly and beautifully before you.</p><p>I’ve also been considering oyster bars, and this I mean in the more philosophical sense. A raw oyster, I would argue, shouldn’t be considered a food; it’s a drink. The salinity, the lightness, the slipperiness, even its intoxicating effects: one raw oyster down the hatch and you feel as if you’ve zipped up to a new plane of liveliness. An oyster is one part joyous placebo and one part megadose of zinc and Vitamin B12. The tongue of the oyster resting in its shell, the ribbons of mineral color, the leaflike veining, the over-all glossy strangeness of the naked, alien entity: it belongs at a bar, with all the other alchemical things one can sip and shoot and gulp. I’ve lost count of how many raw bars and oysters bars and seafood shops have opened in the city in recent years—there was <a href=\"https://www.newyorker.com/culture/the-food-scene/penny-the-glittering-pleasure-of-a-perfect-raw-bar\" target=\"_blank\" rel=\"noopener\">Penny</a>, <a href=\"https://www.newyorker.com/culture/the-food-scene/crevette-makes-great-seafood-look-easy\" target=\"_blank\" rel=\"noopener\">Crevette</a>, the New Orleanian <a href=\"https://www.newyorker.com/culture/the-food-scene/strange-delight-channels-new-orleans-in-all-the-right-ways\" target=\"_blank\" rel=\"noopener\">Strange Delight</a>, the brand-new Capitaine, the return of Mary’s Fish Camp—but each new one set off a ripple of excitement for me: the shuffling sound of the ice, the creak and slap of the shucking knives against the shells, the scent of oyster liquor in the air, and that certain, ubiquitous, sleek aesthetic they all seem to share: clean lines, shiny metals, cool marble, all textural reflections of the menu’s star ingredients.</p><p>I felt the familiar little shiver of delight not too long ago, when a seafood tower was set down before me at Zig Zag Oyster Bar, a perfect little jewel box that opened earlier this summer, on the border between Crown Heights and Prospect Heights, in Brooklyn. The space is the former location of Bar Meridian, and the same shiny, U-shaped bar still takes up the bulk of the tiny, high-ceilinged corner room; outside, beyond wall-size sliding glass doors, a similar spill of café tables blankets the broad sidewalk. The restaurant is run by Nialls Fallon, Nick Perkins, and Leah Campbell—the same team behind such note-perfect spots as Hart’s, Cervo’s, and Eel Bar—and they’ve built Zig Zag as a petite and well-considered temple of brine, casual and chic. The trio has become known for a passionate fluency in seafood (even their chicken-oriented restaurant, <a href=\"https://www.newyorker.com/magazine/2019/04/01/at-the-fly-rotisserie-chicken-is-the-ultimate-bar-food\" target=\"_blank\" rel=\"noopener\">the Fly</a>, has a gloriously anchovy-centric Caesar salad), and an oyster bar feels like a natural next move.</p><p>The seafood tower is a double-decker, with oysters on the lower level (recently, it was a selection of tiny, deep-cupped Sweets from Prince Edward Island, and hulky, subtle Long Island Xanadus), and an array of cooked, chilled shellfish above: mussels dotted with punchy salsa verde; steamed clams marinated in a black-peppery escabeche; a tangle of pink-ribbed cocktail shrimp under snowy shavings of fresh horseradish. The mountain of seafood comes with a little sidecar of very thin, very crispy potato chips, seemingly for the hell of it, and a bottle of tart, fiery homemade hot sauce. For nearly double the price, you can make the tower “deluxe,” with added delicacies like crab legs and lobster salad, though I’m not sure if it’s worth it, given everything else the menu has to offer. There are fillets of oily, complex <em>anchodinhas</em> draped over points of generously buttered toast; a sweet and subtle whitefish salad, confettied with multicolored summer tomatoes. The restaurant’s postage-stamp-size basement kitchen has no gas line and no vent hood, but it does have enough electric cooking equipment to bring a crock of crab dip to a broily sizzle. The result is a dish of frankly miraculous constitution, seemingly made with nothing other than crab—it’s got to be a zillion dollars’ worth, at least—and a pinch of spices and salt.</p><p>You could, in theory, have a full meal at Zig Zag. There are a few sizable plates, most notably a half chicken. The kitchen’s electrical oven roasts them during the daytime; they’re then chilled and served cold, with hot sauce, a ramekin of mayonnaise, and a pile of pickle spears. This is a dish that is perhaps too clever for its own good: eating it is satisfying, in a desultory, picking-at-leftovers kind of way, but that’s not generally the feeling I’m hoping to summon when I’ve put an effort into actually leaving the house. More pleasing—even more so, I’ll bet, once the swampy summer weather starts to break—is a dish of boiled potatoes swimming in a horseradish vinaigrette, which pairs unexpectedly well with a platter of country-ham slivers and whisper-thin mortadella ribbons. But, on the whole, Zig Zag is a place for concerted tasting more than chowing down: the nibbled crab-dipped cracker, the picky-bits pleasure of a forkful of lentil salad or a daily special of oil-poached tuna with summer tomatoes. This is oyster eating, even if you’re not eating oysters.</p><p>The best accessories to oyster eating are those that amplify the bivalve’s puckery, oceanic qualities rather than counterbalancing them. Condiments should be sharp—a savory jolt of mignonette or vinegary hot sauce, an austere spritz of lemon—and the same goes for drinks. I suppose this is a large part of why oysters are indelibly attached to the Martini, to the point of cliché; loving oysters and Martinis is as inevitable as loving cake and ice cream, or a slice of pizza and an ice-cold Coke. Zig Zag offers a tight, crisp Martini, gin-based, with a splash of orange bitters, but I’m drawn to some of the list’s less predictable companions to a dozen on the half shell: a spicy Bloody Mary, say, or the Citrus, a non-alcoholic take on a Daiquiri that’s tart and bracing.</p><p>So how are the oysters? That’s the thing. For all their infinite variation—kelpy and ferric Wellfleets, pearly Moonstones, saline Glidden Points, melon-sweet Beausoleils, brawny Malpeques, a thousand more—an oyster is really a binary proposition: it’s good or, God help us, it isn’t. The offerings of any decent oyster shucker will change according to the seasons and the tides and the shoals and the shipping lines and the harbor freight and the rush-hour traffic on the interstate. It’s whatever seems best and is best at hand, so there’s rarely any point in walking through the door with a plan. Zig Zag, tidy and efficient, offers just a couple of options at a time. Just show up, and trust them. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
