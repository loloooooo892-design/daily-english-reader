*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

}

}

}

  font-size: 0.8125rem;

  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;

}

  font-size: 0.8125rem;

.swap-btn:hover {

.swap-counter {

  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {

}

.article-body a {

.footer {

.footer a {

.archive-link {

<script>
var articles = [{"title":"Massive Morrowind mod Tamriel Rebuilt's Poison Song expansion is out now, complete with new quests to join Great House Indoril and the Ordinators","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/massive-morrowind-mod-tamriel-rebuilts-poison-song-expansion-is-out-now-complete-with-new-quests-to-join-great-house-indoril-and-the-ordinators","category":"gaming","categoryLabel":"Gaming","wordCount":589,"readingTime":3,"content":"<p>Plus the scenic Orethan Fields region to explore</p>\n    \n  \n  \n  \n\n            <p>Tamriel Rebuilt, the <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-iii-morrowind\" target=\"_blank\" rel=\"noopener\">Morrowind</a> modding project gradually adding the province's mainland to The Elder Scrolls 3's Vvardenfell-centric map, has gotten a fresh expansion over the weekend. Dubbed Poison Song, it's the long-teased update which lets you join House Indoril, the great Dunmer house the Neravarine's namesake Indoril Nevevar belonged to belonged. It'll also let you join the Temple Ordinators, Morrowind's golden-masked lawkeepers, and explore a new region full of \"lush gardens and bountiful fields\".</p>\n\n<p><a href=\"https://www.rockpapershotgun.com/come-nerevar-morrowind-mod-tamriel-rebuilts-next-expansion-will-finally-let-you-join-house-indoril\" target=\"_blank\" rel=\"noopener\">Teased</a> towards the end of last year, <a href=\"https://www.tamriel-rebuilt.org/content/poison-song-released\" target=\"_blank\" rel=\"noopener\">Poison Song</a> adds the Orethan Fields region on the outskirts of Mournhold, the Dunmer capital and home of Almalexia in the base game's Tribunal DLC. Home to the settlement of Othrenis and the chapel of Nanaav, the Orethan Fields look to be a rather Japanese-inspired locale full of posh estates judging by the trailer, with manicured greenery and cherry blossom trees offering a change of pace from the largely rocky and dusty envions found outside of Vvardenfell's coasts.</p>\n<p>In terms of new things to do, there's the chance to finally join Great House Indoril, which the modders have given its own questline similar in scope to that of the three joinable houses of the base game. \"For centuries, Great House Indoril, the Tribunal Temple’s firmest supporters, served as the rightful hegemons of Morrowind, tenders to the garden-that-is-Resdayn,\" reads the setup blurb for Poison Song's Indoril plot. \"Ever since the hated Armistice, however, the Indoril have found themselves scattered and adrift, the proud lords having retreated into self-interest, paranoia, or nihilism. Rumblings on holy Vvardenfell, however, have convinced Indoril Sandil – keeper of the chapel of Gorne – that time is ripe for a change. Humor his fascination with the forbidden heresies of the Ashlanders, and you may convince him that there’s more to you than meets the eye.\"</p><p>Meanwhile, if you're more interested in being given a cool mask and a license to help keep the peace on the streets, the expansion adds quests letting you join the Ordinators. There are three different orders of Ordinators (try saying that fast three times) you can throw your lot in with. The Order of Doctrine, all about \"[teasing] apart the strands of orthodoxy and heresy\" are based in Orethan Fields. If you head to Almas Thirr instead, you can join either the Order of the Watch or the <a href=\"https://www.rockpapershotgun.com/games/order-war\" target=\"_blank\" rel=\"noopener\">Order of War</a>, with the former's missions concerning a conflict between the Indoril and Hlaalu houses, while the latter are more focused on helping you prepare for your main quest battle with Dagoth Ur.</p>\n<p>Alongside the new additions, the expansion also revamps the Red Mountain-ravaged Sundered Scar region and the quests in Imperial-dominated city of Old Ebonheart.</p>\n<p>\"Beyond Poison Song, the Tamriel Rebuilt team remains ever busy building further sections of the Morrowind mainland,\" Tamriel Rebuilt dev Sultan of Rum wrote of the team's plans now this expansion is out of the door. \"Next up will be Wealth Beyond Measure, the final expansion in our Hlaalu arc. Players should look forward to a filled out southwestern quadrant of Morrowind along with the metropolis of Kragenmoor. Level design for this expansion is mostly complete and questing progresses. Further beyond, our eyes turn to the first House-Redoran-themed expansion in Morrowind’s northwest, which is currently deep in the level design phase.\"</p>\n<p>If you fancy giving Poison Song a go, Tamriel Rebuilt is now available on both <a href=\"https://www.nexusmods.com/morrowind/mods/42145?tab=description\" target=\"_blank\" rel=\"noopener\">Nexus Mods</a> and <a href=\"https://www.gog.com/en/game/tamriel_rebuilt\" target=\"_blank\" rel=\"noopener\">GOG</a>. You'll need to own a copy of Morrowind with all its DLCs in both cases.</p>"},{"title":"Waffle House Teleporter Gregg Phillips Is Still on the Trump Administration’s Payroll","source":"Wired","author":"@wired","url":"https://www.wired.com/story/waffle-house-teleporter-gregg-phillips-is-still-on-the-trump-administrations-payroll/","category":"tech","categoryLabel":"Technology","wordCount":718,"readingTime":4,"content":"<p>Gregg Phillips, an <a href=\"https://www.wired.com/story/a-maga-countys-top-election-official-wants-to-hire-election-denial-superstar-tina-peters/\" target=\"_blank\" rel=\"noopener\">election denier</a> who once <a href=\"https://edition.cnn.com/2026/03/20/politics/fema-official-gregg-phillips-violent-rhetoric-teleported-kfile\" target=\"_blank\" rel=\"noopener\">claimed he teleported to a Waffle House</a>, says he is still working in the <a href=\"https://www.wired.com/story/the-supreme-courts-mail-in-ballot-ruling-is-a-step-toward-chaos-in-the-midterms/\" target=\"_blank\" rel=\"noopener\">Trump administration</a>, after he was <a href=\"https://www.cnn.com/2026/06/25/politics/fema-official-gregg-phillips-ousted-agency\" target=\"_blank\" rel=\"noopener\">reportedly removed</a> from his influential role overseeing the <a href=\"https://www.wired.com/story/femas-shadow-administrator-was-paid-by-a-doge-members-startup-for-months/\" target=\"_blank\" rel=\"noopener\">Federal Emergency Management Agency’s</a> emergency response efforts in June.</p><p>While it remains unclear what Phillips has been working on in the administration since <a href=\"https://www.washingtonpost.com/climate-environment/2026/06/25/gregg-phillips-stepping-away-fema-role/\" target=\"_blank\" rel=\"noopener\">stepping away</a> as head of the Office of Response and Recovery, on Sunday he <a href=\"https://truthsocial.com/@greggphillips/posts/117146178903857991\" target=\"_blank\" rel=\"noopener\">wrote on Truth Social</a>, “I have been in the admin since last year. I’ll be leaving soon to rejoin the fight.”</p><p>One day later, he was <a href=\"https://x.com/EdMartinDOJ/status/2092170340201803966\" target=\"_blank\" rel=\"noopener\">pictured</a> at a Department of Justice building alongside Ed Martin, the former US pardon attorney who President Donald Trump last week <a href=\"https://truthsocial.com/@realDonaldTrump/posts/117134908401668938\" target=\"_blank\" rel=\"noopener\">announced</a> would be departing the administration to “fight legal battles for the upcoming midterm election.”</p><p>“Enjoyed the visit with our friend Ed Martin today in DC,” Phillips <a href=\"https://truthsocial.com/@greggphillips/posts/117151556926394078\" target=\"_blank\" rel=\"noopener\">wrote on Truth Social</a>. “Haters are gonna hate this.”</p><p>Martin and the Department of Justice did not respond to WIRED’s requests for comment about Phillips’ role in the administration. Phillips declined to comment.</p><p>A FEMA spokesperson directed WIRED to a statement it issued in June saying Phillips was “taking leave for personal reasons.” When asked if Phillips was still employed by the agency and still on leave, the agency didn’t respond.</p><p>Phillips is on administrative leave, according to the White House, which also confirmed that Martin is still working in the administration until September 4. Federal employees on <a href=\"https://www.opm.gov/policy-data-oversight/pay-leave/leave-administration/fact-sheets/administrative-leave/\" target=\"_blank\" rel=\"noopener\">administrative leave</a> are entitled to full pay and benefits.</p>Got a Tip?Do you know something we should know? We’d like to hear from you. Using a nonwork phone or computer, contact the reporter securely on Signal at DavidGilbert.01.<p>Phillips has long promoted baseless allegations of widespread voter fraud, claiming in 2016 that <a href=\"https://edition.cnn.com/2017/01/27/politics/gregg-phillips-voter-fraud-donald-trump-cnntv/index.html\" target=\"_blank\" rel=\"noopener\">more than 3 million noncitizens voted</a> in the presidential election, robbing Trump of winning the popular vote. Days after taking office in 2017, Trump <a href=\"https://x.com/realDonaldTrump/status/824968416486387713\" target=\"_blank\" rel=\"noopener\">promoted Phillips’ false claims</a>. In the wake of the 2020 presidential election, Phillips gained further notoriety when the group he was involved with, True the Vote, provided the data that underpinned the <a href=\"https://apnews.com/article/2022-midterm-elections-covid-technology-health-arizona-e1b49d2311bf900f44fa5c6dac406762\" target=\"_blank\" rel=\"noopener\">debunked</a> film <a href=\"https://www.wired.com/story/brandon-gill-2000-mules-texas-election/\" target=\"_blank\" rel=\"noopener\"><em>2000 Mules</em></a>, which falsely alleged that a network of individuals was paid to illegally collect and deposit ballots in drop boxes.</p><p>A 2022 investigation <a href=\"https://revealnews.org/article/true-the-vote-big-lie-election-fraud/\" target=\"_blank\" rel=\"noopener\">by the Center for Investigative Reporting</a> found that True the Vote has raised millions of dollars from donors by repeatedly promising to uncover evidence of election fraud but has failed to do so. Much of that money, CIR reported, went to companies controlled by Phillips and in loans to True the Vote’s founder, Catherine Engelbrecht.</p><p>Phillips was appointed last December to head up FEMA’s Office of Response and Recovery despite having no past experience working in emergency response. In June, following his departure, the agency thanked Phillips for his “service, dedication, and leadership,” adding that “he has played a pivotal role in stabilizing the Office of Response and Recovery and advancing key reforms to strengthen our mission delivery.”</p><p>Three sources at FEMA, who were granted anonymity due to fears of recrimination by the administration, tell WIRED that Phillips has not been seen at FEMA’s headquarters since June.</p><p>When Phillips posted on Truth Social this week about his decision to “rejoin the fight” he was once again discussing “illegals on the voter rolls” and the work he and Engelbrecht had done almost a decade ago to address the perceived issue—which is so rare that even a third-party analysis of a database maintained by the right-wing Heritage Foundation shows it contains <a href=\"https://www.americanimmigrationcouncil.org/blog/myths-about-noncitizen-voting-heritage-foundation-data/\" target=\"_blank\" rel=\"noopener\">fewer than 100 examples</a>. When asked if Phillips’ comment meant he would be working with True the Vote again, Engelbrecht said, “I’m sure Gregg will be involved in a number of projects in the future, and we at TTV think very highly of him, but in an effort to set the record straight, he is not part of the True the Vote team. He previously assisted TTV as a contractor on research projects from 2020–2023.”</p><p>When asked about Phillips’ role as a board member of True the Vote, as revealed by the CIR report, Engelbrecht did not respond.</p><p>WIRED <a href=\"https://www.wired.com/story/the-group-behind-2000-mules-is-back-with-another-election-conspiracy-film/\" target=\"_blank\" rel=\"noopener\">recently revealed</a> that ahead of the midterms, True the Vote will release another documentary, entitled <em>Trapped,</em> which again makes allegations about widespread and systemic voter fraud.</p>"},{"title":"What Is \"Reasonable\" Gun Control?","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/26/what-is-reasonable-gun-control/","category":"law","categoryLabel":"Law","wordCount":589,"readingTime":3,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/category/civil-liberties/gun-rights/gun-control/\" target=\"_blank\" rel=\"noopener\">Gun Control</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/08/26/what-is-reasonable-gun-control/\" target=\"_blank\" rel=\"noopener\">What Is \"Reasonable\" Gun Control?</a>\n\t\t\t\t\t<p>According to the Gun Control Lobbies, Everything, Including Prohibition</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.26.2026 1:29 PM\n</p>\n\t</h2>\n\t\n\t\t<p>Starting with legislation signed by New York then-Governor Andrew Cuomo in 2022, eleven states have enacted \"Firearms Industry Responsibility Acts.\" The statutes subject firearms retailers and manufacturers to tort lawsuits for any action that is not \"reasonable.\" The National Shooting Sports Foundation, the trade association for the firearms industry, filed a facial challenge, arguing that the statute was void for vagueness. The Second Circuit disagreed, pointing out that \"reasonable\" is used as a legal standard in many contexts. <em>National Shooting Sports Foundation v. James</em>, 144 F.4th 98 (2d Cir. 2025). But what does \"reasonable\" mean in the new liability acts?</p>\n<p>A grocery store knows that its reasonable duty of care to invitees includes promptly cleaning up spills so that customers do not slip and fall. The grocery store's reasonable duty does not include monitoring the weight of its customers and barring obese customers from buying high-calorie low-nutrition foods. The plaintiffs' tort lawyers who have, in a sense, helped shape and define grocery stores' reasonable duties are not morally opposed to grocery stores.  They are not working towards a society in which there is no private ownership of food. They do not aim for a world in which the only food is what the government chooses to provide and in which the only way to eat is to line up at a government mess hall — such as in Cuba, or in China during the Great Leap Forward of 1958–62.</p>\n<p>Contrast grocery store litigation with firearms litigation. On the latter, many advocates <em>do </em>seek the eradication the entire line of businesses. In the words of Mrs. Gabrielle Giffords, leader of the eponymous lobby: \"No More Guns. Gone.\" Philip Elliott, <a href=\"https://time.com/6274979/gabby-giffords-gun-control/\" target=\"_blank\" rel=\"noopener\">No More Guns. Gone': Why Gabby Giffords Isn't Giving Up</a>, Time, Apr. 26, 2023.</p>\n<p>As used by the gun control lobbies that created and pushed for the \"industry responsibility\" statutes, what does \"reasonable\" mean?</p>\n<p>That is the question addressed in a new Working Paper from the University of Wyoming's Firearms Research Center. (I am a Senior Fellow at the Center.) Del Schlangen, who is a recent graduate of Denver University's Sturm College of Law, and was my intern this subject, investigated how gun control groups use thee word \"reasonable.\" His results were published this week in his monograph <a href=\"https://firearmsresearchcenter.org/working_papers/use-of-reasonable-in-gun-control-advocacy/\" target=\"_blank\" rel=\"noopener\"><em>Use of</em> <em>'Reasonable' in Gun Control Advocacy</em> </a>(Firearms Rsch. Ctr., Working Paper No. 2026-8).</p>\n<p>He finds that \"reasonable\" as defined by gun control groups is simply their word of approval of all the restrictions and prohibitions they favor. Schlangen's 58-page monograph begins with a three pages of summary, and then provides a representative catalogue of 170 written uses of \"reasonable\" by gun control advocates. He concludes:</p>\n<blockquote><p>The very advocates who assure courts that the industry duty is \"well understood\" (A80) or known (A81), and who assure the public that \"reasonable controls\" gives the industry \"clear guidance\" (A113) have, for nearly half a century, used \"reasonable\" to include banning all handguns, banning most modern rifles, banning the majority of magazines, and banning the carrying of any arm for self-defense. All lesser types of gun control are also declared to be \"reasonable.\" Because \"reasonable\" means whatever the gun control lobbies desire at the moment, the word does not provide a fixed and ascertainable standard in the gun control context.</p></blockquote>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/26/suspension-of-couples-gun-rights-because-their-college-student-daughter-drew-allegedly-threatening-images-violated-second-amendment/\" target=\"_blank\" rel=\"noopener\">NEXT: Suspension of Couple's Gun Rights Because Their College Student Daughter Drew Allegedly Threatening Images Violated Second Amendment</a>\n    </p>\n\t<a href=\"https://reason.com/category/civil-liberties/gun-rights/gun-control/\" target=\"_blank\" rel=\"noopener\">Gun Control</a><a href=\"https://reason.com/tag/torts/\" target=\"_blank\" rel=\"noopener\">Torts</a><a href=\"https://reason.com/category/civil-liberties/gun-rights/guns/\" target=\"_blank\" rel=\"noopener\">Guns</a><a href=\"https://reason.com/tag/firearms-regulation/\" target=\"_blank\" rel=\"noopener\">firearms regulation</a>"},{"title":"In “Adults,” Gen Z Gets the Hangout Sitcom It Deserves","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/07/adults-tv-review-fx","category":"fun","categoryLabel":"Interesting Reads","wordCount":1404,"readingTime":8,"content":"<p>The twentysomething protagonists of the Gen Z hangout comedy “Adults” understand that growing up sometimes requires an intervention. In the first episode of the new season, which premières this week, five housemates gather in their living room to conduct what they’ve dubbed the Scrub: the act of identifying and erasing their most employment-endangering social-media posts, under the credo that you must “bury your past before it buries you.” A clip of Samir (Malik Elassal) as a teen-ager, comforting a female celebrity through the power of dance after Trump’s first election? Delete. A YouTube video of Issa (Amita Rao) counting down the “top ten worst accents”? <em>Definite</em> delete. “It’s not our fault we got the internet when we were our most horny and stupid,” Samir protests. Yes, it’s an exercise in humiliation—but it’s the kind of lesson you’d rather get from your nearest and dearest than from an H.R. department. And it fits right into the time-honored sitcom tradition of needing a little help from your friends.</p><p>Television’s great crowd-pleasers used to hinge on such chemistry and warmth. In the early nineties, the writers David Crane and Marta Kauffman pitched NBC on the then relatively novel insight that “when you’re single and in the city, your friends are your family.” The result of this epiphany was “Friends,” a ratings juggernaut that remains improbably popular three decades later. The formula that show cemented—of idealistic urbanites, often with more education than experience, getting mired in low-stakes high jinks—led to such notable successors as “How I Met Your Mother,” which débuted in 2005, and “New Girl,” in 2011. Eventually, the young-people-doing-nothing format got the prestige treatment, with 2012’s “Girls” (which admittedly owes as much to “Sex and the City”) and 2014’s “Broad City.” These edgier entries reflected the dominant cultural forces of their era: cringe comedy and exuberant feminism, respectively.</p><p>Since then, the hangout sitcom has suffered a precipitous decline. Its native structure, the twenty-two-episode season, has become a rarity in the industry, as has its default lightness. But the genre is mounting a comeback. “Adults” is part of this Zoomer revamp, along with Rachel Sennott’s pricklier “I Love LA”—the “Seinfeld” to “Adults” ’s “Friends”—and Mindy Kaling’s creakier “Not Suitable for Work.” Whereas Rachel and Monica’s misadventures in “Friends” ultimately spanned a decade or so in the city, “Adults” seems hyper-focussed on that fabled sliver of one’s twenties before ambition or even romance sets in—when life is composed almost entirely of side quests, and deciding on a main quest is still a few years away. The show’s central quintet reside in the childhood home of Samir, whose semi-retired parents are on an apparently indefinite tour of the national parks. Samir allows his friends to live with him for free while he works as a food-delivery driver—a gig that he’s happy to put on pause when the opportunity arises to play video games with some teen-age boys who’ve used the app to order beer. Guests—defined loosely as anyone from a random hookup to Julia Fox to a surprisingly chill raccoon—drop by the house with regularity, creating a zippy blend of the mundane and the serendipitous.</p><p>The married creators of “Adults,” Ben Kronengold and Rebecca Shaw, seem well aware of the lineage of their series. (At one point, a character played by the “Girls” star Zosia Mamet asks one of the protagonists, “You think you’re the first people to be young and adorable in New York?”) Perhaps that’s why the pair has striven to create fresh archetypes. The most fully realized personalities are Anton (Owen Thiele), a compulsive charmer who needs to make every passing acquaintance feel as though they’ve forged a lasting connection, and Billie (Lucy Freyer), a former overachiever who’s lost without the structure of school. (Offscreen, Billie may be singlehandedly keeping the gifted-child-meme industry alive by liking every post about smart kids who never live up to their potential.) But other characters verge on parody. Issa, an overconfident blusterer whom Samir and Anton met in college, seems to be stuck doing a one-note Ilana Glazer impression; her boyfriend, Paul Baker (Jack Innanen), who’s always referred to by his full name, is distinguished only by being Canadian, sexually fluid, and nice.</p><p>“Adults” won’t be the hangout show that restores the genre to its normcore, network-friendly roots—if such a return is even viable in the current comedy landscape. Happily, it’s not trying to be. Its politics lean unapologetically left; like “Girls” and “Broad City” before it, “Adults” features an irreverent abortion subplot. It also eschews the heteronormativity of its predecessors: Anton is gay, Billie sleeps with both men and women, and the show’s primary will-they-won’t-they couple is queer. One half of that would-be pairing is Paul Baker, whose softboi credentials come into question when it emerges that he has a second, markedly straighter friend group—a pack of testicle-slapping bros promptly labelled the Shame Friends.</p><p>The divide sets up the kind of ethnography at which “Adults” excels. In the Season 2 première, a riotous piece of generational social taxonomy, this other crew tries haplessly to cater to the tastes and mores of the main group, with one dude donning a “directed by Greta Gerwig” T-shirt and later declaring, “I have mental health!” But there’s also a subtle rejection of the earnest wokeness of years past. The diversity of the core ensemble—a far cry from Hannah Horvath’s all-white friend group—is rarely remarked upon by the characters, except as part of a bit. The show itself acknowledges their identities only obliquely, as in an episode where an exhausted Anton forgets to code switch at his corporate job and praises a colleague’s presentation by chirping, “Cunt alert!” Naturally, the rest of the plot focusses on his elaborate scheme to get out of hot water by normalizing the word in his office.</p><p>Each successive generation since “Friends” has seen its sitcom youths diminished in their circumstances. Rachel and Monica’s West Village sublet gave way to Hannah and Marnie’s Greenpoint apartment—an address that might be considered laughably unattainable by the broke twentysomethings of today. The most original element of “Adults” is its setting: a cozy single-family house in outer Queens, filled with the décor choices of a middle-aged mom, all floral patterns and ornately carved furniture. Though the home is a haven for Samir and his friends, it is pointedly not theirs. “Adults” doesn’t dwell on the contingency of the characters’ housing situation, but economic struggle is the show’s unmistakable backdrop. It’s evident in the sheer number of scenes that take place in the living room or the kitchen. While earlier sitcom crews met up at a coffee shop or a bar, young people like Billie—who spends her days submitting dozens of job applications without a single reply—are scarcely in a position to treat the city as their playground.</p><p>Such worries are more prominent in the superior second season, which finds some of the friends engaging in that perpetual hobbyhorse of the young: fretting about no longer being as young as they used to be. Billie’s anxieties about her lack of accomplishments at twenty-five are exacerbated by meeting the infinitely cooler girl who now uses her old fake I.D., and the typically even-keeled Anton can’t help regressing into a shrieking brat in the presence of his older sister (Raven-Symoné). These story lines add a sense of urgency and progress to a series that was a little too comfortable being amiably aimless. The shift feels like the show finding its footing in a more traditional sitcom register.</p><p>Kronengold and Shaw rarely falter in coming up with unique plotlines and sharply observed jokes. But, compared with its forebears, which gradually accrued emotional power as their characters matured together, “Adults” seems strangely reluctant to delve into the inner lives of young people whose hearts may never again be so open or vulnerable. In the first season, for instance, Billie’s fear that she peaked in high school leads to an ill-advised fling with her middle-aged journalism teacher. The relationship ends in calamity, of course, but the series spends little time wondering what she gleaned from the experience. When the friends do divulge deeper secrets to one another, they often instruct the hearer to “mind wipe”: to listen to the revelation, then pretend as if they never did. Like the Scrub, it’s a self-protective gesture, designed to mitigate risk. But we can get to know the characters only so well when they’re doing their best not to know themselves. ♦</p>"}];

  document.getElementById('article-body').innerHTML = a.content;

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
