*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Virtue and a Sledgehammer review – a haunting sci-fi drama about breaking walls, AI faces, and your heart","source":"Rock Paper Shotgun","author":"@rockpapershot","url":"https://www.rockpapershotgun.com/virtue-and-a-sledgehammer-review","category":"gaming","categoryLabel":"Gaming","wordCount":1021,"readingTime":6,"content":"<p>Smashing</p>\n    \n  \n  \n  \n\n<p>It’s been well over a week since my final swing of <a href=\"https://www.rockpapershotgun.com/games/virtue-and-a-sledgehammer\" target=\"_blank\" rel=\"noopener\">Virtue and a Sledgehammer</a>’s righteous whacking stick, and I’m still finding it difficult to shift the game from my thoughtspace. Having tempted me in with promises of cathartic, base-instinct vengeance against a town of roboticised arseholes, it’s since had me picking through the rubble of my own demolition spree, not so much looking for meaning as trying to parse the abundance of it. I’d gladly invite you to join me in the wreckage.</p>\n<p>Virtue’s developers, Selkie Harbour and the apparent nominative determinists at Deconstructeam – previously of <a href=\"https://www.rockpapershotgun.com/games/the-cosmic-wheel-sisterhood\" target=\"_blank\" rel=\"noopener\">The Cosmic Wheel Sisterhood</a> – say it’s a \"narrative exploration\" game. Which is accurate, on both counts. As pictured sledgewielder Pratelle, your most urgent interactions involve breaking shit, be it the walls of your childhood hometown or the android copies of its former inhabitants. Really though, you’re bashing with purpose beyond your (or Pratelle’s) own satisfaction: hammering away masonry will open up new nooks and paths to explore, which in turn leads to more flashback story scenes, better contextualising a rampage that might otherwise seem lacking in justification.</p>\n<p>This is not a swift process. Pratelle’s swings are slow and deliberate, each one needing at least some charging-up, and end on a similarly lengthy recovery animation. While this imbues encounters against the more aggressive bots with some timing-based challenge, the game’s sluggishness also serves to lend some emotional weight – a means of holding your head towards the crumbling homes and the clattering humanoids. Nothing dies here unless you absolutely, intentionally will it, and once you commit, there’s scant chance to do anything but watch as it hits the dirt.</p>\n\n<p>1 of 5 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>On an initial playthrough, the techniques of fellow low-polyist <a href=\"https://www.rockpapershotgun.com/games/mouthwashing\" target=\"_blank\" rel=\"noopener\">Mouthwashing</a> may come to mind: that game conveyed the cruelties of its main playable character through similarly slow, purposeful interactions. As Virtue gives up more of its secrets, though, it becomes clear that while it wants you to feel Pratelle’s rage, it also considers her crashout entirely legitimate. To explain fully would mean practising in spoilers, but those narrative shards seriously are worth tracking down, each scene laying on depth and tragic complexity to Pratelle and her family – the latter being the reason she’s back in town to begin with.</p><p>Non-chronological, but coherently written and arranged flashbacks run an impressively wide gamut of wholesomeness, unease, and horror. And they wisely take place before the sci-fi element becomes prevalent in the present-day storyline, keeping the darker moments more compellingly, uncomfortably grounded. Even with a tendency towards quip-speak, especially from the mouth of Nina, Pratelle’s smug genius of a sister, the mixing of fond memories with traumatic ones heightens the impact of both. It’s naturally awful to watch Nina coldly kick Pratelle out of their mother’s hospital room, or to see that mother inflict physical abuse on the sisters, but the hurt hits different when a later scene shows all three warmly chatting at home. Based on the chatter of their robot avatars, many of the family’s neighbours are/were variously racist, homophobic, or outright murderous, but it’s the pain and betrayal seeded in those past moments that drive Pratelle’s stomping, bludgeoning campaign of violence.</p>\n\n<p>Crucially, Virtue does not introduce these humanising moments to manipulate you into manufactured, <a href=\"https://www.rockpapershotgun.com/games/far-cry-3\" target=\"_blank\" rel=\"noopener\">Far Cry 3</a>-ass, you-are-the-real-monster guilt, and in-story attempts to play this trick on Pratelle herself are quickly called out as such. The wrongheaded people are wrong, the game knows it, and there’s no ulterior motive beyond the suggestion that those we love (and are loved by) can be corrupted by ego, ambition, or inherited trauma. Still, that central, lamentable family dynamic, and how skillfully its members are built up and broken apart in such short vignettes, are largely why I’m still pondering the game so much. I also confess to having replayed the entire thing, in far less brutal fashion, in the hope – proved vain – that it might help change some of their fates.</p>\n<p>For better or worse, fury is the only language this town understands, and Pratelle is a fluent speaker. The long windup of attacks is at least met by an equal and opposite reaction of object-mangling: walls blast open with an appreciably exaggerated shower of debris, and taking out a building’s corners will cause a thunderous collapse of the entire structure. Thwacking robots isn’t quite as satisfying, in part because of the underwhelmingy dull 'thunk' of the impact sound, but a solid hit will still send them tumbling backwards with a deserved lack of grace. In some delightfully fortuitous melees, a clobbered bot would ragdoll hard enough into an adjacent wall to crack it open, revealing a memory shared I could have otherwise missed.</p>\n\n<p>I briefly wondered if having me collect all these was necessary, given the game has no problem auto-triggering regular cutscenes at points. Except, it kind of is. Pratelle’s journey is cathartic, but it’s also a labour, the weight and sorrow of what she must do mirrored in her leaden footsteps and determined but joyless sledgehammering. It’s entirely appropriate, then, that uncovering her full story takes some extra effort, just as that effort is entirely rewarded.</p><p>Virtue and a Sledgehammer stands against much. It’s anti-prejudice, anti-ambivalence, and in not very subtle terms, anti-AI: its depiction of a soulless (albeit human-driven) machine takeover, complete with whining about how hard life was before, throws up gladly smashable parallels to the chatbot infestation of creative and public spaces.</p>\n\n<p>For all its violent opposition, though, it’s also earnestly, maybe even optimistically pro-human. While drawing a line at intentional and misguided evils, it’s accepting of our imperfections and the role they have in shaping us – remember you’re fighting about 600 identical automatons – and only plumbs the depths of true despair when humanity isn’t adequately defended. Rage is vented and steam is let off, but not in a purely spiteful, fuck-the-world manner, and even Pratelle is only tearing her past down so she can move on from it. Maybe one day I will too, if I can ever get her stupid, fascinating game out of my head.</p>"},{"title":"UK Officials Said AI Would Add £400 Billion to the Economy. That Figure Mainly Came From Google","source":"Wired","author":"@wired","url":"https://www.wired.com/story/uk-officials-said-ai-would-add-400-billion-to-the-economy-that-figure-mainly-came-from-google/","category":"tech","categoryLabel":"Technology","wordCount":859,"readingTime":5,"content":"<p>For the last two years, the UK government has been telling the British public that the country could receive an economic boost of £400 billion ($538 billion), thanks to AI, a figure intended to calm fears that the technology would lead to sweeping job losses and even an economic crash.</p><p>But the UK AI minister admitted last week that figure was significantly higher than the government’s actual projections after it was revealed that the assessment came solely from a report commissioned by Google and that its own estimation of AI’s economic benefit was less than a third of that £400 billion figure.</p><p>AI minister Kanishka Narayan, answering a parliamentary question on the issue, said that AI adoption and data investment could add £55 billion to £140 billion to the UK economy by 2030, bringing the central estimate to £120 billion. But even this “more recent assessment,” he said, was a “hugely uncertain” estimate.</p><p>Narayan said the £400 billion figure “was drawn from a publicly available 2023 report commissioned by Google and produced by Public First,” a British consultancy firm now referred to as PF Global.</p><p>Responding to WIRED’s questions about the difference between the figures, PF Global’s head of economics, Jonathan Dupont, said the disparity was partially because of what they saw as the government’s slow adoption of AI. “AI is a very fast-moving technology, and, as we learn more, we inevitably have to update the assumptions lying behind our models. Compared to our older model, the numbers the government uses assume a much slower rate of adoption than looked possible back in our model that was created in 2023.”</p><p>Government departments and agencies used Google’s £400 billion figure for almost two years, under two governments. Ministers have had the lower estimate since at least November 2025, almost a year before this week’s admission, yet Skills England, a government agency responsible for apprenticeships, was still publishing the old figure four months later.</p><p>Nayaran’s parliamentary answer is the first recorded evidence WIRED could find of the government setting the two numbers side by side, or saying that the report was commissioned by Google. The answer did not withdraw the £400 billion figure or say it had been wrong.</p><p>Dame Chi Onwurah, the Labour MP who chairs the Commons Science, Innovation and Technology Committee, told WIRED: “The government is right to promote the potential for technology like AI to improve public services. However, these reports highlight one of the central barriers to delivering the digital transformation of public services my committee has identified: hype.</p><p>“Economic projects inevitably rely on assumptions, but overstating the benefits of technology risks undermining the case for change. The government needs to be realistic about what technology like AI can deliver and be transparent with the public about potential savings.”</p><p>PF Global highlighted more top-down adoption of AI and integration into civil service workflows as examples of how take-up could improve. “While we haven’t changed our view on the overall potential of technology, given the slower rate of adoption we’ve seen in practice, our central estimate for the amount of potential likely to be achieved by 2030 is much closer to the Government’s number—with growth ramping up in the next few years after that.”</p><p>Lord Holmes of Richmond, the Conservative peer who asked ministers in January 2025 about the origins of the £400 billion claim but did not receive a response, told WIRED: “It is unfortunate that the figure used repeatedly by the government, and then, unsurprisingly, by multiple other organizations, has now been significantly and rightly adjusted. It would have been better for the government to clarify this much sooner and more directly.”</p><p>He added: “Robust data is critical, not least as billions of pounds of our money and how the government chooses to deploy it depend on it.”</p><p>The spat over these two numbers—£120 billion and £400 billion—is part of a wider debate over the line between government support and boosterism. Former technology minister Peter Kyle also used the £400 billion figure while promoting the benefits of AI, while many parliamentarians outside of government raised questions about potential issues around the technology.</p><p>“The government’s revised estimates for how much AI could add to the economy are welcome—but it’s concerning that they come after almost two years of ministers citing a figure from research that was paid for by Google,” Sumedha Deshmukh of the Ada Lovelace Institute told WIRED. “This reflects a wider pattern. Figures about AI that look precise often have assumptions and incentives built into them, and industry often funds or shapes the research behind them.</p><p>“The government should test the numbers it is given before it builds policy on them, fund independent research, and measure whether promised gains are delivered. It should always start by asking simple questions before it uses any number around economic or productivity gains from AI—where did it come from, what does it assume, and who actually benefits from a given figure?”</p><p>The Cabinet Office, the department responsible for AI in government, and Google were approached for comment.</p><p>PF Global said their work for Google continued but all research was independent and all judgments and assumptions were their own.</p>"},{"title":"Justices to contemplate compensation standard for eminent domain on interstate pipelines","source":"SCOTUSblog","author":"Ronald Mann","url":"https://www.scotusblog.com/2026/11/justices-to-consider-compensation-standard-for-eminent-domain-on-interstate-pipelines/","category":"law","categoryLabel":"Law","wordCount":790,"readingTime":4,"content":"<p>The argument next week in <a href=\"https://www.scotusblog.com/cases/hoffmann-v-wbi-energy-transmission-inc/\" target=\"_blank\" rel=\"noopener\"><em>Hoffmann v. WBI Energy Transmission, Inc.</em></a> should give the justices a break from the back-and-forth sniping in high-profile stay applications of the last several weeks as they consider a lower-stakes problem of statutory interpretation under the Natural Gas Act.</p><p>A major topic under the <a href=\"https://www.ferc.gov/sites/default/files/2021-04/natural_gas_act.pdf\" target=\"_blank\" rel=\"noopener\">Natural Gas Act</a> is the construction of interstate natural-gas pipelines. Among other things, the statute delegates to <a href=\"https://ferc.gov/\" target=\"_blank\" rel=\"noopener\">the Federal Energy Regulatory Commission</a> authority to approve construction of such pipelines, which grants a federal “certificate of public convenience and necessity” for the project. If the holder of the certificate is unable to purchase the land needed for the pipeline by agreement, the statute grants the holder the right to exercise the federal power of eminent domain to acquire a “necessary right-of-way.”</p><p>Not surprisingly, a common problem in such projects is that parties holding the relevant land do not readily agree to allow the pipeline to be built through their property (which usually requires an easement of some sort). In turn, federal courts traditionally require in eminent domain cases that the condemning party pay the “<a href=\"https://constitution.congress.gov/browse/essay/amdt5-10-10/ALDE_00013289/\" target=\"_blank\" rel=\"noopener\">just compensation</a>” that the Fifth Amendment requires when property is “taken for public use.” State courts are obligated to provide at least as much compensation, but often, for one reason or another, provide more than the Constitution requires. In this case, for example, it is at least plausible that the law of North Dakota (where the Hoffmanns and their family own land through which WBI Energy Transmission seeks to build a pipeline) requires the condemnor to pay not only the value of the land but also the reasonable attorney’s fees of the landholder.</p><p>The question is whether just compensation here should be determined by referring to state law.</p><p>For the <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-159/418892/20260813103936272_1%20-%20Brief%20for%20Petitioners.pdf\" target=\"_blank\" rel=\"noopener\">Hoffmanns</a>, the key to the case is the absence of any statement in the Natural Gas Act as to what law courts should apply in assessing appropriate compensation. Acknowledging that federal standards should apply when the United States takes property in its own name, the Hoffmanns argue that state law typically applies when the condemnation power has been delegated to a private party like WBI. In their view, the baseline in disputes between private parties (the pipeline company and the landowner), as supported by cases such as <a href=\"https://supreme.justia.com/cases/federal/us/440/715/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Kimbell Foods</em></a>, should be the law of the state where the land is located.</p><p>For <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-159/424160/20260914155818845_25-159.Rsps%20Merits%20Br.pdf\" target=\"_blank\" rel=\"noopener\">WBI</a>, by contrast, the key to the case is the source of the condemnation power in federal law. Because it is clear that the federal government operating under that statute would pay “just compensation” and nothing else, WBI argues that Congress could not have intended to subject pipeline operators to local laws that require payments beyond just compensation. The federal government, appearing in support of WBI, <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-159/425110/20260921193036019_Hoffmann_bsacUnitedStates.pdf\" target=\"_blank\" rel=\"noopener\">argues</a> emphatically that a contrary rule would permit states to discriminate against types of construction that the federal government, as opposed to the state, would support.</p><p>WBI and the federal government point to two key pieces of evidence, close in time to the adoption of the Natural Gas Act. The first is a statute (the <a href=\"https://www.law.cornell.edu/uscode/text/33/525\" target=\"_blank\" rel=\"noopener\">General Bridge Act</a> of 1946) that explicitly called for compensation to be “ascertained and paid according to the laws of [the] State.” For the government and WBI, the absence of similar language from the contemporaneous Natural Gas Act is powerful evidence that federal standards always apply under that statute. The second is a case, <a href=\"https://supreme.justia.com/cases/federal/us/317/369/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Miller</em></a>, decided just a few years before adoption of the Natural Gas Act, in which the Supreme Court held that in a condemnation under an earlier statute with similar wording federal rather than state compensation standards applied. Hoffmann <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-159/429463/20261014120213063_1%20-%20Reply%20Brief%20for%20Petitioners.pdf\" target=\"_blank\" rel=\"noopener\">responds</a> that the case is irrelevant because it involves a condemnation by the United States rather than a private party.</p><p>One last twist that I expect will come up at oral argument: Because the particular dispute here involves attorney’s fees, it surely is relevant that the court has <a href=\"https://supreme.justia.com/cases/federal/us/421/240/\" target=\"_blank\" rel=\"noopener\">adopted</a> something of a clear statement rule that courts will not award attorney’s fees under a federal statute absent an explicit statement from Congress. Whatever the justices might think about federal and state standards on other topics, my guess is then that some of them will shrink from mandating an award of attorney’s fees under a statute that is silent on the topic.</p><p>I would not expect a heated argument in <em>Hoffmann</em>, as the issues seem far removed from the hot button topics that have been dividing the justices so much recently. But, of course, you never can tell.</p><p><strong>Recommended Citation: </strong>Ronald Mann, <em>Justices to contemplate compensation standard for eminent domain on interstate pipelines</em>, SCOTUSblog (Nov. 4, 2026, 10:00 AM), https://www.scotusblog.com/2026/11/justices-to-consider-compensation-standard-for-eminent-domain-on-interstate-pipelines/</p>"},{"title":"A Blue Wave Just Crashed on Trump","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-political-scene/a-blue-wave-just-crashed-on-trump","category":"fun","categoryLabel":"Interesting Reads","wordCount":964,"readingTime":5,"content":"<p>For nine months, on Nicollet Avenue in Minneapolis, there has been a makeshift memorial for <a href=\"https://www.newyorker.com/culture/on-television/witnessing-another-public-killing-in-minneapolis\" target=\"_blank\" rel=\"noopener\">Alex Pretti</a>, the registered nurse who was shot and killed by federal agents while trying to shield a fellow-protester during last winter’s deportation campaign in the city. On Tuesday, after Minnesotans cast their ballots in the state’s Senate race, many of them pressed their “I voted” stickers onto a lamppost at the memorial, as if completing a picture. The gestures suggested something about this year’s midterm elections which, as the evening wore on, turned out to be true: that it was a mundane event that held unusual moral stakes.</p><p>During the two years since Donald Trump won reëlection, he has pushed the country toward a brink. Trump won only a narrow Presidential majority in 2024, and his party held a majority in each chamber of Congress by just a few seats. Even so, the President faced little institutional resistance as he pushed the federal government-eroding <em>DOGE</em> program, the senseless and costly tariffs, the authoritarian power of the crackdown on migrants, the feckless Iran war. He could pursue these goals because he had convinced most of his party, and many members of the public, that his victory over Kamala Harris meant that half of the country would irrevocably be on his side.</p><p>The results of the midterm votes are still rolling in. But the rejection of the President is undeniable and uncomplicated, and it reached deep into what had long been understood as conservative territory. His party has lost its Senate race in Ohio—and looks likely to lose in Michigan, where the post-industrial economy had long supplied the symbolic heart of Trumpism. It has lost in Texas, where Democrats had not won a statewide race in more than a hundred contests, stretching back to 1994, and in South Carolina. It has lost in Iowa and in Kansas, which has not seated a Democratic senator since the Great Depression. There are counties in southwestern Kansas where Trump won two years ago by about thirty-five points—Finney County, Seward County, Ford County—that, as the tallies accumulated in the state’s U.S. Senate race, were voting narrowly for the Democrat. For a decade, the country had become used to a fixed map—blue in the cities, deep red in the outlying areas. Now there is some instability around the edges.</p><p>One specific issue, or an especially weak Republican candidate, might make sense as an explanation in particular races. But the truth is that Trump’s past two years have offered voters a menu of reasons to turn away from him. In South Texas, it might have been the cruelty of the immigration raids; in Kansas, the effect of the Iran war on diesel and fertilizer prices; in South Carolina, an especially poorly chosen Republican candidate. In the course of the long Trump decade, many liberals had come to assume that conservatives were so devoted to the culture war that they were politically impervious to events. But this time, in such places, the news made it through. All of it mattered.</p><p>Somewhat suddenly, almost nothing in U.S. politics seems certain. The Democratic Party has lately been understood as an aging, defensive entity, with a nursing-home veneer. But this year’s campaigns have elevated a group of younger and newer Democrats (Jon Ossoff, in Georgia; <a href=\"https://www.newyorker.com/news/the-lede/james-talaricos-final-sprint\" target=\"_blank\" rel=\"noopener\">James Talarico</a>, in Texas; <a href=\"https://www.newyorker.com/news/the-political-scene/the-final-electric-days-of-abdul-el-sayeds-senate-campaign\" target=\"_blank\" rel=\"noopener\">Abdul El-Sayed</a>, in Michigan) who have found it quite natural to denounce the oligarchic and authoritarian elements of the status quo, and to separate themselves from some elements of the Party’s doctrine. The South, the most deeply conservative region in the country for nearly all of its history, suddenly has a purple hue. Is <a href=\"https://www.newyorker.com/books/page-turner/j-d-vances-contemptuous-conversion-memoir\" target=\"_blank\" rel=\"noopener\">J. D. Vance</a> still the presumptive next Presidential nominee? Will the Republican Party still pliably fall into line behind the man who lost in Texas?</p><p>And, though the Democrats have made astonishing breakthroughs, their near-term future is a little cloudy, too. The intraparty fight, between its insurgent, youthful left and the legacy party, a contest intense enough that at times it seemed to crowd out the whole rest of American politics, is still unresolved—both sides can claim vindication, and can point to new champions emerging from the midterms. The Party itself remains generally unpopular. Perhaps most important, with the liberal grassroots awaiting a Presidential primary to come, lower-wattage figures (Hakeem Jeffries, Chuck Schumer) are now in charge. For a political formation that might now have a claim on a majority, the Democrats remain curiously faceless.</p><p>Even so, one instance of clarity came around 11 <em>P.M.</em>, as Fox News flashed the graphic predicting that the Democrats would win control of the House of Representatives: we are no longer in the shadow of 2024. In culture and in politics, conservatives had insisted that Trump’s victory in that election was the defining one, and that it reflected a culminating turn against “wokeness,” against internationalism, against modern ideas about gender or race—a more atavistic America was being unleashed. Trump called into Fox News just after midnight, sounding a little whimsical and discursive. “It’s just a point in time,” the President said. “There was a mood in the air, I guess.”</p><p>In a similar way, perhaps, the 2024 election, and the atmosphere it ushered in, now looks a bit more like an aberration, and the idea that it represented a historical pivot seems more like the wishful thinking of a few people who stood to benefit from it. The experience of the past two years has mattered—tallied, among other places, in the “I voted” stickers that climbed up the memorial in Minneapolis. Elon Musk spent nearly two hundred million dollars to keep Texas red, and the Republicans blew it. Of course, it looks like a slightly different Texas, this morning. It looks like a slightly different country. ♦</p>"}];
