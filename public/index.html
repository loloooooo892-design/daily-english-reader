*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;

  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {

}

  margin-right: 0.5em;
}

h1 {

  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;

}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;

  letter-spacing: 0.01em;
}

.swap-btn:hover {

}

.swap-btn:disabled {

}

.swap-counter {

}

.article-body ul, .article-body ol {
  margin: 1em 0;

}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;

  flex-wrap: wrap;

}

.footer a {

}

.footer a:hover {

}

.archive-link {

  color: var(--text-faint);

}

.archive-link a {

  text-decoration: none;
}

.archive-link a:hover {

}

@media (max-width: 480px) {

  .container { padding: 2rem 0 3rem; }

<script>
var articles = [{"title":"This App Brutally Shames You by Tracking How Many Hours You’ve Lost to Scrolling","source":"Wired","author":"@wired","url":"https://www.wired.com/story/oh-my-hours-ios-app/","category":"tech","categoryLabel":"Technology","wordCount":1131,"readingTime":6,"content":"<p>Oct 30, 2026 7:00 AM</p><p>The iOS app Oh My Hours takes a new approach to curbing screen time. It splits up your day into hour-long blocks, then shows which ones you wasted on Instagram and TikTok.</p><p>Photo-Illustration: Getty Images</p><p>You know that phone addiction has <a href=\"https://www.wired.com/story/want-to-look-at-your-phone-less-just-cover-your-screen/\" target=\"_blank\" rel=\"noopener\">become a big issue</a> when even <a href=\"https://www.wired.com/tag/google/\" target=\"_blank\" rel=\"noopener\">Google</a> and <a href=\"https://www.wired.com/tag/apple/\" target=\"_blank\" rel=\"noopener\">Apple</a> are bundling time management tools into their handsets—Digital Wellbeing and Screen Time, respectively. There are now also <a href=\"https://www.wired.com/tag/digital-wellness/\" target=\"_blank\" rel=\"noopener\">a plethora of apps</a> looking to help you cultivate a healthier relationship with your device.</p><p>One of the newer ones, which takes a slightly different approach to the norm, is <a href=\"https://apps.apple.com/us/app/oh-my-hours/id6760450002\" target=\"_blank\" rel=\"noopener\">Oh My Hours</a> for iOS. (There's no sign of an Android version yet.) Rather than giving you a mass of menus and options to wade through, it simply splits each day into blocks of hours that you can either waste or use productively, then puts a black mark next to the hours during which your phone has distracted you.</p><p>It's simple, it's effective, and it just might work. Rather than seeing how long you spent on X and Instagram, you see the hours you've lost to social media algorithms and the infinite scroll. Here's how Oh My Hours works on your iPhone, plus some other apps to check out if you’re looking to develop healthier phone habits.</p><h2>Moments Lost</h2><p>You can get started with <a href=\"https://apps.apple.com/us/app/oh-my-hours/id6760450002\" target=\"_blank\" rel=\"noopener\">Oh My Hours</a> for free on iOS. But to really make the most of it, a $10-per-year or $20 lifetime payment is required. This lets you customize what counts as a “lost” hour or day, and it gives you access to month and year views, which provide the best insights into how you're spending time on your phone.</p><p>Here's how it works. First, you indicate which apps you consider distractions, either by category (social media apps and games, for example) or by selecting apps individually. If you use any distracting app for a certain amount of time—this can be customized in settings—then that hour of the day is marked as “lost.”</p><p>The main interface shows each day as a straightforward series of circles representing hours. Every circle that’s filled in black is an hour you’ve lost to an app that has pulled you away from something more worthwhile.</p><p>It’s quite a brutal and minimalist approach, but I like it. It really brings home how much time you can spend on apps that aren’t really all that good for you, especially when you start looking at your progress (or lack of it) over entire weeks or months. However, I did find that once I’d lost a particular hour, my brain wanted to cram in as much absent-minded scrolling as possible during the rest of that hour.</p><p>By default, an hour is marked as lost if only if you spend seconds inside a distracting app. It's quite a harsh approach, but it needs to be—otherwise I think there would be the temptation to use up any allotted free time after every hour resets. You can extend this threshold period through settings, if you pay for the app.</p><p>Another handy feature here is the ability to set designated quiet hours. These are times when you really, absolutely do not want to look at your phone unnecessarily: Any use of a distracting app here blackens the boxes for all the hours in the quiet zone, not just one. Again, this can be customized, whether or not you’re using the app for free.</p><p>There’s one more option here, which is to reset an hour if you think it’s been marked incorrectly. (Maybe your finger slipped and you really didn’t mean to launch Instagram.) It’s all very simple and easy to use, and there’s an export tool here that gives you a CSV file of your stats if you want to do more with them.</p><h2>Other App Picks</h2><p>As I’ve already mentioned, if you’re in the market for an app that’ll gently nudge your habits toward spending less time on your phone, there are abundant options that look at the problem from a variety of angles. These are in addition to the Digital Wellbeing (Android) and Screen Time (iOS) tools you’ll find on your phone, which can be accessed from the Settings screens.</p><p><strong>One Sec</strong> for <a href=\"https://play.google.com/store/apps/details?id=wtf.riedel.onesec\" target=\"_blank\" rel=\"noopener\">Android</a> or <a href=\"https://apps.apple.com/us/app/one-sec-screen-time-focus/id1532875441\" target=\"_blank\" rel=\"noopener\">iOS</a> takes a simple approach to phone addiction. For the apps you specify, it will load up a breathing exercise for you to complete before giving you the choice to continue to the app or back out. It’s a small tweak, but it’s surprisingly effective, and it’s <a href=\"https://one-sec.app/research/\" target=\"_blank\" rel=\"noopener\">backed by science</a>. You can get started for free, while $20 a year gets you more features, including full app blocking and more advanced time tracking.</p><p>Then there’s <strong>Forest</strong>, for <a href=\"https://play.google.com/store/apps/details?id=cc.forestapp\" target=\"_blank\" rel=\"noopener\">Android</a> or <a href=\"https://apps.apple.com/us/app/forest-focus-for-productivity/id866450515\" target=\"_blank\" rel=\"noopener\">iOS</a>, which I’ve found to be useful whenever I’ve wanted to try to encourage myself to spend less time on my phone. The longer you ignore your handset, the bigger your virtual forest grows, and the app developers invest in real tree planting to further incentivize you. The main focus timer can be used without paying, while upgrades like customizations and allowed lists will set you back at least $6 a month.</p><p><strong>ScreenZen</strong>, available for <a href=\"https://play.google.com/store/apps/details?id=com.screenzen\" target=\"_blank\" rel=\"noopener\">Android</a> or <a href=\"https://apps.apple.com/us/app/screenzen-screen-time-control/id1541027222\" target=\"_blank\" rel=\"noopener\">iOS</a>, is comprehensive and completely free (though you can donate to the developer if you find it helpful, which I’d recommend). You can set up a variety of barriers between you and your distracting apps, depending on your preference, including customized pauses (with motivational messages) and math challenges. Conventional app and timer blocks are also included.</p><p>One of the most thorough options here is <strong>Roots</strong>, though it’s available only on <a href=\"https://apps.apple.com/us/app/roots-screen-time-control/id6446800962\" target=\"_blank\" rel=\"noopener\">iOS</a>. You’re able to schedule phone-free periods, block specific apps, and set up phone detox challenges that you can take on with friends and family. Like Oh My Hours, the app is also really good at giving you a breakdown of how much time you’ve saved by staying out of certain apps. Basic blocks and limits are free, with more advanced customizations available for $10 a month.</p><p>Also worth considering is <strong>Brick</strong>, which combines the free <a href=\"https://play.google.com/store/apps/details?id=com.brickllc.brick\" target=\"_blank\" rel=\"noopener\">Android</a> or <a href=\"https://apps.apple.com/us/app/brick-ditch-distractions/id6448794069\" target=\"_blank\" rel=\"noopener\">iOS</a> app with a small <a href=\"https://getbrick.com/products/grey-brick\" target=\"_blank\" rel=\"noopener\">physical device</a> that’ll set you back $59. The Brick itself is an NFC transmitter (it works like tap-to-pay), and when you want some distraction-free time, just press your phone against it to block (or unblock) specific apps. The controls are all managed in the Brick app. It’s incredibly simple, and that’s what makes it effective.</p><ul><li><p><strong>big story:</strong> cool kids write in <a href=\"https://www.wired.com/story/the-case-for-lowercase/\" target=\"_blank\" rel=\"noopener\">all lowercase</a>—does that make you mad?</p></li></ul><p><a href=\"https://www.wired.com/author/david-nield/\" target=\"_blank\" rel=\"noopener\">David Nield</a> is a tech journalist from Manchester in the UK, who has been writing about apps and gadgets for more than two decades. You can follow him on <a href=\"https://twitter.com/davidnield\" target=\"_blank\" rel=\"noopener\">X</a>. ... <a href=\"https://www.wired.com/author/david-nield\" target=\"_blank\" rel=\"noopener\">Read More</a></p>Read More<h2>Wired Coupons</h2>"},{"title":"All Esper locations in Final Fantasy Resonance","source":"Polygon","author":"@FionnTheBrave","url":"https://www.polygon.com/final-fantasy-resonance-esper-locations/","category":"gaming","categoryLabel":"Gaming","wordCount":817,"readingTime":5,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/josh-broadwell/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                        <p>Updated \n                                                                Oct 30, 2026, 4:15 PM EDT\n                            </p>\n                    \n                                                            \n                                                                        <p>And how to use Espers in battle</p>\n    \n        \n    \n<p><a href=\"https://www.polygon.com/final-fantasy-resonance/\" target=\"_blank\" rel=\"noopener\"><em>Final Fantasy Resonance</em></a>'s Espers give Fina an extra edge in combat, or sometimes they're just convenient decoys to bait the enemy into attacking them and not your party. However you use them, Espers are definitely worth the MP it costs to summon them. You have to put in some extra work to obtain them, though. Espers are tucked away in different spots around <em>Resonance</em>'s world, and you have to find and often fight them before Fina can use their powers.</p>    \n<p>Below, we show you where to find <strong>Esper locations in <em>Final Fantasy Resonance</em></strong> and explain how to recruit them.</p>    <p><strong>Update (Oct. 30)</strong>: We've updated this guide's table with Bahamut and an in-game image for Shiva's location.</p>    <h2>\n                        How Espers work in Final Fantasy Resonance\n               </h2>\n    \n                                                                                            \n        \n<p> Espers look like traditional Final Fantasy summons, but they behave differently. Fina is the only <a href=\"https://www.polygon.com/final-fantasy-resonance-party-members-location-how-to-unlock/\" target=\"_blank\" rel=\"noopener\">party member in <em>Final Fantasy Resonance</em></a> who can summon Espers, and there's an MP cost for each summon. They remain on the field until they act three times, but while all your support spells apply to them, <strong>you can't control them</strong>. The Esper will use a different action from their arsenal each turn and then end their time on the field with their strongest skill. You can't decide which skill your Esper uses or which enemy it targets.</p>    <p>Once the Esper vanishes, you can have Fina summon them again on her next turn and repeat the process until she doesn't have enough MP for the summon. MP is the only thing that matters. There's no charge meter or timer dictating how often you can bring an Esper out.</p>    <h2>\n                        All Esper locations in Final Fantasy Resonance\n               </h2>\n<p>Espers typically live in caves or dungeons, and you can usually pick up details about their locations by chatting with people in town. The knowledgeable people will have exclamation marks over their heads, indicating they know something worth telling. That info will then make its way to the world map, so you can bring it up and see that Esper's location any time.</p>    \n<p>Which is handy, since some of the Espers you have to fight are more challenging than the mandatory bosses that show up in that chapter. If you're running into difficulties, it's not a problem to just nope out and come back once your level is higher. The Esper will still be there.</p>    \n                    \n\n    \n    \n    <p>Esper</p>    \n    \n    \n    <p>Location</p>    \n    \n    \n    <p>First available chapter</p>    \n    \n    \n    <p>Recruitment requirement</p>    \n    \n            \n\n    \n    \n    <p>Siren</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 1</p>    \n    \n    \n    <p>Siren is a mandatory boss, so this is unmissable. She'll join you after you beat her in battle.</p>    \n    \n            \n    \n    \n    <p>Ramuh</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 2</p>    \n    \n    \n    <p>Find Ramuh in the Mt. Thunderclap summit in Dirnado (use the entrance east of <a href=\"https://www.polygon.com/final-fantasy-resonance-visions-locations-how-to-unlock/\" target=\"_blank\" rel=\"noopener\">Zidane's shrine</a>) and defeat him in battle. Ramuh is<strong> level 20</strong> and only <strong>weak to earth</strong>.</p>    \n    \n            \n    \n    \n    <p>Carbuncle</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 3</p>    \n    \n    \n    <p>Read the riddle on the tablet in Ruby Cave. You need to find three items on the world map in a specific order to recruit Carbuncle. However, the game marks their locations on the mini-map, and you can only find them in the correct order.</p>    \n    \n            \n    \n    \n    <p>Ifrit</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 5</p>    \n    \n    \n    <p>After you get the airship, you'll need to fly into this volcano to battle Ifrit. You may learn the rumor about Ifrit before you can actually fly up to him. As you may expect from the fire-based summon, he is <strong>weak to water</strong>. He's <strong>level 33</strong>.</p>    \n    \n            \n    \n    \n    <p>Titan</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 5</p>    \n    \n    \n    <p>You'll learn about this one in Kol, long before you can access it. Titan lives in the giant rock east of Siren's tower, but you can only bust the rock open after clearing the first round of gladiator trials in Grandshelt during Chapter 5. You earn a new hammer for Lid that way, and she uses it to break the rock.</p>    \n    <p> You'll need to fight Titan after breaking the rock. He's <strong>level 30</strong> and <strong>weak to wind</strong>.</p>    \n    \n            \n    \n    \n    <p>Leviathan</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 5</p>    \n    \n    \n    <p>After unlocking the airship, Nichol will have a side quest in Olderion called \"Nichol's Duty.\" You'll unlock Leviathan upon completing this quest.</p>    \n    \n            \n    \n    \n    <p>Shiva</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 5</p>    \n    \n    \n    <p>You can find this ice queen after <a href=\"https://www.polygon.com/final-fantasy-resonance-mysidia-location-how-to-find/\" target=\"_blank\" rel=\"noopener\">finding Mysidia</a>. She's in a snowstorm on the southern island. You will need to fight her. She's<strong> level 35</strong> and <strong>weak to</strong> <strong>fire</strong>.</p>    \n    \n            \n    \n    \n    <p>Odin</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 6</p>    \n    \n    \n    <p>After Fina learns Holy, head east in Gronoa to the Bladerain Stele cave and interact with the tablet to start this quest. During the quest, you'll need to fight Odin, who is <strong>level 45</strong> and <strong>weak to electricity</strong>.</p>    \n    \n            \n    \n    \n    <p>Bahamut</p>    \n    \n    \n    \n                                                                                            \n        \n    \n    \n    <p>Chapter 7</p>    \n    \n    \n    <p>Obtain the other Espers and clear Mt. Raizen in Chapter 7. When you board your airship, a cutscene with Fina will trigger. Talk to Evan in order to head to Bahamut for a battle. <strong>Bahamut is level 50</strong> and has <strong>no weaknesses or elemental resistances.</strong></p>    \n    \n            \n\n                            \n            \n<p><em>Table graphic: Julia Lee/Polygon | Source images: Square Enix, Lancarse/Square Enix via Polygon</em></p>"},{"title":"Supreme Court Clerks Who Become Law Professors (2012-2026)","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/10/29/supreme-court-clerks-who-become-law-professors-2012-2026/","category":"law","categoryLabel":"Law","wordCount":1325,"readingTime":7,"content":"<p>Yesterday, I <a href=\"https://reason.com/volokh/2026/10/28/some-reflections-on-the-lateral-hiring-market/\" target=\"_blank\" rel=\"noopener\">wrote</a> about the lateral hiring market. Here, I want to focus on the entry-level hiring market. Since 2012, the number of entry-level hires has dipped to the low 60s and spiked to the mid 140s. <a href=\"https://www.lawskyprojects.org/entry-level-hiring-report\" target=\"_blank\" rel=\"noopener\">Professor Sarah Lawsky</a> has carefully tracked these numbers over the years through a series of detailed hiring spreadsheets: <a href=\"https://docs.google.com/spreadsheets/d/1ImzZvZmJ_OnmoOFadsbhzuDYh2Coogq0qPPCwlVQqjU/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2012</a>, <a href=\"https://docs.google.com/spreadsheets/d/1zz8My-9k1GvOe-sgMzzfEfy2pODE5NaSLof7lmEV1sU/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2013</a>, <a href=\"https://docs.google.com/spreadsheets/d/145U_Qf21_ZOgxt6xIeB9HKo5Yl3ONWSXokiSrTGi7Rw/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2014</a>, <a href=\"https://docs.google.com/spreadsheets/d/1rH7KnCWYoVj2yy6Cdsax0P9NDE5mi1wpHlPIIDTVey0/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2015</a>, <a href=\"https://docs.google.com/spreadsheets/d/13dCzatDR_cdXgbvwO0bUQDKymz1huu-E8cX6lY2FeFc/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2016</a>, <a href=\"https://docs.google.com/spreadsheets/d/1_DubKH5dptE-bAsD1QCayM7VEXE9s9Th3h7ybB1QBfc/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2017</a>, <a href=\"https://docs.google.com/spreadsheets/d/10dqweaLT-X0vE31kqKH5lb4oEw1gOrjkOoO70j1CQs0/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2018</a>, <a href=\"https://docs.google.com/spreadsheets/d/1WUwPcac9GApAM1WcSV3B3kbDXkAeU2SOA-dQl3GIvrU/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2019</a>, <a href=\"https://docs.google.com/spreadsheets/d/1Bw8zfM3xs9Fgr1FeTl_im1Eg3ICgbHZTOxbyyV_188o/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2020</a>, <a href=\"https://docs.google.com/spreadsheets/d/1g3bcp2ga3akyadYkHWCsXgb_2v0dxhF9NczGQeW7aF0/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2021</a>, <a href=\"https://docs.google.com/spreadsheets/d/1Zmk6hW066mEByouQ8qGcb3WCmRgHFoloDa-qrWQAqJI/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2022</a>, <a href=\"https://docs.google.com/spreadsheets/d/1KwatmarZj5hVePPt_BbB86_Zwi7kT1N7g86S7ttO2iE/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2023</a>, <a href=\"https://docs.google.com/spreadsheets/d/1YQ9c7j_mrLT5llJi4cP2dprT1p05pCmWgY8RVilkcU0/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2024</a>, <a href=\"https://docs.google.com/spreadsheets/d/1ZoEKm-Rk1yQ6vg4X5HaZmv4Yr3Cu7qoCm9mrI1ayGcs/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2025</a>, and <a href=\"https://docs.google.com/spreadsheets/d/1Wl-wjyP52EfqC72qDyXh8m3tCAU0e57TFfLYFTQB2Qk/edit?gid=0#gid=0\" target=\"_blank\" rel=\"noopener\">2026</a>.</p>\n<p>Lawsky tracks how many entry-level hires completed Supreme Court clerkships. (This category does not record already hired law professors who are subsequently hired for Supreme Court clerkships.) I thought it might be worthwhile to dig into the numbers a bit more. Moreover, to continue my prior post on laterals, I wanted to track how often former SCOTUS clerks moved to other institutions. You can see the details in this <a href=\"https://docs.google.com/spreadsheets/d/1GJkeddBjj5leC6ntTRhvcdaSDv8mrULo30b7x3ZGMbQ/edit?gid=1713729320#gid=1713729320\" target=\"_blank\" rel=\"noopener\">spreadsheet</a>, which tracks hires of SCOTUS clerks between 2012 and 2026. Please let me know if I am missing any names or made any errors.</p>\n<p>How many academics has each Justice \"fed\"? Counting is actually a bit tricky, so I had to make some judgment calls. If a senior associate Justice hired a clerk, who was then assigned to an active member of the Court, I counted the hiring Justice. (Still, I found at least one law school bio that listed the active justice before the senior justice, a <a href=\"https://reason.com/volokh/2024/07/03/the-way-to-a-circuit-court-nomination-is-to-lose-a-landmark-supreme-court-case/\" target=\"_blank\" rel=\"noopener\">faux pas</a> in <a href=\"https://joshblackman.com/blog/2015/01/08/but-what-about-justice-souter/\" target=\"_blank\" rel=\"noopener\">my mind</a>.) Likewise, for the clerks hired during the final terms of Justice Scalia or Ginsburg's tenure, and who were then reassigned, I counted them as Scalia and Ginsburg clerks. What about the clerks who were hired by Scalia or Ginsburg for a future term after their passing? In that case, I chose the active Justice that made the decision to re-hire them. With all those caveats out of the way, here is the list.</p>\n<ol>\n<li>Justice Ginsburg (12 Clerks): Elizabeth Porter, Kate Andrias, Miriam Seifter, Robert Yablon, John Rappaport, Daphna Renan, Pamela Bookman, Hajin Kim, Payvand Ahdout, Rachel Bayefsky, Marco Basile, and Jack Boeglin.</li>\n<li>Justice Breyer (8 Clerks): Jennifer Nou, Rebecca Stone, Natalie Ram, Tejas Narechania, Andrew Crespo, Farah Peterson, Brian Richardson, and Thomas Schmidt.</li>\n<li>Justice Kennedy (7 Clerks): Chris Walker, Lisa Manheim, James Stern, Richard Re, Justin Walker, Daniel Epps, and Leah Litman.</li>\n<li>Justice Thomas (7 Clerks): Marah Stith McLeod, Jennifer Mascott, Robert Leider, Haley Proctor, Steven Lindsay, Brian Lipshutz, and Brittney Lane Kubisch.</li>\n<li>Justice Stevens (6 Clerks): Jean Galbraith, David Pozen, Jessica Bulman-Pozen, Sam Erman, Merritt McAlister, and Travis Crum.</li>\n<li>Justice Sotomayor (6 Clerks): Aaron Tang, Michael Pollack, Nikolas Bowie, Kevin Arlyck, Bridget Fahey, and Kamaile Turcan.</li>\n<li>Justice Souter (5 Clerks): Erin Delaney, David Han, Ann Lipton, Matthew Tokson, Mark Jia.</li>\n<li>Chief Justice Roberts (4 Clerks): William Baude, Paul Crane, Matthew A. Shapiro, and Ryan Snyder.</li>\n<li>Justice Alito (4 Clerks): Steven Menashi, J. Joel Alicea, Sherif Girgis, and Garrett West.</li>\n<li>Justice Scalia (3 Clerks): Aditya Bamzai, Ian Samuel, and Katherine Mims Crocker.</li>\n<li>Justice Kagan (3 Clerks): Daniel Hemel, Andrew Crespo, and Benjamin Eidelson.</li>\n<li>Justice Gorsuch (2 Clerks): Lael Weinberger and Micah Quigley.</li>\n</ol>\n<p>I have several observations.</p>\n<p><strong>First</strong>, during this time period, I suppose it makes sense that Justices Ginsburg and Breyer, both academics, hired so many law clerks who went onto become academics. But I was struck that Justice Kagan only hired three future academics. Perhaps her focus is not on the curious type that wants to write articles? Then again, as I've noted before, Professor Kagan didn't publish very much. She was a skilled administrator. To paraphrase John Kerry, \"I<a href=\"https://www.nationalreview.com/bench-memos/if-only-justice-kagan-had-meant-it-when-she-said-we-are-all-originalists/\" target=\"_blank\" rel=\"noopener\"> was for originalism before I was against it</a>.\" Who would have predicted that Justice Sotomayor would have twice as many academic clerks as Justice Kagan? Likewise, Justice Scalia, a former academic, only had three clerks hired into academia--only one of whom is conservative. Then again, I suspect ideological bias blocked many potential Scalia clerks from even considering the academy during this period. Justice Thomas has jumped ahead in the standings, but as I'll explain below, most of those placements are over the past three years.</p>\n<p><strong>Second</strong>, there are relatively few law professors who clerked on the Supreme Court. The percentage of entry-level hires with Supreme Court clerkships fluctuates. In 2012, there were seven clerks hired out of 140 reported hires: about 5%. In 2018, there were eight clerks hired out of 77 reported hires: nearly 10%. In 2026, there were four clerks hired out of 146 reported hires: about 3%. The hiring market has been fairly variable in recent years. Still, the persistent myth that you have to clerk on the Supreme Court to teach constitutional law should be retired. Very few ConLaw professors have actually clerked on the Supreme Court.</p>\n<p><strong>Third</strong>, the total number of hired clerks fluctuates each year, though it averages to about 5. I would wager that 100% of the clerks who apply for the entry-level market find a job somewhere. The Supreme Court pumps out about 36 clerks each year. Let's assume that around 13% of those clerks become law professors. Presumably, about 87% of Supreme Court law clerks do not go into academia, and find employment in the public or private sectors. Despite what one may think, the clerks who work to develop the law are not particularly interested in teaching it.</p>\n<p><strong>Fourth</strong>, the ideological imbalance of these clerks is stark, although it has corrected somewhat in recent years. Between 2012 and 2015, out of 25 entry-level hires, I count only four professors who were right-of-center: Chris Walker (Ohio State), James Stern (William and Mary), Will Baude (Chicago), and Justice Walker (Louisville). Between 2016 and 2019, there were also four right-of-center hires out of twenty total hires: Aditya Bamzai (Virginia), Steven Menashi (George Mason), Jennifer Mascott (George Mason), Robert Leider (George Mason). The rate has increased substantially from 2020 to the present with nine right-of-center hires out of twenty total hires: J. Joel Alicea (Catholic), Sherif Girgis (Notre Dame), Haley Proctor (Notre Dame), Garrett West (Alito), Steven Lindsay (Catholic), Lael Weinberger (George Mason), Brian Lipshutz (Florida), Micah Quigley (Notre Dame), and Brittney Lane Kubisch (Pepperdine).</p>\n<p><strong>Fifth</strong>, even as the rate of hiring has increased, left-of-center professors are still being recruited by higher-ranked institutions. Starting in 2012, there have been entry level hires of SCOTUS clerks at Harvard (5), Columbia (3), Virginia (3), Chicago (4), and more. Curiously, Yale has had zero progressive SCOTUS clerk hires, but it did hire Garrett West after he finished clerking for Justice Alito. By contrast, the bulk of the conservative hires have been at right-of-center law schools. George Mason, my alma matter, hired four SCOTUS clerks (two of whom are now federal circuit court judges). Notre Dame has hired four conservative SCOTUS clerks. Catholic has hired two.</p>\n<p><strong>Sixth</strong>, several schools recruited SCOTUS clerks as laterals. Jean Galbraith spent two years at Rutgers-Camden before moving to Penn in 2014. Michigan recruited Chris Walker from Ohio State, Harvard recruited Richard Re from UVA (previously at UCLA), and Harvard recruited Sherif Girgis from Notre Dame. The professor who moved around the most in the shortest span is Katherine Mims Crocker who started at William &amp; Mary in 2019, moved to Texas A&amp;M in 2024, and then to Cornell in 2026.</p>\n<p><strong>Eight</strong>, this post only considered law professors hired on the entry-level market between 2012 and 2026. I did not consider several professors who started clerkships after their first appointment. Justice Gorsuch has hired several of these academics: Stephanie Barclay (BYU, then Notre Dame, then Georgetown); Mark Storslee (Penn State, then Emory, then UNC); Christian Burset, (Notre Dame then Penn); and Tyler Lindley (BYU). Rev. Patrick Reidy began a clerkship with Justice Kavanaugh after he was appointed at Notre Dame. Professor Kerrel Murray at Columbia later clerked for Justice Jackson.</p>\n<p>It might be useful to expand this post further back from 2012 to see earlier trends. Another time.</p>"},{"title":"A Texas Cop Signed on to Help ICE Deport His Neighbors. It Tore the Town Apart.","source":"Longreads","author":"Brendan Fitzgerald","url":"https://longreads.com/2026/10/29/ingram-texas-ice-police-investigation/","category":"fun","categoryLabel":"Interesting Reads","wordCount":527,"readingTime":3,"content":"<p>A year ago in tiny Ingram, Texas, a local police officer named Jaron Alexander responded to a noise complaint—a baptism party, it turned out, held by Joanna Martinez and her extended family. Shortly after, Alexander began working in tandem with US Immigration and Customs Enforcement, in an arrangement that has <a href=\"https://www.npr.org/2026/10/28/g-s1-150296/287g-local-police-immigration-ice\" target=\"_blank\" rel=\"noopener\">recently doubled</a> the number of local police working with ICE. Within months, six people who attended Martinez’s party had been detained and deported, or else had fled from Ingram. Francesca D’Annunzio and McKenzie Funk grant impressive access to a local cop whose decision to work with ICE has transformed a small town into a claustrophobic nightmare, upending the local economy and fracturing countless relationships.</p>\n<blockquote>\n<p>One family notarized guardianship papers, in case the parents were detained and the children left behind. One woman swore Alexander showed up outside a memorial service and asked people for IDs. Another woman said he detained her and her husband when they returned home from church. Parties dwindled. Invite lists shrank. People began to move away, to Kerrville and San Antonio, and Alexander’s reputation reached as far as La Ceja, a village in the mountains of central Mexico, where an elderly resident said he and his neighbors were familiar with the Texas town’s police. “<em>El Charger negro</em>,” he said, with a knowing nod. He estimated that some 20 or 30 people in the village were recent deportees from Ingram.</p>\n<p>Alexander’s fortunes seemed to rise as the Martinez family’s fell. With her husband gone, Joanna Martinez couldn’t afford payments on the trailer they shared. She and their infant and her 4-year-old son moved back into her childhood bedroom in her mother’s crowded home, where several relatives and their children also lived. She tried to stay connected with her husband, Macias, via WhatsApp calls while working as much as she could as a house cleaner to keep afloat. “I can’t lock myself up in my room and just cry,” Martinez says.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore investigative features from ProPublica\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/10/14/starting-private-schools/\" target=\"_blank\" rel=\"noopener\">We’re Reporters, Not Teachers. We Were Able to Start Private Schools Anyway.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJennifer Smith Richards, Jodi S. Cohen, and Jennifer Berry Hawes; Milo Strain; Henry Culvyhouse; and Carli Brosseau | ProPublica, in partnership with Arkansas Times, Mountain State Spotlight, and The Assembly | October 2, 2026 | 2,924 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Our reporting has shown how easily people—some with questionable backgrounds—have founded their own private schools in barns, strip malls and other places. That led us to an experiment: If the hurdles to open a school are so low, could we do it?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/10/22/dominican-republic-major-league-baseball-investigation/\" target=\"_blank\" rel=\"noopener\">The Dominican Baseball Factory</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tGus Garcia-Roberts | ProPublica | September 10, 2026 | 9,378 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Teams make handshake deals with players as young as 11 while moneylenders prey on their families. The industry is corrupt, but Major League Baseball and the players union have done little about it.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/01/alice-sebold-anthony-broadwater-rape-investigation/\" target=\"_blank\" rel=\"noopener\">“That Guy is Still Out There”</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJoaquin Sapien | ProPublica | June 30, 2026 | 10,833 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Five years after Anthony Broadwater was belatedly cleared for the sexual assault of Alice Sebold, the questions of how he came to be wrongly convicted and how one or more serial rapists operated for years with little consequence have only deepened.”</p>"}];
