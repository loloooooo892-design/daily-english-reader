*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

}

.meta .sep {
  margin: 0 0.4em;

}

}

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

  display: flex;
  align-items: center;
  justify-content: space-between;

}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;

  color: var(--text-secondary);
  background: var(--swap-bg);

  padding: 0.45em 0.9em;

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {

}

.swap-counter {

.article-body ul, .article-body ol {

.article-body li {

.article-body a {

.article-body em { font-style: italic; }

.footer {

.archive-link {

<script>
var articles = [{"title":"Get more than 100 games for just $10 in a new bundle supporting laid-off game devs","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/get-more-than-100-games-for-just-usd10-in-a-new-bundle-supporting-laid-off-game-devs/","category":"gaming","categoryLabel":"Gaming","wordCount":514,"readingTime":3,"content":"<p>Game industry hardship fund bundle live on itch - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/ti-ATJAz94k\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>With layoffs continuing to wrack the games industry—Microsoft's decision to <a href=\"https://www.pcgamer.com/gaming-industry/xbox-is-laying-off-3-200-people-and-dumping-4-studios/\" target=\"_blank\" rel=\"noopener\">cut 3,200 people and ditch four studios</a> in July was the big attention-getter but hardly the only bad news of the month, or <a href=\"https://www.pcgamer.com/gaming-industry/foolproof-ways-to-get-laid-off-in-the-videogame-industry/\" target=\"_blank\" rel=\"noopener\">the past few years</a>—the United Videogame Workers union and Necrosoft Games have launched the <a href=\"https://itch.io/b/3802/game-industry-hardship-fund\" target=\"_blank\" rel=\"noopener\">Game Industry Hardship Fund bundle</a> on Itch.io, with more than 100 games on offer for just $10.</p><p>Funds raised by the bundle will go toward a hardship fund run by the union for game developers impacted by layoffs, who can apply to the fund for money to cover food, healthcare, and rent. Details on eligibility are available in this FAQ, but one thing to note is that the fund, like the union, is only available to developers in the US and Canada.</p><p>As with most Itch.io bundles, this one is very indie and offbeat, although there are some more mainstream names in the mix too, like A Short Hike, Skatebird, Drywall Eating Simulator, Dungeon Bodega Simulator, and You Can Save Everyone, to name my own personal shortlist.</p><p>But the real fun arises from diving into stuff you've never heard of and might not normally be drawn to. Diorama Dungeoncrawl looks like it might be kind of groovy, and how can you not be curious about Dirtbag Majhong?</p><p>It's hard to go wrong on 100+ games for a tenner—even if you hit just one winner in the bunch you've got your value out of it, and I would expect far better results than that, but we're making a point here. It's for a good cause too, which is nice, and speaking of that, you can pay more than $10 if you want to do a little extra solid for out-of-work devs.</p><blockquote><p>Special shoutout to the players who have been supporting and spreading the word about the itch bundle to support the Game Workers Hardship Fund! Your solidarity means the world to us, and player-dev solidarity is a critical component for driving positive change in the artform we love. We love you! 💪</p>— @videogameworkers.bsky.social (<a href=\"https://bsky.app/profile/did:plc:jbe7fjzzu224qthboll4palb?ref_src=embed\" target=\"_blank\" rel=\"noopener\">@videogameworkers.bsky.social.bsky.social</a>) <a href=\"https://bsky.app/profile/videogameworkers.bsky.social/post/3mrxo7vr22s23\" target=\"_blank\" rel=\"noopener\">2026-07-31T20:35:06.095Z</a></blockquote><p>The Game Industry Hardship bundle has, at this moment, raised just shy of $30,000. It'll be available for purchase until August 14.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"Amnesty International calls global extreme heat a human rights emergency","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/08/amnesty-international-calls-global-extreme-heat-a-human-rights-emergency/","category":"law","categoryLabel":"Law","wordCount":579,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/08/amnesty-international-calls-global-extreme-heat-a-human-rights-emergency/#\" target=\"_blank\" rel=\"noopener\">Amnesty International calls global extreme heat a human rights emergency</a>\n</strong><p>Marta Schaaf, Amnesty International’s program director for climate, social justice and corporate accountability, said Wednesday <a href=\"https://www.amnesty.org/en/latest/news/2026/07/global-extreme-heat-as-rights-burn/\" target=\"_blank\" rel=\"noopener\">in a statement</a> that the extreme heat driving wildfires, drought and floods across multiple continents amounts to a human rights emergency. She urged national governments to protect people now and to confront the fossil fuel industry Amnesty blames for the crisis.</p><p>Schaaf tied the crisis to corporate greed and government failure. “This heat is political… It is a human rights emergency that threatens the rights to life, health, housing, water and sanitation, food, education, and a healthy environment.” She added that “[t]hese harms are being made worse by authoritarian tactics that attack climate science, restrict protest, spread climate disinformation and shield powerful fossil fuel interests from accountability.” She described extreme heat as “a multiplier of human rights harm,” rather than a stand-alone disaster.</p><p>Amnesty’s statement lands amid mounting evidence of the toll that extreme heat has taken globally. The World Health Organization’s <a href=\"https://www.who.int/news-room/fact-sheets/detail/climate-change-heat-and-health\" target=\"_blank\" rel=\"noopener\">heat-and-health fact sheet</a> says the number of people exposed to extreme heat is climbing steeply in every region this century. It estimates roughly 489,000 heat-related deaths annually between 2000 and 2019. It also finds that heat mortality among people over 65 rose about 85 percent over two decades.</p><p>Those figures go in tandem with a summer of heat records in 2026. Successive heat domes have put tens of millions of Americans <a href=\"https://www.theguardian.com/us-news/2026/jul/15/extreme-heat-warnings-us\" target=\"_blank\" rel=\"noopener\">under heat alerts</a>, and federal data show the contiguous United States recorded its second-hottest first half of any year in 2026. In Europe, French authorities attributed <a href=\"https://www.washingtontimes.com/news/2026/jul/25/heat-dome-expands-across-central-us-creating-dangerous-conditions/\" target=\"_blank\" rel=\"noopener\">several thousand excess deaths</a> to a June heatwave. Later, wildfires forced the evacuation of <a href=\"https://www.aljazeera.com/news/2026/7/27/wildfires-in-southwest-europe-what-we-know-so-far\" target=\"_blank\" rel=\"noopener\">more than 325,000 people</a> in France and Spain, among the worst blazes in France <a href=\"https://www.youtube.com/watch?v=CIfWH1o5stE\" target=\"_blank\" rel=\"noopener\">since the Second World War</a>. Tunisia’s meteorological service recorded temperatures <a href=\"https://www.africanews.com/2026/07/19/tunisia-reels-in-extreme-heat-as-temperatures-near-50c/\" target=\"_blank\" rel=\"noopener\">near 50 degrees Celsius</a>, including a 49.7-degree reading in Kairouan that broke a regional record. Researchers at Istanbul Technical University reported that Türkiye is experiencing its <a href=\"https://www.dailysabah.com/turkiye/turkiye-records-strongest-heat-waves-in-75-years-study/news\" target=\"_blank\" rel=\"noopener\">most intense heatwaves in 75 years</a>. In India, <a href=\"https://www.euronews.com/2026/06/10/heatwaves-are-killing-tens-of-thousands-in-india-officials-are-barely-counting-them\" target=\"_blank\" rel=\"noopener\">a recent study</a> estimated that a single day of extreme heat corresponds with roughly 3,400 excess deaths nationwide. In Bangladesh, a <a href=\"https://documents.worldbank.org/en/publication/documents-reports/documentdetail/099112525183511448\" target=\"_blank\" rel=\"noopener\">2025 World Bank report</a> estimated that heat cost the economy 250 million lost workdays and US$1.78 billion in 2024. Moreover, a recent survey of <a href=\"https://www.eco-business.com/news/extreme-heat-takes-toll-on-dhakas-informal-workers/\" target=\"_blank\" rel=\"noopener\">Dhaka’s informal workers</a> found nearly three-quarters said rising temperatures had eroded their health and incomes. Canadian fire agencies, meanwhile, recorded <a href=\"https://www.reuters.com/sustainability/europe-north-africa-canada-wildfires-2026-07-28/\" target=\"_blank\" rel=\"noopener\">more active wildfires</a> and a larger burned area than in either of the past two years.</p><p>Amnesty paired its criticism with a two-part demand. In the near term, it called on governments to protect people through adaptation and climate-resilient public services. These include early warning systems, safe housing, access to water, and heat protections. In the long term, it called for making polluters pay, defending climate science and civic space, and delivering a rapid, fully funded and equitable phase-out of fossil fuels. This call particularly affects US President Donald Trump’s administration. The Trump administration began <a href=\"https://www.congress.gov/crs-product/R48504\" target=\"_blank\" rel=\"noopener\">a second US withdrawal</a> from the <a href=\"https://unfccc.int/process-and-meetings/the-paris-agreement\" target=\"_blank\" rel=\"noopener\">Paris Agreement</a> in January 2025, a move Amnesty <a href=\"https://www.jurist.org/news/2026/01/amnesty-international-us-withdrawal-from-paris-climate-agreement-sets-disturbing-precedent/\" target=\"_blank\" rel=\"noopener\">warned set a disturbing precedent</a>. In March 2025, Trump <a href=\"https://www.jurist.org/news/2025/03/us-withdraws-from-board-of-un-climate-damage-fund/\" target=\"_blank\" rel=\"noopener\">withdrew the US from the board of the UN climate loss-and-damage fund</a>. The Trump administration did <a href=\"https://www.federalregister.gov/documents/2025/01/29/2025-02003/declaring-a-national-energy-emergency\" target=\"_blank\" rel=\"noopener\">declare a national energy emergency</a> on his first day in office. However, Trump also <a href=\"https://www.federalregister.gov/documents/2025/04/14/2025-06379/protecting-american-energy-from-state-overreach\" target=\"_blank\" rel=\"noopener\">directed the Justice Department</a> to challenge state climate laws, and <a href=\"https://www.epa.gov/regulations-emissions-vehicles-and-engines/final-rule-rescission-greenhouse-gas-endangerment\" target=\"_blank\" rel=\"noopener\">moved to repeal the 2009 “endangerment finding”</a> that underpins most federal climate regulation.</p>"},{"title":"Is memory the moat? | Wafer","source":"Hacker News Best","author":"","url":"https://www.wafer.ai/blog/kimi-k3-mi355x","category":"tech","categoryLabel":"Technology","wordCount":1171,"readingTime":6,"content":"<a href=\"https://www.wafer.ai/\" target=\"_blank\" rel=\"noopener\"></a><ul><li>Product<ul><li><a href=\"https://www.wafer.ai/technology\" target=\"_blank\" rel=\"noopener\">Technology</a></li><li><a href=\"https://www.wafer.ai/cases\" target=\"_blank\" rel=\"noopener\">Cases</a></li></ul></li><li>Company<ul><li><a href=\"https://www.wafer.ai/team\" target=\"_blank\" rel=\"noopener\">Team</a></li><li><a href=\"https://jobs.ashbyhq.com/wafer\" target=\"_blank\" rel=\"noopener\">Careers</a></li><li><a href=\"https://www.wafer.ai/manifesto\" target=\"_blank\" rel=\"noopener\">Manifesto</a></li></ul></li><li><a href=\"https://www.wafer.ai/blog\" target=\"_blank\" rel=\"noopener\">Blog</a></li><li><a href=\"https://app.wafer.ai/login\" target=\"_blank\" rel=\"noopener\">Log in</a></li></ul>\n  <ul><li><a href=\"https://www.wafer.ai/blog/kimi-k3-mi355x/#how-we-did-it\" target=\"_blank\" rel=\"noopener\">How we did it</a></li><li><a href=\"https://www.wafer.ai/blog/kimi-k3-mi355x/#prefill-optimizations\" target=\"_blank\" rel=\"noopener\">Prefill optimizations</a></li><li><a href=\"https://www.wafer.ai/blog/kimi-k3-mi355x/#takeaways\" target=\"_blank\" rel=\"noopener\">Takeaways</a></li></ul>\n  <a href=\"https://www.wafer.ai/blog\" target=\"_blank\" rel=\"noopener\"></a>July 31, 2026Ian Ye<h2>Is memory the moat?</h2><p>Running Kimi K3 at ~952 tok/s/node, AMD continues to prove its case as the winner in performance per dollar.</p><p>Over the past several months, we’ve seen an explosion in the capabilities of open source models. With DeepSeek V4-Pro and GLM5.2 reaching <a href=\"https://z.ai/blog/glm-5.2\" target=\"_blank\" rel=\"noopener\">near-Opus</a> levels of intelligence, open source has emerged as a real, cost-efficient alternative to the closed source models we’ve been married to.</p>\n<p>But we have yet to see one like Kimi K3. Promising <a href=\"https://artificialanalysis.ai/models/kimi-k3\" target=\"_blank\" rel=\"noopener\">Fable/Sol</a> levels of intelligence, Kimi K3 marks the start of a new era for open source.</p>\n<p>But a smarter model means a <strong>bigger</strong> model — and these models are expanding in size just as fast as they are in capabilities. GLM5.2 has 753B parameters, DeepSeek V4-Pro 1.6T, and Kimi K3 weighs in at 2.8T (!!) parameters. That’s over 1.5TB of VRAM <em>before</em> allocating a KV cache for 1M tokens of context. Not even a B200 node (8 GPUs) can fit Kimi K3. That leaves you with limited options: serve on a node of B300s, which have 288GB of VRAM per GPU, or commit two B200 nodes (TP16) to serving Kimi.</p>\n<p>But guess which other non-NVIDIA GPU has 288GB of VRAM? AMD’s MI355X. Can you tell we like these chips yet? At around <a href=\"https://gpus.io/\" target=\"_blank\" rel=\"noopener\">~2.4× cheaper per GPU on average versus a B300</a> and ~1.7× cheaper than a B200, the MI355X is a cost-efficient alternative to Blackwells with comparable hardware specs. The only problem with AMD is software support — slower kernels and less day-0 support on inference frameworks make serving frontier models on AMD a real engineering effort. Our claim at Wafer is that agents are improving at kernel and model optimization, closing this gap as we speak. But with AMD shipping day-0 support for Kimi K3, most of the work was already done for us.</p>\n<p>The results are great: on a 1,024-token input / 400-token output benchmark, the MI355X reaches 952 tok/s/node and 118 tok/s single stream — over 3.8× the aggregate throughput per node and over 1.3× the single-stream decode of our TP16 B200 deployment (whose 498 tok/s is a 16-GPU, 2-node total — ~249/node). B300 nodes still win ~1.65× on aggregate throughput over the MI355X, but at 2.4× the price, the MI355X crushes the B300 on performance per dollar.</p>\n\n<strong>8× MI355X (TP8)</strong>\n2×8 B200 (TP16)\nB300 (TP8+DCP8)\n\nDecode tok/s per stream\n<strong>118 tok/s</strong>\n90 tok/s\n172 tok/s\n\nPeak aggregate\n<strong>952 tok/s</strong>\n498 tok/s\n1,568 tok/s\n\nPeak aggregate per GPU\n<strong>119 tok/s</strong>\n31 tok/s\n196 tok/s\n\nPeak aggregate per $/GPU-hr\n<strong>48 tok/s/$</strong>\n7 tok/s/$\n33 tok/s/$\n\n<p><em>Perf/dollar at <a href=\"https://gpus.io/\" target=\"_blank\" rel=\"noopener\">$2.50/GPU-hr for the MI355X, $6.00 for the B300, and $4.25 for the B200</a>.</em></p>\n\n<p>To the B200’s defence, its numbers are somewhat deflated by the fact that it pays a cross-node all-reduce on the decode critical path (RoCE v2 at ~195 Gb/s) — it’s the only config here that spans two nodes, because Kimi K3 won’t fit weights plus a 1M-token KV pool on a single 8×192GB node. But that’s exactly the point: Kimi K3 at its size is one of the first models we’ve seen where the MI355X’s focus on HBM capacity gives it a practical, measurable edge over the B200.</p>\n<h2>How we did it</h2>\n<p>While Kimi K3 served out of the box, there was still work to be done to get it to its current throughput number.</p>\n<p>The main lever was speculative decode. K3 ships zero draft tensors — no MTP, no EAGLE — so the only speculative path is an external block-diffusion draft: RadixArk’s <a href=\"https://huggingface.co/RadixArk/Kimi-K3-DSpark\" target=\"_blank\" rel=\"noopener\">Kimi-K3-DSpark</a>. On CUDA it just runs. On ROCm our first real request breaks the scheduler with this error:</p>\nNameError: name 'top_k_renorm_prob' is not defined. Did you mean: 'top_p_renorm_prob'?\n<p>sglang’s accept-sampling verifier has two ways to build the target distribution: a dense path that calls top_k_renorm_prob, and a sparse fast path that routes through torch.topk directly. The CUDA build imports top_k_renorm_prob from sgl_kernel; the ROCm build aliases only a Triton top-p kernel and leaves top_k_renorm_prob undefined — there’s no top-k renorm kernel for gfx950 to alias. So the moment a request lands on the dense path, the verifier hits that NameError and takes the scheduler down with it.</p>\n<p>The fix is a single PyTorch function. Top-k renorm is a small operation: take the model’s probability vector, keep the k highest entries, zero the rest, and rescale what’s left to sum to 1. A sort, a masked_fill, a divide — dropped straight into sglang’s ROCm sampling branch, the same computation the CUDA build gets from sgl_kernel. No custom kernel: the reflex on ROCm is to assume you need one, but here it was a missing definition, not a missing kernel.</p>\n<p>With spec dec fixed and hardened, we gained ~2.2× performance single-stream, ~1.7× per-stream at moderate load, and +18% peak aggregate. More importantly, our peak aggregate throughput landed on much higher concurrency (c64 vs c24 no-spec).</p>\n\n<h2>Prefill optimizations</h2>\n<p>Discussion around model performance tends to highlight decode tokens per second. But in many cases decode tok/s is fool’s gold — decode is over-glorified, while time-to-first-token, the number users <em>feel</em> the most, gets overlooked.</p>\n<p>The MI355X struggles here: an identical 172k-token cold prefill took ~51s on MI355X versus ~23s on a B300. On a 1M-context model, a lot of workloads have huge prefills (sometimes cold), and having GPUs spin on prefill for minutes can render entire fleets of nodes useless.</p>\n<p>The gap was almost entirely one kernel. K3 on ROCm was falling back to slow generic Triton attention because the fast AITER MLA prefill kernel wouldn’t load. The problem was a shape mismatch, not a missing kernel — K3 at TP8 gives 12 attention heads per rank, and AITER’s MLA path is built for 4, 8, or multiples of 16. The fix was trivially simple: zero-pad the head count 12→16, run the fast kernel, and extract the real 12 heads from the output.</p>\n<p>The result: on the same 172k cold prefill, the AITER MLA prefill ASM runs at ~13k tok/s steady-state vs the Triton fallback’s ~4–7k, speeding up prefill by ~2–3×. It’s a TTFT lever, not an aggregate-throughput one — decode is unchanged, so it doesn’t move the numbers above; it moves the number a user waits on before the first token appears.</p>\n<h2>Takeaways</h2>\n<p>Achieving the best performance-per-dollar ratio on the MI355X was relatively out of the box. There were some expected framework-related bugs — but fewer than <a href=\"https://www.wafer.ai/blog/glm52-amd\" target=\"_blank\" rel=\"noopener\">GLM5.2</a>, and this time it <a href=\"https://www.wafer.ai/blog/kernels-are-still-the-moat\" target=\"_blank\" rel=\"noopener\">certainly did not require custom kernels</a>.</p>\n<p>SOTA on AMD is imminent. Is the CUDA moat dead?</p>\n\n  <h2>Related articles</h2><ul><li><a href=\"https://www.wafer.ai/blog/wafer-integration-with-truefoundry-ai-gateway\" target=\"_blank\" rel=\"noopener\">July 17, 2026Rishiraj Dutta Gupta and Wafer Team<h3>Wafer integration with TrueFoundry AI Gateway</h3><p>How Wafer's fast, OpenAI-compatible serverless inference integrates with TrueFoundry AI Gateway for unified routing, observability, and zero data retention.</p></a></li><li><a href=\"https://www.wafer.ai/blog/glm52-amd\" target=\"_blank\" rel=\"noopener\">July 3, 2026Ian Ye<h3>Performance per dollar is getting faster and cheaper</h3><p>How we served GLM5.2 on AMD MI355X at 2626 tok/s/node and 213 tok/s single stream at over 2x lower cost than Blackwell.</p></a></li></ul>"},{"title":"Rachel Yoder on a Mennonite Childhood and a Story About the Devil","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/this-week-in-fiction/rachel-yoder-08-10-26","category":"fun","categoryLabel":"Interesting Reads","wordCount":1359,"readingTime":7,"content":"<p><strong>Your story “<a href=\"https://www.newyorker.com/magazine/2026/08/10/the-promise-fiction-rachel-yoder\" target=\"_blank\" rel=\"noopener\">The Promise</a>” follows a couple of days in the life of an eight-year-old girl named Birdie, who is growing up in a Mennonite community, in the nineteen-eighties. Her parents are away, and she is staying with her aunts and her grandmother, about to start second grade. What inspired the story, and what makes these two days in Birdie’s life so important?</strong></p><p>In “The Promise,” Birdie’s aunt Miriam tells her a story about the Devil and a typewriter. My aunt Clara also told me a story about a devil and a typewriter when I was little, but all I retained were those two details. I couldn’t remember what happened in the story, so I decided to write my own version. I think it was so peculiar, and also incredibly fun, that Clara told me this story. Did she believe it had actually happened? I’ll never know.</p><p>When Birdie stays at her aunts’ house, she learns about complex concepts and has new feelings that she’ll spend decades sorting out: the feeling that her parents betrayed her by leaving her behind and missing her first day of school, the conflicting terror and appeal of the Devil on his typewriter, the confusion between love and hate. Perhaps these two days represent the end of an era for her.</p><p><strong>In the course of her stay, Birdie explores the rooms of her aunts and grandmother’s house, and has encounters with her relatives. Both of her aunts seem kind but also seem to want to scare her, one by insisting that she look at the scar from her grandmother’s mastectomy, the other by telling her a story about the Devil. Why do they do these things?</strong></p><p>I’m interested in the ways that Mennonites repress or beautify or overlook horror. When I was a child, my uncle’s veal barn was a locus of true horror for me—<em>These babies are going to be slaughtered!</em>—but I could never say something like that. It would have been viewed as sensitive, dramatic, maybe funny. Instead, I stopped eating meat. I think Birdie’s aunts are trying, in the best ways they know how, to cope with complicated emotions that are unspeakable—Rebecca, with her grief, as she pulls at her mother’s dress to show the scar, and Miriam, with her ambivalence toward marriage and her tale about the Devil.</p><p><strong>The story captures the very tactile, sensory details of Birdie’s physical world, and her thoughts and perceptions. How did you inhabit that child’s-eye view?</strong></p><p>This story is first and foremost written out of love—love for this place and these people and this particular cultural moment, all of which are now long gone. When I was a little girl, I was able to love them in an uncomplicated way, and I wanted to return to that pure love. It was a relief.</p><p>I had also recently given my students an assignment to write a scene inspired by Claude Debussy’s “Rêverie,” so I decided to do the exercise myself. I picked this piece of music because for me it elicits such a mix of emotions and tones—dreamy, nostalgic, sad, beautiful. I began writing the story while listening to this song on repeat, and I think it helped me to feel my way back to that little girl.</p><p><strong>Birdie meditates on the idea of roots, how they hold her family’s house and her relatives themselves to the land where they live, and where they are “happy, and happy, and happy.” But she herself doesn’t want to be rooted. What has she already learned at age eight that makes her feel this way?</strong></p><p>I spent a lot of my childhood watching women work in the kitchen, be it my aunts making casseroles, or my extended family cleaning up in the church kitchen after a Thanksgiving feast, or my own mom, after a full day of work, coming home to cook dinner. I did not see a single man in a kitchen, ever, until I was much older. Believe it or not, kitchen work didn’t interest me as a small child, and it doesn’t interest Birdie, either. She is dreaming of going to the moon, and of being a ballerina, center stage, with everyone watching her. Both of these dreams are somewhat sinful: Why would you want to go so far from home? Why would you want all the attention for yourself? So, at eight, she already understands that her desires are bad, maybe even evil. She can’t stay.</p><p><strong>Birdie takes to heart (and into her imagination) her aunt’s story of the Devil with a typewriter, writing people’s life stories in exchange for their souls. Is Miriam trying to give Birdie a message? In the community where you grew up, was being a writer considered a sin? And, if so, how did you navigate that choice?</strong></p><p>I don’t know that Miriam is all that aware of why she’s telling Birdie this story. I think the story titillates her more than anything. And, no, being a writer isn’t a sin, but, at least in my extended family, stories are sacred, and who gets to tell them is of great importance. Typically, this has fallen to the men, so I think it’s uncomfortable for some to have a woman who is now telling stories publicly and, even worse, not telling the right stories. For instance, some members of my extended family dislike my novel “<a href=\"https://www.amazon.com/dp/0385546815\" target=\"_blank\" rel=\"noopener\">Nightbitch</a><em>,</em>” and I heard that a cousin called it “evil.”</p><p><strong>In your mind, does Birdie leave the community? It seems that she will, but then her wedding reception, decades later, is held in a barn, which perhaps implies not.</strong></p><p>I think the more pressing questions for me are: What does it mean for Birdie, at the end of the story, to forget? And is it essential, at least to some degree, for a woman to forget herself in order to belong, whether to the Mennonites or to a marriage?</p><p><strong>At the end of the story, Birdie, feverish and somewhat delirious, holds out a butcher knife and tells her aunt, “I am the bride, and this is my promise.” Her promise expresses, in some way, her kinship with her unmarried aunt, who didn’t trade her own freedom for a set of good knives. But there is more to it than that, right?</strong></p><p>I don’t know exactly what the promise is, but it has something to do with the submerged violence of patriarchy, and also what it takes for a woman to sever herself from this tradition. I think it takes a knife—whether literal or metaphorical—to do that, and I think it hurts, and can be violent, if not physically, at least emotionally. I like that we don’t fully understand what the promise is, and that it can keep refracting in different ways, like light bouncing off a blade. I think the promise might also be, in part, a threat.</p><p><strong>“Nightbitch,” which came out in 2021, tells the story of a new mother who transforms into a dog at night. It is, obviously, not a directly realist work in the way that “The Promise” seems to be. Was it difficult to approach storytelling in such a different way? I believe you’re working on a new novel; does it fall into one of these two styles?</strong></p><p>What felt most different for me when writing “The Promise” was the engine that was fuelling the narrative. For “Nightbitch,” that engine was powered by a pronounced voice and a boundless rage, so the first third of the book is written in these gangly, roving sentences that are in incredibly close third person. “The Promise” is driven by observation and horror, so the sentences came out much more orderly and restrained, with a greater distance from the main character, and mere suggestions of some unarticulated violence lurking beneath the surface. (In “Nightbitch,” there is nothing lurking beneath the surface. It is all jettisoned from the body and onto the page as soon as it is thought.) The new novel is a mess! I think it’s working with repression and grief as narrative forces, and I’m still figuring out what that looks and sounds like. ♦</p>"}];
