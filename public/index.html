*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Reflections on the 25th Anniversary of 9/11","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/09/11/reflections-on-the-25th-anniversary-of-9-11/","category":"law","categoryLabel":"Law","wordCount":860,"readingTime":5,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/tag/terrorism/\" target=\"_blank\" rel=\"noopener\">Terrorism</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/09/11/reflections-on-the-25th-anniversary-of-9-11/\" target=\"_blank\" rel=\"noopener\">Reflections on the 25th Anniversary of 9/11</a>\n\t\t\t\t\t<p>Links to writings about the 9/11 attack and its aftermath, and the ongoing issues of the proliferation of dangerous emergency powers, and protecting Aghans who fled the Taliban.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t9.11.2026 10:38 AM\n</p>\n\t</h2>\n\t\n\t\t  <p>Today is the 25th anniversary of the 9/11 attack. I have written about my memories of that event and reflections on its aftermath before. I will not recapitulate all of that in this post. But here is <a href=\"https://reason.com/volokh/2021/09/11/memories-of-9-11-and-its-aftermath/\" target=\"_blank\" rel=\"noopener\">a link</a> to my piece on that subject, written on the twentieth anniversary of the attack. A brief excerpt:</p> <blockquote><p>On the day of 9/11, I was clerking for a federal judge in Houston, Texas. I <a href=\"https://volokh.com/2011/09/11/memories-of-911/\" target=\"_blank\" rel=\"noopener\">first heard about the attacks listening to the radio on my way to work that morning</a>. The dial was tuned to a \"top 40\" station that almost never had any news. So when they interrupted the usual programming to say that a plane had crashed into the World Trade Center, I assumed it must be some sort of hoax. I had read about <a href=\"https://www.amazon.com/dp/1412804701/ref=nosim?tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\">the 1938 \"War of the Worlds\" radio program scare</a> (some listeners were convinced there was an actual alien invasion). I thought this might be the same sort of thing.</p> <p>When I got to the office and turned on my computer, I could not load the CNN website; too many other people were trying to access it. That's when I knew the attack was real.</p> <p>Business in our judge's chambers went on more or less normally for most of the day. But I did call some people I knew in the New York area to see about their safety. The longest of these conversations was with the brother of a Muslim friend who worked near the Twin Towers. By the time we spoke (it was late morning), we already knew the attack was likely the work of radical Islamist terrorists. We discussed the implications for US foreign policy, and also the possibility of an upsurge of anti-Muslim bigotry at home. We both thought there would be a strong military response, and also both were in favor of the idea; I still think it was necessary, though many in retrospect disagree.</p> <p>With respect to the other issue, I said historical precedent…. suggested such a backlash could well happen. But I also thought there would be more resistance to it than in earlier eras….</p> <p>To an extent, I turned out to be right; but only to an extent…..</p></blockquote> <p>I would also like to highlight two major pieces of unfinished business from the attacks and the ensuing war in Afghanistan.</p> <p>First, as prominent conservative legal scholar and former federal judge Michael McConnell points out in <a href=\"https://www.city-journal.org/article/911-george-bush-emergency-executive-power\" target=\"_blank\" rel=\"noopener\">a recent article</a>, 9/11 accelerated and exacerbated a trend towards normalizing the constant use of dangerous emergency powers by the executive. While the 9/11 attack was a genuine emergency, the reaction to it helped incentivize the use of such powers even in response to normal public policy problems, and even issues (such as trade deficits) that aren't genuine problems at all.</p> <p>McConnell is right to urge Congress to curb the use of emergency powers. The judiciary can also help by engaging in stronger judicial review of their invocation by the executive. I outline how and why this should be done in two articles published last year:</p> <p>\"<a href=\"https://thedispatch.com/article/not-everything-is-an-emergency/?utm_campaign=92a0054b-e0f4-4a3b-b89b-56be58b731a7&amp;utm_source=E1F2g-3H4i5-J6k7L-8m9N0\" target=\"_blank\" rel=\"noopener\">Not Everything is an Emergency</a>,\" <em>The Dispatc</em>h, July 31, 2025 (non-paywalled version <a href=\"https://www.cato.org/commentary/not-everything-emergency\" target=\"_blank\" rel=\"noopener\">here</a>).</p> <p>\"<a href=\"https://www.lawfaremedia.org/article/trump-s-'emergencies'-are-pretexts-for-undermining-the-constitution\" target=\"_blank\" rel=\"noopener\">Trump's 'Emergencies' Are Pretexts for Undermining the Constitution</a>,\" <em>Lawfare</em>, May 15, 2025.</p> <p>And, for those keeping score, yes, I also objected to the abuse of emergency powers under Biden. See, e.g., <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4065817\" target=\"_blank\" rel=\"noopener\">here</a> and <a href=\"https://www.scotusblog.com/2023/02/dont-let-the-executive-abuse-emergency-powers-to-raid-the-treasury/\" target=\"_blank\" rel=\"noopener\">here</a>.</p> <p>The second major outstanding issue is the treatment of Afghans who fled the Taliban, including many who aided US forces during the war. Along with others, I have long argued for giving these people rights to permanent residency in the US, thereby protecting them against deportation back to their oppressors (see <a href=\"https://reason.com/volokh/2021/08/20/the-case-for-taking-afghan-refugees/\" target=\"_blank\" rel=\"noopener\">here</a> and <a href=\"https://reason.com/volokh/2023/08/15/time-to-pass-the-afghan-adjustment-act/\" target=\"_blank\" rel=\"noopener\">here</a>).</p> <p>Unfortunately, under Trump 2.0, we have done the exact opposite. Trump has<a href=\"https://reason.com/volokh/2025/05/26/trump-seeks-to-deport-afghans-who-fled-the-taliban/\" target=\"_blank\" rel=\"noopener\"> sought to deport Afghan refugees from the Taliban</a> - including those who aided us in the War in Terror - back to their oppressors, and <a href=\"https://reason.com/volokh/2025/05/26/trump-seeks-to-deport-afghans-who-fled-the-taliban/\" target=\"_blank\" rel=\"noopener\">suspended processing of immigration applications and \"benefits\" for all Afghans</a>. The suspension <a href=\"https://support.iraplegalinfo.org/hc/en-us/articles/43977659159188-What-do-the-recent-U-S-immigration-changes-mean-for-Afghans\" target=\"_blank\" rel=\"noopener\">remains in place</a> for almost all Afghan visa applicants, including those eligible for special visas because they helped US forces in the war. A June 2026 <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.rid.61671/gov.uscourts.rid.61671.28.0.pdf\" target=\"_blank\" rel=\"noopener\">court decision</a> ruled against the suspension and \"re-review\" of visas and  benefit processing for those in the US.</p> <p>These efforts to deport Afghans back to their oppressors are simultaneously unjust and couterproductive for reasons I summarized <a href=\"https://reason.com/volokh/2025/11/27/trumps-unjust-and-counterproductive-collective-punishment-of-afghan-migrants/\" target=\"_blank\" rel=\"noopener\">here</a>.</p> <p>The 25th anniversary of 9/11 is an appropriate time to honor and remember the victims of that horrific attack. It is also as good a time as any for us to work to protect Afghans who aided us in the War and fled the Taliban, and to curb the dangerous emergency powers that have proliferated over the last twenty-five years.</p>\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/09/11/a-pardon-cannot-change-the-underlying-facts-and-truth-for-purposes-of-a-defamation-action/\" target=\"_blank\" rel=\"noopener\">NEXT: \"A Pardon Cannot ... Change the Underlying Facts and Truth\" for Purposes of a Defamation Action</a>\n    </p>\n\t<a href=\"https://reason.com/tag/terrorism/\" target=\"_blank\" rel=\"noopener\">Terrorism</a><a href=\"https://reason.com/tag/911/\" target=\"_blank\" rel=\"noopener\">9/11</a><a href=\"https://reason.com/tag/emergency-powers/\" target=\"_blank\" rel=\"noopener\">Emergency Powers</a><a href=\"https://reason.com/category/immigration/\" target=\"_blank\" rel=\"noopener\">Immigration</a>"},{"title":"What Bird Feeding Has to Do with Happiness - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/what-bird-feeding-has-to-do-with-happiness-1284926/","category":"fun","categoryLabel":"Interesting Reads","wordCount":717,"readingTime":4,"content":"<p>In the classic 1964 children’s film <em>Mary Poppins</em>, the governess sings a gentle lullaby to the children in her charge one evening called “Feed the Birds<em>.</em>” The lyrics describe a little old bird woman who goes to the steps of St. Paul’s Cathedral in London each day. She calls to the tourists to feed the little birds, to “show them you care,” and says it will make the tourists glad.</p><p>Modern science seems to be catching up with Mary Poppins: A recent study found that feeding wild birds can make people feel better. The more than 3,600 people who participated in the new study were offering snacks from backyard feeders, however, not purchasing crumbs from a little old bird woman in a city square. These residents of Canada and the United States were enrolled in <a href=\"https://feederwatch.org/learn/feeding-birds/\" target=\"_blank\" rel=\"noopener\">Project Feederwatch</a>, a platform that allows people to submit feeding observations to the Cornell Lab of Ornithology. A team of researchers surveyed them twice over a 6-month period and the vast majority—some 95 percent—reported that feeding and observing birds had positive impacts on their well-being. By comparison, just 55 percent said other events in their lives did. The researchers published their <a href=\"https://link.springer.com/article/10.1007/s13280-026-02471-2\" target=\"_blank\" rel=\"noopener\">results</a> in the journal <em>Ambio</em>.</p><p>Featured Video</p><p><strong>Read more: </strong><a href=\"https://nautil.us/the-woman-who-saw-birds-as-individuals-1207714\" target=\"_blank\" rel=\"noopener\"><strong>“The Woman Who Say Birds As Individuals”</strong></a></p><p>Feelings of joy, gratitude, hope, and calm dominated among those who said feeding their feathered friends helped them. Some of them also said it gave them a sense of meaning: They believed what they were doing was helping the birds or contributing to science. Others said feeding and watching the birds helped reduce stress and gave them the opportunity to focus on something happy during otherwise difficult times, such as a death in the family.</p><p>Of course, anyone who volunteers for Project Feederwatch could reasonably be described as a bird lover, so the study participants in this particular research effort may be a self-selected group, already inclined to find joy in anything related to avian species. Still, the bird-feeding findings add to a growing body of literature that suggests engagement with “nature” in general, and birds in particular, may have therapeutic effects for people who are unwell, and possibly <a href=\"https://nautil.us/can-nature-benefit-you-if-youre-already-well-1284801\" target=\"_blank\" rel=\"noopener\">fortifying</a> effects for people who are already healthy.</p><p>One intervention <a href=\"https://link.springer.com/article/10.1007/s11252-023-01334-y\" target=\"_blank\" rel=\"noopener\">study</a> from the 2020s, for instance, found that just 30 minutes of bird feeding and bird counting, combined with a joy-rating exercise, lowered anxiety and boosted feelings of well-being. Another <a href=\"https://psycnet.apa.org/record/2024-22556-001\" target=\"_blank\" rel=\"noopener\">study</a> of German nursing home residents found that movement levels, memory, concentration, bird knowledge, and life satisfaction increased over the course of a multi-month intervention where the residents were tasked with watching birds feed through a window. And an experimental <a href=\"https://www.semanticscholar.org/paper/Birdwatching-linked-to-increased-psychological-on-a-Peterson-Larson/c15179bdea32f95484e1a9cf5a90e1ae664a875a\" target=\"_blank\" rel=\"noopener\">study</a> of college students found that bird walks did more to increase well-being and reduce stress than a general nature walk.</p><p>Bird feeding is, of course, no magic cure-all. Some people in the Project Feederwatch study actually felt worse after feeding the birds. They had distressing or annoying experiences or found that watching and feeding the birds just led to grief and conservation anxiety. “I have observed the frequency of several birds decline in the 10 years I have done FeederWatch,” one person noted. “It makes me feel like crying.’’ The impact on one’s mental health might also depend on the bird. Previous research has <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0272494413000650\" target=\"_blank\" rel=\"noopener\">found</a> that emotional responses tend to be less positive when they involve listening to the harsh squawks and squeals of the Eurasian magpie, also known as the Pica pica, or the eerie hooting of owls.</p><p>Feeding birds can also potentially have negative effects on the birds themselves. It could make them more susceptible to disease, to flying into windows and dying, to falling prey to pet cats, and to changes in their natural behaviors. On the other hand, though, feeding them could have positive impacts on bird diversity by ensuring a food source, and it could enhance interest in conservation among humans, the researchers reported.</p><p>If it turns out the positives for both birds and humans outweigh the negatives, perhaps it’s time to encourage more people to let these flighty creatures know that we care. As one study subject put it, feeding birds is “a good reason to get up every morning!” </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Nitr / Shutterstock</em></p>"},{"title":"8 New TV Shows to Watch This Weekend on Netflix, HBO Max, and Apple TV (September 11-13)","source":"Polygon","author":"@cachiloreto","url":"https://www.polygon.com/new-tv-shows-streaming-this-weekend-netflix-september-11-13/","category":"gaming","categoryLabel":"Gaming","wordCount":762,"readingTime":4,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/maria-loreto/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Sep 11, 2026, 4:31 PM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>The sequel to one of the most beloved TV shows ever made, a DC cartoon, and more</p>\n    \n        \n    \n                                                     <p>Happy weekend! As we enter the fall season, it’s a great time to check out our <a href=\"https://www.polygon.com/polygons-2026-fall-preview/\" target=\"_blank\" rel=\"noopener\">Fall Preview</a> coverage, teasing the best that’s coming in movies, shows, books, and video games. When it comes to new TV releases out this weekend, we’ve got you covered.</p>    <p><em>The Paper </em>is back for a second season. The follow-up and spin-off to <em>The Office </em>trails a group of novice journalists at the Toledo Truth Teller, a fading newspaper in the Midwest that’s hoping to revitalize its readership.</p>    <p>It’s also a big weekend for DC. While Supergirl is making its streaming debut on HBO Max, you can also watch <em>Krypto Saves the Day, </em>a short animated series following her beloved and adventurous dog.</p>    <h2>\n            1 \n        \n                            The Paper\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Peacock</strong>\n                        </li>\n                    <li>\n                                        Genre: Comedy\n                        </li>\n                    <li>\n                                        Episode count: 10\n                        </li>\n                    <li>\n                                        Cast: Domhall Gleeson, Sabrina Impacciatore, Oscar Nunez\n                        </li>\n            </ul>\n<p><em>The Paper </em>expands on the universe first established in <em>The Office,</em> following the same documentary crew (and Oscar Martinez) as they move on to a new project: a struggling newspaper in Ohio called the Toledo Truth Teller, which relies on the work of volunteer reporters.</p>    <h2>\n            2 \n        \n                            Krypto Saves the Day!\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on HBO Max</strong>\n                        </li>\n                    <li>\n                                        Genre: Animation\n                        </li>\n                    <li>\n                                        Episode count: 4\n                        </li>\n                    <li>\n                                        Cast: Teigo Dawson, James Simba, Aya Taryn\n                        </li>\n            </ul>\n<p><em>Krypto Saves the Day </em>is back for a second season, following the adventures of Krypto in Metropolis, with Superman making regular appearances. Each episode lasts a couple of minutes, with the new season promising adventures in outer space alongside appearances from Supergirl, Lobo, and more.</p>    <p>Per our Polygon <a href=\"https://www.polygon.com/superman-krypto-saves-the-day-animated-shorts/\" target=\"_blank\" rel=\"noopener\">coverage</a> of Krypto season 1:</p>    <blockquote>\n                        <p>The Kryptonian pooch <a href=\"https://www.polygon.com/books/611566/superman-movie-krypto-dog-cape-design/\" target=\"_blank\" rel=\"noopener\">Krypto</a> causes all manner of havoc in James Gunn’s <a href=\"https://www.polygon.com/review/611560/superman-james-gunn-dcu-reboot-review/\" target=\"_blank\" rel=\"noopener\"><em>Superman</em></a>, tearing up the Fortress of Solitude and chomping on Lex Luthor’s drones like chew toys. Now he has a starring role in a series of four animated shorts that will be included as a special feature with home editions of the film, which is coming to digital on Aug. 15 and will have a physical release on Sept. 23.</p>    \n            </blockquote><h2>\n            3 \n        \n                            Made in Korea\n                    \n       </h2>\n    <ul>\n                    <li>\n                                        <strong>Available on Hulu</strong>\n                        </li>\n                    <li>\n                                        Genre: Crime\n                        </li>\n                    <li>\n                                        Episode count: 6\n                        </li>\n                    <li>\n                                        Cast: Hyun Bin and Jung Woo-sung.\n                        </li>\n            </ul>\n<p>Set in the ‘70s, <em>Made in Korea </em>follows the cat-and-mouse game between a KCIA agent who moonlights as a smuggler and drug trafficker, and the committed prosecutor on his tail.</p>    <h2>\n            4 \n        \n                            Last Seen\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Apple TV</strong>\n                        </li>\n                    <li>\n                                        Genre: Thriller\n                        </li>\n                    <li>\n                                        Episode count: 6\n                        </li>\n                    <li>\n                                        Cast: Patrick Brammall, Maxine Peake, Brendan Cowell\n                        </li>\n            </ul>\n<p>This new Australian series follows an alcoholic police dispatcher who receives a phone call informing him of a body found near his home. He believes the body belongs to his daughter, who was kidnapped 11 years ago and is presumed dead.</p>    <h2>\n            5 \n        \n                            A Killer Story\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on HBO Max</strong>\n                        </li>\n                    <li>\n                                        Genre: True crime\n                        </li>\n                    <li>\n                                        Episode count: 3\n                        </li>\n                    <li>\n                                        Cast: Joe Sexton, Dana Chandler.\n                        </li>\n            </ul>\n<p>Filmed over a period of six years,<em> A Killer Story </em>explores the double murder of Mike Sisco and Karen Harkness, a couple based in Topeka, Kansas, believed to have been killed by Dana Chandler, Sisco’s ex-wife. The documentary follows Joe Sexton, an investigative journalist who decides to explore the case fully after receiving thousands of emails and tips from amateur sleuths.</p>    <h2>\n            6 \n        \n                            Stolen Heartbeats\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Thriller\n                        </li>\n                    <li>\n                                        Episode count: 50\n                        </li>\n                    <li>\n                                        Cast: Jeronimo Cantillo, Rami Herrera\n                        </li>\n            </ul>\n<p>If you’re looking for a soapy Colombian drama that shows just how inventive Netflix is getting with its format, <em>Stolen Heartbeats</em> might be your answer. It explores the story of a woman in a coma and the nurse tending to her in the hospital who can hear her thoughts. But the most noteworthy part is its format. The series is 50 episodes long, with each installment lasting between 1 and 5 minutes.</p>    <h2>\n            7 \n        \n                            Crew Girl\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Sports drama\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: Miku Martineau, Byron Lawson, Jessica Pare\n                        </li>\n            </ul>\n<p><em>Crew Girl </em>is Netflix’s latest young adult drama, following Teagan, a competitive rower from a wealthy family. The series picks up as she moves to a new town with her mom, following a financial fraud scandal involving her father that left them in ruins.</p>    <h2>\n            8 \n        \n                            Call the Midwife\n                    \n       </h2>\n    \n                                                                                            \n        \n    <ul>\n                    <li>\n                                        <strong>Available on Netflix</strong>\n                        </li>\n                    <li>\n                                        Genre: Historical drama\n                        </li>\n                    <li>\n                                        Episode count: 8\n                        </li>\n                    <li>\n                                        Cast: Helen George, Laura Main, Jessica Raine\n                        </li>\n            </ul>\n<p>The 15th season of the beloved BBC series is now available on Netflix. The long-running show follows nurses, midwives, and nuns working in impoverished areas in London, starting in 1957. New seasons explore the stories of new cast members, storylines, and the concerns of the times.</p>"},{"title":"Top Ulta Beauty Promo Codes: 50% Off","source":"Wired","author":"@wired","url":"https://www.wired.com/story/ulta-coupon/","category":"tech","categoryLabel":"Technology","wordCount":890,"readingTime":5,"content":"<p>At Ulta Beauty, you can stock up on skincare, makeup, and haircare, then head to the salon to get your brows shaped, your hair styled, and your ears pierced, all in a single visit. You’ll find brands like Dior, Estée Lauder, and Gucci alongside more affordable favorites and drugstore staples. Many locations house a Benefit Cosmetics BrowBar, so you can sample products and book an in-store brow service in the same visit. Ulta’s return policy is very forgiving, allowing you to bring back “gently used” products within 30 days for a full refund. Add in its weekly sales, the <a href=\"https://www.ulta.com/promotion/21-days-of-beauty\" target=\"_blank\" rel=\"noopener\">21+ Days of Beauty Event</a>, and stackable Ulta coupons, and you’ll rarely pay full price.</p><p>I’ve tested a wide range of beauty products that are sold at Ulta, from <a href=\"https://www.wired.com/gallery/best-hair-dryers/\" target=\"_blank\" rel=\"noopener\">hair tools</a>, r<a href=\"https://www.wired.com/story/best-red-light-therapy-for-hair-growth/\" target=\"_blank\" rel=\"noopener\">ed-light therapy tools for hair growth</a>, and <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">LED devices</a> to <a href=\"https://www.wired.com/story/how-do-pimple-patches-work/\" target=\"_blank\" rel=\"noopener\">pimple patches</a> and <a href=\"https://www.wired.com/gallery/the-best-lip-balms/\" target=\"_blank\" rel=\"noopener\">lip balms</a>. Here’s how to shop smarter, with the best Ulta promo codes and Ulta coupons to keep on your radar.</p><h2>50% off Daily &amp; Weekly Beauty Steals</h2><p>One of the best ways to save regularly on both small, everyday purchases and bigger beauty tech and tools is by shopping Ulta’s weekly and daily sales. With <a href=\"https://www.ulta.com/featured/wk3026_dob_shop_all\" target=\"_blank\" rel=\"noopener\">Ulta’s Daily &amp; Weekly Beauty Steals</a>, you’ll find up to 50% off everything from perfume to facial cleansers to makeup essentials. You can save major coin on brands like Ralph Lauren, Murad, Bumble &amp; Bumble, and more.</p><p>Solawave</p><h3>4-in-1 Radiant Renewal Wand</h3><p>Therabody</p><h3>TheraFace Mask Glo</h3><h2>15% Off at Ulta Beauty When You Download the App</h2><p>If you already shop at Ulta often, downloading (and using) the <a href=\"https://www.ulta.com/company/app\" target=\"_blank\" rel=\"noopener\">Ulta app</a> is one of the best ways to save money on purchases you were planning to make. All you need to do is download the Ulta app (fo’ free), by texting \"Beauty\" to 95637. From there, you’ll get an Ulta promo code <strong>APP15</strong> sent to you to use for 15% off your next purchase. Plus, with the Ulta app, you’ll be able to virtually try on thousands of beauty products with GLAMlab, use the Ulta Foundation Matcher to virtually match your skin tone to find your best shade match, and an AI-powered analysis of your skin to get customized skin care recommendations.</p><p>Plus, <a href=\"https://www.ulta.com/company/app\" target=\"_blank\" rel=\"noopener\">Ulta app</a> members get exclusive in-app features, offers, and deals. You’ll also be able to monitor your membership rewards status and points, and get notified of app-exclusive deals, discounts, brand offers and more. And with the handy bar code scanner, shopping has never been easier—you can scan any product’s bar code to see information on ingredients and product reviews. When you’re an Ulta member, you’ll get 1 point for every $1 spent and birthday perks.</p><p>Conair</p><h3>InfinitiPRO by Conair SmoothWrap Hair Dryer</h3><p>Dyson</p><h3>Supersonic r Hair Dryer</h3><h2>Ulta Promo Code: Get 10% Off When You Sign Up</h2><p>You can instantly score 10% off your order when you sign up for text alerts. Text “ULTA” to 95637, and you should receive a one-time use discount code for online purchases only. There are a couple of brand exclusions, like Chanel, and you can’t use the discount on Black Friday deals, so make sure to <a href=\"https://www.ulta.com/promotion/coupon\" target=\"_blank\" rel=\"noopener\">read the fine print</a>.</p><p>Shark</p><h3>CryoGlow LED Face Mask</h3><p>Shark</p><h3>SpeedStyle Pro Flex Hair Dryer System</h3><h2>Use Ulta Beauty Rewards for Ulta Discounts</h2><p>The <a href=\"https://www.ulta.com/rewards/all\" target=\"_blank\" rel=\"noopener\">Ulta Beauty Rewards program</a> is free to join and offers many perks with minimal effort required from you. First, you earn points for every dollar you spend. The program has multiple tiers: as a standard member, you earn 1 point per dollar; platinum members earn 1.25 points, and diamond members earn 1.5 points. To qualify for platinum status, you need to spend $500 per year, and diamond members must spend $1,200 annually.</p><p>These points can be redeemed for discounts, and the best part is that they do not expire. (To activate your rewards, you need to download the Ulta Beauty app.) Here's how the points translate into savings: 100 points gives you $3 off, 250 points offers an $8 discount, 500 points saves you $17.50, and 750 points grants you $30 off.</p><p>During your birthday month, you get even more special perks. These include earning extra points on every qualifying purchase, a free gift, and a $10 coupon exclusively for platinum and diamond members. Some other benefits include exclusive beauty deals, early access to sales, and full-size gifts for diamond members. Diamond members also get a $25 discount on beauty services and free shipping on orders over $25.</p><p>La Roche-Posay</p><h3>Effaclar Duo+M Multi-Target Blemish Patches</h3><p>CeraVe</p><h3>Hydrocolloid Blemish Patches</h3><h2>Unlock Free Standard Shipping on Your $35 Purchase</h2><p>All online customers qualify for free standard shipping on purchases of $35 or more. It's easy to rack up this amount at Ulta, even with all the discounts.</p><p>Aquaphor</p><h3>Lip Repair Ointment</h3><p>BabylissPro</p><h3>Nano Titanium Prima3000 Ionic Hair Straightener</h3><h2>What We’ve Learned From Tracking Ulta Beauty Coupon Deals</h2><p>We’ve been doing this awhile, and we’ve become pretty good at tracking and determining the best offers available, and bringing them to you, of course. We check Ulta often, testing the Ulta coupon codes ourselves and bringing them to you here weekly (if not more often). These are often deals for things like 20% off certain beloved brands or beauty categories, as well as BOGO deals.</p><p>GHD</p><h3>Chronos Max</h3><p>Chi</p><h3>Lava Ministyler</h3>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
