<script>
var articles = [{"title":"Arc Raiders devs say that using generative AI voice acting was necessary as actors \"would just go crazy if they had to read all of that\"","source":"Eurogamer","author":"Connor Makar","url":"https://www.eurogamer.net/arc-raiders-ai-voice-acting-would-go-crazy","category":"gaming","categoryLabel":"Gaming","wordCount":584,"readingTime":3,"content":"<p>CCO states: \"We are not in the industry of replacing actors.\".</p>\n    \n  \n  \n  \n  \n            <p>Developers at Embark Studios, the company behind <a href=\"https://www.eurogamer.net/games/arc-raiders\" target=\"_blank\" rel=\"noopener\">Arc Raiders</a>, have spoken on the use of generative AI voice acting in the extraction shooter. It's argued that the initial use of generative AI line reads was a benefit to the voice actors, as they: \"would just go crazy if they had to read all of that\".</p>\n<p>This comes from a <a href=\"https://www.youtube.com/watch?v=_xwbP8KV530\" target=\"_blank\" rel=\"noopener\">recently released video by Embark</a>, focused on Arc Raider's sound and music. In it, several key members of staff speak on the game's use of generative AI, be it the initial use of it for voice lines, and the <a href=\"https://www.eurogamer.net/arc-raiders-ceo-says-studio-has-re-recorded-ai-lines-a-real-professional-actor-is-better-than-ai-thats-just-how-it-is\" target=\"_blank\" rel=\"noopener\">gradual replacement of it with human line reads</a>.</p>\n\n<p>Audio director Bence Pajor first spoke about the struggles he ran into at previous studios; how gameplay decisions couldn't be changed because voice lines were already locked in. He describes this as a \"true pain\", and that it places stress on the writing team, dialogue team, and voice actors who may have scheduling clashes. He said that using reachable voice actors in Stockholm, and using the tools available, made life easier for everyone.</p><p>Later in the video, Pajor explained that training data was made with the voice actor's performances. Due to the voice lines being required for each new feature, item, or weapon added into the game, he argues it would be too impractical to record every possible version of a line read. \"The actors would just go crazy if they had to read all of that,\" Pajor said.</p>\n<p>Pajor continues by pointing to Arc Raider's many updates and changes since its release in October 2025, it would be impractical to call in voice actors to record lines every time an altered line read needed to happen. Two voice actors present in the video - Jo Rideout (Shani) and Diana Gardner (Celeste) - also shared their feelings on it. Gardner said it was \"freeing\" that she could take a job somewhere else, without worrying about cancelling other shoots or projects.</p>\n<p>However, Gardner would later speak on the topic of her ownership of Celeste's many lines in the game: \"The contract seemed so fair [...] so it was a no-brainer in that sense. But I didn't know what to expect once I heard the voice come out. I was like, 'Can I take ownership for the performance?' [...] This is hours of work that I've put in, but can I take ownership for the final product? No.\"</p>\n<p>Even with these proposed benefits to using AI-powered performances, these voice lines are being replaced. Embark CCO Stefan Strandberg said: \"we are not in the industry of replacing voice actors\", and acknowledges that immersion-breaking experiences many players had when playing Arc Raiders and hearing these performances. Strandberg and Pajor both admit to understanding the AI critique, and point to the work being done to replace what they can.</p>\n<p>\"We are not in the industry of replacing actors,\" said Strandberg. \"Actually I think quite the opposite. We should celebrate the performance and give them more space. That's something I'm hoping to give to players over the coming years.\"</p>\n<p>Part of this critique over generative AI's use in Arc Raiders came from reviews, <a href=\"https://www.eurogamer.net/arc-raiders-review\" target=\"_blank\" rel=\"noopener\">including our own</a>. Embark Studios faced similar pushback for <a href=\"https://www.eurogamer.net/the-finals-criticised-by-actors-and-designers-for-use-of-ai-commentator-voiceovers\" target=\"_blank\" rel=\"noopener\">gen-AI voice acting in The Finals</a>, however Arc Raider's popularity while using the technology led Nexon to describe it as a \"trojan horse\" for gen AI's use in small team game development.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Is There Anything BPC-157 Can’t Cure?","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/10/30/wellness-bpc-157-pedtides-fda/","category":"fun","categoryLabel":"Interesting Reads","wordCount":546,"readingTime":3,"content":"<p>Do you know what BPC‑157 is? This cryptically named peptide is, according to its proponents, a miracle cure for all sorts of illnesses and injuries. Tom Bartlett remains firmly in the skeptical camp as he investigates exactly what research backs up the BPC‑157 claims. Almost all the studies prove to have a link to Croatian pharmacologist Predrag Sikirić—who is all too happy to meet Bartlett and exalt BPC‑157. But once you know what this is, the question remains: Would you take it?</p>\n<blockquote>\n<p>Amid the sellers of red-light panels and blue-light glasses at Beyond, I stumbled on a company marketing a drinkable version of BPC‑157. Its giveaway sticker read We Prefer Oral Peptides, with the word <em>peptides</em> in much smaller letters because haha sex. The representative behind the counter referred to BPC‑157 as “the soccer mom’s peptide” and nonchalantly squirted some from what was essentially a hand-soap dispenser into a tiny plastic cup, then held it out to me. I hesitated, and the peptide hung in the air, unclaimed. “Are you afraid of it?” he asked. The not-so-subtle subtext was that I shouldn’t be, that taking BPC‑157 was equivalent to trying the dissolvable herbal-tea strips a few tables down or giving the giant quartz bowl a whirl. For the record: We were in a hotel hallway and I was being encouraged—dared, really—to try a drug that isn’t FDA-approved, is prohibited by the World Anti-Doping Agency for athletes’ use, and allegedly works throughout the body via some mysterious mechanism that is not entirely predictable. I was being offered an unspecified dose, although I wouldn’t know what dose would be appropriate, because there are no agreed-upon dosing guidelines. I declined the peptide. The representative shrugged and drank it himself.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on wellness\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/09/09/theres-the-rub/\" target=\"_blank\" rel=\"noopener\">There’s the Rub</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSarah Larson | The New Yorker | September 8, 2025 | 5,883 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Each year, massage therapists from around the globe gather to face off, collaborate, and make sure that no body gets left behind.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/06/26/biohacking-conference-asprey/\" target=\"_blank\" rel=\"noopener\">Snake Venom, Urine, and a Quest to Live Forever: Inside a Biohacking Conference Emboldened by MAHA</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tWill Bahr | Wired | June 25, 2025 | 2,294 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“While biohacking isn’t new, the rise of Robert F. Kennedy Jr.’s Make America Healthy Again movement . . . has given the concept renewed zeal.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/11/22/how-an-empty-internet-gave-us-tradwives-and-trump/\" target=\"_blank\" rel=\"noopener\">How an Empty Internet Gave Us Tradwives and Trump</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTressie McMillan Cottom | The New York Times | November 21, 2024 | 2,164 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“If you are looking to understand Donald Trump’s unusual hold on our cultural politics, look to the tradwives, podcast bros and wellness influencers.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/09/24/the-cult-of-wellness/\" target=\"_blank\" rel=\"noopener\">The Cult of Wellness</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tOlivia Stren | Toronto Life | August 14, 2024 | 6,161 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A growing cohort of Torontonians are swapping the coke-fuelled, booze-soaked club scene for cold plunges, sobriety and superfood smoothies. Inside the expensive, obsessive, addictive quest for a perfect life.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/02/22/the-rise-of-the-scented-candle-industrial-complex/\" target=\"_blank\" rel=\"noopener\">The Rise of the Scented-Candle Industrial Complex</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSophie Elmhirst | 1843 Magazine | December 14, 2023 | 4,100 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Why is everyone waxing on about Diptyque?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2022/08/31/the-death-cheaters/\" target=\"_blank\" rel=\"noopener\">The Death Cheaters</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tCourtney Shea | Toronto Life | August 29, 2022 | 4,711 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The members of Longevity House are united by two things: a willingness to hand over $100,000 and a burning desire to live forever. Inside the weird world of cryotherapy, biocharging and fecal transplants.”</p>"},{"title":"Court to consider the reach of Article III courts in immigration contract dispute ","source":"SCOTUSblog","author":"Ronald Mann","url":"https://www.scotusblog.com/2026/11/court-to-consider-the-reach-of-article-iii-courts-in-immigration-contract-dispute/","category":"law","categoryLabel":"Law","wordCount":792,"readingTime":4,"content":"<p>The argument on Nov. 10 in <a href=\"https://www.scotusblog.com/cases/department-of-labor-v-sun-valley-orchards-llc/\" target=\"_blank\" rel=\"noopener\"><em>Department of Labor v. Sun Valley Orchards</em></a> brings the justices a complex constitutional problem sure to get their focused attention: does the Constitution allow Congress to delegate to the executive branch – as opposed to the courts – the authority to adjudicate the obligation of an employer to comply with employment agreements it makes with temporary immigrant workers.</p><p>Here, the Department of Labor, employing administrative law judges, for several decades has adjudicated disputes under the H-2A visa program, which allows employers to hire temporary foreign agricultural workers. The Department of Labor argues that Sun Valley Orchards failed in several ways to compensate such workers as it promised the government it would to qualify for the H-2A program. As is typical in such cases, administrative employees of the DOL (in its wage and hour division) charged Sun Valley with failing to live up to its obligations, and the DOL for the most part persuaded an ALJ that it was correct. On appeal, a different group of the DOL’s employees (its administrative review board) accepted the ALJ’s findings. At that point, for the first time, Sun Valley had a chance to take the dispute before Article III judges, but under the applicable statute the federal district court owes great deference to the DOL’s adjudication.</p><p>The case comes to the justices because the U.S. Court of Appeals for the 3rd Circuit <a href=\"https://cdn.sanity.io/files/pito4za5/production/ef2befb0e2ea30e34af6f4058e1c7ccbff950580.pdf#page=43\" target=\"_blank\" rel=\"noopener\">reasoned</a> that the administrative adjudication of the department’s charges cannot be reconciled with Article III of the Constitution.</p><p>At a high level of generality, the doctrinal framework here is quite clear. All agree that Congress constitutionally can authorize adjudication by executive branch officials rather than judges, and all agree that its power to do so is limited to cases that involve “public rights,” a notoriously vague category designed to distinguish traditionally executive actions (like granting a visa) from disputes traditionally resolved in court (like tort and contract litigation). When those adjudications go beyond public rights, though, they infringe on the judiciary’s exclusive authority under Article III. The difficulty is that when you get down to details – defining the boundaries of “public rights” – the rulings have neither been stable nor persuasive. The point was made best by Chief Justice William Rehnquist (channeling Matthew Arnold), who famously <a href=\"https://supreme.justia.com/cases/federal/us/458/50/\" target=\"_blank\" rel=\"noopener\">characterized</a> the decisions as “landmarks on a judicial ‘darkling plain’ where ignorant armies have clashed by night.”</p><p>For this particular dispute, the government <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-966/413619/20260618153112527_25-966SunValleyGovtBr_with_Appendix.pdf\" target=\"_blank\" rel=\"noopener\">contends</a> that the case plainly involves public rights because it involves immigration or because it involves the assessment of remedies for transgression of privileges granted by the executive. By contrast, the employer <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-966/417327/20260727112239225_25-966%20Brief%20of%20Respondent.pdf\" target=\"_blank\" rel=\"noopener\">characterizes</a> the subject of the adjudication as a contract dispute. Granting the government’s free ability to decide (and adjudicate if it wishes to do so) the entitlement of any particular immigrants or group of immigrants to a visa or other immigration status, the dispute here involves whether the employer has complied with its employment contract. Because that is a prototypically private dispute – the kind of thing that could have been brought before a court at Westminster in <a href=\"https://poets.org/poem/old-england\" target=\"_blank\" rel=\"noopener\">Old England</a> in the days of the drafting of Article III – the employer contends that it is not the kind of public right that Congress can have adjudicated by the executive.</p><p>It would be naïve to expect the justices will feel themselves constrained by the existing precedents on this topic. The case directly implicates the prerogatives of the judicial branch and the justices will see it that way. Moreover, decisions like <a href=\"https://www.scotusblog.com/cases/loper-bright-enterprises-v-raimondo/\" target=\"_blank\" rel=\"noopener\"><em>Loper Bright Enterprises v. Raimondo</em></a> and <a href=\"https://www.scotusblog.com/cases/trump-v-slaughter-2/\" target=\"_blank\" rel=\"noopener\"><em>Trump v. Slaughter</em></a> show a bench with a great appetite for reining in the administrative state even when precedents are settled and directly on point. And there is another problem for the government here – many of the cases they rely on predate the days of FDR and the rise of the administrative state. Furthermore, none of them crisply validates an administrative adjudication that takes money from one private party and gives it to another.</p><p>I would expect Justice Neil Gorsuch to be a major figure at the argument, as he has been pressing this particular point for several years, albeit in the context of the securities laws. For him, the government’s contention that the lower court decision would disrupt a large swath of long-accepted administrative arrangements will be a feature, not a bug. Chief Justice John Roberts also can be expected to be an important player, as he has written several of the modern opinions in the area. So this seemingly narrow dispute may herald something larger: yet another blow against the administrative state.</p><p><strong>Recommended Citation: </strong>Ronald Mann, <em>Court to consider the reach of Article III courts in immigration contract dispute </em>, SCOTUSblog (Nov. 5, 2026, 9:30 AM), https://www.scotusblog.com/2026/11/court-to-consider-the-reach-of-article-iii-courts-in-immigration-contract-dispute/</p>"},{"title":"‘We Have to Take Over’: Far-Right Extremists Want to Seize Control of the GOP","source":"Wired","author":"@wired","url":"https://www.wired.com/story/we-have-to-take-over-far-right-extremists-want-to-seize-control-of-the-gop/","category":"tech","categoryLabel":"Technology","wordCount":1025,"readingTime":6,"content":"<p>On Election Day last week, <a href=\"https://www.wired.com/story/a-white-supremacist-youth-group-helped-orchestrate-the-belfast-riots/\" target=\"_blank\" rel=\"noopener\">white nationalist</a> <a href=\"https://www.wired.com/story/nick-fuentes-plan-to-conquer-america/\" target=\"_blank\" rel=\"noopener\">Nick Fuentes</a> <a href=\"https://x.com/NickJFuentes/status/2117679818099867978\" target=\"_blank\" rel=\"noopener\">urged his supporters on X</a> to “get out and vote Democrat today.” The post racked up over 12 million views. Hours later, in the wake of <a href=\"https://www.wired.com/story/democrats-sweep-republicans-in-nearly-every-race-that-matters/\" target=\"_blank\" rel=\"noopener\">the Democratic sweep</a>, Fuentes took credit for the victory. “We did it again” he wrote on Telegram, later calling the phenomenon “the Groyper Effect,” a reference to the nickname given to his followers.</p><p>In recent days, Fuentes has claimed the election results are an opportunity for him and his allies on the far right.</p><p>“Let the Democrats rule; see how that goes,” Fuentes said during a livestream last week. “There will come a time when the far left will terrorize people, and they're going to push all of them into the arms of the right. Who's going to fight the far left? Only the far right. This is why we have to take over the right wing now.”</p><p>In another livestream last week, Fuentes added a warning to the GOP leadership: “It’s our party now … You need to cooperate with us… Groypers are open for business. It has [to] be America First—and if it's not, we'll do it again for the enemy.”</p><p>A WIRED review of comments from white-supremacist, Christian-nationalist, and other far-right groups in the wake of the midterm results shows much of the same. While the groups are uniformly attacking Donald Trump’s failure to prioritize white, Christian, American values, they also believe that this sudden shift to the left will result in a backlash that will see more people embrace far-right groups and ideologies.</p><p>“Many prominent figures in racist, extremist movements have taken to declaring the MAGA movement dead since the midterm elections, claiming that the results validate their previous criticisms of the Trump administration and opens new opportunities for their movements to push disaffected voters toward their ideological beliefs,” Jared Holt, senior researcher at Open Measures, tells WIRED.</p><p>While some of <a href=\"https://www.wired.com/story/these-extremists-are-running-for-election-in-november/\" target=\"_blank\" rel=\"noopener\">the Republican party’s extremist candidates</a> were rejected during the elections last week, many did win their elections.</p><p>The Institute for Research and Education on Human Rights tracked 535 candidates running in statewide races who were members of at least one far-right Facebook group. The researchers found that of the 476 races that had been called by last Friday, 338 of those candidates were victorious, representing a 71 percent win rate. (The vast majority of these races saw GOP incumbents retain their seats.) In Florida, for example, 34-year-old citrus farmer Marshall Rawson, who attended the Unite the Right rally in Charlottesville, Virginia, in 2017, easily defeated his Democrat opponent in the state’s 10th District State House race.</p><p>Many states also passed ballot measures that could further far-right agendas, including <a href=\"https://www.reuters.com/legal/government/us-anti-trans-ballot-wins-pose-challenge-democrats-ahead-2028-2026-11-07/\" target=\"_blank\" rel=\"noopener\">anti-transgender rules</a>, <a href=\"https://voteriders.org/article/midterms-2026-statement/\" target=\"_blank\" rel=\"noopener\">onerous voter ID laws</a>, and <a href=\"https://www.fairus.org/legislation/state-and-local/ballot-measures-highlight-continued-support-immigration-enforcement\" target=\"_blank\" rel=\"noopener\">anti-immigrant measures</a>.</p><p>“Arizona, Colorado, Nebraska, and Washington approved bans on trans athletes in female sports, so girls in Washington state, for instance, will now have to go through a genital exam or pass a DNA test before they can participate in youth sports,” Devin Burghart, executive director with IREHR, said on Friday during a briefing with reporters.</p><p>The success of these ballot measures was celebrated by extremist groups as evidence that Americans wanted what the current GOP could not deliver.</p><p>The Proud Boys, the street-fighting group that Immigration and Customs Enforcement operations <a href=\"https://www.wired.com/story/trump-proud-boys-ice/\" target=\"_blank\" rel=\"noopener\">made largely redundant</a> in recent years, were optimistic following the losses. “The ultimate rebuke of the current Republican establishment was citizens voting them out of office, then doing their job for them by passing ballot measures on issues the Republicans should have already handled,” the Cape Fear Proud Boys wrote in their Telegram channel.</p><p>“What this signals to me is even in those places where they lost, they're getting 41-47 percent of the vote, [so] there's still a mass base to try to be mobilized,” Chuck Tanner, research director at IREHR, said during the briefing. “That's the lesson that some of these groups are taking out of it, is that there's still that mass base.”</p><p>And it is the existence of this base, extremist groups claim, that leaves the Republican Party vulnerable to takeover from the inside.</p><p>“Now is the time, if you're a nationalist, to start looking at moving on the Republican Party where you live,” Warren Balogh, a white supremacist from Pittsburgh who attended the Unite the Right rally in Charlottesville in 2017, wrote on his Telegram channel. “And by that I mean, organizing your guys and going in to do a hostile takeover.”</p><p>“This may be the best thing that has happened to the Republican Party in a half-century,” the Cape Fear Proud Boys declared in a post on Telegram days after the election. “Now you will learn to placate us, or you will continue to fail. Understand this: You’re going to run people we like, and you’re going to do what we say.”</p><p>But other extremists appear less inclined to wait until the next general election in 2028, preferring a more direct takeover.</p><p>\"I'm not saying that we will win through democracy. I'm just saying we'll win,” Joel Webbon, a Christian nationalist pastor said last week in <a href=\"https://x.com/RightWingWatch/status/2118414164612059534\" target=\"_blank\" rel=\"noopener\">a video posted online</a> after the election. Webbon and fellow far-right pastors, as well as guest speaker and noted conspiracy theorist Alex Jones, are set to meet at a conference in Texas this week <a href=\"https://x.com/RightWingWatch/status/2112613017112199249\" target=\"_blank\" rel=\"noopener\">where attendees will discuss</a>, in at least one talk, “battle plans” for “Christian nationalists on the right to be able to seize power.”</p><p>Experts WIRED spoke to said they have not seen any explicit calls for violence from the far-right groups they are tracking, but some figures are already looking ahead to January 3, when Congress is set to certify the midterm election results.</p><p>Far-right activist and pardoned January 6 rioter <a href=\"https://www.wired.com/story/january-6-rioter-leading-armed-national-militia-from-prison/\" target=\"_blank\" rel=\"noopener\">Jake Lang</a>, however, is planning an event in DC on January 3. It is unclear how many people are planning to attend, but one of the Christian nationalist pastors listed by Lang as an official speaker has <a href=\"https://x.com/dalepartridge/status/2118522824474447995\" target=\"_blank\" rel=\"noopener\">said</a> he won’t be speaking.</p><p>Lang, who spent last weekend <a href=\"https://x.com/patriottakes/status/2119884646616100986\" target=\"_blank\" rel=\"noopener\">disrupting a cat convention</a> that he thought was a furry convention, did not respond to a request for comment.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
