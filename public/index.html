*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

  max-width: 38em;
  margin: 0 auto;

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  flex-wrap: wrap;

  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;

  margin-right: 0.5em;
}

h1 {

  text-wrap: balance;

  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

  display: flex;
  gap: 0.5rem;
}

  font-family: inherit;
  font-size: 0.8125rem;

  color: var(--text-secondary);

.swap-btn:hover {

  color: var(--text);

<script>
var articles = [{"title":"Even 10 years on, Sean Murray feels like he could work on No Man's Sky \"forever,\" even if he knows \"there probably is some end date\" for it","source":"Rock Paper Shotgun","author":"Oisin Kuhnke","url":"https://www.rockpapershotgun.com/even-10-years-on-sean-murray-feels-like-he-could-work-on-no-mans-sky-forever-even-if-he-knows-there-probably-is-some-end-date-for-it","category":"gaming","categoryLabel":"Gaming","wordCount":505,"readingTime":3,"content":"<p>Surely it's someone's sky by now, though</p>\n    \n  \n  \n  \n  \n            <p>\r\nWhat's that? It's been 10 years since <a href=\"https://www.rockpapershotgun.com/games/no-mans-sky\" target=\"_blank\" rel=\"noopener\">No Man's Sky</a> launched? Oh! That's gone by a bit too quick! In that time the planet hopping <a href=\"https://www.rockpapershotgun.com/the-best-survival-games-on-pc\" target=\"_blank\" rel=\"noopener\">survival</a> game has changed drastically, starting life frequently derided for missing promised features, slowly morphing into what it is now. The game now has a massive mish mash of features that have kept people coming back year after year, and according to Hello Games co-founder Sean Murray, he could keep going as long as they do.\r\n</p>\n<p>\r\n\"If people keep playing it, I could work on this forever. I love it,\" Murray shared with <a href=\"https://www.gamesradar.com/games/survival/after-10-years-of-no-mans-sky-updates-sean-murray-says-if-people-keep-playing-it-i-could-work-on-this-forever/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a> in a recent interview. \"You've got to understand, this was a game that when I was a kid, you could have asked me, and I would have been like, 'Yeah, that's a dream game. I would love that to exist'. So I feel very lucky from that point of view, and I would be happy working on this.\"\r\n</p>\n\n<p>\r\nMurray continues to explain he finds a lot of motivation to work on the game thanks to having such an engaged community ready to pick up whatever Hello Games put down, but ultimately what the studio works on is down to the staff themselves. \"We don't really have much of a management structure at Hello Games,\" he explains. \"So we don't really have the ability, even if we wanted to, to make people work on things they don't want to work on… as long as they're motivated, we're happy to keep making cool things, but it has to come from the team having ideas that they're excited about and things that they're excited about putting out there in the world. As long as that happens, we'll keep updating it.\"\r\n</p><p>\r\nThe developer does acknowledge that there \"probably is some end date\" for No Man's Sky, but notes that if he was asked when work on the game would end five years ago, he'd have thought they would have finished it by now. \"It is a surprise to me. I remember finishing Voyagers last year, which did incredibly well for us in terms of highest player number since launch, and then turning around to the team, and I sort of expected them to say, 'Yeah, we're kind of done,' but instead they were just buzzing, because they've just shipped this thing.\"\r\n</p>\n<p>\r\nIt's strange to reflect on how long this game has stuck around for, and how much it's changed over the years. Despite my excitement for it, I wasn't one of those people that thought the game not quite being what was promised was tantamount to treason, but it didn't fully grip me either. I've dipped my toes back in here and there and still haven't quite latched on, surprised at the radical differences between those visits, and wondering if it will ever grip me again. I'm not entirely convinced, for my tastes there honestly seems like there's too much going on, but ultimately it is a perplexing and interesting tale of redemption.\n</p>"},{"title":"LittleLearner: Language Models Under Pedagogically-Controlled Knowledge Exposure","source":"Hacker News Best","author":"","url":"https://littlelearner-ll.github.io/","category":"tech","categoryLabel":"Technology","wordCount":561,"readingTime":3,"content":"<h2>Talk to LittleLearner</h2>\n      <p>The hosted 5B model, live in your browser.\n      <a href=\"https://zueri-monstro.rufous-hamlet.ts.net/ll-demo-chat/?theme=light\" target=\"_blank\" rel=\"noopener\">Open in a new tab ↗</a>\n      if the chat doesn’t load below.</p>\n    \n  \n    \n      <h2>A controlled sandbox for studying how models acquire knowledge</h2>\n      <p>Modern LMs are trained on everything at once, so it is hard to tell whether a new skill\n      was learned or merely elicited. We constrain the training distribution itself: an 88B-token\n      corpus filtered to the U.S. elementary-school curriculum, with models trained from scratch on it and\n      matched unfiltered controls.</p>\n    \n    \n      \n        <p>Dataset</p>\n        <h3>LittleCurriculum</h3>\n        <p>An 88B-token corpus distilled from FineWeb-Edu through a five-stage filtering pipeline aligned with Common Core standards (K–5).\n        Concepts, facts, and vocabulary taught above Grade 5 are explicitly excluded.</p>\n      \n      \n        <p>Models</p>\n        <h3>LittleLearner</h3>\n        <p>Three scales (0.6B / 1.3B / 5B) trained from scratch on LittleCurriculum: chattable models\n        with an interpretable knowledge boundary. Each ships with a matched Unfiltered control\n        for clean comparison.</p>\n      \n      \n        <p>Findings</p>\n        <h3>Elicitation, not acquisition</h3>\n        <p>In our experiments, scaling, SFT+GRPO post-training, and in-context learning amplify what the\n        curriculum taught, but none meaningfully improves out-of-scope performance, indicating that the\n        pretraining filter sets the effective capability ceiling.</p>\n      \n  \n  \n    \n      <h2>Model checkpoints</h2>\n      <p>LittleLearner at three scales (0.6B / 1.3B / 5B), each with a matched Unfiltered control\n      sharing its architecture, tokens, and recipe.</p>\n      <p>\n        <strong>Base</strong>: the pretrained model.\n        <strong>GRPO</strong>: math specialists post-trained on MathCAMPS; responses may exhibit a tendency toward math-oriented output.\n        <strong>Chatty</strong>: variants tuned for general chat behavior.\n      </p>\n    \n    \n      \n        \n          \n            Scale\n            LittleLearner · K–5\n            chatty\n            Matched control · unfiltered\n          \n        \n        \n      \n    \n  \n  \n    \n      <h2>Capability stays inside the curriculum</h2>\n      <p>Can standard interventions push a model past what its pretraining data taught it?\n      With the boundary under experimental control, we can ask cleanly. In our experiments, each\n      intervention amplifies in-scope ability; none of them meaningfully improves out-of-scope\n      performance.</p>\n    \n    \n      \n        <h3>Scaling</h3>\n        <p>Scaling model size improves performance within the model’s controlled knowledge exposure and\n        extends modestly to problems along the same learning trajectory, but yields little improvement on\n        problems requiring more advanced capabilities outside the exposure.</p>\n      \n      \n        <p>MathCAMPS accuracy by grade, across model size</p>\n      \n    \n    \n      \n        <h3>Post-training</h3>\n        <p>Post-training through GRPO significantly boosts in-scope K–5 capabilities, but fails to\n        recover out-of-scope beyond-K–5 capabilities, even when training with out-of-scope data.</p>\n      \n      \n        <p>Post-training amplifies K–5, not the beyond-K–5 gap</p>\n      \n    \n    \n      \n        <h3>In-context learning</h3>\n        <p>In-context learning with the prompts we test does not unlock new reasoning capabilities in\n        beyond-K–5 for our trained 5B LittleLearner.</p>\n      \n      \n        <p>Accuracy by prompting condition</p>\n      \n    \n  \n  \n    \n      <h2>What will you teach it?</h2>\n      <p>Because LittleLearner’s training exposure is explicitly specified, behavioral and\n      representational changes can be related directly to the concepts you introduce. Three directions\n      we’re excited about:</p>\n    \n    \n      \n        <p>01</p><p>RL &amp; discovery</p>\n        <h3>Can RL create capability?</h3>\n        <p>The prior is restricted to K–5, so capabilities that emerge under RL can be attributed to\n        the RL process itself. A tractable proxy for reward-driven discovery.</p>\n      \n      \n        <p>02</p><p>Continual learning</p>\n        <h3>Watch a concept being learned</h3>\n        <p>Introduce negative numbers and measure sample efficiency, retention, and interference. Or\n        probe behavior near the boundary: does it answer, abstain, or hallucinate?</p>\n      \n      \n        <p>03</p><p>Educational science</p>\n        <h3>Machine vs. child learners</h3>\n        <p>Specified exposure enables controlled human-model comparison. Do models and children need\n        similar exposure to learn fractions, or make similar errors on word problems?</p>\n      \n      \n        <p>＋</p><p>Your turn</p>\n        <h3>Bring your own question</h3>\n        <p>A known boundary turns your idea into a clean experiment!</p>\n      \n    \n  \n  \n    \n      <h2>If you find this work useful</h2>\n      <p>Please cite our paper:</p>\n    \n    @misc{littlelearner2026,\n      title={LittleLearner: Language Models Under Pedagogically-Controlled Knowledge Exposure},\n      author={Fanfei Li and Jana Zeller and Manuel Prada-Corral and Thaddäus Wiedemer and Prasanna Mayilvahanan and Ryan Cotterell and Wieland Brendel},\n      year={2026},\n      eprint={2608.13545},\n      archivePrefix={arXiv},\n      primaryClass={cs.CL},\n      url={https://arxiv.org/abs/2608.13545}\n}"},{"title":"Plaintiffs Contesting Tren de Aragua Membership Claims / Alien Enemies Act Application Can't Sue Pseudonymously","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/14/plaintiffs-contesting-tren-de-aragua-membership-claims-alien-enemies-act-application-cant-sue-pseudonymously/","category":"law","categoryLabel":"Law","wordCount":1179,"readingTime":6,"content":"<p>​From yesterday's published order in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.ca5.224134/gov.uscourts.ca5.224134.363.1.pdf\" target=\"_blank\" rel=\"noopener\">W.M.M. v. Trump</a> </em>(en banc), by Chief Judge Jennifer Walker Elrod:</p><p>In response to questions at oral argument and a later directive from the court, counsel for petitioners and the government revealed that the government has removed the three original named petitioners in this case. As there are currently no named petitioners in this appeal who are still in the United States, petitioners have moved to add five new class representatives on appeal—a motion that we deny today.</p>\n<p>Petitioners have also moved for these five proposed class representatives to proceed pseudonymously on appeal, as well as for the sealing of their unredacted motion to add class representatives. The government does not oppose either motion.</p>\n<p>But \"the parties' consent does not end the analysis when determining whether pseudonymization is appropriate. Instead, the court must conduct its own balancing of the public and private interests at stake.\" We DENY these motions without prejudice to any future determination by the district court regarding whether to allow any new class representatives to proceed under pseudonyms or whether to seal a motion adding class representatives.</p>\n<p>\"What transpires in the court room is public property.\" Indeed, disclosure is generally favored. And \"[p]ublic naming of litigants is one aspect of the broader 'presumption, long supported by courts, that the public has a common-law right of access to judicial records.'\" Thus, \"[a] strong presumption against party pseudonymity is generally well settled.\"</p><p>Of course, this presumption can give way in appropriate circumstances… [O]ur court has articulated \"three factors common to anonymous-party suits that … 'deserve considerable weight'\" in determining whether to allow parties to use pseudonyms: \"(1) whether the plaintiff is 'challeng[ing] governmental activity'; (2) whether the plaintiff will be required to disclose information 'of the utmost intimacy'; and (3) whether the plaintiff will be 'compelled to admit [his] intention to engage in illegal conduct, thereby risking criminal prosecution.'\" … We have also considered, among other things, \"the showing of possible threatened harm.\"</p>\n<p>These considerations do not weigh in favor of allowing the proposed new representatives to proceed pseudonymously here. First, while the petitioners certainly challenge governmental activity, \"in only a very few cases challenging governmental activity can anonymity be justified.\" Where \"plaintiffs [a]re suing private individuals rather than a government agency,\" a court may find \"<em>more </em>reason <em>not </em>to grant the plaintiffs' request for anonymity.\" But that a plaintiff sues the government \"does not stand … for the proposition that there is more reason to grant [that] plaintiff's request for anonymity.\"</p>\n<p>Second, the proposed representatives have not shown that proceeding under their real identities would require them to disclose \"information 'of the utmost intimacy.'\" … \"'[W]here the issues involved are matters of a highly sensitive and personal nature,' such as birth control, abortion, homosexuality[,] or the welfare rights of illegitimate children or abandoned families, the normal practice of disclosing the parties' identities yields 'to a policy of protecting privacy in a very private matter.'\" Religious beliefs may also qualify, depending on the circumstances. Courts have also \"permitted plaintiffs to proceed anonymously in cases involving mental illness.\"</p>\n<p>Here, the proposed class representatives have not shown that disclosure of their names would \"require[]\" them \"to disclose information 'of the utmost intimacy.'\" They insist that we should treat \"immigration matters, like the ones here, that disclose personal information,\" as intimate information warranting pseudonymity. But this argument fails. To begin, one of the proposed representatives says nothing about his immigration status at all, and another has temporary protected status. Neither explains how revelation of \"immigration matters\" related to him would \"disclose [any] personal information,\" let alone information that makes pseudonyms appropriate.</p>\n<p>Of the other three proposed class representatives, one has an approved asylum application, and two represent that they are currently seeking asylum. But this, without more, does not demand pseudonymity. The proposed class representatives point out cases in which district courts allowed asylum applicants to proceed pseudonymously <em>in asylum proceedings</em>. But they do not argue that they have used pseudonyms in their own asylum proceedings. Nor have they shown that Venezuela penalizes asylum seekers. Without more, the asylum-seeker status of three of the five proposed class representatives does not counsel against the \"strong presumption against party pseudonymity.\"</p>\n<p>The proposed representatives also fear that proceeding under their true names will cause the revelation of their physical characteristics. But it is difficult to see how physical characteristics that one exposes to the public count as intimate information—and the proposed representatives have not argued that they conceal the characteristics that they mention from the public. Even in the criminal context, one does not have a reasonable expectation of privacy in one's visible physical characteristics. Absent more evidence than the proposed class representatives have presented here, we will not deem physical characteristics intimate information in the civil context….</p>\n<p>Finally, by revealing their identities, the proposed class representatives will not \"be 'compelled to admit [their] intention to engage in illegal conduct, thereby risking criminal prosecution.'\" Of course, a party need not necessarily \"admit criminal conduct or criminal intent in order to proceed under a fictitious name.\" A court could also allow a party to proceed pseudonymously if that party \"had to admit that [he] either had violated state laws or government regulations or wished to engage in prohibited conduct.\" … Here, the disclosure of their identities would not require the proposed class representatives to \"express a desire to participate in proscribed activities.\" Indeed, all of the proposed class representatives maintain that they want to contest their purportedly \"false designation as a member of Tren de Aragua and the application of the Alien Enemies Act to\" them. Moreover, the government, which knows their true identities, has already served them with notices of removal under the President's Proclamation.</p>\n<p>We have also considered \"the showing of possible threatened harm\" in determining whether to allow parties to use pseudonyms. Here, all five of the proposed class representatives express fear of retaliation \"in the form of physical violence in Venezuela or third countries if their identities were to be revealed and if they were to be removed for being erroneously identified as members of TdA.\" True, \"[c]ourts generally allow pseudonymity if there is 'reasonable[]' 'fear[]' of 'retaliatory physical … harm to the requesting party or even more critically, to innocent non-parties,' which may be considered in light of 'the anonymous party's vulnerability to such retaliation.'\" But \"[l]ack of such express threats or incidents—or at least lack of highly plausible predictions of possible future violence—will usually count against pseudonymity.\" And \"this court does not usually allow parties to proceed anonymously based on generalized concerns.\"</p>\n<p>Here, the petitioners express only \"generalized concerns\" about potential retaliation, directed toward either them or their families, in Venezuela or other countries as a result of the U.S. government identifying them with TdA. They present zero \"plausible predictions of possible future violence,\" let alone evidence of \"express threats or incidents\" to anyone, including them or their families, arising out of identification with TdA. These evidence-less, generalized fears do not permit the proposed class representatives to overcome the presumption against pseudonymity….</p>"},{"title":"Perez Hilton and Our Live-Streaming Nightmare","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/infinite-scroll/perez-hilton-and-our-live-streaming-nightmare","category":"fun","categoryLabel":"Interesting Reads","wordCount":873,"readingTime":5,"content":"<p>Last week, the celebrity-gossip blogger Perez Hilton went live on TikTok and, for about fifteen minutes, appeared to cut himself. Naked and bleeding, he moaned as he moved a knife across his body, swaying unsteadily before the camera. (TikTok’s A.I. and human moderators failed to end the recording in a timely fashion—technical difficulties, apparently.) At one point, he added three people to his live stream, who, mortified, begged him to stop. He told his viewers that this was what they wanted, and said that he was doing this for his young children, who had apparently fled the house with Hilton’s sister during what his family, in a statement, called a “severe mental health crisis.”</p><p>As footage of the live stream spread online, the initial response was disbelief: suspicions arose that the video was an elaborate ruse, a staged performance. This was Perez Hilton, after all, a man who had earned fame in the mid-two-thousands for his salacious, sarcastic, and often sadistic coverage of celebrity suffering. Before “troll” became commonplace in the internet lexicon, Hilton embodied the definition: a prurient, prolific shitposter who drew dicks and semen on paparazzi photos, called Adam Sandler’s two-year-old daughter “ugly,” and, after Heath Ledger’s accidental overdose, sold T-shirts with the slogan “Why couldn’t it be Britney?” On his website, which at its peak, around 2007, received as many as eight million hits a day, he outed celebrities, picked apart stars’ appearances, and mocked their addictions. He cloaked his cruelty in camp, suffusing his blog posts with exclamation points and cheap puns. But his latest live stream had no such cover. Hilton, whose real name is Mario Lavandeira, Jr., had become the kind of celebrity in crisis that he’d once made a career denigrating.</p><p>Though the twenty-four-hour news cycle was already a fixture of public life when he launched his blog, in 2004, Hilton helped to revolutionize tabloid coverage by making even the smallest scraps of gossip immediately available online, sharing grainy pap shots and crude commentary with startling alacrity. It was no longer enough to read a long print exposé about Britney Spears’s mental-health episodes and subsequent rehab stints; Hilton offered the opportunity to follow the drama in real time, updating his blog whenever a new photograph or anonymous report entered his orbit. To call his coverage prescient, or pioneering, is perhaps too generous, but Hilton was certainly on the cutting edge of the cyber-surveillance panopticon in which we currently live. The camera is now always rolling, not only for the rich and famous but for the average person walking the streets, who on any given day may be accosted by a phone-wielding maven asking: How much money do you make in a year? How much do you pay for rent? What’s your body count? How did you meet your partner? Would you rather have a gay son or a thot daughter? As engagement-farming social-media accounts like Pop Base and celebrity-gossip accounts such as Deuxmoi still post frequent updates of celebrity sightings and speculation, the type of blanketing gossip press that Hilton introduced now spares no one. Whether it’s a lawyer making out with his junior associate in Central Park or colleagues caught extramaritally <a href=\"https://www.newyorker.com/culture/infinite-scroll/coldplaygate-is-a-reminder-that-theres-no-escaping-going-viral\" target=\"_blank\" rel=\"noopener\">cuddling at a Coldplay concert</a>, the modern internet has made it so that we can all, at any moment, become a viral, scandalized sensation, observed by a roving army of eyeballs.</p><p>There is nothing that speaks more to our perma-tabloid social environment than the advent of the live stream, which has allowed ordinary people to become both the celebrity and the paparazzi of their own lives. Anyone can now broadcast real-time video from wherever they are, offering an unfiltered glimpse into the intimate, mundane, and occasionally horrifying experiences that were once witnessed only by those present. Until recently, live streaming was seen as a niche technology and a scrappy alternative to mainstream media, meant mostly for video-game players and fringe political pundits. Since the <em>COVID</em>-19 pandemic, however, the medium has become a major form of mass entertainment and a foundational way in which many people experience and interpret reality. The live stream promises boundless access and constant visibility, collapsing the boundary between the real and the performed, the private and the public, until living a life and broadcasting one become virtually indistinguishable. We can now watch people from around the world put on makeup, eat lunch, shop at the mall, ride in taxis, hang out with friends, smoke weed, work out, read bedtime stories to their children, record music, clean their kitchens, mow their lawns—you name it. And even though access to such banalities may sound brain-deadening, and at best dull, some of the most famous people in the world are now live-streamers. Tabloid coverage—even constantly running tabloid coverage, like Hilton’s—offered only glimpses of celebrity life, seen through a photographer’s lens, but live streaming offers something far more powerful: an endless portal into the lives of everyone, where the minutiae of human experience can be dramatized, observed, studied, critiqued, ironized, theorized about, and commented on. Some streamers participate in what is known as a subathon, a lucrative broadcast whose duration is extended whenever viewers subscribe or donate to the streamer’s channel; the longest have lasted for more than a thousand consecutive days.</p>"}];
