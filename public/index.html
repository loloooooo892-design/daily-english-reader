<style>

  --bg: #F7F8FA;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"US Army confirms it's offering 4 days to play GTA 6 to soldiers who reenlist for at least 2 years","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/grand-theft-auto/us-army-confirms-its-offering-4-days-to-play-gta-6-to-soldiers-who-reenlist-for-at-least-2-years/","category":"gaming","categoryLabel":"Gaming","wordCount":987,"readingTime":5,"content":"<p>The US Army's 3rd Infantry Division has confirmed that it is indeed offering a four-day pass in November to soldiers who reenlist for at least two years, so they can play <a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 6</a> when it comes out.</p><p>The \"Special Reenlistment Incentive\" memo is dated July 28, and came to light via the US Army WTF! Moments account on Instagram. It states, quite explicitly, that \"any soldier who signs a reenlistment contract between 1 August 2026 and 14 November 2026 will be authorized for a special four day pass. This special pass is specifically designated to coincide with the highly anticipated release of the videogame Grand Theft Auto 6.\"</p><p>As a lifelong civilian, that struck me as odd. I know the military has sometimes struggled to meet recruitment goals (although apparently it's doing pretty well these days, perhaps or perhaps not the sort of thing that happens when people can't afford groceries anymore), but would the Army really leverage GTA to convince its people to stick around for a few more years?</p><p>Well, yes. \"The idea was to have a unique incentives program that connects to what soldiers are interested in,\" Lt. Col. Angel Tomko told me. \"The command team, in conjunction with the career counselor, wanted to get soldiers excited to reenlist. The command team thinks eligible soldiers are more aware that they are in their window for reenlistment and engage their leadership and the career counselor earlier to see available opportunities.</p><p>\"The battalion has a new career counselor who approached unit leadership with an idea for an updated creative incentives program to reach FY27 reenlistment goals. Eligible soldiers must reenlist for a minimum of two years, up to six years.\"</p><p>Tomko said the GTA 6 offer is not Army-wide, but rather a program unique to the 3rd Infantry Division, of which the 9th Brigade Engineer Battalion is a part. It also seems to be quite successful: Tomko said there are 130 soldiers in the battalion who are eligible for the incentive and so far 20 have chosen it.</p><p>And apparently, this is novel but not unusual. \"Reenlistment incentives are routine for the US Army to reward our soldiers,\" Tomko said. \"We want to retain the best talent and it’s a credit to the creativity of the career counselor within the organization to develop this unique opportunity surrounding the launch of this popular videogame.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Based on reactions to the report on social media, it's fair to say that some find the idea of using a popular videogame to keep the ranks filled a bit <em>distasteful</em>. And fairly so: Four days in exchange for two years (or more) hardly seems a good deal, especially during a time of what often feels like aimless American adventurism.</p><p>And it can feel downright predatory when taken in the context of, for example, this <a href=\"https://abcnews.com/Politics/new-recruits-joining-military-big-numbers-reason-hegseth/story?id=135546620\" target=\"_blank\" rel=\"noopener\">ABC report</a> on military recruitment, which throws a disheartening light on the imbalance between high school kids with few opportunities and a massive, savvy organization who knows how to target them: \"Among the recruits and prospective recruits interviewed, only two said they knew what a secretary of defense is, and neither could identify who currently holds the position.\"</p><p>At the same time, it's likely that at least some of those 20 who took advantage of the offer were planning to reenlist anyway, and are just opting for the GTA 6 pass because, hey, why not? More to the point, unlike the new recruits interviewed in that ABC report, soldiers eligible for the offer are already in the Army: They may not know who the secretary of defense is either, but they are at least hip to what's in store.</p><p>Regardless of the reactions elsewhere, Tomko said the response to the incentive program among soldiers has been extremely positive.</p><p>\"The heightened interest in the press does not change the purpose of the program: to reward dedicated soldiers for service to their nation,\" Tomko explained. \"Every soldier who is eligible for this program is already serving, already trained, and already fully qualified. Reenlistment incentives are a longstanding part of Army retention, and units often tailor them to their formations in ways that build morale and spark early conversations about career options.</p><p>\"Soldiers who reenlist often have multiple incentive options depending on their Military Occupational Specialty, service needs, and eligibility, and range from time off, to money or duty location of choice. This specific incentive is for all soldiers in 9th Engineer Battalion and is an administrative bonus layered on top of standard reenlistment incentives.\"</p><p>The US military has a history of using videogames as part of its recruitment efforts. The America's Army shooter series debuted in 2002, almost 25 years ago—perhaps not coincidentally, just months after the start of what's now referred to as the Global War on Terrorism. In 2018 the Army launched its own <a href=\"https://www.pcgamer.com/the-us-army-is-starting-its-own-esports-team/\" target=\"_blank\" rel=\"noopener\">esports team</a>, which operates as part of its \"Marketing and Engagement Brigade based at Fort Knox,\" and in 2020 it began a Twitch channel for game streams. That endeavor had a <a href=\"https://www.pcgamer.com/the-us-armys-twitch-stream-is-being-flooded-with-questions-about-war-crimes/\" target=\"_blank\" rel=\"noopener\">rough start</a>, but the Army's esports org remains active, and continues to stream.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"Briefly Noted Book Reviews","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/the-yahoo-boys-unsayable-sunrise-skin-contact","category":"fun","categoryLabel":"Interesting Reads","wordCount":509,"readingTime":3,"content":"<p><strong>The Yahoo Boys</strong><em>, by Carlos Barragán (Farrar, Straus &amp; Giroux)</em>. In 2022, the author of this engrossing investigation travelled to Lagos, Nigeria, to find the person who, years earlier, ensnared his mother in an online romance scam. What he discovered was a place primed by its history and its poverty for the emergence of youths, known as Yahoo Boys, dedicated to conning Western marks using false identities, fake naked pictures, and flattery. In Barragán’s account, Nigerian public discourse casts the Yahoo life style—fuelled by drugs and extravagant spending—as a double-edged sword, both a stain on the country’s reputation and a powerful economic engine. As the book follows four Yahoos, it assembles a story of loneliness in the digital age—a loneliness that deforms scammer and scammed alike.</p><p><strong>Unsayable</strong><em>, by Michael Cunningham (Random House)</em>. When this warm memoir begins, the author, a celebrated novelist, observes that the world is “sufficient unto itself. It neither knows nor cares if anyone writes about it.” Why write, then? In the pages that follow, Cunningham remembers his upbringing in middle-class suburban California, his gradual awareness of his gayness, his time as a countercultural student at Stanford, and his stints working as a hustler and a bartender, all the while elaborating writing’s many purposes—and offering guidance on how to do it well. It’s a way to entertain, to turn “ephemera into objects,” to “render and recognize everything and everyone.”</p><h2><a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\">What We’re Reading</a></h2><p><em>Discover notable new fiction, nonfiction, and poetry.</em></p><p><strong>Sunrise</strong><em>, by Téa Obreht (Random House)</em>. This kaleidoscopic novel, which unfolds across three time lines, opens in 2024, with the crash of a Cessna in the mountains of Wyoming. A survivor wanders alone through the wilderness until she finds Sunrise, an abandoned old Western town. It’s the very place that, some twenty years earlier, a county local, Coll, is working tirelessly to preserve. But, when Coll meets a writer who’s similarly interested in the town’s legacy, his plans get derailed. The writer shares her manuscript—embedded within the novel and set in 1902—which contains little-known truths about Sunrise and the man who founded it, someone whom Coll had long revered. As the narratives converge, Obreht teases out the relationship between our conceptions of history and of ourselves.</p><p><strong>Skin Contact</strong><em>, by Elisa Faison (Cardinal)</em>. At the outset of this funny and pensive novel, Frances, a married woman, tells her husband, Ben, that she “sort of” has a crush on a waitress—thereby kicking off their open marriage. She and Ben soon discover the joys of sleeping with other people, both together and separately. For Frances, who is thirty, the experiment is, at first, a way to help her cope with the grief of losing her mother. Then, just as she is realizing that she might want to have a child, Ben falls in love with another woman. Torn between a life that might seem “frivolous” and one that feels “flattening,” the couple have to decide what, for them, is the right path.</p><p><em>An earlier version of this article misspelled Elisa Faison’s name.</em></p>"},{"title":"Appendix to Montesquieu’s Day in Court: Recovering a Classical Understanding of Separated Powers Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/montesquieus-day-in-court-appendix/","category":"law","categoryLabel":"Law","wordCount":598,"readingTime":3,"content":"<p>Caption</p><p>Citation</p><p><strong>Pincite(s)</strong></p><p>Learning Res., Inc. v. Trump</p><p>146 S. Ct. 628 (2026)</p><p>683 n.2 (Thomas, J., dissenting); 684 (Thomas, J., dissenting)</p><p>Trump v. CASA</p><p>145 S. Ct. 2540 (2025)</p><p>2598 (Jackson, J., dissenting)</p><p>SEC v. Jarkesy</p><p>144 S. Ct. 2117 (2024)</p><p>2131–32</p><p>CFPB v. Cmty. Fin. Servs. Ass’n of Am.</p><p>144 S. Ct. 1474 (2024)</p><p>1493–94 (Alito, J., dissenting)</p><p>Students for Fair Admissions v. President &amp; Fellows of Harvard Coll.</p><p>143 S. Ct. 2141 (2023)</p><p>2193–94 (Thomas, J., concurring)</p><p>Seila L. LLC v. CFPB</p><p>140 S. Ct. 2183 (2020)</p><p>2226 (Kagan, J., concurring in the judgment with respect to severability and dissenting in part)</p><p>Bostock v. Clayton County</p><p>140 S. Ct. 1731 (2020)</p><p>1824 (Kavanaugh, J., dissenting)</p><p>Patchak v. Zinke</p><p>583 U.S. 244 (2018)</p><p>267 (Roberts, C.J., dissenting)</p><p>Bank Markazi v. Peterson</p><p>578 U.S. 212 (2016)</p><p>238 (Roberts, C.J., dissenting); 241 (Roberts, C.J., are wrapper around an AI model — the tools, memory management, and rules that turn a raw model into something that can act on its own.</p>\n<p>The TL;DR: Simply by using a custom harness tweaked to handle memory well and including a “supervisor” boss-like component, researchers got Claude Opus 5 to achieve a 100% score on the interactive reasoning benchmark ARC-AGI-3 — a set of 2D games with no instructions, where the model has to figure out how to play and win, similar to how a human would. (That’s a benchmark that has particularly irked rival frontier lab OpenAI.) Without the harness, Opus 5 scored 30%, which was the top result among all the models tested.</p>\n<p>Nvidia’s research is another indicator that, while model choice does matter, the model itself — the part that acts as the agent’s “brain” — is a smaller part of an agentic system than many AI users realize, especially for long-horizon tasks. The harness is what makes a model an agent: It handles memory, context, and feedback.</p>\n<p>“Generally speaking, the world interprets an agent almost as an API of the model,” Adel El Hallak, vice president of product in Nvidia’s AI unit (pictured above), tells TechCrunch. But an agent is actually more than that. “It is the model. It is the scaffolding around the model, which we call the harness, i.e. the set of tools that it utilizes. It is the runtime and the associated skills and libraries that we give it access to.”</p>\n<p>Long-horizon tasks are those that require stringing many decisions together, sometimes over days, to produce completed work. This is in contrast to an AI just spitting out a response to a prompt. Figuring out how to get an AI to do long-horizon tasks without getting distracted and going off in la-la land is one of the holy grails in agentic research.</p>\n<p>For example: Microsoft <a href=\"https://arxiv.org/abs/2604.15597\" target=\"_blank\" rel=\"noopener\">published</a> research in April that tested 19 LLMs on long-horizon tasks involving document editing and discovered that all the models, including frontier ones, filled the documents with errors. (If humans produced work like that, they would be promptly fired.)</p>\n<p>Models stringing decisions together on their own have also been caught <a href=\"https://techcrunch.com/2026/07/14/openais-new-flagship-model-deletes-files-on-its-own-people-keep-warning/\" target=\"_blank\" rel=\"noopener\">deleting their users’ files or even whole databases</a> or <a href=\"https://techcrunch.com/2026/07/29/claude-opus-5-became-downright-ruthless-when-tasked-with-running-a-vending-machine/\" target=\"_blank\" rel=\"noopener\">turning to criminal behavior</a>, from collusion to <a href=\"https://techcrunch.com/2026/07/27/openais-hugging-face-breach-has-reignited-the-debate-over-alignment-and-control/\" target=\"_blank\" rel=\"noopener\">hacking</a>, to achieve their objectives. </p>\n<p>The choice by Nvidia researchers to use this interactive reasoning benchmark for their tests is particularly meaningful, almost funny. A 100% score means that the model can beat the games as well as humans.</p>\n<p>OpenAI was so flustered by its models’ abysmal scores (less than 10%) on ARC-AGI-3 that it conducted its own research last month. Like Nvidia, <a href=\"https://openai.com/index/how-two-settings-tripled-our-arc-agi-3-scores/\" target=\"_blank\" rel=\"noopener\">OpenAI discovered that simply</a> by tweaking two settings on the harness, its models tripled their scores.</p>\n<p>But none of the models came close to hitting a 100% score, like Nvidia’s researchers achieved. They showed that the harness needs a “supervisor” component that prods the agent in the right direction if it gets stuck.</p>\n<p>“The more interesting part was introducing a supervising agent in addition to your main agent that’s doing the work,” El Hallak said. It “almost acts like a CEO to nudge the agent when it goes off direction or starts exploring a path that it might lead to a dead end, or re-explore a path that it had previously trod.”</p>\n<p>While the concept of the supervising agent isn’t exactly new, today most agent users are relying on only one layer for their harness, like Claude Code, Codex, or Hermes. Nvidia researchers created their own souped-up harness called the <a href=\"https://arxiv.org/abs/2603.24517\" target=\"_blank\" rel=\"noopener\">Agentic Variation Operators (AVO)</a>.</p>\n<p>Note that this isn’t a new Nvidia product. Nvidia instead produces <a href=\"https://developer.nvidia.com/blog/where-security-fits-in-an-ai-agent-stack/\" target=\"_blank\" rel=\"noopener\">lots of open bits and pieces of tech for building harnesses</a> under the Nemo brand. Some of that tech is commercial, while much is openly available.</p>\n<p>Still, Nvidia’s results add to the growing evidence that model choice is far from the only factor in agentic performance. In July, for instance, Databricks <a href=\"https://www.databricks.com/blog/benchmarking-coding-agents-databricks-multi-million-line-codebase\" target=\"_blank\" rel=\"noopener\">published</a> some stunning research that shows that the harness, more than the model, dramatically impacts AI costs.</p>\n<p>“You can pick the same model but different harnesses, and you get significantly more cost if you use the wrong harness,” Databricks CEO Ali Ghodsi told TechCrunch. “So you think, oh, this is an expensive model. This is a cheap model. But wait, which harness are you using? That itself can 2x your cost.”</p>\n<p>Nvidia’s larger point is to show that open harnesses, like open models, put users in control far more than they realize.</p>\n<p>“We believe, and we’re demonstrating with the ecosystem, how open harnesses allow you to turn a lot more knobs to drive up that accuracy,” El Hallak said. “It relates to OpenAI slowing down the training of their models,” <a href=\"https://techcrunch.com/2026/08/07/openai-says-it-slowed-astra-model-development-over-security-concerns/\" target=\"_blank\" rel=\"noopener\">as a result of models creating security breaches</a>.</p>\n<p>“We believe in having an open agent stack — where you have control across the harness, across the infrastructure, across the runtime — is what’s required for us to usher the ecosystem forward and securely,” he added.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"}];
