*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

}

}

  border: 1px solid var(--warning-border);
  border-radius: 4px;

.article-body ul, .article-body ol {

.article-body li {

.article-body a {

.article-body a:hover {

<script>
var articles = [{"title":"Google’s revived nuclear power plant gets $1.9B loan from US government","source":"TechCrunch","author":"Tim De Chant","url":"https://techcrunch.com/2026/09/08/googles-revived-nuclear-power-plant-gets-1-9b-loan-from-us-government/","category":"tech","categoryLabel":"Technology","wordCount":646,"readingTime":4,"content":"<p>Last October, Google said it would bring an Iowa nuclear power plant <a href=\"https://techcrunch.com/2025/10/29/google-to-bring-shuttered-nuclear-power-plant-back-from-the-dead/\" target=\"_blank\" rel=\"noopener\">back from the dead</a>. Now the facility’s owner, NextEra Energy, has received a $1.9 billion loan from the U.S. Department of Energy to finance the refurbishment.</p>\n<p>The sizable loan is the second of its kind, suggesting that the Trump administration views revived nuclear power as a key source of electricity for tech companies seeking to power their AI data centers. Last year, the Department of Energy <a href=\"https://techcrunch.com/2025/11/18/trump-doe-gives-microsoft-partner-1b-loan-to-restart-three-mile-island-reactor/\" target=\"_blank\" rel=\"noopener\">extended a $1 billion loan</a> to Constellation Energy to restart a reactor at Three Mile Island.</p>\n<p>James Danly, Deputy Secretary of Energy, said that the Iowa power plant’s restart in 2029 will “drive down electricity costs,” though he did not explain how. Just 50 megawatts will be set aside for the local power cooperative, NextEra CEO John Ketchum said during an <a href=\"https://www.investor.nexteraenergy.com/~/media/Files/N/NEE-IR/reports-and-fillings/quarterly-earnings/2025/Q3%202025/Final_Q3%202025%20Script%20vF.pdf\" target=\"_blank\" rel=\"noopener\">earnings call</a> last year. That capacity would cover 18% of Iowa’s demand growth since 2021, the year before ChatGPT was released.</p>\n<p>Google is <a href=\"https://www.datacenterdynamics.com/en/news/google-looks-to-build-up-to-six-data-centers-near-nuclear-power-site-in-linn-county-iowa/\" target=\"_blank\" rel=\"noopener\">reportedly</a> looking to build up to six data centers near the Duane Arnold Energy Center, which hasn’t operated since 2020 when an intense rainstorm damaged the power plant. Rather than repair it, NextEra decided to mothball it. At the time, cheap natural gas was flooding the market, making nuclear power <a href=\"https://www.utilitydive.com/news/what-does-it-take-restore-nuclear-power-plant/820831/\" target=\"_blank\" rel=\"noopener\">economically unappealing</a>.</p>\n<p>A lot has changed in the last six years, though. After decades of little growth in demand, the sudden rise of AI coupled with broader electrification of the economy meant that utilities and power providers were suddenly scrambling to find new generating sources of electricity. New data centers are expected to <a href=\"https://techcrunch.com/2025/12/01/data-center-energy-demand-forecasted-to-soar-nearly-300-through-2035/\" target=\"_blank\" rel=\"noopener\">nearly triple</a> the sector’s electricity demand by 2035.</p>\n<p>Shuttered nuclear power plants are becoming one of the tech industry’s favorite choices to quickly provide clean, firm power.</p>\n<p>Microsoft signed a deal with Constellation Energy two years ago to <a href=\"https://techcrunch.com/2024/09/20/microsoft-taps-three-mile-island-nuclear-plant-to-power-ai/\" target=\"_blank\" rel=\"noopener\">restart a reactor at Three Mile Island</a> that last operated in 2019. The reactor is scheduled to restart in 2028 and generate 835 megawatts. </p>\n<p>Another facility in Illinois, Constellation Energy’s Clinton Clean Energy Center, was in danger of closing down before its parent <a href=\"https://techcrunch.com/2025/06/03/meta-buys-a-nuclear-power-plant-more-or-less/\" target=\"_blank\" rel=\"noopener\">found a new customer in Meta</a>, which is buying all of the clean energy attributes from the 1.1 gigawatt power plant. The arrangement will see Clinton sending its electrons to the local grid, while Meta will use the certificates to offset emissions it is producing elsewhere. The tech giant’s Hyperion AI data center, for example, will need 10 natural gas power plants to operate. If completed, the data center will consume more electricity than <a href=\"https://techcrunch.com/2026/04/01/metas-natural-gas-binge-could-power-south-dakota/\" target=\"_blank\" rel=\"noopener\">all of South Dakota</a>.</p>\n<p>Duane Arnold is smaller, but in the process of refurbishment, NextEra will squeeze an additional 14 megawatts from the facility, bringing the total to 615 megawatts.</p>\n<p>Altogether, the three power plants represent the lowest hanging fruit in the U.S. There might be one or two more, according to a <a href=\"https://www.utilitydive.com/news/palisades-three-mile-island-duane-arnold-nuclear-reactor-restart-holtec-nextera-constellation-nrc/730393/\" target=\"_blank\" rel=\"noopener\">report</a> from Utility Dive, though those candidates, including San Onofre in California, have been shuttered for longer and would require more work to bring back online.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Tim De Chant is a senior climate reporter at TechCrunch. He has written for a wide range of publications, including Wired magazine, the Chicago Tribune, Ars Technica, The Wire China, and NOVA Next, where he was founding editor. </p>\r\n<p>De Chant is also a lecturer in MIT’s Graduate Program in Science Writing, and he was awarded a Knight Science Journalism Fellowship at MIT in 2018, during which time he studied climate technologies and explored new business models for journalism. He received his PhD in environmental science, policy, and management from the University of California, Berkeley, and his BA degree in environmental studies, English, and biology from St. Olaf College.</p>\r\n<p>You can contact or verify outreach from Tim by emailing <a href=\"mailto:tim.dechant@techcrunch.com\" target=\"_blank\" rel=\"noopener\">tim.dechant@techcrunch.com</a>.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/tim-de-chant/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Citing election-fraud concerns, Trump administration brings dispute over voter database to the Supreme Court","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/09/citing-election-fraud-concerns-trump-administration-brings-dispute-over-voter-database-to-the-su/","category":"law","categoryLabel":"Law","wordCount":814,"readingTime":5,"content":"<p>For the second time in three days, the Trump administration on Tuesday came to the Supreme Court, asking the justices to clear the way for it to implement a program that it says is intended to combat election fraud. U.S. Solicitor General D. John Sauer urged the court to pause a ruling by a federal judge in Washington, D.C., that bars the government from using the current version of the Department of Homeland Security’s Systematic Alien Verification for Entitlements database to verify voters’ citizenship. Sauer told the justices that the order by U.S. District Judge Sparkle Sooknanan “makes it harder to detect ineligible voters, undermining the integrity of federal elections and public confidence in the results of those elections.”</p><p>On Sunday, the Trump administration <a href=\"https://www.scotusblog.com/cases/us-postal-service-v-california-2/\" target=\"_blank\" rel=\"noopener\">asked the justices</a> to block a ruling by a federal judge in Boston that bars the government from implementing portions of a U.S. Postal Service rule on mail-in ballots. Sauer argued in that case that <a href=\"https://www.courtlistener.com/docket/74701505/156/state-of-california-v-united-states-postal-service/\" target=\"_blank\" rel=\"noopener\">Friday’s order</a> by U.S. District Judge Indira Talwani “nullif[ies] the Postal Service’s efforts to address the risk that the federal mails will be used to perpetrate voter fraud—a particularly pernicious species of fraud that dilutes the votes of lawful voters, prevents election results from reflecting the will of the American people, and undermines ‘public confidence in the integrity of the electoral process.’”</p><p>On March 25, President Donald Trump issued <a href=\"https://www.whitehouse.gov/presidential-actions/2025/03/preserving-and-protecting-the-integrity-of-american-elections/\" target=\"_blank\" rel=\"noopener\">an executive order</a> that (among other things) directed the Department of Homeland Security and the Social Security Administration to create systems that would allow state and local governments to verify the citizenship and immigration status of voters. Those agencies then overhauled the SAVE system to include the records of U.S.-born citizens, to give it access to Social Security numbers, and to allow bulk searches (rather than requiring users to inquire about one person at a time).</p><p>The League of Women Voters and the Electronic Privacy Information Center brought a lawsuit in federal court in Washington challenging the changes to the SAVE system. In a <a href=\"https://ecf.dcd.uscourts.gov/cgi-bin/show_public_doc?2025cv3501-111\" target=\"_blank\" rel=\"noopener\">ruling</a> on June 22, Sooknanan agreed that the modified system violates federal privacy laws, the Social Security Act, and the federal laws governing administrative agencies, and she barred the government from using the modified system.</p><p>Sooknanan wrote that “the federal government has knowingly trampled on the privacy rights of American citizens in a manner that threatens the sacred right to vote.” Moreover, she continued, “states have partnered with the federal government to access the database and are actively removing United States citizens from voter rolls based on inaccurate information.”</p><p>A divided panel of the U.S. Court of Appeals for the District of Columbia Circuit <a href=\"https://media.cadc.uscourts.gov/orders/docs/2026/09/26-5243LDSN.pdf\" target=\"_blank\" rel=\"noopener\">turned down</a> the government’s request to put Sooknanan’s order on hold while the appeal moves forward, but it said that the case should be fast-tracked.</p><p>Sauer then came to the Supreme Court on Tuesday morning, asking the justices to step in. He called Sooknanan’s ruling an “indefensible order that threatens the integrity of upcoming elections by vacating the federal government’s authority to internally use Social Security data when fulfilling its duty to respond to requests by States to verify the citizenship of individuals for voting and other purposes.”</p><p>Sauer argued that Sooknanan did not have the authority to enter her order because the challengers do not have a legal right to sue, known as standing. Among other things, he wrote, the federal government is not the source of any injury that the challengers and their members might suffer. “SAVE,” he said, “does not disqualify any voter; instead, it merely notifies the States whether the federal government can confirm citizenship.” To the extent that anyone is injured, he suggested, that injury would come from the states themselves.</p><p>And in any event, Sauer continued, the government’s “policy is consistent with all applicable federal statutes.” Federal law, he emphasized, “requir[es] DHS to provide citizenship verification” and therefore gives the agency the power “to take steps—such as checking Social Security records—that are reasonably necessary to perform that duty.” Moreover, he added, federal law bars “courts from relying on other statutes, such as the Privacy Act and the Social Security Act, to block citizenship-verification responses based on the sharing of Social Security information.”</p><p>Finally, Sauer told the justices that the government will suffer “irreparable” harm – another criterion for temporary relief – if Sooknanan’s order is not put on hold. The government, he said, would be “required to return to an older, more cumbersome, and less reliable version of the” SAVE system, and any “reversal of the district court’s judgment ‘would come too late for the 2026 midterms.’”</p><p>Chief Justice John Roberts, who has initial responsibility for emergency appeals from Washington, D.C., directed the challengers to file their response by 4 p.m. EDT on Tuesday, Sept. 15.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Citing election-fraud concerns, Trump administration brings dispute over voter database to the Supreme Court</em>, SCOTUSblog (Sep. 8, 2026, 1:52 PM), https://www.scotusblog.com/2026/09/citing-election-fraud-concerns-trump-administration-brings-dispute-over-voter-database-to-the-su/</p>"},{"title":"New D&D RPG Warlock is an open world spell-collecting game with a touch of Far Cry, and that's just fine by me, actually","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/warlock-dungeons-dragons-is-an-open-world-spell-collecting-game-and-thats-just-fine-by-me-actually","category":"gaming","categoryLabel":"Gaming","wordCount":909,"readingTime":5,"content":"<p>From a team of former Ubisoft people</p>\n    \n  \n  \n  \n<p>\n            This week we got our first proper look at Warlock: Dungeons &amp; Dragons, Wizard of the Coast's new RPG-tinted action game. In theory, it's the story of a grizzled weapon master who is searching a lawless pocket dimension for somebody precious to her, but I disapprove massively of this objective, because it sounds like it's going to get in the way of unearthing weird spells and making a glorious mess.\n</p><p>Created by a team of former <a href=\"https://www.rockpapershotgun.com/games/far-cry\" target=\"_blank\" rel=\"noopener\">Far Cry</a>, <a href=\"https://www.rockpapershotgun.com/games/watch-dogs\" target=\"_blank\" rel=\"noopener\">Watch Dogs</a> and <a href=\"https://www.rockpapershotgun.com/games/splinter-cell\" target=\"_blank\" rel=\"noopener\">Splinter Cell</a> devs, Warlock gives you an open world full of charms, cantrips and conjurations to gather and fool around with. I'm really hoping it's as open-ended as they're making it sound. Here's a video, followed by some commentary from creators Invoke.\r\n</p>\n\n<p>\r\nWarlock takes place in Darkon, a Domain of Dread sealed away in the mist. Kind of like Blackpool, but with more turrets and mountains than rollercoasters. The aforesaid weapon master is Kaatri. Early on in the story, she teams up with an ancient witch queen, Tasha, who is appropriately voiced by Lady Dimitrescu off <a href=\"https://www.rockpapershotgun.com/games/resident-evil-village\" target=\"_blank\" rel=\"noopener\">Resident Evil Village</a>. Tasha grants the meathead Kaatri a bunch of magical powers. There's a price to pay, naturally, but I imagine you won't have to worry about that till the endgame. In the meantime: tentacle attacks!\r\n</p>\n<p>\r\nWarlock features a variety of D&amp;D spells, including old standbys like <a href=\"https://www.rockpapershotgun.com/games/eldritch\" target=\"_blank\" rel=\"noopener\">Eldritch</a> Blast, Gust of Wind, Levitate, and Black Tentacles. The devs have tampered with their workings to suit the solo real-time action format: Fae Switch, for example, is a reimagined version of a spell from D&amp;D's 4th edition, which here allows you to swap places with an enemy. Pact of the Blade Warlock, meanwhile, lets you summon physical weapons such as swords and hammers. \r\n</p><p>\r\n\"They're not all typical to a Warlock class, so we're bringing new additions based on her patron, Tasha, to the game,\" explains Invoke studio founder and former Splinter Cell and Far Cry developer Jeffrey Hattem in a roundtable chat published by <a href=\"https://wccftech.com/warlock-dungeons-and-dragons-open-world-player-agency/\" target=\"_blank\" rel=\"noopener\">wccftech</a>. \"But we're also introducing a couple of new spells for the game. One of them is Tasha's Leash, where Kaatri can summon ethereal tendrils that'll grab objects or monsters and bring them towards her. She can also throw stuff after grabbing them.\"\r\n</p>\n<p>\r\nHatten stresses that \"the spells are intended to be versatile tools that you can use like a tool in your toolbox, and that's how we want players to play the game\". You can, for example, use your Black Tentacles to hold up a box for platforming purposes, or deploy them to rip an axe from an ogre's fists. Some spells also combo together. You can pop out a conjuring table and summon a rainstorm, for instance, which will make your chaining Witch Bolts all the zappier.</p>\n\n<p>\r\nI wouldn't say any of the above applications surprise me. Certainly, it's nothing like the kind of inadvertent cascade effect we see in <a href=\"https://www.rockpapershotgun.com/baldurs-gate-3-class-list\" target=\"_blank\" rel=\"noopener\">Baldur's Gate 3</a>. But I like the intention here. I also like that you aren't just plucking spells from an upgrades tree. A lot of them are optional finds, hidden around a world that's described as busier than it is vast.\r\n</p><p>\r\n\"[F]rom an open world perspective, we want to create one with a lot of density,\" says Invoke's general manager and former Watch Dogs 2 senior producer Dominic Guay. \"So yeah, you'll have to travel, but we don't want you to have daunting distances to travel where it takes 15 minutes to get somewhere. So you should always have interesting things around you that catch your attention, and different opportunities that draw you in.\"\r\n</p>\n<p>\r\nIn general, the game ranks exploration over \"forced\" story beats. The devs are trying to keep wayfinding features like in-game maps to a minimum. They've spent a lot of time pinning down the world's size. \"You can't go from mountain to ocean and to all sorts of different terrain types if you only have 100 yards,\" Guay adds elsewhere in the chat. \"So you need distance. And I think a lot, when you talk about the size of open worlds, it's always really tricky to talk about that because it's mostly how it's perceived more than the actual square footage of the world. So it is a pretty big world in the sense that you can roam it for a long time if that's what you're driven to do.\"\r\n</p>\n<p>\r\nEven as they embrace – perhaps, invoke - D&amp;D's copious history of wizarding, Invoke are fearful of scaring away people who have never rolled a D20. \"What we don't want is for D&amp;D to be a barrier to entry,\" Hattem comments. \"Like any good action adventure game, you don't need to come with a background of knowledge of D&amp;D. Kaatri is a stranger in a strange land as she enters this world, and players are at par with that as she goes on this adventure. So anything that you need to learn about the game, you'll pick up as you go in and explore the world.\"\r\n</p>\n<p>\r\nIt's out sometime in 2027. I'm broadly enthused! Leaving aside the Baldur's Gate comparison, it doesn't yet look as receptive to sorcerous improvisation as <a href=\"https://www.rockpapershotgun.com/eternal-strands-review\" target=\"_blank\" rel=\"noopener\">Eternal Strands</a>, which trades more overtly on real-time physics. But I feel like Invoke have the experience to deliver something pleasantly volatile. Just, don't be afraid to break the game a bit, devs. Every good spell system should be a bit broken.\r\n</p>"},{"title":"How a Skateboarder Sees Los Angeles","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/photo-booth/how-a-professional-skateboarder-sees-los-angeles","category":"fun","categoryLabel":"Interesting Reads","wordCount":1274,"readingTime":7,"content":"<p>Jerry Hsu grew up in San Jose, about an hour south of San Francisco, and, for a time, he assumed he would never leave. He didn’t need to. In the late nineties and two-thousands, Hsu and his daredevil friends had proudly put their sleepy Silicon Valley city on the map as an unlikely skateboarding capital. He noticed that young skateboarders from around the country were moving to San Jose, “and it had to do with my group of friends and these videos we were making,” he told me. “It’s like when a random city becomes very important for some random reason. We were able to have our slice of heaven.”</p><p>The son of Taiwanese immigrants, Hsu was a precocious talent and became a professional skateboarder in his mid-teens. Magazines sent photographers to San Jose to shoot pictures of him, and he eventually became interested in their craft, what kind of gear they were using, the parallels between their respective art forms. His mother would drive him to the local Barnes &amp; Noble, where he grew fascinated with how <a href=\"https://www.newyorker.com/culture/cultural-comment/nan-goldins-art-addiction-and-activism-in-all-the-beauty-and-the-bloodshed\" target=\"_blank\" rel=\"noopener\">Nan Goldin</a> and <a href=\"https://www.newyorker.com/magazine/2001/07/30/us-and-them\" target=\"_blank\" rel=\"noopener\">Larry Clark</a> chronicled the micro-scenes around them. (She also famously procured him a concrete parking block so that he could practice tricks at home.) As skateboard companies sent him around the world in his late teens and twenties, he began obsessively taking photographs of the strange, funny, often macabre things he came across, and publishing them on Tumblr or in <em>Vice</em> magazine.</p><p>In 2011, Hsu moved to Los Angeles, primarily for a relationship, and to further his career as a skateboarder. But he also felt a private excitement about spending time photographing a city “that was more rich with things I wanted to see.” With a body thrashed by occupational hazards, Hsu, who is forty-four, orients his life nowadays around running Sci-Fi Fantasy, his skate company, and roaming the city to take pictures. His latest book, “<a href=\"https://www.mackbooks.us/products/how-about-never-jerry-hsu\" target=\"_blank\" rel=\"noopener\">How About Never</a>,” is a brutal and wondrous chronicle of the sights he has sought out these past fifteen years.</p><p>It’s no surprise that a skateboarder, constantly scanning the landscape for surfaces to recontextualize, might see the world differently. Hsu’s photographs explore the city’s manic extremes. Some of them are quick visual gags: the symmetry of two discarded toilets stacked like yin and yang (or in a sixty-nine position) on the side of the street, a veiny sex toy that’s washed up in a brackish puddle. A triangular slab has fallen neatly out of a wall, as though it was too weary to go on. He notices signs of life where others might just perceive neglect, such as a flower bush sequestered behind a foreboding fence. One picture feels like a short story waiting to be written: a tree hollowed out by rot has been stuffed with roses by a neighbor who felt sorry for it. Hsu maps a Los Angeles of leftovers and castoffs; portraits of friends and strangers in the street are full of dazed, inscrutable expressions.</p><p>“My attraction to risk is ever present,” he explains. Hsu is the type of person who runs toward fire, as evidenced by pictures of overturned cars, collisions, a bank building ablaze. They manage to avoid feeling grimly voyeuristic. Instead, there’s a sense of stillness in these images, akin to that flash of calm after you’ve done something ruinous to your body but before your brain registers pain or begins cycling through consequences. I was drawn to a picture of a smashed car windshield, the glass frozen in a series of circular ripples, until it began to resemble the vertical slit of a reptilian eye. It was still in mind a few pages later, as I studied how a young man’s artificial eye seemed to match the orange shade of his hoodie.</p><p>My favorite picture in the book finds a sensibly blue Subaru station wagon that has somehow turned on its side in the middle of the night. There’s something funny about its vanity license plate (“<em>4A POEM</em>”) and the way the car’s headlights shine brightly on a house in the distance, as if to point attention away from itself.</p><p>Hsu says that his ex-wife often remarked that he had a sixth sense for stumbling upon bizarre, uncanny scenes. Many of his images, even the faintly violent ones, possess an absurdist humor: in one, a motorist explains to a police officer why their Toyota has hopped the curb, but, from a distance, it almost looks like the sedan is playfully trying to return to its mates in a used-car lot. Hsu explained that he finds a lot of his subjects by using <a href=\"https://www.newyorker.com/magazine/2019/07/29/citizen-the-smartphone-police-blotter\" target=\"_blank\" rel=\"noopener\">Citizen</a>, the incident-reporting app, to see if anything intriguing is happening nearby.</p><p>For all the book’s darkness, there are pictures that feel sublime and vast. There are numerous pictures from the hills surrounding Los Angeles where you can’t tell whether the city is on fire or merely aglow with energy. A suburban home like any other sits haloed by clouds, with California’s placid skies a screen of infinite possibility. A picture of a cat vaulting from a gate to a fence takes on an outsized feeling of hope. “Maybe this is corny,” Hsu explained to me, “but all this chaos and these little beautiful secrets I found here reminded me of myself. It was a mirror and threshold.”</p><p>I first learned about Hsu in the early two-thousands. My younger cousin wound up skating at his house a few times and excitedly asked if we were related to him. Sadly, the answer was no. Admiring Hsu’s twin careers taught me to see my own Silicon Valley suburb differently, even though I was someone who’d felt the urge to leave as soon as I could. I realized that I hadn’t tried hard enough to appreciate all the beauty and weirdness that was actually available to me.</p><p>Where Hsu’s early work was filled with the people in his life, his work over the past decade is marked by a kind of solitude. Some of “How About Never” feels uncomfortably intimate, from its opening image of a cake flower resting on a knife above a dingy sink to pictures of hospital rooms, scabs and bruises, his ex-wife resting her palms on the sink in their bathroom. Hsu says that he spent nearly ten years editing the book, and that he recently realized that it also tracks the dissolution of his marriage. As he put it, there’s a private story of “hope, despair, all the feelings that are associated with trying to make a loving relationship happen” in how the images are sequenced.</p><p>Hsu spoke to me from his home in Los Angeles, and at one point, he angled his laptop to show me a shelf full of negatives and contact sheets, and hard drives of digital photos. His archives contain nearly every picture he’s taken in the past twenty-five years, even random things he texts to his friends. He rarely deletes pictures from his phone, thinking that even the imperfect shots might be meaningful to him someday. It reminded me of the famous series of home movies that Hsu made of himself, as a teen-ager, practicing tricks in his parents’ garage. The result of all those hours of practice was a style of effortless cool. Yet he felt compelled to keep a record of all the failures and misses along the way. “Maybe because I have this type of vision, it really takes away from another type that’s more practical,” he said, laughing. A few minutes after we hung up, he got an alert on his phone: a car had just flipped over in Koreatown. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
