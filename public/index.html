var articles = [{"title":"Aggregation and the \"Universal\" Injunction Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/","category":"law","categoryLabel":"Law","wordCount":730,"readingTime":4,"content":"<h2>Introduction</h2>\n<p>A crucial function of judicial review is not only “to say what the law is,”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a> but also to provide the remedies to vindicate that law.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Judicial review plays an especially important role when government officials act in ways that violate federal law, including when they violate the Constitution.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  When government officials violate the law, the judicial review function supports a remedy that requires officials to comply with federal law by ceasing to pursue the illegal policy or practice.</p>\n<p>Such “compliance” injunctions have been given the label “universal” or “nationwide” injunctions insofar as they go beyond giving “complete relief <em>to the plaintiffs before the court</em>.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a>  Among other things, this framing couches compliance injunctions as aggregation devices — as improper attempts to “create de facto class actions.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a>  Although this characterization has never been entirely accurate,<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> the majority in <em>Trump v. CASA, Inc.</em><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a> embraced it and, as a result, narrowly construed the federal courts’ statutory authority to issue such injunctions in cases brought by individual plaintiffs.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a>  The <em>CASA </em>decision makes it imperative to reckon with “universal” injunctions through the lens of aggregation — specifically, through the lens of class actions under Rule 23 of the Federal Rules of Civil Procedure.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a></p>\n<p>In this Essay, we begin with a brief summary of the <em>CASA </em>decision’s holding regarding the availability of “universal” injunctions.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  Part II discusses the relationship between remedies and judicial review and the important role that such injunctions play in that regard.  Part III explores how class actions could serve as an alternative path for federal courts, after engaging in judicial review, to make their decisions meaningful by requiring officials to comply with the law and to cease illegal actions or policies.  We also respond to several objections to the use of class actions in this context.  The final Part addresses some implications of the class action route to “universal” injunctions, identifying the core functional connection between class actions and such injunctions, but also acknowledging some of the problems that this class action route may pose.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1791.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Marbury v. Madison, 5 U.S. (1 Cranch) 137, 177 (1803).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 163 (“[I]t is a general and indisputable rule, that where there is a legal right, there is also a legal remedy by suit or action at law, whenever that right is invaded.” (quoting 3 William Blackstone, Commentaries *23)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>E.g.</em>, United States v. Lee, 106 U.S. 196, 220–21 (1882).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Trump v. CASA, Inc., 145 S. Ct. 2540, 2548 n.1, 2557 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2556 (quoting Smith v. Bayer Corp., 564 U.S. 299, 315 (2011) (emphasis omitted)).  Professor Maureen Carroll describes individual plaintiff litigation to obtain compliance injunctions outside of class actions as “quasi-individual” actions.  Maureen Carroll, <em>Aggregation for Me, but Not for Thee: The Rise of Common Claims in Non-Class Litigation</em>, 36 Cardozo L. Rev. 2017, 2020 (2015).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>CASA</em>, 145 S. Ct. at 2600 n.2 (Jackson, J., dissenting) (arguing that “the majority’s primary premise — that universal injunctions ‘grant relief to nonparties’ — is suspect” because “[w]hen a court issues an injunction (universal or otherwise), it does so via an order that governs the relationship between the plaintiff and the defendant”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> 145 S. Ct. 2540 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>supra</em> notes 4–5 and <em>infra</em> notes 20–22 and accompanying text.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally, e.g.</em>, David Marcus, <em>The Class Action After Trump v. CASA</em>, 73 UCLA L. Rev. Discourse 2 (2025) (discussing the role of class actions after the <em>CASA </em>decision).  Class actions are not the only vehicle for obtaining compliance injunctions against governmental policies that violate federal law.  <em>See</em> <em>infra</em> notes 24–29 and accompanying text (discussing how <em>CASA</em> did not rule out such relief either (a) in suits by individual, governmental, or associational plaintiffs in certain circumstances, or (b) when authorized by the vacatur provision of the Administrative Procedure Act).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> For an explanation of why we put “universal” injunctions in quotation marks, see Portia Pedro, <em>Toward Establishing a Pre-Extinction Definition of “Nationwide Injunctions</em>,<em>”</em> 91 U. Colo. L. Rev. 847, 849–50 (2020).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"Ten advances in mathematics and theoretical computer science","source":"Hacker News Best","author":"","url":"https://openai.com/index/ten-advances-in-mathematics/","category":"tech","categoryLabel":"Technology","wordCount":746,"readingTime":4,"content":"OpenAI<ul><li><a href=\"https://openai.com/index/ten-advances-in-mathematics/#the-results\" target=\"_blank\" rel=\"noopener\">The results</a></li><li><a href=\"https://openai.com/index/ten-advances-in-mathematics/#responsibility-to-the-mathematical-community\" target=\"_blank\" rel=\"noopener\">Responsibility to the mathematical community</a></li></ul><p>We want to empower scientists and mathematicians with tools that accelerate discovery. That is why we recently announced <a href=\"https://openai.com/index/chatgpt-for-academic-researchers/\" target=\"_blank\" rel=\"noopener\">ChatGPT for Academic Researchers⁠</a>, an initiative providing 100,000 scientists and mathematicians with free access to our best ChatGPT models. We also continue to evaluate our models on open research problems during development.</p><p>In May, we shared an <a href=\"https://openai.com/index/model-disproves-discrete-geometry-conjecture/\" target=\"_blank\" rel=\"noopener\">AI-generated disproof⁠</a> of the Erdős unit-distance conjecture, discovered while evaluating an unreleased model. This work has already inspired further developments in mathematics and theoretical computer science<a href=\"https://openai.com/index/ten-advances-in-mathematics/#citation-bottom-1\" target=\"_blank\" rel=\"noopener\">1</a>. Today, we are sharing a selection of ten results to problems that have been open and have seen no progress on the main result for at least a decade, and in most cases much longer. These problems span high-dimensional geometry, coding theory, arithmetic circuit complexity, group theory, operator algebras, quantum complexity, lattice cryptography and extremal combinatorics. All of these problems are of substantial interest to their respective mathematical communities, and several are of broad interest across mathematics as a whole.</p><h2>The results</h2><p>We provide new results for the following problems. The results were achieved by an internal version of Astra, our next major model. The total number of tokens needed to find solutions to these problems would cost roughly $2,000 at Sol API rates. These arguments were then prepared into manuscripts by humans with the same model. Afterward, the model formalized each argument in a <a href=\"https://github.com/openai/ten-proofs\" target=\"_blank\" rel=\"noopener\">Lean certificate⁠(opens in a new window)</a>. We are also releasing for each solution a model’s narration of its thinking process.</p><ol><li>High-dimensional sphere packing. New upper bounds on sphere-packing density down to the Cohn–Elkies threshold.</li><li>Binary and spherical codes: Exponentially improved bounds on the maximum size of binary codes at any prescribed minimum distance, with analogous results for high-dimensional spherical codes.</li><li>Non-sofic groups. A construction establishing the existence of non-sofic groups, addressing a central open question in group theory.</li><li>Connes’s rigidity conjecture. Disproof of a longstanding conjecture that certain groups are uniquely determined by their von Neumann algebras.</li><li>Arithmetic circuit complexity. New lower bounds for computing the permanent using arithmetic circuits and formulas, including an arithmetic-formula lower bound of order n4/log n.</li><li>Quantum parallel repetition. An exponential parallel repetition theorem for general two-player quantum games, extending a foundational principle from classical complexity theory.</li><li>Closest vector problem. Polynomial-factor hardness of approximation for the closest vector problem, a foundational lattice question related to post-quantum cryptography.</li><li>Ehrhart’s volume conjecture. Determining, in every dimension, the maximum possible volume of a convex body whose centroid is its only interior lattice point.</li><li>Multicolor Ramsey numbers. A superexponential lower bound for multicolor triangle Ramsey numbers, resolving Erdős problem 183.</li><li>Extremal number conjectures. Results on the compactness and degeneracy conjectures in extremal graph theory, resolving Erdős problems 146 and 180.</li></ol><h2>Responsibility to the mathematical community</h2><p>The emergence of systems capable of contributing to mathematical research raises questions that cannot be answered by a technology company alone. There are many views as to the role of AI in mathematics, and we have deep respect and understanding for those concerned with its impact, including the signers of the <a href=\"https://leidendeclaration.ai/\" target=\"_blank\" rel=\"noopener\">Leiden declaration on AI and Mathematics⁠(opens in a new window)</a>. We believe attribution should honestly reflect how a result was produced: claiming human authorship for a proof generated entirely by an AI system would misrepresent both the system’s contribution and the nature of genuine human intellectual work. We helped prepare the manuscripts and formalize the proofs in Lean, and we take responsibility for their correctness, while the mathematical arguments themselves were generated by our system. We hope the mathematical community will engage deeply with these results, place them in context, and bring the ideas behind them to life through new research and discovery.</p><p>As AI systems evolve into more sophisticated research collaborators, ensuring widespread access is fundamental to supporting scientists and mathematicians as they navigate and define the future of their disciplines during this transformative era.</p><ul><li><a href=\"https://openai.com/research/index/?tags=2026\" target=\"_blank\" rel=\"noopener\">2026</a></li></ul><h2>Footnote</h2><ol><li>1<p>Subsequent research includes Bloom, Sawin, Schildkraut, and Zhelezov, “<a href=\"https://arxiv.org/abs/2605.28781\" target=\"_blank\" rel=\"noopener\">The sum-product conjecture is false for real numbers⁠(opens in a new window)</a>”; Pohoata, “<a href=\"https://arxiv.org/abs/2606.13619v2\" target=\"_blank\" rel=\"noopener\">Split primes and the Elekes-Rónyai problem⁠(opens in a new window)</a>”; Saha, Xu, and Ye, “<a href=\"https://arxiv.org/abs/2606.25887\" target=\"_blank\" rel=\"noopener\">Furthest Pair Requires Quadratic Time in Superconstant Dimension under SETH⁠(opens in a new window)</a>”; Goh and Hatami, “<a href=\"https://arxiv.org/abs/2606.25192\" target=\"_blank\" rel=\"noopener\">Communication complexity of point-line incidences over the reals⁠(opens in a new window)</a>”; and Lee, Pohoata, and Zhu, “<a href=\"https://arxiv.org/abs/2607.05374\" target=\"_blank\" rel=\"noopener\">The Minkowski grid has robustly many repeated distances⁠(opens in a new window)</a>.”</p></li></ol>"},{"title":"Halo: Campaign Evolved post-credits scene sets up a twist for Xbox","source":"Polygon","author":"@xcomFordJamesGames","url":"https://www.polygon.com/halo-campaign-evolved-ending-explained-post-credits/","category":"gaming","categoryLabel":"Gaming","wordCount":610,"readingTime":4,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/ford-james/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Aug 1, 2026, 11:00 AM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>See you in the sequel</p>\n    <h2>Halo: Campaign Evolved's post-credits scene has wild implications for the series</h2>\n    \n        \n    \n                                         <p>Did you know there is a secret <a href=\"https://www.polygon.com/halo-campaign-evolved-2026/\" target=\"_blank\" rel=\"noopener\"><em>Halo: Campaign Evolved</em></a><em> </em>ending? Well, it's more of a post-credits type of scene than an actual secret ending, but it implies that a <a href=\"https://www.polygon.com/halo-campaign-evolved-legendary-ending-sequel-remake/\" target=\"_blank\" rel=\"noopener\">certain someone is still alive</a>, and it's done in a hilarious fashion. The non-secret ending also poses some questions, especially for anyone playing Halo for the first time.</p>    \n<h2>\n                        Halo Campaign Evolved main ending explained\n               </h2>\n<p><em>Credit to LunarGaming for uploading the entire legendary ending, alongside the ending for the three bonus missions, to YouTube.</em></p>    <p>Let's talk about the normal <em>Halo: Campaign Evolved </em>ending first, achieved by beating the campaign (just the original 10 missions, not the three bonus missions) on any difficulty. After escaping the imminent explosion of the Pillar of Autumn, Master Chief and Cortana flee in a longsword fighter jet. Behind them, the Autumn detonates, destroying the Halo itself.</p>    \n    \n                                                                                            \n        \n<p>Master Chief asks Cortana if anybody else made it out alive, which she denies, claiming that they're all that's left… which is something that the secret ending implies to be incorrect. Cortana then revels in their achievement — obliterating the Flood and a Covenant armada — before justifying the collateral damage to UNSC marines by claiming they had no choice.</p>    <p>\"Halo. It's finished,\" she says. \"No. I think we're just getting started,\" Master Chief replies. This is the same dialogue as the original game, re-recorded for <em>Campaign Evolved</em>. Back then, it implied there'd be a sequel, which of course there was: <a href=\"https://www.polygon.com/game/halo-2/3885/\" target=\"_blank\" rel=\"noopener\"><em>Halo 2</em></a><em> </em>was released three years</p>    <p>later, in November 2004. The inclusion of it in the remake would imply <em>Halo 2: Campaign Evolved </em>is also in the works.</p>    \n<h2>\n                        Halo Campaign Evolved secret ending explained\n               </h2>\n    \n                                                                                            \n        \n<p>In the original game, the secret ending for beating the whole campaign on legendary featured Sgt. Johnson in a tussle with a Covenant elite, before the pair witnessed the explosion of the Autumn. For their final moments, the two embrace each other in a hug instead, as the blaze envelops them. This ending isn't canon, however, as Sgt. Johnson did return in <em>Halo 2</em>.</p>    <p>However, if you beat the entirety of <em>Campaign Evolved </em>on legendary difficulty, you'll see a secret scene that starts with Sgt. Johnson lounging on a beach, rewatching footage of that original ending on a tablet. In the distance, he sees the Autumn explode, and takes that as his cue to get up and board a pelican. Before departing, he points at the camera and delivers one final line: \"See you in the sequel.\"</p>    \n    \n                                                                                            \n        \n<p>Okay, so <em>Halo 2: Campaign Evolved </em>seems to be a lock (as long as it doesn't get <a href=\"https://www.polygon.com/halo-multiplayer-game-project-ekur-cancelled-report/\" target=\"_blank\" rel=\"noopener\">cancelled like another recent Halo project</a>), and as expected, Sgt. Johnson will be back. However, there's one final scene in both endings of the game: we see 343 Guilty Spark flying through space, confirming that it survived. Presumably, it's heading to its eventual meeting with the Arbiter, which kicks off the events of <em>Halo 2</em>.</p>    \n<p>So while there hasn't been an official announcement, an Unreal Engine 5 version of <em>Halo 2: Campaign Evolved </em>is highly likely to be in the works, and if that's the case, it’d be a surprise if <em>Halo 3 </em>wasn't also planned to finish off the original trilogy. If you can't wait for more Halo, you can play through the remastered versions of the originals in <a href=\"https://www.polygon.com/game/halo-the-master-chief-collection/37217/\" target=\"_blank\" rel=\"noopener\"><em>Halo: Master Chief Collection</em></a>, or hang on for the remade sequel, because chances are, it won't be too far away. Here’s hoping it has multiplayer this time.</p>"},{"title":"Bari Weiss Is On It","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/bari-weiss-is-on-it","category":"fun","categoryLabel":"Interesting Reads","wordCount":623,"readingTime":4,"content":"<blockquote><p>For a sense of Bari Weiss’s approach to leading CBS News in her first weeks on the job, consider a phrase the new editor in chief has used as a rallying cry in meetings with colleagues: “I wanna blow this up.”</p></blockquote><blockquote><p>New things are always better than old things.</p></blockquote><p><strong>The Hoover Dam</strong></p><p>The Hoover Dam was the tallest dam in the world when it was completed, but that was in 1936. What has it done for us lately, except impound Lake Mead and provide power for public and private utilities in Nevada, Arizona, and California? We’ve asked Bari Weiss to get under the hood, and we’re pretty excited about whatever she comes up with after she blows it up. Our first goal, as with “60 Minutes,” is balance. Lake Mead has been on the north side of the Hoover Dam for too long. When we’re finished, it will be on the south side, too.</p><p><strong>The Jungle Cruise</strong></p><p>Who doesn’t love the Jungle Cruise? It’s like “<a href=\"https://www.amazon.com/dp/1936594145\" target=\"_blank\" rel=\"noopener\">Heart of Darkness</a>” with dad jokes. Not too fast for Meemaw, not too scary for children under seven, when accompanied by an adult. It has elephants, hippos, lions, tigers—and you don’t even have to feel bad about it, like at the zoo, because they’re robots. Best ride at Disneyland, period. But we asked ourselves: What if <em>not</em> that? So we’re turning off the animals and the water, and replacing the puns with jokes about how the powerful do whatever they want.</p><p><strong>The Toyota Corolla</strong></p><p>The Corolla is the global standard for reliability and affordability and the best-selling car in the world—a masterpiece of redundant strengths in materials and design, like a jean jacket with flat-folding rear seats. It can’t be stopped, only passed along to someone else, like a nebulous disease metaphor in an edgy horror movie. Why did we ask Bari Weiss to wreck it? Because it was there. And we heard her say “meritocracy” on a podcast.</p><p><strong>Dawn Dishwashing Liquid</strong></p><p>Best soap in the world—cleans dishes and windows, pretreats laundry, and unclogs toilets. It can wash your hair, your dog, and the driveway. A few drops stop your sunglasses from fogging up. It keeps ants off countertops and aphids off plants, and breaks down the rash-causing resin in poison ivy. It can wash a duck, or a pan after you’ve roasted a duck. Anyway, from now on, it’s tap water. Or crocodile tears and Sanka. Maybe it’s Mountain Dew Baja Blast. Who knows?</p><p><strong>Keds</strong></p><p>Once she gets done with CNN, we’re putting Bari Weiss in charge of Keds. Don’t get us wrong—we love Keds. It’s not so much a question of “How can we make this better?” as it is “How can we make this immeasurably worse?”</p><p><strong>Popcorn</strong></p><p>The smell of popcorn will be replaced with the smell of burnt popcorn.</p><p><strong>“Casablanca”</strong></p><p>You know the scene where the Nazis are singing and the French people drown them out by singing “La Marseillaise”? We’re tweaking that. The Nazis still sing “Die Wacht am Rhein,” but the French sing the Kars4Kids jingle.</p><p><strong>Alcoholics Anonymous</strong></p><p>We don’t even know how we ended up owning A.A., but we do. We’re guessing it was a tax thing? Anyway, we told everyone in management over there to shoot us an e-mail justifying their jobs and no one wrote back. Turns out, they don’t even have a leader. So we asked ourselves: If this thing works miracles as a fellowship of equals supporting one another on a path to sobriety, imagine what it could do with highly centralized top-down leadership, somewhere between a death cult and A.I.G. So we got them a C.E.O. He’s a guy Bari Weiss knows from around. You’ll like him. He’s nice. Except when he drinks. ♦</p>"}];

}

function skipArticle() {

  render();
}

function esc(s) {
