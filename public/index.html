*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {

}

h1 {

  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;

.feed-warning {

  font-size: 0.8125rem;

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

  gap: 0.5rem;
}

  font-size: 0.8125rem;

  background: var(--swap-bg);

  padding: 0.45em 0.9em;

.swap-btn:hover {

.swap-btn:disabled {

}

.swap-counter {

  color: var(--text-faint);

}

.article-body p {

.article-body h2, .article-body h3, .article-body h4 {

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }

  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {

  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;

.footer a {

<script>
var articles = [{"title":"US battery startups have found a lifeline in defense","source":"TechCrunch","author":"Tim De Chant","url":"https://techcrunch.com/2026/08/22/us-battery-startups-have-found-a-lifeline-in-defense/","category":"tech","categoryLabel":"Technology","wordCount":667,"readingTime":4,"content":"<p>U.S. battery startups hit a rough patch when the One Big Beautiful Bill <a href=\"https://techcrunch.com/2025/05/13/house-gop-wants-to-cut-parts-of-the-inflation-reduction-act-while-sparing-others/\" target=\"_blank\" rel=\"noopener\">eliminated battery and EV incentives</a>, undercutting a chunk of future demand. But recently, they’ve found a lifeline in the defense world, helping to power everything from drones and torpedoes to infantry radios and fighter jets.</p>\n<p>The Trump administration, despite its open disdain for EVs, acknowledges that batteries are an inescapable part of modern life. And like many things in Washington these days, it’s leaning on national security as justification for its recent decisions.</p>\n<p>The latest comes from the Department of Energy, which announced Thursday that it is awarding $500 million in grants to bolster the battery supply chain in the United States. The program <a href=\"https://www.energy.gov/articles/energy-department-announces-500-million-secure-americas-critical-mineral-and-battery\" target=\"_blank\" rel=\"noopener\">aims</a> to “reduce reliance on foreign sources, bolster national security, and advance American energy dominance.” Much of the money went to startups.</p>\n<p>Defense applications of lithium-ion batteries are “absolutely playing out in discussions,” a spokesperson for <a href=\"https://www.coreshell.com/\" target=\"_blank\" rel=\"noopener\">Coreshell</a>, a battery materials startup, told TechCrunch. The company recently brought on ADS Ventures as an investor; the strategic VC’s parent company, ADS, is a defense supplier, and it’s working with another supplier of autonomous systems. Coreshell received a $50 million award from the DOE to expand manufacturing for its <a href=\"https://techcrunch.com/2024/03/14/coreshell-metallurgical-silicon/\" target=\"_blank\" rel=\"noopener\">metallurgical silicon anode material</a>.</p>\n<p>Other startups received significant grants, too.</p>\n<p><a href=\"https://lilacsolutions.com/\" target=\"_blank\" rel=\"noopener\">Lilac Solutions</a>, which extracts lithium from brines, landed $100 million to build a processing facility on Utah’s Great Salt Lake to produce 5,000 metric tons of lithium carbonate annually by 2028. Lithium carbonate is a key precursor used in battery production.</p>\n<p><a href=\"https://nthcycle.com/\" target=\"_blank\" rel=\"noopener\">Nth Cycle</a> told TechCrunch that it received $100 million to build a facility that will refine black mass from recycled lithium-ion batteries, producing lithium and nickel compounds that can be used to make new batteries.  </p>\n<p>“We’re seeing clear demand drivers from the defense sector.” Megan O’Connor, co-founder and CEO of Nth Cycle, told TechCrunch. “But there’s still that in the automotive space as well.”</p>\n<p>That dynamic is unlikely to change. Though EVs have been dealt a setback, automakers are still rolling out new models and expecting years of growth, albeit further out than expected. </p>\n<p>Defense will continue to be a significant player. Exact numbers are unsurprisingly hard to come by, but <a href=\"https://www.energy.gov/sites/default/files/2021-06/FCAB%20National%20Blueprint%20Lithium%20Batteries%200621_0.pdf\" target=\"_blank\" rel=\"noopener\">even in 2021</a>, the U.S. Defense Logistics Agency was buying $200 million worth of batteries annually. But that’s dwarfed by the automotive industry. This year, the automotive industry is expected to spend nearly $18 billion on battery manufacturing in the U.S. alone, <a href=\"https://www.mordorintelligence.com/industry-reports/united-states-electric-vehicle-battery-manufacturing-market\" target=\"_blank\" rel=\"noopener\">according</a> to Mordor Intelligence.</p>\n<p>As battery companies undoubtedly know — and the Trump administration appears to <a href=\"https://techcrunch.com/2026/02/05/trumps-critical-mineral-reserve-is-an-admission-that-the-future-is-electric/\" target=\"_blank\" rel=\"noopener\">tacitly acknowledge</a> — the future is electric, but the timing is anything but settled. </p>\n<p>In the meantime, soldiers and drones still need lightweight and capable batteries from U.S. sources. A few years ago, those batteries could have come from domestic factories that sprung up in the wake of the Inflation Reduction Act. But after the One Big Beautiful Bill gutted battery battery production incentives, the Pentagon may have had to start looking for alternatives. These new DOE grants might amount to an admission that efforts to kill the American EV industry went a bit too far.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Tim De Chant is a senior climate reporter at TechCrunch. He has written for a wide range of publications, including Wired magazine, the Chicago Tribune, Ars Technica, The Wire China, and NOVA Next, where he was founding editor. </p>\r\n<p>De Chant is also a lecturer in MIT’s Graduate Program in Science Writing, and he was awarded a Knight Science Journalism Fellowship at MIT in 2018, during which time he studied climate technologies and explored new business models for journalism. He received his PhD in environmental science, policy, and management from the University of California, Berkeley, and his BA degree in environmental studies, English, and biology from St. Olaf College.</p>\r\n<p>You can contact or verify outreach from Tim by emailing <a href=\"mailto:tim.dechant@techcrunch.com\" target=\"_blank\" rel=\"noopener\">tim.dechant@techcrunch.com</a>.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/tim-de-chant/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Drake’s “Janice STFU” on Every Corner","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/songs-of-summer/drakes-janice-stfu-on-every-corner","category":"fun","categoryLabel":"Interesting Reads","wordCount":1195,"readingTime":6,"content":"<p>A couple of months ago, on Juneteenth, back when summer was still in its early phase of surging innocence—flowers opening, grass blades freshly sprung from the dirt—I was sitting on a wide lawn at Governors Island, having a picnic with some friends. Swell day: Our blankets were littered with snacks and wine bottles. In accordance with the folkways of my rough generational cohort, someone had brought chocolates studded with small doses of hallucinogenic mushrooms. The skyline floated like an uncanny but beautiful projection off to our side. There was a Bluetooth speaker on the ground connected invisibly to somebody’s phone, and, around halfway through the hang, the speaker started playing song after song by Drake.</p><p>It doesn’t take much, especially under conditions like these, to get me swaying. The tune that did it this time was the newish song “Janice STFU,” off Drake’s recent album “Iceman.” The songs on the album—<a href=\"https://www.newyorker.com/culture/pop-music/drake-would-like-to-settle-the-score\" target=\"_blank\" rel=\"noopener\">released simultaneously</a> with two others, “Habibti” and “Maid of Honour,” a nod to the streaming-spurred contemporary practice of dropping an unmanageable barrage of new music into the feeds of unsuspecting consumers—are viciously petty exercises in score-settling and braggadocio. “Iceman” is mean and infectious, downbeat and relentless, and, in keeping with its comically unsubtle title, cold.</p><p>Here go some representative lines from “Janice”:</p><blockquote><p>Ayy, buried alive, somеone come dig me up</p><p>If I call up your shawty right now, shе pickin’ up, yeah</p><p>You boys got big off my name, that’s big enough</p><p>We know how you O.G.s rockin’ already, my nigga, the jig is up</p><p>They say the truth will set you free, well, mine is gon’ stream while you watch in HD</p><p>They say that karma could take an eternity, yours is droppin’ the same night as me</p></blockquote><p>What’s the score here? One giddy declaration of personal resurgence; one deviant sexual threat delivered as a total non sequitur; a sudden pang of jealousy (“you boys got big”) dressed up as a claim of precedent arrival (“off my name”); three lines of dismissive, hate-spiked insults, just to drive the point—in case you missed it: <em>I’m better than you</em>—home with the finality of a tent’s stake through soft summer soil.</p><p>On one level, this is simply more of the same from Drake. In summer as well as in winter, beneath a beach umbrella just as much as under the cold carapace of a Toronto sky in December, rap’s pretty boy little brother is sort of always talking about the many grievances he’s picked up along the way. “I got enemies, got a lot of enemies,” he proclaims almost triumphantly in the hook of the 2015 song “Energy,” as if the accumulation of adversaries were a badge inevitably accompanying great success. Elsewhere in the song, he issues a complaint that always makes me laugh: “I got girls in real life tryna fuck up my day.” There’s also this, which sounds somewhat avoidable: “I got two mortgages, thirty million in total.” Nobody’s ever put so much rhythmic and rhyming effort into revealing, wittingly or not, that he needs to think about downsizing and searching out some more levelheaded new friends.</p><p>Still, Drake is known as a master of the summer banger, whose lyrics, across the years, have surely launched millions of vaguely hostile or sexy—but always, in either case, vague—Instagram captions, because he’s got some versatility and an ear for popular desires. Take “One Dance,” an almost undistractedly romantic ditty from 2016, or the yearning, dirty-macking R. &amp; B. of “Marvins Room” (2011). He can—it’s easy to forget, given the recent travail of the <a href=\"https://www.newyorker.com/culture/on-television/kendrick-lamars-freedom-summer\" target=\"_blank\" rel=\"noopener\"><em>protracted, often mutually ruinous battle</em></a> he lost to Kendrick Lamar two years ago—get sweet and sour, cool and warm, grateful for his blessings, or obsessed with the hordes of underminers pretending to wish him well.</p><p>Alas, poor Drake! Losing to Lamar knocked him down a few rungs in the hip-hop firmament over which he’d so gaudily and spitefully lorded for more than a decade. The great occasion for and theme of “Iceman” is his hoped-for resurrection, his return from being “buried alive.” He’s not in a summery mood. “Janice STFU” takes the melody of its chorus—put through some syrupy, saddening machine—from the upbeat and charmingly repetitive song “I Follow Rivers,” by Lykke Li. In the chorus—“Reach me, baby / Call my phone and say you need me, baby / I’m so green, you gotta teach me, baby / From Vancouver, you a BC baby”—Drake’s voice carries a slightly Auto-Tuned edge, and the verses seem to refer to any number of opponents, imaginary or real, inside the “industry” and without, people who are less authentic or, to be more specific, more successfully inauthentic than Drake.</p><p>All summer I’ve heard this song everywhere, spreading with nocturnal menace from the windows of cars as they speed through my block, or from the middle of a circle of friends around the corner or in the park. It offers a vision of the season that gets less press than the primary-color nostalgia—sand and waves, endless trips on winding roads—that often dominates our talking and thinking about the summer. Don’t forget: it’s also a time of relentless comparison and dashed expectations, of regrets that linger hotly until the great puddle of August threatens to drown you pore by pore. Think of the protagonist of Éric Rohmer’s 1986 film “The Green Ray,” a young woman named Delphine, who’s recently broken up with her boyfriend and can’t seem to find a summer activity fit to get him—or, really, her loneliness, which quickly crowds out the silhouette of the man—off her mind. One friend, freshly coupled, leaves her in the lurch. Another circle of acquaintances makes her feel like the odd woman out. She goes to the Alps, then Biarritz, on and on, looking for signs in the faces of strangers and in the sky. The whole picture is a stylish sulk, and so is the summer itself if you’re not getting what you want.</p><p>Be honest! Think of that kid from high school with parents richer than yours, who, all these years later, persists in his prosperity, showing his suspiciously even teeth on the prow of some boat in the middle of the neon Mediterranean—you look at this kid’s IG and wonder, sweating in your apartment, Why not me? We talk often about the too-swift death of summer, how it echoes and seems to quicken our own mortality, amplifying our fears of the grave, and fair enough, but sometimes the best thing a summer can do, depending on your mood, is end.</p><p>Drake’s livid vision of the season, his cathartic admission, might go something like this: I did everything right, let everybody party in my pricey house, made hits that got kids laid, worked my way out of the corny scene of children’s TV and into the center of the coolest genre known to man, and all for what? I look online and everybody looks happier than I am. They’re on trips with their families and I’m in this palace alone. Nobody gives me the credit I’m due. Everybody’s trying to forget me, after all I’ve done.</p><p>To which all you can say is—sorry. Maybe next summer’ll be better. ♦</p>"},{"title":"Cyberleek's still at it: Another GTA 6 leak shows 2 full minutes of high speed driving, surprisingly few crashes","source":"PC Gamer","author":"Lincoln Carpenter","url":"https://www.pcgamer.com/games/grand-theft-auto/cyberleeks-still-at-it-another-gta-6-leak-shows-2-full-minutes-of-high-speed-driving-surprisingly-few-crashes/","category":"gaming","categoryLabel":"Gaming","wordCount":650,"readingTime":4,"content":"<p>Another day has dawned, and the mutual embarrassment of the games industry and gameplaying public continues: The <a href=\"https://www.pcgamer.com/games/grand-theft-auto/who-is-cyberleek-what-we-know-about-the-gta-6-leaker/\" target=\"_blank\" rel=\"noopener\">enigmatic Cyberleek</a> has uploaded yet another short video of leaked GTA 6 gameplay, marking the fourth consecutive day of <a href=\"https://www.pcgamer.com/games/grand-theft-auto/the-latest-gta-6-leak-confirms-the-leaker-likely-has-or-had-access-to-a-playable-build/\" target=\"_blank\" rel=\"noopener\">GTA 6 leak releases</a>. And based on their latest threat, the cryptopeddling leaker intends to keep that streak going.</p><p>As for what the latest gameplay leak reveals: Well, it looks like Grand Theft Auto. Titled \"hypercar.mp4,\" the video—which we won't be sharing, but can be sought out without much effort—consists of GTA 6 protagonist Jason jacking a high performance sports car and driving at high speeds along Vice City's surrounding highways for roughly two minutes.</p><p>The footage is fairly thin on new mechanical revelations: While carjacking, it seems like Jason has the ability to mash a button to more quickly and forcefully pull the driver from the vehicle in exchange for stamina—and, presumably, a higher chance of the crime being noticed. We also see further evidence of the <a href=\"https://www.pcgamer.com/games/grand-theft-auto/gta-6-video-leak-analysis-august-2026/\" target=\"_blank\" rel=\"noopener\">visual ID mechanics</a> present in earlier leaks, as icons appeared to indicate both the stolen vehicle and Jason's appearance were tied to his wanted level once the crime was reported.</p><p>Additionally, after escaping the wanted level he accrued with the car theft, we see a reappearance of a blue police awareness indicator as Jason passes a patrol car while speeding through traffic on the opposite side of the highway, reinforcing the sense that the player will more easily draw police attention based on how conspicuous their actions are.</p><p>Shortly afterwards, Jason drives through an area that's outlined with a red border on the minimap, immediately gaining a two-star wanted level. It's not clear why, and the wanted level drops as soon as he drives back out of it. We can only speculate, but it's possible the highway passed over some sort of high security area.</p><p>Otherwise, the footage isn't particularly remarkable. The driving physics seem like they'd be familiar to anyone who's spent time driving in <a href=\"https://www.pcgamer.com/grand-theft-auto-5/\" target=\"_blank\" rel=\"noopener\">GTA 5</a>, though it's still not clear how recent of a game build these leaks are being captured from. The most striking thing on display is its demonstration of GTA 6's lighting tech: Throughout the video, the light cast by the hypercar's headlights reflects believably off puddles, roadsigns, and reflective markers, providing impressive contrast and visual texture as the landscape blurs by.</p><p>And, as we've come to expect, the video is also a vehicle for Cyberleek's <a href=\"https://www.pcgamer.com/tag/cryptocurrency/\" target=\"_blank\" rel=\"noopener\">cryptocurrency</a> push, urging viewers to \"show support\" by buying their bespoke gamer currency. It remains unclear how, exactly, we're meant to believe that buying cryptocurrency empowers the fight for gamers' rights, but you can put whatever text on the internet you want, I suppose.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>What <em>is </em>clear is that Cyberleek doesn't intend to stop: The trademark globs of roaming watermark text, URLs, and QR code that have graced each of these leaked videos now features the threat \"HIGHER MARKETCAP = MORE LEEKS.\" While that's in line with the <a href=\"https://www.pcgamer.com/games/grand-theft-auto/grand-theft-auto-6-leaker-says-they-wont-stop-until-rockstar-and-take-two-apologize-for-anti-consumerism-and-make-a-concrete-commitment-to-do-better/\" target=\"_blank\" rel=\"noopener\">thin anti-corporate veneer</a> that's accompanied Cyberleek's previous works, it's worth noting that Take-Two has actually <a href=\"https://www.pcgamer.com/gaming-industry/take-two-lost-usd2-8-billion-in-market-cap-after-gta-6-leaks-but-whats-more-shocking-to-me-is-it-probably-barely-felt-it/\" target=\"_blank\" rel=\"noopener\">lost roughly $2.8 billion in market cap</a> this week as its share price has fallen over the last few days. Whatever gets more people looking at your coolguy onion mascot, I guess.</p>\n\n<p>Lincoln has been writing about games for 12 years—unless you include the essays about procedural storytelling in Dwarf Fortress he convinced his college professors to accept. Leveraging the brainworms from a youth spent in World of Warcraft to write for sites like Waypoint, Polygon, and Fanbyte, Lincoln spent three years freelancing for PC Gamer before joining on as a full-time News Writer in 2024, bringing an expertise in Caves of Qud bird diplomacy, getting sons killed in Crusader Kings, and hitting dinosaurs with hammers in Monster Hunter.</p>"},{"title":"Minnesota's \"Nudification\" Ban Repeats Unconstitutional Errors of Early Revenge Porn Bills","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/08/18/minnesotas-nudification-ban-repeats-unconstitutional-errors-of-early-revenge-porn-bills/","category":"law","categoryLabel":"Law","wordCount":932,"readingTime":5,"content":"<h2><a href=\"https://reason.com/volokh/2026/08/18/minnesotas-nudification-ban-repeats-unconstitutional-errors-of-early-revenge-porn-bills/\" target=\"_blank\" rel=\"noopener\">Minnesota's \"Nudification\" Ban Repeats Unconstitutional Errors of Early Revenge Porn Bills</a>\n\t\t\t\t\t<p>The lack of a scienter requirement renders the content-based ban unconstitutional.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.18.2026 11:40 PM\n</p>\n\t</h2>\n\t\n\t\t<p>More than a decade ago, states began enacting laws to prohibit so-called \"revenge porn.\" Some partners would voluntarily exchange sexual photographs, but after the relationship ended, one of the partners would share the intimate images as a form of revenge. Later, the term \"non-consensual pornography\" became more common, as the pictures were not always shared by former partners.</p>\n<p>Many of the <a href=\"https://joshblackman.com/blog/2013/11/25/federal-revenge-porn-legislation-in-the-works/\" target=\"_blank\" rel=\"noopener\">early bills imposed</a> what was effectively a strict liability standard without any scienter requirement. Over time, these bills were modified to include a scienter requirement, and these guardrails were essential to survive strict scrutiny.</p>\n<p>While I doubted the constitutionality of early revenge porn bills, I came to the conclusion that the scienter requirement, as well as other guard rails, saved the laws. For example, the Minnesota Supreme Court upheld the state's revenge porn law in light of this narrow tailoring. That court observed in <a href=\"https://law.justia.com/cases/minnesota/supreme-court/2020/a19-0576.html\" target=\"_blank\" rel=\"noopener\">State v. Casillas</a> (2020):</p>\n<blockquote><p>Second, a defendant must \"intentionally\" disseminate the image. Minn. Stat. § 617.261, subd. 1. This mens rea requirement means that a defendant must knowingly and voluntarily disseminate a private sexual image; negligent, accidental, or even reckless distributions are not proscribed. This specific intent requirement further narrows the statute and keeps it from \"target[ing] broad categories of speech.\" Muccio, 890 N.W.2d at 928.</p></blockquote>\n<p>This background helps explain why a new Minnesota law is unconstitutional. This statute is commonly called an AI \"Nudification\" Ban, but it sweeps far more broadly. It <a href=\"https://www.revisor.mn.gov/bills/94/2025/0/HF/1606/versions/2/\" target=\"_blank\" rel=\"noopener\">provides</a> in part:</p>\n<blockquote><p>Subd. 2. Nudification prohibited.</p>\n<p>(a) A person who owns or controls a website, application, software, program, or other service must not:</p>\n<p>(1) allow a user to access, download, or use the website, application, software, program, or other service to nudify an image or video; or</p>\n<p>(2) nudify an image or video on behalf of a user.</p></blockquote>\n<p>The statute defines \"nudify,\" in part, as \"an image or video is altered or generated to depict an intimate part not depicted in an original unaltered image or video of an identifiable individual.\" The only exemption is when the web site \"requires the technical skill of a user to nudify an image or video.\" The statute lacks any scienter requirement. The statute also lacks any exemption for images that have artistic, political, medical, or other educational value.</p>\n<p>xAI, the maker of Grok, <a href=\"https://reason.com/wp-content/uploads/2026/08/2026-07-27-Complaint.pdf\" target=\"_blank\" rel=\"noopener\">challenged</a> the <a href=\"https://reason.com/wp-content/uploads/2026/08/2026-07-29-TRO.pdf\" target=\"_blank\" rel=\"noopener\">constitutionality</a> of the ban. The district court <a href=\"https://reason.com/wp-content/uploads/2026/08/2026-07-31-Order.pdf\" target=\"_blank\" rel=\"noopener\">denied</a> the TRO and set the case for a preliminary injunction proceeding. That briefing has now completed.</p>\n<p>xAI <a href=\"https://reason.com/wp-content/uploads/2026/08/2026-07-29-TRO.pdf\" target=\"_blank\" rel=\"noopener\">argues</a> (correctly in my view) that the statute's lack of a scienter requirement renders the law unconstitutional:</p>\n<blockquote><p>The Act then compounds the problem by omitting every limit that might have confined it to addressing the harm the Legislature described. It has no scienter requirement, so liability turns on what a user managed to do rather than on anything the provider knew or could have prevented. It never mentions consent, so a woman who edits a photograph of herself is treated exactly like a stranger who edits her picture.</p></blockquote>\n<p>Minnesota doesn't really engage that argument, but instead <a href=\"https://reason.com/wp-content/uploads/2026/08/2026-08-14-Minn.pdf\" target=\"_blank\" rel=\"noopener\">contends</a> that under intermediate scrutiny, there is no scienter requirement. I don't think this argument works. This statute is content-based, as it triggers liability directly based on the content of the generated image. (This is an argument I have advanced for some time in the 3D-printed gun litigation.) An image generated with people fully-clothed would not be subject to liability. But a picture of a shirtless man wearing speedos could generate liability. The absence of a scienter requirement, in this case, means the statute lacks the requisite narrow tailing. xAI's brief cites the Minnesota Supreme Court case mentioned above.</p>\n<p>xAI recognizes how this tool can be abused, and the brief demonstrates numerous safeguards that Grock has put in place. The PI brief begins:</p>\n<blockquote><p>A state that seeks to guard its citizens against real harms nevertheless must also respect those same citizens' fundamental rights in the effort. In enacting HF 1606, the trouble is not that Minnesota sought to advance a legitimate interest in prohibiting the dissemination of artificially generated nude images of real people without their consent. xAI does not contest that interest, and it strictly prohibits its users from generating nude or sexualized images of people without their consent. Indeed, xAI has filed suit against users who evade its extensive technological blockers to generate such images in violation of this strict prohibition. The problem is that HF 1606 stretches far beyond the Legislature's claimed target to hit other, equally important rights protected by the Constitution.</p></blockquote>\n<p>The problem of overbreadth is something Minnesota should be familiar with. More than three decades ago, in <em>R.A.V. v. City of St. Paul</em>, the Supreme Court declared another well-intentioned law from the Land of 10,000 Lakes as a violation of the First Amendment. Justice Scalia observed:</p>\n<blockquote><p>Let there be no mistake about our belief that burning a cross in someone's front yard is reprehensible. But St. Paul has sufficient means at its disposal to prevent such behavior without adding the First Amendment to the fire.</p></blockquote>\n<p>Much the same can be said about the nudification law. The intentional use of AI for generating nude images of people is reprehensible. but Minnesota has the means to craft a carefully tailored statute to achieve this goal. In the First Amendment context, the court reviews the statute as drafted, and not the statute the lawyers present.</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/18/voter-ignorance-and-confusion-caused-by-candidates-with-similar-names/\" target=\"_blank\" rel=\"noopener\">NEXT: Voter Ignorance and the Problem of Confusion Caused by Candidates With Similar Names [Updated]</a>\n    </p>"}];

    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
