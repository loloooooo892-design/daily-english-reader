*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  flex-wrap: wrap;

  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {

  font-size: 0.6875rem;
  font-weight: 600;

  margin-right: 0.5em;
}

}

.article-body li {

<script>
var articles = [{"title":"BioWare's co-founder reckons a new Mass Effect would cost well over $200m","source":"Eurogamer","author":"Vikki Blake","url":"https://www.eurogamer.net/mass-effect-5-save-cost-200m-bioware-co-founder-trent-oster","category":"gaming","categoryLabel":"Gaming","wordCount":605,"readingTime":4,"content":"<p>Mass expense.</p>\n    \n  \n  \n  \n  \n            <p>Anyone hoping to buy <a href=\"https://www.eurogamer.net/games/mass-effect\" target=\"_blank\" rel=\"noopener\">Mass Effect</a> from EA and finish what BioWare started needs to get saving now, as it could cost over $200 million (£150m).</p>\n<p>That's according to BioWare co-founder Trent Oster, who reckons that's what a new Mass Effect game would need to meet fans' expectations.</p>\n<p>\"The scary component of Mass Effect is the audience is going to want the best of 'AAA' development,\" Oster said on Twitter/X, as spotted by <a href=\"https://www.gamesradar.com/games/mass-effect/saving-mass-effect-5-would-cost-over-usd200-million-bioware-co-founder-says-because-fans-will-want-the-best-of-aaa-development/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a>.</p> \n<blockquote><p>The scary component of Mass Effect is the audience is going to want the best of “AAA” development. Rough ballpark (based on contemporaries) is $200M+. That is a big number to commit up front. There has to be a bigger plan in place for the IP to make the math work.</p>— Trent Oster (@TrentOster) <a href=\"https://x.com/TrentOster/status/2118400366589161912?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">November 5, 2026</a></blockquote>\n\n<p>\"Rough ballpark (based on contemporaries) is $200M+. That is a big number to commit up front. There has to be a bigger plan in place for the IP to make the math work.\"</p>\n<p>He did add that it could be done for less, though. \"That said, I think it can be done well for less than that amount with a disciplined approach and an experienced team,\" Oster said.</p>\n<p>\"I think a game could be done cheaper, if you kept it simple and hit the big beats,\" he added in a separate tweet. \"It wouldn’t be what the team described in the Universe concept. The big push would be getting the IP free. The fans deserve more than one game.\"</p>\n<blockquote><p>I think a game could be done cheaper, if you kept it simple and hit the big beats. It wouldn’t be what the team described in the Universe concept. The big push would be getting the IP free. The fans deserve more than one game.</p>— Trent Oster (@TrentOster) <a href=\"https://x.com/TrentOster/status/2118501504315494718?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">November 6, 2026</a></blockquote>\n\n<p>Oster's comments come as the #SaveMassEffect campaign continues to grow<a href=\"https://www.eurogamer.net/bioware-closing-down-mass-effect-5-cancelled\" target=\"_blank\" rel=\"noopener\"> following EA's decision to close BioWare</a> and cancel <a href=\"https://www.eurogamer.net/games/mass-effect-5\" target=\"_blank\" rel=\"noopener\">Mass Effect 5</a>. Fans want EA to keep making Mass Effect games, or hand the series over to a studio that will.</p>\n<p>Oster has backed the campaign too. \"I love seeing all the energy around #SaveMassEffect,\" he wrote on 4th November. \"I think there is a still a great thesis for a well-funded RPG developer who can deliver. Makes me want to get some of the original band back together.\"</p>\n<p>EA has not confirmed whether or not it would consider selling the IP.</p>\n<p>The <a href=\"https://www.eurogamer.net/save-mass-effect-petition\" target=\"_blank\" rel=\"noopener\">petition created to save BioWare's well-loved sci-fi RPG</a>, Mass Effect, topped 185,000 signatures in just days. It's now exceeded 317,000. Joe Smith, credited with starting the <a href=\"https://www.change.org/p/savemasseffect\" target=\"_blank\" rel=\"noopener\">petition</a>, isn't necessarily asking EA to change its mind about BioWare; instead, the petition calls for \"decisive action by committing to the continued development of Mass Effect\".</p>\n<p>We <a href=\"https://www.eurogamer.net/farewell-bioware-closed-ea\" target=\"_blank\" rel=\"noopener\">said a sad farewell to BioWare</a> last month. The closure, which came just months after <a href=\"https://www.eurogamer.net/ea-aquisition-55-complete-saudi-arabia-jared-kushner-private\" target=\"_blank\" rel=\"noopener\">Saudi Arabia's $55bn leveraged buyout of EA</a>,<a href=\"https://www.eurogamer.net/ea-private-experts-financial-strain-cuts-politics\" target=\"_blank\" rel=\"noopener\"> was anticipated by experts</a>, but drew widespread condemnation and <a href=\"https://www.eurogamer.net/video-game-industry-reacts-to-bioware-closure\" target=\"_blank\" rel=\"noopener\">messages of sympathy from across the industry</a>.</p>\n<p>A new report claims <a href=\"https://www.eurogamer.net/ea-closed-bioware-because-star-wars-battlefront-3\" target=\"_blank\" rel=\"noopener\">EA closed BioWare because it was forced to choose between investing in one of two sci-fi projects</a>: a new Mass Effect game or a new Star Wars Battlefront game. And it chose the latter.</p>\n<p>Fans are trying other routes to keep BioWare's doors open, too. <a href=\"https://www.eurogamer.net/bioware-canada-house-of-commons-petition-save-mass-effect\" target=\"_blank\" rel=\"noopener\">Canadian fans of the studio have escalated their grievances to the governmental level</a>, calling on the Canadian Government to step in and save the studio from closure, seemingly<a href=\"https://www.eurogamer.net/canadian-politician-bioware-employees-buy-studio-federal-support\" target=\"_blank\" rel=\"noopener\"> after Canada's New Democratic Party leader Avi Lewis called on the government to do so</a>.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Living in Normaltown and Feeling Anything But","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/photo-booth/living-in-normaltown-and-feeling-anything-but","category":"fun","categoryLabel":"Interesting Reads","wordCount":879,"readingTime":5,"content":"<p>The photographer Tim Davis spent his early childhood, in the nineteen-seventies, in a bohemian community in Saratoga Springs, New York. “You could go into a giant Victorian mansion with no running water, and there were hippies and their kids living in there and welding a statue of a giant pterodactyl inside,” he recalled recently when I sat down with him in his studio, in upstate New York. His parents were beatniks who’d served in the Peace Corps, and the family had previously lived in Malawi and, briefly, in a hippie commune in Oregon. Then, when Davis was seven, his parents split up, and his mother took him and his younger sister south, to the unfamiliar city of Athens, Georgia, leaving their father behind. Davis recalls the period as “full of personal pain and tragedy.” Ironically, he found himself living in a neighborhood called Normaltown.</p><p>The town’s name serves as the title of Davis’s <a href=\"https://falllinepress.com/products/normaltown-by-tim-davis\" target=\"_blank\" rel=\"noopener\">newest book</a>, which collects pictures taken in Normaltown and elsewhere in Georgia between 2019 and 2024. (He had not been back since his family left, in 1980.) In the course of a twenty-five-year career, Davis has never approached his work so autobiographically. “It was never about my inner world,” he told me. “It was always about what was out there, and ideas.” Indeed, with the exception of a few seminal projects—including “<a href=\"https://www.amazon.com/Permanent-Collection-Tim-Davis/dp/1590051300\" target=\"_blank\" rel=\"noopener\">Permanent Collection</a>,” in which sections of the glossy surfaces of old paintings are obliterated by reflected light, and “<a href=\"https://www.ohthattimdavis.com/retail\" target=\"_blank\" rel=\"noopener\">Retail</a>,” a group of nighttime pictures that show corporate signage reflected in the windows of suburban houses and apartment blocks—Davis has always been part of the peripatetic breed of picture-makers who find inspiration simply by walking out the door with a camera, and seeing what happens. “The best day in my life,” he told me, “is a day when I can photograph all day, from the second I wake up.”</p><p>For the Normaltown project, Davis didn’t jettison his exploratory shooting style, which he compares to “foraging.” In 2017, he switched from a cumbersome four-by-five-inch view camera to a more nimble digital 35-mm., and if anything he has become more freewheeling. (Sometimes this can be to his disadvantage—the book, which runs to nearly two hundred images, might have benefitted from a harsher editor’s hand.) But whereas comparable recent work, such as Davis’s 2021 <a href=\"https://www.amazon.com/dp/1597114987\" target=\"_blank\" rel=\"noopener\">book</a> of pictures from Los Angeles, had a surreal, cinematic, gee-whiz quality, the pictures in “Normaltown” are more sombre, lonesome, even haunted. In one image, the rusted-out body of a car hangs miraculously from the top branches of a leafless tree, as if Davis had arrived in the aftermath of a Biblical deluge. In another, a jellyfish-like blob of melted ice cream leaks onto the sidewalk in the raking light of sunset. A row of uniformed boys stands on a baseball field, their shadows stretching long across the turf like the tines of a pitchfork. That picture is taken from the high-bleachers vantage of an outsider, a sort of camera-wielding ghost.</p><p>By many metrics, Davis didn’t have it too hard in Normaltown. His family was poor, but they had a semblance of a support system. He got his first camera—a Mickey Mouse Instamatic—on a post-divorce trip to Disney World that was facilitated by some friends of his mother’s who worked in the park. In school Davis was well-liked, a class clown, though he noted when we talked that his humor, like his camera, was a sly way to engage with people while keeping his distance. Some of this reticence stemmed from his disconnect with the people of Normaltown, who seemed trapped inside what he described as a “cartilage of politeness,” which he experienced as a kind of acute culture shock. He and his family were, in his memory, the only Jewish people for miles. He was never, in his memory, the target of antisemitism, but in other ways Normaltown was where he first met America proper, in all of its troubled contradictions. He had little awareness of racism, for instance, before the move. In Normaltown, he began noticing that Black people’s world “was different from mine (just as I was feeling differently).” His pictures favor a kind of ramshackle egalitarianism, in which all of his subjects, both Black and white, are forced to make the best of their relatively bleak surroundings.</p><p>Here and there, moments of connection and compassion sneak through Davis’s photos: a doting mother smiles at her stunned-looking baby as his drool runs in twin rivulets over her arm; a boy hoists a girl into his arms and gazes into her eyes with goofy glee. You can’t help but feel that some of the children pictured might be stand-ins for Davis himself, or for some fantasy of a life he did not live: a kid with a splinter in his palm captured as his father gently plucks it from his flesh; a boy on a miniature motorbike posted up beside a church, his face tilted skyward as if he were awaiting a revelation. Like many outsider observers of America before him—<a href=\"https://www.newyorker.com/culture/photo-booth/the-shock-of-robert-franks-the-americans\" target=\"_blank\" rel=\"noopener\">Robert Frank</a>, for example—Davis simultaneously captures the American everyday and bends it around the poetic armature of his inner life. His pictures are documents not only of his own childhood struggle but of our collective disquiet.</p>"},{"title":"Tech Companies Are Trying to Shift the Entire Concept of Privacy","source":"Hacker News Best","author":"Thorin Klosowski","url":"https://www.eff.org/deeplinks/2026/11/tech-companies-are-trying-shift-entire-concept-privacy-again","category":"tech","categoryLabel":"Technology","wordCount":1321,"readingTime":7,"content":"<p>Privacy, which companies were once happy to claim was all about personal choice, is now primed to affect everyone around you even more than it already did.</p>\n<p><a href=\"https://www.eff.org/deeplinks/2026/03/think-twice-buying-or-using-metas-ray-bans\" target=\"_blank\" rel=\"noopener\">Meta</a> and <a href=\"https://9to5google.com/2026/11/12/google-intelligent-eyewear-glasses/\" target=\"_blank\" rel=\"noopener\">Google’s</a> smart glasses can record anything the owner is looking at or use artificial intelligence to describe it. Apple’s* <a href=\"https://support.apple.com/en-us/148354\" target=\"_blank\" rel=\"noopener\">Audio Intelligence feature</a> turns every Apple Watch into a transcription machine that records or summarizes your day. <a href=\"https://bee.computer/products/frontier\" target=\"_blank\" rel=\"noopener\">Amazon’s Bee devices</a> take that a step further and can record and transcribe everything. Dozens of other companies are introducing <a href=\"https://www.forbes.com/sites/forbes-personal-shopper/article/best-ai-wearables/\" target=\"_blank\" rel=\"noopener\">pendants</a>, <a href=\"https://techcrunch.com/2026/09/20/voccis-ring-adds-a-new-form-factor-to-meeting-note-taking/\" target=\"_blank\" rel=\"noopener\">rings</a>, and <a href=\"https://www.amazon.com/b?ie=UTF8&amp;node=223193081011\" target=\"_blank\" rel=\"noopener\">other products</a> designed to record, transcribe, or summarize everything we say and do all day long.</p>\n<p>Privacy has always been a team sport. The actions you take with <a href=\"https://ssd.eff.org/module/communicating-others\" target=\"_blank\" rel=\"noopener\">communication apps</a>, <a href=\"https://www.eff.org/deeplinks/2018/10/privacy-badger-now-fights-more-sneaky-google-tracking\" target=\"_blank\" rel=\"noopener\">collaborative software</a>, or <a href=\"https://fixitalready.eff.org/apple/#/\" target=\"_blank\" rel=\"noopener\">your cloud backup solutions</a>, have long impacted everyone else you’re interacting with. But moving those choices deeper into the physical world where strangers, colleagues, family, and friends are all now a part of your privacy choices is drastically changing the game.</p>\n<p>Tech companies want us to accept a reality where one person’s privacy choices (or lack thereof) means you suddenly need to be an expert in consumer tech who understands the capabilities of many devices on the market, how they work, how and if they signal when they’re recording, and what platforms they do or do not connect to. They believe these ambient surveillance devices that work in the background and are designed to look as normal as possible are the future, while they also expect the owners of these devices to use them responsibly and to notify those around them of their capabilities to act within whatever laws their states may have. </p>\n<p>This is not reasonable, nor how consent works in any practical sense.</p>\n<p>Let’s break this down by looking at some of the biggest players currently in the game: Apple and Amazon, who have two different takes on transcribing audio throughout the day, as well as Meta and Google, who both have slapped AI and cameras onto eyeglasses. </p>\n<h2>How to Think About the Technical Promises Companies Make</h2>\n<p>Ask Apple about privacy concerns and they’ll <a href=\"https://www.apple.com/privacy/docs/Audio_Intelligence_Privacy_Overview_Sep_2026.pdf\" target=\"_blank\" rel=\"noopener\">point to a white paper</a> that explains all the technical barriers between them as a company and the data generated by the watch. Ask Meta and they’ll talk about all the ways you can <a href=\"https://www.meta.com/ai-glasses/privacy/\" target=\"_blank\" rel=\"noopener\">customize the privacy controls</a> or how certain details, like faces, may be blurred out when you interact with Meta AI through the glasses (but not during standard recording). <a href=\"https://blog.google/innovation-and-ai/technology/safety-security/intelligent-eyewear-privacy-protections/\" target=\"_blank\" rel=\"noopener\">Google does this too</a>. Amazon will also talk about how <a href=\"https://www.aboutamazon.com/news/devices/amazon-personal-ai-bee-frontier-bee-eclipse\" target=\"_blank\" rel=\"noopener\">you’re always in control</a>, and no audio is stored (though it’ll also let you enable Amazon store integration, so your conversations can directly result in ads for products). And so on across all the companies making these products.</p>\n<p>Some of these solutions do a better job than others at cutting out potential law enforcement or company access to this data. There will be a time to dive into these details more deeply, but the technical privacy promises these companies focus on only cover the consumer and user of the device. They ignore every bystander you interact with and their inability to actually opt out. There is no technical protection for you as a non-user of these devices, the person who finds yourself captured by them. </p>\n<p>Still, we hope to look deeper into the technical differences between this category of devices soon.</p>\n<h2>There Must Be Some Laws to Consider, Right?</h2>\n<p>With something like Apple’s Audio Intelligence and Amazon’s Bee devices, it may be best to treat them similar to an always-recording microphone, even if companies try to claim there’s “technically” no audio recording. These tools still often use a microphone to capture raw audio from <a href=\"https://www.law.cornell.edu/uscode/text/18/2510\" target=\"_blank\" rel=\"noopener\">conversations</a> and convert it into summaries or transcripts before discarding the audio. Google's <a href=\"https://blog.google/innovation-and-ai/technology/safety-security/intelligent-eyewear-privacy-protections/\" target=\"_blank\" rel=\"noopener\">blog post notes that it has</a> whole responsible use part of their Terms of Service where users have to agree not to record others without permission or in sensitive places. </p>\n<p>But it’s not just the question of the legality from the point of view of the user. Law enforcement will eventually try to compel access to the data that these products create (either real-time audio or the summaries and transcripts they create). And while some products, like Apple’s Audio Intelligence, are engineered to make that difficult, not every product will be. We know from history that when data exists, governments will do everything they can to access it. There’s no reason to think something would change today.</p>\n<h2>No Tech and Legal Solutions Will Reduce Social Issues</h2>\n<p>There is a problem humming along in the background that is impossible to address with technical or legal solutions. If secretly documenting conversations becomes the norm, it makes every private conversation less spontaneous and open. It breaks a longstanding social norm that you will not record and document every conversation with friends, family, colleagues, or strangers. </p>\n<p>The companies that make these sorts of products like to claim they’re no different from tools we already have. You can easily record everything right now with a phone or a camera. Heck, you can do so with a camcorder or cassette recorder if you want. And you can transcribe conversations with pen and paper, too. But those are actionable steps we take that both require effort from the user, and are clear to others around us. This new wave of passive surveillance tech is designed to encourage continuous monitoring and hide its use. </p>\n<p>Even taken at face value, none of these products can understand the complex social context we all navigate every day. We intrinsically know there are different social agreements we all make when we’re standing on a street corner, at a protest, in a bathroom, at a doctor’s office, at the gym, or in a restaurant. Taking notes in a meeting at work is completely normal. Getting a summary of a conversation with your best friend about their divorce is not. Always-on monitoring of our conversations is an unacceptable burden on our conversational privacy. </p>\n<p>Google seems to all but admit this problem in a <a href=\"https://www.cnn.com/2026/11/12/tech/google-glasses-privacy-concerns\" target=\"_blank\" rel=\"noopener\">conversation with CNN</a> when it described the company’s experiments with a notification system that would alert people’s phones when someone was recording nearby: </p>\n<blockquote><p>“And just alerting bystanders doesn’t do much to help, [Juston Payne, senior director of product management at Google] said. “It can actually be weirdly disempowering to you in that you’re like, ‘What am I meant to do now?’” he said.”</p>\n</blockquote>\n<h2>What We Can Do About It</h2>\n<p>It’s easy to buy into the tech company line that these products are inevitable, but we’ve seen so many vaporware products over the years that we should take those claims of success with a grain of salt. We’ve seen entire product categories come and go within just a few years, and if the public doesn’t want this stuff, the tech companies will have to throw in the towel. </p>\n<p>Of course, that doesn’t mean we all just have to sit around and hope that’s what happens. For its part, Apple <a href=\"https://9to5mac.com/2026/11/03/watchos-27-3-beta-adds-new-siri-recap-and-live-rewind-features-for-apple-watch/\" target=\"_blank\" rel=\"noopener\">launched its Audio Intelligence features in beta</a> specifically to get feedback, and we think it’s worth taking the time to <a href=\"https://www.apple.com/feedback/watch/\" target=\"_blank\" rel=\"noopener\">fill out their feedback forms</a> (or in the <a href=\"https://developer.apple.com/feedback-assistant/#feedback-assistant\" target=\"_blank\" rel=\"noopener\">Feedback Assistant app</a> if you’re in the beta) and let them know what you think.</p>\n<p>Products from the likes of Meta, Google, Amazon, and others might be harder to push back on, <a href=\"https://www.eff.org/deeplinks/2026/03/think-twice-buying-or-using-metas-ray-bans\" target=\"_blank\" rel=\"noopener\">but politely and clearly engaging</a> with those who use them in ways that make you uncomfortable is a good place to start. And if you see abusive videos on social networks where these sorts of products are used, report them. If you find these products useful for yourself, make it clear to those around you when you’re using them, and only do so with consent and in social moments where it makes sense to do so.</p>\n<p>*Apple is an EFF donor. EFF donors do not influence our agenda or our positions.</p>"},{"title":"School Districts' Negligence and Nuisance Claims Against Social Media Companies Rejected by California Court of Appeal","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/10/school-districts-negligence-and-nuisance-claims-against-social-media-companies-rejected-by-california-court-of-appeal/","category":"law","categoryLabel":"Law","wordCount":1414,"readingTime":8,"content":"<p>Some short excerpts from the long decision Thursday in <em><a href=\"https://cases.justia.com/california/court-of-appeal/2026-b340661.pdf?ts=1793918139\" target=\"_blank\" rel=\"noopener\">Social Media Cases (San Diego Unified School Dist. v. Meta Platforms, Inc.)</a></em> by California Court of Appeal Justice Anne Richardson, joined by Justices Elwood Lui and Stephen Goorvitch):</p>\n<blockquote><p>In recent years, various plaintiffs have brought numerous legal claims against social media companies. In this opinion, we address only two causes of action—negligence and public nuisance—in the context of the laws of California, Florida, Washington, and Rhode Island, brought by school districts…. Plaintiffs generally claimed Defendants created a \"mental health crisis\" among their students that harmed Plaintiffs by disrupting their educational mission, requiring them to spend more money and staff time to address student mental health and discipline, and causing students to vandalize their property….</p>\n<p>We acknowledge the serious allegations of mental health harms experienced by many students and the impact of those harms on Plaintiffs' schools and student bodies…. [But the relevant precedents] establish that these plaintiffs cannot proceed under the legal theories and factual allegations they have pled….</p>\n<p><strong>Negligence Causes of Action …</strong></p>\n<p>Here, Plaintiffs allege they suffered three general kinds of harm: (1) \"incur[ring] significant financial costs\" to address the youth mental health crisis allegedly created by Defendants' platforms; (2) \"frustrat[ion] [of their] pedagogical mission\" in diverting staff time and resources from education to counter the disruptive effects of the crisis; and (3) property damage inflicted by students. In part V., we conclude Plaintiffs' allegations their missions were frustrated do not state a cognizable negligence claim, and in part VI., we conclude Defendants have immunity from liability arising from Plaintiffs' alleged property damage. {Plaintiffs do not allege <em>Defendants</em> directly damaged their property; instead, they allege Defendants' platforms influenced students to vandalize school property because the platforms showed them so-called \"challenge videos,\" created by third parties, that encouraged vandalizing school property. The trial court determined [47 U.S.C. § 230] provided Defendants immunity from liability arising from the challenge videos. We agree.}</p>\n<p>That leaves Plaintiffs with only alleged financial harms …. The crux of the negligence causes of action is the applicability of the so-called \"economic loss rule.\" … \"… In general, there is no recovery in tort for negligently inflicted 'purely economic losses,' meaning financial harm unaccompanied by physical or property damage\" [even as to foreseeable economic losses -EV]…. \"[A]ssume[ ] a defendant negligently causes an automobile accident that blocks a major traffic artery such as a bridge or tunnel. Although defendant would be liable for personal injuries and property damage suffered in such an accident, it is doubtful any court would allow recovery by the myriad of third parties who might claim economic losses because the bridge or tunnel was impassible.\" …</p>\n<p><strong>Public Nuisance Causes of Action</strong></p></blockquote>\n<blockquote><p>Nuisance suits are generally either public or private. \"[A] private nuisance is a civil wrong based on disturbance of rights in land[,] while a public nuisance is [based] upon an interference with the rights of the community at large.\"</p>\n<p>\"Nuisance has been described as an 'impenetrable jungle'\" that \"'mean[s] all things to all people'\" and \"'is incapable of any exact or comprehensive definition.'\" Thus, while nuisance is often defined broadly, many courts have limited its scope in practice. For example, the Washington Supreme Court expressly limits nuisance claims \"to property infringement [and] threats to health and safety.\" Some of our fellow Courts of Appeal have prohibited bringing products liability claims in the guise of public nuisance actions.</p>\n<p>Such limits are often imposed because of a concern that \"nuisance 'would [otherwise] become a monster that would devour in one gulp the entire law of tort.'\" In the products liability context, \"'[a]ll a creative mind would need to do is construct a scenario describing a known or perceived harm … that can somehow be said to relate back to the way a company … makes, markets and/or sells its non-defective, lawful product or service, and a public nuisance claim would be conceived and born.'\"</p>\n<p>The trial court concluded Plaintiffs failed to adequately plead public nuisance because the harms alleged to have befallen individual student users of Defendants' platforms did not amount to a public nuisance, even when \"considered collectively.\" While our analysis may differ from the trial court's in some particulars, we ultimately agree Plaintiffs' efforts to state a cause of action for public nuisance fail under the laws of California, Washington, and Florida….</p>\n<p>California nuisance is broadly defined by statute as \"[a]nything which is injurious to health, including, but not limited to, the illegal sale of controlled substances, or is indecent or offensive to the senses, or an obstruction to the free use of property, so as to interfere with the comfortable enjoyment of life or property, or unlawfully obstructs the free passage or use, in the customary manner, of any navigable lake, or river, bay, stream, canal, or basin, or any public park, square, street, or highway, is a nuisance.\"</p>\n<p>Public nuisance is defined by statute as \"one which affects at the same time an entire community or neighborhood, or any considerable number of persons, although the extent of the annoyance or damage inflicted upon individuals may be unequal.\" \"[P]ublic nuisances are offenses against, or interferences with, the exercise of <em>rights common to the public</em>.\" \"It is [the] <em>community</em> aspect of the public nuisance … that distinguishes it from its private cousin,\" and makes it suitable \"to protect the quality of organized social life.\"</p>\n<p>Perhaps because of those broad definitions, our Legislature has codified who has standing to bring a public nuisance action. Certain persons may bring an action for public nuisance when it is \"specially injurious\" to them or when their property is \"injuriously affected or [their] personal enjoyment is lessened.\"</p>\n<p>By contrast, a \"public body or officer authorized thereto\" can bring an action to <em>abate</em> a public nuisance. And the State or designated county or city officials, in their representative capacities, can bring an action limited to abatement under Code of Civil Procedure section 731. San Diego's action, however, is not limited to abatement, but seeks damages for harms allegedly caused by the nuisance. The only recognized exception to the limitation on remedy is that a public entity may seek damages when it sues in its role as a property owner.</p>\n<p>While San Diego makes a number of arguments related to its public nuisance theory, some of which have divided our fellow Courts of Appeal, we need not parse them in detail because San Diego failed to adequately allege its standing to bring a public nuisance cause of action….</p>\n<p>San Diego first argues it has standing under Civil Code section 3493. That statute expressly allows \"[a] private person\" to bring a public nuisance action…. [G]overnment entities are not \"private person[s]\" for purposes of section 3493….</p>\n<p>In the alternative, San Diego argues it may bring a public nuisance cause of action pursuant to Code of Civil Procedure section 731. That statute provides \"[a]n action may be brought by any person whose property is injuriously affected, or whose personal enjoyment is lessened by a nuisance, as defined in Section 3479 of the Civil Code,\" and damages may be recovered. …</p>\n<p>San Diego's complaint did not adequately plead its property was \"injuriously affected\" or its \"personal enjoyment [was] lessened\" by the alleged nuisance of Defendants' platforms…. Rather, the complaint's focus throughout its 286 pages is on the \"unprecedented mental health crisis\" among students and its disruption to schools' public educational mission…. Any connection to property here is abstract at best.</p>\n<p>Accepting San Diego's position would convert virtually any personal injury affecting a property owner into a nuisance. For example, consider a homeowner whose son breaks his leg in a car accident with a negligent driver, rendering him unable to use the stairs in the home. Even if the homeowner must spend time and resources to help her son navigate the home, she has no <em>nuisance</em> cause of action against the driver on the ground the driver interfered with her use and enjoyment of her property….</p>\n<p>* * *</p>\n<p>Because all Plaintiffs' causes of action fail for the reasons discussed, we do not consider whether they are entirely barred by section 230 and the First Amendment to the United States Constitution….</p></blockquote>\n<p>Jonathan H. Blavin and Victoria A. Degtyareva (Munger, Tolles &amp; Olson), Paul J. Watford, Bailey J. Langner, David P. Mattern and Geoffrey M. Drake (King &amp; Spalding), Mark W. Mosier, Ashley M. Simonsen and Christian J. Pistilli (Covington &amp; Burling), and Ashley W. Hardin, George A. Borden and Neelum J. Wadhwani (Williams &amp; Connolly) represent defendants.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
