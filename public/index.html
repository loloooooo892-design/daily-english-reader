<style>

  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;

  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {

  text-decoration: none;

.footer a:hover {

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {

<script>
var articles = [{"title":"Just in time for pre-Songs of the Past DLC refreshers, Witcher 3 modders have restored a cut menu which lets you watch story recaps at any time","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/just-in-time-for-pre-songs-of-the-past-dlc-refreshers-witcher-3-modders-have-restored-a-cut-menu-which-lets-you-watch-story-recaps-at-any-time","category":"gaming","categoryLabel":"Gaming","wordCount":621,"readingTime":4,"content":"<p>Four years and a \"showstopping bug\" after first discovering this work CD Projekt Red left out</p>\n    \n  \n  \n  \n  \n            <p>Remember those little 'last time on <a href=\"https://www.rockpapershotgun.com/games/the-witcher-3-wild-hunt\" target=\"_blank\" rel=\"noopener\">The Witcher 3</a>' recaps CD Projekt Red have Dandelion narrate if you load up a save or fast travel to a new section of the map midway through the <a href=\"https://www.rockpapershotgun.com/best-rpgs\" target=\"_blank\" rel=\"noopener\">RPG</a>'s main story? Well, it turns out the studio cut out a menu that'd have allowed you to go back and watch any of these helpful reminders of what Gerry from the River was up to at any time, much in the same way you can pop to the character biographies if you've forgotten who someone important is or how Geralt upset them years ago during one of his paperback adventures.</p>\n<p>Now, modders have managed to restore said menu, creating an ideal way to quickly remind yourself of TW3's tale ahead of next year's <a href=\"https://www.rockpapershotgun.com/geralts-back-for-one-last-roach-ride-in-long-rumoured-the-witcher-3-wild-hunt-expansion-songs-of-the-past\" target=\"_blank\" rel=\"noopener\">Songs of the Past expansion</a>, assuming you're not up for another playthrough.</p>\n<p>The <a href=\"https://www.nexusmods.com/witcher3/mods/12673\" target=\"_blank\" rel=\"noopener\">restored recap video menu</a> - labelled 'Events' in-game, but dubbed 'Storybook' by its restorer - lives in the glossary section of The Witcher 3's main menu, next to the bestiary. \"This panel was originally created by CDPR and leftover unfinished in the game files ever since the launch of the game in 2015 making this a cut content restoration,\" wrote modder Glassfish777, who's brought it back. \"The panel was left unfinished so I took the liberty of bringing it up to the standards and style of the current GUI and fixing/adding new functionality like skipping, subtitles, and automatic music fadeout.\"</p>\n<p>Later in the description, they revealed that this cut menu was actually first discovered in the game's files in 2022, with a modder going by Fabian (or <a href=\"https://www.nexusmods.com/profile/Tinnaib/mods\" target=\"_blank\" rel=\"noopener\">Tinnaib</a>) having tried to restore it to the game back then, but had their progress halted by a \"showstopping bug\" which could be solved using the modding tools available at the time. \"The release of the UI flash sources with RedKit in 2024 made fixing the bug and polishing up the panel to release standard significantly easier, making this release possible,\" glassfish777 wrote. \"So, special shout-out to Fabian for originally starting this project and I'm glad I was able to finish what he started.\"</p><p>Scrolling through the menu itself, you'll find clips recapping the likes of Ciri's run in with the crones or Geralt's arrival in Novigrad once you've completed the corresponding bit of the main story. Each has a description and title written by CD Projekt Red, which the studio had even gone as far as localising into different languages. \"Almost every video has a second stage to it that only unlocks after you've progressed the story a little more after unlocking the first section,\" the modder explained. \"The second stage is automatically appended to the first stage so you don't actually have to manually select it. New/updated videos are marked with a star icon. Note that several of these 'second parts' of the videos are actually impossible to see on the loading screens as the second stage of a given video is often unlocked at the same time as the first stage of the next video which the game always prioritises for the loading screens.\"</p>\n<p>If you prefer to keep the recaps in this menu and stop them playing during loading screens like they usually do in the base game, Glassfish777 has also released an optional file which pulls that off. Installation instructions are in the description.</p>\n<p>This is far from the only bit of cut content restoration on the go in the Witcher 3 modding scene right now, with one group of modders dubbed The WAR Project busy <a href=\"https://www.rockpapershotgun.com/witcher-3-modders-are-restoring-the-rpgs-massive-cut-plague-questline-just-in-case-cd-projekts-songs-of-the-past-expansion-isnt-enough-extra-geralt\" target=\"_blank\" rel=\"noopener\">remaking the plague questline</a> CD Projekt Red ditched prior to release.</p>"},{"title":"A California Program Is Bringing Down the Cost of Heat Pumps by Buying Bulk","source":"Wired","author":"@wired","url":"https://www.wired.com/story/california-group-buy-bringing-down-heat-pump-costs/","category":"tech","categoryLabel":"Technology","wordCount":633,"readingTime":4,"content":"<p>When heat waves descended on California this summer, Shreyas Sudhakar, founder and chief executive officer of <a href=\"https://www.wired.com/story/boost-your-homes-resale-value-install-heat-pump/\" target=\"_blank\" rel=\"noopener\">heat pump</a> installation firm Vayu, took his chance.</p><p>Just 54 percent of homes in the state have central air-conditioning, but rising temperatures are making cooling a must-have. Sudhakar saw the hot weather as an opportunity to sign up multiple households to a heat pump “group-buy” scheme, offering them a chance to purchase technology that provides carbon-free heating and cooling at a discount. After advertising the venture online, he was flooded with queries.</p><p>Heat pumps often cost more than cooling-only air conditioners, which is why adoption hasn’t been more widespread in the US. But the group-buy approach offers would-be purchasers a bulk discount that can defray part of the cost. Group-buys also mean installers can line up a tidy string of jobs—a win-win potentially enabling whole neighborhoods to switch to heat pumps.</p><p>Along with heat pump marketplace VoltHub, Vayu launched the first <a href=\"https://heatpumpgroupbuy.com/\" target=\"_blank\" rel=\"noopener\">California Heat Pump Group Buy</a> last year. “Nobody, to our knowledge, had done it in California,” recalls Sudhakar. “We thought, ‘Let’s try it out.’” The program is available around Los Angeles and the Bay Area.</p><p><a href=\"https://www.wired.com/story/how-do-heat-pumps-work/\" target=\"_blank\" rel=\"noopener\">Air-source heat pumps</a> run on electricity. They work by harvesting heat from outside air and distributing it indoors, or gathering excess internal heat and dumping it outside.</p><p>This isn’t exactly rocket science. Except, perhaps, to a former rocket propulsion engineer.</p><p>“I tell people this all the time,” laughs Sudhakar, who previously designed rocket engines at Blue Origin. “At the end of the day, it’s a bunch of pipes and a heat exchanger moving energy from one place to another.”</p><p>Among the first group of roughly 10 customers in the initial group-buy scheme was Naoya Kanai, a data scientist who lives with his wife and toddler in the Bay Area city of San Mateo. Kanai stumbled on the group-buy online and jumped at the chance, knowing that federal rebates for carbon-free appliances would soon <a href=\"https://www.wired.com/story/congress-is-killing-clean-energy-tax-credits-heres-how-to-use-them-before-they-disappear/\" target=\"_blank\" rel=\"noopener\">disappear under the Trump administration</a>.</p><p>“It was one of the most affordable ways to get a quality system,” he says of the program. Kanai recalls thinking, “I can really sell it to my spouse.”</p><p>Once households are signed up to the group-buy, Sudhakar and his colleagues work out what equipment they’ll need for each installation. Then, they shop around for deals from distributors so they can make offers to participants. “We’re looking for what is the best value across the entire group,” he adds. “Typically, we’re getting 15 to 30 percent discounts on the equipment.”</p><p>Kanai’s house is a two-story 1980s suburban home that has about 2,500 square feet of space. The new heat pump system cost roughly $14,500 and provides heating and cooling via ductwork that was already in place. Kanai says the flow of temperature-controlled air is much more comfortable and steady compared to his old gas furnace and air conditioner. He’s barely noticed this summer’s heat waves until going outside. “A lot of times we’ll step out the front door [and realize] ‘Oh, wow, it was actually really hot today.’”</p><p>Other group-buy programs are available across North America, with one of the oldest operational programs on Gabriola Island, British Columbia, a 58-square-kilometer land mass home to about 4,500 people. In 2010, a group called <a href=\"https://sustainablegabriola.ca/initiatives/\" target=\"_blank\" rel=\"noopener\">Energy Gabriola</a> set itself up as a heat pump dealer via a distributor, so it could buy heat pumps in bulk and sell them at cost. This was possible because, until that point, there was no heat pump market or installation service on the island whatsoever.</p><p>Relying partly on volunteers, the group has installed more than 1,000 heat pumps to date, electrifying nearly half of the island’s households. “We think we’re the heat pump capital of Canada,” says Steven Earle, of Vancouver Island University, who is involved in Energy Gabriola.</p>"},{"title":"Second Amendment Roundup: $0 Tax Left NFA with No Constitutional Basis","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/09/second-amendment-roundup-0-tax-left-nfa-with-no-constitutional-basis/","category":"law","categoryLabel":"Law","wordCount":1030,"readingTime":6,"content":"<p>In a <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.txnd.406278/gov.uscourts.txnd.406278.136.0.pdf\" target=\"_blank\" rel=\"noopener\">decision</a> issued on August 5, U.S. District Judge James Wesley Hendrix (N.D. Tex.) ruled in <em>Silencer Shop Foundation v. Bureau of ATF </em>that the One Big Beautiful Bill Act, which repealed the taxes for the making and transferring of certain firearms under the National Firearms Act (NFA), left the law without any basis for its registration requirements in the authority of Congress to \"lay and collect Taxes.\" U.S. Const. art. I, § 8. cl. 1.  The firearms affected are short-barreled rifles, short-barreled shotguns, silencers, and \"any other weapon[s],\" all defined in <a href=\"https://www.law.cornell.edu/uscode/text/26/5845\" target=\"_blank\" rel=\"noopener\">26 U.S.C. § 5845</a>.  Machineguns and destructive devices remain subject to the $200 tax.</p>\n<p>This result is a no-brainer, as Congress enacted the NFA as a tax measure under the Internal Revenue Code and the Supreme Court upheld it as such in <a href=\"https://supreme.justia.com/cases/federal/us/300/506/\" target=\"_blank\" rel=\"noopener\"><em>Sonzinsky v. United States</em></a> (1937), which the Court reaffirmed in <a href=\"https://tile.loc.gov/storage-services/service/ll/usrep/usrep567/usrep567519/usrep567519.pdf\" target=\"_blank\" rel=\"noopener\"><em>NFIB v. Sebelius</em></a> (2012), the Obama-care case.  Citing this author's <a href=\"https://scholarship.law.uwyo.edu/wlr/vol25/iss1/5/\" target=\"_blank\" rel=\"noopener\">article</a> on the subject, the district court wrote that \"the NFA was Congress's attempt to regulate so-called 'gangster weapons' linked to Prohibition Era violence.\"  The purpose of the NFA requirement that the \"firearms\" under the Act be registered was to keep track of who paid the tax.  Repeal of the tax pulled the rug out from under the registration requirement.</p>\n<p><em>Silencer Shop</em> next considered the government's argument that the regulatory requirements for the making and transfer taxes support the collection of the NFA's special occupational taxes (SOTs), which persons in the business of manufacturing, importing, and dealing in NFA firearms must pay annually.  But collection of those taxes is implemented through the registration requirements for such businesses and the penalties for noncompliance.  The regulatory scheme for the SOTs is completely distinct from that for the making and transfer taxes.</p>\n<p>Quoting <a href=\"https://supreme.justia.com/cases/federal/us/521/898/case.pdf\" target=\"_blank\" rel=\"noopener\"><em>Printz v. United States</em></a> (1997), the court next turned to the government's claim that the provisions at issue are valid under \"the Necessary and Proper Clause—the 'last, best hope of those who defend ultra vires congressional action.'\"  But the making and transfer regulatory provisions are not \"necessary\" to administration of the regulatory scheme for the SOTs.  Nor are they \"proper,\" as Congress has no plenary police power such as the States have.</p>\n<p>ATF claimed that that the challenged registration provisions support the collection and enforcement of the SOTs.  But registration information is barred from use in criminal prosecutions per 26 U.S.C. <a href=\"https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section5848&amp;num=0&amp;edition=prelim\" target=\"_blank\" rel=\"noopener\">§ 5848(a)</a> and the Fifth Amendment privilege against self-incrimination, see <a href=\"https://supreme.justia.com/cases/federal/us/401/601/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Freed</em></a> (1971).</p>\n<p>The government argued next that the NFA provisions may be sustained under the Commerce Clause.  While courts respect the lawmaking power of Congress, the court wrote, that is \"not a get-out-of-unconstitutionality-free card.\"  By its plain text, the NFA is a taxing statute.  Nothing in the provisions at issue mention interstate or foreign commerce.  By contrast, Title I of the Gun Control Act (GCA) includes such commerce as the jurisdictional hook of every one of its provisions.  That is, with one exception.</p>\n<p>That exception is the ban on possession of a post-1986 machinegun, 18 U.S.C. § 922(o).  The Fifth Circuit had suggested in dicta in <a href=\"https://law.justia.com/cases/federal/appellate-courts/F3/19/177/628198/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Ardoin</em></a> (1994) that, although ATF would not collect NFA taxes for new machineguns because of § 922(o), that part of the NFA as applied might be sustained under the Commerce Clause.  But as the <em>Silencer Shop</em> court points out, <em>Ardion</em> preceded the Supreme Court's decisions in <a href=\"https://supreme.justia.com/cases/federal/us/514/549/\" target=\"_blank\" rel=\"noopener\"><em>Lopez</em></a> and <a href=\"https://supreme.justia.com/cases/federal/us/529/598/\" target=\"_blank\" rel=\"noopener\"><em>Morrison</em></a>, which invalidated two federal laws respectively – the Gun Free Schools Act and the Violence Against Women Act – as police power measures having no basis in the Commerce Clause.</p>\n<p>That left only the Second Amendment claim, but at oral argument, all of the parties agreed that that issue need not be decided if the court found that the NFA provisions exceed the powers of Congress.  That claim was thus forfeited.  I previously addressed the arguments in the briefs <a href=\"https://reason.com/volokh/2025/12/02/second-amendment-roundup-the-u-s-defends-nfa-restrictions-lacking-a-tax-nexus/?post_type=volokh-post&amp;preview=true\" target=\"_blank\" rel=\"noopener\">here</a>.</p>\n<p>With that, the court issued a permanent injunction as the final judgment enjoining the Department of Justice and ATF from \"from enforcing the challenged NFA provisions as to untaxed firearms against the plaintiffs and, where applicable, the plaintiffs' agencies, political subdivisions, members, and customers—both current and future.\"  The plaintiffs include individuals, nonprofit associations, businesses that deal in NFA firearms, together with Texas and thirteen other states.  The injunction's scope is broad as to the businesses inasmuch as they may sell firearms to both current and future customers.  Its scope is narrow as applied to the fourteen state plaintiffs, who are not subject to the NFA requirements when the state itself and its political subdivisions acquire NFA firearms, but whose citizens are not covered by the injunction.</p>\n<p>The affected firearms in <em>Silencer Shop</em> include short-barreled rifles, short-barreled shotguns, silencers, and \"any other weapon[s],\" AOWs.  The case was consolidated with <em>Jensen v. ATF</em> and the court's holding mostly applies to both cases equally, except that the <em>Jensen</em> plaintiffs raised no AOW claim, and so the court's injunction doesn't apply to those plaintiffs as to AOWs.</p>\n<p>This is not a universal, nationwide injunction, which is precluded by the Supreme Court's decision in <a href=\"https://www.supremecourt.gov/opinions/24pdf/24a884_8n59.pdf\" target=\"_blank\" rel=\"noopener\"><em>Trump v. CASA</em></a> (2025).  Moreover, imposition of a universal injunction would short-circuit review of similar challenges pending in the Eastern District of Missouri and the Eastern District of Kentucky.</p>\n<p>The court stayed the injunction order for seven days to give the government an opportunity to appeal to the Fifth Circuit, which seems sure to issue its own stay pending appeal.  The challenges could easily end up in the Supreme Court.  Given the longstanding, solid anchoring of the NFA in the tax power, plaintiffs have reason to be optimistic about ultimately prevailing.  But that doesn't mean the sky will fall.  Recall that the Senate had been poised to delete the affected firearms from the NFA altogether, but the parliamentarian ruled that to be disallowed by the Byrd Rule concerning reconciliation bills.  That's why the Senate simply zeroed out the tax.  See my post <a href=\"https://reason.com/volokh/2025/08/10/second-amendment-roundup-the-zero-tax-on-nfa-firearms/\" target=\"_blank\" rel=\"noopener\">here</a>.</p>\n<p>As Winston Churchill said after the British victory at the Battle of El Alamein, \"This is not the end. It is not even the beginning of the end. But it is perhaps the end of the beginning.\"</p>"},{"title":"Pope.L’s Pleasing Refusal to Be Interpreted","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/17/pope-ls-pleasing-refusal-to-be-interpreted","category":"fun","categoryLabel":"Interesting Reads","wordCount":1478,"readingTime":8,"content":"<p>Whether crawling through New York in a suit or painting with peanut butter, the artist remained loyal to his own impish curiosity.</p><p>August 10, 2026</p><p>“White People Are Prawns at Sunset” (2010).Art work by Pope.L / Courtesy Estate of Pope.L / Gladstone</p><p>We’re familiar with the idea that art is a sublimated form of madness, but the artist William Pope.L liked to hint it was the other way around. His major works include “ATM Piece” (1997), in which he attached himself to the door of a Chase bank with a chain of sausage links while wearing only Timberland boots and a skirt made of dollar bills, and “Eating the Wall Street Journal” (2000), which involved him sitting on a raised toilet, eating the newspaper for multiple hours a day, for multiple days, with a garnish of ketchup and milk. Commentary on his work often describes it as a critique of race or capitalism but gingerly avoids the more superficial observation that these behaviors have a resemblance to certain presentations of psychosis. Seeing Pope.L in the late seventies in his “Crawl” series, wearing a wool pin-striped suit, commuting on his hands and knees through the streets of Manhattan, most pedestrians likely didn’t think, <em>This is art</em>, or <em>This is social criticism</em>, or <em>This is an argument against bipedalism</em>. They probably thought he’d lost his mind.</p><p>But was the performance deranged or were the circumstances? With city blocks burned to the ground, a shrinkage of affordable housing, and a spike in homelessness, the New York of the late seventies was a city in distress. Pope.L saw many of his closest relations—including his aunt, his brother, and his father—reduced to living on the street. “When you have that many people in your family suffering from this thing, maybe you think it will happen to you. Like a disease,” he said. In 1978, the year Pope.L started his “Crawl” performances, Ed Koch was sworn in as mayor, heralding an era of fiscal austerity. The slashing of public programs coincided with a rise in public performance art—Mierle Laderman Ukeles’s “Touch Sanitation” (1979-80), Christy Rupp’s “Rat Patrol” (1979), Jenny Holzer’s “Inflammatory Essays” (1979-82)—but Pope.L struck a nerve. In a photograph from one of his crawls, in Times Square, a police officer reaches down and tries to get him to stand up. The officer, whose silver-and-gold watch flashes in the light, doesn’t seem intent on helping Pope.L. He looks eager to protect other people from the sight of him.</p><p>A new exhibition at the Drawing Center, “Certainly an Act: Works on Paper by Pope.L,” shows how the artist extended his practice of principled unreason—or what his grandmother once described lovingly as his tendency for “foolishness” and “devilment”—into objects of two and three dimensions. There are many ways for an artist to double as a social critic; Pope.L’s preferred mode was absurd jokes with elusive punch lines. Across more than fifty years of art-making, before his death, in 2023, he worked in familiar forms—drawing, painting, sculpture, video—but also made ample use of peanut butter, mayonnaise, hot dogs, ice cream, Spam, and Pop-Tarts. He studied with the Fluxus artist Geoffrey Hendricks at Rutgers, and because of that lineage he’s often placed in the traditions of conceptual and performance art. But, if you look at the actual data on offer at the Drawing Center, you’ll see that Pope.L’s graphic work has a deep filiation with the art brut of Jean Dubuffet. Dubuffet, who in nineteen-forties France collected graffiti, the work of children, and the art of psychiatric patients, wanted an art that was crude and “raw,” untarnished by culture. The less skilled or tutored the style appeared, the better.</p><p>In Pope.L’s “Harriet Tubman Spins the Universe” (1998-2017), he puts the abolitionist on a plank of Sheetrock in the middle of a swirl of peanut butter. The piece feels like an update of Paul Klee’s “Angelus Novus,” if it were spun in a gyroscope and sprayed with acrylic paint. Tubman is all but indecipherable, roughly limned with white paint and covered by red, black, and yellow smudges and drips. The personal filaments of meaning for Pope.L here include the peanut butter itself—a cheap, calorie-dense food that was a staple of his upbringing—and the organizing force of Black women in his life, particularly his grandmother, Desma Lancaster. She is said to have shown quilts at the Studio Museum in Harlem in the nineteen-sixties, and was the first person to open Pope.L’s mind to art.</p><p>Successful artists are often excellent brand managers. They have coherent “periods” of activity, when one material or idea predominates, and provide neatly packaged interpretive frameworks for the reception (and collection) of their art. Part of what makes Pope.L so great, in my book, is that he couldn’t care less about crafting an image or a brand. His work thrives on the incoherence of his own restless curiosity.</p><p>You’ll see this across Pope.L’s corpus, but also within a given series, such as the “Skin Set” drawings, which he started in the nineties. Each drawing issues a sort of proclamation—sometimes using a combo of ballpoint pens, Wite-Out, Magic Markers, and coffee stains—that seems authored by a child or a wigged-out racist: “<em>WHITE PEOPLE ARE PRAWNS AT SUNSET</em>”; “<em>RED PEOPLE FUCK THE OYSTERS OF AUTHORS</em>”; “<em>BLACK PEOPLE ARE WHAT BLACK PEOPLE LACK</em>”; “<em>BLUE PEOPLE CANNOT CONCEIVE OF THEMSELVES</em>.” “Nonsense” can mean language in which diction and syntax don’t conform to familiar patterns, but it’s also a term we use dismissively to establish that we know what sense is, to put ourselves high and dry on a plot of reason. “Oh, so you know what white people really <em>are</em>, if they’re not prawns?” the drawings taunt. “What are they?” Each one functions like a coarse grain of sand, eroding the certainties and stereotypes that harden racial discourse.</p><p>The most spectacular piece in the show is a multimedia environment called “Relational Painting a.k.a. If Black Is Beautiful . . .” (2003-22). There is a black tarpaulin on the wall that’s been assaulted with paint and more than a dozen lamps suspended above it, blasting the painting with light as if to interrogate it about the circumstances of its creation. Static plays through guitar amps on the ground, books are splayed open, images are tacked up on the wall, and bottles of fluid—water, Powerade, vague painterly liquids labelled “clear” or “gloss”—are scattered around. It’s a work that looks as though it’s vomited out its entire process. But unlike the preserved wreckage of, say, Francis Bacon’s studio at the Hugh Lane Gallery, in Dublin, the scene here doesn’t read as a re-creation of any real artistic procedure. There are no brushes, for instance, though there are traces of brushwork. The title is an allusion to Nicolas Bourriaud’s “Relational Aesthetics” (1998)—his famous idea being that art is a socially generative “state of encounter”—but the piece doesn’t allow for any utopian socializing, either. What’s spilled out into the gallery is Pope.L’s sendup of what we expect from artists, a carefully managed depiction of the fantasy of creative mania.</p><p>I noticed that a few visitors missed the staircase down to the basement gallery of the Drawing Center, which has not only Pope.L’s “Pop Tart Frieze” (1998)—substituting marble or plaster with mass-produced pastry—but also a video work that’s a kind of manifesto in disguise: “Egg Eating Contest (Basement version)” (1990). Wearing a tattered black tunic and combat boots, Pope.L struts across a stage like a rooster and delivers a monologue as his alter ego Mr. Poots, talking like a child prophet who’s cracked under the pressure of history. The “problem”—he clicks his tongue—“with the white man is he’s not very nice. At nap time, he takes <em>all</em> the blankie. And at snack time he takes all the treats. And at recess he chases all the Black people and knocks them down. . . . And when the Black people get upset he says, ‘Shut up! Shut up! I am your salvation!’ ” The artist adopts a schizoid persona, with multiple voices flowing out of him, and swerves between lucid social criticism—about the history of slavery or of higher education—and total gibberish. Like Pope.L, who called himself “the friendliest Black artist in America,” Mr. Poots can seem harmless or scatterbrained, but he has a strict agenda that loops between tragedy and farce. Next to Mr. Poots is a colossal drawing of a penis. In the middle of the performance, he marches over and pulls it down, only to reveal another drawing of a penis underneath. This one is wearing a bow tie. ♦</p><ul><li><p>A scientist with a Ph.D. from Harvard fatally shot three of her colleagues. Then revelations about <a href=\"https://www.newyorker.com/magazine/2013/02/11/a-loaded-gun\" target=\"_blank\" rel=\"noopener\">her family history came to light</a>.</p></li></ul><p><a href=\"https://www.newyorker.com/contributors/zachary-fine\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://www.newyorker.com/contributors/zachary-fine\" target=\"_blank\" rel=\"noopener\">Zachary Fine</a>, a contributing writer at The New Yorker, is the Kim-Frank postdoctoral fellow in criticism at Wesleyan University.</p>"}];
