hat has endeared them to researchers—but, as Helen Sullivan points out, they have their work cut out for them trying to protect this persecuted big predator. Sullivan follows conservationists in southern Africa who are carefully managing tiny, isolated populations and attempting to introduce genetic diversity. The story of the three sisters who are flown over from Mozambique to be introduced to Waterberg—a South African municipality three hours from Johannesburg—is heart-wrenching. Yet in such a harsh environment, individual tragedies have to be endured while staying focused on the bigger picture: the fragile recovery of the species as a whole.</p>\n<blockquote>\n<p>As we help Greyling and Hlako lift a crate off the pickup, a dusty paw flops out of one corner, and I think of something my uncle says: “You can smell the world in a dog’s paw.” Mooney and I back away, watching from inside a container as Hlako moves the car so that the overheating dog is in the shade. Though it is late afternoon, the temperature is still around 90 degrees. </p>\n<p>Hlako and Greyling release the dogs one at a time, opening the crate and waiting until a dog walks, then trots, out. The first is less sure on her feet, the second seems almost normal, until Mooney points out that she would have run much faster from the crate and people had she not still been a bit dozy. The sisters stand together in a grassy area, point their noses in the air, move their satellite-dish ears and lie down under a thorn tree; it has been a long day. </p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on conservation \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/08/07/texas-red-wolves-coyotes-cloning/\" target=\"_blank\" rel=\"noopener\">Colossal Biosciences Said It Cloned Red Wolves. Is It for Real?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tBoyce Upholt | MIT Technology Review | April 20, 2026 | 5,106 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The red wolf has long been a contentious species. The debate over its preservation got even messier last year, when Colossal said it had cloned the animal.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/05/29/bunnies-rabbits-toronto/\" target=\"_blank\" rel=\"noopener\">Are There More Bunnies in Toronto?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tNicholas Hune-Brown | The Local | July 2, 2025 | 2,616 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“I never used to see rabbits in Toronto. Then they were everywhere. Then I lost my mind.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/03/31/deextinction-conservation-cryopreservation/\" target=\"_blank\" rel=\"noopener\">Reversing Extinction</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSadiah Qureshi | Aeon | March 12, 2026 | 3,186 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Technologies of preserving and reviving organisms are already redefining the meaning of life, death, and extinction itself.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/02/26/technology-ai-wildlife-conservation/\" target=\"_blank\" rel=\"noopener\">Why Conservationists Are Making Rhinos Radioactive</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMatthew Ponsford | MIT Technology Review | February 24, 2026 | 2,663 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Rapid DNA tests, x-ray fluorescence guns, and other technologies are being deployed in the fight against wildlife trafficking.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/02/11/ai-fake-images-wildlife/\" target=\"_blank\" rel=\"noopener\">Wildlife Attacks and Strange Animal Behavior—Fake Images Spark Conservation Concerns</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSean Mowbray | Mongabay | January 28, 2026 | 2,263 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“AI-generated images pose a direct threat to conservation efforts by distorting public perceptions of wildlife.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/01/26/great-barrief-reef-conservation/\" target=\"_blank\" rel=\"noopener\">An Exclusive Look Inside the Largest Effort Ever Mounted to Keep the Great Barrier Reef Alive</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tBenji Jones | Vox | January 21, 2206 |4,300 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Australia is doing absolutely everything to protect its most iconic ecosystem — except, perhaps, the one thing that really matters.”</p>"},{"title":"Solve a mountain mystery via the medium of creepy cards in Hillthorn, which has an excellent demo","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/solve-a-mountain-mystery-via-the-medium-of-creepy-cards-in-hillthorn-which-has-an-excellent-demo","category":"gaming","categoryLabel":"Gaming","wordCount":537,"readingTime":3,"content":"<p>Full game out in November</p>\n    \n  \n  \n  \n  \n            <p>Attention, dusty creeps who want to play poker with the Wickerman! I found one, a videogame you might enjoy. That game is Hillthorn, a spooky investigative cardgame from Fool Moon and Finnegan Motors - the latter also known for beaming corpo thriller <a href=\"https://store.steampowered.com/app/3379360/Inhuman_Resources_A_Literary_Machination/\" target=\"_blank\" rel=\"noopener\">Inhuman Resources: A Literary Machination</a>.</p>\n<p>Hillthorn is the story of a detective hired to investigate a disappearance at a secluded mountain community. One of the first things you do, after hassling a worryingly stained forest ranger for directions, is cross a line of salt on the trail. Seems like something a person familiar with the occult would avoid doing, but you are a Private Eye, armed with logic and cynicism. Besides, all of this is presented via the medium of cards. Who's afraid of cards? What are they going to do, give you a paper cut? Ouch! Oh, maybe don't bleed on the salt.</p>\n\n<p>Hillthorn works a bit like <a href=\"https://www.rockpapershotgun.com/games/cultist-simulator\" target=\"_blank\" rel=\"noopener\">Cultist Simulator</a> and <a href=\"https://www.rockpapershotgun.com/games/the-horror-at-highrook\" target=\"_blank\" rel=\"noopener\">The Horror At Highrook</a>. You've got some verb cards, like Talk, Search and Investigate, which you can pop into a slot in top left. This creates another slot or slots, into which you can plonk cards for things you want to address, travel to, or study. To initiate the action, you click the magnifying glass on the right – usefully, it shows a tick when you've already performed that action.</p><p>This produces more cards, dealt onto a tray and cautiously turned over. And so you continue, pulling more plot and omen from the deck, until you reach a milestone of some kind - \"why of course, I'll accept that contract to go look for your missing daughter on this evidently cursed mountain\" - that changes the scene and hands you a brand new deck. Some cards can't be used, serving as observations about the person, object or situation – \"Naive\", \"Anxious\", \"Typical\". I've yet to find a Running Away Screaming card but that's surely a possibility.</p>\n<p>The immediate beauty of the game is how the cards sketch out or intimate various unseen actions and relationships, sometimes hinting at an actual world represented by the deck – a world that looms behind you with Platonic menace, spilling sunlight and shadow across your shapeshifting worktable. You want to turn your head, but you can't. Some of the cards allude more explicitly to an engulfing 3D space. One of the early delights is a radio card, for example, which you can switch on and off. The radio has realistic audio, growing tinny when you drop it into the action slot.</p>\n<p>There are a few other items that carry over between scenes – a pocketwatch, used to advance time (PSA: Ranger man suggests you don't stay on the mountain after dark), and a journal that contains a few hints about goals, together with the Settings screen. It seems to be a more directed experience than other games in this genre, though much is left unspoken.</p>\n<p>Hillthorn has <a href=\"https://store.steampowered.com/app/3504050/Hillthorn/\" target=\"_blank\" rel=\"noopener\">a demo on Steam</a>, with the full game launching in November this year. If you like folk horror and you simply can't get through reading a terms of service without massacring some Conquerer Wyrms, <a href=\"https://www.rockpapershotgun.com/if-you-need-more-shakespeare-with-your-slay-the-spire-check-out-demon-lawyer-deckbuilder-the-killing-stone\" target=\"_blank\" rel=\"noopener\">you might also like The Killing Stone</a>.</p>"},{"title":"5 Years of the Journal of Free Speech Law, 150 Published Articles","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/25/5-years-of-the-journal-of-free-speech-law-150-published-articles/","category":"law","categoryLabel":"Law","wordCount":804,"readingTime":5,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/08/25/5-years-of-the-journal-of-free-speech-law-150-published-articles/\" target=\"_blank\" rel=\"noopener\">5 Years of the Journal of Free Speech Law, 150 Published Articles</a>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.25.2026 11:22 AM\n</p>\n\t</h2>\n\t\n\t\t<p>I'm pleased to report that it has been 5 years since the <em>Journal of Free Speech Law </em>published its first article, and since then we've published a total of 150. We've published some of the top people in the field from some of the top law schools, such as Geoffrey Stone (Chicago), Genevieve Lakier (Chicago), Jane Ginsburg (Columbia), Philip Hamburger (Columbia), Lee Bollinger (Columbia), Stuart Benjamin (Duke), Joseph Blocher (Duke), Mark Tushnet (Harvard), Andrew Koppelman (Northwestern), Jeremy Waldron (NYU), Cynthia Estlund (NYU), Christopher Yoo (Penn), Mark Lemley (Stanford), Danielle Citron (Virginia), Jack Balkin (Yale), and Robert Post (Yale),</p>\n<p>But we've also published professors from other law schools; professors from other disciplines; authors from other countries; and a few law students or fresh law school graduates whose articles have been accepted through our blind review process. The articles have been cited so far in 14 court cases, over 500 articles, and over 140 briefs. And note that all the articles have only had five years or less to attract these citations.</p>\n<p>We also publish quickly (by the standards of academic journals), if that's what authors would like. Several of our most recent articles, for instance, were published 3 to 5 months from when we received them, and that includes the time stemming from the authors revising their articles in various ways (which we certainly allow, if the author is willing to take the time). We have published articles as quickly as a month after we received them, when the author has wanted to move fast.</p>\n<p>To my knowledge, many top student-edited journals are shut down for the Fall and Winter (or are about to shut down), and won't review manuscripts until February. That means the manuscripts probably wouldn't be published until the end of 2027, or even later. But if you submit to us now, and want to publish quickly, you can have the article out by the end of 2026.</p>\n<p>There are other advantages as well: We offer anonymized feedback from the reviewers whether the article is accepted or rejected; many authors have told us this was very helpful. And when we accept article, it's edited by one of our Executive Editors (Jane Bambauer, Ash Bhagwat, or me), and many authors have likewise told us that the edits, by experienced free speech scholars, are quite useful.</p>\n<p>Please pass this along to friends or colleagues who you think might be interested. Note that the submissions don't compete for a limited number of slots in an issue or volume; we'll publish articles that satisfy our quality standards whenever we get them.</p>\n<p>All submissions <strong>must be exclusive to us</strong>, but, again, you'll have an answer within 14 days (though perhaps up to 21 days if it's over Thanksgiving, Christmas, or New Year's), so you'll be able to submit elsewhere if we say no. Please submit an anonymized draft, together with at <a href=\"https://freespeechlaw.scholasticahq.com/\" target=\"_blank\" rel=\"noopener\">https://freespeechlaw.scholasticahq.com/</a>. A few guidelines:</p>\n<ul>\n<li>Instead of a cover letter, please submit at most one page (and preferably just a paragraph or two) explaining how your article is novel. If there is a particular way of showing that (e.g., it's the first article to discuss how case X and doctrine Y interact), please let us know.</li>\n<li>Please submit articles single-spaced, in a proportionally spaced font.</li>\n<li>Please make sure that the Introduction quickly and clearly explains the main claims you are making.</li>\n<li>Please avoid extended background sections reciting familiar Supreme Court precedents or other well-known matters. We prefer articles that get right down to the novel material (if necessary, quickly explaining the necessary legal principles as they go).</li>\n<li>Each article should be as short as possible, and as long as necessary.</li>\n<li>Like everyone else, we like simple, clear, engaging writing.</li>\n<li>We are open to student-written work, and we evaluate it under the same standards applicable to work written by others.</li>\n</ul>\n<p>We publish:</p>\n<ol>\n<li>Articles that say something we don't already know.</li>\n<li>Articles with all sorts of approaches: doctrinal, theoretical, historical, empirical, or otherwise.</li>\n<li>Articles dealing with speech, press, assembly, petition, or expression more broadly.</li>\n<li>Generally not articles purely focused on the Free Exercise Clause or Establishment Clause, except if they also substantially discuss religious speech.</li>\n<li>Articles about the First Amendment, state constitutional free speech provisions, federal and state statutes, common-law rules, and regulations protecting or restricting speech, or private organizations' speech regulations.</li>\n<li>Articles about U.S. law, foreign law, comparative law, or international law.</li>\n<li>Both big, ambitious work and narrower material.</li>\n<li>Articles that are useful to the academy, to the bench, or to the bar (or if possible, to all three).</li>\n<li>Articles arguing for broader speech protection, narrower speech protection, or anything else.</li>\n</ol>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/25/justice-department-opines-that-federal-law-allows-carrying-guns-in-post-offices-for-self-defense/\" target=\"_blank\" rel=\"noopener\">NEXT: Justice Department Opines That Federal Law Allows Carrying Guns in Post Offices for Self-Defense</a>\n    </p>\n\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
