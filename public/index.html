*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {

.archive-link {

@media (max-width: 480px) {

<script>
var articles = [{"title":"Mothers and Fathers Experience Dramatically Different Health Consequences","source":"Nautilus","author":"","url":"https://nautil.us/mothers-and-fathers-experience-dramatically-different-health-consequences-1283211/","category":"fun","categoryLabel":"Interesting Reads","wordCount":518,"readingTime":3,"content":"<p>Motherhood takes a big toll on women, and not just the nine-month period spent growing another human being inside their bodies. After birth, women spend more time parenting their children and take on more of the cognitive load of planning and care. Now a study recently <a href=\"http://dx.doi.org/10.1080/13229400.2026/2662431\" target=\"_blank\" rel=\"noopener\">published</a> in the <em>Journal of Family Studies</em> finds their health, relative to their male partners, suffers accordingly.</p><p>Featured Video</p><p>To investigate how parenthood affects the health of men and women, sociologists from the University of the Basque Country turned to data from the European Health Survey in Spain, a periodic questionnaire that surveys the Spanish population about a variety of health indicators, both physical and psychological. They looked at how these measures—specifically psychological well-being, perception of health, exercise, and more—differed between mothers and fathers. They found a remarkable gender gap. </p><p>“It was observed that, in men, neither the fact of being a father, nor family characteristics, affected the health indicators,” study author Anna Barbuscia said in a statement. “All parameters remained practically the same.” </p><p>In other words, whether they had one child, several children, or no children, men’s physical and psychological health stayed the same.</p><p><strong>Read more: “<a href=\"https://nautil.us/the-pressure-moms-feel-to-solve-the-worlds-problems-1267221\" target=\"_blank\" rel=\"noopener\">The Pressure Moms Feel to Solve the World’s Problems</a>”</strong></p><p>Women’s questionnaire responses told a completely different story. The researchers found that women’s health varied according to the number and ages of their children. Moms living with just one child and moms living with adolescents seemed to suffer the most, with the highest levels of depressive symptoms and the lowest levels of self-reported health. According to the team, moms with just one child reporting poorer mental and physical health could be because that child is their first, and the transition to motherhood hits particularly hard.  </p><p>“Caring for younger children usually demands greater physical effort, which may result in increased tiredness and poorer quality sleep,” explained Barbuscia. “Adolescence, on the other hand, has traditionally been considered the most stressful phase for both mothers and fathers.” </p><p>The health habits of moms also suffered when they had kids. Only 16 percent of mothers with young kids exercised regularly, compared to 30 percent of childless women. Men’s exercise habits, on the other hand, were completely unaffected by fatherhood.</p><p>There was at least one bright(ish) spot for moms. Mothers of toddlers reported relatively favorable levels of health and mental well-being, which the researchers credited to the rewards of motherhood. “Although early childcare is physically demanding, it may also be accompanied by higher emotional rewards, potentially buffering its negative health effects,” they wrote. (Then again, mothers of toddlers might not like to learn they’re living through their healthiest time for some time.)</p><p>Per the team, these findings mean moms need a break to invest in their health, and policymakers should take that into account when designing family-friendly policies. Or as Barbuscia put it, “If we want to build healthy families and encourage people to have children, we need to start by ensuring that raising children doesn’t have such an unequal impact on men and women.” </p><p><em>Enjoying </em><a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free </em><a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead image: GarkushaArt / Adobe Stock</em></p>"},{"title":"Top Theragun Promo Codes: 15% Off in July 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/therabody-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1012,"readingTime":6,"content":"<p><strong>I don’t know</strong> if you’re like me, but one of my favorite ways to treat myself is with products that I know will help me better my body or ease any pain. Therabody has a slew of truly great products to help with everything from sore muscles, to aches and pains, and even has a full-on total body recliner, eyemasks to relieve headaches, and a LED skincare mask to keep you looking your best. Although these wellness products can be expensive, they are a truly invaluable way to keep yourself looking and feeling good (plus, this helps to avoid even more expensive hospital visits down the line). Not sure where to start? We have a <a href=\"https://www.wired.com/gallery/best-theragun-percussive-therapy-devices/\" target=\"_blank\" rel=\"noopener\">Therabody tools guide</a> to help you find which product is right for your needs.</p><h2>Unlock 15% Off Bestsellers With a Theragun Discount Code</h2><p>Been eyeing a trendy TheraFace Pro or popular Theragun Pro, but getting cold feet about the price? I have good news for you. You can get 10% off with a Therabody discount code when you <a href=\"https://www.therabody.com/us/en-us/first-order-email-signup/\" target=\"_blank\" rel=\"noopener\">sign up for email</a> and a 15% off coupon when you sign up for texts. First, input your information and sign up to receive emails. You’ll receive a discount code for 10% off in your inbox. Enter the discount code at checkout to receive 10% off, and watch the pri t combines red, near-infrared, and blue light therapy with gentle vibrations. Plus, it has a cordless, rechargeable design with an easy auto-cycle, and is FDA-cleared.</p><h2>Experience the Comfort of Thermback</h2><p>The <a href=\"https://www.therabody.com/products/thermback-led\" target=\"_blank\" rel=\"noopener\">Therabody ThermBack LED</a> is one of the newest innovations in the lineup, which is clinically proven to reduce lower back pain by using four advanced therapies, including LED, far-infrared, heat, and vibrations. These therapies work together to promote faster healing, improved mobility, and have customizable treatment options for quick relief. Although the Therabody ThermBack LED is not on sale very often, I’d check back during Therabody sales events for discounted pricing.</p><h2>Get 30% Off Therabody With Outlet Discounts</h2><p>If you’ve been wanting to try these health-forward trendy devices, but don’t know where to start, shop at the <a href=\"https://www.therabody.com/collections/therabody-outlet\" target=\"_blank\" rel=\"noopener\">Therabody Outlet</a>, where you can get huge discounts on certified refurbished devices. They also have tons of last chance offers on a select few iconic early gen devices. At the outlet, you can find discounts of up to 30% off, including certified refurbished products like the <a href=\"https://www.wired.com/gallery/best-theragun-percussive-therapy-devices\" target=\"_blank\" rel=\"noopener\">Theragun</a> Prime Plus, TheraFace, SmartGoggles, RecoveryAir Jetboots, RecoveryPlus sleeves, and more top bestsellers.</p><p>Great discounts on these bestselling wellness products include $120 off the TheraFace PRO, $200 off the TheraFace PRO Plus, $120 off the Theragun Prime Plus, and $200 off TheraFace Mask. As an added bonus, all of these machines come with a 30 day guarantee and a 1 year warranty when customers <a href=\"https://www.therabody.com/pages/product-registration\" target=\"_blank\" rel=\"noopener\">register</a> their product, for added peace of mind.</p><h2>Military, Students, Healthcare Discounts Can Get a Therabody Promo Code for up to 20%</h2><p>There are additional ways to save on Therabody products. You can even use your FSA/HSA card or dollars on some qualifying products. Military personnel, healthcare workers, and first responders all get a 20% off Therabody discount code; you’ll just need to verify your status through <a href=\"https://www.id.me/\" target=\"_blank\" rel=\"noopener\">ID.me</a> as an extra step in their checkout portal. Students and teachers also qualify for 10% off.</p><h2>10% Off TheraFace Mask Glo</h2><p>We at WIRED love <a href=\"https://www.wired.com/gallery/best-theragun-percussive-therapy-devices\" target=\"_blank\" rel=\"noopener\">Theraguns and Therabody devices</a>, and <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">LED masks</a>, for their ability to act as a restorative and regenerative tool for all sorts of body ailments. We think the upgraded TheraFace Mask Glo is a smart purchase if you’re in the market for a red light therapy mask with red, infrared, and blue light wavelengths, plus the signature vibration therapy that made the first-generation mask stand out. Treatment sessions range from four to 12 minutes, and we love the cordless design. Right now, you can get the TheraFace Mask Glo for 10% off when you sign up for Therabody’s email newsletter. But, as we track historical price changes and sales, oftentimes, if you wait until the TreaBody Black Friday Sale, you can get nearly up to 50% off the TheraFace Mask Glo and other best-selling tech.</p><h2>JetBoots PRO Plus Now Available at Therabody</h2><p>Therabody is known for their wellness devices, used for everything from relaxation to recovery in athletes. Their newest launch, the<a href=\"https://www.therabody.com/products/jetboots-pro-plus-regular\" target=\"_blank\" rel=\"noopener\">JetBoots PRO Plus</a> is no different. This new tech is the wireless leg compression boots to combine vibration, infrared LED light, and pneumatic compression to work together to reduce muscle soreness, swelling, and fatigue. Plus, it’s HSA/FSA accepted, TSA approved, FDA cleared, and has a one-year limited warranty and a 30-day return policy.</p>"},{"title":"Trump administration threatens school districts with enforcement action over transgender student policies","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/trump-administration-threatens-school-districts-with-enforcement-action-over-transgender-student-policies/","category":"law","categoryLabel":"Law","wordCount":536,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/trump-administration-threatens-school-districts-with-enforcement-action-over-transgender-student-policies/#\" target=\"_blank\" rel=\"noopener\">Trump administration threatens school districts with enforcement action over transgender student policies</a>\n</strong><p>The Trump administration <a href=\"https://www.ed.gov/about/news/press-release/trump-administration-cracks-down-school-districts-secretly-transitioning-students-and-hiding-it-parents\" target=\"_blank\" rel=\"noopener\">announced</a> on Monday that it will pursue enforcement action against a Maryland school district, and potentially taking similar action against a Michigan district, over policies governing the disclosure of transgender students’ information to their parents.</p><p>In commenting on this issue, US Assistant Attorney General for Civil Rights Harmeet Dhillon <a href=\"https://www.ed.gov/about/news/press-release/trump-administration-cracks-down-school-districts-secretly-transitioning-students-and-hiding-it-parents\" target=\"_blank\" rel=\"noopener\">said</a>:</p><blockquote><p>“School districts that hide information from parents are violating federal law. FERPA is not optional, and any districts that attempt to bypass or distort its requirements should expect immediate federal action. In partnership with the Department of Education, the Department of Justice will initiate enforcement proceedings with districts that fail to comply.”</p></blockquote><p>The US Department of Education alongside the US Department of Justice (DOJ) alleged that Anne Arundel County Public Schools in Maryland violated the Family Educational Rights and Privacy Act (FERPA) by concealing information from parents regarding their children’s gender transitions. The federal government enforcement action centers on several key findings, such as <a href=\"https://www.jurist.org/news/2026/04/trump-administration-rescinds-protections-for-transgender-and-gay-students-at-certain-school-districts-taft-college/\" target=\"_blank\" rel=\"noopener\">improper record classification</a> of a student’s gender identity as “confidential medical information” alongside a series of complaints by concerned parents who expressed frustration at being blocked by both the principal and assistant principal from accessing their child’s records. </p><p> It also determined that an <a href=\"https://michiganadvance.com/2026/07/27/education-department-opens-parental-rights-case-against-ann-arbor-schools-over-transgender-policy/\" target=\"_blank\" rel=\"noopener\">Ann Arbor Public Schools policy</a> in Michigan likely violates the law. The Department said that Anne Arundel could face judicial proceedings and the loss of federal funding.</p><p><a href=\"https://studentprivacy.ed.gov/ferpa\" target=\"_blank\" rel=\"noopener\">FERPA</a> gives parents the right to inspect and review their children’s education records and request amendments to records they believe are inaccurate or misleading. It also generally requires schools to obtain parental consent before disclosing personally identifiable information from those records, subject to certain exceptions.</p><p>The Education Department alleged that Anne Arundel County Public Schools improperly classified information about a student’s gender identity as “confidential medical information” that officials could withhold from the student’s parents. </p><p>According to the Department, the parents filed complaints after receiving an email that referred to their child using male pronouns. </p><p>Anne Arundel County Public Schools said Tuesday that it first learned about the allegations through the Education Department’s press release. The district said it had not received formal notice, findings, correspondence, or supporting documentation from the federal government.</p><p>The district said it will consult legal counsel and respond through the appropriate process after receiving the relevant materials, stressing that it takes their FERPA responsibilities seriously. </p><p>The Education Department separately challenged <a href=\"https://go.boarddocs.com/mi/aaps/Board.nsf/goto?id=AM2JMS4B8DCF&amp;open=\" target=\"_blank\" rel=\"noopener\">Ann Arbor Public Schools’ policy</a> addressing transgender and gender-nonconforming students. The policy generally directs employees not to disclose information that may reveal a student’s transgender status, including to parents or guardians, unless disclosure is <a href=\"https://aacpsschools.org/aacpsboardpolicies/wp-content/uploads/2023/11/FINAL-JQ-RA-Safe-and-Inclusive-Environments-2023.pdf\" target=\"_blank\" rel=\"noopener\">legally required</a> or authorized by the student.</p><p>The policy also directs schools to update education records to reflect a student’s chosen name and gender markers. It requires schools to keep records containing the student’s birth name and gender in a separate confidential file. The Department alleged that these provisions interfere with parents’ rights under FERPA. Ann Arbor Public Schools had not publicly responded as of Tuesday.</p><p>Anne Arundel County Public Schools is awaiting formal documentation before responding. Ann Arbor Public Schools has until August 10 to explain why the administration should not move forward with enforcement.</p>"},{"title":"Blizzard fire World Of Warcraft developer over use of forbidden magicks to insta-kill bosses for regular players during dungeon run","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/blizzard-fire-world-of-warcraft-developer-over-use-of-forbidden-magicks-to-insta-kill-bosses-for-regular-players-during-dungeon-run","category":"gaming","categoryLabel":"Gaming","wordCount":575,"readingTime":3,"content":"<p>\"We are also taking action against the player accounts that were complicit\"</p>\n    \n  \n  \n  \n  \n            <p><a href=\"https://www.rockpapershotgun.com/games/world-of-warcraft\" target=\"_blank\" rel=\"noopener\">World of Warcraft</a> studio Blizzard have announced that they've fired a developer after development-only spells were used to insta-kill some Mythic+ dungeon bosses for a party of non-dev adventurers. The studio will also be \"taking action against the player accounts that were complicit in this violation\", which was unearthed by some combat log sleuths.</p>\n<p>According to said <a href=\"https://www.reddit.com/r/wow/comments/1v2xfpr/blizzard_gm_death_touching_mobs_in_m23_for_their/\" target=\"_blank\" rel=\"noopener\">logs</a>, the run saw a spell named \"Area Death (TEST)\" used to quickly splatter a big baddie who had a tonne of health left. Cue widespread controversy that a Blizzard staffer spectating the live game as a game master (GM) had seemingly used the powers that post bequeaths to help the party of players cheat in a way that'll get your dungeon run disqualified from sites which record clear times, if nothing else.</p>\n<p>Blizzard, however, have decided that more action than that is necessary after investigating what happened. \"As we mentioned, we internally monitored and confirmed a recent incident in which a World of Warcraft group gained an unfair advantage by abuse of access to development-only spells on a live realm,\" community manager Kaivax wrote in a post outlining Blizzard's response. \"Our tools confirmed what was also surfaced in community discussions, and we have investigated the incident carefully. We can confirm that this was the action of a single Blizzard employee, in violation of our Code of Conduct. This employee is no longer with the company effective immediately. We are also taking action against the player accounts that were complicit in this violation.</p>\n<p>\"It has always been the case that a small number of Blizzard employees can use developer tools and spells on live servers: this lets us test and make urgent fixes to the live game when they’re needed,\" they continued. \"Every use of these internal spells and commands on live realms is logged and shared with our Platform Security team to help ensure that the occasional use of this access is warranted. The use of development tools for anything other than development work is against company policy. It’s because of the process we have in place around use of these tools that we’re confident this incident was isolated to one individual.\"</p><p>So yeah, if you've got a mate who works at Blizzard, maybe don't ask them to help you defeat big baddies if you're keen not to see them lose their livelihood. As someone who knows some things about WOW, but isn't a big Warcrafter, the response seems maybe a bit harsh, even if it is a fair cop. This is just a video game, after all. Then again, I'm very aware WOW's one of those online games that people actively pour their entire lives into being good at and earning stuff in, so this is a substantially different kettle of fish to, for example, handing a mate your controller when you reach <a href=\"https://www.rockpapershotgun.com/elden-ring-malenia-walkthrough\" target=\"_blank\" rel=\"noopener\">Malenia</a> in <a href=\"https://www.rockpapershotgun.com/elden-ring-boss-locations\" target=\"_blank\" rel=\"noopener\">Elden Ring</a>.</p>\n<p>Making the story even more surreal is the fact Blizzard owners Microsoft have just <a href=\"https://www.rockpapershotgun.com/xbox-are-parting-ways-with-double-fine-arkane-undead-labs-compulsion-and-ninja-theory-in-the-course-of-thousands-of-layoffs\" target=\"_blank\" rel=\"noopener\">let go thousands of developers</a> who hadn't - to our current knowledge - dabbled with forbidden hexes to stop players meeting grisly ends at the hands of in-game threats, giving this dev a very unique 'I got let go by MS in July 2026' story to tell. Insert joke about wishing there were hexes that could be deployed to combat execs bringing down the layoff hammer on squads of plucky devs.</p>"}];
