<script>
var articles = [{"title":"Onimusha: Way of the Sword's bad guy has 'an edge of eroticism', confirms Capcom dev","source":"PC Gamer","author":"Robert Jones","url":"https://www.pcgamer.com/games/action/onimusha-way-of-the-swords-bad-guy-has-an-edge-of-eroticism-confirms-capcom-dev-hes-very-alluring-in-the-way-that-he-moves/","category":"gaming","categoryLabel":"Gaming","wordCount":761,"readingTime":4,"content":"<p>How Onimusha: Way of the Sword blends Japanese history with dark fantasy | Exclusive preview - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/pIHYi-jktpk\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>As you can see in the above video, I recently travelled to Osaka, Japan, to go inside Capcom's headquarters and play its upcoming action game, <a href=\"https://www.pcgamer.com/onimusha-way-of-the-sword/\" target=\"_blank\" rel=\"noopener\">Onimusha: Way of the Sword</a>, as well as talk to many of the lead devs who have worked on it.</p><p>And, as part of my developer interviews, I spoke with Art Director Hiroyuki Nara about the character design of Onimusha: Way of the Sword's bad guy, Sasaki Ganryu, who made a memorable appearance in the game's publicly released demo.</p><p>Sasaki Ganryu, like the game's hero, Miyamoto Musashi, is based on a real-world Japanese sword master who fought during Japan's Edo period. However, as with Musashi, Capcom has put its own spin on these fierce rivals. But how did the devs go about designing them?</p><p>When it came to designing Sasaki, Nara explains, \"there's been some depictions of him in other fiction, but it's not something that we really consciously thought of when designing him [in Way of the Sword]. In this case, it was more a case that we wanted to create a character that would be a very strong contrast to Miyamoto Musashi. They both come into this game in this world with the same goal. They both want to be the best they ever was in terms of swordsmanship, but their way of thinking and their way of approaching life and things are very, very different.</p><p>\"So that's something that's depicted very clearly in the way that they dress quite differently. Sasaki is very conscious of style and of people, how people see him and perceive him, whereas obviously Musashi is not quite on that wavelength. So we wanted to depict that clearly in the way that they dress, and he does have these elements of being quite cocky. [Sasaki] thinks that he's this naturally gifted swordsman. He's better than Musashi, so that's something as well that we wanted to kind of give away and kind of flashy nature.\"</p><p>As anyone who has played the Way of the Sword demo will know, Sasaki is very much Musashi's direct opposite in terms of looks, movements, and combat style. Whereas Musashi looks rough around the edges, dressed in humble, raggedy garb, Sasaki has the air of an aristocrat about him, with fancy, bright clothes and accessories. And whereas Musashi's combat style is based on power, with strong, wild swings of his katana, Sasaki's is very smooth and elegant, with slick, snake-like movements. I ask Nara about Sasaki's movements, and I get a surprising but, in retrospect, spot-on response in how the devs went about designing them.</p><p>\"We want to have a really clear contrast between the way he moves and the way Musashi moves. So whereas Musashi's movements are quite wild and kind of rough and kind of powerful, Ganyu's movements are quite refined, but also they have an edge of eroticism to them. They're very alluring in the way that he moves. So that's definitely something that we were thinking about when they cast the motion actor for the role, and seeing those auditions and the person that was on screen and the way they were moving.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Want to see just how erotic Sasaki's movements and combat style are? The demo for Onimusha: Way of the Sword is available to download now (you c <p>[Meeks] asserts that posting a video rant about his ex-wife was protected speech under the First Amendment and that the stalking statute cannot be used to prosecute him for posting it. The State responds that his prosecution is not based upon the content of his message, but rather on the act of posting it on YouTube, and that such conduct integral to criminal activity enjoys no First Amendment protection. This is an interesting constitutional question, but one we need not settle in this case[, because] … the evidence is insufficient to sustain his conviction ….</p>\n<p>This case involves a nearly 40-minute YouTube video posted by Meeks in May 2023 { titled \"one_reason_men_shouldn't_get_married\"} that was forwarded to his ex-wife by her boss…. [In the] video, Meeks referred to [his ex-wife] and her children by name multiple times but made no threats. Nevertheless, she testified that Meeks \"said horrible things about our children\" and that she felt threatened, intimidated, and harassed….</p>\n<p>{Oklahoma's anti-stalking statute provides in pertinent part:</p></blockquote>\n<blockquote>\n<blockquote><p>… Any person who willfully, maliciously, and repeatedly … harasses another person in a manner that:</p>\n<ol>\n<li>Would cause a reasonable person or a member of the immediate family of that person … to feel frightened, intimidated, threatened, harassed, or molested; and</li>\n<li>Actually causes the person being followed or harassed to feel terrorized, frightened, intimidated, threatened, harassed, or molested, … [is] guilty of the crime of stalking ….</li>\n</ol>\n</blockquote>\n<p>\"Harasses\" [is defined] as a \"pattern or course of conduct directed toward another individual that includes, but is not limited to, repeated or continuing unconsented contact, that would cause a reasonable person to suffer emotional distress, and that actually causes emotional distress to the victim.\"}</p>\n<p>Meeks's post was undeniably <em>about</em> his ex-wife, and we are not indifferent to the embarrassment and harmful emotional toll being the subject of a spiteful rant concerning one's personal life can have, especially in such a public forum as YouTube. It does not necessarily follow, however, that the offending post in this case was <em>directed toward</em> Meeks's ex-wife and this case illustrates that difference…. \"Directed toward\" is commonly understood to mean intended for or meant for a particular person… \"[A]bout,\" on the other hand, generally means on the subject of or concerning….</p>\n<p>Meeks posted the subject video on a personal YouTube channel. There was no evidence he made any attempt to share the video with his ex-wife, i.e., he neither tagged her nor sent it to her. No evidence showed he made her aware of its existence and she acknowledged she had had no direct contact with or had spoken to Meeks for years. According to Meeks's ex-wife, she found out about the video when her boss sent her a link to it, and she made the decision to view its content of her own accord. No evidence suggested Meeks sent the video to her boss or had anything to do with her boss's discovery of the video.</p>\n<p>Meeks's statements in the video also support the finding that the video was not directed toward his ex-wife. Meeks begins the video with a caveat for any police officers watching that he is exercising his constitutional rights. He then explains to any police officers or \"jury members\" listening that he will be reading a letter he had written to the judge who presided over his protective order hearing. Though the letter was addressed to that judge, he states it is also meant for all the judges in Bryan County \"because maybe y'all need to pay attention to what's going on in y'all's county.\"</p>\n<p>As Meeks reads the letter, he goes off script into tangents, talking about his ex-wife in unflattering ways. In closing, he reminds his viewers that he is simply exercising his constitutional rights in \"reporting my news.\" He says to them, \"Love y'all. Everybody have a good night. I'm sorry I'm missing my daughter. I'm a little drunk tonight.\"</p>\n<p>He concludes, noting the people in his life must put up with him talking constantly about his victimization and observing that having one's child removed from their life, in his view, is worse than being raped. He ends, telling his audience again, \"Love y'all. Have a good night. Bye.\"</p>\n<p>Meeks's post on YouTube was his way of airing his grievances with those involved in what he perceives as the unjust taking away of his daughter rather than harassing his ex-wife…. The anti-stalking law is designed to shield a person from unwanted conduct directed toward them, meaning intended for their intake, and not to censor someone from randomly talking negatively about a private third party to others. In other words, \"directed toward\" limits communication <em>to</em> a person, not communication <em>about</em> a person.</p>\n<p>{Although we do not today decide the constitutional question, we are mindful that a broader interpretation of the phrase \"directed toward\" could implicate First Amendment concerns…. [S]tatutes criminalizing pure speech \"must be interpreted with the commands of the First Amendment clearly in mind.\" …} …</p>\n<p>[T]he evidence showed a purportedly jilted ex-husband engaging in a drunken rant to an internet audience about his failed marriage and custody situation. Admittedly, he crudely explains his ex-wife's relationship history with him and other men to express his feelings of betrayal by her and the legal system. He is emphatic that he will forever call out the injustice inflicted upon him by his ex-wife and the legal system.</p>\n<p>This scenario in today's world is somewhat akin to the frustrated, drunken bar patron venting to everyone in the vicinity of his voice about the fallout from a bad romance and divorce. Unfortunately, doing so on social media platforms often has a far more widespread audience…. [But] Meeks's conduct did not constitute harassment because it was not directed toward his ex-wife….</p></blockquote>\n<p>James Thornley represents Meeks.</p>"},{"title":"When “Get Lucky” Took Me Back to the Years of Disco","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/songs-of-summer/when-get-lucky-took-me-back-to-the-years-of-disco","category":"fun","categoryLabel":"Interesting Reads","wordCount":859,"readingTime":5,"content":"<p>When I first heard “Get Lucky,” by Daft Punk, in the summer of 2013, I was completely, pleasantly disoriented by it. It was new and shiny, but at the same time it instantly threw me back to the late nineteen-seventies, when I was young and dancing was my creed, my drug, my exercise program, and my major means of self-expression. Unlike the other kinds of music I was taking in at that time, disco was the sound of the whole city. It was what all the hot radio stations were playing, what was pumping from boom boxes and car radios. It joined me to all five boroughs, to the people I saw on the subway and on the street. It was the soundtrack to fall, winter, and spring, but summer was its peak season. It gave a pulse to the hottest, most listless summer days and propelled sweat-soaked nights in smoke-filled, underventilated clubs.</p><p>“Get Lucky” sounded exactly like my memories, only more so. The first time I heard it I may have actually burst into tears—I know I did that at least once, because the song brought back so vividly that promise of love, the thing that got me out the door nearly every night in those days. I was a sadly deluded romantic; I was up all night to get lucky, although I seldom succeeded because I was shy and confused and thought I had to be someone other than who I was. “Get Lucky”—with Nile Rodgers’s backbone guitar and Pharrell Williams’s silken vocals and the era-specific sound of analog keyboards—was uncannily evocative, somehow more than a pastiche. I was there, on tenement rooftops and in cellar clubs, in unimproved lofts and in the back rooms of bars. The way you can tell that the song came out about thirty-five years later than that—besides its sophisticated production, of course—is that it is romantic in a way that no one would have allowed themselves to be then.</p><p>New York City during the Carter Administration was a tough place that was all about fronting. Hip-hop was just getting going then, and fronting appeared to be its principal subject matter and style. “Fronting,” in music, meant the verbal application of all the layers of psychic armor the urban citizen needs to face the world. A great deal of disco was instructional, some was soft-core, much was nearly wordless—it generally evaded the more complicated emotions, because those would be the antonym to fronting. But while musing thus I remembered “<a href=\"https://open.spotify.com/track/238ktHqrZJtfyoF1xcvfSR?si=0161434e5f4f4f4f\" target=\"_blank\" rel=\"noopener\">There but for the Grace of God Go I</a>,” by the New York disco band Machine, from the summer of 1979. I hadn’t heard it in a few decades and thought it might be roughly the same b.p.m. as “Get Lucky.” Not so; it is so fast that you realize at once the intensity gap between the eras. “Get Lucky” (a hundred and sixteen b.p.m.) is loose-jointed; the Machine single (around a hundred and thirty) is a tightly coiled spring. Also, it is blazing with fury.</p><p>There was not a lot of social-realist disco, and certainly nothing else as powerful as “There but for the Grace of God Go I,” a regional hit (it only made it to No. 77 on the national <em>Billboard</em> Hot 100 chart), co-written by August Darnell, who would go on to lead Kid Creole and the Coconuts. The story concerns upwardly mobile Carlo and Carmen Vidal, who for the sake of their newborn daughter relocate from the Bronx to “somewhere far away / With no Blacks, no Jews, and no gays.” But their expectations are thwarted when the girl, like Lou Reed’s Jenny in “Rock ’n’ Roll,” turns out to be “a natural freak,” alive to the sounds. When she finally gets back to the city, though, it doesn’t go well. There’s a guy involved; “too much love is worse than none at all.” But we elided that punitive ending. What we heard instead was an angry denunciation of suburbia, our collective nemesis, where all the money seemed to be at the time and where some of us had come from. It was a proud urban anthem, with a steady aerobic pulse, announcing to the world that New York City was all about its Blacks, its Jews, and its gays.</p><p>“There but for the Grace of God Go I” didn’t have many peers at the time, but it sounds utterly like 1979. Its righteousness and defiance; its relentless forward motion; its assumption of a common social struggle are all native to that last year before Ronald Reagan. “Get Lucky,” by contrast, is a product of the Obama years, and it is almost shockingly relaxed and self-confident. The people of 1979 would not have been capable of Williams’s swoop from chuckling-conversational to soaring-passionate; they would have checked their emotions in some tighter range for protection. “Get Lucky” may be about taking romantic chances, but it is also triumphal: “We’ve come too far to give up who we are / So let’s raise the bar and our cups to the stars.” Maybe we’re now on the lip of a moment when we’ll be able to say that again.</p>"}];
