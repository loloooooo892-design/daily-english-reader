*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

.container {

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {

  font-size: 0.6875rem;

  letter-spacing: 0.06em;

  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {

}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

.swap-bar {

  display: flex;

  gap: 0.5rem;
}

  background: var(--swap-bg);

  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;

  letter-spacing: 0.01em;
}

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {

  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {

.article-body h2, .article-body h3, .article-body h4 {

}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body ul, .article-body ol {

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;

}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

<script>
var articles = [{"title":"Five Books for Lingerie Lovers","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/five-books-for-lingerie-lovers","category":"fun","categoryLabel":"Interesting Reads","wordCount":1364,"readingTime":7,"content":"<p><strong>When Jennifer Wilson set out</strong> <strong>to,</strong> in her words, “investigate the political implications of cleavage,” for a piece in this week’s issue about <a href=\"https://www.newyorker.com/magazine/2026/09/14/have-conservatives-taken-sexy-back\" target=\"_blank\" rel=\"noopener\">how conservatives are trying to take sexy back</a>, she didn’t realize how few women know their actual bra size. “That’s incredible to me, given how much space in the cultural imagination boobs occupy,” she told me. In the course of her reporting, she sampled a new size herself at Agent Provocateur, helped by the co-founder of <em>Evie</em>—a magazine that imagines itself “the conservative <em>Cosmo</em>”—who later sent her a lacey balconette push-up. “I didn’t know what to make of the fact,” Wilson writes, “that the only person who had ever gifted me lingerie was the editor of a magazine that had just published an article titled ‘Dear Men, Please Stop Drinking Beer. It’s Making You Effeminate and Infertile.’ ”</p><p>Wilson also watched Sydney Sweeney sing Garth Brooks’s “Friends in Low Places” at a pop-up event for her intimates brand SYRN, at Stagecoach (a.k.a. “Trumpchella”), and travelled to Bologna, Italy, to meet the seamstresses of La Perla (known as <em>le perline</em>, or “the little pearls”) who took to the streets to save their jobs. Mostly, she read <em>a lot</em> about lingerie.</p><p>Here is Jennifer Wilson’s annotated selection of her favorite books on the subject of undergarments.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/ABAm9JTY78wqgNZdgeksxGGb1VoiKqas6brTAbzpGXMcjtZWZQXLunGzhtNYCoggp2a2osSqMEzNtsVBYTe9QAVv2SHtuoa3p2T9BP5bbx2m8BA6aMyD7MLQBjetpJYByFEpKyJFZqTsaHSfbdfpZt3syuqmpBCeCCe5q7f9athjWhS7Bv4oB6Dzq9yRb9nC1xFzCCnraxp46Cy6fwZ13VUmBDWq2AsaNSUyTyNa2d5qMxbTuRPY6QSVva2REfBMtkdpZFfNe3k7qpoaV2xjE7Fm7zE5PKh6kdhC5MQpPVgUTg5Fe34nKd44qDFNAEVGs6Gagv56kuUuWNZQ\" target=\"_blank\" rel=\"noopener\">Cold Comfort Farm</a>,” by Stella Gibbons</strong></p><p>I watched the movie adaptation of Gibbons’s 1932 comic novel when I was a tween. Rufus Sewell as Seth Starkadder, a sweaty, primitive, insatiable farmhand with a secret intellectual passion for cinema, left a, let’s say, lasting impression. A sendup of “loam and lovechild” rural melodramas, the book follows Flora Poste, in from London to tidy up the messes made by her country relatives’ savage libidos. Her city friends are no saints themselves, though. One collects bras, at the time a newish terrain of underwear; her suitors are fittingly nicknamed “pioneers.”</p><p><strong>“<a href=\"https://cna.st/affiliate-link/BzWhgJVfGnET1Tm7v99pwRtm6zUrT1fX6hcLeJxDfMQqgUN7RLUAmuY7y53yN2h33oyV9kTVCDNEQENhVbfiwwAw4rmo4dJ6aFuRXTK7EULwSfTa95fyEAvC7SPEguJXsaf3vomT5vjzDrHJuVBL5h4Qxn1D6TZQ2gRydvNPTP7PVZLPjsUsw4WzruQKw44aiyTfcNUPnKXcZAoPCN4p6vyEc9RkES3u9bejA54vM8YR8an7MdiiDPymzHQ4U31YoyhewmzTXK2Qv9mMAM3nq9B4GFZDAKJroiTTDLH3tbY4mRwVABzC68xQXq4oyrbj8wiC2DnijVihmRhWEq7Y6bCNbQddH7niYtUogAk3g8oUWN\" target=\"_blank\" rel=\"noopener\">The Erotic History of Advertising</a>,” by Tom Reichert</strong></p><p>It’s often said that sex sells, but has anyone actually seen an earnings statement? Here, Reichert provides one. The book covers a hundred and fifty years of steamy advertising campaigns for everyday items from coffee (in one ad, from 1876, a woman’s hands are so occupied by her piping hot beverage that her robe starts to slip off) to mouthwash (the phrase “Always the bridesmaid, never the bride” was originally a Listerine ad)—and, of course, underwear. I learned that beefcake-y boxer-brief ads didn’t start with the likes of Marky Mark in his Calvins but with Jockey, which, in 1978, hired the Baltimore Orioles pitcher Jim Palmer to model a pair. “Women buy 70% of men’s underwear,” the company’s C.E.O. told <em>Fortune</em>.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/97eqTt3vVpVUL4DFvYgQ6qDksBTYAg8skFZEtnEbvkjK8wGeRvvnq7Ujmzm7SsW689eiBdkQqJGSGZ8vyDFBZBzT3WXzK3wDCzV98636dMFRqYcrqPqwAHd6hqELbM4ADwbfCnZkXgFyzsbmiLs8nuf7QUMWHkZdufcJWQ58UBcdqcT914GaB6ZF6MbR3R2D1N4225M6grsmH8sXBvSDe5Ai9tMriparZiuq2Srzem1d8DqpoNvSfcAXusQxgvmRr5nz3LkLp2jsaVm7qEb9JsvQkdNZSYWFqNjMGoGMc29Vygmavyhgb1BdbAAdLSPYcSmChmbWvQuukP3e6an5HsQ7BokVRLHNLm3UhRR1oRfRZGmzVmatJSwbG\" target=\"_blank\" rel=\"noopener\">Selling Sexy: Victoria’s Secret and the Unraveling of an American Icon</a>,” by Lauren Sherman and Chantal Fernandez</strong></p><p>It turns out that the only thing more chaotic than Victoria’s Secret’s panty aisle during a ten-for-forty-dollars sale might be the corporation itself. This book is well stocked with juicy intel. My favorite part is the “mini-memoir” of the fictional Victoria that the company’s owner, Les Wexner, had commissioned in the nineties: Victoria Stewart-White gets her business acumen from her father, a “wry but quiet English financier”; her first lingerie shop becomes the “toast of London” after it’s frequented by her friends, as “all her friends are models”; and she marries a barrister and vacations in St. Barth’s, where she sunbathes topless (ironic, given the popularity of the brand’s swimwear).</p><p><strong>“<a href=\"https://cna.st/affiliate-link/8R1h8mj7jPeedMvbkfLCDtXVyrsc3LHGggMgRm66RqxGtfzMo9bgB9jTqRr6ASy3RaKWYUHvMGd6D8Dc1wYgp7jGDh1SJbXc5rHGBp39L6LAHakzMA3WTUYfLsNt34TBfgdZND8A78x6s98ZaeKZrkrGEzMrPxUvjERcXi5CFkP8RZ13NfJUK92kkxUotRi9XAdaqJvVURv5Jkg8DN4zbXfAjuUdBBrrZ6TJiHJD1Wvx2WgTdhi3uAk7WDaUcwhAP4DzxakBFiePibmpAKpbwRCYqFhPCRaC97z2VBDX5GHfNQ7dFPZdmacGVoVgy1aDbNg1zokKJ46LffhYVzjrSBQixgCuuCKWTSPDa4UAUA\" target=\"_blank\" rel=\"noopener\">In Intimate Detail: How to Choose, Wear, and Love Lingerie</a>,” by Cora Harrington</strong></p><p>According to one survey, eighty per cent of women wear the wrong bra size. As I learned, I was among them. Harrington, who for fourteen years ran the popular blog the Lingerie Addict, will teach you in this book how to measure yourself at home, alongside other handy tips. Fingernails always snagging your pantyhose as you put them on? It turns out, there’s such a thing as “hosiery gloves.”</p><p><strong>“<a href=\"https://cna.st/affiliate-link/3GxwCCDhdURytzg5t6LFpT6bmpWzjMjyPbEAuQMfvhgHUTTh5Y1e6PRwa1NvG6HctsB4QoaeWhntjRDV9vstYj1sNsmdRLPTjLPJK45hLxVfb4MWhNjo9Urrh8NgLiZB3J3ZBVWPoXmuPqtuFfScM5ZfS1mpWcuN4s6CP4b9ETRj42rqyduNjY6mYviEx3iTcArSV1kyiM7fLL7kJgMBrevuyWnP8tNTB3BfTJVdwWjeDrx6WCa3TkmPo2BdbZtSCu7SGMei4Ng5Jp5fu3cGe5qXxcDNaJgB67x24difYoi69C3U8CqppxN4XnpxmyJzHwwK6Yif2gFpe2yByP1XnmrokranmG\" target=\"_blank\" rel=\"noopener\">Bridget Jones’s Diary: Mad About the Boy</a>,” by Helen Fielding</strong></p><p>That famous scene from the first movie, of Renée Zellweger deciding between “sexy knickers” and fat-sucking “granny panties” ahead of a romantic rendezvous with her boss (Hugh Grant), isn’t in Fielding’s novel. However, in this later installment, Jones, a widow, is back on the market again. A friend urges her to buy a black slip from La Perla, teasing, “I think, when you were last doing this, they were called ‘petticoats.’ ” These days, “clean girl” underwear brands like Cou Cou Intimates are selling racier versions of the granny panty, rebranded as the “French brief.” I procured a pair at the company’s eco-feminist-themed summer pop-up. Who says women can’t have it all?</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Everybody’s talking about:</strong></p><blockquote><ul><li>“<a href=\"https://cna.st/affiliate-link/MAg6NTLYhSzj8ZAXb9H8pcf1ki7qkUyyhh396cJxGtSGpaQmBDbWJvtvZVaecWw76ZMZ8VXgEBLDu7wawfK8Fk8DLRv9qkQBtogDcuJscjBZr6PSUL1GjM6AdW9YRHP5Crpatx7ZBHMpj75WQtKuKzNrHA8rzhc1dkgnLL6DmHjkDmsCo79QDXNsEkyimH8G51r4FHwa9dyQ4jcGTStMg8HQi8MbjJfqqGHs4eXcRHiLj6UqQ2yQoWnkP5kETHjscEF8HZmq98z1aiwX5mh3mVoE3LSKuz4VTnuvPqHSNG5YjrYYzq5B6gi9Ye8ESLsaQQEjMp62kVkhp2s4QrxyUABL\" target=\"_blank\" rel=\"noopener\">Switzy</a>,” by Emma Cline. The Booker Prize-nominated novel was released just yesterday, but it’s already the talk of the literati. Our books editor Namara Smith says that “Cline specializes in lonely people on the margins in glamorous but hostile social worlds—in ‘Switzy,’ it’s David, a former executive en route to a euthanasia clinic in Zurich, in a jet borrowed from his ex-boss and not-quite-friend. As the book goes on and David’s defenses are stripped away, Cline builds up an exquisitely detailed portrait of an unfulfilled life.”</li></ul></blockquote><blockquote><ul><li>“<a href=\"https://cna.st/affiliate-link/3GxwCCDhdURytzg5t6LFpT6bmpWzjMjyPbEAuQMfvhgHUTTh5Y1e6PRwa1NvG6HctsB4QoaeWhntjRDVEXxsAx5o1Zm9DruKj9M1uKD5FK9gMUQEQNfboi37DTYAjvJ1KxwCqFVr8FKdGCdFi5E4hTA7o2WjAmGFEwAxceVPFKN1McYUPHeyAAte1KNxb5fNY1oz4pCwc7CtTaiLtXemapdbaD25vSLxAsZEFBYi63itkyz7KqM6vic4dJ9MkzHYkdHz9HiCcpeDFmRaLcU6P8kossqz1kY6drNtWAwcpsVA4GDKA51xbyKeQZMvoWPEPMykS6GGPgCRCMui6G1wTTP5diZ1Qn\" target=\"_blank\" rel=\"noopener\">Fruit Fly</a>,” by Josh Silver. <em>New York</em> magazine’s Book Gossip newsletter posited that this novel, which has now been optioned by A24, was the “sleeper hit of the summer.” It’s about a writer who goes to great, ethically dubious lengths to cure her block.</li></ul></blockquote><p><strong>The staff writer Jill Lepore is loathing:</strong></p><blockquote><p>I miss old-fashioned spam. “Readers keep mentioning the donkey with strong opinions,” read an e-mail I got this morning, at 9:12 A.M., peak e-mail-checking hour. That’s already a red flag, but, then again, the e-mail wasn’t the kind of sus you need to put Pangram on: it was nothing but tells.</p></blockquote><blockquote><p>Every day and all day long, I, like every other writer or aspiring writer, get some version of this A.I. crap—e-mails purporting to be from readers and book clubs and publicists and authors and publishers and literary agents and podcast hosts, messages that offer the one thing all writers pant for: readers. “What immediately caught my attention,” they’ll begin. Or “What really stood out for me.” <em>A reader! A reader! A reader!</em> a quiet voice says inside. But, no, it’s a machine.</p></blockquote><blockquote><p>“I’m Sophia Bennett, a book marketer who works with fantasy and romance authors on reader discoverability,” this morning’s correspondence read, mistaking me for the author of a queer medieval swordplay romantasy novel called “Daggermouth” that, I gather, involves a talking jackass. The Jane Austen-coded Ms. Bennett provided me with market analysis, and proposed putting together a “short visibility audit.” But, hey, “no pressure.”</p></blockquote><blockquote><p>Who says reading is dead? The machines are reading everything, all the time. “What got me wasn’t simply that you wrote about artificial intelligence,” read an e-mail I received last night from “Fanny R. Hafford” (very Richardsonian!), offering to help promote my new book, “<a href=\"https://cna.st/affiliate-link/Wu6UuqeJKuLEbN6BfpQkNmmaiaXkahYooixG3aEMKjS2gyoEiTszrwb7aAVqH9kUcPDZ8P896AVVBvadzxpqZsMSz5GUXuo7frCCbizEnLvRAaAFncquHRnwWdDUP1xR5grGZfUSh2ZvKc5EVVH1WLb9VJja6bXP2SmAduaX373EZksK6SN39E7hyjcEuZ1FkRQV5W9cm8HxiPrJvt81pm4YiQwscZPWfcExruzscGMkV1Zgrrpia8voFzJPkW5o27o3tcVu3MVCoQxK4otKjscWxB4Uc97UATwDeWcDzi1ewvTJVnTNWRoGcj1JrWNsAwWrTXv9tddvUp3hbSTyyAXqLXZ4\" target=\"_blank\" rel=\"noopener\">The Rise and Fall of the Artificial State</a>.” “It’s that you place AI within a much larger history of power, democracy, and the gradual reshaping of human life.” The book is an extended argument against replacing humans with machines. “The urgency of the argument certainly gives readers plenty to think about,” Fanny wrote. Not to mention the donkey with strong opinions.</p></blockquote><p><strong>Coming soon:</strong></p><blockquote><ul><li>Kate Atkinson has a new novel coming out tomorrow. “<a href=\"https://cna.st/affiliate-link/DRqZQmpTgrbgHKjEbn6dA5ZzUXrCRuXFBPeAwpc9ZiScQxL3FnPZjdGKZ7UQLKS6anez1mhq6u3ZeDSPH2kpJe8sVRkn9S1gKk4Ws7x56vHQCD79FXmgZizwzUDy7NHJpdnzp2opw9oDas3F6DaFho4GoyJFtytSneg3jbtLWr2xPzRq8iXWnEU8s2BGZqyTZy5bkmBkGaHXBq9rQxwCvPTQo9VjrfsBvnszsZ75htJz2gT5smdQd9BaxxDTFCax23oTrzgpZMnsKyuJKvxevs14e7Zh8c4XqDyK1bhFwdevcLU8Nc5L43AaG3w6uHKDPXY5Y\" target=\"_blank\" rel=\"noopener\">Our Noble Selves,</a>” set in Britain in 1951, is about a war reporter who is implicated in the disappearance of a woman he’s been dating.</li></ul></blockquote><blockquote><ul><li>Jodi Picoult’s “<a href=\"https://cna.st/affiliate-link/FtXebJ4xqVaiehrzi2cKbVTiMBS1rPTpdtf6XQBXLq6FmsNvvg8s4ShL28L9HTZDJ8994rjuJLT1yja2NPjb33WkiyNrkc5W65pqgt4AWTfHZ4Tzp9SkH1JTw6T281AMS6Dc9jt7jN39HkaLA5anyXAGEha6q89MzGbj6HbsoPFHLfEnTfGYDxqRLs5JWQ97zD8jTBBZ21bYpvaCX61djYBEFFfFA61wciMLi4HK4KPQCoQ6HRePyJdWb7GjKTur8ZL4BvUQUAMLMVAxXaXPiuDP9oDiEjMcfmBrtCnAfcEwAEVq1KK5vQkczg6Tg8UfZWpDLpWHY3GUeYkY95H6BjRzY4fppmza6Ui\" target=\"_blank\" rel=\"noopener\">Hollow Bones</a>,” about a disaster-obsessed woman whose mother died in the 9/11 attacks, will be released on September 15th.</li></ul></blockquote><blockquote><ul><li>Gloria Steinem, the feminist activist who died last week, at the age of ninety-two, has a memoir coming out on the 22nd: “<a href=\"https://cna.st/affiliate-link/Ziz49JQti6yB5VMaPiBiXtRcuy8MfJ6pE8iH2HbUxf4y956Angx3uoYRSkffnhcMhU4hPuTgUTxHzWrgyq8VoT6JWMrCV16bp6nm6W1qdQaAkiWY4RwBVy99YKHtKCCk96TxrEKCp3XGkXfj1RXyptagx7xjr2h12xB5rE7RLNHZxrxAvdoymDZdvRaUD6hWfd2mgBKKCLqrXeXF8R1rfAqJFE2HNWPTonwiiJBsshAvJ78CcbtLNFnYxZCQ1k8Ti9h98GhSWsXf74GSj8V7BuBUAXY81nQfeRRu45iRUrCVNkJH9pMGpcjKRvEb1wmQpCZdEjTj8vQRGXzegVeuwqzRzK7EA7yVXptcJw8Jxzv\" target=\"_blank\" rel=\"noopener\">An Unexpected Life</a>.”</li></ul></blockquote><p><strong>P.S. MrBeast</strong> has written <a href=\"https://cna.st/affiliate-link/2gRdHG7pk8rK3M9X5TMfLgmX8SoMdKsMmncx9nLHBcZTiAHcyg73Xr6zjh4sZVzZGY7TdapncrkyTmEH9bpFCHtjbRq1kNWv8LuPxGjJfwbVWndQUZJVzKTciaRhDqJXCPftXunU7VJBh9cZa8f5aMcvFRrVYvg7cpJZ4Z9zj4TCNUHgpXpAp196mVS1FuSeQCbUPwwx2Gb1vwsyPTD4CTCzfsdrgxanRokHyb1za6m6etQNzb5xst4mjAb3HWrzqo8xAVS1jv1Pg5QQaeL74qcWagjzPCMyKxjUg6QDQ9JEHeYkTsbizrmNiWza2uNeyx6stBXvbad5WgJf1qnJ97EaJGycR7Z5TS6sZxYiv\" target=\"_blank\" rel=\"noopener\">a book with James Patterson</a>, and—surprise, surprise—there’s a billion-dollar-prize opportunity involved. 💰</p>"},{"title":"\"A game for everyone is a game for no one\": Don't expect an easy ride in Carcass Clad, the co-op tank horror game from the makers of Mouthwashing","source":"Rock Paper Shotgun","author":"Ashley Schofield","url":"https://www.rockpapershotgun.com/a-game-for-everyone-is-a-game-for-no-one-dont-expect-an-easy-ride-in-carcass-clad-the-co-op-tank-horror-game-from-the-makers-of-mouthwashing","category":"gaming","categoryLabel":"Gaming","wordCount":964,"readingTime":5,"content":"<p>Tanks for doing your part</p>\n    \n  \n  \n  \n\n            <p>On my final day of Gamescom, strolling (running) around the indie area to make sure I don't miss anything good, I stumble upon Wrong Organ’s upcoming Carcass Clad. Set in a wartorn Soviet city, empty of people but littered with tanks wearing coats of Frankensteined cattle corpses (light stuff!), Carcass Clad is a three-player co-op experience that shares the stressful responsibility of piloting a tank and taking down enemy units between those unlucky three.</p>\n<p>If you read the name Wrong Organ and thought, ‘Wait, the <a href=\"https://www.rockpapershotgun.com/games/mouthwashing\" target=\"_blank\" rel=\"noopener\">Mouthwashing</a> team? They're making a multiplayer co-op game?’, I can't fault your surprise.  <a href=\"https://www.rockpapershotgun.com/it-is-alive-the-makers-of-2024-horror-goty-mouthwashing-are-back-with-perhaps-the-most-dreadful-world-war-tank-sim-youll-ever-play\" target=\"_blank\" rel=\"noopener\">Edwin did interview them about it back in June</a>, but I walked up to the booth knowing the devs themselves and little more, so I was experiencing all of Carcass Clad and its heavy departure from their previous work for the first time.</p>\n \n\n<p>“We wanted to make sure we tried something entirely new, and weren't just stuck in the box of painful walking sims,\" gameplay lead Jeffrey Tomec told me. \"Mouthwashing was a game that’s hard in terms of narrative – Carcass Clad is a game that’s hard in terms of gameplay.”  As Tomec lightly puts it, what made Mouthwashing ‘hard’ – a game where you live out the last months of a stranded spaceship crew – was its focus on psychological horror and exploring the depths of depravity humans can reach when forced into impossible situations; experiencing the narrative, at times, felt like trying to swallow rubbing alcohol (complimentary).</p>\n<p>Carcass Clad is very unlike Mouthwashing in its approach to being ‘hard’.Tomec and executive producer Kai Moore gave me a guided tour of what turned out to be a very complex experience (and saved me from the added horrors of playing with complete strangers from the show floor). I load into the claustrophobic cockpit of a rusty Soviet-era tank, flush with slots for three players: Gunner, Commander and Driver. They tell me Gunner is the simplest role of the three, so I swallow my pride and take a seat behind the cannon, with the beautiful, wide-eyed low-poly models of my teammates visibly squashed up against me in this metal prison. If there’s anything that’s familiar from Mouthwashing, it’s the simple yet expressive artstyle of the human characters. The setup at the Gamescom booth also includes a literal periscope on the desk for me to peer through.</p>\n\n<p>Teamwork in Carcass Clad is key to victory; your goal is to blow up an enemy tank before it blows you up first. But there is pressure and tension in that collaboration: “The horror in this game is in trying to work with your friends and yelling at them for not doing their job,” Tomec explains. Said yelling is carried across mic channels in-game that simulate the audio distortion of, well, being in a tank, complete with incredibly loud background noise of treads and motors, crackly and low-quality audio output, and an increasingly frustrated tone as your fellow soldiers beg you to just load a goddamn shell already. Maybe that last one is just in my case.</p>\n\n<p>As Gunner, I'm responsible for loading artillery shells from huge rotating internal cylinders into the cannon itself, spinning and juggling the cylinders to dispose of spent shells without blocking the entry of new ones, manually calibrating the intended distance for a shell to travel, repairing damaged internals when necessary, and peering into the periscope (again, literally!) in order to aim at a target and hope to god I don't miss. I did, several times. If that sounds like a lot to handle, that's because it is. It's also all controlled with just a mouse, requiring precise and deliberate movements to not rotate the cylinders incorrectly, overshoot a target while aiming or lose precious time struggling to aim a repair kit at a fire inside the tank, lest the enemy tank take advantage of your hurried mistakes.</p>\n<p>With so much to juggle, it's easy to forget that there are two other players with just as stress-inducing, complex jobs as you. As intended, this results in an intense pressure on every player to not only do their own part, but to listen carefully to each other and actually respond in kind. It's like working in a busy kitchen, but you're all dead if you mess up too many times. When I raise the difficulty with Tomec, he explains “A game for everyone is a game for no one. We’re okay with it being less accessible to absolutely everyone; we wanted it to be something that isn’t just booted up to have on in the background.”</p>\n\n<p>I have time for just one round of Carcass Clad – the first time I've had devs yell at me in an entirely consensual and agreed upon context – but together we manage to pull together and take down the enemy tank. Our tank does, admittedly, succumb to its damage seconds after the enemy, resulting in a victory screen that lasts only a few precious moments before we technically lose, but Moore defiantly states “It flashed up a victory screen! We won! Don't worry about it!”, and who am I to argue with a developer?</p><p>Carcass Clad is a unique experience, and Tomec isn't kidding when he says it won't be a game for everyone. But, if you've ever yearned for a game that makes yelling at your friends to do their fucking job justifiable and fun, and simulates a very specific stress in a controlled environment separated from the horrors of reality, Carcass Clad might be for you. It's a shame the physical periscopes are just for the Gamescom booth, though – Wrong Organ could make a killing selling it as a peripheral.</p>\n<p><em>Travel and accommodation to Gamescom were provided by Hooded Horse.</em></p>"},{"title":"Med School Didn't Violate Accuser's Title IX Rights by Imposing Only a 20-Month Suspension on Student Found Responsible for Sexual Assault","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/10/med-school-didnt-violate-accusers-title-ix-rights-by-imposing-only-a-20-month-suspension-on-student-found-responsible-for-sexual-assault/","category":"law","categoryLabel":"Law","wordCount":743,"readingTime":4,"content":"<p>An excerpt from yesterday's decision by Judge Andrew Carter (S.D.N.Y.) in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.650468/gov.uscourts.nysd.650468.26.0.pdf\" target=\"_blank\" rel=\"noopener\">Roe v. Icahn School of Medicine at Mt. Sinai</a></em>:</p>\n<blockquote><p>The [allegations in the Complaint] are assumed to be true for purposes of the Motion to Dismiss.</p>\n<p>In Plaintiff Jane Roe's final semester as a medical student at the Icahn School of Medicine at Mount Sinai (\"Defendant\"), she reported that a male student, John Doe, had sexually assaulted her in a campus residence hall. After conducting an investigation, Defendant found John Doe responsible for sexual assault and imposed a 20-month suspension on him. Defendant's written determination of John Doe's responsibility found suspension to be the appropriate sanction \"[b]ecause the assault did not involve forcible rape or penetration; occurred while the Respondent was under the influence of alcohol; and because there was no evidence presented to the panel of any similar or related acts when the Respondent was not inebriated,\" noting that suspension would grant John Doe the \"opportunity to complete his medical training.\"</p>\n<p>Plaintiff appealed Defendant's chosen sanction and challenged the factors which Defendant applied to come to its decision. In response, Defendant affirmed its prior decision.</p></blockquote>\n<p>Plaintiff sued under Title IX, and the court rejected her claim; some excerpts:</p>\n<blockquote><p>While a Plaintiff who was the reporting party in the underlying disciplinary proceedings is not foreclosed from bringing an erroneous outcome or selective enforcement claim, Plaintiff's allegations do not satisfy the standard. First, Plaintiff agrees with the outcome of the underlying proceedings and therefore does not allege that the outcome was \"erroneous.\" Plaintiff moreover fails to provide a relative comparator, which is fatal to her selective enforcement claim.</p>\n<p>Plaintiff's remaining claims fare no better. Plaintiff has failed to allege circumstances that give rise to an inference of discrimination against her because of her sex or gender. Plaintiff relies on allegations that the male perpetrator was favored, but she provides no nexus between either party's gender and the alleged bias.</p>\n<p>Finally, Plaintiff's hostile environment claim fails because Plaintiff's allegations are insufficient to show that Defendant did not \"adequately respond\" to a hostile educational environment.</p></blockquote>\n<p>Here's an excerpt of the hostile educational environment analysis:</p>\n<blockquote><p>Plaintiff's hostile environment claim also fails. To state a claim for hostile environment under Title IX, a Plaintiff must plausibly allege \"that [s]he subjectively perceived the environment to be hostile or abusive and that the environment objectively was hostile or abusive, that is, that it was permeated with discriminatory intimidation, ridicule, and insult sufficiently severe or pervasive to alter the conditions of [her] educational environment.\" In order to hold an educational institution liable for a hostile educational environment, the Plaintiff must also show \"that a school official with 'authority to address the alleged discrimination and to institute corrective measures' had 'actual knowledge' of the discrimination and failed to adequately respond.\"</p>\n<p>Even assuming that Plaintiff satisfies the objective and subjective standards, Plaintiff's claim fails because Plaintiff does not allege that Defendant \"failed to adequately respond.\" … An educational institution need only \"take[] timely and reasonable measures to end the harassment\"; the measures need not be ultimately effective, only \"taken in good faith.\"</p>\n<p>Plaintiff does not allege sufficient facts to find that the remedy was \"clearly unreasonable\" or was not prescribed in good faith. Institutions are afforded latitude in fashioning remedies. It is well settled that \"courts should refrain from second-guessing the disciplinary decisions made by school administrators.\" Administrators are not required to issue a particular disciplinary action, including expulsion or no proximity orders.</p>\n<p>Here, the administrators clearly laid out their reasoning for the imposed sanctions. The reasoning referenced the relevant policies; discussed the basis for referencing one policy more extensively than the other; explained that the panel \"weighed many factors,\" and named six such factors; and singled out the circumstances that justified the sanctions, with a clear logical connection between the circumstances and the remedy. The Court therefore finds that the remedy was not \"clearly unreasonable.\"</p>\n<p>The hostile environment claim also fails because Plaintiff does not plead the existence of a hostile environment after the remedy was issued. Mere \"foreseeable risk of ongoing proximity\" is insufficient to demonstrate a hostile environment. Plaintiff provides no support for the proposition that risk of proximity constitutes \"severe or pervasive\" \"discriminatory intimidation, ridicule, and insult.\" Moreover, Plaintiff is not \"vulnerable to\" harassment simply because she is at risk of proximity, especially when the male student is subject to a no-contact order….</p></blockquote>\n<p>Jeffrey P. Metzler and Max A. Winograd (Pillsbury Winthrop Shaw Pittman LLP) represent defendant.</p>"},{"title":"An open letter to Dario: if you mean it, open the weights!","source":"Hacker News Best","author":"Jake Gold","url":"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/","category":"tech","categoryLabel":"Technology","wordCount":524,"readingTime":3,"content":"<p>Dear Dario,</p>\n<p>You published <a href=\"https://darioamodei.com/post/we-must-pace-the-frontier\" target=\"_blank\" rel=\"noopener\">We Must Pace the Frontier</a> today, which committed Anthropic to embedded third-party evaluators and asked governments to require every other frontier company to match. Sam Altman agreed within hours.<a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#fn:1\" target=\"_blank\" rel=\"noopener\">1</a></p>\n<p>The stated goal is to slow down the pace of AI progress.</p>\n\n<p>I believe you’re being sincere, so I’m asking you to call for a different law, one that would actually slow things down, even though it would require real sacrifice on your part.</p>\n<p><strong>Any AI model a company offers to the public has to be released as open weights.</strong></p>\n<p>This wouldn’t cover every model you train, just the ones you make available to the public. Internal and research models wouldn’t be affected, and governments could still get access to unreleased models.</p>\n<p>But Anthropic would have to publish Fable’s weights the day it was released, OpenAI would have to do the same with Astra, and so would everyone else.</p>\n<p>As you know, funding for frontier model development depends on valuations that assume the weights remain proprietary. By changing that assumption, we can reduce the money available for future training runs and slow progress at every lab at once, without a regulator deciding anything.</p>\n<h2><a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#every-regulation-youve-asked-for-ends-in-capture\" target=\"_blank\" rel=\"noopener\">Every regulation you’ve asked for ends in capture</a></h2>\n<p>There’s no slowing down frontier models by regulation that wouldn’t lead to regulatory capture. Embedded evaluators, compute thresholds, industry coordination with antitrust waivers. All of it gets written with the help of the current frontier labs, because nobody else understands the technical details well enough to write it.</p>\n<p>Once it’s law, it only gets more complex, because every incident adds a rule and no rule ever gets removed. The big companies can afford the compliance teams and lawyers to keep up, and each new requirement makes it harder for anyone else to catch them. Instead of slowing you down, it protects your position and profits.</p>\n<h2><a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#why-im-asking-you\" target=\"_blank\" rel=\"noopener\">Why I’m asking you</a></h2>\n<p>You seem like a good and principled person, and you have a record of giving things up for what you believe. You left OpenAI to start a company with safety built in from the beginning, when the safe career move was to stay.<a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#fn:2\" target=\"_blank\" rel=\"noopener\">2</a> You’ve spent years asking for regulation of your own industry and getting called a doomer and a regulatory capturer for it.<a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#fn:3\" target=\"_blank\" rel=\"noopener\">3</a> You pushed for export controls that shrink your own market. Anthropic paid $1.5 billion to settle with authors rather than fight to the end.<a href=\"https://jacob.gold/posts/open-letter-to-dario-amodei-about-open-weights/#fn:4\" target=\"_blank\" rel=\"noopener\">4</a> And today you committed to slowing down before anyone else did.</p>\n<p>You also had the foresight to make Anthropic a PBC (Public Benefit Corporation), so you can legally put the mission first:</p>\n<blockquote>\n<p><a href=\"https://www.anthropic.com/company\" target=\"_blank\" rel=\"noopener\">The responsible development and maintenance of advanced AI for the long-term benefit of humanity.</a></p>\n</blockquote>\n<p>This is exactly the kind of mission over short-term profit decision the PBC structure exists for. You remain the only person who could propose a law like this and be taken seriously, and the only one likely to actually do it.</p>\n<p>If you really want to slow down frontier AI, call for a law that makes every publicly available model open weights. There’s nothing in it to game or dodge, even for you.</p>"}];
