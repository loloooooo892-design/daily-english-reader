*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

.meta .sep {

}

  gap: 0.5rem;

}

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {

  cursor: default;
}

.swap-counter {

  color: var(--text-faint);

.article-body h3 { font-size: 1.175rem; }

.article-body li {

.article-body em { font-style: italic; }

<script>
var articles = [{"title":"Fallout dev Tim Cain says the games industry's volatility is 'always gonna be around': 'What's happening now isn't novel, it isn't new'","source":"PC Gamer","author":"Justin Wagner","url":"https://www.pcgamer.com/gaming-industry/fallout-dev-tim-cain-says-the-games-industrys-volatility-is-always-gonna-be-around-whats-happening-now-isnt-novel-it-isnt-new/","category":"gaming","categoryLabel":"Gaming","wordCount":550,"readingTime":3,"content":"<p>I don't know if you've noticed, but the games industry <a href=\"https://www.pcgamer.com/gaming-industry/foolproof-ways-to-get-laid-off-in-the-videogame-industry/\" target=\"_blank\" rel=\"noopener\">kind of sucks</a>. Despite (and because of) the absurd amount of money games rake in, there's an ungodly degree of <a href=\"https://www.pcgamer.com/gaming-industry/saudi-arabia-reportedly-looking-at-merging-electronic-arts-with-savvy-games-group/\" target=\"_blank\" rel=\"noopener\">consolidation</a>, the <a href=\"https://www.pcgamer.com/hardware/memory/ram-and-storage-is-ridiculously-expensive-right-now-because-of-drumroll-ai-of-course-and-theres-little-reason-to-think-prices-will-drop-any-time-soon/\" target=\"_blank\" rel=\"noopener\">RAMpocalypse</a>, and constant, huge <a href=\"https://www.pcgamer.com/gaming-industry/xbox-is-laying-off-3-200-people-and-dumping-4-studios/\" target=\"_blank\" rel=\"noopener\">waves of layoffs</a>. Tim Cain, who co-created the original Fallout, uploaded a video to YouTube last Wednesday explaining why he thinks the current state of affairs is so terrible, if not terribly surprising.</p><p>\"Why are things looking particularly bad right now? Well, the simple answer is 'cause they are bad right now,\" he said in the video. \"Correction for [reckless investment during] COVID, hardware costs have shot up—a lot due to AI data centers—but investors are redirecting their money outside of the games industry, in some cases outside of the US … things had to contract. And that means people are gonna get laid off.</p><p>\"These things will pass. They really will. I know if you're caught up in it, you're thinking, 'this is terrible.' They'll pass. That's the good news. The bad news is, new ones are gonna happen.\"</p><p>Cain was careful in his video to clarify that he understands things are uniquely bad now, but also said that things have been bad and will be bad again. \"If you're somebody who got into the games industry in that time period, in the last five or 10 years, and you thought it was going to be a stable job that would see through 30 or 40 years, you assumed incorrectly. You're wrong.\"</p><p>He warned taking a decadeslong career like his own as evidence that gamdev work is reliable for up-and-comers was \"survivorship bias.\" He recalled the stateside <a href=\"https://en.wikipedia.org/wiki/Video_game_crash_of_1983\" target=\"_blank\" rel=\"noopener\">video game crash of 1983</a> as an example of what he introduced as his main point: \"What's happening now isn't novel, it isn't new to the industry, and it's always gonna be around.\" As for why that is, he posited that games sit at the intersection between art and cutting-edge tech, both of which change rapidly as a rule.</p><p>For workers trying to weather industry conditions anyway, he suggested either honing an eclectic and broad set of skills or hyper-specializing and becoming a go-to guy in a particular niche. Notably, there is also a larger fight for labor rights in the industry trying to change some of these conditions for good: Blizzard Entertainment workers, for instance, just won what the Communications Workers of America called \"<a href=\"https://cwa-union.org/news/releases/blizzard-entertainment-workers-ratify-historic-video-game-contracts-cwa\" target=\"_blank\" rel=\"noopener\">a breakthrough first contract</a>\" for all the studio's game development teams and shared services. The Independent Workers of Great Britain, meanwhile, is currently <a href=\"https://www.pcgamer.com/games/grand-theft-auto/the-modern-workplace-runs-on-fear-today-we-are-fighting-fear-fired-grand-theft-auto-6-dev-calls-out-rockstar-in-impassioned-pre-trial-speech/\" target=\"_blank\" rel=\"noopener\">rallying in support</a> of Rockstar Games workers as the company grapples with <a href=\"https://www.pcgamer.com/gaming-industry/rockstar-faces-legal-setback-as-uk-tribunal-allows-its-fired-workers-to-bring-every-one-of-their-union-busting-allegations-to-trial/\" target=\"_blank\" rel=\"noopener\">union-busting allegations</a>.</p><p>From the creators of Edge: A free weekly videogame industry newsletter, featuring in-depth news, expert analysis and exclusive interviews</p>\n\n<p>Justin first became enamored with PC gaming when World of Warcraft and Neverwinter Nights 2 rewired his brain as a wide-eyed kid. As time has passed, he's amassed a hefty backlog of retro shooters, CRPGs, and janky '90s esoterica. Whether he's extolling the virtues of Shenmue or troubleshooting some fiddly old MMO, it's hard to get his mind off games with more ambition than scruples. When he's not at his keyboard, he's probably birdwatching or daydreaming about a glorious comeback for real-time with pause combat. Any day now...</p>"},{"title":"Second Amendment Roundup: ATF’s “Firearm” and “Frame or Receiver” Rules Invalid","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/09/second-amendment-roundup-atfs-firearm-and-frame-or-receiver-rules-invalid/","category":"law","categoryLabel":"Law","wordCount":1106,"readingTime":6,"content":"<p>The Supreme Court in <em>Bondi v.</em> <em>VanDerStok</em> (2025) <a href=\"https://www.supremecourt.gov/opinions/24pdf/23-852_c07d.pdf\" target=\"_blank\" rel=\"noopener\">rejected</a> a challenge under the Administrative Procedure Act to a 2022 Final Rule by the Bureau of Alcohol, Tobacco, Firearms &amp; Explosives (ATF) expanding the definitions of \"firearm\" and \"frame or receiver.\"  See my post <a href=\"https://reason.com/volokh/2025/03/31/second-amendment-roundup-supreme-court-decides-vanderstok/\" target=\"_blank\" rel=\"noopener\">here</a>.  However, the Court did not entertain the constitutional challenges brought by Defense Distributed.  In a decision issued on August 17 in <em>Defense Distributed v. Blanche</em>, Judge Reed O'Connor of the Northern District of Texas <a href=\"https://docs.google.com/viewerng/viewer?url=https://ddlegio.com/wp-content/uploads/2026/08/2026-08-17-Opinion-dckt-330_0.pdf\" target=\"_blank\" rel=\"noopener\">declared</a> the regulations unconstitutionally vague and violative of the Second Amendment.</p>\n<p>In 1968, Congress defined \"firearm\" in the Gun Control Act to include \"any weapon … which will or is designed to or may readily be converted to expel a projectile by the action of an explosive\" and \"the frame or receiver of any such weapon.\"  18 U.S.C. § 921(a)(3).  Contemporaneously, ATF's predecessor agency defined \"frame or receiver\" as \"that part of a firearm which provides housing for the hammer, bolt or breechblock, and firing mechanism, and which is usually threaded at its forward portion to receive the barrel.\"  33 F.R. 18558 (1968).  There things stood until 2022 when the Biden ATF decided to reinvent the wheel by \"improving\" these longstanding definitions under the fake issue of \"ghost guns.\"</p>\n<p>Just quoting the Final Rule's definition for \"frame or receiver,\" 27 C.F.R. § 478.12(c)(c), itself exposes the vagueness thereof.  It includes \"a partially complete, disassembled, or nonfunctional frame or receiver … that is designed to or may readily be completed, assembled, restored, or otherwise converted\" into one, but not \"a forging, casting, printing, extrusion, unmachined body, or similar article that has not yet reached a stage of manufacture where it is clearly identifiable as an unfinished component part of a weapon (e.g., unformed block of metal, liquid polymer, or other raw material).\"  As the court notes, \"when a hunk of metal or plastic\" reaches that stage is \"is left to the subjective determination of the ATF.\"</p>\n<p>The Biden-era regulation further states that ATF \"may consider any associated templates, jigs, molds, equipment, tools, instructions, guides, or marketing materials that are sold, distributed, or possessed with [or otherwise made available to the purchaser or recipient of] the item or kit.\"  But it does not say \"exactly what set of materials ATF thinks are relevant to this inquiry.\"</p>\n<p>In addition, the rule added a gloss to the definition of \"firearm\" as \"a weapon parts kit that is designed to or may readily be completed, assembled, restored, or otherwise converted to expel a projectile by the action of an explosive.\"  27 C.F.R. § 478.11 (\"firearm\").</p>\n<p>The term \"readily\" is problematic enough when used in the statute – what \"may <em>readily</em> be converted to expel a projectile\" – but is hopelessly vague when used in the Final Rule.  As the court states, \"It is hard to see how 'readily' in the context of an already formed weapon and 'readily' in the context of a block of metal or plastic and a jig or template are synonymous.\"</p>\n<p>The parties did not dispute that making or repairing firearms is protected by the Second Amendment.  Under <em>Bruen</em>, the burden shifted to the government to demonstrate that the regulation is consistent with the Nation's historical tradition of firearm regulation.  But the historical analogues cited by the government failed to do so.  A mere two states in the early republic required firearm barrels to be \"proved\" (tested) and stamped to certify their strength and safety. In <em>Bruen</em>, the Supreme Court doubted that \"three colonial regulations could suffice to show a tradition of public-carry regulation.\" The \"why\" was to protect the user from harm in the form of an early consumer-protection theory, while the \"why\" of the Final Rule was to enable ATF to engage in fighting crime by tracing firearms and (in theory) prohibiting their acquisition by prohibited persons.  The \"how\" of the proving laws was to inspect and mark a barrel and collect a fee, while the \"how\" of the modern regulation was to impose regulation of parts and raw material to make firearms.  Similar reasons distinguished gunpowder storage rules at the Founding that protected the public from volatile explosives from today's rule meant for crime control.</p>\n<p>Not only does the Final Rule lack historical analogues, the court found, it \"contradicts the actual historical tradition of personal gunsmithing. Self-manufacture of firearms in America was common and indeed foundational to establishing our Nation.\"  During the colonial, revolutionary, and early republic periods, Americans were admonished to make firearms in order to arm the population.  The court <a href=\"https://commons.stmarytx.edu/cgi/viewcontent.cgi?article=2119&amp;context=thestmaryslawjournal\" target=\"_blank\" rel=\"noopener\">cited</a> Joseph Greenlee, \"The American Tradition of Self-Made Arms,\" 54 St. Mary's L.J. 35 (2023).</p>\n<p>Accordingly, the court declared that 27 C.F.R. § 478.11 and 27 C.F.R. § 478.12(c) are unconstitutional under the Second Amendment and the Due Process clause of the Fifth Amendment. The court further enjoined enforcement thereof against Defense Distributed, the Second Amendment Foundation (SAF), or any of SAF's current or future members, but only with respect to the products raised in the complaint -- M1911 80% Frames and the G80 Build Kit, Unfinished Receiver, and Grip Module.  The practical effect is that the company may sell the items and SAF members may buy them without requiring them to be distributed as a firearm through a federal firearms licensee.</p>\n<p><em>Defense Distributed</em> could have a broader impact, particularly if affirmed and further exposited by the Fifth Circuit, by challenging courts to strictly construe terms like \"readily,\" whether found in a regulation or the statutes.  The vagueness of \"readily\" may be ameliorated somewhat by the requirement that the government must prove that a party \"knew the weapon he possessed had the characteristics that brought it within the statutory definition….\"  <a href=\"https://supreme.justia.com/cases/federal/us/511/600/\" target=\"_blank\" rel=\"noopener\"><em>Staples v. U.S</em>.</a> (1994).</p>\n<p>Some of the \"assault weapon\" definitions include reference to parts that can be \"readily\" assembled into one.  In a case I litigated years ago, it was decided that \"the phrase 'may be readily assembled' does not provide sufficient information to enable a person of average intelligence to determine whether a particular combination of parts is within the ordinance's coverage.\"  <a href=\"https://law.justia.com/cases/federal/appellate-courts/F3/152/522/543912/\" target=\"_blank\" rel=\"noopener\"><em>Peoples Rights Organization v. City of Columbus</em></a> (6th Cir. 1998).</p>\n<p>* * *</p>\n<p>On September 4, President Trump <a href=\"https://wltreport.com/2026/09/08/president-trump-pardons-navy-veteran-adamiak-firearms-case/\" target=\"_blank\" rel=\"noopener\">granted a pardon</a> to Navy veteran Patrick Tate Adamiak, who was serving a 20-year sentence after being convicted of violations of the National Firearms Act.  The case involved cut-up machinegun parts and an inert, incomplete grenade launcher.  He filed a <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-1190/404161/20260410144625365_25-__PetitionForWritOfCertiorari%20Final.pdf\" target=\"_blank\" rel=\"noopener\">cert petition</a> arguing that the NFA's definitions of \"machinegun\" and \"destructive device\" each have multiple definitions, 26 U.S.C. §5845, but the indictment was defective for not alleging which specific definitions applied.  The petition was denied on May 18.</p>"},{"title":"Y Combinator’s Garry Tan wants US open-weight AI labs to ‘distill’ frontier models, too","source":"TechCrunch","author":"Julie Bort","url":"https://techcrunch.com/2026/09/11/y-combinators-garry-tan-wants-u-s-open-weight-ai-labs-to-distill-frontier-models-too/","category":"tech","categoryLabel":"Technology","wordCount":539,"readingTime":3,"content":"<p>When it comes to Chinese AI labs using distillation techniques to extract knowledge from frontier model makers, Y Combinator CEO Garry Tan is hoping regulators stay out of it. In fact, he thinks U.S. AI labs should perhaps play the same game.</p>\n<p>“I would do nothing,” he told <a href=\"https://www.cnbc.com/2026/09/11/y-combinator-garry-tan-says-do-nothing-about-distillation.html\" target=\"_blank\" rel=\"noopener\">CNBC in an interview earlier this week</a>. “We could argue that there should be an American distillation regime.”</p>\n<p>He elaborated to TechCrunch that this means he wants smaller, American open-weight AI labs to use the same kind of training techniques on American frontier AI labs, giving the U.S. a more robust set of open-weight options that aren’t Chinese.</p>\n<p>Distillation is when a model maker extensively prompts another model in order to learn how it works and reasons. It is commonly, and legitimately, used by AI labs to help train new models.</p>\n<p>Anthropic this week <a href=\"https://www.anthropic.com/threat-intelligence-report-september-2026#illicit-distillation-sep-26\" target=\"_blank\" rel=\"noopener\">released its second report</a> alleging that Chinese labs are engaged in “illicit distillation attacks,” hiding their identities to distill without permission and relying on fraud and stolen credentials to do so. Anthropic CEO Dario Amodei had previously <a href=\"https://www.anthropic.com/news/position-open-weights-models\" target=\"_blank\" rel=\"noopener\">publicly called on U.S. regulators</a> to crack down on distillation.</p>\n<p>It’s notable that the commander of Silicon Valley’s prestigious and prolific startup accelerator doesn’t agree.</p>\n<p>To be clear, Tan isn’t advocating for American AI labs to use stolen credentials to distill. He wants them to be free to come in the front door. In fact, his argument is twofold. He feels it’s an overreach for AI labs to dictate what their customers can do with the information their models share with them.</p>\n<p>He also notes that the proprietary AI labs didn’t ask permission when they vacuumed up as much human knowledge as they could to train their models. They famously ingested plenty of copyrighted material <a href=\"https://techcrunch.com/2026/07/20/anthropics-landmark-1-5b-copyright-settlement-is-approved/\" target=\"_blank\" rel=\"noopener\">without the permission of those intellectual property holders</a>.</p>\n<p>“Controlling what users and customers do with API calls to closed weight models feels constraining, and there’s a role government can play here to normalize the fact that access to intelligence that was trained on broad public access data should itself also be more a form of a public good than something locked away behind restrictive terms of service,” he told TechCrunch when asked why American labs should be free to distill, too.</p>\n<p>Tan, who is himself such an avid AI user that he once <a href=\"https://techcrunch.com/2026/03/17/why-garry-tans-claude-code-setup-has-gotten-so-much-love-and-hate/\" target=\"_blank\" rel=\"noopener\">described himself as having cyber psychosis</a>, wants to see a balance between open-weight AI labs and frontier labs.</p>\n<p>“They are at the frontier and driving it forward. We want that to be fundable, and be a great business model ongoing,” he told CNBC. “You want open weight models to give people freedom and access.”</p>\n<p>To him, the true AI doomer scenario is for all the immense power of frontier AI to wind up in the hands of a single powerful, proprietary provider. “The nightmare scenario, the doomer scenario for AI is that there’s just one company,” he said. “It has the best access to capital. It has the best AI researchers. It runs away with it and suddenly there’s one company that’s monolithic. And that would be bad.”</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Nighttime Light May Change the Shape of Your Heart - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/nighttime-light-may-change-the-shape-of-your-heart-1284967/","category":"fun","categoryLabel":"Interesting Reads","wordCount":591,"readingTime":3,"content":"<p>Our world is getting brighter all the time. International Space Station astronaut Don Pettit recently posted a series of <a href=\"https://x.com/astro_Pettit/status/2096763479143469206\" target=\"_blank\" rel=\"noopener\">photos</a> on X (formerly Twitter) documenting how our artificial light environment has changed over the past two decades. Gone are the warm, orange-yellow sodium streetlights, with bluish-white LEDs taking their place. It’s a dramatic transformation—and one that cuts down on energy use—but it’s also a shift toward a wavelength of light our biological clocks are more sensitive to. </p><p>Featured Video</p><p>Pettit’s photos also underscore that our planet is <a href=\"https://nautil.us/new-nasa-graphic-captures-human-activity-at-night-1280853\" target=\"_blank\" rel=\"noopener\">growing more luminous</a> in general. Add to that our increasing reliance on blue-light-beaming devices and we’re getting a bigger dose of nighttime light than any generation of humans that came before us. And according to a new study <a href=\"http://dx.doi.org/10.1093/eurheartj/ehag563\" target=\"_blank\" rel=\"noopener\">published</a> in the <em>European Heart Journal</em>, it could be affecting our cardiac health. </p><p><strong>Read more: </strong><a href=\"https://nautil.us/the-birth-of-light-1270615\" target=\"_blank\" rel=\"noopener\"><strong>“The Birth of Light”</strong></a></p><p>Light is the most important input to our circadian rhythms, and one of the systems our circadian clocks govern is the cardiovascular system. The relationship between the two, however, is still somewhat murky. “Previous observational studies have linked nighttime light exposure with a higher risk of cardiovascular disease, but little is known about the related cardiac structure and functional changes,” study author Lu Qi explained in a <a href=\"https://www.escardio.org/news/press/press-releases/too-much-light-at-night-changes-the-shape-and-working-of-the-heart/\" target=\"_blank\" rel=\"noopener\">statement</a>.   </p><p>So Lu and his fellow public health epidemiologists from Tulane University strapped accelerometers with light meters to the wrists of more than 11,000 people enrolled in the United Kingdom’s BioBank study to measure their light exposure for a week. The team also took MRIs of their hearts and followed up with more cardiac MRIs three years later to find out whether things had changed. </p><p>They found structural changes in the hearts of people with nighttime light exposure of more than three lux—about the same amount received from the light of a full moon. In these individuals, the walls of the left ventricles had thickened, reducing the volume of the chamber responsible for pumping oxygen-rich blood out to the rest of the body. According to the team, roughly 24 to 49 percent of the structural changes could be explained by sleep duration being reduced to less than five or six hours.</p><p>“Ultimately, this study is more than an interesting observation,” the researchers wrote in an <a href=\"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag650/8770410\" target=\"_blank\" rel=\"noopener\">editorial</a> on the findings. “It provides a crucial link between what satellites already show us, i.e. a planet glowing ever brighter at night, and the clinical reality unfolding inside our chests: hearts that are becoming stiffer, weaker, and less efficient.”</p><p>Of course, there are few caveats. The study only measured light exposure for a week, which might not be the best measure of habitual light exposure. Additionally, the recordings were made with a wrist-worn sensor, which means it could under- or overcount the amount of light received by the eyes. Finally, the average amount of thickening was measurable but slight (less than 3 percent), but could be enough to adversely affect those with existing cardiovascular issues.   </p><p>What can you do to reduce your nighttime light? </p><p>Blackout curtains, warm bedroom lighting, and taping over any obnoxious standby LEDs on appliances can help. If you use an illuminated alarm clock, choose one that features a more circadian friendly wavelength, like red light. Finally, put your phone away before bed, preferably in another room. </p><p>We may not be able to stop the planet from getting brighter, but we hold the key to indoor light pollution in the palms of our hands. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Fehmiu Roffytavare / Shutterstock</em></p>"}];
