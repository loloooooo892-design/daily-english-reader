<script>
var articles = [{"title":"Trump administration asks justices to decide on its appointments of acting U.S. attorneys","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/09/trump-administration-asks-justices-to-decide-on-its-appointments-of-acting-us-attorneys/","category":"law","categoryLabel":"Law","wordCount":874,"readingTime":5,"content":"<p>Arguing that <a href=\"https://cdn.sanity.io/files/pito4za5/production/c183e07bcf66651295467de84b50002564492e8e.pdf#page=44\" target=\"_blank\" rel=\"noopener\">a ruling by the U.S. Court of Appeals for the 9th Circuit</a> “threatens to inject mass confusion into five U.S. Attorney’s Offices in the Ninth Circuit that collectively handle over 8000 civil and criminal cases annually,” the Trump administration on Tuesday <a href=\"https://www.scotusblog.com/cases/united-states-v-jackson-2/\" target=\"_blank\" rel=\"noopener\">asked the Supreme Court</a> to weigh in on the legality of President Donald Trump’s appointment of an acting U.S. attorney in Nevada. U.S. Solicitor General D. John Sauer told the justices that the appointment of Sigal Chattah (as well as others around the country) was not only lawful, but also “a critical tool that the Executive Branch has used without meaningful objection for 25 years.”</p><p><a href=\"https://www.justice.gov/usao-nv/pr/united-states-attorney-jason-m-frierson-announces-resignation\" target=\"_blank\" rel=\"noopener\">Until Jan. 17, 2025</a>, the U.S. Attorney for the District of Nevada was Jason Frierson, who was nominated by then-President Joe Biden. Frierson stepped down shortly before Trump’s second inauguration. In March, then-Attorney General Pamela Jo Bondi appointed Chattah as the interim U.S. attorney, effective April 1. Under the <a href=\"https://www.congress.gov/crs-product/R44997\" target=\"_blank\" rel=\"noopener\">Federal Vacancies Reform Act</a>, the federal law that governs how the executive branch can temporarily staff vacant positions that require presidential appointment and confirmation by the Senate, interim officers can serve for 120 days.</p><p>Two days before her interim appointment was set to expire, Chattah resigned. Bondi then designated her as the first assistant U.S. attorney. Under the FVRA, Bondi explained, that would give Chattah the “authority to serve as Acting United States Attorney upon a vacancy in that office.” Bondi also gave Chattah the powers of a U.S. attorney for legal proceedings in Nevada.</p><p>Three men who had been indicted on felony charges in Nevada after Chattah’s designation as the first assistant U.S. attorney sought to have their indictments dismissed or, at the very least, Chattah, whose name appeared in the signature blocks of their indictments as “Acting U.S. Attorney,” disqualified.</p><p>A federal district judge held, and the 9th Circuit <a href=\"https://cdn.sanity.io/files/pito4za5/production/c183e07bcf66651295467de84b50002564492e8e.pdf#page=44\" target=\"_blank\" rel=\"noopener\">agreed</a>, that Chattah was not eligible to serve as the acting U.S. attorney, and that she should be disqualified from playing any role in the prosecution of the defendants’ cases. But they declined to dismiss the indictments altogether.</p><p>In a 34-page opinion, Judge Eric Miller of the 9th Circuit wrote that “the text and structure” of the FVRA are “unambiguous: The statute does not permit the executive to fill an existing vacancy by designating a new first assistant.” Instead, he reasoned, the FVRA “provides that a first assistant automatically succeeds to a vacant office” only if the first assistant was first assistant when the principal office became vacant. The automatic-succession rule, he concluded, “does not apply to a first assistant” – like Chattah – “who never served under a validly appointed official.” Moreover, Miller continued, the attorney general cannot achieve the same result “by delegating all of the functions and duties of the U.S. Attorney to someone else.”</p><p>In his <a href=\"https://www.supremecourt.gov/DocketPDF/26/26-304/423324/20260908124848584_Jackson%20Petition.pdf\" target=\"_blank\" rel=\"noopener\">petition</a> seeking review of the 9th Circuit’s decision, Sauer told the justices that, especially after the transition from one presidential administration to another, there is often no first assistant who is already in place and available to serve in an acting capacity. “For decades,” to address this problem, he said, “a commonly selected option has been that, after the vacancy arises, the agency head appoints a new first assistant, thus making that person the acting officer.” Indeed, he noted, both Republican and Democratic administrations have used this path in the solicitor general’s office, naming a principal deputy solicitor general who then serves as an acting solicitor general.</p><p>Nothing in the text of the FVRA, Sauer contended, indicates that only a first assistant who was in that role before a vacancy occurred can serve in an acting capacity. To the contrary, he suggested, the text provides that anyone who is currently serving as the first assistant to the now-vacant <em>office</em> can serve as the acting official, rather than restricting the acting official to someone who served as a first assistant to the former official.</p><p>Along the same lines, Sauer continued, “nothing in the FVRA’s text bars an agency head from delegating a vacant office’s delegable duties to another official, particularly when those powers are not exclusive to the vacant office but instead vested independently in the agency head.”</p><p>And the Supreme Court should grant review, Sauer emphasized, because the courts of appeals have interpreted the key provisions of the FVRA differently. In addition to the 9th Circuit in her case, other federal courts have similarly invalidated the appointments of other acting U.S. attorneys during the Trump administration, including <a href=\"https://www2.ca3.uscourts.gov/opinarch/252635p.pdf\" target=\"_blank\" rel=\"noopener\">Alina Habba</a> in New Jersey, <a href=\"https://www2.ca3.uscourts.gov/opinarch/252635p.pdf\" target=\"_blank\" rel=\"noopener\">John Sarcone</a> in New York, <a href=\"https://www.courthousenews.com/wp-content/uploads/2026/01/novak-lindsey-halligan-order.pdf\" target=\"_blank\" rel=\"noopener\">Lindsey Halligan</a> in Virginia, and <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cacd.983892/gov.uscourts.cacd.983892.56.0.pdf\" target=\"_blank\" rel=\"noopener\">Bill Essayli</a> in California. By contrast, Sauer said, the U.S. Court of Appeals for the Federal Circuit <a href=\"https://law.justia.com/cases/federal/appellate-courts/cafc/18-2140/18-2140-2022-05-27.html\" target=\"_blank\" rel=\"noopener\">has reached</a> the opposite conclusion on the question of a senior official’s ability to delegate duties to a more junior official. That court, Sauer emphasized, held that the FVRA “does not ‘restrict who may perform’” the “delegable” duties of an official requiring Senate confirmation “when he was absent.”</p><p>The defendants challenging Chattah’s appointment have until Oct. 8 to file their brief opposing review, although that deadline may be extended.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Trump administration asks justices to decide on its appointments of acting U.S. attorneys</em>, SCOTUSblog (Sep. 10, 2026, 2:05 PM), https://www.scotusblog.com/2026/09/trump-administration-asks-justices-to-decide-on-its-appointments-of-acting-us-attorneys/</p>"},{"title":"Beneath a Steel Sky review (1994)","source":"PC Gamer","author":"@pcgamer","url":"https://www.pcgamer.com/games/adventure/beneath-a-steel-sky-review-1994/","category":"gaming","categoryLabel":"Gaming","wordCount":1481,"readingTime":8,"content":"<p>A must-buy for all serious adventure fans.</p>\n\n<p>\nPC Gamer's got your back\n\nOur experienced team dedicates many hours to every review, to really get to the heart of what matters most to you. <a href=\"https://www.pcgamer.com/pc-gamer-how-we-test/\" target=\"_blank\" rel=\"noopener\">Find out more about how we evaluate games and hardware.</a>\n</p>\n\n<p><em><strong>Special commentary on this classic PC Gamer review provided by:</strong></em></p>\n<p>Archive Spelunker</p>\n\n<p>Archive Spelunker</p>\n<p>Jody Macgregor</p>\n<a href=\"https://twitter.com/jodymacgregor\" target=\"_blank\" rel=\"noopener\">\n\n</a>\n\n<p><em>Revolution Software is probably best-known among point-and-click fans for the Broken Sword series, and the infamous goat puzzle. (Part of a trilogy of infuriating animal brainbenders along with The Hitch Hiker's Guide to the Galaxy Babel fish and Gabriel Knight 3' cat-hair mustache.) But before that Revolution gave us Lure of the Temptress and Beneath a Steel Sky, the latter a collaboration with comics artist Dave Gibbons.</em></p><p><em>After a planned Watchmen game fell through, Gibbons instead provided the dystopian cityscape, character designs, and part of the story for Beneath a Steel Sky. The art remains the most convincing thing about it, making me wonder why we ever bothered with 3D graphics. </em></p><p><em>The game itself was full of the kind of puzzles adventure gamers loved and the rest of us slogged through for the sake of the story. Real heads like PC Gamer's reviewer Garry Whitta thrived on distracting guards with unusual uses for inventory items, and to them Beyond a Steel Sky remains a beloved classic. So much so that a sequel was eventually crowdfunded and released in 2020. Beyond a Steel Sky went 3D though, losing the one thing I'd liked about the original. Our reviewer Ian Evenden wasn't put off by that, giving it </em><a href=\"https://www.pcgamer.com/beyond-a-steel-sky-review/\" target=\"_blank\" rel=\"noopener\"><em>an 81%</em></a><em> almost as enthusiastic as Whitta's take on the original from PC Gamer's debut issue.</em></p>\n<p><em>From the archives: The review below appears as originally written, with only minor changes in formatting and screenshots. By Garry Whitta</em></p><p><strong>Beneath a Steel Sky review – PC Gamer #1 (UK, December 1993)</strong></p><p>Latest Videos FromPC Gamer</p><p>It's here at last. After two years in development and more column inches of enthusiastic preview copy than is healthy, Revolution Software and Dave Gibbons' Beneath A Steel Sky, finally, arrives. And it couldn't be further removed from the Hull-based company's 1992 debut.</p><p>After the magic and mythology of Lure Of The Temptress comes an oppressive, futuristic techno-thriller that borrows heavily from the pioneering sci-fi works of Philip K Dick and William Gibson. Take one part of Blade Runner, add a generous helping of Gibbons' own Give Me Liberty graphic novel, season to taste with a little Total Recall, and you've got Beneath A Steel Sky in a nutshell.</p><p>This review was originally published in <strong>PC Gamer #1 (UK, December 1993)</strong>.</p><p>You can still <a href=\"https://www.awin1.com/awclick.php?awinmid=2961&amp;awinaffid=103504&amp;clickref=pcg-us-6215028513226201927&amp;p=https%3A%2F%2Fwww.magazinesdirect.com%2Fpcg-brandsite\" target=\"_blank\" rel=\"noopener\">subscribe to PC Gamer</a> to get new issues of the magazine (in print!) every month.</p><p>Depending on how cynical you are, Beneath A Steel Sky's concept is either a brilliantly conceived piece of science fiction or just a plagiarised compilation of existing sci-fi ideas. Set in the near future, the world government has collapsed and corrupt corporations are now free to take control of the planet.</p><p>As the global ecology is ravaged by pollution, the upper-class nouveau riche retreat underground, while the less well-off are forced to live and work in claustrophobic towers high above the surface. Beyond all this is The Gap, a desert outland populated by those who refuse to live in the city—and also home to our hero, Robert Foster, a raincoat-clad hunk propelled into the story after the sinister police kidnap him from his home without explanation and a subsequent helicopter crash leaves him stranded, totally alone, in the higher reaches of the towering city.</p><p>The biggest gaming news, reviews and hardware deals</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>But to give away any more of the story here would be to spoil one of the game's strongest aspects. Apart from a few clues delivered during the intro, Beneath A Steel Sky deliberately gives you hardly any information about why you've been kidnapped, what you have to do, or even where you are at the outset. Half the fun is to be had unravelling the mystery and watching the plot slowly unfold as you go.</p><p>To be honest, Beneath A Steel Sky is pretty conventional in its approach—despite what you may have heard. As an adventure game there's nothing radically original on offer. It <em>is</em> big though (around 100 locations), and features countless puzzles and a myriad of genuinely interesting characters. A particularly nice touch is your robotic companion, Joey, a decidedly wise-ass robot who, although starting the game as a lowly circuit board, can be plugged into all manner of cybernetic bodies to help you perform helpful tasks. The well-scripted love-hate relationship between the two characters really helps bring them both to life.</p><p>Progress in Beneath A Steel Sky is about getting to the bottom of things in more ways than one—starting near the top of the city, you'll have to get to the surface and ultimately underground in order to solve the mystery and crack the main conspiracy. Along the way, there are security forces to avoid, an all-powerful central computer to contend with and numerous sub-plots and red herrings to divert your attention. The game is still basically about using the right object in the right place at the right time, but it's compelling because it's so richly plotted and well thought out from beginning to end. Serious adventure hacks will be in hog heaven.</p><p>Counterpoint</p><p>What do you best remember about the Monkey Island games? More than likely, it's not the graphics (ace though they are) or the easy-to-get-to-grips-with interface (icon of user friendliness though it may be). No, it's probably the jokes.</p><p>You know, the spitting contest, the bit where his trousers fall down... And that for me, is where Beneath A Steel Sky falls down. It's just not funny. (It's not even <em>trying</em> to be funny most of the time.) Okay, it's not really fair to complain when a game fails to provide something it never set out to do in the first place (this is much more your Indiana Jones &amp; The Fate Of Atlantis than your Sam And Max) but consider—LucasArts haven't done a serious adventure in a long time. And why? Because the funny ones are more popular, that's why.</p><p>That's not to say more serious graphic adventures can't work—this one, on the whole, is pretty, involving, well-constructed and, in most areas, just plain <em>good</em>—but simply that a few jokes would have spiced things up a bit.</p><p>—Matt Bielby</p><p>But the game's not without its faults. The main problem I have is that it doesn't seem to know quite what tone it should set. From what you've heard, and what you're shown during the introduction sequence, you'd have every right to expect a dark, gloomy and atmospheric vision of a sleazy, corrupt future. However, no matter how hard Gibbons' beautifully-realised background artwork and truly excellent accompanying mini-comic try to set the mood, there are too many distracting factors at work here that dilute the effect.</p><p>Maybe it's that I just can't take the little on-screen characters seriously enough to care for them or, in the case of the numerous baddies, feel threatened by them. Maybe it's because the music, which should have been as haunting and ominous as the powerful graphics, mostly consists of a series of inappropriate themes which at times sound more like jolly Radio One jingles.</p><p>In reality, probably all these things are to blame—the game simply spreads itself too thin, trying to be at once wildly atmospheric, comedic, menacing and tongue-in-cheek.</p><p>No matter how close it may come at times, Beneath A Steel Sky never quite manages to immerse you in a brooding, sinister world the way the designers obviously intended. But then again I'm probably just being a jaded bastard. The game may be very pretentious, but should we really take it that seriously? This isn't a movie or a high-brow novel, it's a computer game, for God's sake, and although it may have its failings as a piece of interactive fiction, as an adventure game in the classic LucasArts tradition it's difficult to find fault with.</p><p>In fact, it's at least as good—although not as funny—as anything that LucasArts has come up with in the last year. But as for the hyped claim that it's \"The World's First Computer-Based Animated Comicbook Adventure,\" well, I'm still far from convinced. Just take Beneath A Steel Sky for what it is and not for what it may otherwise pretend to be and you'll have a whale of a time.</p>\n\n<p>The Verdict</p>\n\n<p>\nBeneath a Steel Sky\n</p>\n<p>A must-buy for all serious adventure fans.</p>\n\n<p>You must confirm your public display name before commenting</p>\n<p>Please logout and then login again, you will then be prompted to enter your display name.</p>"},{"title":"Are Too Many Americans Taking Antidepressants? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/are-too-many-americans-taking-antidepressants-1284975/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1201,"readingTime":7,"content":"<p>Drugs for treating depression are among the most prescribed category of medications in the U.S.—<a href=\"https://doi.org/10.1136/bmjment-2025-302287\" target=\"_blank\" rel=\"noopener\">1 in 6 American adults take them</a>.</p><p>Featured Video</p><p>Some health researchers and advocates have raised concerns that <a href=\"https://doi.org/10.1001/jamapsychiatry.2021.0823\" target=\"_blank\" rel=\"noopener\">too many patients are using antidepressants</a> and that patients who want to stop taking them <a href=\"https://doi.org/10.1111/hex.13966\" target=\"_blank\" rel=\"noopener\">struggle to do so</a>. One of the most prominent voices on this point is Health and Human Services Secretary Robert F. Kennedy Jr., who <a href=\"https://www.medpagetoday.com/psychiatry/depression/121129\" target=\"_blank\" rel=\"noopener\">launched an effort in May 2026</a> encouraging doctors to <a href=\"https://www.statnews.com/2026/07/13/hhs-ssri-deprescribing-experts-gather-clinical-withdrawal-guidance/\" target=\"_blank\" rel=\"noopener\">find other ways besides antidepressants and other psychiatric drugs</a> to treat depression when possible.</p><p>As a <a href=\"https://campus.und.edu/directory/andrew.mclean\" target=\"_blank\" rel=\"noopener\">psychiatrist for over 35 years</a>, including a past role as the medical director of North Dakota’s Department of Human Services, I’ve seen both the benefits and the problems with antidepressants. In my view, there are grains of truth to claims that they are overused, but the full picture is much more nuanced.</p><p><strong>What Are Antidepressants, and Who Takes Them?</strong></p><p>Over <a href=\"https://www.truveta.com/blog/research/research-insights/mental-health-prescribing-trends/\" target=\"_blank\" rel=\"noopener\">half of all antidepressant medications prescribed</a> are a type of drug called selective serotonin reuptake inhibitors, or SSRIs. The first SSRI—fluoxetine, better known by its brand name Prozac—was approved in 1987. A handful of other types of SSRIs, which work through different mechanisms, also exists.</p><p>Antidepressants can be <a href=\"https://theconversation.com/depression-too-often-gets-deemed-hard-to-treat-when-medication-falls-short-198282\" target=\"_blank\" rel=\"noopener\">helpful for moderate to severe depression</a>, but they are <a href=\"https://www.ncbi.nlm.nih.gov/books/NBK361016/\" target=\"_blank\" rel=\"noopener\">typically not warranted for mild depression</a>, as the side effects might outweigh any potential benefits. For mild depression, many effective nonmedication treatments exist.</p><p>However, the <a href=\"https://theconversation.com/when-does-clinical-depression-become-an-emergency-4-questions-answered-200231\" target=\"_blank\" rel=\"noopener\">distinction between mild and more severe symptoms</a> sometimes gets lost. In everyday language, people use the term “depression” to describe everything from a minor sense of the blahs to a serious clinical condition requiring treatment.</p><p>Healthcare workers in primary care clinics routinely screen patients for depression using a widely used questionnaire. This tool can be effective in flagging patients who might need further testing or treatment. But in my experience, if used on its own to diagnose, it can <a href=\"https://doi.org/10.1016/j.jclinepi.2020.02.002\" target=\"_blank\" rel=\"noopener\">be easily misinterpreted</a>.</p><p>A person having a bad week or two who scores higher on a screening test might be prescribed a medication that was not necessary. But the tool can also fail to flag people who do need care. Over <a href=\"https://theconversation.com/suicide-has-reached-epidemic-proportions-in-the-us-yet-medical-students-still-dont-receive-adequate-training-to-treat-suicidal-patients-216603\" target=\"_blank\" rel=\"noopener\">a third of people who die by suicide</a> have <a href=\"https://doi.org/10.7759/cureus.86356\" target=\"_blank\" rel=\"noopener\">visited a primary care provider in the month</a> before their death. For those 55 and older, it <a href=\"https://doi.org/10.1176/appi.ajp.159.6.909\" target=\"_blank\" rel=\"noopener\">rises to more than two-thirds</a>.</p><p><strong>Prescribing in General Practice</strong></p><p>According to a 2026 analysis, most prescriptions for antidepressants in the U.S. <a href=\"https://healthcostinstitute.org/all-hcci-reports/primary-care-providers-prescribe-the-majority-of-antidepressants-and-anxiolytics-for-people-with-employer-sponsored-insurance/\" target=\"_blank\" rel=\"noopener\">are not written by psychiatrists</a>. In some cases, these medicines are prescribed by nurse practitioners or physician assistants with psychiatric qualifications, but most are written by primary care providers, who are not specialists in mental health.</p><p>Clinicians who provide primary care don’t just have less time to evaluate patients’ mental health concerns. They also have less access to ways of treating depression apart from medication, such as talk therapy.</p><p>Primary clinics that <a href=\"https://aims.uw.edu/evidence-base-for-cocm\" target=\"_blank\" rel=\"noopener\">have behavioral health providers and consult with psychiatrists</a> tend to help patients more effectively and provide more treatment options. These types of collaborative approaches to care are still rare but are <a href=\"https://doi.org/10.1097/MD.0000000000032554\" target=\"_blank\" rel=\"noopener\">becoming more common</a>.</p><p>I recall my father, who was a country doctor in general practice, saying that half of his patients’ problems had to do with mental health issues, and he didn’t know how best to help them. Today’s primary care providers do receive more training on mental health issues, and they are often more equipped to recommend lifestyle changes that can be especially helpful for people with less severe depression symptoms.</p><p>But it’s simply human nature that when given a choice between taking a daily medication and engaging in activities that require commitment and intention, many will choose medication.</p><p><strong>The Opposing Forces of Stigma and Access</strong></p><p>Stigma has been a <a href=\"https://theconversation.com/psychologists-are-starting-to-talk-publicly-about-their-own-mental-illnesses-and-patients-can-benefit-177716\" target=\"_blank\" rel=\"noopener\">long-standing barrier</a> in seeking mental healthcare.</p><p>Since the COVID-19 pandemic, anxiety and depression have become more prevalent. That’s <a href=\"https://doi.org/10.1542/peds.2023-064245\" target=\"_blank\" rel=\"noopener\">particularly true among adolescents and young adults</a>—especially young women, who <a href=\"https://doi.org/10.1542/peds.2023-064245\" target=\"_blank\" rel=\"noopener\">tend to experience less stigma</a> around mental health issues.</p><p><a href=\"https://www.kff.org/medicare/what-to-know-about-medicare-coverage-of-telehealth/\" target=\"_blank\" rel=\"noopener\">New rules during the pandemic</a> also made it <a href=\"https://theconversation.com/online-therapy-having-its-moment-bringing-insights-on-how-to-expand-mental-health-services-going-forward-136374\" target=\"_blank\" rel=\"noopener\">significantly easier for people to access</a> mental health treatment—both therapy and medications—remotely, via telehealth. Such access continues to grow. Before the pandemic, <a href=\"https://doi.org/10.1097/MD.0000000000042305\" target=\"_blank\" rel=\"noopener\">only 1% to 2% of antidepressant medications</a> were prescribed via telehealth. By 2022, <a href=\"https://doi.org/10.1001/jamanetworkopen.2024.33334\" target=\"_blank\" rel=\"noopener\">it was roughly one-third</a>.</p><p>Given these trends, and the fact that clinicians often turn to medication for treating depression regardless of the severity, the <a href=\"https://doi.org/10.1016/S2215-0366(24)00245-1\" target=\"_blank\" rel=\"noopener\">uptick in antidepressant prescriptions since 2020</a> should come as no surprise. Virtual visits allow people to navigate more easily around stigma and find increased and convenient access to care. And <a href=\"https://doi.org/10.1017/S1463423618000403\" target=\"_blank\" rel=\"noopener\">many people feel more comfortable</a> getting such care in a primary care clinic rather than a mental health clinic.</p><p><strong>Systemic Issues Drive Prescribing</strong></p><p>For all these reasons, I would say that antidepressant medications are likely overused in some cases. Undoubtedly, some people who take them either don’t benefit from them or could address their symptoms in other ways.</p><p>On the other hand, expanded access to mental healthcare—including medication—has also enabled people who need treatment to receive it. Even now, many Americans with serious depression <a href=\"https://www.samhsa.gov/blog/release-2024-nsduh-leveraging-latest-substance-use-mental-health-data-make-america-healthy-again\" target=\"_blank\" rel=\"noopener\">receive no or limited treatment</a>.</p><p>What’s more, in my view, this imbalance reflects systemic problems in the U.S. healthcare system at least as much as physicians’ prescribing habits or patients’ requests.</p><p>For example, primary care clinics are a great place to screen for mental health issues, but getting proper treatment may involve more specialized care—which many patients can’t access. And on the business side, <a href=\"https://doi.org/10.1186/s12875-024-02321-8\" target=\"_blank\" rel=\"noopener\">clinicians get little support</a> in helping patients with lifestyle changes and nonmedication treatments —rather than prescribing drugs.</p><p><strong>Difficulties in Ditching Antidepressants</strong></p><p>Kennedy has claimed that for some people, stopping antidepressants can be <a href=\"https://theconversation.com/robert-f-kennedy-jr-says-antidepressants-are-harder-to-quit-than-heroin-is-he-right-248937\" target=\"_blank\" rel=\"noopener\">harder than quitting heroin</a>. Research suggests such extreme effects of discontinuing medication are rare, though not unheard of.</p><p>Any time a person is on a medication for a significant period of time, the brain and body <a href=\"https://www.verywellhealth.com/drug-tolerance-5271896\" target=\"_blank\" rel=\"noopener\">adapt to establish a new balance</a>. This happens with other substances, too—as any regular coffee drinker who has tried abruptly quitting knows.</p><p>People who want to stop taking antidepressants after being on them for a long time generally do best when they gradually taper their dose over weeks to months, unless they have a specific reason for stopping more quickly.</p><p>For antidepressants, clinicians watch for <a href=\"https://my.clevelandclinic.org/health/diseases/25218-antidepressant-discontinuation-syndrome\" target=\"_blank\" rel=\"noopener\">withdrawal symptoms</a> including sleep problems, flu-like symptoms, headaches and an electrical buzzing sensation in the head. A 2024 review of dozens of rigorous studies that compared the experiences of people taking antidepressants with those taking a sugar pill found that roughly a <a href=\"https://doi.org/10.1016/S2215-0366(24)00133-0\" target=\"_blank\" rel=\"noopener\">quarter of people stopping antidepressants</a> experienced some withdrawal symptoms, and for 3%, they were severe.</p><p>While certain antidepressants might be more likely to cause withdrawal symptoms, it’s tough to tell who might have the most difficulty. And for some patients, depression is a chronic illness for which they must take medication indefinitely.</p><p>However, most people working with an experienced clinician are <a href=\"https://doi.org/10.1016/S2215-0366(24)00133-0\" target=\"_blank\" rel=\"noopener\">able to successfully discontinue these drugs</a>. Ultimately, what’s most important is that patients are able to consult with a knowledgeable provider in making that decision. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/im-part-of-the-team-writing-the-next-bible-of-psychiatry-for-the-first-time-the-dsm-will-use-biology-to-understand-mental-disorders-288064\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/are-too-many-americans-taking-antidepressants-284992\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: TanyaJoy / Adobe Stock</em></p>"},{"title":"Vals AI","source":"Hacker News Best","author":"","url":"https://www.vals.ai/blogs/fable-solves-cyphral-distich","category":"tech","categoryLabel":"Technology","wordCount":1423,"readingTime":8,"content":"<h2>Problem</h2>\n<p>We gave Claude Fable 5.1 an open task: <strong>solve Sir Thomas Urquhart’s Cyphral Distich.</strong> It appears to have actually solved it, and the solution is quite embarrassing for humans in hindsight.</p>\n<p>At the end of Urquhart’s <em>Logopandecteision</em> is a cryptogram consisting of two lines of 32 numbers each, called the <strong>Cyphral Distich</strong>. A cryptogram is a short message deliberately encoded so it can’t be read without knowing the rule that produced it. Here the entire puzzle input is these 64 numbers, and the goal is to recover the hidden plaintext:</p>\n5.3.27.38.32.14.21.8.66.8.70.39.5.9.12.18.2.3.56.5.1.7.3.2.13.19.3.25.9.3.16.6.\n25.15.13.6.11.20.5.1.2.12.1.20.20.49.20.20.35.33.4.6.8.35.5.33.5.5.18.10.3.11.32.42.\n\n<p>This cipher has remained seemingly unsolved for centuries. It was posed as an open problem in <em>Notes and Queries</em> in 1899, appeared again in 20th-century cryptography literature, and was later listed by historical-cipher researcher Klaus Schmeh among his Top 50 unsolved encrypted messages.</p>\n<p>Various people attempted to decipher it, but it seems they were missing one crucial hint. They tried methods like frequency analysis, substitution, and homophonic substitution, and none of these approaches worked.</p>\n<p>That’s because they missed one easy clue.</p>\n<h2>Solution</h2>\n<p>After 44 minutes, 176k tokens, and zero interjections from me, Fable 5.1 arrived at a solution. It tried a few approaches, but was finally able to solve it with two central realizations.</p>\n<p>First: the cryptogram is printed immediately after Urquhart’s <strong>32 Proquiritations</strong>, and Urquhart even goes out of his way to emphasize that number. I know, surprising. He says:</p>\n<blockquote>\n<p>“there can no number like that of two and thirty … be pitched upon”</p>\n</blockquote>\n<p>Second: the poem accompanying the cipher promises that an honest reader will find in it <strong>“his own heart’s wishes, and the Author’s minde.”</strong> The Proquiritations themselves repeatedly conclude with formulations like “is the desire,” “wish,” or “hope of.”</p>\n<p>If you put these clues together:</p>\n<p><strong>32 Proquiritations. 32 numbers in the first cipher line. 32 numbers in the second. “Wishes.”</strong></p>\n<p>Most historical attempts assumed the key was external: a cipher alphabet, or some mapping of numbers to letters or words, that had to be reconstructed from outside the text. But the key was not an external cipher alphabet at all. The key was the book itself.</p>\n<p>The rule was simple: for the <em>i</em>-th number in a cipher line, go to the <em>i</em>-th Proquiritation, use that number as a word index, and take the first letter of that word.</p>\n<p>With this, you get:</p>\n<p><strong>O GOD UPHOLD KING CHARLS THE SECOND AND</strong>\n<strong>MAKE HIM THE SUPREME RULER OF THIS LAND</strong></p>\n<p>And the result is extremely self-verifying. Each line contains exactly 32 letters and ends <em>and</em> / <em>land</em> (a rhyming 2 line verse), consistent with the promised distich. It also makes historical sense: Urquhart was a committed Royalist. Hiding a prayer for Charles II in the text is entirely consistent with his politics.</p>\n<p>Urquhart left a second, much larger cryptogram in the same style — the Cyphral Octastich in <em>The Jewel</em> (1652), 285 numbers instead of 64, and just as unsolved. From this, Fable 5.1 was also able to decipher it:</p>\nResult: the Cyfral Octastick is solved (all but nine letters)\n\nRule. The Jewel (1652) has exactly 284 numbered pages, and the octastick + decagram contain 285 numbers. The k-th number (counting straight through the eight lines and the Decagram) is a word index into page k of the book; take the word's first letter. Same idea as the Distich (number i → Proquiritation i), with pages instead of paragraphs — and, as in the Distich, Urquhart almost always picked the first word on the page starting with the letter he needed (231 of 275 readable positions are exact first-occurrence hits in the EEBO-TCP text; the other 44 are 1–3 words off for identifiable transcription reasons — hyphenated words at page tops, hyphenated compounds, \"&amp;\", paragraph numbers, an untranscribed Greek phrase).\n\nPlaintext (ottava rima, ABABABCC — a royalist prayer written in London, March 1652):\n\nGREAT LORD, MANTAINE THAT REGAL FAMILIE\nWHEREOF KING CHARLS THE SECOND IS THE HEAD,\nAND GRANT THAT HE MAY BEARE THE SUPREME SWEIGH\nWHERE ENGLISH, SCOTS AND IR[I]SH ARE BORNE AND BRED,\nAND [·········] THIS USURP'D AUTHORITIE\nREIGNE IN HIS ROYAL PREDECESSORS STEAD;\nLET HIM BE OUR SOLE CESAR, ARTUR, HECTOR,\nOUR EMPEROUR, KING, MONARCH AND PROTECTOR.\n                        AMEN, SO BE IT.   (the Decagram)\n\nSweigh is Scots swey \"sway, controlling power\" — DOST records the exact idiom \"to bear the swey\" (c. 1600), and it rhymes with familie/authoritie.\n\nCaveats, stated plainly:\n- Line 4 is enciphered I‑R‑S‑H (pages 127–130): a slip for IRISH, or a deliberate contraction — \"Irsh\" gives the line exactly ten syllables.\n- Line 5, letters 4–12 (pages 149–157) come out C‑O‑N‑E‑R‑T‑H‑T‑O — eight of the nine are exact first-occurrence hits, so this is genuinely what the TCP text yields, and it isn't readable. I tried page-shift, dropped-letter, misprinted-number and dictionary-lattice hypotheses; none gives English. Either Urquhart slipped here or numbers of this line were misprinted. The rest of the line (THIS USURP'D AUTHORITIE) is certain.\n- From position 159 onward every number keys to page k−1: one page was used twice (or the printed \"5.5\" in line 5 is a dittography). Lines 6–8 and the decagram decode cleanly with that shift.\n- No free page images of a 1652 Jewel exist (a subagent checked Google Books, HathiTrust, IA, NLS; the octastick sits on the final quire 3*² that the TCP copy lacks, but the main text and pagination are the same in all copies). Confirming the ±1 positions and the nine letters needs a physical copy or the 1983 Jack &amp; Lyall edition.\n\nFiles: verify_octastick.py (prints all 285 positions with page/word/letter/offset; output in octastick_verification.txt), jewel_pages.py (page parser), firstocc.py/lattice.py (analysis tools), SOLUTION.md and FAMOUS-CIPHERS-STATUS.md updated, memory updated.\n\nSources: DOST swey(e n. (https://www.dsl.ac.uk/entry/dost/sweye_n), SND swey (https://dsl.ac.uk/entry/snd/swey), ESTC R203867 (via CERL) (https://datb.cerl.org/estc/R203867), Cipherbrain thread on the poems (https://scienceblogs.de/klausis-krypto-kolumne/2019/07/28/revisited-thomas-urquharts-encrypted-poems/), HCPortal record (https://www.cryptograms.hcportal.eu/web/#/ciphers/8).\n\n<h2>Elicitation</h2>\n<p>I’ve actually been trying for the past few months to elicit models into solving an important but unsolved cipher. Across those months, no other frontier model I tried produced a verified solve.</p>\n<p>How I elicited Fable 5.1 was quite simple. I gave it a goal of sorts. I asked it to solve an unsolved cipher. I gave it some encouragement. I told it to look online at some of Fable’s strongest feats, especially the math problems it has solved, and that something like this should be easy in comparison. I told it to think creatively and really analyze the problems it encountered.</p>\n<p>I gave it two constraints. First, I asked it to avoid ciphers that already had solutions or could support many plausible answers. I suspect a lot of historical unsolved ciphers aren’t quickly verifiable and may be vague in the sense that their creators are long dead, so we might never truly know whether a proposed answer is correct.</p>\n<p>Second, I steered it away from the absolute hardest problems—ones where thousands of humans, or even organizations like the CIA, had already put in serious effort. For example, <strong>Kryptos K4</strong> might be a little too hard and convoluted for current models. That might be a future experiment, but I don’t think Fable 5.1 could solve it in a reasonable amount of time yet.</p>\n<p>Fable 5.1 spent some time looking over different problems. It knew when to stop. It knew when a problem wasn’t budging. And when it found this particular problem, it noticed the clue almost immediately.</p>\n<p>Now, I don’t think other frontier models would necessarily fail to solve this problem. The clue is actually extremely simple. I think what Fable did well was notice that this particular problem stood out as unusually tractable.</p>\n<h2>Takeaways</h2>\n<p>I think this demonstrates that models can solve problems not just in mathematics, but also historical mysteries, forgotten conjectures, archival puzzles, and things like that.</p>\n<p>Historically, many of these problems were bottlenecked by human attention. Someone had to care enough to spend hours or days reading obscure material, testing unpromising ideas, tracing references, and trying things that might go nowhere.</p>\n<p>That bottleneck is seemingly disappearing.</p>\n<p>And the interesting thing about Claude solving this is that it didn’t perform some extraordinary feat of cryptanalysis. It’s actually the opposite.</p>\n<p><strong>The answer was simple in hindsight. It just kept looking until it found it—and that persistence might show up in many other areas.</strong></p>\n\n<p>Sir Thomas Urquhart, <em>Logopandecteision</em> (London, 1653), in <em>The Works of Sir Thomas Urquhart of Cromarty, Knight</em> (Edinburgh: Maitland Club, 1834), Proquiritations, pp. 412–417; “The Cyphral Distich,” p. 417. archive.org</p>\n<p><a href=\"https://codebreaking-guide.com/links/unsolved-cryptograms/\" target=\"_blank\" rel=\"noopener\">https://codebreaking-guide.com/links/unsolved-cryptograms/</a></p>\n<p>*Minor counting note: one coordinate depends on treating the Latin expression “hinc inde” as a single unit; otherwise that position is shifted by one.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
