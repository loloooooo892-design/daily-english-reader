*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"Gears of War: E-Day's new Horde may be the game's most interesting mode, but it left me with more questions than answers","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/gears-of-war-e-day-horde-siege-impressions","category":"gaming","categoryLabel":"Gaming","wordCount":860,"readingTime":5,"content":"<p>Fenix rising.</p>\n    \n  \n  \n  \n\n            <p>I've been eager to get my hands on Gears of War: E-Day's new Horde mode, <a href=\"https://www.eurogamer.net/gears-of-war-e-day-horde-versus-confirmed\" target=\"_blank\" rel=\"noopener\">Horde Siege</a>, which appears to be a more smartly designed, more engaging iteration. <a href=\"https://www.eurogamer.net/everything-announced-microsofts-xbox-games-showcase\" target=\"_blank\" rel=\"noopener\">June's Xbox bonanza</a> first look sold me on the campaign, but the iconic mode has long been my favourite non-campaign mode in Gears. And at least so far - looks to be the most revolutionary Horde ever.</p>\n<p>Before I get into my time with it, I have to add a caveat: this hasn't been the most organised preview event I've taken part in. Account authentication and build encryption issues - on two separate occasions - prevented me from delving as deep into it as I could. All told, I only got to play for a little over two hours.</p>\n<p>This might be circumstantial, but it's worth noting <a href=\"https://www.eurogamer.net/microsoft-xbox-layoffs-2026-double-fine-compulsion-ninja-theory\" target=\"_blank\" rel=\"noopener\">Xbox recently cut thousands of jobs</a>, and it's hard to imagine how that wouldn't affect the integrity of similar events. This isn't Xbox's first digital preview; I've been to several over the years, including for the Gears of War series, and I can't think of anything that comes close to last week's E-Day event.</p>\n\n<p>My biggest takeaway from playing Horde Siege is that it feels like a standalone game that could easily exist outside E-Day. Classic Horde - i.e., surviving a set number of waves in a small area - always felt like clever re-use of assets. Siege is an evolution that builds on that legacy to offer something entirely new, particularly to those who could never get into Horde.</p><p>Siege matches take place in an open world, of a sort: a sprawling (by Gears standards) map with multiple objectives. You start off in one corner with your four-player squad, and immediately receive an objective that sends you to a different area. Your main goal typically revolves around a data-collecting device called the R.I.G. Sometimes you need to lure out Locust to \"recalibrate it\", other times you're tasked with defending it.</p>\n<p>Siege maps, meanwhile, make excellent use of their size by dotting secondary objectives around their many sections. I've seen enough variety in my limited time to make me excited to tackle all of them in the final build.</p>\n<p>There's a push for quiet exploration in Siege - a stark contrast to classic Horde's unrelenting onslaughts - underpinned by those secondary objectives. Outside of creating excuses for you to visit areas you may otherwise ignore, they are integral to the flow of gameplay. For one, clearing them awards Squad Perks, in-match stat-boosting modifiers. At the risk of causing you to click off this page, the closest approximation I can think of is, well, MOBAs. Like them, the flow of Siege encourages clearing multiple side objectives to get your character strong enough to tackle bosses and future waves.</p>\n\n<p>What caught me completely off-guard, though, was a slight extraction shooter element: another reward for completing side objectives are Weapon Parts. Unlike Squad Perks, however, they're entirely useless within the round itself. If you successfully extract with your parts intact (no pun intended), you can later use them to upgrade your weapons.</p><p>Yes, extraction is now a core Horde mechanic. It immediately reminded me of the recent iterations of Zombies in Call of Duty, where you get the choice of extracting and keeping your XP every 10 or so waves. It works similarly here, and it's your only way out. The rush I felt in those three-minute holdouts as everyone waits for the helicopter, fending off wave after wave of Locust, is remarkably similar to late-round extractions in Zombies.</p>\n\n<p>There's an emphasis on scale here that takes advantage of the large maps. While your immediate concern is your squad, there are three other squads that start at different parts of the map, each tackling their own objectives. It's common to cross paths with them, and you can certainly help each other, but the real reason three squads are even in the same match is Boss Invasions, which more deliberately bring everyone together against a common - very large - enemy.</p>\n<p>These Boss Invasions were another highlight, particularly at the start as everyone pours in to take down the invading boss, whose scale is on the level of major spectacle moments from Gears campaigns. Invasions turn Horde from an intimate test of skill for four players to something akin to Destiny's Public Events.</p><p>My most played mode in the preview, meanwhile, was the aptly named Blitz; a truncated version of Horde that plays out like a speedrun of Siege. Blitz rounds take around 15-20 minutes to complete. Each match picks different objectives from Siege proper to create a condensed version of the real deal, which is part of what made it easy to pick up and enjoy. Blitz exists to offer a straight-to-the-point variant of Siege for those short on time, but it's a complete experience on its own that you wouldn't guess is the smaller sibling of a bigger mode.</p>\n<p>Horde Siege evidently has plenty to chew on, even if preview event logistics put a damper on my first impression. I can tell I'm going to be spending a lot of time with it.</p>"},{"title":"Extra! Extra! Read All About It . . . Again","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/10/extra-extra-read-all-about-it-again","category":"fun","categoryLabel":"Interesting Reads","wordCount":876,"readingTime":5,"content":"<p>The <em>Times</em> has published sixty thousand nine hundred and sixty-some issues, so what are the odds that today’s paper is the one you really want to read? “The news doesn’t change that much,” Aaron Reiss, an aspiring entrepreneur, said one recent morning. “A newspaper costs around four dollars, and it’s the quickest-expiring product in the world. Even milk lasts longer. So I was, like, What if I sell old news? That’s free for me, and it’s still good.”</p><p>Reiss was on the corner of Thirty-fourth and Ninth, outside B&amp;H Photo, where he’d just opened a kiosk called the Old News Newsstand. “I came up with this catchphrase I’m very proud of. ‘Old News: Still bad, but cheaper and more predictable,’ ” he said. His price for an old issue of the <em>Times</em> was three dollars—about twenty-five per cent off. It was a Friday morning (“<em>Iran and U.S. Escalate Strikes Despite Countries’ Emphasizing Peace</em>”), and Reiss rolled up a metal grate and laid out the news for the day, which wasn’t that day’s news but could’ve been. He had a bunch of June <em>Timeses</em>, salvaged from the trash. June 13th: “<em>In Gray Area of Not Peace And Not War</em>.” June 18th: “<em>Trump Lashes Out At Critics of Deal</em>.” June 21st: “<em>Strait Is Closed</em>.” “It’s the exact same shit,” Reiss said.</p><p>Reiss, who wore a button-down, unbuttoned, over a wifebeater, has the job history of the highly educated itinerant class. He’s been a researcher at a design agency, a lecturer at Yale (Urban Studies 3307: Telling Stories with Maps), a journalist, a ceramist, and a hot-chocolate salesman. “I sold out of a pushcart near Seward Park, out of my ceramic cups,” he said. “I sold it for two dollars, very cheap, and I’d say, ‘If you like the cup, keep it for twenty.’ ”</p><p>The newsstand idea was meant to expand his ceramics business. Initially, old news was partially a regulatory work-around: all sidewalk newsstands in the city must sell periodicals. But eventually it became an organizing principle. “Now we sell weird stuff that’s newsstand-related,” Reiss said. There are ceramics and art, plus zines (<em>Several Chairs I Briefly Loved, Vol. 3</em>; <em>Americans Draw America</em>) and unusual snack items—Jordanian chewing gum, Iraqi Cokes, Taiwanese canned cappuccino. There’s a rotating exhibition of photos from the New York Public Library’s Picture Collection. Reiss’s five-year-old son, Milo, contributed art, on which he’d written “Free 0¢.” “Wrong,” Reiss said. “I charge a dollar.” He has old magazines, too. “I really wanted to have porn,” he said. “So we have old <em>Playboys</em>.” Most customers want cigarettes or lottery tickets, but he’s not selling those. “Those things ruin people’s lives,” he said. “Plus, I would smoke all the cigarettes.” Instead, a friend is developing a scratch-off zine concept, and another friend is writing “loosie” poems, rolled up like cigarettes. He splits the revenue with the artists.</p><p>Reiss opened for business. Sales were slow. It was his thirty-ninth birthday, and most of the early foot traffic was friends. His wife, Lizzie Fulton, arrived at the same time as an artist friend named Max Glaser, who’d brought a box full of old nudie mags. “Check this out,” Reiss said. “A huge crate of smut!” He did a little dance. He and his business partner, Sylvea Wong, had been cutting pictures from books of erotica and bundling them as “vintage mini smut,” for five dollars. “The way somebody takes a pickaxe to a mountain to turn a big rock into small diamonds, we’re doing the same thing with the smut,” Reiss said. The previous day had seen his best sales so far. “I need about seventy dollars to break even,” he said. “I think we’ll do it today.”</p><p>Glaser looked skeptical.</p><p>“You think my accounting is all fucked up,” Reiss said.</p><p>“It’s really bad,” Glaser said.</p><p>Reiss opened a ledger, which was just a notebook page listing items beside tally marks. “He won’t tell anyone how much he paid for the stand,” Fulton said. “And I was, like, ‘This actually affects me.’ ”</p><p>Business picked up. Reiss called out, “We got weird shit for weird people!”</p><p>A man heading to B&amp;H asked, “Do you have Zyns?”</p><p>“We have zines,” Reiss said. The man bought a painted ceramic toadstool for ten dollars. “That’s how you fucking sell a fucking thing,” Reiss said.</p><p>The old papers went fast. Tourists love them. “They’re on their way out of the city and want an object,” Reiss said.</p><p>Reiss has his regulars. He stocks kosher snacks for B&amp;H employees. One news vender on Sixth Avenue offered mentoring. “I told him I was selling water for a dollar,” Reiss said. “He was, like, ‘You’re an idiot.’ But he sold me some cases at cost.”</p><p>At the end of the day, Reiss had made a hundred and eighty-two dollars. “I’m in the green!” he said. His friends think that his newsstand is performance art. “This is a literal store,” he said. “It’s a capitalist endeavor.”</p><p>At home that evening, Reiss reran the numbers and discovered an error: he’d forgotten about paying the artists. “My current cash position is negative twenty-six dollars and sixteen cents,” he reported. “Accounting is an emotional practice.” ♦</p>"},{"title":"Schools Owe No Legal Duty \"to Former Students to Investigate Allegations of Past Abuse,\"","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/03/schools-owe-no-legal-duty-to-former-students-to-investigate-allegations-of-past-abuse/","category":"law","categoryLabel":"Law","wordCount":500,"readingTime":3,"content":"<p>From last Monday's decision by Magistrate Judge Mark Dinsmore (S.D. Ind.) in <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.insd.222118/gov.uscourts.insd.222118.62.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Kimberlin v. Metro. School Dist. of Wash. Township Schools</em></a> refusing to allow Brett Kimberlin to add an extra claim to his pending lawsuit (see <a href=\"https://reason.com/volokh/2026/03/16/speedway-bomber-brett-kimberlins-latest-lawsuit/\" target=\"_blank\" rel=\"noopener\">here</a> for more on the original claims):</p>\n<blockquote><p>[Plaintiff] claims Defendants failed to adequately respond to a letter he sent Dr. Woodson in 2024 accusing a now-deceased schoolteacher of sexually abusing him while he was a middle school student in the 1960s. The teacher's employment with the school ended in 1969, and Plaintiff left the state of Indiana in 1978. Plaintiff currently resides in the state of Maryland, and he does not allege to have any present affiliation with the School District, aside from sending his letter to Dr. Woodson in 2024.</p>\n<p>The complaint alleges that rather than investigate his claims, as is required by the School District's own policies, Dr. Woodson and others engaged in an effort to dismiss and cover up his allegations. Based on these allegations, the complaint asserts claims against Defendants under Title IX and the Fourteenth Amendment Due Process Clause and Equal Protection Clause….</p>\n<p>[T]he proposed amended complaint asserts an additional claim against Dr. Woodson for negligence. The negligence claim alleges that Dr. Woodson failed to comply with Indiana's mandatory reporting statutes, which require school officials and others to immediately report allegations of child abuse to law enforcement. It also alleges that Dr. Woodson failed to follow the School District's own policies with respect to allegations of child abuse and that she tried to cover up Plaintiff's allegations….</p></blockquote>\n<blockquote><p>There is a consistent line of cases holding that Indiana's mandatory reporting statutes do not provide a private right of action….</p>\n<p>To the extent Plaintiff attempts to assert a negligence claim against Dr. Woodson for failing to comply with the School District's policies concerning reports of child abuse, that attempt is also futile because the proposed amended complaint does not create a reasonable inference that Dr. Woodson owed Plaintiff a duty of care in 2024 to investigate his allegations of abuse occurring in the 1960s. \"Indiana recognizes a duty on the part of school personnel to exercise ordinary and reasonable care for the safety of their students.\"</p>\n<p>But … the proposed amended complaint does not support a reasonable inference that Dr. Woodson owed Plaintiff this duty when he sent his letter in 2024 because he was not a student at that time and no students were in danger of abuse from the now-deceased accused schoolteacher[.] By the time he sent his letter, Plaintiff had not been enrolled in the School District for approximately 50 years, and Dr. Woodson's alleged conduct could not have endangered the safety of the School District's students. Plaintiff's reply does not address this argument, and neither his motion to amend nor his proposed amended complaint supports a theory that school districts or their personnel owe a duty of care to former students to investigate allegations of past abuse….</p></blockquote>\n<p>Jonathan Lamont Mayes (Bose McKinney &amp; Evans, LLP) represents defendants.</p>"},{"title":"U.S. has used 'virtually all' of its long-range precision missiles during Iran war: Reuters","source":"Hacker News Best","author":"Reuters","url":"https://www.cnbc.com/2026/08/04/us-has-used-virtually-all-of-its-long-range-precision-missiles-report.html","category":"tech","categoryLabel":"Technology","wordCount":1008,"readingTime":6,"content":"<p>The U.S. Army has used up much of its stockpile of highly accurate long-range missiles during its five-month war with Iran, according to three people familiar ⁠with the data, raising concerns about the military's readiness for future conflicts.</p><p>The missiles are principally the Army's surface-to-surface weapons, known as Army Tactical Missile Systems (ATACMS) and Precision Strike Missiles (PrSM). The U.S. has used \"virtually all\" of these weapons, according to two of the sources.</p><p>The degree to which the ​military is running out of ATACMS and Precision Strike Missiles has not ​been previously reported. The long-range munitions are an important part ​the military's arsenal, allowing accurate strikes from a safe distance. U.S.-supplied ATACMS have played a key role in the war in Ukraine, allowing Ukrainian forces to attack targets inside Russia. The PrSM is a newer, more advanced generation that will replace the ATACMS, which have a shorter range.</p><p>Analysts say such weapons – which cost over $1 million each – would also be important in any conflict with China.</p><p>The sources declined to say how many of each munition the U.S. had left.</p><p>President Donald Trump launched the ⁠Iran war ‌jointly with Israel in February, predicting that the conflict would last a short time.</p><p>But as the war drags on, the ⁠three people familiar with the matter expressed worry that the falling missile supplies could limit the U.S. ability to deter adversaries, including Russia and China.</p><p>A fourth person familiar with the matter said that while Central Command — which oversees U.S. forces in the Middle East — has nearly used up the land-based missiles it had before the war began, it has been able to reload from U.S. military supplies elsewhere in the world.</p><p>The sources interviewed for this story spoke on the condition of anonymity.</p><p>Asked for comment on the stockpile data, the White House issued a statement ‌from Trump, saying the U.S. had \"far more munitions than anyone in the world\" and \"far more than we need.\"</p><p>\"Our defense companies are, at this moment, making more munitions than they have ever made before, in addition to expanding their plants and equipment at record levels,\" Trump said.</p><p>Analysts agree that certain munitions, including artillery shells and several types of missiles, are being produced at record levels but caution that ​supplies might far short of what is needed for a prolonged war.</p><p>Lockheed Martin, which makes the ATACMs and PrSMs, along with the anti-ballistic missile THAAD system, did not immediately respond to questions about Trump's statements or about supply levels. Raytheon, which makes Tomahawk missiles and Patriot interceptors, two important U.S. weapons, also did not immediately respond.</p><p>Responding to a request for comment, chief Pentagon spokesperson Sean Parnell said: \"America's military is the most powerful in the world and has everything it needs to execute at the time and place of the President's choosing. We have executed multiple successful operations across combatant commands while ensuring the U.S. military possesses a ⁠deep arsenal of capabilities to protect our people and our interests.\"</p><p>The supply figures have circulated inside the federal government over the last week during tense conversations inside the Trump administration about how much longer the U.S. can continue striking Iran without drawing down the ‌stockpile to levels that would limit the military's ability to respond to crises elsewhere.</p><h3>Warnings over weapons supplies </h3><p>One of the sources said the drawdown of the ‌ATACMS and PrSM stockpiles reflected a decision by the Trump administration to avoid riskier ways of attacking Iranian targets, such as by using piloted aircraft to drop bombs.</p><p>Because these weapons allow the military to attack targets from a distance, analysts say they would be valuable in a war against an adversary with strong air defenses, such as China. They have been used to strike targets inside Iran, according to a March report by the Center for Strategic and International Studies (CSIS).</p><p>According to the report, PrSM stockpiles were low to start with, since ⁠it is a relatively new munition, but the U.S. military has ordered a large number of them for 2027. The Army has said that ATACMS are being phased out and that production ⁠is shifting to the newer PrSM missiles.</p><p>Military leaders have for weeks warned the president that stockpiles of defensive weapons — including Patriot interceptors, which are effective against ballistic missiles — were dwindling, said two of ⁠the sources. Last week, several media outlets reported Trump had decided not to launch another massive offensive inside Iran in part because his military advisers had warned about the U.S. stockpile.</p><p>A U.S. official disputed those accounts, saying Trump chose not to move forward with another attack because of pressure from Gulf states.</p><p>The Middle East conflict has sparked intense debate about Trump's ​authority to prosecute hostilities against Iran without congressional authorization. No request for a declaration of war or an authorization to ‌use military force has been submitted to Congress.</p><h3>Defensive weapon stocks are also diminished </h3><p>Last week, CSIS published a report estimating that between February and July about 65% of Patriot interceptors had been expended and that the number of THAAD ballistic missile interceptors in U.S. stockpiles was at least 38% lower than at the start of the war. Patriots and THAADs are systems that detect and destroy incoming missiles and are among the most effective in the country's arsenal.</p><p>While Reuters has not seen the supply figures, those numbers match internal U.S. data, two of the sources said.</p><p>The U.S. also burned through a little less than half of its global supply of Tomahawk cruise missiles, which are generally launched from ships, since the start of the war, one of the sources said.</p><p>Reuters could not ​independently verify that number.</p><p>The Tomahawk is a Navy weapon, launched from destroyers, cruisers and ‌submarines, and has long served as the sea service's principal means of striking heavily defended targets without risking pilots.</p><p>Raytheon, a unit of RTX, has reached a tentative multi-year agreement with the Pentagon aimed at boosting Tomahawk production, alongside increases in other munitions, as Washington races to rebuild stockpiles.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
