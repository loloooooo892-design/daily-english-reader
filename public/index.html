<style>
:root {
  --bg: #F7F8FA;

  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;

  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Nvidia says it would be making a whole lot more money if it weren't for the memory crisis it's contributing to","source":"PC Gamer","author":"James Bentley","url":"https://www.pcgamer.com/hardware/nvidia-says-it-would-be-making-a-whole-lot-more-money-if-it-werent-for-the-memory-crisis-its-contributing-to/","category":"gaming","categoryLabel":"Gaming","wordCount":519,"readingTime":3,"content":"<p>Nvidia's latest earnings call is in and, as you can probably guess, the GPU maker turned AI hardware creator is raking in cash hand over fist. But alas, a projected 70% revenue increase for the 2028 fiscal year is apparently conservative, as the blasted <a href=\"https://www.pcgamer.com/hardware/memory/ram-and-storage-is-ridiculously-expensive-right-now-because-of-drumroll-ai-of-course-and-theres-little-reason-to-think-prices-will-drop-any-time-soon/\" target=\"_blank\" rel=\"noopener\">memory crisis</a> is getting in the way. You know, that memory crisis, which Nvidia's AI aspirations are currently making worse.</p><p>When asked about that 70% figure specifically, CEO Jensen Huang confirmed that it's a \"constrained\" number that is informed by the lack of available memory in the market</p><p>Huang says, \"The unconstrained would be a lot higher. We grew 100% year-over-year this year. The unconstrained is significant. And so we're just going to have to work hard to get more capacity. And we have a large supply chain\".</p><p><a href=\"https://s201.q4cdn.com/141608511/files/doc_financials/2027/Q227/Q2FY27-CFO-Commentary.pdf\" target=\"_blank\" rel=\"noopener\">Nvidia's financials</a> paint an interesting picture, specifically one where data centers account for the majority of revenue, and consumer demand lacks in response. Nvidia made $96.2 billion in the latest quarter, with a gross margin of 75% and data center revenue accounting for $89 billion. That's a 117% jump from last year.</p><p>Annoyingly, Nvidia doesn't report gaming in financial earnings, and instead wraps it into 'Edge Computing', which includes gaming, workstations, physical AI PCs and robotics. That accounts for $7.1 billion in the latest earnings call. That's a 27% jump from last year.</p><p>In regard to Edge Computing, Nvidia says \"increases were driven by strong sales of Blackwell workstations, partially offset by slower consumer PC sales that were tempered by elevated memory and systems prices.\"</p><p>As of today, the <a href=\"https://www.pcgamer.com/hardware/graphics-cards/amd-radeon-rx-9700-xt-review-asus-prime-oc/\" target=\"_blank\" rel=\"noopener\">RX 9070 XT</a> and <a href=\"https://www.pcgamer.com/hardware/graphics-cards/amd-radeon-rx-9060-xt-16-gb-review-xfx-swift/\" target=\"_blank\" rel=\"noopener\">9060 XT</a> are sitting atop the <a href=\"https://x.com/TechEpiphanyYT/status/2092865348697485339?s=20\" target=\"_blank\" rel=\"noopener\">Amazon and Mindfactory GPU sales</a>. It's not yet clear if pricing, stock, or a combination of both are responsible for this shift.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Huang says many investors expressed concerns regarding gross margins with rising component costs, and confirms \"we are experiencing extreme pricing conditions in memory. The magnitude of the price increase has exceeded our prior expectations and [is] headed even higher into next year.\"</p><p>However, he argues, \"We have a really gigantic supply chain. And so we have incredible partners, and we've secured a lot of supply, but we just need a lot more.\"</p><p>It seems the memory crisis is really hitting everyone and is unlikely to end any time soon. Even the likes of Samsung has warned of a <a href=\"https://www.pcgamer.com/hardware/memory/gleefully-counting-its-billions-samsung-cries-warning-of-a-severe-memory-supply-crisis-next-year/\" target=\"_blank\" rel=\"noopener\">'severe' memory supply crisis</a> next year. Pour one out for poor old Nvidia, who will have to pay more for the fire it is currently throwing even more wood onto.</p>\n\n<p>James is a more recent PC gaming convert, often admiring graphics cards, cases, and motherboards from afar. It was not until 2019, after just finishing a degree in law and media, that they decided to throw out the last few years of education, build their PC, and start writing about gaming instead. In that time, he has covered the latest doodads, contraptions, and gismos, and loved every second of it. Hey, it’s better than writing case briefs.</p>"},{"title":"\"Counsel Took Full Responsibility for His Mistakes, Was Not Evasive, and Prioritized Candor to the Court and Opposing Counsel\"","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/25/counsel-took-full-responsibility-for-his-mistakes-was-not-evasive-and-prioritized-candor-to-the-court-and-opposing-counsel/","category":"law","categoryLabel":"Law","wordCount":778,"readingTime":4,"content":"<p>From Judge Jennifer Choe-Groves (Ct. of Int'l Trade) Thursday in <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.ded.85202/gov.uscourts.ded.85202.115.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Disruptive Resources, LLC v. Ballistic Barrier Prods. Inc.</em></a> (D. Del.):</p>\n<blockquote><p>Before the Court is an action involving claims of patent infringement between Plaintiff Disruptive Resources … and Defendants Ballistic Barrier Products Inc. and Mayday Security Solutions LLC …. After Plaintiff's counsel disclosed to the Court that the previously filed Joint Claim Construction Brief … featured multiple errors due to his use of generative artificial intelligence (\"AI\"), the Court ordered counsel to show cause in writing as to why the Court should not impose sanctions for counsel's conduct pursuant to Federal Rule of Civil Procedure 11 ….</p>\n<p>In counsel's letter to the Court, counsel described the events that led to his disclosure of inaccuracies attributable to generative AI. Portions of counsel's reply brief in support of Plaintiff's claim constructions \"included an erroneously proposed construction that deviated from the construction of the terms Plaintiff had advanced through the claim construction process[.]\"</p>\n<p>Counsel stated that he used the AI system \"Strongsuit\" to generate an initial outline of Plaintiff's reply brief and to pull statements from a deposition that supported Plaintiff's position on claim construction. Counsel used directed prompts to complete an initial draft of the reply brief that integrated extrinsic evidence mentioned in the deposition.</p>\n<p>When editing the draft, counsel \"jumped from section to section\" and mistakenly \"believed [he] had edited the entire brief, when in reality, [he] had missed the 1-page section\" that proposed an incorrect construction. Counsel admits that he failed to conduct a final review of the entire brief and \"overlooked some of the arguments being made.\"</p>\n<p>Upon discovering the erroneous statements in the brief, counsel notified opposing counsel and proposed amending the Joint Brief to implement footnotes to address the erroneous proposed constructions. The Parties later filed a [Joint Letter] disclosing these issues to the Court. Counsel argues that his actions did not violate Rule 11 or any rules of professional conduct because the reply brief was not presented for an improper purpose, the claims and legal contentions were supported by authentic existing law, and all factual contentions were supported by evidenceCounsel suggests that his errors were \"more akin to taking litigation positions that are ultimately borne out to not be adopted by the Court.\"</p></blockquote>\n<blockquote><p>The Court observes that the Joint Letter identified that two sections of the Joint Brief contained a concluding statement that proposed an incorrect claim construction, and a third section was withdrawn entirely because it \"contained more pervasive errors.\" Plaintiff sought to strike the problematic section of its reply brief, causing Defendants to also strike their subsequent briefing that responded to the inaccurate AI-generated arguments put forth by Plaintiff. This demonstrates that counsel's erroneous constructions not only impacted the accuracy and strength of Plaintiff's legal arguments, but caused opposing counsel to spend time responding to erroneous arguments that have now been struck.</p>\n<p>The incorporation of the use of generative AI in the legal field is growing exponentially, and this is exemplified by counsel's admitted use of large language models in his legal practice to ease the workload on his smaller law firm. Nevertheless, \"when using AI, litigants must still strictly adhere to all rules of professional conduct.\" In both his letter to the Court and statements made during the hearing, counsel expressed regret over the unfortunate outcome of his use of AI without thorough review and recognized the importance of maintaining a higher standard of diligent lawyering than what led to the erroneous briefing.</p>\n<p>The circumstances of this case are different compared to other instances when the use of AI led to legal filings with hallucinated case citations or fictitious judges. <em>See</em> <em>Mata v. Avianca, Inc.</em> (S.D.N.Y. 2023) (an attorney \"submitted non-existent judicial opinions with fake quotes and citations created by the [AI] tool ChatGPT, then continued to stand by the fake opinions after judicial orders called their existence into question.\"). In this case, counsel took full responsibility for his mistakes, was not evasive, and prioritized candor to the Court and opposing counsel by disclosing the errors quickly. <em>Contra</em> <em>Mata</em> (finding that the attorney \"knew before making a submission to the Court that the full text of [a fake case] could not be found but kept silent.\").</p>\n<p>The Court expects that these events and this Opinion shall serve as a cautionary warning and learning experience for counsel moving forward. The Court warns counsel that any future incidents involving AI mistakes in this case may result in sanctions.</p>\n<p>Upon consideration of the circumstances as described by counsel, and his appreciation for the gravity of filing erroneous legal arguments drafted by generative AI without proper review, the Court declines to sanction counsel for his conduct….</p></blockquote>"},{"title":"Netflix Failed at Video Games. Now It’s Trying to Promote Them","source":"Wired","author":"@wired","url":"https://www.wired.com/story/netflix-failed-at-video-games-now-its-trying-to-promote-them/","category":"tech","categoryLabel":"Technology","wordCount":679,"readingTime":4,"content":"<p>Later today, Netflix will stream a live event with Rockstar and Take-Two Interactive, the developer and publisher of the highly anticipated video game <em>Grand Theft Auto VI</em>. Called <em><a href=\"https://www.rockstargames.com/newswire/article/9k2kaa1o3297k9/grand-theft-auto-vi-an-extended-look\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto VI: An Extended Look</a>,</em> it’s the third official trailer for the game, which releases on November 19.</p><p>But unlike the two trailers before, this extended look will debut exclusively on Netflix, then be disseminated six hours later across other social platforms like YouTube. (Let’s be honest, people will rip the feed immediately and post it online.) Subscribers can watch the stream <a href=\"https://www.netflix.com/tudum/articles/grand-theft-auto-6-extended-first-look\" target=\"_blank\" rel=\"noopener\">live on Netflix</a>, starting August 27 at 3 pm Eastern (noon Pacific). WIRED will also have a roundup of the event's big takeaways.</p><p>This collaborative stunt follows a week of <a href=\"https://www.ign.com/articles/gta-6-leaker-releases-nightclub-gameplay-video-defends-crypto-scheme\" target=\"_blank\" rel=\"noopener\">hacker leaks</a> and gamer consternation on Rockstar’s decision not to ship the game <a href=\"https://www.wired.com/story/sony-playstation-puts-a-nail-in-physical-medias-coffin/\" target=\"_blank\" rel=\"noopener\">with physical discs</a>. The hackers initially said the leaks, which revealed <em>GTA VI</em> gameplay and <a href=\"https://kotaku.com/watch-out-the-gta-6-leaker-is-now-sharing-story-spoilers-2000728456\" target=\"_blank\" rel=\"noopener\">story spoilers</a>, were attempts to convince Rockstar to include physical discs. But the hackers quickly pivoted to collecting cryptocurrency in exchange for more leaks. Rockstar shared a <a href=\"https://x.com/RockstarGames/status/2092574304571433078\" target=\"_blank\" rel=\"noopener\">statement on X</a> saying the leaks had been “heartbreaking” for the team. It also wrote that the company is “excited for everyone to see the extended look.”</p><p>This marketing extravaganza is an unusual collaboration. Isn't <em>GTA VI</em> big enough for Rockstar to market it on its own? Also, why Netflix? The streaming giant hasn't nailed its attempts at incorporating gaming into its platform. The company <a href=\"https://www.wired.com/story/netflix-gaming-monument-valley/\" target=\"_blank\" rel=\"noopener\">introduced gaming</a> in 2021 with big titles like <em>GTA San Andreas</em> on mobile, but they never really took off, as users <a href=\"https://www.wired.com/story/netflix-mobile-games-no-one-playing/\" target=\"_blank\" rel=\"noopener\">didn’t play them</a>. Netflix has wound down its focus on AAA games and <a href=\"https://www.polygon.com/netflix-shutting-down-game-studios/\" target=\"_blank\" rel=\"noopener\">recently shuttered two of its studios</a>. While the platform might struggle to be a viable traditional gaming platform, it still wants in on that industry.</p><p>It’s not clear which company is paying for the privilege—either Netflix is paying Take-Two for the exclusive, or Take-Two is paying Netflix for access to the <a href=\"https://www.demandsage.com/netflix-subscribers/\" target=\"_blank\" rel=\"noopener\">325 million subscribers</a> that use its service. Either way, Joost van Dreunen, a professor at NYU Stern School of Business who teaches about the business of video games and authors the blog <a href=\"https://superjoost.net/\" target=\"_blank\" rel=\"noopener\">Super Joost</a>, says it's a good move for both companies.</p><p>“Netflix is a distribution hub that can reach a massive audience; that's where they have incredible potential,” van Dreunen tells WIRED. “That's a big shift in how large tech companies and streaming video can work together with game makers.”</p><p>It’s a smart move for Take-Two and Rockstar. <em>GTA VI</em> is an absolute behemoth, 13 years in the making and on just about every gamer's radar. The game's drawn-out release time has become a <a href=\"https://www.wired.com/story/after-more-than-a-decade-of-waiting-gta-vi-is-finally-around-the-corner/\" target=\"_blank\" rel=\"noopener\">meme</a>, after all. But just because it’s bound to sell extremely well doesn’t mean that everyone is aware of it. Netflix, in that case, has the opportunity to leverage its vast customer audience, many of whom might not be gamers already in the know.</p><p>“Netflix can be both a driver of growth by offering publishers a broader audience than the console manufacturers can,” van Dreunen says. “They can normalize or familiarize a nontraditional gaming audience with upcoming releases. They become a marketing tool.”</p><p>For a long time, retail has primarily driven game sales. But physical media is <a href=\"https://www.wired.com/story/physical-media-is-having-a-comeback-the-next-console-generation-may-kill-it/\" target=\"_blank\" rel=\"noopener\">slipping away</a>. Rockstar may not be putting a disc in the box at launch, but Sony has outright said it <a href=\"https://www.wired.com/story/sony-playstation-puts-a-nail-in-physical-medias-coffin/\" target=\"_blank\" rel=\"noopener\">no longer plans</a> to make physical copies of its games. Marketing a game has long been the responsibility of the studio and the platform it's released on. But large tech companies like Netflix and Amazon, with shows based on games such as <a href=\"https://www.wired.com/story/the-witcher-trailer-comic-con/\" target=\"_blank\" rel=\"noopener\"><em>The Witcher</em></a> and <a href=\"https://www.wired.com/story/fallout-jonathan-nolan-video-game-adaptation-amazon/\" target=\"_blank\" rel=\"noopener\"><em>Fallout</em></a>, have proven themselves to be very effective with this kind of marketing on the gaming front.</p><p>Netflix in particular seems keen to nail down its approach to gaming. What better way of kicking that off than by hosting what may be the biggest game ever?</p><p>“This is a really good symbiosis for them,” van Dreunen says. “And it works particularly well for blockbusters.”</p>"},{"title":"The Least-Wanted Items at My Parents’ Estate Sale","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/the-least-wanted-items-at-my-parents-estate-sale","category":"fun","categoryLabel":"Interesting Reads","wordCount":599,"readingTime":3,"content":"<p>My parents lived in the same brutalist-Art Nouveau home for fifty-one years. (They never could agree on an aesthetic.) During that time, they accumulated the contents of a much larger house and crammed them into their much smaller one. They are gone now, following a pickleball accident that I am not legally permitted to discuss, except to note that one first responder described the scene as “wild.” The estate sale lasted three days. The following items did not move, so I am listing them here, on Facebook Marketplace.</p><p><strong>An invitation to my father’s bris, 1942</strong>Engraved. Reads, in a formal, serif font: “You are cordially invited.” Also: “No admission without card.” My father is gone and I cannot ask him why his parents were worried about party-crashers. This question will haunt me. Price: $15, firm.</p><p><strong>A box of toffees commemorating the marriage of Prince Charles and Lady Diana Spencer</strong>Purchased in a passing fit of royal enthusiasm before my parents pledged allegiance to the Basque-separatist cause. Most of the toffees remain in their original wrappers. Price: $8.</p><p><strong>A mango-strawberry vape</strong>Approximately forty per cent remaining. My mother was eighty when she took up vaping, a detail that my siblings and I learned only while preparing for the estate sale. The brand is called Cloud Nine. Price: $2.</p><p><strong>A Weber grill assembly manual</strong>For a model discontinued in 1987. Annotated by my father. The marginalia is extensive and occasionally personal. On page 4, next to a diagram of the grease trap, he has written: “This is where it all goes wrong.” Price: $0.50.</p><p><strong>A ceramic rooster</strong>Of unclear provenance and considerable size. My mother called it Apollinaire. She could not, when asked, recall where Apollinaire had come from, or why she had named it Apollinaire. She did, however, dust Apollinaire weekly for the better part of three decades. A home must be found. Price: on second thought, I’m keeping Apollinaire.</p><p><strong>A set of “Learn Portuguese in 30 Days” cassettes</strong>Still sealed in the original cellophane. My parents never went to Portugal. They discussed going to Portugal extensively, over many years, in a way that seemed to serve some function other than actually going to Portugal. Price: $5.</p><p><strong>A sealed envelope</strong>Labelled “<em>GOOD BUTTONS</em>.” Price: $1.</p><p><strong>Seventeen years’ worth of <em>National Geographics</em></strong>Stacked by my father in order of “least to most erotic.” Price: $400.</p><p><strong>A single ski boot</strong>Left, size 10. My parents hung on to it in the hope that its mate would materialize. They didn’t ski. Price: $15.</p><p><strong>A sympathy card, unsent</strong>Addressed to a “Meredith” we cannot identify, containing a handwritten message that reads: “We are thinking of you during this impossible time. The casserole freezes well.” Price: free, if you are Meredith.</p><p><strong>A sealed envelope</strong>Labelled “<em>BAD BUTTONS</em>.” Price: $12.</p><p><strong>One genuine Hummel figurine</strong>And eleven X-rated figurines that my mother was “fairly confident” were also Hummels. Price: $1,500.</p><p><strong>A Tupperware container</strong>Holding exactly fourteen batteries, all very dead, but somehow also very warm. Price: free.</p><p><strong>A hospital bill</strong>From my birth, with my mother’s handwriting on the back demanding a discount because she “did all the work.” Price: $1.</p><p><strong>A coupon for fifty cents off Metamucil</strong>Expired June, 2019. I include it here not because I expect it to sell but because it was tucked inside my parents’ copy of “The Joy of Cooking,” which was shelved in the kitchen, alphabetically, next to their annotated copy of “The Joy of Sex,” on page 27 of which, in my father’s writing, appears: “This is where it all goes wrong.” Price: free. ♦</p>"}];

function render() {

    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
