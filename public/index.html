<script>
var articles = [{"title":"Booksellers suspect AI firms are buying and then destroying rare books","source":"Ars Technica","author":"","url":"https://arstechnica.com/tech-policy/2026/08/heres-a-balm-if-the-idea-of-destroying-books-to-train-ai-breaks-your-heart/","category":"tech","categoryLabel":"Technology","wordCount":1496,"readingTime":8,"content":"<p>\n    \n  \n  \n    “Every collection is important”\n  \n</p>\n      \n      <p>\n        AI firms quietly bulk buying rare books face resistance from booksellers.\n      </p>\n          \n    \n<p>If you can truly appreciate an old book—and maybe even marvel at how its fragile, yellowing pages contain some of the earliest ways that people tried to make sense of the world around them—then headlines about tech companies that are <a href=\"https://www.theatlantic.com/technology/2026/08/ai-companies-buying-used-books-for-data/688167/\" target=\"_blank\" rel=\"noopener\">destroying</a> <a href=\"https://www.404media.co/ai-companies-are-buying-tons-of-old-books-because-theyre-free-of-ai-slop/\" target=\"_blank\" rel=\"noopener\">books</a> <a href=\"https://www.telegraph.co.uk/news/2026/07/30/why-ai-companies-are-destroying-millions-of-old-books/?ICID=continue_without_subscribing_reg_first\" target=\"_blank\" rel=\"noopener\">to train AI</a> likely torture a tender part of your soul.</p>\n<p>It’s indeed depressing to imagine piles of book spines waiting to be fed into wood chippers while torn-out pages are cropped, scanned, and trashed. But that’s the cheapest and easiest way to scan books as fast as possible, and AI companies are in a race to advance their models by training on the kind of engaging, high-quality long-form texts that can only be found in books. So book lovers fear it’s likely that the practice is happening on a grander scale than is currently being reported and that some physical copies of books will be lost forever.</p>\n<p>What makes this destruction extra painful, though, is that it doesn’t have to be this way.</p>\n<p>Google <a href=\"https://cdn.arstechnica.net/wp-content/uploads/2026/08/Google-Book-Scanning-patent-US-7508978-B1.pdf\" target=\"_blank\" rel=\"noopener\">patented</a> a non-destructive book-scanning technology in 2009 that AI firms could use to efficiently scan books—if they were willing to slow down and invest in the process. It’s not perfect, however; studies have found that the curve of the page can distort text, and pages can be missed. As Wired <a href=\"https://www.wired.com/story/google-books-glitches-gallery/\" target=\"_blank\" rel=\"noopener\">reported</a>, glitches can happen when workers move too quickly, including disembodied hands obscuring pages.</p>\n<p>Overall, the trade-offs in cost and speed may not appeal to AI firms looking for the cheapest way to scan millions of titles, and Google’s method may not be the best way to handle rare books anyway. The Internet Archive, which helps libraries preserve aging collections, has long understood that scanning old texts takes time and attention to limit handling, and that’s why it’s considered such a human job.</p>\n                  \n    \n<p>For AI companies bent on finding shortcuts, the Internet Archive’s method may feel almost alien.</p>\n<p>But if you’re a book lover looking for a balm while parsing rumors of AI-driven book destruction, an <a href=\"https://blog.archive.org/2021/02/09/meet-eliza-zhang-book-scanner-and-viral-video-star/\" target=\"_blank\" rel=\"noopener\">old post</a> from 2021 describes how the Internet Archive scans books to avoid damaging even the most precious rare books. In it, a book scanner who has been with the Archive since 2010, Eliza Zhang, offered a moment of zen by explaining what she likes so much about scanning books “the hard way.”</p>\n<p>The Internet Archive did try going the automated route, the post said, even testing out “commercial book scanners that feature a vacuum-powered page-turning arm.” But “it turns out those automated scanners didn’t really work well for brittle books, rare volumes, and other special collections—the kinds of material our library partners ask us to digitize,” the Internet Archive said.</p>\n<p>“The job requires keen concentration,” Zhang said, since the pages of “very old, fragile books” are “paper thin.” In the post, Andrea Mills, who helps lead the Archive’s book-scanning operations, explained that “clean, dry human hands are the best way to turn pages.”</p>\n<p>To ensure each rare book only has to go through the scanning process once, Zhang takes her time. She carefully raises the scanner glass with a foot pedal each time she turns a page, then adjusts the cameras and ensures the page is readable. She also takes note of any fold-outs, setting a reminder to go back and scan the inserts so that bonus materials aren’t lost while documenting the main pages of the work.</p>\n                  \n    \n<p>The whole time, she understands that if a page is skipped or an image is too blurry, Internet Archive’s proprietary software will stop the process and prompt her to scan it again. Practice makes perfect, though, and she reports a low error rate after more than a decade of finding a rhythm in the job.</p>\n<p>At the time, Zhang had scanned “more than 3 million pages, 14,000 foldouts, and 18,000 items (mostly books),” the post said, with the goal of guaranteeing “zero errors.”</p>\n<p>Ars asked the Internet Archive for comment, but Chris Freeland, the director of library services, said the post detailing Zhang’s work is “still the best description of our scanning process today.”</p>\n<p>The post came after a video of Zhang’s book scanning got 1.5 million views on what was then Twitter, accompanied by a caption that would resonate with book lovers appalled by AI-driven book destruction today.</p>\n<p>“At the Internet Archive, this is how we digitize a book,” the tweet said. “We never destroy a book by cutting off its binding. Instead, we digitize it the hard way—one page at a time.”</p>\n<h2>Rare booksellers flag suspicious bulk orders</h2>\n<p>Ever since a lawsuit in summer 2025 outed Anthropic for <a href=\"https://arstechnica.com/ai/2025/06/anthropic-destroyed-millions-of-print-books-to-build-its-ai-models/\" target=\"_blank\" rel=\"noopener\">destroying millions of print books</a> to train its AI models, book lovers have moved to defend some of the most precious collections from what feels like AI firms’ endless quest to feed all the books in the world into their large language models.</p>\n<p>The biggest fear for people who want to see books preserved through the training process is that AI firms will callously pulp rare books that can never be replaced.</p>\n                  \n    \n<p>As The Atlantic <a href=\"https://www.theatlantic.com/technology/2026/08/ai-companies-buying-used-books-for-data/688167/\" target=\"_blank\" rel=\"noopener\">reported</a> last week, social media “raged” after two recent reports indicated that AI was already endangering rare books. First, a Telegraph <a href=\"https://www.telegraph.co.uk/news/2026/07/30/why-ai-companies-are-destroying-millions-of-old-books/?ICID=continue_without_subscribing_reg_first\" target=\"_blank\" rel=\"noopener\">report</a> accused Silicon Valley of destroying millions of rare books and “shredding the originals,” then 404 Media <a href=\"https://www.404media.co/ai-companies-are-buying-tons-of-old-books-because-theyre-free-of-ai-slop/\" target=\"_blank\" rel=\"noopener\">reported</a> that a book-database company called ISBNdb was advertising that it could help AI firms source books in bulk.</p>\n<p>This backlash was expected, with ISBNdb reportedly warning its clients that the optics were bad. Anthropic started using a codename—“Project Panama”—for its destructive book-scanning in an effort to keep it hidden from the public.</p>\n<p>There is no indication that Anthropic ever destroyed rare books, and the company has denied doing so in statements. It’s also true that some AI firms are helping preserve rare books. OpenAI and Microsoft, for example, are <a href=\"https://www.wbur.org/news/2025/06/13/ai-chatbots-learning-books-public-domain-harvard-boston\" target=\"_blank\" rel=\"noopener\">working with Harvard librarians</a> on an initiative to train AI models on about 1 million public-domain books dating back to the 15th century. Others, including Elon Musk’s xAI, have publicly said they won’t destroy rare books to train AI. In a post on X, Musk said that he “asked the SpaceXAI team to preserve any rare books in a library and scan them the hard way vs just cutting off the spine and scanning.”</p>\n<p>But not everyone is convinced that the biggest AI firms are sincere in their promises to preserve rare books, even if copyright law allows them to destroy copies of books they’ve purchased. Critics on social media and Reddit have pointed out that Musk didn’t say the xAI team would not destroy <em>any</em> books, and it’s unclear how his company defines a “rare” book.</p>\n                  \n    \n        \n<p>Meanwhile, rare booksellers continue to flag strange orders, recognizing that most sincere buyers tend to seek out single books, not order large batches of widely varying selections.</p>\n<p>Just yesterday, an Irish bookstore called Kennys flagged a “bananas” order for 5,000 obscure titles, The Irish Times <a href=\"https://www.irishtimes.com/world/europe/2026/08/10/a-mysterious-buying-spree-is-unsettling-europes-booksellers/\" target=\"_blank\" rel=\"noopener\">reported</a>. Unlike bulk orders placed by universities or big libraries, this order seemed suspicious because the buyer made no attempt to haggle on the price—which has now become an obvious “red flag” that AI is potentially involved, the Times reported.</p>\n<p>Although some booksellers said they could benefit in the short term from large orders, they fear that selling to AI firms that are indiscriminately destroying their collections “may be signing their own death warrant,” the Times reported.</p>\n<p>Tomás Kenny of Kennys Bookshop told the Times that AI is “terrifying our industry,” and he plans to refuse orders likely destined for AI training in an effort to protect authors’ rights to their work and readers’ access to hard-to-find titles.</p>\n<p>“Booksellers tend to be at the forefront of a lot of moral dilemmas and political and ethical issues. In most scenarios, it is not for me to decide,” he said. “However, if they are taking a book and scanning it with a view to taking intellectual property, then Kennys do not want to be a part of that.”</p>\n<p>It’s possible that public backlash will pressure the biggest firms to adopt methods like the Internet Archive’s, which focus as much on preserving rare books physically as they do digitally. But it’s heartbreaking to imagine the alternative, where rare books become even rarer, especially for those who love the feeling of holding an old book in their hands.</p>\n<p>Zhang knows the allure of rare books, occasionally pausing her work to read parts of the titles she scans. When asked what she liked most about her job, Zhang responded with the same gusto that many book lovers feel while browsing the shelves in stores like Kennys.</p>\n<p>“Everything! I find everything interesting,” Zhang said. “I don’t feel it is boring. Every collection is important to me.”</p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/ashleybelanger/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Ashley is a senior policy reporter for Ars Technica, dedicated to tracking social impacts of emerging policies and new technologies. She is a Chicago-based journalist with 20 years of experience.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/tech-policy/2026/08/heres-a-balm-if-the-idea-of-destroying-books-to-train-ai-breaks-your-heart/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    410 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/cars/2026/09/ev-batteries-last-longer-than-drivers-feared/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"},{"title":"\"[A]n Unopposed Grant\" of Sealing \"Carries Little Weight in a Contested Posture\"","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/02/an-unopposed-grant-of-sealing-carries-little-weight-in-a-contested-posture/","category":"law","categoryLabel":"Law","wordCount":690,"readingTime":4,"content":"<p>From <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.ksd.164863/gov.uscourts.ksd.164863.16.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Townsend v. The Gardens at Aldersgate LLC</em></a>, decided Monday by Magistrate Judge Rachel Schwartz (D. Kan.):</p>\n<blockquote><p>This is a skilled-nursing-home negligence case proceeding in federal court based on diversity jurisdiction …. In diversity cases proceeding under § 1332(a), Federal Rule of Civil Procedure 7.1(a)(2) requires every \"party or intervenor [to]…file a disclosure statement[ ] [that] must name—and identify the citizenship of—every individual or entity whose citizenship is attributed to that party or intervenor[.]\" On August 3, 2026, Defendants filed their unredacted Rule 7.1 disclosure statements provisionally under seal. In the present Motion, Defendants seek to maintain under seal the unredacted Rule 7.1 disclosure statements, which reveal various layers of the respective limited liability companies' (\"LLC\") memberships and the identities of those layers of members. Defendants request permission to file publicly only redacted versions of these documents, redacting \"the names of non-party individuals, trusts, and limited liability companies whose disclosure would reveal the private ownership and financial associations of non-parties.\" Plaintiffs oppose the Motion on multiple grounds, including that granting the Motion \"would convert a transparency rule into a sealing regime for any LLC that prefers anonymity.\"</p></blockquote>\n<p>The court noted the general right of access to court records, and concludes that there's no exception to it for the LLC disclosures; here's part of the analysis:</p>\n<blockquote><p>[F]ederal district courts have overwhelmingly rejected these types of generic confidentiality and privacy concerns as insufficient to justify sealing or otherwise restricting Rule 7.1 disclosure statements. [Long string citation omitted. -EV] Simply put, \"[c]orporations and limited partnerships may offer individuals protection from liability, but they do not entitle individuals to anonymity in court proceedings.\" Here, all the individuals and entities listed in Defendants' Rule 7.1 disclosure statements elected to have an ownership interest in a skilled nursing facility and the company that manages the skilled nursing facility. It is not unusual or unforeseeable that these types of parties would be sued in diversity cases in federal court, triggering the requirement that these Defendants file Rule 7.1 disclosure statements. While there may be specific cases in which sealing would be appropriate, they would involve a far more specific set of facts pertaining to specific entities or individuals than what this Court has before it….</p>\n<p>[R]ather than address these cases, which represent the overwhelming majority view, Defendants' Motion relies on a different case from this District that also involved Defendant MRC. In that case, the judge granted defendants' unopposed motion seeking leave to file redacted copies of Rule 7.1 disclosures. This is the only case Defendants cite in which a court allowed Rule 7.1 disclosures to be sealed in whole or in part. But as Plaintiffs persuasively argue, \"[a]n unopposed grant carries little weight in a contested posture,\" such as here. The undersigned agrees with the majority view that Rule 7.1 disclosures should not be sealed in whole or in part based on generic privacy arguments that could apply to nearly any business that wishes to keep private those with an ownership interest….</p></blockquote>\n<p>The court also noted that</p>\n<blockquote><p>Rule 7.1 disclosure statements serve an important purpose. Rule 7.1 disclosures allow the judge to ascertain whether the judge has a financial interest in the party or associated parties that would require recusal. And in diversity cases like this one, \"Rule 7.1 statements enable a federal court to assess its jurisdiction—jurisdiction that has been carefully delimited by Article III of the Constitution and by Congress.\" These are matters of public interest.</p></blockquote>\n<p>The analysis seems quite sound to me; the most valuable part for the future, though, may be the sentence that I used as the title of the post: \"[A]n unopposed grant carries little weight in a contested posture.\" It's a corollary of the broader point that (see, e.g., <em><a href=\"https://scholar.google.com/scholar_case?case=6975583678770673449\" target=\"_blank\" rel=\"noopener\">Webster v. Fall</a> </em>(1925); <em><a href=\"https://scholar.google.com/scholar_case?case=12814772811989518721\" target=\"_blank\" rel=\"noopener\">Cooper Industries, Inc. v. Aviall Services, Inc.</a></em>(2004)):</p>\n<blockquote><p>Questions which merely lurk in the record, neither brought to the attention of the court nor ruled upon, are not to be considered as having been so decided as to constitute precedents.</p></blockquote>\n<p>But it's useful to have a case to quote on the more specific point as well.</p>\n<p>Jonathan T. Steele (The Steele Law Firm) represents plaintiff.</p>"},{"title":"Briefly Noted Book Reviews","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/14/the-breakup-all-them-dogs-sex-dissent-we-want-to-believe","category":"fun","categoryLabel":"Interesting Reads","wordCount":511,"readingTime":3,"content":"<p><strong>The Breakup</strong><em>, by Kurt Andersen (Random House)</em>. This comic novel is set in a hysterical vision of the year 2045, in which what was once the United States has been split apart by a civil war between liberals and a <em>MAGA</em>-like rebel group. The country is now divided into the so-called Free American Republic and what remains of the U.S. In this tense, uneasy landscape, a separated couple, Natalie and Asher, reunite to take their child, Logan, on a trip to tour colleges in both territories. Asher and Natalie’s disunion serves as almost a microcosm of the country: he a rabidly engaged liberal and she a head-in-the-sand moderate. The book is enlivened by Andersen’s gift for satire, which plays up the comic potential of ideological extremes.</p><p><strong>All Them Dogs</strong><em>, by Djamel White (Riverhead)</em>. “I was Wardy. Tony bleeding Ward. Lethal weapon forged in 1997,” the protagonist of this bold début novel proclaims. The statement is mainly a reminder to himself, as he returns home to Dublin after five long years on the run. Tony had to flee after killing a member of a rival gang; now he has joined the ranks of another outfit, notionally in search of money and protection, but ultimately out of a longing to have “someone else do the thinking.” As Tony strains to navigate brewing street wars, the most intimidating battles he faces are still internal—between expectation and desire, between who he is and who he might want to be.</p><h2><a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\">What We’re Reading</a></h2><p><em>Discover notable new fiction, nonfiction, and poetry.</em></p><p><strong>Sex and Dissent</strong><em>, by Meaghan Beatley (Penguin)</em>. This vividly reported book centers on recent feminist movements in Argentina, Chile, Mexico, and Spain. Beatley, a journalist, profiles women protesting abortion restrictions, sexual assault, and femicide—an act that, she writes, lies “atop layers of normalized and socially sanctioned abuse.” While documenting acts of resistance, she examines the way that these feminists’ cultural contexts inflect their organizing. As she points out, many were influenced by struggles against military dictatorships of the twentieth century; some are the children of disappeared dissidents. “What sets Latin America apart is not violence itself but the clarity with which women understand its roots,” she writes.</p><p><strong>We Want to Believe</strong><em>, by Adam Kirsch (Columbia Global Reports)</em>. In recent decades, technological advances have vastly expanded our knowledge of the universe and led to the discovery of thousands of exoplanets. This has coincided with a widespread belief that humans will inevitably confirm that extraterrestrials exist. But, Kirsch argues in this concise treatise, the fact that our search has so far yielded nothing decreases the probability that we’ll ever find intelligent life beyond Earth. Why, then, has public opinion moved in the opposite direction from the science? Kirsch contends that the rise of serious discussion about extraterrestrials has paralleled the decline of the “traditional religious vocabularies” that once helped people grapple with the deepest questions of existence. In the end, he writes, “all our thinking about aliens and how to find them is best understood as humanity’s evolving self-portrait.”</p>"},{"title":"Two years after its rocky launch, Civilization 7's first paid expansion Earthrise is on its way - but first comes the atomic age","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/civilization-7-paid-expansion-earthrise-atomic-age-free-update","category":"gaming","categoryLabel":"Gaming","wordCount":705,"readingTime":4,"content":"<p>If you see Sid, tell him.</p>\n    \n  \n  \n  \n\n            <p>It's been a bumpy ride for Civilization 7, but two years after its <a href=\"https://www.eurogamer.net/firaxis-acknowledges-civilization-7-issues-fixes-incoming\" target=\"_blank\" rel=\"noopener\">widely criticised launch</a> - and as the legendary 4X series celebrates its 35th anniversary - developer Firaxis has unveiled a host of new updates coming to the game. That includes an atomic age update, dragging Civ 7 into the present and beyond, as well as its first paid expansion, Earthrise, both arriving next year.</p>\n<p>Starting with the free Arc of Tomorrow update, it finally drags Civ 7's current end-game into more contemporary times. It introduces a new age, the Atomic Age, extending the current playable timeline from the 1950s into the near future, and adds period-specific gameplay, alongside new buildings, units, visuals, and more. As with other Ages, it'll be possible to begin a game straight from in the Atomic Age, or go the long way round, starting in Antiquity.</p>\n\n<p>As to what the Atomic Age brings, there're new civilisations and leaders, as well as expanded nuclear gameplay options, including \"a fun twist on mutually assured destruction.\" New Multilateral Agreements enable leaders to \"collectively react to developing situations - like a growing stockpile of nuclear warheads - with calls for disarmament or escalation\", and new empire management tools provide options such as the ability to transform Settlements into new City-States. Among other things, City-States enable Proxy Warfare focused on smaller-scale conflicts rather than all-out empire warfare.</p><p>\"There's a compelling need to honour the uncertainty and fear present in [the recent past], where proxy warfare became the new norm by which global conflict was conducted and the spectre of nuclear war loomed, as it still does today,\" <a href=\"https://store.steampowered.com/news/app/1295660/view/716789287659504846\" target=\"_blank\" rel=\"noopener\">Firaxis writes</a>. \"But there were also moments of light, triumph, and hope. Things once thought impossible, like spaceflight, were challenged and overcome as technology advanced at a rapid pace, while marginalised peoples rallied together to fight for justice and equality.\"</p>\n<p>Elsewhere in Arc of Tomorrow, it'll be possible to make Great Works of Film that gives different benefits depending on the quality of the movie produced. These require Film Crews to hunt for the perfect filming location, which changes depending on your desired genre. Additionally, the introduction of Manufactured Goods means players can combine specific commodities to create powerful new resources like Enriched Uranium. Playtesting for Arc of Tomorrow begins this year, and <a href=\"https://civilization.2k.com/civ-vii/firaxis-feature-workshop/\" target=\"_blank\" rel=\"noopener\">sign up details are here</a>.</p>\n<p>Once Civilization 7 has been yanked into the modern age, Firaxis is pushing even further into the future with the launch of the game's space-race-themed first paid expansion. \"From humanity's earliest days, we have always been fascinated with the sky,\" it writes. \"In Earthrise, that sense of wonder shapes your civilisation's story from the Antiquity Age all the way to the near future.\"</p>\n\n<p>Details on Earthrise are currently limited, but Firaxis says it's currently 'envisioning' space-themed gameplay mechanics that unlock new bonuses in each Age. During the Antiquity and Exploration Ages, for instance, you might chart the night sky and name the celestial bodies to gain insights about the solar system, and you might launch early orbital missions around Earth and the moon in the Modern Age. As for the Atomic Age, expect to establish your own space agency and launch missions to the stars, uncovering planetary features and resources you can exploit back on Earth.</p><p>Earthrise also includes a focus on environmental adaptability, such as the ability for players to alter the terrain and their empire's tile bonuses, and to gain biome bonuses as they become more proficient at working the land in each biome. Additionally, there's talk of new civil engineering structures to fight back against rising global temperatures and increasing Natural Disasters - including the ability to reverse the warming itself.</p>\n<p>Arc of Tomorrow and Earthrise (Civ 7's first paid expansion, but not its first paid DLC - there've been strong complaints from the community about the fact it already has over £100 of DLC) are both planned for release in 2027, with Arc of Tomorrow coming first. Before all that, however, there's Civilization 7's new 1.5.0 update, which is coming later this month. It includes the True Start Location Earth map, new Terra Incognita and Shuffle Voronoi maps, plus updates to diplomacy, resource generation, and UI.</p>"}];

}

function nextArticle() {
  if (currentIndex < articles.length - 1) {

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
