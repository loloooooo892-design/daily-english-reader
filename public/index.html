*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

}

}

}

<script>
var articles = [{"title":"Wardogs CEO says he won't hire devs who aren't down with mandatory crunch: 'If you care about what you're making, this is the place to work'","source":"PC Gamer","author":"Morgan Park","url":"https://www.pcgamer.com/games/fps/wardogs-ceo-says-he-wont-hire-devs-who-arent-down-with-mandatory-crunch-if-you-care-about-what-youre-making-this-is-the-place-to-work/","category":"gaming","categoryLabel":"Gaming","wordCount":662,"readingTime":4,"content":"<p>The shooter that Tencent abandoned: Wardogs hits 2m sales in one weekend - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/EX6MWC71y38\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>Bulkhead CEO Joe Brammer is catching heat from industry colleagues for his studio's stance on crunch. In the latest episode of <a href=\"https://youtu.be/EX6MWC71y38\" target=\"_blank\" rel=\"noopener\">The Game Business Show</a> (as covered by <a href=\"https://www.gamedeveloper.com/business/wardogs-lead-says-the-studio-won-t-hire-people-who-decry-crunch-on-social-media\" target=\"_blank\" rel=\"noopener\">Game Developer</a>), Brammer and host Christopher Dring chatted about Bulkhead's journey as an indie studio and Wardogs' big success before the conversation turned to work culture and crunch.</p><p>Brammer was upfront that crunch does happen at Bulkhead, and if you're not OK with that, you're probably not getting hired.</p><p>\"A lot of people who may have an issue with crunch—rightly so, I understand that issue, we always try and avoid it, but we don’t hide that this is going to happen at some point—they often don't make it in the door. Because we want to be known for that: this is a place you come to work hard. If you care about the work you’re making and the result of what you make here, you'll feel really valued. If you don't, you will feel slave-driven,\" he said.</p><p>\"We check people's socials, and if you're constantly tweeting anti-crunch messaging: 'This should never ever be a thing', we know that and go, 'Look, you're not going to be happy here, so we're not going to go with you.'\"</p><p>Brammer acknowledged that this is a controversial policy in game development, which has made strides to eliminate or limit mandatory crunch following <a href=\"https://kotaku.com/crunch-time-why-game-developers-work-such-insane-hours-1704744577\" target=\"_blank\" rel=\"noopener\">years of reporting</a> detailing the industry's labor exploitation, burnout, and the <a href=\"https://www.pcgamer.com/cd-projekt-promises-more-humane-cyberpunk-2077-crunch-than-devs-endured-for-the-witcher-3/\" target=\"_blank\" rel=\"noopener\">human cost</a> of a work culture that says you only \"care about what you're making,\" as Brammer says, if you're willing to stay late.</p><p>\"For the last three months, Wardogs has been more important than a lot of [our team's] family lives. But now, Bulkhead and I have to acknowledge that it needs to go the other way. Everyone’s pushing us to get [the console version] out earlier, and we’ve said, ‘No, that's not how it’s going to work. We can't push them more.\"</p><p>The CEO believes Bulkhead balances the scales by offering bonuses and incentives to some (but definitely not all) of its staff.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>\"If we're going to be a company that says 'We do crunch,' then you have to get something for it,\" Brammer said.</p><p>On Bluesky, Brammer's game industry colleagues aren't so convinced he's cracked the code.</p><p>\"There's an endless mountain of peer reviewed, double-blind studies that show this shit doesn't work and *negatively impacts profits* but the facade of looking like you're a big tough special boy is more important,\" wrote game dev <a href=\"https://bsky.app/profile/bplane.bsky.social/post/3mvleqdkgpk2w\" target=\"_blank\" rel=\"noopener\">bplane</a>.</p><p>\"Tell me you need a producer without saying you need a producer,\" said producer and consultant <a href=\"https://bsky.app/profile/nazihfares.com/post/3mvle4ypje22y\" target=\"_blank\" rel=\"noopener\">Nazih Fares</a>.</p><p>\"Imagine being proud of your attitude towards crunch and calling it 'hard work.' Crunch is a result of bad planning and poor management,\" wrote Studio Gobo's <a href=\"https://bsky.app/profile/miketorious.bsky.social/post/3mvlfty4ce22m\" target=\"_blank\" rel=\"noopener\">Michael Howe</a>. \"This [interview] stinks of lies and excuses to drag devs through the grinder, may this kind of lead never find me.\"</p><p>How outwardly does Bulkhead embrace crunch? Back on Wardogs launch day, Brammer posted studio tours on X that included a room full of air mattresses for employees working overnight to fix Wardogs' troubled servers.</p>\n\n<p>Morgan has been writing for PC Gamer since 2018, first as a freelancer and currently as a staff writer. He has also appeared on Polygon, Kotaku, Fanbyte, and PCGamesN. Before freelancing, he spent most of high school and all of college writing at small gaming sites that didn't pay him. He's very happy to have a real job now. Morgan is a beat writer following the latest and greatest shooters and the communities that play them. He also writes general news, reviews, features, the occasional guide, and bad jokes in Slack. Twist his arm, and he'll even write about a boring strategy game. Please don't, though.</p>"},{"title":"Did Wildfires Spark the Invention of Pottery? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/did-wildfires-spark-the-invention-of-pottery-1285052/","category":"fun","categoryLabel":"Interesting Reads","wordCount":524,"readingTime":3,"content":"<p>Pottery is one of the most important early technological innovations in human history. Combining clay with fire allowed Neolithic people to create water-carrying vessels, cooking pots, storage containers, and more. Unfortunately, the prehistoric prodigies behind this technological marvel didn’t leave a record of their notes behind, so it’s left to scientists to piece together their work. Now one such scientist is out with an intriguing theory of what sparked the invention of pottery: wildfires.</p><p>Featured Video</p><p>According to a new study <a href=\"http://dx.doi.org/10.1016/j.geomorph.2026.110514\" target=\"_blank\" rel=\"noopener\">published</a> in <em>Geomorphology</em>, Stone Age humans living in the Levant may have gotten the idea for using fire to harden clay into ceramic by witnessing the process take place after naturally occurring wildfires. “A wildfire is normally seen only as a catastrophe, but environmental disruption can also expose people to new materials and new possibilities,” study author Amos Frumkin of The Hebrew University of Jerusalem explained in a <a href=\"https://www.eurekalert.org/news-releases/1142987\" target=\"_blank\" rel=\"noopener\">statement</a>. “If so, one of humanity’s most important technologies may have emerged partly from people learning to imitate what they had already seen nature do.”</p><p><strong>Read more: “</strong><a href=\"https://nautil.us/ancient-math-hidden-in-oldest-known-floral-pottery-1254795\" target=\"_blank\" rel=\"noopener\"><strong>Ancient Math Hidden in Oldest Known Floral Pottery</strong></a><strong>”</strong></p><p>Frumkin came to the conclusion—which he calls the “natural kiln hypothesis”—after studying two distinct periods in the Jordan Rift Valley, one 129,00-116,000 years ago and one 11,000-7,000 years ago. During both periods, wildfires devastated vegetation in the area. With the plants gone, heavy rains swept clay-rich terra rossa soil into the valley below and Neolithic communities settled on the fertile land there. </p><p>Pottery also started appearing in the area around the same time the later fires and landslides peaked. Per Frumkin, the prehistoric people living there may have witnessed hardened clay washing down and been struck with the inspiration to use fire to bend the earth to their will. “Neolithic communities in the Jordan Valley may have watched fire transform the clay beneath and around their settlements and realized that this process could be reproduced deliberately,” Frumkin said.</p><p>So why didn’t the earlier period of fires kickstart the pottery revolution? </p><p>Frumkin likens this period to a “natural control experiment.” While all of the natural conditions were present to lead to a pottery boom, the more primitive groups living there at the time may have lacked the advanced social structure, agricultural lifestyle, and technological know-how to produce pottery at the time.</p><p>If that sounds speculative to you, that’s because it is. But Frumkin stresses that his natural kiln hypothesis is at least somewhat testable. For example, if pottery fragments are discovered that predate the intense wildfire activity, he could be off the mark. Additionally, there are other theories of pottery development that involve prehistoric peoples accidentally discovering the technology after leaving baskets waterproofed with clay too close to a fire. </p><p>Of course, pottery doesn’t necessarily need a single origin theory. It’s entirely possible Neolithic humans in the Levant were inspired by disaster while other civilizations came by the innovation accidentally. The beauty of human creativity and diversity is that different groups of people come up with different solutions—all on their own. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Boaz Zissu et al., 2014</em></p>"},{"title":"DC Circuit Rejects Energy Department's Claim of \"Emergency\" Authority to Order Coal Plant to Remain Open","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/09/11/dc-circuit-rejects-energy-departments-claim-of-emergency-authority-to-order-coal-plant-to-remain-open/","category":"law","categoryLabel":"Law","wordCount":1156,"readingTime":6,"content":"<p>One of the more unusual, and controversial, elements of the Trump Administration's energy policy has been to force some coal plants slated for closure to remain open and operational. From the start, some have questioned whether the Department of Energy has the legal authority to issue such orders. Today, in <a href=\"https://media.cadc.uscourts.gov/opinions/docs/2026/09/25-1159-2192454.pdf\" target=\"_blank\" rel=\"noopener\"><em>Michigan v. Department of Energy</em></a>, a panel of the U.S. Court of Appeals for the D.C. Circuit concluded that it does not.</p>\n<p>Judge Pillard wrote for the court, joined by Chief Judge Srinivasan and Judge Wilkins. Given the panel's makeup, and the importance of this issue to the Trump Administration, I suspect a petition for en banc rehearing or certiorari will soon follow.</p>\n<p>Judge Pillard's introduction to her opinion is lengthy, but provides a useful overview of some of the issues. It's reproduced below the jump.</p>\n<blockquote><p>Consumers Energy Company is a private business that owns and operates the J.H. Campbell Generating Plant, an aging coal-fired power plant in Michigan that was scheduled to shut down last year. The Company worked for several years to develop plans and secure regulatory approval to retire the old Campbell plant and replace it with a mix of expanded and new electricity-generation sources. Consumers Energy coordinated its planning with Michigan regulators and the Midwest Independent System Operator (MISO)—the 15-state regional transmission organization in which Michigan and Consumers Energy participate. The Company's closure-and-replacement proposal received comprehensive scrutiny from the public, private industry, and expert regulators. Finding that Consumers Energy's substitute sources would meet applicable reliability criteria, provide less polluting electricity at lower prices, and more than offset generation lost when the old plant closed, the Michigan Public Service Commission and MISO expressly approved the plan.</p>\n<p>Shortly before Campbell's scheduled retirement, the Department of Energy (DOE or Department) unilaterally commanded the unit's continued operation. The Department invoked a rarely used, short-term, federal emergency authority conferred in section 202(c) of the Federal Power Act to order the Campbell coal unit to stay open. Michigan petitioned for review of DOE's order. Illinois and Minnesota also petitioned, as did a group of environmental organizations, including the Sierra Club, Natural Resources Defense Council, Michigan Environmental Council, Environmental Defense Fund, Environmental Law and Policy Center, Vote Solar, the Ecology Center, Urban Core Collective, and the Union of Concerned Scientists. Consumers Energy intervened to \"protect[] the company's right to recover the costs associated with DOE's order\" from ratepayers, which is at issue in separate proceedings regarding recovery and allocation of costs currently pending before FERC. Resp.-Interv. Br. iv, 7.</p>\n<p>We evaluate Petitioners' challenge to DOE's interpretation of its emergency power under section 202(c) by reference to statutory text and structure. And we deploy those interpretive tools against the backdrop of states' exclusive regulatory power over the generation of electricity.</p>\n<p>The plain meaning of the text limits section 202(c) emergency authority to address an identified risk of a substantial energy supply shortfall that calls for immediate action. Section 202(c) gives DOE limited authority to sidestep states' jurisdiction over electricity generation to briefly compel generation or interconnection in times of war or other \"emergency\" situations. By its terms, section 202(c) allows DOE to command certain action \"[d]uring the continuance of any war in which the United States is engaged,\" or when the Secretary determines that \"an emergency exists\" due to \"a sudden increase in the demand for electric energy, or a shortage of electric energy or of facilities for the generation or transmission of electric energy, or of fuel or water for generating facilities, or other causes . . . .\" 16 U.S.C. § 824a(c)(1).</p>\n<p>The structure of the Federal Power Act and the history of the respective regulatory roles of federal and state governments show that Congress intended to further limit DOE's section 202(c) emergency power to circumstances necessitating action by DOE in particular, as opposed to action by states.</p>\n<p>Start with the Act's structure: The statutory provisions immediately preceding section 202(c)—sections 202(a) and (b)—confirm the primacy of states and their utilities in planning to prevent and responding to emergency electricity shortfalls. First, section 202(a) facilitates states' and utilities' planning to generate and contract for adequate supplies of electrical power. It does so by enabling them to coordinate their efforts through voluntary participation in Regional Transmission Organizations (RTOs). Next, section 202(b) provides for coercive federal action to ensure adequate supply—but only at the request of states or their utilities. When \"necessary or appropriate in the public interest,\" a state or utility may request that the Federal Energy Regulatory Commission (FERC) order a generator to connect to and sell or exchange energy with other facilities. Lastly, section 202(c) authorizes DOE to intervene to temporarily order similar action—connection of facilities and provision of electricity—to avert an emergency. Congress's placement of section 202(c) after subsections (a) and (b), which more broadly authorize state-level means of preventing and responding to emergency electricity shortages, strongly implies that it meant use of subsection (c) to be essentially the last alternative among the three.</p>\n<p>Consider next the history of states' jurisdiction over generation of electricity: The last-resort character of section 202(c) is strongly supported by the respective regulatory powers of states and the federal government under the Federal Power Act. There is no dispute that for almost a century states have exercised authority, preserved by the Federal Power Act, to regulate in-state power plants for the economic and environmental benefit of their citizens. It is the states—informed by federal, regional, and load-serving entities' assessments of available supply and reliability needs—that bear the responsibility to plan for and avert reliability risks on an ongoing basis. To that end, states decide which generation resources must be built, expanded, reduced, or shut down. The Act empowers the federal government, in contrast, to regulate wholesale marketing and interstate transmission of electricity. That demarcation of federal and state regulatory power is further reason to treat DOE intervention under section 202(c) as rare and authorized only when states, their utilities, and RTOs are unable or unwilling to respond. That is exactly how the federal government has used its section 202(c) authority until today—to address short-term crises, such as blackouts caused by war or extreme weather events, not as a substitute for the states' long-term reliability planning.</p>\n<p>Our reading of the text, structure, and history leaves us unpersuaded by DOE's sweeping conception of its \"emergency\" authority under section 202(c). The Department's position would empower it to pick its preferred power sources in Michigan—or, presumably, any other state—and order them to operate without regard to the multiple procedural and substantive constraints built into state reliability planning processes. We hold that section 202(c) is best read to apply where the Department identifies a risk of substantial harm from inadequate electricity supply that calls for immediate action by DOE in particular, as opposed to by the states. Because the circumstances DOE identified in the challenged order do not warrant resort to section 202(c) as correctly interpreted, we grant the petitions for review and vacate the Order.</p></blockquote>"},{"title":"Discover how to take your startup from prototype to production at TechCrunch Disrupt 2026","source":"TechCrunch","author":"TechCrunch Events","url":"https://techcrunch.com/2026/09/15/discover-how-to-take-your-startup-from-prototype-to-production-at-techcrunch-disrupt-2026/","category":"tech","categoryLabel":"Technology","wordCount":725,"readingTime":4,"content":"<p>AI has dramatically lowered the barrier to building impressive prototypes. Getting those prototypes into production is a different story.</p>\n<p>Every founder hopes their breakthrough becomes a product customers can rely on. Yet the path from prototype to production rarely follows a straight line. Manufacturing challenges emerge. Infrastructure has to support growth. Autonomous systems have to perform outside controlled environments. The problems change quickly once technology leaves the lab.</p>\n<p>That’s the focus of “<strong><a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\">From Prototype to Production: Can It Scale in Reality</a></strong>,” taking place on the <strong><a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\">Real World AI Stage</a></strong> at <a href=\"https://techcrunch.com/events/techcrunch-disrupt/?utm_source=tc&amp;utm_medium=post&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;promo=post_MackeySofmanMacneil_09142026&amp;display=\" target=\"_blank\" rel=\"noopener\"><strong>TechCrunch Disrupt 2026</strong></a>.</p>\n\n<p>Leaders in space communications, autonomous systems, and AI infrastructure will share how they’ve navigated that transition, from promising innovation to production-ready deployment. Although every industry follows its own path, all three speakers have faced the same reality: A successful prototype is only the beginning.</p>\n<p><a href=\"https://techcrunch.com/events/techcrunch-disrupt/?utm_source=tc&amp;utm_medium=post&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;promo=post_MackeySofmanMacneil_09142026&amp;display=\" target=\"_blank\" rel=\"noopener\">Disrupt returns to Moscone West</a> in San Francisco, October 13–15, bringing together 10,000+ founders, investors, and operators for 250+ sessions exploring the technologies and market forces shaping what’s next. <a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\"><strong>Secure your Disrupt pass</strong></a><strong> to hear how today’s innovators are moving breakthrough technologies into production.</strong></p>\n<h2>When AI leaves the lab</h2>\n<p>A working prototype answers one question: “Can it be done?” Production raises dozens more. Building optical communications hardware has little in common with deploying autonomous vehicles or autonomous construction equipment. Yet each requires the technology to perform consistently outside controlled environments, where reliability, manufacturing, infrastructure, and day-to-day operations become integral to the product itself.</p>\n<p>This <a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\"><strong>Real World AI Stage session</strong></a><strong> </strong>doesn’t promise a single blueprint. Instead, it brings together founders who have tackled production from very different angles, offering a rare opportunity to compare what scaling looks like across industries.</p>\n<p><a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\"><strong>Explore the Real World AI Stage</strong></a><strong> and register for Disrupt with up to $200 savings.</strong></p>\n<h2>Lessons from companies that made the leap</h2>\n<p>No two production stories look the same. That’s what makes this discussion compelling. Each founder <a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\">taking the Real World AI stage</a> has navigated a different path from prototype to production, offering lessons startups can apply to their own journey.</p>\n<h3>Building the future of space communications</h3>\n<p>Moving beyond the prototype often means building manufacturing capability alongside the technology itself. As co-founder and CEO of <a href=\"https://mbryonics.com/\" target=\"_blank\" rel=\"noopener\">MBRYONICS</a>, <a href=\"https://www.linkedin.com/in/john-mackey-2463b7118/\" target=\"_blank\" rel=\"noopener\">John Mackey </a>has transformed a specialized photonics spinout into a leader in space-based optical communications, expanding high-volume manufacturing while helping build the infrastructure behind next-generation space networks. His insights will help startups understand what changes when your company shifts from building prototypes to building products.</p>\n<h3>Deploying autonomy where consistency matters</h3>\n<p>Before co-founding <a href=\"https://bedrockrobotics.com/\" target=\"_blank\" rel=\"noopener\">Bedrock Robotics</a>, <a href=\"https://www.linkedin.com/in/bsofman/\" target=\"_blank\" rel=\"noopener\">Boris Sofman</a> helped lead autonomous trucking and core technologies at Waymo, where fully driverless vehicles logged more than 100 million driverless miles. His experience reflects what happens when autonomous systems leave controlled testing and begin operating in environments where consistency and reliability matter every day. He’ll shed light on how to scale production while ensuring safety and reliability.</p>\n<h3>Engineering the foundation for autonomous systems</h3>\n<p>Before co-founding <a href=\"https://foxglove.dev/\" target=\"_blank\" rel=\"noopener\">Foxglove</a>, <a href=\"https://www.linkedin.com/in/adrianmacneil/\" target=\"_blank\" rel=\"noopener\">Adrian Macneil</a> led infrastructure engineering at Cruise, developing the data platform that supported autonomous vehicles at scale. His work demonstrates that production depends on the engineering systems surrounding it. His talk will underscore the systems and infrastructure that allow complex technologies to move beyond experimentation and into everyday use.</p>\n<p>Together, they bring three different perspectives to the same milestone every ambitious technology company eventually reaches: moving from a successful prototype to something customers can trust in the real world.</p>\n<p><strong>Hear how these founders approached production and what they learned along the way. </strong><a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\"><strong>Choose your Disrupt ticket type and save up to $200 by September 25.</strong></a></p>\n<h2>What comes after the breakthrough?</h2>\n<p>Sooner or later, every promising technology has to prove itself outside the lab. That’s where this Disrupt conversation begins. Rather than focusing on what’s possible in theory, these founders will discuss what happens when manufacturing, deployment, infrastructure, and day-to-day operations become part of the product.</p>\n<p>Regardless of the innovation you’re building, this session offers the opportunity to hear from founders who’ve already navigated the move from prototype to production — and the lessons they learned along the way.</p>\n<p><a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?promo=post_MackeySofmanMacneil_09142026&amp;utm_campaign=disrupt2026&amp;utm_content=agenda&amp;utm_medium=post&amp;utm_source=tc\" target=\"_blank\" rel=\"noopener\"><strong>Secure your pass to Disrupt</strong></a><strong> and hear how leaders are making the leap from prototype to production. Save up to $200 before prices increase on September 25.</strong></p>\n\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"}];
