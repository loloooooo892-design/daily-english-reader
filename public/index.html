*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"The Longreads Questionnaire, Featuring Kimon de Greef","source":"Longreads","author":"Longreads","url":"https://longreads.com/2026/07/28/questionnaire-kimon-de-greef/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1440,"readingTime":8,"content":"<p>I was introduced to Kimon de Greef’s work this spring when I was producing <a href=\"https://longreads.com/2026/04/08/questionnaire-patrick-radden-keefe/\" target=\"_blank\" rel=\"noopener\">our <em>Longreads</em> questionnaire with Patrick Radden Keefe</a>. In his response to a question on the last book he read, Keefe mentioned de Greef’s “totally wild” book called <em><a href=\"https://www.penguinrandomhouse.com/books/735472/the-ego-trip-by-kimon-de-greef/\" target=\"_blank\" rel=\"noopener\">The Ego Trip: Psychedelic Toads, a Trail of Deaths, and the Guru Who Peddled Transcendence</a></em>. I immediately googled it and requested a copy. With a title like that, how could you not?</p>\n<p><em>The Ego Trip</em>, which will be released on August 4, expands on the story de Greef explored in his 2022 <em>New Yorker</em> feature, “<a href=\"https://www.newyorker.com/magazine/2022/03/28/the-pied-piper-of-psychedelic-toads\" target=\"_blank\" rel=\"noopener\">The Pied Piper of Psychedelic Toads</a>.” It’s as fascinating as the title promises: a deeply reported book on the rise and fall of a Mexican doctor who built a psychedelic movement around smoking the secretions of the Sonoran Desert toad. </p>\n<p>De Greef’s other stories are just as compulsively readable, dropping us into worlds that most of us have never even thought about and introducing us to memorable characters: There’s a <a href=\"https://www.guernicamag.com/racoon-trouble/\" target=\"_blank\" rel=\"noopener\">Syrian immigrant trapper in New York</a> who communicates with raccoons and refuses to kill them, and a Guyanese importer trying to do right in <a href=\"https://www.guernicamag.com/bad-birds-in-quarantine/\" target=\"_blank\" rel=\"noopener\">a world of songbird smuggling</a>. There’s a Native American woman unable to harvest wild white sage on <a href=\"https://www.vice.com/en/article/the-white-sage-black-market-v27n3/\" target=\"_blank\" rel=\"noopener\">Southern California land stripped bare by poachers</a>, and miners searching for leftover gold in <a href=\"https://www.newyorker.com/magazine/2023/02/27/the-dystopian-underworld-of-south-africas-illegal-gold-mines\" target=\"_blank\" rel=\"noopener\">South Africa’s illegal mines</a>.</p>\n<p>What ties this reporting together is de Greef’s eye for complex stories in offbeat industries and underworlds, and his interest in the tensions between desire and regulation, love and exploitation. A journalist from South Africa, de Greef also co-authored the book <em>Poacher</em>, a firsthand account on the <a href=\"https://www.goodreads.com/en/book/show/41843361-poacher\" target=\"_blank\" rel=\"noopener\">illicit abalone trade</a>.</p><p>Next week, we’ll have an excerpt from <em>The Ego Trip</em> for you. In the meantime, dive into de Greef’s questionnaire and get to know the author behind the book.</p>\n<p>—<a href=\"mailto:cheri@longreads.com\" target=\"_blank\" rel=\"noopener\"><em>Cheri Lucas Rowlands</em></a></p>\n\n<h3><strong>Where did you grow up?</strong></h3>\n<p>I was born in London and grew up in Cape Town, South Africa.</p>\n<h3><strong>What places feel like home?</strong></h3>\n<p>My parents returned to South Africa when I was 1. We lived in a neighborhood called Observatory. I moved back here to live in a student house in my early 20s, and a few years ago I returned for a third time with my wife, who I met here too. At this point I might be in Obs forever.</p>\n<h3><strong>Other than family members, who or what has shaped you the most?</strong></h3>\n<p>I studied ecology at university and gained an appreciation for the wonder of evolutionary biology—the idea, essentially, that all life is connected, both in the present and backward through deep time to a common ancestor. It blows my mind whenever I think of it. I later researched abalone poaching for a master’s thesis and it changed how I thought about history, politics, and the law. Since then I’ve often gravitated to stories where inequality and crime intersect with the natural environment.</p>\n<h3><strong>What is your favorite time of day?</strong></h3>\n<p>Currently it’s when my baby daughter wakes up early in the morning and I get to hang out with her.</p>\n<h3><strong>What are you <em>really</em> good at?</strong></h3>\n<p>Catching flies with my bare hands.</p>\n<h3><strong>What’s the best gift you’ve ever received?</strong></h3>\n<p>A wet suit from my family when I was 10. They buried it on the beach and my uncle Cleon pretended to discover it. I started bodyboarding afterward and it changed my life in many ways.</p>\n<h3><strong>Describe your favorite meal.</strong></h3>\n<p>My late grandmother Vonni’s chicken <em>guvetsi</em>, a Greek dish made with orzo noodles. It’s been my favorite since before I can remember.</p>\n<h3><strong>Sound or silence? (And if sound, what sound?)</strong></h3>\n<p>I wish I could write in silence but my office is on a busy street and I’m unusually sensitive to noise, so I use noise-canceling headphones. These days I’ve been alternating between ambient music and progressive psytrance—it felt appropriate for the book.</p>\n<h3><strong>Where do you do your best thinking?</strong></h3>\n<p>Often while free-writing longhand (I should do that more often) or after a swim.</p>\n<h3><strong>What journey—physical, creative, intellectual, or otherwise—has meant the most to you?</strong></h3>\n<p>I developed chronic foot pain in my late 20s. While I was recovering, I got an assignment from <em>Audubon</em> magazine to report on a conservation initiative deep in the rainforests of Madagascar. We would be hiking most of the way there. I was close to broke and badly needed the work. To get out, I walked something like 20 miles in a day. It was grueling but I made it through, and for whatever reason my freelance career seemed to gather momentum afterward.</p>\n<h3><strong>Where do you like to read?</strong></h3>\n<p>In bed early at night before falling asleep.</p>\n<h3><strong>What’s the last rabbit hole you disappeared into?</strong></h3>\n<p>I started reporting a story about toad poaching in 2020 and imagined it would be 2,500 words or so. That one pulled me in pretty deep.</p>\n<h3><strong>Name three publications you enjoy reading these days.</strong></h3>\n<p><em>The New Yorker</em>. <em>Harper’s</em> for its distinctive sensibility and offbeat stories that nobody else would publish. I’ve also been enjoying the new magazine <em><a href=\"https://nowvoyagermag.com/\" target=\"_blank\" rel=\"noopener\">Now Voyager</a>.</em></p>\n<h3><strong>What’s one longread that you can’t stop thinking about?</strong></h3>\n<p>“<a href=\"https://www.newyorker.com/magazine/2014/05/05/the-hunt-for-el-chapo\" target=\"_blank\" rel=\"noopener\">The Hunt For El Chapo</a>” by Patrick Radden Keefe is a certain platonic ideal for me. Panoramic reporting and a sense of effortless intimacy with material that’s notoriously difficult to source. Plus the writing is incredibly smooth.</p>\n<h3><strong>What was the last book you read?</strong></h3>\n<p>I just finished Norman Maclean’s <em>A River Runs Through It. </em>I had read the title story but not the final one, about a young man’s summer job in a logging camp. It’s so singular in tone and so richly observed and reminded me how beautiful and timeless writing can be. </p>\n<h3><strong>What piece of nonfiction are you most proud of writing?</strong></h3>\n<p>A story I did for <em>The New Yorker</em> about illicit gold mining in South Africa, something I’d wanted to write about for many years and am hoping to dig into further.</p>\n<h3><strong>What’s your most reliable way to get creatively unstuck?</strong></h3>\n<p>Jumping in the sea. Sitting in a sauna. Talking about it with my wife.</p>\n<h3><strong>Who’s a writer you turn to when you need some inspiration?</strong></h3>\n<p>John Steinbeck, particularly <em>Cannery Row</em>. I enjoy his humor and character sketches, but most of all I love how he writes about animals and biology. </p>\n<h3><strong>What words do you overuse?</strong></h3>\n<p>“Marginal,” “entrenched,” “booming,” “illicit.” Since writing about psychedelics, “radically” and “profoundly.”</p>\n<h3><strong>What’s your favorite guilty pleasure?</strong></h3>\n<p>At risk of sounding like an old man, watching archival cricket footage on Facebook.</p>\n<h3><strong>What superpower would you like to have? </strong></h3>\n<p>The gift of easy sleep.</p>\n<h3><strong>What animal or nonhuman being do you most identify with?</strong></h3>\n<p>I appreciate the stoicism of donkeys and the playfulness of seals.</p>\n<h3><strong>If you have a free solitary hour in your day, what do you typically do?</strong></h3>\n<p>Go for a walk in the neighborhood or exchange growls with my daughter.</p>\n<h3><strong>What five items would you place in a time capsule?</strong></h3>\n<p>A cricket bat, a ball, the rules, and two wickets (should be more but we’re out of space) so that the game can be reconstituted after the apocalypse.</p>\n<h3><strong>What does your writing space look like?</strong></h3>\n<p>After working from home for more than a decade, I now share an office with a documentary filmmaker just up the road from where I live. It has big windows and boxes of notes on the floor for my next book project and is upstairs from a good coffee shop, which is unfortunate because right now I’m not drinking caffeine.</p>\n\n<p><em><a href=\"https://kimondegreef.com/\" target=\"_blank\" rel=\"noopener\">Kimon de Greef</a> is a journalist from South Africa and the author of </em><a href=\"https://www.penguinrandomhouse.com/books/735472/the-ego-trip-by-kimon-de-greef/\" target=\"_blank\" rel=\"noopener\">The Ego Trip</a><em>, an investigative nonfiction book about psychedelic toads, published by Doubleday. His work has appeared in </em>The New Yorker<em><em>, </em></em>New York<em><em>, </em></em>The New York Times<em><em>, </em></em>The Guardian<em>, </em>Guernica<em>, </em>National Geographic, <em>and other publications. He has coauthored a <a href=\"https://www.goodreads.com/en/book/show/41843361-poacher\" target=\"_blank\" rel=\"noopener\">book</a> about abalone poaching and holds a conservation biology master’s from the University of Cape Town.</em></p>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore questionnaires\n\t\t\t\t</h2>\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/21/questionnaire-s-e-smith/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring s.e. smith</a></h3>\t\t\t\t\t\t<p>The <em>All My Dead Cats and Other Losses</em> author and <em>Flytrap</em> co-founder on grief, breaking and fixing things, and Alice Wong.</p>\n\t\t\t\t<p>July 21, 2026July 21, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/15/questionnaire-aymann-ismail/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Aymann Ismail</a></h3>\t\t\t\t\t\t<p>The <em>Slate</em> writer and <em>Becoming Baba</em> author reflects on Newark and mosques as home, making sense of Egypt on long flights, and becoming a father.</p>\n\t\t\t\t<p>July 15, 2026July 16, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/08/longreads-questionnaire-elisa-gabbert/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Elisa Gabbert</a></h3>\t\t\t\t\t\t<p>The author of <em>Any Person Is the Only Self</em> and recent Guggenheim fellow talks about the worst time of day, the value of wasting an hour, and chilaquiles.</p>\n\t\t\t\t<p>July 8, 2026July 8, 2026\t\t\t\t</p>"},{"title":"Don't be alarmed if you get an 'account banned' message in Call of Duty: Black Ops 2 on PS4 or PS5, you may not actually be banned - here's how you can tell","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/call-of-duty-black-ops-2-prestige-hacks-account-banned-message","category":"gaming","categoryLabel":"Gaming","wordCount":505,"readingTime":3,"content":"<p>Suspension of disbelief.</p>\n    \n  \n  \n  \n  \n            <p>The recently released <a href=\"https://www.eurogamer.net/games/call-of-duty-black-ops-2\" target=\"_blank\" rel=\"noopener\">Call of Duty: Black Ops 2</a> PlayStation 4 and 5 ports continue to get new updates, which is great news for the millions who <a href=\"https://www.eurogamer.net/playstation-xbox-top-20-most-played-games\" target=\"_blank\" rel=\"noopener\">caused the game to shoot up PlayStation's most-played charts</a>.</p>\n<p><a href=\"https://www.eurogamer.net/call-of-duty-black-ops-1-2-ps4-ps5-ports-high-price-lack-of-features\" target=\"_blank\" rel=\"noopener\">Though the ports have many technical shortcomings</a>, one issue in particular has been a sticking point, and it is related to the game's server security. Immediately at launch, <a href=\"https://www.eurogamer.net/call-of-duty-black-ops-1-2-ps4-ps5-ports-hacked-lobbies\" target=\"_blank\" rel=\"noopener\">players were exposed to the hacks and cheats plaguing the PS3 and Xbox 360 originals</a>, but Activision has been making headway into preventing those exploits from ruining the experience in the newer versions of the games.</p>\n<p>The most recent update is especially notable as it may scare legitimate players. As the developer noted on the official Call of Duty Updates account <a href=\"https://x.com/CODUpdates/status/2084060558492663923\" target=\"_blank\" rel=\"noopener\">on X</a>, you may briefly see a message saying you've been banned. This is an unfortunate side effect of some backend updates recently introduced to improve match integrity.</p>\n\n<p>\"While this work is underway, some players may briefly see an account ban notice when they're removed from a match or session so our systems can correctly apply updated account data,\" the X post reads. \"This is a byproduct of legacy systems used by older titles and does not necessarily mean enforcement has been taken against the account.\"</p>\n<p>As shared by users on X, the \"updated account data\" message <a href=\"https://x.com/KrisZeeTee/status/2084103937729458678\" target=\"_blank\" rel=\"noopener\">could look something like this</a>.</p>\n<p>So how can you actually tell if you've been banned? The answer is simple: if you're able to reconnect after getting that message, you're fine. If not, then you know you've been banned.</p>\n<p>As the post adds, Activision is banning players whose accounts \"[have] been identified for enforcement based on evidence of intentionally obtaining unauthorized Prestige levels or other violations of our terms of service, including account manipulation.\"</p>\n<p>Prestige-related hacks have been the most popular in Black Ops 2. Through them, hackers are able to modify a lobby so that anyone reaches Max Prestige - the highest level in the game - simply by joining. This can trigger various problems for players on the receiving end, not least of which that <a href=\"https://www.reddit.com/r/CallOfDuty/comments/1vd248k/my_account_was_just_ruined_bo2/\" target=\"_blank\" rel=\"noopener\">it robs them of the experience of gaining those levels legitimately</a>. Other hacks can instead de-rank rival players, locking them out of game features and causing them to lose out on using previously-unlocked weapons and such.</p><p>That and other security-related issues have received special attention in recent patches. <a href=\"https://x.com/CODUpdates/status/2082909442899845413\" target=\"_blank\" rel=\"noopener\">Last week</a>, the game got a fairly sizeable patch that addressed well-publicised issues like lobbies sometimes failing to bring in new players mid-match, and the especially noticeable input delay when using a 120Hz+ display.</p>\n<p>Here's the full change log for the most recent patch:</p>\n<ul>\n<li>Improved mid-match lobby backfilling.</li>\n<li>Reduced input delay for 120Hz+ displays.</li>\n<li>Zombies matches will now prioritize PS5 hosts and no longer fall back to PS4 hosts.</li>\n<li>Smoke grenade VFX fix.</li>\n<li>Added a toggle to view or hide other players' custom emblems in the Multiplayer options menu. By default, custom emblems remain visible.</li>\n</ul>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"#TheyLied Defamation Suit Over Sexual Assault Claims Involving High School Special Ed Students Can Proceed","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/06/theylied-defamation-suit-over-sexual-assault-claims-involving-high-school-special-ed-students-can-proceed/","category":"law","categoryLabel":"Law","wordCount":1228,"readingTime":7,"content":"<p>From <em>O.A. v. Devita</em>, decided June 25 by L.A. Superior Court Judge Dean Kitchens, but just recently posted to Westlaw:</p>\n<blockquote><p>The following summary is derived from the allegations in Plaintiff's complaint. Plaintiff is a high school boy with a disability who had a long-standing friendship with Defendant's son, M.S., another boy with a disability. Plaintiff is diagnosed with rare and serious genetic conditions causing neurocognitive delays. He also has a language disorder, anxiety, and specific learning disabilities…. Plaintiff has known M.S. for seven years and have been in many of the same special education classes. They also were a part of the same soccer league.</p>\n<p>On October 10, 2022, Plaintiff went to M.S.'s home for a playdate allegedly supervised by Defendant and M.S.'s stepfather …. On November 4, 2022, the boys had another playdate allegedly supervised by Defendant. On May 12, 2023, M.S. reported to his teacher that Plaintiff had pressured him to do \"sexual things.\" Plaintiff was suspended after the report pending an investigation.</p>\n<p>During the initial investigation, Defendant allegedly posted several negative statements about Plaintiff on her Twitter account which were recognized by other members of the community. Defendant also allegedly called the coach of the boys' soccer league and stated that Plaintiff had sexually assaulted M.S. After calling the coach, Plaintiff alleges that Defendant approached them at a softball game and stated that Plaintiff had pulled a knife on M.S. and been physically and verbally abusive since grade school. Plaintiff also alleges that Defendant used the soccer league's member list to call other parents and warn them about him.</p></blockquote>\n<blockquote><p>Plaintiff alleges that Defendant also called the director of Beyond Karate, where Plaintiff has been a participant, and told her that Plaintiff had assaulted M.S. She also allegedly communicated with other participants of the program, stating that Plaintiff had raped M.S. She also allegedly circulated a link containing documents related to her request for a restraining order against Plaintiff.</p>\n<p>On June 16, 2023, the school concluded its investigation and determined that the actions between Plaintiff and M.S. were not forced. Defendant instituted separate proceedings that effectively expelled Plaintiff from high school for multiple months.</p></blockquote>\n<p>Plaintiff sued for, in relevant part, defamation, and the court allowed the case to go forward:</p>\n<blockquote><p>First, Defendant argues that the absolute defense of truth applies to each of her statements…. Here, Defendant presents evidence that Plaintiff admitted to the school principal he had not thought M.S. wanted to engage in sexual activity and that Plaintiff regretted his actions and admitted to \"being dumb.\" This evidence would tend to show the veracity of Defendant's accusations that Plaintiff engaged in non-consensual sexual activity with her child.</p>\n<p>Indeed, Defendant need not show the literal truth of every statement made. By proving that Plaintiff engaged in non-consensual sexual activity, Defendant would prove that the gist of her remarks were truthful. Thus, Defendant has met her burden of demonstrating the application of the complete defense of truth to Plaintiff's cause of action for defamation.</p>\n<p>Plaintiff must then demonstrate the existence of a triable issue of material fact. Plaintiff presents evidence that M.S. did not accuse Plaintiff of rape or sexual assault. Additionally, Defendant acknowledged that the principal did not believe the conduct described by M.S. was forced.</p>\n<p>Indeed, Plaintiff's suspension was later overturned, and he was exonerated of misconduct. This substantial evidence alone creates a triable issue of material fact as to the veracity of Defendant's statements. Thus, the Court finds that Plaintiff has met his burden as well. Accordingly, the Court does not grant summary adjudication based on Defendant's defense of truth.</p>\n<p>Second, Defendant argues that her defamatory statements were opinions which are not provably false or true…. Here, Defendant presents evidence that she reconveyed the opinion of mental health professionals that M.S. had experienced \"assault\" and \"physical abuse.\" While it is true that whether certain actions qualify as assault or abuse may be a matter of opinion, accusations of the same imply facts capable of proof…. While sexual assault can describe a range of conduct, it is not a matter of opinion as it declares or implies facts. Thus, Defendant has not met her burden of demonstrating that her statements were a matter of opinion.</p>\n<p>Third, Defendant argues that she acted with reasonable care in making her statements. To prove defamation, a private individual plaintiff must show that the defendant did not act with reasonable care in checking the truth or falsity of information before publishing it. Here, Defendant offers evidence that at the time she made alleged defamatory statements, she had been briefed by the school of Plaintiff's assault and had been told by M.S. of the events. Based on this information from multiple sources, Defendant has met her burden of demonstrating that she acted with reasonable care in making the defamatory statements.</p>\n<p>Plaintiff must then demonstrate the existence of a triable issue of material fact. Plaintiff submits evidence that Defendant failed to investigate what occurred on November 4, 2022, before accusing Plaintiff of assault. This was one of the dates on which M.S. allegedly reported he was assaulted. Yet Plaintiff submits evidence that Defendant did not ask M.S. what occurred that day or discuss the matter with Jason DeVita, even though he had been supervising the playdate.</p>\n<p>A jury could determine that Defendant did not act reasonably in failing to properly investigate the matter before making accusations. Thus, Plaintiff has demonstrated that triable issues of material fact exist with respect to whether Defendant acted with reasonable care. Accordingly, the Court does not grant summary adjudication on this ground either.</p>\n<p>Fourth, Defendant argues that her statements were privileged. Communications are privileged if made without malice to a person interested in that matter by one who is also interested. The privilege is recognized \"where the communicator and the recipient have a common interest and the communication is of a kind reasonably calculated to protect or further that interest.\" Once a common interest is demonstrated, it is the plaintiff's burden to show that the defendant acted with actual malice in making false statements.</p>\n<p>Here, Defendant has failed to demonstrate that all her statements are protected by the common interest privilege. Defendant argues that she made statements to a community of parents in the Santa Monica area with children with disabilities who fraternized together. These parents shared the interest of keeping their children safe.</p>\n<p>However, whether these various individuals, including school parents, personnel, teachers, community members, and other people connected to the disability-serving program in which Plaintiff participated qualify as sharing a common interest is a disputed factual issue. Indeed, Plaintiff maintains that these individuals did not share a common interest under Civil Code section 47, subdivision (c). Defendant has not presented legal authority demonstrating that a common interest exists between all individuals who know or associate with Plaintiff. Thus, summary adjudication is not appropriate on this ground, either….</p>\n<p>A plaintiff may recover punitive damages where it is proven by clear and convincing evidence that the defendant has been guilty of oppression, fraud, or malice…. In defamation cases, malice may be shown through Defendant's having reasons to doubt the truth or having relied on unreliable sources or failed to verify them. Here, Plaintiff presents evidence that Defendant failed to check with witnesses to the alleged assault before making accusations. This evidence suggests potential malice through Defendant's failure to verify her sources….</p></blockquote>\n<p>Ariel Harman-Holmes represents plaintiff.</p>"},{"title":"Tempur-Pedic Promo Codes for 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/tempur-pedic-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":699,"readingTime":4,"content":"<p>Life is hard, but you know what isn’t? Tempur-Pedic mattresses. This brand’s been around for a long while, which isn’t shocking given the high-quality materials that perform for those that need advanced pressure relief and support. If you’re someone who deals with regular aches and pains, this is a good place to start looking for a new mattress. For those that also want to avoid putting a strain on their budget, now’s a good time to look, as there are several limited-time deals currently running.</p><h2>Save With the Tempur-Pedic Sale</h2><p>Shopping the Tempur-Pedic sale is one of the best ways to score huge discounts on usually pricey buy-it-for-life items like mattresses. <a href=\"https://www.tempurpedic.com/offers/\" target=\"_blank\" rel=\"noopener\">Tempur-Pedic offers</a> and discounts rotate (but usually hover around 30% off), but I’d recommend checking back often to see what new items are on sale and what new seasonal discounts have sprung up. Some of the best Tempur-Pedic discounts we’ve seen are huge price reductions on pillow bundles, buy two and save 30% on sheet sets, and 25% off pillows and bedding.</p><h2>Get a 30% Tempur-Pedic Promo Code When You Sign Up</h2><p>This isn’t the “forward this email or be cursed” email chain you got as a kid. Sign up for Tempur-Pedic’s email updates, and get a solid 30% off discount on pillows and sheets. Plus, you’ll be the first to know about new launches, sales, and everything Tempur-Pedic is up to in the sleep realm. Why wait on savings <em>and</em> better sleep?</p><p>Tempur-Pedic</p><h3>Tempur-Adapt ProAdjust Pillow</h3><p>Tempur-Pedic</p><h3>Tempur-Breeze ProHi Pillow</h3><h2>Save $300 and up to 50% Off With Today’s Tempur-Pedic Coupons</h2><p>If you’re looking to stay cool and comfortable, Tempur-Pedic has got your back (literally). Right now, you get $300 off when you <a href=\"https://www.tempurpedic.com/offers/\" target=\"_blank\" rel=\"noopener\">bundle a (qualifying) mattress</a> with Tempur-Ergo power bases and ProSmart bases. Just as breezy as they sound, each of these mattress lines really emphasize <a href=\"https://www.wired.com/gallery/best-cooling-mattresses/\" target=\"_blank\" rel=\"noopener\">cooling</a> and aim to dial down the temperature—and from my prior testing experience, they are very cool to the touch. Speaking ofl, you can also get 50% off a <a href=\"https://www.tempurpedic.com/bedding/tempur-pedic-sheet-sets/v/3648/\" target=\"_blank\" rel=\"noopener\">TEMPUR-ProAir Sheet Set</a>, which features a moisture-wicking design to keep you cool and comfortable while you sleep. On top of that, be sure to take advantage of more bedding deals, like 25% off pillows and bedding, pillow bundles starting at 2 for $69, and 30% off any 2 Tempur-Pedic sheet sets.</p><p>The ActiveBreeze smart bed cools from within, pairing airflow tech with surprisingly detailed sleep data.</p><h2>Purchase a Tempur-Pedic Mattress Set, Get $300 Off Bases</h2><p>You’re one of those “all in” kind of people when it comes to big decisions—respect. Game recognizes game, and Tempur-Pedic’s giving you a deal that’s hard to pass up. When you get a select Tempur-Pedic mattress and a Tempur-Ergo <a href=\"https://www.wired.com/story/adjustable-frame-vs-adjustable-base/\" target=\"_blank\" rel=\"noopener\">adjustable power base</a>, you can get $300 off the base. Plus, you can get 25% off select bedding and pillows to really go for the full package.</p><ul><li><p>Photograph: Julia Forbes</p></li><li><p>Photograph: Julia Forbes</p></li><li><p>Photograph: Julia Forbes</p></li><li><p>Photograph: Julia Forbes</p></li></ul><p>Tempur-Pedic</p><h3>Tempur-ActiveBreeze</h3><h2>Enjoy $39 Off Bundle Discounts on Tempur-Pedic Pillows</h2><p>Tempur-Pedic doesn’t just create high-quality mattresses that exemplify awesome pressure relief and spine alignment. It also has a variety of <a href=\"https://www.wired.com/gallery/best-pillows/\" target=\"_blank\" rel=\"noopener\">pillows</a> to carry out this mission, because there’s no lack of support happening on their watch. You can bundle pillows and get a nice discount while you’re at it: Get two Tempur-Cloud Pillows for $119; two dual-sided Tempur-Symphony Pillows for $169, two Tempur-Cloud Dual Cooling Pillows for $259; or two Tempur-Neck Pillows for $179 and save $39. When one pillow already has a higher price tag, this is a really good deal to double up on.</p><p>Tempur-Pedic</p><h3>BodyPillow</h3><p>Tempur-Pedic</p><h3>Tempur-Adapt ProHi Pillow</h3><h2>Get Two Tempur-Pedic Sheet Sets and Save 30%</h2><p>A nice pair of <a href=\"https://www.wired.com/story/best-bedsheets/\" target=\"_blank\" rel=\"noopener\">sheets</a> can really make or break your sleep experience. Plus, you’ll need a few pairs depending on the season: something <a href=\"https://www.wired.com/gallery/best-cooling-sheets/\" target=\"_blank\" rel=\"noopener\">cooling</a> like the <a href=\"https://www.tempurpedic.com/bedding/tempur-pedic-sheet-sets/v/3648/\" target=\"_blank\" rel=\"noopener\">ProAir</a> for summer, rayon <a href=\"https://www.wired.com/gallery/best-bamboo-sheets/\" target=\"_blank\" rel=\"noopener\">bamboo</a> if you want a silky feel, or <a href=\"https://www.tempurpedic.com/bedding/tempur-pedic-sheet-sets/v/3639/\" target=\"_blank\" rel=\"noopener\">cotton</a> <a href=\"https://www.wired.com/gallery/best-flannel-sheets/\" target=\"_blank\" rel=\"noopener\">flannel</a> for a cozier vibe. You’ll want to invest in a few pairs for every season (not to mention for extra clean ones if you want to avoid laundry). When you buy 2 Tempur-Pedic sheet sets, you’ll save 30%.</p><p><a href=\"https://cna.st/p/NNEw2ziszMQKhyBHG3Aioj3fSMHjiWSjgWGWKx1x1GCPJMkjsnRxwZYFHNZXn9E5mjKX7e3ptrwUarUgskx3ayVFMZiQ8BE5BD1JBz3sHyTpKjuSPhdYdY6wqvzrDoAoaP6z8JbPRMMUXezhuQo53TNgnCkaEMkb8kkkaJetez8mMvq1UhuqvVfYn9T2fKDqQ8EyrKQynkMRyVpVvLEWHNwxST6DDTW1qX3rXPs69bk9MWaEgtS5zPHXAu9hVkAGy4uDVsZtr1GYosKE4FQUs9JTNTn6kL3R4dTRZpWEThcsNT6Hm79QUN6mF4iXHADkLsvtZN1xvB5Kj3oTip6otGLNo18RxHfmYYwjMKaC3hL1L8gyW2Zev9aSehncrckzhiPpvxm5d27jzf6hDsxGsAFryu1rm73\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Kat Merck</p><p>Tempur-Pedic</p><h3>Tempur-Adapt Mattress Topper</h3>"}];

}

function nextArticle() {
