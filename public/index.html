*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

}

<script>
var articles = [{"title":"'The PC platform is becoming more and more important,' Take-Two chief says, as we continue to wonder when we're going to get GTA 6","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/grand-theft-auto/the-pc-platform-is-becoming-more-and-more-important-take-two-chief-says-as-we-continue-to-wonder-when-were-going-to-get-gta-6/","category":"gaming","categoryLabel":"Gaming","wordCount":592,"readingTime":3,"content":"<p><a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 6</a> is coming! Not to us on Team PC, mind: It will eventually, but right now it's a strict console exclusive. Why? Hard to say: Publisher Take-Two Interactive has taken pains to reassure PC gamers that they're very important and loved, but also, y'know, <em>not now</em>.</p><p>The latest reassurance to gamers on personal computers came during Take-Two's annual shareholders meeting, held yesterday, during which Take-Two chairman and CEO Strauss Zelnick was asked about the potential impact of <a href=\"https://www.tomsguide.com/gaming/playstation/ps5-pro-restocks-latest-updates\" target=\"_blank\" rel=\"noopener\">PlayStation 5 Pro shortages</a>—ironically, driven at least in part by the looming launch of <a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">GTA 6</a>—on the company's plans for releasing the game on PC.</p><p>After clarifying that the question is really about \"the cadence of PC launches,\" Zelnick continued, \"The strategy of the company is over time, generally speaking, to launch for any platforms for which there's a meaningful audience. But that isn't always the case, and certainly if platforms were no longer viable, we would change that strategy. And I would note that the PC platform is becoming more and more important to our company over time.\"</p><p>So, what does that mean? Essentially, that Zelnick doesn't want to talk about it: GTA 6, for better or worse, is a console exclusive, and that's clearly where the studio's focus is.</p><p>Which isn't to say Zelnick's response isn't confusing, but that's something of an ongoing pattern: In May he said PC can account for up to half the total sales of major game releases, but that GTA 6 is debuting on consoles because Take-Two is focused on \"<a href=\"https://www.pcgamer.com/gaming-industry/pc-players-arent-grand-theft-auto-6s-core-audience-take-two-ceo-says-and-thats-why-we-have-to-wait-for-it/\" target=\"_blank\" rel=\"noopener\">serving the core consumer</a>,\" which apparently does not include PC gamers—those gamers who, you may recall, <em>can account for up to half the total sales of major game releases.</em></p><p>Those struck me as inherently contradictory statements, and saying the PC is \"becoming more and more important\" when it's clearly already <a href=\"https://www.pcgamer.com/pc-is-the-most-dominant-its-been-this-decade-as-two-thirds-of-devs-say-theyre-targeting-the-platform/\" target=\"_blank\" rel=\"noopener\"><em>very</em> important</a> doesn't really clear that air. I can understand why Zelnick wouldn't want to just come out and state the obvious reason for holding back GTA 6 on PC—<a href=\"https://www.pcgamer.com/games/grand-theft-auto/theres-really-only-one-reason-for-rockstar-to-release-grand-theft-auto-6-later-on-pc/\" target=\"_blank\" rel=\"noopener\">double-dipping</a>—but if he did, we'd at least be able to relax and say, 'Well, yeah, that makes sense.'</p><p>Speaking of not wanting to talk about things, Zelnick was also asked about GTA Online during the meeting, to which he reminded attendees that GTA 6 is \"a singleplayer experience,\" and that <a href=\"https://www.pcgamer.com/grand-theft-auto-5/\" target=\"_blank\" rel=\"noopener\">GTA 5</a> Online \"continues to be a robust business for us\" that Take-Two will continue to support. The <a href=\"https://www.pcgamer.com/games/grand-theft-auto/twitch-ceo-says-gta-6-multiplayer-will-launch-in-2027/\" target=\"_blank\" rel=\"noopener\">CEO of Twitch thinks</a> GTA 6 multiplayer will come out next year, but it's not entirely clear whether he's speculating or relaying inside info.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Grand Theft Auto 6 is set to launch on PlayStation 5 and Xbox Series X/S on November 19. We'll get it someday.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"Top Zoro Promo Codes for September 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/zoro-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":739,"readingTime":4,"content":"<p>Whether you run a contracting or handyman business, or you're fed up with big-box stores like Home Depot or Office Max and prefer a reliable local shop for tools or office supplies, Zoro is ready to support your business needs. With 12 million industrial supply products, you can be confident that Zoro has what you need. Its user-friendly online platform spares you the hassle of wandering through vast stores searching for items or staff assistance. Zoro's website offers everything necessary to keep your business running smoothly—view past orders, reorder quickly, create shopping lists, and more. Whether you’re restocking everyday su >It is increasingly difficult to function in society without a phone. So I'll turn mine off.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t9.17.2026 12:56 PM\n</p>\n\t</h2>\n\t\n\t\t<p>The <em>New York Times</em> had an opinion piece today <a href=\"https://www.nytimes.com/2026/09/16/opinion/dumbphone-smartphone-friendship.html\" target=\"_blank\" rel=\"noopener\">titled</a>, \"My Dumbphone Made My Life Better. It Made Everyone Else's Worse.\" I can relate. Since <a href=\"https://reason.com/volokh/2024/03/25/unplugging-on-shabbat/\" target=\"_blank\" rel=\"noopener\">September 2023</a>, I have gone somewhat smart-phone free on Shabbat. From Friday evening till Saturday evening, I turn off 5G, WiFi, and Bluetooth on my phone. I would keep the actual telephone on, so I could receive calls and text messages. This half-measure was my way of adhering to my religious beliefs, while also maintaining some connection with friends and family who are not observant.</p>\n<p>From my perspective, the experience has been blissful. For a full day, no one can bother me. I get no emails asking me to do things. If someone writes something about me, I won't see it till Saturday night. And if the Supreme Court issues some emergency ruling, I don't have to deal with it. Then again, text messages from friends will often disturb my solitude. They will text me a link to a social media post, that I can't open for a full day. They will text me, \"Can you believe what Justice X did\"? I could ask what happened, but that defeats the point of the separation. So I spend a full day wondering what happened. Still, the benefits have been clear. People often ask me how I maintain such a productive rate of output. Turning off for a full-day helps me be much clearer for the rest of the week. It is rejuvenating.</p>\n<p>At the same time, there are costs to going smart-phone free. I still have to function in society. Invariably, I burden others. If I need to use an uber, I have to ask someone else to call it from me. (A few times, I've actually scheduled an uber to pick me up at a hotel the night before, so I hope it pray a car actually shows up at the appointed time.) If I need directions, I have to ask someone else to check Google Maps. (I usually download offline directions, but they do not always work.) Virtually any place that involves a check-in requires scanning a QR code. (When I drop my kids off at the daycare at the gym, I have to borrow the attendant's phone to sign them in.) Ordering food is extremely hard, as most places only take orders over an app.  Traveling without a smartphone is a trip. I can still download boarding passes, and print them out, but if there are any disruptions, I have to keep myself glued to the airport monitors. All the while, I have to explain to people why I can't check a smartphone. People are incredulous and confused.</p>\n<p>This experience makes me think of the defunct standard <em>TWA v. Hardison</em>. Accommodating my sabbath observance imposes a burden on others, one that I would hope is <em>de minimis</em>.</p>\n<p>Well, one might think this experience would push me towards using my phone again. Nope. Just the opposite I resolved this Rosh Hashanah to do a bit more. During shabbat, my phone will be off-off. Not just airplane mode. Powered down. I will not receive any calls or texts. And I will not use my laptop with the WiFi off. As productive as people think I am, I will be eliminating a full day of possible working. I still like my odds. I find myself thinking far more deeply about things if I don't look at a screen. Once shabbat finishes, I have fully-formed thoughts in my head, which I can promptly write down.</p>\n<p>The logistics here are even trickier. I will try to not fly on Shabbat. So far, my schedule supports that. That will eliminate a lot of problems. Other situations will have to be planned around. Saturday night, for example, the FedSoc Texas Chapter Conference is host a suite at the Texas Rangers ballpark. Paper tickets are a thing of the past. I had to transfer my ticket to a colleague who can help swipe me in. There are other similar workarounds that will, invariably, burden others.</p>\n<p>The obvious solution, of course, is to just become fully-Sabbath observant. That might be in the cards for me at some point, but it is not feasible at present. I will keep everyone apprised of this process.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/09/17/seven-federal-judges-from-minnesota-talk-to-the-n-y-times-about-trump-administration/\" target=\"_blank\" rel=\"noopener\">NEXT: Seven Federal Judges From Minnesota Talk To The N.Y. Times About Trump Administration</a>\n    </p>"},{"title":"Mail-In Voting Survives","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/mail-in-voting-survives","category":"fun","categoryLabel":"Interesting Reads","wordCount":1184,"readingTime":6,"content":"<p>With three bland, technocratic sentences, the Supreme Court saved <a href=\"https://www.newyorker.com/tag/midterm-elections-2026\" target=\"_blank\" rel=\"noopener\">the midterm elections</a>. In an unsigned order issued on Monday evening, the Court rebuffed the Trump Administration’s bid to impose new rules on voting by mail, restrictions that the Administration claimed were necessary to prevent the phantom menace of voter fraud. Only the two most conservative Justices—Samuel Alito and Clarence Thomas—noted their dissent. Justice Brett Kavanaugh said that he believed the mail-in ballot requirements would eventually pass muster, but that it was too late for state and local officials to implement them for the midterms, now less than fifty days away. The order said that the Administration had failed to show it was entitled to “emergency relief” from the Court after a series of losses in the lower courts. Even more stinging, the Justices concluded that the Administration was “unlikely to succeed” in defending the legality of its rule—a welcome but not definitive indication that this assault on mail-in voting may be dead beyond this year’s elections.</p><p>Fuelled in part by the pandemic, mail-in voting has evolved from exception to norm, much to the displeasure of President Donald Trump, who has asserted that “Democrats are virtually Unelectable without using this completely disproven Mail-In SCAM.” Nearly one in three voters now casts their ballot by mail; some states have virtually eliminated in-person voting. As even Kavanaugh recognized, upending this system so late in the election cycle would have had catastrophic results. Still, just three weeks ago, the Court decided in the Administration’s favor in an earlier phase of the case. That ruling involved a challenge to Trump’s executive order on mail-in voting, which, in the name of “election integrity,” called for the federal government to, among other things, assemble a list of voting-age citizens in each state and develop procedures for delivering ballots in special bar-coded envelopes. The Court found that lawsuit was premature because the order itself did not impose any requirements on those outside the federal government.</p><p>Monday’s case concerned a U.S. Postal Service regulation implementing the order, which was issued late last month. Under the regulation, states, some of which have already begun mailing ballots, would have had to create the new envelopes with barcodes tracking individual voters and upload lists of eligible voters and their addresses to an online federal-government portal. That site is not yet operational, but the regulation bars the Postal Service from delivering ballots to addressees whose names do not appear there. In a brief to the Court, two dozen states challenging the regulation offered a stark assessment of the problems that would ensue if the rule were allowed to take effect. In some states, compliance “would be impossible ahead of the midterms, meaning that millions of voters would be unable to vote by mail and some would not be able to vote at all,” the brief said. “In the remaining States, there would be chaos—and a significant risk that millions more voters would be denied the ability to vote.”</p><p>Imminent chaos aside, the Administration’s claim that the Postal Service has authority to regulate mail-in ballots is questionable at best. The Constitution entrusts the conduct of elections to the states and Congress, if it wishes; the executive branch has no assigned role. The Administration attempted to discern authority over mail-in ballots in 1970 legislation authorizing the modern Postal Service, a stretch worthy of Spider-Man. The law permits the Postal Service “to provide for the collection, handling, transportation, delivery, forwarding, returning, and holding of mail, and for the disposition of undeliverable mail.” It is difficult to see how those powers can be leveraged to justify telling state election officials what they must do before the Postal Service will deliver their ballots.</p><p>The asserted justification for the rule—that it was necessary to prevent the “federal mails” from being “used to perpetrate voter fraud”—was even flimsier. The federal district judge who heard the case wrote, “The record continues to lack any evidence regarding fraudulent absentee or mail-in voting.” Indeed, even if such fraud were rampant, it is difficult to see how the Postal Service rule would stop or expose it. As the Washington lawyer Adam Unikowsky wrote on Substack, “The Postal Service insists it’s trying to combat fraud, but precisely how the requirement of checking the envelopes against the state-provided lists would achieve that goal is quite obscure. The Postal Service isn’t checking the validity of the names on the state-provided lists. So if the states send the Postal Service a list that includes deceased felon illegal immigrants, the Postal Service will duly send the ballots to the deceased felon illegal immigrants.”</p><p>Alito, in a dissent joined by Thomas, cited the federal government’s “strong interest in enforcing the rule” without explaining how it would address the purported election fraud. At the same time, he discounted the potential harm to states. “The plaintiff States invoke the practical effects of implementing the rule close to the midterm elections,” Alito wrote. “I take that problem very seriously, but it is not enough to convince me to deny the application.” Alito said that the complaining states were to blame for the fact that the election is now imminent. “The plaintiff States cannot claim the timing of the rule tilts the equities in their favor when they, and courts hearing their claims, are responsible for so much of the delay,” he wrote. This is a bit hard to take, given that the states, along with voter groups, immediately challenged the executive order and, after it was issued, the regulation itself.</p><p>Court watching these days can be a vertiginous enterprise. Just two weeks ago, the Court backed away from a confrontation with Trump over his efforts to construct the White House ballroom. “Today, we do not pass upon the legality of the government’s East Wing project,” the conservative majority claimed, even as its refusal to halt construction made the ninety-thousand-square-foot ballroom a fait accompli. (Chief Justice <a href=\"https://www.newyorker.com/magazine/2026/08/17/john-roberts-profile\" target=\"_blank\" rel=\"noopener\">John Roberts</a> dissented, along with the Court’s three liberal Justices.) Last week, the Court, with no noted dissents and despite the urging of the Trump Administration, refused to intervene in the case of a newly gerrymandered district map in Missouri that would have benefitted Republicans. Without the Court weighing in, the existing district lines will stand.</p><p>The President’s bid to rewrite election rules was more audacious even than his ballroom project. Once again, we have learned that some Trump measures—eliminating birthright citizenship, imposing emergency tariffs—go too far for this Court. The Court’s red lines would not be mine, but it has them nonetheless. Trump finds that intolerable. In a Truth Social post Tuesday morning that ran close to five hundred words, he denounced “this horrible, highly political, ruling,” adding that this Court “will go down as having rendered some of the most destructive, hurtful, and damaging decisions in our Country’s history.” Trump lamented that the three Justices he appointed, all of whom voted against him Monday, “are merely a shell of their original selves.” Nothing will satisfy this President short of a total capitulation by the Justices. Others of us will have to comfort ourselves with a more mixed record. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
