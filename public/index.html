*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"Kacey Musgraves, Crossover Queen","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/goings-on/kacey-musgraves-crossover-queen","category":"fun","categoryLabel":"Interesting Reads","wordCount":1073,"readingTime":6,"content":"<p><strong>In the past few years,</strong> country music has reëxerted its sway on the pop-music charts and the broader Zeitgeist they reflect, but the genre’s greatest crossover success story remains the Texas singer-songwriter <strong>Kacey Musgraves</strong>. Since her 2013 major-label début, “Same Trailer Different Park,” she has been a shaping voice of modern Americana, not just in the way her music marries rustic and cosmopolitan sensibilities but in its underlying progressive ideal. Clever, observant, and funny as hell, she is one of music’s sharpest lyricists, and a breakthrough in 2018, the kaleidoscopic disco-country masterpiece “Golden Hour,” expanded her creative world view, scaling up from small-town concerns to something more universal, winning Album of the Year at the Grammys in the process.</p><p>Musgraves’s subsequent albums have been sprawling in their search for meaning, and even more adventurous in the sonic pathways travelled to get there. “Star-Crossed,” from 2021, was a psychedelic divorce record that incorporated soft rock and dance music, while “Deeper Well,” from 2024, goes even more soft-spun for the songs of her Saturn return and its reassessed priorities, which included seeing the big picture. Her most recent album, “Middle of Nowhere,” is a homecoming, if not a full reset. Not only does its music scale back to the sounds of the country canon—bluegrass and Western swing, regional Mexican music such as norteño, and the Creole blues of zydeco, with plenty of acoustic guitar and pedal steel—it does so for meditations on how she defines herself as a woman and as an artist. Musgraves brings those conversations with her to the stage at <a href=\"https://www.msg.com/events-tickets/kacey-musgraves-flatland-cavalry-madison-square-garden-august-2026/3B00649CDC945BC9\" target=\"_blank\" rel=\"noopener\">Madison Square Garden</a>, on Aug. 31 and Sept. 1, as she continues her journey of self-discovery.—<em>Sheldon Pearce</em></p><p>Dance</p><p>In 2001, the <strong>Bill T. Jones/Arnie Zane Company</strong> prepared a work that was scheduled to première, on a stage between the Twin Towers of the World Trade Center, on Sept. 12. The début did not happen, but, twenty-five years later, the company performs a new piece that reflects on that moment and all that has happened since. “Curriculum IV: Spin and Spin! Turn! Turn! Turn!,” the final offering of this year’s <a href=\"https://lmcc.net/river-to-river-2026/\" target=\"_blank\" rel=\"noopener\">River to River Festival</a>, features a live score by Samora Pinderhughes sourced from Nina Simone’s rendition of “Turn! Turn! Turn! (To Everything There Is a Season).” The free performances at Wagner Park also nod to the outdoor theatre’s presiding spirit, the Statue of Liberty.—<em>Brian Seibert (Robert F. Wagner, Jr., Park; Sept. 10, 12-13.)</em></p><p>Classical</p><p>This has been a big summer for moviegoing—“The Odyssey,” “Minions 3,” “Jackass 5,” “Scary Movie 6”—and the <strong>Met Opera</strong> wants in on the action. It’s reigniting its <a href=\"https://www.metopera.org/season/summer-events/summer-hd-festival/\" target=\"_blank\" rel=\"noopener\">annual <strong>HD Festival</strong></a>, screening live recordings of recent operas. Did you miss the Met’s début of Gabriela Lena Frank’s “El Último Sueño de Frida y Diego”? They’ve got you. What about “I Puritani,” the first new production of Bellini’s bel-canto masterwork that the Met has put on in almost fifty years? Breathe easy. Have you always been afraid to sneak to the rest room during Wagner’s nearly five-hour “Tristan und Isolde”? No sweat: the festival splits it up into two movies, a day apart. You’ll just have to wait twenty-four more hours for that chord to resolve.<em>—Jane Bua (Josie Robertson Plaza; Sept. 2-7.)</em></p><p>Off Broadway</p><p>The idea that “behind every great fortune is a great crime” gets a twist in Andrew Stein’s topical new artificial-unintelligence play, <strong>“<a href=\"https://www.disruptionplay.com/\" target=\"_blank\" rel=\"noopener\">Disruption</a>,”</strong> in which a great fortune is about to be made through a series of moral crimes. Nick (John David Washington), a silky-smooth tech entrepreneur, invites three friends and their wives to invest in a new algorithm he’s developed, pitched as “Waze . . . but for your life.” Yet the unwitting guinea pigs are eerily reminiscent of what Daisy Hildyard calls “second bodies,” rather than ensouled beings. Their quiddities remain hazily drawn, snapping into focus only when required by Stein’s overdetermined plot; the rhizomatic spread of numbers across the stage floor—Zoë Hurwitz designed the set—reinforces that uncanny cybernetic quality.—<em>Rhoda Feng (Pershing Square Signature Center; through Oct. 4.)</em></p><p>Jazz</p><p>As the <a href=\"https://cityparksfoundation.org/events/verve-70th-anniversary-christian-mcbride-mei-semones-friends-play-the-music-of-getz-gilberto/\" target=\"_blank\" rel=\"noopener\">City Parks Foundation’s SummerStage</a> winds to a close, the concert series saves some of its best for last, pairing the singer <strong>Samara Joy</strong> with the bassist and bandleader <strong>Christian McBride</strong> to celebrate the seventieth anniversary of the historic jazz label Verve Records. A Bronx native and six-time Grammy winner, Joy is among the most expressive jazz performers working, her satiny and sumptuous voice deployed sparingly. McBride, a fixture of the scene since the early nineties, has collaborated with artists across the spectrum, including Joy, on his most recent album, “Without Further Ado, Vol 1.” They are joined by a group of other musicians, led by Mei Semones, in honoring “Getz/Gilberto,” the classic 1964 album by João Gilberto and Stan Getz.—<em>Sheldon Pearce (Rumsey Playfield in Central Park; Sept. 2.)</em></p><p>Movies</p><p>Exquisite style and confrontational substance fuse to startling effect in Rafael Manuel’s teeming début feature, <strong>“Filipiñana,”</strong> which is set at a golf resort near Manila that’s a microcosm of modern political dysfunction. The story, which is told in comedically choreographed visual anecdotes, is centered on women who work there—caddies and so-called tee girls, whose underpaid labor puts them in close contact with wealthy, arrogant, and predatory men. The main drama involves a rural teen-age tee girl who recognizes the resort’s president as the potentate who evicted her family from their land. Rage stays wryly below the surface; Manuel sardonically delights in musical spectacles staged for guests, and the synchronized swinging of clubs at a driving range evokes the superficial charm of robotic lives.—<em>Richard Brody (Opening Aug. 28 at <a href=\"https://filmforum.org/film/filipinana\" target=\"_blank\" rel=\"noopener\">Film Forum</a>, nationally Sept. 4.)</em></p><p>Movies</p><p>Ridley Scott brings admirable restraint to <strong>“The Dog Stars,”</strong> a post-apocalyptic drama set in Colorado in the near future, after a strain of influenza has killed most people. A mechanic named Hig (Jacob Elordi), who lives at an abandoned airstrip with a fierce military veteran (Josh Brolin), pilots a small plane to the ghost town of Denver, where he fetches supplies and visits the house he’d shared with his late wife. In his travels, he encounters a father-and-daughter pair of ranchers (Guy Pearce and Margaret Qualley) and tries to make contact with other survivors. The heart of the film—despite gory confrontations with feral marauders—is the rebuilding of trust, the overcoming of grief, and the importance of vaccines; the science-fiction premise morphs sweetly into sentimental melodrama.—<em>R.B. (In wide release.)</em></p>"},{"title":"\"Forget the classics: remaster the duds\" - What have you been playing this week?","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/what-weve-been-playing-forget-the-classics-remaster-the-duds","category":"gaming","categoryLabel":"Gaming","wordCount":615,"readingTime":4,"content":"<p>A few of the things that have us hooked this week.</p>\n    \n  \n  \n  \n  \n            <h2>29th August</h2>\n<p>Hello and welcome back to our regular feature where we write a little about the games we've been playing. This week, Kelsey didn't have to sacrifice a limb to play <a href=\"https://www.eurogamer.net/elden-ring-walkthrough-8042\" target=\"_blank\" rel=\"noopener\">Elden Ring</a> for the first time again; Bertie mucks around in the Prancing Pony with edgy Aragorn; and the rest of the team travels back from Germany. More to come from them next week!</p>\n<p>What have you been playing this week?</p>\n<p>Here's another question: do you remember what you were playing last week? You don't have to! <a href=\"https://www.eurogamer.net/topics/what-weve-been-playing\" target=\"_blank\" rel=\"noopener\">The What We've Been Playing archive</a> has you covered.</p>\n<h2>Elden Ring, Switch 2</h2>\n\n<p>I've already written at length about <a href=\"https://www.eurogamer.net/elden-ring-tarnished-edition-switch-2-impressions-performance\" target=\"_blank\" rel=\"noopener\">the opening hours of my experience with Elden Ring on the Nintendo Switch 2</a>, and spoilers in case you've not read it yet, but it's not half-bad. There's a few frame drops here and there and I worry how, later, the faster, more-demanding bosses will fare. But so far it's honestly just really nice to be able to alternate between playing the game docked and handheld.</p><p>Sure, I find the text a little small on handheld, but the sheer novelty of being able to play Elden Ring wherever I am is something I've been longing for for years (without having to buy a Steam Deck, that is). It's also been lovely to experience the game from the very beginning again after years of barrelling through New Game Plus and randomisers galore. I always joke about how I'd sacrifice a limb to play Elden Ring for the first time again (I wouldn't really, but still), and playing it from fresh on the <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a> has certainly come pretty close to that being a reality (and my limbs are still intact!).</p>\n<p><em>-Kelsey </em></p>\n<h2>The Lord of the Wings: The War in the North, PS5</h2>\n\n<p>I've been playing a game for review that I'm excited about but I can't talk about it yet, but I'll be able to share my thoughts soon. Otherwise this week has been so busy I've struggled to play much or remember what my name is. Bernard? Boris? Bertha? I even missed Big Walk Tuesday, as I've come to think of it, but you lovely lot organised a stand-in Walk instead, which I love.</p><p>This gives me some white space to say more about The War in the North, the surprise-remastered edition, which I had much more fun with than I expected. Maybe it's the power of the brand, ever-propelled by the ageless Peter Jackson films, but just being in the LOTR world, in the Prancing Pony pub - with Strider-era Aragorn sitting in the corner looking all thuggish with his hood up and smoking - is thrilling. Not quite the voice I was expecting, though.</p>\n<p>There's more width to the game than I'd reckoned on. I thought an action RPG like this would point us at some orcs and off we go, but we - my partner and me in split-screen co-op - noodled around Bree for ages, doing little quests for people with dlightfully dodgy regional accents. Voice acting has come on a lot in the 13 years since this was first released.</p>\n<p>It's a decent package. The action's pretty good - the concept fits brilliantly with the endless battles of the books and films - it's got the appropriate murky grey-brown colouring of the films (or perhaps just that era of consoles), and I'm enjoying it. Maybe I'm being kinder to it because I'm looking back on it like a museum piece, but it's great that it's had another shot at life all the same. Forget the classics: remaster the duds.</p>\n<p><em>-Bertie</em></p>"},{"title":"UN experts call for urgent action from ICC member states to defend the Court against fresh US penalties","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/08/un-experts-call-for-urgent-action-from-icc-member-states-to-defend-the-court-against-fresh-us-penalties-targeting-its-top-officials/","category":"law","categoryLabel":"Law","wordCount":541,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/08/un-experts-call-for-urgent-action-from-icc-member-states-to-defend-the-court-against-fresh-us-penalties-targeting-its-top-officials/#\" target=\"_blank\" rel=\"noopener\">UN experts call for urgent action from ICC member states to defend the Court against fresh US penalties</a>\n</strong><p>UN experts on Friday<a href=\"https://www.ohchr.org/en/press-releases/2026/08/un-experts-demand-bold-action-icc-member-states-denounce-new-sanctions\" target=\"_blank\" rel=\"noopener\"> urged</a> member states of the International Criminal Court (ICC) to implement more stringent measures to safeguard the future of the Court after the latest string of sanctions by the United States targeting senior court officials, emphasizing that such sanctions threaten justice and only serve to embolden the perpetrators of atrocities.</p><p>In commenting on the importance of collective action to ensure that the future of the Court and the rights of survivors of the most heinous crimes of humanity remain intact, the experts stated:</p><blockquote><p>The imperative to act is all the more urgent because the US Government has pledged to “systematically dismantle the ICC’ on the erroneous claim that it threatens US sovereignty… If that policy succeeds, it will roll back international criminal accountability gains against impunity forged in the fires of Nuremberg and Tokyo, and the International Criminal Tribunals for the former Yugoslavia and for Rwanda; and extinguish hope for victims of the gravest atrocity crimes across the world.</p></blockquote><p>The latest series of sanctions imposed by the Trump administration target ICC President Tomoko Akane and Senior Trial Lawyer Abdoulaye Seye of Senegal as part of what organizations such as the International Bar Association say is an <a href=\"https://www.ibanet.org/The-IBA-condemns-US-sanctions-against-the-President-and-a-senior-official-of-the-International-Criminal-Court\" target=\"_blank\" rel=\"noopener\">intimidation campaign</a> designed to penalize the world’s top court for its investigation into the alleged perpetration of war crimes by officials from non-member countries such as the US and Israel. The US Department of State had <a href=\"https://www.state.gov/releases/office-of-the-spokesperson/2026/08/advancing-the-united-states-campaign-to-address-the-threat-posed-by-the-international-criminal-court\" target=\"_blank\" rel=\"noopener\">announced </a>the sanctions against both officials on August 18, with Secretary of State Marco Rubio calling the court “<a href=\"https://x.com/StateDept/status/2090076324186493041\" target=\"_blank\" rel=\"noopener\">corrupt and fatally politicized.</a>”</p><p>The ICC has <a href=\"https://www.jurist.org/news/2026/08/icc-condemns-us-latest-sanctions-against-its-president-and-prosecutor/\" target=\"_blank\" rel=\"noopener\">condemned</a> the imposition of sanctions on both figures, which would result in the <a href=\"https://usunrome.usmission.gov/why-were-dismantling-the-icc/\" target=\"_blank\" rel=\"noopener\">freezing of their US assets</a>, being prohibited from stepping foot on US soil and the inability to utilize US-linked credit cards or access financial services tied to the country, as a blow to international accountability. The UN experts have also expressed concern that the extraterritorial implications of these sanctions were clear violations of the fundamental civil liberties of the court’s officials, in particular, <a href=\"https://www.icc-cpi.int/sites/default/files/2024-05/Rome-Statute-eng.pdf\" target=\"_blank\" rel=\"noopener\">Article 70 of the Rome Statute</a>, the foundational treaty that empowers the ICC, which protects officials from being coerced, threatened or retaliated against in the course of them performing their duties.</p><p>The US has a <a href=\"https://hls.harvard.edu/today/u-s-sanctions-against-the-international-criminal-court/\" target=\"_blank\" rel=\"noopener\">long and notable history</a> of imposing sanctions on ICC officials across <a href=\"https://ir.lawnet.fordham.edu/cgi/viewcontent.cgi?article=2911&amp;context=ilj\" target=\"_blank\" rel=\"noopener\">different contexts</a>, such as during the period where the ICC was examining alleged war crimes perpetrated by US military personnel in Afghanistan, which led to sanctions imposed on then Chief Prosecutor Fatou Bensouda and Phakiso Mochochoko in 2020 under <a href=\"https://www.federalregister.gov/documents/2020/06/15/2020-12953/blocking-property-of-certain-persons-associated-with-the-international-criminal-court\" target=\"_blank\" rel=\"noopener\">Executive Order 13928</a>, although this was later <a href=\"https://assets.aila.org/files/918d7bf9-3db2-4d97-bd14-a9208fcbc234/21040502.pdf?1697590474\" target=\"_blank\" rel=\"noopener\">rescinded</a> by the Biden Administration.</p><p>In the context of the <a href=\"https://www.jurist.org/news/2026/08/un-warns-that-civilians-in-gaza-face-severe-shelter-crisis-as-strikes-and-gunfire-continue/\" target=\"_blank\" rel=\"noopener\">war in Gaza</a>, the ICC’s <a href=\"https://www.icc-cpi.int/sites/default/files/CourtRecords/0902ebd180b70885.pdf\" target=\"_blank\" rel=\"noopener\">issuance of arrest warrants</a> against key Israeli officials such as Prime Minister Benjamin Netanyahu and former Minister of Defence, Yoav Gallant has resulted in figures such as <a href=\"https://www.whitehouse.gov/presidential-actions/2025/02/imposing-sanctions-on-the-international-criminal-court/\" target=\"_blank\" rel=\"noopener\">former Prosecutor Karim Khan</a>, <a href=\"https://www.state.gov/releases/office-of-the-spokesperson/2025/06/imposing-sanctions-in-response-to-the-iccs-illegitimate-actions-targeting-the-united-states-and-israel\" target=\"_blank\" rel=\"noopener\">judge Beti Hohler</a>, and <a href=\"https://www.icc-cpi.int/news/international-criminal-court-deplores-new-sanctions-us-administration-against-icc-officials\" target=\"_blank\" rel=\"noopener\">judge Reine Alapini-Gansou</a> being sanctioned.</p><p>The latest wave of sanctions places the international community at a <a href=\"https://academic.oup.com/jicj/article/24/1/39/8732046\" target=\"_blank\" rel=\"noopener\">critical juncture</a>, making cooperation more important now than ever, although the ultimate outcome remains to be seen.</p>"},{"title":"Stop Touching Your Keyboard. Use This AI-Powered Microphone Instead","source":"Wired","author":"@wired","url":"https://www.wired.com/story/relay-q-voice-to-text-ai-app/","category":"tech","categoryLabel":"Technology","wordCount":1238,"readingTime":7,"content":"<p>How much do you hate typing? The advent of <a href=\"https://www.wired.com/story/how-chatgpt-works-large-language-model/\" target=\"_blank\" rel=\"noopener\">large language models</a> has rapidly advanced voice-to-text technology. Whether it's Wispr Flow <a href=\"https://www.wired.com/story/ai-notetakers-invited-to-the-meetings/\" target=\"_blank\" rel=\"noopener\">joining your meetings</a> to summarize discussions or Google debuting smarter on-device dictation in its <a href=\"https://www.wired.com/review/google-pixel-11-pro-and-pixel-11-pro-xl/\" target=\"_blank\" rel=\"noopener\">latest Pixel smartphone</a>, these tools do far more than transcribe: They intelligently strip filler words, clean up unscripted thoughts on the fly, and seamlessly mediate multilingual conversations.</p><p>Now, a new startup is entering the fray. Unlike its software-focused peers, <a href=\"https://relay.tech/\" target=\"_blank\" rel=\"noopener\">Relay</a> is building a dedicated, portable microphone for high-fidelity voice-to-text anywhere. Based in London, Relay was founded by two former <a href=\"https://www.wired.com/story/carl-pei-thinks-the-phone-of-the-future-will-only-have-one-app/\" target=\"_blank\" rel=\"noopener\">Nothing employees</a>: Cookie Xu, who was Nothing's head of AI and services, and Raymond Zhu, a hardware product manager. While the company is debuting its software today, the hardware—what it calls the Relay Q—won't be available until early 2027.</p><p>Zhu says when he and Xu worked at Nothing, they used <a href=\"https://www.wired.com/story/do-you-actually-need-to-pay-for-transcription-software/\" target=\"_blank\" rel=\"noopener\">Wispr Flow's transcription software</a> to “type” most of their messages at work. He says it greatly helped with thinking out ideas, but they kept running into an issue: talking loudly in an office.</p><p>“In the office, we never really could get the right volume for input,” Zhu tells WIRED. “If I whisper too quietly, the Mac wouldn't be able to pick it up; too loud and my coworker next to me can hear. Sometimes I would actually pull out my earbud and go like this,” he says over a video call, holding an earbud in front of his mouth to demonstrate. “It calls for dedicated hardware.”</p><p>Relay is exclusive to macOS at launch, though the company has plans to bring it to Windows, iOS, and Android. It's starting with the desktop because Zhu believes conversations are most complex there. Chats with friends and family are simple on phones, but at work in front of a computer, you're sharing ideas, brainstorming, and using varied tone and formality.</p><p>Though the microphone is still months away from being ready, I've been using a beta version of Relay's macOS app, which works with or without the dedicated mic.</p><p>During setup, you'll need to choose a hotkey that will trigger Relay in any text field—the default is Fn. Press and hold the key while your cursor is in any text field, and Relay activates and handles the voice dictation. The voice-to-text engine is powered by Google's Gemini models.</p><p>It can also perform contextual actions—dubbed Skills—like asking it to message a colleague in Slack, which prompts Relay to launch the app, find the recipient, and draft the text. I had some trouble with this Slack skill, though it didn't have trouble crafting a calendar event in Google Calendar. Relay has some preset skills you can enable for popular apps like WhatsApp and Gmail, but you can make your own and connect other apps.</p><p>That automation requires sweeping system permissions. Relay needs access to your microphone, but you can grant it access to record a snapshot of your screen anytime it's activated, which is how it can execute those Skills. The company says it stores data locally on the user's device, where users can manually edit or delete it. When the data is sent for processing, it passes through Relay's servers in transit to Google's servers, but Relay does not retain the data. Still, granting AI models eyes on your operating system adds <a href=\"https://www.wired.com/story/expired-tired-wired-all-access-ai-agents/\" target=\"_blank\" rel=\"noopener\">inherent privacy and security trade-offs</a>, like with Microsoft's <a href=\"https://www.wired.com/story/how-windows-recall-works-and-whether-you-should-switch-it-on/\" target=\"_blank\" rel=\"noopener\">Recall</a>.</p><p>Relay's transcription isn't nearly as impressive as what I've recently tried with Google's <a href=\"https://www.wired.com/review/google-pixel-11-pro-and-pixel-11-pro-xl/\" target=\"_blank\" rel=\"noopener\">Rambler feature</a> on its <a href=\"https://www.wired.com/story/pixel-11-pixel-watch-5-pixel-tag-everything-google-announced-at-its-made-by-google-2026-event/\" target=\"_blank\" rel=\"noopener\">Pixel 11 series</a>. It doesn't capture every word perfectly and can mess up punctuation sometimes. It can similarly understand when you misspeak and restate sentences, cutting the parts that don't matter. And yes, it can insert emoji for you, though it did this inconsistently in my tests. When I asked it to add a heart emoji, for example, it did it flawlessly. But when I tried to tack that on at the end of the sentence, it just wrote out “heart emoji.” How romantic.</p><p>It generally knows when you want it to perform an action that's separate from the message. For example, I sent a message via Relay to my wife saying I really want to eat at a particular restaurant, and in the same breath, I asked Relay to provide a Google Maps link to the spot—and it did. This can be a little hit or miss, though. I'll chalk it up to the beta.</p><p>I haven't used it long enough for the software to adapt to my way of speaking, but you can add notes in the Relay app to make it follow certain patterns. For example, I rarely end a sentence with a period in my Slack messages, so I told it to avoid adding periods, and it followed the rule. There's a good deal of customization for specific people that you regularly speak with, which it detects, so you can ensure your messages to your boss sound professional, while messages to your friends are casual. Or you can even set it so that messages to a coworker living in a different country are translated into their language.</p><p>I'm relying on a Mac Mini and the microphone in Apple's Studio Display monitor—some of these accuracy issues could be resolved once Relay's hardware arrives. For instance, right now there's a small delay when I press the function key on the keyboard and when Relay activates, but that delay would be far shorter with dedicated hardware.</p><p>Speaking of, the Relay Q is a cylindrical gizmo with a microphone at the end. You can hold down the top as you speak to trigger Relay on your computer or phone—exactly like the hot key—or take the button off the cylinder and clip it to a shirt if you don't want to hold it all the time. (Viewed from the top, the microphone looks like the letter <em>Q</em>, hence the name.) A double-tap can send the message. You can hold it up to your mouth and whisper as quietly as you'd like, and Zhu says it should be able to pick up what you say.</p><p>“One question was always in our mind when building this product,” Zhu says. “How long can you go with your workday without touching your keyboard?”</p><p>The idea of having a microphone—even a wearable one—for far more accurate voice-to-text isn't new. Last year, a startup called Sandbar unveiled <a href=\"https://www.wired.com/story/sandbar-stream-smart-ring/\" target=\"_blank\" rel=\"noopener\">the Stream Ring</a>, and months later, Pebble showed off its own take, the <a href=\"https://www.wired.com/story/pebble-index-ring/\" target=\"_blank\" rel=\"noopener\">Index 01</a>. Both are rings designed for you to whisper your thoughts into them, and both are starting to ship right about now to initial buyers. Zhu says Relay considered a ring but ultimately decided against it, especially since so many <a href=\"https://www.wired.com/gallery/best-smart-rings/\" target=\"_blank\" rel=\"noopener\">smart rings</a> are already on the market.</p><p>The Relay Q will come with a charging dock so you can neatly keep it on your desk when it's not in use. The company is also creating a separate MagSafe grip you can attach to the back of an iPhone or Qi2-enabled device where the Relay Q can attach, allowing you to press the button easily while using a phone to trigger Relay's voice-to-text on mobile, which it plans to launch alongside the Relay Q in the first quarter of 2027.</p><p>The Q will cost $150 and includes a year of the software, which will cost $15 per month afterward. (You don't need to buy the Relay Q to use the software.)</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
