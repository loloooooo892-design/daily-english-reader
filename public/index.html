*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  letter-spacing: 0.01em;

.meta .sep {

}

.category-tag {

h1 {

  border-radius: 4px;

.swap-bar {

.swap-btn:disabled {

.swap-counter {

.article-body h3 { font-size: 1.175rem; }

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

<script>
var articles = [{"title":"Through Captain Jean-Luc Picard, Patrick Stewart taught us the measure of a man - The Boston Globe","source":"Hacker News Best","author":"","url":"https://www.bostonglobe.com/2026/10/29/metro/patrick-stewart-picard-star-trek-the-next-generation/","category":"tech","categoryLabel":"Technology","wordCount":1140,"readingTime":6,"content":"<p>Two of the Globe’s dyed-in-the-wool Star Trek fans share what Captain Picard, and Patrick Stewart, meant to them.</p><p>John Hilliard: For a younger, and likely wiser generation, stanning a bald middle-aged English actor who played a French guy on a spaceship may be a questionable life choice. But here is the thing: What made Stewart resonate as Picard was how he rooted the character, as in the best of fairy tales, in emotional truth.</p><p>Jason Laughlin: I agree. Picard seemed as real as the complex characters that would start to populate prestige TV a decade later. But unlike anti-heroes such as Tony Soprano and Walter White, Stewart gave us a nuanced character we actually admired. He loved his job. He had passions like <a href=\"https://www.youtube.com/watch?v=SIRQF8PPvUU\" target=\"_blank\" rel=\"noopener\">archaeology</a>, <a href=\"https://www.youtube.com/watch?v=45VAelC_QsI\" target=\"_blank\" rel=\"noopener\">Shakespeare</a>, and <a href=\"https://www.reddit.com/r/startrek/comments/1vtdn25/picards_flute_duet/\" target=\"_blank\" rel=\"noopener\">music</a>. He held to his ideals even when it meant terrible personal sacrifice.</p><p>In the mess of American politics over the past 20 years, there have been so many times I’ve longed for a Picard-style speech that makes right and wrong crystal clear.</p><p>“You know, there are some words I’ve known since I was a schoolboy,” Picard said when a Joe McCarthy-esque admiral began <a href=\"https://www.youtube.com/watch?v=K5Po40kvI9c\" target=\"_blank\" rel=\"noopener\">witch hunting</a> on the Enterprise. “With the first link, the chain is forged. The first speech censured, the first thought forbidden, the first freedom denied, chains us all irrevocably.”</p><p>His character’s moral clarity, and Stewart’s conviction in delivering it, put an end to the admiral’s reign of terror. If only real world oppression could be dispelled so easily.</p><p>JH: <a href=\"https://www.youtube.com/watch?v=rpgYfB4lZAs\" target=\"_blank\" rel=\"noopener\">Full disclosure</a>: Star Trek is a show, which Youtube will prove, that leaned hard on latex foreheads and sometimes-flimsy production to tell stories of intergalactic scallywags known as Klingons and Borg, Romulans and Cardassians. Like free office coffee, it’s an acquired taste.</p><p>JL: One of my friends has a theory that if you didn’t get into Star Trek before you’re 18 years old, you’re never really going to get it. </p><p>To me, what’s so accessible, and radical, about Stewart, though, was his ability to convincingly portray vulnerability while still maintaining Picard as a credible leader.</p><p><a href=\"https://www.youtube.com/watch?v=lpmw3BV2q9Y\" target=\"_blank\" rel=\"noopener\">One episode</a> saw Picard return to his home village in France to heal from a traumatic assault.</p><p>At the conclusion, Stewart surrenders the control that was his character’s hallmark and falls into the mud, sobbing, over his failure to fight off his assailants. It’s a raw, real, depiction of a broken man. Stewart shifts from total collapse into slow recovery by reconciling with his brother. Grief is replaced by warmth, and Stewart sells it perfectly.</p><p>JH: Totally. He knew how to make that show work for him. </p><p>That’s despite an episode where he faces off against a <a href=\"https://www.youtube.com/watch?v=1ulTgc4Wsjs\" target=\"_blank\" rel=\"noopener\">giant, talking tar pit</a>. Or the one <a href=\"https://www.youtube.com/watch?v=1bHQ42zmTt8\" target=\"_blank\" rel=\"noopener\">where he sells</a> eating a sandwich in the sci-fi version of the family station wagon. Or when he chugs Ecto Cooler (remember Ecto Cooler?) with a <a href=\"https://www.youtube.com/watch?v=9t6MZ7hvzcY\" target=\"_blank\" rel=\"noopener\">depressed Scotty</a>, from the original Star Trek, and shares stories about first jobs and first girlfriends. He even shows up in tights, as <a href=\"https://www.youtube.com/watch?v=Sxo2ccLAMHk\" target=\"_blank\" rel=\"noopener\">discount Errol Flynn</a> Robin Hood.</p><p>As a kid raised on television before there was an Internet, Stewart plugged into a world where figures like Mr. Rogers and Bob Ross presented a model for manhood that was gentle, patient, and a teacher. Stewart played Picard in a similar vein, basically everyone’s Space Dad.</p><p>JL: This is embarrassing, but the first TV episode that moved me to tears was from The Next Generation. </p><p>“<a href=\"https://www.youtube.com/watch?v=C0dNcnYln0o\" target=\"_blank\" rel=\"noopener\">The Inner Light</a>” has Picard experience an entire lifetime as a different person on an alien planet. Again, the actor found his character’s humanity through slow revelation that perhaps a life with a wife and children is just as big an adventure as exploring space.</p><p>“Seize the time,” Picard says to his daughter in this other life. “Live now! Make now always the most precious time. Now will never come again.”</p><p>At the end of the episode, it’s revealed the decades he spent in that other life were an illusion he experienced in less than an hour. The only tangible thing he has from that world is a flute he learned to play in that other life. In the final moments, Picard plays it again, and without saying a word Stewart plays absolute heartbreak.</p><p>Seeing a strong, confident leader who was able to express regrets, sadness, and heartache left a lasting impression.</p><p>JH: Imagine you’re a kid watching TV, and you feel kind of alone, unsure of yourself. And then there’s Stewart, in full reassuring teaching mode. It’s the episode where Wil Wheaton’s character is struggling with tremendous guilt as he tries to hide his complicity in the death of a friend. Stewart, as Picard, is on to him.</p><p>Wheaton’s character, Wesley Crusher, is as close to a son as Picard will likely ever have, and Stewart leans into Picard’s grief, grief from knowing that doing the right thing will likely destroy the younger man’s future.</p><p>“A lie of omission is still a lie,” <a href=\"https://www.youtube.com/watch?v=xefh7W1nVo4\" target=\"_blank\" rel=\"noopener\">Picard tells</a> Wheaton. Stewart’s voice cracks as Picard remembers meeting Wheaton’s character for the first time. He sat in Picard’s chair. He knew every button on the ship, every function. He was annoyed, Picard growls.</p><p>Stewart pulls back. Picard never had any doubt that Crusher would grow up into an outstanding officer. Until that moment.</p><p>“The first duty of every Starfleet officer is to the truth, whether it’s scientific truth, or historical truth, or personal truth,” says Picard, who then delivers the gut punch. “If you can’t find it within yourself to stand up and tell the truth about what happened, you don’t deserve to wear that uniform.”</p><p>It doesn’t matter if you know what a Starfleet is, or if someone can be an officer of one. Stewart always finds a way to connect his audience to the emotional truth. </p><p>When you’re a kid, you’re looking for lessons, even if you don’t want to admit it. Stewart, as a master of navigating the human heart, understood the moment and his character. Ultimately, Picard was a teacher, and a guide, not just for the characters with whom he shared a scene, but for the audience as well.</p><p>JL: Stewart was 47 when he began playing Picard. I’m just a year older than him now, and the very best of his episodes have taken on new resonance. Family tensions are real and devastating. Professional choices have lasting consequences. The melancholy of middle age lingers on the periphery of every happy moment.</p><p>Patrick Stewart’s Picard still serves as a role model. He showed how to face those moments with <a href=\"https://www.youtube.com/watch?v=uHSX9e1TadA\" target=\"_blank\" rel=\"noopener\">dignity, optimism, and a belief</a> in the enduring capacity to be our best selves.</p><p>Jason Laughlin can be reached at <a href=\"mailto:jason.laughlin@globe.com\" target=\"_blank\" rel=\"noopener\">jason.laughlin@globe.com</a>. Follow him <a href=\"https://www.twitter.com/jasmlaughlin\" target=\"_blank\" rel=\"noopener\">@jasmlaughlin</a>. John Hilliard can be reached at <a href=\"mailto:john.hilliard@globe.com\" target=\"_blank\" rel=\"noopener\">john.hilliard@globe.com</a> or on Signal at john_hilliard.70. Follow him on Bluesky at iamjohnhilliard.bsky.social.</p>"},{"title":"Appendix to Civil Rights Deserts Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/civil-rights-deserts-appendix/","category":"law","categoryLabel":"Law","wordCount":1356,"readingTime":7,"content":"<ul>\n        <li>Volume 139</li>\n        <li>Issue 8</li>\n        <li>June 2026</li>\n        \n      </ul>\n      \n<p>We searched for all federal cases filed in or removed to the Southern District of Mississippi between January 1, 2007, and December 31, 2022.  Our search was for cases that included “Hinds County” as a party and the word “jail” somewhere in the documents.  This search produced a total of seventy-five cases for the sixteen-year period.  We then reviewed the complaints, when available, and tracked those cases that challenged conditions at the Hinds County facilities, which generally concerned assaults by staff or prisoners, inadequate medical care, or unhealthy conditions.  We removed cases solely challenging a conviction or length of sentence, or solely challenging unconstitutional conduct during the course of an arrest.</p>\n<p>A total of fifty-six cases challenged conditions at Hinds County facilities during this sixteen-year period, including eleven cases filed after the DOJ filed suit.  Several make extended references to the facts unearthed during the course of the DOJ litigation.  Four of those eleven (36.4%) were pro se throughout their litigation, and seven out of those eleven (63.6%) had counsel.  Five of those eleven (45.5%) cases settled.  In contrast, between 2007 and June 23, 2016 (when the DOJ case was filed), there were forty-four cases filed challenging conditions at the Hinds County facilities.  Thirty-two of the plaintiffs were pro se throughout (72.7%), and twelve had counsel at some point during the litigation (27.3%).  Seven of the forty-four settled (15.9%).  The cases are provided in order of filing date, beginning with the most recent.</p>\n<p>*\t*\t*</p>\n<ol>\n<li>Palmer v. Jefferson, 22-cv-00508 (Sep. 1, 2022), counselled, Jordan, C.J., settled (Apr. 15, 2025).  </li>\n<li>Sheriff v. City of Jackson, 22-cv-00392 (July 8, 2022); counselled, Lee, J., judgment on pleadings granted (Nov. 30, 2023).</li>\n<li>Miller v. Jackson Fire Dep’t, 21-cv-00608 (Sep. 21, 2021), pro se, Lee, J., dismissed for failure to prosecute (Nov. 15, 2022).</li>\n<li>Gross v. Walls, 21-cv-00345 (May 18, 2021), pro se, Reeves, J., dismissed without prejudice (Dec. 21, 2021). </li>\n<li>Givens v. Hinds County, 20-cv-00042 (Jan. 22, 2020), counselled, Lee, J., dismissed without prejudice (July 6, 2022).</li>\n<li>Cleveland v. Hinds County, 19-cv-00486 (July 10, 2019), counselled, Reeves, J., settled (Feb. 3, 2021).</li>\n<li>Veal v. Hinds County, 19-cv-00485 (July 10, 2019), counselled, Reeves, J., settled (Feb. 3, 2021).</li>\n<li>Smith v. Clinton Police Dep’t, 19-cv-00406 (June 12, 2019), pro se, Wingate, J., dismissed without prejudice (July 17, 2020).</li>\n<li>Wade v. Hinds County, 19-cv-00193 (Mar. 19, 2019), counselled, Reeves, J., settled (Oct. 21, 2020).</li>\n<li>Neal v. Hinds County, 18-cv-00590 (Aug. 28, 2018), counselled, Reeves, J., settled (May 7, 2021).</li>\n<li>Davis v. Hinds County, 16-cv-00674 (Aug. 29, 2016), pro se, Jordan, J., summary judgment granted to defendants (Jan. 7, 2019).</li>\n<li>United States v. Hinds County, 16-cv-00489 (June 23, 2016) (DOJ lawsuit).</li>\n<li>Mungia v. Hinds Cnty. Det. Ctr. Bd. of Supervisors, 16-cv-00054 (Jan. 29, 2016), pro se, Lee, J., dismissed without prejudice (Jan. 3, 2017). </li>\n<li>Davis v. Hinds County, 15-cv-00874 (Dec. 4, 2015), pro se, Reeves, J., dismissed for failure to prosecute (Aug. 20, 2018).</li>\n<li>Rucker v. UMC Resident Surgeon &amp; Staff, 15-cv-00430 (June 15, 2015), pro se, Walker, J., summary judgment granted to defendants (Feb. 23, 2018).</li>\n<li>Bennett v. Hinds County, 14-cv-00753 (Sep. 25, 2014), counselled, Jordan, J., settled (Aug. 26, 2015).</li>\n<li>Burnett v. Hinds County, 14-cv-00651 (Aug. 19, 2014), counselled, Reeves, J., summary judgment granted to defendants (Oct. 2, 2017).</li>\n<li>Smith v. Townsend, 14-cv-00573 (July 28, 2014), pro se, Anderson, Mag. J., summary judgment granted to defendants (Mar. 9, 2016).</li>\n<li>Bonner v. Hinds Cnty. Det. Ctr., 14-cv-00488 (June 24, 2014), pro se, Ball, Mag. J., summary judgment granted to defendants (Mar. 30, 2016).</li>\n<li>Lewis v. Hinds County, 14-cv-00450 (June 6, 2014), counselled, Lee, J., settled (July 28, 2015).</li>\n<li>Mack v. Hinds Cnty. Bd. of Supervisors, 14-cv-00415 (May 22, 2014), pro se, Anderson, Mag. J., summary judgment granted to defendants (Sep. 29, 2016). </li>\n<li>Montgomery v. Miss. Dep’t of Corr., 14-cv-00079 (Jan. 30, 2014), pro se, Jordan, J., dismissed sua sponte (Mar. 18, 2014).</li>\n<li>Simmons v. Lewis, 13-cv-00624 (Oct. 7, 2013), pro se, Anderson, Mag. J., directed verdict granted to defendants after bench trial (Feb. 11, 2015).</li>\n<li>Barney v. Lewis, 13-cv-00611 (Sep. 30, 2013), pro se, Anderson, Mag. J., motion to dismiss granted (Sep. 15, 2014).</li>\n<li>Gaines v. Hinds Cnty. Bd. of Supervisors, 13-cv-00203 (Apr. 8, 2013), pro se, Ball, Mag. J., motion to dismiss granted (Mar. 11, 2014).</li>\n<li>Long . J., summary judgment granted to defendants (Sep. 24, 2012).</li>\n<li>Williams v. McMillan, 11-cv-00453 (July 26, 2011), pro se, Ball, Mag. J., summary judgment granted to defendants (July 5, 2012).</li>\n<li>Harris v. McMillin, 11-cv-00157 (Mar. 17, 2011), pro se, Ball, Mag. J., summary judgment granted to defendants (Oct. 17, 2012).</li>\n<li>Smith v. Dixon, 11-cv-00025 (Jan. 18, 2011), pro se, Parker, Mag. J., directed verdict granted to defendants after bench trial (Oct. 26, 2012).</li>\n<li>Beeding v. Hinds County, 10-cv-00713 (Dec. 8, 2010), counselled, Jordan, J., settled (Jan. 27, 2014).</li>\n<li>Smith v. Hinds Cnty. Sheriff’s Dep’t, 10-cv-00402 (July 19, 2010), pro se, Ball, Mag. J., motion to dismiss granted (Mar. 10, 2011).</li>\n<li>Skinner v. Hinds County, 10-cv-00358 (June 28, 2010), counselled, Jordan, J., jury verdict granted for defendant after trial, $1,343.70 in costs assessed against plaintiff (Mar. 7, 2014).</li>\n<li>Chaney v. Hinds County, 10-cv-00020 (Jan. 7, 2010), counselled, Lee, J., settled (Sep. 27, 2011).</li>\n<li>Percy v. Hinds County, 09-cv-00687 (Nov. 16, 2009), counselled then pro se, Barbour, J., dismissed without prejudice while summary judgment motions pending (Oct. 20, 2017).</li>\n<li>Anderson v. Brumfield, 09-cv-00278 (May 6, 2009), pro se, Jordan, J., dismissed for failure to prosecute (Sep. 10, 2009).</li>\n<li>Adams v. Hinds County, 09-cv-00151 (Mar. 12, 2009), pro se, Ball, Mag. J., dismissed sua sponte as frivolous (May 21, 2010).</li>\n<li>White v. McMillin, 09-cv-00120 (Feb. 27, 2009), counselled, Jordan, J., settled (Aug. 6, 2012).</li>\n<li>Thomas v. Hinds Cnty. Det. Ctr., 08-cv-00778 (Dec. 24, 2008), pro se, Wingate, J., summary judgment granted to defendants (Nov. 30, 2009).</li>\n<li>Rutland v. McMillin, 08-cv-00763 (Dec. 12, 2008), counselled, Jordan, J., settled (May 2, 2012).</li>\n<li>Adams v. Hinds Cnty. Sheriff’s Dep’t, 08-cv-00644 (Nov. 24, 2008), pro se, Jordan, J., dismissed sua sponte (Jan. 13, 2009).</li>\n<li>Singleton v. Haynes, 07-cv-00667 (Nov. 14, 2007), pro se, Sumner, Mag. J., judgment for defendant after bench trial (Mar. 25, 2009).</li>\n<li>Burnley v. Hinds County, 07-cv-00599 (Oct. 9, 2007), counselled, Lee, J., settled (May 1, 2008).</li>\n<li>Stern v. Hinds Cnty. Det. Facility, 07-cv-00348 (June 19, 2007), pro se, Jordan, J., motion to dismiss granted (Sep. 24, 2010). </li>\n</ol>"},{"title":"'Adolescence' Creator Officially Confirms a Connection Between His Netflix and Apple Shows","source":"Polygon","author":"Aimee Hart","url":"https://www.polygon.com/adolescence-nocturne-stephen-graham-interview/","category":"gaming","categoryLabel":"Gaming","wordCount":500,"readingTime":3,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/aimee-hart/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Oct 31, 2026, 5:00 PM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>A serial crime motif binds small town grief to online radicalization</p>\n                                                    <h2>Adolescence creator confirms thematic parallel between it and Apple's new thriller</h2>\n    \n        \n    \n            <a>\n            <p>Sign in to your Polygon.com account</p>\n        </a>\n<p>Co-created by Stephen Graham and Jack Thorne, the 2025 British limited series <em>Adolescence</em> made waves worldwide when it debuted on Netflix. Adolescence explores the immediate fallout from a young boy, Jamie (Owen Cooper), stabbing a girl to death and the radicalization of men online. The series was so well received that a <a href=\"http://www.gov.uk/government/news/downing-street-opens-doors-to-adolescence-creators-for-vital-discussion-on-protecting-our-children\" target=\"_blank\" rel=\"noopener\">UK government–backed initiative</a> made it free to watch in high schools.</p>    \n<p>A year later, Graham returns for yet another crime-focused thriller — Apple TV’s<em> Nocturne</em>. Instead of playing the guilt-ridden father role he did in <em>Adolescence</em>, however, Graham steps into the soft-soled shoes of Jurek Walter, the cunning mastermind behind the disappearance of two young children — the Frost siblings.</p>    \n\n            <p><strong>Ed. note:</strong> This interview contains light spoilers for the first two episodes of Nocturne.</p>\n    <p>Despite depicting two very different crimes, Graham reaffirmed in an interview with Polygon that fans of <em>Adolescence</em> may want to watch <em>Nocturne</em> next— more connects the two stories than meets the eye.</p>    <h2>\n                        What connects Nocturne and Adolescence?\n               </h2>\n    \n                                                                                            \n        \n<p> At a press junket for Apple TV's <em>Nocturne</em>, Polygon asked Graham whether people who loved <em>Adolescence </em>could find something to love in <em>Nocturne</em>.</p>    <p>One of the main themes of Lars Kepler’s novel \"The Sandman\", on which<em> Nocturne</em> is based, is how Jurek Walter’s crimes affect not only his victims but also their families and friends in Stockholm (renamed Fairhaven, a small town, in the TV series). This isn’t too far off from how <em>Adolescence</em>, while focusing heavily on online radicalization, also delves deep into the impact the stabbing has on the community and on Jamie's family. For example, Jamie’s parents are often harassed, and his sister struggles to make real connections.</p>    <p>“That’s an interesting parallel. I think there’s a lot in there thematically that matches with <em>Adolescence</em>. It is that kind of impact of what a horrific thing can have on a family, specifically if you look at it in the context of Jonah and Saga,” Graham explained. Both Jonah (Liev Schreiber) and Saga (Zazie Beetz) are connected to Graham’s character, Jurek, whose crimes help shape who they are when audiences first meet them in the series' opening episodes.</p>    \n    \n                                                                                            \n        \n<p> However,<em> Nocturne</em> and <em>Adolescence </em>also share a psychological aspect that, according to Graham, makes them very similar.</p>    \n<p>“I think it comes down to that kind of aspect of humanity where we want to know what it is that makes people tick,” Graham shared. “Isn’t the context of humanity, trying to have an understanding for why people do things and trying to learn from those mistakes?”</p>    <p>Audiences can now see just how similar <em>Nocturne</em> and <em>Adolescence </em>are: the first two episodes of <em>Nocturne</em> are available to stream on Apple TV. New episodes will be released every Friday, through and including December 25, 2026.</p>"},{"title":"The Best Mystery Novels of the Twenty-first Century","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/the-best-mystery-novels-of-the-twenty-first-century","category":"fun","categoryLabel":"Interesting Reads","wordCount":767,"readingTime":4,"content":"<p><strong>My usual beat</strong> for <em>The New Yorker</em> is political and legal commentary, and so I’ll ask, in advance of listing my favorite recent mystery novels, for the forbearance of the genre’s true specialists. I’m not the person who can say, for example, which of Louise Penny’s twenty “Chief Inspector Gamache” novels is the best. (“<a href=\"https://cna.st/affiliate-link/CGor3C5hZhZDAxMaqvnis4jsACHfjpGGA6wbN9Q7ExkBnJmM9pEsVDsKseEFvjgDXLogH1nPrZ1MF74rHRnaxdtKrG6DD59GJD1pLNiyK8c7xvKFsiL2zXqWEFN29PYWdaSLVwueE69D1oohkGzNYuXxw8R8jDWhuiRauyS4Hx7eVwPz6ptVh6XphxeVLnputLF4dMhkyiYkPvVEuHetV9pTHhc8VAfK1xwhxtwbunsv56rNXfnquRg2YDewkpoweiUC8Guanvsm8LBW1CKCtNvejkC8Ve8tgXDqVwtTGk49riWr9bzAXZDCd58eJwGgmMLBBCoZnuvgJhFuihNfqZgbykb2eiwjpL8Hp1VNAo6PmEyqayxp6EXdVi4rVCJPnsXNiSHaXXCdMqDLAk6bXDAcg4EX8Yr9xEZGSiT9a72abws7m5ovBj9EVNgo1SDLdxK5HjuC2EASgCVN9gNiuH42T7zRNzvS7zMB4PJ9MKnkQ\" target=\"_blank\" rel=\"noopener\"><em>Still Life</em></a>,” a friend tells me.) But there are overlaps in expertise: most of the best mysteries deal with the imperfect fit between the law and justice and with, as in politics, skewed balances of power, if only in the home, and the tension between public and private identities. I love the puzzles these kinds of books present. Here are four greats from the past twenty years, plus a bonus.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/7M8cUKHfRmKNA6rZmwQuTqEAams77uG3ZG1gfKw8e7FJEweEa4GriCp8D3hL941hG5HGczNjksmGKLeBukK4wqvH7Jg3T8zkZKUEfj5i2ExUA8ns56Cb6VAdUxCCgAm54gZ4PTd8nBnWVGWpXt3qibTwkYoVQVmmMiMHVUJEE1ABK6ddzKktu6rzVkugFPEUqUu39F4pe144cXtJnisWXdgjHEUWVA1JP3cJa4DEEMjqs7d74LDg8a6kiaN7TxKZNcN9pr155tHLDyjgkB3hkdKEZuxwR9mPkRwVER8MZE4K7yxzNa2eK5hr1fmoTdnyNP8zCHaNHtwVPrdfqLo1xHXaFj4Tzbp8DHSBoY39uRS6WmDuECRgU5PKJA67CaQG9UhvG2ny2u28w58TdHqBznZUmZPzPZAhcGTmjdBmdZ9oWS8NWQz6CVLa97JS7f6L4CbpDEktio2\" target=\"_blank\" rel=\"noopener\"><em>The Trespasser,</em></a>” by Tana French</strong></p><p>French has written ten novels (the “Dublin Murder Squad” sextet, the “Cal Hooper” trilogy, and one stand-alone), and the real debate is what order of greatness to put them in. Nine of them were chosen by readers for a recent <a href=\"https://www.nytimes.com/2026/08/13/books/readers-list-100-best-thrillers-century.html\" target=\"_blank\" rel=\"noopener\"><em>Times</em></a> list of the “Best Thrillers of the Century,” the most by any writer. “The Trespasser” is the only one that <em>didn’t</em> make that list. I stand by my pick. The book, about a young Irish woman murdered in her hard-won home, is the French novel that most often comes back to me unbidden. I’ve sometimes taken it off the shelf just to reread the final interrogation scene.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/MgaCFB1RTUyMGhYYkLRRqJr9rpvELQi35N6NgtRLAzraHkPSbBdXoGxvy2hvi3icBa8BdcpN1pJ8M63JmbZX9GzjHkDTec93wSubP94c1jyRgMpHNNhaCfE2pJuNLRsMcBSHnsEN8BYNC554KwfxJEDbqZMqSiFSQho1DKDz3nLWZw5az6LoTr1L6Jp329jpyV29jYsfakjZgyHJ8eUrwjV7yZATqcZPyGrPTsRe3tZLTPix9YYmzpQ3nuXs4yLiiiMb4NcxhAkGrFhnqPMRZXHxUkavoYUNcoixU2zzmXmXsdzjps1LUmYkteGqWSGeRz1v5wvjXoRC7xTeT6ybENpPddK3sZuzmMqNMYY2Q797tbJCrYoR7uTdg3NvtsmBrmYdzs7fkZjiaHSj16jLWH9Jp4dru21YWanx5vug1nYycRKNW8rA6hYmyXegbFCEbch38j8XMTbt1dubPwxxMwe\" target=\"_blank\" rel=\"noopener\"><em>When Will There Be Good News?</em></a>” by Kate Atkinson</strong></p><p>As with French, there is a lot of good Atkinson in the mystery (and non-mystery) department. “When Will There Be Good News?” is the third in her “Jackson Brodie” series, and an exemplar of her narrative control over chaos. Set mostly in Scotland, the book involves the disappearance of a woman and her baby in the long wake of a family murder. Reggie Chase, a babysitter who pulls Brodie into the case, returns as a detective herself in later Atkinson novels.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/2GmHeMjwwVgCQTcZwLduRoZ7rUpy7ChTYeHDe9TRe5a9pZumsYfwNwxQeptaHPw7WxueupgoaWiAX61ZrakTAHBa4pTVWJo9VzKjdz6dK4ZkHRNq6sC4RVRLBnnrJMZ2HEtek4CfLBY5GwaAz8tuMtQqyJAa4sQaGLzui2UropqJMARRGwB5dPBJwNjE7jMR9XsFwEuoWbkf7wkpBRtejAsML87owdKqhPSEbBdSUZSdQ9s4LrkyZ8xu5QhvS5UJhCxqngeuP5ygkBXMgp41oZzTJL7sowgvhBBteBESUYYYMWsa5CQXMMk8awuKXSChNRTiaZey8PstrJeR9Tn8UdJyDeDoF29r7NA6fKvJ3CDkynDNfzcw8hwXUwbqsD4B9UmJxdCSCdu3huHc5f8W6PXyjLnaV6Ff49D4GS49NKWgGh7wJb3JyFttRAizYRD4i43h5xs37N7PGXxCbu5gv46T2TywwetdmAZW371kgHcLBmbMVWx\" target=\"_blank\" rel=\"noopener\"><em>The Girl with the Dragon Tattoo</em></a>,” by Stieg Larsson</strong></p><p>Its rich afterlife alone might earn this novel a place on the list: much imitated (and parodied); an accelerant in the rise of Nordic Noir; the template for a certain kind of hacker-detective; the basis for two sequels and two movies. And yet, upon first reading, I was ambivalent—put off in part because of all the hype but also, perhaps, because of what the book seemed to present as the available responses to sexual trauma. When I picked it up again this summer, though, I found it more nuanced, engaging, and multilayered than I had remembered.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/3tVNgvB1XYxqGgKLEZvJRFbEpKBgNXVDaCWd62prE5VZFLuhw11fWRNNcfMKqAdayzuEsXBZ5bZmKBnpXmE4mFZshntxGUpBkdNAW1hRiHJvbUF5A7gA6mcqesdwoS9Tb7fgZT4AhzdKQ7FG7AjNgdr5gRxGQyn9tRESZCRfJNKUGwPktXJZbhRPesoDpAsumKctHhkfeJcccs8fLivB36SJvVxabjB8QfZXnc3eW7R8byLXuEx3oyQJboTH1N9rTK4ieV8QXVhzGhfmXbzr151PohSCPh6Yvc1mpymZAPPsnuad8eys3864JTFYDFMLw3XvwWwnyRF6zfebRMAcTkWt5gyHiQzPefqFg8CzntaUs1EJ8wvsjeZBZMhMB4eBDSPVMZfQvgD4iWmvJtvoFAeB6ENJ9yMGzGovLDR1djFjQXYFmX51iEmenXjoS8RSqtc\" target=\"_blank\" rel=\"noopener\"><em>Wild Dark Shore</em></a>,” by Charlotte McConaghy</strong></p><p>This one is a bit of a wild card, a crossover into the climate-fiction genre. The setting is a scientific station on an Antarctic island that must be evacuated because of rapidly rising sea levels—a locked-seed-bank mystery, one might say. A shipwrecked woman confronts the enigma of a missing researcher, an unexplained grave, beached whales, and the question of what can or should be saved. It is, in many ways, a counterweight to “The Girl with the Dragon Tattoo,” offering a very different vision of resilience.</p><p>And the bonus: <strong>“<a href=\"https://cna.st/affiliate-link/HiJN9n5HsuP4xRNWXjM2zfzjvtCMSJmz1k6ansPoTs75S8Rfe5k8h6JbQ5tVdv3PCJpZMmpFqsZWvhTUYfPh547Tw9V9546eiWMEWAidktJe8eCDzJm8co4DeujMBJZt4HA8N9XaseXZ9PiEoWQJ91bWUbdnhAJv249rP2aBTup461STuQvgqE6EzoFYn68xuXjidkazSAYwg2XTexReWXR8FjmuwJjm5ApxJw5DFeW8xVP1AhcbCLnGqrLbdqkyjcRoYikFxjcW6cFjZo88ZUohXSuBBHg4DYg7RNbVaKz4aWMFHhXsPFxbd6HD3EQRRufN3HHvxVXcAMe5jgV3HL862hoX9Lk3LB2DmYRpxcUxxXoGPTXWjDqMAnxuKtrr6uU32nE9aQc35a3iF9LXxWgsjxmdb87Zpz7CvUyVRyZfUpWRYres1JKZw57pmGgUNAzsQMJ6QThcwqZBGrRiSqxg68rzYky6e3PisfwfGg4Cojkyn\" target=\"_blank\" rel=\"noopener\"><em>Women Crime Writers: Eight Suspense Novels of the 1940s &amp; 50s</em></a>.”</strong> The novels in this boxed set (including Vera Caspary’s “Laura,” Dorothy B. Hughes’s “In a Lonely Place,” and Patricia Highsmith’s “The Blunderer”) are outside this list’s time frame, but the grouping (edited, with notes, by Sarah Weinman) is new. Mid-century America could be an awfully unsettling place.</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><ul><li>“The Mosquito Bowl,” starring Nicholas Galitzine, Bill Skarsgård, Ray Nicholson, and Tom Francis, is in theatres this weekend. Based on <a href=\"https://cna.st/affiliate-link/nTb77PgGRDE9MFQiyqGctGM88Xa1M9sZr9cs4EWnWX7g7v3su1CJmBZ6xfbjjhabFAxeoddzD9VhHh8BY1dqeTXET8Uv3Mny4rG8udbfVXWeaNxVJ9qJFnneyHddRjNHH7U2YpLkLoGRnwUvJc72JAr8q9pfTaWAkL5RxP7eWsAC15oVLJ9YYcqVZciwqgLWJJLNQgigR5zF9FU5xpptUE2d6rgUPxQo32BjD7pKkscNxtuNhinmfQiQDzNjCxakuNN5ChpjpVmNYQWTrWkpQLfxKgBrqHH7UAbHKWTHHCHQ3PV1AeNaendS7zz2w var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
