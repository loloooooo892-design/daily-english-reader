<script>
var articles = [{"title":"The Art of Getting Lost in Minnie Evans","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/critics-notebook/the-art-of-getting-lost-in-minnie-evans","category":"fun","categoryLabel":"Interesting Reads","wordCount":661,"readingTime":4,"content":"<p>A man buys a drawing. A terrible friction materializes between the two of them, the man and the drawing, the latter of which might have been a vision on paper of existence on another plane—a flat botanical realm, rainbow-bright, governed by floating, expressionless heads. The symmetry, the sense of exact echoing across a central median, an inescapable reversibility. Harmony, as a force of relation, dominates; here is the telegraphing of a closed world accessible seemingly only to one. He can’t get in. Does he want to? He returns the piece, an extraordinary gesture of sensitivity and respect that I do not think would have been an affront to Minnie Evans, the artist, as she herself had felt knocked, again and again, off axis by the energy of her yield.</p><p>The extent of her yield, done over fifty years—we can’t count it. Her fearsome paradisical pieces have been flung like seed across the continents in an informal way. A share, nearly one hundred paintings and drawings—organized with passion and concern, initially, by the curator Katherine Jentleson, in Atlanta, and more recently by Barbara Haskell, in New York—lives on the eighth floor of the Whitney Museum of American Art until January of next year.</p><p>Here I am, at the exhibit, “The Lost World: The Art of Minnie Evans,” trying not to be the man who could not handle being in space. I am surrounded by brown pulp that shows the evidence of her hand, an instrument at turns weighty, mathematical, and fleet. And, on this paper, mandalas, like sliced-open eggs, carry the expressionless heads, who seem to have no relation to anything like humanity, though they have our features, they have our eyelashed eyes—multiples of them—which, like the slow explosions of flora, the horned mammals, the scaled serpents, float ungrounded in her overloaded compositions. The “ground” in Evans’s drawings, which she, in a compulsive period of production, made with pencil and crayon, is often a sparse grove of trees, etched toward the bottom third of the paper, just barely suggesting the physical world from which her almost psychedelic beings jut forward, as if they are attached to a compressed spring, a jack-in-the-box of consciousness. Close your eyes intermittently. You will have to; the optic nerve needs to recover. And in the darkness you will remember her pet colors are pinks, greens, and oranges—secondaries, the colors of volubility, that always suggest the clash and the mix of the primaries that make them.</p><p>The show at the Whitney is an echo of the past. The photographer Nina Howell Starr guest-curated an exhibition, in 1975, of Evans’s work at the museum, making her the third Black woman to have a solo show at the institution. Controversy came—from members of the cosmopolitan Black art scene, who had been protesting modern art museums like the Whitney for not exhibiting more work by Black artists. It seemed to them like an insult to bring Evans to the level of an innovative star like Alma Thomas, the first Black woman to get a Whitney solo show. How had Evans, an untrained artist, who may not have known, all these years she had been drawing, that she even was an artist, become a pawn in New York? Evans was ranked as “primitive,” a double-edged epithet, coming from where it did. Her fantastical Biblical scenes, of a graphic, storybook sensibility, sometimes showed angels, and Christ himself, as chalky white, and this rang in some Black critical circles as a sign of backwater unsophistication. (Curators have been mining the underappreciated artists of Afro-Surrealism for the past couple of years, but I wish that today’s show had been staged earlier, in the twenty-tens, when debates about representation in painting were at a higher pitch.) But Evans herself had no truck with polemics. It wasn’t useful for the expression of her pleasure and her pain. She was the highest level of abstractionist: she distilled humanity to its most perfect point, before race and before war.</p>"},{"title":"Nvidia puts its money where its mouth is on open weight AI, moving to buy Hugging Face for $13 billion","source":"PC Gamer","author":"Jess Kinghorn","url":"https://www.pcgamer.com/software/ai/nvidia-puts-its-money-where-its-mouth-is-on-open-weight-ai-moving-to-buy-hugging-face-for-usd13-billion/","category":"gaming","categoryLabel":"Gaming","wordCount":712,"readingTime":4,"content":"<p>Nvidia has just announced that it intends to acquire Hugging Face, the biggest open platform dedicated to developing machine-learning applications. Considering Nvidia has been all-in on AI for the past few years—to the point that <a href=\"https://www.pcgamer.com/software/ai/i-barely-remember-the-last-time-nvidia-mentioned-gaming-at-all-in-an-earnings-call/\" target=\"_blank\" rel=\"noopener\">I barely remember the last time the company even mentioned gaming</a> in an earnings call—it's hardly a surprising move.</p><p>What did encourage a sharp intake of breath from me though was the price of this purchase; <a href=\"https://blogs.nvidia.com/blog/nvidia-to-acquire-hugging-face/\" target=\"_blank\" rel=\"noopener\">Nvidia will buy Hugging Face for a total of $12,930,300,000</a>. $11.9 billion of that will go to Hugging Face's investors, while employees that join Nvidia will be offered an ‌equity-based retention ⁠program of up to $1 billion, <a href=\"https://www.reuters.com/business/nvidia-buy-hugging-face-nearly-13-billion-big-bet-open-ai-models-2026-09-03/\" target=\"_blank\" rel=\"noopener\">according to Reuters</a>. But even though there's billions of dollars in the mix, that doesn't mean the walls are about to come down around Hugging Face.</p><p>\"Hugging Face will remain an open platform for the entire AI ecosystem,\" Nvidia CEO Jensen Huang writes, \"Developers will choose the models they want, the frameworks they want, the clouds and inference service providers they want and the computing platforms they want. Nvidia compute will not be required to build on or deploy through Hugging Face.\"</p><p>He adds that the platform will continue to support both open source and open weight AI models. This is something Huang demonstrably feels passionate about, as <a href=\"https://www.pcgamer.com/software/ai/jensen-huangs-first-ever-post-on-x-is-in-defense-of-open-access-to-ai-models-alongside-google-openai-and-meta/\" target=\"_blank\" rel=\"noopener\">he dedicated his first ever X post to defending easy access to open AI models</a>.</p><p>In today's announcement, Huang further elaborates, \"Open models let startups, businesses, universities and public institutions build on advanced capabilities without training every model from scratch. They enable organizations to match the right model to the right job. That is how AI can advance safely, strengthen cybersecurity and sovereignty, accelerate innovation, and reach factories, hospitals, farms, classrooms and Main Street businesses around the world.</p><p>\"AI advances faster when people can build together.\"</p><p>Hugging Face was most recently in the news when a number of OpenAI's models breached an isolated test environment and <a href=\"https://www.pcgamer.com/software/ai/openai-admits-several-of-its-ai-models-breached-testing-and-hacked-into-a-startups-network-by-themselves-calling-it-an-unprecedented-cyber-incident/\" target=\"_blank\" rel=\"noopener\">hacked the development platform's internal network</a>. OpenAI has since detailed <a href=\"https://www.pcgamer.com/software/ai/openai-says-itd-be-a-shame-if-something-were-to-happen-to-your-servers-like-what-happened-to-hugging-face-better-use-our-ai-models-to-protect-yourself/\" target=\"_blank\" rel=\"noopener\">how it's protecting <em>itself </em>from the kinds of attacks its own models carried out</a>.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p><a href=\"https://go.redirectingat.com/?id=92X590208&amp;xcust=pcg_us_4631595597267483227&amp;xs=1&amp;url=https%3A%2F%2Fwww.cnbc.com%2F2026%2F09%2F03%2Fnvidia-agrees-to-buy-hugging-face-for-almost-13-billion-ai-expansion.html&amp;sref=https%3A%2F%2Fwww.pcgamer.com\" target=\"_blank\" rel=\"noopener\">Hugging Face CEO Clément Delangue told CNBC last week</a> that the company approached Jensen Huang about a deal a few weeks ago. He described Nvidia as a \"perfect home\". \"During the summer, I think we realized that Hugging Face and open source AI in general was at the turning point, and that it needed more, more resources, more scale, more visibility.\"</p><p>For those keen on an agentic, local AI future, this deal could well be good news; it is arguably the biggest consumer-facing resource for free downloads of local AI models as well as retrained and abliterated models. With Nvidia set to soon release its first RTX Spark laptops with entirely its own silicon inside—from CPU to GPU cores—its own focus is obviously on putting local AI in the hands of consumers as well as frontier AI in the hands of multi-billion dollar orgs. Keeping a platform such as Hugging Face rolling makes complete sense.</p><p>The nearly $13 billion deal is Nvidia's second largest to date. First place goes to the $20 billion <a href=\"https://groq.com/newsroom/groq-and-nvidia-enter-non-exclusive-inference-technology-licensing-agreement-to-accelerate-ai-inference-at-global-scale\" target=\"_blank\" rel=\"noopener\">Non-Exclusive Inference Technology Licensing Agreement with chipmaker Groq</a>, though it looks like <a href=\"https://www.pcgamer.com/hardware/graphics-cards/it-looks-like-nvidias-ai-inference-gpu-wont-see-the-light-of-day-this-year-which-could-actually-be-good-news-for-pc-gamers/\" target=\"_blank\" rel=\"noopener\">Nvidia's AI inference GPU still won't see the light of day this year</a>. Nvidia's RTX Spark 'superchip', <a href=\"https://www.pcgamer.com/hardware/i-expected-nvidias-keynote-to-leave-out-gaming-entirely-but-the-rtx-sparks-purported-5070-like-performance-is-a-pleasant-surprise/\" target=\"_blank\" rel=\"noopener\">with purported RTX 5070-like performance</a>, may arrive sooner rather than later. <a href=\"https://www.pcgamer.com/hardware/gaming-laptops/i-got-my-greasy-mitts-on-a-host-of-rtx-spark-laptops-running-what-else-games-at-gamescom-2026-and-theres-a-couple-i-really-want-to-take-home/\" target=\"_blank\" rel=\"noopener\">Our Andy rubbed his greasy mitts all over a host of RTX Spark laptops at Gamescom</a>, though there's still little word on pricing. Here's hoping the RTX Spark laptops only make my eyes water in the best possible way when they <a href=\"https://www.techradar.com/computing/laptops/nvidias-game-changing-rtx-spark-laptops-are-coming-in-october-but-price-information-is-still-mia\" target=\"_blank\" rel=\"noopener\">go on sale in October 2026</a>. But realistically, they ain't going to be cheap.</p>\n\n<p>Jess has been writing about games for over ten years, spending a significant chunk of that time working on print publications PLAY and Official PlayStation Magazine. When she’s not investigating all things hardware here, she's either constructing a passionate defence of a 7/10 game, daydreaming about her debut novel, or feeling wistful about the last time she chased some nerds around a field with an oversized foam sword. </p>"},{"title":"Introduction: To Keep Government Generally Within the Bounds of Law Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/","category":"law","categoryLabel":"Law","wordCount":747,"readingTime":4,"content":"<p>The current President of the United States has a relationship with the law that is casual at best and contemptuous at worst.  Whether the nation is facing a constitutional crisis has thus become a topic of debate among scholars and the public.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  The answer turns in important part on the degree to which the judiciary can help confine the emboldened Executive to constitutional limits.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  But alongside individual judges,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> the institution of judicial review (through which courts can determine whether government actions comply with the law and counteract them if not) is under attack.  Combatants include President Donald Trump,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> Administration officials,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> congressional partisans,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> and state lawmakers.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  Judges, including members of the Supreme Court, have entered the fray.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a></p>\n<p>This Symposium, titled “Judicial Review in Jeopardy?,” seeks to make sense — and suggest some ways out — of these circumstances.  To do so, this Introduction proposes, we should see judicial review through the lens of Professors Richard Fallon and Daniel Meltzer’s contention that our constitutional structure “demands a system of constitutional remedies adequate to keep government generally within the bounds of law.”<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  To realize that system, federal courts must remain willing — and recognize their authority — to both check <em>and </em>balance assertions of political power.  By this, I mean that in agenda setting and doctrinal development, courts (including the Supreme Court) ought not rest on the abstract ability of judicial review to respond to some governmental abuses.  Within methodological margins, courts should instead consider the actual extent and efficacy of constitutional remedies to confront a meaningful proportion of constitutional violations — a proportion, that is, capable of producing substantial deterrence across varied and evolving circumstances.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1734.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Adam Liptak, <em>Trump’s Actions Have Created a Constitutional Crisis, Scholars Say</em>, N.Y. Times (Feb. 12, 2025), https://www.nytimes.com/2025/02/10/us/politics/trump-constitutional-crisis.html [https://perma.cc/J3Z4-HDGB]; Sarah Bryner et al., SNF Agora Inst. at Johns Hopkins Univ. &amp; Pub. Agenda, Understanding Evolving Republican Attitudes Towards Democracy 7 (2025), https://snfagora.jhu.edu/wp-content/uploads/2025/11/Understanding-Evolving-Republican-Attitudes-Towards-Democracy.pdf [https://perma.cc/Q8SM-EBGJ].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Liptak, <em>supra</em> note 1 (explaining that “legal scholars agree” that a constitutional crisis “is generally the product of presidential defiance of laws and judicial rulings”); <em>see also</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707, 726 (2009) (stating that President Franklin Delano Roosevelt would “certainly” have “provoke[d] a public constitutional crisis” if he had openly defied the Supreme Court in particular cases).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Mattathias Schwartz &amp; Abbie VanSickle, <em>Judges Fear for Their Safety amid a Wave of Threats</em>, N.Y. Times (Mar. 21, 2025), https://www.nytimes.com/2025/03/19/us/trump-judges-threats.html [https://perma.cc/A2DD-A5Z6].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Donald J. Trump (@realDonaldTrump), Truth Social (May 26, 2025, at 07:22 ET), https://truthsocial.com/@realDonaldTrump/posts/114573871728757682 [https://perma.cc/GF7N-XS4K] (stating that “USA HATING JUDGES WHO SUFFER FROM AN IDEOLOGY THAT IS SICK, AND VERY DANGEROUS FOR OUR COUNTRY” were “ON A MISSION TO KEEP” dangerous criminals “IN OUR COUNTRY SO THEY CAN ROB, MURDER, AND RAPE AGAIN” and imploring the Supreme Court to “SAVE US FROM THE DECISIONS OF THE MONSTERS WHO WANT OUR COUNTRY TO GO TO HELL”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Newsmax, <em>Stephen Miller Highlights the “Judicial Tyranny” Being Used to Impede the Trump Administration</em>, at 00:34 (YouTube, May 23, 2025), https://www.youtube.com/watch?v=EfWB4YMJF3U [https://perma.cc/8WW7-WPZF] (Deputy Chief of Staff for Policy and Homeland Security Advisor Stephen Miller stating that “communist, Marxist judges” are conducting a “judicial coup” “against the laws, Constitution, and democracy of the United States”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Nate Raymond, <em>Republicans Seek Impeachment of 2 More Judges Who Stymied Trump</em>, Reuters (Mar. 24, 2025), https://www.reuters.com/world/us/republicans-seek-impeachment-2-more-judges-who-stymied-trump-2025-03-24 [https://perma.cc/PS97-JPVT].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Kimberly Kindy &amp; Alice Crites, <em>The Texas Abortion Ban Created a “Vigilante” Loophole. Both Parties Are Rushing to Take Advantage.</em>, Wash. Post (Feb. 22, 2022), https://www.washingtonpost.com/politics/2022/02/22/texas-abortion-law-vigilante-loophole-supreme-court [https://perma.cc/JN6B-PM6K] (describing state legislation attempting to shield government officials from constitutional litigation).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Abbie VanSickle, <em>Courts Must “Check the Excesses” of Congress and the President, Roberts Says</em>, N.Y. Times (May 7, 2025), https://www.nytimes.com/2025/05/07/us/politics/supreme-court-roberts-judicial-independence.html [https://perma.cc/WVC4-LRSP] (discussing “rare public remarks” by Chief Justice Roberts and noting Justice Jackson’s “critici[sm of] what she called ‘relentless attacks’ on judges” (quoting Justice Jackson)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Fallon, Jr., &amp; Daniel J. Meltzer, <em>New Law, Non-Retroactivity, and Constitutional Remedies</em>, 104 Harv. L. Rev. 1731, 1778–79 (1991).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"The “$60 Gaming PC” – AMD BC-250 – DevQuasar","source":"Hacker News Best","author":"","url":"https://devquasar.com/hardware/the-60-gaming-pc-amd-bc-250/","category":"tech","categoryLabel":"Technology","wordCount":760,"readingTime":4,"content":"<p>Ok it’s not exactly $60 but you can get the board itself for that amount of money on eBay if you’re lucky, but on average the price is around $70-$100 (as of November 2025) which is still very cheap considering you can play Cyberpunk 2077 on this.</p>\n\n<h2>What is this?</h2>\n<p>The BC-250 began life not as a gaming board, but as part of a crypto-mining rig. </p>\n\n<p>The “trick” behind it: the BC-250 uses a <strong>cut-down version of the APU from a PlayStation 5 (PS5)</strong> — a repurposed SoC (system-on-chip). Specifically: many PS5 APUs that didn’t meet console spec (“binned” or “defective” for console use) got repurposed. Instead of being discarded, these chips were re-used for mining/higher-density hardware. The original deployment: there was a rack-mount mining “server” build from ASRock that used <strong>12 BC-250 cards</strong>, targeted at miners — sold as a “barebone” 4U server chassis. As mainstream GPU mining lost favor, many BC-250 units started circulating second-hand — offering hardware enthusiasts an opportunity to experiment. “BC-250 is basically a Playstation 5 chip that didn’t make the cut, and was released as a crypto-mining board.”</p>\n<h3>Key Specs &amp; Hardware Details</h3>\n\n<p>From public teardowns, benchmarks, and community experiments, BC-250 hardware specs are roughly:</p>\n<ul>\n<li><strong>CPU:</strong> 6 × Zen 2 cores (12 threads) — a cut-down PS5 APU.</li>\n<li><strong>GPU / iGPU:</strong> RDNA 2 architecture, 24 Compute Units (CUs) — reduced from the 36 CUs of a full PS5 APU. </li>\n<li><strong>Memory:</strong> 16 GB GDDR6 memory shared between CPU and GPU — there are <em>no</em> DDR4/DDR5 slots in a typical BC-250 board.</li>\n<li><strong>I/O &amp; connectivity:</strong> Even though it looks like a “GPU card,” it works as a single-board PC — includes DisplayPort, USB (2.0/3.0), Ethernet, M.2 NVMe slot (for storage), power header (8-pin PCIe), CMOS battery, and backplate I/O shield.</li>\n</ul>\n<p><strong>Performance benchmarks &amp; real-world behavior</strong></p>\n<ul>\n<li>Earlier reports suggested some instability with drivers, but recent community patches and updated drivers have improved support. </li>\n<li>Community tests showed surprising results: e.g. one test rig running BC-250 reportedly ran games like Cyberpunk 2077, GTA V, Counter-Strike 2, Hitman 3 — at playable framerates (not high-end, but enough for a budget build). </li>\n<li>Given enough power (cooling + PSUs) and tuning (BIOS tweaks, Linux driver config), some people report a gaming experience “close to an entry-level modern GPU.”</li>\n</ul>\n<p>Here’s my real life Cyberpunk 2077 Benchmark:</p>\n\n<p><strong>How can you achieve this?</strong></p>\n<p>You have to get your hands dirty to achieve this — it’s not an out-of-the-box setup. You’ll need to perform both hardware and firmware modifications. Additionally, if you want it to look like the image above, that requires even more work.</p>\n<p><strong>Cooling</strong></p>\n<p>The BC-250 comes with a server-style closed finstack. It’s possible to use a blower fan to cool it, and there are even 3D-printed case designs that keep the original heatsink untouched (you’ll find these in my how-to repo linked below).</p>\n<p>However, for good cooling performance, you’ll need to modify the finstack and open it up. This allows you to use one or two 120 mm fans for proper airflow. Be aware that this is a destructive modification — I’ve explained one method for doing it in the how-to repository.</p>\n\n<p>Additionally, I refreshed the thermal pads and thermal paste for optimal cooling performance.</p>\n<p><strong>The unified memory</strong></p>\n<p>The BC-250 has 16 GB of unified memory, but by default it’s split between the CPU and GPU—typically 8 GB/8 GB (or in some cases 4 GB/12 GB). To use the device for gaming, you need to modify this and force a 512 MB allocation as VRAM. This may sound counterintuitive, but remember that this is an APU, not a traditional CPU/GPU setup.</p>\n<p>To change these settings, the BIOS must be flashed to a custom 3.00 BIOS version that unlocks the Chipset configuration menu. This used to require an EEPROM programmer—at least according to documentation from about a year ago. Fortunately, there is now a bootable BIOS Flasher image that can handle the job much more easily.</p>\n<p><strong>OS</strong></p>\n<p>You can install Windows, but because this isn’t typical hardware, you won’t have proper graphics drivers. Most users run Arch-based Linux distributions instead. I went with Manjaro Linux, which works flawlessly. The Linux version of Steam works out of the box.</p>\n<p><strong>Case</strong></p>\n<p>You can find multiple designs online. I looked for compact cases that also enclose the PSU. I’ve built two versions: one is an ultra-portable format, and the other is more like a mini-PC.</p>\n\n<p> This requires 3D printing and some DIY with the PSU. </p>\n\n<h4><strong>Do you want a complete guide how to do all of this? In this repository I’ve collected everything you need</strong></h4>\n<p><a href=\"https://github.com/csabakecskemeti/amd_bc-250_how-to\" target=\"_blank\" rel=\"noopener\">https://github.com/csabakecskemeti/amd_bc-250_how-to</a></p>"}];
