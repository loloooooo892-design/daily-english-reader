<script>
var articles = [{"title":"On Tour with the Eclipse Chasers","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/09/07/on-tour-with-the-eclipse-chasers/","category":"fun","categoryLabel":"Interesting Reads","wordCount":538,"readingTime":3,"content":"<p>A man named Donald Liebenberg tops <a href=\"http://eclipse-chaser-log.com/\" target=\"_blank\" rel=\"noopener\">eclipse-chaser-log.com</a> with a whopping 2 hours, 27 minutes, and 41 seconds of darkness from 27 total eclipses—stats I didn’t even know people tracked until I read Rudi Zygadlo’s piece. It turns out there’s a dedicated subculture of umbraphiles logging every second of totality. Zygadlo meets a veteran British couple who’ve built their lives around these fleeting events, then travels to Spain in August 2026 to see his own first total eclipse. Adding 1 minute 38 seconds to the board earns him a place near the bottom, but judging by the awe he feels in those brief moments of darkness, he may be moving up the league yet. </p>\n<blockquote>\n<p>There are various eclipse-chasing guests in our hotel. You can identify many of them from themed caps and T-shirts. The largest party is an alumni group from UCLA. We meet several by the pool. A couple from Minnesota, a sommelier from New York. “I was in Montreal for 2024,” says Mees from the Netherlands, treading water. “My wife is a virgin.” Everyone is friendly, but somewhat shifty when it comes to the issue of where to watch. We are too.</p>\n<p>By 6pm on the day of, we are stationed on the infernal hillside, on a dusty path beneath pine trees and an immaculate sky. There are better vantage points but we have some degree of privacy here. We can hear others, but we can’t see them. The partial phase begins with a yodel at 7:34pm when the sun is eight degrees — or a fist’s length — above the horizon and my father-in-law produces a bottle of local white, which immediately turns warm in the glass. The nibble of the moon turns into a bite then into a crescent and I’m surprised how well my bottom-of-the-range bridge camera with a solar filter over the lens captures the partial phases. Later I’ll wish I never turned the thing on. Meara is quiet. Glowing. She is more pregnant than ever.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on astronomy \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/24/the-unseen-fury-of-solar-storms/\" target=\"_blank\" rel=\"noopener\">The Unseen Fury of Solar Storms</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tHenry Wismayer | June 24, 2025 | Noēma | 6,505 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Lurking in every space weather forecaster’s mind is the hypothetical big one, a solar storm so huge it could bring our networked, planetary civilization to its knees.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/21/what-happens-once-we-spot-the-asteroid-that-will-hit-earth/\" target=\"_blank\" rel=\"noopener\">What Happens Once We Spot the Asteroid That Will Hit Earth?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTomas Weber | FT Magazine | July 19, 2025 | 4,536 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“This year, the alert system for defending the planet against incoming space rocks was activated for the first time. It won’t be the last.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/09/26/the-searchers-3/\" target=\"_blank\" rel=\"noopener\">The Searchers</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDave Eggers | The Washington Post | September 17, 2024 | 6,805 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“[T]he work being done at JPL is the most inspiring research and exploration being done by any humans on our planet.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2020/09/09/the-weird-space-that-lies-outside-our-solar-system/\" target=\"_blank\" rel=\"noopener\">The Weird Space That Lies Outside Our Solar System</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tPatchen Barss | BBC | September 8, 2020 | 2,234 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>Launched in the 1970s, Voyager 1 and Voyager 2 — the first two spacecraft and human-made objects to leave our solar system — have reached interstellar space and now beam back images from this mysterious region.</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2019/01/25/what-falls-to-earth-2/\" target=\"_blank\" rel=\"noopener\">What Falls to Earth</a></h3>\t\t\t\t\t\t\t\n\t\t\t\t\t\t<p>Grieving the mysterious death of her father, Susanna Space seeks refuge in the study of meteors. </p>"},{"title":"A new kind of AI model from a ChatGPT inventor is thrilling developers","source":"TechCrunch","author":"Tim Fernholz","url":"https://techcrunch.com/2026/09/18/a-new-kind-of-ai-model-from-a-chatgpt-inventor-is-thrilling-developers/","category":"tech","categoryLabel":"Technology","wordCount":898,"readingTime":5,"content":"<p>ChatGPT broke Diogo Almeida’s heart. </p>\n<p>Almeida was an OpenAI researcher who helped build the chatbot and then invent reinforcement learning from human feedback (RLHF), the model-training technique perhaps most responsible for our current age of AI. But despite its capabilities, he was disappointed. </p>\n<p>“We have lightning in a bottle, and yet it is not useful,” Almeida told TechCrunch. “I’ve been battling that problem since then. It took me a while to come to the conclusion: The problem is we are optimizing for human language … We have been super good at human language for four years, but it’s not useful for automation because computers speak a different language.”</p>\n<p>Two years ago, Almeida left OpenAI to start <a href=\"https://typesafe.ai/\" target=\"_blank\" rel=\"noopener\">TypeSafe AI</a>, a startup trying to fix that problem. This week, the company released a new transformer-based model, <a href=\"https://typesafe.ai/blog/introducing-system-one-models-and-jev\" target=\"_blank\" rel=\"noopener\">Jev</a>, that is not a large language model (LLM). It doesn’t output text, but instead produces probabilities, or what the company calls “calibrated decisions.”</p>\n<p>Eschewing language does a few things: It makes the model incredibly cheap and fast, and because users define the outputs in advance, it cannot hallucinate. Its output tokens are free, and input tokens are metered by the billion, not the million.</p>\n\n<p>Developers are taking a great interest in the product; the company briefly lost the ability to serve users from its API because demand was so high. Jev appears most useful for software automation. Thus far, software developers see it as a cheaper and more robust way to incorporate intelligence into their code.</p>\n<p>For example, Pranit Sharma, a software engineer at Vercel, a company making agentic infrastructure, <a href=\"https://x.com/fazxes/status/2100300097695232164/photo/1\" target=\"_blank\" rel=\"noopener\">said</a> his company had used OpenAI’s ChatGPT Luna 5.6 to run a classifier to review commands for safety. When Vercel replaced OpenAI’s Luna with Jev, it got results five to 18 times more quickly and with greater accuracy.</p>\n<p>Another developer, Bryo AI CTO Nikhil Mudholkar, <a href=\"https://x.com/nikhilmudholkar/status/2100604560335139083\" target=\"_blank\" rel=\"noopener\">tested</a> Jev against Gemini for classifying business emails. In his test, Gemini was slightly more accurate, but 10 to 20 times more expensive. More interesting to Mudholkar were Jev’s confidence scores — “it is the only one that hands back a real probability which makes it ideal for automating workflows!!”</p>\n<p>Besides replacing LLMs in certain use cases, the new model can also augment them, acting as a smart check on misbehavior. Using agents to monitor agents can quickly become expensive, but using Jev to do so, Almeida argues, makes sense. He sees users deploying Jev to track LLM agent traces and prevent jailbreaks.</p>\n<p>“At the end of the day, it delegates the hallucination problem a little bit to the user,” explained Armin Ronacher, the CTO of Earendil, which builds the open source model harness Pi. “The user has to say, okay, if this only comes back with 50% probability, maybe this is a coin toss, and I disregard it. But if it’s 95%, sure, then I can do something with it.”</p>\n<p>Another potential use for Jev is model routing, Ronacher said. Predicting whether a given workload requires a specific model would be useful, but using an LLM for the job would be expensive. Jev’s low cost and speed make that kind of real-time sorting possible.</p>\n<p>And that’s Almeida’s hope. The model is named after William Stanley Jevons, the 19th-century economist whose eponymous paradox describes how the falling cost of a commodity can lead to it being used more and more. In this case, the falling cost of intelligence should lead to its widespread deployment.</p>\n<p>“We think that there’s just going to be smart software all over the place in a way that’s emergent and distributed … much more like the early internet than you know like the mega apps that people are trying to build right now,” Almeida said.</p>\n<p>Almeida is tight-lipped about the model’s architecture, which outside observers suspect is built on top of an open-weight LLM. The company refers to Jev as a “System One model,” focused on intuition rather than reasoning, and <a href=\"https://typesafe.ai/blog/bitterest-lesson\" target=\"_blank\" rel=\"noopener\">specifically focused</a> on the right task. Almeida says Jev is trained exclusively on synthetic data using a technique he calls “reinforcement learning from calibrated decisions.”</p>\n<p>“We made an early bet that we will be making all of our data, and that has been one of the best bets I’ve ever made in my life — better than our launch, in my opinion, better than RLHF,” he told TechCrunch. “Half of [our company] is a lab that basically owns this entire subfield of statistically well-understood synthetic data, and that is now my life joy.”</p>\n<p>For now, Jev stands alone as this kind of model, but Ronacher expects that competitors will spring up now that its utility is apparent.</p>\n<p>“We should have seen this earlier in many ways, but presumably because the LLMs are so cheap and subsidized, you often don’t have to be creative yet,” he said. </p>\n<p>TypeSafe itself will be building more versions of the model, in new modalities. Asked if TypeSafe is a frontier lab, Almeida said, “the main product of frontier labs is fear or hype. I would like our main product to be intelligence…[but we are] not a lab in the sense of, you know, like bet on infinite wealth, or a religion, or building God in a data center, or whatever is the thing of today.”</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Introduction: To Keep Government Generally Within the Bounds of Law Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/","category":"law","categoryLabel":"Law","wordCount":747,"readingTime":4,"content":"<p>The current President of the United States has a relationship with the law that is casual at best and contemptuous at worst.  Whether the nation is facing a constitutional crisis has thus become a topic of debate among scholars and the public.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  The answer turns in important part on the degree to which the judiciary can help confine the emboldened Executive to constitutional limits.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  But alongside individual judges,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> the institution of judicial review (through which courts can determine whether government actions comply with the law and counteract them if not) is under attack.  Combatants include President Donald Trump,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> Administration officials,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> congressional partisans,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> and state lawmakers.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  Judges, including members of the Supreme Court, have entered the fray.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a></p>\n<p>This Symposium, titled “Judicial Review in Jeopardy?,” seeks to make sense — and suggest some ways out — of these circumstances.  To do so, this Introduction proposes, we should see judicial review through the lens of Professors Richard Fallon and Daniel Meltzer’s contention that our constitutional structure “demands a system of constitutional remedies adequate to keep government generally within the bounds of law.”<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  To realize that system, federal courts must remain willing — and recognize their authority — to both check <em>and </em>balance assertions of political power.  By this, I mean that in agenda setting and doctrinal development, courts (including the Supreme Court) ought not rest on the abstract ability of judicial review to respond to some governmental abuses.  Within methodological margins, courts should instead consider the actual extent and efficacy of constitutional remedies to confront a meaningful proportion of constitutional violations — a proportion, that is, capable of producing substantial deterrence across varied and evolving circumstances.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1734.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Adam Liptak, <em>Trump’s Actions Have Created a Constitutional Crisis, Scholars Say</em>, N.Y. Times (Feb. 12, 2025), https://www.nytimes.com/2025/02/10/us/politics/trump-constitutional-crisis.html [https://perma.cc/J3Z4-HDGB]; Sarah Bryner et al., SNF Agora Inst. at Johns Hopkins Univ. &amp; Pub. Agenda, Understanding Evolving Republican Attitudes Towards Democracy 7 (2025), https://snfagora.jhu.edu/wp-content/uploads/2025/11/Understanding-Evolving-Republican-Attitudes-Towards-Democracy.pdf [https://perma.cc/Q8SM-EBGJ].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Liptak, <em>supra</em> note 1 (explaining that “legal scholars agree” that a constitutional crisis “is generally the product of presidential defiance of laws and judicial rulings”); <em>see also</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707, 726 (2009) (stating that President Franklin Delano Roosevelt would “certainly” have “provoke[d] a public constitutional crisis” if he had openly defied the Supreme Court in particular cases).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Mattathias Schwartz &amp; Abbie VanSickle, <em>Judges Fear for Their Safety amid a Wave of Threats</em>, N.Y. Times (Mar. 21, 2025), https://www.nytimes.com/2025/03/19/us/trump-judges-threats.html [https://perma.cc/A2DD-A5Z6].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Donald J. Trump (@realDonaldTrump), Truth Social (May 26, 2025, at 07:22 ET), https://truthsocial.com/@realDonaldTrump/posts/114573871728757682 [https://perma.cc/GF7N-XS4K] (stating that “USA HATING JUDGES WHO SUFFER FROM AN IDEOLOGY THAT IS SICK, AND VERY DANGEROUS FOR OUR COUNTRY” were “ON A MISSION TO KEEP” dangerous criminals “IN OUR COUNTRY SO THEY CAN ROB, MURDER, AND RAPE AGAIN” and imploring the Supreme Court to “SAVE US FROM THE DECISIONS OF THE MONSTERS WHO WANT OUR COUNTRY TO GO TO HELL”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Newsmax, <em>Stephen Miller Highlights the “Judicial Tyranny” Being Used to Impede the Trump Administration</em>, at 00:34 (YouTube, May 23, 2025), https://www.youtube.com/watch?v=EfWB4YMJF3U [https://perma.cc/8WW7-WPZF] (Deputy Chief of Staff for Policy and Homeland Security Advisor Stephen Miller stating that “communist, Marxist judges” are conducting a “judicial coup” “against the laws, Constitution, and democracy of the United States”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Nate Raymond, <em>Republicans Seek Impeachment of 2 More Judges Who Stymied Trump</em>, Reuters (Mar. 24, 2025), https://www.reuters.com/world/us/republicans-seek-impeachment-2-more-judges-who-stymied-trump-2025-03-24 [https://perma.cc/PS97-JPVT].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Kimberly Kindy &amp; Alice Crites, <em>The Texas Abortion Ban Created a “Vigilante” Loophole. Both Parties Are Rushing to Take Advantage.</em>, Wash. Post (Feb. 22, 2022), https://www.washingtonpost.com/politics/2022/02/22/texas-abortion-law-vigilante-loophole-supreme-court [https://perma.cc/JN6B-PM6K] (describing state legislation attempting to shield government officials from constitutional litigation).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Abbie VanSickle, <em>Courts Must “Check the Excesses” of Congress and the President, Roberts Says</em>, N.Y. Times (May 7, 2025), https://www.nytimes.com/2025/05/07/us/politics/supreme-court-roberts-judicial-independence.html [https://perma.cc/WVC4-LRSP] (discussing “rare public remarks” by Chief Justice Roberts and noting Justice Jackson’s “critici[sm of] what she called ‘relentless attacks’ on judges” (quoting Justice Jackson)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Fallon, Jr., &amp; Daniel J. Meltzer, <em>New Law, Non-Retroactivity, and Constitutional Remedies</em>, 104 Harv. L. Rev. 1731, 1778–79 (1991).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"Industry vets behind Dishonored, Ultima Online, Her Story and more agree the games industry crisis goes beyond games: 'Ultimately, to fix what’s broken in the videogame industry, we might have to fix reality'","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/gaming-industry/industry-vets-behind-dishonored-ultima-online-her-story-and-more-agree-the-games-industry-crisis-goes-beyond-games-ultimately-to-fix-whats-broken-in-the-videogame-industry-we-might-have-to-fix-reality/","category":"gaming","categoryLabel":"Gaming","wordCount":793,"readingTime":4,"content":"<p>It's generally agreed that this is a <a href=\"https://www.pcgamer.com/gaming-industry/foolproof-ways-to-get-laid-off-in-the-videogame-industry/\" target=\"_blank\" rel=\"noopener\">very bad time for the videogame industry</a>. There's some disagreement on just how bad it is—Tim Cain says it's <a href=\"https://www.pcgamer.com/gaming-industry/fallout-lead-tim-cain-argues-games-industry-crisis-hasnt-reached-the-level-of-the-1983-crash-i-dont-think-theres-ever-been-a-worse-time-in-the-games-industry/\" target=\"_blank\" rel=\"noopener\">not as bad</a> as the infamous crash of the early 1980s, Brenda Romero says <a href=\"https://www.pcgamer.com/gaming-industry/the-industrys-in-a-really-horrible-place-brenda-romero-says-we-were-there-in-the-80s-for-the-crash-and-this-is-definitely-crashier/\" target=\"_blank\" rel=\"noopener\">it's worse</a>—but the bottom line is that if you're comparing your current situation to that very specific moment in time, the situation is definitely not good.</p><p>In a new <a href=\"https://knowledge.edge-online.com/p/the-game-industry-is-broken-can-we-fix-it-tim-sweeney-edge-crash\" target=\"_blank\" rel=\"noopener\">Knowledge newsletter</a>, originally published in Edge magazine, numerous veterans of the game biz shared their thoughts on the industry's troubles, and what might be done to address them. It's a very interesting discussion, but also a bit disheartening to some extent, because several make the point that the real problem goes way beyond just videogames.</p><p>\"It's impossible for me to look at this as a game industry problem, when really it’s the result of this much bigger, complex system that we’ve allowed to be captured by greedy, rapacious forces,\" former Arkane Studios creative director Harvey Smith said.</p><p>Pointing to Redfall, the game that preceded the <a href=\"https://www.pcgamer.com/gaming-industry/microsoft-announces-4-studio-closuresincluding-arkane-austin-and-tango-gameworks-creators-of-prey-and-hi-fi-rush-respectively/\" target=\"_blank\" rel=\"noopener\">closure of Arkane Austin</a> in 2024, Smith continued, \"Instead of just being crushed and thrown to the wind, maybe those people would have figured it out and then, another cycle along, they would have had another Dishonored.</p><p>\"And, even if they just made the occasional hit—one out of every three or whatever—wouldn’t you want to hold onto that? I guess the answer is no. You wouldn’t want to do that, if there’s an opportunity cost where instead you could put that money into AI, and even if it’s a bubble, your share price goes up massively.\"</p><p>Other developers shared similar thoughts. \"I don’t think our current financial models are set up for art or entertainment,\" Kitfox Games co-founder Tanya X. Short said. \"I just don’t think art is what capitalism is designed to nurture. But humans <em>are</em>.\"</p><p>Ultima Online and Star Wars: Galaxies vet Raph Koster, whose Playable Words studio recently launched a new MMO called <a href=\"https://www.pcgamer.com/games/mmo/swg-leads-new-mmo-stars-reach-almost-lost-me-until-i-met-an-animal-conservationist-mayor/\" target=\"_blank\" rel=\"noopener\">Stars Reach</a>, said \"systemic dynamics are what really make this happen,\" and that \"absent regulation, it develops into market concentration, followed by cartels, followed by monopolies. That’s intrinsic in how it works.\"</p><p>From the creators of Edge: A free weekly videogame industry newsletter, featuring in-depth news, expert analysis and exclusive interviews</p><p>Sam Barlow, known for games including Her Story, Telling Lies, and Immorality, put the situation in even starker terms: \"Ultimately, to fix what’s broken in the videogame industry, we might have to fix reality.\"</p><p>It's a depressing thought alright, particularly given humanity's seeming drive to do the opposite of 'fixing things,' but it's hard to dispute the point when the mainstream videogame industry is busy swallowing itself via <a href=\"https://www.pcgamer.com/gaming-industry/eas-usd55-billion-acquisition-is-the-biggest-leveraged-buyout-in-private-equity-history-heres-why-it-has-everyone-terrified/\" target=\"_blank\" rel=\"noopener\">multi-billion-dollar mergers and acquisitions</a> that seem to inevitably lead to <a href=\"https://www.pcgamer.com/gaming-industry/the-grim-industry-summer-continues-as-ea-lays-off-staff-ahead-of-usd55-billion-sale-to-saudi-arabia-likely-to-soothe-the-sting-of-its-usd20-billion-debt/\" target=\"_blank\" rel=\"noopener\">massive layoffs</a> and increasingly <a href=\"https://www.pcgamer.com/gaming-industry/5-promising-games-recently-cancelled-by-microsoft/\" target=\"_blank\" rel=\"noopener\">constricted creative decisions</a>. Earlier this year, Devolver Digital, which went public in 2021, announced its intent to <a href=\"https://www.pcgamer.com/gaming-industry/devolver-digital-wants-to-get-off-the-stock-market-because-the-ongoing-challenge-of-delivering-growth-in-line-with-market-expectations-just-isnt-worth-the-headaches/\" target=\"_blank\" rel=\"noopener\">get off the stock market</a> because the videogame business is simply not compatible with the market's demands for \"predictable, sequential growth\"—a stark admission that the system as it stands just isn't working.</p><p>Despite the gloominess of the situation, Smith said he's \"an optimist,\" and he believes that \"people will keep coming together and keep making cool things.\"</p><p>\"The model might be different, the structure of it all might be different, but I’m hopeful there’ll always be a market for that, as long as people are brilliant and creative, and they want to do good work,\" he said. \"That’s what gives me hope. As long as I see that, I’m like, we’re going to come out okay in the end. It may suck for a while, we may have to depose some kings, but it’ll be okay.\"</p><p>The full report covers a lot of ground, and features commentary from other industry veterans including Shawn Layden, Tim Sweeney, Craig Duncan, and Amir Satvat, who was honored at The Game Awards in 2024 for his work <a href=\"https://www.pcgamer.com/gaming-industry/amir-satvat-game-awards-comments/\" target=\"_blank\" rel=\"noopener\">assisting laid-off game developers</a>. It's worth a few minutes to read in full—check it out at <a href=\"https://knowledge.edge-online.com/p/the-game-industry-is-broken-can-we-fix-it-tim-sweeney-edge-crash\" target=\"_blank\" rel=\"noopener\">edge-online.com</a>.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"}];
