<script>
var articles = [{"title":"Why Do Male Chimpanzees Throw Rocks at the Same Trees for More Than a Decade? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/why-do-male-chimpanzees-throw-rocks-at-the-same-trees-for-more-than-a-decade-1284704/","category":"fun","categoryLabel":"Interesting Reads","wordCount":928,"readingTime":5,"content":"<p>Walking through the savanna-woodland landscape of Boé National Park, Guinea-Bissau, you might encounter a tree covered in gnarled scars, with an accumulation of rocks surrounding its base.</p><p>Featured Video</p><p>The chimpanzees may have left the area, but you are lucky nonetheless, because you have stumbled upon evidence of a rare—and potentially cultural—chimpanzee behavior: accumulative stone throwing.</p><p>Video recordings show wild western chimpanzees, usually adult males, throwing rocks at specific trees and <a href=\"https://doi.org/10.1038/srep22219\" target=\"_blank\" rel=\"noopener\">repeatedly returning to these trees to perform the behavior</a>.</p><p>While throwing, the chimpanzees pant hoot—a loud, <a href=\"https://doi.org/10.1002/ajp.1350270402\" target=\"_blank\" rel=\"noopener\">long-distance communicative signal</a>—and sometimes <a href=\"https://www.youtube.com/watch?v=w-aXclk0fs8\" target=\"_blank\" rel=\"noopener\">repeatedly hit their hands and feet</a> on the tree in a behavior called <a href=\"https://doi.org/10.1016/j.anbehav.2022.07.013\" target=\"_blank\" rel=\"noopener\">buttress drumming</a>.</p><p>We have just returned from a field site in Guinea-Bissau where we collected data to help us investigate the social and ecological context of accumulative stone throwing to determine what these chimpanzees are trying to communicate.</p><p>Given our <a href=\"https://doi.org/10.1073/pnas.1211740109\" target=\"_blank\" rel=\"noopener\">evolutionary relatedness to chimpanzees</a>, we <a href=\"https://dspace.library.uvic.ca/server/api/core/bitstreams/99f96482-e720-4b64-822e-4b0ee10bec76/content\" target=\"_blank\" rel=\"noopener\">hope accumulative stone throwing can help us understand the emergence of complex communication and stone tool use</a> over the course of human evolution.</p><p><strong>A Cultural Behavior</strong></p><p>Pant hooting and buttress drumming are both part of the male chimpanzee display, suggesting that accumulative stone throwing might represent a modification of this common behavior. It <a href=\"https://doi.org/10.1038/srep22219\" target=\"_blank\" rel=\"noopener\">is likely a cultural behavior</a> due to its limited distribution, and because the availability of rocks and trees does not guarantee the presence of an accumulative stone throwing site.</p><p>Previous research suggests that accumulative stone throwing is likely <a href=\"https://doi.org/10.1098/rsbl.2019.0747\" target=\"_blank\" rel=\"noopener\">communicative</a> or may even have a symbolic purpose, with sites marking important locations within the chimpanzees’ territory.</p><p>However, we still don’t know what accumulative stone throwing sites might mean to the chimpanzees themselves nor why they do it. While some primates use stone tools to access food, for instance <a href=\"https://doi.org/10.1007/BF02373433\" target=\"_blank\" rel=\"noopener\">to crack open nuts</a>, accumulative stone throwing is a rare example of stone tool use in a social context. It has been observed in only four chimpanzee groups in West Africa to date.</p><p><strong>Setting Up Camp</strong></p><p>We travelled to the remote Boé chimpanzee territory in Guinea-Bissau and based ourselves in Béli, a small village where, in collaboration with local people, <a href=\"https://www.chimbo.org/\" target=\"_blank\" rel=\"noopener\">the Dutch non-governmental organization Chimbo</a> maintains a compound. Visiting researchers and tourists can stay here and use a workspace with solar-generated electricity.</p><p>From Béli, we cycled and hiked 22 kilometres into the savanna-woodland to establish a bush camp with our two field assistants, Djei Baldé and Balu Séra, and a master’s student from the <a href=\"https://www.ammiekkalan.com/team\" target=\"_blank\" rel=\"noopener\">Great Ape Behaviour Lab</a>, Taylor Tippett.</p><p>The Boé chimpanzees performing the behavior are unhabituated; they are not used to humans, meaning that we cannot observe individual chimpanzees on foot because they will run away. Instead, we collected behavioral data using camera traps and recording devices.</p><p>We set up two video cameras at each accumulative stone throwing site and placed the recording devices strategically to capture audio data from the areas around these sites.</p><p>Our campsite bordered the Fefine, a large river that flows even in the dry season. In a landscape like the savanna-woodland where water sources are scarce, rivers like the Fefine are important for wildlife and humans alike. We captured several of our neighbors on cameras set up near the riverbank.</p><p><strong>Chimpanzee Nests</strong></p><p>On an average day, we woke up around 6:30 a.m. and ate a small breakfast before heading to a set of two to five sites. There, we replaced the SD cards and batteries on the cameras, made sure the devices were working well and collected any additional data needed, including measurements of the tree and 3D scans of rocks thrown at the tree for later analysis.</p><p>Along the way, we recorded observations of chimpanzee nests, feeding signs, vocalizations and sightings.</p><p>The video and audio data we collected will allow us to investigate the social traits of accumulative stone throwing, including the age and sex of the stone thrower and the audience (other chimpanzees nearby who might react to the throw). This information can help us determine what chimpanzees are trying to communicate.</p><p>We found that most of the sites first identified by the <a href=\"https://panafrican.eva.mpg.de/index.php\" target=\"_blank\" rel=\"noopener\">Pan African Programme</a>, and revisited by our team in 2017, were still in use during our recent trip to the field, meaning that chimpanzees can use these sites for over a decade.</p><p><strong>The Threat of Bauxite Mining</strong></p><p>As many primate species face threats from human activities, cultural behaviors and the maintenance of rich cultural repertoires can help them <a href=\"https://doi.org/10.1016/j.tree.2015.02.002\" target=\"_blank\" rel=\"noopener\">adapt to environmental changes</a> and <a href=\"https://doi.org/10.1111/conl.12860\" target=\"_blank\" rel=\"noopener\">provide support for conservation</a>.</p><p>On top of its potential communicative importance and intrinsic value as a cultural behavior, accumulative stone throwing involves durable primate material culture, the loss of which would constitute the <a href=\"https://doi.org/10.1126/science.adj3716\" target=\"_blank\" rel=\"noopener\">erasure of primate heritage</a>.</p><p>Unfortunately, chimpanzee habitat in Guinea-Bissau is threatened by extractive industries, particularly <a href=\"https://doi.org/10.2305/IUCN.CH.2020.SSC-RAP.2.en\" target=\"_blank\" rel=\"noopener\">industrial mining</a>. While in the field, we encountered bore holes from bauxite mining exploration.</p><p>Bauxite mining represents a significant opportunity for <a href=\"https://chimbo.org/wp-content/uploads/2015/06/Bauxite-Mining-and-Chimpanzees-Population-Distribution-J.-Francisco-2014.pdf.\" target=\"_blank\" rel=\"noopener\">economic growth and development</a> in Guinea-Bissau. It can also cause habitat destruction and pollution with severe detrimental effects for chimpanzees, other wildlife and the local people—as it already has in neighbouring Guinea.</p><p>Environmental oversight and regulations are much needed, especially given the added challenges of <a href=\"https://www.france24.com/en/video/20251127-guinea-bissau-five-decades-of-coups-crises-and-cartel-influence\" target=\"_blank\" rel=\"noopener\">unstable governance in Guinea-Bissau</a>.</p><p>By studying and bringing attention to chimpanzee cultural behaviors like accumulative stone throwing, we hope to support <a href=\"https://doi.org/10.7717/peerj.4847\" target=\"_blank\" rel=\"noopener\">chimpanzee conservation</a> and the <a href=\"https://doi.org/10.1007/s10329-023-01080-x\" target=\"_blank\" rel=\"noopener\">maintenance of biodiversity more broadly</a>, as well as the preservation of primate cultural materials for future research and education. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/im-part-of-the-team-writing-the-next-bible-of-psychiatry-for-the-first-time-the-dsm-will-use-biology-to-understand-mental-disorders-288064\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/why-do-male-chimpanzees-throw-rocks-at-the-same-trees-for-more-than-a-decade-we-travelled-to-remote-guinea-bissau-to-find-out-279187\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Edwin Butter / Adobe Stock</em></p>"},{"title":"Google spared from ad-business breakup, but judge orders changes to how it operates","source":"TechCrunch","author":"Lucas Ropek","url":"https://techcrunch.com/2026/09/02/google-spared-from-ad-business-breakup-but-judge-orders-changes-to-how-it-operates/","category":"tech","categoryLabel":"Technology","wordCount":554,"readingTime":3,"content":"<p>The Justice Department has spent years attempting to break up Google’s gargantuan advertising business across two separate antitrust lawsuits: one filed in 2020 focused on Google’s dominance in search, and a second filed in 2023 that specifically targeted Google’s ad-technology business. Both cases argued that the search giant’s grip on the digital ad economy represents an illegal monopoly.</p>\n<p>Courts have largely sided with the government in both cases. In 2024, a court determined that Google’s search business, including its exceedingly lucrative search-ad operation, was an illegal monopoly, <a href=\"https://files.lbr.cloud/public/2024-08/045110819896.pdf?VersionId=mHMw8uSvPbFCwl.7.yAY8wRXM0.UCmrD#page=8\" target=\"_blank\" rel=\"noopener\">claiming that</a> the tech giant had “exercised its monopoly power” to dominate the search industry and search ads. Last April, <a href=\"https://www.justice.gov/opa/pr/department-justice-prevails-landmark-antitrust-case-against-google\" target=\"_blank\" rel=\"noopener\">a second court case</a> — this one focused specifically on Google’s ad-tech business — also came to the same conclusion.</p>\n<p>Following the 2024 ruling, Justice Department officials suggested a variety of ways Google’s search business could be broken up, including divesting its Chrome browser and Android operating system. But in September 2025, the judge overseeing that case, Amit Mehta, rejected those divestiture requests, ruling that Google could keep both Chrome and Android. He did order the company to end exclusive default-placement deals and share certain search data with competitors (remedies that Google is currently appealing).</p>\n<p>That same pattern held this week. In <a href=\"https://www.nytimes.com/2026/09/02/technology/google-ad-tech-remedies.html\" target=\"_blank\" rel=\"noopener\">a ruling handed down</a> on Wednesday, federal judge Leonie M. Brinkema of the Eastern District of Virginia, who oversaw the ad-tech case, said that Google would be able to keep its advertising business. Instead of selling it, the search giant will instead be required to adjust its business practices to favor competitors, Brinkema said. The New York Times notes that the judge’s ruling “did not provide specifics” as to how Google should go about doing that.</p>\n<p>Brinkema’s full written ruling will remain under seal for 14 days to allow those involved to issue necessary redactions. Her finding that Google had acted illegally in maintaining its ad-tech business dates back to April of last year; this week’s decision addressed only the remedy.</p>\n<p>Unsurprisingly, Google framed the outcome as a win. Lee-Anne Mulholland, Google’s vice president for regulatory affairs, told TechCrunch: “We’re very pleased the Court rejected the DOJ’s proposal to break apart tools that help small businesses reach new customers and grow.”</p>\n<p>The online advertising ecosystem is notoriously opaque and byzantine and, for most people unfamiliar with its complexities, difficult to grasp. Much of the government’s ad-tech case against Google revolved around the company’s tactics to ensure that its search engine was the default engine in devices across the world, which in turn helped its ad business dominate as well.</p>\n<p>To do this, Google <a href=\"https://www.purduegloballawschool.edu/blog/news/google-landmark-case\" target=\"_blank\" rel=\"noopener\">used exclusive agreements</a> with device manufacturers, which made it the default search engine across huge swaths of the mobile phone market, the government has argued. Google also entered into revenue sharing agreements with mobile carriers — deals where carriers earned a cut of ad revenue in exchange for keeping Google as the default — that further cemented its position as the de facto search engine across phone markets.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t<p>\n\t\tLucas is a senior writer at TechCrunch, where he covers artificial intelligence, consumer tech, and startups. He previously covered AI and cybersecurity at Gizmodo. \nYou can contact Lucas by emailing lucas.ropek@techcrunch.com.\t</p>\n\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/lucas-ropek/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Trump administration asks justices to consider key border policy","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/08/trump-administration-asks-justices-to-consider-key-border-policy/","category":"law","categoryLabel":"Law","wordCount":756,"readingTime":4,"content":"<p>The Trump administration on Monday <a href=\"https://www.supremecourt.gov/DocketPDF/26/26-239/419860/20260824104858426_Mullin_v_RAICES_petition_final.pdf\" target=\"_blank\" rel=\"noopener\">asked the Supreme Court to review</a> a ruling by a federal appeals court in Washington, D.C., that bars the federal government from removing immigrants who crossed the U.S.-Mexico border illegally without giving them a chance to seek asylum. U.S. Solicitor General D. John Sauer told the justices that the decision by the U.S. Court of Appeals for the District of Columbia Circuit “threatens to dismantle” what Department of Homeland Security Secretary Markwayne Mullin “describes as an ‘indispensable’ tool for controlling the border.”</p><p>The dispute centers on <a href=\"https://www.presidency.ucsb.edu/documents/proclamation-10888-guaranteeing-the-states-protection-against-invasion\" target=\"_blank\" rel=\"noopener\">a proclamation</a> that President Donald Trump issued shortly after his inauguration for a second term. The proclamation indicates that because “[t]he sheer number” of noncitizens “entering the United States has overwhelmed the system” and “prevents the Federal Government from obtaining operational control of the border,” “the current situation at the southern border qualifies as an invasion.” The proclamation instructs immigration officials to quickly remove immigrants who cross the border illegally without providing them with the process or protections to which they would normally be entitled – including the right to seek asylum.</p><p>A group of immigrants and three immigrants’ rights groups went to federal court, where they argued that the proclamation (as well as guidance issued to implement it) violate federal immigration law.</p><p>In <a href=\"https://immigrantjustice.org/wp-content/uploads/2025/07/ORDER-RAICES-v-Noem_2025-07-02.pdf\" target=\"_blank\" rel=\"noopener\">a 128-page opinion</a>, U.S. District Judge Randolph Moss blocked the Trump administration from imposing the restrictions on removal and asylum. He “recognize[d] that the Executive Branch faces enormous challenges in preventing and deterring unlawful entry into the United States and in adjudicating the overwhelming backlog of asylum claims of those who have entered the country.” But neither the Constitution nor federal immigration law, Moss ruled, allow the president “to adopt an alternative immigration system.”</p><p>On April 24, <a href=\"https://cdn.sanity.io/files/pito4za5/production/d3981b1bc0c39906d901d884990a7ee115a0d197.pdf#page=44\" target=\"_blank\" rel=\"noopener\">the D.C. Circuit upheld</a> Moss’ ruling. Judge J. Michelle Childs explained that the “text, structure, and history” of federal immigration law “make clear that,” although Congress may have given the president the power to temporarily block immigrants without proper documentation from entering the country, it did not give Trump the “expansive removal authority” that he claims in the proclamation. Both the proclamation and the agency guidance, Chiles concluded, therefore violate federal law insofar as they bypass the normal deportation process “and cast aside federal laws affording individuals the right to apply and be considered for asylum or withholding of removal,” which is a more limited form of protection from deportation than asylum.</p><p>Sauer told the court on Monday that before the president’s proclamation went into effect, the U.S.-Mexico border “had become overwhelmed by an ungovernable influx of millions of aliens, creating chaotic conditions that criminal and terrorist organizations exploited to threaten our national security.” The restrictions imposed in the proclamation, Sauer said, have been “[t]he most important and effective pieces of the President’s response” to that influx. Although the D.C. Circuit’s decision is currently on hold, allowing the government to maintain the asylum restrictions, Sauer warned that “all of the progress” that the government has made “risks evaporating if the ruling below is allowed to take effect.”</p><p>Sauer pointed to the Supreme Court’s 2018 decision in <a href=\"https://www.law.cornell.edu/supct/pdf/17-965.pdf\" target=\"_blank\" rel=\"noopener\"><em>Trump v. Hawaii</em></a>, in which the justices upheld the Trump administration’s “travel ban,” a 2017 executive order that restricted immigration to the United States by citizens of eight countries, most (but not all) of which are predominantly Muslim. In that case, Sauer emphasized, the justices agreed “to review a lower-court decision curtailing the President’s power to control the flow of aliens into the country. The same result is warranted here.” Indeed, Sauer added, “[t]his case is even more important” than the travel ban case.</p><p>The Supreme Court should also step in, Sauer continued, because the lower courts allowed the case to move forward as a class action that would, if the challengers prevail, benefit “an astoundingly broad class” of plaintiffs, including noncitizens “who are currently overseas and have no imminent plans to enter the United States (much less enter illegally).” By approving an “effectively universal class” of plaintiffs, Sauer argued, the lower courts made “a transparent end-run around” last year’s ruling in <a href=\"https://www.scotusblog.com/cases/trump-v-casa/\" target=\"_blank\" rel=\"noopener\"><em>Trump v. CASA</em></a>, in which the Supreme Court held that federal courts do not have the power to issue so-called “universal” or “nationwide” injunctions, which prohibit the government from enforcing a law or policy anywhere in the country.</p><p>The challengers’ response to the government’s petition for review is due on Sept. 23.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Trump administration asks justices to consider key border policy</em>, SCOTUSblog (Aug. 25, 2026, 3:39 PM), https://www.scotusblog.com/2026/08/trump-administration-asks-justices-to-consider-key-border-policy/</p>"},{"title":"Active development on League of Legends fighting game spinoff 2XKO will be coming to an end at the end of the year","source":"Rock Paper Shotgun","author":"Oisin Kuhnke","url":"https://www.rockpapershotgun.com/active-development-on-league-of-legends-fighting-game-spinoff-2xko-will-be-coming-to-an-end-at-the-end-of-the-year","category":"gaming","categoryLabel":"Gaming","wordCount":559,"readingTime":3,"content":"<p>The game will remain playable, say Riot</p>\n    \n  \n  \n  \n  \n            <p>\r\nRiot Games' fighting game take on the world of <a href=\"https://www.rockpapershotgun.com/games/league-of-legends\" target=\"_blank\" rel=\"noopener\">League of Legends</a>, <a href=\"https://www.rockpapershotgun.com/games/project-l\" target=\"_blank\" rel=\"noopener\">2XKO</a>, is winding down development. The developer shared word today that active development on the game is ending December this year, citing a lack of a strong enough adoption and retention rate for the <a href=\"https://www.rockpapershotgun.com/best-fighting-games\" target=\"_blank\" rel=\"noopener\">fighting game</a>.\r\n</p>\n<p>\r\nAs the studio explained in a <a href=\"https://www.riotgames.com/en/news/2xko-active-development-ends-december-2026\" target=\"_blank\" rel=\"noopener\">blog post</a>, servers will stay live beyond 2026, though how long that is isn't clear just yet, and that the game will remain playable on all platforms (it does have an offline mode, meaning even if and when the servers go down there shouldn't be too much of a concern for local play). Up until now, you had to unlock champs for use in online play, but the entire roster will be available to choose from now.\r\n</p>\n<p>\r\nThose of you that have spent money in the game also won't need to start typing out an angry comment about how much you've wasted, as anything purchased before August 20th (today) will be refunded, and you get to keep everything you bought too. From the game's next patch, coming September 8th, you'll be able to play as Lux, a \"shoto-inspired character with a simple kit, who harnesses the power of light to illuminate her enemies.\"\r\n</p>\n<p>\r\nA new bundle is being also being added alongside this patch that'll set you back $40/£33.99 which includes all skins, skin chromas, and taunts for every champion, and things like avatar items, certain base champion chromas, and stages will be unlockable with credits, a currency you can earn in-game. Ranked mode is being removed \"to ensure that we can matchmake within a single pool of players per server,\" but casual lobbies will still be matchmade by skill. The October patch, the final major patch, will then add in Samira, the Desert Rose, a \"bounty hunter who fights with bombastic flair, switching between her sword and dual pistols for maximum style.\"\r\n</p><p>\r\nExplaining the decision in the blog post, the team said that while they saw a committed community \"fully embrace\" the game in many ways, \"it just wasn’t happening enough. Even within the genre, diehard tag fighter players loved 2XKO, but most other fighting game players struggled to find reasons to stick with the game.\" \r\n</p>\n<p>\r\nThe post continues to explain that even during some of the highlight moments, they saw \"no meaningful, sustained change in 2XKO’s trajectory; only a fraction of what it would take to trend toward sustainability. Over time it became clear it would be impossible for us to continue actively developing the game as we are today… To be super clear: we would have continued active development if we saw any viable future, but 2XKO costs us substantially more to operate than it brings in, and engagement has stayed relatively flat despite our larger updates.\"\r\n</p>\n<p>\r\nThis unfortunately isn't much of a surprise. Fighting games can often be more of a niche than some might think, in no small part because the high skill floor can be incredibly off-putting for those not familiar with the genre. But also, <a href=\"https://www.rockpapershotgun.com/riot-reportedly-lay-off-around-80-devs-on-league-of-legends-spin-off-fighter-2xko-less-than-a-month-after-launch\" target=\"_blank\" rel=\"noopener\">about 80 devs were laid off only a month after launch</a>. Any which way you look at it, that does not display confidence in the ability to grow an audience.\r\n</p>\n<p>\r\nSolidarity with any devs that may be affected by this decision.\n</p>"}];
