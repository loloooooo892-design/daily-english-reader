    --bg: #191C22;

    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;

    --swap-bg-hover: #2F3543;
  }

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;

  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Stop Killing Games join lawsuit against the PlayStation Store's \"Sony Tax,\" in latest venture beyond game preservation","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/stop-killing-games-join-lawsuit-against-the-playstation-stores-sony-tax-in-latest-venture-beyond-game-preservation","category":"gaming","categoryLabel":"Gaming","wordCount":507,"readingTime":3,"content":"<p>PC stores may wish to pay attention</p>\n    \n  \n  \n  \n  \n            <p>\"It’s time to sue Sony,\" game preservation advocates <a href=\"https://www.rockpapershotgun.com/topics/stop-killing-games\" target=\"_blank\" rel=\"noopener\">Stop Killing Games</a> have declared, as the group throws its weight behind a Dutch lawsuit targeting the PlayStation Store’s alleged monopoly and \"Sony Tax\" on digital games.</p>\n<p>While the case originated back in 2024, as part of an effort by Dutch consumer group <a href=\"https://www.massaschadeconsument.nl/collectieve-acties/playstation/\" target=\"_blank\" rel=\"noopener\">Stichting Massaschade &amp; Consument</a>, the core complaint – that Sony wields monopoly power by only making digital PlayStation games available through its own store – has been compounded by the recent reveal that <a href=\"https://www.rockpapershotgun.com/now-is-the-winter-of-your-discontent-console-blaggards-the-rps-team-reflect-on-playstation-going-digital-only\" target=\"_blank\" rel=\"noopener\">Sony plans to ditch physical games entirely in 2028</a>, effectively cutting out its only source of competition. <em>Allegedly</em>. For Stop Killing Games, it’s also the latest in a string of non-preservation-specific causes the organisation have amplified, possibly indicating a widened advocacy mandate after <a href=\"https://www.rockpapershotgun.com/the-european-commission-will-not-legislate-stop-killing-games-but-the-campaign-isnt-dead-yet-say-its-organisers\" target=\"_blank\" rel=\"noopener\">failing its key goal</a> of securing new European Commission legislation to keep discontinued games playable offline.</p>\n \n<p>Both Stop Killing Games and fellow preservation activists Does It Play? <a href=\"https://bsky.app/profile/doesitplay.org/post/3msqh2hq4ks25\" target=\"_blank\" rel=\"noopener\">reposted</a> a video by SM&amp;C (above), arguing that Sony charging higher prices on the PlayStation Store than what the same games cost at physical retail constitutes an illegal act of moneygrubbing, and demanding that consumers in the Netherlands  who paid those higher prices be refunded the excess.</p>\n<p>I know that I know little enough about EU law to make a guess at this lawsuit’s chances, though I wouldn’t be surprised if the owners of digital PC stores are keeping an eye on how it plays out. Could Epic be sued if one of their Epic Store exclusives looks pricier than it should? Will Valve get sued because you can only buy a new <a href=\"https://www.rockpapershotgun.com/topics/steam-machine\" target=\"_blank\" rel=\"noopener\">Steam Machine</a> or <a href=\"https://www.rockpapershotgun.com/topics/steam-deck\" target=\"_blank\" rel=\"noopener\">Steam Deck OLED</a> or <a href=\"https://www.rockpapershotgun.com/games/half-life-alyx\" target=\"_blank\" rel=\"noopener\">Half-Life: Alyx</a> through Steam? Actually, daft question. <a href=\"https://www.rockpapershotgun.com/that-lawsuit-against-steams-30-cut-of-game-sales-is-now-a-class-action-meaning-many-other-developers-could-benefit\" target=\"_blank\" rel=\"noopener\">Valve already get sued</a>.</p><p>Either way, this is another instance – following their work opposing the UK’s proposed VPN ban and <a href=\"https://www.rockpapershotgun.com/the-uks-dramatic-under-16-social-media-ban-will-also-apply-to-gaming-services-but-at-least-theyre-not-coming-for-multiplayer\" target=\"_blank\" rel=\"noopener\">social media age verification plans</a> – of Stop Killing Games spreading their attention beyond game preservation and ownership rights, and further into general consumer advocacy. Indeed, the lawsuit doesn’t appear to take issue with the availability and long-term accessibility of PlayStation Store games nearly as much as it does with effect on pricing, specifically.</p>\n<p>The cynical view would be that Stop Killing Games are in need of a new raison d'être after that major European Commission setback, as well as the <a href=\"https://www.rockpapershotgun.com/we-were-only-three-votes-away-stop-killing-games-backed-california-bill-to-keep-online-games-playable-fails-to-win-over-senate-committee\" target=\"_blank\" rel=\"noopener\">failure of an SKG-backed US bill</a> – which would require game publishers to provide either refunds or an \"alternate,\" playable version for shut-down games – to clear the Californian state senate. It might also also be an incorrect one, as the group immediately vowed to continue seeking amendments to the European Commission’s Digital Fairness Act. The Stop Killing Games Xitter account also <a href=\"https://x.com/StopKilingGames/status/2086525576026652911\" target=\"_blank\" rel=\"noopener\">criticised</a> Take-Two CEO Strauss Zelnick’s comments on<a href=\"https://www.rockpapershotgun.com/machines-that-werent-game-machines-before-will-become-game-machines-take-two-ceo-predicts-that-streaming-will-help-fix-the-industrys-hardware-pricing-problem\" target=\"_blank\" rel=\"noopener\"> game streaming providing an alternative</a> to <a href=\"https://www.rockpapershotgun.com/the-three-biggest-ram-makers-have-already-sold-all-their-2027-output-report-says-potentially-stretching-price-woes-into-2028\" target=\"_blank\" rel=\"noopener\">high PC and component prices</a>, noting how streaming involves the player owning neither their games nor the hardware they run on. Its original causes are still there, just huddled with other consumer concerns under a wider umbrella.</p>"},{"title":"Rachel Bell, Curator of High Art","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/rachel-bell-curator-of-high-art","category":"fun","categoryLabel":"Interesting Reads","wordCount":746,"readingTime":4,"content":"<p>“Show, don’t tell” is an old adage about writing. Could the same advice apply when it comes to marketing cannabis? “You cannot post weed on Instagram,” Rachel Bell, the content director of Gotham, a New York purveyor of marijuana products, said the other day. She was standing in the rotunda of the Guggenheim, wearing a gray skirt and a green T-shirt. “Even if it’s legal in your state, Meta doesn’t care—they’re gonna take it down.”</p><p>Major buzzkill. But what about documenting the buzz itself? That turns out to be a gray area that can elude the algorithm, as Bell found when she hit a vape and visited the 2023 Frieze Art Fair with a cameraman. “I’m stoned,” she says in a video from the expedition, ambling past a Rothko-esque canvas. “All right, that’s gorge. <em>Loving</em> that.” A trip to the American Museum of Natural History, enhanced by a ten-milligram “cheer” gummy, followed. “Sorry, guys, you’re dead,” Bell says in front of a pair of taxidermy antelopes. “Owls are freaky-deaky creatures,” she observes at another vitrine.</p><p>Views of the series—titled “Hi, I’m High”—accrued, reaching more than a million for Bell’s trip to the New York Botanical Garden. (“That one’s called Miracle on the Hudson,” she says, reading the label on a rosebush. “Like the guy who landed the plane?”) So did visitors to Gotham’s four stores.</p><p>Joanne Wilson, Gotham’s founder, is pleased with the results. “Rachel is so charming and likable that just seeing her experience and be curious about the world under the influence makes you want to get involved,” she said.</p><p>Shooting the videos is not always a cinch. “The past two episodes, we were told to stop filming—which is, like, my worst fear,” Bell said. “It’s hard to pivot when you’re not sober.” On the way to the Guggenheim, she’d drunk a can of THC-infused lemonade; her cameraman, Gianluca Randazzo, abstained. “I’m, like, the designated driver,” he said.</p><p>She walked up to the ticket counter and put down her credit card. Declined. “Ugh. O.K., let’s try the other one,” she said, fishing through her wallet. “Somebody didn’t do her expense report on time.”</p><p>Once inside, Bell and Randazzo took the elevator to the top. “This is a good spot to talk about what you’ve consumed,” Randazzo said.</p><p>“On the ledge here?” Bell asked. She leaned over. “Jesus, that will make you feel vertiginous!” She paused, hearing the pitter-patter of little feet approaching. “One of our biggest obstacles,” she said. “Kids can’t be in cannabis content.”</p><p>“It was a nightmare at the A.K.C. dog show,” Randazzo said. “So many children.”</p><p>Bell was ready to start exploring. “Is that art or a couch?” she asked, considering a row of gray cushions. “I see butt prints.” She wandered ahead and found some more. “Confirmed that those are, in fact, couches, not art, because why would there be more than one?”</p><p>They passed a long black cylinder (“Foam roller,” Bell said. A glyph by Carol Bove) and a chain-link net (“Netting,” also Bove). “I heard, like, fifty-eight per cent of people who come here come for the building, not the art,” she said.</p><p>They stopped at an assemblage of driftwood, seashells, and peacock feathers, titled “The Foamy Saliva of a Horse,” another Bove. “I don’t want to sound ungrateful,” Bell said, “but I’d like to see some paintings. Is there more to the museum than just the roundy part?” She stumbled across some pictures in gilt frames. “Oh, hell yeah,” she said. “Modigliani, let’s go.” She read aloud the label below a Pierre Bonnard painting of a woman at a table: “ ‘The painter’s oft-depicted wife.’ That’s what I like to see. Your wife <em>should</em> be depicted.”</p><p>“Do you want to sit and talk about how you feel?” Randazzo asked.</p><p>“Very wasteful, the design,” Bell concluded. “Not enough pictures.”</p><p>Bell, who is thirty-three, came to her job in a sideways fashion. A poet and novelist, she schooled herself in Instagram to promote her work. “All of the small presses that I published with had, like, no money, so marketing was on me,” she said. If she could sell poetry through social media, she thought, she could probably sell other things. When Wilson found her, Bell was running social media for a real-estate app.</p><p>“People are always, like, ‘Wow, your job is amazing,’ ” Bell said. “ ‘You just get high and do stuff.’ Like, yeah, but then I have to reply to e-mails. Don’t get too excited.” ♦</p>"},{"title":"Suicides and Public Humiliation: Recalling Some Past Incidents","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/18/suicides-and-public-humiliation-recalling-some-past-incidents/","category":"law","categoryLabel":"Law","wordCount":1286,"readingTime":7,"content":"<p>The tragic apparent suicide of Cambridge Prof. Jason Arday, following what appeared to be at least credible public allegations that he had engaged in false biographical claims, plagiarism, and (potentially) <a href=\"https://retractionwatch.com/2026/07/27/cambridge-jason-arday-plagiarism-allegations-times-higher-education-exclusive/\" target=\"_blank\" rel=\"noopener\">data falsification</a>, has led people to argue that some in the media misbehaved in the matter. To quote Michelle Goldberg in the <em>N.Y. Times</em> yesterday (\"<a href=\"https://www.nytimes.com/2026/08/17/opinion/jason-arday-cambridge-plagiarism-media.html\" target=\"_blank\" rel=\"noopener\">After a Scholar's Awful Death, Mistaken Calls for Censorship</a>\"),</p>\n<blockquote><p>In the wake of Arday's death, many on the left are blaming the media. \"The media lynched Jason Arday,\" <a href=\"https://theemancipator.org/2026/08/15/ideas/the-media-lynched-jason-arday/\" target=\"_blank\" rel=\"noopener\">declared</a> Ibram X. Kendi. The head of a Cambridge college called for an official inquiry into the \"media onslaught.\"</p>\n<p>Important British progressives, including Zack Polanski, leader of the Green Party, and several Labour M.P.s, signed an open letter demanding some sort of official oversight of journalistic decision making. \"Self-regulation of the press has comprehensively failed,\" it <a href=\"https://goodlawproject.org/petition/jason-arday-letter/?utm_source=Wordpress&amp;utm_campaign=JasonArdayInquiry&amp;utm_content=Banner\" target=\"_blank\" rel=\"noopener\">said</a>. The writer Will Self <a href=\"https://x.com/wself/status/2089334077635641747?s=20\" target=\"_blank\" rel=\"noopener\">called</a>, in an open letter to Prime Minister Andy Burnham, for the police to begin \"impounding computers,\" presumably belonging to people involved in covering the scandal.</p></blockquote>\n<p>I think it's often helpful in such situations to broaden the frame a bit, beyond the particular cause célèbre before us. It's human nature to be influenced in such situations by one's feelings towards the particular person involved, whether sympathy or antipathy. Looking at a wider range of examples can help us get beyond this bias.</p>\n<p>I therefore thought I'd pass along some other examples of people committing suicide following episodes in which they were accused of misconduct, often publicly, and faced actual or possible loss of jobs or other business opportunities:</p>\n<ol>\n<li><a href=\"https://www.nytimes.com/2020/01/04/us/dartmouth-lawsuit-bucci.html\" target=\"_blank\" rel=\"noopener\">In 2020</a>, Dartmouth professor and department chair David Bucci was accused of \"looking the other way\" as to sexual harassment in the department, and \"intimidate[ed] those who had spoken out.\" \"Some colleagues shunned him. A woman at his food co-op called him a 'disgusting human being,' said his wife, Katie Bucci.\" Less than a year later, he committed suicide.</li>\n<li><a href=\"https://www.chronicle.com/article/a-second-u-of-iowa-professor-accused-of-harassment-kills-himself-113956/\" target=\"_blank\" rel=\"noopener\">In 2008</a>, two University of Iowa professors (Mark O. Weiger and Arthur H. Miller) accused of sexually harassing their students, killed themselves.</li>\n<li><a href=\"https://www.nbcnews.com/id/wbna44264056\" target=\"_blank\" rel=\"noopener\">In 2011</a>, University of Idaho professor Ernesto A. Bustamante was accused of threatening his ex-girlfriend (a graduate student), and \"was either fired or forced to resign as a result.\" After that, he murdered the ex-girlfriend and killed himself.</li>\n<li><a href=\"https://www.jta.org/quick-reads/german-historian-stripped-of-award-for-faking-a-family-history-of-suffering-in-holocaust-dies-at-31]\" target=\"_blank\" rel=\"noopener\">In 2019</a>, German historian Marie Sophie Hingst committed suicide after having been found to have falsified much of her life story, including claims that <a href=\"https://www.spiegel.de/international/zeitgeist/the-historian-who-invented-22-holocaust-victims-a-1270963.html\" target=\"_blank\" rel=\"noopener\">many of her relatives had been murdered in the Holocaust</a>. According to <a href=\"https://en.wikipedia.org/wiki/Marie_Sophie_Hingst\" target=\"_blank\" rel=\"noopener\">Wikipedia</a>, \"She was castigated in the German media, leading to the destruction of her reputation.\"</li>\n<li><a href=\"https://www.science.org/content/article/senior-riken-scientist-involved-stem-cell-scandal-commits-suicide\" target=\"_blank\" rel=\"noopener\">In 2014</a>, Japanese researcher Yoshiki Sasai committed suicide after his papers were retracted by the journal <em>Nature </em>based on \"duplicated and mixed-up images, mislabeling, faulty descriptions, and 'inexplicable discrepancies ….'\"</li>\n<li><a href=\"https://www.science.org/content/article/researcher-center-epic-fraud-remains-enigma-those-who-exposed-him\" target=\"_blank\" rel=\"noopener\">In 2017</a>, Japanese researcher Yoshihiro Sato apparently committed suicide after another researcher had uncovered what was described as \"fabricat[ing] data.\"</li>\n<li><a href=\"https://www.bbc.com/news/uk-england-hampshire-58588543\" target=\"_blank\" rel=\"noopener\">In 2021</a>, Portsmouth (England) student Alistair Hall committed suicide after having been found to have plagiarized his final dissertation.</li>\n<li><a href=\"https://www.nbcnews.com/news/us-news/professor-who-announced-retirement-after-racist-sexist-tweets-died-self-n1235026\" target=\"_blank\" rel=\"noopener\">In 2020</a>, University of North Carolina Wilmington professor Mike Adams committed suicide after a wave of condemnation for various tweets that were said to be racist, sexist, and the like. His \"rhetoric had been labeled 'vile' and 'hateful' by his own university,\" and the controversy had gotten a great deal of public attention and news coverage. In the wake of the controversy, he had apparently agreed to retire.</li>\n<li><a href=\"https://www.thepinknews.com/2017/12/07/adult-film-star-august-ames-kills-herself-after-backlash-against-homophobic-tweets/\" target=\"_blank\" rel=\"noopener\">In 2017</a>, porn actress August Ames killed herself \"after sparking an online backlash over allegedly homophobic comments.\" \"Ames' death occurred after she was criticized on Twitter for refusing to work with a male performers who had previously appeared in gay adult films.\"</li>\n</ol>\n<p>Now naturally each of these incidents is different. Some followed considerable news coverage of the accusations. Some followed a great deal of social media attention. Some were apparently more connected to humiliation in front of colleagues, even if not the public at large. Some involved worse behavior than others (the Bustamante incident being the worst, of course).</p>\n<p>In some, the person involved apparently had other psychological difficulties. In some, the true causes of the suicide might be complex, with the criticism or firing being just one element (though it was apparently a triggering event in each incident, from the press accounts I've seen).</p>\n<p>And of course the overwhelming majority of all accusations, even of much more serious offenses (such as serious crimes), don't lead to suicide. But these incidents also remind us that a wide range of accusations—whether they involve alleged plagiarism, fabrication, sexual harassment, sexism, racism, and so on—that can cause humiliation, firing, or the potential end of a career can also lead some people to commit suicide.</p>\n<p>Of course, that still leaves the question of what to do about all this. Should there be social norms against criticism—or coverage of criticism—that might lead someone to suicide? Should there be legal constraints? I'm skeptical about both. (<em>Lies </em>that lead to suicide should of course be condemned, and could already lead to liability: They would be lies, which is bad enough, and of course their effects would show that they would be especially harmful lies. But that, I think, is not the issue as to David Arday: The accusations against him were either true or at least sincere and even plausible conjecture.)</p>\n<p>Should there be institutional mechanisms that diminish the scope of such scandals, by protecting the ability to criticize others (especially prominent people, such as academics)? For instance, if a university is widely known to honestly and seriously deal with accusations against its faculty, accusers might turn to the university rather than going public. In my experience, in many situations the accusers don't want to take the time, energy, and risk to fully investigate the allegations themselves, if they think some more established institution can handle the matter.</p>\n<p>Then, if the university concludes the accused was culpable, the accused could be offered a relatively quiet and graceful exit: The firing or discipline of the accused would presumably be still be announced (recall the \"honestly and seriously deal with accusations\" assumption), but the announcement would likely yield just one round of stories, with little likely follow-up. (Query whether that's on balance good, since it may in some measure protect individual faculty but at the expense of less attention to what might be serious systemic problems in the university.)</p>\n<p>But this appears not to have happened here. The press accounts that I've seen suggest that Cambridge and other universities associated with Arday didn't seriously investigate the allegations, and even <em>Times Higher Education </em><a href=\"https://retractionwatch.com/2026/07/27/cambridge-jason-arday-plagiarism-allegations-times-higher-education-exclusive/\" target=\"_blank\" rel=\"noopener\">decided not to run its story</a> about the matter in 2025 because of litigation threats.</p>\n<p>This is, of course, human nature: It's natural (not to say good, but natural) for institutions to protect themselves and their leadership. Accusations against faculty reflect badly on the institutional leadership as well, especially when the leadership has celebrated the faculty members' work and identity, so there's ample incentive to ignore or minimize such accusations.</p>\n<p>But the consequence of this natural reaction was that the accusers felt they had to go public (that too is human nature), and the story started coming out a little at a time. That meant newspaper article after article dealing with each new development in the story: each accusation of plagiarism, of fabrication, of litigation threats. I expect that led to much more massive media coverage.</p>\n<p>In any event, though, when we're thinking about such matters, we should appreciate that any such norms or legal rules would apply to a wide range of public criticism, from the left, right, or elsewhere, of a wide range of people.</p>"},{"title":"Detroit startup Grounded raises $5M to customize electric and gas-powered vans","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/08/18/detroit-startup-grounded-raises-5m-to-customize-electric-and-gas-powered-vans/","category":"tech","categoryLabel":"Technology","wordCount":607,"readingTime":4,"content":"<p>Detroit-based Grounded has had to be flexible since it was founded in 2022. </p>\n<p>The startup was initially built around the idea of customizing electric vans like Ford’s E-Transit and General Motors’ BrightDrop for the “van life” set, <a href=\"https://techcrunch.com/2024/10/04/detroits-grounded-raises-3-5m-to-fuel-modular-electric-rv-plans/\" target=\"_blank\" rel=\"noopener\">using a modular, “Lego-like” system</a>. Sensing a bigger opportunity, Grounded then started customizing those vans for small businesses. But then GM discontinued BrightDrop last year, Ford axed plans for a next-generation electric Transit van, and EVs generally became a harder sell in the United States.</p>\n<p>That hasn’t stopped Grounded. On Tuesday, the startup announced that it has closed a $5 million seed round, with repeat investments from existing backers Also Capital and Chicago-based early-stage firm The 81 Collection, along with Animal Capital, the Michigan Outdoor Innovation Fund, and “various SpaceX alumni,” according to founder and CEO Sam Shapiro.</p>\n<p>Grounded has also opened a new 50,000-square-foot manufacturing facility in Detroit, where it will take its core modular design business and scale it to be vehicle-agnostic, allowing the startup to customize fit to the different kinds of fleet needs — be they electric or combustion-powered. Production at the facility starts this month, according to the startup, with capacity ramping up next year.</p>\n<p>“This new facility is a turning point for Grounded,” Shapiro said in a statement. “We built this company to bring smart, modular electric vehicles to the businesses and institutions that keep our cities running. With this expansion, we can finally build at the scale our fleet customers need and bring our platform to an entirely new class of commercial vehicles.”</p>\n<p>Grounded has already snapped up customers in the commercial (like Colgate and Nokia), medical (Wayne State University Medical and the Healthy Mothers, Healthy Babies Coalition of Hawaii), and even veterinary sectors. In a statement on Tuesday, Grounded’s chief product officer, Nadia Meyer, said the company is seeing “notable growth” from food and beverage and public safety customers, among others.</p>\n<p>For Shapiro, GM’s cancellation of BrightDrop was a catalyzing moment. He wrote in a <a href=\"https://groundedevs.com/post/rip-brightdrop-long-live-grounded\" target=\"_blank\" rel=\"noopener\">blog post</a> late last year that Grounded would embrace gas-powered vehicles, allowing the startup to build on far more popular models like Ford’s combustion-powered Transit and Mercedes-Benz’s Sprinter vans. It also allowed Grounded to seek out customers who weren’t ready for electric vehicles due to infrastructure challenges.</p>\n<p>Shapiro said at the time that Grounded would exhaust the remaining available BrightDrop inventory while it pivoted to new models, including leveraging electric and hybrid options from fellow startup <a href=\"https://techcrunch.com/2025/11/13/harbinger-raises-160m-will-build-trucks-for-fedex/\" target=\"_blank\" rel=\"noopener\">Harbinger</a>. </p>\n<p>“Grounded is not an ‘EV company,’ nor is Grounded a vehicle company at all,” Shapiro wrote. “We build the smart, high-tech, modular workspace or living space on top of the chassis: the design, materials, power system, and Grounded+ software that turn a vehicle into a modern, connected mobile healthcare vehicle, command center, camper van, coffee shop, and more. The application layer on top of the vehicle is our product.”</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Sean O’Kane is a reporter who has spent a decade covering the rapidly-evolving business and technology of the transportation industry, including Tesla and the many startups chasing Elon Musk. Most recently, he was a reporter at Bloomberg News where he helped break stories about some of the most notorious EV SPAC flops. He previously worked at The Verge, where he also covered consumer technology, hosted many short- and long-form videos, performed product and editorial photography, and once nearly passed out in a Red Bull Air Race plane.</p>\r\n<p>You can contact or verify outreach from Sean by emailing <a href=\"mailto:sean.okane@techcrunch.com\" target=\"_blank\" rel=\"noopener\">sean.okane@techcrunch.com</a> or via encrypted message at okane.01 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/sean-okane/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"}];
