<style>

    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;

  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;

}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"Capcom quietly releases new trailers for Monster Hunter Wilds' Ascendance DLC, teasing some pretty big changes to how all 14 weapon types are going to work","source":"Eurogamer","author":"Dom Peppiatt","url":"https://www.eurogamer.net/monster-hunter-wilds-ascendance-boost-weapons","category":"gaming","categoryLabel":"Gaming","wordCount":576,"readingTime":3,"content":"<p>Coming home to boost.</p>\n    \n  \n  \n  \n  \n            <p>We know that we're getting <a href=\"https://www.eurogamer.net/monster-hunter-wilds-review\" target=\"_blank\" rel=\"noopener\">Monster Hunter Wilds</a>' first expansion, Ascendance, at sometime in 2027. Initially, we were expecting to see more about the game at either <a href=\"https://www.eurogamer.net/everything-announced-at-gamescom-opening-night-live-2026\" target=\"_blank\" rel=\"noopener\">Gamescom 2026</a>, but it seems we'll have to wait until later this month to see more about the expansion during Tokyo Game Show, instead.</p>\n<p>Well, that's not entirely true: Capcom has begun publishing videos about each of the game's 14 different weapon types as of today. The first video, which focuses on the Great Sword, introduces a new modifier you can use (and which will be available for all weapons) called 'Boosted Actions'. The publisher promises to release one new video a day, dedicated to each weapon… taking us to 15th September and the beginning of TGS, as it would happen.</p>\n\n<p>So, what are boosted actions? \"Ascend to Master Rank with the Boost Bracer, a new hunting action that expands the abilities of each of the 14 weapon types in <a href=\"https://www.eurogamer.net/games/monster-hunter-wilds\" target=\"_blank\" rel=\"noopener\">Monster Hunter Wilds</a>: Ascendance,\" Capcom explains in the blurb for the video above. \"Build Boost Bracer energy by staying aggressive with your attacks, then activate Boost with a special Boost Driver attack, or other unique actions per weapon. Boost enables abilities such as new combos and enhanced attacks, allowing you to seize control of the powerful threats that await you.\"</p>\n<p>In case that word salad has you a bit confounded, here's what Boosted Actions allow you to do with the Great Sword:</p>\n<ul>\n<li>Fling forward with the Boost Driver.</li>\n<li>Unleash explosive charged slashes.</li>\n<li>Chain together offset attacks.</li>\n</ul>\n<p>See the trailer below for a specific breakdown on how that all actually works. From what I can tell, it seems that there are three ways to enter the 'Boosted' state - by activating a Brace Boost move (slow, but big damage), by activating  'Quick Boost' (which switches you into stance), and by comboing into 'Boosted' by performing a specific combo. This will, no doubt, give us a whole new resource ecosystem to think about when fighting. I can only assume that dealing damage and exploiting enemy monster wounds will allow you to fill up the meter that determines how and when you can use 'Boosted' mode. There appears to be three charges - but this could alternate depending on the weapon.</p><p>In the video at the top of this article, you can see quite a few teasers about how all this is going to work. There are some amazing looking moves on offer for us; a really impactful and punchy hammer moveset that looks like it allows you to 'perfect guard' more easily, opening up a more aggressive style of play (and resulting in a sort-of Hammer-based shoryuken, amazingly). The Charge Blade seems to have a 'counter hadoken', and the Great Sword (dedicated video below) opens up versatility with a whole new aerial moveset.</p>\n\n<p>Safe to say, then: I'm hyped. It seems Capcom is pushing us to go much faster and more offensive with our playstyle here, assumedly because the monsters we're going to get introduced to (and reintroduced to) are going to be equally as aggressive. <a href=\"https://www.eurogamer.net/monster-hunter-wilds-revised-roadmap\" target=\"_blank\" rel=\"noopener\">Given the complaints about difficulty</a> that plagued the game at launch and beyond, I can only imagine the community will actually embrace this change with open arms.</p>\n<p>Monster Hunter Wilds is available for PlayStation 5, Xbox Series, and PC via Steam, with a <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a> version in development. Ascendance is due out in 2027.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Rachel Entrekin Is Ready to Take What’s Hers","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/08/31/rachel-entrekin-ultramarathon-competition-women/","category":"fun","categoryLabel":"Interesting Reads","wordCount":547,"readingTime":3,"content":"<p>Running with Rachel Entrekin must be pretty wild—she encourages competitors and stops mid-race to pet dogs. But her personality is even bigger off the course. Tough and empathetic, her running success has come after 13 years of hard work and a battle to transform an addictive, perfectionist past into a healthier relationship with food, rest, and herself. And even as success came and ultramarathons were won, she watched opportunities go to her male competitors. Gloria Liu honors the incredible achievement of “smashing records while battling impostor syndrome and the fragility of your own self-worth in a world enamored with men, and their accomplishments.”</p>\n<blockquote>\n<p>The key word, however, is<em> average</em>. As any female runner who’s ever passed a dude working himself into a froth to stay ahead of her on the trail knows, women beat men on an individual basis daily. And as athletes like Entrekin and Dauwalter have shown, they do so, occasionally and spectacularly, even at the elite level. We have an understandable reflex to point to categorical advantages that might explain why women can do this, Malcolm says: “It’s inherently feel good, the David and Goliath aspect of a woman winning outright.”</p>\n<p>But in searching for the advantages we hope all women have, we may be missing a simpler truth: Most men are faster than most women, but some women still beat most men. The point is not that we have any advantage. The point is that they have almost every advantage—and we still win.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on running \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/22/wired-trackflation/\" target=\"_blank\" rel=\"noopener\">Elite Young Runners Are Becoming Freakishly Fast. Welcome to ‘Trackflation’</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tBrendan I. Koerner | Wired | July 20, 2026 | 3,949 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Four-minute miles are almost routine. Middle schoolers are beating college runners. Inside the youth track boom that’s turning kids and teens into speed machines.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/08/running-pain-gogol/\" target=\"_blank\" rel=\"noopener\">The Back Meets the Nose</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tEmily Nemens | The Common | April 24, 2026 | 8,053 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“It felt like a stabbing. It felt like a burning. It felt like a dull ache, then a sharp one, then it radiated all the way down.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/08/07/david-roche-ultrarunning-5280/\" target=\"_blank\" rel=\"noopener\">Has David Roche Cracked the Code? Or Is He Just Another Crackpot?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSpencer Campbell | 5280 Magazine | August 6, 2025 | 4,257 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The Boulder athlete claims to have developed a radical recipe to revolutionize long-distance running. I decided to find out if his training program would make me faster on the trails—and, maybe, better at life.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/30/death-valley-badwater-135-ultramarathon/\" target=\"_blank\" rel=\"noopener\">What It Takes to Crew the Hardest Race on Earth</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDevin Kelly | Outside | July 29, 2025 |  4,733 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Every year, ultrarunners sign up to compete in a brutal race that stretches 135 miles across Death Valley in the high heat of summer. Because of its harsh conditions, the Badwater 135 is perhaps the most intensely crewed ultra in the world, and without these dedicated support teams, for most, the race would be impossible.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/06/04/curse-kenyas-distance-runners/\" target=\"_blank\" rel=\"noopener\">The Curse of Kenya’s Long-Distance Runners</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJonathan W. Rosen | 1843 Magazine | May 30, 2025 | 5,874 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Kelvin Kiptum had the world at his feet. Then it all ended in an instant.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/04/02/the-incandescent-rise-of-sofia-camacho/\" target=\"_blank\" rel=\"noopener\">The Incandescent Rise of Sofia Camacho</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDavid Alm | Runner’s World | March 28, 2025 | 5,158 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The wildly talented nonbinary drag artist and runner is aiming for a place on the sport’s most visible stage.”</p>"},{"title":"My New USA Today Article On Dangerous Similarities Between \"Democratic Socialists\" and MAGA Nationalists","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/09/03/my-new-usa-today-article-on-dangerous-similarities-between-democratic-socialists-and-maga-nationalists/","category":"law","categoryLabel":"Law","wordCount":722,"readingTime":4,"content":"<p><em>USA Today </em>just published my op ed entitled \"\"<a href=\"https://www.usatoday.com/story/opinion/2026/09/03/socialism-maga-government-control-economy/91565398007/\" target=\"_blank\" rel=\"noopener\">Democratic Socialists and MAGA Share a Dangerous Flaw</a>.\" Here's an excerpt:</p> <blockquote> <p>Beginning with <a href=\"https://www.npr.org/2025/11/04/nx-s1-5597788/election-results-zohran-mamdani-new-york-city-mayor\" target=\"_blank\" rel=\"noopener\">New York City Mayor Zohran Mamdani's election victory</a> in 2025, democratic socialist candidates have won a <a href=\"https://abcnews4.com/news/nation-world/fact-check-team-dsa-racks-up-primary-wins-as-movement-eyes-two-more-major-tests-new-york-colorado-supporters\" target=\"_blank\" rel=\"noopener\">string of major Democratic primarie</a>s – most recently <a href=\"https://www.pbs.org/newshour/politics/democratic-socialist-angie-nixon-won-the-senate-primary-in-florida-can-she-win-in-november\" target=\"_blank\" rel=\"noopener\">Florida state Rep. Angie Nixon's upset U.S. Senate nomination</a> win – and <a href=\"https://www.news8000.com/news/politics/national-politics/democratic-socialists-next-hurdle-winning-over-black-voters/article_cad351eb-3766-5686-bd91-2a3c371b946b.html\" target=\"_blank\" rel=\"noopener\">come close</a> in several others. Vermont Sen. Bernie Sanders has long been the <a href=\"https://time.com/4121126/bernie-sanders-democratic-socialism/\" target=\"_blank\" rel=\"noopener\">most prominent self-proclaimed democratic socialist</a> in national politics, and was the runner-up for the Democratic presidential nomination in both <a href=\"https://www.nbcnews.com/politics/elections/2016-clinton-sanders-black-voters-pick-winner-n1029631\" target=\"_blank\" rel=\"noopener\">2016</a> and <a href=\"https://www.nytimes.com/2020/04/08/us/politics/bernie-sanders-drops-out.html\" target=\"_blank\" rel=\"noopener\">2020</a>.</p> <p>Democratic socialism is a terrible ideology. If implemented, its agenda would cause grave harm and imperil democracy itself. And in seeking massive state control of the economy, today's socialists ironically have much in common with the MAGA nationalists they claim to oppose.</p> <p>Both promote government control over the economy, and both paths undermine liberty, prosperity and democracy. Socialists do not control the Democratic Party in the way MAGA largely dominates the Republicans. But their <a href=\"https://www.dailysignal.com/2026/07/06/dsa-boasts-socialist-history/\" target=\"_blank\" rel=\"noopener\">influence is growing</a>.</p> <p>The democratic socialist agenda goes far beyond a marginal increase in economic regulation or welfare spending. It amounts to sweeping government control of the economy and society, on a scale that invites comparison to Cuba, North Korea and the old Soviet Union….</p> <p>Ironically, democratic socialists have more in common with MAGA nationalists than either likely wants to admit. President <a href=\"https://www.usatoday.com/news/politics/donald-trump/\" target=\"_blank\" rel=\"noopener\">Donald Trump</a> has pursued his own version of economic central planning: <a href=\"https://www.cbo.gov/topics/budget/outlook-budget-and-economy\" target=\"_blank\" rel=\"noopener\">ruinous tariffs</a>, severely restrictive immigration policy and <a href=\"https://www.forbes.com/sites/frankholmes/2026/08/03/the-us-government-now-owns-stakes-in-30-companies-intel-is-just-the-beginning/\" target=\"_blank\" rel=\"noopener\">government equity stakes in Intel, U.S. Steel and roughly 30 other companies</a>.</p> <p>Tariffs and immigration restrictions are both major forms of government control over the economy. Immigration restrictions, in particular, <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4046973\" target=\"_blank\" rel=\"noopener\">curtail economic freedom more than any other current U.S. policy</a>….</p></blockquote> <p>The rest of the article explains how both socialist and nationalist forms of government control of the economy run into problems of knowledge and incentives, and why both threaten liberty and democracy. I also explain why adherents of these ideologies cannot paper over their flaws by claiming they favor democratic versions of them, rather than authoritarian ones:</p> <blockquote> <p>Today's socialists say they will avoid this fate because they champion \"democratic\" socialism, not the authoritarian kind. But near-total state control of the economy has never coexisted with democracy for long. A government that controls the economy can starve opposition parties of resources and weaponize control of basic goods to crush dissent.</p> <p><a href=\"https://reason.com/volokh/2024/07/29/venezuela-illustrates-the-perils-of-democratic-socialism/\" target=\"_blank\" rel=\"noopener\">That's exactly what happened in Venezuela</a>, where a democratically elected socialist government became a dictatorship.</p> <p>Right-wing nationalist regimes have followed a similar path, in Germany, Italy, Spain and many Latin American nations.</p> <p>Many of today's socialists even admire authoritarian socialist regimes and hope to emulate them:</p> <ul> <li>The <a href=\"https://www.dsausa.org/statements/dsa-commemorates-100-years-of-fidel-and-denounces-rubios-genocide-against-the-cuban-people/\" target=\"_blank\" rel=\"noopener\">DSA praises Cuban communist dictator Fidel Castro</a>, who turned that country into a totalitarian state.</li> <li>Prominent socialist \"influencer\" Hasan Piker <a href=\"https://www.cato.org/blog/libertarians-use-hasan-pikers-praise-mao-zedong-educate-youth-about-socialism\" target=\"_blank\" rel=\"noopener\">praised Mao</a> – the biggest mass murderer of all time – as \"one of the great leaders of this world.\"</li> <li>Sen. Sanders has <a href=\"https://www.politico.com/blogs/2016-dem-primary-live-updates-and-results/2016/03/bernie-sanders-1985-praise-of-fidel-castro-sandinistas-220550\" target=\"_blank\" rel=\"noopener\">a long history</a> of praising communist despots.</li> </ul> <p>\"Postliberal\" MAGA nationalists similarly often <a href=\"https://journals.sagepub.com/doi/10.1177/14789299241280469\" target=\"_blank\" rel=\"noopener\">admire right-wing despots, like Spain's Francisco Franco, Portugal's Antonio Salazar and others</a>.</p> <p>Progressives and others should consider whether they trust someone like Trump to have the kind of sweeping control over the economy socialists advocate for. There is no guarantee such a person – or worse – would not come to power under socialism….</p> </blockquote> <p>I end with this point:</p> <blockquote><p>If nothing else, we should heed the powerful <a href=\"https://reason.com/volokh/2022/10/05/learning-from-people-who-vote-with-their-feet/\" target=\"_blank\" rel=\"noopener\">evidence of people \"voting with their feet.\"</a> Almost every socialist regime in history has produced a mass exodus toward market economies, never the reverse. <a href=\"https://www.cbsnews.com/news/immigration-venezuela-refugee-crisis-us-border-policies/\" target=\"_blank\" rel=\"noopener\">Venezuela's exodus is the largest refugee crisis ever recorded in the Western Hemisphere</a>, and <a href=\"https://reason.com/volokh/2024/07/24/over-1-million-people-flee-cuba-in-just-two-years/\" target=\"_blank\" rel=\"noopener\">Cuba</a> has had multiple waves of refugees over six decades….</p> <p>If socialism worked as advertised, people would be fleeing market economies to live under it, not the other way around. Right-wing nationalist regimes have produced their own refugee outflows. Refugees from Nazi Germany and fascist Italy, for instance, helped build American science, including <a href=\"https://ahf.nuclearmuseum.org/scientist-refugees-and-manhattan-project/\" target=\"_blank\" rel=\"noopener\">the Manhattan Project</a>, which developed the atomic bomb.</p></blockquote> <p>I addressed some of the issues covered in the article more fully in previous writings, such as \"<a href=\"https://nationalaffairs.com/publications/detail/the-case-against-nationalism\" target=\"_blank\" rel=\"noopener\">The Case Against Nationalism</a>\" (coauthored with Alex Nowrasteh), and \"<a href=\"https://reason.com/volokh/2019/06/05/perils-of-democratic-socialism-2/\" target=\"_blank\" rel=\"noopener\">Perils of Democratic Socialism</a>.\" See also <a href=\"https://www.cato.org/blog/contradictions-socialist-prison-abolitionism\" target=\"_blank\" rel=\"noopener\">my recent piece</a> on the contradictions of socialist prison abolitionism.</p>"},{"title":"Dermstore Coupons: 25% Off for 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/dermstore-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":922,"readingTime":5,"content":"<p>You can trust what you buy at Dermstore. Unlike Sephora and Ulta, Dermstore focuses on dermatologist-tested brands, like EltaMD, SkinCeuticals, and SkinMedica—many of which you won’t find at these other stores. Also, Dermstore doesn’t just sell skincare; the retailer carries beauty tools and wellness gadgets, from <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">LED masks</a> to <a href=\"https://www.wired.com/gallery/best-theragun-percussive-therapy-devices/\" target=\"_blank\" rel=\"noopener\">Theraguns</a> and <a href=\"https://www.wired.com/gallery/i-have-tested-1000-sex-toys-these-8-are-what-i-always-recommend/\" target=\"_blank\" rel=\"noopener\">sex toys</a>. And many of these products are <a href=\"https://www.dermstore.com/c/hsa-fsa/\" target=\"_blank\" rel=\"noopener\">FSA/HSA eligible</a>.</p><p>Big sales may be occasional, but Dermstore still knows how to treat its customers. Exclusive offers, free standard shipping, and a loyalty program all make shopping here worthwhile. Its <a href=\"https://www.dermstore.com/p/beauty-box/beautyfix-female-founders-133-value/12898514/\" target=\"_blank\" rel=\"noopener\">BeautyFix subscription</a> is also a fun perk: you get five dermatologist-backed full- and deluxe-size formulas each month (over $100 in value) for just $21.95-$24.95 a box, with free shipping after your first order. Read on below for some of the best Dermstore promo codes and deals we’ve found so far.</p><p>I tried the red-light therapy masks flooding my feed and consulted with professionals to find out which ones are worth the splurge.</p><h2>Dermstore Sale 25% Off</h2><p>If you’ve been wanting to upgrade your skincare routine, but don’t want to shell out hundreds of dollars, now’s a great time to shop at Dermstore. Until August 13, you can get up to 25% off top skincare brands from Dermstore, including SkinCeuticals, La Roche-Posay, EltaMD, and more when you use Dermstore promo code <strong>CHEERS</strong>. So whether you’re wanting to get a top-notch sunscreen for protection, or want to upgrade to a peptide cleanser, you’ll save up to 25% when you shop the <a href=\"https://www.dermstore.com/c/anniversary-sale/up-to-25-off/\" target=\"_blank\" rel=\"noopener\">Dermstore Anniversary Sale</a>.</p><h2>Unlock Your First Dermstore Promo Code: Save 15% on Your First Order</h2><p>New customers can take 15% off their first order just by signing up for the Dermstore email newsletter or SMS alerts. <a href=\"https://www.dermstore.com/c/exclusions/new-customer/\" target=\"_blank\" rel=\"noopener\">Select items</a> are excluded from this promotion.</p><p>Don’t fly to Turkey just yet. Our WIRED testers saw visible hair regrowth with these red-light therapy devices.</p><h2>Claim 5% Back on Every Purchase With Dermstore Rewards</h2><p>As a <a href=\"https://www.dermstore.com/c/account/redeem-points/\" target=\"_blank\" rel=\"noopener\">Dermstore Rewards</a> member, I love that I earn points on every Dermstore purchase—five points for every $1 spent, to be exact. That’s 5% cash back on every order. Just make sure you’re logged in when you check out. And unlike the welcome offer, there are zero brand exclusions, so I can use my points on any product I want.</p><p>To break it down: 500 points equals a $5 credit, 1,000 points gets you $10, and 1,500 points nets $15. Even better, there are easy ways to earn points without spending money. Signing up gets you 100 points, and submitting a review gets you 50 more. It might not sound like much, but if you’re already shopping, why not stack up a little credit for later? On top of that, rewards members get exclusive access to special sales and double-points events. Your loyalty points have an expiration date of 365 days after you earn them, so make sure to use them before they’re gone.</p><ul><li><p>Photograph: Kat Merck</p></li><li><p>Photograph: Kat Merck</p></li></ul><p>Dr. Dennis Gross</p><h3>DRx SpectraLite FaceWare Pro</h3><h2>Save up to 25% Instantly With Dermstore Auto-Replenishment Discounts</h2><p>Dermstore’s <a href=\"https://www.dermstore.com/c/auto-replenishment/\" target=\"_blank\" rel=\"noopener\">auto-replenishment subscription plan</a> makes sense for beauty products you regularly use and run through quickly. You can save up to 25 percent off your first purchase and future refills, plus free shipping on recurring deliveries. It’s flexible, too, so you can adjust the delivery schedule, pause shipments, and cancel at any time with no commitment. I’d set it up for everyday essentials like <a href=\"https://www.wired.com/gallery/the-best-lip-balms/\" target=\"_blank\" rel=\"noopener\">lip balm</a> and <a href=\"https://www.wired.com/gallery/best-sunscreens/\" target=\"_blank\" rel=\"noopener\">sunscreen</a>, but there are plenty of options, including facial mists, oils, and cleansers. Note, though, that not every product online at Dermstore is eligible for subscription.</p><h2>Select Customers Can Unlock a 15% Discount at Dermstore</h2><p>Certain shoppers can get 15 percent off any Dermstore order, not just their first. Military members, veterans, teachers, first responders, and medical workers are eligible for this promotion; you’ll just need to undergo an <a href=\"https://secure.gocertify.me/at/dermstore/essential-worker\" target=\"_blank\" rel=\"noopener\">online verification process</a> to receive a unique discount code. Students are also eligible for the same 15 percent discount if they <a href=\"https://secure.gocertify.me/at/dermstore/student\" target=\"_blank\" rel=\"noopener\">verify their status</a> as well. Keep in mind that these codes aren’t stackable, so if you have another discount, you’ll need to choose one to use.</p><ul><li><p>Photograph: Kat Merck</p></li><li><p>Photograph: Kat Merck</p></li></ul><p>LightStim</p><h3>LightStim for Wrinkles</h3><h2>Give 15%, Get $50 When You Refer a Friend to Dermstore</h2><p>When you refer someone new to Dermstore, they’ll get the usual 15%off their first order, and you’ll score $50 in store credit. You’ll need to create a (free) Dermstore account to start <a href=\"https://www.dermstore.com/c/myreferrals/\" target=\"_blank\" rel=\"noopener\">sending referrals</a>. After your friend’s order ships, Dermstore will email you within 24 hours to let you know your credit has landed in your account. You can also track how many people you’ve referred and how much credit you’ve earned from the top of your account page. Don’t forget to spend it—any referral credit expires after six months.</p><ul><li><p>Photograph: Nena Farrell</p></li><li><p>Photograph: Nena Farrell</p></li><li><p>Photograph: Nena Farrell</p></li></ul><p>HigherDose</p><h3>Red Light Hat</h3><h2>Highlighting Our Go-To Skincare Tech</h2><p>Dermstore is known for its dermatologist-approved skincare, but don’t sleep on its beauty tools and devices. The site has put together a <a href=\"https://www.dermstore.com/c/tools-devices/bestsellers/\" target=\"_blank\" rel=\"noopener\">curated Best of Dermstore page</a>, and I’ve tried plenty of the gadgets myself. Many of <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">our favorite LED masks</a> are featured, like the <a href=\"https://www.dermstore.com/p/dr-dennis-gross-skincare-drx-spectralite-faceware-pro/12747871/\" target=\"_blank\" rel=\"noopener\">Dr. Dennis Gross SpectraLite FaceWare Pro</a>, <a href=\"https://www.dermstore.com/p/skin-gym-wrinklit-heart-led-mask/13698359/\" target=\"_blank\" rel=\"noopener\">Skin Gym Wrinklit Heart LED Mask</a>, and the <a href=\"https://www.dermstore.com/p/therabody-theraface-mask-glo/17456245/\" target=\"_blank\" rel=\"noopener\">Therabody TheraFace Mask Glo</a>. Dermstore also carries a decent Therabody lineup; I always pack the <a href=\"https://www.dermstore.com/p/therabody-theraface-depuffing-wand-indigo/16236425/\" target=\"_blank\" rel=\"noopener\">TheraFace Depuffing Wand</a> when I travel for its hot-and-cold therapy, and the <a href=\"https://www.dermstore.com/p/theragun-pro-plus/14939421/\" target=\"_blank\" rel=\"noopener\">Theraguns</a> are powerful recovery tools for sore muscles.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
