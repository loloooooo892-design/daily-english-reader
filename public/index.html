<script>
var articles = [{"title":"Justices consider when a constitutional rule is “previously unavailable” to prisoner ","source":"SCOTUSblog","author":"Zachary Shemtob","url":"https://www.scotusblog.com/2026/11/justices-consider-when-a-constitutional-rule-is-previously-unavailable-to-prisoner/","category":"law","categoryLabel":"Law","wordCount":1304,"readingTime":7,"content":"<p>The Supreme Court on Wednesday <a href=\"https://www.supremecourt.gov/oral_arguments/audio/2026/25-1003\" target=\"_blank\" rel=\"noopener\">heard argument</a> in <a href=\"https://www.scotusblog.com/cases/guerrero-v-johnson/\" target=\"_blank\" rel=\"noopener\"><em>Guerrero v. Johnson</em></a>, a case <a href=\"https://www.scotusblog.com/2026/10/justices-to-debate-when-an-established-rule-is-previously-unavailable-in-prisoner-habeas-cases/\" target=\"_blank\" rel=\"noopener\">about</a> whether a Texas man on death row can bring a second federal post-conviction challenge to his sentence by arguing that, under updated psychiatric standards, he was found intellectually disabled and therefore cannot be executed.</p><p>Except in a few narrow circumstances, the <a href=\"https://www.congress.gov/bill/104th-congress/senate-bill/735\" target=\"_blank\" rel=\"noopener\">Antiterrorism and Effective Death Penalty Act of 1996</a> bars prisoners from filing a petition for federal post-conviction relief challenging the grounds for their detention when an earlier petition has already been rejected. One of these exceptions is when such a claim relies on “a new rule of constitutional law, made retroactive to cases on collateral review by the Supreme Court, that was previously unavailable.” The other is if facts “underlying the [initial] claim” would show “by clear and convincing evidence that, but for constitutional error, no reasonable fact finder would have found the applicant guilty of the underlying offense.”</p><p>In 2007, Dexter Johnson was convicted of capital murder and sentenced to death for his role in the double murder of 23-year-old Maria Aparece and 17-year-old Huy Ngo. Five years before his conviction, the Supreme Court held in <a href=\"https://supreme.justia.com/cases/federal/us/536/304/\" target=\"_blank\" rel=\"noopener\"><em>Atkins v. Virginia</em></a> that executing people with intellectual disabilities violates the Eighth Amendment. A defense expert at Johnson’s trial concluded that, under the diagnostic standards employed at the time, Johnson was not intellectually disabled. Following his conviction, Johnson filed an initial habeas petition and invoked <em>Atkins</em> to argue – unsuccessfully – that its protections should extend to people with mental illness.</p><p>In May 2013, while Johnson’s first federal petition was pending, the American Psychiatric Association published the <a href=\"https://www.psychiatry.org/psychiatrists/practice/dsm/\" target=\"_blank\" rel=\"noopener\">DSM-5</a>, a new edition of its diagnostic manual that deemphasized IQ cutoffs. Texas’ highest criminal court adopted this in 2018. In 2019, Johnson scored 70 on an IQ test, and an expert concluded he met the DSM-5’s criteria for intellectual disability. Johnson then filed a successive habeas challenge in the district court claiming that he could not be executed under <em>Atkins</em>. The trial court subsequently ruled that his claim (based on the later diagnostic criteria) had been “previously unavailable,” and the U.S. Court of Appeals for the 5th Circuit <a href=\"https://cdn.sanity.io/files/pito4za5/production/12a48eb41de12b83f3008ba52bad200db03afaea.pdf#page=45\" target=\"_blank\" rel=\"noopener\">affirmed</a> that decision. The 5th Circuit denied rehearing, and Texas came to the Supreme Court, which agreed to hear the case in June.</p><p>At oral argument, Texas Solicitor General William Peterson <a href=\"https://www.supremecourt.gov/oral_arguments/argument_transcripts/2026/25-1003_c9dh.pdf#page=5\" target=\"_blank\" rel=\"noopener\">told</a> the justices that Congress “chose to allow new claims in these applications only in limited circumstances that do not include changes in the diagnostic standards for intellectual disability.” There is no “new rule” “previously unavailable” here, because <em>Atkins</em> was decided before Johnson “even committed his crimes,” Peterson said.</p><p>Justice Elena Kagan pressed Peterson on why the DSM “isn’t … part of the law?” She suggested that the DSM-5 effectively created “a kind of <em>Atkins </em>I and an <em>Atkins</em> II” – first, a rule barring the execution of people with intellectual disabilities, followed by a “substantive standard” defining what it means to be intellectually disabled. Kagan later described the <em>Atkins</em> standard as akin to a rule with a “big gap in it” where “the DSM comes and plugs it in and it becomes part of the legal standard.”</p><p>The justices further debated what it means for a rule to be “available.” Kagan suggested, based on prior precedent, that something is “not available to you” if it makes you “run into a brick wall.” “[I]f I was going to be [previously] laughed out of court,” she said, “then, really, the rule was unavailable to me.”</p><p>Justice Ketanji Brown Jackson told Peterson that, as she understood AEDPA, Congress’ “policy choice was to give individuals one clear shot at bringing their constitutional claims.” Under Texas’ interpretation, she said, “Mr. Johnson will never get that opportunity,” which “seems like a really incongruous consequence.”</p><p>Justice Sonia Sotomayor, for her part, suggested that the outcome should turn on something like ripeness (whether a case is sufficiently developed for a court to decide). As she remarked to Peterson, “[i]f what we have said under <em>Atkins</em> is you cannot execute someone who is mentally ill, we have a certain way of determining that, and it doesn't become ripe until the DM-5 makes it ripe.”</p><p>Justice Brett Kavanaugh asked Peterson whether the court “could resolve this case solely on the new rule issue without addressing ‘previously unavailable.’” Peterson said it could, but that Texas was asking the court to decide the “previously unavailable” question.</p><p>On behalf of Johnson, Jeremy Schepers told the justices that “existence and availability aren’t the same thing.” <em>Atkins </em>existed, but Johnson’s claim – based on the change in diagnostic criteria – was not previously available. When the clinical standards for intellectual disability change, Schepers argued, “the Eighth Amendment’s protected class potentially changes as well. And in those rare circumstances, that can render a rule legally available for the first time.”</p><p>Justice Clarence Thomas was skeptical, asking, “Does <em>Atkins</em> ever stop being a new rule?” Schepers responded that <em>Atkins</em> “remains new now.” “What about <em>Marbury v. Madison</em>?” Thomas responded. Justice Amy Coney Barrett noted that when “Alexander Graham Bell invented the telephone, that was new.” But “I don't think anybody would describe the telephone as new today.”</p><p>Kavanaugh pointed Schepers to a “friend of the court” <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-1003/418343/20260806171321625_25-1003%20Amicus%20Brief.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> filed by Louisiana and 21 other states, which argued that because the medical standards are “constantly evolving,” Johnson’s position is “a recipe for eternal <em>Atkins</em> claims and zero finality.” Schepers said that was incorrect, because a state prisoner gets “one opportunity to raise any claim,” and “so a prisoner could not raise a second <em>Atkins </em>claim.”</p><p>At one point, Justice Samuel Alito asked about a future edition of the DSM that “makes smaller changes” that “provide a greater opportunity for success.” Schepers said that claim would fail under the 5th Circuit’s reading, because “[i]t’s only a question of whether the claim had a possibility of merit before.”</p><p>Emily Ferguson, an assistant to the U.S. solicitor general who argued as a “friend of the court” in support of Texas, emphasized that it is “difficult to imagine Congress enacting a law that would allow the American Psychiatric Association, without independent action of this Court, to create a new rule of constitutional law.” She also noted that the court had made clear “states would be responsible for the method of determining intellectual disability,” and it would then make little “sense for there to be an available successive application anytime the relevant state had a new … supreme court case … or even a state lower court case that changed the framework that the state was using.”</p><p>Alito asked Ferguson whether the “<em>Atkins </em>rule” was “that a person may not be executed if the person has an intellectual disability that is regarded as such by medical professionals,” or if “it is that a person may not be executed if the person has an intellectual disability that can't be justified by the recognized purposes of punishment,” for which “the DSM would be evidence but not part of the standard itself?” Ferguson responded that the “latter formulation captures what … the <em>Atkins</em> Eighth Amendment rule was.”</p><p>Perhaps the most noticeable takeaway from oral argument was how subdued the justices were. The chief justice did not ask any questions, and no justice appeared to take up Johnson’s request in his <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-1003/424918/20260918165241257_Guerrero%20v%20Johnson%20-%20Merits%20Brief.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> that the court dismiss the case as improvidently granted (that is, decide that it was a mistake to have agreed to hear the case in the first place and not resolve it), as the court did last term in <a href=\"https://www.scotusblog.com/cases/hamm-v-smith-4/\" target=\"_blank\" rel=\"noopener\"><em>Hamm v. Smith</em></a>, another <em>Atkins</em> case.</p><p>A decision is expected by late June but is likely to come earlier. </p><p><strong>Recommended Citation: </strong>Nora Collins &amp; Zachary Shemtob, <em>Justices consider when a constitutional rule is “previously unavailable” to prisoner </em>, SCOTUSblog (Nov. 6, 2026, 1:07 PM), https://www.scotusblog.com/2026/11/justices-consider-when-a-constitutional-rule-is-previously-unavailable-to-prisoner/</p>"},{"title":"Area Man Feels Joy Online for First Time in Years","source":"Wired","author":"@wired","url":"https://www.wired.com/story/wired-world-fair-2026-ben-collins-the-onion/","category":"tech","categoryLabel":"Technology","wordCount":677,"readingTime":4,"content":"<p>When The Onion made a bid to buy conspiracy theorist Alex Jones’ <em>Infowars</em> two years ago, Donald Trump had just won his second presidential election—and, for many, things were looking dark.</p><p>“You guys remember ... how fucking hopeless we felt?” Onion CEO Ben Collins asked an audience at the <a href=\"https://www.wired.com/tag/wired-world-fair-2026/\" target=\"_blank\" rel=\"noopener\">WIRED World Fair</a> Wednesday in Miami. At the time, he asked his partner, researcher and journalist <a href=\"https://www.wired.com/story/wired-world-fair-2026-cj-pearson-and-kat-abughazaleh/\" target=\"_blank\" rel=\"noopener\">Kat Abughazaleh</a>, if she was up for walking “into a fucking burning building” by trying to take over Jones’ media empire. Her reply, according to Collins, was “Yeah. Nobody else is going to do this.”</p><p>Although The Onion is still in an ongoing legal battle over <em>Infowars</em>—it won the media network in a bankruptcy auction, but a federal judge in Texas struck the deal down—Collins is feeling more hopeful in light of <a href=\"https://www.wired.com/story/democrats-sweep-republicans-in-nearly-every-race-that-matters/\" target=\"_blank\" rel=\"noopener\">the Democrats’ midterm wins</a>.</p><p>“I want people to feel hope today because things changed last night,” he said. “We have an attorney general in Texas who might make a different decision.”</p><p>Collins joined comedian Patti Harrison, who stars in The Onion’s <a href=\"https://www.wired.com/story/the-onions-infowars-parody-is-here-alex-jones-is-going-to-hate-it/\" target=\"_blank\" rel=\"noopener\">parody <em>Infowars</em> show</a>, in a panel about the role of satire in society and politics. Collins also cagily spoke about The Onion’s interest in sports—comments that made more sense on Thursday when he <a href=\"https://bsky.app/profile/bencollins.bsky.social/post/3mzky4ypeb22r\" target=\"_blank\" rel=\"noopener\">posted on Bluesky</a>, “The Onion is extremely close to buying an honest-to-goodness, Division 1 college football bowl series bowl game. Yes, we're trying to pull off The Onion Bowl.”</p><p>During the conversation, the pair discussed a lot of what has caused that sense of hopelessness in the Trump era: Jones’ disinformation campaign against the parents of Sandy Hook school shooting victims; ICE raids; Democrats abandoning trans rights. But they also talked, albeit in measured tones, about the value in fighting back with humor.</p><p>“Comedy is a good pill-in-the-cheese way to sort of introduce ideas to people,” Harrison said, noting that though she had let out “a huge sigh of relief” over the midterms, there’s a large swath of the population that is still “truly radicalized.” “They’re still out there drinking Mountain Dew,” she added, perhaps a nod to a <a href=\"https://www.theatlantic.com/technology/archive/2024/07/j-d-vance-mountain-dew/679204/\" target=\"_blank\" rel=\"noopener\">nonsensical joke</a> Vice President JD Vance made about how his love for Diet Mountain Dew could be viewed as “racist.”</p><p>Collins, who was previously an extremism reporter, extolled the virtues of being able to state things plainly via a satirical site. And he noted that many of The Onion’s headlines—including “almost everything that we say about RFK [Jr.]”—end up coming true.</p><p>“We don’t need three sources to write down the perfect sentence about what's wrong in the United States,” Collins said. “We're allowed to get to the heart of the matter a lot faster.”</p><p>Both also reflected on the internet being a lifeline for them while growing up in small towns. For Harrison, MySpace offered her a chance to talk to “other weird people” who were into “weird stuff” she had no access to in a rural, Christian, white community.</p><p>“I don't think social media is intrinsically bad,” she said. “I think the version of it that we have is truly abusive and evil.” The algorithmic era of being online means that sometimes her content gets pushed on people who don’t get it; when she recently dressed up as Elon Musk in a black MAGA hat for a WIRED cover, a lot of people told her it was “so fucked up.”</p><p>But she said comedy is still thriving online and it is possible to “de-algorithmize our internet.”</p><p>Collins’ take was harsher. He referred to the current iteration of the internet as a “joy vacuum” that “takes away anything that could be fun.” However, spaces like The Onion offer catharsis. “You kind of need to find ways to stay sane when things are so messed up,” he said.</p><p>For now, he says, the most fun he has is “playing around in the real world,” including The Onion’s writers’ room or just hanging out with friends. Then again, he adds, “I do hope that some benevolent-ass companies come soon and try to fix it.”</p>"},{"title":"The Elder Scrolls 6: Sentinel teaser all but confirms Hammerfell setting and means we can finally stop using that eight year old header image with the hills","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/the-elder-scrolls-6-sentinel-teaser-all-but-confirms-hammerfell-setting-and-means-we-can-finally-stop-using-that-eight-year-old-header-image-with-the-hills","category":"gaming","categoryLabel":"Gaming","wordCount":544,"readingTime":3,"content":"<p>Say hello to sandy scroll screengrab for the foreseeable future</p>\n    \n  \n  \n  \n  \n            <p>Praise Talos and whatever other Elder Scrolls deities you might worship. We here at RPS and in the wider gaming press finally have new material to use when hunting for images to symbolise <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-6\" target=\"_blank\" rel=\"noopener\">The Elder Scrolls 6</a>. No more will we be limited to that shot of some hills from the 2018 teaser, because Bethesda have shown off an elder scroll covered in sand while revealing the new game's subtitle and all but locking in a setting. As a <a href=\"https://www.rockpapershotgun.com/the-elder-scrolls-6-sentinel-will-be-an-elder-scrolls-game-about-the-infinite-mysteries-of-the-elder-scrolls-report-with-some-plot-hintage-claims\" target=\"_blank\" rel=\"noopener\">recent report</a> from The Verge claimed, it's called The Elder Scrolls 6: Sentinel and looks to be set in Hammerfell.</p>\n<p>These details were revealed in a short teaser at the end of a Todd Howard-fronted video celebrating Bethesda Game Studios' 40th anniversary. As such, the majority of the video is the Toddinator recapping the studio's history by touching on each of the games they've put out since 1986's Gridiron. Then, he looks to the future. \"You know, everybody’s always asking about Elder Scrolls 6,\" the Toddfather said. \"And we thought, hey, given the moment, what a perfect time to tell you what The Elder Scrolls 6 is actually called.\"</p>\n\n<p>Cue a shot of an elder scroll buried in sand, followed by the The Elder Scrolls 6: Sentinel in fancy logo font. Then, a quote attributed to a moth priest called Yazar. \"The scroll offered only a shimmer, a veil thinly lifted to my eyes. A future lost. A victory undone. Sands of time scattered by fate.\" OOH, CRYPTIC. In all seriousness, between the subtitle, the sand, and Yazar being referred to as a moth priest in service of High Queen Iradne of Hammerfell, the Verge report's assertion that the game will be set in Hammerfell is essentially set in stone by this teaser even if his Toddliness didn't spell it out himself.</p><p>Sentinel's the name of both a kingdom and city in the Redguards' province. The inclusion of an elder scroll in the teaser and the quote from Yazar also lend credence to the Verge report's claim that the game will make a big thing out of unravelling secrets linked to the provenance of these mysterious bits of paper. As for the quote's yammering of lost futures and undone victories, I'll venture to speculate that it could turn out to be reference to the player character thwarting a Thalmor victory, since <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-v-skyrim\" target=\"_blank\" rel=\"noopener\">Skyrim</a> seemed to set up the elves as being on the verge of conquering Tamriel as the Cyrodillic empire fractured and fell.</p>\n<p>That may or may not be the case, but we do know for sure that this teaser likely means a huge downturn in use of the header image below. It's eight years old, pulled from The Elder Scrolls 6's <a href=\"https://www.youtube.com/watch?v=OkFdqqyI8y4\" target=\"_blank\" rel=\"noopener\">infamous 2018 teaser</a>. All these years on, the game's finally on the way. You've served us well, screengrab of some hills. Talos guide you to wherever less regularly used images go.</p>\n\n<p>Elder Scrolls teasing aside, it's worth bearing in mind that Bethesda parent company Microsoft have spent the majority of this year gutting their workforce with <a href=\"https://www.rockpapershotgun.com/we-were-already-running-a-tight-ship-elder-scrolls-6-devs-are-worried-about-xboxs-layoffs-causing-even-more-delays-to-the-long-awaited-rpg\" target=\"_blank\" rel=\"noopener\">mass layoffs</a> and <a href=\"https://www.rockpapershotgun.com/xbox-are-parting-ways-with-double-fine-arkane-undead-labs-compulsion-and-ninja-theory-in-the-course-of-thousands-of-layoffs\" target=\"_blank\" rel=\"noopener\">studio ditching</a>. Microsoft are also still currently subject to a <a href=\"https://www.rockpapershotgun.com/bds-calls-for-boycott-of-microsoft-and-xbox-gaming-products-over-alleged-israeli-military-connections\" target=\"_blank\" rel=\"noopener\">BDS movement boycott</a> over their <a href=\"https://www.rockpapershotgun.com/microsoft-israel-boss-leaves-after-investigation-into-whether-idf-contracts-broke-microsofts-code-of-ethics\" target=\"_blank\" rel=\"noopener\">reported ties</a> to the Israeli military.</p>"},{"title":"Go Fast, Turn Left: The Anderson Speedway & Indiana’s Data Centers","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/10/27/anderson-speedway-indianas-data-centers/","category":"fun","categoryLabel":"Interesting Reads","wordCount":559,"readingTime":3,"content":"<p>Leo Kim’s piece is an ambitious mix of race‑track reportage, personal reflection, and theory‑driven critique. It braids together one night at a small Indiana speedway, the rise and collapse of Anderson’s auto industry and unions, and an abstract meditation on tech, AI, and “speed.” It poses a compelling central question—whether every technology invents its own kind of disaster—but does demand close attention to follow its dense imagery.</p>\n<blockquote>\n<p>The dust doesn’t bother me much. By this point in the night, the round-and-round whirling of cars, combined with the alchemical mixture of exhaust, burnt rubber, and patriotic beer, has lulled me into a Midwestern trance. It must be the flatness that makes this region such a perfect catalyst for this kind of delirium. When Baudrillard drove through the expanse of the US, he wrote about speed as an erasing force whose “only rule is to leave no trace behind.” He was right to sense speed as a primal impulse in this unfurling stretch of country. Movement in the Old World is slowed by its narrow roads, latticed cities, and contested borders; it struggles to overcome the glacial pace of History. Drive a hundred miles and you’re bound to run into something. Not so in the Midwest. Nothing here interrupts the flow. There are no mountains to break the wind, no densities of skyscrapers to bisect the sky, no ravines to stop the sprawl. Everything moves towards terminal velocity. It is a landscape built for vortices and accelerating feedback loops: for flows of capital, weather, ideology, and machinery to intersect and (r)evolve into novel forms.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks set in the Rust Belt \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/09/25/home-city-usa/\" target=\"_blank\" rel=\"noopener\">Home City, USA</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tPooja Bhatia | The Baffler | September 4, 2025 | 5,790 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The economic and spiritual effects of mass deportation.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/01/16/power-failure-on-landscape-and-abandonment/\" target=\"_blank\" rel=\"noopener\">Power Failure: On Landscape and Abandonment</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMya Frazier | Switchyard and the Food &amp; Environment Reporting Network | January 2025 | 4,575 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“I wanted to make sense of another kind of imbalance within the landscape of central Ohio: that between corporate control and ordinary people; between economic development and nature; and, most acutely in a season of drought, between electricity-hungry data centers and something as necessary for human survival as a field of crops.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/09/19/fear-and-hope-in-springfield-ohio/\" target=\"_blank\" rel=\"noopener\">Fear and Hope in Springfield, Ohio</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAymann Ismail | Slate | September 18, 2024 | 3,122 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“After Donald Trump repeated rumors that immigrants here are eating cats and dogs, I came to town for the weekend. Proud Boys greeted me.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/06/18/when-my-father-talked-about-larry-bird/\" target=\"_blank\" rel=\"noopener\">When My Father Talked About Larry Bird</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJeremy Collins | Esquire | June 16, 2024 | 4,570 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The Boston Celtics legend was the north star of my youth, present in every debate and stretch of silence with my dad. This was true on the night when my world stopped, leaving me on a sidewalk seeing stars.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/07/05/a-road-trip-through-trumps-america/\" target=\"_blank\" rel=\"noopener\">A Road Trip through Trump’s America</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tRené Pfister | Der Spiegel | June 21, 2023 | 6,210 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Former U.S. President Donald Trump is seeking another term in the White House. A trip through Republican-controlled states reveals just how radically America has already changed. Can the country survive a second Trump tenure?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/05/02/as-rail-profits-soar-blocked-crossings-force-kids-to-crawl-under-trains-to-get-to-school/\" target=\"_blank\" rel=\"noopener\">As Rail Profits Soar, Blocked Crossings Force Kids to Crawl Under Trains to Get to School</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTopher Sanders, Dan Schwartz, Joce Sterman | ProPublica and InvestigateTV | April 26, 2023 | 2,904 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“How much should they risk to get to school?”</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
