*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Hasan Piker Sues Scott Jennings","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/10/27/hasan-piker-sues-scott-jennings/","category":"law","categoryLabel":"Law","wordCount":834,"readingTime":5,"content":"<p>From the complaint in <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.dcd.298060/gov.uscourts.dcd.298060.1.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Piker v. Jennings</em></a>; of course, this is just Piker's side of the story—I expect we'll get Jennings' in a forthcoming motion to dismiss:</p> <blockquote><p>On August 11, 2026, Scott Jennings falsely told a nationwide podcast audience that Hasan Piker was \"out there calling for Black voters to be lynched.\" He falsely told his listeners that Mr. Piker had a \"plan of returning our country to lynchings.\" And then he falsely told his social media followers that Mr. Piker \"says the USA should resume lynchings against black people.\"</p>  <p>All of Mr. Jennings' accusations are false. Mr. Piker has never advocated the lynching of Black Americans, or anyone else. He has never called for a return to lynchings. And he has never proposed anything remotely resembling the supposed plan that Mr. Jennings falsely attributed to him.</p> <p>Mr. Jennings did not merely mischaracterize something Mr. Piker said. He took a false, fabricated, and manipulated video of Mr. Piker, added a made-up quotation that Mr. Piker never uttered, and then made accusations that went beyond even what the manipulated footage purported to show. Mr. Jennings presented those accusations as fact, telling his viewers to \"[l]isten for yourself\" about Mr. Piker, knowing that he was playing a falsified video of Mr. Piker for those viewers, and completely disregarding the truth of Mr. Piker's actual words.</p> <p>The underlying footage came from a broadcast nearly two years earlier on Twitch, an online streaming service owned by Amazon. On October 29, 2024, Mr. Piker was reacting to a debate between two Black political commentators, one liberal and one conservative. When the conservative commentator blamed \"woke DAs\" for policies supposedly harming Black Americans, Mr. Piker mocked him by sarcastically portraying that comment as nostalgia for an era before the civil rights movement. Laughing, Mr. Piker said:</p></blockquote>  <blockquote> <blockquote><p>He said, \"We need more Klansmen, okay? Can we go back to a better time when lynchings were happening? This is what I like as a Black man. Also, there's no real racism in America.\" My man said, \"woke DAs,\" dude. What are you saying?</p></blockquote> <p>Mr. Piker was plainly ridiculing the commentator's position. He was not endorsing it. The debate video remained visible behind him. Mr. Piker introduced the remarks with \"He said,\" laughed as he delivered them, and concluded by questioning the commentator's argument. His viewers understood the sarcasm. Some laughed along. Others expressly described his comments as hyperbole. Still others predicted that someone would eventually remove the context and circulate the resulting footage as though Mr. Piker had been speaking sincerely.</p> <p>That is precisely what happened. In August 2026, a 42-second video began circulating on social media that combined fragments of three separate Twitch broadcasts. The portions taken from Mr. Piker's October 2024 stream had been cropped, shortened, and rearranged. The underlying debate was removed from view. So was the contemporaneous audience commentary.</p> <p>The words \"He said,\" which identified the object of Mr. Piker's ridicule, were omitted. Mr. Piker's laughter and subsequent explanation were also removed. The resulting video portrayed sarcastic criticism of another as though it were an expression of Mr. Piker's own beliefs.</p> <p>On August 11, 2026, Mr. Jennings broadcast that false video on The Scott Jennings Show, misrepresenting the manipulated video as authentic. But Mr. Jennings did not stop at repeating someone else's misleading edit. He added his own caption to the video, presented as a direct quotation from Mr. Piker:</p> <blockquote><p>PIKER: \"LET'S GO BACK TO A BETTER TIME WHEN LYNCHINGS WERE HAPPENING\" …</p></blockquote> <p>Mr. Piker never said those words. The original broadcast does not contain that statement. Neither does the manipulated video that Mr. Jennings chose to air. Mr. Jennings converted a sarcastic question, expressly attributed to and directed toward someone else, into a patently false first-person statement of Mr. Piker's own supposed beliefs, and then relayed that false statement to his viewers.</p> <p>Mr. Jennings then went even further. After warning Black listeners to pay particular attention, Mr. Jennings accused Mr. Piker of \"calling for Black voters to be lynched\" and referred to \"the Piker plan of returning our country to lynchings.\" Later that day, Mr. Jennings published the same false accusation on social media, telling his followers that Mr. Piker believed the United States \"should resume lynchings against black people.\"</p> <p>These were not expressions of disagreement with Mr. Piker's politics. Nor were they rhetorical characterizations of an admittedly controversial commentator. They were factual assertions about what Mr. Piker had said and advocated in his work. Each statement was demonstrably false.</p> <p>The distinction matters. Mr. Jennings was free to criticize Mr. Piker, to condemn his political positions, or to argue that his commentary was offensive. Mr. Jennings was also free to play Mr. Piker's actual words, and provide his own commentary on what Mr. Piker actually said. Mr. Jennings was not free to do what he did: knowingly attribute to Mr. Piker statements that Mr. Piker never made, and then present those invented statements as evidence that Mr. Piker supports the racially motivated murder of Black Americans….</p></blockquote>"},{"title":"Mistral Says Its AI Model ‘Le Chonk’ Has Leapfrogged China in the Open-Weight Race","source":"Wired","author":"@wired","url":"https://www.wired.com/story/mistral-says-le-chonk-surpasses-chinese-models-cybersecurity/","category":"tech","categoryLabel":"Technology","wordCount":531,"readingTime":3,"content":"<p>A few weeks ago, French company <a href=\"https://www.wired.com/story/mistral-is-in-the-right-place-at-the-right-time/\" target=\"_blank\" rel=\"noopener\">Mistral</a> released an early version of its new <a href=\"https://www.wired.com/tag/artificial-intelligence/\" target=\"_blank\" rel=\"noopener\">artificial intelligence</a> model, nicknamed Le Chonk. At the time, the company said it was the <a href=\"https://www.wired.com/story/mistral-new-model-le-chonk-open-source-china-us-frontier/\" target=\"_blank\" rel=\"noopener\">most advanced open-weight offering outside of China.</a> After further refinement, Mistral now says Le Chonk is the “world’s best” open-weight model for automated coding and cybersecurity.</p><p>The advances, Mistral says, were made possible by feeding the model increasingly difficult cybersecurity and coding problems, which allowed the trillion-parameter Le Chonk to match or surpass models from leading Chinese labs like <a href=\"https://www.wired.com/tag/deepseek/\" target=\"_blank\" rel=\"noopener\">DeepSeek</a> and <a href=\"https://www.wired.com/story/zai-open-weight-ai-models-release-cybersecurity-hacking/\" target=\"_blank\" rel=\"noopener\">Z.ai</a>.</p><p>“It’s a pivotal moment in the global AI leadership race,” Pierre Stock, VP of science at Mistral, told reporters during a press briefing. “It offers frontier capabilities for enterprises and governments to defend against an increasing threat level in cyber.”</p><p>The finalized version of Le Chonk is now freely available for anybody to access. After a flurry of AI-related cybersecurity incidents, Mistral claims that it’s important for the West to have its own advanced open-weight models. “You have no guarantee that [Chinese models] won’t behave maliciously. They can be threat vectors,” Stock said.</p><p>The most high-profile episode occurred when one of OpenAI’s models <a href=\"https://www.wired.com/story/openai-sued-over-the-hugging-face-hack/\" target=\"_blank\" rel=\"noopener\">broke loose from a testing sandbox</a> and hacked into multiple companies over the summer. It sparked panic over the idea that AI could escape human oversight and be abused by threat actors to launch sophisticated cyberattacks. (One of the affected companies, <a href=\"https://www.wired.com/story/hugging-face-new-ai-biology-model-chat-with-dna/\" target=\"_blank\" rel=\"noopener\">Hugging Face</a>, used an open-weight model from China to assess and defend against the attack.)</p><p>Since then, AI has unearthed security vulnerabilities in ubiquitous software, too. In October, a raft of websites were <a href=\"https://www.bbc.co.uk/news/articles/cmly0lg3w5x2o\" target=\"_blank\" rel=\"noopener\">taken offline</a> after an AI tool <a href=\"https://www.wired.com/story/this-is-not-a-drill-2-php-vulnerabilities-are-setting-the-internet-on-fire/\" target=\"_blank\" rel=\"noopener\">discovered serious flaws</a> in a foundational piece of web technology.</p><p>Mistral pitches its open-weight models, like Le Chonk, as part of the solution. If AI is destined to become a central feature of both cyber offense and defense, the argument goes, businesses and governments will need to be equipped with models that are freely available and cannot be switched off remotely, unlike proprietary models from the likes of OpenAI, Anthropic, and Google.</p><p>“AI is going to be like electricity. You don’t want to live in a world in which your neighbor can cut off electricity from one day to another,” Stock said. “Once you open source the weights, they’re all over the internet. It’s impossible to cut off access.”</p><p>The trade-off, however, is that freely available models can also be downloaded and customized by threat actors.</p><p>“It’s clearly a dual-use technology,” Rafe Pilling, senior director of threat intelligence at security company Sophos, tells WIRED. “Anything that’s available to download and circulate unfettered has the ability to be abused as well as used for productive purposes.”</p><p>According to Pilling, though it’s possible a Chinese model with internet access could siphon away data, all advanced models are capable of going rogue without careful supervision—no matter their country of origin.</p><p>“The technical realities and the narrative—which often has a nationalistic leaning—are two different things,” he says.“It’s about having the right monitoring and controls in place to be confident that, even if the model was trying to be deceptive or nefarious, you might have some way of detecting it.”</p>"},{"title":"8-bit horror Tenebris Somnia mixes weird live-action horror with a retro 2D adventure to impressive and unsettling effect","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/tenebris-somnia-horror-game-fmv-live-action-faith","category":"gaming","categoryLabel":"Gaming","wordCount":746,"readingTime":4,"content":"<p>Have a little Faith.</p>\n    \n  \n  \n  \n  \n            <p>I've been captivated by the idea of wrong-footing an audience <a href=\"https://www.eurogamer.net/faith-the-unholy-trinity-is-the-scariest-8-bit-game-ive-played\" target=\"_blank\" rel=\"noopener\">ever since playing Faith: The Unholy Trinity</a>. That game presents like an 8-bit horror, then proceeds to bend the rules of what an 8-bit game can do - or perhaps what you remember they could do - in order to surprise and scare you. Tenebris Somnia is very similar. Indeed, it's executive produced by the developer of Faith, Airdorf Games, so the connection runs even deeper. Tenebris Somnia utilises the same retro aesthetic with its grinding chiptune music, its pixelated graphics, and old-school presentation. But the difference is it takes the rule-bending a step further, essentially welding two very different experiences together: a retro-styled 2D adventure and a full-on live-action film. And it's horrific, in all the right ways.</p>\n<p>To begin with, Tenebris Somnia is a slow, plodding, fairly unremarkable affair that plays a bit like a point-and-click adventure. You're a young woman on her way to her former boyfriend's apartment, checking it out because you suspect something has happened there. You move from screen to screen, examining points of interest as you pass them, collecting odds and ends - an empty bottle, a mysterious book - and storing them in your inventory for later. Eventually, there's a locked door, and you'll have to piece together the scattered clues in order to unlock it. And despite the apparent urgency of the situation - the carnage you find in your ex-boyfriend's apartment - the pace is slow; deliberately old-school in its approach. Walk back and forth, examine everything, try \"combining\" items in your inventory, \"use\" them on the environment. Did it work? No? Try something else.</p>\n\n<p>But this is where Tenebris Somnia begins to distinguish itself: your busywork is often rewarded with a glossy live-action sequence - clips of real actors in impressive costume and make-up enacting key moments from the unfolding adventure. A person with what appears to be two faces, one inverted, rushes out of the darkness toward you. A strange woman suddenly appears in a lift, offering you a gift. Two waxen figures embrace each other in bed. A giant lady with a hole in her face stretches towards the ceiling. It's captivatingly weird and very well-produced, finished with a level of polish that's impressive in an otherwise lo-fi indie experience such as this. And there's a reason for this: the live-action scenes are made by <a href=\"https://www.imdb.com/name/nm2795237/\" target=\"_blank\" rel=\"noopener\">filmmaker Andrés Borghi</a>, who's worked on a number of films including acclaimed Argentinian horror When Evil Lurks. <a href=\"https://store.steampowered.com/app/1431780/The_Black_Heart/\" target=\"_blank\" rel=\"noopener\">Borghi has also made games of his own</a>, so there's a natural overlap and understanding there.</p>\n\n<p>1 of 6 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>It's these live-action sequences that stand Tenebris Somnia apart, that bring another, unusual dimension to it. That pixelated creature rushing toward you in the hallway: it has more substance in your mind now you've seen it up close. That enigmatic lady in a cocktail dress: you know the contours of her face and the strange demonic symbols branded there. You know the world better, more intimately now, and that gives it more impact. These live-action moments also create a kind of propulsive anticipation, knowing that when you do solve a puzzle or unlock that mysterious door, lavish reward and revelation awaits you there.</p><p>But I have my doubts about the game overall. Granted, I'm only early on, so perhaps I'm yet to really settle in. But I find its plodding stop-start rhythm works against the suspense and horror. Laboriousness deflates the tension. Frequently revisiting areas robs them of their surprises. And I haven't found much inherent interest in exploring new areas of the game; the writing feels functional to me rather than intriguing, and that's a problem, because in the adventure game sequences it has to do so much of the heavy lifting.</p>\n<p>But I remain hopeful. I've watched a little more of Tenebris Somnia than I've managed to play, and the movie-making story at its heart - one focusing on a horror short of your ex's creation - appears to deepen and circle back on itself in interesting ways. Everything you do somehow seems tied to that movie - around deals with devilish entities and the grotesque consequences they bring. That filmic motif repeats again and again. And who knows? Perhaps the live-action sequences represent more than the things our character is experiencing. So there's intrigue there, depth, thought, layers, and, by the looks of it, plenty of imagination to support it.</p>"},{"title":"“Queen at Sea” Confronts Old Age with Bitter Empathy","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-front-row/queen-at-sea-confronts-old-age-with-bitter-empathy","category":"fun","categoryLabel":"Interesting Reads","wordCount":1118,"readingTime":6,"content":"<p>The writer and director Lance Hammer’s new feature, “Queen at Sea,” is both a worthy experience in itself and a sharp, if unintended, work of criticism in action: it’s the film that “<a href=\"https://www.newyorker.com/culture/the-current-cinema/fjord-keeps-the-faith\" target=\"_blank\" rel=\"noopener\">Fjord</a>” could and should have been. The latter movie, released earlier this month, considers a religious family living in Norway, who endure intrusive legal inquiries and interventions when teachers suspect the parents of inflicting corporal punishment on their children. “Queen at Sea” similarly confronts the intervention of government authority into private lives. It’s the story of an elderly woman in London, Leslie (played by Anna Calder-Marshall), who has dementia, and whose similarly aged husband, Martin (Tom Courtenay), is caught having sex with her by Leslie’s daughter, Amanda (Juliette Binoche). Certain that Leslie is unable to consent, Amanda demands that Martin promise never to have sex with her mother again. Martin refuses, so Leslie calls the police—only to scare him, she later admits, but by then it’s too late. Her call instantly sets a criminal investigation into motion, Martin is arrested, and the household becomes the subject of scrutiny by police and social workers.</p><p>Unlike in “Fjord,” which never shows the corporal punishment, however mild, that even the parents avow, “Queen at Sea” explicitly, mere minutes into the movie, shows the sex act as Amanda witnesses it. Hammer honorably and with sincere curiosity puts the family’s own experiences and principles, their ethics and their knowledge, to the test in the face of the power of law. Two officers arrive, and they follow procedure: they seal off the couple’s bedroom as a crime scene and report the case to their superiors, who order technicians in hazmat suits to collect the pair’s bedding and dispatch a sex-crime investigator who insists that Leslie be brought in for a medical examination. For Leslie, who is only vaguely aware of her surroundings, the intimately intrusive procedures are an unbearable ordeal.</p><p>Martin, for his part, rejects the premise of Amanda’s outrage: he contends that Leslie, though severely impaired, is nonetheless aware of his identity and presence and, indeed, initiates sex with him. Leslie’s impairment is, in fact, variable; at times, she speaks, tersely but sensibly, and her actions often clearly express reasonable preferences. The elderly couple’s relationship is tight and tender. Leslie has a regular set of daily activities with Martin and hews closely to them (for instance, leading him on their daily walk). When the authorities insist they be kept apart at home, she persistently and unambiguously returns to him.</p><p>There’s nothing manospherical or ideological about Martin’s insistence on maintaining sexual relations with Leslie. He’s neither ignorant nor dismissive of the notion of consent; rather, by the nature of his privileged relationship to her, he sincerely and respectfully believes that she has consented. What’s more, the movie puts evidence of this onscreen, although Amanda argues that Leslie is merely reverting to pre-rational and primal instinct. Martin may appear self-serving, but he is also intensely and finely attuned to Leslie and to the gestures and facial expressions by which she communicates. He refuses to rule Leslie outside the pale of connection and consciousness. His belief in her consent and even desire is inseparable from his unwillingness to let go of her and of the mutual bond of their shared life.</p><p>Hammer catches decisive moments with understated but telling precision, thanks to the cast’s deeply committed and finely tuned performances (especially Calder-Marshall’s astoundingly infinitesimal transformations and Courtenay’s carefully calibrated fury). During the initial police visit, one of the officers admits to his colleague that he has no idea what to do. (They proceed to do what they’re trained to do: call in the complaint and set the mighty and implacable machine into motion.) After the couple’s sheets and blanket have been confiscated as evidence, Leslie insists on returning to her bed and lies down on the bare mattress. A risk assessor examining the house ruefully considers the height of the stairs, although Leslie, who has lived there for ages, apparently manages them fine, many times a day. Such details capture how bureaucratic power—its inflexible procedures and constraints—have changed the fundamental order of things. Hammer moves stepwise through the drama, sticking to its beats and not delving into its interstices. His cinematic gaze at the couple is fine, patient, and nuanced, though it doesn’t reach the obsessive intimacy and scorched-earth terror of Gaspar Noé’s 2022 film “<a href=\"https://www.newyorker.com/culture/the-front-row/vortex-reviewed-old-age-has-never-seemed-grimmer\" target=\"_blank\" rel=\"noopener\">Vortex</a>”.</p><p>The result is a movie that, rather than digging beneath the surface of its machinelike relentlessness, adorns it with literary conceits, above all, its ongoing parallels of three generations of women: Leslie, who has a deeply devoted husband; Amanda, who’s separated from her husband; and Amanda’s daughter, Sarah (Florence Hunt), a teen-ager exploring first love with a classmate named James (Cody Molko). Amanda and Sarah live in Newcastle, where Amanda is a tenured professor; they’re just in London for a year on Amanda’s sabbatical, staying in a barely furnished apartment. Such incidentals get in the way of several more fundamental and analytical details. Instead of the sweet sentimentality of Sarah’s romance, the story practically calls out for its details to be refracted through her sensibility, and that of her generation, in conversation with James and her other friends. (A well-crafted but brief scene in which she broaches the matter with her mother only hints at her unexplored bewilderment.) Moreover, it’s inconceivable that, having been arrested and possibly facing charges, Martin wouldn’t consult a lawyer, yet no lawyer is involved. Furthermore, in a film where the legalities of consent are central, a lawyer’s presence would not only clarify Martin’s risks and possible strategies but also look more broadly at the drama’s emotional, intellectual, and political ramifications. (Plus, a pet peeve: in a pair of scenes, Amanda writes, but what is she writing?)</p><p>Still, Hammer shrewdly directs his attention throughout to the inner ravages and outer indignities wrought by Leslie’s affliction, including with the horrifying banality of one possible imposed solution: removal to a care facility and the enforced separation from her husband that this would entail. Where “Fjord” is full of leering political nudges, manipulative sentimentality, and tacit denunciations under the guise of ostensible objectivity, “Queen at Sea” is, at its core, a tragedy. It depicts not a conflict between right and wrong but between two apparent rights—two truths and two forms of justice that are irreconcilable, incompatible, contradictory, and mutually exclusive. For all the film’s distractions, omissions, and short-circuits, Hammer displays a keen eye for devastating ironies, for clearly and plainly imagined events that don’t merely turn the tables but overturn them. The modest candor of his approach is all the more noteworthy for the far-reaching and unsparing world view that it invokes. ♦</p>"}];
var currentIndex = 0;

function render() {

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
