<script>
var articles = [{"title":"Bolstered by Switch 2 sales and The Legend of Zelda: Ocarina of Time remake's reveal, Nintendo of America COO promises: \"This is just the beginning\"","source":"Eurogamer","author":"Dom Peppiatt","url":"https://www.eurogamer.net/switch-2-sales-ocarina-of-time-just-the-beginning","category":"gaming","categoryLabel":"Gaming","wordCount":622,"readingTime":4,"content":"<p>Hyper Link.</p>\n    \n  \n  \n  \n  \n            <p>Nintendo is having a pretty good time of it at the moment. Last year, we learned that the <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a> became the fastest selling video game hardware device in US history, <a href=\"https://www.eurogamer.net/switch-2-has-become-the-fastest-selling-video-game-hardware-device-in-us-history-usurping-the-ps4\" target=\"_blank\" rel=\"noopener\">usurping the PS4's golden record</a>. Then, earlier this year, we learned that Switch 2 sales reached<a href=\"https://www.eurogamer.net/nintendo-switch-2-sales-forecast-fy2027\" target=\"_blank\" rel=\"noopener\"> nearly 20m almost one year after release</a>, making it <a href=\"https://www.eurogamer.net/us-hardware-sales-may-2026-ps5-xbox-switch\" target=\"_blank\" rel=\"noopener\">the second-fastest selling console in US history</a>. Buoyed by <a href=\"https://www.eurogamer.net/pokemon-pokopia-5m-sales\" target=\"_blank\" rel=\"noopener\">the runaway successes of games like Pokopia</a> and other first-party hits, not even the reality of <a href=\"https://www.eurogamer.net/switch-2-production-ramps-up-march-2027\" target=\"_blank\" rel=\"noopener\">a hardware price rise</a> seems to be hobbling Nintendo's momentum.</p>\n<p>And it seems the company is keen to keep this pace up. \"We're at the beginning of Nintendo Switch 2,\" says <a href=\"https://www.eurogamer.net/companies/nintendo-of-america\" target=\"_blank\" rel=\"noopener\">Nintendo of America</a> COO, Devon Pritchard in an interview with <a href=\"https://variety.com/2026/gaming/news/nintendo-america-president-switch-2-zelda-anniversary-1236866097/\" target=\"_blank\" rel=\"noopener\">Variety</a>. \"This is just beginning and we've already had some really wonderful experiences, both ours and third-party come to the table and I can't wait to see what the system is going to do and what our talented developers will bring to the table.\"\r\n</p>\n\n<p>She goes on to point out that the publisher's success isn't just in hardware and software, but in Nintendo's recently acquired popularity at the box office, too. \"We're working with Sony Pictures. We are going to have a movie come out in the end of April,\" she notes, referring to The Legend of Zelda. \"We're very excited about that\". No doubt; Nintendo and Illumination <a href=\"https://www.eurogamer.net/the-super-mario-galaxy-movie-one-billion-box-office\" target=\"_blank\" rel=\"noopener\">earned $1bn from The Super Mario Galaxy Movie</a> at the last count, pulling in a third of that ($372.6m) <a href=\"https://www.eurogamer.net/the-super-mario-galaxy-movie-opening-weekend-box-office\" target=\"_blank\" rel=\"noopener\">in the opening weekend alone</a>.</p><p>Whilst Pritchard is certainly excited about the games the company has on the docket - she namechecks <a href=\"https://www.eurogamer.net/games/the-legend-of-zelda-ocarina-of-time\" target=\"_blank\" rel=\"noopener\">The Legend of Zelda: Ocarina of Time</a>, specifically - it seems her eyes are drawn more readily to the film partnerships. \"But again, those partnerships and touchpoints with companies like Sony and Sony Pictures around how we can bring those experiences more broadly to not only our current players and fans but to new ones,\" she says, \"I think that's one of the most exciting things for us over the next few years.\"\r\n</p>\n<p>Safe to say, then, that Nintendo is putting a lot of effort into its expanding cinematic world. The last we heard about the next big project - The Legend of Zelda film <a href=\"https://www.eurogamer.net/the-legend-of-zelda-film-trailer-first-look\" target=\"_blank\" rel=\"noopener\">which is just called \"The Legend of Zelda\", sans subtitle</a> - was in a dedicated Zelda Direct at the beginning of September. We've not even seen a proper trailer yet, but we know that <a href=\"https://www.eurogamer.net/as-the-project-begins-production-it-looks-like-the-legend-of-zelda-film-is-following-in-lord-of-the-rings-esteemed-footsteps\" target=\"_blank\" rel=\"noopener\">the initial shoot has wrapped filming in New Zealand</a> (after starting the shoot <a href=\"https://www.eurogamer.net/as-the-project-begins-production-it-looks-like-the-legend-of-zelda-film-is-following-in-lord-of-the-rings-esteemed-footsteps\" target=\"_blank\" rel=\"noopener\">in October 2025</a>). So here's hoping we see some footage of the final product soon. </p>\n\n<p>1 of 34 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>\"There are more channels for content than ever before,\" Pritchard concludes when asked about how Nintendo plans to stand out in a media landscape more competitive than ever before. \"Content is available 24/7. So I think you hear a lot of times, people saying, we are competing for consumers' time and I think what's unique is that Nintendo is focused instead on building experiences that create relationships that last generations. And I think that's a different kind of focus for us. But that really is where we put our time and our energy... how do we create those fun experiences? And that becomes the test: is something fun? It sounds simple, of course it's not.\"</p><p>Lets see if the company's belief in its product and audience lasts through the current industry woes; the combination of an industry crunch, rising hardware prices, and lower consumer spend <a href=\"https://www.eurogamer.net/japan-game-development-layoffs-exec-money\" target=\"_blank\" rel=\"noopener\">is having a pretty disasterous effect elsewhere</a> - but it seems Nintendo is so far weathering the storm. \r\n</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n      <p>\nAwaiting cover image      </p>"},{"title":"The decision before the decision","source":"SCOTUSblog","author":"Taraleigh Davis","url":"https://www.scotusblog.com/2026/09/the-decision-before-the-decision/","category":"law","categoryLabel":"Law","wordCount":1498,"readingTime":8,"content":"<p>On Friday, Aug. 21, Chief Justice John Roberts issued an administrative, or temporary, stay, allowing construction to continue on the White House ballroom. The order put on hold a district court injunction that would have halted work by midnight, and it explained nothing, staying the injunction “pending further order.” Ten days later, the court <a href=\"https://www.scotusblog.com/2026/08/supreme-court-allows-construction-on-white-house-ballroom-to-continue/\" target=\"_blank\" rel=\"noopener\">concluded</a> that the challengers to the ballroom likely lacked standing to sue. Roberts dissented, joined by the three Democratic-appointed justices. In other words, the justice who froze the injunction actually voted against the party he froze it for.</p><p>Explainers written that weekend told readers not to read anything into Roberts’ initial order. An administrative stay, <a href=\"https://time.com/article/2026/08/23/the-supreme-court-let-trumps-ballroom-proceed-for-now-heres-what-that-means/\" target=\"_blank\" rel=\"noopener\">TIME wrote</a>, does not reflect a case’s outcome. ABC News <a href=\"https://abcnews.com/Politics/supreme-court-chief-justice-allows-construction-white-house/story?id=135846623\" target=\"_blank\" rel=\"noopener\">described the order</a> as taking no position on the government's appeal. </p><p>That is the standard narrative, and it may be right. But it is an empirical claim, and as far as I can tell, nobody has tested it. So I did. The answer matters beyond the ballroom. An administrative stay decides what does (or doesn’t) happen while the Supreme Court makes up its mind, and it can be the first public sign of how seriously the court is taking an application.</p><p>So how often do the justices issue an administrative stay in a case before deciding it, and does this tell us anything about what comes next?</p><p><strong>The tools of the circuit justice</strong></p><p>When a party asks the Supreme Court for emergency relief, the application does not go to the full court. It goes to a single justice, the one assigned to the federal circuit the case comes from. Roberts <a href=\"https://www.scotusblog.com/2026/08/supreme-court-allows-construction-on-white-house-ballroom-to-continue/\" target=\"_blank\" rel=\"noopener\">handles</a> the U.S. Court of Appeals for the D.C. Circuit, which is why the ballroom application landed on his desk on Aug. 13.</p><p>The circuit justice then has options. He or she can act on the application alone; if the justice denies it in chambers, as Justice Brett Kavanaugh did <a href=\"https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/26a304.html\" target=\"_blank\" rel=\"noopener\">recently</a>, the court’s rules let the applicant renew the application to any other justice. If they decide to refer the case to the full court, the circuit justice has two tools before doing so.</p><p>The first is a request for a response, an order directing the parties to file a response by a set date. (In the ballroom case, for example, Roberts requested a response by noon on Aug. 18.) And that might be the last thing parties hear from the court before its decision. Indeed, for much of the emergency docket’s history, the justices frequently ruled on an application with nothing before them but the applicant’s papers and the record below.</p><p>The second is the administrative stay, sometimes called a temporary stay: a short freeze of the lower-court order to preserve the status quo. In this case, the temporary stay issued by Roberts on Aug. 21 came hours before the D.C. Circuit's mandate would have halted the cranes.</p><p>Neither order contains reasoning or a legal test. When the full court decides whether to grant a stay, it asks whether it is likely to take up the case and reverse, and whether the parties will suffer irreparable harm in the meantime. No comparable standard governs when a circuit justice requests a response or issues a temporary stay, at least not one the court has announced. That is why the explainers above told readers to read nothing into Roberts’ order. But these orders get read as tea leaves anyway, because they are the only thing the court has said.</p><p>My dataset of emergency applications can help determine whether the tea leaves actually mean anything. The figures that follow cover 476 substantive applications resolved by the full court from the 2000-01 term through the 2024-25 term. They exclude execution-related applications, which follow their own rhythms, and refiled applications. (The ballroom case belongs to the current term and is not in these numbers. It will be in the new stat pack <em>coming next month!</em>)</p><p><strong>How often does this happen?</strong></p><p>Let’s start with the response request, which has quietly become the norm. By the mid-2010s the court requested a response in roughly three quarters of substantive emergency applications. In the 2023-24 term it did so a striking 98% of the time, and in the 2024-25 term, 93%. Nothing in the court’s rules requires this. The other side responds when the justice asks it to do so, and they now ask almost every time.</p><p>The administrative stay is a different story. Of the 476 applications, only 59 drew one, about 12%, with no clear trend over time. (The temporary stay also almost never travels alone: 53 of the 59 came alongside a request for a response.)</p><p>Applications that drew both orders took a median of 13 days to resolve; applications that drew neither took a median of two. The administrative stay thus manages things in the meantime by keeping the lower court order from taking effect while the Supreme Court hears from the other side.</p><p>That may sound like simple housekeeping. But deciding what stays in place during the wait is a real decision with real consequences. In the ballroom case, the injunction from the lower court would have stopped construction at midnight. Roberts’ temporary stay meant work continued for the 10 days it took the Supreme Court to decide on the emergency application. Some things, like a building going up, a person being removed from the country, or federal funds being spent, are hard to undo afterward.</p><p><strong>But do they predict anything?</strong></p><p>Applications that received an administrative stay obtained relief (their emergency request was granted) 54% of the time. Applications that did not obtained relief only 34% of the time. The odds of winning relief after a temporary stay were thus more than twice the odds without one.</p><p>I think it is worth asking whether something other than the temporary stay is producing that gap in grants of relief. There are two possibilities here. The first is timing. Response requests became routine over the same 25 years, so cases with temporary stays and those without might simply be drawn from different eras. Limiting the data to the 2015 term forward puts every application on the same footing, and the gap holds: 57% are successful with a freeze against 40% without. The second possibility is that the response request is the real tell. But, comparing only among applications where a response was requested, the temporary stay still separated the winners from the losers, 55% against 38%.</p><p>The temporary stay in a case also predicts how much the court will say. Applications with an administrative stay produced a written opinion 27% of the time; applications without one, 10%. (Dissent rates, for what it is worth, barely differed.)</p><p>The ballroom case fits the pattern: there was a temporary stay, a response requested, an application granted, and a written opinion issued. And Roberts’ own dissent supplies a caveat. The temporary stay tracked what the court did, not how the circuit justice voted. Nor is this unprecedented: Justice Samuel Alito froze both the <a href=\"https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/22a901.html\" target=\"_blank\" rel=\"noopener\">mifepristone litigation</a> and <a href=\"https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/23a243.html\" target=\"_blank\" rel=\"noopener\"><em>Murthy v. Missouri</em></a> in 2023, the court granted relief twice, and Alito dissented both times.</p><p><strong>Is this a Roberts thing?</strong></p><p>No. What follows are rates among applications presented to each justice, limited to justices with at least 15. (Three current justices, Neil Gorsuch, Ketanji Brown Jackson, and Amy Coney Barrett, do not yet have enough presented applications to include, a function of how recently they joined the court rather than anything about how they’ve ruled.)</p><p>Alito issued administrative stays in 23% of the applications presented to him, and Roberts in 16%. At the other end is Justice Elena Kagan at 3%, two temporary stays across 59 applications, the third-largest caseload in the data. Kagan requested responses in 92% of her applications, essentially Alito’s rate. The two justices use one tool the same and the other completely differently.</p><p>By subject matter, administrative stays clustered in cases about judicial power and due process. Judicial power cases carry the highest relief rate of any category, at 62%. Civil rights applications drew a temporary stay just 5% of the time across 94 applications.</p><p><strong>The takeaway</strong></p><p>The explainers noted above were right that an administrative stay is not a ruling on the merits, and it doesn’t tell you how the justice who issues one will vote, as Roberts’ own dissent shows. But it would be wrong to conclude that it tells you nothing. Over 25 terms, applicants who received a temporary stay went on to win relief more than half the time; applicants who did not won about a third.</p><p>Most of what we focus on and know about the emergency docket comes from its results: which applications the court grants, which it denies, and who dissents. But the docket contains more than outcomes. It records the steps the court takes to get there, and those steps in turn can reveal what is most likely to follow.</p><p><strong>Recommended Citation: </strong>Taraleigh Davis, <em>The decision before the decision</em>, SCOTUSblog (Sep. 23, 2026, 9:30 AM), https://www.scotusblog.com/2026/09/the-decision-before-the-decision/</p>"},{"title":"Top Motley Fool Promo Codes for 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/the-motley-fool-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1042,"readingTime":6,"content":"<p>The Motley Fool is the O.G. stock and investment advice website, dating back to the early days of the Internet, <a href=\"https://www.hotwired.com/\" target=\"_blank\" rel=\"noopener\">when WIRED’s website was still called hotwired.com</a>. It started as a tip sheet in the early ‘90s by brothers Tom and David Gardner, and it rode a wave of hype to become a cult phenomenon, viewed with equal interest and skepticism by the established investment class. Thirty years and a whole bunch of books later, The Motley Fool now feels like the established investment class, with a Stock Advisor subscription service offering stock tips that were shown in <a href=\"https://www.researchgate.net/publication/321057021_Evaluating_the_performance_of_the_Motley_Fool's_Stock_Advisor\" target=\"_blank\" rel=\"noopener\">a 2017 study led by Penn State</a> to consistently beat the S&amp;P 500.</p><p>Subscriptions to the basic Stock Advisor tips are quite reasonable on a weekly basis, but more and more. With this valuable tool, Motley Fool lays out all the information you’ll need, including employer-sponsored plans, individual retirement accounts, and plans for self-employed individuals and small business owners.</p><h2>Secure Your 30-Day Money-Back Guarantee on All New Plans</h2><p>Most Motley Fool plans offer a <a href=\"https://www.fool.com/legal/terms-and-conditions/\" target=\"_blank\" rel=\"noopener\">30-day money-back guarantee on the membership fee</a>. This is not enough time to decide whether the stock tips have panned out, of course—but it is enough time to determine whether you think you’ll find the service useful and whether you’ll actually use it. This guarantee applies to most Motley Fool promotional offers, including the Motley Fool stock advisor promo code 2026 deals.</p>"},{"title":"Is Trump’s Latest Press Attack Just Another Distraction?","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/is-trumps-latest-press-attack-just-another-distraction","category":"fun","categoryLabel":"Interesting Reads","wordCount":719,"readingTime":4,"content":"<p>In November, 2018, the day after midterm elections that went badly for the Republican Party, <a href=\"https://www.newyorker.com/news/q-and-a/jim-acosta-describes-why-he-attacks-trump\" target=\"_blank\" rel=\"noopener\">Jim Acosta</a>, then a White House correspondent at CNN, questioned President Donald Trump about his messaging on immigration. Things quickly got heated. “I think you should let me run the country—you run CNN,” Trump interjected. “If you did it well, your ratings would be much better.” Trump tried to move on, but Acosta wouldn’t yield, even as an aide walked over to take away the microphone. Trump wasn’t done insulting him yet, either. “When you report the fake news, which CNN does a lot,” he said, “you are the enemy of the people.” Hours later, Sarah Huckabee Sanders, the White House press secretary, announced the suspension of Acosta’s press pass, and, for good measure, falsely accused him of <a href=\"https://www.newyorker.com/news/current/the-white-houses-video-of-jim-acosta-shows-how-crude-political-manipulation-can-be\" target=\"_blank\" rel=\"noopener\">manhandling the aide</a> who wanted the mike back. The episode was a big deal—a veteran <em>Times</em> reporter said that he’d not seen anything like it in more than two decades on the beat—but some pundits argued that Trump had manufactured it as a distraction, not only from the midterms, but from his decision, earlier in the day, to fire Jeff Sessions, his first Attorney General. Online, one commentator praised CNN for continuing to focus on that story amid Acostagate, warning that Sessions’ ouster could touch off a “constitutional crisis.”</p><p>Late last week, just shy of another round of midterm elections that seem poised to go badly for the Republican Party, Trump wrote on Truth Social that he would be barring all of CNN from the White House, along with MS NOW and <em>Politico</em>, “as a result of their constant ‘reporting’ FAKE NEWS!” (“Other Fake News Media Outlets to follow,” he added.) This, too, was a big deal, but, once again, various observers suspected that Trump was trying to shift focus from more pressing problems, such as <a href=\"https://www.newyorker.com/news/q-and-a/how-the-war-in-iran-is-transforming-the-global-economy\" target=\"_blank\" rel=\"noopener\">the war in Iran</a>. “He’s trying to distract the public from the serious political trouble that he’s in right now,” one commentator told <em>New York</em>. “My concern is he’s kind of laying the groundwork to put the country through yet another constitutional crisis.”</p><p>History repeats itself, each time as farce—though, of course, some things do change. Back in 2018, MS NOW was still MSNBC and Truth Social did not exist. Acosta, for his part, has since left CNN and struck out on his own, taking advantage of <a href=\"https://www.newyorker.com/news/fault-lines/the-resistance-will-be-fragmented\" target=\"_blank\" rel=\"noopener\">the fragmenting media landscape</a> to cultivate audiences as a commentator on <a href=\"https://substack.com/@jimacosta\" target=\"_blank\" rel=\"noopener\">Substack</a> and <a href=\"https://www.youtube.com/@jimacosta\" target=\"_blank\" rel=\"noopener\">YouTube</a>; indeed, it was he, in this capacity, who warned <em>New York</em> about Trump laying the groundwork for <a href=\"https://www.newyorker.com/news/q-and-a/why-constitutional-crisis-fails-to-capture-trumps-attack-on-the-rule-of-law\" target=\"_blank\" rel=\"noopener\">a constitutional crisis</a>. And, if Trump’s latest media ban is in part a distraction tactic, Acosta suggested that a looming constitutional crisis might no longer be the thing he’s aiming to distract <em>from</em>. As we have learned since 2018, Trump doesn’t fear crying havoc from center stage, klieg lights on.</p><p>Hindsight is 20/20, and the perception of Trump as the distracter-in-chief has, perhaps, always been an oversimplification; he may get too much credit for his powers of misdirection, or, at least, for their deftness and intentionality. In places, this framing persists—addressing the latest media ban, the <em>Times</em> editorial board characterized the President as “a master manipulator of public attention”—and yet, increasingly, it feels as if the attentional capture that should trouble us most is his own. Over the summer, “<a href=\"https://www.amazon.com/dp/1668067242\" target=\"_blank\" rel=\"noopener\">Regime Change</a>,” <a href=\"https://www.newyorker.com/magazine/2026/07/06/chronicle-of-a-disaster-foretold\" target=\"_blank\" rel=\"noopener\">a book by the <em>Times</em> reporters Maggie Haberman and Jonathan Swan</a>, portrayed Trump as stuck inside a warped information bubble. <a href=\"https://www.newyorker.com/culture/critics-notebook/what-natalie-harp-carries\" target=\"_blank\" rel=\"noopener\">Natalie Harp</a>, an aide known as the “human printer” for reasons that should be clear from context, has been identified as a key conduit to the President, and, sure enough, it was reported over the weekend (by, who else, CNN) that Harp had been showing Trump news clips—including, apparently, a displeasing graphic from <em>Politico</em>—right before he brought the hammer down. (Asked later about the timing, Trump replied, helpfully, “No reason,” before citing “cumulative stories over the last two years.”) Other Trump advisers were reportedly blindsided by the ban, which wasn’t announced by the White House press secretary, as was the case with Acosta in 2018, in no small part because there currently isn’t one. If there had been, some have speculated, he or she may have talked Trump down.</p>"}];
