e on all this tech and even more below.</p><h2>$20 Off Your First Order With Our HP Promo Code</h2><p>HP offers a $20 discount right off the top of your order if it’s your first time buying from HP.com. While you can’t use it in addition to the other coupons, it might be a better discount if you’re purchasing something less expensive. To get this HP promo code, your order has to be $65 or more though (before taxes and shipping), and it requires signing up for the HP newsletter.</p><p>This HP promo code is valid for a month after subscribing to the newsletter and is restricted to one per customer. If you aren’t planning to spend too much and it’s your first time buying from HP.com, this could be the way to go.</p><p>HP</p><h3>HyperX Cloud Alpha Wireless</h3><p>HP</p><h3>OmniBook 5</h3><h2>Top HP Coupons: Laptops for Work, School, and Everyday Use</h2><p>One of the best <a href=\"https://www.wired.com/gallery/best-laptops/\" target=\"_blank\" rel=\"noopener\">laptops</a> for work is the <a href=\"https://cna.st/affiliate-link/53NXSZk29WKfLXErMjDQJWvGUR6sEvLc7ByQ6joUvhy9FciHn4DhVqdpUdUcabcVxbHtafUCQnbfM7v49uYocau8fEa8t3FR39RWs43axKg75ctuWemNBfrq5rJZEURPoFLumT6FsLDBfikopZutwdw1Kt6KD4GnJnzxJWeQUVL7j67n51687bnwH6HZnsEbh5Sqxb17unWgFCDGF9sgUuUyDaCiJCsXg59537mcgugB4X5ojotN6Kt1fa56Ho1G8NgZpr4nsj4VdJjb7Aw2CJkHvGVRgMGtBmatbZKKwU7BxUg9Yc8D4GzDKrikjmjLcUXihfE7rTQPg6BaGJRNyd86NdW9RRu1vUTSgYeAz7CuV75WE4nsmKAdLdxPVXdw\" target=\"_blank\" rel=\"noopener\">HP ProBook 4 G1</a>, which is now only $501, a whopping 78% discount. We love the <a href=\"https://cna.st/affiliate-link/2QKuUE9XrFFhyh4bkqf362Br7uQnmTwbKkS3pf3d9ZWtPKnr5CB3ppniRjyBhYYH4SkVaVeVT4R3pSkbs7sar2yMQVTLREQ7RJqPFznq7LpqNrXbR4CcXmYPnTrq5rqXm69ZPMmy7m9beDhxS6oK8KDYY5GxxcBQg4ptwaabXje5RtvExbxuckdLUqf9MREMzbB7bNL52aLGqc6UKwkbxsAz4QCr9DWktvp71uawxYyy5jwBVtPkxN5RmhrX6Dx2wbV847Chc8NbGVWe8jTzX5QRuJqumV2JSm5G9ezhF1BFzD2Q3eTzKHgcjVqXBdwcLXPYTvU5ktm\" target=\"_blank\" rel=\"noopener\">HP ZBook Fury 16 G11 Mobile Workstation PC</a> for school, now $1,509 at 63% off, and a great laptop for everyday use is the <a href=\"https://cna.st/affiliate-link/RxYrVJ2FDJxYNvUJZKwdHNii7oUf121vZmmC2obyKYThhxX9Zge8EtsvKbihya1EVNc9R5GxkL9yjA4gNVDaZT7gnaf3eDoxbtZAgu9UxmFPLn97TdVo66o2947FhtdtnTnMyj5azkKwj8ACZVSsp3bmDAHksw5MhydJaFTepeMhx2xWQjYCnqYigPqv2oKVtYgku6WoLRhjUL9AbcTE3u1djbqp97MYFzSxg1p2upe6sgCSXXKgPKtfbZiAQ1MifnVjTTDw1Du9CysbtuESMjU78EU7gc8PoGxGgE6FbPXKTh6Euvjyd5DXZaVu9f\" target=\"_blank\" rel=\"noopener\">HP Laptop 17t-cn300</a>, now only $300 (66% off).</p><p>HP</p><h3>OmniBook 5</h3><p>HP</p><h3>Omnibook 3 (2026)</h3><h2>HP Instant Ink: Get 50% Off With This HP Deal</h2><p>Printers are super handy, but one of the most annoying and expensive investments you make for it is the upkeep of ink and toner. Well, the good news is that you can save up to 50% on ink right now! With <a href=\"https://cna.st/affiliate-link/nntVzjQ3JMLounNPYNrETBFpnx1VA7KTTdFY2v3FEq9o5tvzKhipnnpZJGT8FyweytT1BmUfDWFqjLShguywdw24Le4mxJ7q9DDtdJLwjg8siofZeLEddRVUuvQny7d3MD5wFP9E6Anax8ZRGbegUywG4HTFDkVTjqoZuRG911m92raDBXrdafqdHpsYAmoCEvWG6jwRYAWVYuujDnsCWAzQAHuXL4wEQfHAytsDSYmwSrJYBtWWuN34MGqpPnJTWgunG7zBTmAqkXSRToh3M1ETNeE47J8b6vmQ8akD\" target=\"_blank\" rel=\"noopener\">HP Instant Ink</a>, you can save time and money with this subscription service that automatically delivers ink only when you're running low, with plans starting at less than $2 a month.</p><p>HP</p><h3>Color LaserJet Pro MFP 3301sdw</h3><p>HP</p><h3>OfficeJet Pro 9125e</h3><h2>Join the HP All-In Plan Printing Subscription to Save</h2><p>We all know printing is somehow one of the hardest at-home tasks we still have to do, with printers oftentimes not keeping up with the leaps and bounds contemporary technology has made. HP is hoping to change all of that. <a href=\"https://www.hp.com/us-en/all-in-plan/printers.html?jumpid=in_us_sup_st_hh_cm000003_co_x_footertile240910-aa\" target=\"_blank\" rel=\"noopener\">The HP All-In Plan</a> is a convenient, stress-free printing subscription that fulfills your printing needs with just a monthly payment. The subscription includes a brand-new printer, automatic ink delivery, an option to add automatic paper delivery, and with live support. Plus, if your printer breaks or has an issue that support can’t fix, HP will send you a replacement the next business day for free. You can try the service for 30 days for free.</p><h2>Save More: HP Smart Ink</h2><p>At-home printers are such a huge headache. When all other home office tech seems to be living in 2087, clunky, difficult printers seem to be stuck in 1987, with constant jams, errors, and finicky ink. The <a href=\"https://cna.st/affiliate-link/4NeJabgQykde13qrmPRuhidu9SxXHSLRy4sba59DzJ8w8H9SMXbinJgihfR2RN8oNrFdmNVBUobx7o8QAd6YUgsgSEsb9a2ScHdQcGoTuj8q2cVyXxkupyyvvCdKZi5H8NQFMh9vBpgJjd67a4U6CDb4LcQauKMVHBQ5TWJ34diTBcDaHvuWCipQfmQMF4v8FgrvtPvYqAV3PcNQXfE4F2kFcKpDKJ3ipyLQYjjVGnTyTMLz4uuo1V37PJUbnqQk7q3U81YFjRvXNsk7P4cG1dGiEoUUAFqzRJ2MaJwakM9dBZqwrNezHU2FdaFCsH3UXxDPuPDqeJmobzqMKuwXnLfWQUapJsSP6M\" target=\"_blank\" rel=\"noopener\">HP Smart Tank</a> printers are refillable, cartridge-free ink tank printers that deliver reliable, low-cost, high-volume printing that lasts for years. With these HP Smart Ink printers, you’ll no longer have to worry about refilling cartridges or constant low ink notifications. Welcome to the future.</p><h2>Save 40% on Tech With the HP Student Discount</h2><p>If you’re a student—or a parent to a student, teacher, school faculty, or university staff member—you’re in luck. HP is offering a serious 40% off discount on all kinds of tech, including laptops, desktop PCs, printers, and accessories. All stuff you’ll need for school, of course.</p><p>HP rebranded its laptops in 2024, introducing the OmniBooks into the world, including the premium HP OmniBook Ultra Flip. Powered by Qualcomm’s Snapdragon X chips and a killer OLED display, the OmniBook Ultra Flip would be a <a href=\"https://www.wired.com/gallery/best-laptops-tablets-for-students-school/\" target=\"_blank\" rel=\"noopener\">great laptop for college</a> thanks to its long-lasting battery life, especially with a 40% discount for students or teachers.</p><p>It’s not just laptops though. The <a href=\"https://cna.st/affiliate-link/MqMVDRsypCNABGWG8LuZ112B2LUqDsQFyncNtZPoKiTwMjBD4LJLCQvkXAXhZ2WYrNJdVNd6LdGwt9tmWjS8Se3umVw6hMoUMBc1BbasbdebX2ZLQvWm271u55RbYxYrVqHps7LgJk6YCM6ukX1Ws66poSze5tnWLnaMnrJjsmYPMerVy3DBPBo4oTucbazBqM4iuajyRQephVA2aiUCcrZ1kPyMjh24WmvGsis5FHfUn3JLixeqWuH28iNS5vWd94BsksREqrRnghvepFNczghEorxzEgiy?xid=fr1748372659621bja\" target=\"_blank\" rel=\"noopener\">HP Education Program discount</a> applies to desktop PCs, printers, and tons more qualifying products.</p><p>HP’s OmniBook Ultra 14 is one of the best alternatives to the MacBook Air you can buy right now, and it’s more affordable than many of its Windows competitors.</p><h2>HP Military Discount: Get 40% Off the Latest Tech</h2><p>HP offers more than just a standard military discount. The company’s exclusive military discount is extended to support active service members, veterans, and their families, but also healthcare workers and First Responders.</p><p>If you belong to any of those groups, the <a href=\"https://cna.st/affiliate-link/4V7YJyp8h9anS3yFQVVSJNYGRwoo9HCtTnX19yT6ur3XpQcDJ1Yjbw7EuZDCK38LEe65mpXK5gC8W5rpSbB7sdfm64vv8ryHcF8xqrPiuDfujbox9c2heJoD1uoq1BDdZjuJSYcftpn2ofm8QwYBknhsTG2BvmWZ9WJg1c2xf25CeBYgHLycnBoX8JC7g8hS6yFk5Zen41HnWYrr2hjVYD9Jcareupatk3N9jNJ1Kt2xrL1dNT8S6pBqcvoc3S11EEZ2uvFREXUfS3tw2txxM1e6ysnVjPbodFYs6mY3UR\" target=\"_blank\" rel=\"noopener\">HP military discount</a> will drop the retail prices significantly, whether you’re searching for a new laptop, PC, mouse, and many more select products at HP.com.</p><ul><li><p>Photograph: Luke Larsen</p></li><li><p>Photograph: Luke Larsen</p></li><li><p>Photograph: Luke Larsen</p></li><li><p>Photograph: Luke Larsen</p></li></ul><p>HP</p><h3>OmniBook Ultra 14</h3><h2>More HP Discounts on Gaming PCs and Free Games</h2><p>HP’s <a href=\"https://cna.st/affiliate-link/2Y1hYhhFGuXjkwqFK5eQPnBiPGQfCXYYUiHE5wdKbZsRfP1b6QhigTy54B8DSKso1sCSTmUsetB7Q6XJQHjAJnTtK41XN2zXWzGXjjdNSt8YDco1isqjwAvefm5BaWFVwgR94Y6wrUgxqKrd2FRTtH7S7bcfrgm6S3E8VzzrKDLhcZAbGWbTYQ2t5FmoLL3N3znHkzNYAE6t18LcNjqyat4MVuQVkXrwjF8CDtxgFJjKyYaFFqq9FugtsyR9ytZkWMwghg1ytfA6Kes2K5kTL4amvDnA4jMfawtw8v9xsTt5MA57BZ5NFqA3twcR8xAQKP6FTmniFYNDxS5mnd2cDuuqQZ?xid=fr1760469817692ehd\" target=\"_blank\" rel=\"noopener\">high-performance gaming laptops and PCs</a> are also included in this coupon code. HP has two brands of gaming laptops to choose from: the more affordable Victus and the higher-end Omen (both of which have been reviewed by me <a href=\"https://www.wired.com/story/how-to-buy-a-gaming-laptop/\" target=\"_blank\" rel=\"noopener\">here</a>). Finding a <a href=\"https://www.wired.com/gallery/best-gaming-laptops/\" target=\"_blank\" rel=\"noopener\">gaming laptop</a> under $1,000 can be tricky, especially since you’ll want something that doesn’t use a 5-year old GPU and only 8 GB of memory. That’s why I’d avoid the cheapest Victus laptop here, and bump up to at least the <a href=\"https://cna.st/affiliate-link/EbxtFkHZLuQbEbvDkgXWVoGAx9jK4wgSwivMenZw1TP467SQdJ1F3KSoRj94NrjKM1yM3jDHKyYC2XXeBBKyHHbKVCXccBLY5CKogehi5dgBdjF7Z7sBfs9BUzcE5Fu9qU78ipLp7VfhkhdMxZWivt7APvyJTnvGgSty8twYuJYVCCjjsS695vwNGrQ98MdZYDC7FmV57kSmXLxNmEmk3cB1qEEAU6cSZGTAf6KEBL533CgFRDAks3LnRzT9PEhm7k7gMQjpVxziqVba5UJdvkGZEVzpAcgbNnWp53oFBUCZAukczEQFU7mwEXurDFVGXeg39WXTaYTqSvZJPEvZ?xid=fr1760469817693aij\" target=\"_blank\" rel=\"noopener\">Victus 16t-r100</a>. That gets you an RTX 4050 and 16 GB of RAM, despite costing only $150 more.</p><p>Meanwhile, the higher-end Omen models get you access to the new RTX 50-series graphics cards, and the new <a href=\"https://www.wired.com/story/nvidias-rtx-50-series-laptop-gpu/\" target=\"_blank\" rel=\"noopener\">multi-frame generation feature</a> that’s got everyone talking. They also come with a 16-inch aptops-and-2-in-1s/envy.html\" target=\"_blank\" rel=\"noopener\">HP Envy</a>’s thin and light design, now with AI-enhanced performance, making these ideal for independent professionals, creators, and university students.</p>"},{"title":"Ariana Grande and the Disappointment of Diagnosis","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/critics-notebook/ariana-grande-and-the-disappointment-of-diagnosis","category":"fun","categoryLabel":"Interesting Reads","wordCount":1394,"readingTime":7,"content":"<p>Let’s say it in unison: <em>this isn’t helping</em>. By “this,” we mean commentary, though I prefer “criticism,” an enterprise that, in its contemporary incarnation, is given to analyzing public figures as one would a work of art. For anyone asking whether this kind of analysis—unequal parts interpretation, speculation, and evaluation—will save a worrying figure, the query imparts its own futility. Criticism parses well but advocates poorly; it is diagnostic but seldom curative. Critics, lay and professional alike, apprehend and describe what’s happening on the page, stage, screen, and beyond, and what artists and other unreachable beings make of that, if anything, is their divine prerogative. Such is the ecstasy, the agony, of judgment, which was never for their benefit.</p><p>Custom dictates that I name names, ferrying us from the generic to specifics, thus embarking upon the dubious practice of personifying a star. Ariana Grande, the pop star and actor, is also a person, of flesh and blood, but unknowable beyond that bare fact from the vantage of a stranger, no matter the ubiquity of her image. Yet modern celebrity hinges upon believable proximity. That paradox reaches its apex in pop music, which trades in the felt commonality of feminine experience and whose performers are their own—and owned—art product.</p><p>And so, while audiences have been alert to the appearance of a thinner Grande since before her Oscar-nominated turn as Glinda in the 2024 film “Wicked,” it makes sense that such noticing intensified upon Grande’s unexpected return as a pop artist this summer. The eleven-stop, forty-one-show Eternal Sunshine Tour, supporting the studio album of that name, her seventh, coincides with the rollout of her eighth album, “Petal,” which was released last Friday when Grande performed in Montreal. Full of shadow and synth, both “Eternal Sunshine” and “Petal” are existential, moody affairs, preoccupied, as Grande is elsewhere in her œuvre, with the pained process of regeneration. Commentary, however, has dwelled on a darkness of another sort, that of a thin artist gotten thinner.</p><p>Her figure seems a sign too indicative to ignore. People have speculated that Grande has an eating disorder, picking out tell-tale evidence in fan-made tour clips and album visuals, such as the music video for the title track of “Petal,” also released last week. The video, shot on VistaVision and billed as a short film, bridges the artist’s disciplines. The genre is horror. Grande plays a wannabe ingénue from the nineteen-forties who murders a panel of casting-couch types after trying and failing to perform a version of herself they might want; as it turns out, this is also cinema, scenes from a movie set. Grande has been play-acting play acting: the blood is fake; the ingénue is a star. Like its video, the song is a misdirect, its melancholic tone undercut by the swagger of its vocalist.</p><blockquote><p>Tell me, who’s to blame?Is it the people or myself?</p><p>. . .</p><p>This is not a cry for help</p><p>. . .</p><p>But I am not a victim, bitchI’m practically drowning in my blessings</p></blockquote><p>If those proclamations are autobiographical, a vanishing few believe it. The “Petal” video has been received as a smoking gun, shot to accentuate her extreme thinness. Its screenshots have circulated with ferocity this past week as proof that Grande is in danger, and imperiling others with her. Some have expressed feeling triggered, in a clinical sense, by these images, as well as dismayed that the outcry has made them omnipresent.</p><p>Earlier this week, as if in response to the disquiet, a representative for Grande told <em>People</em> magazine that she would be “taking a step back from visibility” after the tour, one aspect of the “public-facing work and appearances” that have “led to endless, ongoing public scrutiny.” At her next stop, in Chicago, Grande corrected the presumption about timing, telling the crowd that plans for her withdrawal had been “quietly made, a long time ago.” The “negativity” wasn’t “ruining things,” she explained with calm, as though chiding her own management team, whose statement was almost pissy in comparison, with its emphasis on how “healthily” Grande has been performing. On Wednesday night, I went to see for myself and watched Grande execute a spectacular show without incident. She belted and sashayed with a pro’s apparent ease. It was, as promised, a “physical” and “beautiful” performance. None of which is dispositive, but, then again, what could be?</p><p>Well-meaning observers want to split the difference between the sayable and unsayable. Would that they could remark upon what appears troubling about Grande without presuming too much about another body. And many—in comments sections and gossip forums and group chats and Substack blogs, conversations with their waxer and at happy hour—are trying. But articulating what’s happening has been an issue. What people are seeing cannot be described without flouting good sense regarding the disease alleged. Eating disorders, as those in recovery have stressed, thrive on the pathological evidence of their symptoms, spinning negative attention—concern, disgust—into fatal affirmations.</p><p>But even those in recovery make for imperfect spokespeople. “Concern” is an emotional bricolage, and often clumsily expressed. Witnesses fear the worst, and there is no elegant way of saying it—the worst is death. There is dread and sadness and also anger, not only on behalf of the usual alibi for caring about famous women’s bodies, those masses of impressionable teen-age girls, but on behalf of past and present selves. <em>Not this again</em>, survivors of heroin chic and low-rise denim beg. Though we have, I hope, stopped kidding ourselves with the notion that thinness ever left the cultural mandate—a mandate, lest we forget, that is pernicious past the feelings it hurts, because it is parcelled within a regime of patriarchal control wreaking hell on women’s survival. Earlier this week, the acting Attorney General, <a href=\"https://www.newyorker.com/news/the-lede/the-senates-shameful-acquiescence-to-todd-blanche-as-attorney-general\" target=\"_blank\" rel=\"noopener\">Todd Blanche</a>, declared that the Justice Department has been working with federal agencies on potential nationwide restrictions on abortion medication. Frustration, suffuse, blunts the language.</p><p>Ugly as some of the public comment on Grande has been, I find the indelicacy something of a relief from the usual reproach against commenting on the figures of public figures, what has sufficed for a moral consensus dating back to the rhetorical heyday of body positivity, not that anyone earnestly followed suit. The facile pledge to leave bodies out of it was born out of guilt, an attempt at atonement for celebrities turned tabloid fodder in the blogging era and for Chadwick Boseman, whose gradually slighter form resulted from battling cancer kept from a public who felt ashamed for noticing it after he passed. Grande returned a version of the refrain when people began noticing her changing form in 2023, cautioning that “we should be gentler and less comfortable commenting on people’s bodies.”</p><p>This message might also mean well. There’s no underestimating the volume and intensity of rubbernecking on the internet, and talk about women in public remains unspeakably cruel, causing us to look askance at critique couched as compassion. But I have also noticed an odd hostility toward attempts at parsing the images of figures paraded as paragons, as though there were something untoward in making sense of how they appear, be it in an ad for denim or in <a href=\"https://www.newyorker.com/magazine/2026/06/29/olivia-rodrigo-music-review\" target=\"_blank\" rel=\"noopener\">a baby-doll dress</a>. Bad discourse, preoccupied with punitive diagnoses of every kind, has rendered some a bit gun shy, I think; the attention paid to a pointed finger has eroded trust in critics of mass culture. But a sound critic interprets celebrities as exemplary, not singular. Her observation isn’t personal because it can’t be. That access is denied. Whatever symptoms can be seen are societal and so, too, are the diagnoses.</p><p>Would I know the difference between a dying woman and a healthy one if she appeared before my eyes in a puff of smoke? How about in six-inch platforms? What if she sang in a voice large enough to flood an arena? What if she never flagged once? What if she sang about obliteration and mimicked collapse? What if she laughed? When looking for symptoms, anything can become suspect; and when comfort is sought, anything can look alright. What I saw of Grande that night was no less than the transcendence that pop acolytes come to see, which felt tenuous for reasons beyond any one body. How fragile this all is, I thought, such white-knuckled investments, emotional and financial, that brought us here. How fragile. ♦</p>"},{"title":"The humble Wii Nunchuck has been turned into a video editing tool because it's 'one of the most ergonomic things ever made'","source":"PC Gamer","author":"James Bentley","url":"https://www.pcgamer.com/hardware/controllers/the-humble-wii-nunchuck-has-been-turned-into-a-video-editing-tool-because-its-one-of-the-most-ergonomic-things-ever-made/","category":"gaming","categoryLabel":"Gaming","wordCount":540,"readingTime":3,"content":"<p>Wii Nunchuck as DaVinci Resolve Macro-Pad | Super-comfortable - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/jMN4zio32E0\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>If you spend your time editing videos, you may have already invested in a macropad. Or, you're probably used to the monotony of spamming shortcuts on your keyboard to swap between different tools. This can be a pain on the wrist because of the angle you hover over a keyboard, but there's now a new way around it—the humble Nintendo Wii Nunchuk.</p><p>As spotted by <a href=\"https://hackaday.com/2026/08/07/wrist-welcomes-wii-nunchuk-as-gloriously-ergonomic-macropad/\" target=\"_blank\" rel=\"noopener\">Hackaday</a>, John Dingley, of YouTube account <a href=\"https://www.youtube.com/watch?v=jMN4zio32E0\" target=\"_blank\" rel=\"noopener\">John's Projects</a>, posted their latest creation last week. In essence, they've hooked a Wii Nunchuk up to their PC using the <a href=\"https://github.com/AnaviTechnology/anavi-handle\" target=\"_blank\" rel=\"noopener\">Anavi Handle</a> to use it like a macropad.</p><p>The <a href=\"https://github.com/AnaviTechnology/anavi-handle\" target=\"_blank\" rel=\"noopener\">Anavi Handle</a> is an open-source USB adapter for connecting the Nunchuk controller to a computer. The adapter uses the <a href=\"https://go.redirectingat.com/?id=92X590208&amp;xcust=pcg_us_1458123762878931188&amp;xs=1&amp;url=https%3A%2F%2Fwww.seeedstudio.com%2FXIAO-RP2040-v1-0-p-5026.html%3Futm_source%3Dgithub%26utm_medium%3DANAVI%26utm_campaign%3DHandle&amp;sref=https%3A%2F%2Fwww.pcgamer.com\" target=\"_blank\" rel=\"noopener\">Seeed Studio Xiao RP2040</a>, which, at just a couple of dollars, makes the entire setup surprisingly cheap.</p><p>You might be wondering why they used the Nunchuk, and it's not just to be a little geeky. The Wii Nunchuk is comfortable and light, as it was designed for a family-friendly console. And most importantly, you can hold it upright.</p><p>For a video editor who is likely spending hours at their desk at a time, the hope is that it won't cause pain in their wrist from holding it on the desk all day. John claims it is \"super comfortable\" and that it is \"one of the most ergonomic things ever made\".</p><p>Their current shortcut controls are:</p><ul><li>Lower end pushbutton = Split clip</li><li>Upper end pushbutton = Not assigned yet (i.e. spare)</li><li>Joystick-LEFT = Ripple Delete</li><li>Joystick-RIGHT = UNDO (the previous action)</li></ul><p>The Nunchuck plugged into the Anavi Handle won't work as a macropad immediately. It does require some coding, but Dingley has gone over that process in his video, too.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>The use of the Nunchuck specifically came about because Dingley realised they didn't actually use all the buttons on their standard macropad. They still have a keyboard on hand for typing text, but the Nunchuck means they can put the macropad away.</p><p>Admittedly, this use case is a little niche. The reason one might opt for professional equipment like the <a href=\"https://www.blackmagicdesign.com/uk/store/davinci-resolve-and-fusion/edit-keyboards/W-DRE-13\" target=\"_blank\" rel=\"noopener\">DaVinci Speed Editor</a> is partly due to the breadth of buttons available. The Nunchuk has a limited number of functions, so it will only really be useful to someone who only finds themselves needing a handful of functions for each edit.</p><p>But still, if you just want to cut clips, undo mistakes, and swap between a few tools quickly, it seems like a smart way of doing so, and it looks pretty neat at the same time. I'm sold.</p>\n\n<p>James is a more recent PC gaming convert, often admiring graphics cards, cases, and motherboards from afar. It was not until 2019, after just finishing a degree in law and media, that they decided to throw out the last few years of education, build their PC, and start writing about gaming instead. In that time, he has covered the latest doodads, contraptions, and gismos, and loved every second of it. Hey, it’s better than writing case briefs.</p>"},{"title":"Stop-Talking-to-Me Order Against Ex-Landlord Who Kept Texting Ex-Tenant About COVID Vaccines","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/05/stop-talking-to-me-order-against-ex-landlord-who-kept-texting-ex-tenant-about-covid-vaccines/","category":"law","categoryLabel":"Law","wordCount":905,"readingTime":5,"content":"<p>From <a href=\"https://www.courts.state.hi.us/wp-content/uploads/2026/07/CAAP-25-0000077sdo.pdf\" target=\"_blank\" rel=\"noopener\"><em>Gonda v. Duering</em></a>, decided Friday by the Hawaii intermediate appellate court (Justices Katherine G. Leonard, Keith K. Hiraoka, and Daniel M. Gluck):</p>\n<blockquote><p>[O]n December 11, 2024, Petitioner-Appellee Anaya Gonda filed a Petition for an Ex Parte Temporary Restraining Order (TRO) and for Injunction Against Harassment (Petition). Gonda alleged that Duering, her former landlord, had harassed her both before and after she vacated the apartment on September 11, 2023. She alleged that Duering sent her \"over 25 disturbing text messages with no legitimate purpose and a concerning focus on [her] health,\" reflecting Duering's belief that COVID vaccines had caused Gonda's health problems. She alleged that Duering continued to send her text messages in October 2023, January 2024, April 2024, July 2024, and November 2024….</p>\n<p>Gonda's boyfriend, Gustavo D'Amico, was the first witness [at trial]. He testified that he and Gonda arrived at the apartment on September 11, 2023 to find Duering there with a painter—even though Gonda had paid rent through the end of September—and that Duering began \"screaming at\" D'Amico. D'Amico called the police, and the police \"helped handle the situation.\"</p>\n<p>Gonda then testified that, on September 11, 2023, she told Duering not to contact her …. She similarly testified that \"after my tenancy ended on September 11th and I, uh—told Mr. Duering to never contact me again, except via my lawyer ….\" Gonda testified that this exchange took place in person …. Duering, for his part, denied that Gonda told him not to communicate with her….</p>\n<p>Gonda testified that Duering's text messages were \"always about [her] health\" and contained \"COVID vaccine … conspiracy theories.\" She testified that there was no reason for Duering to communicate with her. In cross-examination by Duering, Gonda further testified that she was \"concerned and disturbed by the obsessive nature of [his] continued messages towards [her] when there's absolutely no reason for [him] to contact [her].\"</p></blockquote>\n<blockquote><p>Hawai'i Revised Statutes (HRS) § 604-10.5(a) defines \"Harassment\" as including:</p>\n<blockquote><p>An intentional or knowing course of conduct directed at an individual that seriously alarms or disturbs consistently or continually bothers the individual and serves no legitimate purpose; provided that the course of conduct would cause a reasonable person to suffer emotional distress….</p></blockquote>\n<p>Duering … argues that the District Court violated his right to free speech, freedom of religion, and/or to petition the government for redress of grievances—as guaranteed by the First Amendment to the United States Constitution—by prohibiting Duering from communicating with Gonda….</p>\n<p>As the United States Supreme Court has made clear, \"no one has a right to press even 'good' ideas on an unwilling recipient.\" <em>Rowan v. U.S. Post Off. Dep't</em> (1970). Duering has a constitutional right to hold, and publicly express, whatever views he likes regarding the COVID vaccine; here, however, Duering is not being restrained because of his viewpoints on COVID, nor is he being restricted in communicating with any other member of the public regarding his views. Instead, he is restrained from very specific <em>conduct</em>—contacting Gonda—for a limited time….</p>\n<p>[T]he Injunction imposes no restrictions on Duering's ability to express his views to any other member of the public (or the government), and its prohibitions with respect to Gonda expire after three years. The District Court found that Duering harassed Gonda, and did not err in restraining him from harassing her further….</p>\n<p>[Duering also argues] that the District Court was improperly biased against Duering because of Duering's views on COVID vaccines. He points to the District Court's statement that Duering \"was not—is not [Gonda's] doctor\" as evidence of the District Court's bias against him. He explains:</p>\n<p>Duering's personal and religious views that the Covid vaccines were (and are) dangerous to human health; which if contrary to Judge's belief, is an issue that has divided families and friends to disassociate with one another, which was caused since the massive Covid vaccination rollout in 2021, which was in addition to the big divide, which media propagated mind control, to influence otherwise sound-minded intelligent people, to ridicule and berate people like Duering, who merely seeks to educate those who are uneducated on the subject and dangers of inviting foreign unidentified substances, to be voluntarily injected into their sacred body.</p>\n<p>The District Court made its statement that Duering was not Gonda's doctor while explaining its finding that Duering had no legitimate purpose for contacting Gonda; indeed, the District Court made clear that Duering's views on COVID vaccines were not relevant to its determination:</p>\n<p>The point is not that your views are legitimate or substantiated or worthy of—or worthy of Ms. Gonda to consider them. That's really not relevant.</p>\n<p>What is relevant is somebody who did not want to have communication from you, and that being the case, it—it almost doesn't matter what you were saying to her in that regard, and it's—and so that's why the court is ruling that the injunction order will be issued.</p>\n<p>Duering and Gonda no longer had a landlord-tenant relationship, and Gonda made clear that she did not want his unsolicited medical advice. The District Court did not err in concluding that Duering had no legitimate purpose in contacting Gonda. Nothing in the record suggests any improper bias by the District Court….</p></blockquote>\n<p>For more on anti-harassment orders generally, see <em><a href=\"http://www.law.ucla.edu/overinj.pdf\" target=\"_blank\" rel=\"noopener\">Overbroad Injunctions Against Speech (Especially in Libel and Harassment Cases)</a></em>; that article argues that broad injunctions banning speech <em>about </em>the plaintiff are generally unconstitutional, but that injunctions banning continued unwanted speech <em>to </em>the plaintiff are generally valid.</p>"}];
