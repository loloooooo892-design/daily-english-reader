<script>
var articles = [{"title":"The Longreads Questionnaire, Featuring Jon Ronson","source":"Longreads","author":"Longreads","url":"https://longreads.com/2026/09/03/longreads-questionnaire-jon-ronson/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1392,"readingTime":7,"content":"<p>“I do unashamedly want to write page-turners,” Jon Ronson <a href=\"https://www.newyorker.com/news/the-new-yorker-interview/jon-ronsons-guide-to-the-culture-wars?src=longreads\" target=\"_blank\" rel=\"noopener\">told <em>The New Yorker</em></a> in an interview. “I can never understand why most nonfiction books have such limited creative ambitions.” Ronson, who is “not a thrill-seeker,” then recounts fearing for his life while being pursued by members of a secretive political gathering—a chase that found its way into <em>Them: Adventures with Extremists</em>, his 2001 breakthrough book. Thrills have a way of finding Ronson, either through active pursuit or some subtler means of revelation. <em>The Men Who Stare At Goats</em> begins with a US Army general who attempts to walk through walls, repeatedly smacking into them. In the opening of <em>The Psychopath Test</em>, a neurologist hands Ronson a baffling package, copies of which have been anonymously mailed to academics throughout the world. The pages turn themselves.</p>\n\n<p>Ronson’s latest, <em><a href=\"https://jonronson.com/book/the-castle/?src=longreads\" target=\"_blank\" rel=\"noopener\">The Castle</a></em>, earned a <a href=\"https://www.publishersweekly.com/9781594634208?src=longreads\" target=\"_blank\" rel=\"noopener\">starred review</a> from <em>Publisher’s Weekly</em>, which praised the book as “a blockbuster portrait of men gone mad” and Ronson’s style as “intuitive but rigorous.” His podcast, <em>Things Fell Apart</em>, was recently renewed for a third season, in which Ronson will shift focus from American culture wars to individual battles against institutions. He once <a href=\"https://www.theguardian.com/lifeandstyle/article/2024/jun/01/jon-ronson-its-getting-harder-to-be-optimistic?src=longreads\" target=\"_blank\" rel=\"noopener\">told <em>The Guardian</em></a>, “I get called faux-naïf all the time. But I honestly think I am just genuinely naive.” It’s an observation that reminds me of Joan Didion’s own famous self-assessment: that she was “so physically small, so temperamentally unobtrusive . . . that people tend to forget that my presence runs counter to their best interests.” Ronson is warmer than that, but his access is no less astonishing. Time and again, someone allows him to get very close—closer, perhaps, than they might be aware of. Each of Ronson’s books is a testament to his depth of inquiry, his proximity to the surprising, and his conviction that a good narrative should be propulsive.</p>\n<p>—<em>Brendan Fitzgerald</em></p>\n\n<h3><strong>Where did you grow up?</strong></h3>\n<p>Cardiff, Wales. In a suburb called Lisvane.</p>\n<h3><strong>What places feel like home?</strong></h3>\n<p>London, for sure. As a child, when we’d visit my grandparents, I’d sneak away and jump on a bus and just get lost in the City. Even when it wasn’t home, it felt like home. Eventually I lived there for decades, loving especially Soho and Islington. I also love our tiny town in the Hudson Valley. We’ve lived here since 2019.</p>\n<h3><strong>Other than family members, who or what has shaped you the most?</strong></h3>\n<p>As a teenager, watching Nick Broomfield documentaries and reading the great nonfiction adventurers from the ’60s and ’70s like Hunter S. Thompson and PJ O’Rourke and the writers featured in Tom Wolfe’s <em>The New Journalism</em>. And when I started in journalism, the editors who first gave me a break: Ian Parker, Chris Heath, Deborah Orr, Ian Katz.</p>\n<h3><strong>What is your favorite time of day?</strong></h3>\n<p>Early morning. I make a coffee and for the first few hours my brain is at its best and I can write a lot.</p>\n<h3><strong>What are you <em>really</em> good at?</strong></h3>\n<p>Narrative nonfiction. If I go off on some journey, I know <em>exactly</em> how to make it work. It’s the only thing I’m good at.</p>\n<h3><strong>What’s the best gift you’ve ever received?</strong></h3>\n<p>Recently the BBC gave me a subscription to Descript, a text-based audio editing program. It’s a dream gift for a detail-oriented storyteller. I can finally do the audio editing myself. I sit there for hours.</p>\n<h3><strong>Describe your favorite meal.</strong></h3>\n<p>I guess some kind of salad with lots of fruit and vegetables and a good dressing. You can’t beat Greek dressing.</p>\n<h3><strong>Sound or silence? (And if sound, what sound?)</strong></h3>\n<p>Silence! I can’t believe how great the silence is here in the Hudson Valley. There’s something very comforting about knowing it won’t end. They’ll never turn this country lane into a big road.</p>\n<h3><strong>Where do you do your best thinking?</strong></h3>\n<p>When I’m out on a story, in some strange place, gathering material. I just instinctively know what’ll work, what the best moments are. Fiction people can do that in their imaginations. I can’t. But when I’m out on a story, I just know.</p>\n<h3><strong>What journey—physical, creative, intellectual, or otherwise—has meant the most to you?</strong></h3>\n<p>The journey of leaving Cardiff and moving to London when I was 18. I felt like finally my life could begin.</p>\n<h3><strong>Where do you like to read?</strong></h3>\n<p>I listen to audiobooks when I’m out walking.</p>\n<h3><strong>What’s the last rabbit hole you disappeared into?</strong></h3>\n<p>The Ultimate Fighting Championship (UFC). <a href=\"https://www.gq.com/story/ufc-at-the-white-house?src=longreads\" target=\"_blank\" rel=\"noopener\">I went to the cage match on the White House South Lawn for <em>GQ</em></a>, because it was theme-adjacent to my new book <em>The Castle</em>. So I watched all manner of fighter interviews and UFC super-fan videos for that.</p>\n<h3><strong>Name three publications you enjoy reading these days.</strong></h3>\n<p><em>The New Yorker</em>, <em>The Guardian</em>, <em>The New York Times</em>.</p>\n<h3><strong>What’s one longread that you can’t stop thinking about?</strong></h3>\n<p>“<a href=\"https://www.newyorker.com/magazine/2026/06/15/andrew-tates-empire-of-abuse\" target=\"_blank\" rel=\"noopener\">Andrew Tate’s Empire Of Abuse</a>” was the last one I listened to from beginning to end.</p>\n<h3><strong>What was the last book you read?</strong></h3>\n<p><em>Shakespeare: The World as Stage</em> by Bill Bryson. I listen to it over and over to get to sleep. So I still don’t know how he dies.</p>\n<h3><strong>What piece of nonfiction are you most proud of writing?</strong></h3>\n<p>Every book I’ve written has chapters I’m equally proud of: sneaking into Bohemian Grove with Alex Jones and getting chased by the Bilderberg Group in <em>Them</em>, the goat staring in <em>The Men Who Stare At Goats</em>, pretty much all of <em>The Psychopath Test</em>, much of <em>Lost at Sea</em>, Justine Sacco in <em>So You’ve Been Publicly Shamed</em>. <em>The Castle</em> feels really good. I felt very confident writing it, mixing up tones and styles in a way I don’t think I could have managed before.</p>\n<h3><strong>What’s your most reliable way to get creatively unstuck?</strong></h3>\n<p>Just wandering around Reddit can be good. The whole world is somewhere on Reddit. And if you don’t find your next story, it might still unlock some part of your brain.</p>\n<h3><strong>Who’s a writer you turn to when you need some inspiration?</strong></h3>\n<p>Kurt Vonnegut, for his brevity and his clashes between comedy and horror.</p>\n<h3><strong>What words do you overuse?</strong></h3>\n<p>It used to be “There was a silence” but I’ve cured myself of that, thank God.</p>\n<h3><strong>What’s your favorite guilty pleasure?</strong></h3>\n<p>I don’t know if this counts, but every book I read for pleasure is a celebrity memoir, mostly musicians and actors. Cher. Anthony Hopkins. Bruce Springsteen. I LOVED the English actor Kathy Burke’s one, <em>A Mind Of My Own</em>. Right now it’s Johnny Marr.</p>\n<h3><strong>What superpower would you like to have? </strong></h3>\n<p>I think I’d like to be able to shoot fire out of my hands. No. Teleportation through space and time.</p>\n<h3><strong>What animal or nonhuman being do you most identify with?</strong></h3>\n<p>I really identified with my dog, Floppy—how he wanted to be around people but didn’t want to interact with them.</p>\n<h3><strong>If you have a free solitary hour in your day, what do you typically do?</strong></h3>\n<p>Run or walk.</p>\n<h3><strong>What five items would you place in a time capsule?</strong></h3>\n<p>Talking Heads’ <em>Stop Making Sense</em>. <em>The Pitt</em>. <em>Succession</em>. All of NPR’s Tiny Desk Concerts, especially Doechii, Sierra Ferrell, and Chappell Roan. Bruce Springsteen’s 1979 No Nukes concert video. Huh, it’s almost all music. I guess that’s the stuff we should remember. People being their best.</p>\n<h3><strong>What does your writing space look like?</strong></h3>\n\n<p><em>Jon Ronson’s nonfiction books include </em>So You’ve Been Publicly Shamed<em>, </em>The Psychopath Test<em>, </em>Them: Adventures with Extremists<em>, </em>Lost at Sea,<em> and </em>The Men Who Stare At Goats<em>.<strong> </strong>They have all been international and/or </em>New York Times<em> bestsellers and have been translated into more than 30 languages. His latest book, </em>The Castle<em>, is <a href=\"https://www.penguinrandomhouse.com/books/318255/the-castle-by-jon-ronson/?src=longreads\" target=\"_blank\" rel=\"noopener\">now available</a>.</em></p>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore questionnaires\n\t\t\t\t</h2>\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/09/03/longreads-questionnaire-jon-ronson/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Jon Ronson</a></h3>\t\t\t\t\t\t<p>The author of <em>The Castle</em> likes his music in a time capsule and silence in his home—but definitely not in his stories.</p>\n\t\t\t\t<p>September 3, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/08/20/questionnaire-jaya-saxena/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Jaya Saxena</a></h3>\t\t\t\t\t\t<p>The former <em>Eater</em> correspondent has a new home—and a full plate. Here, she talks about growing up in NYC, favorite meals, and memorable reads.</p>\n\t\t\t\t<p>August 20, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/28/questionnaire-kimon-de-greef/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Kimon de Greef</a></h3>\t\t\t\t\t\t<p><em>The Ego Trip</em> author on the sea, the pull of South Africa, and how his ecology background shapes the stories he tells.</p>\n\t\t\t\t<p>July 28, 2026\t\t\t\t</p>"},{"title":"Blood of Dawnwalker's troubled power fantasy has me yearning for a more desperate, systemic vampire survival sim in which every night is a gamble","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/blood-of-dawnwalkers-troubled-power-fantasy-has-me-yearning-for-a-more-desperate-systemic-vampire-survival-sim","category":"gaming","categoryLabel":"Gaming","wordCount":1402,"readingTime":8,"content":"<p>An anti-colony-builder, even</p>\n    \n  \n  \n  \n\n            <p>\r\nBeing a vampire is a pretty raw deal... or so the vamps inform us when they are not having freaky gothic sex, shapeshifting into wolves, enjoying the slimming effects of a uniquely low-carb diet, or enduring through marvellous future epochs we foolish cattle can only dream of.</p>\n<p>I find most stories about vampirism tend to do a poor job of convincing me that vampirism is to be avoided. \"Immortality is no gift, but a curse,\" breathe the bloodsuckers, like parents telling kids that staying up late only makes you tired in the morning, and I think: OK, so you're definitely going to outlive everybody you've ever loved, but also, 1) you've got marble hard abs, and 2) you're going to be knocking around when generations to come finally put a stake through capitalism and roll out UBI.\r\n</p>\n<p>\r\nWithin videogames, especially, the downsides tend to skulk on the other side of the old ludonarrative portcullis. In the opening act of beWitchering RPG <a href=\"https://www.rockpapershotgun.com/games/the-blood-of-dawnwalker\" target=\"_blank\" rel=\"noopener\">The Blood of Dawnwalker</a>, for example, main character Coen becomes a vampire and is very cross about this. He spends several dialogue sequences carping and moaning. I nodded sympathetically throughout, then switched to the skills menu and browsed a few ability preview clips. Coen can teleport now. He can walk up walls. Given a few unlock points, Coen can slow time and make people who annoy him boil from the inside.\r\n</p>\n\n<p>\r\nCoen doesn't even have to worry about half the traditional vampire debuff menu, including death by sunlight. He's a Hovis Best Of Both knock-off, not a true vampire, so he gets to spend the day as a regular Jon Harker, without any grotty fingernail extensions to spoil his attempts at mingling. I listened to Coen whine about his inner corruption for another couple of minutes, and then I made him go jump in the river. Screw you, Coen. I've got plenty of inner corruption, myself, just not the kind that gives me a sultry pallor while letting me turn attacking knights into thralls.\r\n</p><p>\r\nI'm sure the downsides of vampirism grow more pressing over the course of the game (here's <a href=\"https://www.rockpapershotgun.com/the-blood-of-dawnwalker-review-worthy-to-sip-blood-at-the-top-rpgs-table\" target=\"_blank\" rel=\"noopener\">Mark's review</a>). For one thing, Coen has to keep his vampire health bar <a href=\"https://www.rockpapershotgun.com/im-an-ethical-muncher-in-the-blood-of-dawnwalker-which-means-ive-forced-poor-coen-to-slurp-up-nine-million-rats\" target=\"_blank\" rel=\"noopener\">topped up with fresh haemo</a> to avoid losing control in conversation. Even so, the opening hours have made me realise that what I really want, right now, isn't a vampire power fantasy but a true vampire survival sim, in which all the legendary drawbacks of the neck-biter lifestyle are permitted to spread and swell like toadstools on burial mounds.\r\n</p>\n<p>\r\nI want to play a vampire game in which I am a fearful, feral cadaver, living on the periphery and in the gutter, alone and at a decided disadvantage in a universe of paranoid smallfolk. Witness me quiver, caught between the prongs of my gnawing appetite and the hateful, hateful sun. I want to be a miserable gangrel creature - weird and nasty enough to overpower a single alerted villager, possibly, but helpless before a torch-wielding mob.\r\n</p>\n\n<p>\r\nI want solutions to the challenges of vampirism that don't involve outright conflict, because there are so many things that can harm, thwart or dispel me: garlic, crucifixes, silver, running water, holy water, scripture, church bells, thresholds I'm not invited to cross. Have you ever looked up <a href=\"https://medium.com/the-night-visitors-chronicles/a-folkloric-field-guide-to-botanical-defense-against-the-undead-4e1176af80a5\" target=\"_blank\" rel=\"noopener\">a halfway comprehensive list</a> of the plants that damage or deter vampires, according to folklore and superstition from across the globe? Apparently, vampires are vulnerable to <em>juniper berries</em>. Walking through any remotely verdant area must feel like tapdancing on landmines.</p><p>Supernatural force alone cannot help me navigate this sandbox. Nor can straightforward real-time combat mechanics. If I am to become powerful, raising my keep on the mountainside or spreading my miasma through the catacombs, it must be through bitter effort and canny misdirection, not a cycle of moderately guilt-ridden clawing, draining and levelling up. I must become a being of <em>strategy</em>, above all.\r\n</p>\n<p>\r\nI'm not sure such a vampire game exists – if you've heard of such a thing, I want to know about it – but the obvious go-to here is 2004's <a href=\"https://www.rockpapershotgun.com/games/vampire-the-masquerade-bloodlines\" target=\"_blank\" rel=\"noopener\">Vampire: The Masquerade – Bloodlines</a>, an RPG that challenges you to keep up the titular veil of illusion between the realms of bloodsucker and bloodhaver, lest ye be rousted by vampire hunters. I confess, my memories of Bloodlines are 90% failing to get the game to operate, but there are many points of interest to this inquiry.\r\n</p>\n\n<p>\r\nYou can make life harder for yourself by rolling a Nosferatu character, for example, with facial anatomy that renders it impossible to walk safely amongst regular townies. Still, Bloodlines isn't quite the woefully ground-down and alienated experience I'm yearning for, because there's a whole world of vampire clans to embroil yourself in. You might have to keep a distance from humankind, but you're never short of company.\r\n</p><p>\r\nThe game I want isn't Don't Nod's <a href=\"https://www.rockpapershotgun.com/games/vampyr\" target=\"_blank\" rel=\"noopener\">Vampyr</a>, either. That game casts you as an unaccountably toothy doctor in plague-ridden London. Again, it pressures you to hide your habit of champing on arteries, while challenging you to serve as a pillar of the very community you're taking tactical bites out of. I appreciate Vampyr's dim and degraded London, but it's not what I'm after, both because the game is a familiar third-person brawler for long stretches, and because as Alec (RPS in peace) noted <a href=\"https://www.rockpapershotgun.com/vampyr-review-pc\" target=\"_blank\" rel=\"noopener\">in our review</a>, it's fundamentally plot-shackled.\r\n</p>\n\n<p>\r\nYou could say similar things of <a href=\"https://www.rockpapershotgun.com/games/the-necromancers-tale\" target=\"_blank\" rel=\"noopener\">The Necromancer's Tale</a>, which is kind of a vampire sim, even if you aren't yourself a vampire. It has you living in a town while cultivating your mastery of the dark arts, obtaining recipes and ingredients for increasingly noxious spells. As with Vampyr, there are different routes through the game, and obtaining the necessaries for your rituals while keeping the locals quiescent is an entertaining ordeal. Still, you're obliged to jump through the hoops of a core chapter-based storyline. The vampire survival sim I want to play is much more systems-dependent. I want to be forced to make sense of my capabilities and weaknesses without any kind of plotline to cling onto.\r\n</p>\n<p>\r\nThe closest inspiration I can find isn't a character-led game at all, in fact. I'd also rather you don't play it, for the moment, because there's a chance it's teeming with malware. The game is Fairysite, a turn-based colony builder that puts you in charge of fairies living in the woods alongside human villages, under threat of goblin invasion. Sadly, my PC's security klaxons go off when I download the demo. It's likely a false positive – nobody beside me has mentioned malware reports on the Steam forums, and I can see minimal evidence of foul intent in the developer's previous works – but even so, I'm going to avoid installing and confine my discussion to the concept, until I get clarity.\r\n</p>\n\n<p>\r\nThe key thrill of Fairysite is that it sounds genuinely parasitic: as the Steam page sums up,  \"you need them, they don't need you.\" The fairies feast upon the dreams of the humans, and rely on them for defence against the marauding goblins. But they are also threatened by the humans: if the clumsy peasants expand too far, they'll trample your groves and meadows. So you must keep them in check, by hexing their fields and quarries to slow production, while maintaining them as a food source and a bulwark against the greenskins. You can also contrive to make the humans build and worship fairy idols, which generate the spirit energy you need to identify mystic portals and ultimately, escape the map. It seems delightfully insidious.\r\n</p><p>\r\nIt reminds me of the venerable <a href=\"https://www.rockpapershotgun.com/games/ghost-master\" target=\"_blank\" rel=\"noopener\">Ghost Master</a>, in which you plant spooks around a Sims-style household, targeting the phobias of individual residents in order to harvest their fear. The challenge, in harder levels, is to jostle every last fluid ounce of cortisol from the neurones of your victims and achieve your story objectives before they start phoning any exorcists. As with Fairysite, the thrill of the game is partly that you are kind of powerless. You can sabotage, but you can't actively confront. Now, let's see somebody play that cringing predation out in a game of Dawnwalker's grandeur. I guess what I'm really asking for here is: Vampire <a href=\"https://www.rockpapershotgun.com/games/pathologic\" target=\"_blank\" rel=\"noopener\">Pathologic</a>. Draculogic? There you go, game developers - all you need to do now is make the rest of it.\n</p>"},{"title":"States, civic groups urge Supreme Court to leave order in place prohibiting Trump administration from implementing parts of mail-in ballot rule","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/09/states-civic-groups-urge-supreme-court-to-leave-order-in-place-prohibiting-trump-administration-/","category":"law","categoryLabel":"Law","wordCount":1314,"readingTime":7,"content":"<p>California, joined by a group of 22 states and the District of Columbia, <a href=\"https://www.scotusblog.com/cases/us-postal-service-v-california-2/\" target=\"_blank\" rel=\"noopener\">urged</a> the Supreme Court on Wednesday to leave in place a ruling by a federal judge in Boston that prohibits the Trump administration from implementing parts of a U.S. Postal Service rule on mail-in ballots. Ian Fein, California’s deputy solicitor general, told the justices that “USPS’ unprecedented experiment with our Nation’s most cherished franchise—the right to vote—is unlawful.”</p><p>The <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A305/423593/20260909142150069_26A305%20-%20Opposition%20to%20Application%20-%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">40-page filing</a> was the latest chapter in an ongoing battle over the Trump administration’s efforts to put restrictions on mail-in voting in place before the November elections. The dispute began nearly six months ago, when President Donald Trump signed <a href=\"https://www.whitehouse.gov/presidential-actions/2026/03/ensuring-citizenship-verification-and-integrity-in-federal-elections/\" target=\"_blank\" rel=\"noopener\">an executive order</a> that instructed federal agencies to take a series of steps on mail-in voting. The first provision orders the Department of Homeland Security to create lists of the adult U.S. citizens in each state and to send those lists to states at least 60 days before a federal election. The second provision directs the U.S. attorney general to “prioritize the investigation and, as appropriate, the prosecution of State and local officials … who issue Federal ballots to individuals not eligible to vote in a Federal election.” And the third provision requires states to provide the U.S. Postal Service with a list of voters to whom the states intend to send mail ballots, and it bars the Postal Service from mailing ballots to voters who are not on the lists of “enrolled” voters that the USPS will create.</p><p>A group of 23 states, led by California, and the District of Columbia went to federal court in Massachusetts, where they challenged the government’s implementation of the order. They contended that the order clashes with provisions in the Constitution that give states the power to determine voter eligibility and to set the “Times, Places, and Manner” of holding congressional elections.</p><p>In <a href=\"https://www.democracydocket.com/wp-content/uploads/2026/04/2026-06-25-Order.pdf\" target=\"_blank\" rel=\"noopener\">an order</a> on June 25, U.S. District Judge Indira Talwani temporarily barred the federal government from implementing the challenged restrictions on or before the upcoming November elections in California, the states joining the lawsuit, or D.C. The U.S. Court of Appeals for the 1st Circuit <a href=\"https://www.ca1.uscourts.gov/sites/ca1/files/opnfiles/26-1774O-01A.pdf\" target=\"_blank\" rel=\"noopener\">declined</a> to put that order on hold to give the government time to appeal.</p><p>That prompted the Trump administration <a href=\"https://www.scotusblog.com/cases/trump-v-california/\" target=\"_blank\" rel=\"noopener\">to come to the Supreme Court</a> on July 27, where – along with <a href=\"https://www.scotusblog.com/cases/alabama-v-california-2/\" target=\"_blank\" rel=\"noopener\">a group of 12 states, led by Alabama</a>, that had joined the case on the Trump administration’s side – it <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A124/417370/20260727144320600_Trump%20v.%20California%20Application%20and%20Appendix.pdf\" target=\"_blank\" rel=\"noopener\">asked</a> the justices to pause Talwani’s order.</p><p>On Aug. 24, the Supreme Court <a href=\"https://www.supremecourt.gov/opinions/25pdf/26a124_hgci.pdf\" target=\"_blank\" rel=\"noopener\">cleared the way</a> for the Trump administration to begin implementing the executive order. Over the objections of the court’s three Democratic appointees, the majority explained that the states’ challenge was premature because the order had not yet been carried out – and, as a result, the states had not suffered the kind of injury that would allow their lawsuit to proceed.</p><p>Three days later, Talwani issued <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.mad.298449/gov.uscourts.mad.298449.218.0_1.pdf\" target=\"_blank\" rel=\"noopener\">a new order</a>: a temporary restraining order that barred the Trump administration, for 14 days, from requiring states to comply with several provisions of the new Postal Service <a href=\"https://public-inspection.federalregister.gov/2026-17238.pdf\" target=\"_blank\" rel=\"noopener\">rule</a>, such as ballot envelope design requirements and the submission of voter data into a USPS portal.</p><p>The Trump administration <a href=\"https://www.scotusblog.com/cases/us-postal-service-v-california/\" target=\"_blank\" rel=\"noopener\">went back to the Supreme Court</a> on Thursday, where U.S. Solicitor General D. John Sauer asked the justices to pause Talwani’s temporary restraining order (and to issue an administrative stay, an even more temporary form of relief that would put the order on hold while they considered the government’s request).</p><p>Thursday’s request proved to be short-lived. The very next day, Talwani issued <a href=\"https://www.courtlistener.com/docket/74701505/156/state-of-california-v-united-states-postal-service/\" target=\"_blank\" rel=\"noopener\">a preliminary injunction</a>, which replaced her Aug. 27 temporary restraining order and prohibited the Trump administration from requiring states to comply with provisions of the rule indefinitely while the litigation moves forward. Sauer then <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A297/423227/20260906111028101_26A297_USPS_Letter.pdf\" target=\"_blank\" rel=\"noopener\">submitted a letter</a> to Scott Harris, the clerk of the Supreme Court, withdrawing the Trump administration’s second application for relief in light of Talwani’s new order.</p><p>Telling the court that Talwani’s “continuing prejudgment of the rule is baseless,” and her rationale is “simplistic,” Sauer <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A305/423226/20260906094442523_USPS%20v.%20State%20of%20California%20PI%20No.%2026A%20-%20Stay%20App.pdf\" target=\"_blank\" rel=\"noopener\">returned to the court</a> for a third time on Sunday, asking the justices to pause the Sept. 4 preliminary injunction.</p><p>Sauer rejected any suggestion “that the Postal Service is trying to federalize the rules for mail-in voting.” Instead, he insisted, “the Postal Service’s final rule imposes only modest envelope-design and addressee-information requirements for federal-election ballots sent via U.S. Mail.”</p><p>Moreover, Sauer continued, the Postal Service’s new rule “is plainly constitutional. While the States have primary authority to regulate the manner of elections, they cannot choose to use the federal mails to carry out their elections but then insist that their election-related mail is somehow exempt from the Postal Service’s rulemaking authority, conferred by Congress, to regulate envelope design and addressee information.”</p><p>If Talwani’s order is not put on hold, Sauer said, the government will – as the Supreme Court has already recognized in earlier proceedings involving the rule – suffer permanent harm (a key factor in determining whether to award temporary relief) because the election is so soon. North Carolina has already started to mail out ballots, Alabama will do so on Sept. 9, and “at least five States” will do so the following week – all without being required to comply with the new rule. By contrast, Sauer contended, the states’ claims that complying with the rule will harm them are “overblown.”</p><p>In their <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A305/423593/20260909142150069_26A305%20-%20Opposition%20to%20Application%20-%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">response</a> on Wednesday, California and the other states told the court that Talwani’s preliminary injunction should remain in effect, warning of dire consequences if the Postal Service is allowed to implement the rule now. “In some States,” Fein wrote, “unrebutted evidence establishes that compliance with USPS’ rule would be impossible ahead of the midterms, meaning that millions of voters would be unable to vote by mail and some would not be able to vote at all. In the remaining States, there would be chaos—and a significant risk that millions more voters would be denied the ability to vote.” Moreover, Fein added, “even if state and local officials were somehow able to implement the new rule perfectly, there is a high risk of technical breakdown, ineptitude, and delay on the part of USPS.” Fein pointed in particular to <a href=\"https://apnews.com/article/midterm-elections-postal-service-mail-voting-7f7cf4fdf2e9cf369ae96f96fbda03f2\" target=\"_blank\" rel=\"noopener\">reports</a> that a whistleblower has indicated that the USPS online portal for the submission of voter data has been created in a “sloppy and rushed manner.”</p><p>Fein suggested that the Supreme Court should be “skeptic[al]” of USPS’ efforts to regulate elections given that it has never done so before, “[a]nd nothing in federal law authorizes USPS to refuse to deliver ballots.” To the contrary, Fein noted, to the extent that Congress has addressed voting by mail, it has done so “only by requiring USPS to make mail voting <em>easier</em> for States and voters.”</p><p>A <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A305/423639/20260909155125228_20260908%20Final%20SCOTUS%20Stay%20Opp.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> filed on Wednesday by the League of Women Voters and other civic groups, which had filed their own challenge to one part of the rule, also <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A305/423639/20260909155125228_20260908%20Final%20SCOTUS%20Stay%20Opp.pdf\" target=\"_blank\" rel=\"noopener\">asked the court</a> to leave Talwani’s order in place. Lawyer Sophia Lin Lakin of the ACLU, which represents the groups, told the justices that “Congress charged the Postal Service with delivering the mail nationwide, subject to a scheme of narrow exceptions for specified categories of material that Congress itself—not USPS—has deemed ‘nonmailable’ and subject to rules of general application such as sufficient postage. Mail ballots fall outside those congressionally prescribed exceptions.”</p><p>Lakin added that, in contrast with the chaos that would result from pausing Talwani’s order now, “maintaining the injunction imposes no comparable harm on USPS, where the agency concedes that, despite its asserted interest in ‘election integrity,’ it has no role in verifying whether mail voters are eligible.”</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>States, civic groups urge Supreme Court to leave order in place prohibiting Trump administration from implementing parts of mail-in ballot rule</em>, SCOTUSblog (Sep. 9, 2026, 4:43 PM), https://www.scotusblog.com/2026/09/states-civic-groups-urge-supreme-court-to-leave-order-in-place-prohibiting-trump-administration-/</p>"},{"title":"Apple’s new CEO is reviving a Steve Jobs strategy from 25 years ago","source":"TechCrunch","author":"Tim De Chant","url":"https://techcrunch.com/2026/09/09/apples-new-ceo-is-reviving-a-steve-jobs-strategy-from-25-years-ago/","category":"tech","categoryLabel":"Technology","wordCount":809,"readingTime":5,"content":"<p>Apple CEO John Ternus wants you to know that the iPhone isn’t going anywhere.</p>\n<p>Ternus threw his weight behind the venerable device on Wednesday during his first keynote as CEO, placing it firmly at the center of Apple’s product strategy for the AI era. </p>\n<p>“There’s no product in the world better designed to be your intelligent personal hub than iPhone,” he said. </p>\n<p>This contrasts with the approach taken by former CEO Tim Cook, who tried time and again to convince Wall Street that Apple was more than just the iPhone.</p>\n<p>Ternus’ pitch is also a rebuttal to pundits who have recently cast doubt on the iPhone. “The smartphone’s days are numbered,” said <a href=\"https://fortune.com/2026/05/18/smartphones-days-numbered-ai-wearable-devices/\" target=\"_blank\" rel=\"noopener\">one headline</a>. “The Tim Cook era is coming to a close with an existential challenge for Apple: figuring out what comes after the iPhone,” said <a href=\"https://www.axios.com/2026/04/21/apple-tim-cook-iphone-ai\" target=\"_blank\" rel=\"noopener\">another article</a>.</p>\n<p>But it’s not just about the hardware. Ternus has put the iPhone at the center of his <a href=\"https://techcrunch.com/2026/09/09/apple-ceo-john-ternus-says-the-best-ai-device-is-still-the-iphone/\" target=\"_blank\" rel=\"noopener\">“intelligent personal assistant” strategy</a>, a vision that could define the company for years to come. Steve Jobs did something similar in 2001 with the Mac, less than 10 months before he announced the iPod.</p>\n<p>At the time, many observers thought the PC’s days were numbered. At a Macworld New York keynote, Jobs called out bearish quotes from industry wonks like Walt Mossberg and the leaders of Compaq and Gateway. </p>\n<p>“This is what everyone else is telling us. That our PC is waning if not the hole being dug,” Jobs said at the time, pointing at a tombstone for the “Beloved PC” on the screen behind him. “We don’t think the PC is dying at all. We don’t think the PC is moving away from the center at all. We think it’s evolving, just like it has since it was invented.”</p>\n<p>“We think the PC is on the threshold of entering its third great age,” Jobs added, a prediction driven by the proliferation of digital devices at the time, including camcorders, digital cameras, and DVD players. </p>\n<p>The Mac would form the center of a “digital hub” that would connect these disparate devices and, in Jobs’ words, “add value” to all of them.</p>\n<p>Later that year, Jobs pulled the iPod out of his pocket, a device seemingly developed to answer the question, “Why do you still need a PC?” The device turned out to be an enormous hit, driving Apple’s profits quarter after quarter and ultimately helping lead to the development of the iPhone.</p>\n<p>Today, with the iPhone on the cusp of its 20th anniversary, Ternus is facing a version of the same question Jobs took on in 2001. We don’t know if Ternus is quietly sitting on an iPod-like product, one that will secure the iPhone’s position a Apple’s hub for years to come. But he is firmly rebutting the idea that the iPhone is past its prime.</p>\n<p>“If you were designing the ideal version of this hub from scratch, how would you do it?” Ternus asked, before listing the ingredients: a powerful processor, high-resolution cameras, persistent networking, and on-device AI.</p>\n<p>It helps that the iPhone is <a href=\"https://www.macworld.com/article/2455063/the-first-a18-pro-benchmarks-are-out-and-it-is-fast.html\" target=\"_blank\" rel=\"noopener\">one of the most powerful</a> personal computing devices around, giving it an edge in the compute-hungry AI era. Its portability and adaptability make it, for many people, the only computing device they need. Even among those who own laptops and iPads, the iPhone is often the one device they can’t live without. Plenty of people leave home without their laptops. Almost no one leaves without their phones.</p>\n<p>That combination of power and portability has given Apple a privileged position in the AI world. Other companies have attempted to unseat the iPhone with all manner of wearable devices, but none have succeeded.</p>\n<p>Instead of sidelining the iPhone in favor of the next flashy thing, Ternus is leaning into it instead. In a way, he’s bringing Apple around to what the rest of us already know: The iPhone is pretty great, and maybe we don’t need to replace it with something else. Yet.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Tim De Chant is a senior climate reporter at TechCrunch. He has written for a wide range of publications, including Wired magazine, the Chicago Tribune, Ars Technica, The Wire China, and NOVA Next, where he was founding editor. </p>\r\n<p>De Chant is also a lecturer in MIT’s Graduate Program in Science Writing, and he was awarded a Knight Science Journalism Fellowship at MIT in 2018, during which time he studied climate technologies and explored new business models for journalism. He received his PhD in environmental science, policy, and management from the University of California, Berkeley, and his BA degree in environmental studies, English, and biology from St. Olaf College.</p>\r\n<p>You can contact or verify outreach from Tim by emailing <a href=\"mailto:tim.dechant@techcrunch.com\" target=\"_blank\" rel=\"noopener\">tim.dechant@techcrunch.com</a>.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/tim-de-chant/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"}];

  var hasMore = articles.length > 1;

    document.getElementById('skip-btn').disabled = (articles.length <= 1);

}

function nextArticle() {

    currentIndex++;

}

  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {

  return d.innerHTML;
}
