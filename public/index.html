*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

<script>
var articles = [{"title":"Admissions Tour: Being a Person","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/admissions-tour-being-a-person","category":"fun","categoryLabel":"Interesting Reads","wordCount":808,"readingTime":5,"content":"<p>Welcome! Let’s gather so you can all hear me. It’s wonderful that you’re applying to Be a Person—and, specifically, that you’re applying here! My name is Claire, and I’ve been leading these tours all summer.</p><p>We’ll start by looking at an example of housing options, so follow me.</p><p>This is a “common space” or “living room.” As you can see, it’s super cozy—furry beanbag chairs, low tables, big screen. You might use your living room for hanging with friends, scrolling on your phone, gaming, forcing yourself to do yoga, or just holding sad poses while crying. What’s awesome is that you decide what to do based on your unique goals, and also on your individual level of dread. It fits our core value of “Self-Direction,” which you saw in the PowerPoint earlier.</p><p>Moving on to the kitchen: there are also so many ways to personalize the meal plan. You’re going to take ownership of your meals, and the choices are endless: vegan, kosher, halal, vegetarian, gluten-free, keto, paleo, Organic and Sustainable, Totally Unsustainable, Handsome Man TikTok, What Zendaya Eats in a Day, American Girl Doll food. I’m picky, and every day I find something. You’ll have a card, and you just swipe it for groceries, takeout, whatever. There are a bunch of decent restaurants and really something for everyone—I mean, matcha, anyone? If you find yourself up all night, like, scanning thousands of your life mate’s personal e-mails, there’s food available 24/7! The card swipes will show up on a bill you get at the end of every month—there’s always someone who’s, like, “Whaaaaaaaat?”</p><p>Now I’m going to tell you about the many options for real-world experience, because they’re right outside your door: getting your car inspected, pretending you don’t see a guy on the street asking for money, or even bringing something to get notarized at a random bank. You’ll also have the chance to place yourself in assorted experiences for which you will receive compensation, which aligns with our core value of “Enrichment.” A lot of people do finance or law, but there are paths in art or writing as well. For people who choose those, we offer a certificate in self-doubt. Anyway, I’d say that no matter what they do, almost everyone here is driven by a deep sense of responsibility to themselves.</p><p>Once you’re in a paid experience, there are awesome opportunities to compete with co-workers for stuff like “eye contact from the boss” and “getting invited to the conference in Hawaii.” Promotions and raises do happen, unless you work at a nonprofit like I do, ha ha. There are also people here who never participate in paid experiences but somehow have endless swipes on their card—they don’t self-identify, but you figure it out, because they choose Danish-modern-furniture shopping as one of their real-world experiences.</p><p>Let’s keep going. I’ll stop at this room with the bed and answer the question that comes up on every tour: How do people match up to live together? So, you’ll match based on things like—just for example—how much do you party, how neat are you, do you sleep late or get up early, did you vote for Trump, do you want kids, can you stand each other’s families, are you Jewish, Christian, Muslim, Hindu, etc. The matching is something you’re going to do on your own, based on those preferences.</p><p>Another question I always get: What if you match with someone and it doesn’t work out? So, this happens, and it even happened to me! First of all, there are counsellors you can talk to in order to deal with issues like these, but you can also just switch to a new match or move to a single. That involves some simple paperwork with a lawyer—I actually did it, it was totally not a big deal. It just turned out that we were on different schedules, and he was secretly having this whole sex thing with a chatbot.</p><p>Before we close, I want to tell you about why I chose to be here, and—more important—why I stayed. I mean, when I got here, it just felt like I could be myself. Then, once I was here for a little while, I started to wonder: Who is that self? And then, what is a self? Does anyone have one? And does anything matter? But I realized I just needed to keep busy, and so I started leading these tours, and getting involved in other stuff—intramural Quidditch, Mustard-Tasting Club, rubber-duck racing, which is hilarious because they just bob. There might be alcohol involved sometimes, but you didn’t hear that from me! I also started studying computer science so I could install spyware on my ex-life match’s computer. Just kidding—kind of! Anyway, I’ll leave you at the bookstore, so you won’t forget to pick up your “I’m a Person” merch. ♦</p>"},{"title":"\"Credible military storytelling\": Ubisoft announce playtests for new Ghost Recon game alongside a sizeable Wildlands update and a Future Soldier giveaway","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/credible-military-storytelling-ubisoft-announce-playtests-for-new-ghost-recon-game-alongside-a-sizeable-wildlands-update-and-a-future-soldier-giveaway","category":"gaming","categoryLabel":"Gaming","wordCount":596,"readingTime":3,"content":"<p>Ailing Clancy series turns 25</p>\n    \n  \n  \n  \n  \n            <p>Much like the CIA spreading misinformation ahead of a cheeky little regime change, Ubisoft have begun talking about their next proper Ghost Recon game. According to live producer Irina-Gabriela Popa, it'll be \"a fun, fresh experience that stays true to everything that defines Ghost Recon – tactical action, large scale operations, credible military storytelling and, of course, the Ghost Unit.”</p>\n<p>They're planning closed tests by way of a new <a href=\"https://register.ubisoft.com/ghost-recon-insider-program/en-GB\" target=\"_blank\" rel=\"noopener\">insider programme</a>. All this comes in the course of Ghost Recon's 25th birthday celebrations. Happy birthday, Ghost Recon! How will you be celebrating? Strapping into your hologoggles and invading some plausibly deniable fictitious nation with graphics-card-pleasing scenery and a lot of Bad Hombres to synch-shoot? Capsizing a helicopter whilst trying to escape from a failed assassination attempt? Gosh, these ghosts are such jokers.</p>\n<p>Ubisoft have just hosted a 25th anniversary livestream in which they've announced a bunch of treats for existing specimens of spectral patrolling. 2017 open world iteration Ghost Recon: Wildlands is <a href=\"https://store.steampowered.com/news/app/460930/view/677378351435874431?l=english\" target=\"_blank\" rel=\"noopener\">getting an update</a> that brings back an old Predator-themed mission, while introducing some new Last Rites missions. The latter see you hunting down a cult leader who lives in a region abundant in trees and swamps. That's her in the picture up top, looking like she's gotten lost on her way to a <a href=\"https://www.rockpapershotgun.com/games/dragon-age\" target=\"_blank\" rel=\"noopener\">Dragon Age</a> cosplay competition.</p>\n<p>The update also includes a load of new settings, letting you fiddle with things like the weather, enemy perception and how easy vehicles are to break, together with a tech overhaul boasting \"improved distance rendering, enhanced lighting and shadows, and a sharper image targeting 4K resolution.\"</p><p>I reviewed Wildlands back in the day and found it to be, well, a Tom Clancy game set in Bolivia. It's better in multiplayer, but then again, most open world shooters are. Here's a chunk from Brendy's RPS <a href=\"https://www.rockpapershotgun.com/ghost-recon-wildlands-review-pc\" target=\"_blank\" rel=\"noopener\">review</a>. \"What Ubi really want here is to have their quinceañera cake and to eat it. To fill their game with wise-looking women in traditional dress shovelling hay come rain or shine, but also to have their over-the-top ridiculous action game as well. They are welcome to try this, of course. Contrast is a great atmospheric technique and such a project definitely could be achieved with a little thoughtfulness and characterisation. But there’s none of that here.\"</p>\n<p>As part of the 25th anniversary, Ubisoft are also giving away copies of Ghost Recon: Future Soldier, a 2012 cover-shooter best known for its adaptive camo, which renders the Ghosts see-through when stationary or moving slowly. The catch is that you'll need to sign up to Ubisoft Connect, and redeem a copy by August 13th. I remember Future Soldier being a routine sneak-o-banger, but I do find it interesting to revisit such \"near-future\" fantasies like this and think about how their notions about military tech (for example, drones) and geopolitics have aged. If you're more eager to dust off the multiplayer - sorry, Ubi <a href=\"https://www.rockpapershotgun.com/rainbow-six-vegas-and-more-ubisoft-games-ending-online-services-this-year\" target=\"_blank\" rel=\"noopener\">pulled the servers</a> in 2021.</p>\n<p>As a series, Ghost Recon's recent fortunes have been rocky. 2019's Ghost Recon: Breakpoint was a bucket of bolts. \"Any life breathed into Ghost Recon Breakpoint will have to be pumped into it by you and your friends,\" Matt Cox wrote in our <a href=\"https://www.rockpapershotgun.com/wot-i-think-ghost-recon-breakpoint\" target=\"_blank\" rel=\"noopener\">review</a>, \"and you'd do better to save your breath for other games.\" In 2022, Ubisoft also cancelled a new free-to-play PvP instalment called Ghost Recon Frontline. That was a few years before they teamed up with Tencent to <a href=\"https://www.rockpapershotgun.com/tencent-hand-ubisoft-a-big-wad-of-cash-to-spin-out-assassins-creed-far-cry-and-rainbow-six-as-a-separate-business\" target=\"_blank\" rel=\"noopener\">rebuild their business around a core of putative billion-dollar licenses</a>, while laying a lot of people off.</p>"},{"title":"Fraud Claim Over \"No Blowback\" Assurance by Private School to Complaining Parents, Followed by Children's Expulsions, Can Go Forward","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/14/fraud-claim-over-no-blowback-assurance-by-private-school-to-complaining-parents-followed-by-childrens-expulsions-can-go-forward/","category":"law","categoryLabel":"Law","wordCount":1096,"readingTime":6,"content":"<p>Some excerpts from the long <a href=\"https://appellate.nccourts.org/opinions/?c=1&amp;pdf=46058\" target=\"_blank\" rel=\"noopener\"><em>Turpin v. Charlotte Latin Schools, Inc.</em></a>, decided today by the N.C. Supreme Court, in an opinion by Justice Richard Dietz, joined by Chief Justice Paul Newby and Justices Philip Berger Jr., Tamara Barringer, and Trey Allen:</p>\n<blockquote><p>According to the complaint in this case, Plaintiffs Doug and Nicole Turpin sent their children to a private school called Charlotte Latin School. Beginning in the summer of 2020, the school began to change its curriculum to focus on politicized issues of race and gender identity. At some point, the Turpins learned that the school was teaching their sixth-grade child various polarizing concepts such as \"Republicans are white supremacists.\" The school also required young students to read books on sexuality and gender identity that were not age appropriate.</p>\n<p>The Turpins started organizing with other parents to voice their concerns about the school curriculum in 2021. Eventually, the Turpins scheduled a meeting with school leadership. At the meeting, the school was not interested in discussing the Turpins' concerns. Instead, the school terminated the Turpins' enrollment contracts and expelled their children with no advance warning….</p></blockquote>\n<p>The parents sued for, among other things, fraud, and the court let the claim go forward; here's the majority's analysis (the partial dissent doesn't focus on the particular \"no blowback\" statement that the majority discusses here):</p>\n<blockquote><p>To bring a claim for fraud, a plaintiff must allege a \"(1) false representation or concealment of a material fact, (2) reasonably calculated to deceive, (3) made with intent to deceive, (4) which does in fact deceive, (5) resulting in damage to the injured party.\" …</p>\n<p>Here, the complaint alleges that Charlotte Latin promised the Turpins there would be no \"blowback\" or \"retaliation\" against them or their children if they met with school leadership to discuss their concerns; that this promise was false and, from the beginning, Charlotte Latin intended to deceive the Turpins and lure them to the meeting in order to create a pretext for expelling the children; that the Turpins believed Charlotte Latin's promise and spoke openly about their concerns because they believed the school would not use those discussions as the pretextual grounds to expel the children; that the school, in that same meeting, expelled the children, as they intended from the outset, despite promising the Turpins they would not do so; and that the school's deceit caused significant damage to the Turpins.</p></blockquote>\n<blockquote><p>Again, as with the contract claim, these allegations on their face satisfy the requirements of notice pleading….</p>\n<p>The Court of Appeals held that facts disclosed in the emails necessarily defeated the fraud claim. The court explained that the allegedly fraudulent statement is contained in a series of emails where the Turpins asked to meet school leadership to discuss the curriculum for one of their children's classes. The allegedly false statement is this sentence in a response email from Charlotte Latin to the Turpins: \"Our teachers do not retaliate and there will be no blowback, I assure you.\"</p>\n<p>This statement, according to the Court of Appeals, only promised no \"blowback from <em>the teacher</em> towards plaintiffs' child.\" That blowback from the teacher did not occur, the court reasoned, because the child's \"removal from the school was an <em>ancillary effect</em> of the termination of the enrollment contract <em>between plaintiffs and defendants</em>,\" not a retaliatory action by \"a teacher.\"</p>\n<p>This reasoning turns the standard of review on its head. \"When reviewing a Rule 12(b)(6) motion, we treat the complaint's factual allegations as true and view them in the light most favorable to the plaintiff.\" Viewed in the light most favorable to the Turpins, the promise of no \"blowback\" contained in the email is not nearly as narrow as the Court of Appeals interpreted it. Instead, that promise of \"no blowback\" plainly included a promise not to terminate the Turpins' enrollment contract and kick the child out of school.</p>\n<p>This discussion began with the Turpins emailing school leadership about one of their children, a sixth grader taking a humanities class. The Turpins explained that the humanities teacher taught the students that \"Republicans are white supremacists\" and that \"what Republicans stand for is racial suppression and white supremacy in action.\" The Turpins also recounted many other \"left wing progressive\" topics in the course that they believed were wrongly politicized and inappropriate for a sixth grader. When asking to meet with school leadership to discuss their concerns, the Turpins emphasized that they did not want their child \"to experience any possible blowback because of what we are bringing to your attention\":</p>\n<blockquote><p>I wanted to discuss with you a situation that is of serious concern to Nicole and I at your convenience. I would prefer that we discuss this situation on a call, before you address this with the teacher I am referencing in this email. We do not want [our child] to experience any possible blowback because of what we are bringing to your attention.</p></blockquote>\n<p>In response to this email, the school stated that its teachers \"do not retaliate\" and that \"there will be no blowback, I assure you\":</p>\n<blockquote><p>Thank you for the email. You make some serious claims that I need to investigate with the teacher, which is only fair so she can provide context. Our teachers do not retaliate and there will be no blowback, I assure you. Please give me a day or two to look into it and will get back to you shortly.</p></blockquote>\n<p>It is entirely reasonable to view the meaning of the term \"no blowback\" in this context to mean <em>more</em> than just retaliation by the teacher in the classroom. After all, the school's email expressly assured the Turpins <em>both</em> that there would be no retaliation from the teacher <em>and</em> that there would be no blowback, which a reasonable person certainly could interpret as being two separate things.</p>\n<p>But even more fundamentally, in ordinary English usage, when parents want to discuss a sensitive topic with school administrators but caution that they do not want their child to \"experience any possible blowback because of what we are bringing to your attention,\" and the school administrator responds with \"there will be no blowback, I assure you,\" it is quite reasonable to understand the assurance of \"no blowback\" to include terminating the child's enrollment at school. Thus, when we properly apply the standard of review and view this allegation and all its reasonable inferences in the Turpins' favor, not the school's, the assurance went beyond a promise of no blowback from the teacher alone….</p></blockquote>\n<p>The court also allowed parents' separate <a href=\"https://reason.com/volokh/2026/08/14/contract-claim-over-private-school-expulsions-allegedly-caused-by-parents-organizing-against-ideological-curriculum-changes-can-go-forward/\" target=\"_blank\" rel=\"noopener\">breach of contract</a> and <a href=\"https://reason.com/volokh/2026/08/14/dissenting-parents-defamation-claim-over-schools-allegations-of-racism-can-go-forward/\" target=\"_blank\" rel=\"noopener\">defamation</a> claims to go forward.on different grounds.</p>"},{"title":"Models Are Getting Dumber on Purpose - Walter van der Giessen","source":"Hacker News Best","author":"Walter van der Giessen","url":"https://w4g1.dev/blog/models-are-getting-dumber-on-purpose","category":"tech","categoryLabel":"Technology","wordCount":1277,"readingTime":7,"content":"<p>Reasoning scores keep climbing while per-token compute keeps dropping. <a href=\"https://benchlm.ai/best/reasoning-models\" target=\"_blank\" rel=\"noopener\">GLM-5.2</a> scores 99.2% on AIME 2026 with about 40 billion parameters active per token. Qwen3.5 scores 91.3% with 17 billion active. <a href=\"https://www.morphllm.com/deepseek-v4-flash\" target=\"_blank\" rel=\"noopener\">DeepSeek V4-Flash</a> runs 13 billion active. For scale, GPT-4 was rumored to run around 280 billion active parameters in 2023, and it could barely solve an AIME problem. At the small end, <a href=\"https://artificialanalysis.ai/articles/qwen3-5-small-models\" target=\"_blank\" rel=\"noopener\">Qwen3.5 9B</a> fits in 6GB of VRAM quantized and roughly doubles the score of the next best model under 10B parameters on Artificial Analysis's intelligence index. If you only looked at math and code benchmarks, you'd conclude that models are getting smarter per parameter at an absurd rate.</p>\n<p>They are, on those benchmarks. Ask the same models a plain factual question and the picture flips. On <a href=\"https://pricepertoken.com/leaderboards/benchmark/simpleqa\" target=\"_blank\" rel=\"noopener\">SimpleQA</a>, a benchmark of factual recall with no tools allowed, the current leader is Gemini 2.5 Pro at 53%, so the best recall money can buy still misses half the questions. The small models barely register. Artificial Analysis measures Qwen3.5 4B and 9B at hallucination rates of 80 to 82% on its knowledge benchmark, which means that when they don't know a fact, which is most of the time, they make one up. Ask the 9B for the birth year of a minor 19th-century mathematician and you get a confident, plausible, wrong answer. The parameter count didn't drop for free. Labs are trading world knowledge for reasoning skill, and the trade is deliberate.</p>\n<h2>What the parameters were for</h2>\n<p>Facts take space. Research on knowledge capacity (the \"Physics of Language Models\" series has the cleanest measurements) puts it on the order of two bits of factual knowledge per parameter. If you want a model that knows the birth year of every minor Wikipedia figure, the population of every Dutch municipality, and the argument order of every function in every npm package, you pay for that in weights, and it's a big part of why frontier models grew to trillions of parameters.</p>\n<p>Reasoning compresses much better than facts do, because it's a relatively small set of procedures applied over and over: break the problem into parts, track intermediate state, check your own work, backtrack when a step fails. Distillation and reinforcement learning on verifiable tasks turn out to transfer those procedures into small models remarkably well. Phi-4 is 14 billion parameters, trained heavily on synthetic textbook-style data, and it's good at math and bad at trivia, which tells you exactly what its training data contained. That mix used to look like a limitation of the synthetic-data approach. It now looks like the design goal.</p>\n<p>The knowledge that survives the trade has a shape. These models are generalists: they know a little about nearly everything and almost nothing in depth. Ask one about PostgreSQL and it knows what it is, what it's good at, and roughly how MVCC works, but ask which version added a specific planner feature and you're back to invented facts. That's the right layer to keep in weights, because breadth is what lets a model understand what a question is about, know what to look up, and judge whether a source is plausible. The depth is cheap to retrieve and expensive to store, so it's the part that goes.</p>\n<h2>Facts rot, procedures don't</h2>\n<p>A frontier training run takes months and costs hundreds of millions of dollars, and the moment it finishes, the facts inside it start going stale. Library APIs change, prices change, people change jobs, and half of what a 2024 model believed about the JavaScript ecosystem was outdated before the model shipped. Every fact you bake into weights has a shelf life, and the only way to refresh it is another training run.</p>\n<p>The procedures don't rot. Algebra worked the same way in 1970 as it does now, and so does breaking a problem down or spotting a contradiction between two sources. A model that's mostly procedure and only lightly loaded with facts doesn't age the way a knowledge-heavy model does. Its training cutoff matters much less, because the current state of the world was never supposed to live in the weights in the first place. I think this is the best argument for the whole approach: it decouples the expensive, slow artifact (the trained model) from the thing that changes daily (what's true).</p>\n<h2>The harness carries the knowledge</h2>\n<p>If the model doesn't know things, something else has to, and that something is the harness: retrieval over a knowledge base, tool calls, web search, a filesystem full of docs. I wrote earlier that <a href=\"https://w4g1.dev/blog/rust-is-a-harness\" target=\"_blank\" rel=\"noopener\">Rust is a harness</a> for agents, a source of cheap machine-checkable feedback. This is the same shape from the other side. The model contributes reasoning, and everything it reasons about gets supplied at runtime.</p>\n<p>You can already watch agents work this way. A coding agent doesn't need to have memorized your dependency's API surface, because it greps node_modules or reads the docs before calling anything, and its answer is grounded in the version you actually have installed rather than whichever version dominated the training data. The recall that used to be a fixed cost in every forward pass became an on-demand lookup.</p>\n<h2>A frontier model on your GPU</h2>\n<p>Follow the trend a couple of years out and I think we get a model with frontier-quality reasoning, Fable-quality, that runs on a single consumer GPU. The compute half is nearly there. DeepSeek V4-Flash reasons with about 13 billion active parameters per token, well within consumer-GPU range. What doesn't fit is the other 271 billion parameters sitting in its experts, and expert layers are mostly fact storage. That's the part this whole trade makes optional. Strip the knowledge out and total size shrinks toward active size, and a 20 to 40B model at 4-bit quantization fits on the 24GB card that's been sitting in gaming PCs since 2022.</p>\n<p>The catch is that it won't know much. Ask it a bare factual question with no tools attached and the right behavior is to say it doesn't know and go look it up. Paired with a decent harness, that's most of what I use a frontier model for today, running locally with no per-token bill and no data leaving the machine.</p>\n<h2>This mostly solves hallucination</h2>\n<p>The part I find most promising is what this does to hallucination. When a fact lives in weights, a wrong fact is unfindable and unfixable. You can't grep the weights, you can't diff them against last month, and correcting one error means a fine-tune that might break who knows what else. The model states the wrong fact with the same fluent confidence as a right one, and there's no artifact to check it against.</p>\n<p>When the fact lives outside the model, a wrong answer has an address. The model cites a document, so you can open the document. If the document is wrong, you edit the document, and every future query gets the correction, which beats waiting for the next training run by roughly a year. Retrieval doesn't get you to zero, since a model can still misread a source or stitch two of them together wrong, but a claim with a source is checkable and a claim from weights isn't. A wrong fact in a knowledge base is an ordinary data bug, the kind we already know how to trace, fix, and write a regression test for.</p>\n<p>There's a version of this future where the model card stops listing a knowledge cutoff at all, because what's left in the weights goes stale on a scale of years instead of weeks. The model just gets handed the world's current state at runtime, the same way a CPU gets handed a program.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
