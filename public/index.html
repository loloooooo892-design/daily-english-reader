<script>
var articles = [{"title":"Race to the Bottom: Great Moments in the History of Leaders Talking About Asses","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/race-to-the-bottom-great-moments-in-the-history-of-leaders-talking-about-asses","category":"fun","categoryLabel":"Interesting Reads","wordCount":576,"readingTime":3,"content":"<p>October 28, 2026</p><blockquote><p>I looked at his ass. And then I looked at his legs. I said, “His ass—shit, it’s like a pile of muscle.”</p></blockquote><blockquote><p>—<em>President Donald Trump, on Senator Jon Husted.</em></p></blockquote><p>During the long Russian winters, Joseph Stalin would gather colleagues at his dacha, in the birch forest outside Moscow. After dinner, they would sit by a fire, and, if Stalin’s mood was right, they would play a drinking game called Who Has the Best Bum in Moscow? The game consisted of each player going around and talking about who they thought had the shapeliest bottom in the Politburo. Stalin would indicate the winner by declaring, “Where did that guy go to school—the University of Perfectly Formed Buttocks?” He would then laugh, and his colleagues would laugh along and applaud. If they didn’t applaud appropriately, they were shot.</p><p>On the train from Washington to Gettysburg, Abraham Lincoln made notes on his upcoming speech. Across from him sat his right-hand man and Secretary of State, William Seward. At one point, Lincoln dropped his pencil. Seward stood and then bent over to fetch it. Though Seward was sixty-one at the time, Lincoln noted, “My God, Bill. I could rest a pitcher of iced tea on that ass. What a marvellous, muscular bubble it is.” Seward thanked the President. Lincoln then looked out the train window and asked, “What’s another way to say eighty-seven years?”</p><p>On June 20, 1972, President Richard Nixon met in the Oval Office with his then chief of staff, H. R. (Bob) Haldeman. Like many conversations in Nixon’s Oval Office, this one was recorded. More than eighteen minutes were lost, but Nixon’s personal secretary, Rose Mary Woods, kept notes:</p><blockquote><p><em>NIXON</em>: Do you ever urinate outdoors, Bob?</p></blockquote><blockquote><p><em>HALDEMAN</em>: I’m sorry, sir?</p></blockquote><blockquote><p><em>NIXON</em>: No . . . what I meant was . . . have you heard that new song?</p></blockquote><blockquote><p><em>HALDEMAN</em>: Which one, sir?</p></blockquote><blockquote><p><em>NIXON</em>: “Brandy (You’re a Fine Girl)”? Surely you’ve heard it.</p></blockquote><blockquote><p><em>HALDEMAN</em>: I have, yes, Mr. President.</p></blockquote><blockquote><p><em>NIXON</em>: She serves the sailors whiskey and wine—just marvellous.</p></blockquote><blockquote><p><em>HALDEMAN</em>: It’s a wonderful song.</p></blockquote><p><em>Rustling sounds as Haldeman stands to refill his coffee.</em></p><blockquote><p><em>NIXON</em>: Man to man, Bob, I hope your wife appreciates your figure as much as this nation does.</p></blockquote><blockquote><p><em>HALDEMAN</em>: Oh . . . um . . . thank you, sir.</p></blockquote><blockquote><p><em>NIXON</em>: What a blessing to have pert buttocks.</p></blockquote><blockquote><p><em>HALDEMAN</em>: Indeed.</p></blockquote><blockquote><p><em>NIXON</em>: Is it just me or have Kissinger’s bums got huge? Bums like pillows. That will do for today, Bob.</p></blockquote><p>“Asses, asses, asses, asses.” So said Charles de Gaulle as he walked behind his troops through the streets of Paris after the Liberation, in 1945—except he said it in French. “This nation owes its freedom and its future to the taut, firm buttocks of its brave young men. Let us go forward on your behinds!”</p><p>During the Egyptian President Anwar Sadat’s historic visit to Jerusalem in 1977, he asked to meet with the former Israeli Prime Minister Golda Meir. Sources who were there that day say the two shook hands, before Meir welcomed Sadat in his native Arabic. Looking at his backside, she then whispered, “That’s quite a tuchus.” Sadat smiled, confused. Meir pointed to his behind, and said, “Apparently the Pyramids aren’t the only things made of stone. Hey, let’s call it the Middle East piece.” They laughed and laughed but didn’t keep in touch after that. ♦</p>"},{"title":"Modern Warfare 4's newest map is actually older than the Gen Z & Alpha teens who will play it","source":"PC Gamer","author":"Morgan Park","url":"https://www.pcgamer.com/games/call-of-duty/modern-warfare-4s-newest-map-is-actually-older-than-the-gen-z-and-alpha-teens-who-will-play-it/","category":"gaming","categoryLabel":"Gaming","wordCount":620,"readingTime":4,"content":"<p>After 23 mainline games, there are far more Call of Duty maps than anyone can reasonably remember. That's why I'm impressed it took just one screenshot for several fans (with back pain, presumably) to clock that an upcoming Modern Warfare 4 map is actually a remake of a map that's over 20 years old.</p><p>Backstab, the new 6v6 map arriving on November 6, is a dead ringer for <a href=\"https://callofduty.fandom.com/wiki/Burgundy\" target=\"_blank\" rel=\"noopener\">Burgundy</a>, first seen in Call of Duty 2 way back in 2005. That means Backstab is older than the teenagers currently playing Call of Duty—do with that information what you will.</p><p>A number of people noticed this around the same time, but I'll credit Reddit user <a href=\"https://www.reddit.com/r/modernwarfare4/s/hxFsMsjkPw\" target=\"_blank\" rel=\"noopener\">wizward64</a> for providing helpful visuals.</p><p>Apologies to the reader typing \"This was a classic, show some respect!\", but there's no way I would've noticed the resemblance on my own. I played Call of Duty 2 on the Xbox 360 when it was new, but not all that much multiplayer. I really like the <a href=\"https://youtu.be/QQrsnytVwns?t=49\" target=\"_blank\" rel=\"noopener\">look of the original Burgundy</a>, though: The desaturated green grass and beige brickwork of the French countryside still looks so clean and attractive 21 years later. I'm also now wondering if my favorite Day of Defeat: Source map (<a href=\"https://dayofdefeat.fandom.com/wiki/Donner/Gallery\" target=\"_blank\" rel=\"noopener\">Donner</a>) snuck in some of these CoD 2 assets, or if all WW2 shooters of this era were riffing on the same Saving Private Ryan scenes.</p><p>The layouts are near 1:1, which is neat, though the theming is clearly altered. Burgundy was a WW2 map in France (duh) and Backstab appears to take place in either Russia or North Korea (I think I see Cyrillic script on those signs, so leaning toward the former). Backstab is also snowy, so maybe this town will exist in the eventual Russian chunk of the Hajin DMZ map.</p><p>Burgundy was a pretty small map for Call of Duty 2, and I expect it'll feel even smaller at Modern Warfare 4's quicker pace. The map's signature feature was a pair of two-story buildings that overlooked the central courtyard from opposite sides of the battlefield. High <a href=\"https://www.pcgamer.com/tag/microsoft-windows/\" target=\"_blank\" rel=\"noopener\">windows</a> with usable machine gun emplacements made these buildings important for map control, but those windows will presumably become regular sniper nests in Backstab.</p><p>Call of Duty is famous for recycling old maps, but a deep dive into the vault like this feels different from the usual. This isn't Infinity Ward remaking a popular map to please expectant fans like we see with yearly iterations of Nuketown and Shipment, but instead pulling a relatively unknown goodie and refreshing it for a new audience.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>The OG Call of Duty studio has apparently been doing this for a while and I didn't notice: As commenters point out in that same Reddit thread, the Modern Warfare 2 (2022) map <a href=\"https://callofduty.fandom.com/wiki/Taraq\" target=\"_blank\" rel=\"noopener\">Taraq</a> was a remake of CoD 1's <a href=\"https://callofduty.fandom.com/wiki/Neuville\" target=\"_blank\" rel=\"noopener\">Neuville</a> and Modern Warfare 2019 map <a href=\"https://callofduty.fandom.com/wiki/Suldal_Harbor\" target=\"_blank\" rel=\"noopener\">Suldal Harbor</a> was a remake of CoD 1's <a href=\"https://callofduty.fandom.com/wiki/Harbor\" target=\"_blank\" rel=\"noopener\">Harbor</a>. Hey, those maps were pretty good.</p>\n\n<p>Morgan has been writing for PC Gamer since 2018, first as a freelancer and currently as a staff writer. He has also appeared on Polygon, Kotaku, Fanbyte, and PCGamesN. Before freelancing, he spent most of high school and all of college writing at small gaming sites that didn't pay him. He's very happy to have a real job now. Morgan is a beat writer following the latest and greatest shooters and the communities that play them. He also writes general news, reviews, features, the occasional guide, and bad jokes in Slack. Twist his arm, and he'll even write about a boring strategy game. Please don't, though.</p>"},{"title":"The Law and Democrats Allegedly Recruiting Second \"Dan Sullivan\" to Run in Alaska Senate Race","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/10/29/the-law-and-democrats-allegedly-recruiting-second-dan-sullivan-to-run-in-alaska-senate-race/","category":"law","categoryLabel":"Law","wordCount":541,"readingTime":3,"content":"<p>Election law expert and UCLA Prof. Rick Hasen (Election Law Blog) has a <a href=\"https://electionlawblog.org/2026/the-legal-implications-or-not-of-the-new-york-times-bombshell-story-alleging-democrats-recruited-the-second-dan-sullivan-to-run-in-the-alaska-u-s-senate-race/\" target=\"_blank\" rel=\"noopener\">post</a> about this; an excerpt:</p>\n<blockquote>\n<p><a href=\"https://www.nytimes.com/2026/10/28/us/politics/alaska-dan-sullivan-conspiracy-peltola.html\" target=\"_blank\" rel=\"noopener\">Today's New York Times story</a>, if true, strikes me as a political bombshell: despite public denials of a connection, people associated with Democratic U.S. Senate candidate in Alaska Mary Peltola and Democratic Party officials recruited the second \"Dan Sullivan\" to run against the incumbent Republican U.S. Senator from Alaska, Dan S. Sullivan. The hope would be to siphon votes away from Sullivan. (As a political play, I'm skeptical that this would work, given Alaska's <a href=\"https://electionlawblog.org/2026/donald-trump-misunderstands-that-ranked-choice-voting-will-help-not-hurt-alaska-senator-dan-sullivan/\" target=\"_blank\" rel=\"noopener\">ranked choice voting approach</a> would allow ranking both Dan Sullivans as 1 and 2, thereby not helping Peltola.)</p>\n<p>But what, if any, are the <em>legal</em> implications of the story (if true)?</p>\n<p><strong>To begin with</strong>, I don't think it has any bearing at all on <a href=\"https://www.courtlistener.com/docket/75009254/united-states-v-state-of-alaska/\" target=\"_blank\" rel=\"noopener\">the current litigation</a> in which the U.S. Department of Justice seeks to delay certification of the race if Dan S. Sullivan narrowly loses on grounds of purported voter confusion. The lawsuit is not going anywhere for any number of reasons, but even assuming DOJ's theory that it can sue to block certification, it is irrelevant as to <em>why</em> voters might face confusion over the two Dan Sullivans. (This has not stopped DOJ from <a href=\"https://www.courtlistener.com/docket/75009254/33/united-states-v-state-of-alaska/\" target=\"_blank\" rel=\"noopener\">now supporting DSCC intervention</a> so that it can get discovery over a potential \"conspiracy\"). [Disclosure: I will soon be filing a motion to file an amicus brief on my own behalf supporting the State of Alaska in this case.]</p>\n<p><strong>Second</strong>, if there is any evidence that anyone lied under oath about the cooperation between Democrats and Dan J. Sullivan, that could be grounds for a<em> perjury </em>prosecution. So far I'm not aware of any such allegation in the case.</p>\n<p><strong>Third</strong>, this leaves the question whether this could be prosecuted as some kind of conspiracy against voters.</p>\n</blockquote>\n<blockquote>\n<p>To begin with, it is regular practice for people to support candidates for bad motives: Republicans boosting Greens and Democrats boosting Libertarians. It turns out that<a href=\"https://electionlawblog.org/2026/musk-linked-dark-money-network-funded-the-group-behind-cornel-wests-ballot-push/\" target=\"_blank\" rel=\"noopener\"> Elon Musk alone may have bankrolled</a> left-leaning Cornel West's quest to get on the 2024 presidential eiection ballot. The effort in Alaska is just an extreme version of that. From the Times's story: \"Ballot-stacking tactics are common in politics and generally considered legal — and have been employed by both parties in Alaska. But this operation, which has not been reported before, reveals the lengths to which Democrats went to seek advantage in a Senate race that could determine control of the chamber.\" …</p>\n<p>This is a case about someone running for office with impure motives who is lucky enough to have a name that could confuse some voters. The solution to this problem is counterspeech (as in: \"Don't vote for J.! Vote for the real Senator Daniel S. Sullivan\".)</p>\n<p>I don't see how the government could criminalize his running for office for having impure motives. And if it could do so, then it could be a crime every time that the Republican Party backs a Green Party candidate, or Democrats support a MAGA candidate in a primary in the hopes that the candidate would be weaker against a Democrat in the general election. This stuff happens all the time….</p>\n</blockquote>\n<p>Read the <a href=\"https://electionlawblog.org/2026/the-legal-implications-or-not-of-the-new-york-times-bombshell-story-alleging-democrats-recruited-the-second-dan-sullivan-to-run-in-the-alaska-u-s-senate-race/\" target=\"_blank\" r function nextArticle() {

}
