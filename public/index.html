<script>
var articles = [{"title":"Missouri urges Supreme Court to allow for use of congressional map expected to aid Republicans","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/09/missouri-urges-supreme-court-to-allow-for-use-of-congressional-map-expected-to-aid-republicans/","category":"law","categoryLabel":"Law","wordCount":752,"readingTime":4,"content":"<p>Telling the justices that “[a] federal-election-administration disaster is unfolding in Missouri,” Missouri Secretary of State Denny Hoskins <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A304/423214/20260904224734853_1-Hoskins%20v.%20von%20Glahn%20-%20Application%20for%20Stay%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">came to the Supreme Court on Friday night</a>, asking the justices to intervene in a battle over the state’s congressional maps. Hoskins urged the justices to pause a ruling by the Missouri Supreme Court that would require the state to use the map that it adopted in 2022 rather than a new map which could give Republicans an additional seat in the U.S. House of Representatives that it adopted last year and used in its primary elections in August. “No court in American history has <em>ever</em> given such an extraordinary remedy, which inflicts unprecedented chaos on Missouri,” Hoskins contended.</p><p>Justice Brett Kavanaugh, who handles emergency appeals from the region that includes Missouri, has instructed Richard von Glahn, the challenger in the case, to respond by noon EDT on Monday – a federal holiday, which suggests that the court intends to move quickly on the request.</p><p>The dispute has its roots in a push from President Donald Trump last year for states with Republican legislatures to draw new congressional maps – generally a relatively rare step outside of the normal redistricting that follows the decennial census. In September 2025, the Missouri Legislature passed – and Gov. Mike Kehoe <a href=\"https://governor.mo.gov/press-releases/archive/governor-kehoe-signs-missouri-first-map-law\" target=\"_blank\" rel=\"noopener\">signed</a> – HB 1. If successful, Republicans would hold seven of the state’s eight seats in the U.S. House.</p><p>On Dec. 9, 2025, organizers <a href=\"https://themissouritimes.com/breaking-supreme-court-clears-map-referendum-for-november-ballot/\" target=\"_blank\" rel=\"noopener\">submitted</a> boxes containing more than 300,000 signatures in support of a petition to put a statewide referendum on the new maps on the 2026 ballot. On Aug. 4, 2026, the last day on which he could make his certification decision and the day of the state’s primary election, Hoskins rejected the petition, explaining that the state’s constitution “does not authorize a referendum on congressional redistricting plans passed by the General Assembly.”</p><p>Von Glahn, one of the proponents of the petition, went to state court, seeking to reverse Hoskins’ decision and block the state from using the new map. On Thursday, the Missouri Supreme Court <a href=\"https://electionlawblog.org/wp-content/uploads/Opinion_SC101805.pdf\" target=\"_blank\" rel=\"noopener\">granted</a> that request. In a unanimous ruling, the state supreme court explained that “the plain language of … the Missouri Constitution authorizes a referendum as to ‘any act of the general assembly’ and no exception applies.” As a result, the court concluded, the referendum petition “was legal, sufficient, and timely.”</p><p>The state supreme court rejected Hoskins’ argument that allowing the referendum to go forward and not using the new congressional map would create “confusion, expense, and practical difficulties,” calling it “wholly unpersuasive.” Among other things, the court suggested, Hoskins himself created these problems by delaying his action on the referendum petition until the last day to do so.</p><p>Hoskins, the state court said, also fundamentally misunderstood the status of HB 1 pending the vote on the referendum. The new map does not become law unless a majority of the voters approve, the state court stressed; “the 2022 map is the only map in effect.”</p><p>In his filing on Friday night, Hoskins argued that the Missouri Supreme Court’s decision violates the U.S. Constitution’s <a href=\"https://constitution.congress.gov/browse/article-1/section-4/clause-1/\" target=\"_blank\" rel=\"noopener\">elections clause</a>. That provision, he said, gives state legislatures – not a small number of voters who sign a petition – the power to prescribe the “Times, Places, and Manner” of federal elections. The Supreme Court, he said, “has never held that just 3.3% of a State’s voters can unilaterally suspend a disfavored congressional map by submitting a referendum petition.”</p><p>The state supreme court’s ruling, he continued, also unconstitutionally disenfranchised “hundreds of thousands” of voters by putting them in new districts, where they will be “forced to vote on General Election candidates they had no role in choosing.”</p><p>Hoskins suggested that the state was “genuinely unsure whether it can switch its governing congressional map in time to run a timely federal election.” By contrast, he emphasized, von Glahn “will get his referendum vote on Missouri’s congressional map regardless of what this Court does. The only question is whether he (joined by a small minority of the State’s voters) can void a congressional map <em>before</em> he gets his vote.”</p><p>Finally, stressing the importance of “much needed clarity” for “confused election officials,” Hoskins asked the justices to enter an administrative stay – that is, an immediate pause of the state supreme court’s ruling to give them time to consider his request.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Missouri urges Supreme Court to allow for use of congressional map expected to aid Republicans</em>, SCOTUSblog (Sep. 5, 2026, 11:47 AM), https://www.scotusblog.com/2026/09/missouri-urges-supreme-court-to-allow-for-use-of-congressional-map-expected-to-aid-republicans/</p>"},{"title":"The Extraordinary Untold Story of Freddie Mercury: Mary Austin on Her Best Friend–and Love of Her Life","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/09/09/queen-freddie-mercury-mary-austin/","category":"fun","categoryLabel":"Interesting Reads","wordCount":528,"readingTime":3,"content":"<p>Mary Austin was the woman behind Freddie Mercury, quietly supporting him for decades, from their intense early romance to the long years they remained close friends after accepting that he was gay. The vast legacy he left her—his home, much of his fortune, and his most personal belongings—has been a mixed blessing that she has spent her life trying to navigate with loyalty and discretion. As Simon Hattenstone explores Austin’s life in this interview, the unresolved emotion of the shared past with Mercury is still palpable.</p>\n<blockquote>\n<p>Did the piano change him? “Yes, there was much more purposeful energy. He would sit at the piano, play the odd key, hum a bit and he looked very happy. Transported.” By now they were spending less time together. When she was working at Biba, he would often be sleeping. When she returned home, he would be preparing for a gig.</p>\n<p>They’d been living together for four years when Mercury said he had something to tell her. He struggled to get the words out. He said, ‘I think I’m bisexual.’ I said ‘No, Freddie, I think you’re gay.’” He didn’t argue. Was that a huge upset? “No, it was a huge relief, because I wasn’t sure whether we were travelling in the same direction any more. Some time earlier I saw a dress and thought, that would be a really nice wedding dress. I asked Freddie, is it worth me buying it, and he looked at me and shook his head. So I knew from there on …”</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on rock music\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/06/05/the-inside-story-of-the-athens-music-scene/\" target=\"_blank\" rel=\"noopener\">The Inside Story of the Athens Music Scene</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTommy Tomlinson | Garden &amp; Gun | June 1, 2026 | 5,453 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“How did the college football town spawn the B-52s, R.E.M., and Widespread Panic, to name just a few? The maestros and misfits who led Athens’s rise to one of the world’s most influential and improbable music towns tell all.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/01/08/acid-blues-slight-return/\" target=\"_blank\" rel=\"noopener\">Acid Blues (Slight Return)</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJames McManus | The American Scholar | January 5, 2026 | 3,188 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The music of Jimi Hendrix continues to strike a chord.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/04/14/the-portal-opens/\" target=\"_blank\" rel=\"noopener\">The Portal Opens</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAmanda Petrusich | The New Yorker | April 14, 2025 | 9,925 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“People who love Phish do so with a quasi-religious devotion. People who dislike Phish do so with an equal fervor.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/05/22/how-kid-rock-went-from-americas-favorite-hard-partying-rock-star-to-a-maga-mouthpiece/\" target=\"_blank\" rel=\"noopener\">How Kid Rock Went From America’s Favorite Hard-Partying Rock Star to a MAGA Mouthpiece</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDavid Peisner | Rolling Stone | May 19, 2024 | 7,785 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The man born Bob Ritchie calls Trump his ’bestie’ and spouts right-wing talking points. Many close to him wonder what the hell happened.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/05/18/the-dave-matthews-guide-to-living-and-dying/\" target=\"_blank\" rel=\"noopener\">The Dave Matthews Guide to Living and Dying</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAlex Pappademas | GQ | May 18, 2023 | 5,777 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Now 56, Matthews has been singing about mortality for a long time, and he’s confronting its specter in new and surprising ways.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/03/02/all-you-touch-and-all-you-see-dark-side-of-the-moon-at-50/\" target=\"_blank\" rel=\"noopener\">All You Touch and All You See: “Dark Side of the Moon” at 50</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTal Rosenberg | The Ringer | March 1, 2023 | 4,397 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A half-century ago, Pink Floyd unleashed a classic that still lingers on the Billboard charts and in college dorms to this day. But what’s the legacy of the blockbuster album?”</p>"},{"title":"Stylised XCOM-like tactics game Ex Sanguis retains Othercide's obsession with initiative bars, but straps it to a leaner roguelike campaign","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/stylised-xcom-like-tactics-game-ex-sanguis-straps-othercides-obsession-with-timelines-to-a-leaner-roguelike-campaign","category":"gaming","categoryLabel":"Gaming","wordCount":1094,"readingTime":6,"content":"<p>Out now in early access</p>\n    \n  \n  \n  \n\n            <p>\r\nThe nasal greenhorn strategy gamer understands \"strategy\" to be about mastery of space by means of clanging offensives, shining shieldwalls, and brute attrition, but the true Napoleon of Drag-Select knows that strategy is always, primarily, the mastery of time. I don't think Napoleon would have approved of Ex Sanguis. He would not have liked all the willowy clone women made out of congealed blood and pincers. He would have suspected them of being divorcees and Babouvists. But perhaps he would have appreciated the game's fixation with seizing the initiative.\r\n</p>\n<p>\r\nAs with Lightbulb's previous grid-based tactics RPG <a href=\"https://www.rockpapershotgun.com/games/othercide\" target=\"_blank\" rel=\"noopener\">Othercide</a>, Ex Sanguis has you going up against dozens of vaguely eschatological bladespawn with just the three austere and menacing bladegirls. There are generally a half-dozen foes to start with, and reinforcements soon hatch from gross eggsacs around the map. You can't simply overwhelm your opponents, then. Instead, you must pre-empt and interrupt them, anticipating their advance and dancing your best moves in first on the game's fluctuating timeline.\r\n</p>\n<p>\r\nSome abilities are performed instantly, while others trigger after a delay. However initially inconvenient, the delays soon become an asset, as you learn to aim your artillery strikes where you know your enemies <em>will</em> be, a few score ticks from now. Other abilities trigger when an opponent acts, cutting them off. Or when a friendly deals some damage, adding a follow-up attack. A key question is whether to exhaust your regular action points and dip into your Burst bar, which lets you sneak in some extra licks at the cost of wildly postponing the character's next turn.\r\n</p>\n\n<p>\r\nAnd then there's repositioning: you get shoves, gravity pulses, and driving kicks that punt opponents around. This allows you to knock delayed enemy attacks off target, perhaps slamming the noxious seraphim into a boulder, or nudging them into the path of the AOE move you've just queued up with the previous character. As you preview these gambits, the character portraits and action indicators shuffle to and fro on the timeline. On higher difficulties, it's vitally important to avoid a scenario where the whole opposing force can take a turn, one after the other.\r\n</p><p>\r\nWhen I played Othercide, I didn't quite clock how much Lightbulb's approach has in common with Into The Breach. The resemblance feels a bit more prominent in Ex Sanguis. There's no fixed match countdown, true, but you're encouraged to finish fast: the angelbeasts are only going to get more numerous, and you generally aren't required to slaughter all of them - just a surgeon's handful of VIPs or a single enemy map fixture, sulking to the rear.\r\n</p>\n<p>\r\nIt's a messier experience than you'll find in Subset's game, however. The environments are full of blood blisters that blow up when struck, launching nearby characters a few squares. On more crowded maps, a single volatile pustule often triggers a prolonged cascade. The AI in the early access build seems overfond of setting the blisters off, in addition to controlling terrain. Some times, it's hellbent on swarming you; at others, it tries to lock down big portions of the map by preparing a delayed AOE move, wherever it finds itself.\r\n</p>\n\n<p>\r\nThe greater emphasis on terrain damage is one thing that distinguishes the early access version of Ex Sanguis from what I remember of Othercide. The other, more obvious point of departure is that Ex Sanguis has a trimmer roguelike structure, with more focussed progression.\r\n</p><p>\r\nOn which note, here's my best effort at explaining the story: some kind of pesky vampire moon has leeched away the world's vital fluids and memories, reducing all of Creation to an ivory placeholder. You are the Mater, a goddess replete with the simmering intensity of Derek Zoolander. She can spawn duplicates of herself to fight the moon's minions. So far, it's very much the previous game's gothic mommy monster mash on fast-forward – all pout and glare and cod Latin metaphors, without much coherence but with a lot of enjoyable attitude.\r\n</p>\n<p>\r\nIt feels faster partly because there's less going on outside battle. Each run kicks you off with three warriors, allowing you to pick their classes – the initial options are broadly Swordlady, Gunlass and Time Wizardress - and starting abilities. You then trek across a cratered world map, fighting battles (with unlockable higher difficulties) and accumulating Corrupted Blood for campaign progression. Every battle you win nets you a choice of three further abilities or stat boosts per character.\r\n</p>\n\n<p>\r\nYes, we are operating in the realm of <a href=\"https://www.rockpapershotgun.com/games/vampire-survivors\" target=\"_blank\" rel=\"noopener\">Vampire Survivors</a>, just a teeny bit. As in the previous game and many other roguelikes, abilities form complementary sets, which are fun to unearth: for example, Swordlady can inflict bleed with one kind of melee attack, then slurp up the debuff to restore her own health. Eventually, you swill down enough Corrupted Blood from victories to access a bossfight, which functions as a chapter break. It's wise, of course, to pootle around a bit first, levelling up your murderdames and spending a bit of your Corrupted Blood on smaller lore discoveries that come with bonus abilities. When a run is over, whether due to beating a boss or defeat, you'll spend various flavours of ethereal substance on meta-unlocks that give you more things to unlock within runs.\r\n</p><p>\r\nI'm mixed on the new campaign format. I do miss the grottier, denser storytelling of the previous game, which grounded its stark monochrome abstractions in a narrative of obscure medieval abuses: it was like a neo-noir penny dreadful. I also took ghoulish pleasure in the ability to melt down your clone-daughters into primordial soup, treating the weaker ones as health packs for their more accomplished sisters, rather than just levelling everybody up. It's possible there are similarly revolting ideas at play later in Ex Sanguis.\r\n</p>\n<p>\r\nBeyond that, I do wonder how much the new game's battle system and ability design really improves on Othercide's. I haven't yet discovered a blend of reaction and delayed abilities that really captivates me, in terms of how it lets me mess with the timeline and disrupt the horde.</p>\n<p>Still, it's early days – I've only played three hours, and Ex Sanguis will spend at least six months in early access. If you really loved Othercide, I don't think there's anything here that will hugely disappoint you, just yet. You can read more about the game on <a href=\"https://store.steampowered.com/app/3275050/Ex_Sanguis/\" target=\"_blank\" rel=\"noopener\">Steam</a>. Belated clarification: you do not have to be Napoleon or any other celebrated general to have opinions about Ex Sanguis. I'm not sure how Napoleon found his way into my intro, honestly.\r\n</p>"},{"title":"LG Promo Codes and Coupons for September 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/lg-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":978,"readingTime":5,"content":"<p>LG makes many of the <a href=\"https://www.wired.com/gallery/best-tvs/\" target=\"_blank\" rel=\"noopener\">best TVs</a> you can buy. Its C-series TVs are our top pick for the <a href=\"https://www.wired.com/gallery/best-oleds/\" target=\"_blank\" rel=\"noopener\">best OLED TV</a>, and have been for quite some time. Pair it with one of the brand’s great <a href=\"https://www.wired.com/gallery/best-soundbars/\" target=\"_blank\" rel=\"noopener\">soundbars</a>, and you have a top-tier <a href=\"https://www.wired.com/story/how-to-get-the-perfect-surround-sound-speaker-setup/\" target=\"_blank\" rel=\"noopener\">home theater setup</a> that will last for years. While WIRED loves LG mostly for its <a href=\"https://www.wired.com/gallery/best-tvs/\" target=\"_blank\" rel=\"noopener\">TVs</a>, the brand is an electronics giant that makes excellent <a href=\"https://www.wired.com/gallery/best-computer-monitors/#6914f545012b7ad400825775\" target=\"_blank\" rel=\"noopener\">computer monitors</a> and very competitive home appliances like <a href=\"https://www.wired.com/review/lg-studio-smart-3-door-french-door-refrigerator/\" target=\"_blank\" rel=\"noopener\">smart refrigerators</a>. These are all big ticket items, though, so here’s where to find LG promo codes and other ways to save with LG discounts on the var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
