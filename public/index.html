<script>
var articles = [{"title":"Short Circuit: An inexhaustive weekly compendium of rulings from the federal courts of appeal","source":"The Volokh Conspiracy","author":"johnkennethross","url":"https://reason.com/volokh/2026/11/13/short-circuit-an-inexhaustive-weekly-compendium-of-rulings-from-the-federal-courts-of-appeal-84/","category":"law","categoryLabel":"Law","wordCount":1147,"readingTime":6,"content":"<p>Please enjoy the latest edition of <a href=\"http://ij.org/about-us/shortcircuit/\" target=\"_blank\" rel=\"noopener\">Short Circuit</a>, a weekly feature written by a bunch of people at the Institute for Justice.</p>\n<p>New news! This month, IJ client Libby Souder asked the South Carolina Supreme Court to let her resume teaching private swim lessons in her backyard pool, which she'd done for years with city approval and without incident. But after a nosy neighbor (whose life is in no way affected by the lessons) complained, officials reinterpreted an ambiguous provision of the zoning code to shut down Libby's business. <a href=\"https://ij.org/press-release/swim-instructor-appeals-to-south-carolina-supreme-court-after-columbia-banned-her-backyard-business/\" target=\"_blank\" rel=\"noopener\">Click here</a> to learn more.</p>\n<p>New on the <a href=\"https://ij.org/podcasts/short-circuit/short-circuit-454-simulating-your-cell-phone/\" target=\"_blank\" rel=\"noopener\">Short Circuit podcast</a>: Baltimore police can use a \"Hailstorm\" device to stimulate your cell phone and figure out where you are. Do they need a warrant for that?</p>\n<ol>\n<li>President to Voice of America's head: You're fired! VOA head: Only the International Broadcasting Advisory Board can fire me. DOJ: But unitary executive! <a href=\"https://media.cadc.uscourts.gov/opinions/docs/2026/11/25-5314.pdf\" target=\"_blank\" rel=\"noopener\">D.C. Circuit</a>: The president can now sack members of the board at will, and that is enough to satisfy Article II, even if it may cause some delay while the president gets his preferred board members confirmed for them to then sack their subordinates.</li>\n<li>In which the <a href=\"https://ww3.ca2.uscourts.gov/decisions/OPN/24-3308_opn.pdf\" target=\"_blank\" rel=\"noopener\">Second Circuit</a> revives a challenge to New York City rules that prohibit people from, among other things, carrying more than one handgun at a time and registering more than two handguns.  </li>\n<li>In which the <a href=\"https://ww3.ca2.uscourts.gov/decisions/OPN/25-2432_opn.pdf\" target=\"_blank\" rel=\"noopener\">Second Circuit</a> overrules precedent and holds that if your prosecution comes to an end in the form of an \"adjournment in contemplation of dismissal,\" you can indeed pursue malicious-prosecution claims. (This plaintiff's claim fails on other grounds, however.)</li>\n<li>In investigating a leak of classified information to a news outlet, the feds seek orders compelling LinkedIn to turn over records of all the involved journalists' communications over an 18-month period (including with all confidential sources) and to keep it a secret. LinkedIn challenges the orders. <a href=\"https://www.ca4.uscourts.gov/opinions/264303.P.pdf\" target=\"_blank\" rel=\"noopener\">Fourth Circuit</a>: The gov't \"is entitled to a disclosure order,\" \"[b]ut it is not entitled to carte blanche.\" Remand for district court to narrow the disclosures to communications actually relevant to the leak in question and to provide a little secrecy wiggle-room.</li>\n<li>Lowell, Mich. mom frequently denounces public school policies and personnel on social media. School officials do not interfere until she posts: \"Christ said, 'Whoever causes one of these little ones who believe in me to sin, it would be better for him to have a great millstone fastened around his neck and drowned in the depth of the sea.'\" After that, she's told to stop posting about school employees by name or face legal consequences. <a href=\"https://www.opn.ca6.uscourts.gov/opinions.pdf/26a0300p-06.pdf\" target=\"_blank\" rel=\"noopener\">Sixth Circuit</a> (2-1): Which might have violated her 1A rights; claim undismissed.</li>\n<li>The Prison Litigation Reform Act (PLRA) restricts prisoners from filing lawsuits <em>in forma pauperis</em> if they have three or more \"strikes\"—i.e., actions dismissed as frivolous, malicious, or failing to state a claim. <a href=\"https://www.opn.ca6.uscourts.gov/opinions.pdf/26a0299p-06.pdf\" target=\"_blank\" rel=\"noopener\">Sixth Circuit</a>: But that doesn't cover cases dismissed on the grounds of sovereign immunity or failure to prosecute. So this lawsuit can go forward. Concurrence: But Congress really should count those. And until they do, here are some tips on how district courts can deal with prisoners who try to make their lawsuits \"strike proof.\"</li>\n<li>Do people living in an apartment complex near an ICE facility in Portland, Ore. have a substantive due process right to be free from tear gas seeping into their homes? <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/10/26-1575.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>: That sure doesn't seem to appear in our nation's history or traditions. Dissent: Plaintiffs need only show that the conduct shocks the conscience. And since there's some evidence ICE deployed the tear gas to create content for social media, this should qualify.</li>\n<li>Okay, but do peaceful protestors and journalists in Portland have a First Amendment right not to be shot in the face with pepper balls by ICE agents in ambiguously marked uniforms? <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/10/26-1609.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>: They do not. Dissent: In the face? They should really only be doing that in situations where they would be allowed to use lethal force.</li>\n<li>Federal law exempts plaintiffs from mandatory arbitration if they allege a sexual-harassment claim, which means (according to two-thirds of this <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/10/25-4811.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> panel) that SpaceX employees who complained about Elon Musk's propensity for prurient tweets get to stay in federal court.</li>\n<li><a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/12/23-15912.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>: Look, we're not necessarily saying a city violates the Americans with Disabilities Act by refusing to exempt a woman from its prohibition on sleeping in cars after she informs officials that her OCD sometimes requires her to sleep in her car. But we're definitely saying her complaint states a viable ADA claim.</li>\n<li>California enacts two laws that require companies to disclose information about their greenhouse gas emissions and exposure to climate-related risks. Business groups sue, alleging violations of the First Amendment. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/09/25-5327.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>: Applying intermediate scrutiny, we uphold two of the disclosure requirements, but enjoin the one requiring companies to report \"indirect emissions,\" including those from its suppliers and customers. We also enjoin the one about climate-related risks, which compels subjective, ideological speech. Dissent: All of the requirements should get strict scrutiny, which they fail.</li>\n<li>Arizona man is convicted for his role in 2015 shooting at Garland, Tex. \"Draw Muhammad\" event and sentenced to 30 years. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/06/24-3202.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (2-1): He may have been inspired by ISIS, but he wasn't under the group's \"direction or control.\" His conviction on that count can't be sustained. Also <a href=\"https://cdn.ca9.uscourts.gov/datastore/memoranda/2026/11/06/24-3202.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (unpublished, 3-0): He'll still be in prison for a long time.</li>\n<li>Allegation: Shoplifting suspect (turns out <a href=\"https://www.abc15.com/news/local-news/investigations/tempe-police-officers-removed-body-cameras-used-them-to-record-mostly-naked-woman-in-custody-for-hours\" target=\"_blank\" rel=\"noopener\">she's innocent</a>) suffering medical episode unconsciously thrashes about in hospital bed, exposing herself from the waist down. Did Tempe, Ariz. officers really need to record three hours of that on their body cams? <a href=\"https://cdn.ca9.uscourts.gov/datastore/memoranda/2026/11/10/25-7755.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (unpublished): Qualified immunity.</li>\n<li>Since his release seven years ago, sexagenarian (who served decades for crack distribution) has been a model citizen. Now he seeks an early end to his supervised release, the conditions of which are hindering his burgeoning and high-profile <a href=\"https://artspiel.org/l-w-d-rooted-in-la/\" target=\"_blank\" rel=\"noopener\">art career</a>. And the district court should take another look, says the <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/11/12/25-4491.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>.</li>\n<li>Did officials in Kansas fire nine tenured Emporia State University professors via a <a href=\"https://kansasreflector.com/2023/04/04/kansas-supreme-court-dismisses-emporia-state-university-professors-request-to-intervene-in-firings/\" target=\"_blank\" rel=\"noopener\">sham process</a> because of their lefty political leanings? Or was the school indeed in severe financial straits? The <a href=\"https://www.ca10.uscourts.gov/sites/ca10/files/opinions/010111541940.pdf\" target=\"_blank\" rel=\"noopener\">Tenth Circuit</a> says this goes forward. No QI for now.</li>\n</ol>\n<p>Phooey! Over four years after Meridian officials evicted IJ client Chasidy Decker from her home, the <a href=\"https://ij.org/wp-content/uploads/2022/08/Published-Opinion.pdf\" target=\"_blank\" rel=\"noopener\">Idaho Supreme Court</a> ruled this week that her challenge to the city's irrational ban on tiny mobile homes is not ripe. That's because, the court said, she and her landlord failed to apply for a permit that officials repeatedly testified they would not and could not grant. The silver lining? The city still can't show the ban serves a legitimate purpose, and one day they're going to have to. (Or they could, you know, repeal the thing.) <a href=\"https://ij.org/press-release/idaho-supreme-court-property-owners-cannot-challenge-meridians-ban-on-tiny-homes-on-wheels/\" target=\"_blank\" rel=\"noopener\">Click here</a> to learn more.</p>"},{"title":"Judge Refuses to Dismiss DRAM Supply Conspiracy Suit Against Samsung, SK Hynix, Micron","source":"Hacker News Best","author":"","url":"https://litnews.ai/articles/garciaguirre-samsung-sk-hynix-micron-dram-conspiracy-suit-survives-dismissal","category":"tech","categoryLabel":"Technology","wordCount":1140,"readingTime":6,"content":"<h2>Key Points</h2><ul><li>Judge Noël Wise denied in full Samsung, SK Hynix and Micron's joint motion to dismiss a proposed class action alleging they conspired to cut supply of conventional DRAM, such as DDR5, and shift capacity to HBM.</li><li>The court held the case was not a rerun of DRAM II, the Ninth Circuit's 2022 affirmance of dismissal of an earlier DRAM conspiracy suit against the same companies.</li><li>The judge found that long-term HBM lock-ups, refusals of long-term conventional DRAM contracts, Micron's Crucial closure, fab delays, the failure to expand despite record prices, near-identical customer vetting and the companies' prior cartel history supported a plausible inference of conspiracy.</li><li>The court gave no weight to three of the plaintiffs' arguments: investor statements about \"supply discipline,\" which it found too similar to statements the Ninth Circuit's DRAM II decision had already held insufficient; executives' meetings at industry conferences, since DRAM II all but forecloses relying on them unless plaintiffs identify what was actually exchanged or agreed there; and the three-company market structure, which it called neutral.</li><li>Answers are due Dec. 7, 2026, and the initial case management conference was reset for Jan. 12, 2027.</li></ul><p>A federal judge on Nov. 14 refused to dismiss a proposed class action accusing Samsung, SK Hynix and Micron of conspiring to restrict the supply of conventional dynamic random-access memory, or DRAM, the standardized memory chips used in computers, phones and servers.</p>\n<p>U.S. District Judge Noël Wise of the Northern District of California denied the companies' joint motion to dismiss in full, finding the complaint plausibly alleged an agreement in violation of Section 1 of the Sherman Act. The allegations, accepted as true at this stage, have not been proven.</p>\n<p>The companies argued the case was a rerun of DRAM II, in which the Ninth Circuit in 2022 affirmed dismissal of claims against the same three companies over a 2016–2018 supply restriction. \"The Court finds that it is not,\" Judge Wise wrote.</p>\n<p>The suit was filed June 25, 2026, by 17 consumers and small businesses from five states. It concerns conventional DRAM, which the complaint describes as \"standardized memory built to industry specifications and sold for ordinary purposes,\" including DDR5 generation modules built for computers.</p>\n<p>According to the complaint, the three companies controlled more than 91% of global DRAM revenue as of the third quarter of 2025. They allegedly cut production starting in late 2022 and, beginning in 2023, shifted capacity to high bandwidth memory, or HBM, a specialized DRAM product for artificial intelligence accelerators that \"requires approximately three to four times the silicon wafer area per gigabyte compared to conventional DDR5 DRAM.\"</p>\n<p>By the third quarter of 2025, conventional DRAM prices had risen 171.8% in one year, according to the complaint, which alleges a 697% increase over 18 months. Yet \"not one of the three Defendants expanded or announced plans to meaningfully expand commodity DRAM production capacity,\" the complaint alleges.</p>\n<p>Without direct evidence of an agreement, the plaintiffs needed plus factors, additional facts suggesting a preceding agreement rather than conscious parallelism, in which competitors independently make similar moves.</p>\n<p>Judge Wise rejected the companies' argument that timing gaps undercut parallel action. SK Hynix and Micron announced cuts three weeks apart in late 2022, she noted, and Samsung's lag of about four and a half months, until April 7, 2023, was \"not such an unreasonably long delay that it defeats an allegation of parallel conduct on a motion to dismiss.\"</p>\n<p>She found the complaint plausibly alleged that the three companies acted in parallel when they cut supply, shifted production from conventional DRAM such as DDR5 to HBM, and wound down DDR4.</p>\n<p>Under Ninth Circuit precedent, action against self-interest must be \"so perilous in the absence of advance agreement that no reasonable firm would make the challenged move without such an agreement.\" Judge Wise wrote that a pivot to HBM by itself \"might not be sufficient,\" but that \"the related conduct tips this factor over the edge to weigh in Plaintiffs' favor.\"</p>\n<p>According to the complaint, all three signed long-term contracts locking in HBM supply, Samsung and SK Hynix reportedly refused long-term agreements with major conventional DRAM customers, and Micron announced on Dec. 3, 2025, that it would close Crucial, its 30-year-old consumer brand. Those moves, which she called \"difficult if not impossible to unwind,\" plus the failure to expand despite record prices, \"are the sort that at the pleading stage, it appears no reasonable firm would make without a prior agreement,\" she wrote.</p>\n<p>She applied similar reasoning to allegations that Samsung and Micron delayed or halted new DRAM plants, citing the Ninth Circuit's 1990 Petroleum Products decision that \"Changes in refinery capacity are not readily reversible.\" \"The Court views the commitment to build or not build manufacturing capacity as analogous,\" she wrote. She also counted the companies' alleged same-quarter 2025 decisions to wind down DDR4 as a plus factor, citing the complaint's allegation that \"older, slower DDR4 came to cost more per gigabyte than newer, faster DDR5.\"</p>\n<p>Judge Wise found that near-identical customer-vetting practices all three companies allegedly adopted in January 2026 \"strongly support a plausible inference of conspiracy.\" She rejected the companies' \"obvious and non-conspiratorial explanation\" of booming AI demand, noting that the vetting began after the AI boom and the HBM pivot were underway.</p>\n<p>The court gave no weight to three other arguments. Judge Wise held that investor statements, including Micron's 2022 reference to \"supply discipline,\" did not distinguish the case from DRAM II. Though the conference-meeting allegations went beyond those in DRAM II, she wrote that DRAM II \"seemingly all but forecloses a trial court from giving any weight to trade conference meetings\" absent specifics, and she called the market's oligopolistic structure \"neutral in the analysis.\"</p>\n<p>According to the complaint, the companies and two other manufacturers formed a criminal cartel to fix DRAM prices from 1998 to 2002; Samsung paid a $300 million fine, Hynix paid $185 million, and Micron received immunity for cooperating as a whistleblower. Judge Wise, like the DRAM II court, rejected the argument that the now-20-year-old history should not count.</p>\n<p>At the hearing, the companies quoted the late Judge Posner's line that competitors in concentrated markets \"watch each other like hawks.\" Judge Wise wrote: \"But Plaintiffs' allegations go beyond hawks watching each other; their contentions are more akin to hawks flying in formation – an activity that hawks ordinarily do not do.\"</p>\n<p>The plaintiffs are represented by Bathaee Dunne LLP. Samsung is represented by O'Melveny &amp; Myers LLP, SK Hynix by Cleary Gottlieb Steen &amp; Hamilton LLP, and Micron by Gibson, Dunn &amp; Crutcher LLP.</p>\n<p>Judge Wise ordered the companies to answer by Dec. 7, 2026. Because the court had reset argument by about three weeks, she also granted the companies' unopposed administrative motion to continue early case deadlines and reset the initial case management conference for Jan. 12, 2027, at 9 a.m.</p>"},{"title":"\"It's a brave new world\": GTA 6's PC port will release sooner than you think to avoid losing money to AI rip-offs, says former Rockstar tech director","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/its-a-brave-new-world-gta-6s-pc-port-will-release-sooner-than-you-think-to-avoid-losing-money-to-ai-rip-offs-says-former-rockstar-tech-director","category":"gaming","categoryLabel":"Gaming","wordCount":1046,"readingTime":6,"content":"<p>\"If it's GTA, I think people are gonna try it.\"</p>\n    \n  \n  \n  \n\n            <p><a href=\"https://www.rockpapershotgun.com/gta-6-everything-we-know\" target=\"_blank\" rel=\"noopener\">GTA 6</a>'s PC release may come sooner than anticipated, according to former Rockstar North technical director Obbe Vermeij, because Rockstar and publishers Take-Two will be concerned about losing money to unofficial generative AI clones of the PS5 version, once it launches on 19th November. In general, Vermeij thinks that how to avoid having your games duplicated by chatbot herders is \"the big question\" right now for devs and publishers, particularly those who don't have the means to enforce their intellectual property dominions <a href=\"https://www.rockpapershotgun.com/somebody-recreated-all-of-gta-4s-liberty-city-in-gta-5-aaaaand-its-gone\" target=\"_blank\" rel=\"noopener\">as vehemently as Take-Two do for Grand Theft Auto</a>.</p>\n<p>Speaking to me during a wide-ranging chatathon, Vermeij reflected on the early days of <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto</a> development at Rockstar North in the 90s, and how the Noel-and-Liam-Gallagher-esque relationship between PC and console gaming has evolved. He shared a sweary anecdote about the company's difficulties getting the original GTA 1 to look the business on Sony's PlayStation.</p>\n<p>\"I didn't work on GTA 1 and 2, but I worked for the company at the time, and I was actually right next to the GTA 1 team, so I was able to follow it,\" he said. \"So they worked on PC and then an external company in Dundee did the PlayStation version. Which was really weird, because like, PCs were so much more powerful - still the case, but in those days, it was even more so.</p>\n<p>\"And I remember, at the time, the GTA team was definitely the most rowdy of all of the teams,\" Vermeij continued. \"And there was one particular day where they sent the PC build away, and then it came back from the PlayStation people, and they had cut down all the textures from 256 colours to 16 colours, and my god, the artist was just going around and swearing - 'what the fuck did they do to our textures, I can't believe it, we can't release this shite'. So it always has been that sort of awkward relationship between PC and the console. So in those days, it was like PC first and then console second, even though that didn't really make much sense for the sales, because the PlayStation versions sold way better.\"</p><p>When it came time to develop GTA 3, Rockstar \"flipped that around\", Vermeij went on, creating the console versions first. \"Clearly the PC market has sort of grown, caught up with the console market, but there's still that same mindset,\" he said. Most publishers prefer to release all versions at once, Vermeij added, \"because then there's only one marketing campaign they have to pay for.\" GTA lives by its own rules, however. \"I guess it's less of an argument for them because the game is just so big, so they just kind of always left it that way. And for developers, it's way easier to just do one version at a time. So, you know, that makes sense.\"</p>\n<p>The arrival of generative AI threatens to throw all this to the winds. Tools such as Reverse Engineer Anything allow for speedy unofficial ports or \"slopcomps\" of console games on PC, despite <a href=\"https://www.rockpapershotgun.com/claims-that-genai-speeds-up-pc-ports-of-classic-games-are-either-false-or-missing-the-point-says-banjo-kazooie-recompiled-developer\" target=\"_blank\" rel=\"noopener\">warnings from seasoned recomp developers</a> that using genAI for this purpose wrecks the community aspect of unofficial porting, and results in illegible \"bruteforce\" code rather than preserving some understanding of how the original game was made.</p>\n<p>\"It really has changed the world,\" Vermeij observed, \"and I think I would be concerned, if I was Rockstar, that somebody would just take the PS5 version and get AI to change it to PC, which won't be won't be as good as their effort, but it could still also hurt their sales. So, I wouldn't be surprised if there was an effort to get [the releases] a little bit closer together. Obviously, I don't really know what they're thinking.\"</p>\n<p>GTA 6 is, according to Rockstar and Take-Two at least, <a href=\"https://www.rockpapershotgun.com/gta-6-will-simulate-hurricanes-rainbows-and-persistent-dynamic-clouds-among-other-efforts-to-make-you-stop-doing-crime-and-become-a-weather-nerd\" target=\"_blank\" rel=\"noopener\">an enormously fiddly production</a>, costing hundreds of millions of dollars over eight years in development. Nonetheless, Vermeij thinks current genAI tools are \"probably\" capable of pulling off a port. \"It will take a long time. It actually, physically takes hours and hours and hours to do these things. And it will take a bunch of tokens and everything, so it would probably cost like, tens of thousands of dollars in tokens. But like, you know, if it's GTA, I think people are gonna try it.\"</p><p>There are already signs that genAI PC port goldrushers are ready to pounce on GTA 6. Just today, <a href=\"https://arstechnica.com/gaming/2026/11/gamers-go-to-ridiculous-lengths-to-improve-gta-vi-with-nvidias-dlss-5/\" target=\"_blank\" rel=\"noopener\">Ars Technica</a> reported on efforts to yassify the game's PS5 trailer footage by piping it through a stronker PC graphics card and using Nvidia's DLSS 5 to apply extra layers of gloss.</p>\n<p>Vermeij himself left Rockstar way back in 2009 and is now an indie developer. His current early access project is <a href=\"https://store.steampowered.com/app/3044790/Plentiful/\" target=\"_blank\" rel=\"noopener\">Plentiful</a>, a hexagonal god sim with an emphasis on water physics. It uses \"AI-assisted machine translation for localization\", but not for \"gameplay content, art, or audio\". Vermeij is, in general, interested in generative AI despite the surging tide of slopcomp ports. Smaller indie developers are, of course, more vulnerable to the financial fallout from having their work unofficially cloned by generative AI, but Vermeij thinks it's an existential worry for megacorps like Take-Two as well.</p>\n<p>\"I don't really see how you could protect against that, to be honest,\" he told me in closing. \"I don't see it. But a big company like Take-Two, they would be able to get the lawyers on the case, and maybe, like, you said, for a big game, maybe the AI doesn't really do a particularly good job. But yeah, I mean, it's a brave new world. What was the case before, is that there's so much effort in developing the game, that it is not possible to rip it off, and that's completely changed now. So, yeah, we're going to have to see in the next couple of years, how that's going to pan out.\"</p>\n<p>The latest rumour-mongering places <a href=\"https://www.rockpapershotgun.com/gta-6-pc-release-planned-for-early-2027-report-claims-which-could-mean-were-playing-in-time-for-gta-online-2-vice-city-4-u-or-whatever-they-call-it\" target=\"_blank\" rel=\"noopener\">GTA 6's PC release sometime in early 2027</a>. In other news, Rockstar staff <a href=\"https://www.rockpapershotgun.com/uk-based-rockstar-devs-will-be-putting-their-union-recognition-to-a-vote-during-gta-6s-launch-next-month\" target=\"_blank\" rel=\"noopener\">are soon to formally vote</a> on whether to apply for union recognition. If the organisers carry the day, the resulting union <a href=\"https://www.rockpapershotgun.com/rockstar-developer-union-could-end-up-over-1600-workers-strong-and-encompass-nearly-all-uk-staff-below-senior-management-iwgb-claim\" target=\"_blank\" rel=\"noopener\">could encompass nearly all the company's UK staff below management level</a>. </p>"},{"title":"The Writers Trying to Make News on YouTube","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/infinite-scroll/the-writers-trying-to-make-news-on-youtube","category":"fun","categoryLabel":"Interesting Reads","wordCount":1239,"readingTime":7,"content":"<p>If Twitter was once the public square of the internet, a place where anyone could don an avatar and shout contributions to the discourse, then YouTube today might be its closest successor. The platform is accruing more and more of its users’ attention, stealing engagement not only from other social media but also from television; and, unlike television, YouTube is broad and open enough for anyone with a phone camera and editing software to compete as a creator.</p><p>For a decade and a half after its founding, in 2005, YouTube was the province of amateurs who gradually forged a new medium. MrBeast, the platform’s kingpin, won out by staging extreme survival stunts pitched at teen-agers—no one’s idea of prestige. Lately, however, the professionals have arrived on the platform, hawking glossy <a href=\"https://www.newyorker.com/culture/infinite-scroll/kareem-rahma-and-the-tyranny-of-web-video-shows\" target=\"_blank\" rel=\"noopener\"><em>multimedia shows</em></a>. This year, seasoned journalists and aspiring literary writers have turned themselves into hosts and newscasters. In January, the former <em>Times</em> journalist Max Fisher began hosting a general-interest news series called “The Bigger Picture,” and, in April, the tech journalist Joanna Stern left the <em>Wall Street Journal</em> to launch a show called “New Things.” More recently, Kyle Buchanan, a longtime Hollywood reporter for the <em>Times</em>, quit and created “The Kyle Buchanan Show,” a series of conversations with actors and directors. Kevin Roose, a <em>Times</em> tech reporter, left the paper to start “Machine Gods,” a talk show about the <a href=\"https://www.newyorker.com/magazine/2026/09/28/our-ai-problem\" target=\"_blank\" rel=\"noopener\">artificial-intelligence boom</a>, with the independent journalist Casey Newton. And Tom Willis, a writer and reading-series host in London, started the “Tom Willis Talk Show,” where he interviews celebrated novelists on a Charlie Rose-esque stage set.</p><p>These efforts go beyond the recent fad for <a href=\"https://www.newyorker.com/culture/infinite-scroll/why-video-podcasts-multiplied-beyond-the-man-cave\" target=\"_blank\" rel=\"noopener\">video podcasts</a>; they are complex productions that have less in common with radio than they do with late-night television. The new model of internet news show features plush seating, dramatically soft lighting, several simultaneous camera angles, curated outfits, and a choreographed variety of formats meant to amuse the viewer (or the listener—most of the productions also have podcast feeds). According to the Independent Journalism Atlas, thousands of people identify as creator-journalists, and more than two hundred of those now work on YouTube. Video is expensive; Roose and Newton have ads, syndication deals with NPR, and nonprofit funding. Others self-fund their shows with their Substack-subscription money. Brands are rushing in: for its début, “The Kyle Buchanan Show” landed sponsorship from Netflix.</p><p>Buchanan’s production is shot in a capacious red-leather booth on a set that resembles a Hollywood restaurant, and it comes complete with a jingle, an introductory sequence, and a hefty dose of sponsored content. It airs twice weekly, switching between long-form interviews and panel discussions on newsy subjects in entertainment—who will be <a href=\"https://www.newyorker.com/culture/annals-of-entertainment/shaken-and-stirred-by-the-search-for-the-next-james-bond\" target=\"_blank\" rel=\"noopener\">the next James Bond</a>, how “<a href=\"https://www.newyorker.com/magazine/2026/10/19/you-can-see-everything-movie-review\" target=\"_blank\" rel=\"noopener\">You Can See Everything</a>” might compete in the Oscars. Thanks to his experience covering the industry, Buchanan has been able to source a bevy of famous names: the buzzy horror star Inde Navarrette, the producer Jason Blum, the actor <a href=\"https://www.newyorker.com/culture/the-new-yorker-interview/bill-hader-just-wants-to-make-weird-things\" target=\"_blank\" rel=\"noopener\">Bill Hader</a>. Buchanan’s role as a neutral reporter is signalled with his signature baseball cap, which he seems to wear for every shoot.</p><p>Watching his interviews feels a little like going behind the scenes of a celebrity magazine profile, except that the profile itself doesn’t exist. Buchanan extracts insightful quotes from his subjects. By the end of Navarrette’s episode, she summarizes her career aspirations in interestingly defensive terms: “I want people to know that they don’t have to like me—I just want them to trust me.” But the format has its limitations. It can be fun to watch a celebrity interview another celebrity, say, on a traditional late-night show, and it can be fun to read an extensively reported profile, but the genre of journalist-interviews-celebrity-on-camera is a strange middle realm. Buchanan’s conversation with Hader flows loosely—the two have known each other for decades—but he treats Navarrette with a slightly overeager solicitousness that makes for uneasy viewing. Every journalist knows that a big-name interview can be awkward, and not in a fun way.</p><p>Breaking news is the province of the journalist, regardless of her medium. On YouTube, as on cable, that job must be balanced with the need to entertain. Roose and Newton are both reputable tech journalists with numerous scoops to their names, and they built up a jolly camaraderie on the <em>Times</em>’ podcast “Hard Fork.” On the twice-weekly “Machine Gods,” which also airs on NPR, riffy commentary has so far taken precedence over original reporting. (A recurring segment of news briefs, “Pandora’s Box,” relies, with slightly misplaced whimsy, on a visual gag of hosts pulling notes from a physical box leaking smoke.) The pair did land a notable interview with Mikita Balesni and Tomek Korbak, two A.I.-safety researchers who were recently fired from OpenAI in the midst of working with the A.I.-auditing organization <em>METR</em>. As that segment suggests, the newsy YouTube show might excel most at documenting subjects that are too niche for cable. The engineers have a quiet authority as they discuss A.I. safety, even if they are perched on too-tall stools amid lighting as portentously dim as the set of an HBO drama. But isn’t this just a glorified podcast episode? On “New Things,” Joanna Stern hosts the likes of Mark Zuckerberg and Satya Nadella for extensive, “<a href=\"https://www.newyorker.com/magazine/2026/10/26/the-bari-weiss-effect-on-60-minutes\" target=\"_blank\" rel=\"noopener\">60 Minutes</a>”-style interviews, and performs staged stunts such as building a robot to test the new dual-screened iPhone’s folding capabilities. Whereas Roose and Newton’s production televises the NPR studio, Stern’s work seems made for television.</p><p>You could say that writer-YouTubers exist on a spectrum from <a href=\"https://www.newyorker.com/magazine/2012/07/09/seeing-it-now\" target=\"_blank\" rel=\"noopener\">Walter Cronkite</a> to <a href=\"https://www.newyorker.com/culture/the-new-yorker-interview/dick-cavett-takes-a-few-questions\" target=\"_blank\" rel=\"noopener\">Dick Cavett</a>. Max Fisher, of “The Bigger Picture,” presents himself like a news anchor of global affairs, complete with charts, while sitting behind his desk in what appears to be a dark basement studio. Yet the cynicism and sweatiness required of the broken-in journalist doesn’t necessarily align with the job of emoting winningly on camera. The British writer Tom Willis succeeds at merging the two. His eponymous YouTube show has the appealingly improvisational, authentic vibe of community television. He understands that, online, amateur messiness sometimes plays better than polish. Wearing a wide-lapelled jacket over a white-collared shirt (all outfits are provided by Drake’s, the credits note), Willis does a kind of twentieth-century public-intellectual drag, leaning over a wide wood table to interrogate guests such as the young American novelist Anika Jade Levy and the English author Geoff Dyer. Conducting interviews of up to an hour, and delving deep into the weeds of the literary scene, Willis fashions himself as a guide to a transatlantic vanguard, reporting from out of the rabbit hole. (His show does require a strong stomach for pretension. Levy dryly describes the subject of her 2025 novel, “<a href=\"https://cna.st/affiliate-link/gChDhNS3tFzZTbhnb5mo8u6q62rBsEFWcomxiFnxVmTY1vwXPjnAUTTPz3ts7i243MvnBndfXr8y53SPFeXu16jgvGyMqmbp3XMfuw5QsDNNSvC3ZffBubCjjsJg8e7usHekjHXmaqKVNJTSzVHd16ySvMDrXhyABYB7WwKCZvaviwN4tWH72skULtoUfVd3C9oRK5SJ9L81vcRgJvpFxdrnGKvQjTAuKLhNoysRo4nFT1FNGj2shHbZDojvy6cudS6TTGqFy416PHrDsdhWowaZMC2Sj5W4vSVeiSXFimqzLsrh6BPKP9uGarjeheBPQJA1dxwMn1MteaoKUtfrGHfsWwbkG76r9RACCzhBmXpj46feWwHqJuDXNRghxU8NLLnaQ2uzt\" target=\"_blank\" rel=\"noopener\">Flat Earth</a>,” as “the ambiguity of, like, hyper-transactionalized social configurations.”)</p><p>Watching these productions brings to mind a quote from Aaron Lammer, a co-host of the influential “Longform” podcast: “I think the experience of an interview show for the first few episodes is kinda weird.” You have to hang around through twenty episodes, he suggested, before things get interesting. An archive builds; characters and themes develop over time, as does a parasocial relationship between the host and the viewer. Not every ambitious YouTube show will last long enough to clear that threshold, but I think Tom Willis’s, at least, should. A podcast is not a television show, but a good conversation is a good conversation in any medium. ♦</p>"}];
