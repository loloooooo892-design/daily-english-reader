*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;

}

  font-size: 0.8125rem;

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;

}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;

  display: flex;
  gap: 0.5rem;
}

  font-family: inherit;
  font-size: 0.8125rem;

.swap-counter {

.article-body li {

.article-body a {

.article-body em { font-style: italic; }

<script>
var articles = [{"title":"Tomb Raider: Catalyst delayed to 2028","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/action/tomb-raider-catalyst-delayed-to-2028/","category":"gaming","categoryLabel":"Gaming","wordCount":547,"readingTime":3,"content":"<p>Bad news for anyone looking forward to playing the new Tomb Raider game Catalyst next year: It's not going to be out until the year after that.</p><p>Word of the delay came from Amazon Gaming chief Jeffrey Gattis during an interview with <a href=\"https://www.youtube.com/watch?v=NljuXOVijas\" target=\"_blank\" rel=\"noopener\">The Game Business</a>. Talking about Amazon's game investment strategy, Gattis said the company is into pretty much everything, \"from what we call game night games, which are those phone-as-a-controller games, which I think of as single-A games that are in the single millions of dollars to develop, all the way up to triple-A.\"</p><p>Then, to provide an example of how Amazon remains committed to big-time, he dropped the news: \"We've announced the two Tomb Raider titles—Atlantis comes February 12th of next year and then we'll follow on in 2028 with the next one.\"</p><p>Tomb Raider: Catalyst hadn't locked in a hard release date, but when it was <a href=\"https://www.pcgamer.com/games/action/tomb-raider-comes-to-the-game-awards-with-not-just-one-but-two-new-games-a-re-imagining-and-an-all-new-adventure/\" target=\"_blank\" rel=\"noopener\">announced at The Game Awards</a> in 2025 it was set for launch in 2027.</p><p>It's possible that Gattis merely got his years or games mixed up: I still occasionally do the <em>'what year is it?'</em> Jumanji meme in real life when my wandering mind is suddenly snapped back to reality by someone asking if I've finished filling out the form.</p>\n\n<p>Amazon Luna: We’re not trying to replace PlayStation, Xbox and Nintendo (but maybe we could) - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/NljuXOVijas\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>But this strikes me as unlikely, for two reasons. One, saying \"2028\" specifically is very different from rolling with \"next year\" when you're not completely sure what year it is right now.</p><p>Two, and more to the point, Tomb Raider: Catalyst developer Crystal Dynamics appears to be in a bit of disarray. In March, the studio conducted its <a href=\"https://www.pcgamer.com/gaming-industry/tomb-raider-is-fine-crystal-dynamics-says-as-it-lays-off-employees-for-the-fourth-time-in-the-past-12-months/\" target=\"_blank\" rel=\"noopener\">fourth round of layoffs in 12 months</a>, and studio leadership—not just at CD, but <a href=\"https://www.pcgamer.com/games/the-elder-scrolls/bethesda-says-layoffs-havent-affected-the-roadmap-for-the-elder-scrolls-6-it-hasnt-forgotten-oblivion-remastered-and-its-not-telling-you-this-because-asha-sharma-forced-it-to/\" target=\"_blank\" rel=\"noopener\">anywhere that's taken a big hit</a>—may say that cutting to the bone isn't going to impact ongoing projects, but at some point that's probably just not so, as presumably those laid off people served a function that they're not around to handle anymore. Even if you're only talking about the psychological toll that constant layoffs take on those who remain, that's going to have an impact.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>To be sure, I've reached out to Amazon to ask if the 2028 target as expressed by Gattis is correct, and will update if I receive a reply. Until then, though, I'd suggest making other plans to occupy your gaming time in '27.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"The Kinky Comedy of “I Want Your Sex”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/03/i-want-your-sex-movie-review","category":"fun","categoryLabel":"Interesting Reads","wordCount":1474,"readingTime":8,"content":"<p>As you might suspect from the title, “I Want Your Sex” has no time for niceties. Right at the start, it serves up a generous helping of hot mess, with a stream of expletives, a jolt of violence, and what appears to be a corpse adrift in a Los Angeles swimming pool. You may think, as I did, of “Sunset Boulevard” (1950), but here the Joe Gillis character, a gingery-haired twentysomething named Elliot (Cooper Hoffman), is alive, and it’s his Norma Desmond counterpart who is floating face down. “Oh, fuck. Oh, fuck,” Elliot mutters, as he stumbles upon the sight of his former boss, the artist Erika Tracy (Olivia Wilde), bobbing nude in the water. How she got there is just one of the story’s mysteries. Like, why is Elliot’s face smeared with blood? And why is he wearing a lacy pink bra and panties?</p><p>The answer is that this is a Gregg Araki movie, meaning that a character needs no more reason to don skimpy, rose-colored undergarments than he would to strap on a collar and crawl on all fours. The film revolves around a dominant-submissive relationship, and Elliot, who’s genial, scruffy, and broke, is the designated sub. The dom is Erika, who has made a reputation for herself as a sexually provocative art-world libertine, and who, as the story proper begins, hires Elliot as her assistant. It’s through his wide, impressionable eyes that Araki’s goofily scrambled nympho-noir plot comes into focus. On an average day, Elliot might find himself painting a sculpted phallus or festooning a sketch of a vagina with pieces of half-chewed gum, usually alongside his co-worker Zap (Mason Gooding), a hot, gay, and snarky voice of sanity. On a wilder day, which soon becomes the new average, Erika summons Elliot to her office or her mansion, where she proceeds to fuck him and fuck with him, seldom in that order.</p><p>A frenzied, if none too explicit, montage lays out a menu of bondage-themed delights: Erika ties Elliot up, spanks him, rides him, penetrates him, and, most of all, mocks him. Again and again, she dings him for his naïveté and inexperience—qualities that she imputes to his entire sorry-ass generation, which seems to be less knowledgeable about, or interested in, sex than ever. Araki wrote the script with the former <em>Vogue</em> sex-and-relationships columnist Karley Sciortino, and their sharpest scene allows Elliot to defend his age group against charges of prudishness: they came of age, after all, during a pandemic that conditioned them to fear the very idea of in-person socialization, let alone physical intimacy. (That they also grew up during an online porndemic scarcely needs mentioning.) But Elliot’s best argument is ultimately himself—chiefly, his own vigorous libido, which his workaholic medical-student girlfriend, Minerva (a deader-than-deadpan Charli XCX), has long since lost interest in satiating. Minerva doesn’t stick around, but Elliot still yearns for happily ever after, a dream that he transfers, delusionally, to Erika, believing that their arrangement might one day flower into long-term domestic bliss.</p><p>That’s ridiculous, but, cheerfully and unabashedly, so is “I Want Your Sex.” The verbal and visual building blocks of Araki’s comedy—quick-witted one-liners, exuberant sex scenes, sartorial gags, garish décor—express a dazzling, totalizing sense of optimism. Hoffman’s lummoxy charisma fits right into this scheme and makes it hard to begrudge Elliot even his more vanilla fantasies. Hoffman had an auspicious screen début in Paul Thomas Anderson’s “Licorice Pizza” (2021), which was also premised on a younger-man-older-woman dynamic, albeit one that was sedulously, almost distractingly chaste. His character in that film had a gawky teen-age bravado, a precocious man-of-the-world assurance. Elliot is completely in over his head by comparison, but Hoffman himself feels fully and gamely in his element; if his improbability as a romantic lead is part of the joke, it never comes at the actor’s expense. Elliot may be just a “boy whore” to Erika—in one scene, she pimps him out to a friend (Roxane Mesquida), who rejects the offering with supremely French disdain—but he also elicits from her an unexpected tenderness, a sneaky affection, that the audience comes to share.</p><p>How we feel about Erika is harder to clamp down. Some of her verbal provocations have a reactionary tilt; she rolls her eyes at the “woke police,” waves aside issues of consent, and insinuates that the whole point of sex is the eradication of boundaries. But she also has a dry self-awareness, a willingness to puncture her bad-girl reputation and the extravagances of the art world. “Contemporary art is a scam,” she declares; later, she calls herself “a pretentious whore from hell.” Whether or not she’s joking, Wilde makes the character a devilish hoot, and not just because the first outfit we see her in is a slinky red number that might as well come with a forked tail.</p><p>It’s a measure of Wilde’s range that, in her recent marital comedy, “The Invite”—which, like “I Want Your Sex,” premièred at this year’s Sundance Film Festival—she played a housewife who was both tickled and intimidated by the prospect of swinging with the neighbors. Erika wouldn’t bat an eye at the suggestion. In the story’s trickiest development, she orders Elliot to bring a friend to their next assignation, and he unwisely chooses his female bestie and roommate, Apple (Chase Sui Wonders), who seems eager to get in on the action. (“Why does all the cool sex-deviant stuff always happen to you?” she asks.) But the attempted three-way that follows is a bummer, for the characters and for us, and for reasons that, more than anything, smack of narrative expedience. Long-term relational unsustainability has become the default endgame of B.D.S.M.-themed romances—think of “Babygirl” and “Pillion,” to take two recent examples—and “I Want Your Sex” proves no exception. Instead of risking an unfettered exploration of the thrills and limitations of impromptu throupling, the movie contrives to push Erika and Elliot to a crisis point, and to imply that, even in the most depersonalized physical exchange, there are always strings attached.</p><p>Araki has often named his characters with wily playfulness. His surreal, harrowing “Nowhere” (1997) featured characters named Dark, Lucifer, Egg, Jujyfruit, and Handjob. The director paid tribute to Jean-Luc Godard, one of his main inspirations, in “The Living End” (1992), a road movie about two gay men named Jon and Luke. With this context in mind, the name Erika evokes one of the great dominatrices in literature and cinema: Erika Kohut, the icily repressed protagonist of Elfriede Jelinek’s novel “The Piano Teacher” (1983) and Michael Haneke’s film adaptation, from 2001. (The other allusions in “I Want Your Sex” aren’t so lofty; in one cheeky nod to a trash-cinema touchstone, the flashbacks kick off with a title card that reads “9 1/2 <em>WEEKS AGO</em>.”) But it’s also hard not to interpret Erika, with her passionate doctrine of sexual liberation, as a fictional stand-in for her creator. When she tells Elliot that “sex is everything,” she might as well be articulating Araki’s own mission statement.</p><p>Araki’s concerns about the sexual habits and mores (or lack thereof) of today’s youth extend to the increasingly puritanical, sex-negative tendencies of so much contemporary cinema, an unfortunate trend to which “I Want Your Sex” means to serve as a corrective. But it’s certainly a slicker, lighter, less subversive kind of corrective than, say, “Totally F***ed Up” (1994), “The Doom Generation” (1995), and “Nowhere”—the daring independent films that constitute his foundational “Teen Apocalypse Trilogy,” which propelled him into the forefront of America’s burgeoning queer-cinema movement. He has undeniably mellowed in the decades since, though in works like “Kaboom” (2011) and “Now Apocalypse,” his TV series from 2019, he has continually returned to his doomsday preoccupations. The end of the world remains, for him, a potent metaphor for the cataclysmically unstable nature of youthful sexual discovery.</p><p>In “I Want Your Sex,” the director’s first feature in more than a decade, the genre is noir rather than science fiction, and it’s in this choice, I think, that Araki’s kooky conception ultimately runs aground. Much of the story is narrated by Elliot, in flashback, to a pair of straitlaced cops, who are played by Margaret Cho and Johnny Knoxville; it’s fun enough to see them that you wish they both had more to do, besides stoking the audience’s nostalgia for an earlier generation of outrage artists. The film’s twisty wrap-up feels creaky and far-fetched in ways that the rest of the movie, over the top though it is, does not, and you can sense Araki struggling to bring his two leads, and their oppositional schools of sexual thought, to a place of convergence. No wonder the film, flippantly but not unpleasantly, ends on a question mark—a shrug suggesting that, if sex is everything, Araki still has stamina to burn. Should we get lucky, the mystery of desire is one he’ll never stop trying to solve. ♦</p>"},{"title":"Can't Ban Parent from School Property for \"Mean and Demeaning Posts\" About \"Opposing Student Athletes\"","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/07/21/cant-ban-parent-from-school-property-for-mean-and-demeaning-posts-about-opposing-student-athletes/","category":"law","categoryLabel":"Law","wordCount":1316,"readingTime":7,"content":"<p>From <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.kyed.110744/gov.uscourts.kyed.110744.40.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Jones v. Jenkins Indep. School Dist.</em></a>, decided Thursday by Judge Gregory Van Tatenhove (E.D. Ky.):</p>\n<blockquote><p>A public school in Eastern Kentucky issued a series of no trespass bans to Elizabeth Jones, a parent, in response to some of her posts on Facebook. As explained below, these posts were mean and demeaning. Naturally, several parents complained to the school district. The school district responded by banning Jones from all district property….</p>\n<p>The First Amendment prohibits government officials from subjecting an individual to retaliatory actions for engaging in protected speech, and this speech is protected. For these reasons, the Court GRANTS Jones's motion for a preliminary injunction….</p>\n<p>Plaintiff Elizabeth Jones … is a single mother of two minor children who attend school in the Jenkins Independent School District. She regularly attends school-sponsored activities, including athletics events, and donated her time and money to support her children's extracurricular activities.</p>\n<p>Jones is also the owner and CEO of Hillbilly Crime, LLC. According to Hillbilly Crime's YouTube profile, Jones is a \"Mom and self-proclaimed 'Educated Hillbilly'\" who discusses \"anything &amp; everything True Crime, follow[s] local criminal trials, and give[s] my personal and best 'Hillbilly' commentary on important issues and current events.\" Jones monetizes her content through this YouTube channel with over 26,000 subscribers and also through two Facebook pages with over 26,000 followers and 38,000 followers, respectively. In addition to her videos and posts, Jones operates an online store featuring Hillbilly Crime merchandise and also offers supporters the ability to purchase subscription tiers ranging from $2.99 to $24.99 a month to support her reporting.</p>\n<p>Jones is a prolific user of Facebook, publishing multiple posts per day on both her \"Elizabeth Jones\" and \"Hillbilly Crime\" accounts. The accounts largely overlap in terms of content. When Jones posts on her \"Elizabeth Jones\" account, she often leaves a comment encouraging her supporters to subscribe and support her work with links to purchase the tiered subscription options. In addition to posting about local crime, Jones also posts about school athletics from her main account.</p>\n<p>The Defendants allege that Jones relies on controversy to drive engagement with her channels. On November 26, 2025, Jones posted a comment where she poked fun at a middle school child's appearance and accused an opposing basketball coach of making derogatory gestures to fans and parents. She then responded aggressively to another Facebook user who defended the child.</p>\n<p>On December 13, 2025, she made another post criticizing a child's effort in a basketball game and encouraged others to comment on her post. Both posts contained photographs of the minor children at issue, although the parties' attachments did not include the photos as part of their exhibits submitted to the Court. Jones does not contest that the posts contained photographs, so the Court assumes that the posts in fact included photos of the minor children.</p></blockquote>\n<blockquote><p>The school district claims they received numerous complaints from parents concerned about Jones's online activity. Defendant Damian Johnson, the school district's superintendent, then issued a \"No Trespass Order\" on December 15, 2025. This order read as follows:</p>\n<blockquote><p>Due to your multiple posts on social media of students participating in extracurricular activities which appear to be harassment and which have caused disruptions of the educational process in this school district, you are banned from any and all properties owned or leased by this school district and banned from any and all activities sponsored for or by this school district.</p>\n<p>It is of utmost importance to provide for the safety and well-being of our students, our fans, our visitors and those who use the school district facilities and attend school district activities.</p>\n<p>If you are present on any property owned or leased by this school district or present at activity [sic] sponsored by or for this school district, the school district will have you removed by law enforcement and then the school district will seek criminal trespass charges against you.</p></blockquote>\n<p>Jones received no warning before the district issued the No Trespass Order…… The Defendants, after appearing in this lawsuit, then issued a Modified No Trespass Order to Jones on February 5, 2026. The Modified Order carved out exceptions to its December order, permitting Jones to drop off and pick up her children from school, deliver items to them at school, attend scheduled parent-teacher conferences, and attend other scheduled meetings with educators relating to her children. The modified order also clarified that the ban did not apply to meetings of the school board …. Like the first order, this modified order did not specify with any particularity which social media posts led to the ban and did not list any way that Jones could challenge it……</p></blockquote>\n<p>The court held that the orders were likely unconstitutional:</p>\n<blockquote><p>Parents do not enjoy an unfettered right to access public school property[,] … [but] a state actor cannot retaliate against an individual for speech that the state disfavors… [A Sixth Circuit precedent has held] that the \"disruption standard applicable to student speech\" does not normally apply to the speech of parents. Unless a parent's speech falls into one of the historic and traditional categories permitting content-based restrictions, including speech expressed as part of a crime, obscene expression, incitement, or fraud, then schools cannot regulate the content of that speech.</p>\n<p>Jones' posts clearly do not reach this level. She posted arguably distasteful commentary about opposing student athletes, but none of it falls within the \"limited areas\" where the state can regulate speech. It is true that her social media posts \"offend[ed] the sensibilities of others,\" including other parents. But offensive speech still enjoys First Amendment protection, and the school district cannot sanction the content of Jones' speech merely because they find it unsettling, distasteful, or inappropriate…</p>\n<p>Jones alleges that the Defendants retaliated against her in violation of the First Amendment. There are three elements to a retaliation claim:</p>\n<p>(1) the plaintiff was engaged in a constitutionally protected activity;</p>\n<p>(2) the defendant's adverse action caused the plaintiff to suffer an injury that would likely chill a person of ordinary firmness from continuing to engage in that activity; and</p>\n<p>(3) the adverse action was motivated at least in part as a response to the exercise of the plaintiff's constitutional rights.</p>\n<p>As to the first element, Jones engaged in a constitutionally protected activity.</p>\n<p>In weighing the second element, the Court notes that the test is an objective one, and it does not matter whether Jones herself was actually deterred by the district's retaliation… [A] blanket ban against a parent in reaction to posting on social media constitutes a negative consequence beyond the de minimis level and would likely chill or silence a person of ordinary firmness from posting in the future. All parents want to be involved in their children's lives, and particularly in their extracurricular activities at school. A ban such as this—unlimited in time and with no listed appeal procedures—certainly would chill a person of ordinary firmness from continuing to exercise their speech rights, particularly where the alternative is total isolation from their children's activities.</p>\n<p>The third factor asks whether the adverse action was motivated at least in part as a response to the exercise of Jones' constitutional rights. A \"motivating factor … is one without which the action being challenged simply would not have been taken.\" Here, there is no question that the Defendants instituted the ban as a direct result of Jones' posts. They say so themselves: \"The No Trespass Order here was issued due to concerns with Ms. Jones's social media activity and resulting disruption of school operations[.]\" …</p>\n<p>School districts enjoy latitude in controlling access to their physical facilities. But as state actors, they cannot retaliate against a parent on the basis of that parent's social media posts which are not threatening, obscene, or defamatory…</p></blockquote>\n<p>Jennifer L. Taylor, as well as William Ellis Sharp, Bethany Nicole Baxter, and Corey M. Shapiro (the last three from the ACLU of Kentucky) represent plaintiff.</p>"},{"title":"The Best MagSafe Wallets for Your Everyday Carry","source":"Wired","author":"@wired","url":"https://www.wired.com/gallery/best-magsafe-wallets/","category":"tech","categoryLabel":"Technology","wordCount":820,"readingTime":5,"content":"<h2>Other Good MagSafe Wallets</h2><p><strong><a href=\"https://cna.st/affiliate-link/7BxSbB2fAMuusDptQVktDAEsoUL11FuxVkhZTLvaYnWuoXwMbWKMU5vmrCezDxD3sndKv4egnsYov1nN5VjRVva1mTwGVkbNP79DU35CtBkcXW7QoBoheKXWVYNZcfZzawor2cBvEdsZwq9Wzt5iiaBJokdrjuwMk3tS9ukrn7QK2xfZZjgp9L4x6rjSv4hrjpubqTnLANWoCrfDci5Ct5apjSSJtY4sumXfEJVa6zUc9GWEVnMecFRgm67cooMi7prSjpyHcATAjjs4fbzpoNy4goiJ1TyV75t5zAKHLVaF5LwE6y53xSJW8L9oFfU4eiBKFeaiManE\" target=\"_blank\" rel=\"noopener\">ESR Geo Wallet Stand</a>:</strong> Apple’s Find My app lets you track your devices if they’re lost, and ESR’s Geo wallet has it built right into the wallet itself. This is the wallet I’ve been using for the past few weeks, and outside of its Find My capabilities, I love that it strikes a great balance between size and usability. ESR says it can hold up to three cards, but I’ve been using mine with four—three cards plus my ID—and I can get them all out easily. Although having a wallet with magnetic charging pins is weird—the Find My feature requires a battery that lasts three months—you can turn it off if you don’t care for it (but then, maybe just buy a different wallet). It does kind of suck that you need a proprietary charger to recharge your wallet, though. The magnets adhere well to the back of the phone, and you can pop open the wallet and use it as a kickstand. ESR even includes a strap on the back that works as a phone grip.</p><p><a href=\"https://cna.st/affiliate-link/2uABbRt8VjLG9Vm1WVgc79Gs6V294j5V5Rea3gxhMaqrrfn44oFxrxKykM6F5rgg2QrgCgQeb54tMEkWUBaH5dm7fH7r4qbbPsMu9gtcc4RJRhrL2PyEGHdaCxiwyx2tGtYbybeSvxUpLZeAmLkjk7fQj5B4SN9ZcYYQBnKoUHNqSkLLWddDTccZxzwXMLPvwRadkB5ps3pjc5g4yJExx4yvszkKS4Ds3bNwY7RxaFVgyM3Xpng2g7MwgXiohUiTdg2DBpYUossP4UXZtNScGif7wmdA8UfU9jCxyWrXZ6g1ngaTjDBT8ZT3zpZttT2i\" target=\"_blank\" rel=\"noopener\"><strong>OtterBox Symmetry Series Cactus Leather MagSafe Wallet</strong></a>: This wallet is nice and simple, thin, lightweight, has a strong hold on my phone case, and offers a dedicated fabric-covered slot at the bottom to push the cards out (I was able to fit three without much trouble). This OtterBox wallet is made from cactus-based leather, which feels nearly as luxurious as real leather. Just know that cactus leather isn’t as eco-friendly as it’s made out to be—these cases are still infused <a href=\"https://www.wired.com/story/tomtex-chitosan-leather-alternative/\" target=\"_blank\" rel=\"noopener\">with layers of plastics</a>.</p><p><strong><a href=\"https://cna.st/affiliate-link/35a2Pj22cNjnRKoR5DDdygNAhntDHn1XiZNQCW1MUuwabfxXrVqnYVH8K4UgHFPhxCGRb1WSydxfEpcb1N6xLmSSmCSyNZZSeLynDEVE38FwdViYGUdqNJTM8WsNovdrNsa1JPJz17WHBWb8Z4nBudeGEgYDoZQguX2gkEX4APdHDuZpuQ1fGFiuCg7hq4v8AxzdaaFTDAN2EBdPHKmSmdbLKeHRCQVMAFUERYschYSW7u3mKgL6NbpQug7TnmU8YatmY3J135vBacW7ouJJtcFf8ytXSBUfin94fXwmZsdQNRDxdrZaALoQXHg59P1d68yrJpFPzkuaLYz\" target=\"_blank\" rel=\"noopener\">Spigen MagSafe Classic LS Wallet</a>:</strong> This cool-looking wallet incorporates design inspiration from the classic Macintosh computers. The gray might seem a little bit drab, but any Apple enthusiast will likely enjoy the nod to the computers of yesteryear. It’s otherwise pretty standard fare, with space for up to three cards. I like the thumb notch, which makes it easy to slide your cards out.</p><p><strong><a href=\"https://cna.st/affiliate-link/7BxSbB2fAMuusDptQVktDAEsoUL11FuxVkhZTLvaYnWuoXwMbWKMU5vmrCezDxD3sndKv4egnsYov1nNgHThsbjHUvxDqE6wSoamZkfPYoaAPsHK2uL6etNRdweEfNu431gfygu89Vch67Cew6QzJcLCzGwjK3Ght11BchNeSSuQrN7diUMmPyHwKovHkBiTH5g5ZVKFC3GGPHRBdGYQpKvM3MM7VCekCsVqeKBBF8PXC53uj9cQn7UNzFh6cTCyDHTeP6Nixkpp5vBtso8R4tBsrPB9DqC6AN4Duj5yCWHbZfxXG4bqQrHZzFsGYVvwYUFdXHbybpHg\" target=\"_blank\" rel=\"noopener\">PopSockets Kick-Out PopWallet</a>:</strong> This MagSafe wallet has a built-in PopSockets grip, and a hinge so you can kick it out into kickstand mode. It’s simple and works as intended, and might be up your alley if you want a wallet that can do it all. However, I had some trouble getting it to sit correctly, and once it popped off my phone of its own accord. For these reasons, I recommend it with reservations, and think it’d be better if it were a tad more secure—especially since getting it to hold three cards is a bit of a stretch.</p><h2>Avoid These Wallets</h2><p><strong><a href=\"https://cna.st/affiliate-link/2T1tL1HJ51D98fKki2RLi2hR4PwcbTshtFVRjGYp3kMgvTcnRHr5C9CGkVtR5hx2QqAM1chGyPvSPnNUzhkH8PD1JcXEaKB5FbonEHXLxc4LTQbx3n8kU9UeKY18YN1n32fRSRWdV6r1Po66FWA65ABZmC3A1FxY2Xn2ryvRo6xjF41iSYWVru5qVUUX9Qfg5MbCF2ztB6PuME5p2YoReeJjve8P9e3o19MojQHZCJhB2oxMaeLznvcAhSjFvLZkKwBdPZThtZEqLBwmsEz\" target=\"_blank\" rel=\"noopener\">Ohsnap! Snap Grip Wallet</a>:</strong> I had high hopes for this one, mainly because of its build quality. The wallet is aluminum, can hold up to eight cards (depending on whether they have raised lettering or not), has MagSafe support, and comes with a grip that doubles as a kickstand. Unfortunately, the grip is made of plastic, and it broke after a short time (it won’t fold properly back into place). The magnetic hold isn’t as strong as other MagSafe wallets, even with a MagSafe-approved case on my phone. None of that is great, especially at this high price.</p><p><a href=\"https://cna.st/affiliate-link/nntVzjQ3JMLounNPYNrETBFpnx1VA7KTTdFY2v3FEq9o5tvzKhipnnpZJGT8FywewFEeWBKWc1pELHCFeW9V7RxTWuLqcaA2zRQWb8qsNEJNUWoETV2nkNgvR8r4vix38ULem4YaytpkZTYkYmWJxKyj5Bf7xs2RXGSnG7P14HNsJghJr1vmFbLZ1pFJQks8wnX6zERkvg3bDQvAYR99RLeDcGTs7Jq9eH1c7TLbXMyYPVqLsJRndLwjMgd6FdpVrbbwhbcRaxkwrB2XW3JbX6MjRyMKioFvBjm9wt6v\" target=\"_blank\" rel=\"noopener\"><strong>Benks 600D MagSafe Wallet with Stand</strong></a>: The Benks 600D MagSafe wallet might be made with Kelvar, but it sure doesn’t feel like it. The inside shell is plastic, and after just a day of use, I spotted a crack in that plastic right next to the hinge. Worse, I tried to apply a bit of pressure to see if the hinge would still hold up, which completely warped the MagSafe ring. Even without clear durability problems, this wallet wouldn’t make the top of the list. It’s reasonably priced at $30 and comes in a handful of attractive colors, but it’s limited to just three cards, and there’s no easy way to get them out.</p><p><a href=\"https://cna.st/affiliate-link/6exhfamEeE8bkUyUzd1bW5vQN2U7Lwc6nwYmBqAjfe2yM9xKFeytwMN423RrcUR4xSY3y8g7pFRxqquhD299bVoe57vDKQYMvwHS29g915YWpkzPBhKavGwdBmoAsDoSv4ytZZ5XqVq8bHCruHGFefKLPuGntAEwuQE35nu1UaWjMUEAC5FEaVjnY1PA3P7ZitBoUC9ejdnUKXsYFa2QLvzNeBvFTdydb36jHnwjvJL6vUYminw1sgbyEJNsLDeYDZp851fromqDxPJKutauQXWtYq8Ry6FujuoaVq9ppumro9JXHJ8uJcSniWScA\" target=\"_blank\" rel=\"noopener\"><strong>Apple FineWoven MagSafe Case</strong></a>: Any time this wallet is separated from your iPhone, you’ll get an alert and can track it in Apple’s Find My app. It has a single slot that can fit up to three cards, but to take the cards out, you have to remove it from your iPhone and push the cards up via the slot on the back. Unfortunately, Apple’s MagSafe wallets exclusively use the company’s proprietary FineWoven material (made of recycled materials). It’s a commendable effort to reduce reliance on leather production, but several WIRED reviewers have said the material doesn’t hold up all that well after some time.</p><p><strong><a href=\"https://cna.st/affiliate-link/3aDLD4v8PzjSrfXUvrXgLMBhdBoYpvy6kGqdj1qsu27mT1W5CKMdwWYC3kjULUkHDpYwDH5h6HJG2zu9YNVFxE4MKVSxs63L7HMRtyE7aQPBweCkkhyn9jVnWxq1ZTddXfMrT9hZRXswQCVMFTvexnQYcwHm6oGkPtA1hVzuhe3bc5DsFfJNsZN6C1a9QGgQF5Jj95KdDw6cCA1MZcL9beverbu61WgVtjumZXCfc6m9o2EU5SDoRaEzxQSt5cbpovfDPG2L1RMfSyxeWRbzrQnhsKn2n23xjNyKVNKd3eg7qQ376LQKU\" target=\"_blank\" rel=\"noopener\">Journey Loc8 Universal MagSafe Slim Wallet</a>:</strong> My cards would slip out of this wallet if I didn’t have it stuffed full, which makes it an obvious “Do Not Recommend” choice when so many other comparable wallets don’t have this problem.</p><p><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><em>Power up with unlimited access to</em> WIRED</a><em>. Get best-in-class reporting and exclusive subscriber content that’s too important to ignore. <a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe Today</a>.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
