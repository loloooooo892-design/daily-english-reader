*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

.swap-btn:disabled {

}

.swap-counter {

}

.article-body h3 { font-size: 1.175rem; }

}

.article-body ul, .article-body ol {

.article-body li {

.article-body a {

  text-decoration-thickness: 1px;

.article-body a:hover {

}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer a {

.archive-link {

@media (max-width: 480px) {

<script>
var articles = [{"title":"UN experts: Belarus weaponized criminal justice system against government dissent","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/un-experts-belarus-weaponized-criminal-justice-system-against-government-dissent/","category":"law","categoryLabel":"Law","wordCount":545,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/un-experts-belarus-weaponized-criminal-justice-system-against-government-dissent/#\" target=\"_blank\" rel=\"noopener\">UN experts: Belarus weaponized criminal justice system against government dissent</a>\n</strong><p>The UN Group of Independent Experts on the Situation of Human Rights in Belarus on Tuesday presented a <a href=\"https://www.ohchr.org/sites/default/files/documents/hrbodies/hrcouncil/sessions-regular/session63/a-hrc-63-crp-1.pdf\" target=\"_blank\" rel=\"noopener\">report</a> detailing the weaponization of the nation’s criminal justice system against government dissenters. The experts found violations of several international human rights treaties, including the Convention against Torture and Other Cruel, Inhuman or Degrading Treatment or Punishment (CAT), the International Covenant on Civil and Political Rights (ICCPR), and others. The report also reiterated previous findings that Belarusian authorities had carried out a widespread and systematic attack against a segment of the civilian population. The experts concluded that the conduct amounted to the crimes against humanity of persecution and imprisonment.</p><p>The report details arbitrary arrests without charge. It notes authorities detain individuals “because of their actual or perceived opposition to the government.” Among those arrested have been peaceful demonstrators, social media critics of the government, trade unionists, lawyers, and media workers.</p><p>The report also documents beatings and denial of access to counsel, as well as defendants being held in metal cages during court proceedings. Lawyers representing people facing politically motivated charges have also been disbarred, deprived of their licenses or arrested, according to the experts.</p><p>The report describes officers placing a sack over one detainee’s head and tightening his handcuffs to the point that he suffered permanent scars. Another detainee reported that officers stretched his legs behind his back during an interrogation. A court gave a defendant 25 days to review 240 volumes, each 500-600 pages in length, while the lawyer could not make copies. The report also details forced video confessions.</p><p>In a <a href=\"https://spring96.org/en/news/121148\" target=\"_blank\" rel=\"noopener\">separate account</a> published by Belarusian human rights organization Viasna, a former detainee said he was held in a two-person cell with 10 people. He said that when his parents called police looking for him, they were told he was not in custody. He also said that following his release, police regularly checked on him and called his wife.</p><p>Belarusian authorities did not cooperate with the experts’ investigation. According to the experts, the government has also failed to hold itself accountable. The report finds that the lack of accountability constitutes violations of the ICCPR, CAT, and others. Article 2 of the <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">ICCPR</a> requires states to respect and ensure its rights without distinction based on, among other grounds, political or other opinion. It also requires that those who have their rights violated be provided an effective remedy by “competent judicial, administrative or legislative authorities.” <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-against-torture-and-other-cruel-inhuman-or-degrading\" target=\"_blank\" rel=\"noopener\">CAT</a> also contains similar provisions regarding remedies and competent authorities in Articles 12, 13, and 14.</p><p>Additionally, CAT defines torture as “any act by which severe pain or suffering, whether physical or mental,” is done intentionally to obtain “information or a confession,” or as punishment or coercion. Article 2 of CAT requires the state to take effective legislative, administrative, judicial or other measures to prevent torture. It provides no exceptions for war or other emergencies. Parties must criminalize torture along with attempts to commit torture as stated in Article 4.</p><p>Currently, there are 886 <a href=\"https://prisoners.spring96.org/en#list\" target=\"_blank\" rel=\"noopener\">political prisoners in Belarus</a>. There have been 4,815 individuals recognized as political prisoners since the 2020 election. Since that election, repression has <a href=\"https://www.jurist.org/news/2024/07/belarus-free-speech-and-judicial-independence-in-peril-osce/\" target=\"_blank\" rel=\"noopener\">increased</a>, with multiple <a href=\"https://news.un.org/en/story/2024/07/1151736\" target=\"_blank\" rel=\"noopener\">UN reports</a> detailing the lack of civil liberties in Belarus.</p>"},{"title":"Is This Massive New Study on the Benefits of Whole Grains Part of the “War on Protein” RFK Jr. is Ending? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/is-this-massive-new-study-on-the-benefits-of-whole-grains-part-of-the-war-on-protein-rfk-jr-is-ending-1285119/","category":"fun","categoryLabel":"Interesting Reads","wordCount":590,"readingTime":3,"content":"<p>Earlier this year, the U.S. Health and Human Services Department under Secretary Robert F. Kennedy Jr. declared an end to the “war on protein” and <a href=\"https://nautil.us/the-strange-paradox-in-the-rfk-jr-diet-guidelines-1263763\" target=\"_blank\" rel=\"noopener\">released a new, inverted food pyramid</a> that put imagery of a steak and block of cheese at the top, with whole grains at the very bottom. But a meta analysis out this week suggests that, rather than worrying about “ending” a “war” on protein—far from a forgotten macronutrient, given the explosion in high-protein supplements and snacks—we should instead focus on that nutrition piece now relegated to afterthought status.</p><p>Featured Video</p><p>The study, which incorporated data from 87 clinical trials, found that eating four to six servings of whole-grain foods each day was associated with a significant reduction in risk of developing cardiovascular disease. Basically, the more whole grains a person ate, the lower their risk of cardiovascular disease seemed to be. The study <a href=\"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag519/8787855?login=false\" target=\"_blank\" rel=\"noopener\">was published</a> this week in the <em>European Heart Journal. </em></p><p><strong>Read more: <a href=\"https://nautil.us/what-exactly-is-a-superfood-anyway-1263940\" target=\"_blank\" rel=\"noopener\">“What Exactly Is a Superfood Anyway?”</a></strong></p><p>“This is the largest and most comprehensive meta-analysis of randomized controlled trials on whole-grain intake and cardiovascular risk factors,” said lead author Helda Tutunchi, an associate professor of nutritional science at Tabriz University of Medical Sciences in Iran, <a href=\"https://www.eurekalert.org/news-releases/1143229?\" target=\"_blank\" rel=\"noopener\">in a statement.</a></p><p>The meta analysis included data taken from more than 6,500 people from trials that were conducted in the United States, Canada, Asia, Europe, and Brazil. Meta analyses are unique in that they combine the results of multiple studies that all ask the same question to get a best estimate of an overall effect. In this case, the researchers sought not only to understand what effect whole-grain intake has on our health, but also to investigate how much whole grains are necessary for these benefits. </p><p>To that end, the studies showed that eating more whole grains was associated with lower body weight, waist circumference, blood pressure, and levels of both total cholesterol and low-density lipoprotein, triglycerides, glucose, and inflammation markers. </p><p>How much more? </p><p>The data uncovered consistent correlations between these improved health metrics and eating 30 to 40 grams of whole grains per day, which is about two to three daily servings. Interestingly, though, even more servings per day seemed to correlate with even better health. The analysis showed that the greatest benefits to health were among those eating 60 to 100 grams of whole grains per day, which is about four to six servings and “toward the upper end of current dietary recommendations,” according to Tutunchi. </p><p>As for where we’re at now, <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5331584/\" target=\"_blank\" rel=\"noopener\">studies</a> <a href=\"https://pubmed.ncbi.nlm.nih.gov/36446403/\" target=\"_blank\" rel=\"noopener\">show</a> that many Americans eat far less than the recommended amount of two to four servings of whole grains per day, and when they’re eaten, they’re rarely eaten in their whole form. </p><p>Moreover, the authors of <a href=\"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag724/8787865\" target=\"_blank\" rel=\"noopener\">an editorial that accompanied the study</a> wrote that the current U.S. dietary guidelines, which also emphasize “real food” and a reduction in overall intake of ultra-processed products (which lack whole grain), might not be good enough. “While this is an important step in the right direction, the trial evidence indicates that higher whole-grain intakes than presently recommended in some guidelines may be optimal for cardiometabolic health.” </p><p>Obviously, much of the recent nutrition advice from the Department of Health and Human Services has focused heavily on getting enough macronutrients like protein. But this study, and others like it, are a reminder that whole grains are still an important component of eating in a way that both promotes health and prevents disease. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: <a href=\"https://stock.adobe.com/contributor/205646728/anaumenko?load_type=author&amp;prev_url=detail\" target=\"_blank\" rel=\"noopener\">anaumenko</a> / Adobe Stock</em></p>"},{"title":"Blizzard explains why it's revealing StarCraft and Diablo 5 release dates so far away: \"We want to convey confidence in some of our biggest bets\"","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/why-blizzard-dating-games-far-away-starcraft-diablo-5","category":"gaming","categoryLabel":"Gaming","wordCount":671,"readingTime":4,"content":"<p>\"We're a Blizzard that's going to ship, and ship big, and ship on time.\"</p>\n    \n  \n  \n  \n  \n            <p>Blizzard uncharacteristically announced two games at the weekend with release dates surprisingly far away. <a href=\"https://www.eurogamer.net/diablo-5-announced-blizzcon-2026-spring-2029\" target=\"_blank\" rel=\"noopener\">One was Diablo 5</a>, which Blizzard plans to release in spring 2029, and the other was <a href=\"https://www.eurogamer.net/starcraft-open-world-shooter-announced-blizzcon-2026\" target=\"_blank\" rel=\"noopener\">the much-rumoured StarCraft open-world shooter</a>, releasing 2030.</p>\n<p>The dates caused commotion. There was more than a decade between the releases of Diablos 2 and 3, but there will be only six years between 4 and 5 (which has caused <a href=\"https://www.eurogamer.net/diablo-4-expansions-over\" target=\"_blank\" rel=\"noopener\">concern about whether there will be any more Diablo 4 expansions</a>). And <a href=\"https://www.eurogamer.net/games/starcraft\" target=\"_blank\" rel=\"noopener\">StarCraft</a> in 2030? I can't think of any studio dating games further away than 2028, let alone Blizzard, which famously has operated with a 'done when it's done' kind of approach, keeping dates obscured to the last moment.</p>\n\n<p>It's a way of doing things that, for Blizzard, is unprecedented, and it begs the question of why do it at all. \"We want to convey confidence in some of our biggest bets coming forward,\" answered Blizzard president Johanna Faries, <a href=\"https://www.bloomberg.com/news/newsletters/2026-09-12/blizzard-announces-diablo-v-new-starcraft-shooter\" target=\"_blank\" rel=\"noopener\">speaking to Bloomberg</a> in an interview. \"We're a Blizzard that's going to ship, and ship big, and ship on time, and all hands on deck to set those projects up for success.\"</p><p>One explanation for the change of approach could come from looming Xbox layoffs. <a href=\"https://www.eurogamer.net/microsoft-xbox-layoffs-2026-double-fine-compulsion-ninja-theory\" target=\"_blank\" rel=\"noopener\">Microsoft cut 1600 people from the Xbox division</a> earlier this year but still has 1600 more cuts to make between now and next summer. Does shouting about these big projects - Blizzard also announced <a href=\"https://www.eurogamer.net/world-of-warcraft-forever-announced-blizzcon-2026-classic-plus\" target=\"_blank\" rel=\"noopener\">the ambitious World of Warcraft: Forever</a>, to launch in November - underline the company's importance and in some way shield it from Microsoft's scissors?</p>\n<p>Faries wouldn't comment on this directly, Bloomberg said, but reportedly acknowledged the uncertainty. \"I'm completely focused on creating as healthy a Blizzard as possible,\" she said. Preserving the company's culture and \"unique special sauce\" is Faries' \"ultimate focus\", apparently. \"And to the extent that we can perform well for Microsoft, I think that should be seen as a mutual win,\" she said.</p>\n\n<p>Not a lot was revealed about the StarCraft shooter at the weekend, <a href=\"https://www.eurogamer.net/starcraft-shooter-2030-details-not-live-service\" target=\"_blank\" rel=\"noopener\">though we've learned more about it since</a>. Former Ubisoft Far Cry overseer Dan Hay came on stage to reveal it - <a href=\"https://www.eurogamer.net/ex-far-cry-boss-dan-hay-reportedly-working-on-new-starcraft-shooter-at-blizzard\" target=\"_blank\" rel=\"noopener\">who was reported to be working on the game in 2024</a> - and told us the game would be open-world and tonally on the serious side. A CGI trailer showed Terran mech-pilot recruits training and going to war, then dying in zerg stampedes, before their mech suits were returned and cleaned of pulped body-sludge for the next round of recruits to occupy. The message was their lives didn't matter and chances of survival were slim - will you fare better?</p><p>A shooter is a notable departure for StarCraft, which is known as an RTS series, though there was a failed attempt to make a <a href=\"https://www.eurogamer.net/games/starcraft-ghost\" target=\"_blank\" rel=\"noopener\">StarCraft Ghost</a> stealth-like shooter many years ago. Faries called the new StarCraft a \"broadening\" of the series and labelled it \"a StarCraft for the modern, next generation of players without departing from our RTS roots\", which is a curious thing to say - does that suggest it has RTS elements to it? \"We'll have more to say about that, you know, over the years here,\" Faries added. The intention of revealing it so early was \"starting a new conversation around it\".</p>\n<p>Besides Diablo 5, the StarCraft shooter, and World of Warcraft Forever, Blizzard also announced a Diablo Netflix animated series - alongside broader plans to do similar with many of its brands - a brand new Warcraft 3 campaign decades after the game's release, a new <a href=\"https://www.eurogamer.net/games/overwatch\" target=\"_blank\" rel=\"noopener\">Overwatch</a> hero (and tease of what to expect in next year's big expansion-like release), a new <a href=\"https://www.eurogamer.net/games/diablo-iv\" target=\"_blank\" rel=\"noopener\">Diablo 4</a> class, and outlined the next big patch for World of Warcraft's Midnight era. It was a big show, and you can catch up with our <a href=\"https://www.eurogamer.net/blizzcon-2026-announcements-live-report-starcraft-diablo-overwatch-wow\" target=\"_blank\" rel=\"noopener\">blow-by-blow account of the BlizzCon 2026 Opening Ceremony</a> elsewhere on the site.</p>\n\n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 1 more                      \n            \n\n      <p>\nAwaiting cover image      </p>"},{"title":"AI and the Destruction of the Creative Commons","source":"Hacker News Best","author":"","url":"https://www.chesterwisniewski.com/post/2026-09-13-ai-is-destroying-the-creative-commons/","category":"tech","categoryLabel":"Technology","wordCount":694,"readingTime":4,"content":"<p>The balance of software copyright protection and openness has always been fraught with minutiae and detail that bores all but the most nerdy of pedants. Yet, through much effort and 40 years of debate we had reached an equilibrium. Now AI has thrown that out the window.</p>\n<p>When I was young I remember typing in BASIC programs from magazines into my Commodore 64 and later teaching myself REXX to write games for a BBS I ran. Without these “open” examples, I would never have been empowered to teach myself the basic tenets of programming. This was the era when the issue of whether software could be copyrighted was still being debated.</p>\n<p>First there were shareware and freeware, both closed source. Shareware was basically trial-ware; you could try the software and pay a modest fee to register to unlock the full version. Freeware was totally free, as in beer, but the source was not published. Most famously Doom was distributed as shareware, creating a huge market through word-of-mouth copying.</p>\n<p>The forces on the side of openness pivoted and turned copyright onto itself, coining the term “copyleft” and creating licenses like GPL, MPL, and CC-SA, forcing those who wish to take advantage of software that was both free as in beer and free as in freedom to cascade those rights onto any further derivative works.</p>\n<p>The modern internet and cloud could not exist without free and open software. Every cloud service and the very backbone of the internet itself are derivative works standing on the shoulders of the previous generation’s giants. Without that openness, being online would likely look more like AOL and CompuServe, be hundreds of times more expensive, and be even more of an oligarchy than we have today.</p>\n<p>While there is much discussion of the environmental destruction, the cybersecurity implications, and the misinformation being imposed on all of us by generative AI large language models, I haven’t seen nearly as much discussion of the destruction of our foundational openness.</p>\n<p>First, these LLMs are consuming everything they find online, without regard for copyright or license. Any derivative works may or may not reflect the licenses of the original creators and to date there seems to be no appetite for legal enforcement of these obligations.</p>\n<p><em>The social contract has been broken.</em></p>\n<p>I now have every incentive to not share my work, while also being wary of anything I find online that has been shared. If it hasn’t been polluted by slop code, it might have been poisoned with a malicious library, send data off to third parties, or itself be comprised of someone else’s stolen work, implicating me in the crime.</p>\n<p>If I make my code available, AI can be used to more easily discover vulnerabilities to abuse my coding errors, while if I keep my code closed it is far more difficult to find those same mistakes.</p>\n<p>If I publish my code on a public service like GitHub, I am likely to be inundated with pull requests generated by AI bots and inexperienced users, flooding me with mostly useless slop and taking all of my spare time away just triaging it.</p>\n<p>We all have our own set of ethical and moral guidelines, which are also lost once having been absorbed into the colossus. While existing licenses and agreements are imperfect, they have been shown to be enforceable in a court of law allowing me, the creator, power over my own creation.</p>\n<p>AI has turned sharing knowledge from a gift to the world, into a liability for the author. The act of openness will be twisted and abused into creating more consolidated wealth and power, without respect or credit for those who did the real labour.</p>\n<p>This will have incredible negative consequences for the future. The past 35 years of openness have created nearly everything we benefit from online, which has transformed the world in a mostly positive and empowering way.</p>\n<p>We are entering a digital dark age. As authors, coders, technologists, and artists we must come together to introduce a new digital Renaissance before too much is lost. If we don’t, we’re likely to end up in some bizarrely twisted version of Fahrenheit 451.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
