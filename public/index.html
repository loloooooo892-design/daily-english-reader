<script>
var articles = [{"title":"I modded Crazy Taxi into Grand Theft Auto 5","source":"PC Gamer","author":"Joshua Wolens","url":"https://www.pcgamer.com/games/grand-theft-auto/i-modded-crazy-taxi-into-grand-theft-auto-5/","category":"gaming","categoryLabel":"Gaming","wordCount":512,"readingTime":3,"content":"<p>Los Santos Customs</p><p>I'm modding GTA 5 every day in a quest to either transform it into a PC version of GTA 6 or break it entirely. Come back tomorrow to find out what new horrible thing I've done to Rockstar's baby, or check out <a href=\"https://www.pcgamer.com/games/grand-theft-auto/im-modding-gta-5-every-day-until-it-becomes-gta-6-or-breaks-starting-with-a-new-vehicle-and-enough-missiles-to-level-a-city-block/\" target=\"_blank\" rel=\"noopener\">what I got up to earlier</a>.</p><p>Have you heard? <a href=\"https://www.pcgamer.com/games/racing/as-an-og-crazy-taxi-lover-its-new-remake-might-just-not-be-crazy-enough/\" target=\"_blank\" rel=\"noopener\">Crazy Taxi is coming back</a>. As a game, yes (with some rather off-putting <a href=\"https://www.pcgamer.com/games/racing/the-new-crazy-taxi-has-a-generative-ai-disclosure-on-its-steam-page-and-people-are-not-happy/\" target=\"_blank\" rel=\"noopener\">gen-AI mixed in</a> there), and also as <a href=\"https://www.pcgamer.com/movies-tv/segas-ongoing-effort-to-revive-crazy-taxi-now-appears-to-be-taking-the-form-of-a-movie/\" target=\"_blank\" rel=\"noopener\">a movie</a>. You may have heard this. What you have not heard is that I, personally, am bringing Crazy Taxi back. I am bringing it back to Los Santos, to <a href=\"https://www.pcgamer.com/grand-theft-auto-5/\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 5</a>.</p><p>Simply put, I have installed the aptly-named <a href=\"https://www.gta5-mods.com/scripts/crazy-taxi-mod\" target=\"_blank\" rel=\"noopener\">Crazy Taxi Mod</a>, which has populated my doomed and bedraggled city with a new variety of quest: a taxi quest. A <em>crazy</em> taxi quest.</p><p>Approach a yellow circle and the game will prompt you to hit H. Hit H and you will enter a world of point-to-point transportation. The mod gives you a selection of cars, all yellow, and none of which I can remember because all the cars in my game are seized<a href=\"https://www.pcgamer.com/games/grand-theft-auto/i-turned-car-friction-off-in-gta-5-help/\" target=\"_blank\" rel=\"noopener\"> by irresistible movement</a>, which means they immediately jet off the vehicle-select screen as soon as they appear.</p><p>An added consequence of this behaviour is that you have to choose a car quickly. The mod will teleport you into the one you've chosen, whatever its location. Wait too long, and the car you want to drive will have either taken flight or ploughed into the side of a building and exploded.</p><p>Regardless, once you're in, it's pure Crazy Taxi. You've got a time limit and the sidewalks have punters. Pick them up and your time limit extends. The goal is rapidity, to keep your pickups and dropoffs frequent enough that your time limit is actually <em>growing</em> in the aggregate, rather than depleting.</p><p>Or it would be, but my various fares keep getting scared off by the rolling gang war that Los Santos has, at this point, descended into. Or they get hit by cars, or shot by my bodyguards, or they have bad credit maybe. Who knows? Point is, they sometimes fail to actually get in the car, leaving me idling my big yellow taxi forlornly at the side of the road, eternally.</p><p>But aren't we all doing that in some way, when you think about it?</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>One of Josh's first memories is of playing Quake 2 on the family computer when he was much too young to be doing that, and he's been irreparably game-brained ever since. His writing has been featured in Vice, Fanbyte, and the Financial Times. He'll play pretty much anything, and has written far too much on everything from visual novels to Assassin's Creed. His most profound loves are for CRPGs, immersive sims, and any game whose ambition outstrips its budget. He thinks you're all far too mean about Deus Ex: Invisible War.</p>"},{"title":"Dyson Won’t Say What’s Wrong With Its CameraJet Toothbrush","source":"Wired","author":"@wired","url":"https://www.wired.com/story/dyson-wont-say-whats-wrong-with-the-camerajet-toothbrush/","category":"tech","categoryLabel":"Technology","wordCount":1003,"readingTime":6,"content":"<p>There's always a danger in over-complicating products. Simple is so often best. The apocryphal story of NASA spending millions crafting a space pen while Soviet cosmonauts used a pencil is often cited as a prime example, even if it's <a href=\"https://www.scientificamerican.com/article/fact-or-fiction-nasa-spen/\" target=\"_blank\" rel=\"noopener\">actually not true</a>. Perhaps it's not surprising that <a href=\"https://www.wired.com/tag/dyson/\" target=\"_blank\" rel=\"noopener\">Dyson</a> has got into hot water trying to <a href=\"https://www.wired.com/story/dyson-camerajet-electric-toothbrush-and-flosser/\" target=\"_blank\" rel=\"noopener\">reinvent the electric toothbrush</a>.</p><p>The Chinese invented the first bristle toothbrush during the Ming dynasty. That concept muddled along quite nicely until 1937, when Tomlinson Moseley filed a patent for the earliest electric toothbrush. After more than 400 years, the <a href=\"https://en.wikipedia.org/wiki/Electric_toothbrush\" target=\"_blank\" rel=\"noopener\">Motodent</a> marked the beginning of an evolutionary shift from manual brushing to powered oral care.</p><p>Having had considerable success reimagining established product categories such as <a href=\"https://www.wired.com/gallery/best-dyson-vacuums/\" target=\"_blank\" rel=\"noopener\">stick vacuums</a> and <a href=\"https://www.wired.com/gallery/best-hair-dryers/\" target=\"_blank\" rel=\"noopener\">premium hair dryers</a>—though not so much <a href=\"https://www.wired.com/story/dyson-has-killed-its-bizarre-zone-air-purifying-headphones/\" target=\"_blank\" rel=\"noopener\">air-purifying headphones</a>—the company earlier this month, with great fanfare, unveiled the next leap forward for teeth: the $499 Dyson CameraJet with a tiny camera to aim streams of rinsing fluid into the gaps between your teeth.</p><p>Others, like the Waterpik Sonic-Fusion 2.0, have already been daring (or foolhardy) enough to combine brushing and water flossing. However, Dyson upped the ante further by adding a macro-lens camera, allowing its “Gap Optical Targeting system,” trained on 470,000 dental images, to identify within 100 milliseconds precisely where to squirt fluid from the 12.5 milliliters of mouth rinse stored in its on-board reservoir.</p><p>It's taken Dyson six years, 38 patents, and an awful lot of money to make this camera-squirt-brush doohickey work. However, something has gone badly wrong with the CameraJet. So wrong that despite <a href=\"https://www.wired.com/video/watch/tech-support-james-dyson-answers-design-questions-from-twitter\" target=\"_blank\" rel=\"noopener\">James Dyson</a> globally launching the product at a Paris event mere weeks ago, you can no longer, as far as WIRED can ascertain, buy the CameraJet anywhere.</p><p>The CameraJet launched in US stores on September 8. Just a day later, reports began outlining the <a href=\"https://www.theverge.com/gadgets/992113/some-of-dysons-500-toothbrushes-are-breaking\" target=\"_blank\" rel=\"noopener\">first user complaints</a> of water in the battery compartment and failures within 30 seconds of use. Consumer Reports' <a href=\"https://www.consumerreports.org/health/toothbrushes/dyson-camerajet-review-a7514330826/\" target=\"_blank\" rel=\"noopener\">own review unit</a> stopped working less than 24 hours after unboxing. On September 11, French outlet <a href=\"https://www.numerama.com/tech/2330911-apres-de-nombreux-signalements-dyson-retirerait-deja-de-la-vente-sa-brosse-a-dents-camerajet-a-479-e.html\" target=\"_blank\" rel=\"noopener\">Numerama</a> reported that the French Dyson site and stores had reportedly stopped selling the toothbrush. By September 15, stores in the US, UK, and Singapore, where Dyson's headquarters now reside, had <a href=\"https://mothership.sg/2026/09/dyson-toothbrush/\" target=\"_blank\" rel=\"noopener\">followed suit</a>.</p><p>Despite the product disappearing from shelves and online stores, Liv Thomas, the company's head of Beauty Communications, insists to WIRED that the CameraJet hasn't been recalled. Instead, the gadget is “experiencing strong demand globally” and “shortages of supply as we are in the process of scaling up production.\" Units will reappear supposedly in “the coming weeks.” But what about the multiple reports of breakages, leaking, and battery failures in multiple countries?</p><p>“We have identified a single component issue affecting a small number of early batches,” Thomas says. “We have isolated those batches and are supporting affected customers.”</p><p>Thomas confirmed that Dyson would not answer questions on where—if anywhere—the Dyson CameraJet was still on sale worldwide. Nor would Dyson confirm when it stopped shipments of the product. Thomas also confirmed that Dyson refuses to detail what the faulty “single component” is, what problem it's causing for the CameraJet, or how many units have been affected globally. Dyson also refused to comment on why it had not issued a formal recall of these faulty early batches of the $500 device.</p><p>Dyson Reddit forums have lit up, with names such as “ScameraJet” being bandied around, along with one <a href=\"https://www.reddit.com/r/dyson/comments/1wm644m/dyson_toothbrush_camerajet/\" target=\"_blank\" rel=\"noopener\">disgruntled buyer commenting</a>: “Bought two of these and both of them have stopped working. Since I bought it in the UK and wasn’t planning to return it and have thrown the packaging away, I can’t even return them. Disappointed that they scammed so good. Unbelievable that it lasted just two weeks.”</p><p>Kyle Wiens, CEO of the repair company <a href=\"https://www.wired.com/story/ifixit-rating-for-the-iphone-18-pro-repairability/\" target=\"_blank\" rel=\"noopener\">iFixit</a>, feels the problem <a href=\"https://www.reddit.com/r/dyson/comments/1w88mkz/who_here_has_received_a_defective_dyson_camerajet/\" target=\"_blank\" rel=\"noopener\">may well be leaking</a>.</p><p>“This sounds like a waterproofing issue. Making products at scale with the tolerances required to waterproof are hard,” he says. “My guess without getting a chance to look at a failed unit is that we either have a tolerance issue where some parts aren't mating perfectly, or a failure in the adhesive curing process, either during manufacturing or in shipping.”</p><p>Wiens says this adhesive-curing failure can happen in such a way that a product can pass factory testing fine, but then heat or humidity (or both) during shipping causes a problem.</p><p>Adam Toner, founder and technical director of <a href=\"https://ripcorddesigns.com/\" target=\"_blank\" rel=\"noopener\">Ripcord Designs</a>, a UK-based electronic design consultancy that has worked with multinational companies including Formula One Management and Panasonic, also thinks water is the CameraJet's problem.</p><p>“On a product like this, there just should never be any water ingress into the internals,” he says. “I don't have one in front of me, but I've seen a few videos and people explaining how you change the battery. Once you pull the battery off—which is where people say they're seeing water—it looks like there is probably access from that battery compartment into all of the internals of the device.”</p><p>The CameraJet not charging, overheating, or failing to start—all of that can be explained by water getting into the device, Toner says. He suspects the problem could be as benign as a faulty gasket or O-ring.</p><p>If water getting in does turn out to be an issue for the CameraJet, as these experts suggest, this begs the obvious question: How on earth has Dyson managed to spend <em>six years</em> developing a teched-up toothbrush, designed to be dunked in water every use, and that carries liquid around in it, yet fail to make it waterproof?</p><p>Wiens believes the CameraJet chaos could force a well-overdue rethink for Dyson.</p><p>“Clearly they didn't plan for this to happen,\" he says. \"They should take this opportunity to invest in repairability. Making products easier to fix also makes them easier to rework when manufacturing defects occur. Dyson is way behind the industry on making repair parts and information available for their products. This should be a wake-up call for them to step up.”</p>"},{"title":"Someone Trying to Vanish My Post About a No-Pseudonymity Decision","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/22/someone-trying-to-vanish-my-post-about-a-no-pseudonymity-decision/","category":"law","categoryLabel":"Law","wordCount":963,"readingTime":5,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/09/22/someone-trying-to-vanish-my-post-about-a-no-pseudonymity-decision/\" target=\"_blank\" rel=\"noopener\">Someone Trying to Vanish My Post About a No-Pseudonymity Decision</a>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t9.22.2026 11:48 AM\n</p>\n\t</h2>\n\t\n\t\t<p><strong>[1.] </strong>First, the backstory: In December, I <a href=\"https://reason.com/volokh/2025/12/15/no-pseudonymity-for-civil-defendant-accused-of-sexual-assault/\" target=\"_blank\" rel=\"noopener\">posted</a> an item about a decision by Judge Jeannette Vargas (S.D.N.Y.) in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.643215/gov.uscourts.nysd.643215.28.0.pdf\" target=\"_blank\" rel=\"noopener\">Finley v. Przybylowski</a></em>:</p>\n<blockquote><p>Plaintiff and Defendant are attorneys who met seven years ago as summer associates at different prominent law firms in New York City…. [Plaintiff] alleges that Defendant violently raped and sexually assaulted her on the night they met, causing her physical, professional, and psychological damage. Defendant denies all allegations of nonconsensual conduct…. Defendant claims that he and Plaintiff engaged in consensual sexual activity in May 2018. Defendant attests that he was \"terminated from [his] employment with a top law firm on October 13, 2025 as a result of the Plaintiff's Complaint and false allegations,\" and that he fears that it would be \"nearly impossible\" to obtain employment with his name attached to this lawsuit, He also claims to fear that his physical safety could be placed at risk….</p></blockquote>\n<p>Defendant sought to proceed under a pseudonym, but the court said no:</p>\n<blockquote><p>[T]he economic and reputational harms that Defendant has faced and may face as a party to this action, substantial though they may be, are outweighed by the public interest in access to judicial proceedings….</p></blockquote>\n<p>I excerpted more of the opinion, which you can read <a href=\"https://reason.com/volokh/2025/12/15/no-pseudonymity-for-civil-defendant-accused-of-sexual-assault/\" target=\"_blank\" rel=\"noopener\">here</a>. Naturally, one can agree or disagree with the court's decision to deny pseudonymity, but in any event, my post passed along that decision.</p>\n<p><strong>[2.] </strong>Then, on July 22, Przybylowski's lawyer (a partner at a small but prominent law firm) sent a letter to Reason, with a \"demand\" that the post be removed:</p>\n<blockquote><p>Following publication of the Article, the United States District Court for the Southern District of New York dismissed the underlying action with prejudice. In light of the sensitive nature of the allegations, the Court also ordered that the filings containing those allegations be sealed. A copy of the Court's order is enclosed as Exhibit B. Because the allegations referenced in the Article have been dismissed with prejudice and the underlying filings have been sealed by the Court, they are no longer part of the public record. Nevertheless, the Article continues to republish and disseminate those allegations, causing ongoing harm to our client.</p>\n<p>IN LIGHT OF THE FOREGOING, DEMAND IS HEREBY MADE that you remove the Article and all statements referencing the dismissed and sealed allegations in their entirety no later than July 27, 2026. While our client hopes this matter can be resolved promptly and amicably, he is prepared to pursue all available legal remedies to mitigate and remedy the harm caused by the continued publication and dissemination of these allegations, including seeking appropriate injunctive relief and recovery of all damages and other relief available under applicable law.</p></blockquote>\n<p>But while the District Court did <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.643215/gov.uscourts.nysd.643215.45.0_1.pdf\" target=\"_blank\" rel=\"noopener\">order</a> (incorrectly, I think) the sealing of some of the court filings, it <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.643215/gov.uscourts.nysd.643215.45.0_1.pdf\" target=\"_blank\" rel=\"noopener\">expressly refused</a> to seal its orders and opinions, including the opinion that I was quoting:</p>\n<blockquote><p>[T]he motion to seal the docket in its entirety would have the Court shield from public view decisions already rendered by this Court, which are at the core of the performance of the judicial function. The parties' privacy interests are insufficient to justify the sealing of judicial orders and opinions.</p></blockquote>\n<p>I therefore promptly and amicably declined to go along with counsel's demand. Even if the opinion had been retroactively sealed, I believe I would have been within my rights to keep up my post quoting the opinion, under cases such as <em>Florida Star v. B.J.F. </em>(1989). But given that the opinion wasn't sealed—again, the court expressly declined to seal it—it's hard to see how I could be subjected to an injunction or damages by keeping up a post that was reporting on its contents. (Note that the judge had <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.643215/gov.uscourts.nysd.643215.40.0.pdf\" target=\"_blank\" rel=\"noopener\">struck from the docket</a> one opinion that she had released on April 15, because she had learned the same day that the parties had \"agreed to a settlement in principle\" the day before; but that is not the opinion that I was quoting.) And indeed no \"legal remedies\" have been sought against me since my refusal.</p>\n<p><strong>[3.] </strong>But someone (I don't know who) has sought to do something else about my post since that refusal: A few days ago, the <a href=\"https://lumendatabase.org/pages/about\" target=\"_blank\" rel=\"noopener\">Lumen Database</a> reported that Google had received a request that <a href=\"https://lumendatabase.org/notices/97005667?access_token=mbCbog361BEuB2_zsr8gUA\" target=\"_blank\" rel=\"noopener\">it \"deindex\" various web pages</a>, which is to say remove them from its search results. Those pages include my post about the case, a Bloomberg Law article about the case, and several pages that archived opinions about the case or dockets for the case:</p>\n<blockquote>\n<ol>\n<li>https://app.midpage.ai/case/finley-v-[REDACTED]-11062084</li>\n<li>https://cases.justia.com/federal/district-courts/new-york/nysdce/1:2025cv04383/643215/26/0.pdf</li>\n<li>https://dockets.justia.com/docket/new-york/nysdce/1:2025cv04383/643215</li>\n<li>https://law.justia.com/cases/federal/district-courts/new-york/nysdce/1:2025cv04383/643215/28/</li>\n<li>https://law.justia.com/cases/federal/district-courts/new-york/nysdce/1:2025cv04383/643215/39/</li>\n<li>https://law.justia.com/cases/federal/district-courts/new-york/nysdce/1:2025cv04383/643215/45/</li>\n<li>https://news.bloomberglaw.com/business-and-practice/ex-pomerantz-associate-denied-anonymity-in-rape-suit-against-him</li>\n<li>https://reason.com/volokh/2025/12/15/no-pseudonymity-for-civil-defendant-accused-of-sexual-assault/</li>\n<li>https://storage.courtlistener.com/recap/gov.uscourts.nysd.643215/gov.uscourts.nysd.643215.28.0.pdf</li>\n<li>https://www.casemine.com/judgement/us/69e3b6332e996410bea78ed5</li>\n<li>https://www.docketalarm.com/cases/New_York_Southern_District_Court/1-25-cv-04383/Finley_v_[REDACTED]/</li>\n<li>https://www.law360.com/cases/6830d818a5043482d2376c05</li>\n<li>https://www.leagle.com/decision/infdco20260317c21</li>\n<li>https://www.leagle.com/decision/infdco20260416d22</li>\n<li>https://www.pacermonitor.com/public/case/58203472/Finley_v_[REDACTED]</li>\n</ol>\n</blockquote>\n<p>There is of course no legal basis mandating the removal of these materials, nor do I see any justification in Google policies for its deindexing those sites voluntarily (as it is generally free to do). And to my knowledge, the attempt to vanish those sites has failed: I don't think Google has indeed deindexed them.</p>\n<p>Again, the Lumen entry does not indicate who submitted the deindexing request. Still, someone did submit it, and it strikes me as a helpful illustration of how people, whoever they may be, try—even if often without success—to get matters (even matters of public record) hidden from online viewers. For more posts on this general subject, see <a href=\"https://www.google.com/search?q=site%3Areason.com%2Fvolokh+vanish+attempt&amp;ie=UTF-8\" target=\"_blank\" rel=\"noopener\">here</a>.</p>\n<p>I e-mailed Przybylowski's lawyer (see item 2 above) Thursday night and again Sunday to ask whether he, his colleagues, or his client had a statement on the matter. I have not heard back from them; if I do hear something, I'll update the post accordingly.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/09/22/lawsuit-against-st-louis-restaurant-for-firing-manager-for-post-related-to-charlie-kirk-murder/\" target=\"_blank\" rel=\"noopener\">NEXT: Lawsuit Against St. Louis Restaurant for Firing Manager for Post Related to Charlie Kirk Murder</a>\n    </p>\n\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a>"},{"title":"Inside Shaq’s League of Dunkers","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/28/inside-shaqs-league-of-dunkers","category":"fun","categoryLabel":"Interesting Reads","wordCount":679,"readingTime":4,"content":"<p>Shaquille O’Neal first messaged Mac McClung a decade ago, when McClung was a seventeen-year-old living in Gate City, Virginia, scoring sixty points in a game and doing reverse-windmill dunks over future accountants and insurance adjusters. O’Neal loved his swag. McClung didn’t get drafted out of college—he’s neither tall nor wide—but he has since played in a total of seventeen N.B.A. contests across four seasons and five teams. He fell into dunking. “The Dunk Contest was never something where I was, like, ‘That’s my goal,’ ” McClung said the other day, as a physical therapist dug into his hip flexors in the bowels of a Midtown Atlanta arena. “But it happened, and it’s been a beautiful thing.” McClung, who currently plays professional basketball in Spain, has won three N.B.A. Slam Dunk Contests, by jumping over a car, over two guys stacked on top of each other, and over Shaq himself. “For one of them, Shaq put on my high-school jersey,” he said. “At my high school, they have that picture hung up.”</p><p>This spring, O’Neal asked McClung, now a floppy-haired twenty-seven-year-old who writes poetry (he took inspiration from “The Vibrational Poetry Book” and the work of Greta Gerwig) to star in the first dunking league. “At first, I was kind of, like, ‘I don’t know if I could compete with these guys,’ ’’ McClung said, of the men who have abandoned basketball for its most spectacular component. There’s Cam Hazzard, an “Excel-sheet master” and a finance major at Abilene Christian University, who can do something called a 360 inverted East Bay (it’s impressive); Dengxing (Dunk) Chen, a five-foot-nine Chinese virtuoso with a fifty-two-inch vertical; and Isaiah (the Puerto Rican Airbender) Rivera, the only human to have completed a 360 behind-the-back-between-the-legs dunk.</p><p>“Then I started thinking of it like <em>O.K., what kind of ego is that</em>? Like, <em>Oh, are you afraid you’re going to lose</em>?” McClung said. Incidentally, the champion would win five hundred thousand dollars: five times what the N.B.A. pays its top dunker. McClung joined the Dunkman League.</p><p>For a dunker, McClung is nearing middle age. He stepped off the trainer’s table and grimaced. “Getting old, man,” he said, walking to a nearby court to play some one-on-one with Bradley Dean, a high-school buddy whom he uses as a human hurdle in dunk contests. (“A privilege,” Dean said.) Then they circled up with a dunking consultant to talk through the first dunk that McClung would attempt at the following day’s championship.</p><p>“Either the triple, the crystal, or the two-ball,” McClung said. He turned to Dean: “You come in, you throw that dime.” Dean nodded gravely.</p><p>Another idea: “So, what would happen if I did the 720 again?”</p><p>An awkward pause. “It still is a score where somebody has to do some real shit,” the consultant offered.</p><p>McClung considered the abilities of Chen, his first-round opponent. “He jumps from fucking half-court,” he said. “One thing I do love is trying to get everybody hyped up first. I love winning everybody over.” Twenty minutes later, pacing around the basket, he said, “I just forgot the whole plan.”</p><p>“Let Mac overthink,” the consultant said. “It’s a ritual.”</p><p>The following evening, the arena was heavy on Hazzard fans. O’Neal, graying and gargantuan, sat in the second row wearing a shirt with his name printed all over it. Asked about McClung, he said, “A little white kid who can do crazy shit. It’s a travesty he doesn’t have a spot on an N.B.A. team.” He shovelled a handful of popcorn into his mouth. “He’s No. 1 here.” McClung was nearby, listening to Justin Bieber and thinking through his first dunk.</p><p>The lights dimmed. Eight dunkers bounced out on bulging calves. Wearing a headband and a hard look, Chen took a breath and sailed over a man and two motorcycles. His translator pumped a fist. McClung, in peach-colored shoes, countered by jumping over a convertible with three friends inside. The judges gave Chen’s dunk the edge by two one-hundredths of a point. McClung bowed to his opponent and went to the locker room.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
