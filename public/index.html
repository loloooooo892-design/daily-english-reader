<script>
var articles = [{"title":"Third Circuit Rejects Facial Challenge to Ban on Nonimmigrant Aliens' Gun Possession","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/02/third-circuit-rejects-facial-challenge-to-ban-on-nonimmigrant-aliens-gun-possession/","category":"law","categoryLabel":"Law","wordCount":1293,"readingTime":7,"content":"<p>Some excerpts from <a href=\"https://www2.ca3.uscourts.gov/opinarch/253012p.pdf\" target=\"_blank\" rel=\"noopener\"><em>U.S. v. Aleman-Lozano</em></a>, decided yesterday by Third Circuit Judge Patty Shwartz, joined by Judges Theodore McKee:</p>\n<blockquote><p>Aleman-Lozano is a native and citizen of El Salvador. He entered the United States unlawfully but, in 2017, was granted a nonimmigrant temporary visa with work authorization. Since entering the United States, he has resided with his family, attended school, and worked in Washington, D.C.</p>\n<p>In September 2021, a Pennsylvania state trooper pulled Aleman-Lozano over for a traffic violation …. During the stop, the trooper saw a rifle cartridge on the passenger seat. As a result, the trooper obtained a search warrant and found a pistol containing a loaded sixteen-round magazine, which Aleman-Lozano told police he had purchased from an unidentified individual in Maryland. The pistol did not have a serial number….</p></blockquote>\n<p>Aleman-Lozano was prosecuted under 18 U.S.C. § 922(g)(5)(B), which generally makes it illegal for aliens present under a nonimmigrant visa (with some exceptions) to possess guns, and brought a facial challenge to the constitutionality of the provision. Judges Shwartz and McKee assumed without deciding that \"the people\" in the Second Amendment included noncitizens who were lawfully present, but concluded that \"there is historical support for the challenged restriction\" based on \"analogues from before and at the time of the Second Amendment's ratification\":</p>\n<blockquote><p>English common law distinguished between \"aliens and natural-born subjects. Natural-born subjects are such as are born within the dominions of the crown of England, that is, within the … allegiance of the king; and aliens, such as are born out of it.\" Under the common law, \"natural-born subjects [had] a great variety of rights, which they acquire[d] by being born within the king's ligeance,\" while the rights of \"aliens … [were] much more circumscribed, being acquired only by residence here, and lost whenever they remove[d].\" For example, \"aliens\" could not hold land, and \"land and gun ownership were historically linked.\" \"[T]he right to own guns in eighteenth-century England was statutorily restricted to the landed gentry.\" An alien could own land if he became naturalized by swearing allegiance to the sovereign before Parliament, which \"placed [him] in almost 'exactly the same state as if he had been born in the' dominions of the Crown.\" The English Bill of Rights also limited gun ownership to those loyal to the Crown. It \"guarantee[d] that 'Protestants … may have Arms for their Defence suitable to their Conditions, and as allowed by Law.'\"</p>\n<p>Before the American Revolution, some \"colonial governments prohibited any white person unwilling to affirm his allegiance to the British Crown from collecting firearms.\" For example, Georgia disarmed indentured Acadians, a \"group of French settlers and ancestors to the Cajuns, [who] 'refused to be loyal subjects of the British government' during the French and Indian War.\" The disarmament of Acadians \"was based solely on loyalty concerns.\"</p>\n<p>After the American Revolution began, the states disarmed British loyalists because of their allegiance to the English monarch and not to the American cause. The Continental Congress called upon the States \"immediately to cause all persons to be disarmed … who are notoriously disaffected to the cause of America, or who have not associated, and shall refuse to associate, to defend, by arms, these United Colonies, against the hostile attempts of the British fleets and armies.\" The states answered the call and disarmed those who refused to swear allegiance to the state and/or to the American cause. Thus, from English common law through the Revolutionary period around the time of ratification, there was a historical tradition of disarming those considered disloyal to the sovereign….</p>\n<p>With this history in mind, we conclude that why and how § 922(g)(5)(B) restricts firearms possession is \"consistent with the principles that underpin our regulatory tradition\" because it addresses the same allegiance concern as the historical laws and does so in the same way.</p>\n<p>As to why the restriction exists, \"[a]llegiance serves as a mark of trustworthiness,\" and it \"shows one's willingness to accede to the terms of social order in exchange for the full benefits of citizenship. [Noncitizens], as a matter of their status, have not yet affirmed their allegiance to the sovereign. That has uniformly served as the basis for disarming them.\" Section 922(g)(5)(B) disarms noncitizens who bear a \"presumptive allegiance to a foreign state,\" and not to the United States, and thus addresses the same problem as the historical laws.</p>\n<p>As to the \"how\" inquiry, the historical laws and § 922(g)(5)(B) burden the right in the same way. Historically, governments disarmed individuals \"unless and until they swore an oath of allegiance to the sovereign.\" An individual could obtain the right to bear arms after swearing an oath of allegiance. Today § 922(g)(5)(B) \"disarms persons unwilling or unable to swear the oath of allegiance and loyalty to the United States.\" Noncitizens disarmed under § 922(g)(5)(B) who follow the path prescribed by Congress and undergo the naturalization process, which culminates in taking the oath of renunciation and allegiance \"as a demonstration of trustworthiness,\" gain the right to bear arms. Section 922(g)(5)(B) addresses the same loyalty concern as the historical laws and does so in the same way.</p></blockquote>\n<p>Judge Peter Phipps concurred in the judgment:</p>\n<blockquote><p>The Majority Opinion makes a needless assumption, the breadth of which is staggering, <em>viz.</em>, that all nonimmigrant visa holders are part of \"the people\" and therefore have full Second Amendment rights. A nonimmigrant is a foreign national with a permanent residence abroad who comes to the United States on a temporary basis, such as for tourism, study, business, medical treatment, or transient travel. Whatever are the precise contours of 'the people,' that term certainly does not include every such visitor….</p>\n<p>The term 'the people' as used in the Constitution is \"a term of art\" with consistent meaning. As defined by the Supreme Court, 'the people' refers to \"a class of persons who are part of a national community or who have otherwise developed sufficient connection with this country to be considered part of that community,\" with the understanding that the relevant national community is the national \"political community.\" {[T]he Founding generation, influenced by Locke and Montesquieu, \"spoke of 'the people,'\" to mean \"the sovereign community that consented to a legitimate government\" ….} While not every contour of the national political community has been identified, adult citizens are part of the people, and excludable aliens are not. It may also be that nonimmigrants are, as a class, not part of the national political community as they are citizens of another country with permanent residences abroad, and they cannot vote in federal elections or serve on federal juries. But it is not necessary in this case to determine whether nonimmigrants, as a class, are not part of 'the people.'</p>\n<p>Rather, Aleman-Lozano's facial challenge to § 922(g)(5)(B) will fail if one nonimmigrant visa holder is outside of the national political community. And if nothing else, receipt of one type of nonimmigrant visa—the C-1 transit visa—does not induct foreign nationals into 'the people.' A C-1 transit visa allows foreign nationals to pass through this country to reach another foreign country and has a maximum duration of stay of 29 days. The limitations on the visa—it is given to foreign nationals with permanent residence abroad who are travelling through this country transiently—prevent C-1 transit visa holders from developing a \"sufficient connection\" with this country to be considered part of the national political community. Consequently, C-1 transit visa holders are not part of 'the people,' and the Second Amendment does not protect their ability to keep and bear arms.</p>\n<p>That conclusion is fatal to Aleman-Lozano's facial challenge. It is therefore unnecessary for the resolution of this case to broadly assume that each and every nonimmigrant visa holder is part of 'the people.'</p></blockquote>\n<p>Patrick J. Bannon and Carlo D. Marchioli represent the government.</p>"},{"title":"I held the first truly bezel-free phone","source":"The Verge","author":"Dominic Preston","url":"https://www.theverge.com/tech/985009/tecno-bezelless-concept-phone-ifa","category":"tech","categoryLabel":"Technology","wordCount":962,"readingTime":5,"content":"<p>Cast your mind back a decade or so, and smartphone makers were <em>obsessed</em> with shrinking the bezel on phones. Screens got bigger, the black bars around them got smaller, and for a while it looked like truly edge-to-edge displays were imminent.</p><p>Then, progress just stopped. The bezel shrunk down until it was a millimeter or so on every side, on just about every phone, and phone manufacturers seemed to agree as one that this was probably far enough.</p><p>Tecno, a budget brand in the same family as Itel and Infinix, has stepped up to see if it could push things just a little further. Its new device, the Bezelless, is strictly a concept phone, never destined to go on sale, but it proves the point: It is possible to remove a smartphone screen’s bezel entirely — so long as you don’t mind still having a little frame around the edge.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-10.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>The screen runs from edge to edge, with no visible inactive area.</em><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-11.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>At the right angle you can see the tiniest black line in the corners, but that’s about it.</em><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-12.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>The frame, however, is a bit thicker than on some other phones.</em><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-03.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>It’s still a decent OLED display, with a 144Hz refresh rate and 1.5K resolution.</em><p>The company sent me a prototype of the Bezelless ahead of its unveiling at the IFA trade show in Berlin, so I could see it in action for myself. There is truly no black border at all around the 144Hz, 1.5K, 6.78-inch screen, except for the tiniest hint of a fraction of a black line I can see just under the frame when I look at the phone at an angle. Looking head-on, the screen ends, then the frame begins, and that’s that.</p><p>There is still an inactive edge to the OLED panel, but Tecno has hidden it beneath the frame. The key to the design is the use of two layers of cover glass: The top layer goes up to the edge of the frame, while the lower glass layer and the OLED panel itself both extend underneath it. Designing the phone this way had knock-on effects. It meant building the phone backwards, mounting the display from the phone’s rear rather than its front, which in turn requires securing the screen from the front, with a custom adhesive that sits between the frame and the lower piece of glass.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-display-diagram.png?quality=90&amp;strip=all&amp;crop=0,0,100,100\" target=\"_blank\" rel=\"noopener\"></a></p><p>And while I might cynically point out that the frame here is probably a hair thicker than on most other modern smartphones, it’s a fractional thing. Stand the Bezelless side by side with this year’s flagship <a href=\"https://www.theverge.com/tech/892311/samsung-galaxy-s26-plus-review-screen-battery-camera-software\" target=\"_blank\" rel=\"noopener\">Samsung Galaxy S26 Plus</a>, and there’s clearly a little less material wrapping around the screen — though there’s not much in it.</p><p>Tecno bullishly claims that the Bezelless “redefines how users will interact with their phones in the AI era,” which feels a bit much. Manufacturers stopped shrinking the bezel because it got small enough that most people stopped caring. Removing a strip of black from the screen doesn’t make this phone feel dramatically more impressive or useful than any other I’ve tested this year. A functional upgrade, this is not.</p><p>Still, it <em>does</em> look good. Helped by the light silver frame, the display feels more expansive without a black bar enclosing it. The Android interface now stretches right to the edge, and photos and videos have no border at all (well, at least on two edges — removing the bezel isn’t enough to solve letterboxing). It also allows a fractionally larger display, or a fractionally smaller phone, depending on how you look at it. It’s welcome, but not a game changer — eliminating the front-facing edge of the frame entirely would feel more dramatic, but that’s another ask entirely.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-08.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>Compared to the Galaxy S26 Plus (left) the screen feels a little more expansive without a black border.</em><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-09.jpg?quality=90&amp;strip=all&amp;crop=0,0.011361054305837,100,99.977277891388\" target=\"_blank\" rel=\"noopener\"></a></p><em>The Tecno’s frame is thicker, but the overall border is still thinner.</em><p>As a concept device, the specs of the Bezelless don’t matter too much. But for the curious, it’s powered by a MediaTek Dimensity 7400e chipset, bolstered by 8GB of RAM and 256GB of storage. There’s a big 6,000mAh battery, though the phone itself is fairly slim and light; I suspect silicon-carbon might be involved. What appear to be three rear cameras are actually two — a 50-megapixel main shooter and 8-megapixel ultrawide — with a single 32-megapixel selfie camera on the front. I’m a little surprised Tecno didn’t go all in and use an under-display selfie camera to complete the all-screen effect.</p><p>The rear of the phone is fun too, with a red notification LED and a butterfly design created with a 3D effect, so that the wings appear to rise out of the phone as you move it in the light. It brings to mind Tecno’s <a href=\"https://www.theverge.com/gadgets/886923/tecnos-latest-concept-phone-is-lit-by-neon\" target=\"_blank\" rel=\"noopener\">other concept devices from MWC this year</a>, which included a phone with a color-changing E Ink rear, and another with neon built in. Most exciting of that set was a <a href=\"https://www.theverge.com/gadgets/888860/tecnos-impressive-modular-phone\" target=\"_blank\" rel=\"noopener\">magnetic, modular concept</a> with a range of compatible accessories.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/tecno-bezelless-concept-07.jpg?quality=90&amp;strip=all&amp;crop=0,0,100,100\" target=\"_blank\" rel=\"noopener\"></a></p><em>It’s hard to capture in a photo, but the holographic rear design does appear 3D at the right angle.</em><p>None of those concepts have yet become real products, and I doubt the Bezelless will either, and certainly no time soon. But it does prove that it’s possible, which raises the prospect of whether another manufacturer will bring the idea to market. Apple has long been rumored to be developing a bezel-less, <a href=\"https://www.theverge.com/news/664776/apple-curved-glass-iphone-2027\" target=\"_blank\" rel=\"noopener\">“edge-to-edge” iPhone</a> for the phone’s 20th anniversary next year. If nothing else, Tecno just proved that rumor isn’t so far-fetched.</p><p><em>Photography by Dominic Preston / The Verge</em></p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Dominic Preston</li></ul>"},{"title":"In Dungeon Settlers, you build a colony on top of a teeming RPG labyrinth in a trim take on Rimworld","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/in-dungeon-settlers-you-build-a-colony-on-top-of-a-teeming-rpg-labyrinth-in-a-trim-take-on-rimworld","category":"gaming","categoryLabel":"Gaming","wordCount":872,"readingTime":5,"content":"<p>Out this week in early access</p>\n    \n  \n  \n  \n\n            <p>\r\nThe first time I lost my whole party in Dungeon Settlers, it was to a swarm of rats. I think we can all agree that getting killed by rats in anything remotely fantasy RPG-ish is an enormous faux pas. It's like spelling your own name wrong on your CV. It's like accidentally wearing your underpants on top of your trousers. It's like failing to become Thane of Whiterun.</p>\n<p>In my defence, I <em>was</em> playing the game on Hard difficulty, and the rodents of Dungeon Settlers have a zoologically improbable habit of keeping company with stone golems. Ever tried to crack a stone golem with a wooden sword? I have found it inconvenient. In any case, while my party wipe was embarrassing, it was also excellently macabre in the fine traditions of <a href=\"https://www.rockpapershotgun.com/games/dwarf-fortress\" target=\"_blank\" rel=\"noopener\">Dwarf Fortress</a>.\r\n</p>\n\n<p>\r\n Minutes into our doomed expedition, three of my four adventurers got themselves absolutely golemed while gathering berries. I had the surviving party member, Luciana, scoop up one of her dying pals and gallop away looking for the exit portal.</p>\n<p>In the process, we discovered and aggroed yet more rat swarms, rolling them all together like a sort of Pied Piper katamari. After a few laps of the layout, poor brave Luciana finally got herself cornered by the frenzied nibblers. And yet, death took its sweet time arriving, for Luciana was still carrying the body of her now thoroughly expired friend. The corpse formed a meatshield, absorbing the cheeseboi fury while Luciana cowered beneath its mutilated bulk, unable to move a hair, until eventually, she keeled over from hunger, fatigue and stress.\r\n</p><p>\r\nImagine it: slowly wasting away while you watch a bunch of tutorial-ass chaos potatoes munch on the flesh of your shieldsister. Still, I take comfort in the knowledge that according to her mood modifier bar, Luciana considered \"harsh treatment and poor conditions a natural part of the role\". Happy to meet your expectations, Lucy!\r\n</p>\n\n<p>\r\nDungeon Settlers isn't just about getting devoured by rats in caves. It's about building grubby hovels on a surface world of poison lakes and stunted trees. The colony building and dungeon delving aspects of the game are tragically symbiotic. In order to erect and supply your hovels, to say nothing of absurd froufrous like barrels to store arrows in, you'll need to send teams of colonists into the procgen realms beneath, which are treacherously verdant. Luciana did not die trying to defeat some resurrected arch-demon. She died because I didn't have enough twigs and grass to make standing torches.\r\n</p>\n<p>\r\nDungeon Settlers is, in other words, a balance of Rimworld-style colony sim and party combat game in the approximate vein of <a href=\"https://www.rockpapershotgun.com/games/baldurs-gate\" target=\"_blank\" rel=\"noopener\">Baldur's Gate</a>. You can give characters orders, but they'll also act independently according to a table of adjustable task priorities. It's all real-time, but you can pause to finesse your tactics, and you will do this often, alas, because Dungeon Settlers has a lot of menus, windows and hotbar icons to squint at and get extremely irritated about.</p><p>Going by the demo, at least, I do think the game's menus could use a proper rearrangement over the course of its early access career. I also found the highlighting and action feedback a bit slippery and ambiguous: often, I'd give a character an attack order, only to realise I was controlling another, or accidentally issue a waypoint instead. \r\n</p>\n<p>\r\nPart of it, of course, is that the two genres undergoing alchemical combination here have competing interface design objectives. The hybridisation is rewarding in other respects. You can build in dungeons - barricading caverns, unrolling bedrolls, and boosting the party's spirits with the crackling glow of a cooking fire. I find this genuinely cosy, despite my increasing apathy for the word \"cosy\" in videogame contexts. I'm interested to see how long you could maintain an outpost down there: the monsters respawn, but the plants and treasures don't, and your characters get a negative mood modifier while underground.\r\n</p>\n\n<p>\r\nThe other fly in the ointment is that South Korean developers CanOpener have used generative AI for localisation, though \"some languages were translated or reviewed by human translators\". It reminds me that we should do a proper piece on how generative AI is affecting the translation and localisation business. Translation is a complex art, and a canny localiser can <a href=\"https://www.rockpapershotgun.com/the-jolly-cooperation-of-localising-dark-souls\" target=\"_blank\" rel=\"noopener\">do wonders for even an already-wonderful game</a>, so the chatbottification of these vocations deserves some proper scrutiny (including an acknowledgement that games journos often make use of machine translation when grabbing quotes from interviews).\r\n</p><p>\r\nDungeon Settlers is out in early access from 4th September - find it on <a href=\"https://store.steampowered.com/app/2798330/Dungeon_Settlers/\" target=\"_blank\" rel=\"noopener\">Steam</a>. I guess I should tell you how my <em>second</em> party wipe happened. We were doing really well on that particular expedition, but then some asshole club-wielder called Edwin (genuinely, that's the name the system gave him) broke formation and roused the gobby wrath of some Medium Slimes. I feel like dying to an enemy explicitly labelled Mid is possibly more humiliating than dying to a rat. How am I supposed to get a decent anecdote out of \"we got our arses kicked by some fairly competent eukaryotic organisms\"? Anyway, thanks to cpt_freakout for flagging this game in <a href=\"https://www.rockpapershotgun.com/this-week-in-pc-games-bank-holiday-mawnday-edition\" target=\"_blank\" rel=\"noopener\">the latest Maw round-up</a>.</p>"},{"title":"Five Great Campus Novels","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/five-great-campus-novels","category":"fun","categoryLabel":"Interesting Reads","wordCount":842,"readingTime":5,"content":"<p><strong>“Half the campus</strong> was designed by Bottom the Weaver, half by Ludwig Mies van der Rohe,” Randall Jarrell writes in his 1954 satire, “<a href=\"https://cna.st/affiliate-link/FtXebJ4xqVaiehrzi2cKbVTiMBS1rPTpdtf6XQBXLq6FmsNvvg8s4ShL28L9HTZDJ8994rjuJLT1yja3QUhsoW5sWjUipHsnX84pQBsYbnbHJubPf7tvBcyyop3htc7Y54NZrmdMqU18iyjNPgWksk8WW8tGyTwSVxSGkw4sBZpKxU6yQDfnzNihLHdpvQw5kzkVbZdBXJyLGZ8skYmhbWJLo1FMyyFxonpnSYr1JvbdDeSpoweRJ1j5K7WEmm5Buer4iLJzk6i3H5MxEZnjb84k9CxZquhxoGQqMyABAq4pjX6RKD7WMdTf6g3nW3YEyst3m8dBETGS9ccoP1DwKoPjwmSxsx6jydk\" target=\"_blank\" rel=\"noopener\">Pictures from an Institution</a>.” In the novel, the university is home to two types: the asses and the industrialists. The former are dreamy, romantic; the latter, hard-nosed, pragmatic. Each of the campus novels below makes comedy out of these types, and warns us, as Jarrell did, “This institution’s drunk.”</p><p><strong><a href=\"https://cna.st/affiliate-link/BNj2avZQdZFTirLyMCvwBC76B3gTBrDfF6hgfRiDDpLRwFEPq6mFjC7oSrXieDNkHcRbv2TdCw28iQ3e2ucpacGUFznPmTLVJU8Ag8QhHUEep4tUSmcqjj1bPrytzznzFvLV3eRqJKSsbRE9iBDg123Qnf2GYtWWNZsBPkP76bqwfN8776qZ8PJwyr9i52MgHNg59pskhPtHD39gB1zAzdEjwNTUWSaKAopfhJSMqABuxR2gCfRK1nWuSexvwc4z7cQkcYwqLoascKMiAsRaXMW2BDbXF2oVipkhzgA\" target=\"_blank\" rel=\"noopener\">The Amanda Cross Mysteries</a>, by Carolyn Heilbrun (1964-2002)</strong></p><p>Heilbrun was the first tenured woman in Columbia’s English Department. In her detective series, under the pen name Amanda Cross, an English professor solves murders whose motives include bad psychoanalysis, student riots, and biographers who know too much for their own good. My favorite, “<a href=\"https://cna.st/affiliate-link/MAg6NTLYhSzj8ZAXb9H8pcf1ki7qkUyyhh396cJxGtSGpaQmBDbWJvtvZVaecWw76ZMZ8VXgEBLDu7waQjNE9hMibyTnoJq6moJk6Tzd4eNqy4CRZB9s59vW8UzzmnZo8gT9VBkHtegekgxgpzRqjahUMg4h91eERnqieDBzbmBYHQ2x46jvBAedPfNeykcAmKgipvSVBK7H5kB5KuBLHSJm6dayCQMGBA2KpoboWS5Ba2SLYcMmFaZsQkM5VGoxt5QdMMEHr2mf86FSvBhPuWwXSSHiKqkttSc7we5sPi36hiXR7o2EinQ1mXy6gy4GhgjKQAVC1DMKjhUY967ekyCE\" target=\"_blank\" rel=\"noopener\">Poetic Justice</a>,” was described as a “homicidal valentine” to Heilbrun’s mentor, Lionel Trilling.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/3VSJpsdrTERLwUp9pPEnJKKyfWnjUC2UfSy3BigFCQf2Wnd3pCfKyr4RgtfjgCiF4McTKJ6YmEDy3zrnDAk5gUYgNaaS7MuFkRp6x6MWz3vvAAxoeF1tfSTC6aT3JYy6QQk8LCoAZrWzHNaMRZrDhcYqDB4vC52qe8TqNZffCXoabaNkFTARrrXHk2KjB4ffhFPTwvvRtqoHUW7P5c5hg75nxgQWE4FQQhhpCQz1WzdUHdpCsRbiXp8b9tQcNBPMwQiai4kDCdD9SqMzweTD9eU4aYG4UZdXAQvhDJBB34x1vWgRvgirkd694wB1WQ97gxuyUE979uqmyWqFfLP32YjHGtL1pkbkbK9vAyPo2MNze\" target=\"_blank\" rel=\"noopener\">Possession</a>,” by A. S. Byatt (1990)</strong></p><p>A swoony double romance. The first love affair is between a Victorian poet and poetess who wrote coded letters and poems to each other in the nineteenth century. The second is between two scholars in the nineteen-eighties who set out to answer the only question worth asking: Did the poets <em>do it</em>? A little-known fact: great chunks of the poems are sentences in blank verse from Henry James’s “<a href=\"https://cna.st/affiliate-link/BNj2avZQdZFTirLyMCvwBC76B3gTBrDfF6hgfRiDDpLRwFEPq6mFjC7oSrXieDNkHcRbv2TdCw28iQ3e2ucoUtgSbwJTUepTvaXwWeXWTiu7m9YWmnNahHAZc6RjfukTNsQY6yHcdz1FBvxK7yMjvdjPfKehLSnG1dzDxFnTchG7pFSpggHGbnokcNQWbJtzXLrJQytuCpRHMSXCPmxgjL6UKAQV1nTRv2hjaYdhqHcMw17bPzKsza2wmTmcZCz99v6PMSHA9qTDVPT1sPqqhUGTgJxMq8cQVwTVDRL\" target=\"_blank\" rel=\"noopener\">The Golden Bowl</a>.”</p><p><strong>“<a href=\"https://cna.st/affiliate-link/6exhfamEeE8bstFxRoCH7D4E7zYfpsq59jSe42xDARrNA56GwsBAVANcGT4gmvTDweK4A1RT26GS4xVh2A7xVCSN5ZFYxy2sonbnZnfDXNtcsnFFZKApnzpBEa7Zw82hwiZpRNbezx1FbBzbCKr1p4d26WCNYCLEy1DPwJmd5nUCGKLjaShNs5M3NDtt7VGcb5ewr6D1Hzuc9fbWeu3dCP8G3jJmP3Ack1gK1LegtEnwWWy9CT4s7AK3M8WRm3keVq7JjM6qB2M9rZxqDgqZKQCj6sKu2XS9zM9M6HfTiEdhT14RixVTqJE2sbAnn\" target=\"_blank\" rel=\"noopener\">Moo</a>,” by Jane Smiley (1995)</strong></p><p>A pastoral satire about a Midwestern land-grant university, for readers who find John Williams’s “<a href=\"https://cna.st/affiliate-link/BNj2avZQdZFTirLyMCvwBC76B3gTBrDfF6hgfRiDDpLRwFEPq6mFjC7oSrXieDNkHcRbv2TdCw28iQ3e2ucoUstq9nRyF5BjNkAdrDnHSyQ4kp4U4cbemDnaj6N4xoCnRBQFkRfCfgXiB9UYzUds1BPPD8zfYheSN4onijUE8hWjffajHxhHLJNAVHsVpdsostBUeNZUytg7gESSEDZnbGDEZR3C91cmnEAkDEhMk5YjdmRNp72678u4WPS7APjXKowSwxYGbZsRmg8YoMa15E97osPGH4zrpXrztrv\" target=\"_blank\" rel=\"noopener\">Stoner</a>” too nostalgic and sentimental. The campus novel with the funniest building name (“Old Meats”), and the only one I have read that features the workers of the university: cafeteria servers, horse trainers.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/2QKuUE9XrFFi1XWoAJKvP3Vgze5CFKDqZMNiWJ83HqynjpnCoSkzioUjt5sNmYjKHpJyUBaXuGauT2wBeXJXkCnsML2df61vq9fDEdLBvY5mjowHWc3DLmpoy75LNY3yKEK711cPZojXLXfLyh6zutyhHjMTsri3BBYCFJT3iYMYGXHDbj5qT6eY2Vj65spPUkBU4Uvqz64LBWWrfJHxwGVTCKCjjH1vKrQ5zVzxzW8AAuKV6CeBtzXfZUGaZJfVrHBJqHHjUyLRDvysYouqNi2ragmyLrRg6j9BhCwRBNyXgekVgsrunRifVmk2xJsic3qvtxS5QVG\" target=\"_blank\" rel=\"noopener\">The Last Samurai</a>,” by Helen DeWitt (2000)</strong></p><p>A zany modern epic about a suicidal mother and her genius son, who trade perusing the dust-choked libraries of Oxford for riding the Tube, and the pathetic utilitarianism of the élite university for a useless love of ancient languages, atonal music, and games of chance. Also: a helpful book for teaching young children the Greek alphabet.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/ABAm9JTY78wqgNZdgeksxGGb1VoiKqas6brTAbzpGXMcjtZWZQXLunGzhtNYCoggp2a2osSqMEzNtsVC17aKAU7PQNmx2jwhGF12kVGJ91h8pPFKdsdUPXruaUMYjE1PBgT6VQmuxy8Fn1Xj63XvTiMkXbP6DYKdpRJPoLf8aELx1z6bckNZPYPqfqzD7BTmrLcmD22YBgvwcA4yUWJSGoRdaFVHcW8VsEMVA4y4wWcvSULHABbd44CWzDny9UMWGQweHJvMsAkyzzzddnBEm1B6PBczNMcwa91DQXbuo1oUGz86Ppjwc6NpUrFxTBHk3RYqEvSKk2Uk384i\" target=\"_blank\" rel=\"noopener\">I Am Charlotte Simmons</a>,” by Tom Wolfe (2004)</strong></p><p>Wolfe’s most hated novel, but my guilty pleasure since freshman year of college. At the fictional Dupont University, the beautiful, naïve, and self-superior Appalachian protagonist learns that what counts in the twenty-first century is not what you know, it’s who you know. Its alternative title could have been “Hillbilly Elegy.”</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Everybody’s talking about:</strong></p><ul><li>Marlon James’s “<a href=\"https://cna.st/affiliate-link/45kUUMgYoCRNsciPHSysGgAfcWLB6uAFQgfe3NJAyvBLZt8apeK4YowTW9b35SqiytULRx2aqC29uc52byWyq3mYVDH24nHEvyruyM9zS32kEaHDNiP4dJ31uk3pEdHL1LVpUvSL6jAa4oPmpPLdzNkAwRdAuhLUwJENNoy6tNwdgnKtwhCR2B3TZywLv7eevxvWxCciHAbpL6QJFYvjraX6rXRL13LUpeDbUiyj9KGfVwyXM2M1WJrPADzYLShzcrS9mAqEMERPVMMPns7WZnSkKXmgr8F2yH2YmnLZhWN9YHqvWVyQ2c8JaPm87SoW61RGWfi4F4GvvW5eyfG\" target=\"_blank\" rel=\"noopener\"><em>The Disappearers</em></a>” is “the novel of the decade, if not the century,” a <em>Times</em> headline declared this week. We asked Katy Waldman, who has <a href=\"https://www.newyorker.com/magazine/2026/09/07/the-disappearers-marlon-james-book-review\" target=\"_blank\" rel=\"noopener\"><em>a review of the book in this week’s magazine</em></a>, to weigh in: “I loved this novel, and I love Dwight Garner’s passion! At a certain point, if a book thrills you enough, you kind of owe it to the work to dig into how it achieves its effects. For me, James’s maximalism and his emotional delicacy work in counterpoint, and he’s fearless—he really presses us to wonder for six hundred pages whether embracing your gayness in nineteen-eighties Jamaica is worth the suffering. It is worth it, and the affirmation is beautifully hard-won.”</li></ul><p><strong>Coming soon:</strong></p><ul><li>“<a href=\"https://cna.st/affiliate-link/ABAm9JTY78wqgNZdgeksxGGb1VoiKqas6brTAbzpGXMcjtZWZQXLunGzhtNYCoggp2a2osSqMEzNtsVBYLGRASyVF4MG6HarHurhJ1Bp3a2wTQrSmD3HysS72NBkqnWgxBXnraJcLAU2V5DzkXNoXGVi2HqJDFCBa5LNuhRipYwjnDpYNXzrWW98vmMuyP3bdz4HWPKownDpMBDkCKwmPjiDSgSz5LURkSKZhmyHvWUs2s84hEEYL9yV4AxKkxXwGcHDEWi5yf5mrfMyNe2VeguTeEamCp2SewSJpVubQoF67p7ALg2usx2t5VfFdspgk6GjYy6GqrMagRAa\" target=\"_blank\" rel=\"noopener\">Children of the Wolf</a>,” by Abby Geni, is about a woman who, decades after her childhood of being raised like a Viking in rural Iowa, notices that the men in her Michigan town are mysteriously disappearing. It’s out September 15th.</li><li>Sarah Blakley-Cartwright’s “<a href=\"https://cna.st/affiliate-link/4NeJabgQykde5TvvQLrEjFc42QD1eUHxCXjcgy17siFnVHrNjXAV7DcsXceR5dq5bh8jcK4q6jvUQjGe1hgz29vJoxQPTt7TKiE8sgnVkKm2nLKbmcZyDq3siVHg2zhyxVp2qGvQa4ze1EESP5XhrTk7e3CeHLEe71sQMbivbPYN7FTH7de8JZ4aiqLwVK8UxnG91TnyW4SS17fUcCdDZvrGjbFGUo5fMnECYbUaW8bar5wP1yjAgiNddr2gGeYQP84MthALZcz9n9QoiWQ3MjAXqsuSNGQfpLXCv4rDFmyB74faFj6XR2J69EWqVEk5ve7VKbDvjwkoyLqSn9Qf8dgq9iQiQVaysx\" target=\"_blank\" rel=\"noopener\">Heavy Cream</a>,” centering on a sixteen-year-old girl abandoned by her mother in New York City, will be released on September 29th.</li><li>Also out on the 29th is Robert Kolker’s nonfiction follow-up to “<a href=\"https://cna.st/affiliate-link/5a1FMimJbzYf6LXFdjf6Q2HKJ9s2yydvdQa7ND5XCJYZ8cDBTnSwfxFwGyKVuuYk4yip9wwyvHPUqxwxHHKgG5wZS5yCEF2zRWRWAbMyyZ7b6YCjX1Vd7Eo6zRbiaLnnyZguaPJQTwxoUoJgo3MHK74eC2eXqs2eEEMtxKKLjcr9bEx1ZNzQtwVBzTkZjJzVPdm2FqCsGXWMv3eXWqzM3Q9Q7tWoeVLCCb2uK2CMV8MX2r1fpka1MUBBthxmJg8ZNkLPGt76om2Gg5Xqgt5LrsLoWdJEL1PpdWSf3pQP5Ha5ekrCbEzAJtBhbi6BkMEcUAgdR8YjxYpVuq29swFBH3G\" target=\"_blank\" rel=\"noopener\">Hidden Valley Road</a>”: “<a href=\"https://cna.st/affiliate-link/2Y1hYhhFGuXjnxLy41hYDXANnKvVCAvWVGbiSjkrEy82YpzTsz6bJN8tBQR9X1m7ouXoip4vQ9Abqw3dy5W9Mi7RczsxMBjgmkCAxnAVY9DsyebDe6xAy1jTC72U1kUVwTHi7LyAodHZHEcKR611ay8P1F7szwK3c6dUspsjJpvuF9qRFkEMX3mYzeRsHweMBDKypFrtMXTKhCSukUwNj15UojyTUT9vgb5nZP5YELZyqrAGmq7NcmRSRvBaCFapmj7ypqL94X3mzhUog8F8sKsXcZnpzHnHDAhwKCCNxEWrTMrK7x4RNXqi4RrTibCMmS4h1wd572tFo2gNBM1b9Y uch!”</li></ul><p><strong>P.S. The Mary Oliver</strong> documentary is <a href=\"https://www.pbs.org/wnet/americanmasters/\" target=\"_blank\" rel=\"noopener\">now streaming</a>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
