*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

.container {

.meta {

  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;

  letter-spacing: 0.01em;

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {

  cursor: default;
}

.swap-counter {

  color: var(--text-faint);

}

.article-body p {

}

.article-body h2, .article-body h3, .article-body h4 {

.article-body h3 { font-size: 1.175rem; }

}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;

.article-body a:hover {

}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {

.archive-link {

<script>
var articles = [{"title":"The Ovary Is Surprisingly Active After Menopause. Scientists Are Trying to Figure Out Why","source":"Wired","author":"@wired","url":"https://www.wired.com/story/ovary-activity-after-menopause/","category":"tech","categoryLabel":"Technology","wordCount":1175,"readingTime":6,"content":"<p>When Francesca Duncan decided to take a look at what was going on in postmenopausal ovaries, she assumed she wouldn’t find much of interest. In a <a href=\"https://wired.com/tag/fertility\" target=\"_blank\" rel=\"noopener\">woman’s reproductive years</a>, the ovary is exceptionally dynamic, shifting form and function from day to day throughout her cycle. But after menopause, when egg supply has dwindled and hormone production has waned, the ovaries are often thought of as little more than <a href=\"https://www.instagram.com/reels/DMQg_xSIkH5/\" target=\"_blank\" rel=\"noopener\">empty sacks</a>.</p><p>“I assumed it was just sitting there inert,” says Duncan, a reproductive biologist at Northwestern University, who was only looking at postmenopausal ovaries as part of a project to <a href=\"https://www.wired.com/story/how-to-close-the-gender-health-gap/\" target=\"_blank\" rel=\"noopener\">map a cellular aging process</a> called senescence throughout the body.</p><p>Instead, Duncan found that aged ovaries were anything but stagnant. When <a href=\"https://www.biorxiv.org/content/10.64898/2026.03.26.714635v1.full\" target=\"_blank\" rel=\"noopener\">looking at the protein composition of ovaries</a> of postmenopausal women between the ages of 50 and 75 years old, her team found that the molecular signatures differed significantly across the decades. The oldest ovary looked nothing like a 60- or 70-year-old organ at the molecular level. She was shocked. “Clearly something is still happening,” says Duncan.</p><p>The question is: what?</p><p>A new wave of discovery is forcing researchers to recast the ovary not as an egg factory with an expiration date, but as an organ that <a href=\"https://www.wired.com/story/jennifer-garrison-menopause-aging-longevity/\" target=\"_blank\" rel=\"noopener\">impacts a woman’s overall health</a> and may shape the <a href=\"https://www.wired.com/story/inside-the-perimenopause-industrial-complex/\" target=\"_blank\" rel=\"noopener\">trajectory of aging</a> long after the fertile years have passed. What they are only beginning to understand is whether changes to the ovary after menopause are harmful, protective, or some combination of the two, shifting over time.</p><p>This isn’t the first time the ovary’s role in maintaining health has been underestimated. For decades, surgeons <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12028788/\" target=\"_blank\" rel=\"noopener\">removed</a> healthy organs during hysterectomies, figuring they weren’t doing much besides posing cancer risks. But 20 years ago, <a href=\"https://pubmed.ncbi.nlm.nih.gov/16055568/\" target=\"_blank\" rel=\"noopener\">evidence began accumulating</a> that removing healthy ovaries actually harms a woman’s overall health, finding an increased risk of <a href=\"https://pubmed.ncbi.nlm.nih.gov/17761551/\" target=\"_blank\" rel=\"noopener\">dementia</a>, <a href=\"https://pubmed.ncbi.nlm.nih.gov/19034050/\" target=\"_blank\" rel=\"noopener\">cardiovascular disease</a>, and <a href=\"https://pubmed.ncbi.nlm.nih.gov/23635669/\" target=\"_blank\" rel=\"noopener\">premature death</a>.</p><p>Because the ovary has historically been understood primarily as a reproductive organ, though, research has largely ignored what might be happening once those functions decline. “We don’t even know much about what the premenopausal ovary is doing outside of fertility,” says Jennifer Garrison, an ovarian aging expert and founder of a women’s health biotech company currently in stealth mode. After menopause, the extent of what we know about the ovary basically boils down to “it’s important,” she adds.</p><p>Biologists have known for decades, for instance, that after menopause, ovaries <a href=\"https://pubmed.ncbi.nlm.nih.gov/17519304/\" target=\"_blank\" rel=\"noopener\">continue producing hormones</a>, including testosterone and small amounts of estrogen. But arguments continue over the clinical significance of those hormones. And hormones are only part of a complex signaling system.</p><p>Generally, the hormones the ovary produces postmenopause are known to help maintain libido, bone, and muscle, among other things, although it’s not clear how much the relatively small amounts produced by the postmenopausal ovary contribute to those effects. Multiple studies demonstrate that women who undergo oophorectomies fare worse than those who do not, particularly when having their ovaries removed before going through menopause naturally.</p><p>Recent <a href=\"https://pubmed.ncbi.nlm.nih.gov/39026459/\" target=\"_blank\" rel=\"noopener\">brain-imaging work</a> by Pauline Maki at the University of Illinois at Chicago shows that even low levels of estrogen circulating postmenopause may matter: Women with higher levels had better-functioning memory circuits when performing memory tasks. Where that estrogen comes from—and how much the ovary contributes—isn’t as clear. After menopause, evidence suggests the brain reorganizes, <a href=\"https://pubmed.ncbi.nlm.nih.gov/27178194/\" target=\"_blank\" rel=\"noopener\">possibly to compensate</a> for declining estrogen levels. Maki hypothesizes that ovarian signaling may contribute to that adaptation, and that hormone therapy could alter the relationship between the ovary, the body’s circulating estrogen, and the brain.</p><p>The significance of residual hormone production may decrease over time. Still, says Walter Rocca, a professor of epidemiology and neurology at the Mayo Clinic, that doesn’t mean the ovary has become unimportant.</p><p>“I am convinced until proven otherwise that removing ovaries even after menopause is not advisable,” he says, with a caveat for women at an increased risk of ovarian cancer.</p><p>Just how long that importance persists after menopause is still an open question, says Stephanie Faubion, medical director of the Menopause Society. It’s also unclear, she says, how much the answer may vary from woman to woman. “We just have huge gaps,” she says.</p><p>Duncan’s work suggests one reason the importance of the postmenopausal ovary may change over time. In analyzing human ovaries, the team found that protein patterns in older ovaries suggested that the ovary becomes a more inflammatory environment. To better understand what may be driving those changes, they looked more closely at the ovaries of mice. The research, published in June in the journal <em><a href=\"https://academic.oup.com/molehr/article/32/2/gaag038/8705536?login=true\" target=\"_blank\" rel=\"noopener\">Molecular Human Reproduction</a>,</em> suggests that the ovary may eventually take on a completely new identity after menopause.</p><p>The team compared the ovaries of two-month-old mice, reproductively old 18-month-old mice, and post-reproductive 24-month-old mice, and found that over time, the genes linked to inflammation and immune activity became far more active. The number of immune cells in the ovary also increased. While research on mice does not always translate to humans, it could help to explain the molecular changes Duncan observed in human ovaries.</p><p>“We think that a lot of those changes may make the ovary more prone to age-related diseases like ovarian cancer,” says Birgit Schilling, an aging researcher at the Buck Institute for Research on Aging who collaborated with Duncan on the human ovary work, which has been published as a <a href=\"https://www.biorxiv.org/content/10.64898/2026.03.26.714635v1.full\" target=\"_blank\" rel=\"noopener\">preprint</a>. After menopause, the <a href=\"https://womenshealth.gov/menopause/menopause-and-your-health\" target=\"_blank\" rel=\"noopener\">risk</a> of a host of conditions goes up, including stroke, heart disease, and osteoporosis.</p><p>Other organs undergo immune remodeling with time, but the ovary ages long before most other organs. Duncan’s work raises the question of whether at some point, the benefits of keeping the ovaries may be outstripped by the risk: As the aging ovary becomes more inflammatory, she wonders whether it may begin broadcasting inflammatory signals to other parts of the body.</p><p>David Pépin is probing another possibility: that as follicles that house growing eggs disappear, the ovary may also reorganize to preserve hormone production. Pépin, a reproductive biologist at Massachusetts General Hospital and Harvard Medical School, found that years after cats were given an experimental birth-control gene therapy that prevented their follicles from maturing, the cats were still producing the hormones estrogen, testosterone, and inhibin at completely normal levels.</p><p>Follicles drive much of the hormone production during a reproductive cycle; without them, hormone levels should have fallen. In preliminary work he has <a href=\"https://www.youtube.com/watch?v=B81PulhhxeQ\" target=\"_blank\" rel=\"noopener\">publicly presented</a> but not yet published, Pépin’s team found that when the ovaries were eventually removed, other cells in the ovary—the stroma—appeared to have taken over hormone production. Pilot studies in mice suggest a similar effect. Pépin thinks he may have tapped into a natural mechanism that helps maintain hormone production as follicles wane. It's <a href=\"https://pubmed.ncbi.nlm.nih.gov/6245577/\" target=\"_blank\" rel=\"noopener\">long been hypothesized</a> that the stroma may be responsible for some of the human ovary's postmenopausal hormone production.</p><p>Estrogen, he says, is not the only hormone that plays a role in menopause. “We know so little about how the other ovarian hormones that are disrupted at menopause may contribute to health,” he says. “It is not a dead organ.”</p>"},{"title":"For the third time, Supreme Court declines to allow Missouri to use congressional map expected to aid Republicans","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/09/for-the-third-time-supreme-court-declines-to-allow-missouri-to-use-congressional-map-expected-to/","category":"law","categoryLabel":"Law","wordCount":1353,"readingTime":7,"content":"<p>For the third time in less than a month, the Supreme Court on Friday declined to allow Missouri to use a new congressional map, intended to benefit Republicans, in the November 2026 elections. In a five-page, unsigned <a href=\"https://www.supremecourt.gov/opinions/25pdf/26a388_q86b.pdf\" target=\"_blank\" rel=\"noopener\">order</a>, the justices paused <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A388/425276/20260922233019056_Appendix.pdf\" target=\"_blank\" rel=\"noopener\">a ruling by a federal appeals court</a> in St. Louis that had directed the state to implement the new map.</p><p>In Friday’s opinion, which was released to reporters shortly before 6 p.m. EDT, the court emphasized that the federal district and appeals courts “should not enjoin or otherwise prohibit the use of the” map enacted in 2022, which is currently in use in voting already underway, “in the 2026 congressional election in Missouri.” Moreover, the court added, those courts “should not order or otherwise require Missouri to use the” new map “in the 2026 congressional election in Missouri.”</p><p>There were no public dissents from the Supreme Court’s opinion.</p><p>The dispute began in September 2025, when Missouri adopted a new map that was intended to give Republicans an additional seat in the U.S. House of Representatives. On Dec. 9, opponents of the state’s new map – including the group People Not Politicians and its executive director, Richard von Glahn – <a href=\"https://themissouritimes.com/breaking-supreme-court-clears-map-referendum-for-november-ballot/\" target=\"_blank\" rel=\"noopener\">submitted</a> more than 300,000 signatures in support of a petition to put the new map up for a vote on the ballot in the November 2026 general election. Secretary of State Denny Hoskins, Missouri’s top election official, rejected the petition on Aug. 4, 2026 – the last day to do so – and the state conducted its August primary with the new map.</p><p>Von Glahn then went to state court, asking it to reverse Hoskins’ decision and prohibit Missouri from using the new map in the November elections. In <a href=\"https://electionlawblog.org/wp-content/uploads/Opinion_SC101805.pdf\" target=\"_blank\" rel=\"noopener\">a unanimous decision</a> on Sept. 3, the Missouri Supreme Court did just that. Under the Missouri Constitution, it held, the referendum petition “was legal, sufficient, and timely.” As a result, that court said, the new map never went into effect and will not do so “unless and until approved by the voters at the November 2026 general election.”</p><p>The dispute made its <a href=\"https://www.scotusblog.com/cases/hoskins-v-von-glahn/\" target=\"_blank\" rel=\"noopener\">first trip</a> to the Supreme Court on Sept. 4, when Hoskins <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A304/423214/20260904224734853_1-Hoskins%20v.%20von%20Glahn%20-%20Application%20for%20Stay%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">asked the justices</a> to put the state supreme court’s ruling on hold. Justice Brett Kavanaugh, who has initial responsibility for emergency appeals from the geographic area that includes Missouri, <a href=\"https://www.scotusblog.com/2026/09/justice-kavanaugh-turns-down-request-from-missouri-to-use-congressional-map-expected-to-aid-repu/\" target=\"_blank\" rel=\"noopener\">denied Hoskins’ request</a> four days later without referring it to the full court.</p><p>Also on Sept. 4, Rep. Robert Onder, a Republican who won the Republican nomination for the state’s 3rd congressional district in the August 2026 primary, as well as another congressional candidate and two individual voters, filed a lawsuit in federal court in St. Louis, seeking to revive the 2025 map. Onder and the other candidate – Richard Brattin, who won the Republican nomination for the state’s 5th congressional district in August – contended that if the state were to use the previous map, from 2022, in the November elections, their districts would be significantly different from the districts in which they won the nominations in the August primary elections. The individual voters similarly argued that they would vote in a different district in November under the 2022 map than they had in August.</p><p>Shortly after Kavanaugh turned down Hoskins’ request to pause the Missouri Supreme Court’s ruling, Chief U.S. District Judge Stephen Clark <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.moed.231153/gov.uscourts.moed.231153.35.0.pdf\" target=\"_blank\" rel=\"noopener\">issued</a> an order that directed the state to use the 2025 map. Clark wrote that although “[c]onducting state elections in accordance with the Missouri Constitution undoubtedly qualifies as an important interest,” Onder and the other plaintiffs would “face irreparable harm” without a temporary restraining order “because many Missouri voters would have to cast their general-election votes for candidates whom they had no role in nominating.”</p><p>The dispute arrived at the Supreme Court for the <a href=\"https://www.scotusblog.com/cases/people-not-politicians-v-onder/\" target=\"_blank\" rel=\"noopener\">second time</a> on Sept. 9, when von Glahn and People Not Politicians <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A326/423669/20260909165819594_People%20Not%20Politicians%20v.%20Onder%20Emergency%20Stay%20Application.pdf\" target=\"_blank\" rel=\"noopener\">asked the justices</a> to intervene and pause the district court’s order. The next day, within minutes after Hoskins filed his brief opposing a stay of Clark’s order, the Supreme Court – in <a href=\"https://www.supremecourt.gov/orders/courtorders/091026zr_b07d.pdf\" target=\"_blank\" rel=\"noopener\">a brief, unsigned order</a> – did so, putting Clark’s order on hold “pending the disposition of the appeal in the United States Court of Appeals for the Eighth Circuit and disposition of a petition for a writ of certiorari in this Court, if such a writ is timely sought.”</p><p>The dispute then returned to the lower courts, where the 8th Circuit expedited the appeal by von Glahn and People Not Politicians. That court heard oral arguments on Sept. 17 and issued a <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A388/425276/20260922233019056_Appendix.pdf\" target=\"_blank\" rel=\"noopener\">decision</a> upholding Clark’s order on Sept. 21. The court of appeals also directed Clark to enter a permanent order requiring the state to use the 2025 map, but also to put that order on hold until 5 p.m. CDT on Sept. 28 to give the Supreme Court time to weigh in.</p><p>People Not Politicians and von Glahn <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A388/425276/20260922233012092_2026.09.22%20Von%20Glahn%20v.%20Hoskins_%20Emergency%20Stay%20Application.pdf\" target=\"_blank\" rel=\"noopener\">came back to the Supreme Court</a> – the dispute’s <a href=\"https://www.scotusblog.com/cases/people-not-politicians-v-onder-2/\" target=\"_blank\" rel=\"noopener\">third trip</a> there –on Sept. 22. They asked the justices either to “clarify” that the court’s Sept. 10 order pausing Clark’s order “means what it says” or, alternatively, put the 8th Circuit’s Monday ruling on hold. The court should do so, they argued, because the Supreme Court’s orders “are not invitations for a lower court to repackage the same relief and try again.” It is too late, they continued, to revive the 2025 map, because the state has already sent out ballots to military and overseas voters, and Sept. 22 was the deadline for election officials to “print and make available absentee ballots.”</p><p><a href=\"https://www.supremecourt.gov/DocketPDF/26/26A388/425361/20260923131247014_1-PNP%20v.%20Onder%20-%20Opposition%20to%20Stay%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">Missouri</a> and the <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A388/425347/20260923125714252_26.09.23%20Opposition%20to%20Request%20for%20Stay.pdf\" target=\"_blank\" rel=\"noopener\">individual plaintiffs</a> supporting the 2025 map countered that People Not Politicians and von Glahn do not have a legal right, known as standing, to pursue their appeal. Among other things, Missouri pointed to the Supreme Court’s 2013 decision in <a href=\"https://s3-us-west-2.amazonaws.com/ftm-assets/ftm/archive/files/pdfs/PerryOpinion626.pdf\" target=\"_blank\" rel=\"noopener\"><em>Hollingsworth v. Perry</em></a>, holding that the proponents of a California initiative to ban same-sex marriage lacked standing to defend the law’s constitutionality when the state declined to do so.</p><p>The state also pushed back against any suggestion that it is too late to reinstate the 2025 map, telling the justices that “[t]he honest truth is that the chaos injected by the Missouri Supreme Court,” which barred the state from using the 2025 map, “will remain no matter what this Court does.” “More than anything,” the state continued, “Missouri voters need stability. The Secretary [of State] respectfully believes that denying a stay—and declining to change Missouri’s congressional map for a <em>fifth</em> time—is the best way to promote stability.”</p><p>In its opinion on Friday granting the request from People Not Politicians and von Glahn, the court began by observing that, “as a matter of state law, the 2022 map—not the 2025 map—must be used in the 2026 congressional election.” Moreover, the court added, putting the lower courts’ most recent rulings on hold is “[c]onsistent with” the Supreme Court’s Sept. 10 order pausing Clark’s earlier decision.</p><p>But “[e]ven putting this Court’s prior orders aside,” the court continued, the lower-court rulings should also be paused because “[t]he election is not merely upcoming; it has already started.” “At this late date,” the court wrote, reverting to the 2025 map “would usher in electoral chaos.”</p><p>The court also stressed that the 8th Circuit was wrong in suggesting that using the 2025 map would be most consistent with the <em>Purcell</em> principle – the idea that courts should not change election rules too close to an election – because the Missouri Supreme Court was responsible for upsetting the status quo. Federal courts, the justices said, should not interfere with elections at the last minute, but states can generally make their own decisions. And here, the court emphasized, the Missouri Supreme Court was not responsible for disturbing the status quo, because it had indicated in May 2026 that “if the referendum petition was legally sufficient,” then the 2025 map would only go into effect after it had been approved by the voters.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>For the third time, Supreme Court declines to allow Missouri to use congressional map expected to aid Republicans</em>, SCOTUSblog (Sep. 25, 2026, 6:42 PM), https://www.scotusblog.com/2026/09/for-the-third-time-supreme-court-declines-to-allow-missouri-to-use-congressional-map-expected-to/</p>"},{"title":"The Teen Portraits That Captivated Sofia Coppola","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/photo-booth/the-teen-portraits-that-captivated-sofia-coppola","category":"fun","categoryLabel":"Interesting Reads","wordCount":1085,"readingTime":6,"content":"<p>The photographer Joseph Szabo’s pictures in the new book “<a href=\"https://www.mackbooks.us/products/american-teen-joseph-szabo\" target=\"_blank\" rel=\"noopener\">American Teen</a>” look timeless in certain ways—the crisp black-and-white of the images, the stately framing, the instantly recognizable, casual but charged, proximity of teen-agers hanging out, arms slung over their friends’ shoulders, heads tipped together, close enough to smell one another’s shampoo. Here they are, crammed together in the random corners they stake out on a big high-school campus, or thigh to thigh on a patchwork of beach towels, or whispering in one another’s ears, thick as thieves, magnetized by one another as by nobody and nothing else.</p><p>But there is also a sense in which these images belong, ineluctably, to the time in which most of them were made, the nineteen-seventies and nineteen-eighties, after Szabo had begun teaching photography and photographing students at Malverne High School, on Long Island. It’s not just the styles his subjects favor—abundant, feathered hair, high-waisted, slouchy jeans, ringer T-shirts, platform shoes, puka-shell necklaces. (In any case, some of their looks would read as hip today.) It’s not even the fact that the photos frequently show kids smoking cigarettes (though that’s certainly striking to see). The adolescent subjects of Szabo’s photos project something else: nearly all, even the ones who look shy or awkward or sidelined by their peers, have a kind of spontaneous <em>presence,</em> the loose-limbed, insouciant grace, even swagger, of subjects who have not been making and curating images of themselves and one another for as long as they can remember. As the musician and artist Kim Gordon writes in a short introduction to “American Teen,” Szabo “captures not just what it looks like to be that confusing age, but what it felt like in a pre-filter-polished world before Instagram, AI, and TikTok, all these contemporary mirrors that define you through algorithms with every glance.”</p><p>Szabo was in his early thirties, and had recently earned an M.F.A. in photography at the Pratt Institute, when he moved to Long Island. In 1973 he started teaching darkroom-photography classes at Malverne High. He found that showing kids how to make their own prints, the inextinguishable magic of watching pictures emerge from a chemical developer, was a way to spark interest and connect with students who often seemed more disaffected from school than he remembered ever having been himself. “They’d be, like, I’m <em>staying</em> in <em>this</em> class; I’ve got to be able to do this thing with a camera,” Szabo, who is now eighty-two, told me recently. The students were natural subjects for him, too—always there, curious to see their lives reflected back to them, with the understated grandeur of black-and-white film. Szabo started taking pictures for the school yearbook and carrying a camera around the school with him all the time. “The kids would say, ‘That’s Szabo, don’t worry about him. He’s all right. He’s not going to take you to the principal’s office for smoking outside—or inside—the school.’ ” Eventually, he started turning up at other locations: the deli where some Malverne students gathered, Jones Beach, a Rolling Stones concert in Philadelphia, a bar in town co-owned by the actor and former boxer Tony Danza, even—with parents’ permission—some of the students’ houses as they prepped for nights out.</p><p>“American Teen” is published by Important Flowers, an imprint of the art-book publisher Mack, founded by the director and screenwriter Sofia Coppola, another dedicated observer of adolescent self-presentation. Coppola told me that she first saw a photograph of Szabo’s on the cover of the 1991 album “Green Mind,” by the proto-grunge band Dinosaur Jr. It shows a young girl—maybe twelve years old—standing on the beach, with long dark hair, gimlet eyes, and a partially smoked cigarette in her mouth. She looks both vulnerable and curiously self-possessed. Her name was Priscilla, and Szabo never saw her again. Coppola, who collects photography, told me that she was instantly taken with the image. Years later, when she launched Important Flowers, she thought of Szabo’s work immediately, especially after she noticed that some earlier books of his were now out of print and selling for five hundred dollars or more online.</p><p>Coppola told me that she admires how Szabo’s images can feel intimate without seeming intrusive. His subjects “feel comfortable with him, you can tell,” she said. “The photos don’t seem self-conscious or posed. The kids don’t have their guards up. You don’t feel he’s <em>peering</em> at them.” He made several pictures of couples making out or gazing besottedly into each other’s eyes, surrounded by other teen-agers who show a funny kind of delicacy—they haven’t moved out of the couples’ force field, but they’re not gawping at them, either. In “American Teen,” there’s a picture that shows three girls seated at their desks. The one in the middle is blowing a bubble, with her legs stretched out and propped up on the chair of the girl in front of her. She is looking down at the papers on her desk, and she seems like she’s concentrating—not deeply engaged but not bored, either, at ease in the classroom like it was a satellite of home, and seemingly at ease in her own skin, too.</p><p>I went to high school in the late nineteen-seventies myself, and “American Teen” made me nostalgic for how hanging out felt then, powered by the implicit guarantee that between classes or after school you would find your friends posted in their usual spots, and they would have time for you, so much time. It reminded me, pleasantly, too, of a kind of low-key, free-to-be-you-and-me androgyny that I associate with that era. In Szabo’s pictures, the guys and girls alike wear jeans a lot; many of the boys have shoulder-length hair; the clothes are often loose and layered (big sweaters, denim jackets, overalls, plaid shirts over tank tops), and nobody looks hellbent on perfection. That scruffier, cozier version of androgyny coexisted in the culture with the more flamboyant gender-bending of glam rock. The seventies were fun that way. Flipping through the book, I thought of the Replacements song “Androgynous,” from 1984, with the hopeful lyrics “Now, something meets boy, and something meets girl / They both look the same, they’re overjoyed in this world / Same hair revolution, unisex evolution / Tomorrow, who’s gonna fuss?”</p><p>As it happens, the fussing—about gender identity, about teen-agers and their anxieties—has only got louder in recent decades. Szabo’s photos, by contrast, are remarkably free of fretting or judgment. They are a reminder of how cool teen-agers can be, in their own tribes, on their own time. ♦</p>"},{"title":"New 200GB GTA 5 leak suggests Rockstar scrapped a massive Liberty City DLC alongside the Agent Trevor expansion, and reportedly includes very early GTA 6 work","source":"Eurogamer","author":"Kaan Serin","url":"https://www.eurogamer.net/new-gta-5-leak-rockstar-liberty-city-dlc-early-gta-6","category":"gaming","categoryLabel":"Gaming","wordCount":529,"readingTime":3,"content":"<p>Spilling the Liber-tea.</p>\n    \n  \n  \n  \n  \n            <p><a href=\"https://www.eurogamer.net/companies/rockstar-games\" target=\"_blank\" rel=\"noopener\">Rockstar Games</a>' latest leak seemingly includes a nearly 200GB version of <a href=\"https://www.eurogamer.net/games/grand-theft-auto-v\" target=\"_blank\" rel=\"noopener\">GTA 5</a>'s source code, suggesting the developer started and then scrapped plans for a Liberty City DLC, alongside very early files related to <a href=\"https://www.eurogamer.net/gta-6-everything-we-know-so-far-9357\" target=\"_blank\" rel=\"noopener\">GTA 6</a>.</p>\n<p>The Grand Theft Auto and Red Dead Redemption maker has dealt with quite a lot of leakage these last few years, and new online reports now indicate the tap is still dripping. The leaks apparently total around 192GB of newly accessible files, reportedly revealing tons of stuff cut from GTA 5.</p>\n<p>Fans have eagerly been combing through the data and it looks like they've unearthed everything from cut dialogue, scrapped missions, unused assets, a really rough version of GTA 6's map and ambitious GTA 5 DLC plans that never crossed the finish line, including several files reportedly related to Liberty City. <a href=\"https://www.youtube.com/watch?v=6XuiPl7mTk4\" target=\"_blank\" rel=\"noopener\">YouTuber TJGM</a> even posted an outline of the supposed Liberty City DLC map's shoreline, showing off a much larger playable space than GTA 4's take on New York City.</p>\n<p>\"This isn't a screenshot included in the leak,\" they <a href=\"https://x.com/TJGM_/status/2100806607495954889\" target=\"_blank\" rel=\"noopener\">tweeted </a>after. \"This is data viewed in CodeWalker and then screenshotted after. It also includes many other Rockstar tools, source code and other things that are legit and easily verifiable.\"</p>\n<p>There's also some online speculation suggesting the Liberty City DLC might have been put on ice for Rockstar Games to use later down the line in a potential GTA 6 expansion, though I haven't found any evidence of that so far.</p><p>With the iconic locale back in the limelight, fans have been pointing to a screenshot of Liberty City in GTA 5's engine that was purportedly <a href=\"https://www.gamesradar.com/screenshot-of-liberty-city-in-gta-5s-engine-surface-on-rockstar-artists-portfolio/\" target=\"_blank\" rel=\"noopener\">found on a Rockstar artist's portfolio</a> a decade ago as proof the expansion was somewhat far in development before being canned.</p>\n<p>In the years since its release, we've heard quite a lot about the other GTA 5 DLCs that never came to be. Trevor Philips actor Steven Ogg previously <a href=\"https://www.eurogamer.net/gta-5-actor-says-he-shot-some-stuff-for-a-planned-james-bond-trevor-dlc\" target=\"_blank\" rel=\"noopener\">spilled info about a \"James Bond Trevor\" DLC</a> that would've had the wildcard character working undercover for the government. Rockstar apparently \"shot some stuff\" for the side story, before the studio put <a href=\"https://www.eurogamer.net/it-looks-like-rockstar-has-changed-its-mind-on-gta5-story-dlc\" target=\"_blank\" rel=\"noopener\">all its eggs into the GTA Online basket</a>. Some Agent Trevor materials are also reportedly part of this newest leak, though it's not yet clear to what extent.</p>\n<p>A former senior camera artist and digital cinematographer at the studio, Joseph Rubino, also <a href=\"https://www.eurogamer.net/grand-theft-auto-5-trevor-dlc-scrapped-as-gta-online-was-such-a-cash-cow-developer-says\" target=\"_blank\" rel=\"noopener\">spoke on the Agent Trevor DLC a couple of years ago</a>. \"We split our teams into two, so I stayed on <a href=\"https://www.eurogamer.net/games/gta-online\" target=\"_blank\" rel=\"noopener\">GTA Online</a> and then this DLC, which Steven Ogg was a very important part of, and then some of the team overlapped and went to [<a href=\"https://www.eurogamer.net/red-dead-redemption-2-walkthrough-guide-4975\" target=\"_blank\" rel=\"noopener\">Red Dead Redemption 2</a>] early on,\" he said. \"When GTA Online came out, it was so much of a cash cow and people were loving it so much that it was hard to make an argument that a standalone DLC would out-compete that… Looking back now I would say that you could probably do both, but that was a business decision that they made and I was a little upset about that.\"</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 1 more"}];
