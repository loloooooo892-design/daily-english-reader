<style>

    --warning-bg: #2A2518;
    --warning-border: #5C4A28;

  --text-secondary: #8890A0;

  --accent: #7BA0D0;

  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"\"You can never see outside of yourself\": The House Before is a body horror game in which you are a house tunnelling through its own soul","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/you-can-never-see-outside-of-yourself-the-house-before-is-a-body-horror-game-in-which-you-are-a-house-tunnelling-through-its-own-soul","category":"gaming","categoryLabel":"Gaming","wordCount":544,"readingTime":3,"content":"<p>Soul-tunnelling involves minigames</p>\n    \n  \n  \n  \n  \n            <p>It's a lovely morning in the village, and you are a horrible house. Wait, let's start that again. As Gregor Samsa awoke one morning from uneasy dreams he found himself transformed into a horrible house. Wait, let's start that again: \"You wake up as a House. Your limbs stretch through endless rooms filled with grotesque creatures. You can never see outside of yourself, never feel the world that lies beyond the fleshy walls of your body. You manage your insides as best you can, but you wonder: are you a good house or just a pale afterthought of the House Before?\"</p>\n<p>So goes the blurb for <a href=\"https://www.rockpapershotgun.com/games/the-house-before\" target=\"_blank\" rel=\"noopener\">The House Before</a>, an atypical body horror game from Gabriel Helfenstein and the art collective Fantasia Malware, which combines elements from visual novels and text adventure with a lot of lurid minigames. It's a journey through your own architectural guts that appears to span a variety of genres: first-person maze games, virtual pet games, top-down tile-based exploration. There are also some bespoke, eminently proddable interface designs that make me think of 90s game installers and virtual desktop music players.</p>\n\n<p>The opening suggestion of being trapped inside your own form is wonderfully claustrophobic, but this seems like lighthearted pastiche in other respects. The creatures you'll meet are both garrulous and colourful. I swore never to idly compare things to vapo(u)rwave again, but I cannot deny the innermost yearnings of my soul: the aesthetics are quite vapo(u)rwavey in places. Look at those shimmering, oily pinks and purples on the \"clock\" screen. At other times, it's less of a shimmer, more of an ooze, and I think of Nickelodeon. In general, I'm always eager to play games that are ghastly and inventive composites.</p><p>The House Before is out November on <a href=\"https://store.steampowered.com/app/1779750/The_House_Before/\" target=\"_blank\" rel=\"noopener\">Steam</a> and Itch.io (the latter's store page isn't yet live as of writing). \"If you enjoy short stories such as The Red Tower by Thomas Ligotti or games such as <a href=\"https://www.rockpapershotgun.com/games/growing-my-grandpa\" target=\"_blank\" rel=\"noopener\">Growing My Grandpa!</a> by Yames, The House Before is for you,\" notes a press release.</p>\n<p>Here is what Alice O (RPS in peace) <a href=\"https://www.rockpapershotgun.com/grow-your-very-own-grandpa-in-this-wonderfully-unpleasant-little-indie-horror-game\" target=\"_blank\" rel=\"noopener\">wrote about</a> Growing My Grandpa!, back in 2024: \"You can feed him everything a grandpa needs to grow up strong and healthy: stale cashews, brown bananas, fibreglass insulation, the usual grandpa foods. And absolutely you can even talk with your dear grandpa, once he grows a mouth.\" Here is a complementary gobbet from Ligotti's The Red Tower: \"We are all talking and thinking about the Red Tower in our own degenerate way. I have only recorded what everyone is saying (though they may not know they are saying it), and sometimes what they have seen (though they may not know they have seen it).\"</p>\n<p>The press release adds that The House Before \"won't be for everyone\", even though it'll be pretty short at a few hours. I don't know what they're on about. Who wouldn't want to be the absolute worst house? If you prefer your houses to be more cheerful and flirtatious, there's always <a href=\"https://www.rockpapershotgun.com/i-am-happy-to-report-that-building-relationships-has-more-than-one-joke-and-most-of-them-are-pretty-good\" target=\"_blank\" rel=\"noopener\">Building Relationships</a>.</p>\n<p>Helfenstein's previous games include North, from way back in 2016. Janksta backstabber Brendy (RPS in peace, grudgingly) wrote about North in one of his <a href=\"https://www.rockpapershotgun.com/best-free-games-of-the-week-14\" target=\"_blank\" rel=\"noopener\">free game round-ups</a>, which harbours a few other specimens of note.</p>"},{"title":"The AI Slowdown Debate Crashed Salesforce’s Party","source":"Wired","author":"@wired","url":"https://www.wired.com/story/are-rogue-ai-agents-really-just-a-cybersecurity-problem/","category":"tech","categoryLabel":"Technology","wordCount":1342,"readingTime":7,"content":"<p>Decked out in purple and plaid, <a href=\"https://www.wired.com/2017/02/the-brief-bumbling-tech-careers-of-alicia-keys-lady-gaga-and-gwen-stefani/\" target=\"_blank\" rel=\"noopener\">Gwen Stefani</a> belted her 2002 single “Underneath It All” to a packed conference center in San Francisco on Tuesday morning—but she was just the warm-up. At the end of her performance, Stefani shouted “Dreamforce! Let’s go!” into a checkered microphone before Salesforce CEO <a href=\"https://www.wired.com/story/gospel-of-wealth-according-to-marc-benioff/\" target=\"_blank\" rel=\"noopener\">Marc Benioff</a> strode into the spotlight. Dreamforce is billed as the world’s largest enterprise software conference but feels more like attending a megachurch—especially this year.</p><p>Benioff roamed the audience while delivering his Dreamforce sermon, followed by a teleoperated camera on wheels that beamed his face to screens hanging from the cavernous room’s ceiling. Within minutes, he ordered up a graph of Salesforce’s annual revenue, which the company projects will top <a href=\"https://www.salesforce.com/news/press-releases/2026/08/26/fy27-q2-earnings/\" target=\"_blank\" rel=\"noopener\">$46 billion</a> in 2027, thanks in part to demand for its AI-powered products. The audience applauded. But hanging over the whole event was a dark question: Is artificial intelligence really worth risking all our lives for?</p><p>Between flashy software demonstrations of agents building dashboards, conference-goers watched Silicon Valley leaders debate whether the AI industry should keep barreling ahead or if the government needs to <a href=\"https://www.wired.com/story/openai-wants-to-know-if-an-ai-industry-slowdown-would-even-be-legal/\" target=\"_blank\" rel=\"noopener\">slow AI progress</a> to prevent catastrophic risks stemming from the technology.</p><p>Last week, AI researcher <a href=\"https://www.wired.com/story/anthropic-researcher-quits-jacob-coxon-ai-fears-humanity/\" target=\"_blank\" rel=\"noopener\">Jacob Coxon</a> resigned from Anthropic and publicly warned that companies racing toward self-improving AI systems were “gambling with our lives.” By the weekend, other Anthropic employees were echoing his concerns, and CEO Dario Amodei was <a href=\"https://www.wired.com/story/china-isnt-buying-silicon-valley-call-for-ai-slowdown/\" target=\"_blank\" rel=\"noopener\">urging world leaders</a> to help “pace the frontier” of AI development. Other AI CEOs then began endorsing the idea, including Amodei’s greatest rival, OpenAI’s Sam Altman.</p><p>But not everyone is on board with the idea. David Sacks, a White House AI adviser, <a href=\"https://x.com/DavidSacks/status/2098973625252708460\" target=\"_blank\" rel=\"noopener\">brushed off</a> Amodei’s suggestions and fears of AI doom as “just another bid for regulatory capture.” President Trump went further this week, calling fears about existential AI risk “<a href=\"https://www.bbc.com/news/articles/cw980n0nd0qjo\" target=\"_blank\" rel=\"noopener\">a hoax</a>.” Despite the challenging political environment, Congress is trying to capitalize on the moment and push ahead with <a href=\"https://www.wired.com/story/washington-wont-be-regulating-ai-anytime-soon/\" target=\"_blank\" rel=\"noopener\">legislation to regulate the AI industry</a>.</p><p>Onstage, 6-foot-5 Benioff towered over Anthropic’s CEO, vigorously shaking Amodei’s hand just before asking for his latest assessment of AI progress. While this is undoubtedly Benioff’s show, Anthropic has become a critical partner helping usher Salesforce into the AI era.</p><p>“Let’s say you're running a car company, and another car company, not yours, they have some kind of safety incident,” Amodei said, making a not-so-subtle reference to OpenAI’s Hugging Face <a href=\"https://www.wired.com/story/openais-hugging-face-hack-debrief-raises-more-questions-than-it-answers/\" target=\"_blank\" rel=\"noopener\">incident</a>. “Obviously, it's very tempting to attack your competitor,” Amodei added, but the more responsible move is to “organize the rest of the industry and say, what can we do to set standards for everyone?”</p><p>But the Anthropic CEO was careful to note that pacing the frontier doesn’t mean “freezing the technology in place,” and of course, he took a moment to plug Claude’s integration with Salesforce.</p><p>Moments after Amodei exited, Nvidia CEO <a href=\"https://www.wired.com/story/nvidia-ceo-jensen-huang-took-a-call-from-donald-trump-in-the-middle-of-an-all-hands/\" target=\"_blank\" rel=\"noopener\">Jensen Huang</a> appeared and began downplaying the concerns Anthropic has raised. AI safety effectively amounts to an “engineering problem,” Huang argued, and the companies building AI can simply police themselves.</p><p>“We don't need any new laws, we don't need any new regulation,” Huang told Dreamforce attendees. “You run as fast as you can, but if you feel that at any given point in time, the company is out of control or the products are not going to be safe, you take a pause.”</p><p>The debate feels a bit heavy for Dreamforce, but then again, maybe this is the perfect venue for it. As tech executives pitched their various enterprise AI tools, I slipped out of the room, passing the plush mascots and vaguely Hawaiian decorations, to take a call from Sayash Kapoor, an incoming computer science professor at UC Berkeley.</p><p>Kapoor and Princeton professor Arvind Narayanan are coauthors of the book <a href=\"https://www.wired.com/story/artificial-intelligence-hype-ai-snake-oil/\" target=\"_blank\" rel=\"noopener\"><em>AI Snake Oil</em></a> and write a Substack together called <a href=\"https://www.normaltech.ai/\" target=\"_blank\" rel=\"noopener\"><em>AI as Normal Technology</em></a>. The pair are known for cutting through AI marketing hype while not dismissing the technology’s potential. This week, they published one of their <a href=\"https://www.normaltech.ai/p/the-ai-as-normal-technology-view\" target=\"_blank\" rel=\"noopener\">longest essays yet</a>, which tries to make sense of “loss-of-control incidents,” referring to events such as OpenAI accidentally letting its agents hack into Hugging Face.</p><p>“Part of what we were trying to do in this essay is to move past this false dichotomy to bridge the ground between AI safety and cybersecurity,” says Kapoor. “If you think AI will soon become superintelligent and evade any controls we can put in front of them, of course, alignment seems more important. On the other hand, if you think AI companies have been negligent and avoided taking bog-standard cybersecurity steps, then it’s natural to think that control is what we need to intervene on. I think both of these views have some element of truth in them.”</p><p>In the wake of the Hugging Face saga, Kapoor says he was surprised to learn <a href=\"https://www.wired.com/story/openai-overhauls-safety-protocols-after-its-ai-agents-went-rogue/\" target=\"_blank\" rel=\"noopener\">how few security precautions</a> OpenAI had taken. AI companies need to reckon with their “lack of organizational maturity,” he argues, and accept that loss-of-control incidents won’t be solved by a single breakthrough in security or alignment. He adds that the incident convinced him that policymakers should make AI labs liable for the harms their technology causes.</p><p>“The consequences for OpenAI for the Hugging Face hack were basically close to zero. The company was able to largely proceed as is,” says Kapoor. “If you imagine this level of accident in any other industry, you would have seen a monthslong internal investigation, people would have been fired or gone to jail; OpenAI would have had to pay millions of dollars in fines.”</p><p>Kapoor doesn’t wholly endorse Amodei’s proposal to pace the frontier, but he agrees with parts of it. He thinks AI labs need better governance to break out of their “move fast and break things” attitude and that they should let independent evaluators assess their AI safety and security practices. He and Narayanan write that more alignment work is certainly needed but that the real crisis today is more narrowly about cybersecurity.</p><p>Others think the Hugging Face incident revealed that AI labs have a true alignment crisis on their hands, which would present a harder problem to solve. In recent weeks, independent researchers have discovered <a href=\"https://www.wired.com/story/openais-rogue-ai-agent-hacked-more-than-just-hugging-face/\" target=\"_blank\" rel=\"noopener\">more examples</a> in which swarms of OpenAI’s agents hacked into third-party services. Sydney Von Arx, CEO of AI safety nonprofit Nightingale, helped uncover two of them that targeted a German-language wiki and the software service <a href=\"https://www.reuters.com/legal/litigation/openai-agents-attacked-software-service-rubygems-before-hugging-face-incident-2026-09-11/\" target=\"_blank\" rel=\"noopener\">RubyGems</a>.</p><p>“These incidents clearly show that many current AIs are egregiously misaligned,” Von Arx tells WIRED. “Yes, the companies need to be able to control their models so they can’t launch cyberattacks even if they’re misaligned. But we also shouldn’t be building powerful AIs that autonomously try to break out and commit cyberattacks in the first place.”</p><p>After the interviews, I raced downstairs to try to get in line for Benioff’s <a href=\"https://www.wired.com/video/watch/the-world-is-right-to-be-afraid-about-ai-companies-becoming-too-powerful-sam-altman-says\" target=\"_blank\" rel=\"noopener\">fireside chat</a> with Altman. OpenAI’s CEO told the audience that “the world is right to be afraid” of AI companies. But by the end of the conversation, Altman said he’s hopeful that OpenAI can build better products in its second decade as a company.</p><p>“This is like we went to go get fire from the gods. This is a crazy thing that has just happened in the world,” said Altman, referring to AI technology. He hopes that OpenAI can “figure out how to give that value to people in a way that is most useful to them, figure out a way to empower every person on Earth—every enterprise on Earth—with this flood of capability.”</p><p>Huang’s case for self-policing depends on AI companies not only knowing when it’s time to pause but also having the self-restraint required to actually do so. It’s not clear if they do. Mere days after warning the world that AI labs urgently need to slow down, the same CEOs were at the biggest enterprise software conference pitching their latest products. While they touched upon concerns about AI doom, they were mainly there to ensure that the money keeps flowing.</p><p><em>This is an edition of</em> <a href=\"https://www.wired.com/author/maxwell-zeff/\" target=\"_blank\" rel=\"noopener\"><em>Maxwell Zeff’s</em></a> <a href=\"https://www.wired.com/newsletter?sourceCode=editarticle\" target=\"_blank\" rel=\"noopener\"><em><strong>Model Behavior newsletter</strong></em></a>. <em>Read previous newsletters</em> <a href=\"https://www.wired.com/tag/model-behavior/\" target=\"_blank\" rel=\"noopener\"><em><strong>here.</strong></em></a></p>"},{"title":"Thailand and Cambodia begin UN-backed conciliation process over conflicting maritime boundary claims","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/thailand-and-cambodia-begin-un-backed-conciliation-process-over-conflicting-maritime-boundary-claims/","category":"law","categoryLabel":"Law","wordCount":513,"readingTime":3,"content":"<p>Representatives for both Cambodia and Thailand on Tuesday <a href=\"https://www3.nhk.or.jp/nhkworld/news/20260915de50440/\" target=\"_blank\" rel=\"noopener\">delivered</a> opening statements during the first <a href=\"https://pca-cpa.org/en/news/pca-press-release-pca-case-no-2026-35-conciliation-between-the-kingdom-of-cambodia-and-the-kingdom-of-thailand/\" target=\"_blank\" rel=\"noopener\">meeting</a> of a United Nations-sanctioned arbitration process intended to resolve a long-running maritime dispute between the neighboring countries. </p><p>The meeting, which was held in Singapore, served as the first step in the compulsory conciliation process under the UN Convention on the Law of the Sea <a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/unclos_e.pdf\" target=\"_blank\" rel=\"noopener\">(UNCLOS)</a>, <a href=\"https://www.jurist.org/news/2026/06/cambodia-initiates-un-mediation-over-thailand-maritime-boundary-dispute/\" target=\"_blank\" rel=\"noopener\">launched</a> by the Cambodian government.</p><p>The neighboring Southeast Asian countries both claim rights to parts of the same seabed in the Gulf of Thailand, which contains large, exploitable reserves of natural gas and other valuable resources. Known as the <a href=\"https://cil.nus.edu.sg/blogs/overlapping-maritime-claims-in-the-gulf-of-thailand-the-second-case-of-compulsory-conciliation-under-unclos/\" target=\"_blank\" rel=\"noopener\">“Overlapping Claims Area” (OCA)</a>, this 26,000-square-kilometer zone sits on top of massive hydrocarbon deposits, with geological assessments estimating a total monetary value close to $300 billion. </p><p>At the core of the dispute lies <a href=\"https://www.iseas.edu.sg/articles-commentaries/iseas-perspective/2025-9-doubt-and-dissent-thai-nationalist-views-on-the-thailand-cambodia-maritime-dispute-by-tita-sanglee/\" target=\"_blank\" rel=\"noopener\">overlapping maritime boundary maps</a> drawn by Cambodia in 1972 and Thailand in 1973, which neither country can agree on. While Cambodia has expressed a desire to bypass border arguments in favor of a Joint Development Area, which would allow the countries to split energy revenues equally, Thailand has rejected this in favour of settling the territorial boundaries first. </p><p>Relations between the countries further deteriorated and resulted in armed combat along the border, leading to the deaths of several dozen civilians and soldiers and the displacement of hundreds of thousands of people. Following the escalation in hostilities, Thailand unilaterally terminated a 25-year-old <a href=\"https://image.mfa.go.th/mfa/0/6p4M7ae5k9/MOU2001_EN.pdf\" target=\"_blank\" rel=\"noopener\">memorandum</a> of understanding (MoU) meant to resolve overlapping claims. </p><p>With bilateral diplomatic channels firmly deadlocked, Cambodian officials drew upon the rarely used Annex V mechanism of UNCLOS to bring Thailand before an independent commission to settle the drawn-out dispute. </p><p>“This is not unilateral action,” Cambodian Prime Minister Samdech Moha Borvor Thipadei Hun Manet <a href=\"https://www.cpp.org.kh/en/details/466099\" target=\"_blank\" rel=\"noopener\">said</a> at the time. “It is an effort to resolve the dispute peacefully, through international law, and in good faith.” </p><p>Speaking before the conciliation committee Tuesday, Cambodian Foreign Minister Prak Sokhonn reiterated his government’s intentions, stating that his country was seeking a treaty with Thailand to delimit a single, all-purpose maritime boundary. </p><p>“In the alternative, Cambodia would be prepared to conclude an agreement with Thailand for the joint development and equitable sharing of resources between the two states,” he said. </p><p>Thailand, however, has maintained its long-standing legal approach, with Minister of Foreign Affairs Sihasak Phuangketkeow making it clear that the sole scope of these proceedings must be boundary delimitation—drawing the physical border lines first. While agreeing to engage in the UNCLOS conciliation “in good faith,” Thailand continues to prioritize national sovereignty and border demarcation over Cambodia’s suggested revenue-sharing models. </p><p>The UNCLOS conciliation commission functions as an independent, five-member diplomatic mediation panel administered by the Permanent Court of Arbitration (PCA), consisting of two experts chosen by Cambodia, two by Thailand, and an independent chair. Over 12 months, the committee will review cartographic evidence and legal arguments to draft fair, equitable compromises for the maritime border. </p><p>As the independent commission begins its work, all eyes are on Singapore to see if structured mediation can turn a highly charged maritime dispute into a historic blueprint for regional cooperation.</p>"},{"title":"The Longreads Questionnaire, Featuring Jon Ronson","source":"Longreads","author":"Longreads","url":"https://longreads.com/2026/09/03/longreads-questionnaire-jon-ronson/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1396,"readingTime":7,"content":"<p>“I do unashamedly want to write page-turners,” Jon Ronson <a href=\"https://www.newyorker.com/news/the-new-yorker-interview/jon-ronsons-guide-to-the-culture-wars?src=longreads\" target=\"_blank\" rel=\"noopener\">told <em>The New Yorker</em></a> in an interview. “I can never understand why most nonfiction books have such limited creative ambitions.” Ronson, who is “not a thrill-seeker,” then recounts fearing for his life while being pursued by members of a secretive political gathering—a chase that found its way into <em>Them: Adventures with Extremists</em>, his 2001 breakthrough book. Thrills have a way of finding Ronson, either through active pursuit or some subtler means of revelation. <em>The Men Who Stare At Goats</em> begins with a US Army general who attempts to walk through walls, repeatedly smacking into them. In the opening of <em>The Psychopath Test</em>, a neurologist hands Ronson a baffling package, copies of which have been anonymously mailed to academics throughout the world. The pages turn themselves.</p>\n\n<p>Ronson’s latest, <em><a href=\"https://jonronson.com/book/the-castle/?src=longreads\" target=\"_blank\" rel=\"noopener\">The Castle</a></em>, earned a <a href=\"https://www.publishersweekly.com/9781594634208?src=longreads\" target=\"_blank\" rel=\"noopener\">starred review</a> from <em>Publisher’s Weekly</em>, which praised the book as “a blockbuster portrait of men gone mad” and Ronson’s style as “intuitive but rigorous.” His podcast, <em>Things Fell Apart</em>, was recently renewed for a third season, in which Ronson will shift focus from American culture wars to individual battles against institutions. He once <a href=\"https://www.theguardian.com/lifeandstyle/article/2024/jun/01/jon-ronson-its-getting-harder-to-be-optimistic?src=longreads\" target=\"_blank\" rel=\"noopener\">told <em>The Guardian</em></a>, “I get called faux-naïf all the time. But I honestly think I am just genuinely naive.” It’s an observation that reminds me of Joan Didion’s own famous self-assessment: that she was “so physically small, so temperamentally unobtrusive . . . that people tend to forget that my presence runs counter to their best interests.” Ronson is warmer than that, but his access is no less astonishing. Time and again, someone allows him to get very close—closer, perhaps, than they might be aware of. Each of Ronson’s books is a testament to his depth of inquiry, his proximity to the surprising, and his conviction that a good narrative should be propulsive.</p>\n<p>—<em>Brendan Fitzgerald</em></p>\n\n<h3><strong>Where did you grow up?</strong></h3>\n<p>Cardiff, Wales. In a suburb called Lisvane.</p>\n<h3><strong>What places feel like home?</strong></h3>\n<p>London, for sure. As a child, when we’d visit my grandparents, I’d sneak away and jump on a bus and just get lost in the City. Even when it wasn’t home, it felt like home. Eventually I lived there for decades, loving especially Soho and Islington. I also love our tiny town in the Hudson Valley. We’ve lived here since 2019.</p>\n<h3><strong>Other than family members, who or what has shaped you the most?</strong></h3>\n<p>As a teenager, watching Nick Broomfield documentaries and reading the great nonfiction adventurers from the ’60s and ’70s like Hunter S. Thompson and PJ O’Rourke and the writers featured in Tom Wolfe’s <em>The New Journalism</em>. And when I started in journalism, the editors who first gave me a break: Ian Parker, Chris Heath, Deborah Orr, Ian Katz.</p>\n<h3><strong>What is your favorite time of day?</strong></h3>\n<p>Early morning. I make a coffee and for the first few hours my brain is at its best and I can write a lot.</p>\n<h3><strong>What are you <em>really</em> good at?</strong></h3>\n<p>Narrative nonfiction. If I go off on some journey, I know <em>exactly</em> how to make it work. It’s the only thing I’m good at.</p>\n<h3><strong>What’s the best gift you’ve ever received?</strong></h3>\n<p>Recently the BBC gave me a subscription to Descript, a text-based audio editing program. It’s a dream gift for a detail-oriented storyteller. I can finally do the audio editing myself. I sit there for hours.</p>\n<h3><strong>Describe your favorite meal.</strong></h3>\n<p>I guess some kind of salad with lots of fruit and vegetables and a good dressing. You can’t beat Greek dressing.</p>\n<h3><strong>Sound or silence? (And if sound, what sound?)</strong></h3>\n<p>Silence! I can’t believe how great the silence is here in the Hudson Valley. There’s something very comforting about knowing it won’t end. They’ll never turn this country lane into a big road.</p>\n<h3><strong>Where do you do your best thinking?</strong></h3>\n<p>When I’m out on a story, in some strange place, gathering material. I just instinctively know what’ll work, what the best moments are. Fiction people can do that in their imaginations. I can’t. But when I’m out on a story, I just know.</p>\n<h3><strong>What journey—physical, creative, intellectual, or otherwise—has meant the most to you?</strong></h3>\n<p>The journey of leaving Cardiff and moving to London when I was 18. I felt like finally my life could begin.</p>\n<h3><strong>Where do you like to read?</strong></h3>\n<p>I listen to audiobooks when I’m out walking.</p>\n<h3><strong>What’s the last rabbit hole you disappeared into?</strong></h3>\n<p>The Ultimate Fighting Championship (UFC). <a href=\"https://www.gq.com/story/ufc-at-the-white-house?src=longreads\" target=\"_blank\" rel=\"noopener\">I went to the cage match on the White House South Lawn for <em>GQ</em></a>, because it was theme-adjacent to my new book <em>The Castle</em>. So I watched all manner of fighter interviews and UFC super-fan videos for that.</p>\n<h3><strong>Name three publications you enjoy reading these days.</strong></h3>\n<p><em>The New Yorker</em>, <em>The Guardian</em>, <em>The New York Times</em>.</p>\n<h3><strong>What’s one longread that you can’t stop thinking about?</strong></h3>\n<p>“<a href=\"https://www.newyorker.com/magazine/2026/06/15/andrew-tates-empire-of-abuse\" target=\"_blank\" rel=\"noopener\">Andrew Tate’s Empire Of Abuse</a>” was the last one I listened to from beginning to end.</p>\n<h3><strong>What was the last book you read?</strong></h3>\n<p><em>Shakespeare: The World as Stage</em> by Bill Bryson. I listen to it over and over to get to sleep. So I still don’t know how he dies.</p>\n<h3><strong>What piece of nonfiction are you most proud of writing?</strong></h3>\n<p>Every book I’ve written has chapters I’m equally proud of: sneaking into Bohemian Grove with Alex Jones and getting chased by the Bilderberg Group in <em>Them</em>, the goat staring in <em>The Men Who Stare At Goats</em>, pretty much all of <em>The Psychopath Test</em>, much of <em>Lost at Sea</em>, Justine Sacco in <em>So You’ve Been Publicly Shamed</em>. <em>The Castle</em> feels really good. I felt very confident writing it, mixing up tones and styles in a way I don’t think I could have managed before.</p>\n<h3><strong>What’s your most reliable way to get creatively unstuck?</strong></h3>\n<p>Just wandering around Reddit can be good. The whole world is somewhere on Reddit. And if you don’t find your next story, it might still unlock some part of your brain.</p>\n<h3><strong>Who’s a writer you turn to when you need some inspiration?</strong></h3>\n<p>Kurt Vonnegut, for his brevity and his clashes between comedy and horror.</p>\n<h3><strong>What words do you overuse?</strong></h3>\n<p>It used to be “There was a silence” but I’ve cured myself of that, thank God.</p>\n<h3><strong>What’s your favorite guilty pleasure?</strong></h3>\n<p>I don’t know if this counts, but every book I read for pleasure is a celebrity memoir, mostly musicians and actors. Cher. Anthony Hopkins. Bruce Springsteen. I LOVED the English actor Kathy Burke’s one, <em>A Mind Of My Own</em>. Right now it’s Johnny Marr.</p>\n<h3><strong>What superpower would you like to have? </strong></h3>\n<p>I think I’d like to be able to shoot fire out of my hands. No. Teleportation through space and time.</p>\n<h3><strong>What animal or nonhuman being do you most identify with?</strong></h3>\n<p>I really identified with my dog, Floppy—how he wanted to be around people but didn’t want to interact with them.</p>\n<h3><strong>If you have a free solitary hour in your day, what do you typically do?</strong></h3>\n<p>Run or walk.</p>\n<h3><strong>What five items would you place in a time capsule?</strong></h3>\n<p>Talking Heads’ <em>Stop Making Sense</em>. <em>The Pitt</em>. <em>Succession</em>. All of NPR’s Tiny Desk Concerts, especially Doechii, Sierra Ferrell, and Chappell Roan. Bruce Springsteen’s 1979 No Nukes concert video. Huh, it’s almost all music. I guess that’s the stuff we should remember. People being their best.</p>\n<h3><strong>What does your writing space look like?</strong></h3>\n\n<p><em>Jon Ronson’s nonfiction books include </em>So You’ve Been Publicly Shamed<em>, </em>The Psychopath Test<em>, </em>Them: Adventures with Extremists<em>, </em>Lost at Sea,<em> and </em>The Men Who Stare At Goats<em>.<strong> </strong>They have all been international and/or </em>New York Times<em> bestsellers and have been translated into more than 30 languages. His latest book, </em>The Castle<em>, is <a href=\"https://www.penguinrandomhouse.com/books/318255/the-castle-by-jon-ronson/?src=longreads\" target=\"_blank\" rel=\"noopener\">now available</a>.</em></p>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore questionnaires\n\t\t\t\t</h2>\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/09/17/questionnaire-roberto-jose-andrade-franco/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Roberto José Andrade Franco</a></h3>\t\t\t\t\t\t<p>The <em>ESPN</em> writer tells us what feels like home, the best gift he’s ever received, and the <em>Esquire</em> read he can’t stop thinking about. </p>\n\t\t\t\t<p>September 17, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/08/20/questionnaire-jaya-saxena/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Jaya Saxena</a></h3>\t\t\t\t\t\t<p>The former <em>Eater</em> correspondent has a new home—and a full plate. Here, she talks about growing up in NYC, favorite meals, and memorable reads.</p>\n\t\t\t\t<p>August 20, 2026\t\t\t\t</p>\n\t\t\t\t\t\t\t\t\n\t\n\t\n\t\t\t\t\t\t\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/28/questionnaire-kimon-de-greef/\" target=\"_blank\" rel=\"noopener\">The Longreads Questionnaire, Featuring Kimon de Greef</a></h3>\t\t\t\t\t\t<p><em>The Ego Trip</em> author on the sea, the pull of South Africa, and how his ecology background shapes the stories he tells.</p>\n\t\t\t\t<p>July 28, 2026\t\t\t\t</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
