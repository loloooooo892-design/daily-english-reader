*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

.container {
  max-width: 38em;

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);

  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {

  text-wrap: balance;

}

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {

.archive-link {

@media (max-width: 480px) {

<script>
var articles = [{"title":"J. Martin Holman on Childhood in Translation","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/this-week-in-fiction/yasushi-inoue-11-16-26","category":"fun","categoryLabel":"Interesting Reads","wordCount":792,"readingTime":4,"content":"<p><strong>The story “<a href=\"https://www.newyorker.com/magazine/2026/11/16/the-death-of-a-certain-woman-fiction-yasushi-inoue\" target=\"_blank\" rel=\"noopener\">The Death of a Certain Woman</a>” is drawn from a <a href=\"https://cna.st/affiliate-link/2MivCay8tNdgaPjMLdRufoqm5fWbSu2B7ioqKm3GggUZUZt8Nyc2Q5dDukJs9xQsrmt1wWQy4LuxxfeQFWFj9aVJk78EonEhd1WhNmw2JfRrG2xEggvGKEbrjboMbvsJUax6gB5GxU5N7RyowLPkgnHq9wCqeSdyCY3Dqk9iXHpsRSvdkrzWbnsvSmpsCUpnupdj8rR9ET7sHRSndQcmrZYZmdfRAuFRyWQhbiMoJ52hpC7V2Y7ShwQ28y73AoktHxFVqkYDh1ouGhSVSMQUvAFzWnf9rConwtZrQiyDMQvk1PC6RnDm7iNZ4JCHLtXeWvXRXM2WTqqaMjqQNDr6pwXU6XuJcVK7RbJ8xSQa9eW2MN84F3gFfLgnFMVXxmwV4v1\" target=\"_blank\" rel=\"noopener\">collection</a> of the same name—the entirety of which you translated—by Yasushi Inoue. What was the genesis of this project, and how did you become involved?</strong></p><p>The stories in “The Death of a Certain Woman” originally appeared across several different Japanese collections, in the nineteen-fifties and sixties, and I assembled them into a single volume. I first met Inoue in 1988, to discuss the possibility of translating his historical novel “The Memoirs of the Priest Honkaku,” which featured the sixteenth-century tea master Sen no Rikyū, who is said to have also been involved in political intrigue. The novel is actually written from the perspective of a man who had served Rikyū some twenty years before his death. Inoue even celebrated the project with a tea ceremony at his home in Setagaya, in Tokyo.</p><p>At the time, I had also been reading Inoue’s short fiction about childhood and youth—some of it autobiographical, inspired by incidents from his own life. I became engrossed, and I ultimately set the novel aside. In subsequent meetings with Inoue, I talked to him about these stories, which, with his permission, I had begun to translate.</p><p>I started by translating the story “The Naked Treetops,” which I originally published in 1991, the month that Inoue died. I translated these stories, and others, over the ensuing years, as well as a novel by Inoue called “Asunaro Monogatari” (“The Story of the Tomorrow Tree”). Inoue called the book “autobiographical,” to the extent that it is the life he might otherwise have led if some things had turned out differently.</p><p><strong>Inoue published prolifically in Japan—fifty novels and a hundred and fifty short stories—and to great acclaim. In 1976, he was awarded the country’s highest artistic honor, the Order of Culture, and it is said that he was nominated for a Nobel Prize. Yet only a fraction of his œuvre has been translated into English. Why do you think that is?</strong></p><p>Inoue wrote a lot of historical novels, and I think they can be difficult for a Western audience to appreciate, because they often have limited background knowledge. There is also the issue of the scarcity of capable translators, not to mention the fact that the market for Japanese literature during Inoue’s prime was small. In contrast, Inoue’s writing has been quite successfully translated into other Asian languages.</p><p>Even so, his novels that are set in the past don’t usually require much historical context, actually, because the focus of his work is often on the lives and experiences of people who live on the periphery of great historical figures—towering individuals like Confucius or an emperor of Japan, who readers might be initially misled into thinking are the center of the story.</p><p>I am drawn to the characters in Inoue’s work who might have been overlooked or forgotten had he not rescued them from the void. Inoue’s literature almost invariably focusses on the smallest, tenderest, and perhaps most beautifully confusing of human actions, ones that are often ignored or neglected. Inoue demonstrates his care for the beings he depicts, whether in his historical works, his (semi-)autobiographical stories, or his other fiction.</p><p><strong>“The Death of a Certain Woman,” like all the other stories in the collection, examines the experiences of a child and takes place in the early twentieth century. What do you think drew Inoue to this vantage point and period?</strong></p><p>For Inoue, who was born in 1907, the nineteen-tens and twenties represent his formative years. During those years, he was largely raised by a woman he considered his grandmother, though she was actually his late grandfather’s former mistress. (The Japanese legal system required his family to support her, which they did, however grudgingly.) Inoue’s stories follow an adolescent protagonist as women and men enter his world and manifest profound transformations in the young character’s thoughts and understanding, expanding his comprehension. Some of these changes involve language. Over the decades, since I first began my journey translating Inoue’s literature, my own sense of language has changed, as my understanding of human existence has changed. It’s difficult for me to imagine an end to that transformation in this life.</p><p><strong>The story is framed as a middle-aged man’s account of a mysterious incident from his youth, one concerning a woman who moved to his rural village when he was just a boy. At the end, the narrator feels as though he finally understands what happened to her. Do you think Inoue intended this revelation to be conclusive?</strong></p><p>Inoue never discussed interpretations of his own literature. He told me that interpretation is the job of the reader—or the translator. He said that if he had more to say, he would write another story. ♦</p>"},{"title":"How to get the Golden Scale in Zelda Ocarina of Time","source":"Polygon","author":"@alucarti","url":"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-golden-scale-how-to-get-fishing-pond/","category":"gaming","categoryLabel":"Gaming","wordCount":525,"readingTime":3,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/paulo-kawanishi/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Nov 9, 2026, 4:05 PM EST\n                                </p>\n                    \n                                                            \n                                                                        <p>How to dive deeper</p>\n    \n        \n    \n<p>The<strong> Golden Scale</strong> is a unique item in <a href=\"https://www.polygon.com/the-legend-of-zelda-ocarina-of-time-remake/\" target=\"_blank\" rel=\"noopener\"><em>The Legend of Zelda: Ocarina of Time</em></a> remake that allows Link to dive deeper. You can consider it an upgrade to the Silver Scale, an item that you obtain as young Link as you try to <a href=\"https://www.polygon.com/zelda-ocarina-of-time-oot-princess-ruto-location/\" target=\"_blank\" rel=\"noopener\">find Princess Ruto</a>. However, unlike the Silver Scale, you can only get the Golden Scale after becoming <strong>adult Link</strong>.</p>    \n<p>If you would like to explore the depths of Hyrule and hunt for all the treasures hidden underwater, you should learn <strong>how to get the Golden Scale in the </strong><strong><em>Ocarina of Time </em>remake</strong>.</p>    <h2>\n                        How to get the Golden Scale in Zelda Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p>You obtain the Golden Scale by <strong>catching a fish longer than 60 cm in the Fishing Pond</strong>. To complete the challenge, you must travel south of Hyrule Field to<strong> Lake Hylia </strong>as <strong>adult Link</strong>. You will see that the lake is dry, and you won't be able to reach the Fishing Pond, located on the right side of the map, on your own. You will need to either ride a <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-soft-soil-fresh-magic-bean-location/\" target=\"_blank\" rel=\"noopener\">magic bean</a> plant (that you need to plant as child Link next to the laboratory) or play the Scarecrow Song near the bridge at the front of the building, and then use the <a href=\"https://www.polygon.com/zelda-ocarina-of-time-oot-remake-hookshot-how-to-get/\" target=\"_blank\" rel=\"noopener\">Hookshot</a> on to it. Lake Hylia will also be refilled once you clear the <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-water-temple-dungeon-walkthrough/\" target=\"_blank\" rel=\"noopener\">Water Temple</a>, so you can come back after that, too.</p>    \n    \n                                                                                            \n        \n<p>Once inside, talk to the Fishing-Pond Man and learn that you can earn a prize if \"you catch a big enough fish.\" Rent a fishing rod for <strong>30 rupees</strong>, allowing you to fish as many times as you want until you tell the Fishing-Pond Man that you're done. When preparing to cast your bait, we suggest that you aim at the<strong> middle of the pond</strong> where you can usually find big fish.</p>    \n    \n                                                                                            \n        \n<p>Big fish are more difficult to reel in because they resist for longer periods. Just be patient and keep moving the rod in the direction the fish is pulling. If you catch a fish that is smaller than 60 cm, you just need to <strong>toss it back</strong> and keep trying until you find the right fish.</p>    <p>However, if you get a fish that meets the requirements, <strong>keep it, and then go talk to the Fishing-Pond Man</strong>. Select the \"I'm done\" option and he will examine your fish, and you will receive the Golden Scale.</p>    <p><a href=\"https://www.polygon.com/zelda-ocarina-of-time-oot-guides-walkthroughs/\" target=\"_blank\" rel=\"noopener\"><em>The Legend of Zelda: Ocarina of Time</em></a><em> </em>remake is a little bit different than the original game, so if you need guides to help you through, we don’t blame you. We have walkthroughs for all the dungeons, from the<em> </em><a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-great-deku-tree-walkthrough-fairy-slingshot/\" target=\"_blank\" rel=\"noopener\">Deku Tree</a> to <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-ganondorfs-castle-walkthrough/\" target=\"_blank\" rel=\"noopener\">Ganondorf's Castle</a>. We also have guides for the sillier, in-between parts of the game, like when you have to find <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-richard-dog-location-how-to-find/\" target=\"_blank\" rel=\"noopener\">Richard (the dog)</a> or <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-kakariko-cucco-chicken-locations/\" target=\"_blank\" rel=\"noopener\">Cuccos</a>.</p>    \n<p>For those going for 100% completion, we also have guides on where to find <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-piece-heart-container-location/\" target=\"_blank\" rel=\"noopener\">every Piece of Heart</a>, <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-gold-skulltula-token-locations-where-to-find/\" target=\"_blank\" rel=\"noopener\">every Gold Skulltula token</a>, and <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-soft-soil-fresh-magic-bean-location/\" target=\"_blank\" rel=\"noopener\">where to plant every Magic Bean</a>.</p>"},{"title":"Supreme Court declines Trump administration's request to intervene in California ballot dispute","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-intervene-in-california-ballots-dispute/","category":"law","categoryLabel":"Law","wordCount":531,"readingTime":3,"content":"<p>The Trump administration on Monday morning <a href=\"https://www.scotusblog.com/cases/united-states-v-california-2/\" target=\"_blank\" rel=\"noopener\">asked</a> the Supreme Court to intervene in its efforts to keep California from counting ballots cast by what it contends are more than 20,000 noncitizens who have registered to vote in that state. In a brief, unsigned order released to reporters shortly before 6 p.m., however, the court turned down the government's request. There were no noted dissents.</p><p>In a <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A624/431463/20261102111302952_California%20Application.pdf\" target=\"_blank\" rel=\"noopener\">19-page filing</a>, U.S. Solicitor General D. John Sauer requested an order from the justices that would require California to keep those ballots separate until the voters’ citizenship could be verified. “Once California commingles the challenged ballots with lawful ones,” Sauer wrote, “there is no way to get the challenged ballots back.”</p><p>The filing was the latest chapter in the Trump administration’s push to combat alleged voter fraud. It began last month, when the administration went to federal court in Los Angeles, seeking an order directing the state not to send ballots to, or count the ballots of, voters who were likely not citizens.</p><p>On Oct. 28, U.S. District Judge David Carter <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cacd.1043513/gov.uscourts.cacd.1043513.149.0.pdf\" target=\"_blank\" rel=\"noopener\">turned down</a> the government’s request for a temporary order directing California to sequester the ballots of “likely noncitizens.” Among other things, he questioned the credibility of the Trump administration’s allegations that the voters it had identified were not U.S. citizens. On Friday, the U.S. Court of Appeals for the 9th Circuit also <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/30/26-7231.pdf\" target=\"_blank\" rel=\"noopener\">rejected</a> the Trump administration’s motion for emergency relief.</p><p>With the midterm elections now just one day away, the Trump administration sought relief next in the Supreme Court. Sauer argued that the government is likely to prevail on the merits of its claim – a key factor that courts consider in deciding whether to grant temporary relief – because federal law bars anyone who is not a U.S. citizen from voting in federal elections. Therefore, he wrote, “it follows that any ballot cast by an alien is unlawful” and states cannot count them.</p><p>The United States will also suffer permanent harm (another factor that courts consider in deciding whether to award temporary relief), Sauer continued, because “‘California admits that there is no way to trace a ballot after it is processed.’” The government’s “injury will continue to mount,” Sauer contended, “through Tuesday, November 10 (a week after election day, California’s deadline for receiving mail ballots.)”</p><p>By contrast, Sauer said, California will not suffer “undue hardship” from having to sequester the ballots at issue in this case. Indeed, he suggested, “California’s own election laws contemplate the segregation of challenged ballots, and the segregation of challenged ballots is a standard remedy in election cases.”</p><p>Sauer asked the court to also issue an immediate temporary order, known as an administrative injunction, “that requires California to segregate mail ballots from persons whom the United States has identified as likely noncitizens” while the justices consider the government’s request.</p><p>The Trump administration’s filing went first to Justice Elena Kagan, who has primary responsibility for emergency appeals from the 9th Circuit. Kagan then referred it to the full court, which declined the Trump administration’s request.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Supreme Court declines Trump administration's request to intervene in California ballot dispute</em>, SCOTUSblog (Nov. 2, 2026, 1:33 PM), https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-intervene-in-california-ballots-dispute/</p>"},{"title":"Jensen Huang’s Troubles Leave the AI Industry Reeling","source":"Wired","author":"@wired","url":"https://www.wired.com/story/jensen-huangs-troubles-leaves-the-ai-industry-reeling/","category":"tech","categoryLabel":"Technology","wordCount":790,"readingTime":4,"content":"<p>No executive has pulled the strings in the artificial intelligence era quite like <a href=\"https://www.wired.com/tag/nvidia/\" target=\"_blank\" rel=\"noopener\">Nvidia’s</a> CEO, <a href=\"https://www.wired.com/tag/jensen-huang/\" target=\"_blank\" rel=\"noopener\">Jensen Huang</a>. He parlayed the boom into incredible wealth, became a close confidant of President Donald Trump, and emerged as a prominent voice in US–China relations. That now all stands in the balance.</p><p>Over the past few days, Huang’s status as an AI titan has come under scrutiny amid an admission that he had an <a href=\"https://www.wired.com/story/nvidia-ceo-jensen-huang-hired-a-pr-firm-known-for-handling-sex-scandals-last-year/\" target=\"_blank\" rel=\"noopener\">affair with Alice Huang</a>, an executive at a Singapore-based company whom US intelligence services concluded was a Chinese intelligence asset.</p><p>Nvidia’s board of directors <a href=\"https://nvidianews.nvidia.com/news/statement-from-nvidia-board-of-directors\" target=\"_blank\" rel=\"noopener\">said</a> the company would launch an investigation into the incident. Huang, the company said, “fully supports the review and has committed to cooperating with it.” Huang earned $36 million last year and owned about 3.5 percent of Nvidia as of March, according to a corporate filing—which also noted that Huang is an at-will employee who can be let go anytime without severance.</p><p>How exactly the investigation shakes out, and what it means for Huang’s future at the company, remains to be seen. But the incident at least puts his position at risk, and raises questions about how the industry will respond.</p><p>“He’s the person who decides who gets the chips and who doesn't,” says David Yoffie, a professor at Harvard Business School who tracks the chip industry.</p><p>Nvidia, which Huang cofounded in 1993, controls <a href=\"https://siliconanalysts.com/analysis/nvidia-ai-accelerator-market-share-2024-2026\" target=\"_blank\" rel=\"noopener\">90 percent</a> of the market for chips used in training frontier AI models. With those chips in short supply, Huang has the power to determine which areas of AI get a boost next. Nvidia has also <a href=\"https://blogs.nvidia.com/blog/microsoft-nvidia-anthropic-announce-partnership/\" target=\"_blank\" rel=\"noopener\">bankrolled</a> much of the AI buildout, <a href=\"https://openai.com/index/scaling-ai-for-everyone/\" target=\"_blank\" rel=\"noopener\">investing</a> billions in the very companies buying its chips, such as OpenAI and Anthropic. When Elon Musk wants to build a new data center, Yoffie says, he can put in a call to Huang.</p><p>Internally, Huang closely manages even small details at Nvidia, responds to emails from any one of its roughly 60,000 staffers, and raises his voice to get points across, according to current and former employees. He’s a regular on cable TV and at tech conferences, where he’s been trying to <a href=\"https://www.wired.com/story/nvidia-third-quarter-2026-earnings/\" target=\"_blank\" rel=\"noopener\">deflate concerns about an AI market bubble</a> and <a href=\"https://www.wired.com/story/big-interview-nvidia-jensen-huang-2024/\" target=\"_blank\" rel=\"noopener\">boost the positioning of his company</a>.</p><p>But Nvidia has no other executive anywhere close to Huang’s prominence, and no apparent potential successor. “We have no idea who would replace him,” Yoffie says. “You put someone new into that position, if you're a customer, who knows what that's going to mean.”</p><p>Ryan Fedasiuk, a senior fellow at the think tank Foundation for American Innovation, says Huang has played such an important role—and become so close to the president—that he has become load-bearing for the entire US AI industry.</p><p>“On the one hand, Huang is irreplaceable. He built Nvidia into the juggernaut it is today, and he was the visionary behind the GPU, which has sustained the intelligence revolution,” Fedasiuk says. But he says that the company, which is indispensable to the AI industry, has to come first.</p><p>“He has to be replaceable as the CEO of the world's largest company, at $4 trillion in capex.”</p><p>Nvidia shares fell more than 4 percent on Monday, even as broader stock market indices rose.</p><p>The board’s investigation will most likely focus on whether Huang violated any company policies, Yoffie says. But the FBI could also investigate whether laws were broken, and Congress may decide to look into whether Huang’s affair influenced the US government’s policy on selling chips to China.</p><p>Nvidia didn’t immediately respond to WIRED’s request for comment.</p><p>The scandal also raises serious questions about whether China may have gained sensitive information about US AI companies and the government’s strategy on China, Fedasiuk says.</p><p>Huang’s affair appears especially damning given how outspoken he has been in recent years against calls for more aggressive technology export controls on China. His credibility on the topic could be permanently in doubt.</p><p>Both the first Trump administration and the Biden administration imposed export controls designed to limit China’s access to Nvidia’s chips, as well as to technology required to mint advanced semiconductors. In his second term, however, Trump loosened these controls, giving China access to older generations of Nvidia chips; it was better to make China reliant on US technology, the argument went.</p><p><a href=\"https://cset.georgetown.edu/staff/sam-bresnick/\" target=\"_blank\" rel=\"noopener\">Sam Bresnick</a>, a research fellow at Georgetown University’s Center for Security and Emerging Technology, says the Huang scandal is likely to accelerate efforts to crack down on chip exports.</p><p>“There was going to be more of an impetus to control what chips are getting sent to China anyway,” he says. “I expect there to be more scrutiny on what's going on, what's getting sent to China. I think there's also going to be more scrutiny from the Commerce Department.”</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
