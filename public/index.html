<script>
var articles = [{"title":"What Natalie Harp Carries","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/critics-notebook/what-natalie-harp-carries","category":"fun","categoryLabel":"Interesting Reads","wordCount":882,"readingTime":5,"content":"<p>On September 1, 1987, a military train loaded with munitions coursed out of Diablo Valley, in the East Bay of Northern California. President Ronald Reagan would, through his extralegal maneuvering, put the Marxist Sandinistas in Nicaragua down by force. In the city of Concord, a network of pacifists—many of whom were converts to the path, being veterans of the Vietnam War—organized nonviolent protests of this circuit, the flow of weapons to the Contras, American-backed insurgents in Central America. That day in September, the train came upon an obstruction on the track: veterans who had lain down on the rail. The train did not stop. It struck S. Brian Willson, an Air Force veteran, severing both of his legs.</p><p>Willson, who is now eighty-five, has lived in Nicaragua for years. The word from one of his documentarians is that he is more famous there than the other Brian Wilson, of the Beach Boys. A figure like that attracts a village, notwithstanding his secular vow of “living simply so others may simply live,” and one of his votaries is Preston Harp, a thirty-eight-year-old Californian who left the States a few years ago for Managua, where he works with Willson on his manuscripts. Harp was called out of his voluntary defection, recently, to comment on the news spewing out of Washington, D.C., given that it concerned him personally, as the older brother of the subject in question, Natalie Harp, the thirty-five-year-old executive assistant to Donald Trump.</p><p>“Trump is everything that my mom taught us to respect,” Preston Harp said, on CNN. “My mom raised us with the idea that American exceptionalism was the correct way of looking at things, that the United States is the boss of the world. That slavery was—back then—that was normal. People weren’t bad because they had slaves.” Preston and Natalie were homeschooled and raised in a strain of evangelicalism. In 2020, their father, who worked as a real-estate broker, killed himself. Natalie and her mother, perhaps fearing the wrath incurred by the cardinal sin, denied the cause of his death. Preston soon stopped talking to his nuclear family, with whom he diverged politically. His pitying psychological reading of his sister was that her elaborate journey to Trumpworld was like a spiriting toward home, a towhead girl stumbling through dense thicket, awestruck by her first glimpse of thatched roof where surrogate father lives.</p><p>The reason that everyone is suddenly talking about Natalie Harp is because of speechwriting, an origin that seems almost arcane in the rhetoric-hungry electorate. In Atlanta, the Democratic senator Jon Ossoff, campaigning to keep his seat in Georgia against his Republican challenger, Mike Collins, was carving an argument against Collins via his ally Trump, when he made a practiced turn into what I hear as the podcast register: a little offhand and smooth. The President, he said, doesn’t want to work; what he wants is to “<a href=\"https://www.newyorker.com/magazine/2026/07/27/the-man-who-green-lighted-trumps-ballroom\" target=\"_blank\" rel=\"noopener\">build his ballroom</a>”—a reference to Trump’s raising of a gilded monument to his ego in place of the East Wing—“and travel with Natalie on their apparently defenseless flying palace gifted by the Emir of Qatar.” I’m not going to be craven and overanalyze the speechifying; what is clear is that the Ossoff campaign team, that is courting hearsay about a 2028 Presidential run, got what it was aiming for.</p><p>Civic powerlessness can be overridden by good gossip. “Natalie” became a subject of fascination, materializing in discoveries and rediscoveries. The reporters at the <em>Times,</em> the Washington <em>Post</em>, and other outlets had, in fact, been giving Harp the curio treatment long before she officially joined the Administration last year. She had received the who’s-this-new-blonde gloss in the political press, because in the ecosystem of arrivistes she seemed lone. The Trump campaign team had, in the twenty-tens, been in the habit of plucking ordinary people to publicly extoll him. At the 2020 Republican National Convention, Harp, known then as a “California entrepreneur,” testified that Trump had saved her life. Diagnosed with Stage II bone cancer, she said, her chemotherapy program had been failing. The Administration’s passage of the Right to Try Act, in 2018, which allows terminally ill patients to access certain therapies that have not yet been fully approved by the F.D.A., gave her a new lease on life. “They didn’t give me the right to try experimental treatments, Mr. President,” Harp said. “You did, and, without you, I’d have died waiting for them to be approved.” Is that true? The <em>Post</em> cast doubt on this narrative, back in 2020, finding that the “timeline” of the bill’s passage and her illness made it “unlikely Trump had any effect on her case.” But the appearance at the R.N.C. had brought the regular citizen into Trump’s view. The next two years, the Biden incubation period, Harp spent as an anchor on the One America News Network. Trump would call her on the phone, and the two would “talk about everything and nothing,” as she’d later reminisce. In 2022, a layman for Trump, she joined his enterprise as executive assistant. When he became President-elect, again, in November of 2024, the <em>Times’</em> court-intrigue team zeroed in on Harp as a harbinger for the next term: “President-elect Donald J. Trump has always demanded loyalty from his aides, but few have answered the call like Natalie Harp.”</p>"},{"title":"The Saily Ultra eSIM Is a Great, Perk-Packed Choice for Globetrotters","source":"Wired","author":"@wired","url":"https://www.wired.com/review/saily-ultra-esim/","category":"tech","categoryLabel":"Technology","wordCount":775,"readingTime":4,"content":"<p>I tested the Premium plan extensively in the UK and briefly in Europe. It was quick and easy to set up in the Saily app and kept me connected as I roamed, offering decent speeds up to around 300 Mbps on 5G networks in city center locations, inevitably dropping off to 4G and around 15 Mbps in more rural spots. The specific speeds you’ll get depend entirely on the local network. Saily piggybacks on local providers, mainly connecting to EE and Vodafone during my month of testing.</p><p>The Ultra plan includes 30 GB of high-speed data. In this case, high-speed simply means unfettered; the actual speed you get depends on coverage where you are. After that 30 GB is gone, you get unlimited throttled data at up to 1 Mbps. In practice, I found this lower speed was enough for messaging, web scrolling, and navigation, but anything data-hungry, like video, is out.</p><p>It’s worth noting that the 30 GB limit is for the month. Most folks use around 20 GB of data in a month, so 30 GB sounds like a lot. But consider that you are probably connected to Wi-Fi most of the time at home or work, and you may not be when traveling. That 30 GB can disappear surprisingly quickly, and you should take advantage of Wi-Fi whenever you can on your travels. One of my <a href=\"https://www.wired.com/story/best-travel-tech-for-families/\" target=\"_blank\" rel=\"noopener\">top travel tips</a> is to <a href=\"https://www.wired.com/story/how-to-download-videos-to-watch-offline/\" target=\"_blank\" rel=\"noopener\">download videos</a> and maps before you go, or when you’re connected to Wi-Fi.</p><p>If you’re only visiting one or two countries, it’s probably better to get a pay-as-you-go plan for that specific region or country. For example, Saily offers unlimited data in the UK for 15 days for $49, but there’s a fair usage policy that will throttle you after 5 GB in a single 24-hour period (until the next day). Unlimited data across Europe (35 countries) for a month will cost you $72, with the same 5 GB daily limit. You could also just buy 20 GB of data to use over 30 days for $23 in France or $31 in the UK.</p><p>Having used a few different international eSIM and regular SIM services for travel over the years, Saily compares favorably on performance and ease of use but is relatively expensive. That said, most other eSIM services don’t come with a bundle of extras.</p><h2>Plenty of Perks</h2><p>Saily Ultra will be a hard sell for most folks simply looking at the data, but frequent travelers will appreciate the plentiful perks. Here’s what you get:</p><ul><li><strong>1x Airport Lounge Pass per month</strong>: Airports can be noisy and uncomfortable, but airport lounges offer quieter spaces where you can work or relax, with fast Wi-Fi, comfier seating, and complimentary food and drink. If you’re stuck in an airport for a few hours, a lounge pass can make your wait as painless as possible. With Saily Ultra, you get one free pass per month for one person. It generates a QR code in the app that’s valid for 30 minutes. Here’s the complete list of <a href=\"https://cna.st/affiliate-link/2Y1hYhhFGuXjkwqFK5eQPnBiPGQfCXYYUiHE5wdKbZsRfP1b6QhigTy54B8D437ABAwukEidgJiH4y7RpUNa9Kj7wrSaVK5iVVyAN9UeCTQyeQYKaSpM9UbuDUP5vKFFFPZJnwB6p37kGKsK1rFS3w5E4795Ym7RDJtDCuowCqE5J6rFyYDfSsYo4YBZKgvdS3uFvNKFF3VHzRdLMsQHa7qjLSNYwwG4bRt2GLzAqvKzx6tmaef6sjyvydJ76zrkFFY7kMFT3ry1Sam87Ei4kts4NGZ2vPNqzRPGUSgTP4ToP4F4RFaaKv5XFKoQNNMGAM2nRnGT3nypc9ohoHwUK15bgq\" target=\"_blank\" rel=\"noopener\">supported lounge destinations</a>. You also get a free lounge pass for that trip if your flight is delayed for more than two hours (contact support in the app).</li><li><strong>1x Fast-Track Pass per month</strong>: You can skip the long security queue with fast-track and get straight through into the terminal. With Saily Ultra, you get one free fast-track pass for one person, generated as a QR code in the app. Here’s the complete list of <a href=\"https://cna.st/affiliate-link/B3TtCQX4Kz5FuM9NiAL4VXqmxHPf5vgFQruMZpxxoT8hLM7JQ63gBuGykrKzRK6VdSHLERyM55wxYgauvCKbnFdKxmAgTSgGfu1abMpHsyTaFNiM9RHxYpbCDSGfAGGq3PTSu7D7uChHuXis1ChdxTUGzXrKBDPUaz1x9jVJSgMMoAN3eeJWtKRrygU7qZ8ZR4uBGHaPiXuAnhjfcUR6GgLa31dkR1zeB59FCnMtNY2qqaDg69z19hzVdMckvvcM5uUuexcjwfdC8kiqcRvc5o5nA3aA4fXWnciVdFs7Gn5STrt5dXFXFwnFXGKwtDctVW7BtXw6YaSQh5ckXkpWFqGkSBcb8uj\" target=\"_blank\" rel=\"noopener\">supported fast-track destinations</a>. Availability is far more limited than with the lounge pass, so I was unable to test this.</li><li><strong>Online Security Tools</strong>: You get access to <a href=\"https://www.wired.com/review/nordvpn-review-2025/\" target=\"_blank\" rel=\"noopener\">NordVPN</a>, NordPass, NordLocker, and Incogni with an activation code in the Saily app. Saily’s parent company is Nord Security, so it makes sense that its popular <a href=\"https://www.wired.com/gallery/best-vpn/\" target=\"_blank\" rel=\"noopener\">VPN service</a>, <a href=\"https://www.wired.com/story/best-password-managers/\" target=\"_blank\" rel=\"noopener\">password manager</a>, and secure cloud storage are included. Incogni is a privacy tool that can help you remove personal data from the internet.</li></ul><p>Saily lists several other perks on its website, including priority support, an ad blocker, and 8 percent back in Saily credits. The ad blocker is handy and also reduces your data usage, and you can use any credits you accrue to buy data plans or extra perks, like additional lounge passes. It's also worth noting that lounge and fast-track benefits rollover for up to three months if unused, though you can't share them. Saily also lists a ClassPass subscription on the site right now, but that wasn’t available when I tested. The perks are subject to change, so it’s important to check what’s included at the time of purchase.</p>"},{"title":"Intern (Actually a Project Veritas Undercover Plant) in Political Organization Didn't Have \"Fiduciary Duty\" to Organization","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/21/intern-actually-a-project-veritas-undercover-plant-in-political-organization-didnt-have-fiduciary-duty-to-organization/","category":"law","categoryLabel":"Law","wordCount":1078,"readingTime":6,"content":"<p>An excerpt from today's long decision in <a href=\"https://media.cadc.uscourts.gov/opinions/docs/2026/08/25-7080-2189338.pdf\" target=\"_blank\" rel=\"noopener\"><em>Democracy Partners, LLC v. O'Keefe</em></a> by D.C. Circuit Judge Karen LeCraft Henderson, joined by Judge Harry Edwards (read <a href=\"https://reason.com/volokh/2026/08/21/damages-award-stemming-from-project-veritas-project-set-aside-by-d-c-circuit/\" target=\"_blank\" rel=\"noopener\">this post</a> for more on the facts and on a separate fraud claim):</p>\n<blockquote><p>Creamer [the target of a Project Veritas undercover investigation] brought those claims under the provisions of the federal and D.C. wiretapping laws that make it unlawful to secretly record a conversation with another \"for the purpose of committing any crim[e] or tor[t].\" The jury agreed with Creamer that Maass [a Project Veritas employee who, under false pretenses, applied for and got an internship at Cramer's Democracy Partners organization -EV] violated these provisions because she was a fiduciary of Democracy Partners and surreptitiously recorded her conversations with Democracy Partners staff in order to breach her fiduciary duty—which is a tort in D.C….</p>\n<p>A fiduciary is an agent who exercises delegated power on a principal's behalf. \"[P]ower\" means the actual or apparent authority to take actions that \"affect the legal rights and duties\" of the principal. This requirement separates the fiduciary relationship from the ordinary contractual arrangement. \"[L]awyers, trust companies, realtors, or the like,\" are common examples of fiduciaries because the decisions they make often carry legal consequences for the other party…. Courts thus recognize that the fiduciary relationship is a \"special confidential relationship\" that \"transcends\" an arms-length business transaction.</p>\n<p>In our view, no reasonable jury could find that Maass was a fiduciary of Democracy Partners because the evidence failed to show Maass was an agent with any degree of delegated power to act on Democracy Partners' behalf. To explain why, we ignore Maass's title as an unpaid intern and focus solely on \"the facts of [her] relationship\" with Democracy Partners—most relevantly, the \"promises made, the type of services or advice given and the legitimate expectations of the parties.\"</p></blockquote>\n<blockquote><p>There were no promises exchanged between Democracy Partners and Maass that gave her any power to act as Democracy Partners' agent…. Creamer offered no evidence of any written or oral employment agreement with Maass—let alone one that empowered her to take legally binding actions on behalf of Democracy Partners. Nor could a jury reasonably infer such an agreement based on \"the type of services or advice\" that Maass provided Democracy Partners.</p>\n<p>Maass did not give Democracy Partners any \"advice\" because she lacked the relevant knowledge or experience. Democracy Partners knew this because the fake resume Maass provided did not list any experience beyond bartending and waitressing. As for \"services\" rendered, Maass performed no services typical of a fiduciary. She exercised no power of attorney, actual or apparent. She did not execute any contracts, manage corporate funds, or order the disbursement of money. The only discrete tasks that Creamer recalled asking Maass to perform—taking stock of political signs and compiling snippets of news footage from the Internet as part of Democracy Partners' \"bracketing\" program—required little skill or discretion, did not require Maass to handle confidential information and did not carry any legally binding consequences for Democracy Partners.</p>\n<p>Creamer's principal argument, echoed by our dissenting colleague, is that Maass became Democracy Partners' fiduciary because of her passive exposure to confidential information while an intern there. Creamer emphasizes the times in which Maass accepted his invitation to sit in on closed-door business meetings, during which Democracy Partners staff and clients talked confidentially.</p>\n<p>But Maass was no more than a passive observer during these discussions. Creamer did not invite Maass to these meetings so that she could offer her acumen on polling strategies or make decisions about future bracketing events—she was there to listen and learn. Creamer testified that he invited Maass to one private meeting at the DNC headquarters partly because he knew that she was already headed there for an unrelated errand. J reason, he explained, was simply to introduce her to fellow colleagues.</p>\n<p>At most, Maass's presence at the meetings may have given rise to a legitimate expectation that Maass would not divulge what she saw and heard at the closed-door meetings. But an implied contractual obligation not to disclose information (Maass never signed a non-disclosure agreement) cannot elevate a party to the privileged status of a fiduciary ….</p></blockquote>\n<p>Jidge Robert Wilkins dissented on this point:</p>\n<blockquote><p>The Restatement [of Agency] also provides that an \"adviser may be subject to a fiduciary duty of loyalty <em>even when the adviser is not acting as an agent</em>.\" Furthermore, the District of Columbia recognizes, as a subset of the breach of fiduciary duty, the tort of \"breach of confidential relationship,\" which is an \"unconsented, unprivileged disclosure to a third party of nonpublic information that the defendant has learned within a confidential relationship.\" …</p>\n<p>[T]he Majority concludes that the absence of a written contract means that there were no promises \"exchanged between [the Plaintiffs] and Maass\" and thus no agency relationship, but the Restatement of Agency acknowledges that \"the consensual aspect of agency does not mean that an enforceable contract underlies or accompanies each relation of agency. Many agents act or promise to act gratuitously.\"</p>\n<p>The Majority also concludes that because Maass provided clerical services \"requir[ing] little skill or discretion,\" her internship cannot provide the basis for a fiduciary relationship, she merely had \"passive exposure to confidential information\" and was not part of a fiduciary or confidential relationship within the meaning of District of Columbia law. To be sure, the Majority's conclusion is perfectly reasonable, but that does not mean that the jury's opposite conclusion was not also reasonable. The jury, considering the evidence in the light most favorable to the Plaintiffs, could conclude: (1) that the relationship involved an implied duty of loyalty and confidentiality; (2) that Maass understood this duty and implicitly agreed to it by not objecting when she was told she would have to sign an NDA; and (3) that the political nature of the work carried a legitimate and customary expectation of confidentiality and trust.</p>\n<p>Judges, Senators, business leaders and various professionals hire interns every day, and I dare say that all of them would be surprised to learn that, as a matter of law, their interns have no enforceable fiduciary duty to preserve the confidentiality of information learned during the course of the internship. Yet, at bottom, that is what the Majority holds, because I do not see how one distinguishes the terms of Maass' internship from the terms of the thousands of others occurring across the country at this very instant….</p></blockquote>\n<p>Benjamin Barr and Stephen R. Klein represent O'Keefe and Maass.</p>"},{"title":"I love the Dark Soulful architecture of The Canon of Balls, a rolling open world game inspired by Sega, Fumito Ueda and Minecraft parkour","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/i-love-the-dark-soulful-architecture-of-the-canon-of-balls-a-rolling-open-world-game-inspired-by-sega-fumito-ueda-and-minecraft-parkour","category":"gaming","categoryLabel":"Gaming","wordCount":628,"readingTime":4,"content":"<p>although I know it will drive me nuts</p>\n    \n  \n  \n  \n  \n            <p>\r\nWhat do <a href=\"https://www.rockpapershotgun.com/games/dark-souls\" target=\"_blank\" rel=\"noopener\">Dark Souls</a>, Super Monkey Ball, <a href=\"https://www.rockpapershotgun.com/games/shadow-of-the-colossus\" target=\"_blank\" rel=\"noopener\">Shadow of the Colossus</a>, and Minecraft have in common? They are all explicit inspirations for The Canon of Balls, a spooky and unforgiving new open world platformer in which you are a horrified statue's face with a fleshy pink tongue, floating inside a rolling cage. You can use your tongue as a springboard.</p>\n<p>Look, stay with me on this. I think The Canon of Balls could be good. Yes, I know that we've <a href=\"https://www.rockpapershotgun.com/marble-souls-dares-to-ask-what-would-happen-if-the-bloke-from-dark-souls-got-stuck-in-a-physics-driven-ball-and-its-out-this-year\" target=\"_blank\" rel=\"noopener\">done \"Dark Souls in a ball\" already</a> this month, but I think this game stands apart. It reminds me a little of <a href=\"https://www.rockpapershotgun.com/games/straftat\" target=\"_blank\" rel=\"noopener\">Straftat</a> in being a very specific, even obstinate throwback project that's less about nostalgia - less about sheer recreation, and more the feeling that a deserted vein of weirdness has more to give, that there's another future down here somewhere.\r\n</p>\n\n<p>\r\nI've just had a go at the opening area, in which you have to rumble and wall-jump around the inside of a cathedral to nab a key from an enormous dangling brazier. I bounced off the brazier, inches from the prize, and quit the game in outrage… but I can feel it pulling me back. I can feel its hook in my flesh. I want to roam the unfriendly, cyclopean world beyond the window slits. Perhaps I'll bring a friend, so I at least have somebody to swear at, the next time I fall off a ledge. The Canon of Balls is fully singleplayer friendly, with no dedicated co-op mechanics, but devs Helios Monk do encourage you to play in company.\r\n</p><p>\r\nIt's going for a particular kind of abrasive. The rising, falling whisper of your metal prison against the stone, the constant whirling of the hoops past your eyes – these stimuli build a fatigue that is briefly dispersed by the sturdy dink of landing exactly on the platform you were aiming at. The whole \"stone faces with tongues\" setup feels like good old grotesqueness, rather than any kind of post-ironic brainrot thing.\r\n</p>\n<p>\r\nThe devs claim to have created a \"non-repetitive, non-modular open world\" by dint of refusing to \"build a modular 'copy and paste' kit to craft our levels.\" I'd like to hear from other level designers about the reasoning, there. With regard to the cited influences, I can definitely feel From Software in the knotty grandeur and gloom of the architecture – later, there appear to be rotating blade traps, for the Sen's Fortress survivors amongst us. You can perhaps see Fumito Ueda's thumbprints in the organic and somewhat obscure nature of those early platforming routes. And more obviously, in the presence of a huge stone bird with a key in its talons. I hopefully don't need to unpack the Super Monkey Ball connection.\r\n</p>\n<p>\r\nAs for Minecraft, the devs have spelled it out a little. \"Our premise was the good old days of playing Minecraft parkour maps and talking about all kinds of things while you struggled together,\" they write. \"You can be competitive and see who reaches a collectible first, or play more cooperatively, navigating together and waiting for each other. The freedom is in the hands of the group, and we can't wait to see how you all choose to play it. The word 'co-op' might be a bit stretched for our game, as there are no real mechanics that require multiple players—it all works solo. However, the true social moments are what make this experience so special.\"\r\n</p>\n<p>\r\nLove 2 share the thrill of being a face in a ball in a temple hung with tiny little ledges. The Canon of Balls is <a href=\"https://store.steampowered.com/app/3962460/THE_CANON_OF_BALLS/\" target=\"_blank\" rel=\"noopener\">out today on Steam</a>. It is also very affordable, at $3.39, €2.97 and £2.88 with a launch discount.\r\n</p>"}];
