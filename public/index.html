<script>
var articles = [{"title":"The Wealth and Glam of “The Hamptons” Looks Almost Quaint","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/critics-notebook/the-wealth-and-glam-of-the-hamptons-looks-almost-quaint","category":"fun","categoryLabel":"Interesting Reads","wordCount":1426,"readingTime":8,"content":"<p>Marilee Foster is a farmer. In the eighteen-hundreds, her great-great-great-grandfather, a whaling captain, decided to leave the ocean behind him and buy about forty acres of land in Sagaponack, on Long Island, which have remained in Foster’s family ever since, and which she continues to tend, growing fruit and vegetables. Foster is also a writer, who publishes a column in the Southampton <em>Press</em>. “She writes about simple things: she writes about the first crop, she writes about sunsets, she writes about birds,” the author Steven Gaines, a resident of East Hampton, tells the documentarian Barbara Kopple. “It’s really . . . it’s the Hamptons that everybody misses.” According to Foster, her writing is done from a perspective only available to those who, like her, “spend most of their time in the field.” This gives her readers “a certain amount of texture.”</p><p>Foster is one of the many characters who populate “<a href=\"https://www.newyorker.com/magazine/2002/06/03/beached\" target=\"_blank\" rel=\"noopener\">The Hamptons</a>,” Kopple’s fascinating nearly three-hour-long documentary, which first aired in two parts on ABC, in the summer of 2002, and which is now <a href=\"https://www.lecinemaclub.com/now-showing/the-hamptons/\" target=\"_blank\" rel=\"noopener\"><em>streaming</em></a>, for a limited time, on the website Le Cinéma Club. Like Foster, Kopple provides a certain amount of texture in her work, though the field she spends time in and reports on is broader than that of the farmer’s: her subject matter isn’t just the so-called real agricultural communities whose hastening loss Gaines laments but much else besides. For “The Hamptons,” she spent the period between Memorial Day and Labor Day of 2001 roving the cluster of interlocking villages and hamlets on the South Fork of Long Island that have long served as a resort destination for moneyed New Yorkers in the summer months. The result was an intimate human mosaic, set in a highly distinct moment in time.</p><p>Kopple’s film is a balm to anyone who’s grown inured to the characteristic beats of most current documentaries, which so often feel as if they came off a Netflix assembly line. Instead of talking-head interviews, or reënactments, or illustrative, quasi-humorous animated sequences, Kopple’s observational approach allows for meaning to emerge slowly. As a two-time winner of the Academy Award for Best Documentary, for “Harlan County U.S.A.” (1976) and “American Dream” (1990), which both focussed on labor disputes (one in a Kentucky coal mine, the other in a Minnesota meatpacking plant), Kopple is naturally attuned to the class tensions simmering underneath the Hamptons’ placid surface. And yet, her film isn’t politically didactic. Instead of a David and Goliath story, with working-class locals unidirectionally raging against wealthy out-of-towners, she presents an Altmanesque ensemble of diverse subjects, making “The Hamptons” a multivocal affair that has the grain of real life.</p><p>The documentary consists of a collection of short vignettes, arranged according to summer’s chronological unfolding, and features a cast of recurring characters. There’s the longtime police lieutenant, and the local career fishermen, and the seafood caterers, and the waitresses at a local restaurant—a couple of party-happy Irish girls, and a beleaguered Australian. There’s the slick, glad-handing publisher of <em>Hamptons</em> magazine, and the feisty Citarella market scion who would love to have her picture featured in its pages. Then there are the young city professionals shacking up in summer rentals, as many as eight to a room, eight to a hot tub: Jacqueline, a flirty lawyer looking to find a husband; Angela, a shy investment banker who isn’t sure if the share-house experiment is for her; and Josh, a fun-loving guy who calls himself an entrepreneur but mostly seems to occupy himself with picking up girls. Then, there’s Marilee the farmer, and the gimlet-eyed Gaines, a classic insider-outsider figure who wrote the Hamptons history “<a href=\"https://www.amazon.com/Philistines-Hedgerow-Passion-Property-Hamptons/dp/0316309079\" target=\"_blank\" rel=\"noopener\">Philistines at the Hedgerow</a>,” and who explains to Kopple and, by extension, to us, Who’s Who in the Hamptons cosmology.</p><p>Among those denizens are, of course, the famous or at least notable: the supermodel Christie Brinkley and her ex-husband, the musician <a href=\"https://www.newyorker.com/magazine/2014/10/27/billy-joel-profile-thirty-three-hit-wonder\" target=\"_blank\" rel=\"noopener\">Billy Joel</a>; the polo-playing businessman and art collector Adam Lindemann; the hoteliers Rick and Kathy Hilton and their still teen-age daughters, Paris and Nicky; the “<a href=\"https://www.amazon.com/Sex-City-Candace-Bushnell/dp/0446617687\" target=\"_blank\" rel=\"noopener\">Sex and the City</a>” author Candace Bushnell; the hip-hop moguls Russell Simmons and <a href=\"https://www.newyorker.com/culture/critics-notebook/the-tragedy-of-the-diddy-trial\" target=\"_blank\" rel=\"noopener\">Sean (Diddy) Combs</a>; and the celebrity publicist <a href=\"https://www.newyorker.com/magazine/2001/07/30/free-lizzie\" target=\"_blank\" rel=\"noopener\">Lizzie Grubman</a>, whom the camera begins to follow mere days before a dispute with a bouncer led her to back up her father’s Mercedes S.U.V. into a crowd outside the Conscience Point Inn night club, and injure sixteen people, resulting in a summer-long tabloid furor. (Grubman subsequently pleaded guilty to felony and misdemeanor charges and served a thirty-eight-day jail sentence.)</p><p>Kopple’s documentary is a time capsule, offering a concentrated taste of an earlier moment in American culture, now resolutely over. To watch the proud father of the <em>Hamptons</em> publisher leafing through the magazine’s June issue, bragging that “this is a pretty thick book, four-hundred-plus pages,” or party-animal Josh asking a woman he meets whether she has a cellphone so that he can give her his number, or girls dancing at the club—their hair flat-ironed, their tight-fitting going-out tops just kissing the waists of their low-rise designer denims, their tiny shoulder bags tucked securely under their arms—is to feel oneself being tossed back on the waves of time. As a friend I was discussing “The Hamptons” with noted, too, “the most startling part about this documentary is how normal everyone’s face looks.” Botox hadn’t even been F.D.A.-approved yet. Were we ever so young?</p><p>This peek into the relatively recent past is delightful fun, except when it starts to feel distinctly melancholic. So many mostly unfortunate things have happened since Kopple shot her documentary. This is true, for starters, in the celebrity realm: at a Fourth of July baseball tournament between the Roc-A-Fella and Bad Boy record labels which Kopple shows, players include the riding-high, since-disgraced and jailed Diddy; the starlet Tara Reid, who’d come to spend much of the next twenty-five years in seeming party-girl decline; and the singer Aaliyah, who’d die in a tragic plane crash the following month, at only twenty-two. Grubman, too, is front and center, less than seventy-two hours before the brutal events at Conscience Point would take place.</p><p>The Grubman scandal, especially, serves as a harbinger of darkness to come. The apparent class disparity and aggression on display—the wealthy and well-connected Grubman allegedly told the club’s bouncer, “Fuck you, white trash,” before she accelerated into the crowd—have only become more pronounced in American life over the past generation. The media circus that erupted in the wake of the accident, too (the New York <em>Post</em>, in particular, was like a dog with a bone with <em>l’affaire Grubman</em>), practically seems like child’s play when we consider the near-psychosis-inducing coverage of every single moment of every single person’s life that we’re now exposed to 24/7, not only via the tabloids but via smartphones and social media. Kopple’s Hamptons—even with its endless velvet ropes and parties and Jacuzzis—is positively quaint in comparison. (A party thrown by Christie Brinkley even has paper plates.)</p><p>As I watched, I kept thinking about Michael Rubin, the Fanatics billionaire, whose chief claim to fame is the annual Fourth of July White Party he hosts at his beachfront Bridgehampton estate. Taking a page from Diddy, who hosted his own annual White Party until 2009—an event whose lustre has naturally since faded—Rubin’s ultra-lavish bashes, whose gaudily decked-out guests include the likes of Jay-Z and Beyoncé, Robert Kraft and Tom Brady, Kim Kardashian and Leonardo DiCaprio, seem custom-made for social-media flexing. The whole point of the event is not the event itself but the retrospective broadcasting of its participants’ staggering wealth and power.</p><p>And then, of course, there’s 9/11. As the summer of 2001 wears on through the lens of Kopple’s camera, our knowledge of the coming catastrophe casts a shadow over the proceedings. Watching the heaving throng of tan youths, drunk and dancing at Neptune Beach Club, while Josh the entrepreneur, happy as a clam, whoops, “This is the Hamptons, one hundred per cent!” I almost felt the urge to scream “watch out!” at the screen. Toward the end of the documentary, on the eve of Labor Day weekend, we see Gaines muse on the state of the Hamptons, and his words nearly topple with the weight of dramatic irony. “We’re living in a really special time now,” he tells Kopple. “There’s tremendous prosperity; this is the resort that was closest to the financial center of the world. . . . This one second in time is gonna be looked back on as a really golden age.” And how. ♦</p>"},{"title":"I find new concepts in every run of The King is Watching, a mix of city-builder and tower defence game that revels in magic, menace and distraction","source":"Eurogamer","author":"Christian Donlan","url":"https://www.eurogamer.net/the-king-is-watching-impressions","category":"gaming","categoryLabel":"Gaming","wordCount":915,"readingTime":5,"content":"<p>Eyes on the prize.</p>\n    \n  \n  \n  \n\n            <p>The first thing I need to tell you about The King is Watching is that, due to an unusual font and my poor eyesight, I originally though the game was called The King is Hatching.</p>\n<p>And that kind of fits, really. This is an odd game, definitely odd enough to see you conjure royalty from a shell. The king in question is a fat golden eye wedged up high in the sky. And the king is also a startled red-faced figure staring out of the promotional artwork. Springing from an egg would be fairly normal behaviour for this fellow.</p>\n<p>Even so, The King is Watching also works as a title, I guess. Actually, it gets right to the brilliant core of this brilliant game. The King is Watching is a blend of city builder and tower defence. You fill the tiles of your town with buildings that create the resources you'll need to raise warriors. These warriors then go outside the walls and keep everyone safe from wave after wave of horrors who are headed your way. All great. But the twist is that the buildings in your town only generate resources when the king is watching them. And the king can't watch everything.</p>\n\n<p>At first, in fact, he can watch a total of three different buildings. For the first moments of your first game, you'll be moving this strange little L-shaped mask of focus around your emerging town and, sure enough, only the tiles within it do anything. When the king is watching, wells produce water and forests produce wood. Move the mask elsewhere and all of that ceases.</p><p>This means that you need to be thinking of two things even at points when most games of this type want you to think about one thing. It's not enough to just build your town, you need to think about which parts of it you want to operate at any moment. This means you're constantly thinking about what you want to make next - new buildings? new troop types? - and where the king needs to be looking in order for that to happen.</p>\n\n<p>1 of 4 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>And this in turn means you need to think about where you place things in the town. Put three wells in an L shape, for example, and the king will generate a lot of water when he's focused on them (ah, the joys of a game that makes you type things like this), but wouldn't it be better to diversify your interests a little? How about a well for water, a field for wheat and a market to turn some of the wheat into gold?</p><p>All of this matters because enemies are constantly on the march towards your town, ready to raze it to the ground. You can keep track of their progress via a little panel at the top of the screen - another thing for you, rather than the king, to keep your eye on - and when they arrive you need to make sure you have an army in place to keep them from your gates.</p>\n\nImage credit: Eurogamer / tinyBuild\n\n<p>Battles aren't just about resource planning, though. Over the course of a game you can unlock various magic spells that allow you to intervene in the action more directly, slowing enemies down, turning them into sheep, doing extra damage, that kind of stuff. Again, it's another thing for you to think about, and by this point you're probably getting an understanding of the kinds of concepts that The King is Watching wants you to be obsessed with.</p><p>Most notably: you can't be everywhere at once, but it would be really helpful if you could. This is a game about noise and distractions, or rather it's about deciding which vital life-preserving signals you can choose to treat as noise and distractions at any particular moment. No enemies on the horizon for the time being? Sort your town out and stockpile resources. Buy new building types, knock down old buildings that aren't working for you anymore, expand into new tiles a little and maybe even level up the overall area of your king's gaze. But when enemies and bosses appear outside the gates, it's time to put all that stuff aside and make sure you can place your full attention on the ensuing battle.</p>\n\nImage credit: Eurogamer / tinyBuild\n\n<p>This is clever, taxing, morish stuff, and the game's key ideas are wonderfully mounted in a kind of Roguelite structure that sees games unfolding as individual runs that can last anything from ten minutes to the best part of an hour. Because the basics are so simple - build and defend - the game can throw in all kinds of complications, such as a brilliant system that gives you leeway in arranging some of the order in which your enemies will attack. I'm still early in with The King is Watching, in other words, and I still find cool new concepts in every single run.</p><p>But that distraction thing - moving the king's attention, hastily selecting constructions, checking my magic spells are ready and keeping a weather eye on the horizon? It's <em>familiar</em>. It's so familiar, in fact. It's watching Netflix while scrolling TikTok and listening to an audiobook. It's handling dinner while making lunchboxes and ensuring the dog gets fed. Life, as a wise young man once said, moves pretty fast. And The King is Watching understands this innately.</p>"},{"title":"Once upon a time: storytelling in Learning Resources v. Trump","source":"SCOTUSblog","author":"Kendall Gray","url":"https://www.scotusblog.com/2026/08/once-upon-a-time-storytelling-in-learning-resources-v-trump/","category":"law","categoryLabel":"Law","wordCount":1171,"readingTime":6,"content":"<p>Every fall, with each new class of 1Ls, we legal writing teachers undertake a strange job. We spend an entire year trying to get students to <em>not</em> write like lawyers, a notoriously dreadful category of writers. In pursuit of that goal, we often target the bad qualities like jargon, legalese, word-wasting phrases, and other legal idiosyncrasies. But I think we’d get better results if we started with what makes any writing “good” – whether it is written by lawyers or by actual humans. As evidence, I would point to the Supreme Court’s best writers, who deploy tactics often taught (and missed) in a good English composition class.</p><p>Take Chief Justice John Roberts as an example. Flash back to November 2025: if you’re Roberts, you’ve got a problem – or at least a challenge. You’ve just assigned yourself the majority opinion in <a href=\"https://www.supremecourt.gov/opinions/25pdf/24-1287_new_3135.pdf\" target=\"_blank\" rel=\"noopener\"><em>Learning Resources v. Trump</em></a>. Now you must convince readers inside and outside the court that <a href=\"https://www.congress.gov/crs-product/R45618#:~:text=The%20International%20Emergency%20Economic%20Powers%20Act%20(IEEPA)%20provides%20the%20President,the%20modern%20U.S.%20sanctions%20regime.\" target=\"_blank\" rel=\"noopener\">the International Emergency Economic Powers Act </a>provides no authority for the one policy most important to this president: tariffs. </p><p>Never mind that the solicitor general has <a href=\"https://www.nytimes.com/2025/08/13/us/politics/trump-tariffs-case-federal-court.html\" target=\"_blank\" rel=\"noopener\">warned</a> that your decision will provoke another Great Depression. Never mind that the outcome depends upon Talmudic esoterica unfamiliar to a politicized public – things like separation of powers, textualism, and the major questions doctrine.</p><p>Beyond all that, you must communicate dreadful source material, especially to non-legal readers. Those readers must learn something of <a href=\"https://www.law.cornell.edu/uscode/text/50/chapter-35\" target=\"_blank\" rel=\"noopener\">IEEPA</a> itself, which clocks in at around 2,000 words of abstract text. Then, they need the content of the <a href=\"https://ballotpedia.org/Donald_Trump's_executive_orders_and_actions_on_trade_and_tariffs,_2025-2026\" target=\"_blank\" rel=\"noopener\">president’s orders</a>, which add almost 12,000 words, even without the appendices.</p><p>So … what do you do?</p><p>Roberts solves this problem by meeting the expectations of the ordinary, English-language reader. Apart from citations, he tells a 422-word story, and he does it with a tactic any writer can emulate: He uses actors as the subjects of most of his sentences. In a conflict over presidential power, Roberts makes the president the main character in a story, both in setting out IEEPA’s requirements and in summarizing the president’s orders.</p><p>After an initial topic sentence about IEEPA, he puts the president – rather than the statute – in the subject position. He writes that, to satisfy IEEPA, “the President must identify” a threat. Then, “he must declare” an emergency. Then “he” may “regulate [. . . 16 words later . . .] importation.”</p><p>Turning to the facts, the chief keeps the president – rather than his orders – in the spotlight. He practically ties the president to a chair at center stage. In the narrative, “President Trump sought” to address two, specific threats (“The first was the influx of illegal drugs from Canada, Mexico, and China,” and “[t]he second was ‘large and persistent’ trade deficits.”). Roberts writes that the “President determined” the threats were serious. “He invoked” his power under IEEPA. As required by the statute, “President Trump declared” the requisite emergency. “He then imposed” tariffs, which “the President” later changed when “he increased” or “he removed” tariffs. Later, “the President . . . shifted . . . goods into and out of” the tariff regime. </p><p>Indeed, in all the sentences he wrote for Section I.A of the opinion, the chief used an actor as the subject in all but five.</p><p>In making that choice, the chief is not employing some tactic unique to “legal” writing, separate from ordinary English prose. Your old English composition teacher has long known the power of storytelling language. One such teacher, Joseph Willams, changed the way I wrote as a lawyer, and I love the way he put it. In the book Style: Lessons in Clarity and Grace, he focuses on what every reader needs from a writer. While readers look for action in the verbs, “they want characters as subjects even more.” You erect tripping hazards for your reader when, “for no good reason,” you “fail to name characters in subjects, or worse, delete them entirely.”</p><p>Unfortunately, most lawyers don’t write this way. Most lawyers – even great ones – write more like the Congressional Research Service. <a href=\"https://www.congress.gov/crs_external_products/R/PDF/R45618/R45618.17.pdf\" target=\"_blank\" rel=\"noopener\">In its September 2025 report on IEEPA</a>, CRS covers essentially the same ground as the chief’s 422-word story. But instead of a story, CRS offers up a report filled with tripping hazards. It force-feeds the reader five dense pages (10–14) of abstract prose, replete with footnotes.</p><p>Where Roberts describes IEEPA by focusing on the president, CRS hangs a 56-word sentence on “IEEPA empowers.” Readers must then swallow a 50-word sentence hung on “statute provides.” And the public is reminded that each “new threat . . . requires” certain actions by the president. The <em>coup de grace?</em> CRS treats readers to a dreadful block quote of IEEPA’s central provisions.</p><p>To be sure, the president does appear in the paragraphs discussing the tariff orders. But if Roberts ties the president to a chair, CRS permits him to wander on and off stage. In the president’s absence, readers must content themselves with massive sentences about the “January Proclamation” or the “February Executive Orders.” Again, rather than a story, the reader must shoulder a bureaucratic tome – scrupulously accurate, no doubt, but abstract enough and long enough to avoid being read at all.</p><p>The chief, in contrast, uses storytelling both to be read and to be understood, all while setting up his version of the question. Remember the story: The president issued barely related tariffs that swallowed the entire economy, then he changed them at random. But Congress wrote, “regulate . . . [yadda, yadda, yadda] . . . importation.” Based on this language, can a president really set tariffs “on imports from any country, of any product, at any rate, for any amount of time”?</p><p>Nope.</p><p>So, how to write like the chief rather than like a lawyer? Prefer actors as subjects rather than concepts or abstractions like proclamations, orders, tariffs, separation of powers, or the major questions doctrine. Of course, “prefer” means you’ll occasionally discover “good reason” to abandon this approach, but not nearly as often as you think. For the moment, create drafts like you always do, then build in storytelling when you line edit.</p><p>Use this process (adapted from Joseph Williams):</p><ul><li>Underline the first seven or eight words of each sentence.</li><li>Do you see a subject there? Is it a character?</li><li>If it’s not a character, is there some “good reason” to choose the abstraction?</li><li>If not, look for characters hidden in other parts of speech like “the <em>president’s</em> orders” or “the powers of the <em>president</em>.”</li><li>If necessary, create a menu of the main characters in your conflict, then invite them back onstage as subjects who have things to do.</li></ul><p>In the end, good legal writers do the same things as good writers in any field. Good writers tell stories where characters do things. And here, the president was doing things, but without a permission slip from congress.</p><p><strong>Recommended Citation: </strong>Kendall Gray, <em>Once upon a time: storytelling in Learning Resources v. Trump</em>, SCOTUSblog (Aug. 13, 2026, 10:00 AM), https://www.scotusblog.com/2026/08/once-upon-a-time-storytelling-in-learning-resources-v-trump/</p>"},{"title":"The Fairphone (Gen. 6+) is all about giving you more","source":"Hacker News Best","author":"","url":"https://www.fairphone.com/nl/stories/the-fairphone-gen-6-is-all-about-giving-you-more","category":"tech","categoryLabel":"Technology","wordCount":755,"readingTime":4,"content":"<p>For nearly 16 years, our mission has been simple: to prove that a smartphone can be made differently. We’ve focused on creating technology that works well, lasts longer, and is made with genuine care for the people and materials behind it. Last year, we brought that vision to life with the Fairphone (Gen. 6), our clearest expression yet of what a responsible phone should be.</p><p>But we also listened to your feedback. You asked for more performance, more memory, and more personalization. Today, we are answering that call.</p><p>Today, we launch <strong>the</strong> <strong>Fairphone (Gen. 6+). </strong></p><p>It is the Fairphone you already know, but better where it matters most.</p>\n        \n\n                    \n                \n\n            <h2>More power. More performance.</h2><p>The Fairphone (Gen. 6+) comes with upgraded internal hardware that doesn’t compromise on our industry-leading repairability standards. The ‘plus’ isn't about adding features for a longer spec sheet; it's about intentional improvements that keep your device capable for longer.</p><ul><li>- The Fairphone (Gen. 6+) is powered by the <strong>Snapdragon® 7s Gen 4 processor,</strong> going up a generation compared to its predecessor.</li><li>- We’ve also increased the memory from 8GB RAM to <strong>12GB DDR5 RAM</strong>. That’s the most we’ve ever put in a Fairphone!</li></ul><p>Together, the combination gives the new Fairphone a significant boost in performance with smoother multitasking and a more fluid user experience, now and in the future. App loading and switching speeds are faster by up to 24% while system RAM reservation time is down by up to 20%. You’re also getting Android 16 out of the box, with the promise of six OS upgrades over its lifetime.</p>\n\n            <h2>It’s everything you love. Plus more.</h2><p>The Fairphone (Gen. 6+) builds on what made the Fairphone (Gen. 6) an award-winning bestseller for us. That’s also why we have also retained a lot of what made the original so good.</p><ul><li>- Industry-leading warranty of up to five years.</li><li>- Software support guaranteed through 2033.</li><li>- Modular and repairable design with 12 user-replaceable parts.</li><li>- 256GB on-board storage (expandable upto 2TB with microSD)</li><li> - Triple-camera system with 50MP Sony Lytia 700c main camera</li><li>- 6.3” LTPO OLED Display</li><li>- Up to 53 hours of battery life on a single charge</li><li>- IP55 dust and water resistance</li></ul>\n\n            <h2>New edition, new color</h2><p>The new Fairphone comes in Horizon Black and Forest Green, along with an exclusive Cobalt Blue colorway that’s more than a style statement. When we introduce a new color, it’s never just a design decision. The reason we zeroed in on Cobalt Blue is because it serves as a nod to our origin story as a conflict mineral awareness campaign and our commitment to fairly sourced raw materials.</p><p>Having said that, it’s quite the bold look that’s sure to make heads turn and get conversations going. And even better, you can make sure your accessories match as well, with the card holder, finger loop, and protective cover available in the new color as well. And yes, it's still as fair as ever: it contains 51% fair and recycled materials (by total weight), supports our living wage bonus program, is assembled under fair working conditions using renewable energy, and is 100% e-waste neutral!</p>\n        \n\n            <h2>Already own the Fairphone (Gen. 6)?</h2><p><strong>Updated Fairphone Moments: </strong>Our dedicated digital minimalist mode now offers even more control and more customization. Add new wallpapers, reorder your preferred apps, map new functionalities to the Switch button, switch on blue filter mode; there’s a lot more you can do with Fairphone Moments. </p><p><strong>New Fairphone Gallery: </strong>You’ve been asking for this for a long time. Our new local gallery app allows you to store your photos and videos locally without depending on third-party services or paid cloud storage.</p><p>The best part? These software updates are also coming to the Fairphone (Gen. 6). It just wouldn’t be fair otherwise. </p>\n        \n\n            <h2>Hello, America!</h2><p>This launch marks a massive milestone for us. Fairphone is now officially available in the United States. For the first time, sustainable tech enthusiasts across the pond can purchase a fully unlocked Fairphone (Gen. 6+) along with the Fairbuds and Fairbuds XL through our dedicated US web shop. And with the number of comments we see on our socials, this has been a long time coming!</p><strong>Discover the Fairphone (Gen. 6+) today: <a href=\"http://www.fairphone.com/the-fairphone-gen-6-plus\" target=\"_blank\" rel=\"noopener\">Shop EU</a> | <a href=\"http://us.fairphone.com/the-fairphone-gen-6-plus\" target=\"_blank\" rel=\"noopener\">Shop US</a></strong><em>*These figures reflect internal laboratory testing using SmartViser diagnostic tools under conditions designed to approximate real-world use. Actual performance may vary depending on factors such as device configuration, network conditions, and usage patterns. </em><em></em><p><em>®Snapdragon and Qualcomm branded products are products of Qualcomm Technologies, Inc. and/or its subsidiaries.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
