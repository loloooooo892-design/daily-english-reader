*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {
  color: var(--accent);

.archive-link {

<script>
var articles = [{"title":"Scientists Have Found the Most Convincing Evidence Yet of a Dark Matter Particle","source":"Wired","author":"@wired","url":"https://www.wired.com/story/scientists-find-most-convincing-evidence-yet-dark-matter-particle/","category":"tech","categoryLabel":"Technology","wordCount":603,"readingTime":4,"content":"<p>More than a kilometer underground, in what used to be a gold mine, inside a tank filled with tons of liquid xenon, “something” struck the nucleus of an atom. The <a href=\"https://www.wired.com/story/inside-experimental-traps-scientists-set-for-neutrinos/\" target=\"_blank\" rel=\"noopener\">tiny collision</a> left an unusual energy signature that researchers are still unable to explain, but the scientists behind the experiment believe this could be the most convincing physical evidence of dark matter to date.</p><p>Dark matter is one of the most important and <a href=\"https://www.wired.com/story/a-galaxy-composed-almost-entirely-of-dark-matter-has-been-confirmed/\" target=\"_blank\" rel=\"noopener\">elusive substances</a> in astrophysics. Though it makes up about 85 percent of the matter in the universe, we can’t observe it directly because it doesn’t interact with light or much else. Most of the evidence for its existence comes from its gravitational effects, the <a href=\"https://www.wired.com/story/a-newly-discovered-einsteins-cross-reveals-the-existence-of-a-giant-dark-matter-halo/\" target=\"_blank\" rel=\"noopener\">mass of dark matter</a> having tugged on the atoms of the early universe to form stars, galaxies, and the vast web of intergalactic structures visible today.</p><p>But the enigma of dark matter is complex. Scientists don’t even know what it is made of, whether it’s a single type of particle or an entire set of particles that interact with one another in ways we do not yet understand. The most fantastical explanations even suggest that it consists of <a href=\"https://www.wired.com/story/dark-matter-may-be-made-of-black-holes-from-another-universe/\" target=\"_blank\" rel=\"noopener\">black holes</a>. One of the most widely studied theories on dark matter has dubbed its components WIMPs, short for Weakly Interacting Massive Particles, meaning the particles have a mass and thus a gravitational pull but otherwise interact weakly with conventional matter.</p><p>If WIMPs exist and are part of the dark matter of our galaxy, enormous quantities of them could be passing through the Earth continuously without leaving a trace. However, it is possible that, very occasionally, one might interact with an atomic nucleus and transfer some of its energy to it, which is why an inexplicable collision is exciting in the world of particle physics.</p><p>In the strange disturbance recorded at the Sanford Underground Research Facility (SURF) in South Dakota, the detector monitoring the tank recorded that a xenon nucleus received energy and recoiled. Though researchers have not yet been able to satisfactorily explain the cause, some models suggest a WIMP could produce such a reaction.</p><p>The scientists stated that this single event is statistically too small to be considered the discovery of a new particle. In 220 days of observations conducted between 2023 and 2024, only one such anomaly occurred. “With only one event, we don’t want to get ahead of ourselves. We are not claiming to have seen dark matter. But we have seen something interesting that we want to share with the scientific community for their input,” Rick Gaitskell, a professor at Brown University and a member of the team leading the project, said in a <a href=\"https://sanfordlab.org/news/lz-sees-surprising-result-search-dark-matter-surf\" target=\"_blank\" rel=\"noopener\">press release</a>.</p><p>The team behind the experiment has published their study as a <a href=\"https://lz.lbl.gov/\" target=\"_blank\" rel=\"noopener\">preprint</a>, meaning it has not yet been peer reviewed. They have, however, presented the results to the scientific community at the 2026 TeV Particle Astrophysics Conference in Japan.</p><p>Discoveries made around dark matter tend to elicit this kind of restrained excitement. When in November 2025 a team of Japanese astronomers announced that they had seen signs of dark matter in the Milky Way, they too advised the research community not to count their chickens.</p><p>But even if cautious, there are reasons for enthusiasm. If the impact was caused by dark matter, there is enough evidence for researchers to begin characterizing the responsible particle. For example, the team has already calculated that, under the WIMP models they analyzed, the particle is about 200 times more massive than a proton. The impact could help us understand how this type of matter interacts with conventional matter.</p>"},{"title":"Helen Simpson on Our Timeline on This Planet","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/this-week-in-fiction/helen-simpson-09-07-26","category":"fun","categoryLabel":"Interesting Reads","wordCount":977,"readingTime":5,"content":"<p><strong>This week’s story, “<a href=\"https://www.newyorker.com/magazine/2026/09/07/lub-dub-lub-dub-lub-dub-fiction-helen-simpson\" target=\"_blank\" rel=\"noopener\">Lub Dub Lub Dub Lub Dub</a>,” opens as two old friends, Tracey and Lois, meet for coffee in London on a hot May day. (“The air was already at blood heat outside,” you write.) They’re discussing Tracey’s new cooker and how much she dislikes using an electric stovetop. Did you always know that a conversation about stovetops would be the way into the story?</strong></p><p>Absolutely not! I knew what I wanted to write about, but I had to wait for that surprise cooker nugget before I could get going. Climate change is such awkward, intractable subject matter. Statistics or moralizing or showing a polar bear in trouble won’t do, and the usual dystopian story is way too comfortable, as it dodges the present moment. Here, I had the ideal cover: two older women chatting about their cookers.</p><p><strong>The story is as much about mortality as it is about stoves. Tracey, worried about her recently retired husband’s heart, is going to a CPR workshop, and Lois is on her way to visit her elderly mother. They’ve reached a time in life when the future is almost certainly going to be shorter than the past. How much does Tracey think about this?</strong></p><p>“Every third thought” was what Prospero said when he retired! Tracey is clearly a seventeenth-century sort of girl, when they wrote particularly beautifully about mortality, as can be seen from the quotations that swim into her mind during the story. But Tracey has probably always thought about this. She knows things wear out eventually, including our bodies. She knows we live in time. And as for the future looking shorter than the past? That description equally well applies to our probable timeline on this planet, the way things are progressing.</p><p><strong>CPR, it turns out, has a low rate of success. Do you think the workshop teacher ever despairs of the possible futility of her classes?</strong></p><p>Probably not. It’s never a bad thing to share the facts, and knowing about the low odds for successful resuscitation may mean less self-recriminating grief in future days for those who happen to be present at such a scene. Surely anybody would want to know they did what they could to help in such an emergency? During the pandemic, an American friend told me that <em>COVID</em> was known by the young ones in her circle as the “Boomer Remover”—a title which might actually prove more accurate for the world’s new silent assassin, extreme heat. We are in for a big increase in summer heart attacks, as many of these are brought on by preëxisting health conditions reacting to the shift in temperature. The CPR classes could even prove to be a profitable growth area for Weary.</p><p><strong>Later that day, Tracey joins a real-estate agent, Ollie, to look at a flat. She and her husband are thinking about moving into a smaller space. “Downsize and Die,” Ollie says they call it in the office, before catching himself. For Tracey, this is a line to share with Lois. Would aging be a lot grimmer without an old friend like this?</strong></p><p>Oh, but surely friends are the flower of life all the way through! Having two or three people on the same wavelength is the ultimate luxury, whether you’re twenty-three or forty-six or ninety-two. Though you’re right—old friends become rarer as the big scythe starts to swish more frequently. And, while you can make new friends, by definition it’s impossible to make new <em>old</em> friends—so you lose your shared past as well.</p><p>The unusual thing about Tracey and Lois is that, as well as communicating via WhatsApp, they’ve actually managed to meet IRL and exchange an IRL hug.</p><p><strong>In “Lub Dub Lub Dub Lub Dub,” it’s still only May, but London is roasting. The story reflects this year’s spring in London—and much of the U.K. has experienced heat wave after heat wave this summer. How much does the weather unsettle Tracey?</strong></p><p>The British Isles are famed for their cloud cover and drizzle, so we had somehow assumed the weather gods would stop at the Channel. We were wrong. Hardly anybody has air-con, or knows how to deal with the prolonged heat now that it’s here, and London feels like the hottest place in the country. Nurses are fainting on the wards, children are flopping onto their desks at school. It’s been the scariest summer of Tracey’s life.</p><p><strong>In 2009, we published your story “<a href=\"https://www.newyorker.com/magazine/2009/12/21/diary-of-an-interesting-year\" target=\"_blank\" rel=\"noopener\">Diary of an Interesting Year</a>,” which is set in the Britain of 2040, some time after, we’re told, “the Big Melt.” There’s food rationing, enforced car-sharing (until fuel is cancelled for civilian use), no internet, and it’s raining most of the time. It’s a dark, but often very funny, story about the aftermath of climate catastrophe. Seventeen years on, do you think about that story much? Does the vision of 2040 hold up?</strong></p><p>Yes to both questions, unfortunately. I’d done a lot of climate-science reading and found it hard and depressing, but that was the only way then to be able to write with any convincing power toward “<a href=\"https://www.amazon.com/Flight-Entertainment-Stories-Helen-Simpson/dp/0307595587\" target=\"_blank\" rel=\"noopener\">In-Flight Entertainment</a>,” my 2010 story collection. With different stories I tried different ways into the subject: sales pitch, various love conflicts, death-on-a-plane in first class—and this dystopian black comedy. I set the story thirty years ahead, a time gap easy enough for the imagination to leap via younger friends or children or grandchildren: think of them at whatever age they’ll be in thirty years’ time.</p><p>Yes, that was seventeen years ago, which leaves only fourteen years to the Big Melt of 2040. In Ian McEwan’s latest novel, “<a href=\"https://www.amazon.com/What-We-Can-Know-Novel/dp/0593804724\" target=\"_blank\" rel=\"noopener\">What We Can Know</a>,” it’s 2042 when the Great Inundation floods the U.K.; I can’t have been too far off the mark. It’s not that improbable, 2040, even though it’s now so uncomfortably close. Yikes. ♦</p>"},{"title":"GTA 6 life simulation elements confirmed: thank god, we can turn the offensively hot Jason and Lucia into exhausted slobs like the rest of us","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/gta-6-life-simulation-elements-confirmed-thank-god-we-can-turn-the-offensively-hot-jason-and-lucia-into-exhausted-slobs-like-the-rest-of-us","category":"gaming","categoryLabel":"Gaming","wordCount":502,"readingTime":3,"content":"<p>Diet, exercise and sleep will affect your appearance</p>\n    \n  \n  \n  \n\n            <p>If you think <a href=\"https://www.rockpapershotgun.com/the-anti-heroes-of-grand-theft-auto-6-look-sexy-and-dull\" target=\"_blank\" rel=\"noopener\">the protagonists of Grand Theft Auto 6 look dull as piping hot ditchwater</a> then rejoice, friend, for the game will let you transform these gung-ho sex magnets into weary and despairing zombies, tottering along the shore of Leonida with eyes like sandy latrines and skin like forgotten cheese.</p>\n<p>We shall coax muffin tops from those rock hard abs, and fray those thrusting thighs to sticks of soggy cobwebs. We will neglect those shiny biceps to the point that our characters cannot raise a high five, let alone hold a pistol level. We will drag those pneumatic physiques down into the stagnant lagoons of normality. We will make them look like US. And we will laugh, laugh. All of which is to say that <a href=\"https://www.rockpapershotgun.com/gta-6-everything-we-know\" target=\"_blank\" rel=\"noopener\">GTA 6</a> simulates the effects of exercise, sleeplessness, and diet (including, I think, recreational drugs like booze) – an elaboration of similar life simulation elements in the ancient <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto-san-andreas\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto: San Andreas</a>. Yes, I may have gotten slightly carried away.</p>\n<p>The news comes in the form of a write-up from <a href=\"https://www.dazeddigital.com/life-culture/article/70859/1/gta-6-grand-theft-auto-vi-rockstar-exclusive-deep-dive-game-unparalleled-world\" target=\"_blank\" rel=\"noopener\">Dazed</a>. Without being too unkind to Dazed, who are targetting a non-specialist audience, it's a puff piece. There's some coy indulgence of the long-buried debate over whether Games Are Art, and a bunch of flavourly nothings from Rob Nelson, Rockstar North head of development - for example, “we want to enable as much self-expression as possible, without losing the essence of the characters\".</p>\n<p>There are a few more concrete development insights. Rockstar have an embedded team in Miami, the inspiration for the game's Vice City, to study the habits of the residents. There's a bit of commentary on the music and the game's \"fashion ecology\". I could see myself using GTA 6 as a springboard to learning more about fashion. Once I'm done reducing Jason and Lucia to gibbering wrecks, anyway.</p><p>The only other pressing detail is how switching characters will play into the romance and couple dynamics between Jason and Lucia. The example given is switching between driver and passenger seat, while heading out to a job: you can have your AI partner drive you while you check in-game social media. I will ask the obvious question: can we switch characters while they're bumping uglies? Or is that strictly the province of cutscenes?</p>\n<p>Going by the <a href=\"https://www.rockpapershotgun.com/a-playable-build-of-gta-6-appears-to-have-leaked-as-rockstar-and-take-two-scramble-to-take-down-videos\" target=\"_blank\" rel=\"noopener\">recent leaks</a>, GTA 6 does have a fair bit of nudity, together with saucy activities such as lapdances, but I imagine letting players literally fuck themselves might rouse <a href=\"https://www.rockpapershotgun.com/how-payment-networks-control-the-definition-of-acceptable-sex-in-videogames\" target=\"_blank\" rel=\"noopener\">the ire of those incorrigible payment processors</a> and their <a href=\"https://www.rockpapershotgun.com/anti-porn-group-who-tried-to-ban-gta-5-claim-credit-for-steams-sex-game-crackdown\" target=\"_blank\" rel=\"noopener\">grassroots activist friends</a>. Only kidding – <a href=\"https://www.rockpapershotgun.com/itchio-apologise-for-frustration-and-confusion-after-delisting-thousands-of-nsfw-projects\" target=\"_blank\" rel=\"noopener\">blocking a bunch of Itch.io visual novels</a> is one thing, but there's no way Mastercard and Stripe are going to forgo their cut of GTA 6 sales.</p>\n<p>There's a lot of GTA 6 news in the wilds, especially now that Rockstar have <a href=\"https://www.rockpapershotgun.com/rockstar-finally-break-silence-on-heartbreaking-gta-6-leak-say-its-unfortunate-that-the-intended-game-experience-may-now-be-impacted-by-some-spoilers\" target=\"_blank\" rel=\"noopener\">confirmed</a> that the recent leaked videos are legit, and there's more to follow: this evening, Netflix will host an extended screening.</p>"},{"title":"Advocate John Roberts v. Chief Justice John Roberts","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/09/01/advocate-john-roberts-v-chief-justice-john-roberts/","category":"law","categoryLabel":"Law","wordCount":671,"readingTime":4,"content":"<h2><a href=\"https://reason.com/volokh/2026/09/01/advocate-john-roberts-v-chief-justice-john-roberts/\" target=\"_blank\" rel=\"noopener\">Advocate John Roberts v. Chief Justice John Roberts</a>\n\t\t\t\t\t<p>How do you know what a lawyer really believes when he is always representing a client?</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t9.1.2026 11:57 PM\n</p>\n\t</h2>\n\t\n\t\t<p>One of the greatest challenges with judicial selection is knowing what a lawyer actually believes. How do you know what a lawyer really believes when he is always representing a client?</p>\n<p>For sure, lawyers at firms are largely hired guns. They'll take whatever paying client comes through the door. Indeed, whenever a lawyer takes a case, he has plausible deniability: I zealously represented my client, without regard to whether I agreed with the cause. How, then, do you know what a lawyer really believes?</p>\n<p>You cannot give any weight to clerkships. Those who seek to clerk on the Supreme Court can often fake their politics to get through the gates--and I'm not talking about so-called counter-clerks. Brass rings are neither red nor blue. Dana Remus clerked for Justice Alito, and then served as President Biden's White House Counsel. Eric Miller clerked for Judge Silberman and Justice Thomas, and was appointed by President Trump to the Ninth Circuit, yet he consistently votes opposite the conservatives on that court. There are many more such examples.</p>\n<p>Maybe you could see what sorts of pro bono cases a lawyer takes. But still, lawyers at firm are often nudged to take certain cases or discouraged from taking other cases. Remember that John Roberts <a href=\"https://www.latimes.com/archives/la-xpm-2005-aug-04-na-roberts4-story.html\" target=\"_blank\" rel=\"noopener\">provided pro bono assistance</a> to the <a href=\"https://www.hrc.org/press-releases/roberts-role-in-gay-case-re-emphasizes-need-for-full-examination\" target=\"_blank\" rel=\"noopener\">plaintiffs in <em>Romer v. Evans</em></a>. Pro bono is not always a reliable indicia of what a person believes.</p>\n<p>Maybe you could give special credit to lawyers who take political appointments in government service. But again, not really. Government lawyers have clients, just like everyone else. Moreover, government lawyers who seek higher office will go along to get along. Amit Argawal clerked for Judge Kavanaugh and for Justice Alito, then served as Solicitor General of Florida under Attorney General Pam Bondi. When he argued <em>Slaughter</em>, people thought he could brandish conservative bona fides. Yeah right. Now Argawal works for <a href=\"https://protectdemocracy.org/people/amit-agarwal/\" target=\"_blank\" rel=\"noopener\">Protect Democracy</a>, a leading liberal firm that opposes President Trump.</p>\n<p>This background brings me to (who else) John Roberts.</p>\n<p>Way back in September 1990, when Roberts was the Principal Deputy SG, he joined Ken Starr's <a href=\"https://reason.com/wp-content/uploads/2026/09/1990-09-07-Rust.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> in <em>Rust v. Sullivan</em> which argued that \"<em>Roe</em> was wrongly decided and should be overruled\" because there's \"no support in the text, structure, or history of the Constitution\" for a right to an abortion. Did Roberts actually believe this? Or did he just sign it because that was the office's position. As Judge James Ho pointed out in a recent National Review <a href=\"https://www.nationalreview.com/2026/08/clarence-thomas-going-further-by-standing-alone/\" target=\"_blank\" rel=\"noopener\">essay</a>, Roberts disavowed anything he signed as a lawyer: \"I do not believe it is proper to infer a lawyer's personal views from the position taken on behalf of a client.\" Of course, when push came to shove, Roberts upheld <em>Roe</em> in <em>Dobbs</em>.</p>\n<p>So I return to my principal question. When <em>everything</em> a lawyer does is on behalf of  client, how do we actually know what the lawyer believes? The ballroom case leads to another example.</p>\n<p>Deputy Solicitor General John Roberts argued <a href=\"https://www.oyez.org/cases/1989/89-640\" target=\"_blank\" rel=\"noopener\"><em>Lujan v. National Wildlife Federation</em> </a>(1990)--not to be confused with the landmark decision of <a href=\"https://www.oyez.org/cases/1991/90-1424\" target=\"_blank\" rel=\"noopener\"><em>Lujan v. Defenders of Wildlife</em></a> (1992). Did Deputy SG Roberts personally want to narrow Article III standing? I would think so. In a 1993 article in the Duke Law Journal, Roberts favored a <a href=\"https://scholarship.law.duke.edu/cgi/viewcontent.cgi?article=3224&amp;context=dlj\" target=\"_blank\" rel=\"noopener\">narrow reading</a> of Article III standing. In <em>Massachusetts v. EPA</em>, Chief Justice Roberts favored a narrow reading of standing. So what does Roberts actually think about standing?</p>\n<p>Well, in the ballroom case, he found a person who walks near Lafayette Park is sufficiently injured to stop the construction of a military facility. Roberts dismissed the national security concerns in a bogus footnote.</p>\n<p>What exactly does Roberts believe here? Is there a difference between John Roberts the advocate and John Roberts the judge?</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/09/01/free-speech-unmuted-the-process-is-the-punishment-abc-v-fcc-with-stuart-benjamin/\" target=\"_blank\" rel=\"noopener\">NEXT: Free Speech Unmuted: The Process Is The Punishment: ABC v. FCC with Stuart Benjamin</a>\n    </p>"}];
