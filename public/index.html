<script>
var articles = [{"title":"The Afterlife of Diana’s Revenge Dress","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-lede/the-afterlife-of-dianas-revenge-dress","category":"fun","categoryLabel":"Interesting Reads","wordCount":971,"readingTime":5,"content":"<p>On the evening of June 29, 1994, an audience of more than fourteen million people in the U.K. tuned in to watch a two-and-a-half-hour documentary about the then Prince of Wales: “Charles: The Private Man, the Public Role.” The film was made by Jonathan Dimbleby, one of the nation’s foremost broadcasters, who had spent more than a year in the company of the future King, travelling with Charles on official visits abroad, and observing him relaxing at Balmoral, the royal estate in the Highlands. For viewers, there was much intimacy to absorb—the sight of Charles sprinting, his kilt flaring, during a loch-side game of hide-and-seek with his young sons, Princes William and Harry, was one unexpected example. But the most highly anticipated section of the film came about an hour in, when Dimbleby carefully but firmly quizzed the future monarch about the breakdown, two years earlier, of his eleven-year marriage with Diana, the Princess of Wales. Dimbleby addressed head on the widespread speculation about the extent of Charles’s marital infidelity with Camilla Parker Bowles, a onetime girlfriend who was married at the time to Andrew Parker Bowles, a British Army officer with close royal ties. Had the Prince tried to be faithful to his wife when he made the vow of marriage? “Yes, absolutely,” Charles replied. He went on to assert that he <em>had</em> been faithful to Diana—“until it became irretrievably broken down, us both having tried.”</p><p>Despite sounding as if he were translating from the Latin original, the admission was extraordinary. Monarchs-to-be don’t usually explain their private choices: Charles’s mother, Queen Elizabeth II, never sat down for an inquisition of the sort that her son had invited. The documentary was Charles’s P.R. gamble—an effort to present himself as a thoughtful future King and as an involved single father during what, in the early nineteen-nineties, had become known as “the War of the Waleses.” It was followed by the publication of Dimbleby’s authorized biography, a six-hundred-twenty-page doorstopper in which the index for references to Diana—including entries for “attempts to control the Prince’s life,” “resentment of the Prince’s interests,” and “persuades the Prince to drop some of his friends”—encapsulates the intended messaging from the Prince’s court.</p><p>Among those <em>not</em> watching the broadcast on that summer’s evening was the Princess of Wales. She was, instead, attending a gala for the Serpentine Gallery, in Kensington Gardens, of which she had become a patron. (She wasn’t interviewed for the film, though, in an unrelated video recording that was later made public, she once gave a differing account of Charles’s attitude to his marital obligations: “He said, ‘I refuse to be the Prince of Wales that never had a mistress.’ ”) Diana usually expressed herself through symbolic gestures rather than tortuously constructed sentences, and her choice of outfit for the Serpentine gala was proof of her <a href=\"https://www.newyorker.com/magazine/1997/09/22/dianas-relics\" target=\"_blank\" rel=\"noopener\">instinct for iconography</a>. The dress—designed by Christina Stambolian, whom she had met while out shopping with her younger brother, Charles, the ninth Earl Spencer—had languished unworn in Diana’s wardrobe for three years. Fashioned from pleated silk, it featured an off-the-shoulder neckline, a plunging décolletage, a tight bodice, and an asymmetrical hemline cut well above the knee, with a chiffon sash. Seen in motion as she strode past the cameras, the garment’s labile folds evoked the classical draperies of Diana’s namesake goddess, albeit in movie-star black.</p><p>After years of wordlessly revealing her misery through her unmissable weight loss, hunched posture, and occasional tears, Diana materialized that evening in a different form: potent and gleaming, in high heels and semi-sheer black tights, around her neck a pearl choker incorporating a monster diamond-and-sapphire brooch that had been a wedding present from Charles’s grandmother, the Queen Mother. The garment was swiftly and indelibly described by the press as Diana’s “revenge dress.” Whatever the complexities of Diana’s early-nineties, post-separation existence, the dress seemed to suggest that its wearer (still, crucially, the wife of the next King and the mother of the one after that) was living her best life, though we didn’t yet use that expression. It was an outfit that seemed calculated to make any observer wonder what sort of man would choose Camilla—with her habit of tweedy, outdoorsy, utilitarian dressing—over this vibrant, glamorous beauty.</p><p>A little more than three years later, the Princess <a href=\"https://www.newyorker.com/magazine/1997/09/15/requiem-clive-james\" target=\"_blank\" rel=\"noopener\">died</a> in a late-night car crash in Paris; now, as we approach the thirtieth anniversary of that occurrence, a wave of Diana-related memoirs, documentaries, and other events is mounting. In September, Charles Spencer published a memoir, “<a href=\"https://cna.st/affiliate-link/8R1h8mj7jPeedMvbkfLCDtXVyrsc3LHGggMgRm66RqxGtfzMo9bgB9jTqRr4HQXB34hZRdKDFT29ZdYi9kNS6UpHwmRMDHjMZPQLbnfgYL9M5eTA2NG2QUcvUMpLvoZRknaYTtCmdgiCda5wqdSGSAPE41aL83EFHZSFhsv24kN1uvzvhQsGeabe8KzypLzDKamurYtftrK4wXDXQwMmNDLzqaabmiEZ4mf13ME9gyJEtrfqRCA5j8KFikHwm9qsmQFmgPqVE6FhjBZyFRRHuYA9wD6mrQBVgoi1Qoa3BwHR5AksCrYRe8MUKiQqkYgBxqofdgXSBHMn8BfNyDvumgc6vWiBzQs1nfL53d8oSz\" target=\"_blank\" rel=\"noopener\">Swan Song,</a>” in which, controversially, he recalls that Charles had sounded “giddily elated” during a phone call the morning after the crash, and in a later conversation about funeral arrangements, told Spencer of his sister, “We’ll forget her soon enough.” (“His Majesty is mindful that the pain of fraternal grief can cloud reason, affect judgment and colour memory in ways others do not recognise,” a Palace spokesperson commented, in a statement.) Prince Harry is said to be sounding out potential interviewees for his own prospective documentary, though other key players in the story may be less than eager to sit down with the <a href=\"https://www.newyorker.com/magazine/2023/01/23/prince-harry-memoir-spare-review\" target=\"_blank\" rel=\"noopener\">best-selling author</a> of “<a href=\"https://cna.st/affiliate-link/2EvexLQGf2tBX5BxpQ9wzoYxCJFD46BR5NxiRLNwSidG47ES4PUaTANjXzP29cD3fHMfNvechH9ZqyJvRCtZJfXWGbWtWHCbbYFg4yAo5vEGU6ZNfTDoaR8Zq2ktNYtUFZqVDEfSTJVzqyqN46cN7qY5d1qGaa96aVwDG7s3WpDzLvj1ETXyGV3Tsvtzu7rqKxNhER9B2mDmN2Fq8MruDQESZUCJtmdjoPc8nbmf1yu76iocxseNQvUxijRpM25JLnPxnNbqJSaaZpifRdi3wVfxjtjSoVJ6VoBB3ToJCuZVG3aPAaZ879Krpw2nXYfJaRwaHjjbMxKbhSCqsEczPT54q2WGQ5GFF9GaxqCQra27zkFhUxTU\" target=\"_blank\" rel=\"noopener\">Spare</a>.” Sotheby’s in New York is getting a jump on the anniversary action by offering the revenge dress itself in a special auction in December, after an exhibition tour through London, Hong Kong, and Geneva. The garment was one of seventy-nine that Diana offered in an auction at Christie’s in June, 1997, to raise funds for <em>AIDS</em> and cancer charities; it is now being sold by a Scottish couple named Graeme and Briege Mackenzie, who had purchased it for around sixty-four thousand dollars. The current presale estimate of between a hundred and fifty thousand dollars and three hundred thousand dollars is confidently expected to be smashed when the dress comes under the hammer.</p>"},{"title":"Justices consider when a constitutional rule is “previously unavailable” to prisoner ","source":"SCOTUSblog","author":"Zachary Shemtob","url":"https://www.scotusblog.com/2026/11/justices-consider-when-a-constitutional-rule-is-previously-unavailable-to-prisoner/","category":"law","categoryLabel":"Law","wordCount":1304,"readingTime":7,"content":"<p>The Supreme Court on Wednesday <a href=\"https://www.supremecourt.gov/oral_arguments/audio/2026/25-1003\" target=\"_blank\" rel=\"noopener\">heard argument</a> in <a href=\"https://www.scotusblog.com/cases/guerrero-v-johnson/\" target=\"_blank\" rel=\"noopener\"><em>Guerrero v. Johnson</em></a>, a case <a href=\"https://www.scotusblog.com/2026/10/justices-to-debate-when-an-established-rule-is-previously-unavailable-in-prisoner-habeas-cases/\" target=\"_blank\" rel=\"noopener\">about</a> whether a Texas man on death row can bring a second federal post-conviction challenge to his sentence by arguing that, under updated psychiatric standards, he was found intellectually disabled and therefore cannot be executed.</p><p>Except in a few narrow circumstances, the <a href=\"https://www.congress.gov/bill/104th-congress/senate-bill/735\" target=\"_blank\" rel=\"noopener\">Antiterrorism and Effective Death Penalty Act of 1996</a> bars prisoners from filing a petition for federal post-conviction relief challenging the grounds for their detention when an earlier petition has already been rejected. One of these exceptions is when such a claim relies on “a new rule of constitutional law, made retroactive to cases on collateral review by the Supreme Court, that was previously unavailable.” The other is if facts “underlying the [initial] claim” would show “by clear and convincing evidence that, but for constitutional error, no reasonable fact finder would have found the applicant guilty of the underlying offense.”</p><p>In 2007, Dexter Johnson was convicted of capital murder and sentenced to death for his role in the double murder of 23-year-old Maria Aparece and 17-year-old Huy Ngo. Five years before his conviction, the Supreme Court held in <a href=\"https://supreme.justia.com/cases/federal/us/536/304/\" target=\"_blank\" rel=\"noopener\"><em>Atkins v. Virginia</em></a> that executing people with intellectual disabilities violates the Eighth Amendment. A defense expert at Johnson’s trial concluded that, under the diagnostic standards employed at the time, Johnson was not intellectually disabled. Following his conviction, Johnson filed an initial habeas petition and invoked <em>Atkins</em> to argue – unsuccessfully – that its protections should extend to people with mental illness.</p><p>In May 2013, while Johnson’s first federal petition was pending, the American Psychiatric Association published the <a href=\"https://www.psychiatry.org/psychiatrists/practice/dsm/\" target=\"_blank\" rel=\"noopener\">DSM-5</a>, a new edition of its diagnostic manual that deemphasized IQ cutoffs. Texas’ highest criminal court adopted this in 2018. In 2019, Johnson scored 70 on an IQ test, and an expert concluded he met the DSM-5’s criteria for intellectual disability. Johnson then filed a successive habeas challenge in the district court claiming that he could not be executed under <em>Atkins</em>. The trial court subsequently ruled that his claim (based on the later diagnostic criteria) had been “previously unavailable,” and the U.S. Court of Appeals for the 5th Circuit <a href=\"https://cdn.sanity.io/files/pito4za5/production/12a48eb41de12b83f3008ba52bad200db03afaea.pdf#page=45\" target=\"_blank\" rel=\"noopener\">affirmed</a> that decision. The 5th Circuit denied rehearing, and Texas came to the Supreme Court, which agreed to hear the case in June.</p><p>At oral argument, Texas Solicitor General William Peterson <a href=\"https://www.supremecourt.gov/oral_arguments/argument_transcripts/2026/25-1003_c9dh.pdf#page=5\" target=\"_blank\" rel=\"noopener\">told</a> the justices that Congress “chose to allow new claims in these applications only in limited circumstances that do not include changes in the diagnostic standards for intellectual disability.” There is no “new rule” “previously unavailable” here, because <em>Atkins</em> was decided before Johnson “even committed his crimes,” Peterson said.</p><p>Justice Elena Kagan pressed Peterson on why the DSM “isn’t … part of the law?” She suggested that the DSM-5 effectively created “a kind of <em>Atkins </em>I and an <em>Atkins</em> II” – first, a rule barring the execution of people with intellectual disabilities, followed by a “substantive standard” defining what it means to be intellectually disabled. Kagan later described the <em>Atkins</em> standard as akin to a rule with a “big gap in it” where “the DSM comes and plugs it in and it becomes part of the legal standard.”</p><p>The justices further debated what it means for a rule to be “available.” Kagan suggested, based on prior precedent, that something is “not available to you” if it makes you “run into a brick wall.” “[I]f I was going to be [previously] laughed out of court,” she said, “then, really, the rule was unavailable to me.”</p><p>Justice Ketanji Brown Jackson told Peterson that, as she understood AEDPA, Congress’ “policy choice was to give individuals one clear shot at bringing their constitutional claims.” Under Texas’ interpretation, she said, “Mr. Johnson will never get that opportunity,” which “seems like a really incongruous consequence.”</p><p>Justice Sonia Sotomayor, for her part, suggested that the outcome should turn on something like ripeness (whether a case is sufficiently developed for a court to decide). As she remarked to Peterson, “[i]f what we have said under <em>Atkins</em> is you cannot execute someone who is mentally ill, we have a certain way of determining that, and it doesn't become ripe until the DM-5 makes it ripe.”</p><p>Justice Brett Kavanaugh asked Peterson whether the court “could resolve this case solely on the new rule issue without addressing ‘previously unavailable.’” Peterson said it could, but that Texas was asking the court to decide the “previously unavailable” question.</p><p>On behalf of Johnson, Jeremy Schepers told the justices that “existence and availability aren’t the same thing.” <em>Atkins </em>existed, but Johnson’s claim – based on the change in diagnostic criteria – was not previously available. When the clinical standards for intellectual disability change, Schepers argued, “the Eighth Amendment’s protected class potentially changes as well. And in those rare circumstances, that can render a rule legally available for the first time.”</p><p>Justice Clarence Thomas was skeptical, asking, “Does <em>Atkins</em> ever stop being a new rule?” Schepers responded that <em>Atkins</em> “remains new now.” “What about <em>Marbury v. Madison</em>?” Thomas responded. Justice Amy Coney Barrett noted that when “Alexander Graham Bell invented the telephone, that was new.” But “I don't think anybody would describe the telephone as new today.”</p><p>Kavanaugh pointed Schepers to a “friend of the court” <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-1003/418343/20260806171321625_25-1003%20Amicus%20Brief.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> filed by Louisiana and 21 other states, which argued that because the medical standards are “constantly evolving,” Johnson’s position is “a recipe for eternal <em>Atkins</em> claims and zero finality.” Schepers said that was incorrect, because a state prisoner gets “one opportunity to raise any claim,” and “so a prisoner could not raise a second <em>Atkins </em>claim.”</p><p>At one point, Justice Samuel Alito asked about a future edition of the DSM that “makes smaller changes” that “provide a greater opportunity for success.” Schepers said that claim would fail under the 5th Circuit’s reading, because “[i]t’s only a question of whether the claim had a possibility of merit before.”</p><p>Emily Ferguson, an assistant to the U.S. solicitor general who argued as a “friend of the court” in support of Texas, emphasized that it is “difficult to imagine Congress enacting a law that would allow the American Psychiatric Association, without independent action of this Court, to create a new rule of constitutional law.” She also noted that the court had made clear “states would be responsible for the method of determining intellectual disability,” and it would then make little “sense for there to be an available successive application anytime the relevant state had a new … supreme court case … or even a state lower court case that changed the framework that the state was using.”</p><p>Alito asked Ferguson whether the “<em>Atkins </em>rule” was “that a person may not be executed if the person has an intellectual disability that is regarded as such by medical professionals,” or if “it is that a person may not be executed if the person has an intellectual disability that can't be justified by the recognized purposes of punishment,” for which “the DSM would be evidence but not part of the standard itself?” Ferguson responded that the “latter formulation captures what … the <em>Atkins</em> Eighth Amendment rule was.”</p><p>Perhaps the most noticeable takeaway from oral argument was how subdued the justices were. The chief justice did not ask any questions, and no justice appeared to take up Johnson’s request in his <a href=\"https://www.supremecourt.gov/DocketPDF/25/25-1003/424918/20260918165241257_Guerrero%20v%20Johnson%20-%20Merits%20Brief.pdf\" target=\"_blank\" rel=\"noopener\">brief</a> that the court dismiss the case as improvidently granted (that is, decide that it was a mistake to have agreed to hear the case in the first place and not resolve it), as the court did last term in <a href=\"https://www.scotusblog.com/cases/hamm-v-smith-4/\" target=\"_blank\" rel=\"noopener\"><em>Hamm v. Smith</em></a>, another <em>Atkins</em> case.</p><p>A decision is expected by late June but is likely to come earlier. </p><p><strong>Recommended Citation: </strong>Nora Collins &amp; Zachary Shemtob, <em>Justices consider when a constitutional rule is “previously unavailable” to prisoner </em>, SCOTUSblog (Nov. 6, 2026, 1:07 PM), https://www.scotusblog.com/2026/11/justices-consider-when-a-constitutional-rule-is-previously-unavailable-to-prisoner/</p>"},{"title":"\"Whether he means to or not, he serves sass all over town.\" Our regular feature where we ask: what have you been playing this week?","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/what-weve-been-playing-sass-all-over-town-link-ocarina","category":"gaming","categoryLabel":"Gaming","wordCount":738,"readingTime":4,"content":"<p>A few of the things that have us hooked this week.</p>\n    \n  \n  \n  \n\n            <h2>14th November</h2>\n<p>Another week has climaxed and I'm so sorry you had to read that on a Saturday morning. But here we are again, with our regular feature, where we talk about what we've been playing in order that you do too. This week, Marie has been staring at monster butts; Connor has capitulated to World of Warcraft; Kelsey is discovering the joys of a beloved Zelda game for the first time; and Bertie enjoys someone being punched in the face, because I guess he's that sort of person?</p>\n<p>But enough about us, what about you? What have <em>you</em> been playing this week? Do tell all! And don't forget we have <a href=\"https://www.eurogamer.net/topics/what-weve-been-playing\" target=\"_blank\" rel=\"noopener\">an entire archive of previous What We've Been Playings</a> for your leisurely perusal, just in case you forgot what you were playing a year or a month or a week ago. And now onward!</p>\n<h2>The Legend of Zelda: Ocarina of Time, Switch 2</h2>\n\n<p>My favourite thing so far about Ocarina of Time is the judgement plastered on little Link's face when he encounters, well, almost everyone. Whether he means to or not, he serves sass all over town, and in Kakariko Village, and I am very much here for it.</p><p>Also, I wasn't prepared to come face-to-face with a monster's butt cheeks. At all. Imagine the scene: I'm enjoying the tunes of the Lost Woods, processing the changes that have happened to Hyrule in the last seven years, all while making my way to the Forest Temple. Then the Moblin's turn their backs to reveal... Well, everything.</p>\n<p>-<em>Marie</em></p>\n<h2>World of Warcraft: Forever, PC</h2>\n\n<p>This week I've spent an ungodly amount of time playing World of Warcraft: Forever (you may have read <a href=\"https://www.eurogamer.net/world-of-warcraft-forever-now-playing\" target=\"_blank\" rel=\"noopener\">my preview</a> on the website) and have been essentially glued to it during every minute of free time I've had away from work. I've got both my main professions above the level 225 mark and I'm firmly in the thick of it now. Levels take longer, items are actually getting good, and I've had to make a second alt character for extra bank space.</p><p>As a result, I've not been to the gym in a while. I actually got one of those emails asking why I've fallen off, offering some tips to get back into the routine. Sorry Nuffield Health, my sleep schedule is ruined and I've substituted proper workouts for squats and basic at-home cardio. Surely, this can't go wrong...</p>\n<p><em>-Connor</em></p>\n<h2>The Legend of Zelda: Ocarina of Time, Switch 2</h2>\n\n<p>I don't have the same level of nostalgia for Ocarina of Time that my peers do, but that has not stopped me from enjoying every minute of running around Hyrule smashing pots and trying not to cry over the touching cutscenes and, well, Saria.</p><p>The game feels like Dark Souls for children (endearing) and that is completely my jam. It's magical, satisfying, and often sad. There's creepy enemies as well as cute ones, trap floors and doors, mysterious NPCs... and my heart just feels so warm whenever I'm playing it. My fingers are now crossed that there's a <a href=\"https://www.eurogamer.net/games/the-legend-of-zelda-majoras-mask\" target=\"_blank\" rel=\"noopener\">Majora's Mask</a> remake in the pipeline over at Nintendo. (As well as a <a href=\"https://www.eurogamer.net/games/super-mario-64\" target=\"_blank\" rel=\"noopener\">Super Mario 64</a> remake, which I admit, is pushing it. But for what it’s worth, I'd probably sell my soul to see it get the Ocarina treatment.)</p>\n<p><em>-Kelsey</em></p>\n<h2>Fire Emblem: Fortune's Weave, Switch 2</h2>\n\n<p>It takes me a while to settle with games; it takes me a while to settle full stop. I suppose in Fire Emblem's case I'm out of touch, seeing as the last instalment I played was on 3DS. But I struggled with the garish enthusiasm early on and the whole thing seemed overly simple. Nevertheless, I've settled a bit now, and now that the game's layering on more strategy and Intelligent System's expertise is coming to the fore, I'm beginning to enjoy myself much more.</p><p>I wasn't expecting it to be quite so boobsy, though. Was Fire Emblem always this way? Perhaps it's my fault for picking the scantily clad queen Theodora, though that sort of presentation isn't reserved only for her. She's no wallflower, though. My favourite moment so far was when she got off her elephant during a parade - yes, her elephant - and walked over to punch a teenage boy in the face for halting proceedings. Apparently she was doing him a favour.</p>\n<p><em>-Bertie</em></p>"},{"title":"Canon Promo Codes: 30% Off for November 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/canon-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1159,"readingTime":6,"content":"<p>If you know photography, you know Canon. This super-advanced, often pricey gear is made more affordable through the ways to save at Canon we’ve found below. Some of the best ways to save on cameras, printers, accessories, and more come during the Canon holiday sales, with our 10% off Canon promo code and student discounts on some of the best WIRED-tested <a href=\"https://www.wired.com/gallery/best-mirrorless-cameras/\" target=\"_blank\" rel=\"noopener\">cameras</a>, <a href=\"https://www.wired.com/gallery/best-printers/\" target=\"_blank\" rel=\"noopener\">printers</a> nd even if you’re a novice, there are easy-to-use automatic exposure and scene modes like “movie” for close-up demo, smooth skin, movie mode, and color filters.</p><h2>Get New Canon Deals in 2026</h2><p>The Canon deals just keep rollin’ in. Some of the best rotating <a href=\"https://www.usa.canon.com/pro/deals\" target=\"_blank\" rel=\"noopener\">Canon deals</a> are $350 in savings when you buy a Cinema EOS C80 Series Camera Body or Cinema EOS C80 Series Lens Kit, $50 in savings when you purchase a XA75 Professional Camcorder, and $300 in savings when you buy a CR-N500 Series PTZ Remote Camera.</p><p>Gear can make or break your home office setup. Here’s our ultimate list of nearly 100 items, from monitors and desks to webcams and chairs.</p><p><a href=\"https://cna.st/p/YgEK7CGHVcmdjto2ZDz8bzRXfAAiPRVqH6N6uxgoFg2f9jYyXnQ2ZVM7RsQJfp8Kax4UbjsfjkBzZX4ZiiNwit6VmihWeaP7jkjrmePgoN8ZCAWs3bor8GRwx4P8McJzKNsunTTgQwoiQF3YwD7TK4EuuvAJmyVRWQnKYpRzxkKqUxRuNs4hLGjBJ1HRd4rkQi8J7yaMpxLJg1ScADEt8QMEcPHmxhGevJpQ4yGhTrg2APGTsiktResfQS2QGqrh5RPnwixYmy9Lx3M1MSWgPYFQ1cBHYrSyt9vgDfpiBQuHUTzBjzEE2tAS2YUbTUfmHRrrqqDMQSMk8g1jBxzq3diocbJrWapmFm2V5ML9HCdvGU8EDP8QAucuKh8JG1fTKsS76DpTWdgzasVwgMkvbJ44vTtGF7K21F3\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Canon</p><p>Canon</p><h3>PowerShot G7 X Mark II</h3><p>Canon point-and-shoot camera.</p><h2>Canon Pros and Students Get up to 30% Off</h2><p>If you’re really serious about upping your camera game, there’s the Gold level membership, which costs $100 a year and offers members 20% off repairs on up to 10 products and complimentary maintenance on up to 5 items. Platinum is next, at $300 per year, and it offers 30% off repairs on up to 15 products and maintenance covered on 10 products. The top level is Cinema, which costs $1,000 per year and offers 30% off repairs on up to 20 products and maintenance covered on up to 10 products.</p><p>If you’re a photography pro, Canon even has an entire <a href=\"https://cna.st/affiliate-link/iqZ9
