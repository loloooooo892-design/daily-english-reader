*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

.container {

.meta {

}

.meta .sep {

}

h1 {

  line-height: 1.3;
  text-wrap: balance;

  border-radius: 4px;

  margin-bottom: 1.75rem;
}

.swap-bar {

}

.swap-actions {

  gap: 0.5rem;
}

.swap-btn {

  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

.archive-link a {
  color: var(--accent);
  text-decoration: none;

.archive-link a:hover {

@media (max-width: 480px) {

e subject of this notice, and (b) is founded, directly or \n                    indirectly, upon the provisions of:  (i) the Securities Act of 1933, the Securities Exchange \n                    Act of 1934, the Trust Indenture Act of 1939, the Investment Company Act of 1940, or the \n                    Investment Advisers Act of 1940, or any rule or regulation under any of these statutes, or (ii) \n                    the laws of the State in which the issuer maintains its principal place of business or any State \n                    in which this notice is filed.</li></ul>\n<ul><li>Certifying that, if the issuer is claiming a Regulation D exemption for the offering, the issuer is not disqualified from relying on Rule 504 or Rule 506 for one of the reasons stated in Rule 504(b)(3) or Rule 506(d).</li></ul>\n\n<p>Each Issuer identified above has read this notice, knows the contents to be true, and has duly caused this notice to be signed on its behalf by the undersigned duly authorized person.</p>\n<p>For signature, type in the signer's name or other letters or characters adopted or authorized as the signer's signature.</p>\n\nIssuer\nSignature\nName of Signer\nTitle\nDate\n\nOxide Computer Co\nSteven Tuck\nSteven Tuck\nPresident\n2026-08-04\n\n<p>Persons who respond to the collection of information contained in this form are not required to respond unless the form displays a currently valid OMB number.</p>\n<p>* This undertaking does not affect any limits Section 102(a) of the National Securities Markets\n        Improvement Act of 1996 (\"NSMIA\") [Pub. L. No. 104-290, 110 Stat. 3416 (Oct. 11, 1996)] imposes on the ability of States to\n        require information. As a result, if the securities that are the subject of this Form D are \"covered securities\" for purposes \n        of NSMIA, whether in all instances or due to the nature of the offering that is the subject of this Form D, States cannot\n        routinely require offering materials under this undertaking or otherwise and can require offering materials only to the\n        extent NSMIA permits them to do so under NSMIA's preservation of their anti-fraud authority.</p>"},{"title":"Max Miller’s Victim Mentality","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/max-millers-victim-mentality","category":"fun","categoryLabel":"Interesting Reads","wordCount":1383,"readingTime":7,"content":"<p>In June of 2025, five days after two Democratic state legislators in Minnesota were <a href=\"https://www.newyorker.com/news/the-lede/the-minnesota-shootings-and-the-dangerous-trend-of-impersonating-law-enforcement\" target=\"_blank\" rel=\"noopener\">shot on their doorsteps</a> by a man posing as a cop, Max Miller, a young Republican congressman from Ohio, said that he, too, had been the victim of a startling act of political violence. Miller, who comes from a prominent Jewish family in Cleveland and is avowedly pro-Israel, said in both a call to 911 and then in a defiant social-media post that, while driving on Interstate 90, a man in a Tesla waving a Palestinian flag had tried to “run me off the road.” The other driver, Miller said, also threatened to cut both Miller’s throat and his daughter’s, and shouted, “You’re a dirty Jew” and “I’m going to fucking kill you all.” Members of both parties quickly denounced the attack, pointing to it as a sign of rising political violence and antisemitism—<a href=\"https://www.newyorker.com/magazine/2026/05/25/can-hakeem-jeffries-lead-a-democratic-takeover-of-the-house\" target=\"_blank\" rel=\"noopener\">Hakeem Jeffries</a> and the Democratic House leadership put out a statement condemning it “in the strongest possible terms”—and the national political-violence story pivoted a bit away from Minnesota, since now members of both parties seemed like targets. Soon, a thirty-six-year-old family-medicine doctor named Feras Hamdan turned himself in to police, acknowledging that he’d been the person who had encountered Miller on the highway, and eventually pleaded guilty to reduced charges that carried no jail time.</p><p>This incident, and its aftermath, caught my attention a few months later, when I was working on <a href=\"https://www.newyorker.com/magazine/2025/12/08/in-the-line-of-fire\" target=\"_blank\" rel=\"noopener\">a story about patterns in political violence</a> across the country, but I struggled to make sense of Miller’s account. Judges tend to throw the book at anyone who attacks an elected official, let alone a perpetrator who calls one a “dirty Jew” and threatens to kill his infant daughter. Yet Hamdan’s sentence was light, and he quickly resumed his medical practice. Extensive political conversations rarely take place between drivers speeding along a highway in separate cars; I found it difficult to picture a single man alternately driving his car, carrying on an involved screaming match through a window, waving a flag, and trying to ram another car off the road, as Hamdan was accused of doing. (Last fall, when I tried to reach Miller to ask for more details, I got nowhere.) And, though Hamdan pleaded guilty to the misdemeanor, he also sued Miller for defamation, claiming that the congressman had greatly exaggerated the incident. (The lawsuit is still ongoing—Miller has filed a countersuit—but, in a press release, Hamdan’s attorneys noted that <a href=\"https://pattakoslaw.com/wp-content/uploads/2026/02/Tesla-Data-confirmed-by-TeslaMend.pdf\" target=\"_blank\" rel=\"noopener\">data pulled from Hamdan’s Tesla “</a>showed that Hamdan’s windows were up during the entire alleged incident, and that the movement of his steering wheel was inconsistent with any effort to swerve or ‘run Miller off the road.’ ”)</p><p>Miller is now the central figure in Washington’s most intimate and appalling ordeal. In allegations that surfaced as part of a child-protective-services investigation this year, Miller’s ex-wife, Emily Moreno, to whom he was married from 2022 to 2024, accused the congressman of hitting her, throwing her against a wall, tossing boiling water on her, and holding a gun to her head. She also said she believes, though she could not prove it, that Miller was responsible for breaking their daughter’s collarbone. Miller, who is in a competitive reëlection campaign, has vehemently denied all the allegations, and the Republican leadership has tried to downplay them—Speaker <a href=\"https://www.newyorker.com/magazine/2024/03/25/mike-johnson-profile\" target=\"_blank\" rel=\"noopener\">Mike Johnson</a>, in May, told reporters, “I don’t get involved in the personal lives of members.” On Sunday, President Donald Trump dismissed the domestic-abuse claims as “just allegations.”</p><p>One complication for this posture is that Miller was previously accused of domestic violence by Stephanie Grisham, whom he had dated during Trump’s first term, when Grisham was Melania Trump’s press secretary, and whom he briefly sued for defamation. Another is that his ex-wife’s father is Bernie Moreno, a U.S. senator from Ohio, who is at least as important a figure to the White House as his son-in-law. On Sunday, Miller held a live stream during which he announced that he would release documents that would exonerate him. The trove included an audio exchange he had with his ex-wife in which she confronted him after finding needles by his bedside (Miller claimed that they were for testosterone-replacement therapy); Miller also accidentally released a shirtless picture of the two-year-old daughter he and Moreno share.</p><p>As with many rising figures in the Republican Party, Miller and Trump have a history; the congressman served as a White House aide during the President’s first term in office. On Monday, Trump stuck up for Miller in public, in his own way. “He’s a good person,” the President told reporters, before amending, “I mean, I always thought he was a very good person.” Privately, <a href=\"https://www.axios.com/2026/08/04/trump-max-miller-moreno-election-house\" target=\"_blank\" rel=\"noopener\">according to <em>Axios</em></a>, Trump told Miller in a call that same day that “things aren’t looking good.” On Sunday, Moreno, who had long been silent, said that Miller should no longer serve in Congress. “He is a danger to my daughter, and I hold my breath every minute he has custody of my granddaughter,” Moreno said. Later that week, the senator mentioned that he’d spent part of Sunday afternoon in a suburban Cleveland police station, helping with the transfer of his two-year-old granddaughter, per the custody agreement. (According to Moreno, during the encounter, Miller had refused to hand over his daughter’s favorite stuffed blue bunny.) His family, Moreno went on, had endured “the seventh level of hell.”</p><p>Compared with the overlapping crises threatening Trump’s political position—<a href=\"https://www.newyorker.com/news/global-notes/the-spectacular-failure-and-ruinous-costs-of-the-iran-war\" target=\"_blank\" rel=\"noopener\">the Iran war</a>, his <a href=\"https://www.newyorker.com/news/the-financial-page/donald-trumps-needless-war-with-iran-is-his-biggest-economic-blunder\" target=\"_blank\" rel=\"noopener\">failure to manage</a> the cost of living, his multiplying <a href=\"https://www.newyorker.com/news/the-financial-page/can-anything-stop-trumps-corruption\" target=\"_blank\" rel=\"noopener\">corruption scandals</a>—the Miller-Moreno conflict is a smaller matter. But much of Trump’s power has come from his command of his party, and so much of that control has come from his practice of excusing heinous behavior, beginning with his own. If the Democrats, who are promising to launch all manner of investigations, manage to win at least one chamber of Congress in the midterms, then the last two years of the Trump era are likely to focus on the question of the impunity of the President’s allies, and his power to preserve it. And so it was at once a moral abdication and perhaps a hint of how this is likely to end when Trump said, on Monday, “I’m going to let the families figure that out.”</p><p>When politicians are caught doing inexcusable things, they often gesture at their own supposed political indispensability. On his phone call with Trump, Miller had reportedly cited some promising polling on his reëlection campaign; on Monday, he insisted to reporters, “I can win.” (It is a scandal in itself that Republicans have downplayed the allegations against Miller for so long, as it was when Democrats declined to act decisively amid the mounting evidence against the Maine Senate candidate <a href=\"https://www.newyorker.com/culture/infinite-scroll/graham-platners-very-online-undoing\" target=\"_blank\" rel=\"noopener\">Graham Platner</a>.) But most politicians are pretty easily replaced, a truism that Moreno reinforced by going public. It is almost tautological that the Republican candidate with the best chance of winning Ohio’s Seventh Congressional District in November is not the person who has been deemed unfit to serve by one of his party’s most senior figures in the state, who has also called on him to “end the clear pattern of abuse left in his wake.”</p><p>On Tuesday night, Miller spent twenty-three minutes defending himself on Jake Tapper’s CNN show, an appearance during which several minutes were spent on whether Miller had, in fact, held a blue bunny hostage. But a deadline is approaching for Miller, against whom a congressional ethics probe opened this week. If he steps down from his reëlection race by next Monday, local Republican Party chairs in his district can select a replacement candidate; if not, Miller stays on the ballot. In the meantime, the G.O.P.’s internal frictions—this week, Trump also clashed with Jeanine Pirro, his previously loyal U.S. Attorney for Washington, D.C., after she withdrew charges against an ex-Olympic canoeist who was accused of damaging the lining to the National Mall’s reflecting pool (Pirro “folded like an umbrella,” Trump fumed)—are not just a concern for the G.O.P.’s chances in the midterms; they are also operating as glimpses of how Trump assesses his own strength: whether he believes his political position is still strong enough to defend his indefensible allies, or whether he will accede to Miller’s inevitable dispensability. <em>♦</em></p>"},{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/the-sunday-papers-820","category":"gaming","categoryLabel":"Gaming","wordCount":1124,"readingTime":6,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays are for sobbingly lifting exactly one boulder from the groaning dreampile that is my backlog. Good news, Vacuity, cpt_freakout and the rest – I'm trying out your precious, precious Troubleshooter game. I hear it's a hundred hours long, so please do not take this as a promise that a write-up is forthcoming. So far my major takeaways are 1) I enjoy collecting masteries, aka packages of abilities and modifiers, and 2) <a href=\"https://www.youtube.com/watch?v=MhFNlQA_hhM\" target=\"_blank\" rel=\"noopener\">this \"Short Break\" track</a> is cooool. Please hum along while browsing our latest collection of Rollicking Reads.</p>\n<p>For <a href=\"https://aeon.co/essays/silicon-valley-has-a-science-fiction-problem\" target=\"_blank\" rel=\"noopener\">Aeon</a>, Ali Rıza Taşkale analyses how self-appointed big tech visionaries have borrowed the trappings of Western sci-fi and fantasy works such as Neuromancer, the Foundation novels, and Star Trek for their political projects. I think you could get a whole 'nother essay out of this excerpt on how the threat of sci-fantasy apocalypse gets perversely deployed as a means of distraction.</p>\n<blockquote>It is the triumph of the speculative sci-fi scenario over human solidarity: why fix the world we inhabit when we can spend billions preventing a robot uprising that exists only in the imagination? By trying to steer policy debates toward distant catastrophic scenarios – killer robots, rogue AI, existential risk – the industry diverts attention from regulating the systems already causing harm: algorithmic bias in hiring, facial recognition’s racial disparities, platform amplification of extremism.</blockquote>\n<p>For the <a href=\"https://www.lrb.co.uk/the-paper/v48/n13/jenny-turner/hated-and-loved-in-a-breath\" target=\"_blank\" rel=\"noopener\">LRB</a>, Jenny Turner writes about the Scottish novelist Lewis Grassic Gibbon (birthname James Leslie Mitchell), exploring nationalism, patriarchy, class, place, language, and changing times. I've never read any Gibbon/Mitchell, but I found this piece quite enveloping. It's a longer one – 10,000 words.</p>\n<blockquote>Scots is love, English learning, and you can’t do much of the latter before you lose your roots: it still runs deep, this Oedipal confusion of nation and class and agency and power, and without it, there’s no way [Nicola] Sturgeon’s vaguely social-democratic Scottish nationalism would ever have wrung and held the hearts of people the way it did. Much of it, as Sturgeon senses, has to do with ‘Scots words’, as instruments of interpellation really, especially when your heart is getting held and wrung by them at school. Gibbon’s use of Scots is quite confusing, an artefact that looks authentic although it’s not: ‘The technique,’ as he confessed, ‘is to mould the English language into the rhythms and cadences of Scots spoken speech, and to inject into the English vocabulary such minimum number of words from Braid Scots as that remodelling requires.’ He was keen for his book to sell, to American audiences in particular, and appended a glossary of around a hundred words to the American edition. The most used ‘Scotticisms’, according to William K. Malcolm’s new biography, are modifiers such as awful, bit, coarse, fair, fell, ‘cosmetic rather than descriptive’, easy enough for diaspora Scots, more than a quarter of a million of whom left for North America in the 1920s alone.</blockquote>\n<p>For <a href=\"https://www.stopcar.ing/the-women-who-kill-are-the-ones-that-saved-me/\" target=\"_blank\" rel=\"noopener\">Stop Caring</a>, an anonymous writer considers gender dysphoria by way of two games I would somehow never have thought to place together: <a href=\"https://www.rockpapershotgun.com/games/stellar-blade\" target=\"_blank\" rel=\"noopener\">Stellar Blade</a> and <a href=\"https://www.rockpapershotgun.com/games/brush-burial-gutter-world\" target=\"_blank\" rel=\"noopener\">Brush Burial: Gutter World</a>. Beware spoilers for each.</p>\n<blockquote>She is the epitome of what I wish I could be. An androgynous, femme-leaning killing machine with a fat ass and a tight waist. I can’t look at her without feeling a concoction of wild lust and furious jealousy. I love the way her eight eyes stare down at me and tell me to beg. I love the forked tail she strikes with, the way she folds her enemies and twists them like dolls, the suffocating thighs and calves she clamps down on brutish guards with. And all of it, she does to help her and her partner breathe a little easier while they try to make it through life in this rotting world.  </blockquote>\n<p>Jim Rossignol, formerly of this parish, has a little <a href=\"https://bsky.app/profile/rossignol.bsky.social/post/3mrhnzd34qk2l\" target=\"_blank\" rel=\"noopener\">Bluesky thread</a> about the creation and success of tweedy sandbox robo-avoider Sir, You Are Being Hunted. It maketh me feel old.</p>\n<blockquote>So here we had a confluence of events that is unrepeatable in spacetime. Kickstarter was a viable way to raise good amounts for a videogame project, Early Access was a novelty that everyone wants to check out, Steam was still curated, people were fascinated in the idea of procedural generation.</blockquote>\n<p>This one is from 2021, but I don't care: Lizzie Marx has <a href=\"https://publicdomainreview.org/essay/picturing-scent/\" target=\"_blank\" rel=\"noopener\">a fascinating essay</a> on the stench of dead whales in 17th century Dutch art, which doubles as an invitation to consider smell in aesthetics and art production more generally. Compare and contrast efforts to <a href=\"https://www.bbc.co.uk/news/articles/cgkjz3r1j68o\" target=\"_blank\" rel=\"noopener\">make videogames stink</a>.</p>\n<blockquote>Some decades after the beached whale foretold the fate of Amsterdam, visitors in the city came to admire the latest works by Rembrandt van Rijn in his studio. As Rembrandt’s biographer Arnold Houbraken recounts, when visitors edged closer to the paintings, the artist pulled them away, saying, “The smell of the paint would irritate you”.11 Oil paint combines pulverised pigments with linseed oil, a sharp-smelling binding medium which is extracted from pressed flax seeds. The compound produces a wonderfully supple and jewel-like paint that can achieve fine details and varying textures. In Rembrandt’s self-portrait, he does not use oil paint sparingly, but practically sculpts with it. He smears out flesh-coloured oils to construct his nose, and in order to evoke the folds of his headpiece, he scrapes out lines of blue and yellow paint revealing the dark ground beneath. In the studio, the odour of linseed oil must have been a disruptive force, and Rembrandt used it to persuade his visitors to distance themselves from the painting, to best behold the rough, impasto slicks of paint. The painting has retained most of its lustre, but the odour, in time, has faded. </blockquote>\n<p>I note with agony that Nic Reuben, former RPS librarian, has joined the musty has-beens of Jank.cool on their quest to publish no good writing whatsoever. <a href=\"https://www.jank.cool/sol-cesto-review\" target=\"_blank\" rel=\"noopener\">Here he is on Sol Cesto</a>.</p>\n<blockquote>It's the second heatwave of the year in the UK right now. My PC quivers like angry blancmanche at the suggestion it perform even the laziest task, and Snickers ice creams melt down my palm and form crunchy bangles around my wrist before I can ferry them home to my face. Sol Cesto, you say? The sun has ceased? Sign me up!</blockquote>\n<p>Get in the filthmobile, loser, <a href=\"https://itch.io/jam/pervertjam-2026\" target=\"_blank\" rel=\"noopener\">Pervert Jam 2026</a> is underway. The goal is to \"create games with no public in mind but yourself\", with the optional theme \"A Pound of Flesh\". Oh, you had already pledged your intellectual faculties to Critical Distance's latest \"friendslop\"-themed <a href=\"https://critical-distance.com/2026/07/20/blogs-of-the-round-table-friendslop-jam/\" target=\"_blank\" rel=\"noopener\">Blogs of the Round Table</a>? Very well, then. We will watch your career with great interest.</p>\n<p>Here's some <a href=\"https://www.youtube.com/watch?v=WiwWeFx-H1U\" target=\"_blank\" rel=\"noopener\">Modest Mouse</a> to play us out.</p>"},{"title":"Gordon-Darby Renews Attempt to Commandeer New Hampshire Through the Clean Air Act","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/08/03/gordon-darby-renews-attempt-to-commandeer-new-hampshire-through-the-clean-air-act/","category":"law","categoryLabel":"Law","wordCount":674,"readingTime":4,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/tag/commandeering/\" target=\"_blank\" rel=\"noopener\">Commandeering</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/08/03/gordon-darby-renews-attempt-to-commandeer-new-hampshire-through-the-clean-air-act/\" target=\"_blank\" rel=\"noopener\">Gordon-Darby Renews Attempt to Commandeer New Hampshire Through the Clean Air Act</a>\n\t\t\t\t\t<p>A renewed suit seeking to leverage the Clean Air Act in pursuit of lucrative government contracts. </p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.3.2026 1:35 PM\n</p>\n\t</h2>\n\t\n\t\t<p>As <a href=\"https://reason.com/volokh/2026/06/06/gordon-darby-prepares-to-renew-effort-to-commandeer-new-hampshire-in-order-to-maintain-emissions-testing-contract/\" target=\"_blank\" rel=\"noopener\">promised</a>, government services contractor Gordon-Darby Inc. has renewed its attempt to force the state of New Hampshire to revive its vehicle emissions inspection program. On July 22, the firm filed a new lawsuit challenging the state's decision to end the program and seeking a federal court injunction to force the state to re-start it--thus giving Gordon-Darby the opportunity to pursue another lucrative contact providing emission inspection testing. <a href=\"https://reason.com/volokh/2026/01/31/private-suit-commandeers-new-hampshire-government-to-maintain-vehicle-emission-inspections/\" target=\"_blank\" rel=\"noopener\">As before</a>, Gordon-Darby's suit betrays a profound misunderstanding of both the Clean Air Act and the <a href=\"https://reason.com/volokh/2026/02/27/the-unconstitutional-commandeering-of-new-hampshire-continues/\" target=\"_blank\" rel=\"noopener\">constitutional limits</a> on the federal government's ability to compel state action.</p>\n<p>The central claim in the suit is that New Hampshire is violating the Clean Air Act because it is required to have a vehicle emissions inspection program as part of its State Implementation Plan. What the suit overlooks, however, is that the Act does not authorize injunctions to compel state implementation of the Act. To the contrary (and as one of the plaintiffs' supporting exhibits makes explicit), if a state is failing to meet its SIP obligations, the remedies are for the EPA to impose sanctions, which can include the imposition of a Federal Implementation Plan (FIP)--implemented and enforced by the federal government--and the loss of federal funds (including, <a href=\"https://scholarlycommons.law.case.edu/cgi/viewcontent.cgi?article=2984&amp;context=faculty_publications\" target=\"_blank\" rel=\"noopener\">potentially</a>, highway funds). Yet that is not what the plaintiffs want here (which is why they are suing New Hampshire instead of the EPA).  Rather, as they make explicit in their complaint, the purpose of the suit is to \"compel New Hampshire state officials\" to implement the desired program.</p>\n<p>The Clean Air Act has never provided for the sort of enforcement that Gordon-Darby seeks, and with good reason. As the Supreme Court has made clear in <em>New York v. United States</em>, <em>Printz v. United States</em>, and <em>NCAA v. Murphy</em>, the federal government lacks the authority to compel a state to adopt, administer, or implement a desired regulatory program. Further, as <em>Murphy</em> made explicit, this anti-commandeering principle applies to attempting to prevent a state from repealing an existing law, as the New Hampshire legislature did here.</p>\n<p>As it happens, the theory advanced by the plaintiffs was briefly embraced by the EPA in the early 1970s, as the Clean Air Act was first being implemented. Concerned that states were not doing enough to reduce air pollution, the EPA sought to force states to adopt specific emissions control measures, including the adoption of vehicle emission inspection programs! Three of four federal circuit courts rejected the EPA's arguments, however. The Supreme Court granted certiorari, at the federal government's request, only to dismiss the case after the Department of Justice conceded (in a footnote) that the EPA's regulations could not be lawfully enforced. Even though the Supreme Court would not articulate an anti-commandeering rule for another fifteen years, DOJ recognized the constitutional problem with trying to turn state officials into agents of the federal government. Now that the anti-commandeering doctrine is explicit, there should be even less room to debate Gordon-Darby's audacious legal claim.</p>\n<p>This time around Gordon-Darby is joined by an individual plaintiff, Marilyn Jonas, who claims her asthma is exacerbated by air pollution. The addition of an individual plaintiff who can claim tangible harm from air pollution increases that may result from termination of the emissions inspection program may help Gordon-Darby avoid dismissal on standing grounds, but it does not change the statutory or constitutional analysis.</p>\n<p>When Gordon-Darby first brought litigation seeking to keep the emissions inspection program in place, New Hampshire failed to raise commandeering arguments in its defense, preferring various procedural and jurisdictional arguments that the district court unpersuasive. As the case has been assigned to the same judge, we will see whether history repeats itself in that respect here.</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/03/journal-of-free-speech-law-jawboning-as-collaborative-governance-by-daniel-browning/\" target=\"_blank\" rel=\"noopener\">NEXT: Journal of Free Speech Law: \"Jawboning as Collaborative Governance,\" by Daniel Browning</a>\n    </p>\n\t<a href=\"https://reason.com/tag/commandeering/\" target=\"_blank\" rel=\"noopener\">Commandeering</a><a href=\"https://reason.com/tag/federalism/\" target=\"_blank\" rel=\"noopener\">Federalism</a><a href=\"https://reason.com/tag/clean-air-act/\" target=\"_blank\" rel=\"noopener\">Clean Air Act</a><a href=\"https://reason.com/category/law/environmental-law/\" target=\"_blank\" rel=\"noopener\">Environmental Law</a><a href=\"https://reason.com/category/law/administrative-law/\" target=\"_blank\" rel=\"noopener\">Administrative Law</a>"}];
