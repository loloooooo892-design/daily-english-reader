<script>
var articles = [{"title":"Seattle City Council votes to ban surveillance pricing in sale of groceries","source":"Hacker News Best","author":"","url":"https://advocacy.consumerreports.org/press_release/seattle-city-council-votes-to-ban-surveillance-pricing-in-sale-of-groceries/","category":"tech","categoryLabel":"Technology","wordCount":562,"readingTime":3,"content":"<p>If signed, Seattle will become the first city in the nation to prohibit the pricing tactic</p>\n<p>Seattle, Washington – The Seattle City Council today passed the Fair Pricing and Transparency Act (CB 121267), groundbreaking legislation supported by Consumer Reports that would prohibit personalized pricing in the sale of groceries. Consumer Reports provided technical assistance to the Mayor’s office throughout the policy development process, testified, and recently submitted a <a href=\"https://advocacy.consumerreports.org/research/cr-supports-seattle-bill-to-ban-personalized-pricing-the-fair-pricing-and-transparency-act/\" target=\"_blank\" rel=\"noopener\">letter</a> in support of the legislation. The bill now heads to Mayor Wilson for her signature. </p>\n<p>This bill, which is the first of its kind to pass at the city level, would prohibit the use of a consumer’s personal data to change the price they see for groceries and other essential items. This includes, for example, data about a consumer’s web-browsing history, their realtime location, inferences about their income, family size, health conditions, and more. The bill also permits a vast array of discounting practices while requiring increased transparency around discounts and placing some limitations on how consumers can be profiled.</p>\n<p>“Nobody should pay more for basic necessities because a data broker is quietly collecting information about what they’re searching for online, what they hover over, what their income is, or where they go,” said Grace Gedye, senior policy analyst at Consumer Reports. “The price you see shouldn’t be different based on who you are. Mayor Wilson and the City Council have made Seattle a leader on protecting shoppers from unfair grocery pricing tactics with this bill. We commend this work.”</p>\n<p>Background:</p>\n<p>Other states have taken action to sign bills into law to ban the practice of surveillance pricing, including <a href=\"https://advocacy.consumerreports.org/press_release/consumer-reports-statement-on-the-signing-of-marylands-protection-from-predatory-pricing-act-into-law/\" target=\"_blank\" rel=\"noopener\">Maryland</a>, <a href=\"https://advocacy.consumerreports.org/press_release/consumer-reports-statement-on-the-signing-of-connecticuts-surveillance-pricing-bill-into-law/\" target=\"_blank\" rel=\"noopener\">Connecticut</a> and <a href=\"https://advocacy.consumerreports.org/press_release/new-jersey-becomes-third-state-to-curb-personalized-pricing/\" target=\"_blank\" rel=\"noopener\">New Jersey</a>. </p>\n<p>In May 2025, Consumer Reports <a href=\"https://www.consumerreports.org/money/questionable-business-practices/kroger-secret-grocery-shopper-loyalty-profiles-unfair-a1011215563/\" target=\"_blank\" rel=\"noopener\">investigated Kroger’s consumer data practices</a> and found that they were collecting vast data profiles for individual shoppers, with inferences about their income, family size, education level, gender, and more. One shopper who requested their data under a state privacy law received a 62-page profile.</p>\n<p>In December 2025, CR, along with partners Groundwork Collaborative and More Perfect Union, published an <a href=\"https://www.consumerreports.org/money/questionable-business-practices/instacart-ai-pricing-experiment-inflating-grocery-bills-a1142182490/\" target=\"_blank\" rel=\"noopener\">investigation</a> into Instacart’s pricing tactics. CR had nearly 400 consumers shop for the same basket of goods at the same time. Analysis of the shopping data found that consumers were quoted different prices for the same products from the same store at the same time. The investigation found that Instacart’s algorithmic pricing experiments could result in price differences as high as 23% for certain products and could cost families more than $1,200 a year at checkout. Soon after, Instacart announced in a <a href=\"https://www.instacart.com/company/updates/ending-item-price-tests-on-instacart\" target=\"_blank\" rel=\"noopener\">company blog post</a> that it would end the program that resulted in different shoppers being shown different ​prices for groceries on its platform. However, Instacart told CR that it would still allow its partners—grocery retailers and food brands—to test different types of promotions and discounts on their customers through the platform.</p>\n<p>CR’s most recent <a href=\"https://www.consumerreports.org/money/questionable-business-practices/uber-lyft-different-prices-for-same-ride-and-fake-discounts-a1093538909/\" target=\"_blank\" rel=\"noopener\">investigation</a> of Uber and Lyft’s AI-driven pricing tactics found that the companies routinely charge different customers significantly different prices for the same rides ordered at roughly the same time. CR also found that both apps regularly advertised supposed discounts off what appeared to be inflated original prices. (Note: CR defines “same rides” as trips from the same starting point to the same destination priced within minutes—and often seconds—of one another.)</p>\n<p>Additional information on Consumer Reports’ <a href=\"https://www.consumerreports.org/make-the-price-right/\" target=\"_blank\" rel=\"noopener\">campaign to Make the Price Right</a> can be found here.</p>\n<p>Contact: cyrus.rassool@consumer.org</p>"},{"title":"Wardogs presents a different kind of FPS power fantasy: making fat stacks as a pacifist rideshare driver","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/wardogs-presents-a-different-kind-of-fps-power-fantasy-making-fat-stacks-as-a-pacifist-rideshare-driver","category":"gaming","categoryLabel":"Gaming","wordCount":1173,"readingTime":6,"content":"<p>Five stars, yeah?</p>\n    \n  \n  \n  \n\n            <p>Because no-one entirely likes their job, I should be upfront about my issues with newly launched Early Access darling <a href=\"https://www.rockpapershotgun.com/games/wardogs\" target=\"_blank\" rel=\"noopener\">Wardogs</a>, the mass-scale multiplayer shooter in which I’ve just found employment. Its \"Play like you used to\" tagline and <a href=\"https://www.youtube.com/watch?v=CpQnZgZCIo8\" target=\"_blank\" rel=\"noopener\">Halo 3-aping trailer</a> smell a bit of reactionary, stuck-in-the-past thinking. It’s a mass-scale multiplayer shooter, so individual heroics rarely influence match outcomes. And, like pretty much everyone else who sucked down both those problems and tried playing on launch night regardless, I spent far too long attempting to communicate with server architecture that clearly <a href=\"https://x.com/WARDOGS/status/2098122288671473928\" target=\"_blank\" rel=\"noopener\">had the resilience of overmilked cornflakes</a>.</p>\n<p>And yet, the fifty minutes I <em>did</em> spend in a functioning match felt like some of the most pleasant and productive time I’ve had in a competitive <a href=\"https://www.rockpapershotgun.com/best-fps-games\" target=\"_blank\" rel=\"noopener\">FPS</a> for ages. The secret: ignore all first person shooting entirely, and begin a lucrative career as an Uber driver for commuting mercs.</p>\n\n<p>In a stark break from reality, Wardogs’ gig economy can be very profitable indeed. Almost every positive action earns you cash, from the obvious hardpoint captures and squadmate revives to the humble delivery of people and bandages to the frontlines. And, since team spawns are literal miles from the central battlezones, logistical roles are not merely cash-incentivised, but essential.</p><p>In an accurate reflection of reality, you begin with little, must buy all vehicles and equipment yourself, and are on the hook if they’re lost while on duty. But the creation of genuine rear-detachment roles means Wardogs solves problems I have with both big shooters, and the extraction subgenre it also borrows from: by constantly ferrying teammates, I can have an individual yet materially important impact on the match, and by never intentionally joining a gunfight, I need never worry about loot loss anxiety. It was the perfect career move.</p>\n<p>Buoyed by first-day enthusiasm, once I finally loaded into a game I bought a car, directed it dutifully towards the crowd of pedestrian soldiers, and immediately caused a helicopter crash. My pull-up-to-the-kerb manoeuvre had unwittingly put me in the landing path of a descending attack chopper – a major fault in the standard United Kingdom driving test – forcing the delicate warbird to flip over my roof and explode. Its occupants, miraculously unhurt but quite cross, shot me a damning glance as they strode off to buy another one.</p>\n\n<p>The rest of my inaugural fare, a full house of one real-life friend and two silent randomers, went mercifully smoother. Despite the slippery handling of my entry-level SUV, it was a comfortable, peaceful drive towards the hot zone, which itself offered ample parking space for my passengers to hop out. The prizes came instantly: $1,000 for a \"tactical deployment\", plus $500 for each of my unharmed passengers, <em>plus</em> a $15 tip from a particularly satisfied rider. $2,515 for a few kilometres of relaxed cruising? The hell am I doing as a deputy ed?</p><p>The private hire lifestyle took hold. For multiple runs, I’d steer back to base, wait next to other transit vehicles (sometimes sharing an “A’ight, mate” with the heli pilot next to me), load up on balaclava men, and deliver them vaguely near the sound of gunfire, my balance swelling with each trip. Half an hour in, I’d accumulated slightly higher earnings than my IRL friend, who’d been running around murdering people and getting shot himself. Sounds painful. Sounds like participating directly in the horrors of war, mankind’s most terrible creation, and a blight on the Earth that continues to destroy families and erase cultures every day. Sounds like he’s not even getting paid that much to do it anyway, the rube.</p>\n\n<p>Meanwhile, my hands were clean, not counting all the filthy lucre that was crossing it. Granted, my usefulness was starting and ending with the thunk of automobile doors – sometimes I’d watch my disembarked comrades perish just moments after paying their fare, a tragically premature \"Passenger survived, +$500\" lingering onscreen as their heaped form shrunk in my rearview. In these moments I was less Iqbal, the friendly Prius owner who got me home from the pub last week, and more Charon, damned soul ferryman of the River Styx.</p>\n<p>As the match went on, I also began having trouble with that key component of hypercapitalism: competition. It turned out those heli pilots were not my mates at all, but were conspiring to steal my business, adopting the unfair and likely illegal practice of having faster vehicles than me. Eventually, my stream of human tip jars reduced to a trickle of stragglers, the larger crowds routinely making a beeline for the nimbler, more spectacular choppers.</p>\n\n<p>In search of alternative revenue streams, I diversified into supply logistics. At this point I hadn’t made quite enough profit to afford a proper truck, so instead bought one empty crate, chucked a few cheap medical supplies into it, and bunged it my car's back seat. Seemingly in ignorance of the massive boot, but whatever. I knew delivering it somewhere useful would require driving deeper into the fray than my people-carrying had thus far, but shareholder value (mine) demanded it.</p><p>The journey was, again, uneventful, and I chanced upon a makeshift base swarming with more action-inclined teammates. Surely, the kind of folk who’d appreciate a box of plasters. Not entirely familiar with the controls, I hit the G key to unload, at which point the crate seemed to disappear. A \"Supplies delivered, +$500\" popped up – which, as my accountant tells me, if half what I could have made by filling those seats with bums instead – but I remained concerned about the supplies themselves. Beginning my search, I reversed, directly onto and over the bandage box that has been laying <em>just</em> out of view. Now, I was stuck, the car’s back end suspended barely high enough for the rear-wheel-drive wheels to regain purchase on the tarmac.</p>\n\n<p>This was not ideal. As I got back at the wheel and tried wriggling free with Game Physics sorcery, I noticed the allies I’d come to resupply were no longer dashing around on the roof. Within seconds, a lone, green-dressed man with no 'Don’t shoot this one' arrow above his head rounded the building’s corner, rifle raised. Still stuck, I killed the engine and did the best impression of an empty, slightly slanted car that I’ll ever have to do. The man’s scope swivelled in my direction, then kept going, the ruse successful long enough for an arrowed teammate to pop out from behind a van and shoot him down.</p>\n<p>Hands sweating in gratitude, I eventually managed to slide my bumper free and roar off back to HQ, alive and enriched. My shift was only brought to an end by a return of those blasted server errors, but I clocked off a happy man: I’d nearly tripled my net worth and had been, more so than in any Battlefield game I’ve ever bumbled through, helpful. Honestly, what a silly slogan – why play like you used to when you can start an exciting new career in personal transportation?</p>"},{"title":"How the Absence of Shame Weakens Democracy","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/fault-lines/how-the-absence-of-shame-weakens-democracy","category":"fun","categoryLabel":"Interesting Reads","wordCount":1351,"readingTime":7,"content":"<p>Earlier this year, I wrote a series of columns about how the decline of the Church in America had eroded the social infrastructure that once supported <a href=\"https://www.newyorker.com/news/fault-lines/can-american-churches-lead-a-protest-movement-under-trump\" target=\"_blank\" rel=\"noopener\">sustained political protest</a> in this country—leaving us, today, with millions of social-media posts and a few flash-point mass demonstrations, but no effective movement.</p><p>The transformations that have decimated protest movements—undone by digitization, atomization, and the evanescence of online life—have also affected shame and its ability to mediate social norms without the intervention of the state. We can type and post and record selfie videos about shame, but we cannot make anyone really feel it. We cannot collectively levy its force against the powerful and shameless.</p><p>So here’s something of a synthesis of these ideas, or, at the very least, what I think I’ve been getting around to saying: life experienced on phones and through social media leaves us lonely and alienated from one another; this has led to an existence that’s somehow at once both intensely individual and intensely tribal. We can find online fellow-travellers for our worst impulses, people who will influence and reinforce these tendencies, but this does not provide a real sense of community. Rather, it often emboldens what once would have been regarded as obviously shameful behavior. Finding broadly shared truths and convictions is becoming nearly impossible, and this has enabled the cultural rise of tech and finance, which are governed by a <a href=\"https://www.newyorker.com/news/fault-lines/will-ai-overwrite-our-sense-of-shame\" target=\"_blank\" rel=\"noopener\">specific kind of quantitative thinking</a>. We are now in an era of brutal rationalism, an intentionally blunted gospel of optimization in which all the answers are self-evident. Shame is becoming something that people dismiss altogether.</p><p>To bring this down to earth a bit, let me talk about sports, as I did at <a href=\"https://www.newyorker.com/news/fault-lines/the-death-of-shame-is-tearing-us-apart\" target=\"_blank\" rel=\"noopener\">the beginning of this series</a>. In 2003, the journalist Michael Lewis published the book “<a href=\"https://www.amazon.com/dp/0393324818\" target=\"_blank\" rel=\"noopener\">Moneyball</a>,” about how the Oakland A’s had become a World Series contender by bringing the ruthless quantitative thinking of tech and finance to Major League Baseball. In the film adaptation, a character based on the sabermetrician Paul DePodesta, played by Jonah Hill, tells his boss, the Oakland general manager Billy Beane, played by Brad Pitt, to pick players using a single criteria: if they get on base. In a pivotal scene, Hill and Pitt sit at a table with the sclerotic Old Guard of scouts and front-office zombies. As the group debates players, Pitt reveals the new modus operandi for the Oakland Athletics. None of the old considerations—age, body type, drug problems—matter as much as that one thing, how often the players get on base.</p><p>In the past two decades, “Moneyball”-style thinking has spread, and nearly every part of American life seems to have found its own version of “he gets on base.” Calculations are completed, and the answer is immutable. A more nuanced view—one that considers, for example, that Oakland actually was so successful in large part <a href=\"https://slate.com/culture/2011/09/moneyball-movie-the-numbers-are-good-but-the-story-is-still-bunk.html\" target=\"_blank\" rel=\"noopener\">because of three great young pitchers</a> who had all been scouted by the old guard—almost always gives way to the dogma of the quants. When brutal rationalism is challenged, especially by traditionalists, its defenders will often justify themselves by pointing to the intelligence of its adherents. The message is, We are the smart ones who understand the math of on-base percentage, and all of the heretics who talk about “watchability” or even say that it’s good for a sport to be entertaining are stupid.</p><p>But this notion of intelligence contains a whole set of assumptions about what is valuable. Here’s another sports-related story, closer to home. I recently had a conversation with a fellow-parent about paying for parking and admission at their children’s youth basketball games. If they wanted to watch their kids play, they needed to pay twenty-five dollars for parking and another twenty dollars per person just to get in the gym. I said that this was gross behavior and that such things would never have been allowed back in our childhoods. The other parent, who was equally disturbed but perhaps a bit less emotional, said, “Yeah, they’re just being smart, I guess.”</p><p>“Smart” is how brutal rationality is justified to the public. The public might still hate what’s being done, but they will accept that that’s how the world works today. Of course, charging for parking and admission at a kid’s basketball game is a low-level version of extractive efficiency when compared to, say, the way that corporations treat their employees. But we experience the loss of shame most intensely in these personal moments when that loss intrudes into spaces we thought of as sacred, such as our children’s play.</p><p>The discontent we feel about so much of modern society is the failure of shame to triumph over “smart.” We feel alienated precisely because we can’t shame the organizers of the basketball league to stop charging for parking just because they can.</p><p>Last week, I appeared on a public-radio show with a psychology professor from the University of British Columbia, Jessica Tracy, who does not think that public shaming is particularly useful or productive. She pointed out how many lives had been derailed by shame on social media, and suggested that we should not rely on a groundswell of public discontent to police horrible behavior; instead, she argued, the government and official bodies should act to enforce norms. Of course, the state and other official bodies know when to step in only because of public shame; the N.B.A., for example, would not make anti-tanking rules if there was no public outcry. More important, it seems unwise to ask a corruptible government to both set the agenda and to enforce the social code.</p><p>It’s true that social media can function as the ultimate shaming machine. But its real-world effects are almost entirely heaped upon the unlucky individuals who briefly become the internet’s main character. The social norms it enforces with such viciousness might show up in human-resources documents, but the past decade that has followed the peak of online shaming has shown us just how flimsy those social norms really were. Do you look around in whatever city or town you live in and see evidence that social-media shaming has made people more submissive to a shared set of social norms? Or do you see influencers invading personal space, people rudely taking out their phones in the middle of conversations with actual people, and theatrical, internet-incentivized, constantly filmed conflict? The attention economy of social media, and the ease with which anyone can now record anything, has made us far more shameless. That seems obvious enough.</p><p>But shame requires actual communities to function. The reason we feel powerless against “smart” measures like charging parents twenty-five dollars to park to see a twelve-year-old’s basketball game is because we have lost the ability to collectively grouse and complain and make the assholes stop optimizing society down the drain. As our major institutions—the Church, the mainstream media, the university—<a href=\"https://www.newyorker.com/news/fault-lines/a-generation-of-distrust\" target=\"_blank\" rel=\"noopener\">totter and fall</a>, what will provide the infrastructure and the manpower to uphold our shared values of decency, generosity, and help for the less fortunate? Can a GoFundMe link replace that? A twenty-four-hour social-media outrage session?</p><p>I don’t mean to suggest that everyone needs to go back to church. Churches, it hardly needs to be said, have their own dogmas and agendas, and they aren’t always steadfast stewards of community. But I do think that we need the social ritual of gathering, a time when a community comes together in the same room, passes around a plate, and hears lectures on what it means to be a good neighbor. The person who charges for parking at the children’s basketball game should have to sit in a pew next to the parent who’s upset about it. We have now structured our economy and society in a way that these confrontations never take place. We never know who is reaching in our pocket, who is denying our health-insurance claims, or who has told the underpaid clerk to read their upselling script. We don’t know whom to look in the eye with disgust, whom to turn our backs on when they fail our communities. ♦</p>"},{"title":"Exploring the Limits of Qualified Immunity Under Harlow’s Discretionary Function Test Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/","category":"law","categoryLabel":"Law","wordCount":1291,"readingTime":7,"content":"<h2>Introduction</h2>\n<p>Buried in <em>Harlow v. Fitzgerald</em>,<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a> the Supreme Court’s leading decision on qualified immunity,<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a> a largely overlooked phrase invokes a mostly forgotten distinction in the law of official liability and government accountability.  <em>Harlow </em>is well known for the Court’s oft-quoted test for qualified immunity: “We therefore hold that government officials performing discretionary functions, generally are shielded from liability for civil damages insofar as their conduct does not violate clearly established statutory or constitutional rights of which a reasonable person would have known.”<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> Much subsequent doctrine and commentary has focused on the <em>Harlow </em>Court’s self-conscious decision to modify qualified immunity’s subjective “good faith”<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> element, putting a “clearly established law”<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> requirement in its place.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a>  Much less attention — indeed, almost no attention at all — has been paid to the Court’s decision to confine application of this new standard to claims brought against officers performing “discretionary functions,” leaving officers performing “‘ministerial’ tasks” unprotected by immunity.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  The Court itself has adverted to the distinction only a few times since <em>Harlow</em>, but has never outlined the difference between ministerial and discretionary functions as it relates to qualified immunity doctrine.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a> Scholars have yet to consider the matter in any detail.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a></p>\n<p>With no guidance from the Court distinguishing ministerial from discretionary tasks, and no clearly stated rationale that later jurists might use to draw the operative line, most lower courts have reflexively extended the law of qualified immunity to encompass all official action.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  As a consequence, the “clearly established law” standard seemingly applies to all constitutional tort claims, whether they implicate the discretionary acts and thought processes of high-level government officials or the actions of line officers best understood as ministerial.</p>\n<p>In this Essay, we aim both to excavate the longstanding distinction between ministerial and discretionary functions on which <em>Harlow</em> relied and to bring it to bear on qualified immunity doctrine.  We do so in three Parts.  Part I sketches how nineteenth-century government accountability law both shielded high-level official action and preserved rule of law values by authorizing suit to go forward against low-level officials.  It did so by directing litigation at executive officials performing ministerial functions.  Across a range of remedial forms — including those initiated by writs of trespass, mandamus, and habeas corpus — suits to test the legality of government policy were typically directed at line officers rather than policymaking officials.  Such ministerial actors enjoyed no immunity from suit and could not plead superior orders as a defense to personal liability.  Indemnity took the sting out of personal liability and shifted the cost of noncompliance to the government.</p>\n<p>Having clarified the role of ministerial accountability in the nineteenth century, Part II explains how constitutional litigation changed in the twentieth.  The discretionary function exemption operated at common law to create a zone of discretion within which the official could act free from any threat of liability.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-11\" target=\"_blank\" rel=\"noopener\">11</a>  But in a mostly overlooked element of <em>Ex parte Young</em>,<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-12\" target=\"_blank\" rel=\"noopener\">12</a> the Supreme Court rejected the claim that, as a high government official exercising discretion as to the enforcement of law, Minnesota Attorney General Edward T. Young’s prosecutorial decisions lay beyond judicial control.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-13\" target=\"_blank\" rel=\"noopener\">13</a>  In reaching that conclusion, the Court viewed the Fourteenth Amendment as imposing a duty on Young to refrain from enforcing unconstitutional state laws and as overriding any official immunity that Young might enjoy under state law.<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-14\" target=\"_blank\" rel=\"noopener\">14</a>  Later decisions broadened the direct enforcement of constitutional rights,<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-ref-15\" target=\"_blank\" rel=\"noopener\">15</a> setting the stage for constitutional tort suits against high-level officials and posing a threat to policy formulation that the Court chose to manage with qualified immunity.</p>\n<p>Part III explains on rule of law grounds why the <em>Harlow</em> Court’s protections for high-level discretionary actors do not inevitably extend to line officers who carry out the policies in question.  In keeping with the nineteenth-century model, <em>Harlow</em> balanced the importance of protecting high-level officials with the need to preserve a test of legality through litigation directed at low-level or ministerial actors.  Where government officials enforce the law through summary action, where no alternative modes of review exist, and where state of mind and policy formation play no confounding role in the assessment of legality, individuals should have a right to test constitutionality without having to surmount <em>Harlow</em>’s clear-law standard.  Indeed, many states continue to distinguish between ministerial and discretionary functions for liability purposes, agreeing with <em>Harlow</em>’s animating intuition that immunity does not extend to all official conduct.  Part III shows that any plausible version of the ministerial-discretionary distinction — whether rooted in nineteenth-century or more recent doctrine — would shrink qualified immunity’s footprint and lessen the impact of its many well-documented problems.  A brief conclusion follows.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1813.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> 457 U.S. 800 (1982).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally</em> William Baude et al., Hart &amp; Wechsler’s the Federal Courts and the Federal System 1311–19 (8th ed. 2025) [hereinafter H&amp;W 8] (summarizing qualified immunity doctrine).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>Harlow</em>, 457 U.S. at 818 (citing Procunier v. Navarette, 434 U.S. 555, 565 (1978); Wood v. Strickland, 420 U.S. 308, 322 (1975)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>id.</em> at 815–19; <em>see, e.g.</em>, H&amp;W 8, <em>supra</em> note 2, at 1314–15; Karen M. Blum, <em>Section 1983 Litigation: The Maze, the Mud, and the Madness</em>, 23 Wm. &amp; Mary Bill Rts. J. 913, 924 (2015); John C. Jeffries, Jr., Lecture, <em>What’s Wrong with Qualified Immunity?</em>, 62Fla. L. Rev. 851, 852 (2010); Joanna C. Schwartz, <em>Qualified Immunity’s Boldest Lie</em>, 88 U. Chi. L. Rev. 605, 613 (2021).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> <em>Harlow</em>, 457 U.S.at 816.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Bogan v. Scott-Harris, 523 U.S. 44, 51 (1998) (explaining that legislative immunity does not extend to ministerial actions). <em>Compare</em> Davis v. Scherer, 468 U.S. 183, 197 n.14 (1984) (explaining that a “law that fails to specify the precise action that the official must take in each instance creates only discretionary authority”), <em>with</em> Westfall v. Erwin, 484 U.S. 292, 298 (1988) (rejecting argument that absolute immunity protected officials because their “precise conduct” had not been mandated by law).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> On the centrality of the ministerial-discretionary distinction in the rise of judicial review in England and its continuing importance in the law of government accountability, see generally Louis L. Jaffe, Judicial Control of Administrative Action 329–34 (1965); James E. Pfander, <em>Zones of Discretion at Common Law</em>, 116 Nw. U. L. Rev. Online 148 (2021); and William Baude, Reply, <em>Is Quasi-Judicial Immunity Qualified Immunity?</em>, 74 Stan. L. Rev. Online 115 (2022). For a brief encounter with <em>Harlow</em>’s discretionary function limit, see James E. Pfander &amp; Rex N. Alley, <em>Federal Tort Liability After </em>Egbert v. Boule<em>: The Case for Restoring the Officer Suit at Common Law</em>, 138 Harv. L. Rev. 985, 1011–13 (2025). For a pre-<em>Harlow </em>discussion of the distinction’s relevance to immunity doctrine, see generally Kathryn Dix Sowle, <em>Qualified Immunity in Section 1983 Cases: The Unresolved Issues of the Conditions for Its Use and the Burden of Persuasion</em>, 55 Tul. L. Rev. 326 (1981).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>infra</em> notes 135–147 and accompanying text.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-11\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally</em> Baude, <em>supra</em> note 9 (characterizing the common law as providing only a narrow zone of immunity for discretionary, quasi-judicial acts); Pfander, <em>supra</em> note 9 (arguing that common law did not provide immunity when executive officials acted outside of their lawful discretion).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-11\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-12\" target=\"_blank\" rel=\"noopener\">^</a> 209 U.S. 123 (1908).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/exploring-the-limits-of-qualified-immunity-under-harlows-discretionary-function-test/#footnote-12\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<li>\n\t\
