<script>
var articles = [{"title":"Gut Renos of Ionesco and Chekhov","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/10/05/gut-renos-of-ionesco-and-chekhov","category":"fun","categoryLabel":"Interesting Reads","wordCount":1315,"readingTime":7,"content":"<p>Igor Golyak’s “Delirium,” a madcap, sneakily emotional reinvention of the 1962 Eugène Ionesco play “Frenzy for Two, or More,” opens with an alarming tableau: a dust-coated man is lying face down, crushed by a heavy door that covers his back like a turtle’s shell. He wears an infantry helmet but also a fancy suit with a cummerbund, and after wriggling out from under the door he props it up so that it faces him, knocks on it in a panic, and finally “breaks in” to the room he’s created. Then, making himself at home, he sits on a stack of four mattresses, which emit a loud groan. The night I attended, the audience giggled uneasily—a woman was clearly trapped down there, pancaked between mattresses as if buried in rubble. The man rescued her, but first he bounced on the bed a bit, experimentally, playing her groans like a piano.</p><p>This is our introduction to He and She, two clownish, pugilistic lovers who are locked in a war of words, even as a literal war rages outside. Golyak, an avant-garde director trained in Moscow, has made a set of aggressive edits to Ionesco’s surreal post-Second World War farce, trimming roles, amping up the slapstick, and framing the stage in industrial scaffolding draped with wobbly sheets of corrugated metal, which threaten to come crashing down. Golyak has added a big orange fish, which floats buoyantly in an aquarium, and he’s replaced the tatty bathrobes that Ionesco gave the couple with seedy Vegas finery, as if they’d dressed for a party that will never start. He’s made elegant additions, too, such as stitching in a lovely fairy tale that Ionesco wrote for his daughter and staging it with a whimsical storm of soap bubbles. Still, the core of the show remains the same: a couple ignores a public battle for a private one. Early in the play, She fumes at He, “A snail and a turtle, they’re the <em>same thing!</em>” Later, He holds up a telephone and insists it’s cheese. When grenades fly through their windows, they toss them back out, eager to resume their debate.</p><p>Golyak, whose parents fled Ukraine for Boston when he was nine, is the scrappy founder of Arlekin, a theatre company in Needham, Massachusetts, that is composed mainly of immigrants. His inventive productions often explore real-life stories of violence and displacement, including the much praised “Our Class,” which centers on an infamous pogrom in which Poles burned their Jewish neighbors to death in a barn. “Delirium,” in contrast, feels universal, a serum synthesized after the Second World War that still applies to modern wounds. He and She could be stuck in any war, in any room, anywhere in the world. And yet their repartee, full of insults (“Seducer!”) and loony demands (“Give me the definition of ‘insinuation’!”), is warped in the way contemporary language is warped: they’re gaslighting and trolling each other, like posters on some ancient Reddit thread that can no longer be parsed by outsiders. On the director’s Substack, “Theater of Questions,” he describes Ionesco’s absurdist scenario as a “shell” emptied of meaning, and this is true on multiple levels: the words are placeholders shuffled around in a deceptive game; they suggest scattered bullet casings, the residue of violence; they are safe places to hide out in, a rigid cover for vulnerable beings—turtles, snails, refugees—who are looking for comfort. But Golyak’s most significant intervention is to amplify the central romance, by slicing in flashes of sensuality and warmth, making He and She seem less like nemeses than like intimate partners, constructing a bridge of private jokes that allows them to shimmy their way past dread.</p><p>“Delirium” also felt like a relief to me—it offered a break from the usual polemic realism. Absurdity can be a liberation: it’s permission to stop making sense, an open door to ambiguity. Still, what makes Golyak’s production really roar into flame is the astonishing magnetism of his performers, Chulpan Khamatova, a Russian theatre and movie star who fled her homeland because of Putin’s invasion of Ukraine, and Andrey Burkovskiy, a celebrated Russian figure skater and actor. They’ve got Chaplin chops, with Khamatova a mischievous Kewpie doll in a mop-top blond wig and Burkovskiy a craggy acrobat whose expressions shift, like tectonic plates, from petulance to yearning. In Golyak’s vision, these two are not dead-eyed Rock ’Em Sock ’Em robots but flawed, tender humans who are vain, silly, angry, defensive, horny, innocent, and triumphant. Mainly, however, they’re terrified, and determined to fend off that fear. They eavesdrop on their neighbors, who are being kidnapped or, perhaps, tortured. Objects tumble from the scaffolding; bombs explode. But the couple’s focus is ultimately on each other. When a bullet flies into the room, each instinctively turns and asks, “Are you hurt?” Only once they know that they’re safe can the game begin again.</p><p>Simon Stone’s glamorous renovation of Chekhov’s tragicomic masterpiece “The Cherry Orchard” attempts something similar, with less success. In Stone’s version of the play, which is performed in Korean with English subtitles, he retains Chekhov’s plot about a fading aristocratic clan in denial about the sale of its home, but he dilutes the poetry, simplifies the characters, and flattens the themes, producing something like a deep-plane facelift—it’s pretty but unnervingly smooth. Stone’s “Cherry Orchard,” set in modern Seoul, is about a spoiled, wealthy family, the Songs, who run a corporation that is on the verge of collapse, owing to the family’s mismanagement. In place of a decrepit manor, the Songs live in a fabulous modernist mansion with a high-peaked slanted roof that cascades, in dramatic fashion, all the way to the ground in the form of a wide, tiered staircase, calling to mind a game of Chutes and Ladders—some characters will rise, others will tumble down. The actors regularly jog up to the peak, where they declaim their political beliefs, brood, or threaten suicide. The front of the house is all glass—a lousy place to throw stones.</p><p>That set, which was designed by Saul Kim, is genuinely spectacular to look at, as are the bright, casual costumes and the clever lighting. The cast is game, too, particularly Son Sang-kyu, who is very funny as a feckless chatterbox with a thing for retro record players, and Moon Choi, who plays the moodier, more legitimately aggrieved of two Song daughters. I was initially intrigued by Stone’s commitment to laughs, with the “tragi-” ripped off Chekhov’s comedy like a sales tag. Unfortunately, the results, while splashily entertaining, feel helium-light instead of morally weighty, with each encounter at once high-stakes and emotionally obvious. The players flatly declare their judgments: “She has ideas well above her station. It’s not appropriate.” They get sloppy drunk, then trauma-dump or make ill-advised passes, then apologize. By the final act, Chekhov’s subtle, empathetic, often unspoken power dynamics feel transmuted into a soapy romp that gestures at the class-warfare themes of “Succession” or “Parasite,” but without the former’s black wit or the latter’s pungency.</p><p>Instead, there’s a Bravo oomph to the shenanigans. Jeon Do-yeon, who plays the family’s matriarch, is colorfully slinky as a globe-trotting party widow, a vain, compulsively seductive narcissist who macks on her daughters’ men like a Real Housewife given a villain’s edit. A set of interlocking love triangles scores harsh laughs off familiar archetypes: a fuckboy, an incel, a soy boy, a finance bro who won’t commit. But farce can take you only so far. When there are glimmers, here and there, of unexpected angles—a sweet, strange speech about an abandoned turntable; the gentle bond between the younger Song daughter and a left-wing scholar—they quickly dissolve, subsumed by the archly satirical twists of the plot. Without authentic longing, and without any bittersweet complexity to the portrait of one social order replacing another, we’re left with little more than puffs of amusement, enough to escalate your mood but bound to fade by morning. ♦</p>"},{"title":"Because KBJ Denied Administrative Stay in Third-Country Removal Case, The Application Should Be Referred To The Full Court Now","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/09/24/because-kbj-denied-administrative-stay-in-third-country-removal-case-the-application-should-be-referred-to-the-full-court-now/","category":"law","categoryLabel":"Law","wordCount":894,"readingTime":5,"content":"<p>I may have to eat crow on the <a href=\"https://reason.com/volokh/2026/09/23/the-lightning-docket/\" target=\"_blank\" rel=\"noopener\">lightning docket</a> (no order in the Missouri case), but things are brewing with the third-country removal case. The Solicitor General's emergency <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A406/425583/20260924155624768_DVD%20stay%20Sept%202026%20FILE%20corrected.pdf\" target=\"_blank\" rel=\"noopener\">application</a> in <a href=\"https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/26a406.html\" target=\"_blank\" rel=\"noopener\"><em>United States v. D.V.D.</em> </a>lays out the issue neatly:</p>\n<blockquote><p>This is the third time the government has been forced to seek emergency relief from the district court's orders in this case about \"third-country removals\"—an essential tool to remove certain aliens, including some of the worst criminal aliens. This Court granted relief on both previous occasions. The latest order rests on the same fundamentally flawed legal premises as the previous rulings, and the nominal new grounds that the lower courts added to try to buttress those prior decisions are even weaker than those that failed to sustain the originals. Meanwhile, the equities that supported this Court's intervention (twice) have, if anything, only grown stronger in favor of the government's continued enforcement of the challenged policy. A stay is thus once again warranted. Cf. Trump v. Boyle, 145 S. Ct. 2653, 2654 (2025) (\"Although our interim orders are not conclusive as to the merits, they inform how a court should exercise its equitable discretion in like cases.\"). \"Although the posture of the case has changed, the parties' legal arguments and relative harms generally have not. The same result that [this Court] reached in [June 2025] is appropriate here.\" Noem v. National TPS Alliance, 146 S. Ct. 23, 24 (2025).</p>\n<p>An immediate administrative stay is particularly critical. The First Circuit had previously stayed this latest order pending appeal; the government thus has been conducting third-country removals under the challenged policy for the last 15 months. But at 11:36 p.m. last night—without even allowing the government to respond to respondents' motion (itself filed at 8:20 p.m.)—the First Circuit abruptly dissolved the stay. The unexpected springing-back of district court's order has, this Office is informed, created substantial logistical problems with ongoing removal operations— including the cancellation of flights—and led to added expense, potential diplomatic issues, and the inability to remove dangerous criminals. For example, DHS informs us that it has already canceled a flight to three separate countries carrying 70 aliens with criminal convictions (including aggravated assault and serious drug offenses), and that the cancellation has required a new round of diplomatic engagement with each of the three countries. Those disruptions will only get worse. To halt that chaos, an immediate administrative stay should be entered while the Court considers this application. <strong>In light of the ongoing disruption caused by the First Circuit as well as the prior stays granted by the full Court, if the Circuit Justice enters a briefing schedule without also entering an immediate administrative stay, the government respect fully requests that its request for the immediate administrative stay be referred to the full Court.</strong> Cf. Rollins v. Rhode Island State Council of Churches, 146 S. Ct. 402 (2025) (No. 25A539); A.A.R.P. v. Trump, 145 S. Ct. 1034 (2025) (No. 24A1007).</p></blockquote>\n<p>Circuit Justice Jackson has denied an administrative stay, and granted a four-day response time. That is leisurely compared to the 14 hours Justice Kavanaugh gave Missouri to respond.</p>\n<p>I think now the case is in fact referred to the full Court. Let's see whether there are five votes for an administrative stay. I think Justice Jackson tried to call her colleagues' bluff.</p>\n<p>My SCOTUSBlog <a href=\"https://www.scotusblog.com/2026/09/empower-the-supreme-courts-supermajority-on-substantive-matters/\" target=\"_blank\" rel=\"noopener\">post</a> on empowering the majority offered a similar remedy:</p>\n<blockquote><p>It is not clear how many votes are needed to take a case away from a circuit justice. Here, I propose a clear rule: the Refer-6. Six justices, at any point, can vote to refer any pending matter to the full court. At the latest, the Refer-6 can be invoked after the briefing is completed. The Refer-6 can also be invoked to establish a briefing schedule. Or the Refer-6 can be invoked as soon as an application is filed in order to enter an administrative stay.</p>\n<p>Realistically, the Refer-6 can be discussed even before an emergency application is filed. Usually, the clerk of the Supreme Court is given a heads-up that an emergency application is on its way. The Refer-6 can follow a Conference-3. At that point, the justices can informally establish a game plan, given how the case has proceeded through the lower courts. If six justices decide this matter belongs before the full court, the referral can happen right away. Of course, the circuit justice can dissent from the order being referred to the full court. But the circuit justice cannot stop the referral.</p>\n<p>Some of my proposals were designed to promote collegiality. The Refer-6 would have just the opposite effect. It would signal that the court did not want a particular circuit justice to have power over a matter. But I suspect this Rubicon was already crossed in the <em>Rhode Island</em> case. Jackson perhaps tried to do too much in her capacity as circuit justice, and her colleagues apparently countermanded her.</p></blockquote>\n<p>Justice Jackson makes the case for unilateral SCOTUS reform.</p>\n<p><strong>Update</strong>: Today Justice Jackson <a href=\"https://www.politico.com/news/2026/09/25/ketanji-brown-jackson-supreme-court-shadow-docket\" target=\"_blank\" rel=\"noopener\">gave a speech</a> at the University of District of Columbia. And this evening, Chief Justice Roberts, and Justices Barrett and Kavanaugh were at the <a href=\"https://www.nytimes.com/2026/09/24/us/politics/full-guest-list-trump-state-dinner-xi.html\" target=\"_blank\" rel=\"noopener\">White House State Dinner</a>. (I wonder if the Chief was given a tour of the new construction he tried to stop.) Query if the Justices somehow had an informal conference about the administrative stay before Jackson denied it.</p>"},{"title":"Automattic has a new board after failed attempt to put CEO on leave","source":"TechCrunch","author":"Sarah Perez","url":"https://techcrunch.com/2026/09/25/automattic-has-a-new-board-after-failed-attempt-to-put-ceo-on-leave/","category":"tech","categoryLabel":"Technology","wordCount":937,"readingTime":5,"content":"<p>Automattic CEO Matt Mullenweg has rebuilt the company’s board just weeks after its previous directors tried, and failed, to oust him. The board, which was announced to staff Friday, is an eclectic group that includes a best-selling science-fiction author and two co-founders of the now-defunct social app IRL, TechCrunch has learned, and Mullenweg has confirmed.</p>\n<p>The new board is the latest twist in an internal governance fight at Automattic, the parent company of WordPress.com, Tumblr, WooCommerce, and others. Earlier this month, the previous board voted to place Mullenweg <a href=\"https://techcrunch.com/2026/09/09/automattics-board-forces-ceo-matt-mullenweg-into-leave-of-absence/\" target=\"_blank\" rel=\"noopener\">on leave</a> in an attempt to remove him from the board, only to have the CEO <a href=\"https://techcrunch.com/2026/09/12/automattic-confirms-mullenweg-has-returned-as-ceo-after-attempted-ouster-by-board/\" target=\"_blank\" rel=\"noopener\">retake control</a> just 33 hours later and remove or accept the resignations of the directors who were involved.</p>\n<p>This week, Mullenweg <a href=\"https://x.com/photomatt/status/2102877364296257558\" target=\"_blank\" rel=\"noopener\">posted about a board meeting</a> but didn’t share who he was meeting with. Now he’s finally informing Automattic employees of the board changes via the company’s announcements channel in Slack.</p>\n<p>Sources told TechCrunch the new Automattic board includes: </p>\n<ul>\n<li>American writer Hugh Howey, author of the “Silo” book series. (Mullenweg and Howey <a href=\"https://web.archive.org/web/20240718120839/https://stuckincustoms.com/2018/10/13/treys-hike-along-the-camino-de-santiago-part-1-kevin-kelly/\" target=\"_blank\" rel=\"noopener\">both hiked along the Camino de Santiago</a> in Spain back in 2018.)</li>\n<li>“Breakup Bootcamp” author Amy Chan (who recently <a href=\"https://x.com/missamychan/status/2102954359646564666\" target=\"_blank\" rel=\"noopener\">reposted</a> Mullenweg’s tweet about the company’s AI site builder, <a href=\"https://spacefast.com/\" target=\"_blank\" rel=\"noopener\">Spacefast</a>).</li>\n<li>IRL co-founder Henry Khachatryan, who Mullenweg described as a “founder and builder,” a <a href=\"https://pi.co/about-pico/\" target=\"_blank\" rel=\"noopener\">longtime collaborator</a> with the late technology writer <a href=\"https://en.wikipedia.org/wiki/Om_Malik\" target=\"_blank\" rel=\"noopener\">Om Malik</a>, and the website builder of journalist <a href=\"https://www.linkedin.com/in/nickbilton\" target=\"_blank\" rel=\"noopener\">Nick Bilton</a>.</li>\n<li>And Krutal Desai, who co-founded the social app IRL with Khachatryan.</li>\n</ul>\n<p>We should note that IRL <a href=\"https://techcrunch.com/2023/06/26/irl-shut-down-fake-users/\" target=\"_blank\" rel=\"noopener\">shut down after investigations revealed</a> that nearly all of its user base was made up of bots. The co-founders, who also included CEO Abraham Shafi, later sued SoftBank <a href=\"https://www.delawarelitigation.com/2025/03/articles/chancery-court-updates/chancery-lets-suit-over-who-caused-get-together-inc-s-break-up-continue/\" target=\"_blank\" rel=\"noopener\">and other investors</a> after <a href=\"https://www.cnbc.com/2023/08/04/softbank-sues-social-media-startup-irl-alleging-fake-user-numbers.html\" target=\"_blank\" rel=\"noopener\">SoftBank had sued for securities fraud</a>.</p>\n<p>New advisers have also joined Automattic, including former Whoop CTO <a href=\"https://www.jaimewaydo.com/about\" target=\"_blank\" rel=\"noopener\">Jaime Waydo</a>, June co-founder <a href=\"https://www.linkedin.com/in/mattvanhorn\" target=\"_blank\" rel=\"noopener\">Matt Van Horn</a>, and KISSmetrics co-founder <a href=\"https://www.linkedin.com/in/hnshah\" target=\"_blank\" rel=\"noopener\">Hiten Shah</a>.</p>\n<p>In the announcement to staff, Mullenweg reportedly wrote that, “for purposes of Delaware law, I am the CEO, President, Treasurer, and Secretary,” adding that the attempted firing had also brought in “many amazing supporters.”</p>\n<p>“We had the most interesting board meeting in a decade (since the Woo acquisition),” he said. </p>\n<p>Reached for comment, Automattic said it hoped to have a comment for TechCrunch soon. After publication, Mullenweg confirmed the board additions and advisors, and shared the following statement: “We are living through times of unprecedented change, possibly a singularity. The next six months will determine the next 20 years of Automattic.” </p>\n\n<p>Automattic’s original board had voted to put Mullenweg on paid leave, but he took back control of the company, letting go of those involved in what <a href=\"https://x.com/photomatt/status/2098446534677590301\" target=\"_blank\" rel=\"noopener\">he described on X as a “coup attempt.”</a></p>\n<p>To replace the board, Mullenweg leveraged his voting shares — <a href=\"https://techcrunch.com/2024/10/30/matt-mullenweg-talks-about-automattics-staffing-issues-and-financials-at-techcrunch-disrupt/\" target=\"_blank\" rel=\"noopener\">he controls 84%</a> of the vote, he said at TechCrunch Disrupt 2024. The period between his departure and return lasted exactly “33 hours and 20 minutes,” Automattic told TechCrunch previously.</p>\n<p>Following the failed board vote, member <a href=\"https://www.linkedin.com/in/tonischneider/\" target=\"_blank\" rel=\"noopener\">Toni Schneider,</a> a founding CEO of Automattic and now CEO of Bluesky, resigned from his board position. Mullenweg himself removed <a href=\"https://generalanndunwoody.com/\" target=\"_blank\" rel=\"noopener\">General Ann Dunwoody</a> from the board, and board member <a href=\"https://www.linkedin.com/in/sue-decker/details/experience/\" target=\"_blank\" rel=\"noopener\">Sue Decker</a> also resigned. In addition, Mullenweg let go of Automattic CFO Mark Davies, who was slated to become interim CEO, and chief legal officer <a href=\"https://www.linkedin.com/in/andy-missan/\" target=\"_blank\" rel=\"noopener\">Andy Missan</a>, TechCrunch confirmed with sources.</p>\n\n<p>The board never publicly shared its reasons for trying to oust Mullenweg.</p>\n<p>Of note, Mullenweg also <a href=\"https://x.com/photomatt/status/2099688934553039264\" target=\"_blank\" rel=\"noopener\">replaced</a> Automattic’s legal counsel after his return, a move that raises questions about whether the boardroom fight is tied to the company’s ongoing lawsuit with <a href=\"https://techcrunch.com/2025/01/12/wordpress-vs-wp-engine-drama-explained/\" target=\"_blank\" rel=\"noopener\">hosting provider WP Engine over trademark disputes</a> and claims over WP Engine’s lack of contribution to the WordPress open source project. (WP Engine’s legal team had also accused Mullenweg this July of destroying evidence, <a href=\"https://www.courtlistener.com/docket/69221176/357/wpengine-inc-v-automattic-inc/\" target=\"_blank\" rel=\"noopener\">court filings</a> show.)</p>\n<p>In an internal message shared after the ousting and return, Mullenweg had acknowledged the chaos it caused, saying:</p>\n<blockquote>\n<p>Last week, several board members formed a special committee and voted to place me on a leave of absence. They did this without advance warning and without giving me a meaningful opportunity to understand or respond to their concerns before they acted. I was denied even a brief extension to consult with independent legal counsel.</p>\n<p>I took the steps necessary to reverse that action. I am back and fully in charge of the company. I am again working alongside you to make our company a success.</p>\n<p>I also want to share that we have retained Susman Godfrey LLP as our new litigation counsel. Susman Godfrey is one of the top trial firms in the country, and they will be protecting our company’s interests and defending us in our ongoing litigation.</p>\n<p>I know this past week has been unsettling. I appreciate your patience and your continued focus on the work that matters. I will have more to share soon, but for now, know that Automattic’s mission and priorities remain unchanged.</p>\n</blockquote>\n<p><em>Corrections and updates: After publication, TechCrunch updated to clarify that Waydo is the former Whoop CTO</em>. <em>We also added Mullenweg’s statement and confirmation</em>.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n<p>\n\t\tSarah has worked as a reporter for TechCrunch since August 2011. She joined the company after having previously spent over three years at ReadWriteWeb. Prior to her work as a reporter, Sarah worked in I.T. across a number of industries, including banking, retail and software.\n</p><p>You can contact or verify outreach from Sarah by emailing <a href=\"mailto:sarahp@techcrunch.com\" target=\"_blank\" rel=\"noopener\">sarahp@techcrunch.com</a> or via encrypted message at sarahperez.01 on Signal.</p> \t\n<p>\n\t<a href=\"https://techcrunch.com/author/sarah-perez/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"},{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/the-sunday-papers-827","category":"gaming","categoryLabel":"Gaming","wordCount":1035,"readingTime":6,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays are for realising that after playing <a href=\"https://www.rockpapershotgun.com/games/the-blood-of-dawnwalker\" target=\"_blank\" rel=\"noopener\">The Blood of Dawnwalker</a>, you've developed a craving for blackcurrant juice. There's none in the cupboard, so you venture out to get some, floating across the rooftops as a trail of mist as you go. You arrive at the supermarket, fangs bared and claws out. You parry and dodge attackers armed with trollies as you fight your way up the aisles. There it is. The sweet crimson nectar. You reach out to grab a bottle. A hand reaches out through the display and grips your wrist.</p>\n<p>\"Brencis?\" you cry out. There's no answer. Instead, the strange appendage begins to drag you along the aisle at warp speed, knocking off bottles which thunk and bump against your face as they fall. \"Stoooooooooooppppppppppp,\" you cry as the a black eye begins to form where a cola bottle got you good. Surprisingly, the rogue arm obeys. However, it doesn't loosen its grip. Blinking away spilled beverages, you find yourself face-to-face with a label. Steve Ballmer Betrayed His Fellow Billionaires, And They Are Not Pleased, it reads. It's made by a company called <a href=\"https://defector.com/steve-ballmer-betrayed-his-fellow-billionaires-and-they-are-not-pleased\" target=\"_blank\" rel=\"noopener\">Defector</a> and seems to contain commentary on the Los Angeles Clippers <a href=\"https://www.espn.co.uk/nba/story/_/id/49806356/nba-announces-punishments-clippers-kawhi-probe\" target=\"_blank\" rel=\"noopener\">being slapped</a> for violating the NBA's rules on paying basketball players.</p>\n<blockquote>The sleazy-funny particulars aside, this story and the extraordinary penalty the Clippers and Ballmer received are ultimately about a group of the other 29 franchise operators, maybe even all of them, policing their cohort's conduct. Some of those owners helped midwife Ballmer into the group 12 years ago when Donald Sterling finally disgraced his way out of ownership. They are getting theirs back, not because they all wanted Leonard to play on their team—that would mean competing for a prize, which few of them prioritize above collecting their revenues—but because Ballmer unclogged his nostrils on the salary cap, which is both practically and conceptually the grand underpinning of their profitability.</blockquote>\n<p>As soon as you're done reading, the arm takes off once more. You're dragged down the soup aisle, tins ricocheting to and fro. Before you know it, your face is covered in a thick mask of baked beans. \"No, helpppp, stopppppppp,\" you yell through the orange haze. The appendage complies again. A packet stands before you. The Blood of Dawnwalker's lack of stealth makes this Witcher 3-like feel incomplete, its label reads. Ooh, a take from <a href=\"https://www.gamesradar.com/games/rpg/the-blood-of-dawnwalkers-lack-of-stealth-makes-this-witcher-3-like-feel-incomplete/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a> foodmaker Fran Ruiz that you're <a href=\"https://www.rockpapershotgun.com/the-blood-of-dawnwalker-review-worthy-to-sip-blood-at-the-top-rpgs-table\" target=\"_blank\" rel=\"noopener\">not sure you agree with</a>, but know <a href=\"https://www.rockpapershotgun.com/blood-of-dawnwalkers-troubled-power-fantasy-has-me-yearning-for-a-more-desperate-systemic-vampire-survival-sim\" target=\"_blank\" rel=\"noopener\">others who certainly might</a>.</p>\n<blockquote>As we've seen in other open-world games with infamy systems, there's no easy answer to the dilemma of properly reacting to players' chaotic actions in ways that both preserves the credibility of the established narrative and dynamically raises the challenge. Coen is a unique kind of menace, though. Whether day or at night, he's charging into conflict, sword out, ready for a proper melee. Even when he's walking around the city of Svartrau, he doesn't seem to mind being recognized until it's too late. I know he's no Agent 47 or Ezio Auditore, but this disconnect makes me wish The Blood of Dawnwalker had even more friction baked in.</blockquote>\n<p>Woosh. You're yanked off again (not like that). Things start to smell a bit more earthy. Oh bugger, the fruit and veg section! Soon, you're being slapped with apples and creamed by bananas. \"Pleeeesseee, scccchhhhhtttoopppp\", you mumble through a mouth nearly plugged up by a loose turnip. All is still. Before you sits a marrow. On its label are the words 'Petit Planet's latest build brings Pokopia-inspired elements to <a href=\"https://www.rockpapershotgun.com/games/animal-crossing\" target=\"_blank\" rel=\"noopener\">Animal Crossing</a> in space'. You notice that this particular bit of veg has seemingly been reserved for a Rebecca Jones of <a href=\"https://www.respec.net/preview/194-petit-planets-latest-build-brings-pokopia-inspired-elements-to-animal-crossing-in-space\" target=\"_blank\" rel=\"noopener\">Respec</a>, which you assume to be nearby town.</p>\n<blockquote>Turns out things aren't all smooth sailing for this jellyfish girl who has decided to go and live on land, and the quest was a surprisingly heartfelt examination of both emotional and physical homesickness, tasking the protagonist with learning to cook some of Nerina's favourite seafoods and – at one point – literally fish her out of the museum's ocean exhibit after she hurls herself in during a fit of delirium, which honestly got a bit darker than I'd been expecting.</blockquote>\n<p>The world becomes a blur once more. Things start to get cold. The frozen section beckons. You make peace with the fact you might be about to die of hypothermia amid a sea of 3 for 2 signs. Shards of ice skitter aside as your skin begins to numb. You have just enough energy to beg in whispers for the arm to stop once and for all. It does. A box offers you instructions as to How to throw a LAN party in 2026. Why's this in the frozen section? Ah, it's made by Morgan Park of <a href=\"https://www.pcgamer.com/games/fps/how-to-throw-a-lan-party-in-2026/\" target=\"_blank\" rel=\"noopener\">Perfectly Cold Gamer</a>.</p>\n<blockquote>It was comfortably the best birthday party I've had as an adult. I was worried at first that going to all this trouble to play stuff that we could more easily set up over Discord would end up feeling pointless, but that was quickly disproven: Everything about playing shooters with your buds is more fun when they're actually in the room emoting, reacting, and trash-talking to your face. I want to make this a more regular thing, but honestly, it wasn't a smooth ride. We had issues both technical and logistical—some self-inflicted, some harder to predict. We really could've used a LAN veteran on the scene.</blockquote>\n<p>Suddenly the arm pulls you head-first into the depths of a freezer. The cold is everywhere and it's overwhelming. You realise that the arm belongs to a bald man who's curled up next you. \"Brencis?\" you ask again.</p>\n<p>\"Yes,\" the vampire baddie from The Blood of Dawnwalker says.</p>\n<p>\"What are you doing here?\"</p>\n<p>\"It's a long stor-\"</p>\n<p>Before he can finish, the freezer opens and you're both yanked out. The pair of you end up laid out on a trolley atop a mound of frozen peas. Gazing down at you is the face of Adrian Edmondson. He takes off pushing at warp speed, laughing maniacally while the pair of you hold on for dear life and <a href=\"https://www.youtube.com/watch?v=tIPc6pCbuWk\" target=\"_blank\" rel=\"noopener\">some Witchery tunes</a> play over the tannoy.</p>"}];
var currentIndex = 0;

  var a = articles[currentIndex];

    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
