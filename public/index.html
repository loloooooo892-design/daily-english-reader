*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;

  color: var(--text);
  line-height: 1.75;

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;

  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {

.archive-link {

  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {

@media (max-width: 480px) {

<script>
var articles = [{"title":"The 9 buzziest startups from Y Combinator’s latest Demo Day, according to VCs","source":"TechCrunch","author":"Dominic-Madori Davis","url":"https://techcrunch.com/2026/09/13/the-9-buzziest-startups-from-y-combinators-latest-demo-day-according-to-vcs/","category":"tech","categoryLabel":"Technology","wordCount":1170,"readingTime":6,"content":"<p>Another Y Combinator Demo Day took place on Thursday, but this batch looked a little different. While every cohort brings a fresh wave of founders, the startups presenting this week skewed far more toward deep tech than in past years.</p>\n<p>As we do every quarter, TechCrunch asked early-stage VCs to name the hottest startups in this batch — both their top picks and the deals everyone was talking about. And as usual, we put together a list of startups flagged by at least two investors as the buzziest in the batch.</p>\n<p>The tech in this batch felt “like science fiction,” as one investor put it. But beyond the wild ideas, the consensus was that valuations were far more grounded than in recent cohorts.</p>\n<p>We’ve listed the top picks alphabetically below:</p>\n<p><strong><a href=\"https://www.ycombinator.com/launches/Rwg-atomarine-floating-nuclear-data-centers\" target=\"_blank\" rel=\"noopener\">Atomarine</a></strong> </p>\n<p><strong>What it’s building: </strong>Nuclear-powered data centers floating at sea </p>\n<p><strong>Why it’s a fav: </strong>Power is in short supply and local communities are increasingly opposing the buildout of new data centers. Atomarine — co-founded by an MIT grad with computer science and naval engineering degrees and an MIT PhD student in nuclear engineering — wants to solve the compute shortage by putting data centers on barges at sea, where seawater could provide near-free cooling. The startup plans to launch a gas-powered pilot by 2028 and plans to transition to floating nuclear power ships in 2032. Atomarine claims it has already secured over $4 billion in customer interest through letters of intent. That revenue potential has helped make it one of the highest-valued startups in the batch, one VC told TechCrunch.</p>\n<p><strong><a href=\"https://www.ycombinator.com/launches/SiE-dipole-labs-shooting-lasers-to-solve-the-billion-dollar-bottleneck-inside-ai-datacenters\" target=\"_blank\" rel=\"noopener\">Dipole Labs </a></strong></p>\n<p><strong>What it’s building: </strong>Effective and energy-efficient high-speed optical networking hardware for AI data centers</p>\n<p><strong>Why it’s a fav: </strong>The idea is that GPU clusters waste a lot of compute time simply waiting for data to move between each chip. Within the networking layer, data is converted from light to electricity and back again in a process that burns lots of power and yields lots of heat. But Dipole Labs says it built an optical switch that skips the conversion so the data can stay as light and go directly where it needs to go. It’s a timely problem to tackle as GPUs are crazy expensive and data centers want the most out of their compute hardware without leaving any time to spare. </p>\n<p><strong><a href=\"https://www.ycombinator.com/companies/isengard-industries-inc\" target=\"_blank\" rel=\"noopener\">Isengard Industries</a> </strong></p>\n<p><strong>What it’s building:</strong> Locally producible, jet-powered strike and counter-drones</p>\n<p><strong>Why it’s a fav: </strong>Isengard aims to mass-produce jet-powered attack and counter-drones directly within allied countries, at a fraction of what prime contractors charge to build them in the U.S. Co-founded by a former Australian Army officer and a defense entrepreneur who previously scaled another Ukraine-focused drone startup to $60 million in revenue, Isengard is already generating $10 million in revenue itself. The startup has generated strong VC buzz, garnering one of the loftiest valuations in this YC batch, according to two investors.</p>\n<p><a href=\"https://www.ycombinator.com/launches/SIU-lamb-labs-custom-chips-for-ai-inference\" target=\"_blank\" rel=\"noopener\"><strong>Lamb Labs</strong></a></p>\n<p><strong>What it’s building: </strong>Custom inference chips with hardcoded AI model weights</p>\n<p><strong>Why it’s a fav: </strong>Traditional AI chips burn massive amounts of energy during inference, fetching model weights from memory. Co-founded by an Imperial College London AI PhD and an Oxford theoretical physicist, Lamb Labs wants to build ultra-efficient chips by hardcoding AI model weights directly into silicon. Dubbed “Model Processing Units” (MPUs), these custom chips eliminate memory-bandwidth bottlenecks.</p>\n<p><strong><a href=\"https://www.ycombinator.com/companies/praxis-robotics\" target=\"_blank\" rel=\"noopener\">Praxis Robotics</a></strong></p>\n<p><strong>What it’s building: </strong>Collecting real-world data on which to train robots </p>\n<p><strong>Why it’s a fav: </strong>This company partners with businesses to collect videos and data of humans doing work, which it then turns into training material for companies building robots. It says it’s already working with publicly traded companies and has captured video data in more than 150 different environments. This company could become important as businesses start experimenting more with which tasks are best for humans — and, as AI continues to refine itself, which tasks are better left to a robot. </p>\n<p><strong><a href=\"https://www.norirobotics.com/\" target=\"_blank\" rel=\"noopener\">Nori</a></strong></p>\n<p><strong>What it’s building: </strong>Creating affordable robots to handle everyday tasks </p>\n<p><strong>Why it’s a fav: </strong>Launched just six weeks ago, this company already touts almost half a million in sales. That’s not shocking — it’s a humanoid robot that is promising to help clean and fold clothes. Users can also operate their robot via a laptop app. It’s priced at around $1,600, which is a steal compared to other humanoids like Neo, priced around $20,000. One of the biggest questions in robotics is if it is possible to create an affordable at-home robot that can actually stack a dishwasher and do everyday home tasks. Nori is another swing at taking on the task. </p>\n<p><strong><a href=\"https://www.ycombinator.com/companies/cosmic-robotics\" target=\"_blank\" rel=\"noopener\">Cosmic Robotics </a></strong></p>\n<p><strong>What it’s building: </strong>Autonomous robots that can lift heavy objects </p>\n<p><strong>Why it’s a fav: </strong>The founders of this company want to build a city on Mars. The first step to that? Building robotic technology that performs heavy-duty tasks. It says its tech is already installing solar panels across the U.S. and that it has $25 million in contracts through 2027. The vision is that this technology can help automate construction for colonizing Mars. The startup is racing with SpaceX’s timeline for building on Mars, as it hopes to begin an exploratory mission by 2028. </p>\n<p><strong><a href=\"https://www.ycombinator.com/companies/parasma\" target=\"_blank\" rel=\"noopener\">Parasma</a></strong></p>\n<p><strong>What it’s building: </strong>Training human brain cells to one day power compute </p>\n<p><strong>Why it’s a fav: </strong>Another company trying to find the best way to tackle how much power and energy is needed to run models. This time, Parasma is looking at using human brain cells as an effective, more energy-efficient alternative to today’s AI computing hardware. </p>\n<p><a href=\"https://www.ycombinator.com/companies/waddle-labs\" target=\"_blank\" rel=\"noopener\"><strong>Waddle Labs</strong></a></p>\n<p><strong>What it’s building:</strong> An API layer that writes robot control code</p>\n<p><strong>Why it’s a fav:</strong> Investors and tech enthusiasts are hoping that the ChatGPT moment for robots is around the corner. That excitement is driving different approaches to creating a general robotics model. Instead of training foundation models on raw video or human teleoperation data, Waddle Labs uses a layer of LLM agents to write code and control robots directly. The startup, founded by Harvard graduates, is positioning itself as “Claude Code for robotics.” The startup claims that by plugging any hardware into Waddle’s API, developers will be able to tell the robot what to do in natural language, and its AI agents will autonomously generate executable control code, check that it worked, and set up the robot in about 20 minutes.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Marina Temkin is a venture capital and startups reporter at TechCrunch. Prior to joining TechCrunch, she wrote about VC for PitchBook and Venture Capital Journal. Earlier in her career, Marina was a financial analyst and earned a CFA charterholder designation.</p>\r\n<p>You can contact or verify outreach from Marina by emailing <a href=\"mailto:marina.temkin@techcrunch.com\" target=\"_blank\" rel=\"noopener\">marina.temkin@techcrunch.com</a> or via encrypted message at +1 347-683-3909 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/marina-temkin/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>\n\n\t\t<p>Dominic-Madori Davis is a senior venture capital and startup reporter at TechCrunch. She is based in New York City.</p>\r\n<p>You can contact or verify outreach from Dominic by emailing <a href=\"mailto:dominic.davis@techcrunch.com\" target=\"_blank\" rel=\"noopener\">dominic.davis@techcrunch.com</a> or via encrypted message at +1 646 831-7565 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/dominic-madori-davis/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Briefly Noted Book Reviews","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/21/dey-etna-are-they-dead-yet-unbelonging","category":"fun","categoryLabel":"Interesting Reads","wordCount":527,"readingTime":3,"content":"<p><strong>Dèy</strong><em>, by Edwidge Danticat (Knopf)</em>. Set among Haitian Americans in Miami, this novel centers on Magnolia, a young mother who is at a mall when a mass shooter opens fire. She escapes and, because she does not want to be defined by the tragedy, decides not to tell anyone about it. In the weeks that follow, Magnolia plans her daughter’s birthday, negotiates her relationship with her daughter’s father, and coördinates medical care for her aging parents, who are living in Haiti amid growing violence. This fascinatingly banal aftermath forces the reader to confront the normalcy of such horror in a world where approximately seven per cent of American adults have been at the scene of a mass shooting. Danticat asks, Is gun violence newsworthy anymore? Or is it everyday life?</p><p><strong>Etna</strong><em>, by Paul Yoon (Scribner)</em>. This novel’s narrator is a dog who lives on a farm in a nameless country that is descending into war. One day, a woman arrives who can speak with him telepathically; she names him Etna and takes him to be trained by American soldiers as a combat dog. After years of conflict, Etna is a grizzled veteran who knows how to search for explosives and how to kill. But, when the war ends, the world as he knew it has been destroyed. He abandons his handlers and wanders the wasted land, searching for any home that might be left. Yoon’s choice to plant his sparely written novel in a canine perspective reveals the devastation that human aggression can inflict on all creatures.</p><h2><a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\">What We’re Reading</a></h2><p><em>Discover notable new fiction, nonfiction, and poetry.</em></p><p><strong>Are They Dead Yet?</strong><em>, by Sam Roberts (Bloomsbury)</em>. “Writing obituaries is not a job for the faint of heart, nor the heartless,” Roberts announces early in this pithy and engaging survey of what he calls “the dead beat.” Roberts, who has written more than sixteen hundred obituaries, retraces the origins of the form (in ancient Rome) and the emergence of the modern newspaper obituary (in the eighteenth century). As he describes the process by which writers and editors decide who among the “more than 150,000 or so people who die each day around the world qualify to be immortalized in the <em>Times</em>,” he demonstrates how and why obituaries “demand a degree of empathy not required of, say, political reporting or restaurant reviews.”</p><p><strong>Unbelonging</strong><em>, by Catherine Jagoe (Wisconsin)</em>. This sensitively observed essay collection, by a translator of Spanish literature, considers the elusive nature of home. “Defining home, identifying a homeland, feeling at home. I just can’t seem to manage it,” Jagoe writes. In trying, however, she ranges elegantly across experiences, from the ecstasy of swimming to the “deep, dark wintering” of depression. The act of patiently noticing the physical world runs through the book. In Madrid, she reëncounters the “upland light, landscape, and air” of Nigeria, where she lived as a small child; and though southern Wisconsin, where she lives today, lacks the “transparent, haunting fragrance” of wild bluebells in the woods of England, her country of birth, she discovers a place for herself there nonetheless, through close engagement with the landscape.</p>"},{"title":"Upcoming vampire RPG Nighthawks has been removed from Steam search and delisted in certain countries as Valve classifies it Adults Only: 'It's very bad news for us'","source":"PC Gamer","author":"Rick Lane","url":"https://www.pcgamer.com/games/rpg/upcoming-vampire-rpg-nighthawks-has-been-removed-from-steam-search-and-delisted-in-certain-countries-as-valve-classifies-it-adults-only-its-very-bad-news-for-us/","category":"gaming","categoryLabel":"Gaming","wordCount":825,"readingTime":5,"content":"<p><a href=\"https://www.pcgamer.com/sunless-sea-writer-and-blackwell-developer-team-up-for-urban-vampire-rpg-nighthawks/\" target=\"_blank\" rel=\"noopener\">Nighthawks</a>, the long-in-development vampire RPG due to be released later this month, is the latest game to run afoul of Steam's<a href=\"https://www.pcgamer.com/software/platforms/steam-introduces-new-rule-prohibiting-certain-kinds-of-adult-content-that-might-make-visa-or-mastercard-unhappy-financial-deplatforming-in-action/\" target=\"_blank\" rel=\"noopener\"> increasingly stringent rules</a> regarding adult content. According to publisher Wadjet Eye Games, the game has been labelled 'Adults Only'—causing it to be removed from Steam search and outright delisted in certain countries like Germany—despite claims from both developer and publisher that the RPG's depictions of sex and nudity are very mild.</p><p>\"We are aware that Steam has classified Nighthawks as an adult game and has excluded it from searches,\" Wadjet Eye boss Dave Gilbert<a href=\"https://bsky.app/profile/wadjeteyegames.com/post/3mvfcsoeezc24\" target=\"_blank\" rel=\"noopener\"> wrote on Bluesky</a>. \"We are working on it. Valve is under the impression that this game is way sexier than it actually is.\" Gilbert further commented that \"Valve is basically treating Nighthawks like a porn game!\" in responding to a reply to his initial post.</p><p>A game being labelled Adults Only can affect its visibility in several ways. Adults Only games will not appear in Steam searches by default, requiring users to log in, verify their age (which <a href=\"https://www.pcgamer.com/gaming-industry/steam-now-requires-australian-users-to-have-a-credit-card-to-purchase-r18-games-and-no-a-simple-bank-debit-card-wont-work/\" target=\"_blank\" rel=\"noopener\">requires the use of a credit card</a> in some countries) and adjust their preferred content settings before they become visible. In addition, the label can cause games to be delisted outright in certain countries.</p><p>In a statement to PC Gamer, Nighthawks' creator Richard Cobbett (who, for the sake of transparency, is also a PC Gamer contributor) provided an overview of the situation, and how the Adults Only label is likely to affect Nighthawks' launch:</p><p>\"It's very bad news for us, because it immediately makes the game persona non grata in several important countries like Germany,\" Cobbett wrote. \"We're not sure exactly what triggered the issue, but we've obviously contacted Valve and we're hoping that they will quickly remove the scarlet letter.\"</p><p>Cobbett also outlined the themes and ideas Nighthawks explores and depicts, and explained why the Adults Only label has come as such a shock: \"Vampires are inherently a bit sexy, and Nighthawks is definitely a mature game in terms of content. However, regarding nudity, sex, and similar elements specifically, it's really all very mild, usually comedic in tone when it happens, and far less explicit than anything you'd see on HBO.\"</p><p>Going into specifics, Cobbett added that \"in terms of content, we're talking a few butt shots and some other censored naughty bits, mostly as part of companion romances and similar content, where you don't get to see anything explicit and sex scenes typically consist of a fun 'date' type adventure to explore the relationship and different character dynamics along with perhaps a small slice of cheesecake, but ultimately don't go much further than a tasteful fade to black followed by 'Ten minutes later.'\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Nighthawks isn't the only game to be recently caught out by Valve's stricter adult content policies. In July, the indie adventure<a href=\"https://www.pcgamer.com/gaming-industry/indie-game-gets-last-minute-steam-delay-while-valve-reviews-its-dozens-of-untextured-polygons-depicting-ass-and-boobs/\" target=\"_blank\" rel=\"noopener\"> Future? No thanks!</a> was forced to delay its release on account of a weeks-long Steam review process, which was triggered by the presence of 'dozens of untextured polygons depicting ass and boobs' in one of its sequences. The review process was eventually completed in the game's favour, and Future? No Thanks! released on Steam on September 4.</p><p>Part of the problem is that Valve's rules on what qualifies as adult content are <a href=\"https://partner.steamgames.com/doc/gettingstarted/onboarding\" target=\"_blank\" rel=\"noopener\">somewhat byzantine</a>. Valve requires developers to appropriately age gate games with mature or adult themes, but doesn't itself draw a line between the two, requiring developers to make that judgment for themselves. Matters were further complicated last year when Valve added another rule that prohibits \"Content that may violate the rules and standards set forth by Steam’s payment processors and related card networks and banks, or internet network providers. In particular, certain kinds of adult only content.\"</p><p>Ultimately, Cobbett concluded that \"If you're not scandalised by the likes of<a href=\"https://www.pcgamer.com/games/rpg/dragon-age/\" target=\"_blank\" rel=\"noopener\"> Dragon Age</a>, you're really not going to get too hot and bothered here either. We're hoping that Valve will quickly reverse the decision and approve the game so that everyone can get to be the vampire they deserve to be as planned next week.\"</p><p>PC Gamer has reached out to Valve for comment. Nighthawks is set to launch on September 22.</p>\n\n<p>Rick has been fascinated by PC gaming since he was seven years old, when he used to sneak into his dad's home office for covert sessions of Doom. He grew up on a diet of similarly unsuitable games, with favourites including Quake, Thief, Half-Life and Deus Ex. Between 2013 and 2022, Rick was games editor of Custom PC magazine and associated website <a href=\"http://bit-tech.net/\" target=\"_blank\" rel=\"noopener\">bit-tech.net</a>. But he's always kept one foot in freelance games journalism, writing for publications like Edge, Eurogamer, the Guardian and, naturally, PC Gamer. While he'll play anything that can be controlled with a keyboard and mouse, he has a particular passion for first-person shooters and immersive sims.</p>"},{"title":"UN Secretary-General calls on world leaders to invest in peace as global conflicts reach post-WWII high","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/un-secretary-general-calls-on-world-leaders-to-invest-in-peace-as-global-conflicts-reach-post-wwii-high/","category":"law","categoryLabel":"Law","wordCount":512,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/un-secretary-general-calls-on-world-leaders-to-invest-in-peace-as-global-conflicts-reach-post-wwii-high/#\" target=\"_blank\" rel=\"noopener\">UN Secretary-General calls on world leaders to invest in peace as global conflicts reach post-WWII high</a>\n</strong><p>UN Secretary-General António Guterres on Wednesday <a href=\"https://news.un.org/en/story/2026/09/1168301\" target=\"_blank\" rel=\"noopener\">urged</a> world leaders to take concrete action and invest in peace, warning that violence, division and conflict are deepening worldwide and that needed dialogue to resolve conflicts is absent.</p><p>Guterres spoke during the annual Japanese Peace Bell ceremony at UN Headquarters in New York, held ahead of the <a href=\"https://www.un.org/en/observances/international-day-peace\" target=\"_blank\" rel=\"noopener\">International Day of Peace</a> on September 21. This year’s theme, “Invest in Peace: For Everyone, Everywhere, Every Day,” honors what the UN has called the “everyday architects of peace,” including volunteers, advocates, civil society leaders, and peacekeepers working at the community level.</p><p>In <a href=\"https://www.un.org/sg/en/content/sg/statements/2026-09-09/secretary-generals-remarks-the-peace-bell-ceremony-delivered\" target=\"_blank\" rel=\"noopener\">his remarks</a>, Guterres said peace required active effort instead of passivity. He warned that conflicts across the globe were intensifying resulting in communities being torn apart by violence, and that the solidarity and dialogue required for viable solutions were largely absent. He noted that in places where governments were failing to secure peace, ordinary people were paving the way by raising their voices, bridging divides, and healing communities.</p><p>The Secretary-General urged leaders gathering at the United Nations in the coming weeks for the General Assembly <a href=\"https://www.un.org/en/ga/81/meetings/\" target=\"_blank\" rel=\"noopener\">high-level debate</a>, which opens September 23, to follow that example by investing in health, education, nutrition, and social protection, and by building institutions people can trust. He called on governments to safeguard human rights and dignity, recommit to what he described as “the proven tools of peace,” including diplomacy, dialogue, negotiation, and <a href=\"https://www.jurist.org/news/2026/08/two-un-peacekeepers-confirmed-dead-and-several-wounded-after-ambush-in-south-sudan/\" target=\"_blank\" rel=\"noopener\">peacekeeping</a>, and to <a href=\"https://www.jurist.org/commentary/2025/06/the-dirty-little-wars-of-the-21st-century-where-civilians-pay-the-price/\" target=\"_blank\" rel=\"noopener\">end wars and conflicts</a>.</p><p>Guterres’s appeal comes against the backdrop of what the UN has documented as the highest number of active armed conflicts since the Second World War. His September 2025 report, <a href=\"https://front.un-arm.org/Milex-SDG-Study/SG_Report_TheSecurityWeNeed.pdf\" target=\"_blank\" rel=\"noopener\">“The Security We Need: Rebalancing Military Spending for a Sustainable and Peaceful Future”</a>, found that global military expenditure reached a record $2.7 trillion in 2024, an increase of more than nine percent from the previous year and an amount equivalent to 13 times total global development aid. The report, mandated by UN member states under the 2024 <a href=\"https://www.un.org/en/pact-for-the-future\" target=\"_blank\" rel=\"noopener\">Pact for the Future</a>, concluded that redirecting even a fraction of military budgets could close critical gaps in education, <a href=\"https://www.jurist.org/news/2025/04/rights-group-highlights-global-healthcare-funding-inequalities-using-who-data/\" target=\"_blank\" rel=\"noopener\">healthcare</a>, <a href=\"https://www.jurist.org/news/2025/10/un-report-linking-severe-climate-and-poverty-underscores-urgency-of-global-action/\" target=\"_blank\" rel=\"noopener\">climate adaptation</a>, and poverty reduction.</p><p>The ceremony also carried personal significance. Guterres, who leaves office at the end of 2026, told the audience it was the last time he would ring the Peace Bell but pledged he would remain committed to the cause of peace beyond his tenure. The Japanese Peace Bell was <a href=\"https://media.un.org/photo/en/asset/oun7/oun7767810\" target=\"_blank\" rel=\"noopener\">presented to the United Nations</a> by the UN Association of Japan on June 8, 1954, cast from coins donated by delegates of 60 nations.</p><p>The UN General Assembly <a href=\"https://docs.un.org/en/A/RES/36/67\" target=\"_blank\" rel=\"noopener\">established the International Day of Peace</a> in 1981. In 2001, the Assembly unanimously designated it as a period of non-violence and ceasefire. Despite the annual observance, the UN Office for the Coordination of Humanitarian Affairs estimates that<a href=\"https://www.unocha.org/global-humanitarian-overview\" target=\"_blank\" rel=\"noopener\"> more than 200 million people currently require humanitarian assistance</a> and nearly 120 million have been forcibly displaced by war, crises, and persecution.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
