ount codes and hit the trails. Some of the best <a href=\"https://www.hoka.com/en/us/sale/\" target=\"_blank\" rel=\"noopener\">Hoka deals</a> we’ve seen recently are 30% off Speedgoat 6 trail running and hiking shoes at $47 off, now $108; 20% off the Mach 6, a solid pair of everyday running shoes at $28 off; and 20% off the Clifton 10, another popular everyday running or walking tennis shoe, now $31 off (only $124 total). Plus, you can get 20% off the Bondi 9, another uber-popular everyday running or walking shoe at $35 off, and a whopping 30% off Transport hiking/walking shoes at $45 off.</p><p>Hoka</p><h3>Speedgoat 6</h3><h3>Hoka Speedgoat 5</h3><h2>Save 10% on Your Next Pair of Hoka Clifton 10s</h2><p>If you’re an avid runner or just want to upgrade your footwear this season, investing in a Hoka membership (more on that below) is the best way to save on future purchases longterm. A Hoka membership will get you 10% off bestselling shoes, like <a href=\"https://www.hoka.com/en/us/womens-everyday-running-gear/clifton-10/1162031.html#localePromptDialog\" target=\"_blank\" rel=\"noopener\">Hoka Clifton 10 womens</a> and <a href=\"https://www.hoka.com/en/us/mens-everyday-running-gear/clifton-10/1162030.html?dwvar_1162030_color=SGNN\" target=\"_blank\" rel=\"noopener\">Hoka men's Clifton 10</a> styles.</p><h2>Get 30% Off Hoka Outlet Sale</h2><p>One of the best ways to save big is with the short-lived <a href=\"https://www.hoka.com/en/je/outlet-sign-up.html\" target=\"_blank\" rel=\"noopener\">Hoka Outlet</a>. This is a limited run, open exclusively for Hoka newsletter subscribers. If you sign up now to receive <a href=\"https://www.hoka.com/en/je/outlet-sign-up.html\" target=\"_blank\" rel=\"noopener\">Hoka newsletters</a>, you’ll be able to get up to 30% off selected styles for the outlet sale. Just know that this Hoka discount is for selected styles only, and ends September 20.</p><p><a href=\"https://cna.st/p/juaeQxcctp6XpbpvZy5qMz4arUWr6YQg3kTwcMjnksuxb2uGMtMKwfghC o hear about new promotions and discounts.</p><p>Photograph: Chris Haslam</p><p>Hoka</p><h3>Mafate X</h3><h2>Don’t Miss 10% Off Hoka Trail Shoes</h2><p>As mentioned, if you’re an avid runner, Hoka’s membership is a great way to save big on purchases you were already going to make. With a Hoka membership, you’ll get 10% off bestselling styles, from the <a href=\"https://www.hoka.com/en/us/mens-trail/speedgoat-7/1171928.html?dwvar_1171928_color=BFS\" target=\"_blank\" rel=\"noopener\">Hoka Speedgoat 7</a> for the trailrunner, to the hiking <a href=\"https://www.hoka.com/en/us/men-hiking/transport-2/1171851.html?dwvar_1171851_color=GLST\" target=\"_blank\" rel=\"noopener\">Transport 2</a>, there’s a Hoka shoe for every type of terrain and runner (now for less!).</p><p><a href=\"https://cna.st/p/oxmzN5BRSFN9ScarbJzuyzLewcrLtNhnaRwHS6ZhX96nND3F2AQM49qqD61mH47qwu19mew7kZuaRtY16RnJuRnAuVqNyUCXcLk67GLMBGMqujRh9b2pgn8aTQNV3UPUyhcc8YsZTQ99jLse3WhTU8CbbkibJoZKjS7vFSes9yQmS1F97LA3nce8Y2Xd1uAfy6nbuPQZXyibyeJg8E4bJabJhz2rFaQ59QvpUWzRyJsWbPGiSy2VdEfBQWmJwQnE3QzCygpeVTFzE8LBrZ814a61mk6mX5kUVXTtWB8eHvjbVkYpft9uSH5cub8E41brE1ibRedPovTYLJ3PRLNc9CX1URP6tiu85f4GopP4nMT7HsCj5wy3Avb6GTtYYYstfBYcYGMWpQo5vJJGF9hxq6hzF8HzcxHpHUebYpu\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Kieran Alger</p><p>Hoka</p><h3>Speedgoat 7</h3><h2>Find Your Perfect Hoka Match</h2><p>Not sure which Hoka shoe to get or where to start? Try the <a href=\"https://www.hoka.com/en/us/hoka-shoe-finder.html\" target=\"_blank\" rel=\"noopener\">Hoka Shoe Finder</a>! It’s a questionnaire that helps you find the right shoe out of their immense catalogue. It starts with questions about shoe size and gender, then moves on to specifics, because they design Hoka shoes with specialized technology for different activities, you’ll need to discuss activities, weather conditions where they’ll be used most, types of activities, and more to find the very perfect shoe for you.</p>"},{"title":"I Spy with My Little Eye . . . a Spy ","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/17/i-spy-with-my-little-eye-a-spy","category":"fun","categoryLabel":"Interesting Reads","wordCount":736,"readingTime":4,"content":"<p>Austin Kral and Ed Vogel stood in a downtown Atlanta park the other day, preparing to lead what they’d advertised on flyers as a “spy hunt.” The spies were the surveillance cameras used by police and the government, “and the corporate vender ecosystem,” Vogel said. He had on a black ball cap and a T-shirt that read “<em>SILENCE</em> = <em>DEATH</em>.” According to the Atlanta <em>Journal-Constitution</em>, there are more surveillance cameras in Atlanta, per capita, than anywhere outside of China—more than sixty thousand of them. New York City has fewer per person but, Vogel said, “they do have some sort of Bluetooth technology thing for monitoring rats.”</p><p>Kral wore glasses and athletic shorts, and both young men had on masks, but not to conceal their identities. “Your brow is actually enough for most facial-recognition systems,” Kral said. Viruses.</p><p>Kral and Vogel are members of Southerners Against Surveillance Systems and Infrastructure (<em>SASSI</em>), an activist network opposed to what it calls “an ever-expanding surveillance apparatus” that offers “a mirage of ‘public safety’ that never materializes.” <em>SASSI</em>’s methods of opposition include conducting research and leading spy hunts around the country.</p><p>The first participant to arrive was a freshman at Georgia State University, who wore braces and said that he planned to study philosophy. His name was Gene. “I’m here for the hunt,” Gene said. “And discussion of socialist politics, generally.” Next came a tattooed geography professor named Carrie, and her four-year-old daughter.</p><p>“What do you think about the cops?” Carrie asked the child, who stuck out her tongue.</p><p>Time to tour the panopticon. Kral and Vogel pulled out their phones. Vogel’s had only two apps: Signal and a multi-factor-authentication app. Kral had more apps, including one called DeFlock, which allows users to locate and document surveillance tech, like Flock Safety security cameras. The C.E.O. of Flock recently apologized for calling the growing DeFlock movement a “terroristic organization.”</p><p>“He walked that one back a bit,” Vogel said. He and Kral discussed other Flock-related headlines.</p><p>“I read one this morning!” Kral said. An officer charged with illegally tracking people with Flock had investigated a former officer who had used Flock for the same purpose. They laughed.</p><p>The hunters didn’t need the DeFlock map in downtown Atlanta, where cameras seem to outnumber pigeons. “We’re actually working on a birding-type guide to surveillance cameras,” Kral said. “An illustrator is on board.” Rounding a block, he motioned toward P.T.Z.s (pan, tilt, zoom), A.L.P.R.s (automatic license-plate readers), and what looked like ShotSpotters (acoustic sensors).</p><p>“One thing that would be interesting to do in Atlanta is to map the places where you’re actually <em>not</em> within view of a camera,” Vogel mused.</p><p>Pausing to look at a P.T.Z., Kral said, “They typically have a blind spot facing the pole.” He stepped into it.</p><p>Gene pointed to a parking lot where he’d once seen a “robo-dog” patrolling for loiterers. He’d seen another one, “looking defeated, on its side, computers shattered,” he said. “Kind of sad.”</p><p>At the next crosswalk, at least seven cameras captured them, Vogel estimated, “including the police helicopter above us.” They passed a police precinct, which had matching P.T.Z.s at the entrance. (“Gratuitous,” Kral said.) A homeless man in a Jon Ossoff T-shirt introduced himself as Ronald and asked what the group was doing. Vogel explained.</p><p>“Cameras all over,” Ronald said. “We being surveilled.”</p><p>“Have you ever felt consequences of that?” Vogel asked.</p><p>“You go to midtown,” Ronald said. “Robots taking a picture of your ass.”</p><p>Kral gave him some money and the group continued, passing two students in hoodies. “Do you feel safer having a camera like this up?” Vogel asked, pointing to an A.L.P.R. overhead.</p><p>“I don’t know,” one replied.</p><p>“It takes a photo of every car that clearly passes,” Vogel went on. “All that data is uploaded to a database that thousands of police officers across the country can search. <em>ICE</em> can get it, too.”</p><p>“If it’s being used by <em>ICE</em>, it’s not safe,” the other student said.</p><p>They arrived at a surveillance trailer sitting in a parking lot. A pole with multiple cameras protruded from it. “Should we get it to talk?” Kral asked, noting that some setups are equipped with “live monitoring.”</p><p>“Come on, say hi!” Vogel begged the machine, which blinked back silently.</p><p>They stopped in the shade of a tree to drink some water. “Trees,” Vogel said. “They keep you safe.” ♦</p>"},{"title":"Aggregation and the \"Universal\" Injunction Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/","category":"law","categoryLabel":"Law","wordCount":730,"readingTime":4,"content":"<h2>Introduction</h2>\n<p>A crucial function of judicial review is not only “to say what the law is,”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a> but also to provide the remedies to vindicate that law.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Judicial review plays an especially important role when government officials act in ways that violate federal law, including when they violate the Constitution.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  When government officials violate the law, the judicial review function supports a remedy that requires officials to comply with federal law by ceasing to pursue the illegal policy or practice.</p>\n<p>Such “compliance” injunctions have been given the label “universal” or “nationwide” injunctions insofar as they go beyond giving “complete relief <em>to the plaintiffs before the court</em>.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a>  Among other things, this framing couches compliance injunctions as aggregation devices — as improper attempts to “create de facto class actions.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a>  Although this characterization has never been entirely accurate,<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> the majority in <em>Trump v. CASA, Inc.</em><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a> embraced it and, as a result, narrowly construed the federal courts’ statutory authority to issue such injunctions in cases brought by individual plaintiffs.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a>  The <em>CASA </em>decision makes it imperative to reckon with “universal” injunctions through the lens of aggregation — specifically, through the lens of class actions under Rule 23 of the Federal Rules of Civil Procedure.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a></p>\n<p>In this Essay, we begin with a brief summary of the <em>CASA </em>decision’s holding regarding the availability of “universal” injunctions.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  Part II discusses the relationship between remedies and judicial review and the important role that such injunctions play in that regard.  Part III explores how class actions could serve as an alternative path for federal courts, after engaging in judicial review, to make their decisions meaningful by requiring officials to comply with the law and to cease illegal actions or policies.  We also respond to several objections to the use of class actions in this context.  The final Part addresses some implications of the class action route to “universal” injunctions, identifying the core functional connection between class actions and such injunctions, but also acknowledging some of the problems that this class action route may pose.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1791.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Marbury v. Madison, 5 U.S. (1 Cranch) 137, 177 (1803).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 163 (“[I]t is a general and indisputable rule, that where there is a legal right, there is also a legal remedy by suit or action at law, whenever that right is invaded.” (quoting 3 William Blackstone, Commentaries *23)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>E.g.</em>, United States v. Lee, 106 U.S. 196, 220–21 (1882).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Trump v. CASA, Inc., 145 S. Ct. 2540, 2548 n.1, 2557 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2556 (quoting Smith v. Bayer Corp., 564 U.S. 299, 315 (2011) (emphasis omitted)).  Professor Maureen Carroll describes individual plaintiff litigation to obtain compliance injunctions outside of class actions as “quasi-individual” actions.  Maureen Carroll, <em>Aggregation for Me, but Not for Thee: The Rise of Common Claims in Non-Class Litigation</em>, 36 Cardozo L. Rev. 2017, 2020 (2015).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>CASA</em>, 145 S. Ct. at 2600 n.2 (Jackson, J., dissenting) (arguing that “the majority’s primary premise — that universal injunctions ‘grant relief to nonparties’ — is suspect” because “[w]hen a court issues an injunction (universal or otherwise), it does so via an order that governs the relationship between the plaintiff and the defendant”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> 145 S. Ct. 2540 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>supra</em> notes 4–5 and <em>infra</em> notes 20–22 and accompanying text.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally, e.g.</em>, David Marcus, <em>The Class Action After Trump v. CASA</em>, 73 UCLA L. Rev. Discourse 2 (2025) (discussing the role of class actions after the <em>CASA </em>decision).  Class actions are not the only vehicle for obtaining compliance injunctions against governmental policies that violate federal law.  <em>See</em> <em>infra</em> notes 24–29 and accompanying text (discussing how <em>CASA</em> did not rule out such relief either (a) in suits by individual, governmental, or associational plaintiffs in certain circumstances, or (b) when authorized by the vacatur provision of the Administrative Procedure Act).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> For an explanation of why we put “universal” injunctions in quotation marks, see Portia Pedro, <em>Toward Establishing a Pre-Extinction Definition of “Nationwide Injunctions</em>,<em>”</em> 91 U. Colo. L. Rev. 847, 849–50 (2020).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"Yet another sign the Steam Frame is approaching launch—maybe really for real this time?—as the SteamOS beta adds 'preliminary support' for its wireless adapter","source":"PC Gamer","author":"Jacob Fox","url":"https://www.pcgamer.com/hardware/vr-hardware/yet-another-sign-the-steam-frame-is-approaching-launch-maybe-really-for-real-this-time-as-the-steamos-beta-adds-preliminary-support-for-its-wireless-adapter/","category":"gaming","categoryLabel":"Gaming","wordCount":522,"readingTime":3,"content":"<p>Another week, another hint that the Steam Frame might be close to launch, though this time the hint comes not from leaks and rumours but directly from Valve. According to <a href=\"https://store.steampowered.com/news/collection/steam/?emclan=103582791470414830&amp;emgid=667247155276153538\" target=\"_blank\" rel=\"noopener\">recent official update notes</a>, SteamOS Beta and Preview channels are to receive \"preliminary support for the Steam Frame Wireless Adapter.\"</p><p>The <a href=\"https://www.pcgamer.com/hardware/vr-hardware/steam-frame-specs-availability/\" target=\"_blank\" rel=\"noopener\">Steam Frame</a> is Valve's upcoming standalone VR headset, and based on what we've seen of it—my colleague Jacob Ridley having <a href=\"https://www.pcgamer.com/hardware/vr-hardware/hands-on-steam-frame-impressions/\" target=\"_blank\" rel=\"noopener\">tried it last year at Valve HQ</a>—it's definitely worth looking out for if you've a penchant for VR. Though the global memory shortage is of course a looming threat for the LPDDR5-laden device.</p><p>We'd previously seen a bunch of things that indicate an approaching launch date. Valve itself had previously indicated a launch of summer 2026, and over the past couple of months we've seen signs of <a href=\"https://www.pcgamer.com/hardware/vr-hardware/the-steam-frame-is-arriving-in-the-us-suggesting-the-vr-headsets-launch-isnt-far-off/\" target=\"_blank\" rel=\"noopener\">Steam Frame imports</a>, a <a href=\"https://www.pcgamer.com/hardware/vr-hardware/valves-steam-frame-launch-looks-imminent-with-new-great-on-frame-category-spotted/\" target=\"_blank\" rel=\"noopener\">'Great on Frame' Steam classification</a>, and the <a href=\"https://www.pcgamer.com/hardware/vr-hardware/valve-may-be-putting-the-finishing-touches-to-the-steam-frame-software-stack-because-lepton-and-fex-are-now-on-steam/\" target=\"_blank\" rel=\"noopener\">public availability of Frame-relevant software on Steam</a>.</p><p>All this has had prospective Frame owners chomping at the proverbial bit for a bite of the upcoming VR headset. So much so that the Steam Frame subreddit recently seemed to <a href=\"https://www.pcgamer.com/hardware/vr-hardware/the-steam-frame-subreddit-is-currently-losing-its-collective-mind-praying-for-a-release-date/\" target=\"_blank\" rel=\"noopener\">lose its collective mind</a> in anticipation, even sharing hopeful <a href=\"https://knowyourmeme.com/memes/potato/photos\" target=\"_blank\" rel=\"noopener\">potatoes of luck</a> (yes, you read that right).</p><p>Despite this hopeful anticipation, initial <a href=\"https://www.reddit.com/r/SteamFrame/comments/1vimylm/steamos_beta_adds_support_for_steam_frame/\" target=\"_blank\" rel=\"noopener\">responses to the new SteamOS update note were somewhat pessimistic</a>, given support for the Frame's wireless adapter is only just now being added—\"preliminary\" support, at that—and not even in the main SteamOS branch but the beta one.</p><p>However, <a href=\"https://www.reddit.com/r/SteamFrame/comments/1vjwnrt/for_everyone_dooming_over_the_steamos_preliminary/\" target=\"_blank\" rel=\"noopener\">one Redditor points out</a> that the <a href=\"https://github.com/evlaV/jupiter/commit/f4d697c5b9e391f1e0207d2494fe4340c4d64c19\" target=\"_blank\" rel=\"noopener\">change in question</a> simply adds \"support for the dongle to wake Steam Machines from sleep\", not support for the adapter in general. The implication being that such general support was already there.</p><p>Debates, of course, ensue. Primarily over whether Valve is waiting perhaps for an updated Half-Life Alyx (with foveated rendering) to be finished before the Frame launches.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Wherever you stand on the topic—whether you think the lucky potatoes have worked their magic or not—the Frame is no doubt that little bit closer to being ready for launch (or at least a more bug-free and feature-full launch) than it was before. Your guess is as good as mine for when that will actually be, though.</p>\n\n<p>Jacob got his hands on a gaming PC for the first time when he was about 12 years old. He swiftly realised the local PC repair store had ripped him off with his build and vowed never to let another soul build his rig again. With this vow, Jacob the hardware junkie was born. Since then, Jacob's led a double-life as part-hardware geek, part-philosophy nerd, first working as a Hardware Writer for PCGamesN in 2020, then working towards a PhD in Philosophy for a few years while freelancing on the side for sites such as TechRadar, Pocket-lint, and yours truly, PC Gamer. Eventually, he gave up the ruthless mercenary life to join the world's #1 PC Gaming site full-time. It's definitely not an ego thing, he assures us.</p>"}];
