<script>
var articles = [{"title":"Say goodbye to one of the most influential suphero trilogy of the century leaving Netflix","source":"Polygon","author":"Maria Loreto","url":"https://www.polygon.com/spider-man-trilogy-leaving-netflix-sam-raimi/","category":"gaming","categoryLabel":"Gaming","wordCount":1131,"readingTime":6,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/maria-loreto/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Aug 1, 2026, 1:00 PM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>It's also incredibly romantic</p>\n    <h2>Before it leaves Netflix, revisit the most important superhero trilogy ever made</h2>\n    \n        \n    \n                                         <p>Superheroes are forever. While the collective’s obsession with the topic ebbs and flows, these stories have existed in some form or another for hundreds of years. This week is a big one for superhero fans; <a href=\"https://www.polygon.com/spider-man-brand-new-day-review/\" target=\"_blank\" rel=\"noopener\"><em>Spider-Man: Brand New Day</em></a> is out, with many anxiously awaiting to see if the <a href=\"https://www.polygon.com/movies/\" target=\"_blank\" rel=\"noopener\">movie</a> will provide the necessary reassurance for Marvel, proving that there’s a future for the genre. While Marvel is not what it used to be and likely won’t ever recapture the magic of its golden years, superheroes are forever, and these stories will always have a home somewhere.</p>    <p>We’re not here to talk about <em>Spider-Man: Brand New Day</em> or the superhero genre as a whole, however. We’re here to talk about a trilogy that had a huge influence on the past 25 years of cinema. In 2002, Sam Raimi took over the <a href=\"https://www.polygon.com/tag/spider-man/\" target=\"_blank\" rel=\"noopener\">Spider-Man</a> franchise and delivered a film that shattered box office records and revitalized a stalled genre. It also became one of the most romantic blockbuster trilogies of all time. All three of Sam Raimi’s <em>Spider-Man </em>movies are leaving Netflix on Aug. 5, so you need to rewatch them ASAP.</p>    \n    \n                                                                                            \n        \n<p> Before <em>Spider-Man</em>, Raimi was a cult horror auteur. While he’d directed actors like Cate Blanchett, Liam Neeson, and Frances McDormand in genre films that have since been mostly forgotten, he was known for the <a href=\"https://www.polygon.com/tag/evil-dead/\" target=\"_blank\" rel=\"noopener\">Evil Dead</a> franchise. His credits made him a curious fit for a superhero character for kids, but the result was magical.</p>    <p>Peter Parker (Tobey Maguire) is good and kind, almost to a fault. As Spider-Man, he’s so busy saving New York that he barely has time to make ends meet, holding multiple jobs like delivering pizzas and underpaid freelance photography for The Daily Bugle. The New York he inhabits is harsh and fully realized, with people reacting to Spider-Man’s presence in ways that no superhero film has managed to portray since. Then there are the set pieces: throughout the three Spider-Man movies, regardless of their dips in quality (re: <a href=\"https://www.polygon.com/24196741/spider-man-3-peter-parker/\" target=\"_blank\" rel=\"noopener\"><em>Spider-Man 3</em></a>), Raimi allows his horror genius to shine. Through his tenure, he crafted one of the scariest villains of all time in Willem Dafoe’s Green Goblin, a character so gripping that <a href=\"https://www.polygon.com/reviews/22833733/spider-man-no-way-home-review/\" target=\"_blank\" rel=\"noopener\"><em>Spider-Man: No Way Home</em></a> had to repurpose him.</p>    \n<p>Still, what stands in sharpest relief is the attention to the trilogy’s central love story. It’s proof that Raimi is not only a great horror filmmaker, but also a great realist and a romantic at heart. In Raimi’s films, Peter and MJ (Kirsten Dunst) dance around each other for the better part of their lives. Not only were they in high school together; they were also neighbors, with Peter getting to see the crack in MJ’s popular girl facade at home. As she moves through boyfriends and jobs, her friendship with Peter remains one of the anchors of her life, growing all the more complicated when he can’t commit to their romance. Initially, he does this to keep her safe from Spider-Man’s enemies, but he can’t tell her that, so he has to suffer through the sacrifice himself.</p>    <p>While Peter’s life is carefully constructed, from his sweet yet strained relationship with his aunt to his dilapidated New York shoebox apartment, the attention to MJ as a character is worth noting. She has strengths, weaknesses, and desires of her own. Yes, she jumps from bad boyfriend to bad boyfriend, but she’s also kind and warm. Romance aside, MJ remains a good friend to Peter even when he doesn’t deserve it.</p>    <p>She’s also relentless in her pursuit of becoming an actress. Throughout the trilogy, she experiences it all: her big acting debut in a Broadway play, heartbreak when she can’t find another job, and rock bottom when she winds up singing at a crappy bar. Her arc is a reflection of Raimi’s skill in crafting a world that’s as real as our own despite the heroes and villains being hurled off of skyscrapers. By the end of <em>Spider-Man 3</em>, it’s easy to picture the life that MJ and Peter will have together; one filled with struggles and compromises, yet with the reassurance that they will always be there for each other.</p>    <p>Nothing encapsulates the strength of their dynamic and its great writing better than their iconic first kiss. “For me it was a great love story, with a real human being at the center,” Raimi told <a href=\"https://editorial.rottentomatoes.com/article/most-memorable-movie-moments-spider-man-upside-down-kiss/\" target=\"_blank\" rel=\"noopener\">Rotten Tomatoes</a> in 2019.</p>    \n    \n                                                                                            \n        \n<p>The scene shows Spider-Man and MJ in the pouring rain, with him hanging upside down from a web. It comes early in their dynamic, before their romance, after Spider-Man has rescued her a few times, with MJ not knowing his real identity. MJ pulls down his mask, exposing the lower half of his face, and kisses him. It’s a carefully choreographed moment that remains the indelible image of Raimi’s trilogy. “Pulling down the mask makes the moment special because this character longs to be loved by her. And to remove the mask is exposing yourself to becoming vulnerable with someone who loves you,” Raimi said.</p>    \n<p>It’s a romantic legacy that no superhero movie has come close to evoking. And while the Spider-Man franchise retains some pretty good love stories in all of its iterations, nothing really lands with the same impact as Maguire’s Peter and Dunst’s MJ. <em>The Amazing Spider-Man</em> opted out of MJ altogether, introducing a Gwen Stacy (Emma Stone) that was sweet and romantic. She and Andrew Garfield’s Peter Parker had electric chemistry that spilled offscreen as the actors dated. Gwen’s death in <em>The Amazing Spider-Man 2</em> is one of the most tragic moments in superhero movie history, but it essentially ended Garfield’s tenure. Tom Holland's Spider-Man brought back MJ (Zendaya), but only in the final minutes of <em>Spider-Man: Homecoming,</em> after spending the entire film with a decoy love interest (Laura Harrier). It's a decision that focused on novelty rather than authenticity. And for all the chemistry that Holland and Zendaya bring to the screen, it's a dynamic that's heavily impacted by their real-life relationship. You can't say it's a romance built entirely on the characters as written.</p>    \n    \n                                                                                            \n        \n<p> As the superhero genre goes through this period of change, it would be helpful to revisit its earlier iterations and how they operated. We’ve seen origin stories a million times by now, but we’ve forgotten the importance of real characters. Web swinging is amazing, and so is seeing some of our favorite heroes and villains come alive on screen. But what’s greater than finding a connection that accepts you through your worst and stands the test of time?</p>    <p><em>Sam Raimi’s</em> Spider-Man<em> trilogy is streaming on Netflix through Aug. 5.</em></p>"},{"title":"x86_64-unknown-linux-musl binaries occasionally segfault during very-large searches · Issue #3494 · BurntSushi/ripgrep","source":"Hacker News Best","author":"","url":"https://github.com/BurntSushi/ripgrep/issues/3494","category":"tech","categoryLabel":"Technology","wordCount":500,"readingTime":3,"content":"<h3>Please tick this box to confirm you have reviewed the above.</h3>\n<ul>\n<li> I have a different issue.</li>\n</ul>\n<h3>What version of ripgrep are you using?</h3>\n<p>ripgrep 15.2.0 (rev <a href=\"https://github.com/BurntSushi/ripgrep/commit/e89fff89ac9af12e8d4ce9d5fd07beb408ca730f\" target=\"_blank\" rel=\"noopener\">e89fff8</a>)</p>\n<p>features:+pcre2\nsimd(compile):+SSE2,-SSSE3,-AVX2\nsimd(runtime):+SSE2,+SSSE3,+AVX2</p>\n<p>PCRE2 10.45 is available (JIT is available)</p>\n<h3>How did you install ripgrep?</h3>\n<p>I originally encountered this bug in the rg bundled with OpenAI Codex. That binary is byte-for-byte identical with the one in <a href=\"https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz\" target=\"_blank\" rel=\"noopener\">https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz</a> and I've reproduced the bug from that independently of any Codex dependency. For the analysis below, I built rg-15.2 with debug symbols included by way of CROSS_CONTAINER_ENGINE=podman CARGO_PROFILE_RELEASE_DEBUG=true ~/.cargo/bin/cross build --release --target x86_64-unknown-linux-musl.</p>\n<h3>What operating system are you using ripgrep on?</h3>\n<p>OpenSUSE Tumbleweed Linux x86_64</p>\n<h3>Describe your bug.</h3>\n<p>Ripgrep built for x86_64-unknown-linux-musl occasionally crashes with a SIGSEGV when searching very-large trees at a high degree of concurrency. The crashing line is an integrity assertion regarding heap metadata inside MUSL's mallocng, in a calloc call made from opendir. The complete backtrace is below.</p>\n<h3>What are the steps to reproduce the behavior?</h3>\n<p>Having a sufficiently large search tree seems to be essential for reproduction. Run the attached <a href=\"https://github.com/user-attachments/files/30390612/generate_repro_tree.py\" target=\"_blank\" rel=\"noopener\">generate_repro_tree.py</a>. This is an LLM-written program which produces a tree full of random files which mimic the statistics of the repo in which I originally encountered the bug. It will produce a tree containing roughly 20GiB of data across 1.8M files.</p>\n<p>Then from the root of that tree, run rg in a loop, searching for some arbitrary literal string that isn't present in the tree: while true; do rg tnoheueunotshisnthukoethnsueothnsiuothonesuioseuinth; done. On my 24-core system, having enough free RAM for the search tree to fit in the kernel's block cache, it typically takes about a minute for the SIGSEGV to appear.</p>\n<h3>What is the actual behavior?</h3>\n<p>I get a coredump with the following backtrace:</p>\n#0  get_meta () at ../src_musl/src/malloc/mallocng/meta.h:141\n#1  __malloc_allzerop () at ../src_musl/src/malloc/mallocng/malloc.c:384\n#2  0x00007f71f8381b2d in calloc () at ../src_musl/src/malloc/calloc.c:41\n#3  0x00007f71f83810f4 in opendir () at ../src_musl/src/dirent/opendir.c:15\n#4  0x00007f71f835c133 in std::sys::fs::unix::readdir::{closure#0} () at library/std/src/sys/fs/unix.rs:2081\n#5  std::sys::helpers::small_c_string::run_with_cstr_stack&lt;*mut libc::unix::DIR&gt; () at library/std/src/sys/helpers/small_c_string.rs:48\n#6  std::sys::helpers::small_c_string::run_with_cstr&lt;*mut libc::unix::DIR&gt; () at library/std/src/sys/helpers/small_c_string.rs:28\n#7  std::sys::helpers::small_c_string::run_path_with_cstr&lt;*mut libc::unix::DIR&gt; () at library/std/src/sys/helpers/small_c_string.rs:18\n#8  std::sys::fs::unix::readdir () at library/std/src/sys/fs/unix.rs:2081\n#9  std::sys::fs::read_dir () at library/std/src/sys/fs/mod.rs:68\n#10 0x00007f71f8206b5c in std::fs::read_dir&lt;&amp;std::path::Path&gt; (path=...)\n    at /home/dfranke/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/std/src/fs.rs:3265\n#11 ignore::walk::Work::read_dir (self=0x7f71f5bfeb20) at crates/ignore/src/walk.rs:1551\n#12 ignore::walk::Worker::run_one (self=0x7f71f5bfef08, work=...) at crates/ignore/src/walk.rs:1749\n#13 ignore::walk::Worker::run (self=...) at crates/ignore/src/walk.rs:1697\n#14 0x00007f71f821c866 in ignore::walk::{impl#15}::visit::{closure#0}::{closure#1}::{closure#0} () at crates/i 5}::visit::{closure#0}::{closure#1}::{closure_env#0}, ()&gt;&gt;, ()&gt; (f=...)\n    at /home/dfranke/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/std/src/panic.rs:359\n#21 std::thread::lifecycle::spawn_unchecked::{closure#1}&lt;ignore::walk::{impl#15}::visit::{closure#0}::{closure#1}::{closure_env#0}, ()&gt; ()\n    at /home/dfranke/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/std/src/thread/lifecycle.rs:68\n#22 core::ops::function::FnOnce::call_once&lt;std::thread::lifecycle::spawn_unchecked::{closure_env#1}&lt;ignore::walk::{impl#15}::visit::{closure#0}::{closure#1}::{closure_env#0}, ()&gt;, ()&gt; () at /home/dfranke/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/core/src/ops/function.rs:250\n#23 0x00007f71f8361fcf in alloc::boxed::{impl#31}::call_once&lt;(), (dyn core::ops::function::FnOnce&lt;(), Output=()&gt; + core::marker::Send), alloc::alloc::Global&gt; ()\n    at library/alloc/src/boxed.rs:2275\n#24 std::sys::thread::unix::{impl#2}::new::thread_start () at library/std/src/sys/thread/unix.rs:118\n#25 0x00007f71f8388788 in start () at ../src_musl/src/thread/pthread_create.c:207\n#26 0x00007f71f8389e6c in __clone () at ../src_musl/src/thread/x86_64/clone.s:22\n\n<p>Here is the <a href=\"https://github.com/user-attachments/files/30390841/core.gz\" target=\"_blank\" rel=\"noopener\">core dump</a> and the <a href=\"https://github.com/user-attachments/files/30390840/rg.gz\" target=\"_blank\" rel=\"noopener\">corresponding rg binary</a> which produced it.</p>\n<h3>What is the expected behavior?</h3>\n<p>Not a segfault.</p>"},{"title":"International rights group calls for the immediate release of Vietnam political activist","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/international-rights-group-calls-for-the-immediate-release-of-vietnam-political-activist/","category":"law","categoryLabel":"Law","wordCount":520,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/international-rights-group-calls-for-the-immediate-release-of-vietnam-political-activist/#\" target=\"_blank\" rel=\"noopener\">International rights group calls for the immediate release of Vietnam political activist</a>\n</strong><p>Human Rights Watch (HRW) on Wednesday <a href=\"https://www.hrw.org/news/2026/07/29/vietnam-quash-conviction-of-social-media-commentator\" target=\"_blank\" rel=\"noopener\">called</a> for the immediate release of a social media commentator who was sentenced to six years of imprisonment for criticizing the Vietnamese government, stating that her conviction is a violation to the right to freedom of expression.</p><p>In January, blogger Hoang Thi Hong Thai was <a href=\"https://www.hrw.org/news/2026/01/15/vietnam-arrests-escalate-ahead-of-party-congress\" target=\"_blank\" rel=\"noopener\">arrested</a> after she made critical comments about the government, which were posted on her <a href=\"https://www.facebook.com/ducthaifood#\" target=\"_blank\" rel=\"noopener\">Facebook.</a> Thai was arrested under the allegation of “conducting anti-state propaganda” contrary to Article 117 of the<a href=\"https://bwcimplementation.org/sites/default/files/resource/VD_Penal%20Code_EN.pdf\" target=\"_blank\" rel=\"noopener\"> Criminal Code</a>. Article 117 outlines that “making, storing, disseminating or propagating information, documents and items aimed at opposing the Socialist Republic of Vietnam” is a criminal offense, which could lead to five to 12 years’ imprisonment,  or up to 20 years in “serious cases.”</p><p>According to HRW, Thai was expressing sympathy towards repressed rights activists, and published posts discussing sociopolitical issues. She expressed criticism towards Article 117 and 331 of the Criminal Code, and urged the government to reform the laws violating free speech. In a post prior to her arrest, she revealed the intimidation and repression that she and her family faced as a result of her writing. The day before her arrest, she <a href=\"https://www.facebook.com/permalink.php?story_fbid=pfbid0jnBjrtkdcLsZncC6MRbmEF8iAZHVQM4ym74Bp86icqUU4JU7gMeQXx6ges7mpcU7l&amp;id=100063508999162&amp;rdid=NFagEDW2fVpMay4p#\" target=\"_blank\" rel=\"noopener\">posted </a>a  critique of the political and legal system in Vietnam.</p><p>HRW called for Thai’s conviction to be quashed and for her immediate release. The group condemned the government’s prosecution of free speech, stating that she “should never have been prosecuted for speaking out against injustice”.</p><p>The arrest formed part of a larger crackdown by authorities on individuals who expressed dissenting speech. According to HRW, the Vietnamese authorities have arrested and detained <a href=\"https://www.hrw.org/news/2026/07/21/vietnam-5-arrested-for-ho-chi-minh-book\" target=\"_blank\" rel=\"noopener\">five others</a> for the publication of a book about Ho Chi Minh. All five have been charged under Article 117. Despite the 2013 Vietnamese Constitution providing safeguards to the right to freedom of speech and expression, human rights activists have pointed out that subordinate laws and state practices heavily restrict these fundamental liberties in practice, oftentimes using ambiguous provisions to enforce <a href=\"https://www.jurist.org/news/2025/07/human-rights-watch-stresses-government-reform-in-upcoming-un-rights-review-of-vietnam/\" target=\"_blank\" rel=\"noopener\">severe digital censorship</a>.</p><p>Previously, Vietnamese authorities had come under fire for implementing an internet regulation known as <a href=\"https://www.jurist.org/news/2024/12/human-rights-group-says-vietnam-cyber-security-law-violates-freedoms-of-speech-and-expression/\" target=\"_blank\" rel=\"noopener\">Decree 147</a> that essentially reshapes digital speech, content moderation and user privacy by forcing social media users to verify their identities with their mobile numbers or national identification numbers. Additionally, offshore platforms which were generating over<a href=\"https://www.vietnam-briefing.com/news/vietnams-new-internet-regulation-decree-147-2024.html/\" target=\"_blank\" rel=\"noopener\"> 100,000 monthly visits</a> from Vietnam were mandated to store users personal details and hand them over at the request of the Ministry of Public Security without a warrant.</p><p>Rights groups have <a href=\"https://www.hrw.org/news/2024/12/11/vietnam-repeal-harmful-internet-laws\" target=\"_blank\" rel=\"noopener\">utilized this regulation</a> to illustrate how the Vietnamese government is constructing an inescapable <a href=\"https://www.icj.org/wp-content/uploads/2020/12/Vietnam-Freedom-of-expression-Publications-reports-thematic-reports-2020-ENG.pdf\" target=\"_blank\" rel=\"noopener\">state surveillance mechanism</a> that effectively filters any opinions or information that it deems unsatisfactory to state interests.</p><p>Freedom of expression is protected under Article 19 of the Universal Declaration of Human Rights <a href=\"https://www.ohchr.org/sites/default/files/UDHR/Documents/UDHR_Translations/eng.pdf\" target=\"_blank\" rel=\"noopener\">(UDHR)</a>, and Article 19 of the International Covenant on Civil and Political Rights <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">(ICCPR)</a>.</p><p>Vietnam forms part of the Association of Southeast Asian Nations (ASEAN), and the right to freedom of expression is a protected and guaranteed under the <a href=\"https://asean.org/wp-content/uploads/images/resources/ASEAN%20Publication/2013%20(7.%20Jul)%20-%20ASEAN%20Human%20Rights%20Declaration%20(AHRD)%20and%20Its%20Translation.pdf\" target=\"_blank\" rel=\"noopener\">ASEAN Human Rights Declaration</a>.</p>"},{"title":"In “Teenage Sex and Death at Camp Miasma,” Desire and Terror Meet","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/10/teenage-sex-and-death-at-camp-miasma-movie-review","category":"fun","categoryLabel":"Interesting Reads","wordCount":1417,"readingTime":8,"content":"<p>When a director makes a film about filmmaking, pay attention: it’s a sign that the movie, however grand or stylized it may be, is also deeply personal, tapping into the nerve center of the maker’s creative drive and self-image. That’s true of such movies as Clint Eastwood’s “White Hunter Black Heart,” Sofia Coppola’s “Somewhere,” Jordan Peele’s “Nope,” and the latest entry in the genre, Jane Schoenbrun’s “Teenage Sex and Death at Camp Miasma.” No less worthy than its predecessors, Schoenbrun’s film is indeed the richest of them in terms of the multiple dimensions of cinematic experience that it dramatizes, critiques, and illuminates.</p><p>This is Schoenbrun’s third dramatic feature as writer-director, and it marks a bold yet logical advance from the two that came before. In “We’re All Going to the World’s Fair” (2021), an adolescent girl gets drawn into a macabre online role-playing game; “I Saw the TV Glow” (2024) is about teen-agers who are obsessed with a “Buffy the Vampire Slayer”-style series. “Teenage Sex and Death” is likewise a tale of media consumption—it revolves around a horror-movie franchise—but, in examining the fan experience, it also considers what goes into creating objects of fandom, including the emotional price that creators may end up paying. The result is a cinemanifesto, displaying Schoenbrun’s relationship to the art and a vision of a creative ideal.</p><p>The story is simple: Kris Williams (Hannah Einbinder), a critically acclaimed twenty-nine-year-old independent filmmaker, has been tapped by a studio to reboot a slasher franchise that was launched in the nineteen-eighties, with the film “Camp Miasma,” and gave rise to many sequels and spinoffs, an arcade game, a comic book, and a slew of merchandise. In its day, the franchise drew protests from the religious right, but lately it’s been criticized as transphobic. Kris, who identifies as queer and whose previous film included a reënactment of the famous murder scene in “Psycho” from the perspective of the shower curtain, has been hired to reconfigure the premise to reflect current sensibilities. As her agent (Sarah Sherman) puts it, the studio wants her to make it “elevated, a.k.a. woke.”</p><p>Kris’s interest in the job is more than just professional. She’s been obsessed with “Camp Miasma” since she was eight, especially with a character in the first installment, a teen-age camp counsellor called Squeak. Squeak was played by a young actress named Billy Presley (Amanda Fix), who refused roles in the sequels, never appeared in another movie, and has no public presence at all. While sketching out the studio reboot, Kris has made contact with Billy, now in her sixties (played by Gillian Anderson), who invites her to a remote compound in the Pacific Northwest where she lives in self-imposed isolation. The inevitable directorial dance of seduction to lure the reluctant actor to sign on to the project turns into an actual seduction, in ways that prove personally and artistically consequential for both women.</p><p>From this straightforward setup, Schoenbrun unleashes an outpouring of imagination and invention that places the film on a level of intricacy and extravagance comparable to that of Wes Anderson’s “Asteroid City” and Greta Gerwig’s “Barbie.” Scenes from across the “Camp Miasma” franchise play as films within the film, realized in elaborate detail. The result is gleefully gory: one victim is cut in half at the waist, their legs still standing as blood spurts; another is impaled on a spear and shattered to mist against a tetherball pole. But these scenes are filmed with such playfulness that the shock value is completely dissipated. (I say this as a squeamish, gore-averse viewer.)</p><p>“Teenage Sex and Death” opens on the set of the original movie, as seen from the point of view of the killer, a figure known as Little Death (Jack Haven), whose most striking feature is a kind of helmet made from a cubic metal air vent, which masks the face behind a pattern of concentric squares and gives the character’s breathing a distinctive labored sound. The glimpse of “Camp Miasma” and its production functions as backstory for Kris’s trip, and sets the tone for the odd encounters that follow. At Kris’s hotel, the desk clerk turns out to be one of the locals who were recruited to act in “Camp Miasma, Part VI” (which Kris watches in her room), and it emerges that Billy’s compound, a former sleepaway camp, was the location for the shooting of “Camp Miasma.” Prowling the grounds, Kris finds a building labelled “<em>cinema</em>,” and inside is a projector with a film reel cued up to the scene in “Camp Miasma” that most captivates her—Little Death entering a room where Squeak is losing her virginity.</p><p>“Desire,” Kris writes in her notebook while watching “Part VI,” and it is Squeak’s mix of desire and terror in the first movie that makes Kris’s encounter with Billy so erotically charged. Kris’s partner, Mari (Jasmin Savoy Brown), suspects that the reclusive Billy will resemble Norma Desmond, the delusional ex-star in “Sunset Boulevard,” but Billy (who’s well aware of the comparison) is funny, candid, insightful, and intensely sympathetic. She notes that Kris has been approaching her project “academically” and urges her to speak freely. Kris opens up about her sexual inhibitions while worrying that such candor is unprofessional. Billy responds that these personal revelations are intrinsically part of the work, and that their collaboration has already begun.</p><p>Much of “Teenage Sex and Death at Camp Miasma” is a classic two-hander, sharply written with plenty of scope for the two leads to shine. For all the movie’s self-awareness, it’s filled with tenderness and humor. Einbinder endows Kris with pent-up intellectual energy awaiting explosive release, and Anderson’s Billy is a kaleidoscopic showcase of emotional vitality and natural, florid theatricality. Among the movie’s daring inspirations is the ample screen time given to movie-watching, whether by Kris alone or by her and Billy together. Each one of these viewing sessions is more than merely an opportunity for ingenious film-within-a-film evocations of “Camp Miasma.” They’re dramatic scenes punctuated by significant surprises: an accidental interruption, a trenchant observation, a raucous gag, a cathartic gaze. This built-in doubleness—of the watchers and the watched—lends “Teenage Sex and Death” a complexity that Schoenbrun amplifies in surreal, symbolic, and allegorical ways.</p><p>Throughout, Schoenbrun revels in the ambiguous fusion of artifice and realism. The foremost innovation is the evocation of Little Death’s perspective, by means of an unusual kind of camera movement—wavering and wandering, somewhere between smooth and jittery—which catches the viewer in the limbic system, going beyond disgust to the uncanny. The ostensibly transphobic element of “Camp Miasma” is that Little Death was gender-fluid, a cruelly bullied former camper whose killing sprees are displaced revenge. Schoenbrun, a trans filmmaker who explicitly addressed the trans experience in “I Saw the TV Glow,” here conceives something even more radical: a cinematic trans gaze, one that is visually distinctive in its tone while extruding violence endured into violent fantasy.</p><p>At the end of Kris’s time with Billy, she has to video-conference with a group of studio executives to give them a story outline for the reboot. Her pitch, deeply informed by Billy’s sensibility and ideas and by the course of their encounter, is a brilliantly strange narrative that puts the character and vantage point of Little Death at the center of a film-within-a-film origin story. The executives (deftly lampooned by actors including Dylan Baker and Jess McLeod) are predictably aghast. For Schoenbrun, though, Kris’s professional setback is an opportunity for her artistic and personal renewal, in the form of radical independence.</p><p>Alongside the fundamental dichotomy of the watchers and the watched, “Teenage Sex and Death” explores a related one—that of the director and the actor. As Kris and Billy view more and more of “Camp Miasma” together, Kris realizes that what she has always loved and feared about Billy’s performance in the original film comes from the real-life trauma and ecstasy that the actress experienced during its filming, which left her with a lifetime of material to work through (and to work with, too). Billy’s main creative outlet in her years of solitude has been visual art, and her work—abstractions dominated by the geometric forms of Little Death’s air-vent face—seems like a closed circuit of self-therapy. With Kris, Billy is delivered from these visual abstractions, just as Kris, with Billy, is freed from her intellectual ones. Together, each of them becomes both director and actor, observing and observed, controlling and controlled, self-motivated and mutually determined, launched into a higher plane of artistic collaboration—into a cinematic redemption. ♦</p>"}];

  window.scrollTo(0, 0);
}

function nextArticle() {

}

function skipArticle() {

  render();
}

  return d.innerHTML;
