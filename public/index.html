*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"6 Essential Activities GTA Needs to Let Players Experience in Vice City","source":"Polygon","author":"@FionnTheBrave","url":"https://www.polygon.com/gta-6-side-activities/","category":"gaming","categoryLabel":"Gaming","wordCount":707,"readingTime":4,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/josh-broadwell/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Oct 31, 2026, 4:01 PM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>Like reading on public transport and going to the cinema</p>\n    \n        \n    \n                                                     <p><a href=\"https://www.polygon.com/game/grand-theft-auto-6/40846/\" target=\"_blank\" rel=\"noopener\"><em>GTA 6</em></a> is just around the corner, and despite Rockstar releasing quite a lot of footage over the last month, I still think there's very little to show what we'll actually be doing in the game. Crime, yes. The usual spate of side activities, yes. <a href=\"https://www.polygon.com/gta-6-launch-trailer-sex-scene-jason-lucia-shower-youtube-video/\" target=\"_blank\" rel=\"noopener\">Having sex, apparently</a>. But there's still a lot of room for speculation about what you can do in those in-between moments. I hope some of these activities make the cut.</p>    \n<h2>\n            1 \n        \n                            Learn Spanish\n                    \n       </h2>\n<p>If <em>GTA 6</em> lets Jason and Lucia become a serious item, then it needs to let me, as Jason, learn Spanish. (That’s assuming that Lucia speaks it, at least a little.) It'd be extremely cute, plus it's kind of mandatory if they're going to share their lives, especially in a place based on Miami, where tons of people speak Spanish. I don't expect Rockstar, or anyone, to put a whole segment of language courses in a non-educational video game, of course. Just a nod to it, maybe, or it could be a passive activity you choose to do and eventually see results from.</p>    <h2>\n            2 \n        \n                            Read on the bus\n                    \n       </h2>\n<p>Look, I know this isn't an RPG and it's definitely not <em>Persona 5</em>, but when you say \"spending time traveling on public transportation,\" the first thing that comes to mind is reading on the subway. Even if it doesn't improve any kind of stat or have a noticeable benefit, at least it would help Rockstar's efforts at making <em>GTA 6</em> as realistic as possible. Barring that, I'd settle for listening to the <a href=\"https://www.polygon.com/gta-6-radio-stations-what-are-music-new-songs-website/\" target=\"_blank\" rel=\"noopener\">game's radio stations</a> on Jason's or Lucia's phone. With earbuds. Like a civilized human.</p>    <h2>\n            3 \n        \n                            Become an influencer\n                    \n       </h2>\n<p>GTA side hustles are always a thing, and after seeing Rockstar poke fun at influencer culture in the <a href=\"https://www.polygon.com/gta-6-netflix-preview-news-reveals-rockstar-games/\" target=\"_blank\" rel=\"noopener\">big Netflix reveal</a>, I do actually think it'd be interesting to play at being an influencer in the game. Turning Jason and Lucia's biggest moments into capital-C Content might not be the smartest idea if you're trying to avoid the law. But surely they can have burner accounts? It sure would be amusing to try and get the perfect framing as you're fighting off civilian vigilantes in the jewelry store, not to mention a potentially clever use of photo mode.</p>    \n    \n                                                                                            \n        \n<h2>\n            4 \n        \n                            Go on dates\n                    \n       </h2>\n<p>Again, if relationships are a big deal in this game, we need to see more of it beyond just the steamy sex scenes. And, y'know, something more romantic than a perfectly planned heist. Maybe a night out at a restaurant or a trip to the cinema or theatre. Is there a cinema in <em>GTA 6</em>? I hope so. Surely Vice City's culture extends beyond strip clubs and drug dens.</p>    <h2>\n            5 \n        \n                            Take a tour\n                    \n       </h2>\n<p>You can explore the swamps and dive off skyscrapers, sure, but I'd really like a guided tour of Vice City. Seeing the notorious city's efforts at presenting a socially and morally acceptable face seems like the kind of thing GTA would be very good at making fun of, but I'd also like to see something a bit deeper. Say, for example, a guided tour into the history of one of the city's multicultural neighborhoods or even something more lighthearted like a ghost tour. Just something that lets me feel like I'm exploring the city on a deeper level.</p>                \n                        \n\t<p>\n\t\tFree sign-up\n\t</p>\n\t\n\t\t<h3>Get Polygon’s Wishlister newsletter</h3>\n\t\t<p>A weekly cheat sheet to what you’ll eventually love to play. No buying, no\n\t\t\tcommitment — just saving for later.</p>\n\t\t<a href=\"https://www.polygon.com/profile/general/\" target=\"_blank\" rel=\"noopener\">\n\t\t\tSign up free\n\t\t</a>\n\t\t<p>Free. Unsubscribe anytime.</p>\n\t\n\n    <h2>\n            6 \n        \n                            Have meaningful character progression\n                    \n       </h2>\n<p>Speaking of deeper, it seems like <em>GTA 6</em> places far greater emphasis on character development than previous installments of the series. That makes me hope there's some kind of progression — <a href=\"https://www.polygon.com/gta-6-fashion-jason-duval/\" target=\"_blank\" rel=\"noopener\">beyond just physical appearance</a> — that reflects my actions in the game. Maybe it's just as simple as specializing in one kind of combat over another, but if I'm spending as much time with Jason and Lucia as Rockstar clearly wants me to, there should be <em>something</em> that lets my actions shape that journey in a way different from everybody else. Otherwise, why bother?</p>"},{"title":"The Party Girls at the Heart of “Club Kid”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/09/the-party-girls-at-the-heart-of-club-kid","category":"fun","categoryLabel":"Interesting Reads","wordCount":791,"readingTime":4,"content":"<p>Early on a recent Thursday, three of the stars of Jordan Firstman’s directorial début, “Club Kid,” were recovering from weeks of celebratory partying with caffeinated beverages in Seward Park, on the Lower East Side, near where much of the film takes place. A few older Chinese women were doing Tai Chi as a man in protective earmuffs and a neon vest blasted a leaf blower. The actors—Alaska Riley, Benny Jean Pierce, and Saturn Risin9—decided to take a stroll. Riley, sipping a chai, had been up for an hour; Pierce, latte in hand, had awoken at six to exercise; Saturn, holding a matcha, was unslept, having flown in from Los Angeles the night before and gone straight to the Swan Room for oysters and caviar fries. Firstman had cast all three for their real-life involvement in New York’s night-life scene.</p><p>Riley, who was wearing a gray hoodie and kitten heels, is a twenty-seven-year-old model and writer. She had initially hesitated when she received Firstman’s script. “A little too Method,” she called it. Then she ran into Firstman at Basement, a night club in Queens, after which he demonstrated his street cred by partying with her for more than eighteen hours straight.</p><p>The movie premièred at Cannes, where it was nominated for the Un Certain Regard award. In the film, a strung-out gay party promoter named Peter (played by Firstman) learns that he has a nine-year-old son by a woman he doesn’t remember sleeping with. Her best friend turns up with the kid, attempting to foist custody onto Peter, whose life is imploding. Riley, Pierce, and Saturn play his friends.</p><p>Saturn, a thirty-seven-year-old d.j. with a maternal disposition, has known Firstman for years. “Seeing Jordan’s performance, the veil was thin,” she said. “Like, Oh, wow, we’re telling the truth.”</p><p>The trio sat on a bench across from a playground full of clambering kids. “When I saw the film the first time, I ran up to Jordan and said, ‘I need to get sober, and I need to be a gay dad,’ ” Riley recalled.</p><p>Pierce, a twenty-seven-year-old actress who wore fur-lined boots and a slouchy leather jacket, smiled at the squeals coming from the playground. “It was so Kismet that I got to do this movie,” she said, “because the entire year prior to filming all I was talking about was family planning.” But she said that she had struggled to find examples of trans mothers to be role models. Firstman’s depiction of queer parenthood, a rarity in film, moved her: “When I saw it, I couldn’t stop crying.”</p><p>“I have always known that I would be a mom,” Saturn said, tearing up. As a trans woman, she looks forward to having kids who won’t face the pressures she’s had to fight against. “But I’m probably just going to raise a football-playing straight son,” she said. “He’ll have to live in fear of coming out to me.” A weary-eyed mom trudged by pushing a stroller.</p><p>The three actors had created found families through the club scene, and they demonstrate this closeness onscreen. The cast was just coming off of a unifying weeklong bacchanalia, which included a New York Film Festival after-party at Indochine. Riley, who is dialling back her partying, had kept it low-key, holding court at a corner table. Saturn had a long huddle with François Arnaud, the “Heated Rivalry” actor. “I’m trying to promote his bisexuality,” she said. “Like, O.K. . . . but is it <em>in practice</em>?”</p><p>Pierce jumped in: “As a bisexual, I understand the tumultuous nature of bisexuality. I always say, Are you a questioning bisexual, or are you a bisexual being questioned?”</p><p>Riley shrugged. “I’m pretty sure I’m bisexual, but, like, I don’t do anything about it.”</p><p>Pierce had brought a guy she knew from work to the Indochine party—a first date. “Something about that Martini,” she said. Cocktails had been passed on trays. “I’m at the point in my life where I have one shot and I’m, like, Should I get on the fucking table?”</p><p>“I looked over at her with this young man, who I now know is just some guy!” Saturn said. “And I saw that look in her eye.”</p><p>“The sun came up, and I was awake,” Pierce said. She’d ended up at a friend’s place in Gramercy. “But a lot of people went to the ‘S.N.L.’ after-after-party.”</p><p>Saturn put her head in her hands. “I was going to go, but my brain just forgot the invitation. I went with some gay boys to a place I could have just gone anytime.”</p><p>Pierce: “It does really suck when you realize you picked the wrong party.”</p><p>Riley, who’d been quiet, leaned back with a winner’s smug calm. “I went home,” she said. ♦</p>"},{"title":"Short Circuit: An inexhaustive weekly compendium of rulings from the federal courts of appeal","source":"The Volokh Conspiracy","author":"johnkennethross","url":"https://reason.com/volokh/2026/10/30/short-circuit-an-inexhaustive-weekly-compendium-of-rulings-from-the-federal-courts-of-appeal-83/","category":"law","categoryLabel":"Law","wordCount":1176,"readingTime":6,"content":"<p>Please enjoy the latest edition of <a href=\"http://ij.org/about-us/shortcircuit/\" target=\"_blank\" rel=\"noopener\">Short Circuit</a>, a weekly feature written by a bunch of people at the Institute for Justice.</p>\n<p>New on the <a href=\"https://youtu.be/QCFOoE5nSj0\" target=\"_blank\" rel=\"noopener\">Short Circuit podcast</a>: It's our biannual election law special! Anonymous speech! The Founders and pamphlets! Motor voter! <em>Purcell</em>! Prefilling ballots! Vote early! Vote often!</p>\n<p>New on the <a href=\"https://www.youtube.com/watch?v=b2_d03JyeKg\" target=\"_blank\" rel=\"noopener\">Beyond the Brief podcast</a>: Automated license plate readers are a lot of things, but one thing they definitely are is great tool for stalking. Hoo boy!</p>\n<ol>\n<li><a href=\"https://media.cadc.uscourts.gov/judgments/docs/2026/10/26-3007-2200197.pdf\" target=\"_blank\" rel=\"noopener\">D.C. Circuit</a> (unpublished): No need to comment on the denial of this guy's latest request for compassionate release from a well-below-guidelines sentence for pimping minors. J. Walker, concurring: I have comments.</li>\n<li>Rather than provide documents through discovery, the feds now direct people in DHS proceedings to file FOIA requests. Their lawyers sue, claiming that this procedure is too slow and the responses often incomplete. <a href=\"https://www.ca1.uscourts.gov/sites/ca1/files/opnfiles/25-1799P-01A.pdf\" target=\"_blank\" rel=\"noopener\">First Circuit</a>: If the first thing we do is kill all the lawyers, the second is deny standing to those who remain.</li>\n<li>Uber driver passes six field sobriety tests, and, after he's arrested anyway, his blood tests come back negative for intoxicants. So maybe he was telling the truth about pulling over for a nap while business was slow? Brookhaven, Penn. officer (weeks later): No, I'm filing charges for DUI. <a href=\"https://www2.ca3.uscourts.gov/opinarch/253229np.pdf\" target=\"_blank\" rel=\"noopener\">Third Circuit</a> (unpublished): Could be false arrest and abuse of process. No qualified immunity. To a jury this must go.</li>\n<li>In 2020, a disgruntled lawyer murdered the son of a federal district judge. Most states responded with laws that restrict addresses disclosure for certain public officials. But only West Virginia's law goes straight to liability (for, e.g., data brokers) without first requiring a takedown request. <a href=\"https://www.ca4.uscourts.gov/opinions/252121.P.pdf\" target=\"_blank\" rel=\"noopener\">Fourth Circuit</a>: A First Amendment violation on its face. Least restrictive means <em>least</em> restrictive.</li>\n<li>Your summarist is not sure exactly how to implement this practice tip (New Orleans voodoo dolls?), but if you are going to ask the <a href=\"https://www.ca5.uscourts.gov/opinions/pub/25/25-20348-CV0.pdf\" target=\"_blank\" rel=\"noopener\">Fifth Circuit</a> to extend qualified immunity to a statute where it has never gone before (here, the Fair Labor Standards Act), you really should avoid having Judge Willett write the opinion.</li>\n<li>Undocumented immigrants—who have lived here over a decade, don't have criminal records, and have close relatives who are citizens—ask: Can they be imprisoned for the duration of the deportation process or does the Constitution require an inquiry into whether they're a flight risk or danger to the community? <a href=\"https://www.ca5.uscourts.gov/opinions/pub/26/26-50183-CV1.pdf\" target=\"_blank\" rel=\"noopener\">Fifth Circuit</a> (en banc, 10-7): The former.</li>\n<li>In which the <a href=\"https://www.opn.ca6.uscourts.gov/opinions.pdf/26a0293p-06.pdf\" target=\"_blank\" rel=\"noopener\">Sixth Circuit</a> holds that the federal prohibition on firearm possession by anyone \"adjudicated as a mental defective\" does not violate the Second Amendment on its face because it can sometimes be applied constitutionally—like to this defendant, who could have petitioned to have his rights restored under Missouri law but \"[i]nstead, he drove to Fort Knox wearing body armor and possessing eight guns.\"</li>\n<li>Now-former Perry Twp., Ohio police chief attempts to intimidate auditor hired to look into his practices, culminating in his filing misdemeanor charges against her—and then pursuing them as if they were felony charges, i.e., having her arrested outside his jurisdiction and ensuring she spends 36 hours in jail instead of just receiving a summons. <a href=\"https://www.opn.ca6.uscourts.gov/opinions.pdf/26a0436n-06.pdf\" target=\"_blank\" rel=\"noopener\">Sixth Circuit</a> (unpublished): Could be abuse of process. No state-law immunity. To a jury this must go.</li>\n<li>Supreme Court (2005, unanimous): Lower courts, it's almost never <em>Rooker-Feldman</em>; stop dismissing cases. <a href=\"https://www.supremecourt.gov/opinions/25pdf/25-197_bp7c.pdf\" target=\"_blank\" rel=\"noopener\">Supreme Court</a> (2026, 5-to-4): OK, <em>sometimes</em> it's <em>Rooker-Feldman</em>, but don't go nuts. <a href=\"https://media.ca7.uscourts.gov/cgi-bin/OpinionsWeb/processWebInputExternal.pl?Submit=Display&amp;Path=Y2026/D10-26/C:24-3308:J:Rovner:aut:T:fnOp:N:3632117:S:0\" target=\"_blank\" rel=\"noopener\">Seventh Circuit</a>: We are holding the line; the district court was wrong to invoke <em>Rooker-Feldman</em> where the plaintiffs are challenging administrative action that predated any court decision. [Ed.: Who were Mr. Rooker and Prof. Feldman? <a href=\"https://ij.org/podcasts/bound-by-oath/rooker-and-feldman-and-treason-season-4-ep-1-updated/\" target=\"_blank\" rel=\"noopener\">We're glad you asked</a>.]</li>\n<li>The Durbin Amendment to the Dodd-Frank Act authorized the Federal Reserve to regulate debit-card interchange fees (the per-swipe fee that banks charge merchants when you use a debit card). But it instructed the Fed to limit those fees to only the \"incremental cost incurred\" in the transaction. Fed: Let's just call it 21 cents. <a href=\"https://ecf.ca8.uscourts.gov/opndir/26/10/253000P.pdf\" target=\"_blank\" rel=\"noopener\">Eighth Circuit</a>: You might have gotten away with that sort of thing in the <em>Chevron</em> era, but nowadays, \"<em>We</em> say 'what the law is.'\" The 21-cent cap is vacated.</li>\n<li>Each year, the State Dept. must hold a lottery and award up to 55,000 visas to people from countries with low rates of immigration to the United States. This year, however, officials decided not to. Lawyers who represent visa selectees sue. District court: And win! Hold the lottery. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/29/26-6943.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (per curiam): If the first thing we do is kill all the lawyers, the second is deny standing to those who remain.</li>\n<li>Fifteen days before the midterm elections, the Department of Justice sued California, seeking a temporary restraining order that would require the state to sequester ballots that DOJ alleges were sent to non-citizens. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/26/26-7070.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (Monday, per curiam, over a dissent): We're not going to order that. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/30/26-7231.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (Friday, per curiam, over a dissent): We're not going to order that.</li>\n<li>Berkeley, Calif. officials seek to shut down a homeless encampment on city property to stymie a leptospirosis outbreak. Challengers: The city, among other things, needs to first follow the ADA. District court: That makes sense, here's a P.I. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/26/26-842.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a> (per curiam, 73 pages): P.I. is stayed, but only a bit of it. Partial dissent: Rats are spreading this disease, and we're worried about the ADA?</li>\n<li>California prohibits employers from requiring employees to attend meetings where religion or politics (including unionization) will be discussed. Employers: That's a content-based restriction on speech. California: Well, it's not really speechy speech. More like conduct. <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/29/25-6874.pdf\" target=\"_blank\" rel=\"noopener\">Ninth Circuit</a>: The law doesn't apply to meetings about how to fill out firm paperwork. It's content based. And likely unconstitutional.</li>\n<li>Is a giant painting of space aliens in cheeseburger-shaped flying saucers a \"mural\"—or is it instead a dangerous, prohibited \"sign\"? Whichever it is, says the <a href=\"https://www.ca10.uscourts.gov/sites/ca10/files/opinions/010111536512.pdf\" target=\"_blank\" rel=\"noopener\">Tenth Circuit</a>, it's protected by the First Amendment, which means the city of Salina, Kans. needs to come up with better evidence than it has here if it wants to shoot those little aliens down. (IJ urged just this result in an erudite <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.ca10.91225/gov.uscourts.ca10.91225.78.0.pdf\" target=\"_blank\" rel=\"noopener\">amicus brief</a>.)</li>\n<li>And in en banc news, the <a href=\"https://www.ca5.uscourts.gov/opinions/pub/25/25-50096-CV1.pdf\" target=\"_blank\" rel=\"noopener\">Fifth Circuit</a> will reconsider <a href=\"https://netchoice.org/wp-content/uploads/2026/07/Document-50.pdf\" target=\"_blank\" rel=\"noopener\">its decision</a> that Texas's SCOPE Act—which requires digital service providers to monitor and filter content accessible to minors to prevent exposure to several categories of potentially harmful speech—is preempted by section 230 of the Communications Decency Act.</li>\n</ol>\n<p>New cases! Last year, in two separate airport seizures, DEA and CBP agents seized a total of nearly $1.4 mil in cash from IJ client Steven Bailey and his small currency wholesaling business, which, among other things, buys U.S. dollars in Mexico and brings them back to the states—all above board and in compliance with numerous federal rules and reporting requirements. What's not above board is each agency's failure to say what they think Steven did wrong, denying him a chance to meaningfully contest the deprivation of his property. That violates due process, and, in CBP's case, the agency's own rules. <a href=\"https://ij.org/case/global-coin-logistics-forfeiture/\" target=\"_blank\" rel=\"noopener\">Click here</a> to learn more.</p>"},{"title":"Top NZXT Discount Codes for 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/nzxt-discount-code/","category":"tech","categoryLabel":"Technology","wordCount":658,"readingTime":4,"content":"<p>NZXT has been a household name in the world of PC gaming for years now, thanks in part to its PC cases. The company’s cases are known for their clean and highly aesthetic design, marketed toward gamers who really care about how their system looks. That’s been NZXT’s jam, even as it has moved into other parts and peripherals in the PC gaming ecosystem. So, if you’re looking for an NZXT discount code or information on promos and deals, you’ve come to the right place.</p><h2>Score 50% Off PCs With NZXT Discount Codes and Deals</h2><p>NZXT has already changed the game with <a href=\"https://cna.st/affiliate-link/nntVzjQ3JMLounNPYNrETBFpnx1VA7KTTdFY2v3FEq9o5tvzKhipnnpZJGSgYXLeTy75RdUjYrQP2txhitmMs9Y2CeLWQAVhgEGyKmvqkY948dGP8yeZZ2YWTubsjps6hAhD74YSv738pBPTtrAKy9tknSsJmPFbE73ZBGd3ooi9iseBYADATgLQY97Kbeuo9AXX9UX6N8Vb7tCpTf2pRqytMdZ94f19ThsyeKbuUMjiEwizNmsv1A6mDoqRXgeqj6gLPZzakqZMsePcLE2ijcXF4W2VVUzyQ7cpQ5Kj\" target=\"_blank var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
