<style>
:root {

  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Samsung’s Galaxy Z Fold 8 is $300 off ahead of Black Friday","source":"The Verge","author":"Brad Bourque","url":"https://www.theverge.com/gadgets/1027659/samsung-galaxy-z-fold-8-beats-pill-deal-sale","category":"tech","categoryLabel":"Technology","wordCount":546,"readingTime":3,"content":"<p>Brad Bourque</p> <p>is a tech journalist and commerce writer based out of Portland, Oregon. He’s contributed to sites like Digital Trends, Business Insider, and WIRED.</p><p>Android fans with a bit of <a href=\"https://www.theverge.com/tech/1015028/iphone-duo-review\" target=\"_blank\" rel=\"noopener\">iPhone Duo</a> envy, take note: The <strong>Samsung Galaxy Z Fold 8</strong> is discounted to $1,599.99 at both <a href=\"https://www.amazon.com/dp/B0H12M2TY4?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\">Amazon</a> and <a href=\"https://bestbuy.7tiv.net/c/482924/614286/10014?u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fsamsung-galaxy-z-fold8-256gb-unlocked-graphite%2FJJGRF3FS98\" target=\"_blank\" rel=\"noopener\">Best Buy</a>, a hefty $300 markdown from its usual price, and just $50 higher than the lowest we’ve seen. Considering the device only launched a few months ago, you’re saving a significant amount of cash on the unlocked device, and you can also opt for the 512GB model, doubling the storage, for just $200 more (<a href=\"https://www.amazon.com/dp/B0H12RY7Z6?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\">Amazon</a>, <a href=\"https://bestbuy.7tiv.net/c/482924/614286/10014?u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fsamsung-galaxy-z-fold8-512gb-unlocked-lavender%2FJJGRF3TKLZ\" target=\"_blank\" rel=\"noopener\">Best Buy</a>). Best Buy currently has all three colors in stock, while the 256GB model is currently sold out on Amazon in cream.</p><p><a href=\"https://www.amazon.com/Samsung-Galaxy-Fold8-Unlocked-Phone/dp/B0H126B3KV?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\"></a><a href=\"https://www.amazon.com/Samsung-Galaxy-Fold8-Unlocked-Phone/dp/B0H126B3KV?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\"></a></p><p>$1600</p><p>The shorter and wider passport-style shape (similar to the iPhone Duo) quickly became natural and comfortable to handle, according to our reviewer <a href=\"https://www.theverge.com/tech/972387/samsung-galaxy-z-fold-8-review\" target=\"_blank\" rel=\"noopener\">Dominic Preston’s experience</a> with the Z Fold 8. Despite its thin and light construction, it doesn’t skimp on battery life, with a 4,800mAh battery that still had 40 percent charge remaining after a full day of use. The interior 4:3 screen has the same ratio as most Apple iPads, which is great for watching movies or TV, but even better for reading. There’s no telephoto lens on this model (it’s present on the pricier <a href=\"https://www.theverge.com/tech/976551/samsung-galaxy-z-fold-8-ultra-review\" target=\"_blank\" rel=\"noopener\">Z Fold 8 Ultra</a>), and it only has an IP48 rating, so you’ll want to be careful near the beach, but those are small compromises to make given the discounted price.</p><h2>Other deals to consider</h2><ul><li>Both <a href=\"https://www.amazon.com/dp/B0D4SX9RC6?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\">Amazon</a> and <a href=\"https://bestbuy.7tiv.net/c/482924/614286/10014?u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fbeats-pill-portable-wireless-bluetooth-speaker-and-portable-charger-matte-black%2FJJGCQ3YW54%2Fsku%2F6585106\" target=\"_blank\" rel=\"noopener\">Best Buy</a> are selling the <strong>Beats Pill </strong>for a discounted $99.95 and $99.99 respectively, a sizable break from the usual $149.99 price point. The 2024 edition of this iconic Bluetooth speaker adds in lossless audio over USB-C, as well as native feature support for both iOS and Android devices. It’s rated IP67 for dust and water resistance, and comes in three different colors to match your other Beats devices. <a href=\"https://www.theverge.com/24185290/beats-pill-2024-bluetooth-speaker-review\" target=\"_blank\" rel=\"noopener\">Read our review</a>.</li><li>The <strong>Ring Battery Doorbell 2K</strong> is on sale for $39.99 at <a href=\"https://www.amazon.com/dp/B0FHJ7TKZM?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\">Amazon</a>, over half off its $99.99 list price. This battery-powered doorbell camera is easy to install, and shoots clear 2K resolution video with a 140-degree field of view and up to 6X digital zoom. You’ll get real-time notifications on your phone for any activity the camera spots, with live view and two-way talk in case you need to have a chat with your neighbors or delivery folks without coming to the front door.</li><li>You can pick up the <strong>Lego Star Wars: Ahsoka Chopper</strong> set for just $66.99 at <a href=\"https://www.amazon.com/dp/B0DJ1BLT51?tag=theverge02-20\" target=\"_blank\" rel=\"noopener\">Amazon</a>, the lowest price we’ve seen yet for this 1,039-piece building kit. This brick-based droid has great play features, like detachable arms and center wheel for different display positions, and a head that spins and bobs realistically. It stands at over 8.5 inches when fully built, making it a fun addition to your existing Lego display or bookshelf.</li></ul><h2>Verge Shopping</h2><p>Sign up to get the best deals on products we’ve found and tested sent to your inbox.</p><p>Email (required)</p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Brad Bourque</li></ul>"},{"title":"3 Near-Perfect Sci-Fi Movies You Can Stream For Free This Weekend (Novemeber 6 - 8)","source":"Polygon","author":"@RachelLeishman","url":"https://www.polygon.com/sci-fi-films-streaming-free-november-5-2026/","category":"gaming","categoryLabel":"Gaming","wordCount":868,"readingTime":5,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/rachel-leishman/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Nov 5, 2026, 5:00 PM EST\n                                </p>\n                    \n                                            \n                                                                                                \n                                <p>Rachel Leishman is a writer, interviewer, and self-appointed \"professional\" fangirl. She has an encyclopedic knowledge of all things movie and television and loves all things comedy. Part of her coverage includes her deep love of Spider-Man, Interview with the Vampire, and more. She is also the self-appointed \"unofficial\" Leslie Knope.</p>\n\n                            \n                                                            \n                                    \n                                                                        <p>Don't listen to the rabbit! </p>\n    \n        \n    \n                                                     <p>Science Fiction as a genre is one that fans get to explore in many different ways. Whether it is a horror movie or a comedy, elements of science fiction can turn a story into something so memorable for fans. And sometimes, you just want to watch a movie that has something a little more to it for you to unpack. The problem is trying to figure out what the best science fiction movie is to watch and with a large library of the genre online, picking the best of the best isn't easy. </p>    \n<p>Streaming movies can be overwhelming, especially when there are so many options. Add in the plethora of platforms and the task of picking one movie to watch becomes nearly impossible. Luckily, platforms like Tubi exist which offer fans a wide library of films and television shows that they can watch for free with limited commercials. If you're looking for a great science fiction film to watch this weekend, here are 3 you can choose from on Tubi! </p>    <h2>\n                        3. <em>Donnie Darko</em> (2001)\n               </h2>\n    \n                                                                                            \n        \n<p>Jake Gyllenhaal hasn't always been a well-known actor. Back in the late 90s, early 00s, Gyllenhaal was just getting started and after his stand out performance in the 1999 Joe Johnston movie <em>October Sky</em>, Gyllenhaal took a darker turn in his career. <a href=\"https://www.polygon.com/donnie-darko-free-to-watch-youtube-september-2026/\" target=\"_blank\" rel=\"noopener\">And it made </a><em><a href=\"https://www.polygon.com/donnie-darko-free-to-watch-youtube-september-2026/\" target=\"_blank\" rel=\"noopener\">Donnie Darko</a> </em>one of Gyllenhaal's most iconic films and a role that made him famous. Written and directed by Richard Kelly, the sci-fi/thriller tells the story of a young boy named Donnie Darko. When he narrowly escapes death, Donnie is haunted by a tall figure dressed as a rabbit named Frank who gets Donnie to do progressively more messed up things under the guise that the world is going to end in 28 days. </p>    <p>Including Gyllenhaal's own sister, Maggie Gyllenhaal, as Elizabeth Darko, the film included an all star cast of Drew Barrymore, Seth Rogen, Jena Malone, Noah Wyle, and more. What has made <em>Donnie Darko </em>one of the best sci-fi films of all time comes down to Gyllenhaal's performance as Donnie and the looming presence of Frank. When anyone thinks of <em>Donnie Darko</em>, the image of Frank and Donnie and Gretchen (Malone) is the first that fans think of and it is one of the best films of Gyllenhaal's career. </p>    <h2>\n                        2. <em>Bill &amp; Ted's Excellent Adventure</em> (1989)\n               </h2>\n    \n                                                                                            \n        \n<p>Keanu Reeves and Alex Winter have had a friendship that spans decades, all because of the 1989 film <em>Bill &amp; Ted's Excellent Adventure</em>. William S. Preston Esquire (Winter) and Theodore Logan (Reeves) are two high school surfer dudes who learn the hard way that not doing their school work may keep them apart from each other. With one history project standing in their way of rocking on together, the two boys of the fictional rock band Wyld Stallyns must go through all of time and collect historical figures and remain friends so that their music can, one day, save the world. </p>    <p>From their iconic phone booth time machine to<a href=\"https://www.polygon.com/2020/8/31/21409220/bill-and-ted-face-the-music-behind-the-scenes-interview-director/\" target=\"_blank\" rel=\"noopener\"> the two sequel films </a>that spawned off this iconic movie, so much of <em>Bill &amp; Ted's Excellent Adventure </em>has become part of the cultural lexicon. \"Be excellent to each other and party on dudes,\" is the overall theme of Bill and Ted as characters and that's what makes them so important. It isn't about some greater thing, it's just about being friends, being kind, and rocking out. Oh and \"So-crats\" is there. </p>    <h2>\n                        1. <em>Snowpiercer</em> (2013)\n               </h2>\n    \n                                                                                            \n        \n<p>Bong Joon-ho is one of our most prolific filmmakers and <a href=\"https://www.polygon.com/snowpiercer-arm-amputation-scene-best-body-horror/\" target=\"_blank\" rel=\"noopener\">his movie, <em>Snowpiercer</em>, </a>gave fans a twisted look at an alternate future that will definitely have you hoping you're not a tailie. Set on the fictional train called Snowpiercer, the film follows Curtis Everett (Chris Evans) as he fights back with the rest of the tailies to try and bring order to humanity. Snowpiercer is a train that never stops, constantly moving around the world to keep those inside alive and well. It is a delicate system with just enough resources to keep the rich living comfortably and for the tailies to suffer what little life they have left. </p>    \n<p>As part of their rebellion, Curtis leads the tailies through the train, trying to find Joseph Wilford (Ed Harris) and fight for equality. It was the first Joon-ho film in English and is, in many ways, the film that put him on the map in the United States. <em>Snowpiercer </em>went on to inspire a popular TNT series and they're both inspired by the French post-apocalyptic graphic novel <em>Le Transperceneige. </em>Many of Joon-ho's films explore elements of science fiction within them and for so many, their love of the director started with <em>Snowpiercer</em>. </p>    <p>You can explore plenty of other science fiction titles on Tubi for free and who knows, maybe Frank will come to haunt you too! </p>"},{"title":"Téa Obreht on Letting Your Characters Flounder","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/this-week-in-fiction/tea-obreht-11-09-2026","category":"fun","categoryLabel":"Interesting Reads","wordCount":1028,"readingTime":6,"content":"<p><strong>In your story “<a href=\"https://www.newyorker.com/magazine/2026/11/09/family-lore-fiction-tea-obreht\" target=\"_blank\" rel=\"noopener\">Family Lore</a>,” a couple have just returned home from the hospital with their newborn baby. The husband notices their dog engaging with a possibly sick bat on their balcony, and this sets off a spiral of events, as he tries to figure out whether the dog has caught rabies, without alerting his wife to the danger. How did this plotline come to you?</strong></p><p>I rarely draw direct inspiration from my own life for my fiction—that’s what other people’s lives are for!—but, in this case, shortly after my husband and I brought our first baby home, our dog really did get hold of a bat that then tested positive for rabies. This resulted in the dog being placed in a forty-five-day home quarantine, which, compounded by the isolation of the newborn trenches and the ongoing pandemic, created the most psychologically debilitating situation I’ve ever endured. I’ve suffered from contamination O.C.D. and responsibility O.C.D. since adolescence, and my experience of that month and a half was essentially staying up all night to either nurse the baby or watch the dog for symptoms. It was horrible. Plus, no one we knew had been through anything like it, so no one could offer us any real comfort. All we had was the wildly contradictory advice we received from the vet (who was not worried), the pediatricians (who were low-to-medium worried), and animal control (who were basically telling us to pick out an urn for the dog).</p><p><strong>You began writing this story during that quarantine period but didn’t finish it until a month after the birth of your second child, almost four years later. Why did it take so long?</strong></p><p>I actually tried to process the incident by fictionalizing it while it was still happening. When that failed, I tried writing it several different times over the years, always from the perspective of the wife. But it was too close to home, and it kept getting tainted by reality. Then, maybe a month or two before the birth of our second baby, my husband and I were reminiscing about the rabies scare, and he said, “If I’d known how awful those forty-five days were going to be, I would have hoofed that fucking bat off the balcony, and you never would have known about it.” That changed my whole approach to the story. It gave me a new premise and orientation, and enough distance from the actual events to see the humor and the madness of it.</p><p><strong>Arriving home with a first baby—especially after a long stretch of trying and failing to have a child—can be overwhelming. In the story, it has been the wife’s role to worry about everything and the husband’s role to reassure her. Why do you think he goes so far off the deep end now?</strong></p><p>Because his decision to conceal the incident with the bat isolates him from his wife. New parenthood is already isolating, but at least it’s something they’ve been preparing to face as a team. Now he’s ensnared himself in the situation with the bat, and everything he does removes him further and further from the domestic bubble and the new reality on which he is supposed to be focussing.</p><p><strong>The story is both a comedy and a thriller: each time the husband makes a seemingly logical decision it pushes him farther into comic absurdity and ratchets up the tension for the reader—who, at a certain point, can no longer imagine this guy digging himself out of the hole he’s jumped into. How challenging was it to balance plausibility and ridiculousness, fun and genuine anxiety, when writing the story?</strong></p><p>I’m not sure why, but more and more of late I’ve found myself drawn to characters who can’t stop making mistakes. It’s challenging, but it’s also incredibly fun to refrain from protecting your characters and let them just flounder. In “Family Lore,” I also wanted to capture the vulnerability of finding yourself catapulted into total responsibility for another human being overnight. Any sense of horizon disappears. All sense of balance and proportionality is obliterated. You don’t know if something is a mild threat or a serious one. You don’t know whether something is going to last an hour or a week. For me, so much of the tension in this story came from the husband’s inability to figure out what’s freaking him out the most: the bat? The Cesarean? The fact that the baby came early? His wife’s mental state? The fact that everyone around him seems to be a little unstable?</p><p><strong>At the beginning of “Family Lore,” the wife has a premonition that something very bad is going to happen. It’s possible to read the conclusion of the story as confirmation of that prediction. But it’s also possible to read it as a happy ending, in which no serious damage has been done. Did you want to leave it up to the reader to decide which option to believe?</strong></p><p>Throughout this story, the husband is unwittingly chasing a sense of relief. I think all he really wants is a moment to recalibrate, a moment to gather himself for the journey ahead, which, given that he is now a parent, is really going to last the rest of his life. And I think he does get that moment in the end.</p><p><strong>The story is set in Austin, Texas, where there is, in fact, a very large bat colony. Neither of the characters is originally from Texas. What else made this city the right backdrop for the story?</strong></p><p>Despite its takeover by ultra-rich ghouls, Austin has remained a kind of paradise of youth. All the things that would have made it irresistible to the couple once upon a time are incompatible with the early days of parenthood: it’s bawdy, irreverent, loud, hot, fun, and unpredictable. What the husband wants is quiet and calm. Instead, he is surrounded by strangers whose names he realizes he doesn’t even know, all gearing up for a wild Halloween weekend. None of them are in the same phase of life as him, and this amplifies his panic and makes him feel even more powerless and alone. ♦</p>"},{"title":"\tCourt leans toward narrow ruling on inmate’s use of habeas for accelerated transfer to a halfway house or home confinement","source":"SCOTUSblog","author":"Richard Cooke","url":"https://www.scotusblog.com/2026/11/-court-leans-toward-narrow-ruling-on-inmates-use-of-habeas-for-accelerated-transfer-to-a-halfway/","category":"law","categoryLabel":"Law","wordCount":1044,"readingTime":6,"content":"<p>The Supreme Court heard oral argument on Nov. 2 in <a href=\"https://www.scotusblog.com/cases/maxwell-v-thomas/\" target=\"_blank\" rel=\"noopener\"><em>Maxwell v. Dinis</em></a> about whether a federal inmate may use a habeas statute, <a href=\"https://www.law.cornell.edu/uscode/text/28/2241\" target=\"_blank\" rel=\"noopener\">28 U.S.C. § 2241</a>, to contest the Federal Bureau of Prisons’ refusal to accelerate his transfer to a halfway house or home confinement.</p><p>Maxwell, a former attorney, was convicted at trial for his role in conspiring with a mob-related organization, La Costa Nostra, to take over a Texas-based mortgage-loan company, FirstPlus Financial Group, Inc., and drain it of its assets. As Maxwell neared the end of his sentence, he sought to contest the BOP’s calculation of good-time credits that would accelerate his transfer from prison to a halfway house or home confinement. The question for the court was whether Section 2241, which does not clearly spell out what claims may be brought but whose scope has largely been shaped by precedent, allows him to do so.</p><p>Maxwell’s attorney, Masha Hansford, pressed for a broad rule that habeas is available to an inmate like Maxwell who is asserting a right to a “distinct and lower level of custody.” But that position almost immediately encountered some pushback. Justice Ketanji Brown Jackson questioned “whether we really need to use this case to define every circumstance in which habeas is appropriate.” Hansford agreed that the court need not adopt a test that allows inmates to challenge all changes to the level of custody and was content to have the court resolve Maxwell’s case by applying a narrower test endorsed by the government that would permit an inmate to use habeas to challenge the denial of an accelerated transfer to parole or, as here, a halfway house or home confinement.</p><p>Justice Samuel Alito pressed Hansford on whether an inmate may use Section 2241 simply to dispute how BOP calculated good-time credits or whether the inmate must also show that any error in calculating would also entitle the inmate to accelerated transfer to a halfway house or home confinement. After Hansford replied that Maxwell met all the requirements for the transfer and only the calculation of good-time credits was at issue, Justice Neal Gorsuch followed up by pressing whether the court needs to say that an inmate could bring a habeas challenge about the calculation of good-time credits alone. Hansford replied that the court did not need to say a dispute over good-time credits alone would suffice for a federal inmate to bring a claim in Section 2241.</p><p>Turning to Hansford’s level-of-custody test, Justice Sonia Sotomayor noted that, in a <a href=\"https://www.law.cornell.edu/supct/html/03-287.ZC.html\" target=\"_blank\" rel=\"noopener\">prior case</a>, Justice Antonin Scalia had referred to habeas as covering a “‘quantum change’ in the level of custody,” but Hansford was asking the court “to create new language, ‘materially less restrictive custody.’ Why don’t we stick to what we have?” Hansford agreed that the court need not broaden its test and that Maxwell’s requested transfer to a halfway house or home confinement amounted to such a quantum change.</p><p>Assistant to the Solicitor General Kevin J. Barber, arguing for the government, contended that “there’s no need to adopt” Maxwell’s “amorphous level-of-custody rule.” He explained that the court “has always made clear that habeas is available when your claim is seeking discharge from actual physical confinement in prison to a different kind of custody,” such as a halfway house or home confinement. Here, the government relied heavily on <a href=\"https://supreme.justia.com/cases/federal/us/411/475/\" target=\"_blank\" rel=\"noopener\"><em>Preiser v. Rodriguez</em></a>, which held that habeas supplies the sole avenue for a state inmate to challenge the denial of credit toward release on parole.</p><p>When Gorsuch pressed Barber on the source of the government’s rule and why an inmate’s transfer to solitary confinement or maximum security would not be covered, Barber pointed principally to history and tradition in the court’s habeas cases. Barber explained, “we don’t have any tradition of claims being recognized as habeas claims challenging just transfers within prison systems.”</p><p>Despite agreeing that Maxwell could bring his claim in Section 2241, the government argued that no court could actually grant him relief. Specifically, the government pointed to 18 U.S.C. § 3621(b) and its terms <a href=\"https://www.law.cornell.edu/uscode/text/18/3621\" target=\"_blank\" rel=\"noopener\">barring courts</a> from reviewing “a designation of a place of imprisonment under this subsection.” According to the government, service of a sentence in a halfway house or home confinement is “a designation of a place of imprisonment” governed by that statute.</p><p>But the government did not appear to have the votes to prevail on this argument, at least at the Supreme Court. Justice Brett Kavanaugh pressed Barber on whether that issue could be left for the lower court to decide on remand. Barber conceded that the court “absolutely could.” Sotomayor questioned Barber about whether the government is right that Section 3621(b) applies to Maxwell’s claim. But after Barber began responding, Justice Amy Coney Barrett reiterated Kavanaugh’s point that “we don’t have to get into any of this, right?” Barber again agreed.</p><p>Jackson pressed Barber on a separate point, that the BOP is expected to transfer Maxwell to a halfway house or home confinement in January 2027, which would soon make his claim moot. Jackson disputed why the court would revisit its decision to hear the case. Barber apologized for not pressing the Section 3621(b) issue or mootness in opposing certiorari, but said these factors spoke in favor of the court dismissing the case as improvidently granted.</p><p>The amicus, Brian W. Barnes, was appointed to argue in favor of the ruling by the U.S. Court of Appeals for the 5th Circuit that habeas is unavailable for Maxwell’s claim. When pressed by Justice Elena Kagan, Barnes agreed that habeas is available to “encompass a move from incarceration to parole,” as <em>Preiser </em>held. Kagan pointed out that “parole looks an awful lot like what’s going on here.”</p><p>The justices’ questions suggest that they are unlikely to limit <em>Preiser </em>and reject an analogy between Maxwell’s requested relief and the parole in that case. The justices also showed little appetite for reaching the government’s Section 3621(b) argument. How they would handle Maxwell’s expected release to a halfway house in January 2027 was less clear, but that circumstance could result in a speedier ruling.</p><p><strong>Recommended Citation: </strong>Richard Cooke, <em>\tCourt leans toward narrow ruling on inmate’s use of habeas for accelerated transfer to a halfway house or home confinement</em>, SCOTUSblog (Nov. 5, 2026, 1:56 PM), https://www.scotusblog.com/2026/11/-court-leans-toward-narrow-ruling-on-inmates-use-of-habeas-for-accelerated-transfer-to-a-halfway/</p>"}];

}

  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;

}
