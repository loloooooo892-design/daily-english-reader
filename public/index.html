<script>
var articles = [{"title":"Israeli Settler \"Terrorists\" Unjustly Expel West Bank Palestinians From Their Land","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/08/15/israeli-settler-terrorists-unjustly-expel-west-bank-palestinians-from-their-land/","category":"law","categoryLabel":"Law","wordCount":1375,"readingTime":7,"content":"<p>As a general rule, <a href=\"https://reason.com/volokh/2024/10/07/compendium-of-writings-on-the-october-7-war/\" target=\"_blank\" rel=\"noopener\">I support Israel</a> in its conflicts with adversaries like Hamas, Hezbollah and Iran. While I am no great fan of either the present Israeli government or the ideology of Zionism, Israel <a href=\"https://reason.com/volokh/2024/10/07/compendium-of-writings-on-the-october-7-war/\" target=\"_blank\" rel=\"noopener\">upholds liberal democratic values to a far greater extent</a> than any of its enemies, and their victory would be a terrible catastrophe. Thus, I've even gone so far <a href=\"https://reason.com/volokh/2023/10/17/hamas-attacks-should-teach-us-the-folly-of-hostage-exchanges-with-terrorists/\" target=\"_blank\" rel=\"noopener\">as to argue</a> that it is a mistake for the Israelis to make hostage exchange deals with groups like Hamas, because doing so encourages more more terrorism.</p>\n<p>But it is also important to remember that not all Israeli actions are just, and that Palestinian Arabs also have human rights that must be respected. This is one of those times where these points must be emphasized. Over the last few years, Israeli settlers on the West Bank have repeatedly attacked Palestinians living there, seeking to force them off their land. These actions are deeply unjust, amounting to ethnic cleansing and gross violations of private property rights. They also highlight broader dangers of ethno-nationalist claims to exclusive control over land.</p>\n<p>The <em>Times of Israel</em> (a center-right Israeli publication) has <a href=\"https://www.timesofisrael.com/in-qusra-and-beyond-settlers-are-chasing-palestinians-out-and-taking-over-their-homes/\" target=\"_blank\" rel=\"noopener\">a helpful overview</a> of the recent settler violence:</p>\n<blockquote><p>Mahmoud Tubasi has not lived in his home in the village of Jalud, south of Nablus, since late July, after fleeing following weeks of settler violence…</p>\n<p>Tubasi built the house some seven years ago on land owned by his family on the outskirts of Jalud. The property sits in Area B, where, under the Oslo Accords, Israel maintains security control while the Palestinian Authority is responsible for civilian affairs….</p>\n<p>For nearly seven years, he and his family, including his two children and grandchildren, lived there peacefully, he said. But in April, some four months ago, settlers began targeting the home, first setting fire to it and then laying siege to Tubasi and his family.</p>\n<p>On July 22, after his pleas for help went unanswered, the family fled. Watching from afar, Tubasi has since seen settlers moving around his home….</p>\n<p>In recent years, settler extremists in the West Bank have stepped up campaigns of harassment and violence aimed at <a href=\"https://www.timesofisrael.com/in-the-west-bank-settler-harassment-swiftly-uproots-a-bedouin-hamlet/\" target=\"_blank\" rel=\"noopener\">driving Palestinians from their homes</a>, sometimes displacing whole communities….</p>\n<p>Over the three years from January 2023 through April 2026, some 5,900 people in the West Bank were displaced from their homes due to settler violence, the UN Office for the Coordination of Humanitarian Affairs <a href=\"https://www.timesofisrael.com/liveblog_entry/un-5900-west-bank-residents-displaced-from-their-homes-by-settler-violence-over-past-3-years/\" target=\"_blank\" rel=\"noopener\">said</a> in early July.</p>\n<p>The figure includes mostly Bedouins (and some Palestinian farmers) living in what the UN defines as \"communities.\" According to the UN, 45 such communities were completely displaced and another 72 were partially displaced.</p>\n<p>In some cases, settlers subsequently established illegal outposts on land where the displaced communities had lived.</p></blockquote>\n<p>The UN is far from an unbiased source, when it comes to Israel. But even if the true number of people expelled from their homes is \"only\" a half or a third of the one they give, it's still awful.</p>\n<p>I rarely agree with Mike Huckabee, an extreme social conservative and the Trump Administration's ambassador to Israel. But<a href=\"https://jewishchronicle.timesofisrael.com/u-s-ambassador-calls-settlers-who-sieged-palestinian-homes-in-qusra-terrorists/\" target=\"_blank\" rel=\"noopener\"> he is right</a> to call these violent settlers \"terrorists\" and demand the Israeli government put a stop to their activities. As conservative (and generally pro-Israel) <em>New York Times</em> columnist Bet Stephens<a href=\"https://www.nytimes.com/2026/07/28/opinion/israel-settlers-west-bank.html?smid=nytcore-ios-share\" target=\"_blank\" rel=\"noopener\"> points out</a>, the right-wing Israeli coalition government led by Prime Minister Benjamin Netanyahu has largely turned a blind eye to these actions because his rule is dependent on the support of far-right parties that back the violent settlers.</p>\n<p>The settlers' actions are reprehensible for multiple reasons. Most obviously, they seek to expel Palestinian Arabs from their land simply based on their ethnic background. Such ethnic cleansing is obviously unjust. In addition, the seizure of homes, farms, and other property is a blatant violation of private property rights. Private property is both an important human right in itself, and a vital element of liberty and autonomy more generally. Palestinians are no less entitled to these rights than any other group.</p>\n<p>The settlers claim they are justified in their actions because Jews are the true, exclusive owners and sovereigns of the area and therefore have the right to exclude and expel members of other groups. This kind of ethno-nationalist claim to exclusive territorial rights is far from unique to Israeli settler extremists. All sorts of nationalist movements make similar claims - including, of course, many Arab and Palestinian nationalists.</p>\n<p>But the ubiquity of such claims cannot justify them. In my book <a href=\"https://www.amazon.com/dp/0197618774/ref=nosim?_encoding=UTF8&amp;me&amp;qid&amp;tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\"><em>Free to Move</em></a>, and <a href=\"https://thehill.com/blogs/congress-blog/politics/527392-immigration-restrictions-and-racial-discrimination-share-similar/\" target=\"_blank\" rel=\"noopener\">other writings</a>, I have argued that racial and ethnic claims to exclusive territorial rights are inherently unjust for much the same reasons as racial and ethnic discrimination is unjust in other contexts: race and ethnicity are morally arbitrary characteristics that should not determine what rights people have, including where they are allowed to live and work.</p>\n<p>In addition, historical claims that one group has a right to exclusive rule of some territory founder on the reality that almost all inhabited territories have a history of multiple ethnic and racial groups living there. Thus, none can claim history proves they are the exclusive owners. This is clearly true of Israel and the West Bank. Jews, of course, have lived there for thousands of years. But the same is true of Arabs and other groups.</p>\n<p>Most people are unwilling to go as far as I do in rejecting ethnic territorial claims. But even those who accept such historical arguments to a limited degree, should still recognize it is unjust to engage in ethnic cleansing of people who have lived in an area for decades or centuries. Their historical claim to live there is as good as anyone else's.</p>\n<p>I readily recognize that my arguments imply that Jews also should not be barred from living in the West Bank, as many Palestinian nationalists would like them to be. They should indeed be allowed to live there, if they choose. But they should not have the right to take Palestinians' land and other private property by force.</p>\n<p>One can also defend the violent settlers on the grounds that their actions aren't as bad as those of Palestinian terrorists, most notably Hamas. It is indeed true that - so far, at least - the Israeli settlers haven't murdered, raped, or tortured civilians on anything like the same scale as Hamas has, especially during the horrific October 7 attack.</p>\n<p>But that in no way justifies the Israeli settler violence, most of which is directed against innocent civilians, whose only wrong is that they are Arabs living on land the settlers want to take for themselves. \"Not as bad as Hamas\" cannot be the standard of judgment here. You can be less bad than Hamas, but still a terrorist criminal.</p>\n<p>In 2020, the Israeli Supreme Court <a href=\"https://reason.com/volokh/2020/06/10/israeli-supreme-court-strikes-down-law-authorizing-expropriation-of-palestinian-private-property-for-transfer-to-israeli-settlers-and-cites-my-work-on-eminent-domain-in-the-us-in-the-process/\" target=\"_blank\" rel=\"noopener\">struck down a government policy intended to expropriate Palestinian property for transfer to Israeli Jews</a> (citing some of my own writings on takings and property rights, in the process). Some of <a href=\"https://reason.com/volokh/2020/06/10/israeli-supreme-court-strikes-down-law-authorizing-expropriation-of-palestinian-private-property-for-transfer-to-israeli-settlers-and-cites-my-work-on-eminent-domain-in-the-us-in-the-process/\" target=\"_blank\" rel=\"noopener\">what I wrote then</a> is applicable to the current situation, as well:</p>\n<blockquote><p>Jews, including my own ancestors, have a long history of being victimized by unjust property expropriations at the hands of both European and Arab Muslim governments (as well as even more severe forms of persecution). Israel should not be in the business of perpetrating similar injustices of its own against other groups. The fact that this case was not on the same scale as many of the expropriations perpetrated against Jews is noteworthy, but still no excuse.</p>\n<p>At the same time, it is also worth noting that Israel has an independent judiciary that curbs some of its government's unjust policies, as it has in this case. The same can't be said for most of Israel's adversaries.</p></blockquote>\n<p>Sadly, the present Israeli government hasn't shown the same commitment to liberal values as the Israeli Supreme Court did in 2020. Indeed, among its other sins, that government<a href=\"https://reason.com/volokh/2025/12/30/reflections-on-a-visit-to-israel/\" target=\"_blank\" rel=\"noopener\"> has been trying to undermine judicial review</a>, in part for the purpose of <a href=\"https://reason.com/volokh/2023/02/05/new-israeli-governments-judicial-reforms-are-not-anti-democratic-but-they-may-create-a-tyranny-of-the-majority/\" target=\"_blank\" rel=\"noopener\">establishing a kind of \"tyranny of the majority.\"</a> Israel must do better, and the US and other Western states should apply pressure to that effect, even as we also keep in mind that there is still a major moral gap between the Israelis and their adversaries.</p>"},{"title":"The Next Big Influencer Is This 4-Foot-Tall Robot From China","source":"Wired","author":"@wired","url":"https://www.wired.com/story/unitree-influencer-4-foot-robot-from-china/","category":"tech","categoryLabel":"Technology","wordCount":769,"readingTime":4,"content":"<p>When Edward Warchocki speaks with you, he sounds like a regular guy. “Not super intelligent, but very emotional, very easy to make friends with,” says Bartosz Idzik, the person who created him. But when he doesn’t talk, it’s harder to forget what Warchocki really is: a 4-foot-tall <a href=\"https://www.wired.com/story/this-robot-is-going-to-replace-your-interns-flexion/\" target=\"_blank\" rel=\"noopener\">humanoid robot</a> that’s wandering the city streets of Poland.</p><p>Six months ago, Idzik and his friend Radosław Grzelaczyk had the idea of buying a humanoid robot from China. They named it “Edward Warchocki” after Grzelaczyk’s dog Eddie and the Polish word for growling, “warczeć,” but also because it sounds like a passable name for a Pole. The first few days they took Edward out, it couldn’t speak, and people were clearly scared of it. Then Idzik, a software developer, wired Edward to a large language model that made it capable of having live conversations in Polish.</p><p>“When he started to talk, people loved him. Without talking, it’s just a 40-kilogram machine,” Idzik says.</p><p>Edward soon made lots of friends. It visited the Polish parliament and talked to politicians, hiked up mountains and waded in the lake, and was jokingly arrested by the police. In April, a video of it chasing away wild boars in Warsaw, armed with a backpack and a Rolex, <a href=\"https://www.wired.com/video/watch/backpack-wearing-humanoid-robot-celebrates-after-chasing-wild-boars-into-forest\" target=\"_blank\" rel=\"noopener\">went viral worldwide</a>. By now, Edward has over 1 million followers and 4 billion views across social media.</p><p>In 2026, you must have seen at least one of these humanoid influencers vibing around the world. There’s “<a href=\"https://www.instagram.com/rizzbot_official/?hl=en\" target=\"_blank\" rel=\"noopener\">Rizzbot</a>,” which wears a cowboy hat and flirts with passersby on the streets of Austin; “<a href=\"https://www.instagram.com/bartrobot_/\" target=\"_blank\" rel=\"noopener\">Bart Robot</a>,” which was breakdancing with Knicks fans in New York, celebrating the team’s historic championship; and the “<a href=\"https://www.instagram.com/brickellclanker/\" target=\"_blank\" rel=\"noopener\">Brickell Clanker</a>,” which changed into different jerseys to party with World Cup fans after each game.</p><p>But unless you’ve been paying close attention, you probably haven’t realized these robots are all the same model: <a href=\"https://www.wired.com/story/nvidia-unitree-humanoid-robot-h2-plus/\" target=\"_blank\" rel=\"noopener\">Unitree</a> G1, one of the most available and affordable humanoid robots on the global market today, made by <a href=\"https://www.wired.com/story/china-humanoid-robot-coworkers/\" target=\"_blank\" rel=\"noopener\">a Chinese company that’s leading the robotics industry</a>. The G1 is about the size of a child, with a hollowed-out face with a ring of blue light and light-gray limbs made of aluminum. It’s <a href=\"https://www.youtube.com/watch?v=y7ojRmPxqNg\" target=\"_blank\" rel=\"noopener\">going on <em>America’s Got Talent</em></a>, <a href=\"https://www.youtube.com/watch?v=NwOXRGDstXg\" target=\"_blank\" rel=\"noopener\">showing off kung fu</a>, <a href=\"https://www.youtube.com/watch?v=5ygzQL74KaI\" target=\"_blank\" rel=\"noopener\">having boxing matches</a>, <a href=\"https://x.com/BrianRoemmele/status/2031725321721163789?s=20\" target=\"_blank\" rel=\"noopener\">parkouring</a>, <a href=\"https://x.com/xiaohu/status/2002260970798760362?s=20\" target=\"_blank\" rel=\"noopener\">dancing at concerts</a>, <a href=\"https://x.com/TheHumanoidHub/status/2037626679041130949?s=20\" target=\"_blank\" rel=\"noopener\">running with kids</a>, <a href=\"https://www.instagram.com/reels/DQj4oiWEtlT/\" target=\"_blank\" rel=\"noopener\">cooking (but failing)</a>, <a href=\"https://www.youtube.com/watch?v=s_MSRtmYBB4\" target=\"_blank\" rel=\"noopener\">streaming with Kai Cenat</a>, <a href=\"https://x.com/wulian_anitalk/status/2069790146682405373?s=20\" target=\"_blank\" rel=\"noopener\">begging for money</a>, <a href=\"https://x.com/Ne_zaha/status/2069817869840359625?s=20\" target=\"_blank\" rel=\"noopener\">dating itself</a>, being ordained as a monk in <a href=\"https://x.com/AFP/status/2026938985474310421?s=20\" target=\"_blank\" rel=\"noopener\">Japan</a> and <a href=\"https://www.youtube.com/watch?v=1KYF0weUV4Y\" target=\"_blank\" rel=\"noopener\">Korea</a>, and <a href=\"https://x.com/Reuters/status/2067400650473013565?s=20\" target=\"_blank\" rel=\"noopener\">praying at a mosque in Dubai</a>.</p><p><a href=\"https://x.com/DimzRacks/status/2063004994312253833?s=20\" target=\"_blank\" rel=\"noopener\">An anonymous shitposter on X</a> put it: “This clanker is lit as fuck!”</p><p>Unitree will go public on the Chinese stock market in about two weeks. Its financial disclosure tells how popular the company’s products are: Unlike most robot companies whose products are still being tested in labs, more than half of Unitree’s 2025 revenue came from delivering humanoid robots to real customers. It shipped 5,511 humanoids in 2025 at an average price of less than $25,000 each. And 43 percent of all sales came from outside China. The company also became profitable for the first time last year.</p><p>“We tested a lot of humanoids, and the G1 was the best for its purpose,” Idzik says. “We are used to China copying other countries, but from the perspective of humanoids, other people should copy China. ”</p><p>Despite its commercial success, the company and its robots are often the subject of intense doubts. Sure, they can perform clout-seeking, crowd-pleasing tasks, but can they hold down a traditional job contributing to the economy, like working on an assembly line or cleaning a house? When will Unitree G1 get a real job?</p><h2>Buying It in the US</h2><p>Jake Cooperstein, a 24-year-old who lives in Miami, says he was inspired by Edward and other accounts to create a humanoid influencer of his own. In January, he visited the warehouse of a robotics shop in New York and tested the Unitree G1 robot. He was impressed by how easy it was to operate. The next day, he secured an order and paid the deposit.</p><p>On Unitree’s website, a basic G1 robot is priced at $13,500, but that’s before any tariff, shipping, and taxes. A US distributor lists the robot at about $19,000 instead. Cooperstein was not satisfied with that, though. The most basic version doesn’t come with more sophisticated parts like <a href=\"https://www.wired.com/story/made-in-china-the-dollar6-billion-chinese-startup-making-hands-for-humanoids/\" target=\"_blank\" rel=\"noopener\">dextrous hands</a> and is prohibited from modification. He instead chose the U5 variation that’s designed for educational buyers. It has more parts and better customization but sits at the price of $66,000.</p>"},{"title":"We've been tracking graphics card prices for exactly one year and it's never been worse than this","source":"PC Gamer","author":"Dave James","url":"https://www.pcgamer.com/hardware/graphics-cards/weve-been-tracking-graphics-card-prices-for-exactly-one-year-and-its-never-been-worse-than-this/","category":"gaming","categoryLabel":"Gaming","wordCount":1311,"readingTime":7,"content":"<p>We first started tracking the prices of individual graphics cards on August 14, 2025, and since then we've checked on an <em>almost</em> weekly cadence (we've got to have holidays, y'know). And it's not been a pretty year.</p><p>In the interests of full disclosure, the methodology behind this data capture has been to have one editor spend an inordinate amount of their work day tracking down the cheapest available version of each of the current generation of GPUs from <a href=\"https://www.pcgamer.com/tag/nvidia/\" target=\"_blank\" rel=\"noopener\">Nvidia</a>, AMD, and yes, even Intel. They must be new in-box, so no refurbs or open box sales, and they must be from reputable sellers—no vendors on Amazon called sdfgwegggggwawfdasfsreqwwqeccccawef, in other words.</p><p>This data captures the very cheapest prices these GPUs were available for throughout the year, but what it doesn't capture is the average price, which has often been much higher. Sometimes there might be a good deal on a particular graphics card, while the rest of the market is significantly more expensive. But our idea was to capture what a reader could spend in a particular week to bag the GPU chipset they wanted. And we're carrying that on, with <a href=\"https://www.pcgamer.com/hardware/graphics-cards/graphics-card-price-watch-deals/\" target=\"_blank\" rel=\"noopener\">our weekly updates page</a> always housing links to the cheapest cards we can find.</p><p>Back in August of last year, things weren't particularly pretty at all. There was a mix of low stock and high demand, which meant that graphics cards from all the various manufacturers were well over their respective MSRPs… and had been since launch. Every GPU launched in 2025 had one thing in common: There was little initial supply and the promised launch prices generally evaporated in a puff of corporate greed.</p><p>And that was all before the RAMpocalypse took hold.</p>\n<p>\nSwipe to scroll horizontally\n</p>\n\nChanges in minimum GPU chipset price over 12 months\n\n<p>GPU</p>\n<p>August 14, 2025</p>\n<p>August 14, 2026</p>\n<p>Change ($)</p>\n<p>Change (%)</p>\n\n<p><strong>Intel Arc B570</strong></p>\n<p>$230</p>\n<p>$260</p>\n<p>+$30</p>\n<p>+13.0%</p>\n\n<p><strong>Nvidia RTX 5050</strong></p>\n<p>$250</p>\n<p>$299</p>\n<p>+$49</p>\n<p>+19.6%</p>\n\n<p><strong>Intel Arc B580</strong></p>\n<p>$260</p>\n<p>$310</p>\n<p>+$50</p>\n<p>+19.2%</p>\n\n<p><strong>AMD RX 9060 XT 8 GB</strong></p>\n<p>$280</p>\n<p>$370</p>\n<p>+$90</p>\n<p>+32.1%</p>\n\n<p><strong>Nvidia RTX 5060</strong></p>\n<p>$300</p>\n<p>$359</p>\n<p>+$59</p>\n<p>+19.7%</p>\n\n<p><strong>Nvidia RTX 5060 Ti 8 GB</strong></p>\n<p>$368</p>\n<p>$420</p>\n<p>+$52</p>\n<p>+14.1%</p>\n\n<p><strong>AMD RX 9060 XT 16 GB</strong></p>\n<p>$370</p>\n<p>$470</p>\n<p>+$100</p>\n<p>+27.0%</p>\n\n<p><strong>Nvidia RTX 5060 Ti 16 GB</strong></p>\n<p>$430</p>\n<p>$650</p>\n<p>+$220</p>\n<p>+51.2%</p>\n\n<p><strong>Nvidia RTX 5070</strong></p>\n<p>$550</p>\n<p>$755</p>\n<p>+$205</p>\n<p>+37.3%</p>\n\n<p><strong>AMD RX 9070</strong></p>\n<p>$600</p>\n<p>$650</p>\n<p>+$50</p>\n<p>+8.3%</p>\n\n<p><strong>AMD RX 9070 XT</strong></p>\n<p>$700</p>\n<p>$720</p>\n<p>+$20</p>\n<p>+2.9%</p>\n\n<p><strong>Nvidia RTX 5070 Ti</strong></p>\n<p>$780</p>\n<p>$1030</p>\n<p>+$250</p>\n<p>+32.1%</p>\n\n<p><strong>Nvidia RTX 5080</strong></p>\n<p>$1100</p>\n<p>$1290</p>\n<p>+$190</p>\n<p>+17.3%</p>\n\n<p><strong>Nvidia RTX 5090</strong></p>\n<p>$2400</p>\n<p>$4400</p>\n<p>+$2000</p>\n<p>+83.3%</p>\n\n<p>There was a beautifully innocent, AI ignorant moment in October, however, when—and I am getting a lump in my throat as I write this—pretty much every GPU except the <a href=\"https://www.pcgamer.com/hardware/graphics-cards/nvidia-geforce-rtx-5090-fe-review/\" target=\"_blank\" rel=\"noopener\">RTX 5090</a> was available at or under its MSRP. We've never had it so good…</p><p>But then almost as soon as the Black Friday sales wrapped up at the end of November things went—and I hope you'll forgive the technical industry jargon here—utterly tits up.</p><p>The memory crisis started to bite into the GPU market, and graphics card prices started to rise back up again, starting with the <a href=\"https://www.pcgamer.com/hardware/graphics-cards/nvidia-rtx-5080-founders-edition-review/\" target=\"_blank\" rel=\"noopener\">RTX 5080</a>, which then dragged up almost every GPU up the price ladder into the new year.</p><h3>Lowest price per GPU</h3><p>We've been measuring the lowest available price of each current-gen GPU since August 14, 2025.</p><p>Lowest pricing (Price, $)</p><p>Week</p>Lowest pricing DataTimestamp (Week)Nvidia RTX 5080 (Price, $)Nvidia RTX 5070 Ti (Price, $)AMD RX 9070 XT (Price, $)AMD RX 9070 (Price, $)Nvidia RTX 5070 (Price, $)Nvidia RTX 5060 Ti 16 GB (Price, $)Nvidia RTX 5060 Ti 8 GB (Price, $)AMD RX 9060 XT 16 GB (Price, $)AMD RX 9060 XT 8 GB (Price, $)Nvidia RTX 5060 (Price, $)Nvidia RTX 5050 (Price, $)Intel Arc B580 (Price, $)Intel Arc B570 (Price, $)AMD Radeon RX 9070 GRE (Price, $)11100780700600550430368370280300250260230N/A21099750700600550430340370270300250260230N/A31000750700550524430370370280291250250230N/A41000750695550546430345370280296250250230N/A51000749670600481430340350270300250250230N/A6929749670600499379340350270289240250230N/A7999750650550520430350350270299240250230N/A8980749650550500430342350270299250250200N/A9999750650560500430323350270299250250220N/A10989730600550480430340360270299250250210N/A11990699600550489400320340250280230250200N/A12989730600530500400320350275279220250200N/A131000750600530527420342350280279220250200N/A141000750600530540420313370280279220250202N/A151000749600530499430350380288279200240202N/A161100750620530499430350380288270200240202N/A171230750660580549430330390310260235250200N/A181268829700580540450330390310290240250200N/A191380899720580549450330400310299240260200N/A2013501000720600620520330440310299240290200N/A211365950730590620520351440350299260290250N/A221365950730630620520360400346299260300250N/A231290950730630630520360440346340260300250N/A241290950730620625520360440346340260300250N/A251250950730610630550360440346349260300250N/A261260950730610604550360440340349290300250N/A271290950730630640570360440340349290300250N/A281250900720620630515390440346349290290250N/A291290990710620636500390449350349290290250N/A301290990710620630500390440350330290290260N/A311290990670620599500380440350330290290260N/A321290990710620599515380430360310290290260N/A331290980710600599490400430360349290290260N/A341270980710620599550380440360349290290260N/A351290900700600599550380430360350290304260N/A3612509807006005995503704403603402903002605503712509807006005995703704403503402903042505503812509807006005995703704403503402903042505503912509207006005995703304003603402902982505004012509557006005995653304303603402902912605004112509007006005605603304303603392902902505004212509506906355505703804503603502902902605504312901030720650755650420470370359299310260500 <p>Thankfully we haven't experienced the same sort of exponential price growth that has blighted either the system memory or storage markets with graphics cards. Yes, the <a href=\"https://www.pcgamer.com/nvidia-geforce-rtx-5090/\" target=\"_blank\" rel=\"noopener\">RTX 5090</a> has risen in price by 83% to $4,400, but everything else hit a plateau relatively quickly and we've been living in that new normal more or less happily for most of this year.</p><p>Okay, I say 'relatively happily' but the pricing for both the <a href=\"https://www.pcgamer.com/nvidia-geforce-rtx-5080/\" target=\"_blank\" rel=\"noopener\">RTX 5080</a> and <a href=\"https://www.pcgamer.com/hardware/graphics-cards/nvidia-rtx-5070-ti-review-msi-ventus-3x/\" target=\"_blank\" rel=\"noopener\">RTX 5070 Ti</a> did hit levels that meant they could be more or less ignored by the general PC gaming populace who would never be able to countenance spending that much on a single component. And we did actually stop tracking the RTX 5090 when it hit $3,000 for that same reason: there was just no point recommending it.</p><p>And that relative stasis point for GPU pricing—there was individual fluctuation of GPUs, but little of significance—continued until, well, yesterday. I came back from a week away with the family to find Nvidia's mid-range graphics card market determined to wipe itself out. The <a href=\"https://www.pcgamer.com/hardware/graphics-cards/nvidia-rtx-5070-founders-edition-review/\" target=\"_blank\" rel=\"noopener\">RTX 5070</a> had been knocking around its $549 MSRP for a while, but all of a sudden that is over.</p><h4>Tracking 12 and 16 GB graphics card pricing over 12 months</h4><p>Boom, prices rocket up to $700, now $755, and largely $800 across the board. For a fourth-tier GPU that was barely an improvement over the <a href=\"https://www.pcgamer.com/nvidia-rtx-4070-super-founders-edition-review-benchmarks-performance/\" target=\"_blank\" rel=\"noopener\">RTX 4070 Super</a> of the previous generation once you take out DLSS-related RTX <a href=\"https://www.pcgamer.com/nvidia-blackwell/\" target=\"_blank\" rel=\"noopener\">Blackwell</a> luxuries. The <a href=\"https://www.pcgamer.com/hardware/graphics-cards/nvidia-geforce-rtx-5060-ti-16-gb-review-palit-infinity-3/\" target=\"_blank\" rel=\"noopener\">RTX 5060 Ti 16 GB</a> card has followed it, like a rat up the ludicrous pricing drainpipe, dragging an increase of 51% up there with it.</p><p>So, we're now at a point where <a href=\"https://www.pcgamer.com/hardware/graphics-cards/the-gpu-price-hike-is-here-and-you-should-avoid-any-nvidia-card-with-more-than-8-gb-vram-if-you-value-your-bank-balance/\" target=\"_blank\" rel=\"noopener\">I'm recommending that PC Gamer readers do not buy any Nvidia RTX 50-series GPU with more than 8 GB of VRAM</a>, simply because they've priced themselves out of any form of relevance for gamers. Thankfully, the AMD RDNA 4 cards are still priced almost sensibly, though there are hints that will soon change. But for now the 12 and 16 GB Navi 48-based cards—the <a href=\"https://www.pcgamer.com/hardware/graphics-cards/amd-radeon-rx-9070-gre-review-acer-nitro/\" target=\"_blank\" rel=\"noopener\">RX 9070 GRE</a>, <a href=\"https://www.pcgamer.com/hardware/graphics-cards/xfx-swift-radeon-rx-9070-oc-review/\" target=\"_blank\" rel=\"noopener\">RX 9070</a>, and <a href=\"https://www.pcgamer.com/hardware/graphics-cards/amd-radeon-rx-9700-xt-review-asus-prime-oc/\" target=\"_blank\" rel=\"noopener\">RX 9070 XT</a>—are all priced under the level of the <a href=\"https://www.pcgamer.com/nvidia-geforce-rtx-5070/\" target=\"_blank\" rel=\"noopener\">RTX 5070</a>.</p><p>But we're still at a point where the top five Nvidia GeForce GPUs are priced at $650 or above and that makes me want to sick up a bit. Y'know, arching my back like a cat at the thought of an RTX 5060 Ti costing that much. Ack. Acccckhh.</p><p>And where do we go from here? I'll be continuing to track the pricing of graphics cards <em>most </em>weeks (43 out of 52 ain't bad) so we'll see when <a href=\"https://www.pcgamer.com/hardware/graphics-cards/amd-is-reportedly-raising-graphics-card-prices-it-was-just-waiting-for-nvidia-to-do-it-first/\" target=\"_blank\" rel=\"noopener\">the Radeon price bump</a> comes into effect in retail, and then we have to figure out if this generation of graphics cards is then best just left to the datacentres and AI sickos.</p><p>What happens to the next generation of GPUs? There's been the expectation of a Super refresh for the RTX Blackwell range, which can only really offer a bump in VRAM given the silicon limitations of each GPU, and then how do you price that? Here's an RTX 5080 Super, that'll be $1,499, thanks. RTX 5070 Ti Super, ma'am? Of course it has a stupid name, but we're still going to charge you $1,200.</p><p>Thank you sir, may I have another.</p>\n\n<p>Dave has been gaming since the days of Zaxxon and Lady Bug on the Colecovision, and code books for the Commodore Vic 20 (Death Race 2000!). He built his first gaming PC at the tender age of 16, and finally finished bug-fixing the Cyrix-based system around a year later. When he dropped it out of the window. He first started writing for Official PlayStation Magazine and Xbox World many decades ago, then moved onto PC Format full-time, then PC Gamer, TechRadar, and T3 among others. Now he's back, writing about the nightmarish graphics card market, CPUs with more cores than sense, gaming laptops hotter than the sun, and SSDs more capacious than a Cybertruck.</p>"},{"title":"Phoebe Bridgers Comes Back to Earth","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/pop-music/phoebe-bridgers-comes-back-to-earth","category":"fun","categoryLabel":"Interesting Reads","wordCount":1446,"readingTime":8,"content":"<p>Phoebe Bridgers has a filmmaker’s eye for a cold open. Sometimes her songs disorient from the jump, dropping you into an alien landscape or the middle of an argument. Other times she draws you in with a dreamy establishing shot—and then snaps it into sharp, unsparing focus. “I was the belle of the Governor’s Ball,” begins one song on her new album, “Lost Weekend.” Then she continues, in her usual hushed head voice: “Hiding in the bathroom like Shelley Duvall.” The reference to the climactic scene in “The Shining,” delivered delicately over a lullaby in waltz time, comes off as both foreboding and gently self-mocking. For a certain type of person, having a terrible time at a party can feel like being pursued by an axe murderer.</p><p>These kinds of seemingly effortless lines, lines that take a small shard of experience and hold it up to the light, offer some clues as to how the thirty-one-year-old Bridgers earned her reputation as one of her generation’s standout songwriters. Over the past decade, across three solo albums and a raft of collaborative projects, she has honed one of the most distinctive songwriting voices in indie rock today—wryly observational, ruthlessly introspective, downcast but never wallowing. Her 2020 album, “<a href=\"https://www.newyorker.com/magazine/2020/05/25/phoebe-bridgers-frank-anxious-music\" target=\"_blank\" rel=\"noopener\">Punisher</a>,” featured her sharpest songs yet, and it arrived at the perfect time. Depression—its little humiliations and stretches of nullity, but also the unexpected flashes of insight it can produce—is Bridgers’s chief subject. The stride she made on “Punisher” was to telescope her songs’ depression outward, transforming it from a state of isolation to, paradoxically, a state of receptivity to the world outside. That first pandemic summer, songs such as “Chinese Satellite” and “I Know the End” captured something about the texture of life in lockdown, the combination of stultifying routine and longing for a wider ambit of experience.</p><p>“Punisher” was a star-making album for Bridgers. In the years since, though, she has kept a lower profile, pouring much of her energy into collaborative projects, including <a href=\"https://www.newyorker.com/culture/listening-booth/boygeniuss-record-of-friendship-and-mutual-obsession\" target=\"_blank\" rel=\"noopener\">boygenius</a>, her band with the singer-songwriters Julien Baker and Lucy Dacus. Life happened: She was reportedly engaged to the actor Paul Mescal, and then she was not; in late 2022, her father, the subject of some of her most brutally ambivalent songs, died. Sometime around then, she began dating the musical comedian <a href=\"https://www.newyorker.com/magazine/2018/07/02/bo-burnhams-age-of-anxiety\" target=\"_blank\" rel=\"noopener\">Bo Burnham</a>. Meanwhile, her work has become a stylistic reference point for a younger generation of artists in the increasingly hazy middle zone between indie music and chart pop. In <a href=\"https://www.newyorker.com/magazine/2026/06/29/olivia-rodrigo-music-review\" target=\"_blank\" rel=\"noopener\">Olivia Rodrigo</a>’s tragicomic abjection, in Audrey Hobert’s neurotically self-undercutting lyrics, in just about everything on the slick surface of Gracie Abrams’s studiously crafted pop product, Bridgers is a presiding spirit.</p><p>“Lost Weekend” announces itself as a return from time spent in the wilderness. “WIFE IS HOME FROM WAR,” read one typically parasocial fan comment on a promotional Instagram post. “Lemme up my medication in advance,” read another—Bridgers’s fans like to joke about the emotionally devastating effect of her music. Yet the album begins not with catharsis but with dissociation. On the opening track, “The Outside,” Bridgers sings through a vocoder, multiplying her voice into a metallic swarm. From this alien-drone perspective, she narrates two scenes: in the first verse, her father’s funeral; in the second, performing onstage. The song is about not being able to inhabit either experience fully. “I am on the outside, watching,” goes the uncharacteristically laconic chorus, as the vocoder drops away.</p><p>Bridgers’s great trick, though, is to set these two experiences against one another as a diptych. A “fist through the drywall” in the first verse glances off a “fist in the air” in the second; “I’ll watch him get carried away,” already suggestive of both a funeral procession and a violent outburst, is answered in the second verse with “Ohio, carry me away.” This is an image of crowd-surfing, but it is also a nod to a song by Sun Kil Moon, a formative influence on Bridgers whose creator, Mark Kozelek, has himself been known to fly into nasty tirades in public. (Separately, Kozelek has been accused of sexual misconduct by several women. He denies all allegations of wrongdoing.) Zoning out and leaving your body starts to look less like a defense mechanism and more like a poetic device for revealing hidden patterns of experience. Dissociation becomes its opposite: a kind of imaginative association.</p><p>In an early interview, Bridgers mentioned wanting to be “one of those artists that . . . could release an electronic record or a country record next, and nobody would be surprised.” Some eight years later, no one would exactly describe her in those terms. Her first two albums have distinct sonic identities, but the songs sometimes bleed into one another. She has a finely tuned ear for melody, but she is not a writer of earworms; her melodies tend to follow the lateral, associative chain of her lyrics. They take hold after repeat listens. Listening to her music again and again, in fact, is the key to seeing the larger shape of her ambition. Bridgers is not a serial self-reinventor like David Bowie or even Joni Mitchell—she is a polisher and a honer. She is the kind of artist who seems to have two or three basic musical templates for songs and is constantly creating new versions of them. (The clearest-cut case is boygenius’s “Letter to An Old Poet,” which interpolates and updates the earlier “Me &amp; My Dog,” Bridgers’s signature song on the band’s first album.)</p><p>“Lost Weekend” is the first Bridgers album to take full advantage of her music’s extreme consistency. It is also the most cohesive and sonically immersive of her records, thanks to her intricate co-production with her usual collaborators Tony Berg and Ethan Gruska, along with the newcomers Jack Antonoff and Alex G. A crowded room of guests fills out the sound; some even briefly steal the show, as in the poignant harmony vocals by one “Son-John Johnson,” which can only be a pseudonym for the wobbly-voiced indie-rock singer Cameron Winter. The atmosphere of the album is not too far off from the soft-focus glow of “Punisher,” but some of the dials are cranked way up: Bridgers has said that she’s been listening to a lot of ambient music, and it shows. Dreamy interludes pad the space between tracks with humming synths and strings; sometimes songs dissolve into floating mood pieces, anchored by a drone or loop. If you give “Lost Weekend” the right kind of attention, you might get the sense that it does not consist of individual songs so much as a vast nebula of sound, from which fragments of music flash out, and into which they eventually subside. Appropriately, leading up to the album’s release, Bridgers organized special listening sessions in planetariums.</p><p>Figures go down into the cosmic foam, only to turn up later in different forms. “Lost Boys,” the album’s first single, gathers a whirl of images of prolonged adolescence: speeding motorcycles, violent tantrums, twin beds. Each verse seems to address a potentially different “you,” or perhaps a composite person who comes off as a charming but exasperating man-child. But then the triumphant final chorus embraces every possible nettlesome “you” at once: “Lost boys / Come find me / Yeah!” It’s an incredible moment of rock-and-roll reconciliation, on par with the climactic “You are forgiven!” in the Who’s “A Quick One, While He’s Away.”</p><p>Redemption feels just around the corner throughout “Lost Weekend.” This, too, is something new in Bridgers’s catalogue. “This could be the end of wanting,” she sings on “Bobby,” the album’s most raucous track, which is also a tender love song. “Thank you for everything,” she sings at the end of “Still Standing,” which up to that point has been an unsparing catalogue of traumatic memory fragments. But the most potent redemption on the record is enacted musically. Two melodic themes recur throughout the album: a lilting wordless “ooh,” part waltz and part dirge, and a more energetic fanfare. Each gets elaborated across several songs, gathers associations along the way, and finds its ultimate expression in the final two tracks. In “As Above,” the fanfare gains words, seeming to herald the future: Bridgers sings, at the very top of her range, and in full chest voice for once, “You don’t have to believe in magic / Leave it to me and I’ll make it happen.” At the end of the final song, “Lost Weekend (Reprise),” the waltz theme whirls in one more time to send off the past. It’s less a final resolution than an acknowledgment that things keep moving. The stars wink out on the screen, but you can still feel the sky spinning. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
