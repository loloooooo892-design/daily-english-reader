<script>
var articles = [{"title":"Remedies for a Constitutional Crisis Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/","category":"law","categoryLabel":"Law","wordCount":893,"readingTime":5,"content":"<h2>Introduction</h2>\n<p>In a constitutional showdown with the executive branch, the courts may seem to have limited remedial options.  Once we reach a point where courts conclude that the Executive is violating the law, what can they do but order compliance?  And what can we do but hope that the Executive feels compelled to comply, whether by conscience or political forces?</p>\n<p>Today, that compliance is hard to take for granted.  Indeed, the risk is that the executive branch will blow off the judiciary, ignoring its judgments, refusing to obey its decrees, courting contempt, accusing judges of fictitious wrongdoing, and tacitly encouraging retaliation against them.  And indeed, there is evidence that this is what is happening.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a></p>\n<p>The upshot is that we are slipping into a crisis of judicial authority — what one could call a “constitutional crisis.”  We use the phrase here reluctantly, for it is overused and vague.  And we use it without knowing what will come next, and even though we might need a new word if things get worse.  (It was called the “Cuban Missile Crisis,” even though it ended fine, and even though it could have gotten much worse, and even though we would have needed a new term for what happened if it did.)  The phrase “constitutional crisis” at least captures the sense that the courts face an unusual challenge today, and that the precedents, such as they are, are not reassuring.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Call it what you will, it is not good.</p>\n<p>What courts can do to enforce their decisions in such a crisis is the inquiry at the heart of this Essay.  If courts cannot assume that the Executive will simply accept their decisions, what options are open to the least dangerous branch?  Do the federal courts have choices that will coax the executive branch into more law-abiding behavior?  Or will those choices hasten the slide toward an equilibrium in which the Executive acts contemptuously but escapes contempt?  Do the federal courts have choices that will provide an effective resistance to lawbreaking by the Executive, shoring up the rule of law?  Or will those choices merely accelerate and heighten the conflict between the branches, precipitating a battle that the judiciary can start but not win?</p>\n<p>Our central claim is that the range of remedial options available to courts is broader than it may seem at first — and that the best path is not always obvious.  Even when it is clear that the executive branch has acted unlawfully, it is not necessarily clear what courts can do about it.  Even if we are in a crisis, and the choice of judicial response is very important, that does not make obvious the <em>correct</em> choice.  We recognize that our readers will assess the risks associated with each option in various and varying ways, and that our own assessments may change as the world changes.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  (Indeed, much has changed since this Essay was presented in October 2025.)  So this Essay does not attempt to crown any one choice as the right one.  Nor do we claim that any of these remedial choices will be enough to avert or undo a constitutional crisis.  They are not remedies in that sense.</p>\n<p>Our aim is more modest: We will lay out the menu of options that are available to federal judges, highlighting the tradeoffs among them.  But we recognize that we do not have the burden of choice, which belongs instead to the judges — and, we should acknowledge, to the President and the other executive officers and employees, as well as to the members of Congress.  In every separation of powers crisis, and in every averted separation of powers crisis, the decisive decisions are not made by law professors:</p>\n<p>Bullfight critics ranked in rows</p>\n<p>Crowd the enormous Plaza full;</p>\n<p>But only one is there who <em>knows</em></p>\n<p>And he’s the man who fights the bull.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a></p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1747.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Daniel T. Deacon &amp; Leah M. Litman, <em>Legalistic Noncompliance</em>, 75 Duke L.J. (forthcoming 2026) (manuscript at 9–45), https://ssrn.com/abstract=5241936 [https://perma.cc/D32A-BM56]; Thomas P. Schmidt &amp; Gillian E. Metzger, <em>Some Realism About Constitutional Remedies</em>, 139 Harv. L. Rev. 1834 (2026).  For a contrary view, see Adrian Vermeule, Opinion, <em>Someone Is Defying the Supreme Court, But It Isn’t Trump</em>, N.Y. Times (July 31, 2025), https://www.nytimes.com/2025/07/31/opinion/supreme-court-trump-judges-defiance.html [https://perma.cc/8F46-ZDLX].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707 (2009); Keith E. Whittington, <em>Yet Another Constitutional Crisis?</em>, 43 Wm. &amp; Mary L. Rev. 2093 (2002); Arthur Bestor, <em>The American Civil War as a Constitutional Crisis</em>, 69 Am. Hist. Rev. 327 (1964).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> Judges might also derive wisdom from experiences around the world, though with the usual caveats about translating lessons from other institutions to ours.  <em>See generally, e.g.</em>, Jeffrey K. Staton, Christopher Reenock &amp; Jordan Holsinger, Can Courts Be Bulwarks of Democracy? Judges and the Politics of Prudence (2022); Benjamin Garcia-Holgado, <em>Overruling the Executive: Judicial Strategies to Resist Democratic Erosion</em>, 13 J.L. &amp; Cts. 274 (2025); Fortunato Musella &amp; Luigi Rullo, <em>Constitutional Courts in Turbulent Times</em>, 25 Eur. Pol. &amp; Soc’y 461 (2024).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Poem attributed to Domingo Ortega by Robert Graves, <em>in</em> Robert Graves, Oxford Addresses on Poetry 4 (1962).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>"},{"title":"How Much of a Problem is AI’s Water Use? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/how-much-of-a-problem-is-ais-water-use-1284519/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1470,"readingTime":8,"content":"<p><em><a href=\"https://knowablemagazine.org/content/article/technology/2026/how-much-water-do-ai-data-centers-use\" target=\"_blank\" rel=\"noopener\">This story</a> was originally published by </em><a href=\"http://knowablemagazine.org/\" target=\"_blank\" rel=\"noopener\">Knowable Magazine</a><em>.</em></p><p>Featured Video</p><p>“Protect our water,” “Water for people not AI,” “Don’t mess with our water,” declare protest signs from Texas to New Mexico to Arizona. Angered by water use, energy consumption and pollution, locals are <a href=\"https://news.gallup.com/poll/709772/americans-oppose-data-centers-area.aspx\" target=\"_blank\" rel=\"noopener\">increasingly protesting</a> the rapid expansion of data centers in the United States as tech companies work to rapidly expand capacity for AI.</p><p>Many data centers rely at least partly on water to absorb heat from air or surfaces, and then cause cooling as it evaporates, just like sweating keeps our bodies cool. The processors inside data centers can reach internal temperatures of up to 176 degrees Fahrenheit, for the same reasons that an overtaxed laptop heats up.</p><p>But while there’s little doubt that data centers are consuming <a href=\"https://knowablemagazine.org/content/article/technology/2026/lowering-energy-use-artificial-intelligence-datacenters\" target=\"_blank\" rel=\"noopener\">significant amounts of energy</a>, water consumption is more complicated. Claims circulating online bring scant clarity, ranging from articles claiming that chatbots can consume 500 ml of water per query to some online commentators declaring AI's water issue to be nonexistent. And the consumption data from large tech companies themselves are often incomplete and inconsistent.</p><p>Experts stress that, overall, data center water consumption pales in comparison to the usage by industries like<strong> </strong>agriculture and some kinds of manufacturing. Researchers have estimated that data center cooling systems <a href=\"https://escholarship.org/uc/item/32d6m0d1\" target=\"_blank\" rel=\"noopener\">consumed 66 billion liters of water in 2023</a>, less than 1 percent of the nation’s total consumption.</p><p>That figure could considerably rise with the rapid buildout of AI data centers, however — which may not be a big problem for water-rich regions but could significantly add to local water stress in drought-strapped places like New Mexico and <a href=\"https://knowablemagazine.org/content/article/society/2022/rethinking-cities-face-extreme-heat\" target=\"_blank\" rel=\"noopener\">Arizona</a>.</p><p>Fortunately, engineers say there’s a host of things that can be done — and are being done — to reduce the strain on local water resources. “There are many good ideas out there,” says energy systems expert<strong> </strong>Fengqi You of Cornell University. When you add in efforts to replenish and restore natural water resources, “there’s a good chance that, eventually, it could be net-zero water for the on-site cooling.”</p><p><strong>More Renewable Energy and Better Siting</strong></p><p>Recent advances in AI technology have already reduced water demand for many data centers. Electrical and computer engineer Shaolei Ren of the University of California, Riverside, says that an estimate he made based on GPT-4, an earlier version of the model powering ChatGPT, as recently as 2024 — that drafting a short email would consume 500 milliliters of water — is already outdated because AI models have become more efficient. (This study was the origin of the half-liter-per-query claim.) In 2025, Google estimated that <a href=\"https://cloud.google.com/blog/products/infrastructure/measuring-the-environmental-impact-of-ai-inference\" target=\"_blank\" rel=\"noopener\">five drops of water are spent on processing</a> a median-length query with its chatbot Gemini.</p><p>But even tiny amounts add up, given the rise in AI use. You’s group recently predicted that by 2030, US data centers could consume <a href=\"https://www.nature.com/articles/s41893-025-01681-y\" target=\"_blank\" rel=\"noopener\">731 billion to 1,125 billion liters annually</a> — the latter roughly equivalent to New York City’s annual drinking water supply.</p><p>Still, these numbers factor in not just cooling, but also a greater amount of water used to generate the electricity that powers data centers. Much of that comes from burning coal or gas, with water being used to cool steam back into liquid after it’s been used to spin the electricity-generating turbines. In other words, AI’s water consumption can be significantly reduced by shifting to solar and wind, which require little to no water to operate, You says.</p><p>You adds that companies should site data centers in areas less prone to drought and with ample renewable energy sources, like regions in Montana, Nebraska, parts of Texas and South Dakota, instead of constructing new data centers in water-stressed places, such as in Arizona, New Mexico and Southern <a href=\"https://knowablemagazine.org/content/article/food-environment/2022/pricing-groundwater-will-help-solve-california-water-problems\" target=\"_blank\" rel=\"noopener\">California</a>. Strategic siting along with other measures could reduce AI’s future water footprint by up to 86 percent, he says.</p><p><strong>New Cooling Technologies</strong></p><p>Advances in cooling technologies are also helping. The newest data centers that specialize in AI are already more water-efficient than their predecessors.</p><p>Pre-AI data centers use fans to carry away the heat from processor-filled racks, then use chilling systems funneling cool water through the building to cool the warm air down again. The heated water is then fed into a<strong> </strong>cooling<strong> </strong>tower that removes the heat but also loses some of the water to the atmosphere. This evaporative cooling uses a lot of water, says Eric Masanet of the University of California, Santa Barbara, who researches data center sustainability.</p><p>But the energy-hungry processors inside AI data centers generate so much heat that it’s hard to remove it with air alone. That’s why many tech companies — including <a href=\"https://www.aboutamazon.com/news/aws/aws-liquid-cooling-data-centers\" target=\"_blank\" rel=\"noopener\">Amazon</a>, <a href=\"https://www.microsoft.com/en-us/microsoft-cloud/blog/2024/12/09/sustainable-by-design-next-generation-datacenters-consume-zero-water-for-cooling/?msockid=269fe998c60f6feb25bffc6ac76d6ee8\" target=\"_blank\" rel=\"noopener\">Microsoft</a> and <a href=\"https://cloud.google.com/blog/topics/systems/brazos-liquid-cooling-system-for-air-cooled-data-centers\" target=\"_blank\" rel=\"noopener\">Google</a> — use a more efficient technique called liquid cooling.</p><p>In this method, a system of pipes filled with water, sometimes mixed with temperature-regulating chemicals, runs on top of the hardware, cooling the processors directly rather than cooling the entire data center. And because this is a closed-loop system, no water is lost: The heated fluid can be cooled down by exposing the pipes to the outside air, if conditions are cool enough, or an air-conditioner-like system, which uses energy.</p><p>But when it’s extremely hot or humid, the centers need to bring online extra, more effective methods that involve water; one of these is to mist the air around the pipes. Mechanical engineer<strong> </strong>Vaibhav Bahadur at the University of Texas at Austin says that most AI data centers in Texas only use this kind of water-based cooling for the hottest parts of the summer.</p><p>Still, he and his colleagues recently estimated that the state’s growing number of data centers — which currently consume less than a percent of the state’s water demand <strong>— </strong><a href=\"https://compass.beg.utexas.edu/files/publications/Water_Requirements_for_DC_White_Paper.pdf\" target=\"_blank\" rel=\"noopener\">could be using 3 to 9 percent of that water by 2040</a>. He expects that figure to reduce considerably, though. “Data centers are becoming much more efficient in their water usage,” he says.</p><p>Indeed, recent technological developments have made it <a href=\"https://blogs.nvidia.com/blog/liquid-cooling-ai-factories/\" target=\"_blank\" rel=\"noopener\">easier to avoid water-based cooling</a>, even in hot climates, says Josh Parker, head of sustainability for NVIDIA, the company that designs many of the processors that populate AI-specialized data centers. Their latest generation of processors run at such high temperatures that they can be cooled with water at around 113 degrees Fahrenheit which<strong>, </strong>Parker<strong> </strong>says, is significantly warmer than traditional approaches. That reduces the need to bring on water-based cooling. Unless local temperatures regularly exceed 113 Fahrenheit, a threshold generally crossed only during severe heat waves, “typically we can just get away with large efficient fans cooling the infrastructure and the ambient air is sufficient to pull the heat away,” Parker says.</p><p>Ren cautions that some companies may not want to run their processors that hot because it can interfere with computational performance, while some also house non-AI servers in the same space that cannot take the heat.<strong> </strong>But other cooling technologies are in development.</p><p>Some of these rely on elaborately designed pipe systems that draw heat even more effectively from processors. A number of US companies are <a href=\"https://news.mit.edu/2026/nuclear-inspired-cooling-system-ferveret-could-make-data-centers-more-sustainable-0610\" target=\"_blank\" rel=\"noopener\">exploring immersion cooling,</a> where data center hardware sits in a tank filled with cooling liquid. In China, some companies have taken a similar approach by <a href=\"https://www.scientificamerican.com/article/china-powers-ai-boom-with-undersea-data-centers/\" target=\"_blank\" rel=\"noopener\">installing data centers in the ocean</a>, although this makes them hard to access should hardware need replacing or upgrading, Bahadur says.</p><p>Advances in cooling technology will be necessary for tech companies to meet sustainability goals they have set for their operations. According to a statement from Amazon, its Web Services<strong> “</strong>set a goal to be water positive by 2030 — returning more water to communities than our direct operations use — and as of 2024, we’re more than halfway there.”</p><p>A spokesperson for OpenAI points to a <a href=\"https://openai.com/index/stargate-community/\" target=\"_blank\" rel=\"noopener\">web page</a> outlining the company’s plans to minimize water use, while Google aims to <a href=\"https://sustainability.google/reports/2025-google-water-stewardship-project-portfolio/\" target=\"_blank\" rel=\"noopener\">replenish 120 percent of the freshwater its data centers</a> consume by 2030 through a variety of water stewardship projects.</p><p>Some companies, <a href=\"https://blog.google/company-news/inside-google/around-the-globe/google-europe/our-first-offsite-heat-recovery-project-lands-in-finland/\" target=\"_blank\" rel=\"noopener\">such as Google</a>, are also finding smart ways to use waste heat from data centers to help address other sustainability challenges, such as making building heating less reliant on fossil fuels. Across Europe,<strong> </strong><a href=\"https://letsdatascience.com/news/european-data-centers-reuse-waste-heat-to-heat-homes-48086eeb\" target=\"_blank\" rel=\"noopener\">some data centers</a><strong> </strong>are funneling heat from cooling circuits into district heating systems used to warm buildings.</p><p>The future of AI’s water usage hinges on decisions that tech companies, engineers and policymakers will make in the coming years, Masanet says: where data centers are sited, their local energy infrastructure and climate, and how they’re designed. “If you choose one set of choices, your number is going to be off the charts,” he says. “You choose another set of choices, it’s going to be way down here.” </p><p><em>This article originally appeared in </em><a href=\"https://knowablemagazine.org/\" target=\"_blank\" rel=\"noopener\">Knowable Magazine</a><em>, a nonprofit publication dedicated to making scientific knowledge accessible to all. <a href=\"https://knowablemagazine.org/newsletter-signup\" target=\"_blank\" rel=\"noopener\">Sign up for </a></em><a href=\"https://knowablemagazine.org/newsletter-signup\" target=\"_blank\" rel=\"noopener\">Knowable Magazine’</a><em><a href=\"https://knowablemagazine.org/newsletter-signup\" target=\"_blank\" rel=\"noopener\">s newsletter</a>.</em></p><p><em>Lead image: Knowable Magazine</em></p>"},{"title":"STALKER 2 gets serious performance and visual upgrades with its 2.0 update, testing confirms, polishing up one of the biggest flawed gems in FPS games","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/stalker-2-gets-serious-performance-and-visual-upgrades-with-its-20-update-testing-confirms-polishing-up-one-of-the-biggest-flawed-gems-in-fps-games","category":"gaming","categoryLabel":"Gaming","wordCount":1043,"readingTime":6,"content":"<p>New Zone, who dis</p>\n    \n  \n  \n  \n\n            <p>I don’t begrudge anyone who’s waited to try <a href=\"https://www.rockpapershotgun.com/games/stalker-2\" target=\"_blank\" rel=\"noopener\">STALKER 2: Heart of Chornobyl</a> until it got its technical defects fixed. They’re still wrong, obviously - an <a href=\"https://www.rockpapershotgun.com/stalker-2-review\" target=\"_blank\" rel=\"noopener\">absorbing and eerily atmospheric</a> survival FPS is still an absorbing and eerily atmospheric survival FPS when it has the structural integrity of baked beans. But it was <em>spectacularly</em> <a href=\"https://www.rockpapershotgun.com/stalker-2-pc-performance-best-settings\" target=\"_blank\" rel=\"noopener\">broken at launch</a>, and although nearly two years of patches have <a href=\"https://www.rockpapershotgun.com/stalker-2s-latest-patch-once-again-comes-with-four-figures-worth-of-fixes-and-improvements\" target=\"_blank\" rel=\"noopener\">swatted countless bugs</a> and beefed up the series’ signature <a href=\"https://www.rockpapershotgun.com/stalker-2s-broken-a-life-system-is-finally-working-as-designed-according-to-gsc-game-world\" target=\"_blank\" rel=\"noopener\">A-Life NPC simulation</a>, it’s remained a heavyweight GPU-puncher on general performance.</p>\n<p>Thank the Zone, then, for the <a href=\"https://www.rockpapershotgun.com/stalker-2-heart-of-chornobyls-meaty-20-update-brings-functional-fog-a-suite-of-a-life-improvements-and-more-when-it-arrives-next-week\" target=\"_blank\" rel=\"noopener\">2.0 update</a>, which rolls out tomorrow in tandem with the <a href=\"https://www.rockpapershotgun.com/stalker-2-cost-of-hope-review\" target=\"_blank\" rel=\"noopener\">also-good Cost of Hope expansion</a>. It ambitiously migrates STALKER 2 to a newer, sleeker version of Unreal Engine 5, and makes sweeping (though handcrafted) changes to lighting and environmental deets. Based on what I’ve played, the result is both a better-looking game and a better-performing one. So get in here, stalker - there’s never been a better time to have your skeleton melted out by an anomalous soap bubble.</p>\n\n<p>Patch 2.0’s most valuable technical upgrade – or at least, its most democraticising - is the framerate boost it grants to the game’s most PC-straining areas, like faction settlements and enemy-heavy bases. For lower-end hardware in particular, this can visibly smooth out performance around areas that used to inflict the worst of STALKER 2’s chuggery, and in some cases may even be able to wring a playable game out of previously sub-30fps setups.</p><p>Take the humble <a href=\"https://www.rockpapershotgun.com/topics/steam-machine\" target=\"_blank\" rel=\"noopener\">Steam Machine</a>, which around the bustling marketplace of the Rostok settlement, could only average 40fps at 1080p/High when running on the previous 1.7 version. The 2.0 update shot that up to 51fps, an instant 28% improvement. Beefier PCs benefit, too. My <a href=\"https://www.rockpapershotgun.com/nvidia-geforce-rtx-5080-review\" target=\"_blank\" rel=\"noopener\">RTX 5080</a> test rig wasn’t wanting for frames on 1.7, averaging 83fps on Epic quality (with help from DLSS Quality upscaling to 1440p). Even so, 2.0 gave it a free 33% uplift, to 110fps.</p>\n\n<p>The differences shrunk in areas that already ran as well as STALKER 2 could manage, like the quiet woods outside of starting town Zalissya. I only get a small clutch of freebie frames on the RTX 5080, while the Steam Machine budged by a single FPS. Still, when the 2.0 does make significant performance profits, they’re always going where they’re needed most.</p><p>It even makes STALKER 2 somewhat usable, kind of, maybe, on the <a href=\"https://www.rockpapershotgun.com/topics/steam-deck\" target=\"_blank\" rel=\"noopener\">Steam Deck</a>. On 1.7 and prior, the best you could hope for out of Valve’s handheld was 20-30fps with FSR 3.1’s upscaling on its fastest, ugliest Ultra Performance mode: a combination that looked like the game was rendered in lead shavings rather than pixels, and didn’t even run decently in exchange. After installing patch 2.0 on my <a href=\"https://www.rockpapershotgun.com/steam-deck-oled-review\" target=\"_blank\" rel=\"noopener\">Steam Deck OLED</a>, I was still effectively limited to all-Low settings, but STALKER 2 could now roughly average 30fps on FSR’s much cleaner-looking Performance mode. Which, not incidentally, has also been upgraded from FSR 3.1 to the generally finer FSR 4. Occasional dips into the twenties remain, and personally I’m too much of an ammo expenditure coward to risk missed headshots, so the thumbsticked, micro-GPU’d Deck hasn’t suddenly become my favourite way to play. It is, though, a much more viable one after version 2.0.</p>\n<p>Most of the accompanying graphical touch-ups are effective as well. I only say most because looking back at some comparison screenshots, I’d be a liar and a charlatan if I said I didn’t prefer the murkier, almost sickly tint that 1.7’s artificial light sources had over the cleaner, whiter bulbs that 2.0 has installed. As if the older effects could give you a roentgen shower just by standing underneath them.</p>\n\n<p>I’ll concede that the newer lighting is more sophisticated, mind, casting more accurate shadows and filtering out more convincingly into darker corners. Reflections get a polish, too – even by the time of 1.7, STALKER 2 had never fully cleaned up the grainy, static-like effect on puddles and the Zone’s few remaining clean floors, particularly when using upscalers like DLSS. Such imperfections are gone completely in 2.0, as are a lot of rogue reflections that seemingly bounced in from nowhere on 1.7.</p><p>And it’s not just these simulation effects that the update enhances. Developers GSC have smothered the entire Zone with more trees, grass and other foliage, which honestly does make the whole place feel wilder. More dangerous even, given how often charging boar mutants or scrabbling monstermans like to burst from the underbrush. The newly-added fog weather condition is also such a micron-perfect fit for STALKER 2’s brand of tense wandering that I had to double-check it wasn’t already in the game from day one.</p>\n\n<p>Gosh, look at me, earnestly bigging up fog. Let’s temper that patch excitement with some moaning. First, I know binoculars have been such an enthusiastical fan-demanded item addition that GSC’s most recent April Fool’s joke was a <a href=\"https://youtu.be/KWl1itEoJNM?si=MhptxSTSeSDK8VLt\" target=\"_blank\" rel=\"noopener\">five minute reel</a> of pure leather-and-lens pornography, and the ability to identify NPC factions from a distance sounds nice. Yet out in the field, I never felt the urge to use mine. They don’t zoom in much further than a decent scope, which I already have on my gun, which I’m probably already carrying instead of the binocs, on the grounds that I can’t kill an ambushing Bloodsucker with an augmented sense of sight.</p>\n<p>Also, for all of the 2.0 update’s technical triumphs elsewhere, I wouldn’t definitely say it’s an upgrade to stability as well. I’ve still been bitten by bugs, from the harmless (NPCs temporarily standing half a foot off the ground) to the restart-forcing (getting stuck in a sprint, unable to regain stamina), and I’ve still crashed to desktop. Albeit only once, across 20 or so hours of crouch-sniping my way through Cost of Hope.</p><p>Luckily, STALKER 2 has already enjoyed reinforcement from GSC’s aforementioned years-long patch campaign, so even if number 2.0 doesn’t lead it all the way to a glitchless paradise, neither does it drag the game back towards the turbojank of that 2024 launch build. If anything, stability was already at the point where I’d have preferred the dev resources go towards overall performance upgrades, which - oh hey - is exactly what 2.0 brings. Good show.</p>"},{"title":"Jensen Huang says Nvidia achieved AGI, again — not that it matters","source":"The Verge","author":"Robert Hart","url":"https://www.theverge.com/ai-artificial-intelligence/985597/jensen-huang-says-nvidia-achieved-senseless-agi","category":"tech","categoryLabel":"Technology","wordCount":738,"readingTime":4,"content":"<p>On <a href=\"https://www.theverge.com/tech/985387/nvidia-hundred-billion-dollar-quarterly-revenue\" target=\"_blank\" rel=\"noopener\">Nvidia’s earnings call</a> Wednesday, CEO Jensen Huang casually announced the company had “achieved AGI,” one of the tech industry’s ultimate goals some of its biggest players have spent years chasing. Almost immediately, Huang dismissed the coveted milestone as “senseless.”</p><p>He’s right. For the supposed finish line of the AI race, there is no consensus on what artificial general intelligence means, let alone how we’ll know when we’ve actually got there, which makes achieving it equally arbitrary.</p><p>Asked about OpenAI’s pursuit of AGI, Huang said that when it comes to Nvidia, “for many tasks, we could say that we’ve already achieved AGI.” He did not provide a precise definition or benchmark, but added, “I think of all of those milestones and all those, you know, they’re kind of senseless at this point.” He also pointed to AI moving beyond responding to simple prompts to autonomous agents capable of learning new skills and improving themselves “recursively.” What really matters, Huang said, is that AI is “doing productive and useful work” and “generating profitable tokens,” with more compute producing more tokens — and, inevitably, more profit. “This is the exact phase where we’re at. Which is the reason why everybody’s leaning in.”</p><p>“… for many tasks, we could say that we’ve already achieved AGI.”</p><p>This isn’t the first time Huang has said we’ve reached AGI. In March, <a href=\"https://www.theverge.com/ai-artificial-intelligence/899086/jensen-huang-nvidia-agi\" target=\"_blank\" rel=\"noopener\">during an appearance</a> on the Lex Fridman podcast, he plainly stated, “I think we’ve achieved AGI.” Huang didn’t say exactly what he meant by AGI. Fridman proposed his own oddly specific definition: an AI system that’s able to “essentially do your job,” as in start, grow, and run a successful tech company worth more than $1 billion. Walking back his earlier claims, Huang said that “the odds of 100,000 of those agents building Nvidia is zero percent.”</p><p>Over the years, other tech leaders have capitalized on the term’s fuzziness and produced a veritable grab bag of definitions and benchmarks, all orbiting the same nebulous concept: AI capable of matching or surpassing human intelligence across a broad range of domains, despite the fact that <a href=\"https://www.theverge.com/ai-artificial-intelligence/827820/large-language-models-ai-intelligence-neuroscience-problems\" target=\"_blank\" rel=\"noopener\">“intelligence”</a> also doesn’t have a universally agreed-upon definition.</p><p>There is no consensus on what artificial general intelligence means, let alone how we’ll know when we’ve actually got there, which makes achieving it equally arbitrary. </p><p>The definition of AGI according to OpenAI – a company founded with the <a href=\"https://openai.com/about/\" target=\"_blank\" rel=\"noopener\">explicit goal</a> of building it – leaves a lot of room for interpretation. In its <a href=\"https://openai.com/charter/\" target=\"_blank\" rel=\"noopener\">charter</a>, OpenAI defines AGI as “highly autonomous systems that outperform humans at most economically valuable work.” Altman himself has <a href=\"https://www.cnbc.com/2025/08/11/sam-altman-says-agi-is-a-pointless-term-experts-agree.html\" target=\"_blank\" rel=\"noopener\">acknowledged</a> that this is hardly a measurable standard, admitting last year that AGI is “not a super useful term.” Complicating matters is OpenAI’s different, financially-driven definition of AGI it worked out with Microsoft — <a href=\"http://theinformation.com/articles/microsoft-and-openai-wrangle-over-terms-of-their-blockbuster-partnership?rc=dp0mql\" target=\"_blank\" rel=\"noopener\">reportedly</a> systems that can generate at least $100 billion in profits. In a recent <em>Time</em> <a href=\"https://time.com/article/2026/08/26/openai-sam-altman-interview/\" target=\"_blank\" rel=\"noopener\">story</a>, chief research officer Mark Chen estimated OpenAI is “80% of the way” to AGI, while Altman said that by the end of the year the company would have something <em>he</em> would call AGI.</p><p>The fact that both AGI and its threshold remain undefined is no secret: tech leaders say so themselves, even as they make predictions predicated on it. Anthropic CEO Dario Amodei has <a href=\"https://darioamodei.com/essay/machines-of-loving-grace\" target=\"_blank\" rel=\"noopener\">called</a> AGI “imprecise,” even a “<a href=\"https://www.businessinsider.com/anthropic-ceo-calls-agi-marketing-term-2025-1\" target=\"_blank\" rel=\"noopener\">marketing term</a>,” preferring instead to talk about “powerful AI.” Others have similarly reached for their <a href=\"https://www.theverge.com/ai-artificial-intelligence/845890/ai-companies-rebrand-agi-artificial-general-intelligence\" target=\"_blank\" rel=\"noopener\">own terms</a> to describe broadly similar ideas. In theory, there are supposed to be distinctions between them, but in practice they all bleed together. Meta talks about “personal superintelligence,” Microsoft “humanist superintelligence,” and Amazon “useful general intelligence.” Google DeepMind’s Demis Hassabis has <a href=\"https://www.theverge.com/podcast/979370/google-deepmind-ai-race-lose-jeff-dean-demis-hassabis\" target=\"_blank\" rel=\"noopener\">taken to talking about how we’ve arrived at the “foothills of the singularity.”</a> And OpenAI cofounder Ilya Sutskever, who <a href=\"https://www.theatlantic.com/technology/archive/2023/11/sam-altman-open-ai-chatgpt-chaos/676050/\" target=\"_blank\" rel=\"noopener\">reportedly</a> led employees in chants of “feel the AGI,” now runs a company called Safe Superintelligence.</p><p>New terminology hasn’t made the meaning more tangible.</p><p>New terminology hasn’t made the meaning more tangible. So long as AGI remains poorly defined and carelessly used, the whole thing is senseless. Well, unless you want a handy tool for hyping up progress. So expect the industry — Huang included — to keep the AGI talk coming. Maybe an AGI will eventually show up and tell us what AGI actually means.</p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Robert Hart</li></ul>"}];
