*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Wolfenstein 3 and new id Software game confirmed, as Xbox boss somehow unrelatedly shouts about one person soon wielding \"capabilities that once required entire nations\"","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/wolfenstein-3-and-new-id-software-game-confirmed-as-xbox-boss-somehow-unrelatedly-shouts-about-one-person-soon-wieldling-capabilities-that-once-required-entire-nations","category":"gaming","categoryLabel":"Gaming","wordCount":589,"readingTime":3,"content":"<p>Asha Sharma had a normal one as Xbox turned 25</p>\n    \n  \n  \n  \n\n            <p>Xbox have confirmed that Wolfenstein 3 is <a href=\"https://www.rockpapershotgun.com/wolfenstein-3-is-reportedly-in-the-works-at-machine-games-possibly-alongside-a-rainbow-six-siege-ish-multiplayer-thing\" target=\"_blank\" rel=\"noopener\">indeed in production</a> at <a href=\"https://www.rockpapershotgun.com/games/indiana-jones-and-the-great-circle\" target=\"_blank\" rel=\"noopener\">Indiana Jones and the Great Circle</a> devs MachineGames and that <a href=\"https://www.rockpapershotgun.com/games/doom-the-dark-ages\" target=\"_blank\" rel=\"noopener\">Doom</a> makers id Software have started work on their next game after <a href=\"https://www.rockpapershotgun.com/doom-devs-id-software-were-reportedly-kicking-around-ideas-for-a-new-perfect-dark-a-john-wick-inspired-game-and-multiplayer-demonslaying-prior-to-layoffs\" target=\"_blank\" rel=\"noopener\">losing a bunch of staff</a> to the <a href=\"https://www.rockpapershotgun.com/xbox-are-parting-ways-with-double-fine-arkane-undead-labs-compulsion-and-ninja-theory-in-the-course-of-thousands-of-layoffs\" target=\"_blank\" rel=\"noopener\">mass layoffs</a><a href=\"https://www.rockpapershotgun.com/\" target=\"_blank\" rel=\"noopener\"></a> across Microsoft's gaming division this year.</p>\n<p>\"A single person will soon be able to wield capabilities that once required entire nations,\" isn't part of the marketing spiel for either of those games. Instead, it's something Xbox CEO Asha Shama has bellowed amid a rant outlining how she sees the company's future.</p>\n<p>The Wolfenstein and id confirmations came as Xbox had a bit of a social media party to commemorate their 25th birthday. Sharma, ever keen to be seen right next to any positive news coming out of the company, confirmed Wolfenstein 3 is in production by <a href=\"https://x.com/asha_shar/status/2121030203439010175\" target=\"_blank\" rel=\"noopener\">posting a photo</a> showing a few lines from its script. Around the same time, she shouted out Doom: The Dark Ages Revelations' incoming Slaughter Mode, adding that \"the team is already working on its next game\".</p>\n<p>The official id Software account responded to note that this next game is being made by their \"teams in Texas and Frankfurt, with game direction once again by Hugo Martin\", and that \"it'll be some time before [they're] ready to share more\".</p>\n<blockquote><p>We're incredibly excited about our next project, a new game from our teams in Texas and Frankfurt, with game direction once again by Hugo Martin. It'll be some time before we're ready to share more but we can't wait for you to see what we're working on.</p>— id Software (@idSoftware) <a href=\"https://x.com/idSoftware/status/2120970306227495319?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">November 12, 2026</a></blockquote>\n\n<p>Alongside hollering about these couple of games, Sharma put out a <a href=\"https://x.com/asha_shar/status/2120898282465693833\" target=\"_blank\" rel=\"noopener\">25th anniversary statement</a> which for the most part does the sort of bigging up of Xbox's past you'd expect. Good times were had, we blazed a trail and made lots of money, etcetera. The final section saw the exec attempt to look forward to the next 25 years for Xbox.</p>\n<p>\"While modern games demonstrate the heights of human craft in ways unimaginable just decades ago, the cost, resources, and risk required to create them have grown just as dramatically,\" she wrote. \"As a result, too many ideas never become games, and too many games fall short of what their creators imagined. For decades, this has been the unavoidable tradeoff of ambition. We must change this.</p>\n<p>\"Throughout human history, the scale of what we could create was determined by the people, capital, and resources we could command. That relationship is beginning to break. A single person will soon be able to wield capabilities that once required entire nations. A small team will be able to build worlds that today demand hundreds of developers and hundreds of millions of dollars. And our largest studios will be able to pursue ambitions as far beyond today's games as <a href=\"https://www.rockpapershotgun.com/games/microsoft-flight-simulator-2024\" target=\"_blank\" rel=\"noopener\">Microsoft Flight Simulator 2024</a> is from its first entry in 1982.\"</p>\n<p>That certainly sounds a lot like the sales pitch the biggest proponents of generative AI keep wheeling out, while avoiding saying generative AI out loud in the hopes of making it more palatable to folks who might not make the connection. I'm waiting for Sharma to put out another post revealing that she accidentally mixed another section of the Wolfenstein script into her celebratory musings, but I'm not holding my breath.</p>\n<p>Xbox parent company Microsoft are still currently subject to a <a href=\"https://www.rockpapershotgun.com/bds-calls-for-boycott-of-microsoft-and-xbox-gaming-products-over-alleged-israeli-military-connections\" target=\"_blank\" rel=\"noopener\">BDS movement boycott</a> over their <a href=\"https://www.rockpapershotgun.com/microsoft-workers-accuse-company-of-trying-to-get-customers-addicted-to-ai-while-forcing-it-on-their-own-staff-and-making-them-party-to-human-rights-violations\" target=\"_blank\" rel=\"noopener\">reported ties to the Israeli military</a>.</p>"},{"title":"Sam Altman on Nvidia without Jensen Huang: The industry will be ‘fine’","source":"TechCrunch","author":"Rebecca Bellan","url":"https://techcrunch.com/2026/11/16/sam-altman-on-nvidia-without-jensen-huang-the-industry-will-be-fine/","category":"tech","categoryLabel":"Technology","wordCount":523,"readingTime":3,"content":"<p>OpenAI CEO Sam Altman says the AI industry will be “fine” without Nvidia CEO Jensen Huang at the helm, even as he acknowledged the special role Huang has played in the AI boom.</p>\n<p><a href=\"https://techcrunch.com/2026/11/12/nvidias-jensen-huang-resigns-chipmaker-names-cfo-colette-kress-as-interim-ceo/\" target=\"_blank\" rel=\"noopener\">Huang resigned</a> last week from Nvidia after admitting to having an affair with an alleged Chinese spy.</p>\n<p>Altman made his first public comments about Huang’s departure on Monday at <a href=\"https://www.semafor.com/hub/semafor-silicon-valley-and-the-world-2026\" target=\"_blank\" rel=\"noopener\">Semafor’s Silicon Valley &amp; The World </a>event, where he also discussed topics ranging from data center pushback to recursive self-improvement.</p>\n<p>Numerous executives and members of the AI industry have argued for Nvidia to reinstate Huang, including Elon Musk and Epic Games chief executive Tim Sweeney, who were among the signatories in a <a href=\"https://standwithjensen.com/#supporters\" target=\"_blank\" rel=\"noopener\">public letter.</a> Many fear that Huang’s departure may cause Nvidia to rethink the enormous financial risks it has taken that have fueled the AI boom. </p>\n<p>Huang is also reportedly setting up a <a href=\"https://www.ft.com/content/45383d86-33c4-4d99-86e5-5e058d3567c1?syn-25a6b1a6=1\" target=\"_blank\" rel=\"noopener\">“war room”</a> of Silicon Valley executives to lobby for his return. </p>\n<p>When asked whether he thought Huang should return to the company, Altman said: “I don’t think I know enough to answer that question.”</p>\n<p>He expressed empathy for Huang’s situation, citing his own <a href=\"https://techcrunch.com/2023/11/17/sam-altman-is-out-as-openais-ceo/\" target=\"_blank\" rel=\"noopener\">ousting from OpenAI</a> in 2023 after board members accused him of withholding information. </p>\n<p>“It’s hard to imagine the AI revolution without Jensen and the company he has built,” Altman said, adding that he sees Huang as a hero, and that “heroes have flaws.”</p>\n<p>OpenAI and Nvidia have had a close relationship for the last decade, one that has evolved from a simple chip supplier-customer relationship into a potentially circular financing arrangement, in which Nvidia’s money helps fund purchases of its own chips. Most recently, Nvidia agreed to provide a guarantee of up to $105 billion backing OpenAI’s Ohio data center project. That’s just one of many such circular deals Nvidia has made to bankroll the AI boom while fueling demand for its own chips.</p>\n<p>Altman said he’s not worried that the Bank of Nvidia will dry up.  </p>\n<p>“Nvidia is, like, a behemoth of a company,” he said. “I think people still trust their guarantees very much.”</p>\n<p>Altman acknowledged the “ambition” Huang brought to the industry, the scale of which “has been quite important.” But he didn’t go so far as to agree with the many who worry about ripple effects from Huang’s departure.</p>\n<p>“I think there’s so much demand, and it’s so clear that AI is real, and people want to use it, and the revenues and demand are growing so strongly that I think the industry will be fine,” Altman said. “But again, I think Jensen has played this extremely special and valuable role as someone to really drive things forward with great ambition.”</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Rebecca Bellan is a senior reporter at TechCrunch where she covers the business, policy, and emerging trends shaping artificial intelligence. Her work has also appeared in Forbes, Bloomberg, The Atlantic, The Daily Beast, and other publications. </p>\r\n<p>You can contact or verify outreach from Rebecca by emailing <a href=\"https://techcrunch.com/cdn-cgi/l/email-protection#3c4e595e595f5f5d125e5950505d527c48595f545f4e49525f54125f5351\" target=\"_blank\" rel=\"noopener\">[email protected]</a> or via encrypted message at rebeccabellan.491 on Signal.</p>\t\n<p>\n\t<a href=\"https://techcrunch.com/author/rebecca-bellan/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n</p>"},{"title":"Tribal property and the Supreme Court","source":"SCOTUSblog","author":"Matthew L.M. Fletcher","url":"https://www.scotusblog.com/2026/11/tribal-property-and-the-supreme-court/","category":"law","categoryLabel":"Law","wordCount":1089,"readingTime":6,"content":"<p>One of the fundamental questions in federal law is the exact parameters of Indigenous property rights. From the first Supreme Court decisions in Indian affairs (such as <a href=\"https://supreme.justia.com/cases/federal/us/21/543/\" target=\"_blank\" rel=\"noopener\"><em>Johnson v. McIntosh</em></a> and <a href=\"https://supreme.justia.com/cases/federal/us/187/553/\" target=\"_blank\" rel=\"noopener\"><em>Lone Wolf v. Hitchcock</em>)</a>, Indigenous property has been treated in a <em>sui generis </em>manner that is often to the detriment of Indigenous Peoples. Bryan Newland, assistant secretary for Indian Affairs in the Biden administration, recently delivered a <a href=\"https://youtu.be/WKOf8brXsaA?si=O_4IhWIGmQ51b-am\" target=\"_blank\" rel=\"noopener\">major address</a> in which he explained that the legacy of cases decided in the “<a href=\"https://turtletalk.blog/2025/11/10/justices-gorsuch-and-thomas-signal-interest-in-overruling-kagama-commentary/\" target=\"_blank\" rel=\"noopener\">atmosphere</a>” of colonization remain impactful in 21st century litigation.</p><p>Before the court is a petition to review the U.S. Court of Appeals for the 8th Circuit’s decision in <a href=\"https://turtletalk.blog/2021/09/14/eighth-circuit-decides-chase-v-andeavor-logistics-l-p/\" target=\"_blank\" rel=\"noopener\"><em>Chase v. Andeavor Logistics LP</em></a> (now captioned <a href=\"https://turtletalk.blog/2026/09/25/aubol-v-andeavor-logistics-lp-cert-petition-allotment-trespass/\" target=\"_blank\" rel=\"noopener\"><em>Aubol v. Andeavor Logistics LP</em></a>), a trespass action by tribal citizen allotment owners against a pipeline company. Allotments are land parcels carved out of Indian reservations in the late 19th and early 20th centuries. The federal right-of-way allowing a pipeline in these Indigenous lands expired in 2013. The Mandan, Hidatsa, and Arikara Nation has agreed to extend the right-of-way for its lands, but individual tribal citizens have not consented to the extension on their lands.</p><p>Though the pipeline company is seemingly liable for trespass, the circuit court remanded the issue to the Bureau of Indian Affairs to address the issue in the first instance, pointing to federal regulations that govern the expiration of Indian country rights-of-way. The cert petition argues that the 8th Circuit’s decision conflicts with the Supreme Court’s decision in <a href=\"https://supreme.justia.com/cases/federal/us/470/226/\" target=\"_blank\" rel=\"noopener\"><em>Oneida County v. Oneida Indian Nation</em></a>, which held that there is a federal common law cause of action allowing Indigenous property owners to bring trespass actions in federal court.</p><p>The <em>Andeavor</em> case has been accompanied in recent years by a slate of lower court decisions similarly diminishing Indigenous property rights. In <a href=\"https://turtletalk.blog/2019/01/11/tenth-circuit-decides-davilla-v-enable-midstream-partners/\" target=\"_blank\" rel=\"noopener\"><em>Davilla v. Enable Midstream Partners</em></a>, the U.S. Court of Appeals for the 10th Circuit held that a pipeline trespasser on Indigenous property would not be ordered to remove the pipeline until the federal district court decided it was, among other things, in the “public interest” to do so. Under federal law, federal courts may not order injunctive relief unless such relief is in the public interest. The 10th Circuit’s decision imposed a public interest standard on Indigenous property when, arguably, it would not have done so in relation to private property.</p><p>Similarly, a judge on the U.S. District Court for the Western District of Wisconsin held in <a href=\"https://turtletalk.blog/2026/03/03/trespass-on-tribal-lands-by-pipeline-companies-remains-legal-in-wisconsin/\" target=\"_blank\" rel=\"noopener\"><em>Bad River Band of Lake Superior Ojibwe Indians v. Enbridge Inc.</em></a> that the tribe was not entitled to the immediate removal of a trespassing pipeline because the public interest favored its continued operation. Fortunately, the U.S. Court of Appeals for the 7th Circuit <a href=\"https://turtletalk.blog/2026/07/31/seventh-circuit-rules-enbridge-must-move-line-5-from-bad-river-reservation/\" target=\"_blank\" rel=\"noopener\">reversed that decision</a>. Other federal courts have also ordered immediate eviction of trespassers to Indigenous lands (e.g., <a href=\"https://turtletalk.blog/2021/01/12/federal-court-rejects-osage-wind-companys-equitable-defenses-re-osage-mineral-council/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Osage Wind</em></a>), but the judiciary tends to invoke the public interest when favoring pipeline or other petroleum industry companies.</p><p>Newland argues that some judges may be channeling a long tradition where the federal government assumed that Indigenous property is public property: Most pipelines running through Indigenous lands now originated in an earlier era where the federal government assumed a kind of guardianship over tribal nations, where the Interior Department granted easements and rights-of-way over Indigenous lands without tribal consent. For example, the Supreme Court once held that the secretary of the Interior was empowered to issue leases to natural resources extraction companies even over tribal opposition (<a href=\"https://supreme.justia.com/cases/federal/us/187/294/\" target=\"_blank\" rel=\"noopener\"><em>Cherokee Nation v. Hitchcock</em></a>).</p><p>The tradition of guardianship arose in early Supreme Court decisions comparing the federal-tribal relationship to a “guardian-ward” relationship (<a href=\"https://supreme.justia.com/cases/federal/us/30/1/\" target=\"_blank\" rel=\"noopener\"><em>Cherokee Nation v. Georgia</em></a>). Congress did not enact laws generally asserting actual guardianship over tribal nations; instead, the relationship was more accurately characterized as a trust relationship, with federal government owning and managing tribal and individual Indian asserts in trust.</p><p>A trust beneficiary has legal rights that a ward does not. A ward does not possess the legal capacity to make their own decisions, while tribal nations and tribal citizens do. When federal or state actors did assert guardianship over Indigenous assets, tragedy often followed, as evidenced in <a href=\"http://michiganlawreview.org/wp-content/uploads/2019/04/117MichLRev1253_Fletcher.pdf\" target=\"_blank\" rel=\"noopener\">the early 20th century killings of Osage people</a> fictionalized in the film “Killers of the Flower Moon” or in the flooding of several Indian reservations in the mid-20th century by <a href=\"https://supreme.justia.com/cases/federal/us/362/99/\" target=\"_blank\" rel=\"noopener\">federal hydroelectric dam projects</a>. </p><p>Often, when tribal nations attempted to assert their own legal rights, the judiciary allowed the federal government to block those efforts. Justice Neil Gorsuch recently raised this issue in his dissent in <a href=\"https://www.scotusblog.com/cases/arizona-v-navajo-nation/\" target=\"_blank\" rel=\"noopener\"><em>Arizona v. Navajo Nation</em></a>, where he pointed out that, decades ago, the federal government blocked the Navajo Nation from asserting their water rights, which remain unsettled to this day. In those older cases, the fact that the federal government could stand in the shoes of Indigenous interests suggested that Indigenous property was therefore, in effect, public property.</p><p>The Department of Justice’s litigation positions also frequently hearken back to expansive federal controls over Indigenous property. While the Supreme Court has explicitly overturned the earlier cases analogizing the federal-tribal relationship as a guardianship in cases such as <a href=\"https://supreme.justia.com/cases/federal/us/448/371/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Sioux Nation</em></a>, DOJ attorneys are known to continue to assert guardianship-type control over Indigenous property. <a href=\"https://repository.law.umich.edu/mjeal/vol6/iss2/2/\" target=\"_blank\" rel=\"noopener\">Indeed, federal judges have sanctioned them</a> for making such claims post-<em>Sioux Nation</em>.</p><p>This legacy of guardianship once again has raised its head. D.C. Circuit briefing has concluded in a claim brought by the Tohono O’Odham Nation against the Department of Homeland Security regarding the administration’s plan to build a border wall on the tribe’s land. <a href=\"https://turtletalk.blog/wp-content/uploads/2026/09/opening-brief-1.pdf\" target=\"_blank\" rel=\"noopener\">The tribe argues</a> that the federal common law cause of action recognized in <em>Oneida </em>undergirds the suit. In response, <a href=\"https://turtletalk.blog/wp-content/uploads/2026/11/federal-answer.pdf\" target=\"_blank\" rel=\"noopener\">the DOJ now asserts</a> that tribal nations may not sue the United States for trespass on hands held in trust by the federal government for the benefit of a tribal nation. This claim rings again of guardianship, where a ward normally does not have the legal capacity to sue their guardian.</p><p>The import of the government’s claim in the border wall case, like the trespass action in <em>Andeavor</em>, has enormous consequences for Indian country: If the government can confiscate Indigenous property held in trust by the United States, then the judiciary will have allowed the federal government to reassume a guardianship-type relationship regardless of tribal consent or the federal government’s trust duties.</p><p><strong>Recommended Citation: </strong>Matthew L.M. Fletcher, <em>Tribal property and the Supreme Court</em>, SCOTUSblog (Nov. 13, 2026, 9:30 AM), https://www.scotusblog.com/2026/11/tribal-property-and-the-supreme-court/</p>"},{"title":"The Pollycrisis","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/11/05/the-parakeets-london-invasive-species/","category":"fun","categoryLabel":"Interesting Reads","wordCount":571,"readingTime":3,"content":"<p>London’s feral parakeets are an invasive species—but they are also beautiful, and David Wingrave takes the chance to linger on their nightly roost at Hither Green Cemetery before asking whether they should be here at all. As calls for culls grow—backed by fears of crop damage, disease, and pressure on native wildlife—he probes what we really know about the harm these birds cause. Along the way, he asks deeper questions: how we decide where an animal “belongs,” when (if ever) it becomes native, and why we are so uneasy about seeing bright green birds in London’s parks.</p>\n<blockquote>\n<p>The fix O’Gorman endorses may sound drastic, but his precautionary principle is shared by invasion biology, the subdiscipline devoted to the study of species transplanted from their native ranges. There is a long history of organisms moved by humans, whether deliberately or inadvertently, wreaking total havoc upon their new homes. The brown tree snake, native to Indonesia, northern Australia, and Papua New Guinea, was accidentally introduced to Guam by the US military following World War II and promptly ate its way through ten of the island’s twelve endemic forest bird species. Similarly, Nile perch released into Lake Victoria by British colonial forces gulped down roughly <em>two hundred</em> species of homegrown cichlids, fish found nowhere else on Earth. Cane toads in Australia, Miconia trees on Hawaii and Tahiti, rats just about everywhere—the list goes on. And if biodiversity loss, however regrettable, seems like an abstraction in the scheme of things, know that human culture frequently suffers direct impoverishments because of invasives. Chestnut blight, discovered in the United States in 1904 after chestnut trees were imported from Japan, effectively deleted the American chestnut tree from the continent; its products were central to the diet and lifestyles of various indigenous peoples and communities across Appalachia. Phylloxera, an aphid relative, was imported to Europe on American grapevines during the second half of the nineteenth century. The subsequent infestation resulted in the destruction, by some estimates, of 90 percent of all European vineyards.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on birds\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/09/22/migration-shorebird-flight/\" target=\"_blank\" rel=\"noopener\">The Incredible Journey of a Migratory Shorebird</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tRivka Galchen | The New Yorker | September 14, 2027 | 5,727 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“Godwits make the longest non-stop migration in the bird world. That might be the least of their marvels. Can they survive a changing planet?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/13/birds-guernica-magazine/\" target=\"_blank\" rel=\"noopener\">On Loving Birds</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tKulsoom Ijaz | Guernica | June 15, 2026 | 2,382 words \n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A couple of years afte
