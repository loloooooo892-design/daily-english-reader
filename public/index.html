<script>
var articles = [{"title":"All Happy Mask Shop buyer locations in Zelda Ocarina of Time","source":"Polygon","author":"@FionnTheBrave","url":"https://www.polygon.com/zelda-ocarina-of-time-happy-mask-shop-spooky-skull-bunny-hood/","category":"gaming","categoryLabel":"Gaming","wordCount":985,"readingTime":5,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/josh-broadwell/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Nov 6, 2026, 5:38 PM EST\n                                </p>\n                    \n                                                            \n                                                                        <p>Including who gets the Skull Mask, the Spooky Mask, and the Bunny Hood</p>\n    \n        \n    \n                                                     <p><strong><em><a href=\"https://www.polygon.com/the-legend-of-zelda-ocarina-of-time-remake/\" target=\"_blank\" rel=\"noopener\">The Legend of Zelda: Ocarina of Time</a></em> remake's Happy Mask Shop quest</strong> sends you around Hyrule peddling masks to specific customers. That sounds like a cushy gig, except you have very little guidance about who your customers are, and you occasionally even have to pay back the cost of the mask, too. However, if you want a big chunk of cash and a chance to see and hear everything in <em>Ocarina of Time</em>, it's worth the hassle.</p>    \n<p>Below, we walk you through each step of the<strong> <em>Ocarina of Time</em> remake's Happy Mask Shop quest</strong> and explain what you get for your trouble.</p>    <h2>\n                        How to start the Happy Mask Shop quest in Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p> Visit the Happy Mask Shop in Hyrule Castle Town as Young Link at any point during the adventure after you've <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-hyrule-castle-how-to-get-inside/\" target=\"_blank\" rel=\"noopener\">met Princess Zelda</a> and given her letter to the Death Mountain gatekeeper. The shop is in Castle Town square, and it's <strong>only open during the <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-change-time-day-night-how-to/\" target=\"_blank\" rel=\"noopener\">daytime</a></strong>.</p>    <p>Speak with the salesman to get started. He'll offer you a gig selling masks, and the first one is the <strong>Keaton Mask</strong>. He tells you the going cost is 10 rupees, which means that's how much you have to pay <em>him</em> after selling the mask, and then sends you off. This pattern repeats for the rest of the quest. After delivering a mask, you must pay the salesman the going cost to get the next one. Your customers won't always pay the going cost, either, so you'll frequently have to foot the bill yourself.</p>    <h2>\n                        Keaton Mask buyer location in Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p> Depending on how many people you talk to, you might have an idea about this one already. After you chat with the<strong> Death Mountain gatekeeper</strong> about the Hylian Shield, he'll mention a trendy mask that his child wants and not-so-subtly ask you to get it for him if you can. That's the Keaton Mask. Return to the gatekeeper, equip the mask from the equipment menu, and speak to him. He'll offer to buy the mask for 15 rupees.</p>    <p>Hand it over, return to the salesman, and pay the 10-rupee fee. Next, you get the Skull Mask, which has a going rate of 20 rupees.</p>    <h2>\n                        Skull Mask buyer location in Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p> The Skull Mask is for the <strong>Skull Kid</strong>, a child who hangs out in the <strong>Lost Woods</strong> and resembles a Deku Scrub. Enter the Lost Woods from Kokiri Forest, and immediately turn left. You'll walk into the Skull Kid's clearing. Equip the Skull Mask, stand on the small stump, target him with ZL, and he'll demand the mask. He gives you 10 rupees for it, so you'll have to scrape together the other 10 for the salesman's fee yourself.</p>    <p>Head back to the Happy Mask Shop, fork over the fee, and choose the Spooky Mask next. This one has a going rate of 30 rupees.</p>    <h2>\n                        Spooky Mask buyer location in Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p> \"Are spooky things popular?\" Navi asks after you get the mask, and the answer is yes, but only for one person whom you haven't even had a reason to meet yet. It's the <strong>kid who hangs out in Kakariko Village's graveyard</strong> during the day. He wanders around the graveyard, but if you're there shortly after sunrise, you can catch him right at the entrance.</p>    <p>Anyway, the little guy is a big fan of Dampe the gravekeeper, and since he wants to be just like him, he's willing to buy your Spooky Mask. The kid pays a hefty 50-rupee price, so you don't have to give the salesman your own money this time. You even get 20 rupees for yourself!</p>    <p>Head back to the shop, and get the Bunny Hood. It's an expensive mask (well, hood) and costs 50 rupees.</p>    <h2>\n                        Bunny Hood buyer location in Ocarina of Time\n               </h2>\n    \n                                                                                            \n        \n<p> Selling the Bunny Hood is a little more complex. <strong>The postman</strong> is your customer, but he won't start appearing until after you obtain all three Spiritual Stones, which means completing <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-dodongo-cavern-walkthrough/\" target=\"_blank\" rel=\"noopener\">Dodogno's Cavern</a> and <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-lord-jabu-belly-dungeon-walkthrough/\" target=\"_blank\" rel=\"noopener\">Jabu-Jabu's Belly</a>. After that, <strong>he'll run quickly around Hyrule Field in a broad oval that loops around Lon-Lon Ranch</strong>. Equip the hood, catch up to him, and he'll offer a gold rupee for it. That's 200 rupees, so you're making a 150-rupee profit off this sale.</p>    \n<p>Return to the Happy Mask Shop to pay the fee. This time, you'll have several masks to choose from, though no customers. You can get:</p>        <ul>\n                    <li>\n                                        Goron Mask\n                        </li>\n                    <li>\n                                        Zora Mask\n                        </li>\n                    <li>\n                                        Gerudo Mask\n                        </li>\n                    <li>\n                                        Mask of Truth\n                        </li>\n            </ul>\n<p>Wearing any of the first three will lead to a few unique dialogue lines when you speak to people while wearing them, but <strong>they aren't tied to any secrets or quests</strong>. The Mask of Truth is the real catch, though. Wearing it lets you <strong>get messages from Gossip Stones, listen in to NPC thoughts, and hear the thoughts of animals</strong>, like that cow in a hole on Death Mountain. You don't <em>need</em> the mask to get milk from the cow, but at least it gives the poor beast someone to talk to. Some of the things that NPCs are thinking are pretty interesting, too.</p>    <p><a href=\"https://www.polygon.com/zelda-ocarina-of-time-oot-guides-walkthroughs/\" target=\"_blank\" rel=\"noopener\"><em>The Legend of Zelda: Ocarina of Time</em></a><em> </em>remake is a little bit different than the original game, so if you need guides to help you through, we don’t blame you. We have walkthroughs for all the dungeons, from the<em> </em><a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-great-deku-tree-walkthrough-fairy-slingshot/\" target=\"_blank\" rel=\"noopener\">Deku Tree</a> to <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-ganondorfs-castle-walkthrough/\" target=\"_blank\" rel=\"noopener\">Ganondorf's Castle</a>. We also have guides for the sillier, in-between parts of the game, like when you have to find <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-richard-dog-location-how-to-find/\" target=\"_blank\" rel=\"noopener\">Richard (the dog)</a> or <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-kakariko-cucco-chicken-locations/\" target=\"_blank\" rel=\"noopener\">Cuccos</a>.</p>    <p>For those going for 100% completion, we also have guides on where to find <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-piece-heart-container-location/\" target=\"_blank\" rel=\"noopener\">every Piece of Heart</a>, <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-gold-skulltula-token-locations-where-to-find/\" target=\"_blank\" rel=\"noopener\">every Gold Skulltula token</a>, and <a href=\"https://www.polygon.com/zelda-ocarina-of-time-remake-oot-soft-soil-fresh-magic-bean-location/\" target=\"_blank\" rel=\"noopener\">where to plant every Magic Bean</a>.</p>"},{"title":"In “The Heart” and “I Became We,” the Rise of the Hive-Mind Musical","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/16/the-heart-theatre-review-broadway-i-became-we","category":"fun","categoryLabel":"Interesting Reads","wordCount":1360,"readingTime":7,"content":"<p>The first image in the poignant, propulsive new E.D.M.-pop musical “The Heart,” at the Roundabout’s Laura Pels Theatre, is of a young surfer, Simon (Nick T. Daly), swaying in solitary bliss, like the only dancer left at a club. Behind him, a neon line pulses—it’s an ocean swell, an electrocardiogram, a musical beat. Just nineteen, Simon has slipped out early to catch a predawn wave, but on the drive home he’ll be critically injured in a crash.</p><p>And, in a flash, Simon is no longer the show’s protagonist—instead, his heart is. As bright grids fill up screens that frame the stage, the musical—smartly directed by the Roundabout’s new artistic director, Christopher Ashley, with lighting by Amanda Zieve, immersive video design by Lucy Mackinnon, and subtly gliding choreography by Mandy Moore (the auteur behind Taylor Swift’s Eras Tour)—becomes a thrilling, thrumming twenty-four-hour countdown to an organ transplant, tracing the path from one person’s tragedy to another’s miracle. We meet Simon’s powerhouse mother, Marianne (a moving Joaquina Kalukango, belting in denial by her son’s bedside); her prickly ex-husband, Sean (Jason Tam); Simon’s girlfriend, a d.j. named Juliette (Max McKenna); and also the medical team, including a warm, no-filter nurse (a fab Bre Jackson) and a cocksure surgeon (Drew Gehling, who, after playing doctors in “Waitress” and “Little Shop of Horrors,” may qualify for a medical degree). Later, we meet the recipient of Simon’s heart, portrayed with rueful glamour by Heidi Blickenstaff. These characters are distinct individuals, but there’s a fungibility to the whole enterprise: we meet each of them briefly but intensely, in passing, the way you do in a hospital. The cast juggles minor roles, so a patient might reappear as a doctor; Simon’s surfboard becomes an operating table.</p><p>The central concept, adapted by Kait Kerrigan from a poetic French novel, could easily go gooey or gimmicky, like a musical episode of “Grey’s Anatomy.” At first, there’s an almost bludgeoning pathos to what we witness, as Marianne resists the news that her son—brain-dead, but still with a beating heart—is gone. But, just as her grief becomes unbearable, a jarring image intervenes. At center stage, a fey stranger appears, warbling in a high operatic voice, with bright-blue gel patches under his eyes and a white towel wrapped around his head, diva style. Only after his phone rings do we learn who this person is: Thomas (Lincoln Klauss), the hospital professional assigned to persuade Marianne and Sean to donate Simon’s organs. “They might be divorced?” a colleague tells Thomas, filling him in on the case. “The divorce’ll be fun,” he responds, tartly.</p><p>It’s a tonic splash of detachment before Thomas’s mask of professionalism slides back up. Some of the production’s strongest moments feature this sort of tricky tonal pivot, as when a punkish gamer (a terrific Wren Rivera) is unveiled as the gleeful consultant who selects organ recipients using an algorithm. The show’s lyrics are often literal-minded, with rare outliers, such as a wry joke about Juliette becoming “a side piece to his nine-foot slab of fibreglass.” But did that blunt sincerity deliver emotionally? It sure did. Before long, my eyes stung; my chest got tight. If the critical part of my brain sometimes resisted an obvious turn of phrase—“You are my heartbeat,” say—the rest of my body was all in.</p><p>There was certainly no resisting the score, an audacious suite of electronic anthems and ballads co-written, with some help from Kerrigan, by the married pop-music wizards Anne and Ian Eisendrath, the latter of whom was an executive music producer for the banger-heavy “KPop Demon Hunters.” Broadway musicals have mined everything from rock and pop to hip-hop and folk. But there’s something bracingly logical about injecting the synthetic jolt of electronic dance music into a hospital environment, where vulnerable bodies are sustained by machines. The score has an exhilarating artificiality, from the breakneck “Keep Up,” which is punctuated by the beeps of hospital monitors, to the kinetic “Strike the Match,” in which layers of slick digital uplift thicken like shellac as the consultant homes in on her match. Any rhythm that repeats becomes fodder—the whoosh of the ocean, the boop-boop of video games. It’s an aural vocabulary that evokes both the cold, invisible workings of neural networks and sticky bodies losing themselves at a rave, united by a heartbeat.</p><p>“Was he generous?” is the question that Simon’s parents are forced to answer as they struggle over whether to let the doctors remove their son’s organs. The show itself feels generous, open to feeling as a source of wisdom. As one of the show’s lovelier lines says of surfing—and, implicitly, of nearly everything else in life—“You only get one wave, then you pass it on.” As anyone who has ever been in an emergency room knows, in a crisis some clichés ring true.</p><p>There is a ravenousness in midtown right now, after a frustrating few years, for Broadway to get behind some great new musical. Will “Galileo” break through? Lin-Manuel Miranda’s “The Warriors”? “Wanted”? In late October, a hot contender débuted: the London transfer “The Curious Case of Benjamin Button,” which had a celebrated run there. In New York, some critics found it twee, but I adored this small, oddball fable about a man aging backward. The production actually shared a lot with “The Heart,” even though it was scored with Celtic sea chanteys. It, too, is a countdown show obsessed with mortality, a stylized tale in which actors swap roles. It, too, had a lyrical directness that risked cliché in pursuit of elemental feelings.</p><p>But what felt most notable about “Button” was its structure, which, like “The Heart,” featured an ensemble telling an individual’s story in unison—in this case, down to the thoughts inside Benjamin’s head. Both plays are part of a cadre of hive-mind musicals, along with an earlier Ashley-directed project, “Come from Away” (which, like “Button,” has a Celtic-folk score). These shows are explicitly focussed on communities, not individuals—a hospital in “The Heart,” a fishing village in “Benjamin Button,” a rural Canadian town in “Come from Away.” They’re romances about systems, riffing off the choral storytelling of such classics as “A Chorus Line” and “Sweeney Todd” or the clever identity-flipping of “Operation Mincemeat.”</p><p>There’s another play in town that employs a similar technique, more austerely: the song cycle “I Became We,” written by Mona Pirnot, with soaringly lovely music by Jack D. Coen. At the Linda Gross Theatre, sixteen singers stand on risers, holding green choral folders. There’s a conductor and a piano. It felt like church until we heard the first line, which was sung as solemnly as Handel’s “Messiah”: “I saw a segment on ‘Jimmy Kimmel Live!’ called ‘What Do You Know About the Female Body?’ ”</p><p>What followed was the funny, philosophical narrative of a successful New York playwright in her mid-thirties. She’s got friends to dish with; she adores her mother, a math professor, and her “jumpy and nervous” husband; she is certain that she doesn’t want children. When she goes to a boring party in Brooklyn, a friend passes her a baby, who—as the chorus sings, in joyful, slightly frenzied counterpoint—starts “squirming, squirming!” and “screaming, screaming!” And then there’s a sudden, destabilizing shift in tone: a solo soprano begins singing mournfully, “She’s so small / She’s so small.”</p><p>It seems, at first, that this will be a story about fertility—or infertility. But the narrative never goes quite where we expect, its idiosyncratic turns intensified by the singers’ communal delivery, like a catechism or a shared consciousness. Nobody “plays” the narrator; nobody acts out her behavior. They just sing her thoughts, without comment.</p><p>Why did this pack such a punch? Maybe it was because of the tension between the elevated harmonies and the down-to-earth words. Maybe it was because the performance framed one person’s inner monologue—<em>It is wonderful to see people love my talented mother! Why am I crying at this Adam Sandler movie?</em>—as a grand, even sacred project. When the payoff arrived, it reduced the audience to sobs as heavy as any I’d heard at “The Heart.” I suspect that we were all thinking about our own lives. It was impossible not to. ♦</p>"},{"title":"Top Altra Running Promo Codes and Deals November 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/altra-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":810,"readingTime":5,"content":"<p>Altra Running is best known for its wide toe box, which lets toes relax and helps prevent blisters, and for its zero-drop platform, meaning your heel and forefoot sit at the same height. While this design may not be the most fashionable, it has earned Altra a devoted following among <a href=\"https://cna.st/affiliate-link/4pDSKR9fHyZqTp39e4j82Z2RHsHpr62Sy9fkuYRiM2ev33tbpuCrPDAWngbqvK6GJfsp47oQhubL2yajN8CVZsg7uGJfLAn9dbHuXQCZ4UsNkbYvF2rKXRgerdkrv74fHbHSSyU4Gi9rncPzE5KDp23pFusyoo6uggFk6ujG258jvjMQdSvPJi2A3Ye1TynhuuqcJfBPMe4EYTBnCiwK8Ufv23xnYxh8Jjy8c1xDkW14tk4yHxkjiaKUCwFHfbfiLKK3PLQ2vGjoW3m3odDCjyMoxHZZzYZhdgcUio3xd2hLyyVqNJRTjuLJq\" target=\"_blank\" rel=\"noopener\">runners</a> and <a href=\"https://www.wired.com/gallery/be with the law and counteract them if not) is under attack.  Combatants include President Donald Trump,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> Administration officials,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> congressional partisans,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> and state lawmakers.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  Judges, including members of the Supreme Court, have entered the fray.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a></p>\n<p>This Symposium, titled “Judicial Review in Jeopardy?,” seeks to make sense — and suggest some ways out — of these circumstances.  To do so, this Introduction proposes, we should see judicial review through the lens of Professors Richard Fallon and Daniel Meltzer’s contention that our constitutional structure “demands a system of constitutional remedies adequate to keep government generally within the bounds of law.”<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  To realize that system, federal courts must remain willing — and recognize their authority — to both check <em>and </em>balance assertions of political power.  By this, I mean that in agenda setting and doctrinal development, courts (including the Supreme Court) ought not rest on the abstract ability of judicial review to respond to some governmental abuses.  Within methodological margins, courts should instead consider the actual extent and efficacy of constitutional remedies to confront a meaningful proportion of constitutional violations — a proportion, that is, capable of producing substantial deterrence across varied and evolving circumstances.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1734.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Adam Liptak, <em>Trump’s Actions Have Created a Constitutional Crisis, Scholars Say</em>, N.Y. Times (Feb. 12, 2025), https://www.nytimes.com/2025/02/10/us/politics/trump-constitutional-crisis.html [https://perma.cc/J3Z4-HDGB]; Sarah Bryner et al., SNF Agora Inst. at Johns Hopkins Univ. &amp; Pub. Agenda, Understanding Evolving Republican Attitudes Towards Democracy 7 (2025), https://snfagora.jhu.edu/wp-content/uploads/2025/11/Understanding-Evolving-Republican-Attitudes-Towards-Democracy.pdf [https://perma.cc/Q8SM-EBGJ].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Liptak, <em>supra</em> note 1 (explaining that “legal scholars agree” that a constitutional crisis “is generally the product of presidential defiance of laws and judicial rulings”); <em>see also</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707, 726 (2009) (stating that President Franklin Delano Roosevelt would “certainly” have “provoke[d] a public constitutional crisis” if he had openly defied the Supreme Court in particular cases).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Mattathias Schwartz &amp; Abbie VanSickle, <em>Judges Fear for Their Safety amid a Wave of Threats</em>, N.Y. Times (Mar. 21, 2025), https://www.nytimes.com/2025/03/19/us/trump-judges-threats.html [https://perma.cc/A2DD-A5Z6].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Donald J. Trump (@realDonaldTrump), Truth Social (May 26, 2025, at 07:22 ET), https://truthsocial.com/@realDonaldTrump/posts/114573871728757682 [https://perma.cc/GF7N-XS4K] (stating that “USA HATING JUDGES WHO SUFFER FROM AN IDEOLOGY THAT IS SICK, AND VERY DANGEROUS FOR OUR COUNTRY” were “ON A MISSION TO KEEP” dangerous criminals “IN OUR COUNTRY SO THEY CAN ROB, MURDER, AND RAPE AGAIN” and imploring the Supreme Court to “SAVE US FROM THE DECISIONS OF THE MONSTERS WHO WANT OUR COUNTRY TO GO TO HELL”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Newsmax, <em>Stephen Miller Highlights the “Judicial Tyranny” Being Used to Impede the Trump Administration</em>, at 00:34 (YouTube, May 23, 2025), https://www.youtube.com/watch?v=EfWB4YMJF3U [https://perma.cc/8WW7-WPZF] (Deputy Chief of Staff for Policy and Homeland Security Advisor Stephen Miller stating that “communist, Marxist judges” are conducting a “judicial coup” “against the laws, Constitution, and democracy of the United States”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Nate Raymond, <em>Republicans Seek Impeachment of 2 More Judges Who Stymied Trump</em>, Reuters (Mar. 24, 2025), https://www.reuters.com/world/us/republicans-seek-impeachment-2-more-judges-who-stymied-trump-2025-03-24 [https://perma.cc/PS97-JPVT].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Kimberly Kindy &amp; Alice Crites, <em>The Texas Abortion Ban Created a “Vigilante” Loophole. Both Parties Are Rushing to Take Advantage.</em>, Wash. Post (Feb. 22, 2022), https://www.washingtonpost.com/politics/2022/02/22/texas-abortion-law-vigilante-loophole-supreme-court [https://perma.cc/JN6B-PM6K] (describing state legislation attempting to shield government officials from constitutional litigation).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Abbie VanSickle, <em>Courts Must “Check the Excesses” of Congress and the President, Roberts Says</em>, N.Y. Times (May 7, 2025), https://www.nytimes.com/2025/05/07/us/politics/supreme-court-roberts-judicial-independence.html [https://perma.cc/WVC4-LRSP] (discussing “rare public remarks” by Chief Justice Roberts and noting Justice Jackson’s “critici[sm of] what she called ‘relentless attacks’ on judges” (quoting Justice Jackson)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139 var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
