 and a third-year law student at the School of Law, Christ (Deemed to be University) where he covers legal, policy, and human rights developments in India.</em></p><p>The <a href=\"https://www.sci.gov.in/\" target=\"_blank\" rel=\"noopener\">Supreme Court of India</a> spent the last two weeks of July and the first week of August doing something it has done many times before, but rarely on this scale: improvising, hearing-by-hearing, a framework on how to guide the state may respond when thousands of young people hit the streets in one go.</p><p>On August 3, a Bench comprised of Chief Justice of India (CJI) Surya Kant, Justice Joymalya Bagchi, and Justice V. Mohana clarified an <a href=\"https://api.sci.gov.in/supremecourt/2026/44078/44078_2026_1_28_72185_Order_28-Jul-2026.pdf\" target=\"_blank\" rel=\"noopener\">order</a> it had passed a week earlier. According to the Court, the earlier order was being misused to strip student protesters accused of minor offences of protection from arrest. The Bench clarified that the order applied only to protestors facing “<a href=\"https://theleaflet.in/leaflet-reports/supreme-court-clarifies-that-only-student-protestors-with-heinous-criminal-antecedents-will-not-be-protected\" target=\"_blank\" rel=\"noopener\">heinous</a>” criminal charges, bringing the case to a close that moved unusually fast for Indian constitutional litigation.</p><p>On July 24, the Court agreed to hear an urgent plea from petitioners about police action taken against student protestors who had gathered at Delhi’s Jantar Mantar on July 20 to stage a <a href=\"https://www.jurist.org/news/2026/07/india-dispatch-delhis-cockroach-janta-party-protests-police-response/\" target=\"_blank\" rel=\"noopener\">march</a> toward Parliament. The march, called a “Sansad Chalo,” was organized by the <a href=\"https://www.cockroachjantaparty.org/saakshi\" target=\"_blank\" rel=\"noopener\">Cockroach Janta Party</a> (CJP), and called for the resignation of Union Education Minister Dharmendra Pradhan over repeated leaks of national exam papers, including the <a href=\"https://timesofindia.indiatimes.com/education/news/neet-2026-paper-leak-how-many-more-scandals-before-students-lose-faith-completely/articleshow/131033092.cms\" target=\"_blank\" rel=\"noopener\">NEET-UG 2026</a> paper. When protesters attempted to push through police barricades, Delhi Police officers responded by deploying tear gas and beating demonstrators with lathis (wooden batons). The petitioners further alleged that police used pellet guns, rubber bullets, electric batons, and nail-embedded lathis against them. They also averred that a journalist was injured, and that one student lost their eyesight because of police actions.</p><p>On July 27, the Bench heard submissions from counsel on both sides, including advocates for police personnel who claimed protestors assaulted police officers during the clashes. The CJI’s <a href=\"https://www.theweek.in/news/india/2026/07/27/supreme-court-peaceful-protest-rights-cjp-neet.html\" target=\"_blank\" rel=\"noopener\">response</a> set the tone for the matter when he <a href=\"https://www.theweek.in/news/india/2026/07/27/supreme-court-peaceful-protest-rights-cjp-neet.html\" target=\"_blank\" rel=\"noopener\">said</a>, “Right to peaceful protest is absolutely guaranteed. That cannot be denied. Merely because there is agitation cannot justify police excesses.” Equally, the CJI emphasized that protest cannot be used to justify violence against police. He concluded with a recommendation that authorities develop a uniform national protocol to address demonstrators, rather than allow each state to use discretion when responding.</p><p>On July 28, the CJI’s proposal became a concrete order. The Court said there was a prima facie case for an independent probe, directing states not to use coercive action against protesters, except those with criminal antecedents. It also ordered the release of detained minors, and asked the police to preserve CCTV footage, drone recordings and call logs, while barring publication of protesters personal data. By that time, Pradhan had already resigned on July 25, and two Union ministers had informed protest leaders that cases against the students would be withdrawn. Bihar and Assam moved on that assurance, but the Centre, and the petitioners’ counsel, senior advocate Vrinda Grover, kept talking about how that withdrawal could occur, at least procedurally, step by step.</p><p>The gap between promise and procedure produced the August 3 hearing. Solicitor General Tushar Mehta argued that withdrawing First Information Reports (FIRs) outright does not have any clear legal basis and suggested quashing them through courts. Grover and senior advocate N. Hariharan seemed to accept this. The Chief Justice proposed a state-by-state inventory of FIRs against protestors to separate cases involving students from those involving hardened criminals. He also suggested a Special Investigation Team to be led by a senior police officer and a committee, ideally led by a former Chief Justice of India, to examine allegations of police excess. He hinted the Court might eventually establish a protocol for using force multipliers like pellet guns.</p><p>None of this is without precedent. The Court addressed similar issues after the 2012 police <a href=\"https://timesofindia.indiatimes.com/india/midnight-police-swoop-on-baba-ramdev-ends-protest/articleshow/8730121.cms\" target=\"_blank\" rel=\"noopener\">action</a> against Baba Ramdev’s supporters in Delhi at Ramlila Maidan, and the 2020 <a href=\"https://ijoc.org/index.php/ijoc/article/view/16015/3300\" target=\"_blank\" rel=\"noopener\">Shaheen Bagh protests</a>, ruling in <a href=\"https://globalfreedomofexpression.columbia.edu/cases/amit-sahni-v-commissioner-of-police/\" target=\"_blank\" rel=\"noopener\">Amit Sahni v. Commissioner of Police</a> that public spaces cannot be occupied indefinitely, even for compelling causes. What sets this case apart is its attempt to move beyond single-incident rulings. Instead of focusing solely on Jantar Mantar, the Bench appears to aim for a general operating manual via litigation—something Parliament and the police establishment have never produced: one protocol for crowd-control weapons, one method for determining which FIRs deserve closure, and one accountability mechanism for officers caught on camera.</p><p>This ambition reveals the underlying problem. Each arrangement—the Special Investigation Team (SIT), the committee, the weapons protocol, the FIR triage—is being assembled ad hoc, depending on which counsel are present and which former judges are willing to serve. Nothing binds the next state government facing the next protest to follow it. As an Indian law student watching this unfold, the pattern feels familiar in some way: courts intervene energetically once a crisis is underway, but the absence of a standing statutory or administrative framework for policing dissent means every fresh protest starts the negotiation over rules from scratch.</p><p>Parliament reconvenes for its next session in the coming weeks. Whether it legislates a durable protocol, or leaves the task to the next bench facing the next crowd at the next roundabout, will determine if this case becomes a template or another precedent collecting dust.</p><p>Opinions expressed in JURIST Dispatches are solely those of our correspondents in the field and do not necessarily reflect the views of JURIST's editors, staff, donors or the University of Pittsburgh.</p>"},{"title":"The Many Masks of Dan Hoyle","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/17/the-many-masks-of-dan-hoyle","category":"fun","categoryLabel":"Interesting Reads","wordCount":804,"readingTime":5,"content":"<p>Dan Hoyle is an actor of improbable parts. His first one-man show, a study of American industry abroad, required him to play sweatshop workers in Hanoi and protesters in Quito. When acting out Nigerian oil politics, he was both militants and rebels. Performing all the characters in a scene is hard, and Hoyle, who lives in Oakland, makes it harder by playing only people who really exist; his method is to interview strangers and channel them onstage, a practice he calls “journalistic theatre.” “I feel my job is to connect people to people again,” he said the other day, in advance of his latest one-man show, “Takes All Kinds,” which returns to Joe’s Pub on August 16th. “I work in front of a big mirror and, when I see somebody who doesn’t look like me, that’s a start.”</p><p>Hoyle grew up in a performing family. His father, Geoff Hoyle, is a famous clown. Alongside Bill Irwin, Geoff was a principal in the Pickle Family Circus, and he originated the role of Zazu in “The Lion King” on Broadway. At home, in San Francisco, the family spoke in an inversion dialect they called the Lang (“The Lion King” became “King of the Lies”), and they studied the world from park benches. “My dad would be, like, ‘Now, look at how that guy is walking—is it a choice or an injury?’ ” Hoyle said. “San Francisco was a more affordable, more diverse city, and there was an openness, like, ‘What’s your story?’ ” When he started college, at Northwestern, he took trains to Chicago to chat up anyone he met. At school, he learned that this was called “performance ethnography.”</p><p>In 2008, Hoyle went around the country talking with people in red districts. “The stuff that I was hearing is what became the Tea Party and then Trump,” he said. He put it in a show. For “Takes All Kinds,” Hoyle, now forty-six, went looking for people in purple America who weren’t natural activists but who stumbled into efforts at reconciliation and change. He transforms himself into a Phish-head in Florida lobbying the school board on behalf of his lesbian daughter, and a pair of <em>MAGA</em>-supporting Latino barbers. “I’m listening for stories that complicate a surface-level understanding,” he explained. “My friend always says, ‘If you want to get close to somebody, stand next to them.’ It’s a joke—but also true.”</p><p>On a recent Tuesday, Hoyle was in the South Bronx, looking for people to stand next to. He struck up a conversation at the Citi Bike rack at 167th Street. He texted a man known as Pop (Jahar Simmons); they had met when Hoyle lived nearby. Hoyle had never put Pop in a show. He walked in circles looking for him, then his phone buzzed. “I don’t see you,” he said, and squinted. “Oh, there you at.” Pop, a guy in his mid-thirties with a white T-shirt and a mane of braids coiled atop his head, perched in the entrance to the Webster Houses project with two men, one lanky and dressed in Helmut Lang trackwear, the other built like a wrestler and wearing shades. “Son, D., what’s going on?” Pop said. “You can’t be white <em>and</em> lost in the hood.”</p><p>Hoyle told Pop’s friends that he acts out real people’s stories.</p><p>“Ask him, did I get a story yet,” Pop said.</p><p>“Did Pop get a story yet?” the tall man asked.</p><p>“<em>Not fucking yet!</em>” Pop bellowed.</p><p>Pop visited Hoyle whenever he went to the Bay Area. The first time he and a friend went to see one of Hoyle’s shows, he felt out of place. (“We smelled like a pound of weed, like a <em>pack</em>,” he said.) Then Hoyle gave him a shout-out onstage, and the weather changed. “All the people coming up to me: ‘You from the Bronx? What’s it like?’ ” He affected a grave look: “ ‘Walking over dead bodies every day. People getting shot.’ ”</p><p>His friends laughed. Pop worked days at the high school and nights at the hospital, and he used weekends to organize block parties. The guy with shades, Carlee Hopkins, was a counsellor for juveniles in detention; the other man, Ro Smith, worked in resale. This spring, he bought the entire stock of Knicks hats at Foot Locker and Dick’s Sporting Goods, for forty-six dollars apiece, and, when the Knicks peaked and shops ran out, sold the hats for a hundred and fifty dollars each. Smith asked Hoyle whether his plays were on YouTube.</p><p>“Thing is, it really needs to be experienced live,” Hoyle said.</p><p>“Motherfucker’s doing voices,” Pop explained. “Changing his face—”</p><p>“Pop, you ready to do my show?” Hoyle asked. “We’ll give you an opener.”</p><p>“Give me something!” Pop said. “Put me in the game, Coach—put me in the game.” ♦</p>"},{"title":"Arc Raiders' next major update will present players with a 'new high-level challenge' with a frozen map and arcs which will 'challenge the ways you've learned to move'","source":"PC Gamer","author":"Elie Gould","url":"https://www.pcgamer.com/games/third-person-shooter/arc-raiders-next-major-update-will-present-players-with-a-new-high-level-challenge-with-a-frozen-map-and-arcs-which-will-challenge-the-ways-youve-learned-to-move/","category":"gaming","categoryLabel":"Gaming","wordCount":708,"readingTime":4,"content":"<p>Embark has finally released some solid information on <a href=\"https://www.pcgamer.com/arc-raiders/\" target=\"_blank\" rel=\"noopener\">Arc Raiders'</a> next major update, Frozen Trails. We've got details on all the big and small features players can expect to see, including a snowy map, new arcs, new weapons, and more ways in which Embark wishes to improve \"the core Arc Raiders experience\".</p><p>The biggest feature which Frozen Trails brings with it is the map itself which is unsurprisingly frozen. It'll take players beyond the mountains as they're tasked with investigating a strange signal emanating from the tundra. There's abandoned homes, villages, research facilities, and an observatory to explore and strip for loot. But, just as it is with any other Arc Raiders map, players will have to fight for the good stuff: \"You’ll encounter threats above and below ground, and navigate environments that no Raiders have seen before.\"</p><p>Some of these threats will likely come in the form of the new arcs which have been <a href=\"https://www.pcgamer.com/games/third-person-shooter/embark-says-the-pressure-of-a-monthly-cycle-is-holding-arc-raiders-back-so-its-slowing-down-major-updates-will-come-every-6-months-from-now-on/\" target=\"_blank\" rel=\"noopener\">teased for a while now</a>. \"Our team has been hard at work developing new ARC threats that will arrive alongside the new map, each designed to challenge the ways you’ve learned to move, fight, and adapt,\" executive producer Aleksander Grøndal explains in a <a href=\"https://arcraiders.com/news/frozen-trail-is-coming-october-8th\" target=\"_blank\" rel=\"noopener\">blog post</a>.</p><p>All we know about these arcs so far is that they'll range from \"small and nifty problem-makers\" (which means they'll probably be similar to the likes of Pops or Ticks), to \"an enormous machine that will halt you in your tracks.\"</p><p>It's all relative but when I hear enormous in Arc Raiders I think of the Matriarch, which could mean we'll be getting another map-uniting threat to go up against. Perhaps we'll finally see a glimpse of the <a href=\"https://www.pcgamer.com/games/third-person-shooter/my-arc-raiders-2026-wishlist-consists-of-new-mobs-modes-and-map-conditions/\" target=\"_blank\" rel=\"noopener\">rumoured Baron or Duke</a>. But enormous could also just mean a Bastion or Vaporizer-sized arc which would still be a lot of fun to fight and likely just as terrifying.</p><p>\"Creating new ARC is one of the more involved parts of development,\" Grøndal continues. \"From early concepts and animation to behaviour and machine learning systems that give them their distinctive 'spark of life', every enemy goes through months of iteration to get right. We think it’ll be worth the wait, and we can’t wait to see what you think.\"</p><p>But these new arcs aren't just here to terrify players, it's all about creating another \"new high-level challenge\" for long time players to sink their teeth into. As more time passes and the regulars get better and better, it's crucial that Embark ups the ante, so in enters \"an enormous new Arc Operation designed for experienced raiders looking to push themselves even further.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>\"Without giving too much away, this new activity is built around many of the ideas that have become increasingly important to us throughout development: meaningful decisions, dynamic encounters, and moments that demand cooperation and careful judgment,\" Grøndal says.</p><p>\"Success won’t come easily. You’ll need to balance combat, teamwork, risk, and survival in what we believe will be one of the most intense experiences ARC Raiders has offered to date – one that rewards those willing to rise to the challenge.\" More on this will be revealed later, closer to its release in October.</p><p>Without getting to see Frozen Trails first-hand, all players can go by right now are promises and vibes. But without getting ahead of myself, it seems like Embark is hitting the mark of what players need from this next major update. It's not enough to offer up new maps, arcs, and weapons on their own, players need variety and making small tweaks which will force players to expand upon their habitual playstyle sounds like the refresh Arc Raiders needs.</p>\n\n<p>Elie is a news writer with an unhealthy love of horror games—even though their greatest fear is being chased. When they're not screaming or hiding, there's a good chance you'll find them testing their metal in metroidvanias or just admiring their Pokemon TCG collection. Elie has previously worked at TechRadar Gaming as a staff writer and studied at JOMEC in International Journalism and Documentaries – spending their free time filming short docs about Smash Bros. or any indie game that crossed their path.</p>"}];
