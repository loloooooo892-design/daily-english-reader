*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"DHS Has Used This Controversial Investigative Tool 185,000 Times Since Trump Took Office","source":"Wired","author":"@wired","url":"https://www.wired.com/story/dhs-has-used-this-controversial-investigative-tool-185000-times-since-trump-took-office/","category":"tech","categoryLabel":"Technology","wordCount":774,"readingTime":4,"content":"<p>Homeland Security Investigations, the investigative wing of <a href=\"https://www.wired.com/tag/immigration-customs-enforcement/\" target=\"_blank\" rel=\"noopener\">Immigration and Customs Enforcement</a> that normally takes on transnational crime, estimates it has sent out at least 185,000 administrative subpoenas since the start of the Trump administration, according to a recent <a href=\"https://www.courtlistener.com/docket/73226380/13/electronic-frontier-foundation-v-us-department-of-homeland-security/\" target=\"_blank\" rel=\"noopener\">court filing</a>. The figure shows how HSI has increasingly relied on this warrantless authority to conduct investigations.</p><p>To put HSI’s estimate into perspective, a <a href=\"https://www.wired.com/story/ice-1509-custom-summons/\" target=\"_blank\" rel=\"noopener\">previous WIRED analysis</a> found that in the more than six and a half years from the start of 2016 to mid-August 2022, ICE agents only sent out around 170,000 of a type of administrative subpoena called a 1509 customs summons.</p><p>The number of administrative subpoenas was revealed as part of a Freedom of Information Act lawsuit against the <a href=\"https://www.wired.com/story/massive-leak-exposes-41000-homeland-security-workers-including-undercover-ice-agents/\" target=\"_blank\" rel=\"noopener\">Department of Homeland Security</a> filed by the Electronic Frontier Foundation. Aaron Mackey, deputy legal director at the nonprofit, says the EFF hopes to get more details about the 185,000 estimate. The EFF <a href=\"https://www.courtlistener.com/docket/73226380/1/electronic-frontier-foundation-v-us-department-of-homeland-security/\" target=\"_blank\" rel=\"noopener\">originally asked</a> for information about how many administrative subpoenas were sent to technology companies, internet platforms, and service providers by ICE or DHS since January 20, 2025. It’s not clear if that count is just for administrative subpoenas sent to those types of companies or if it includes a much broader set.</p><p>Administrative subpoenas are a powerful but unchecked investigative tool. Unlike with a grand jury subpoena or a court order, the government doesn’t have to explain to the courts why it needs the documents or what data it’s requesting from a company.</p><p>Since the start of the Trump administration, the federal government has used DHS’s administrative subpoena power to try to <a href=\"https://www.wired.com/story/dhs-demanded-google-surrender-data-on-canadians-activity-location-over-anti-ice-posts/\" target=\"_blank\" rel=\"noopener\">unmask</a> anonymous online critics and pursue broad <a href=\"https://www.wired.com/story/ice-wants-to-know-who-bought-a-certain-green-beanie-from-rei-in-the-last-2-years/\" target=\"_blank\" rel=\"noopener\">customer records</a> about protesters. This includes, for example, a list of people in the Minneapolis-St. Paul area who bought a specific green beanie from REI.</p><p>Congress originally <a href=\"https://www.law.cornell.edu/uscode/text/19/1509\" target=\"_blank\" rel=\"noopener\">granted</a> the use of 1509 customs summons to the then stand-alone US Customs Service nearly a century ago, with the idea that it would let customs officers inspect business records related to importing merchandise and figure out whether they owed customs duties. In 2003, Congress transferred that agency’s powers, including the ability to issue customs summons, to the newly formed Department of Homeland Security.</p><p>In the past, DHS has maintained that customs summons could be used only for specific purposes. The DHS inspector general <a href=\"https://www.oig.dhs.gov/sites/default/files/assets/Mga/2017/oig-18-18-nov17.pdf\" target=\"_blank\" rel=\"noopener\">admonished</a> Customs and Border Protection’s Office of Professional Responsibility in 2017 for trying to use a customs summons to unmask an anonymous Twitter poster, pointing out that its own procedures manual said that customs summons could only be used to obtain information related to customs or immigrations laws.</p><p>That, however, has changed. The Trump administration recently <a href=\"https://www.courtlistener.com/docket/72212459/816/united-states-v-levy-armstrong/\" target=\"_blank\" rel=\"noopener\">argued in court</a> that because the Customs Service’s powers were transferred to DHS following the passing of the Homeland Security Act, it can use that power to tackle its “broad investigative portfolio,” which it says includes enforcing laws “beyond legacy customs and immigration enforcement.”</p><p>“When we give law enforcement agencies powerful investigative tools, even with the best intentions and purposes to try to go after legitimate investigations and crime, you have to be really careful,” says Mackey. The newly reported filing is part of an ongoing Freedom of Information Act lawsuit filed by the nonprofit against ICE and DHS.</p><p>\"The numbers reported to EFF amount to a dragnet domestic surveillance program by Trump's Homeland Security Department,” says US senator Ron Wyden of Oregon.</p><p>ICE did not respond to questions about why there’s been such a huge increase compared to prior years, but Mackey speculates that it may be because there is virtually no downside to filing them.</p><p>“The worst thing that will happen to ICE is that the service that receives it says it's not going to respond,” says Mackey. If that happens, ICE can just take the company to court to force it to comply, as it <a href=\"https://www.courtlistener.com/docket/73674107/united-states-v-google-llc/\" target=\"_blank\" rel=\"noopener\">recently did</a> with Google, or withdraw it and try to get the information it’s after by issuing a grand jury subpoena, as the Intercept <a href=\"https://theintercept.com/2026/04/10/reddit-ice-protest-grand-jury/\" target=\"_blank\" rel=\"noopener\">reported</a> it recently did with Reddit.</p><p>“Congress desperately needs to pass my bipartisan legislation to drastically curb federal subpoenas, including consequences for officials who abuse surveillance authorities,” says Wyden, referencing his proposed <a href=\"https://www.wyden.senate.gov/news/press-releases/wyden-lummis-espaillat-massie-kelly-and-burlison-introduce-bipartisan-bill-to-rein-in-government-abuse-of-subpoenas-protect-americans-rights\" target=\"_blank\" rel=\"noopener\">Subpoena Abuse Prevention Act</a>. “Next year, I plan to use the Senate Finance Committee gavel to get to the bottom of HSI's unprecedented misuse of customs law to target Trump's enemies.”</p><p>Even without exact details about the 185,000 subpoenas HSI sent out, Mackey says their prolific uses still raises “significant concerns about an agency potentially being out of control and not being subject to any sort of internal oversight that respects people's First Amendment rights and their rights to privacy.”</p>"},{"title":"Disability Discrimination and Allegations of AI Use in Student's University of Michigan Course Papers","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/10/disability-discrimination-and-allegations-of-ai-use-in-students-university-of-michigan-course-papers/","category":"law","categoryLabel":"Law","wordCount":1450,"readingTime":8,"content":"<p>Plaintiff Jane Doe filed this lawsuit against the University of Michigan and several individual defendants after she was disciplined for her alleged use of AI to write course papers. Plaintiff, who has generalized anxiety disorder (GAD) and obsessive-compulsive disorder (OCD), maintains that the \"tone, meticulous structure, [and] stylistic consistency\" of her writing can be misinterpreted as AI. Unconvinced, Defendants sanctioned Plaintiff with disciplinary probation and required her to rewrite those course papers and write a reflective essay. After challenging that discipline without success, Plaintiff filed suit, asserting claims under the due process clause, the Americans with Disabilities Act (ADA), and the Rehabilitation Act (RA). …</p>\n<p>This dispute unfolded last fall when Plaintiff was an undergraduate student in Great Books 191, a classical studies course at the University of Michigan. The class was taught by Theo Nash, the course's graduate student instructor, and Basil Duffalo, the lead instructor. According to Plaintiff, Nash made public \"statements reflecting a predisposition to assume AI misuse by students and to treat AI-related concerns as a core academic 'values' issue.\"</p>\n<p>The issues at the heart of this case started when Nash filed an academic misconduct accusation with the Office of Student Academic Affairs (OSAA), indicating he was \"immediately suspicious\" Plaintiff had used AI to write a course paper. Plaintiff denied that accusation, \"explaining that [her] disability-related writing traits could be misinterpreted as AI and should not be treated as proof of misconduct.\"</p><p>Plaintiff participated in a conference with OSAA and submitted materials supporting that position. Not long after, Nash filed a second misconduct accusation based on another paper written by Plaintiff. He attached \"AI-generated comparison outputs created by prompting AI with [Plaintiff's] own outline and with instructor feedback.\" Before OSAA's involvement on this second accusation, Nash asked Plaintiff to meet. Plaintiff declined. In Plaintiff's telling, Nash \"interpreted her declination as 'self-destructive' and a refusal of help.\" Plaintiff then went through the same OSAA proceeding for the second accusation. OSAA found Plaintiff responsible for both accusations and sanctioned her with disciplinary probation (notated on her unofficial transcript) and also required her to write a reflective essay.</p>\n<p>Five days later, Nash filed a third misconduct accusation with OSAA for another paper written by Plaintiff. Plaintiff again submitted materials to OSAA including \"written notices\" \"explaining that an NR grade was blocking degree requirements and graduation and that her transcript and future educational opportunities were being harmed immediately.\"</p>\n<p>Before OSAA adjudicated the third accusation, Plaintiff filed a complaint with the Dean of the College of Literature, Science, and the Arts, and the University President's Office, \"about disability discrimination, retaliation, harassment, and lack of procedural neutrality in the OSAA process.\" The University responded that Plaintiff could appeal OSAA's findings, which Plaintiff soon did. That same day, Plaintiff filed a complaint with the U.S. Department of Education and the University's Equity, Civil Rights, and Title IX Office (ECRT). OSAA, in turn, paused Plaintiff's appeal pending ECRT's review.</p>\n<p>ECRT dismissed Plaintiff's complaint given her approved accommodations. With that decision complete, OSAA then issued the same misconduct finding for the third accusation. Plaintiff was also required to rewrite course papers for Great Books 191.</p>\n<p>In Plaintiff's view, Defendants \"treated disability-related traits and limitations as evidence of guilt and failed to apply disability-informed modifications in the academic integrity process.\" That led Plaintiff to file this lawsuit. Plaintiff brings her claims against the Regents of the University of Michigan (\"the University\") and several individual defendants in their official and individual capacities, including Nash and Duffalo, and Sean Edgerton and Christine O'Neil from OSAA. …</p>\n<p>The court held the individual defendants were entitled to qualified immunity as to the due process claim, since any alleged constitutional violation wouldn't be \"clear to a reasonable\" government official; an excerpt:</p>\n<p>Based on the allegations in the complaint, Nash (and Duffalo) were faced with course papers that resembled the use of AI. Plaintiff has provided no case suggesting it would be \"clear to a reasonable\" university instructor that using AI-detection software to analyze that writing and bring an academic misconduct allegation as a result of that analysis would violate a student's procedural due process rights….</p>\n<p>And the court rejected the due process claim against the institution:</p>\n<p>[Plaintiff] was advised of the accusations that she used AI to write course papers. Her sanctions included disciplinary probation notated on her unofficial transcript, a requirement to write a reflective essay, and rewriting course papers. But before they were imposed, Plaintiff was given opportunities to provide her side of the story, including that her GAD and OCD caused writing traits that could be mistaken for AI. She provided medical documentation to OSAA, and OSAA expressly considered that information in its decision. In effect, Plaintiff \"admits that [s]he received exactly the due process [s]he requested.\"</p>\n<p>Pivoting from the process provided, Plaintiff maintains that OSAA's sanctions \"rested on Nash's self-confirming AI comparison outputs.\" That argument is unsupported by Plaintiff's allegations and exhibits. Again, they show that OSAA considered Nash's conclusions against Plaintiff's explanations. And when forming its decision, OSAA even credited information Plaintiff provided that sufficiently disputed one of Nash's conclusions … (\"In your evidence you indicated that the idea of the 'rat king' was something talked about in your discussion section which we were able to confirm.\")….</p>\n<p>All told, \"[w]hen assessing whether an academic dismissal constituted a due process violation, '[a] court must 'show great respect for the faculty's professional judgment' and may not 'override' that judgment 'unless it is such a substantial departure from accepted academic norms as to demonstrate that the … committee responsible did not actually exercise professional judgment.'\" The parties rely on this academic-dismissal standard even though this case involves assessing whether a disciplinary probation notation on an unofficial transcript and a requirement to write a reflective essay and rewrite course papers constitute a due process violation. But based on the allegations in the complaint and attached exhibits, the Court cannot find that Defendants departed from accepted academic norms or failed to exercise professional judgment.</p>\n<p>The court also rejected plaintiff's claims that the university failed to accommodate her disability, and that the university retaliated against her for asserting rights related to her disability. But it allowed plaintiff's intentional disability discrimination claim to go forward:</p>\n<p>[Plaintiff] describes the discrimination theory in her response brief as follows:</p>\n<p>Nash's public statements reflecting a 'paranoid' predisposition to find AI everywhere, combined with his decision to file three successive accusations grounded in the very writing traits Plaintiff's clinicians had warned would be misinterpreted, and OSAA's decision to sustain those findings while disregarding the clinical record, collectively support an inference of intentional discrimination.</p>\n<p>For their part, Defendants do not advance significant argument on this claim[, arguing instead that] … \"With respect to the denominated claims of 'discrimination,' the Complaint does not actually contain any allegations of direct (i.e., intentional) discrimination. For that reason and to that extent, Claims I and II should be dismissed.\" … Yet Plaintiff maintains that her discrimination claims \"are supported by allegations of intentional … discrimination.\" …</p>\n<p>There can be no dispute that Plaintiff pleads Nash's \"paranoid' predisposition\" to find AI, and her submission of clinical evidence explaining why, given her disabilities, her writing style might be misinterpreted as coming from the use of AI. It is also true that the exhibits Plaintiff attached to her response brief that the parties are treating as integral to the allegations in the complaint, show that OSAA reviewed her clinical record.</p>\n<p>But at this stage of the case, the Court must accept as true Plaintiff's allegation that OSAA disregarded the medical evidence. In other words, although Defendants considered and/or reviewed Plaintiff's medical records, she plausibly pleads that they discriminated against her by disregarding them to find that she used AI when the writing style of the course papers could have resulted from her disabilities.</p>\n<p>Plaintiff further alleges that she provided Nash and Duffalo with information about her disability accommodations such that they were on notice of her disabilities. She pleads that she rejected Nash's request to meet with him outside of OSAA. Taking these allegations as true and drawing reasonable inferences in Plaintiff's favor, that rejection likely resulted from the effects of her disabilities, including difficulty with \"live verbal defense, rapid processing, and adversarial questioning.\"</p>\n<p>Indeed, that is seemingly why \"Plaintiff requested that OSAA permit her to present her defenses in writing rather than through additional live Zoom proceedings, consistent with her disability-related limitations.\" But Nash, according to the allegations, interpreted Plaintiff's rejection of his request to meet as \"self-destructive\" and then followed up with another misconduct accusation to OSAA. Accepting these allegations as true, combined with Plaintiff's allegations about Nash's \"'paranoid' predisposition\" to find AI, Plaintiff plausibly pleads a claim for disability discrimination under the ADA/RA.</p>"},{"title":"One Elder Scrolls fan is reviving and upgrading (with AI) a lost spin-off for the Nokia N-Gage and porting it to PC","source":"PC Gamer","author":"Jody Macgregor","url":"https://www.pcgamer.com/games/the-elder-scrolls/one-elder-scrolls-fan-is-reviving-and-upgrading-a-lost-spin-off-for-the-nokia-n-gage-and-porting-it-to-pc/","category":"gaming","categoryLabel":"Gaming","wordCount":532,"readingTime":3,"content":"<p>I spend way too much time on wikis reading about spin-off games made for handheld and mobile devices I will probably never play (there was a whole trilogy of Silent Hill: Orphan games that have lived up to their name by being orphaned on old phones). The Elder Scrolls Travels are a prime example—games made in the gap between Morrowind and Oblivion. The third in the series, Shadowkey, came out on Nokia's N-Gage handheld—a cross between a GameBoy Advance and a mobile phone that lasted two years before being discontinued in 2005.</p><p>This first-person RPG is about to return thanks to Dan Whelan, whose Shadowkey Reforged project will let us play Shadowkey in widescreen with controller support and upscaled graphics. You can choose to play in classic or modern mode, but you can also toggle individual features one by one. Modern mode isn't just a graphical upgrade as it also adds features from the later mainline Elder Scrolls games like stamina-based sprinting, stealth, and ragdoll physics.</p>\n\n<p>TES Shadowkey Reforged Trailer 4K - Release Candidate Build. Releases 11-11-26 - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/Ax-MqhRaP7w\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>This is one of those times where I prefer the original game's look, as the brutally abrupt draw distance leaves a lot to your imagination while the modernized version seems to show enemies looming unresponsively in the near distance. And it's not like the upscaled character models actually look good, despite being beyond what Nokia's taco phone was capable of displaying.</p><p>While Shadowkey was never particularly well-ranked in the pantheon of Elder Scrolls games, people did praise its use of the Morrowind soundtrack, which Shadowkey Reforged will continue. Point it to your Morrowind install and it'll borrow both music and sound effects from the best Elder Scrolls game.</p><p>To answer the obvious question, Whelan says in the FAQ: \"I used AI to assist with coding and building the engine, and with debugging. I used AI image generation combined with Photoshop and some manual sprite editing to create most of the modern, higher resolution artwork.\"</p><p>Whelan plans to release Shadowkey Reforged on November 11, which is just 18 hours away at the time of writing. You'll be able to download <a href=\"https://www.pcgamer.com/tag/microsoft-windows/\" target=\"_blank\" rel=\"noopener\">Windows</a>, Mac, and Android versions from the <a href=\"https://shadowkey.omracreative.ie/\" target=\"_blank\" rel=\"noopener\">website</a>, though you'll need the original game's files from your Nokia N-Gage as well, or whatever abandonware site you frequent.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Jody's first computer was a Commodore 64, so he remembers having to use a code wheel to play Pool of Radiance. A former music journalist who interviewed everyone from Giorgio Moroder to Trent Reznor, Jody also co-hosted Australia's first radio show about videogames, <a href=\"https://zedgamesau.net/tag/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zed Games</a>. He's written for <a href=\"https://www.rockpapershotgun.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Rock Paper Shotgun</a>, The Big Issue, <a href=\"https://www.gamesradar.com/author/jody-macgregor/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a>, <a href=\"http://www.zam.com/author/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zam</a>, <a href=\"https://web.archive.org/web/20170606042647/http://www.glixel.com/contributor/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Glixel</a>, <a href=\"https://fiveoutoftenmagazine.com/downloads/issue-16-identity/\" target=\"_blank\" rel=\"noopener\">Five Out of Ten Magazine</a>, and <a href=\"https://web.archive.org/web/20171009125722/https://www.playboy.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Playboy.com</a>, whose cheques with the bunny logo made for fun conversations at the bank. Jody's first article for PC Gamer was about the <a href=\"https://www.pcgamer.com/the-audio-of-alien-isolation/\" target=\"_blank\" rel=\"noopener\">audio of Alien Isolation</a>, published in 2015. Jody edited PC Gamer Indie from 2017 to 2018, and he eventually lived up to his promise to play every Warhammer videogame.</p>"},{"title":"Josh Homme Likes to Satan","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/16/josh-homme-likes-to-satan","category":"fun","categoryLabel":"Interesting Reads","wordCount":581,"readingTime":3,"content":"<p>Josh Homme, a guitarist and vocalist in the art-rock band Queens of the Stone Age, paid a visit to Regan MacNeil, the demonically possessed adolescent girl at the center of the 1973 film “The Exorcist,” the other day. Actually, it was an animatronic-doll version of Regan, complete with head-whirling, and it was on display in a Plexiglas box at the Museum of the Moving Image, in Astoria. Somehow, the doll’s bleached-out eyeballs seemed to follow a visitor around the room.</p><p>Homme, who is fifty-three years old, first saw “The Exorcist” when he was twelve. His parents weren’t home. “My brother was supposed to watch me, and, of course, he didn’t,” he said. “I started it at around six-thirty. The sun went down, and I’m in my parents’ waterbed, just gently jiggling. Sheets and blankets pulled up to my nose. And this movie just <em>happened</em> to me. I couldn’t get up.” He continued, “ ‘The Exorcist’ deals with things that are sort of esoterically possible: possession, the Devil. I had a pretty sincere Christian upbringing, so it seemed like nonfiction. To me, this was a documentary.”</p><p>In an adjacent gallery, an exhibition on Jim Henson’s Muppets was visible. Homme looked up from Regan and locked eyes with Kermit the Frog. “Oh, shit!” he said. “Seeing all this horror stuff and then looking over at Kermit, it feels like Kermit’s doing something dark.”</p><p>Homme founded Queens of the Stone Age in 1996, shortly before he returned to his home town of Palm Desert, a sunbaked oasis in the Coachella Valley. “I grew up right where the desert starts,” he said. “There are pine forests at the top of Mt. San Jacinto, in Palm Springs. It’s snowy, and then the snow melts and it comes down, and that’s right where the desert begins. I love transition, the braiding together of worlds. I think that’s where the interesting stuff is.”</p><p>His songwriting has always embraced heavy and devious themes: lust, death, menace. The day before Halloween, the band released its ninth album, “Perfecth.” It’s a record about making reluctant peace with love gone asunder—“Letting go of you is beautiful,” Homme sings—and it was inspired, in part, by an acoustic show that the band played in the Paris catacombs, a subterranean ossuary containing the bones of about six million people, in 2024. “There’s a lot of gravel on the floor, so you crunch your way through,” Homme said. “It makes you feel really insignificant, which makes me feel comfortable.” He went on, “I took a dark alleyway and got on my knees and said, ‘I promise to try as hard as I can.’ It was very special to be alive there.” At the time, Homme was dealing with some health issues, and the band would soon cancel a tour. “The line between where they were at and where I was at—it felt paper thin,” he said, of the piled-up bones.</p><p>These days, Homme likes to watch horror movies with his twenty-year-old daughter, Camille. “She calls it Satan-ing,” he said. “She’s, like, ‘Do you want to Satan tonight?’ We just scratch each others’ arms and eat popcorn. I can tell it’s soothing to her, and it’s my chance to get unadulterated time—kid-straight-off-the-tap is hard to come by.” He finds the experience of being frightened cathartic, even calming: “You get on a roller coaster, and by the time you get off all anxiety is gone. It’s been replaced with adrenaline, endorphins. Jump scares flush the body of anxiety.”</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
