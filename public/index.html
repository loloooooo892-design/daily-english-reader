*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

<script>
var articles = [{"title":"Mass Effect 5 was named Universe partly because it let players generate alternate timelines based on their choices in previous entries, technical director says","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/mass-effect-5-was-named-universe-partly-because-it-let-players-generate-alternate-timelines-based-on-their-choices-in-previous-entries-technical-director-says","category":"gaming","categoryLabel":"Gaming","wordCount":637,"readingTime":4,"content":"<p>The system was part of BioWare's effort to give the player \"absolute autonomy\", according to Romain Toutain</p>\n    \n  \n  \n  \n\n            <p>In case you missed it, <a href=\"https://www.rockpapershotgun.com/an-internal-mass-effect-5-trailer-has-reportedly-leaked-offering-you-a-glimpse-at-the-sequel-youll-never-get-to-play\" target=\"_blank\" rel=\"noopener\">an internal trailer</a> for the new <a href=\"https://www.rockpapershotgun.com/games/mass-effect\" target=\"_blank\" rel=\"noopener\">Mass Effect</a> game which BioWare were working on prior to <a href=\"https://www.rockpapershotgun.com/development-on-the-next-mass-effect-is-ending-ea-is-shutting-down-rpg-veteran-bioware-to-align-talent-and-investments-where-we-see-the-greatest-opportunities-for-players-and-long-term-growth\" target=\"_blank\" rel=\"noopener\">EA shutting them down</a> hit the net late last week. It offered a peek at what the studio were cooking with this new entry, dubbed Mass Effect Universe. According to its technical director, one of the reasons the game was given that name was that it had a system aimed at letting players form alternate timelines based on their choices in previous Mass Effects.</p>\n<p><a href=\"https://x.com/Octobinz\" target=\"_blank\" rel=\"noopener\">Romain Toutain</a>, BioWare's franchise technical director since 2022, said as much during a <a href=\"https://www.twitch.tv/octobinz\" target=\"_blank\" rel=\"noopener\">Twitch stream</a> that saw him react to the leaked trailer. The on-demand version of this steam looks like it may since have been yanked, but not before a BlueSky user with the handle @loustica-lucia went through, took some clips, and added subtitles translating Toutain as he chats about the trailer in French.</p>\n<p>\"All the choices made in the first Mass Effect games were taken into account,\" the developer said after the trailer finished. \"One of the reasons why it was called Mass Effect Universe is that you had so many choices that you could plug your saves together to create parallel universes. To keep it simple. It’s not exactly how it worked. You had different timelines, basically. You could almost generate timelines, kinda like <a href=\"https://www.rockpapershotgun.com/games/zero-escape-zero-time-dilemma\" target=\"_blank\" rel=\"noopener\">Zero Time [Dilemma]</a>.\"</p>\n<blockquote><p>So earlier, my brother was watching Octobinz (Romain Toutain)'s livestream on Twitch. He was the Technical Director on Mass Effect Universe, so I wanted to share some bits he discussed.\r\nAs he speaks french, I added subtitles to make it more accessible for everyone!\n#MassEffect #MassEffectUniverse</p><p><a href=\"https://bsky.app/profile/did:plc:fqslpumuzq4cd2def6e5z4iw/post/3mynrejw5o22m?ref_src=embed\" target=\"_blank\" rel=\"noopener\">[image or embed]</a></p>— ✨Lou🖤🤍💜 (<a href=\"https://bsky.app/profile/did:plc:fqslpumuzq4cd2def6e5z4iw?ref_src=embed\" target=\"_blank\" rel=\"noopener\">@loustica-lucia.bsky.social</a>) <a href=\"https://bsky.app/profile/did:plc:fqslpumuzq4cd2def6e5z4iw/post/3mynrejw5o22m?ref_src=embed\" target=\"_blank\" rel=\"noopener\">24 October 2026 at 23:44</a></blockquote><p>Asked if it was similar to <a href=\"https://www.rockpapershotgun.com/recover-your-lost-worlds-with-dragon-age-keep\" target=\"_blank\" rel=\"noopener\">Dragon Age Keep</a>, the service BioWare set up to let folks create world states based on their <a href=\"https://www.rockpapershotgun.com/games/dragon-age-origins\" target=\"_blank\" rel=\"noopener\">Dragon Age: Origins</a> and <a href=\"https://www.rockpapershotgun.com/games/dragon-age-ii\" target=\"_blank\" rel=\"noopener\">Dragon Age 2</a> choices that they could then import into Inquisition, Toutain said \"kinda\". Though, he stressed that this Mass Effect system worked in some extra complexity by letting players make decisions that might contradict things they've previously done.</p><p>\"Everything in the game, everything was stateful,\" the dev explained. \"At any time, you could stop the game - I mean, you could pause it - and ask a system that solved logical equations, ‘Is this valid?’ And if it isn’t valid, what conditions must be met for it to be valid? For the game to set these conditions. And if the content doesn’t exist, then we know the content doesn’t exist, so we’ll either have to create another branch, either that, or we know we have to create the content.</p>\n<p>\"So, if you killed a guy, and you needed that guy for your mission, the game will make sure you can complete the mission. Or, if that’s what the designers have decided, well, no, the mission’s failed because you killed that guy. Or else, something that was bound to happen doesn’t happen, just so that a path remains open, so that you can get around the problem.\" Toutain summed the system up as being something that was \"difficult to set up\", but worked well.</p>\n<p>It certainly sounds ambitious, if a lot of work to get right. Whether it and the pursuit of <a href=\"https://www.rockpapershotgun.com/mass-effect-5-was-aiming-to-offer-a-level-of-autonomy-and-choice-that-could-vault-it-into-orbit-with-larian-and-cd-projekts-top-rpgs-former-dev-says-post-cancellation\" target=\"_blank\" rel=\"noopener\">giving the player \"absolute autonomy\"</a> which the dev says it was part of would've made <a href=\"https://www.rockpapershotgun.com/games/mass-effect-5\" target=\"_blank\" rel=\"noopener\">Mass Effect 5</a> a return to form for BioWare is up for debate and will likely remain so forever unless someone swoops in to perform a miracle resurrection pretty sharpish. Personally, it at least sounds like something that'd have piqued my curiosity enough to see what Shep and co were up to, despite not being the biggest Mass Effecter.</p>"},{"title":"Ketamine’s Role in Alleged Cornell Rape Highlights Flood of Psychoactive Drugs on Campus - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/ketamines-role-in-alleged-cornell-rape-highlights-flood-of-psychoactive-drugs-on-campus-1286212/","category":"fun","categoryLabel":"Interesting Reads","wordCount":954,"readingTime":5,"content":"<p>Former Cornell student Jane Doe, who <a href=\"https://www.cornellsun.com/article/2026/09/tccsuykuvb4z\" target=\"_blank\" rel=\"noopener\">filed a civil lawsuit in September 2026</a> alleging that seven fraternity members raped her at a party, said the young men who assaulted her pressured her into taking the drug ketamine.</p><p>As an <a href=\"https://med.virginia.edu/emergency-medicine/faculty/full-time-faculty/christopher-p-holstege-md/\" target=\"_blank\" rel=\"noopener\">emergency room physician, medical toxicologist</a> and the <a href=\"https://studentaffairs.virginia.edu/staff/christopher-holstege\" target=\"_blank\" rel=\"noopener\">head of student health services</a> at the University of Virginia, I have had a front-row seat to the growing danger that psychoactive substances such as ketamine present to the health and safety of university students.</p><p><a href=\"https://med.virginia.edu/toxicology/wp-content/uploads/sites/268/2026/03/Mar26-Ketamine-analogues.pdf\" target=\"_blank\" rel=\"noopener\">Ketamine and its emerging spin-off versions</a> are part of a <a href=\"https://www.unodc.org/unodc/secured/wdr/wdr2013/World_Drug_Report_2013.pdf\" target=\"_blank\" rel=\"noopener\">wave of new and evolving designer drugs</a> entering the United States and other countries. How widely these substances are used remains unknown, since most hospitals are <a href=\"https://doi.org/10.1016/j.emc.2022.01.003\" target=\"_blank\" rel=\"noopener\">unable to detect them</a> on standard urine drug screens. But <a href=\"https://www.justice.gov/archive/ndic/pubs8/8872/index.htm#commission\" target=\"_blank\" rel=\"noopener\">ketamine and other drugs</a> are being increasingly reported as <a href=\"https://doi.org/10.28933/ijprr-2021-07-1505\" target=\"_blank\" rel=\"noopener\">agents used in sexual assault</a> – either when people take these drugs voluntarily, are pressured to take them or are given them covertly.</p><p>The increasing prevalence of ketamine and other drugs—and their use in sexual assault—is <a href=\"https://doi.org/10.1176/appi.focus.20180037\" target=\"_blank\" rel=\"noopener\">playing out on college campuses across the U.S.</a> and putting students at risk.</p><h2>A Growing Supply</h2><p>Ketamine is a synthetic chemical that was <a href=\"https://www.ebsco.com/research-starters/health-and-medicine/ketamine/\" target=\"_blank\" rel=\"noopener\">first synthesized in 1962</a>. The U.S. Food and Drug Administration approved it as a <a href=\"https://doi.org/10.3389/fnhum.2016.00612\" target=\"_blank\" rel=\"noopener\">general anesthetic for people and animals</a> in 1970, and doctors and veterinarians used it for decades to induce anesthesia during surgeries and to relieve pain.</p><p>People have <a href=\"https://doi.org/10.1176/appi.books.9798894551944.lg03\" target=\"_blank\" rel=\"noopener\">used ketamine recreationally</a> since the 1970s. Getting high on it became more popular in the U.S. in the 1980s, when it was called “Special K.” It was frequently found in the club drug scenes and was associated with raves into the 1990s. Today, ketamine is sold on the street under a <a href=\"https://www.justice.gov/archive/ndic/pubs8/8872/8872p.pdf\" target=\"_blank\" rel=\"noopener\">variety of slang names</a>, such as K, Ket, and Vitamin K.</p><p>In 2019, <a href=\"https://doi.org/10.1017/S2045796019000751\" target=\"_blank\" rel=\"noopener\">the FDA approved a nasal spray version of ketamine</a>, called esketamine, to treat depression that does not respond to other treatments. That drug’s use is tightly regulated, but clinicians are increasingly prescribing ketamine “off-label” for a variety of psychiatric conditions, including <a href=\"https://theconversation.com/ketamine-can-rapidly-reduce-symptoms-of-ptsd-and-depression-new-study-finds-216077\" target=\"_blank\" rel=\"noopener\">post-traumatic stress disorder</a>.</p><p>Cases of poisoning caused by ketamine in the U.S. <a href=\"https://doi.org/10.1016/j.drugalcdep.2025.112549\" target=\"_blank\" rel=\"noopener\">doubled between 2019 and 2023</a>, according to an analysis of calls to poison control centers nationwide, and are now the highest they’ve ever been. This surge is in part due to the more widespread medical use of ketamine, which makes accessing it much easier. But <a href=\"https://doi.org/10.1001/jamapsychiatry.2023.1423\" target=\"_blank\" rel=\"noopener\">street versions of the drug</a> are also prevalent as chemists in basement laboratories create novel ketamine analogs.</p><h2>Ketamine’s Effects on the Body</h2><p>Ketamine’s effects vary depending on the dose and the person. It can cause someone to dissociate, creating an altered state of consciousness, changing what’s perceived through the senses and causing a sense of detachment from one’s self and one’s surroundings. The drug can also <a href=\"https://www.merckmanuals.com/professional/special-subjects/illicit-drugs-and-intoxicants/ketamine-and-phencyclidine\" target=\"_blank\" rel=\"noopener\">cause coma at high doses</a>.</p><p>Someone who orally consumes ketamine would typically begin to <a href=\"https://doi.org/10.1080/20961790.2017.1285219\" target=\"_blank\" rel=\"noopener\">feel its effects within 20 minutes</a>. If they inhale or inject it, the effects are almost immediate. The primary effects generally wear off in less than an hour, but a person’s senses may remain dulled and their judgment and coordination impaired for several hours afterward.</p><p>Ketamine can cause a slew of other side effects, including delirium, amnesia, increased salivation, abnormal eye movements, high blood pressure and potentially fatal breathing problems. Alcohol and other drugs can <a href=\"https://doi.org/10.3390/ijms23147800\" target=\"_blank\" rel=\"noopener\">interact with ketamine to worsen these effects</a> significantly.</p><p>Ketamine is generally sold illegally as either a colorless, odorless liquid or a white or off-white powder. Either form can be easily and covertly placed into an unsuspecting person’s beverage or food. Ketamine can be snorted, and it can be smoked or vaped on products such as marijuana.</p><h2>Ketamine and Other Drugs in Sexual Assault</h2><p>Research is extremely spotty on how often a perpetrator of rape or sexual assault <a href=\"https://doi.org/10.1016/j.emc.2007.02.008\" target=\"_blank\" rel=\"noopener\">uses a chemical agent</a>—whether ketamine, alcohol or another substance—to alter a victim’s senses. Research suggests that most often both parties <a href=\"https://stacks.cdc.gov/view/cdc/108860\" target=\"_blank\" rel=\"noopener\">use mind-altering substances voluntarily</a>, although the effects of these substances can alter a person’s ability to grant consent.</p><p>Even so, there are numerous reports of perpetrators spiking a victim’s drink or otherwise slipping a drug to them without their knowledge. According to one study, <a href=\"https://www.ojp.gov/library/publications/estimate-incidence-drug-facilitated-sexual-assault-us-final-report\" target=\"_blank\" rel=\"noopener\">4.2% of rape victims were drugged covertly</a>, though how often this actually happens is undoubtedly underreported.</p><p>That’s because it’s very hard to detect drugs taken this way. Most of the substances used to facilitate sexual assaults are rapidly absorbed and metabolized by the body, rendering them difficult to detect in routine urine and blood drug screenings. Another issue is that many days may have elapsed between the victim ingesting the drugs and their subsequent treatment at a medical facility.</p><p>Victims of rape or sexual assault are often reluctant to report incidents because of a sense of embarrassment, guilt or perceived responsibility, or because they may know their attacker. Some may <a href=\"https://theconversation.com/handling-of-rape-allegations-at-cornell-shows-why-so-many-assaults-go-unreported-victims-dont-trust-the-institutions-that-are-supposed-to-help-them-293907\" target=\"_blank\" rel=\"noopener\">not trust that their institution or local law enforcement</a> will support them.</p><p>In my experience, the involvement of ketamine or other drugs invariably makes a bad situation worse—complicating consent, impairing judgment and reducing inhibitions. <a href=\"https://doi.org/10.1016/j.emc.2007.02.008\" target=\"_blank\" rel=\"noopener\">Ketamine causes confusion and drowsiness</a>, and its sedative, hypnotic and memory-erasing properties can diminish a survivor’s recollection of events surrounding the sexual assault.</p><p>The availability of these drugs in the U.S., including on college campuses, has risen sharply—particularly since the early 2010s, as a slew of new substances have emerged and <a href=\"https://doi.org/10.1111/bcp.14236\" target=\"_blank\" rel=\"noopener\">international drug control efforts have not kept up</a>. Without more active education and prevention efforts, as well as better detection methods for these drugs, students will continue to pay the price. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/ketamines-role-in-alleged-cornell-rape-highlights-flood-of-psychoactive-drugs-on-campus-293512\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/ketamines-role-in-alleged-cornell-rape-highlights-flood-of-psychoactive-drugs-on-campus-293512\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: <a href=\"https://www.shutterstock.com/g/WINGWING\" target=\"_blank\" rel=\"noopener\">wing-wing</a></em> / <em>Shutterstock</em></p>"},{"title":"Court declines to restore Biden-era regulation allowing some deportation proceedings to be suspended","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/10/court-declines-to-restore-biden-era-regulation-allowing-some-deportation-proceedings-to-be-suspe/","category":"law","categoryLabel":"Law","wordCount":656,"readingTime":4,"content":"<p>The Supreme Court on Tuesday declined to restore a Biden-era regulation that allows immigration judges to suspend some deportation proceedings. In a brief, unsigned order, the court turned down a <a href=\"https://www.scotusblog.com/cases/city-of-baltimore-maryland-v-texas/\" target=\"_blank\" rel=\"noopener\">request</a> from three cities and a group that provides legal services to immigrants to pause an agreement between Texas and the U.S. Department of Justice that threw out the rule.</p><p>There were no noted dissents.</p><p>The regulation at the center of the dispute, which provides what is known as “administrative closure,” was adopted by the Executive Office for Immigration Review, part of the Department of Justice, in 2024. Under it, immigration judges may suspend some deportation proceedings – for example, to allow a crime victim or witness to seek relief, such as asylum, from the U.S. Citizenship and Immigration Services, which is a separate agency.</p><p>In June of this year, Texas <a href=\"https://clearinghouse.net/doc/172472/\" target=\"_blank\" rel=\"noopener\">went to federal court</a> in Wichita Falls, where its case was assigned to Chief U.S. District Judge Reed O’Connor – the only federal judge in that area. Calling the administrative-closure rule “one part of the Biden-Harris Administration’s campaign to undermine our immigration laws,” it alleged that the EOIR does not have the authority to adopt the administrative-closure rule. Instead, it wrote, federal law requires an immigration judge, at the end of a proceeding, to “decide whether an alien is removable from the United States.”</p><p>Just a few hours after the case was filed, <a href=\"https://clearinghouse.net/doc/173565/\" target=\"_blank\" rel=\"noopener\">the DOJ and Texas asked O’Connor</a> to enter a final judgment for the state. The DOJ also asked him both to throw out the rule altogether and to issue an order making clear that the EOIR could not adopt a similar rule in the future. O’Connor <a href=\"https://clearinghouse.net/doc/172513/\" target=\"_blank\" rel=\"noopener\">granted those requests</a> on the same day.</p><p>On Aug. 7, three cities with large immigrant populations – Baltimore, Maryland; New Haven, Connecticut; and Columbus, Ohio – and Centro Legal de la Raza, which provides legal services to immigrants, <a href=\"https://www.courtlistener.com/docket/73513959/6/state-of-texas-v-united-states-department-of-justice/\" target=\"_blank\" rel=\"noopener\">filed an emergency motion</a> to join the case so that they could defend the administrative-closure rule on appeal, when neither Texas nor the federal government intended to do so. O’Connor <a href=\"https://law.justia.com/cases/federal/district-courts/texas/txndce/7:2026cv00070/421878/23/\" target=\"_blank\" rel=\"noopener\">denied</a> their request on the ground that they lacked a legal right to sue, known as standing. In particular, he rejected the cities’ contention that the elimination of the rule would cost them money because their taxpayers are likely to be deported.</p><p>The challengers then went to the U.S. Court of Appeals for the 5th Circuit, which <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A500/429099/20261009134727752_Baltimore%20v.%20Texas.pdf#page=144\" target=\"_blank\" rel=\"noopener\">rejected</a> their request to block the consent judgment between Texas and the Department of Justice and thereby reinstate the administrative-closure rule while their appeal continued.</p><p>On Oct. 9, the challengers <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A500/429099/20261009134727752_Baltimore%20v.%20Texas.pdf\" target=\"_blank\" rel=\"noopener\">came to the Supreme Court</a>, calling the consent agreement the product of “egregious collusion” and asking the justices to step in. Their attorney, Joshua Salzman of Democracy Forward, argued that permitting the consent agreement to stand could have widespread implications. “If a judgment procured through such open collusion is allowed to remain in effect,” he wrote, “any agency can avoid the strictures of the” federal law governing administrative agencies “by advertising its unwillingness to defend a disfavored regulation and by immediately acquiescing to nationwide relief.”</p><p>Urging the Supreme Court to leave the agreement in place, U.S. Solicitor General D. John Sauer <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A500/430409/20261022153257048_Baltimore_v_Texas_stay_opp.pdf\" target=\"_blank\" rel=\"noopener\">contended</a> that the challengers’ request to pause O’Connor’s ruling “attempts to improperly leverage a clear-cut dispute over” the challengers’ efforts to join the case “into a far-reaching attack on the merits of” the court’s approval of the agreement. For its part, Texas <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A500/430411/20261022155018963_Admin%20Closure-SCOTUS%20Opp%20to%20Stay-FINAL.pdf\" target=\"_blank\" rel=\"noopener\">told the justices</a> that putting O’Connor’s ruling on hold “would revive a rule the district court declared unlawful, renew the fiscal and sovereign injuries Texas alleged, and unsettle a final judgment accepted by the actual parties.”</p><p>Four days after the case was fully briefed, the court denied the challengers’ request without comment.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Court declines to restore Biden-era regulation allowing some deportation proceedings to be suspended</em>, SCOTUSblog (Oct. 27, 2026, 12:49 PM), https://www.scotusblog.com/2026/10/court-declines-to-restore-biden-era-regulation-allowing-some-deportation-proceedings-to-be-suspe/</p>"},{"title":"What Democrats Can Learn From New York’s Data Center Moratorium","source":"Wired","author":"@wired","url":"https://www.wired.com/story/what-democrats-can-learn-new-york-data-center-moratorium/","category":"tech","categoryLabel":"Technology","wordCount":1251,"readingTime":7,"content":"<p><em>Welcome back to</em> <a href=\"https://www.wired.com/tag/power-play/\" target=\"_blank\" rel=\"noopener\">Power Play</a><em>! Each week, senior writer Molly Taft tackles a topic around this midterm season’s biggest issue: data centers. If you’ve got a question or thought for the column, feel free to shoot Molly an email at <a href=\"https://www.wired.com/cdn-cgi/l/email-protection#45282a29293c1a3124233105322c3720216b262a28\" target=\"_blank\" rel=\"noopener\">[email protected]</a> or reach them securely on Signal at mollytaft.76.</em></p><p>When New York became the first state in the country to enact a <a href=\"https://www.wired.com/story/new-york-governor-signs-first-statewide-data-center-moratorium/\" target=\"_blank\" rel=\"noopener\">moratorium on data center development</a>, Adrienne Yocina was excited. For the past two years, the mom of three has been organizing in western Genesee County to stop a 600-megawatt data center from coming to a site close to the Tonawanda Seneca Nation’s reservation and a federal wildlife refuge.</p><p>But almost four months after the one-year moratorium began, Yocina tells me that she’s “getting nervous.” She’s worried that Democratic governor Kathy Hochul won’t sign a stronger bill to impose a stricter moratorium, and is concerned that the state Department of Environmental Conservation is not adequately involved in the process of evaluating data centers in New York.</p><p>“I feel like she’s just trying to shut us up,” she says of Hochul.</p><p>Data centers are at the center of <a href=\"https://www.wired.com/story/midterm-races-decide-data-centers-political-fate/\" target=\"_blank\" rel=\"noopener\">midterm races across the country</a>, with politicians of both parties making promises to enact regulations or moratoriums on development. After next week comes the tough part: Newly elected officials must either break their word or follow through on those promises as they weigh large infrastructure projects coming to their states and residents who say they’ll reject data centers no matter what.</p><p>How will those compromises go—and will they appease voters? New York’s moratorium, and the continued opposition from some groups, may offer clues.</p><p>In July, just two months after dismissing the idea of a <a href=\"https://www.wxxinews.org/new-york-public-news-network/2026-10-27/gov-hochul-once-resisted-a-data-center-pause-now-its-central-to-her-campaign\" target=\"_blank\" rel=\"noopener\">data center moratorium</a>, Hochul signed the nation’s first executive order to put a pause on development. Her order was a compromise. Just weeks prior, the state legislature had passed an omnibus bill that would have implemented a one-year moratorium throughout New York. The bill contained several provisions that made it more aggressive than Hochul’s moratorium, including stricter limits on the size of data centers and a mandate that the Department of Environmental Conservation conduct a thorough environmental impact review of data center operations. Rather than sign the bill, Hochul issued her own order. (The governor has until the end of the year to sign that bill, and her office says they are still looking at it.)</p><p>One of the bill’s State Senate sponsors, Democrat Kristen Gonzalez, has been publicly supportive of Hochul’s moratorium. The governor’s office, Gonzalez says, proactively reached out to her after her bill passed to help design the moratorium for more immediate relief for New Yorkers.</p><p>Gonzalez went on a <a href=\"https://www.nysenate.gov/newsroom/press-releases/2026/kristen-gonzalez/ny-state-senator-kristen-gonzalez-announces-ny-fights?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">data center tour of New York</a> at the end of the summer, talking to residents around the state about their concerns. She told me that the people she talked to overwhelmingly wanted Hochul to go further and implement more aggressive measures to protect communities from data centers.</p><p>“There are local communities statewide that are living near existing data centers, dealing with significant air pollution and noise pollution, who are struggling with rising utility bills and rising water bills,” she told me. “We see the moratorium as a first step, but it can’t be the last.”</p><p>Hochul has a comfortable lead over Republican challenger Bruce Blakeman ahead of Tuesday’s election—something that may have been helped by the moratorium’s passing. In a <a href=\"https://poll.qu.edu/poll-release?releaseid=3967\" target=\"_blank\" rel=\"noopener\">recent Quinnipiac poll</a> of New York voters, 53 percent of respondents said they trusted Hochul to do a better job in handling AI and data centers, compared to just 31 percent trusting Blakeman. Blakeman, who has <a href=\"https://www.syracuse.com/politics/cny/2026/07/gop-candidate-for-governor-blakeman-says-data-centers-are-the-future-criticizes-hochul-moratorium.html\" target=\"_blank\" rel=\"noopener\">voiced support</a> for data centers, called Hochul’s moratorium “crazy” when it was passed in July. His campaign didn’t immediately respond to WIRED’s request for comment.</p><p>Hochul has also touted her tough-on-data-center bona fides on the campaign trail. Early last month, she hosted a roundtable discussion on data centers with agricultural, environmental, and business leaders at a farm in the Hudson Valley. There, she told reporters that she wanted to work with the state legislature to implement more aggressive protections, including banning tax breaks for data centers. At the event, Hochul was flanked by Gonzalez and Representative Alexandria Ocasio-Cortez, one of Washington’s most prominent data center critics.</p><p>I asked Hochul at the event how she anticipates handling continued opposition after her moratorium ends. How does New York balance economic development with community opposition if some people don’t want data centers in their backyards under any circumstances, even with the assurances from the state that Hochul’s office is working to create?</p><p>The purpose of her pause, she said, was that communities should be able to choose. “This is democracy in action,” she said. “If you want it, it should come with all kinds of guardrails and restraints, but if you don’t want it, it doesn’t come.”</p><p>More New Yorkers may end up choosing the latter option. A <a href=\"https://sri.siena.edu/2026/09/23/siena-poll-of-likely-new-york-state-voters-hochul-50-blakeman-41/\" target=\"_blank\" rel=\"noopener\">Siena poll</a> from September found that 63 percent of New Yorkers would oppose data centers being built in their area even after Hochul’s moratorium expires. (It’s even higher for New York Democrats, with 75 percent saying they’d remain opposed to data center development post-moratorium.)</p><p>Many newly elected (or reelected) governors will face a similar dynamic: At least 20 gubernatorial candidates have promised a data center moratorium or pause, according to <a href=\"https://www.multistate.us/insider/2026/9/18/gubernatorial-candidates-split-on-data-center-policy-in-2026\" target=\"_blank\" rel=\"noopener\">research</a> compiled by government relations company MultiState. Even more have promised to regulate the industry more tightly. Formerly data-center-friendly incumbents like Texas’s Greg Abbott and Pennsylvania’s Josh Shapiro have also made pledges to be stricter on their development.</p><p>Come January, new governors will face highly engaged constituents who are finding a political home for the first time in the fight against data centers. That includes Yocina, who says she had never voted in a local election before.</p><p>She says she understands the need for industries and jobs in upstate New York: Her youngest son decided to join the Army after a fruitless job search and is about to be deployed. Now, her organizing group is moving from focusing on just stopping the data center to brainstorming new ideas for the site.</p><p>“We’re trying to figure out what we can say yes to that’s not a data center,” she says.</p><h2>What We’re Writing</h2><p>Buried in Anthropic’s IPO documents filed last week was a startling admission. The tech giant’s plan to develop its own data centers exposes it to financial risk, thanks to its projected reliance on natural gas. Of course, Anthropic isn’t alone in its reliance on gas, and the filing acknowledges that’s a real problem. The heavy demand could “drive up the price of natural gas” and make it harder to purchase. I <a href=\"https://www.wired.com/story/anthropic-ipo-identifies-gas-supply-as-big-near-term-risks/\" target=\"_blank\" rel=\"noopener\">took a look at Anthropic’s plans</a> for data centers and the brewing competition between data centers over natural gas supply in the US.</p><h2>What We’re Reading</h2><ul><li>The Verge’s Gaby Del Valle <a href=\"http://theverge.com/cs/features/1016650/arizona-water-data-center-tsmc\" target=\"_blank\" rel=\"noopener\">takes readers out west</a> for a deep dive on data centers’ water woes in Arizona—and why a massive and thirsty chip manufacturing plant seems to have escaped the public’s ire.</li><li>New <a href=\"https://www.pewresearch.org/short-reads/2026/10/29/on-facebook-and-instagram-political-ads-are-increasingly-critical-of-data-centers/\" target=\"_blank\" rel=\"noopener\">findings from Pew Research Center</a> show that advertisers spent $12 million on political ads mentioning data centers in a 90-day period leading up to the midterms.</li><li>Two professors who study real estate and urban economics <a href=\"https://theconversation.com/we-studied-1-584-data-centers-and-found-the-buildings-full-of-machines-are-tied-to-modest-local-job-growth-293872\" target=\"_blank\" rel=\"noopener\">write in The Conversation</a> about their most recent research on data centers and job creation. Their findings: Data centers lead to modest job growth in certain sectors like transportation and warehousing, but not in local services like restaurants and retail.</li></ul>"}];
