<script>
var articles = [{"title":"SCOTUS litigator Floyd Abrams at 90","source":"SCOTUSblog","author":"Ronald Collins","url":"https://www.scotusblog.com/2026/08/scotus-litigator-floyd-abrams-at-90/","category":"law","categoryLabel":"Law","wordCount":1499,"readingTime":8,"content":"<p>Floyd Abrams’ initials signaled his destiny as a First Amendment lawyer. More than any others, Abrams’ name is synonymous with freedom of speech and the press. Now nine decades into his life journey, I thought it would be good to provide a brief profile of the man. Abrams remains astute, mild-mannered, witty, industrious, and thoroughly dedicated to the <a href=\"https://www.youtube.com/watch?v=abi5io866lc\" target=\"_blank\" rel=\"noopener\">Madisonian promise</a>. That resolve has won him both venerated praise, and fierce criticism.</p><p><strong>The measure of the man</strong></p><p>“When I graduated from law school,” New York Times journalist <a href=\"https://www.nytimes.com/by/adam-liptak\" target=\"_blank\" rel=\"noopener\">Adam Liptak</a> recently told me, “I wanted to work for Floyd Abrams – and I did, spending four years as an associate at his firm. I also hired him when I was an in-house lawyer, covered his arguments as a journalist, and taught courses with him on the First Amendment at Yale and NYU. It is uncontroversial that Floyd is the greatest defender of press freedom in the history of the American judicial system.”</p><p>According to media lawyer <a href=\"https://www.amazon.com/Bad-Faith-Caldwell-Fight-Press/dp/1501790277/ref=sr_1_1?crid=257PAYIGOJERA&amp;dib=eyJ2IjoiMSJ9.hgKLzNUVOKJ2tWCGSg3yWQKJ3iQ_3DQg-7DHDp-OLg2CxwtSYMR05l0OYge12K1M.Ty6dlSOth-dtQ5g-iNa_gNAXeoK01u5qeK7chBxbb9g&amp;dib_tag=se&amp;keywords=In+Bad+Faith+by+Lee+Levine&amp;qid=1783955559&amp;s=books&amp;sprefix=in+bad+faith+by+lee+levine+%2Cstripbooks%2C182&amp;sr=1-1\" target=\"_blank\" rel=\"noopener\">Lee Levine</a>, who has also worked with Abrams, “Time and again over more than half a century, Floyd’s extraordinary skill set – excellent judgment, elegant prose, deep understanding of constitutional theory, and understated but strikingly effective oral advocacy – has protected journalists, strengthened their and our First Amendment rights and, above all else, enhanced American democracy. He inspired a generation of lawyers, myself included, to join the fight.”</p><p><strong>Key tenets of Abrams’ First Amendment philosophy</strong></p><p>As a litigator, press counselor, legal scholar, author, and spokesman for free expression, Floyd Abrams has no modern counterpart. Consider his impact on First Amendment law through a few examples, such as in 1976’s <a href=\"https://www.oyez.org/cases/1975/75-817\" target=\"_blank\" rel=\"noopener\"><em>Nebraska Press Association v. Stuart</em></a>, a press-gag-order case in a fair-trial context. Appearing on behalf of a variety of publishers, broadcasters, and journalists, Abrams (along with <a href=\"https://www.nytimes.com/2016/11/09/us/e-barrett-prettyman-jr-lawyer-who-fortified-desegregation-ruling-dies-at-91.html\" target=\"_blank\" rel=\"noopener\">E. Barrett Prettyman, Jr.</a>) helped establish the principle that gag orders directed to the press are presumptively invalid <a href=\"https://www.law.cornell.edu/wex/prior_restraint#:~:text=In%20First%20Amendment%20law%2C%20prior,permit%20or%20license%20before%20speaking.\" target=\"_blank\" rel=\"noopener\">prior restraints</a>. First Amendment scholars Jerome Barron and C. Thomas Dienes <a href=\"https://www.westacademic.com/Barron-and-Dieness-First-Amendment-Law-in-a-Nutshell-6th-9781685611194\" target=\"_blank\" rel=\"noopener\">concluded</a> that “the <em>Nebraska Press</em> case has to be regarded as a virtual death knell for gag orders by courts against media publications.”</p><p><em>From front left: Lawrence McKay, Floyd Abrams, Bickel, James Goodale, and William Heggerty. (AP Photo/Charles Harrity, The Associated Press.)</em></p><p>His role in working alongside <a href=\"https://en.wikipedia.org/wiki/Alexander_Bickel\" target=\"_blank\" rel=\"noopener\">Alexander Bickel</a> in the <a href=\"https://www.oyez.org/cases/1970/1873\" target=\"_blank\" rel=\"noopener\"><em>Pentagon Papers Case</em></a> represents yet another significant victory regarding prior restraints on the press. As that decision made clear, even when such censorship involves classified information concerning a war, there is a heavy burden of justification required to impose a prior restraint on the press for materials lawfully obtained.</p><p>And then, of course, is <em>Citizens United </em>(but more on that below).</p><p>Abrams’ appellate success is also measurable. He has prevailed in 77% of the First Amendment cases he argued before the court.</p><p>The following are some of the key tenets of how Abrams approaches such cases concerning free speech and the press – as he put it recently to me in an email:</p><blockquote>It’s obviously difficult to set forth themes that would be useful in every case against the press but here are three that I think might more often than not be useful.</blockquote><ul><li><blockquote>The first is the importance to all of what journalists do and the particular importance to the public of what the accused journalists in the case before this jury were writing about.</blockquote></li><li><blockquote>Second, the good faith of the accused journalists and why that good faith should lead to a verdict in the defendant’s favor.</blockquote></li><li><blockquote>Third, the centrality of the First Amendment to the case and how the First Amendment and thus the public would be threatened and ultimately harmed by a verdict or ruling in favor of the plaintiff.</blockquote></li></ul><p>That said, Abrams is not a First Amendment absolutist. Depending on the context, there are certain considerations which he believes should be taken into account, especially when it comes to war and national security, though even there he sets the bar high.</p><p>According to Abrams, “we seem to be and have been in a permanent state of war for some time.” Hence, “we must take special care not to sacrifice freedom of expression, except in the most truly threatening circumstances. . . . Even if we define [any conflict] as one of war[.]” “I would certainly reject any test as loose as the one suggested [by the Supreme Court] in [<a href=\"https://supreme.justia.com/cases/federal/us/249/47/\" target=\"_blank\" rel=\"noopener\"><em>Schenck v. United States</em></a>]. . . Indeed, any importation of words, such as reasonable, and hinder seem to me unacceptable.”</p><p>As for national security, Abrams sides with what Justice William Brennan set out in his concurrence in the <a href=\"https://www.oyez.org/cases/1970/1873\" target=\"_blank\" rel=\"noopener\"><em>Pentagon Papers Case</em></a>: “to obtain ‘even the issuance of an interim restraining order,’ the government was obliged to prove that the publication ‘must <em>inevitably</em>, <em>directly</em> and <em>immediately</em> cause’ [harm].”</p><p><strong>Citizens United</strong></p><p>Abrams’ distinguished career is not without its critics. As he recently put it, “my liberal friends, who are most of my friends, still haven’t forgiven me for my position in” <a href=\"https://www.scotusblog.com/cases/citizens-united-v-federal-election-commission/\" target=\"_blank\" rel=\"noopener\"><em>Citizens United v. Federal Election Commission</em></a>.</p><p>He won that landmark case by a one-vote margin, with the liberal justices dissenting. Yet he conceded this much in a 2010 <a href=\"https://yalelawjournal.org/essay/citizens-united-and-its-critics\" target=\"_blank\" rel=\"noopener\">Yale Law Journal article</a>:</p><blockquote>I do not suggest that no difficult issues are raised in this area. The determination of what constitutes ‘corruption’ in a political context is <a href=\"http://papers.ssrn.com/sol3/papers.cfm?abstract_id=1661967\" target=\"_blank\" rel=\"noopener\">difficult.</a> The dangers of unrestricted corporate spending drowning out the voices of others may seem <a href=\"http://www.washingtonpost.com/wp-dyn/content/article/2010/09/22/AR2010092204665.html\" target=\"_blank\" rel=\"noopener\">unlikely ones to me,</a> but they certainly cannot be discounted out of hand. Nor can it be denied that the potential remains for some increase in what is referred to as ‘the appearance of corruption’ as a result of vastly increased corporate or union involvement in electoral politics – if that, in fact, occurs.</blockquote><p>Such is the <a href=\"https://www.youtube.com/watch?v=CTT8jCpI55E\" target=\"_blank\" rel=\"noopener\">life</a> of a spirited First Amendment lawyer – please some, infuriate others. To please everyone would mean offending no one, which would render the First Amendment meaningless. Risk, after all, is a vital part of freedom. “Each society chooses the risks it is prepared to make . . . As a general matter,” <a href=\"https://repository.law.miami.edu/cgi/viewcontent.cgi?article=2050&amp;context=umlr\" target=\"_blank\" rel=\"noopener\">Abrams stressed</a>, “this country, more than any other in the history of the world, has chosen the risks of allowing free speech, rather than the risks of suppressing it.”</p><p><strong>Onwards</strong></p><p>Floyd Abrams shows few signs of slowing down as he moves towards the century mark. Lawyer, scholar, teacher, writer, and devoted family man, he’s full throttle. Then again, to circle to this article’s beginning, it’s the life for which he was destined.</p><p>Or as he once put it:</p><blockquote>I cannot imagine being more fulfilled doing anything other than being a lawyer. There are some things that are unimaginable – the centerfield slot of the Yankees has always been filled – but of things that are within my imagination, I’ll stick with what I’m doing.</blockquote><p>***</p><p><strong>Sixteen Supreme Court cases and more</strong></p><p>For those further interested in Abrams’ work, including on the First Amendment, consider the following Supreme Court cases in which he was involved:</p><ol><li><a href=\"https://www.scotusblog.com/cases/citizens-united-v-federal-election-commission/\" target=\"_blank\" rel=\"noopener\"><em>Citizens United v. Federal Election Commission</em></a> (2010) (won)</li><li><a href=\"https://www.oyez.org/cases/2003/02-1674\" target=\"_blank\" rel=\"noopener\"><em>McConnell v. Federal Election Commission</em></a> (2003) (won)</li><li><a href=\"https://www.oyez.org/cases/1995/94-1471\" target=\"_blank\" rel=\"noopener\"><em>Varity Corporation v. Howe</em></a> (1996) (lost)</li><li><a href=\"https://www.oyez.org/cases/1990/89-6332\" target=\"_blank\" rel=\"noopener\"><em>Minnick v. Mississippi</em></a> (1990) (won)</li><li><a href=\"https://www.oyez.org/cases/1987/87-65\" target=\"_blank\" rel=\"noopener\"><em>United States v. Providence Journal</em></a> (1988) (won)</li><li><a href=\"https://www.oyez.org/cases/1987/87-5468\" target=\"_blank\" rel=\"noopener\"><em>Johnson v. Mississippi</em></a> (1988) (won)</li><li><a href=\"https://www.oyez.org/cases/1984/83-1632\" target=\"_blank\" rel=\"noopener\"><em>Harper &amp; Row Publishers, Inc. v. Nation Enterprises</em></a> (1985) (won)</li><li><a href=\"https://www.oyez.org/cases/1980/80-195\" target=\"_blank\" rel=\"noopener\"><em>Metromedia Inc. v. City of San Diego</em></a> (1981) (won)</li><li><a href=\"https://www.oyez.org/cases/1980/80-207\" target=\"_blank\" rel=\"noopener\"><em>CBS Inc. v. Federal Communications Commission</em></a> (1981) (lost)</li><li><a href=\"https://www.oyez.org/cases/1978/78-482\" target=\"_blank\" rel=\"noopener\"><em>Smith v. Daily Mail Publishing Co.</em></a> (1979) (won)</li><li><a href=\"https://www.oyez.org/cases/1978/77-1105\" target=\"_blank\" rel=\"noopener\"><em>Herbert v. Lando</em></a> (1979) (lost)</li><li><a href=\"https://www.oyez.org/cases/1977/76-1450\" target=\"_blank\" rel=\"noopener\"><em>Landmark Communications v. Virginia</em></a> (1978) (won)</li><li><a href=\"https://www.oyez.org/cases/1977/76-944\" target=\"_blank\" rel=\"noopener\"><em>Nixon v. Warner Communications, Inc.</em></a> (1978) (lost)</li><li><a href=\"https://www.oyez.org/cases/1975/75-817\" target=\"_blank\" rel=\"noopener\"><em>Nebraska Press Association v. Stuart</em></a> (1976) (won)</li><li><a href=\"https://www.oyez.org/cases/1971/70-85\" target=\"_blank\" rel=\"noopener\"><em>Branzburg v. Hayes</em></a> (1972) (lost)</li><li><a href=\"https://www.oyez.org/cases/1970/1873\" target=\"_blank\" rel=\"noopener\"><em>New York Times Co. v. United States</em></a>(<a href=\"https://www.scotusblog.com/2012/08/online-alexander-bickel-symposium-on-rereading-the-least-dangerous-branch/\" target=\"_blank\" rel=\"noopener\">co-counsel</a>) (1971) (won)</li></ol><p>And then there are his books on free expression: <a href=\"https://www.amazon.com/Soul-First-Amendment-Floyd-Abrams/dp/0300234201/ref=sr_1_1?dib=eyJ2IjoiMSJ9.RN1dWAgpTfBfuj6aYORxsO9YY_486KEP4jdc9Q0siDoHlYJ0RVQo3MO3BJGS3TDUA0sV8tvZrSRo9CTHgUq8g4NGG1Rr-oIUmhgb-y69iBvs1whGzfGHUHCwtsUa7JfnaKWopB5-hYKHoTfGCcHdF5NU8Wa6P2ozZL6V7fn5z9utnvU1fY28YAX4-9wiNyt2nbXd9HKrWqrrP6rPHXLNsG0cgI4EWhGeS3djITjR5gI.doe30Cuid6I1fqC_8KLkIKw7WUrO_RRPQKaTmrhVCcQ&amp;dib_tag=se&amp;keywords=floyd+abrams&amp;qid=1783875547&amp;s=books&amp;sr=1-1\" target=\"_blank\" rel=\"noopener\">The Soul of the First Amendment</a> (2018), <a href=\"https://www.amazon.com/Friend-Court-Front-Lines-Amendment/dp/0300190875/ref=sr_1_2?dib=eyJ2IjoiMSJ9.RN1dWAgpTfBfuj6aYORxsO9YY_486KEP4jdc9Q0siDoHlYJ0RVQo3MO3BJGS3TDUA0sV8tvZrSRo9CTHgUq8g4NGG1Rr-oIUmhgb-y69iBvs1whGzfGHUHCwtsUa7JfnaKWopB5-hYKHoTfGCcHdF5NU8Wa6P2ozZL6V7fn5z9utnvU1fY28YAX4-9wiNyt2nbXd9HKrWqrrP6rPHXLNsG0cgI4EWhGeS3djITjR5gI.doe30Cuid6I1fqC_8KLkIKw7WUrO_RRPQKaTmrhVCcQ&amp;dib_tag=se&amp;keywords=floyd+abrams&amp;qid=1783875547&amp;s=books&amp;sr=1-2\" target=\"_blank\" rel=\"noopener\">Friend of the Court: On the Front Lines with the First Amendment</a> (2013), <a href=\"https://www.amazon.com/Speaking-Freely-Trials-First-Amendment/dp/0143036750/ref=sr_1_3?dib=eyJ2IjoiMSJ9.RN1dWAgpTfBfuj6aYORxsO9YY_486KEP4jdc9Q0siDoHlYJ0RVQo3MO3BJGS3TDUA0sV8tvZrSRo9CTHgUq8g4NGG1Rr-oIUmhgb-y69iBvs1whGzfGHUHCwtsUa7JfnaKWopB5-hYKHoTfGCcHdF5NU8Wa6P2ozZL6V7fn5z9utnvU1fY28YAX4-9wiNyt2nbXd9HKrWqrrP6rPHXLNsG0cgI4EWhGeS3djITjR5gI.doe30Cuid6I1fqC_8KLkIKw7WUrO_RRPQKaTmrhVCcQ&amp;dib_tag=se&amp;keywords=floyd+abrams&amp;qid=1783875547&amp;s=books&amp;sr=1-3\" target=\"_blank\" rel=\"noopener\">Speaking Freely: Trials of the First Amendment</a> (2006), and <a href=\"https://www.amazon.com/dp/0586066810?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback\" target=\"_blank\" rel=\"noopener\">The Right to Know: Granada Guildhall Lectures 1984</a> (1985). Add to that his 25-plus scholarly articles (like“<a href=\"https://columbialawreview.org/content/reviving-the-press-clause/\" target=\"_blank\" rel=\"noopener\">Reviving the Press Clause</a>” in Columbia Law Review (2026)), countless op-eds (such as in <a href=\"https://www.nytimes.com/by/floyd-abrams?page=2\" target=\"_blank\" rel=\"noopener\">The New York Times</a>), his testimony before Congress (regarding <a href=\"https://www.google.com/books/edition/Hate_Crimes_Sentencing_Enhancement_Act_o/wvYnAAAAMAAJ?hl=en\" target=\"_blank\" rel=\"noopener\">proposed hate crimes legislation</a>), his numerous appearances on <a href=\"https://www.c-span.org/search/?searchtype=Videos&amp;sort=Newest&amp;personid%5b%5d=5685\" target=\"_blank\" rel=\"noopener\">C-SPAN</a>, his participation in <a href=\"https://www.youtube.com/watch?v=FxampBAfYKU\" target=\"_blank\" rel=\"noopener\">First Amendment Salons</a>, his involvement in <a href=\"https://www.youtube.com/watch?v=p1W1wfOK1R0\" target=\"_blank\" rel=\"noopener\">reenactments</a> of famous free speech cases, his role-playing as chief justice in <a href=\"https://www.youtube.com/watch?v=_hbu4Sjl5p0\" target=\"_blank\" rel=\"noopener\">moot court</a> free speech cases, and his public lectures (including his <a href=\"https://web.uri.edu/harrington/amanpour/2025/11/13/first-amendment-attorney-floyd-abrams-discusses-the-uniqueness-of-u-s-free-speech-at-uris-amanpour-lecture/\" target=\"_blank\" rel=\"noopener\">2025 Amanpour Lecture</a>). In one such <a href=\"https://www.youtube.com/watch?v=QxKspF_WFao\" target=\"_blank\" rel=\"noopener\">lecture</a> at the Missouri School of Journalism, he was forthright: “I do think that [President Donald Trump] is more hostile to the press than any of his predecessors in American history.”</p><p>To be sure, there is more, but that is a matter for a long-overdue biography. Meanwhile, there is an illuminating PBS documentary titled “<a href=\"https://www.pbs.org/wnet/americanmasters/floyd-abrams-speaking-freely-about-the-documentary/28370/\" target=\"_blank\" rel=\"noopener\">Floyd Abrams: Speaking Freely</a>” (released in 2023, directed by Yael Melamede).</p><p><strong>Recommended Citation: </strong>Ronald Collins, <em>SCOTUS litigator Floyd Abrams at 90</em>, SCOTUSblog (Aug. 17, 2026, 10:00 AM), https://www.scotusblog.com/2026/08/scotus-litigator-floyd-abrams-at-90/</p>"},{"title":"\"Obvious tells and subtle hints\" - Alien: Isolation's lead designer on the lethal variety of The Lost Wild's dinosaurs","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/obvious-tells-and-subtle-hints-alien-isolations-lead-designer-on-the-lethal-variety-of-the-lost-wilds-dinosaurs","category":"gaming","categoryLabel":"Gaming","wordCount":985,"readingTime":5,"content":"<p>Hot, stinking diplodiscourse from Great Ape's Gary Napper</p>\n    \n  \n  \n  \n\n            <p>\r\nFirst-person sneakalot <a href=\"https://www.rockpapershotgun.com/games/the-lost-wild\" target=\"_blank\" rel=\"noopener\">The Lost Wild</a> is about surviving on an island overrun by dinosaurs, from the relatively affable diplodocus to the absolutely intolerable allosaurus. I'm not sure how you survive a brush with an allosaurus, because allosauruses appear to be provoked by any and all objects in their vicinity. \"An area [of the project] I find particularly fascinating is the difference between dinosaur behaviour for each species, and what that could mean for gameplay and character,\" says game director Gary Napper, who joined developers Great Ape Games in 2025 following stints at Rare, Supermassive, and Creative Assembly.\r\n</p>\n<p>\r\n\"Taking the team's expertise and current day understanding of dinosaur findings has allowed us to really lean into some of these theories,\" he continues. \"One of my favourites is a fact that they know that the allosaurus was quite an erratic and aggressive creature, because they found its teeth embedded in things like rocks and logs as well as other creatures, implying that it would just attack or go for anything around it.\" OK, so - what's my exit strategy, when facing an allosaurus? Do I just try to look like the least pugnacious rock?\r\n</p>\n\n<p>\r\nGetting horribly caught out by such differences in temperament is what I'm most looking forward to about Great Ape's debut project. Napper remains best known for lead designing <a href=\"https://www.rockpapershotgun.com/games/alien-isolation\" target=\"_blank\" rel=\"noopener\">Alien: Isolation</a>, in which you sneak past a xenomorph with very reactive and evolving AI; in The Lost Wild, you have to worry about several such large predators, each of which has its own habits and foibles. Naturally, Napper doesn't want to spoil too much, though he does take a moment to dinosplain to me, when I ask how one deals with a Quetzalcoatlus. \"The large winged creature you saw in the trailer is actually a Hatzegopteryx, but very close!\"\r\n</p>\n<p>\r\nAddressing the broader question about behaviour, Napper comments that while \"a level of consistency\" between dinosaurs is needed to avoid totally flummoxing the player, \"we do try to subvert player expectation and attempt to surprise and delight where possible by bending and shaping the experience between species.\" I'm not sure \"delight\" is the word I'd use – I feel like we are teetering on the edge of asking whether dinosaurs spark joy, but then again, I'm the idiot who wouldn't know a Hatzegopteryx from his own mother, so let's roll with the punches.\r\n</p>\n<p>\r\n\"For example, using one type of tool against a dinosaur might give one set of results whereas a different species may react very differently, both surprising and horrifying the player,\" Napper continues. \"We also strive for differences in gameplay rules due to the environment with simple things like light and dark, weather and time of day.\"\r\n</p><p>\r\nIt's hard to say for sure, but it sounds like there will be times when a dinosaur is perfectly aware of you, and the \"stealth\" lies in reassuring the creature that you are harmless - or at least, not worth the trouble. Context is vital. \"Is this a nest or their home?\" Napper says. \"Could they be feeding here? Have they been hunting and are wandering into this area? Where possible we try to provide a very grounded reason for the dinosaur's presence in each area. If we were to do something like this, where the stealth is about not provoking, it would have been because the creature has either eaten recently or sees no threat in the player.\"\r\n</p>\n\n<p>\r\nOne of Great Ape's obvious big challenges is telegraphing the nuances of a dino's mood, without recourse to <a href=\"https://www.rockpapershotgun.com/believable-and-consistent-up-close-what-the-dinosaurs-of-the-lost-wild-share-with-microsofts-cancelled-everwild-according-to-the-designer-who-worked-on-both\" target=\"_blank\" rel=\"noopener\">spell-breaking</a> UI elements such as viewcones and exclamation pop-ups. \"It is a difficult balance to maintain because on one hand you need them to be believable realistic animals, on the other you need some form of information to clearly communicate to the player so they understand the gameplay,\" Napper says. \"We try to attain this balance by having the creatures react and change their behaviours with both obvious tells and subtle hints that the player can read and learn.\r\n</p>\n<p>\r\n\"This gives the game some depth and texture for the patient and observant players who will learn how to deal with and evade these creatures carefully,\" he adds, \"but also doesn't stop players who just want to run in, throw things, scream and panic from having a fun time too.\"\r\n</p><p>\r\nWhen not observing, screaming at, running away from and in rare cases, <a href=\"https://www.rockpapershotgun.com/the-difference-is-not-just-that-you-cant-fight-back-its-that-you-feel-like-you-shouldnt-alien-isolations-lead-designer-wants-you-to-respect-the-dinos-in-the-lost-wild\" target=\"_blank\" rel=\"noopener\">sparing</a> the dinosaurs, you might spend some time wondering why the hell there are dinosaurs at all. The Lost Wild is not, after all, set in the Mesozoic Era. It takes place in the early 2000s. \"I can tell you that the island is owned by a mysterious corporation called Idehama,\" Napper explains. \"They are a large Japanese tech company who engineer large-scale industrial projects, and who originally purchased this island to pursue new methods of energy research. A big part of the game is discovering more about this company, their role in the mystery of dinosaurs on the island, and our main character Saskia's connection to it all.\r\n</p>\n\nImage credit: Annapurna Interactive\n\n<p>\r\nIdehama might be bad news, but they have excellent taste in vintage hardware. The island's various bases date back to the 1990s, which \"gives us a wonderful window of retro tech to explore,\" as Napper enthuses. \"From the early installation buildings featuring old chunky mouse and keyboards, CRT monitors right up to early 2000s tech, including things like pagers, [and] physical upload points that use a tech similar to minidiscs. Through the island there is a lovely mix of tech from these eras that blend together against the backdrop of the unforgiving forest and its inhabitants.\"</p>\n<p>It all sounds dangerously absorbing. Yes, yes - <em>this</em> is how will I probably die in The Lost Wild, when it <a href=\"https://store.steampowered.com/app/1952620/The_Lost_Wild/\" target=\"_blank\" rel=\"noopener\">launches in 2027</a>: running my hands fondly over a dilapidated iMac, while my legs disappear inside an allosaurus.\r\n</p>"},{"title":"AI isn’t close to curing cancer. This startup says it knows what it will take.","source":"TechCrunch","author":"Tim Fernholz","url":"https://techcrunch.com/2026/08/19/ai-isnt-close-to-curing-cancer-this-startup-says-it-knows-what-it-will-take/","category":"tech","categoryLabel":"Technology","wordCount":960,"readingTime":5,"content":"<p>A biotech startup called <a href=\"https://www.vivodyne.com/\" target=\"_blank\" rel=\"noopener\">Vivodyne</a> says the AI drug-discovery industry has a data problem, and that it has built a machine to fix it.</p>\n<p>HIVE, modular robotic labs built by the company, can grow 20 kinds of human tissue, then autonomously dose and monitor them, generating the kind of causal biological data that today’s AI models are missing — data that today mostly comes from animal testing, or studies of single cells or proteins, not living tissue.</p>\n<p>“Absent human testing, what are these [AI] models going to do?” asks Andrei Georgescu, Vivodyne’s CEO and co-founder. “They’re going to cure cancer in mice.”</p>\n<p>Even Anthropic CEO Dario Amodei <a href=\"https://x.com/DarioAmodei/status/2088758819304443967\" target=\"_blank\" rel=\"noopener\">wrote</a> over the weekend that claims that AI will cure cancer have become more cliché than credible — “the thing that will work is <em>actually curing cancer,</em>” as he put it.</p>\n<p>To be fair, the idea that AI will cure cancer is something Amodei himself has tossed out in previous essays; Sam Altman has repeatedly cited curing cancer as a justification for OpenAI’s push toward AGI and ever-larger compute buildouts; and Google DeepMind’s Demis Hassabis <a href=\"https://www.cbsnews.com/news/artificial-intelligence-google-deepmind-ceo-demis-hassabis-60-minutes-transcript/\" target=\"_blank\" rel=\"noopener\">said</a> last year that AI could potentially cure all disease within a decade.</p>\n<p>The actual results remain tepid. A handful of AI-designed drugs have proceeded into human trials — one as far as Phase III, widespread human testing — but the reality is that the roadblocks aren’t necessarily ones that AI can solve today.</p>\n<p>Nobel-prize-winning AlphaFold was a big advance for understanding the building blocks of life, but it has yet to actually produce a new drug. Isomorphic Labs, founded to build on AlphaFold, is expecting its first trials, originally planned for 2025, by the end of this year. In February, the company <a href=\"https://www.isomorphiclabs.com/articles/the-isomorphic-labs-drug-design-engine-unlocks-a-new-frontier\" target=\"_blank\" rel=\"noopener\">wrote</a> that true drug discovery will require “highly accurate predictive models, across an expansive range of biochemical properties and interactions.”</p>\n<p>Georgescu says the space needs “a sanity check” — that existing models don’t have the data to capture the complexity of human biology. It’s a challenge already facing the pharmaceutical industry, where 90% of drugs that are effective enough in animal testing to enter clinical trials don’t receive regulatory approval for humans.</p>\n<p>Vivodyne’s plan is different. Vivodyne was spun out of the University of Pennsylvania in 2021, after Georgescu received a PhD in bioengineering there. The company says its tissues closely match the behavior of real human organs — that its liver cells have 94% predictive accuracy compared to human trials that test for toxicity, its airway tissue matches the behavior of real human tissue 96% of the time, and its bone marrow has achieved 100% concordance in tests of 20 different chemotherapy drugs.</p>\n<p>Last week, the company, which has raised just under $80 million across two rounds led by Khosla Ventures, opened what it calls the world’s largest “human data center” just outside of San Francisco, and Georgescu says his team is already achieving twice the throughput of all the animal trials being held in the U.S.</p>\n\n<p>The idea is to accelerate the path of drug candidates by having a better idea of what will work before going through the expense of a clinical trial, which typically costs tens of millions of dollars. Though it won’t name its partners publicly, Vivodyne says it is working with multiple major pharma companies to solve a problem that Georgescu compares to automotive crash tests: An automaker is typically confident its car will pass NHTSA requirements before testing it, but drugmakers rarely have that same confidence going into a clinical trial, where the vast majority of drugs fail to win FDA approval.</p>\n<p>But there is a larger vision: Georgescu sees his autonomous biology labs as key to generating the kind of causal data that can be used to train new models on human biology. He points to studies like <a href=\"https://www.nature.com/articles/s41592-026-03120-y\" target=\"_blank\" rel=\"noopener\">this one</a>, published in Nature Methods last month, that find no clear data scaling laws when training generative AI models on existing cellular data.</p>\n<p>“All the training is done on static snapshots of these cells, and the models are not conditioned at all by the <em>how</em> a cell got to that state,” Georgescu told TechCrunch. “In other words, the model learns ‘this is cell state A,’ ‘this is cell state B,’ but never ‘cell state B is the effect of inflaming cell state A.’”</p>\n<p>Vivodyne’s HIVE machines, however, are tracking hundreds of thousands of ongoing experiments where diseased tissue is exposed to some stimulus, which Georgescu expects to provide the kind of reinforcement learning that will produce AI models that understand human biology enough to make more meaningful progress in healthcare.</p>\n<p>Georgescu believes that will be key not just for today’s medicine challenges, but also for a future where complex diseases require drugs that, unlike the majority of those available today, target multiple pathways. </p>\n<p>“If we want combination therapies, the space that has to be searched explodes — it can’t be an experimental approach,” he told TechCrunch. “You have to say, ‘I want this effect to happen, so what cause should I invoke?’ Establishing causality in human biology is the basis of all of this.”</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t<p>\n\t\tTim Fernholz is a journalist who writes about technology, finance and public policy. He has closely covered the rise of the private space industry and is the author of  Rocket Billionaires: Elon Musk, Jeff Bezos and the New Space Race. Formerly, he was a senior reporter at Quartz, the global business news site, for more than a decade, and began his career as a political reporter in Washington, D.C. \nYou can contact or verify outreach from Tim by emailing tim.fernholz@techcrunch.com or via an encrypted message to tim_fernholz.21 on Signal.\r\n\t</p>\n\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/tim-fernholz/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Why It Might Be Time to Rethink the Human Family Tree","source":"Nautilus","author":"","url":"https://nautil.us/why-it-might-be-time-to-rethink-the-human-family-tree-1283985/","category":"fun","categoryLabel":"Interesting Reads","wordCount":951,"readingTime":5,"content":"<p>Humanity’s family tree is long and tangled. Scientists sort our ancient relatives into three familiar groups: <em>Homo</em>, <em>Australopithecus</em>, and <em>Paranthropus</em>.</p><p>Featured Video</p><p>Each of these is a “genus,” the rank just above a species. (In <em>Homo sapiens</em>, <em>Homo</em> is the genus and <em>sapiens</em> is the species.)</p><p>These names dominate how we talk about human origins. But new fossils, advances in genetic analysis, and more rigorous methods for figuring out who’s related to whom show these groupings don’t really reflect the true shape of our family tree.</p><p>Is it therefore time to come up with a new way to classify humans and our closely related extinct relatives? As I argue in a new paper in the <a href=\"https://doi.org/10.1002/ajpa.70344\" target=\"_blank\" rel=\"noopener\"><em>American Journal of Biological Anthropology</em></a>, the current system is overdue for revision.</p><p><strong>Finding family branches</strong></p><p>The core problem is the current groups often don’t represent real family branches—what scientists call “clades.” A clade is one common ancestor and every one of its descendants.</p><p>There’s a second issue too. Ideally, a genus should also tell us something about the behavior, key traits, or way of life shared by all its member species.</p><p><em>Australopithecus</em> (which includes <a href=\"https://nautil.us/lucy-at-50-990900\" target=\"_blank\" rel=\"noopener\">the famous “Lucy” skeleton</a>) is the clearest case. Large-scale analyses consistently find this genus isn’t a real family branch at all.</p><p>The problem traces back to how the genus was originally defined—not by shared ancestry, but by shared lifestyle or appearance. Recent fossils show traits such as brain size and gait, as well as diet and behavior, don’t map cleanly onto the actual family tree.</p><p><strong>Distinctive human traits are hard to find</strong></p><p><em>Homo</em> has its own problems. Traits once thought to define our genus, such as large brains, tool use and dietary shifts, and committed full-time land-dwelling bipedalism, have been undercut <a href=\"https://doi.org/10.1111/joa.14208\" target=\"_blank\" rel=\"noopener\">by more recent discoveries</a>. Species such as <em>Homo naledi</em> and <a href=\"https://www.science.org/doi/full/10.1126/sciadv.aeb7219\" target=\"_blank\" rel=\"noopener\"><em>Homo floresiensis</em> (the so-called “hobbit” species)</a> pair small brains and other “primitive” features with traits typical of other <em>Homo</em> species.</p><p>It’s now hard to name a single feature shared by all <em>Homo</em> species not also found in some <em>Paranthropus</em> or <em>Australopithecus</em> species. That’s because different body parts evolve at different rates and directions, in what is called mosaic evolution. Traits also tend to evolve more than once, independently, in different closely related lineages facing similar pressures.</p><p>What’s more, key behaviors we associate with being human emerged much later than the genus itself did. The earliest members of <em>Homo</em>, as currently defined, include very small-brained species that may even have evolved independently from different <em>Australopithecus</em> lineages. The small-brained, later-surviving species mentioned above may likewise have surprisingly deep, separate roots.</p><p>Even <em>Paranthropus</em>, arguably the most physically distinctive of the three, known for its heavy jaws and huge molars, isn’t safe. Those features have long been read as adaptations for eating hard foods such as nuts, but evidence now suggests eastern and southern African species ate quite differently from one another, and <a href=\"https://theconversation.com/fossil-tooth-fractures-and-microscopic-detail-of-enamel-offer-new-clues-about-human-diet-and-evolution-163653\" target=\"_blank\" rel=\"noopener\">neither relied heavily on hard foods</a>.</p><p>Some researchers argue the group may not even be a single lineage, but rather two independent regional groups that evolved oversized teeth, meaning <em>Paranthropus</em> would not be a real family branch either, although most researchers today think this group is the most <a href=\"https://link.springer.com/chapter/10.1007/978-3-032-05485-2_22\" target=\"_blank\" rel=\"noopener\">likely to be a genuine clade out of the three</a>.</p><p>Taken together, there’s now little anatomical, behavioral, or ecological evidence to justify keeping these three genera.</p><p><strong>Why classification matters</strong></p><p>This may sound like an abstract semantic question. But when genus names don’t reflect real relationships, they can obscure patterns of descent, overstate differences between groups, and reinforce outdated “primitive versus advanced” thinking. With a fast-growing fossil record and better methods for reconstructing family trees, the gap has become too large to ignore.</p><p>One solution is to fold <em>Australopithecus</em> and <em>Paranthropus</em> into a single, much larger <em>Homo</em> genus, which would represent a real and complete branch of the family tree. This would fix the “not a real clade” problem, align our classification with the way we treat non-human species, and better account for interbreeding between closely related lineages over the past few million years.</p><p>Changing the classification would have costs. We’d lose some intuitive distinctions researchers rely on, especially the ecological and physical uniqueness of <em>Paranthropus</em> and later, large-brained <em>Homo</em>.</p><p><strong>Language must keep up with understanding</strong></p><p>The fossil record seems to be increasingly showing a large, branching burst of evolution beginning around 4 million years ago, with diet, brain size, movement, and tooth size all varying substantially among groups in ways that don’t necessarily map neatly onto their true relationships. A group this large and complex, shaped by migration and repeated rapid bursts of evolution in particular traits and behaviors, is best captured under a single genus.</p><p>Our everyday language is changing too. Humans were only formally recognized in recent decades as great apes—in the sense of being placed in the same family as chimps, gorillas and orangutans (Hominidae)—yet “ape” in casual usage still often excludes humans.</p><p>Similarly, “monkey” is often assumed to be a genuine evolutionary group, but isn’t. New World monkeys are more distantly related to Old World monkeys and apes than those two groups are to each other. Someone who consistently hears “monkeys, apes, and humans” may reasonably draw wrong conclusions about our evolutionary relationships.</p><p>We are therefore in a transition period in how we discuss our place in the primate family tree, both in science and in everyday language. As biology increasingly embraces taxonomy that reflects genuine evolutionary relationships, perhaps it is time for our terminology, and the way we talk about ourselves, to catch up. </p><p><em>This article is republished from <a href=\"https://theconversation.com/\" target=\"_blank\" rel=\"noopener\">The Conversation</a> under a Creative Commons license. Read the <a href=\"https://theconversation.com/why-it-might-be-time-to-rethink-the-human-family-tree-289819\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Ian Towle, CC BY</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
