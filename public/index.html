<style>

  --accent-light: #E8EDF4;

  --warning-bg: #FFF8F0;

  --swap-bg-hover: #DDE2EA;
}

  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

  --bg: #191C22;
  --bg-card: #1F232B;

  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;

  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent-light: #E8EDF4;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Sick of grinding for upgrade materials like leather and iron in Onimusha: Way of the Sword? Good news: you can buy a lot of them","source":"PC Gamer","author":"Wes Fenlon","url":"https://www.pcgamer.com/games/action/onimusha-leather-tempered-iron-materials-grind-red-souls/","category":"gaming","categoryLabel":"Gaming","wordCount":998,"readingTime":5,"content":"<p><a href=\"https://www.pcgamer.com/onimusha-way-of-the-sword/\" target=\"_blank\" rel=\"noopener\">Onimusha: Way of the Sword</a> is the latest victim of the dreaded AAA videogame disease: <em>Padded Runtime Via Unsatisfying Upgrade Materials</em>. It could be a lot worse: thankfully there's no level gating in Onimusha that requires you to accrue an arbitrary set of stats before you can tackle a particular quest. It's not an RPG, and I'm sure as soon as Twitch streamers get their hands on it they'll be flexing on the hardest bosses without ever upgrading their gear by a single percentage point.</p><p>But for us mortals, Onimusha's runtime is padded out by a pretty boring hub world full of pretty boring upgrade materials like cotton and iron that you use to very, very slowly increase your damage, health, stamina, and Oni power gauge. It's a dull system that doesn't evolve a single bit over the entire game. There are also rarer upgrade materials that you use to unlock abilities and enhancements on the skill tree.</p><p>This structure encourages you to spend quite a few hours playing the least fun bits of Onimusha, but I do have some good news: there's a way to bypass some of the tedium that you can easily overlook.</p><h2>Buy key upgrade materials from Yorimasa's shrine</h2><p>A few hours into Onimusha: Way of the Sword, you'll complete a quest to purify Yasui Konpiragu shrine, saving its guardian Oni spirit from an evil Genma infestation. Once done, Yorimasa will begin selling you items for red souls, the standard \"currency\" you accrue from killing enemies. If you're anything like me, you'll take a cursory look at what's for sale, go \"I don't need any of this stuff right now\" and then go play about 10 more hours of Onimusha without bothering to revisit the shrine.</p><p>Don't do that! Check back in after you complete every major story mission, because Yorimasa's Monument expands the shop inventory several times throughout the game. And after awhile he'll begin stocking some of the key crafting items, including:</p><ul><li>Leather</li><li>Fine Silk</li><li>Tempered Iron</li><li>Tamahagane</li><li>Malacite Mass</li><li>Byakue's Talisman</li><li>Dohatsu-ten's Horn</li></ul><p>Yorimasa doesn't sell all these right at the start, but early on you'll probably be getting the basics like cotton cloth and regular iron at a pretty steady clip, and won't need as many of these rarer materials. There are five upgrade tiers for your clothing, sword, and gauntlet, though, each of which require a substantial number of materials to work your way through. Unless you spend hours and hours doing sidequests in Kyoto and chasing down every shiny chest your Oni vision highlights for you, you're going to need more of these items than you accrue naturally throughout the game. (Even putting around 35 hours into Onimusha I didn't quite max out any of my gear.)</p><p>By the mid- and late-game, at least, you can supplement your findings with some stock bought from Yorimasa's finite supply. If you have the red souls, I recommend buying as many as you can; hunting for them really drags down Onimusha's pacing.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Unfortunately, this is also a very quick way to go broke.</p><h2>Okay, so how do I get more red souls? </h2><p>The higher tier upgrade items can cost upwards of 8,000 souls, so even after spending a few hours on a big story quest killing enemies you'll blow through your soul wallet by upgrading a couple skill tree nodes and buying some materials. If you don't want to run into a late game cash crunch, here are a few tips:</p><ul><li><strong>Spec into the skill tree node that increases red soul rewards: </strong>It's not the sexiest option up front, but prioritize this early on so that you start earning more souls sooner so you can buy your way through the skill tree later</li><li><strong>Use Soul Suckers before big fights:</strong> These are the sorts of inventory items I have a bad habit of ignoring. Don't be like me: stick the red Soul Sucker in your Hozuki pouch and use it right before you carve through a big pile of scrub Genma to up your payout. If you're confident, it's also worth using one when you've got a Byakue or Dohatsu-ten close to death, then follow-up with the next tip for an even better reward.</li><li><strong>Finish off enemies with the Flashing Void:</strong> While you won't get this Oni armament until later in the game, using it as a finisher nets you more red souls. Do that! Otherwise I know you're just going to be sitting on that Oni meter saving it for the \"right\" moment.</li><li><strong>Upgrade the Reaper's Charm if you really plan to grind: </strong>I'll be up front and say that I didn't do this myself, because I didn't get my hands on the Reaper's Charm until I was far enough into Onimusha to be pretty over fighting the basic baddies, and reckoned the investment wouldn't pay out. But if you keep this charm equipped to a slot from the moment you get it, you can maximize your red souls earned with a baseline 15% buff even before taking advantage of the tips above. Just keep in mind there are only so many upgrade materials Yorimasa will sell you before you go all-in grinding for souls.</li></ul>\n\n<p>Wes has been covering games and hardware for more than 10 years, first at tech sites like <a href=\"https://www.nytimes.com/wirecutter/\" target=\"_blank\" rel=\"noopener\">The Wirecutter</a> and <a href=\"https://www.tested.com/\" target=\"_blank\" rel=\"noopener\">Tested</a> before joining the PC Gamer team in 2014. Wes plays a little bit of everything, but he'll always jump at the chance to cover emulation and Japanese games.</p><p>When he's not obsessively optimizing and re-optimizing a tangle of conveyor belts in Satisfactory (it's really becoming a problem), he's probably playing a 20-year-old Final Fantasy or some opaque ASCII roguelike. With a focus on writing and editing features, he seeks out personal stories and in-depth histories from the corners of PC gaming and its niche communities. 50% pizza by volume (deep dish, to be specific).</p>"},{"title":"Why the Netherlands pulled 86 tonnes of gold from US central bank","source":"Hacker News Best","author":"https://www.abc.net.au/news/luke-cooper/104477724","url":"https://www.abc.net.au/news/2026-09-04/why-the-netherlands-moved-its-gold-from-us-and-canada/107111990","category":"tech","categoryLabel":"Technology","wordCount":1090,"readingTime":6,"content":"<p>The central bank of the Netherlands has moved dozens of tonnes of its gold out of the United States and Canada.</p><p>The De Nederlandsche Bank (DNB) said in a statement the removal aimed to boost the country's \"crisis preparedness\" amid \"increasing geopolitical unrest\".</p><p>Experts say that rhetoric appears inherently related to the abrasiveness of the Trump administration towards traditional allies.</p><h2>Dutch plans golden 'anchor of trust'</h2><p>The DNB said the movement of gold out of North America was aimed to ensure the Netherlands's reserves were \"more readily available for use in a crisis\".</p><p>Between March and August this year, 86 tonnes of a total 313 tonnes of gold held in the US and Canada were moved to the Bank of England in central London.</p><p>\"Gold that is held with the Bank of England must meet modern international trade standards and is regarded as the world's most easily tradable gold,\" the DNB statement said.</p><p>\"[It] will therefore be the most readily available for DNB in a crisis situation.</p><p>\"The gold reserves held in New York and Ottawa cannot be utilised as quickly and directly in such a situation.\"</p><p>The bank also said it was within Dutch interests to have quicker access to the reserves because gold was seen as \"an anchor of trust\" and \"ideally suited to hedge extreme systemic risks\".</p><p>DNB governor Olaf Sleijpen said the decision increased the reserves' economic usability but he did not say why the bank believed the Netherlands needed to increase its crisis preparedness.</p><blockquote>\"We expect that we will never need to use them, but we do need to strengthen our resilience and preparedness,\"</blockquote><p>  he said.</p><p>The Netherlands's gold reserves totalled 612.4 tonnes, valued at 72.2 billion euros ($116.7 billion) in 2025.</p><p>The bars are held in the Dutch town of Zeist, as well as London, the US Federal Reserve in New York City and the Bank of Canada in Ottawa.</p><p>During the transfer, 59 tonnes of gold held in New York were sold by the DNB, which then bought the same amount of bullion bars in London for storage in the Bank of England.</p><p>Another 27 tonnes held in the US and Canada were physically shipped to Zeist, and \"a similar quantity\" then moved to the United Kingdom.</p><p>The DNB said combining physical shipments with a buy-and-sell process lowered the risks associated with gold relocation and was more cost-effective.</p><p>\"Experience of both approaches will be useful in the event that another relocation is required during a potential future crisis and one of the two approaches proves impossible due to circumstances at the time,\" it said.</p><p>The Bank of England stores gold for central banks and is home to the world's largest over-the-counter gold trading hub, where participants trade directly with one another rather than via an exchange.</p><h2>What is the 'unrest'?</h2><p>Threats made by the Trump administration against traditional allies such as Canada and Greenland appear to be the driving force behind the DNB's decision said Australia Institute international and security affairs director Dr Emma Shortis.</p><p>\"Trump has shown himself entirely willing to trash the established norms and rules of international politics,\" she said.</p><p>\"Having those reserves in the United States is a potential vulnerability.</p><p>\"You can absolutely imagine a scenario where, for whatever reason, the Trump administration decides to hold onto them.\"</p><p>Dr Shortis described the removal as \"strategic\" to protect Dutch resources and said it could reflect rising European concerns about the independence of the US Federal Reserve under Mr Trump.</p><blockquote>\"That's absolutely a reflection of the catastrophic loss of trust in the United States in Europe,\"</blockquote><p>  she said.</p><p>\"We have every reason to think, based on evidence of what the Trump administration has already done, that [it is] entirely willing to use advantages they have, like gold reserves stored in the United States, as weapons against traditional allies.\"</p><p>Mr Trump has previously voiced disappointment <a href=\"https://www.abc.net.au/news/2026-07-08/nato-reveals-arms-deals-at-summit/106890932\" target=\"_blank\" rel=\"noopener\">with the European Union and NATO</a>, implemented harsh tariffs against various European nations and raised the prospect of a <a href=\"https://www.abc.net.au/news/2026-05-20/greenland-not-for-sale-prime-minister-says/106700172\" target=\"_blank\" rel=\"noopener\">US seizure of Greenland</a>.</p><p>Since the beginning of his second presidential term, he has also pledged to <a href=\"https://www.abc.net.au/news/2026-08-23/donald-trump-hits-back-at-canada-over-tariffs-mark-carney/107069122\" target=\"_blank\" rel=\"noopener\">make Canada the \"51st state\" of America</a>.</p><p>Dr Shortis acknowledged the impacts of the Russia-Ukraine war, which is ongoing after four years of fighting, may have also influenced the DNB decision.</p><h2>What were the economics behind the decision?</h2><p>Central banks are growing less willing to have their finances held by foreign nations, according to Rabobank senior market strategist Benjamin Picton.</p><p>\"Gold is a zero-counterparty asset, so if you buy a US Treasury and you hold that as your reserve assets at your central bank your counterparty is the US Federal Reserve or the US Treasury,\" he said.</p><p>\"You're relying on them to make payments. There's a credit risk associated with that.\"</p><p>He said the DNB move may reflect growing economic sentiment within Europe that opposes the Trump administration's policies.</p><p>\"There's more suspicion than there used to be … and that is because the United States is leaning on Europe to do more,\" he said.</p><p>\"We do have this recent context where the United States has developed very sharp elbows when it comes to demands on allies.</p><p>\"Europe is starting to respond to that by trying to conduct itself more independently.</p><blockquote>\"It's changing times, and we're seeing the structure of the financial system changing.\"</blockquote><h2>Have others previously moved gold?</h2><p>Yes, greater pushes for gold repatriation between countries have consistently been raised throughout the past decade.</p><p>In April, the Banque de France <a href=\"https://www.banque-france.fr/en/news/banque-de-france-2025-results\" target=\"_blank\" rel=\"noopener\">announced</a> 129 tonnes, or five per cent, of French reserves held in New York were sold in 2025 and replaced by gold later bought in Europe and stored in Paris.</p><p>The bank said the sale generated a capital profit of 11 billion euros ($17.8 billion). Governor Francois Villeroy de Galhau said in March the decision was not politically motivated.</p><p>The Deutsche Bundesbank, Germany's central bank, also repatriated 674 tonnes of its gold reserves from Paris and New York <a href=\"https://www.bundesbank.de/en/press/press-releases/deutsche-bundesbank-s-new-storage-plan-for-germany-s-gold-reserves-666086\" target=\"_blank\" rel=\"noopener\">between 2013 and 2017</a>.</p><p>In January, several German economists also raised concerns about the unpredictability of Mr Trump and encouraged the repatriation of the nation's remaining 1,236 tonnes of gold still held in New York.</p><p>Austria, Italy and Türkiye have also signalled desires to repatriate more of their gold held abroad, with Istanbul withdrawing all of its reserves held in New York in 2018.</p><p>The issue has also been long fought-for by Venezuela, which has been trying for almost 20 years to secure almost $3 billion worth of its gold <a href=\"https://www.abc.net.au/news/2026-04-12/venezuela-gold-reserves-history-explained/106516434\" target=\"_blank\" rel=\"noopener\">still stored in the Bank of England</a>.</p><p><strong>ABC/Reuters</strong></p>"},{"title":"Puerto Rico Has Rational Basis for Allowing Only Two Genders for Birth Certificate Gender Changes","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/03/puerto-rico-has-rational-basis-for-allowing-only-two-genders-for-birth-certificate-gender-changes/","category":"law","categoryLabel":"Law","wordCount":738,"readingTime":4,"content":"<p>From Tuesday's decision by Judge Lara Montecalvo, joined by Chief Judge David Barron and Judge Sandra Lynch, in <a href=\"https://www.ca1.uscourts.gov/sites/ca1/files/opnfiles/25-1638P-01A.pdf\" target=\"_blank\" rel=\"noopener\"><em>Díaz v. Colón</em></a>:</p>\n<blockquote><p>In its summary judgment order, the district court held that Plaintiffs were entitled to relief under the Equal Protection Clause of the Fourteenth Amendment. {[T]he district court <em>only</em> reached Plaintiffs' claim under the Equal Protection Clause; it did not reach Plaintiffs' claims under the Due Process Clause or the First Amendment of the U.S. Constitution and Puerto Rico Constitution.}</p>\n<p>Explaining that the Application for Gender Change gives \"an option for binary applicants to choose a gender marker which aligns with their true gender, but does not provide [such] an option\" for \"nonbinary individuals,\" the district court concluded that Puerto Rico's \"Birth Certificate Policy\" creates a classification on its face between \"people with a binary gender identity\" and \"nonbinary people.\" The district court also concluded that it did not need to decide which level of scrutiny applied to Puerto Rico's Birth Certificate Policy because it held that the Policy did not survive the lowest level of scrutiny—rational scrutiny….</p>\n<p>Under [the]\"forgiving\" standard [set forth by past cases], we conclude that Puerto Rico's Birth Certificate Policy is supported by a rational basis….</p></blockquote>\n<blockquote><p>Plaintiffs' argument is founded on current Puerto Rico law, which permits transgender binary people to update the gender on their birth certificates. But Puerto Rico law allows this update because it responded to the <em>Arroyo González</em> v.<em> Nevares </em>(D.P.R. 2018) holding that the policy in effect at the time violated transgender binary individuals' privacy rights.</p>\n<p>Unlike the transgender binary plaintiffs in <em>Arroyo González</em>, … Plaintiffs conceded that the Birth Certificate Policy does not violate the informational privacy right that <em>Arroyo González</em> contemplated, recognizing that a nonbinary gender marker inherently discloses a person's nonbinary status. Plaintiffs also fail to develop a separate argument that Puerto Rico's interest in protecting privacy rights is not furthered by the Birth Certificate Policy and its challenged classification between transgender binary people and transgender nonbinary people.</p>\n<p>Puerto Rico has a legitimate interest in protecting the privacy rights of people born in Puerto Rico, and as Plaintiffs have neither argued nor demonstrated that the Birth Certificate Policy infringes on their privacy rights or that privacy rights are not furthered by the Policy, there is a rational relationship between the challenged classification and this legitimate interest. It is thus conceivably rational for Puerto Rico to not update transgender nonbinary people's birth certificates while updating transgender binary people's birth certificates.</p>\n<p>For the foregoing reasons, we vacate the district court's order and remand to the district court for further proceedings consistent with this opinion.</p></blockquote>\n<p>Here's more from the opinion about just how forgiving the rational basis test is:</p>\n<blockquote><p>Under the rational basis standard, government conduct \"is presumed to be valid and will be sustained if the classification drawn by the statute is rationally related to a legitimate state interest.\" The Supreme Court has recently, in <em>U.S. </em>v. <em>Skrmetti</em> (2025), established the binding standards for rational basis review in an equal protection challenge:</p>\n<blockquote><p>We have reconciled the principle of equal protection with the reality of legislative classification by holding that, \"if a law neither burdens a fundamental right nor targets a suspect class, we will uphold the legislative classification so long as it bears a rational relation to some legitimate end.\" We generally afford such laws \"wide latitude\" under this rational basis review, acknowledging that \"the Constitution presumes that even improvident decisions will eventually be rectified by the democratic processes.\"</p></blockquote>\n<p>It went on to hold:</p>\n<blockquote><p>The rational basis inquiry \"employs a relatively relaxed standard reflecting the Court's awareness that the drawing of lines that create distinctions is peculiarly a legislative task and an unavoidable one.\" Under this standard, we will uphold a statutory classification so long as there is \"any reasonably conceivable state of facts that could provide a rational basis for the classification.\" Where there exist \"plausible reasons\" for the relevant government action, \"our inquiry is at an end.\"</p></blockquote>\n<p>And it explained that:</p>\n<blockquote><p>\"[T]he fact the line might have been drawn differently at some points is a matter for legislative, rather than judicial, consideration.\"</p></blockquote>\n<p>As we have explained, \"[t]he question is not what went on in the mind of the [government] actor but whether anyone, including the judge, can conceive of a rational reason for such a classification.\" …</p></blockquote>\n<p>Puerto Rico Solicitor General Omar Andino-Figueroa and Deputy Solicitor General Frank A. Rosado Méndez represent Puerto Rico.</p>"},{"title":"The Anti-A.I.-Ad Ad Campaign","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/14/the-anti-ai-ad-ad-campaign","category":"fun","categoryLabel":"Interesting Reads","wordCount":657,"readingTime":4,"content":"<p>Ambiguity is generally not welcome on the subway. Are those seats empty for a neutral reason or an unpleasant reason? Is the person sitting across from me dangerous or just eccentric? That stain is . . . what, exactly? But one sweltering noontime at the West Fourth Street station, three flights down on the Brooklyn-bound B-D-F-M platform, ambiguity was the point. Two comedians, Harris Alterman and Dave Ross, were taking videos of themselves hanging big print advertisements for nonexistent tech companies on the back and sides of an abandoned newsstand. The ads conveyed just enough Silicon Valley messianism to be believable, and just enough absurdity to be funny. Or maybe it was the other way around? One read “UnderwAIr: Panties that think.” Another depicted a gold coffin engraved with a dollar sign. The copy: “Grieving? Trade on it. WakeMarket.”</p><p>It was Alterman and Ross’s second time pulling this stunt. A video of an earlier round of fake subway tech ads had gone viral in June, earning more than five million views on Instagram. (The first batch was even more absurd: “What if forks were spoons? Cutlery.ai” and “We put the Q in QR1777. FiveTable.”) Today, the collaborators were dressed identically in black shorts and white T-shirts that read “<em>AI.CONGLOMERATE</em>,” the pretend parent company for their pretend roster of startups. The pair had a lot on their plate: not only shooting the video but also prepping for a happening at the newsstand, which Al Mullen, a friend and a fellow-comedian, was transforming into a kind of art installation (with the M.T.A.’s blessing and a grant from an organization funding small projects to improve the city). Alterman and Ross were going to take it over one Saturday for a fake-A.I.-palooza.</p><p>The ads were printed on large vinyl sheets, and Alterman and Ross were hanging them with low-tech loops of duct tape. (Each ad is a one-off that Alterman and Ross remove when they’re done; the jokes live online, not on subway walls.) It wasn’t hard work, but the platform’s kiln-like conditions sapped their stamina, as well as the tape’s stickiness. People waiting for trains seemed not quite sure how to take the ads. A man with dreadlocks contemplated the promise of “the world’s first wearable AI grandfather.” (This was a parody of an actual product, a talking A.I. pendant called Friend that retails for two hundred and forty-nine dollars.) Was an A.I. grandfather something the man might want? “Get the fuck out,” he responded when asked.</p><p>Alterman, thirty-four, and Ross, forty-three, were friends from the comedy circuit before they collaborated. They look a bit alike, both with beards and thoughtful demeanors, but Alterman is marginally more hirsute and possesses an unexpectedly high-pitched laugh, whereas Ross wears glasses and is more voluble. Both have worked techy jobs—Alterman as a social-media manager, and Ross as a website designer. The fake ad campaign germinated about a year ago, when Alterman began noticing subway ads for A.I. companies that annoyed him with their promises to make existence easier, even frictionless. The idea seemed to be that “eventually you do nothing,” he said. “Your life lives itself.” Another quirk he noticed: the ads were often impenetrable to non-techies. “They all use the same words,” he said. “It’s the same voice, which I’ve called slop voice.” He and Ross compiled a long list of terms they’d spotted in the wild—“prompt,” “next gen,” “merging,” “deck,” “one click”—and from there “we basically just do Mad Libs, where we put different words in different orders until it makes us laugh.”</p><p>“Blank plus blank equals blank—that’s one of our favorites,” Ross said.</p><p>“From blank to blank in just one blank,” Alterman added. He claimed that they’d come up with their first batch of ads in an hour.</p><p>Ross, who’d executed the designs, called that an exaggeration, but maybe not by much. “It was fast, for sure,” he said. “We’ve been thinking about it for a long time.”</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
