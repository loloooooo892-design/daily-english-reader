<script>
var articles = [{"title":"Even \"Trumpy Judges\" and \"Woke Judges\" Might Know More Law Than You Do","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/10/29/even-trumpy-judges-and-woke-judges-might-know-more-law-than-you-do/","category":"law","categoryLabel":"Law","wordCount":943,"readingTime":5,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/10/29/even-trumpy-judges-and-woke-judges-might-know-more-law-than-you-do/\" target=\"_blank\" rel=\"noopener\">Even \"Trumpy Judges\" and \"Woke Judges\" Might Know More Law Than You Do</a>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t10.29.2026 3:42 PM\n</p>\n\t</h2>\n\t\n\t\t<p>I appreciate that many people are skeptical about judges. Indeed, it's good that people take with a grain of salt the statements of government officials, including judges. Judges are human, and humans make mistakes and have prejudices and blind spots.</p>\n<p>At the same time, judges are generally quite well-trained lawyers, and know a good deal about what they're writing about. Conventional wisdom holds that federal judges generally are particularly well-qualified (of course, with exceptions, as is true for all institutions). Federal judges also generally employ quite well-qualified law clerks, who do much of the  research and initial opinion drafting.</p>\n<p>This means that, for all the risk of error and ideological bias, judges generally (though not always) know what they're talking about in their legal analysis. They tend to particularly know more than non-lawyers, but also often more than lawyers who aren't specialists in the particular field. You might assume that some judge is \"woke\" or \"Trumpy\" or what have you, but there's a pretty good chance that the judge's legal analysis is still correct.</p>\n<p>This post was prompted by a comment I saw on the <a href=\"https://reason.com/volokh/2026/10/29/eric-coomer-of-dominion-voting-loses-libel-lawsuit-over-the-deep-rig/\" target=\"_blank\" rel=\"noopener\">Eric Coomer (of Dominion Voting) Loses Libel Lawsuit over The Deep Rig</a> post, though this is just one example of a broader trend. The comment quotes an excerpt from the post's excerpt of the judge's opinion:</p>\n<blockquote><p>In short, if the law did not require \"clear and convincing evidence\" that the defendant subjectively doubted or disbelieved the published statements, it is likely that Byrne's motion for summary judgment would have been denied, and a jury would have had the opportunity to weigh in on this matter. However, under the law as it currently stands, Coomer's evidence is insufficient to meet these standards and summary judgment for Byrne is therefore required….</p></blockquote>\n<p>The comment then says, \"Trumpy judge who apparently didn't bother to read Sullivan, which states\" (emphasis added by commenter),</p>\n<blockquote><p>The constitutional guarantees require, we think, a federal rule that prohibits a public official from recovering damages for a defamatory falsehood relating to his official conduct unless he proves that the statement was made with \"actual malice\" — that is, with knowledge that it was false or with reckless disregard of whether it was false or not.</p></blockquote>\n<p>And the comment continues, \"Seems like this is ripe for appeal. This Trumpy judge seems to think the current precedent requires that the defendant 'subjectively doubted or disbelieved the published statements,' when Sullivan has a looser standard.\"</p>\n<p>The trouble with the commenter's analysis is that <em>Sullivan </em>was of course not the last word on the subject—as the judge knew. Indeed, if one searches for \"subjective\" in the judge's opinion, one sees a longish passage citing authority supporting the judge's analysis:</p>\n<blockquote><p>Actual malice requires proof that the defendant published the challenged statement with knowledge of its falsity or with reckless disregard for whether it was false. <em>See id. </em>[<em>Coomer v. Donald J. Trump for President, Inc.</em>, 552 P.3d 562, 581 (Colo. App. 2024)]; <em>New York Times Co. v. Sullivan</em>, 376 U.S. 254, 279-80 (1964); <em>St. Amant v. Thompson</em>, 390 U.S. 727, 731 (1968). The test for actual malice is a subjective one. Thus, the issue is not whether \"a reasonably prudent [person] would have published, or would have investigated before publishing,\" but rather whether the defendant \"in fact entertained serious doubts as to the truth of [the] publication, or was highly aware of its probable falsity[.]\" <em>Coomer</em>, 552 P.3d at 591; <em>Diversified Mgmt., Inc. v. The Denver Post, Inc.</em>, 653 P.2d 1103. 1105-10 (Colo. 1982) (en banc); <em>Michel v. NYP Holdings, Inc.</em>, 816 F.3d 686, 703 (11th Cir. 2016) (\"[W]e ask whether the defendant, instead of acting in good faith, actually entertained serious doubts as to the veracity of the published account, or was highly aware that the account was probably false.\"); <em>Dershowitz v. Cable News Network</em>, Inc., 153 F.4th 1189, 1193 (11th Cir. 2025) (\"[A]ll that matters are the speakers' subjective beliefs about the truth of their own statements.\").</p></blockquote>\n<p><em>St. Amant</em>, cited by the court, indeed states,</p>\n<blockquote><p>[The precedents] are clear that reckless conduct is not measured by whether a reasonably prudent man would have published, or would have investigated before publishing. There must be sufficient evidence to permit the conclusion that the defendant in fact entertained serious doubts as to the truth of his publication. Publishing with such doubts shows reckless disregard for truth or falsity and demonstrates actual malice.</p></blockquote>\n<p><em>Gertz v. Robert Welch, Inc. </em>(1974) expressly quotes this passage as the Court having \"equated reckless disregard of the truth with subjective awareness of probable falsity.\" The judge in the Coomer / <em>Deep Rig </em>case, whether you view him as \"Trumpy\" or not, knew the law here, and the commenter (who had elsewhere said he wasn't a lawyer) didn't seem to.</p>\n<p>So, again, definitely view judges' work skeptically, and feel free to criticize it. But don't assume that just because you know one precedent in the field you know the law better than the judge. Don't assume that just because you think the judge has some ideological bias, that ideological bias has led the judge into legal error. And if you have some skepticism about the judge's analysis, check the sources that the judge cites in the full opinion; my posts usually just excerpt the opinion, and often don't include citations, but they generally link to the full opinion so readers can consult it directly.</p>\n\t\n\n\t\t\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/10/29/the-law-and-democrats-allegedly-recruiting-second-dan-sullivan-to-run-in-alaska-senate-race/\" target=\"_blank\" rel=\"noopener\">NEXT: The Law and Democrats Allegedly Recruiting Second \"Dan Sullivan\" to Run in Alaska Senate Race</a>\n    </p>\n\t<a href=\"https://reason.com/category/civil-liberties/free-speech/\" target=\"_blank\" rel=\"noopener\">Free Speech</a><a href=\"https://reason.com/tag/libel/\" target=\"_blank\" rel=\"noopener\">Libel</a>"},{"title":"Dune: Awakening is getting a free DLC that adds a whole new map and swaps out sand for snow","source":"PC Gamer","author":"Rick Lane","url":"https://www.pcgamer.com/games/mmo/dune-awakening-is-getting-a-free-dlc-that-adds-a-whole-new-map-and-swaps-out-sand-for-snow/","category":"gaming","categoryLabel":"Gaming","wordCount":532,"readingTime":3,"content":"<p>Thus far, Funcom has focussed mainly on changes to its survival MMO<a href=\"https://www.pcgamer.com/dune-awakening/\" target=\"_blank\" rel=\"noopener\"> Dune: Awakening</a>, with the Norwegian studio<a href=\"https://www.pcgamer.com/games/survival-crafting/funcom-is-adding-a-singleplayer-mode-to-dune-awakening-and-wow-the-new-features-are-definitely-gonna-bring-me-back-to-the-game/\" target=\"_blank\" rel=\"noopener\"> reworking the entire game</a> to function as both a solo experience and a PvE adventure. Now that overhaul is done, however, Funcom is now set on expanding players' adventures on Arrakis, having just announced a free expansion that adds a new and completely different map to explore.</p><p>Coming in December, the<a href=\"https://store.steampowered.com/news/app/1172710/view/714542561332560354?l=english\" target=\"_blank\" rel=\"noopener\"> Blood and Ice DLC</a> will let players depart the searing sands of Arrakis for the planet's frozen north, adding a new survival map called the Polar Sink that flips the game's central survival concept on its head. Rather than avoiding the heat, players will actively have to seek it out, while also developing new technologies to help them adapt to the extreme change in climate.</p><p>There's some variance within this environment too. The Polar Sink is composed of two different biomes, the tundra and the icecap. While the icecap is the more extreme of the two, both areas are closely guarded by \"water shippers\", wealthy traders who supply Arrakis' second most-valuable resource from the polar regions down to the deserts. Players' primary objective in the DLC will be breaking the water shippers' stranglehold on the ice, which they can then use to cool their base equipment back in the desert and speed up resource production.</p><p>Funcom says that the expansion adds \"around 35 hours of new progression\", which sounds pretty beefy for a free DLC. It also apparently \"brings the focus back to ground-level survival\" for veteran players, \"traversal, temperature management and combat all playing important roles in your progression.\"</p><p>Blood and Ice will be released on December 1. Alongside the expansion, Funcom has also introduced a Cosmetics Store to Awakening, and is also working on several other heavily requested features. These include an offline single-player mode that's coming in November (the game can be played solo right now, but only with an Internet connection) and fully supported cross-play in January next year.</p><p>Funcom also says that Blood and Ice represents \"another step in the ongoing development of Dune: Awakening\" and that it will \"continue expanding the game\" through 2027. This falls in line with the studio's recent announcement that it was<a href=\"https://www.pcgamer.com/gaming-industry/funcom-is-laying-off-yet-more-developers-as-it-pivots-to-supporting-dune-awakening-and-conan-exiles/\" target=\"_blank\" rel=\"noopener\"> pivoting to exclusively support its existing games</a>—which includes<a href=\"https://www.pcgamer.com/conan-exiles/\" target=\"_blank\" rel=\"noopener\"> Conan Exiles</a> alongside Dune: Awakening—and was laying off an unspecified number of employees as a result of that shift in strategy.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Rick has been fascinated by PC gaming since he was seven years old, when he used to sneak into his dad's home office for covert sessions of Doom. He grew up on a diet of similarly unsuitable games, with favourites including Quake, Thief, Half-Life and Deus Ex. Between 2013 and 2022, Rick was games editor of Custom PC magazine and associated website <a href=\"http://bit-tech.net/\" target=\"_blank\" rel=\"noopener\">bit-tech.net</a>. But he's always kept one foot in freelance games journalism, writing for publications like Edge, Eurogamer, the Guardian and, naturally, PC Gamer. While he'll play anything that can be controlled with a keyboard and mouse, he has a particular passion for first-person shooters and immersive sims.</p>"},{"title":"When You Should—and Shouldn’t—Use AI to Search the Web","source":"Wired","author":"@wired","url":"https://www.wired.com/story/when-you-should-and-shouldnt-use-ai-to-search-the-web/","category":"tech","categoryLabel":"Technology","wordCount":982,"readingTime":5,"content":"<p>If you've interacted with the likes of <a href=\"https://www.wired.com/tag/claude/\" target=\"_blank\" rel=\"noopener\">Claude</a>, <a href=\"https://www.wired.com/tag/chatgpt/\" target=\"_blank\" rel=\"noopener\">ChatGPT</a>, and <a href=\"https://www.wired.com/tag/google-gemini/\" target=\"_blank\" rel=\"noopener\">Gemini</a>, you've noticed that in addition to everything else they do, these AI <a href=\"https://www.wired.com/tag/chatbots/\" target=\"_blank\" rel=\"noopener\">chatbots</a> can search the web for you. Depending on what you’re looking for, it can be easier to find more relevant results through a chatbot, which may explain why Google is so keen to <a href=\"https://www.wired.com/story/google-ai-mode-update-tries-to-kill-tab-hopping-in-chrome/\" target=\"_blank\" rel=\"noopener\">push AI Mode</a> for its own search engine.</p><p>When asked to search the web, the latest versions of these bots are combining elements of traditional web search (they're essentially just googling on your behalf) with knowledge they are able to pull out of their training data. Everything is then packaged and formatted in the now-familiar, polished generative AI style.</p><p>It's the added AI elements on top of the traditional googling where the differences come in, and that means AI-powered search may not always be the best option.</p><h2>When to Use AI for Web Search</h2><p>If you're looking up something simple and widely known—like the height of the Empire State Building—then AI search is a pretty safe bet. Not only is information like this easy to access online, the “autocorrect” probability patterns favored by large language models mean there's a near-certain chance that the results you see will include the right information.</p><p>If you just need a quick look-up, AI is OK. The more obscure the question, though, the closer you need to look at the answer. If you've asked something less well known, like the fifth-billed actor in an obscure television show, there might only be one or two references to it on the web, and an AI might choose the wrong one.</p><p>One of the takeaways from <a href=\"https://hai.stanford.edu/news/reading-todays-headlines-through-ai-a-real-time-audit-of-six-commercial-chatbots\" target=\"_blank\" rel=\"noopener\">recent Stanford University research</a> is that when AI finds an accurate source, it's very good at pulling the right information out of it. Where it tends to fall down is in not finding accurate sources (either because there aren't any or because the query has been misinterpreted) and presenting a confident answer anyway.</p><p>AI search is also helpful when you have a complex query that a standard Google search wouldn't be able to parse: \"I need to know the best restaurants in San Francisco for a family of five who want to spend no more than $200.\" AI is able to query and collate multiple sources in response to a search like this, and then present a well-synthesized answer. A traditional web search would give you a list of blue links that most probably just rank San Francisco restaurants by more basic criteria.</p><p>Again though, sources are crucial. AI bots have never been to San Francisco or eaten there. They are relying on public accounts on the web, written by people who have. Where there are no exact page matches, they'll look for related words (like \"affordable\" or \"family\") and generate an answer.</p><p>For queries where there's lots of information online, like San Francisco restaurants, AI web search can feel incredibly useful. For less popular destinations and more specific requests (\"dining tables shaped like stars\"), you need to be more careful with the results, as the way that AI joins the dots then becomes less reliable.</p><p>So, with the caveat that you should always do some kind of double-check, AI web search works best for common queries that are likely to lead to a lot of accurate, up-to-date information online. In both the way they process search queries, and package together and synthesize answers, AI chatbots are a significant upgrade on googling.</p><h2>When Not to Use AI for Web Search</h2><p>The way generative AI bots and LLMs are put together means they work best when paraphrasing, synthesizing, and summarizing. But these processes can also introduce mistakes. If your search needs precise details (like a celebrity quotation, a report stat, or a device specification), a traditional Google search may work best.</p><p>Heading to Google and searching the old way is also likely to be better if you want full control over the sources used. Offloading web searches to AI is convenient, but you're relying on them to interpret your search correctly, find the right sources, and then extract accurate information from those sources. It saves time, but it's more opaque.</p><p>If you know the websites you trust most for technology news, for example, you can prioritize them in a traditional web search in a way that AI might not be able to. Researchers from UC San Diego <a href=\"https://doi.org/10.48550/arXiv.2602.16942\" target=\"_blank\" rel=\"noopener\">have found</a> that AI web searches will sometimes pick sources because they're more relevant to the query, rather than because they're ranked as more authoritative.</p><p>That means a personal blog might get chosen above a professional health care site if the AI deems it to be a closer match to what the user is actually searching for. This is a choice that you would be much less likely to make when scanning a traditional list of results, as you'd typically pick the one you trusted the most.</p><p>Other areas where traditional searching still wins out are for breaking news (there can sometimes be a lag in the timeliness of the data AI pulls up) and for high-stakes searches where you absolutely cannot make a mistake—searches related to health, the law, or your finances, for instance.</p><p>If you do feel like an AI approach is needed, be sure to double- and triple-check the sources the chatbot has used, which should be linked inside the answer. If you're in any doubt, you can ask the AI for clarification on where something was sourced from, to make sure it isn't an LLM invention.</p><p>Classic Google searches can still turn up false information on the web, of course, but you're in a much better position to discern what's true and accurate and what isn't without a chatbot in the middle. For queries where that's more important than convenience and speed, there's still a place for the old way of searching the web.</p>"},{"title":"No iPad Till After Dinner, Mom","source":"Longreads","author":"Cheri Lucas Rowlands","url":"https://longreads.com/2026/11/02/elderly-seniors-screens-feeds/","category":"fun","categoryLabel":"Interesting Reads","wordCount":520,"readingTime":3,"content":"<p>For <em>Intelligencer</em>, Jessica Lucas offers a smart but depressing look at the seniors who are increasingly glued to their screens, mindlessly scrolling YouTube videos and Instagram Reels, often into the wee hours of the morning. It’s hard not to wonder if this constant passive consumption exacerbates cognitive decline. Some of the adult children Lucas speaks with routinely reset their parents’ feeds: fine-tuning algorithms to serve safer content, marking AI slop, or unsubscribing from harmful or fake news channels. Others have gone so far as to set their elderly parents up with teen accounts or secretly curate and monitor their activity. </p>\n<blockquote>\n<p>Daniel, a 39-year-old from Virginia, has embarked on a similar project with his own mother, an 81-year-old widow. She has grown so frightened by right-wing videos about crime that she is afraid to walk around her building complex, which has manicured gardens and a koi pond. Every few weeks, he opens her subscriptions page and quietly unsubscribes her from conspiracy and pseudoscience channels, purges her notifications, and spares only the balance-exercise videos for seniors. Then he searches for gardening videos and clips of cats and likes them on her behalf, hoping the algorithm takes the hint. He also signed her up for a Premium account hoping to kill the ads, which had been engineered around her fears, he tells me; one had already talked her into buying life insurance she didn’t need. Even then, the videos he’s trying to shield his mother from come back every few weeks if he doesn’t intervene. “If I could figure out how to get rid of her likes, I would,” he says.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore stories on aging\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/08/27/seniors-affordability-housing-oakland/\" target=\"_blank\" rel=\"noopener\">The Seniors Against Senior Housing</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tCharley Locke | Bloomberg Businessweek | August 19, 2026 | 4,867 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“America’s elders need more places to live, but even in liberal enclaves that recognize the problem, developers are facing the fiercest foes of all: America’s elders.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/06/29/aging-seniors-surveillance/\" target=\"_blank\" rel=\"noopener\">My Father Wants to Age in Place. AI Will Be Watching</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSteven Blum | Architectural Digest | June 16, 2026 | 2,062 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Devices that monitor seniors for safety are appealing to worried loved ones and underresourced home care agencies.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/06/04/chess-friends-nyt/\" target=\"_blank\" rel=\"noopener\">How Three Chess Friends Battled Demons and Saved Two Lives</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJohn Leland | The New York Times | June 2, 2026 | 2,900 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A homeless chess hustler, a scholar and an aging recluse found hope in a trashed apartment by Central Park.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/09/16/madness-on-a-mountain-for-15-years-my-mom-was-trapped-in-a-mutual-psychosis/\" target=\"_blank\" rel=\"noopener\">Madness on a Mountain: For 15 Years, My Mom was Trapped in a Mutual Psychosis</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJoelle Fraser | The Guardian | Joelle Fraser | 2,800 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“She fell mysteriously ill while living in a remote cabin with my stepdad, and I suspected it was a cry for help. Then came the unexpected diagnosis: folie à deux.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/06/06/creature-of-the-late-afternoon/\" target=\"_blank\" rel=\"noopener\">‘Do You Have a Family?’: Midlife With No Kids, Ageing Parents–and No Crisis</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tE. Tammy Kim | The Guardian | June 5, 2025 | 3,930 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“Three generations: dead, old, and middle-aged.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/04/30/losing-my-dad-in-installments/\" target=\"_blank\" rel=\"noopener\">Losing My Dad in Installments</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMariana Serapicos | Electric Literature | April 24, 2025 | 3,935 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Back then, it felt easier to say goodbye to each part of him as they left.” </p>"}];

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();

}

function skipArticle() {

  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

}
