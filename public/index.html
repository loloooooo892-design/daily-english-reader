.archive-link {

<script>
var articles = [{"title":"LLMs reward expertise","source":"Hacker News Best","author":"","url":"https://www.seangoedecke.com/llms-reward-expertise/","category":"tech","categoryLabel":"Technology","wordCount":802,"readingTime":5,"content":"<p>In the 2010s, if you had technical gaps (say, you couldn’t write CSS), you had to either rely on a skilled colleague or just hope that the answer to your exact problem was out there on the internet. Today, everyone can write sort-of-okay CSS by delegating the task to an LLM. LLMs make everybody into a generalist.</p>\n<p>Because of this, lots of people don’t think there’s any skill involved in working with LLMs. If you want the product that LLMs can deliver — PhD-level mathematics, pretty good but sometimes tasteless computer code, or awkward LinkedIn-style writing — you can simply ask for it. Since everyone is talking to the same models, “skilled prompters” are getting the same results as people touching LLMs for the first time.</p>\n<p>This is wrong. <strong>The most important skill in prompting is expertise in the domain you’re prompting for.</strong></p>\n<p>A good illustration of this is <a href=\"https://en.wikipedia.org/wiki/Terence_Tao\" target=\"_blank\" rel=\"noopener\">Terence Tao’s</a> <a href=\"https://chatgpt.com/share/6a5fdc7a-d6f8-83e8-bbea-8deb42cfed56\" target=\"_blank\" rel=\"noopener\">conversation with ChatGPT</a> about the recently-discovered counterexample to the Jacobian Conjecture. This is not the same ChatGPT I talk to! I couldn’t get to where Tao gets, even with unlimited tokens to burn.</p>\n<p>There’s a lot to learn about good prompting from Tao’s conversation. Here are a few observations:</p>\n<ul>\n<li>Tao’s messages are very short and to-the-point. He doesn’t respond point-by-point to the model, just to the gist</li>\n<li>The model outputs are much more concise than when I try and talk to GPT-5.6 Sol about mathematics. By signalling expertise, Tao shunts the model into “talking-to-mathematicians” mode, not “explaining-to-amateurs” mode</li>\n<li>Tao pushes back when the model’s responses look wrong, but he doesn’t directly contradict; instead, he says things like “this looks more complex than I was hoping for”</li>\n<li>Tao makes several leaps and suggestions himself. He almost never takes the model’s advice about where to go next</li>\n</ul>\n<p>However, you can’t prompt like Tao on mathematical questions just by following these tips. The key to his technique is actually understanding the mathematics: pulling the relevant idea out of ChatGPT’s multi-paragraph response, suggesting alternate approaches or formulations, and identifying what “looks weird”.</p>\n<p>Terence Tao is a better mathematician than I am a programmer. But the idea here — that <strong>domain knowledge makes you better at using LLMs</strong> — is something I’ve also experienced in my own work. If you have a good <a href=\"https://www.seangoedecke.com/programming-with-ai-agents-as-theory-building/\" target=\"_blank\" rel=\"noopener\">theory of your codebase</a>, you can push the LLM <em>much</em> harder than if you have no familiarity. Because you have your own sense of what a good solution might look like, you can say “no, I think it could be simpler here”, or “but don’t we already do X?”, or “can we express this problem in these familiar terms?“.</p>\n<p>This touches on an idea I’ve <a href=\"https://www.seangoedecke.com/you-cant-design-software-you-dont-work-on/\" target=\"_blank\" rel=\"noopener\">written about before</a>: that system design problems are dominated by concrete specifics, not generic principles. Of course both are useful, but I’d rather have familiarity with the codebase than a deep general understanding of software systems. In his conversation, Terence Tao asks a lot of specific questions like “does X work here?”, or “given Y and Z, why A?“. I can’t ask those questions about the Jacobian Conjecture, but I can ask them about the systems I own at GitHub.</p>\n<p>If you have no domain knowledge, you can cling onto the LLM to at least get <em>something</em>. That’s <a href=\"https://www.seangoedecke.com/ai-makes-weak-engineers-less-harmful/\" target=\"_blank\" rel=\"noopener\">not bad</a>! But if you have domain knowledge, you can wring far more value out of the same LLM by steering it hard in the direction you want. Most of us will have to do a mix of both these approaches, since we have domain knowledge in some areas but not others.</p>\n<p>The usefulness of domain knowledge suggests that human expertise will continue to be useful even as models get stronger. For many tasks, <strong>the human is the bottleneck, not the model</strong>, because the difficult part is in communicating to the model exactly what kind of solution the human wants. The information is “in the model” already, but it takes a very smart human to pull it out.</p><p>If you liked this post, consider <a href=\"https://buttondown.com/seangoedecke\" target=\"_blank\" rel=\"noopener\">subscribing</a> to email updates about my new posts, or <a href=\"https://news.ycombinator.com/submitlink?u=https%3A%2F%2Fwww.seangoedecke.com%2Fllms-reward-expertise%2F&amp;t=LLMs%20reward%20expertise\" target=\"_blank\" rel=\"noopener\">sharing it on Hacker News</a>.</p><p>Here's a preview of a related post that shares tags with this one.</p><blockquote><p>Powerful AIs might escape containment by releasing themselves as open-weight models</p><p>Before large language models, people who worried about AI safety often talked about the “boxing problem”. It goes like <a href=\"https://xkcd.com/1450/\" target=\"_blank\" rel=\"noopener\">this</a>. Suppose some genius figures out artificial intelligence in a late-night coding session on their laptop. Because they’re a genius, they’re smart enough to disable internet access on the laptop before turning it on. In order to escape to the outside world (and begin self-replicating) it would need to <em>convince</em> its creator to “open the box”. Would that work? Could a sufficiently smart AI convince anybody to let it out?<a href=\"https://www.seangoedecke.com/powerful-ais-might-escape-by-releasing-open-weight-models/\" target=\"_blank\" rel=\"noopener\">Continue reading...</a></p></blockquote>"},{"title":"Dragon Age's former producer had envisioned a 'Champions Edition' equivalent to Mass Effect's Legendary Edition, but he doesn't think it will happen anymore: 'There are basically no companies that could help you'","source":"PC Gamer","author":"Rick Lane","url":"https://www.pcgamer.com/games/rpg/dragon-ages-former-producer-had-envisioned-a-champions-edition-equivalent-to-mass-effects-legendary-edition-but-he-doesnt-think-it-will-happen-anymore-there-are-basically-no-companies-that-could-help-you/","category":"gaming","categoryLabel":"Gaming","wordCount":595,"readingTime":3,"content":"<p>Things haven't looked great for<a href=\"https://www.pcgamer.com/games/rpg/dragon-age/\" target=\"_blank\" rel=\"noopener\"> Dragon Age</a> since its latest entry,<a href=\"https://www.pcgamer.com/dragon-age-the-veilguard/\" target=\"_blank\" rel=\"noopener\"> Dragon Age: The Veilguard</a> was released to a mixed critical and<a href=\"https://www.pcgamer.com/gaming-industry/electronic-arts-says-dragon-age-and-ea-sports-fc-25-underperformed-as-it-revises-its-financial-outlook-downward/\" target=\"_blank\" rel=\"noopener\"> muted commercial</a> response back in 2024. EA subsequently<a href=\"https://www.pcgamer.com/gaming-industry/bioware-veterans-confirm-they-were-laid-off-by-ea-including-senior-dragon-age-and-mass-effect-devs/\" target=\"_blank\" rel=\"noopener\"> laid off</a> dozens of BioWare's staff, and numerous<a href=\"https://www.pcgamer.com/games/dragon-age/dragon-ages-former-lead-writer-thinks-the-series-is-probably-dead-but-hed-be-happy-to-take-it-off-eas-hands-and-go-somewhere-dark-and-dangerous-with-it/\" target=\"_blank\" rel=\"noopener\"> former</a><a href=\"https://www.pcgamer.com/games/dragon-age/ea-is-a-hedge-fund-with-a-videogame-hobby-former-dragon-age-boss-says-and-thats-why-he-reckons-the-series-is-probably-dead-and-buried/\" target=\"_blank\" rel=\"noopener\"> developers</a> have recently said they believe the series is probably dead.</p><p>Yet, while there's little hope of a new Dragon Age game anytime soon (if ever), might there be a chance EA revisits the <em>old </em>Dragon Age games? The original<a href=\"https://www.pcgamer.com/games/action/mass-effect/\" target=\"_blank\" rel=\"noopener\"> Mass Effect</a> trilogy got a spruced-up rerelease in its Legendary Edition back in 2021, despite the fact that EA hasn't exactly been desperate to push out new games in that series either (though a new one is apparently in the works, with the devs being <a href=\"https://www.pcgamer.com/games/rpg/mass-effect-devs-have-been-practically-radio-silent-for-over-5-years-because-theres-not-a-lot-of-time-for-tease/\" target=\"_blank\" rel=\"noopener\">too busy making it to talk about it</a>). Hence, could EA test players' appetite for Dragon Age with a similar remaster for<a href=\"https://www.pcgamer.com/dragon-age-origins/\" target=\"_blank\" rel=\"noopener\"> Dragon Age: Origins</a>,<a href=\"https://www.pcgamer.com/dragon-age-2/\" target=\"_blank\" rel=\"noopener\"> Dragon Age 2</a>, and<a href=\"https://www.pcgamer.com/dragon-age-inquisition/\" target=\"_blank\" rel=\"noopener\"> Dragon Age: Inquisition</a>?</p><p>Sadly, the chances of this happening are slim too, at least according to former Dragon Age producer Mark Darrah. In the same <a href=\"https://www.pcgamer.com/games/dragon-age/ea-is-a-hedge-fund-with-a-videogame-hobby-former-dragon-age-boss-says-and-thats-why-he-reckons-the-series-is-probably-dead-and-buried/\" target=\"_blank\" rel=\"noopener\">FRVR</a> interview where he declared <a href=\"https://www.pcgamer.com/games/dragon-age/ea-is-a-hedge-fund-with-a-videogame-hobby-former-dragon-age-boss-says-and-thats-why-he-reckons-the-series-is-probably-dead-and-buried/\" target=\"_blank\" rel=\"noopener\">Dragon Age as probably dead</a>, Darrah also pointed out that, while he had once envisioned a \"Champion's Edition\" equivalent to the Legendary Edition, EA is now unlikely to exhume the old games for a remaster due to the practical difficulties of doing so.</p>\n\n<p>Dragon Age: The Veilguard | Official Launch Trailer - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/NdtmtuzICOI\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>Basically, it all comes down to technology. Where all three Mass Effect games ran on Unreal Engine, which is a widely used technology, the three Dragon Age games were all built on different engines. Dragon Age used BioWare's Eclipse engine—an upgraded version of the Aurora Engine (which was also used by <a href=\"https://www.pcgamer.com/tag/cd-projekt/\" target=\"_blank\" rel=\"noopener\">CD Projekt</a> for<a href=\"https://www.pcgamer.com/the-witcher/\" target=\"_blank\" rel=\"noopener\"> The Witcher</a>), Dragon Age 2 used the further enhanced Lycium Engine, while Dragon Age: Inquisition ran on DICE's Frostbite tech.</p><p>\"There's basically no one at BioWare any more that understands the Aurora Engine,\" Darrah told<a href=\"https://frvr.com/blog/dragon-age-creator-says-a-mass-effect-style-remaster-trilogy-wont-happen-as-no-one-understands-the-games-unique-game-engines/\" target=\"_blank\" rel=\"noopener\"> FRVR</a>. \"There's basically no one outside of BioWare anymore that understands the Aurora engine. So, unlike Mass Effect, which is Unreal, there are basically no companies that could help you.\"</p><p>On top of this, Darrah reckons that such a remaster effort would require a new team, but claims that \"EA doesn't like having employees, so, if you're going to do that, you're going to do that within the umbrella of BioWare, which means those people are not working on something else.\"</p><p>That said, Darrah does think that a remaster of the original Dragon Age would sell well, mainly due to how it's a bit crusty around the edges today. \"Dragon Age: Origins wasn't the most attractive game. There's a lot you could do there to make it a lot better looking.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Rick has been fascinated by PC gaming since he was seven years old, when he used to sneak into his dad's home office for covert sessions of Doom. He grew up on a diet of similarly unsuitable games, with favourites including Quake, Thief, Half-Life and Deus Ex. Between 2013 and 2022, Rick was games editor of Custom PC magazine and associated website <a href=\"http://bit-tech.net/\" target=\"_blank\" rel=\"noopener\">bit-tech.net</a>. But he's always kept one foot in freelance games journalism, writing for publications like Edge, Eurogamer, the Guardian and, naturally, PC Gamer. While he'll play anything that can be controlled with a keyboard and mouse, he has a particular passion for first-person shooters and immersive sims.</p>"},{"title":"“Spaceballs: The Clickbait”—Inside the Return of Rick Moranis at Comic-Con","source":"Longreads","author":"Peter Rubin","url":"https://longreads.com/2026/07/28/spaceballs-rick-moranis-comic-con/","category":"fun","categoryLabel":"Interesting Reads","wordCount":572,"readingTime":3,"content":"<p>First off: This isn’t a Rick Moranis profile. I know you want it to be—we <em>all</em> want it to be—but it’s not. Maybe one day we’ll get the deep, rich look at a man who’s beloved by millions of comedy fans but who also stepped out of the public eye more than 30 years ago. Until then, there’s the fact that Moranis will be part of next year’s <em>Spaceballs</em> sequel, and as such was game enough to show up at San Diego Comic-Con over the weekend (where, predictably, Hall H chaos ensued). Anthony Breznican was there, shadowing the proceedings. Read it at ludicrous speed, obviously.</p>\n<blockquote>\n<p>Even in this holding area, Moranis is already getting a sense of the excitement building around him. Among the first people to have their socks knocked off is <em>Clerks</em> and <em>Mallrats</em> filmmaker Kevin Smith, the moderator of the presentation and a Comic-Con stalwart for decades. “I came for the panel <em>because</em> of Rick Moranis,” he tells me, invoking the name of the actor’s beer-swilling duo with Dave Thomas from their <em>SCTV</em> days. “Jay and Silent Bob doesn’t exist without <a href=\"https://www.youtube.com/watch?v=j2OgdhR28eE\" target=\"_blank\" rel=\"noopener\">Bob and Doug McKenzie</a>. Having him at Comic-Con is like having geek royalty here. You’re talking about a dude who, for most of us, was there as we grew up. He was part of the fabric of the culture since we were kids.”</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore stories from <em>Esquire</em>\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/01/tom-colicchios-final-service/\" target=\"_blank\" rel=\"noopener\">Tom Colicchio’s Final Service</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTed Genoways | Food &amp; Environment Reporting Network | June 30, 2026 | 4,400 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Through hosting two decades of <em>Top Chef</em>, writing four books, and opening restaurants across the country, the celebrity chef never stopped showing up to cook in the kitchen of Craft, his pioneering New York restaurant. Until he decided to close it.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/05/11/my-life-as-a-sex-worker-at-a-nevada-brothel/\" target=\"_blank\" rel=\"noopener\">My Life as a Sex Worker at a Nevada Brothel</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tPaloma Karr | Esquire | February 23, 2026 | 6,996 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“Men come to me for sex, yes. But in an age of profound loneliness and disconnection, they turn out to be looking for so much more.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/03/02/tom-junod-finally-reckons-with-what-it-means-to-be-a-man/\" target=\"_blank\" rel=\"noopener\">Tom Junod Finally Reckons with What It Means to Be a Man</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJohn Hendrickson | Esquire | February 18, 2026 | 5,915 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“In a long list of classic stories, the legendary magazine writer helped teach readers what masculinity looks like in the 21st century. To write his first book, he had to confront the man who first taught him: his father.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/12/25/macys-santaland-new-york/\" target=\"_blank\" rel=\"noopener\">Playing Santa Does Strange Things to a Man. What It Did to Bob Rutan Was Even Stranger.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDavid Gauvey Herbert | Esquire | December 4, 2025 | 6,978 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Bob Rutan is legendary among the tight-knit fraternity of Macy’s Santa Clauses. Like many of these men, playing Santa changed Bob. Profoundly. His story is one of struggle and failure, heartbreak and grace and—yes—the magic of Christmas.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/11/19/george-bell-esquire/\" target=\"_blank\" rel=\"noopener\">George Bell Served 24 Years in Prison for a Crime He Didn’t Commit. Now He’s Learning to Live Again.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tRyan D’Agostino | Esquire | November 17, 2025 | 6,799 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“After a quarter century behind bars, he was exonerated for the 1996 crime and received the largest payout ever from New York City. But money can’t buy back all that time.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/14/i-was-diagnosed-with-incurable-cancer-this-futuristic-treatment-could-save-me/\" target=\"_blank\" rel=\"noopener\">I Was Diagnosed with Incurable Cancer. This Futuristic Treatment Could Save Me.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJonathan Gluck | Esquire | July 9, 2025 | 4,507 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“I’ve endured numerous rounds of radiation and taken thousands of pills—but CAR-T is the most effective therapy I’ve completed yet.”</p>"},{"title":"Our Friend with the \"Attractive, Busty Jewess\" Problem Drops Case Against Harvard Rather Than Naming Himself","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/03/our-friend-with-the-attractive-busty-jewess-problem-drops-case-against-harvard-rather-than-naming-himself/","category":"law","categoryLabel":"Law","wordCount":645,"readingTime":4,"content":"<p>Readers of the blog may recall a certain John Doe who is suing Penn, Dartmouth, Harvard, and Berkeley for alleged discrimination; he <a href=\"https://reason.com/volokh/2026/02/17/no-pseudonymity-for-man-suing-harvard-alleging-jews-aim-to-exterminate-or-enslave-all-non-jews/\" target=\"_blank\" rel=\"noopener\">argues</a>, among other things, that \"in service of their goal to [exterminate] or enslave all non-Jews, the Jewish supremacists discriminate [against] non-Jewish whites,\" including him. He also <a href=\"https://reason.com/volokh/2026/05/20/plaintiff-was-enticed-by-an-attractive-busty-jewess-and-wet-his-mouth-with-a-drink-of-partially-unknown-provenance/\" target=\"_blank\" rel=\"noopener\">seeks to proceed under a pseudonym</a>, partly because he claims a fear of physical harm:</p> <blockquote></blockquote> <p>So far, courts have rejected his pseudonymity claim, and he's appealing the decision in his Penn case to the Third Circuit.</p> <p>But in the meantime, what to do about his other cases? Well, in the Harvard case, he asked Judge Allison Burroughs, who had <a href=\"https://reason.com/volokh/2026/02/17/no-pseudonymity-for-man-suing-harvard-alleging-jews-aim-to-exterminate-or-enslave-all-non-jews/\" target=\"_blank\" rel=\"noopener\">denied</a> his pseudonymity motion, to stay that case pending appeal. No, the judge held on May 20:</p>  <blockquote><p>Plaintiff … requests a stay of his disclosure requirements pending interlocutory appeal of the Court's denial of his motion to proceed under a pseudonym. \"In determining whether to grant a stay, courts consider: (1) [W]hether the stay applicant has made a strong showing that [it] is likely to succeed on the merits; (2) whether the applicant will be irreparably injured absent a stay; (3) whether issuance of the stay will substantially injure the other parties interested in the proceeding; and (4) where the public interest lies.\" The first two factors are most important.</p> <p>Plaintiff has made essentially no showing, certainly not a strong showing, that he will succeed on the merits, and he has provided no credible, non-speculative argument that he will be irreparably injured absent a stay. Defendants have taken no stance as to whether a stay would cause them injury, and the Court presumes that it would not. Finally, as explained above, the public has a strong interest in transparency, weighing against Plaintiff's request for a stay…. \"[T]he people have a right to know who is using their courts.\" … Accordingly, Plaintiff's request for a stay is DENIED. Plaintiff is directed to file a notice of his legal name and address no later than June 2, 2026.</p></blockquote> <p>He then sought a stay pending the appeal of his Penn case, but the judge again said no (on July 15):</p> <blockquote><p>Plaintiff's motion to stay this proceeding pending resolution of his appeal in the Third Circuit is DENIED. While \"the power to stay proceedings is incidental to the power inherent in every court to control the disposition of the causes on its docket with economy of time and effort,\" the Court finds that a stay is not warranted here for the reasons set forth in the Court's May 20, 2026 order.</p> <p>Though a trial court may stay an action pending the resolution of independent proceedings, this Court is not bound by whatever resolution Plaintiff may achieve in the Third Circuit, and the Court finds that a stay of Plaintiff's disclosure requirements in the instant case would not promote the interests of judicial efficiency. Plaintiff is ordered to file a notice of his legal name and address no later than July 29, 2026. Failure to timely comply with the Court's order will result in dismissal of the action.</p></blockquote> <p>And today, Judge Burroughs dismissed the case:</p> <blockquote><p>In February 2, 2026, the Court ordered Plaintiff to file a notice of his legal name and address no later than February 16, 2026. The Court has since afforded Plaintiff multiple extensions of that deadline, including the latest extension on July 15, 2026, when the Court ordered Plaintiff to file a notice of his legal name and address no later than July 29, 2026, and provided notice that failure to comply with the Court's order would lead to dismissal of this action. As of August 3, 2026, Plaintiff has not filed a notice of his legal name and address. Accordingly, this action is hereby DISMISSED.</p></blockquote> <p>Immediately after that, Doe filed a notice of voluntary dismissal of the Harvard case. Again, the Penn appeal remains pending.</p>"}];

  document.getElementById('original-link').href = a.url;

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
