<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"EA's sale to Saudi-led consortium was \"final nail in the coffin\" for BioWare, says studio co-founder in rare interview","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/bioware-co-founder-greg-zeschuk-closure-interview","category":"gaming","categoryLabel":"Gaming","wordCount":560,"readingTime":3,"content":"<p>\"I'm not saying it doesn't hurt and doesn't suck.\"</p>\n    \n  \n  \n  \n  \n            <p>One of BioWare's famous doctor-founders, Greg Zeschuk, has finally spoken about <a href=\"https://www.eurogamer.net/bioware-closing-down-mass-effect-5-cancelled\" target=\"_blank\" rel=\"noopener\">the studio's closure last week</a>, saying it's \"kind of sad\" and that EA's leveraged buyout by a Saudi-involved consortium \"was the final nail in the coffin\".</p>\n<p><a href=\"https://80.lv/articles/bioware-co-founder-greg-zeschuk-says-studio-was-killed-by-executives-who-have-never-made-a-game\" target=\"_blank\" rel=\"noopener\">Speaking to 80 Level</a>, Zeschuk - who founded BioWare in 1995 with fellow medical students Ray Muzyka and Augustine Yip - said he was fishing when news of the studio's closure broke. \"I got like 10 texts,\" Zeschuk said. \"I came off the river and got to my little room and opened my phone, and it's like, 'I'm so sorry to hear about BioWare.' And I'm like, 'Oh shit.'\"</p>\n\n<p>By the time he flew home later, he'd already apparently digested the news and missed most of the discourse around it. \"I wasn't there to share in the moment,\" he said, \"which in some ways was nice because I was able to kind of just take my time with it.</p>\n<blockquote><em>\"I've kind of gone through all the emotions long, long ago\" -Greg Zeschuk</em></blockquote>\n<p>\"I'm not saying it doesn't hurt and doesn't suck,\" he added. \"And I think it's kind of sad. It's actually, in some ways, saddest for the city of Edmonton, where we're from, because we were kind of this beacon of hope and excitement and possibility. We showed you could do something really special in a place that was not known for doing things like that.\"</p>\n<p><a href=\"https://www.eurogamer.net/biowares-greg-zeschuk-and-ray-muzyka-retire-from-industry-to-pursue-beer-journalism-charity\" target=\"_blank\" rel=\"noopener\">Zeschuk and Muzyka retired from BioWare in 2012</a>, the year <a href=\"https://www.eurogamer.net/games/mass-effect-3\" target=\"_blank\" rel=\"noopener\">Mass Effect 3</a> was released, so they've been away from the business for a considerable amount of time. They've moved on. \"I've kind of gone through all the emotions long, long ago,\" Zeschuk explained.</p><p>BioWare did change thereafter, he seemed to accept, but as a result of a gradual change propelled naturally by people leaving and other people coming in. \"I'm not going to have so much hubris to say Ray and I were the lynchpin in the chain, our departure ruined everything,\" he said. \"It wasn't that at all. It's a slow and insidious kind of thing and again, it's the people. The people are the key.\"</p>\n<p>When he heard <a href=\"https://www.eurogamer.net/ea-privately-acquired-in-55bn-deal-by-group-of-investors-including-saudi-arabias-investment-fund-and-donald-trumps-son-in-law\" target=\"_blank\" rel=\"noopener\">the private acquisition of EA had gone through</a>, that's when he feared things might be headed to a bad place. \"I think it was the final nail in the coffin,\" he said. \"I think that was the crux of it in a sense. BioWare makes these kinds of unusual games that take a long time and they're complicated and so it's easier just to pump out sports games every year, and that's a better business model in some ways.\"</p>\n<p>Elsewhere in the interview, Zeschuk talked a little about the origins of BioWare selling to EA in 2008 - \"We had options actually\" - and about personally sliding away from story-driven games towards more action-centred games like the Nioh series and <a href=\"https://www.eurogamer.net/elden-ring-walkthrough-8042\" target=\"_blank\" rel=\"noopener\">Elden Ring</a>.</p>\n<p>Since 2017, Zeschuk has been building <a href=\"https://blindenthusiasm.ca/\" target=\"_blank\" rel=\"noopener\">a beer-brewing company called Blind Enthusiasm</a>, which apparently now employs a dozen people and ships tens of thousands of bottles of beer a year. This interview is the only one Zeschuk has given. Muzyka has so far declined to be interviewed. The third BioWare co-founder, Augustine Yip, left the company long ago, back in 1998.</p>\n\n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 13 more"},{"title":"Remedies for a Constitutional Crisis Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/","category":"law","categoryLabel":"Law","wordCount":893,"readingTime":5,"content":"<h2>Introduction</h2>\n<p>In a constitutional showdown with the executive branch, the courts may seem to have limited remedial options.  Once we reach a point where courts conclude that the Executive is violating the law, what can they do but order compliance?  And what can we do but hope that the Executive feels compelled to comply, whether by conscience or political forces?</p>\n<p>Today, that compliance is hard to take for granted.  Indeed, the risk is that the executive branch will blow off the judiciary, ignoring its judgments, refusing to obey its decrees, courting contempt, accusing judges of fictitious wrongdoing, and tacitly encouraging retaliation against them.  And indeed, there is evidence that this is what is happening.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a></p>\n<p>The upshot is that we are slipping into a crisis of judicial authority — what one could call a “constitutional crisis.”  We use the phrase here reluctantly, for it is overused and vague.  And we use it without knowing what will come next, and even though we might need a new word if things get worse.  (It was called the “Cuban Missile Crisis,” even though it ended fine, and even though it could have gotten much worse, and even though we would have needed a new term for what happened if it did.)  The phrase “constitutional crisis” at least captures the sense that the courts face an unusual challenge today, and that the precedents, such as they are, are not reassuring.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Call it what you will, it is not good.</p>\n<p>What courts can do to enforce their decisions in such a crisis is the inquiry at the heart of this Essay.  If courts cannot assume that the Executive will simply accept their decisions, what options are open to the least dangerous branch?  Do the federal courts have choices that will coax the executive branch into more law-abiding behavior?  Or will those choices hasten the slide toward an equilibrium in which the Executive acts contemptuously but escapes contempt?  Do the federal courts have choices that will provide an effective resistance to lawbreaking by the Executive, shoring up the rule of law?  Or will those choices merely accelerate and heighten the conflict between the branches, precipitating a battle that the judiciary can start but not win?</p>\n<p>Our central claim is that the range of remedial options available to courts is broader than it may seem at first — and that the best path is not always obvious.  Even when it is clear that the executive branch has acted unlawfully, it is not necessarily clear what courts can do about it.  Even if we are in a crisis, and the choice of judicial response is very important, that does not make obvious the <em>correct</em> choice.  We recognize that our readers will assess the risks associated with each option in various and varying ways, and that our own assessments may change as the world changes.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  (Indeed, much has changed since this Essay was presented in October 2025.)  So this Essay does not attempt to crown any one choice as the right one.  Nor do we claim that any of these remedial choices will be enough to avert or undo a constitutional crisis.  They are not remedies in that sense.</p>\n<p>Our aim is more modest: We will lay out the menu of options that are available to federal judges, highlighting the tradeoffs among them.  But we recognize that we do not have the burden of choice, which belongs instead to the judges — and, we should acknowledge, to the President and the other executive officers and employees, as well as to the members of Congress.  In every separation of powers crisis, and in every averted separation of powers crisis, the decisive decisions are not made by law professors:</p>\n<p>Bullfight critics ranked in rows</p>\n<p>Crowd the enormous Plaza full;</p>\n<p>But only one is there who <em>knows</em></p>\n<p>And he’s the man who fights the bull.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a></p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1747.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Daniel T. Deacon &amp; Leah M. Litman, <em>Legalistic Noncompliance</em>, 75 Duke L.J. (forthcoming 2026) (manuscript at 9–45), https://ssrn.com/abstract=5241936 [https://perma.cc/D32A-BM56]; Thomas P. Schmidt &amp; Gillian E. Metzger, <em>Some Realism About Constitutional Remedies</em>, 139 Harv. L. Rev. 1834 (2026).  For a contrary view, see Adrian Vermeule, Opinion, <em>Someone Is Defying the Supreme Court, But It Isn’t Trump</em>, N.Y. Times (July 31, 2025), https://www.nytimes.com/2025/07/31/opinion/supreme-court-trump-judges-defiance.html [https://perma.cc/8F46-ZDLX].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707 (2009); Keith E. Whittington, <em>Yet Another Constitutional Crisis?</em>, 43 Wm. &amp; Mary L. Rev. 2093 (2002); Arthur Bestor, <em>The American Civil War as a Constitutional Crisis</em>, 69 Am. Hist. Rev. 327 (1964).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> Judges might also derive wisdom from experiences around the world, though with the usual caveats about translating lessons from other institutions to ours.  <em>See generally, e.g.</em>, Jeffrey K. Staton, Christopher Reenock &amp; Jordan Holsinger, Can Courts Be Bulwarks of Democracy? Judges and the Politics of Prudence (2022); Benjamin Garcia-Holgado, <em>Overruling the Executive: Judicial Strategies to Resist Democratic Erosion</em>, 13 J.L. &amp; Cts. 274 (2025); Fortunato Musella &amp; Luigi Rullo, <em>Constitutional Courts in Turbulent Times</em>, 25 Eur. Pol. &amp; Soc’y 461 (2024).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Poem attributed to Domingo Ortega by Robert Graves, <em>in</em> Robert Graves, Oxford Addresses on Poetry 4 (1962).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>"},{"title":"Tech Gifts That Won’t Rot Their Brains","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/gift-guides/tech-gifts-that-wont-rot-their-brains","category":"fun","categoryLabel":"Interesting Reads","wordCount":1292,"readingTime":7,"content":"<p>When you click a retail link on this page, we may receive a commission. Thank you for supporting <em>The New Yorker.</em></p><p>Binge-watching. Doomscrolling. Rabbit-holing. Brain-rotting. These, it seems, are the behaviors encouraged by our computers and digital devices—intoxicating masterworks of engineering that we stumble away from, glassy-eyed. It’s a sad state of affairs, especially if, like me, you grew up in the nineteen-eighties and nineties, when digital technology was exciting and liberatory. Back then, Steve Jobs called the computer a “bicycle for the mind”; parents bought PCs hoping that their kids would become “computer whizzes.” The idea was that circuits and software could unleash our potential.</p><p>Today, of course, we associate screens with mindlessness, and computers with distraction and drudgery. But it doesn’t have to be that way. Gadgets are still great, and computers remain delightful. In fact, it’s easy to turn your personal tech dystopia into a utopia: all you have to do is shift from being a consumer to becoming a creator. We live in a golden age of digital creativity. Forget A.I.: you, yourself, can record an album from your sofa, or curate a photo-essay on the train. In that spirit, here are some of my favorite creative digital tools.</p><p><strong>Browse by category:</strong></p><h2>Sketching and Writing</h2><h3>Paper Pro </h3><h3>Keychron K2 Keyboard </h3><p>Perhaps you’ve seen, on YouTube, videos of “<a href=\"https://www.youtube.com/watch?v=GeEISHh37lY\" target=\"_blank\" rel=\"noopener\">infinite sketchbooks</a>”—digital drawings that can be zoomed into seemingly forever, revealing worlds within worlds. It turns out that tablets aren’t just for Netflix: even a small model, like the <a href=\"https://www.bhphotovideo.com/c/product/2010060-REG\" target=\"_blank\" rel=\"noopener\">iPad Mini</a> ($699), can open up onto endless vistas when it’s equipped with a <a href=\"https://www.bhphotovideo.com/c/product/1826862-REG\" target=\"_blank\" rel=\"noopener\">digital pencil</a> ($119) and an app like <a href=\"https://www.endlesspaper.app/\" target=\"_blank\" rel=\"noopener\">Endless Paper</a> (free). Tablets are always getting slimmer and lighter, making them better for watching than for drawing. But turning a tablet into an ergonomic drawing surface is simple: just get a <a href=\"https://www.amazon.com/Urban-Artist-Adjustable-Drawing-Painting/dp/B0CPGT7X5P?crid=S5SOFEI9C6UM&amp;dib=eyJ2IjoiMSJ9.euk1oCKbY4QDn_scKqKcJV33rQcR6ZKDObwrjx7hk0t3uWxZa2NSbWjJB8vzfPHmdWonMHRfImYVRX8JfO_wuzBKWj-v9IpgXWVVo7w2NVupw4W9wkIQuKZKlBjpuhEsyMdr_sjDuyBivcS9ZeBQyC3dP3ASgpWtHW6g35d-Hzm8eXFMPENrUwGdKtcQhdJlKioYBA28u0NVVnWT5SY9KpNZBH2g3xIJzX3CaK22kqZBNpzGpQnnAlAsDFhC2uOBgCA3HV4kMNoQNe7_pUq5J0fRi4olim0W4dhpej5Fv8o.G6Hqc0T1OguC5EFwIAe2OcaC5GbfKkommyMK2FObe5g&amp;dib_tag=se&amp;keywords=drawing%2Bstand&amp;qid=1776945627&amp;sprefix=drawing%2Bsta%2Caps%2C397&amp;sr=8-2-spons&amp;sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&amp;th=1&amp;linkCode=sl2&amp;tag=jessemartin06-20&amp;linkId=4ff3f4be0d7556e1487c4136bf803d1c&amp;language=en_US&amp;ref_=as_li_ss_tl\" target=\"_blank\" rel=\"noopener\">drawing board</a> ($45)—one of those slanted wooden surfaces that illustrators use. Add a book stand and a copy of “<a href=\"https://shop.com/products/8847971516657\" target=\"_blank\" rel=\"noopener\">Drawing on the Right Side of the Brain</a>” ($24).</p><p>If a tablet is too distracting, there are other ways to make digital art. For years, I’ve been doing a lot of my writing and sketching using e-ink tablets made by reMarkable, a Norwegian company. The deluxe version, the <a href=\"https://remarkable.com/products/remarkable-paper/pro\" target=\"_blank\" rel=\"noopener\">Paper Pro</a> ($629), has a big screen and can be expanded with a keyboard. But the <a href=\"https://remarkable.com/products/remarkable-paper/pro-move\" target=\"_blank\" rel=\"noopener\">Paper Pro Move</a> ($449) is the size of a pocket notebook and lets you sketch in color. There’s no e-mail, web browsing, or social media on these—only a Kindle-esque e-ink display that feels paperlike beneath your stylus. (When my eight-year-old son and I are bored, I sometimes make sketches so that he can color them in and add to them.) I also find that writing in longhand on an e-ink device can loosen up one’s brain, and I’ve written many articles—including this one—on my reMarkable, eventually using the device’s handwriting-recognition feature to transform my scrawls into editable text. For those who like writing but want to get away from their work computer, this sort of freestanding writing device can be a godsend. The <a href=\"https://byok.io/device\" target=\"_blank\" rel=\"noopener\">BYOK</a> ($199) is a little portable screen that’s made entirely for writing; as its name suggests, you should bring your own keyboard, and a tiny, pleasantly clicky model like the <a href=\"https://shop.com/products/4479035342937\" target=\"_blank\" rel=\"noopener\">Keychron K2</a> ($60) would be a good choice. The <a href=\"https://shop.com/products/14620942598512\" target=\"_blank\" rel=\"noopener\">Freewrite Alpha</a> ($349) is like a digital typewriter, and includes its own keyboard.</p><h2>Music and Images</h2><h3>Teenage Engineering OP-1 Field Portable Synthesizer </h3><h3>Koss PortaPro Headphones </h3><p>I was in college when the iPod appeared. In the two decades since, dedicated music players have almost completely disappeared. And yet, beneath the radar, music-making devices have proliferated. Today, there are zillions of cool little synthesizers and “grooveboxes” on the market, and they’re not at all difficult to use.</p><p>You can make beats with a <a href=\"https://www.bhphotovideo.com/c/product/1114042-REG\" target=\"_blank\" rel=\"noopener\">Teenage Engineering Pocket Operator</a> ($59), which is about the size of a deck of cards. You can compose lovely melodies and soundscapes with the <a href=\"https://shop.com/products/7599512453183\" target=\"_blank\" rel=\"noopener\">Roland P-6</a> ($270), a sampler the size of a paperback book, with rechargeable batteries so that you can use it on the go. (The P-6 can be hooked up to its siblings, which include a <a href=\"https://shop.com/products/8462686617874\" target=\"_blank\" rel=\"noopener\">synth</a>, for $270, and a <a href=\"https://shop.com/products/8417080672530\" target=\"_blank\" rel=\"noopener\">drum machine</a>, also for $270, to form a synth-pop band.) Bigger units let you build whole tracks, with different parts playing in parallel. The <a href=\"https://www.bhphotovideo.com/c/product/1548519-REG/elektron_117006_model_cycles_six_track_fm_based.html\" target=\"_blank\" rel=\"noopener\">Elektron Model:Cycles</a> ($349) offers modern sounds and medical-device chic; the <a href=\"https://shop.com/products/8893380886664\" target=\"_blank\" rel=\"noopener\">Sonicware Deconstruct</a> ($399) lets you pretend your living room is <a href=\"https://www.newyorker.com/magazine/2014/03/24/berlin-nights\" target=\"_blank\" rel=\"noopener\">Berghain</a>. The most elegant grooveboxes are probably the <a href=\"https://shop.com/products/7383903043757\" target=\"_blank\" rel=\"noopener\">Teenage Engineering OP-1 Field</a> ($1,999) and <a href=\"https://shop.com/products/7957113995437\" target=\"_blank\" rel=\"noopener\">OP-XY</a> ($2,299), which are like scaled-down music studios with Apple-calibre designs and batteries that last all day; the Field is better for keyboard players, while the XY works best for purely electronic music.</p><p>A computer or a tablet can, itself, become a musical gadget, with the addition of the right piano-style keyboard. The <a href=\"https://shop.com/products/8493031686427\" target=\"_blank\" rel=\"noopener\">Arturia MiniLab 3</a> ($119) is a compact model that connects to your computer and lets you play, compose, and record in apps like GarageBand, which contain hundreds of free synthesized instruments. You can listen through the lightweight, comfortable <a href=\"https://shop.com/products/6223071117485\" target=\"_blank\" rel=\"noopener\">Koss PortaPro</a> headphones ($50), which weigh nothing but sound gorgeous, and record your songs with a phone app like <a href=\"https://tape.it/\" target=\"_blank\" rel=\"noopener\">Tape It</a>, for listening on the go. If you know a lapsed musician, any of these tools could help get them back up and running—especially in combination with a lesson or two from an online instructor. I’m hoping to learn more about my synthesizers from Jeremy, at <a href=\"https://rmr.media/education\" target=\"_blank\" rel=\"noopener\">Red Means Recording</a>, this winter.</p><h2>Photography and Filmmaking</h2><p><a href=\"https://shop.com/products/6746359726215\" target=\"_blank\" rel=\"noopener\"></a></p><h3>Aura Carver Frame </h3><p>Everyone has a smartphone, and every smartphone has a camera; this means that everyone is just a step away from becoming a hobby photographer. Doing so is partly a matter of self-perception—you have to <a href=\"https://www.newyorker.com/culture/culture-desk/your-camera-roll-contains-a-masterpiece\" target=\"_blank\" rel=\"noopener\">look at your pictures</a> with a critical, artistic eye—but it also has to do with equipment. The <a href=\"https://www.bhphotovideo.com/c/product/1728026-REG/canon_5539c001_selphy_cp1500_compact_photo.html/?ap=y&amp;ap=y&amp;smp=y&amp;smp=y&amp;store=420&amp;lsft=BI%3A514&amp;gad_source=1&amp;gad_campaignid=21413748377&amp;gbraid=0AAAAAD7yMh2-9XEOJmtT0PTw-URVC7sP3&amp;gclid=CjwKCAjwyuDTBhB-EiwANCQhLB1yamxcRZeUYGTEUZQgwjGxm9XKZcdwF68MtWW6v2XmkJiCZ5h8tBoCHFcQAvD_BwE\" target=\"_blank\" rel=\"noopener\">Canon Selphy Printer</a> ($159), which allows you to effortlessly print four-by-six photographs at home, can help bridge the gap between taking pictures and making photographs to keep. The <a href=\"https://shop.com/products/6746359726215\" target=\"_blank\" rel=\"noopener\">Aura Carver Frame</a> ($149), which can rotate through pictures you select, creates a place for your best digital pictures to live.</p><p>Giving someone a dedicated camera is like giving them a new form of self-expression. There are all sorts of cameras, and they suit different kinds of photographers—but don’t overthink it, since people can grow into the tools they happen to have. The <a href=\"https://store.insta360.com/product/go-3s\" target=\"_blank\" rel=\"noopener\">Insta360 Go Retro Bundle</a> ($320) contains an action camera (great for filming daredevilry and dynamic exploits) that can also be used as a pocketable point-and-shoot. The <a href=\"https://shop.com/products/8435547996390\" target=\"_blank\" rel=\"noopener\">Polaroid Now</a> ($120) is a stylish instant camera perfect for social butterflies. The <a href=\"https://shop.lomography.com/us/lomo-mc-a-35-mm-film-camera-black?srsltid=AfmBOoqglQIoqHm1xv6G87BLCmQk9M5B8wy97exwrcY7AQiS39wSb9H5\" target=\"_blank\" rel=\"noopener\">Lomography MC-A</a> ($549) is a 35-mm. film camera with autofocus. And the <a href=\"https://www.bhphotovideo.com/c/product/1972109-REG/panasonic_dc_l10k_lumix_dc_l10_digital_camera.html/?ap=y&amp;ap=y&amp;smp=y&amp;smp=y&amp;store=420&amp;lsft=BI%3A514&amp;gad_source=1&amp;gad_campaignid=21061288000&amp;gbraid=0AAAAAD7yMh06xupE65MBVa9TVeXo2a-9o&amp;gclid=CjwKCAjwq8PVBhAKEiwA2i3SHYkpjDJBhWF8knR2hIz2IAbZPAhA4Dl8jZdQ6OraS6TE5GZq9olFUxoCxsgQAvD_BwE\" target=\"_blank\" rel=\"noopener\">Panasonic Lumix L10</a> ($1,498) is a discreet but powerful model with a built-in zoom lens and options for “color-grading”—that is, giving photos or footage a professional, cinematic look.</p><h2>Playing and Exploring</h2><h3>Playdate </h3><p>Writing, drawing, music-making—an art form that combines them all is game design. Earlier this year, I bought our family a <a href=\"https://play.date/shop/\" target=\"_blank\" rel=\"noopener\">Playdate</a> ($229), a handheld video-game console with its own easy-to-use game-creation tool, which runs in a web browser. My son and I had fun making a little game; we even moved beyond the browser-based editor, writing our own code directly (with a little help from Claude). And we also played <a href=\"https://bigwalk.game/\" target=\"_blank\" rel=\"noopener\">Big Walk</a> ($20), an unforgettable adventure from a game studio called House House. In Big Walk, you play together but on separate screens—I used a Nintendo Switch, he used his computer—solving puzzles while communicating almost entirely through systems of symbol and gesture that you improvise. It’s a video game that brings out new aspects of your own creativity and ingenuity—a perfect example of how humanizing technology can be. ♦</p>"},{"title":"SMS of Death","source":"Hacker News Best","author":"Mark B","url":"https://smsofdeath.com/","category":"tech","categoryLabel":"Technology","wordCount":1299,"readingTime":7,"content":"<p>Android Telephony · Zero-Click · Remote DoS</p>\n    <p>A single malformed <strong>WAP Push</strong> SMS crashes <strong>com.android.phone</strong> on Android, dropping active calls (<strong>including emergency calls</strong>), with <strong>zero interaction</strong> from the victim.</p>\n    <p>\n      <a href=\"https://github.com/MarkBlah/smsofdeath\" target=\"_blank\" rel=\"noopener\">\n        \n        Download APK\n      </a>\n      <a href=\"https://github.com/MarkBlah/smsofdeath\" target=\"_blank\" rel=\"noopener\">\n        \n        Source\n      </a>\n    </p>\n    <p>⚠ Working proof-of-concept, authorised testing only. <a href=\"https://smsofdeath.com/#poc\" target=\"_blank\" rel=\"noopener\">Read the warning &amp; license</a> before downloading.</p>\n  \n  \n    <p>ComponentWapPushOverSmsframeworks/opt/telephony</p>\n    <p>InteractionNonezero-click, silent</p>\n    <p>VectorRemote SMSWAP Push, port 2948</p>\n    <p>StatusPatchedAndroid Oct 2026 update</p>\n    <p>ReporterMark B</p>\n    <p>Reported5 May 2026Android &amp; Devices VRP</p>\n    <p>Disclosed29 Oct 2026public writeup</p>\n    <p>RecoveryADB onlynormal user: bricked</p>\n  \n  \n    01 / The vulnerability\n    <h2>An unchecked cast turns a 5-byte header into a negative array size</h2>\n    <p>When Android receives a WAP Push message, WapPushOverSms.decodeWapPdu() reads the WSP header length as a uintvar. The value comes back as a long, is cast to int with no range check, and is then used directly as the size of a new byte array:</p>\n    // WapPushOverSms.java:217  header length read as long, cast with no bounds check\nint headerLength = (int) pduDecoder.getValue32();\n    ...\n// WapPushOverSms.java:244  the cast value is used as an array size\nbyte[] header = new byte[headerLength];\n    <p>A 5-byte uintvar of 88 80 80 80 00 decodes to 0x80000000. Cast to a signed 32-bit int, that is -2147483648. Allocating new byte[-2147483648] throws an uncaught NegativeArraySizeException on the telephony main thread, killing com.android.phone:</p>\n    E AndroidRuntime: FATAL EXCEPTION: main\nE AndroidRuntime: Process: com.android.phone\nE AndroidRuntime: java.lang.NegativeArraySizeException: -2147483648\nE AndroidRuntime:   at ...WapPushOverSms.decodeWapPdu(WapPushOverSms.java:244)\nE AndroidRuntime:   at ...WapPushOverSms.dispatchWapPdu(WapPushOverSms.java:339)\nE AndroidRuntime:   at ...InboundSmsHandler.processMessagePart(InboundSmsHandler.java:1169)\nE AndroidRuntime:   at ...InboundSmsHandler$DeliveringState.processMessage(InboundSmsHandler.java:627)\n    <p>The message is delivered as a data SMS and is never shown to the user: there is nothing in the inbox, and the victim never sees the sender's number.</p>\n  \n  \n    02 / Impact\n    <h2>Remote, silent, and recoverable only with effort</h2>\n    <ul>\n      <li><strong>Zero-click.</strong> The victim does nothing. No tap, no open, no notification.</li>\n      <li><strong>Silent.</strong> Nothing appears in Messages; the attacker's number is never shown.</li>\n      <li><strong>Calls drop, including emergency calls.</strong> Active voice calls terminate with DisconnectCause CS_DEATH as the process restarts.</li>\n      <li><strong>Telephony blackout.</strong> 1-2 seconds of no service per message while com.android.phone restarts.</li>\n      <li><strong>Carrier redelivery amplifies it.</strong> Unacknowledged messages are re-sent by the carrier, re-crashing the phone; a single message caused intermittent outages for up to a week in testing.</li>\n      <li><strong>~20 messages</strong> render the device unusable for an extended period.</li>\n      <li><strong>Persistent denial of service.</strong> The malformed message stays queued and is retried on every boot, so the phone can crash on startup until it is cleared (recovery below).</li>\n    </ul>\n    <p>Tested across multiple makes and models (Pixel 9 on April 2026 firmware, various Samsung Galaxy and A-series) with a 100% reproduction rate.</p>\n    <h3>Recovery over ADB, contributed by <a href=\"https://github.com/sakisdog\" target=\"_blank\" rel=\"noopener\">@sakisdog</a></h3>\n    <p>After hitting the reboot loop on <strong>Android 12</strong>, <a href=\"https://github.com/sakisdog\" target=\"_blank\" rel=\"noopener\">@sakisdog</a> documented a less destructive recovery (<a href=\"https://github.com/MarkBlah/smsofdeath/issues/2\" target=\"_blank\" rel=\"noopener\">issue #2</a>). The poison messages sit in the pending inbound queue (content://sms/raw) and are retried on every boot, so Android's <strong>RescueParty</strong> reboots the device into recovery roughly every 90 seconds. Deleting just those rows over ADB, in the short window after boot completes, breaks the loop with no factory reset:</p>\n    # while sys.boot_completed == 1: find the WAP Push rows (destination_port=134020), note the address\nadb shell content query --uri content://sms/raw --projection _id:destination_port:date:deleted\n# let the shell edit SMS storage, delete only those rows, then reset the permission\nadb shell cmd appops set com.android.shell WRITE_SMS allow\nadb shell \"content delete --uri content://sms/raw --where \\\"address='&lt;SENDER&gt;'\\\"\"\nadb shell cmd appops set com.android.shell WRITE_SMS default\n# last resort, erases ALL SMS/MMS and APN settings:\nadb shell pm clear com.android.providers.telephony\n    <p>Recovery credited to <a href=\"https://github.com/sakisdog\" target=\"_blank\" rel=\"noopener\">@sakisdog</a>. It still needs a computer and ADB, and you should <strong>not</strong> choose \"wipe data\" at the recovery prompt, so for a non-technical user mid-loop it remains out of reach.</p>\n    <p>This is the distinction the report turns on. It is not a transient crash: it is a <strong>remote, zero-click, persistent denial of service</strong> that, left untreated, reboots the phone into a recovery <em>wipe-data</em> prompt every ~90 seconds, driving a normal user to a <strong>factory reset</strong> to recover, which is the exact shape of a \"Destructive Remote DoS\" in the VRP's published rules.</p>\n  \n  \n    03 / Why this is serious\n    <h2>A remote attacker can cut a phone off from Triple Zero</h2>\n    <p>Dropping calls is not an inconvenience when one of those calls is to emergency services. While a device is under this attack, or stuck in the reboot loop, it cannot reliably place a call to <strong>000</strong>. The attack is remote, needs only the victim's number, and shows them nothing.</p>\n    <p>Australia treats access to emergency calling as a mandatory property of a mobile service, not a nice-to-have. Under the <strong><a href=\"https://www.acma.gov.au/consultations/2024-09/proposal-amend-ecs-determination\" target=\"_blank\" rel=\"noopener\">Telecommunications (Emergency Call Service) Determination</a></strong>, administered by the ACMA, carriers are required to <strong>identify mobile phones that cannot reach Triple Zero, help the customer move to a working device, and stop providing service to the affected handset</strong>. <a href=\"https://www.telstra.com.au/support/mobiles-devices/3g-determination\" target=\"_blank\" rel=\"noopener\">Telstra states plainly</a> that it is required to block phones that can no longer call 000, notifying the customer and blocking the device if nothing is done within 28 days.</p>\n    <p>The consequence is perverse: the regulatory remedy for a phone that can't reach 000 is to <strong>cut it off the network</strong>, not to patch the OS. So an attacker who can remotely induce that condition on an Android handset can, in effect, get the victim's own device barred from carrier service until it is updated. The regulation exists precisely because loss of emergency-call access is considered a public-safety failure; this bug manufactures that failure on demand.</p>\n    <p>The framework was <a href=\"https://oia.pmc.gov.au/published-impact-analyses-and-reports/requirements-identify-and-manage-mobile-phones-unable-access\" target=\"_blank\" rel=\"noopener\">tightened in 2024</a> following the 3G shutdown, which left some phones able to make ordinary calls but unable to reach emergency services, the same functional state this vulnerability produces.</p>\n    <p>Sources: <a href=\"https://www.acma.gov.au/consultations/2024-09/proposal-amend-ecs-determination\" target=\"_blank\" rel=\"noopener\">ACMA: proposed amendments to the ECS Determination</a> · <a href=\"https://www.telstra.com.au/support/mobiles-devices/3g-determination\" target=\"_blank\" rel=\"noopener\">Telstra: Emergency Call Service Determination</a> · <a href=\"https://oia.pmc.gov.au/published-impact-analyses-and-reports/requirements-identify-and-manage-mobile-phones-unable-access\" target=\"_blank\" rel=\"noopener\">Dept. of PM&amp;C: impact analysis</a></p>\n  \n  \n    04 / The fix\n    <h2>One bounds check</h2>\n    <p>The remedy is a range check before the cast in <a href=\"https://android.googlesource.com/platform/frameworks/opt/telephony/+/refs/heads/main/src/java/com/android/internal/telephony/WapPushOverSms.java#217\" target=\"_blank\" rel=\"noopener\">WapPushOverSms.java (line 217)</a>, provided to Google on the day of the first report:</p>\n    long rawHeaderLen = pduDecoder.getValue32();\nif (rawHeaderLen &lt; 0 || rawHeaderLen &gt; pdu.length) {\n    result.statusCode = Intents.RESULT_SMS_GENERIC_ERROR;\n    return result;\n}\nint headerLength = (int) rawHeaderLen;\n    <h3>What Google shipped</h3>\n    <p>Google fixed this crash, but not with the bounds check above. On <strong>15 June 2026</strong> an Android engineer authored commit <a href=\"https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97\" target=\"_blank\" rel=\"noopener\">735d967</a>, <em>\"Fix remote DoS in decodeWapPdu,\"</em> which shipped in the <strong>October 2026</strong> Android security release for Android 14 through 17. Rather than validate the length, it widens the caught exception so the crash is swallowed, and deletes the triggering message so it cannot re-crash on carrier redelivery or on boot:</p>\n    // WapPushOverSms.java: widen the catch to cover NegativeArraySizeException\n- } catch (ArrayIndexOutOfBoundsException aie) {\n+ } catch (RuntimeException e) {\n// InboundSmsHandler.java: a failed decode now deletes the poison message\n+ try { success = processMessagePart(tracker); }\n+ catch (RuntimeException e) { deleteFromRawTable(...); }  // breaks the boot loop\n    <p>This fix is part of the October 2026 Android security update. Devices updated to the October 2026 patch level or later are protected; devices on earlier patch levels remain vulnerable.</p>\n  \n  \n    05 / Proof of concept\n    <h2>Source &amp; APK</h2>\n    <p>The proof-of-concept Android app and full source code are published on GitHub. The app crafts the malformed WAP Push PDU and sends it as a data SMS to a target number.</p>\n    \n      <p><strong>Warning: this is a working weapon.</strong> The repository contains a proof-of-concept that can remotely disrupt and brick mobile phones. It is published strictly for security research, education, and defensive testing.</p>\n      <p><strong>Only run it against devices you own or are explicitly authorised to test.</strong> Using it against anyone else is a crime, and interfering with a person's ability to reach emergency services (000) is a serious criminal offence in Australia and most countries.</p>\n      <p>The software is provided \"as is\", with no warranty, under the <a href=\"https://github.com/MarkBlah/smsofdeath/blob/main/LICENSE\" target=\"_blank\" rel=\"noopener\">Apache License 2.0</a>. <strong>The author accepts no liability for any use, misuse, or damage.</strong> By downloading the APK or the source, you accept full responsibility for what you do with it.</p>"}];

    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
