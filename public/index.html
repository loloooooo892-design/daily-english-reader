*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {

<script>
var articles = [{"title":"\"Today, we are fighting fear\" - Final hearing in Rockstar Games vs. fired GTA 6 developers employment tribunal begins","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/rockstar-employment-tribunal-fired-gta-6-employees-iwgb","category":"gaming","categoryLabel":"Gaming","wordCount":717,"readingTime":4,"content":"<p>\"It closes our minds, our hearts, and our horizons.\"</p>\n    \n  \n  \n  \n  \n            <p>The final hearing in the <a href=\"https://www.eurogamer.net/companies/rockstar-games\" target=\"_blank\" rel=\"noopener\">Rockstar Games</a> versus the 31 fired <a href=\"https://www.eurogamer.net/gta-6-everything-we-know-so-far-9357\" target=\"_blank\" rel=\"noopener\">GTA 6</a> developers employment tribunal has begun in Scotland, and it's opened to rallies and rousing speeches from the people unceremoniously marched out of the company's offices last October.</p>\n<p><a href=\"https://bsky.app/profile/austinkelmore.com/post/3mv5lf727mc2h\" target=\"_blank\" rel=\"noopener\">Images</a> and videos shared on social media show a gathering of people with IWGB union banners and homemade placards - flaunting slogans such as \"what's disgusting; union busting\" and \"404: Rockstar's respect for workers not found\" - outside the Glasgow Tribunals Centre, where the hearing is taking place.</p>\n\n<p>But the centrepiece of the morning's activity was a rousing speech on the nature of fear by fired Rockstar employee Rachel Crawford. \"The modern workplace runs on fear: fear of speaking out, fear of being punished, fear of being fired, losing your livelihood and even your home,\" Crawford said, in <a href=\"https://bsky.app/profile/austinkelmore.com/post/3mv5o2dlxx22h\" target=\"_blank\" rel=\"noopener\">a video recorded by IWGB Game Workers union co-founder Austin Kelmore</a>.</p><p>\"On October 30th 2025 I was fired by Rockstar Games. I was fired without warning and without even being given a clear answer about what it was I'd done to deserve it. Within minutes, I was out the door, feeling humiliated and ashamed, and ever since I've replayed that day in my head wondering what I could or should have done differently.</p>\n<p>\"On that day, fear asserted its dominance. I felt its claws deep in my heart, urging me to run with my tail between my legs and never to look back. I saw it in my former colleagues, too afraid to talk to me or even, in some cases, to look at me. I heard it every time the ones who did speak to me told me how powerless they felt to do anything to stop or undo what had happened, even though they knew it was wrong.</p>\n<blockquote><p>Closing out the rally, @nershly.bsky.social beautifully speaks about her experience being fired by Rockstar and how they try to use fear.</p><p><a href=\"https://bsky.app/profile/did:plc:m2wtiwhflzv7ijhem7gimqqz/post/3mv5o2dlxx22h?ref_src=embed\" target=\"_blank\" rel=\"noopener\">[image or embed]</a></p>— Austin Kelmore (<a href=\"https://bsky.app/profile/did:plc:m2wtiwhflzv7ijhem7gimqqz?ref_src=embed\" target=\"_blank\" rel=\"noopener\">@austinkelmore.com</a>) <a href=\"https://bsky.app/profile/did:plc:m2wtiwhflzv7ijhem7gimqqz/post/3mv5o2dlxx22h?ref_src=embed\" target=\"_blank\" rel=\"noopener\">10 September 2026 at 09:46</a></blockquote><p>\"Fear wants to rule us. It closes our minds, our hearts, and our horizons. It makes us small, sad and hopeless. But today, we are fighting fear. This long-awaited hearing is an opportunity to put fear in its place below us. Over the next five weeks we will face fear and show that we refuse to be silenced by it. In spite of fear, we will stand up proudly, speak out truth, and demand a better industry, a better world that we all deserve.</p><p>\"And we're not just fighting fear in the courtroom. Many of my former colleagues at Rockstar Games have taken up the union's flag and are now pushing for the recognition, protection, and power that fear has denied them for too long. Fear will not defeat them and it will not defeat us. Union makes us strong. Thank you.\"</p>\n<p>Rockstar Games now has to answer allegations of unlawful dismissal and blacklisting after <a href=\"https://www.eurogamer.net/gta-6-rockstar-legal-dispute-blacklisting-claims\" target=\"_blank\" rel=\"noopener\">trying to get the case thrown out earlier this year</a>. The IWGB union, which is representing the fired employees, <a href=\"https://www.eurogamer.net/rockstar-north-employment-tribunal-gta-6\" target=\"_blank\" rel=\"noopener\">claims Rockstar removed the 31 staff because they were trying to unionise</a>, though Rockstar claims it fired them for \"gross misconduct\" and sharing confidential information on the IWGB Discord server.</p>\n\n<p>It's become a high profile issue in the UK, so much so <a href=\"https://www.eurogamer.net/rockstars-controversial-dismissal-of-31-employees-is-such-a-big-deal-its-made-its-way-to-uk-parliament\" target=\"_blank\" rel=\"noopener\">it was debated in Parliament</a> and <a href=\"https://www.eurogamer.net/gta-developer-rockstars-firing-of-union-staff-deeply-concerning-says-uk-prime-minister-keir-starmer\" target=\"_blank\" rel=\"noopener\">discussed by then Prime Minister Keir Starmer</a>, who called the matter \"deeply concerning\". <a href=\"https://www.eurogamer.net/gta-6-rockstar-enforcing-crunch-weaponising-bonus-payments-ignoring-widening-gender-pay-gap\" target=\"_blank\" rel=\"noopener\">A Rockstar Game Workers union</a> has also sprung up in response to last year's firings and has levelled yet more allegations against the company, around crunch and gender pay gaps, and weaponising bonus payments.</p><p>The final hearing should take around five weeks to run its course, meaning it'll run close to GTA 6's 19th November release. The <a href=\"https://www.eurogamer.net/rockstar-north-employment-tribunal-gta-6\" target=\"_blank\" rel=\"noopener\">IWGB seeks</a> - on the fired employees' behalf - either their reinstatement or compensation for them, \"as well as a finding from the tribunal that their dismissals were unfair\". Should a tribunal rule in favour of the fired employees, it could be a historic step towards official union representation at Rockstar, and more widely for the UK games industry. Perhaps it could lead to <a href=\"https://www.eurogamer.net/1900-blizzard-vote-historic-contract-union-layoffs-ai\" target=\"_blank\" rel=\"noopener\">union recognition such as we saw signed by Blizzard overnight</a>.</p>\n\n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Arrangements I Would Accept","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/arrangements-i-would-accept","category":"fun","categoryLabel":"Interesting Reads","wordCount":1156,"readingTime":6,"content":"<p>Marriage does not hold the same draw for me that it once did. You have to grow and change together—and I’m getting pretty set in my ways. I’m not sure if I’m capable of having a traditional marriage, but I could definitely have an arrangement. Marriage is hard; an arrangement is sexy, bold, mature. Getting married says, “I’m a romantic.” Having an arrangement says, “I know how the world works.” I’d, of course, like to fall in love, but if that isn’t in the cards I think it’s wise to have some creative solutions ready as a backup. The following are the arrangements I think I could live with.</p><p><strong>The Lavender Marriage</strong></p><p>A marriage of convenience to hide the fact that one or both of you is in the closet. I am so down to be some fun gay guy’s beard. I love going to a party with a secret. I used to think this sort of arrangement was just for famous people, but regular people do it now, too! Like Botox.</p><p><strong>The Business Partners</strong></p><p>This works best between two sociopathic characters on a prestige TV show, but, I mean, I belong in a power couple. And there’s something kind of cool about a practical, loveless joint venture. Maybe you have sex occasionally, but it’s purely for stress management. Not that this situation is entirely devoid of romance. Finding someone as cutthroat as you must feel like fate.</p><p><strong>The Artist and Their Muse</strong></p><p>I know, I know—I can’t be the muse. I’m not a free spirit. I don’t have the bone structure. My eyes are smaller than my nose and they can’t peer into your soul. My hair isn’t adorably short or impossibly long, and I’ve never woken up to find someone watching me sleep. (I <em>have</em> had boyfriends take photos of how stupid I look while I’m sleeping and text them to me later as a joke.) Some people are so beautiful that uglier, more well-read people have no choice but to spend years trying to capture that beauty through their art. So, O.K., I’m not the muse, but I could sit by a window, gazing at my wife dancing naked in the rain, and live a life inspired by the curve of her neck. She won’t love me as much as I love her, but that’s fine. I’ll have my work to keep me company when she doesn’t come home at night.</p><p><strong>Polyamory</strong></p><p>I’ve tried it. Half-heartedly, but I tried it. I’d <em>like</em> to be the type of person who could do this. Not in Hollywood, though. Out there in the real world. I’d love to live on a farm and work the land with my various lovers—who all love each other, too—having babies and planting vegetables. When polyamorous people pitch you on polyamory, it makes a ton of sense. It also makes sense when someone explains how to do a cartwheel. That doesn’t mean I can.</p><p><strong>Pen Pals</strong></p><p>Call me old-fashioned or avoidant or whatever, but I am obsessed with the idea of a pen pal. I’ve never had one and I want one so bad. There have been times when I’m about to re-download a dating app, and I consider writing to a prison inmate instead. Let me fall in love with somebody’s <em>soul</em>, goddammit. I want to masturbate to their handwriting.</p><p><strong>Infirm Person and Caregiver</strong></p><p>I don’t know if falling in love with someone who is dying is still a popular young-adult-novel trope (“<a href=\"https://www.amazon.com/Walk-Remember-Nicholas-Sparks/dp/0446608955\" target=\"_blank\" rel=\"noopener\">A Walk to Remember</a>,” “<a href=\"https://www.amazon.com/Fault-Our-Stars-John-Green/dp/1594137900\" target=\"_blank\" rel=\"noopener\">The Fault in Our Stars</a>,” etc.), but it was when I was a teen. That popular plotline and my own personal, trauma-rooted fear of terminal illness have made this scenario seem like a likely option because I assume that whoever marries me will inevitably have to deal with my getting sick. Whenever I date someone, I think, <em>Would you</em> <em>stay and take care of me, or would you run?</em> I once told my siblings that my boyfriend at the time would make a “great cancer husband.” They understood immediately.</p><p><strong>Gold and Gold-Digger</strong></p><p>I like it when rich people know that they’re being loved for their money. Hell, most of us are being loved for one aspect of ourselves above all others. It may not be your bank account, it may be your kindness or sense of humor or massive hog, but there’s one thing that your partner mentions first every time they’re asked to list your positive qualities.</p><p><strong>Common-Law Divorced</strong></p><p>This is a popular one. You hate each other but you stay married anyway—avoiding eye contact in the hallway, curling up on opposite ends of the couch, buying a California-king mattress—just a couple of martyrs keeping it together for the kids.</p><p><strong>Phantom of the Opera and Innocent Ingénue</strong></p><p>At this point, I’m too old to be the latter, so I will have to find a mask that fits.</p><p><strong>Strapping Young Man and Worldly Withholding Woman</strong></p><p>I’m not sure how old I have to be to do this, but I feel like it’s forty. You can probably start sooner if you’ve had more life experience and are willing to date younger—I personally couldn’t stomach anyone under the age of twenty-seven. For me, forty feels like the point at which I will start considering this option. (This arrangement is not to be confused with Old Soul and Cradle Robber, which we all know is disgusting.)</p><p><strong>Cheating Genius and Loyal Wife</strong></p><p>I think it’s sort of chic to make peace with your husband’s infidelity. To have people divulge his indiscretions to you, in an attempt to save you from this life, only to have you take a long drag of your cigarette and say, “You think I don’t know? That’s very sweet, darling. But I know who I married.”</p><p><strong>Nun and God</strong></p><p>If I get desperate enough, I will return to my old flame—the Lord. Sure, He tells you what to do and wear, but He’s not around that much. And you get so much quality time with other equally yoked women.</p><p><strong>Addict and Vice</strong></p><p>If I spend too many Christmases alone, this is bound to happen. I <em>will</em> develop an all-consuming addiction in the place of true love. (A low-energy addiction, of course. Booze or weed, not sex or bungee jumping.)</p><p><strong>Fuck Buddies at the Old Folks’ Home</strong></p><p>Better late than never, right? I would be O.K. with a lifelong lack of action if I got to have a powerful, whirlwind romance right at the buzzer. Maybe my roommate is another woman who devoted her life to her career and now, at ninety-seven, is finally slowing down. Maybe we start out as friends. Then, one day, our watery eyes meet over bowls of bland oatmeal and we just know. We die trying to have sex. Everyone talks about it for weeks. If you can’t have a good marriage, have a good story. ♦</p><p><em>This is drawn from “<a href=\"https://www.amazon.com/Actually-Nevermind-Essays-Taylor-Tomlinson/dp/1668097230/ref=tmm_hrd_swatch_0\" target=\"_blank\" rel=\"noopener\">Actually, Nevermind</a>.”</em></p>"},{"title":"Use of Flock Cameras Is Not a Fourth Amendment \"Search,\" District Court Rules","source":"The Volokh Conspiracy","author":"OrinKerr","url":"https://reason.com/volokh/2026/09/16/use-of-flock-cameras-is-not-a-fourth-amendment-search-district-court-rules/","category":"law","categoryLabel":"Law","wordCount":504,"readingTime":3,"content":"<p>For reasons explained in my draft article, <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7238178\" target=\"_blank\" rel=\"noopener\"><em>The Fourth Amendment After Chatrie</em></a>, there is good reason to believe that the Supreme Court's June ruling in <a href=\"https://www.supremecourt.gov/opinions/25pdf/25-112_0am4.pdf\" target=\"_blank\" rel=\"noopener\"><em>Chatrie v. United States</em></a> will trigger a rethinking of how the Fourth Amendment applies to automated license plate reader systems such as those provided by <a href=\"https://www.flocksafety.com/\" target=\"_blank\" rel=\"noopener\">Flock Safety</a>.  There was an oral argument in the Eleventh Circuit on this question on July 29 that you can listen to <a href=\"https://www.courtlistener.com/audio/105876/united-states-v-robert-slaybaugh/?q=%22fourth+amendment%22&amp;type=oa\" target=\"_blank\" rel=\"noopener\">here</a>, but there has been no ruling yet on that from the Eleventh Circuit.  Last week, however, the United States District Court for the Central District of California became the first court I'm aware of to weigh in on whether the use of Flock cameras is a Fourth Amendment search after <em>Chatrie</em>.</p>\n<p>The new ruling, <a href=\"https://drive.google.com/file/u/1/d/1PeM02GyDiOg0v8cWXfxfxgXLU1lZEio0/view?usp=sharing\" target=\"_blank\" rel=\"noopener\"><em>United States v. Riley</em></a>, concludes that use of Flock cameras was not a search. In the case, police investigating two kidnappings queried the Flock cameras of two California cities, obtaining four photographs each of the whereabouts of the defendant's car.   According to the court, this was not enough of a privacy invasion to constitute a Fourth Amendment search:</p>\n<blockquote><p>The ALPR database searches used during the Culver City and Carson investigations are thus clearly distinguishable from and less extensive than the \"near perfect surveillance\" achievable through the historical CSLI at issue in Carpenter and the Google Location History data at issue in Chatrie. The ALPR data in this case could not create \"an all-encompassing record\" of Defendant's whereabouts. Carpenter, 585 U.S. at 311. And although some of Defendant's path in the Dodge Charge and Chevrolet Malibu may be inferred, there is no indication in the record that law enforcement could recreate the complete paths that Defendant traveled in those cars, even in combination with information from other sources, such that officers could create a \"detailed log of [Defendant's] movements\" from the data at issue here. Id. at 312. Nor did this surveillance provide the \"intimate window\" into Defendant's personal life that concerned the Supreme Court in Carpenter. Id. at 311. That is to say, the ALPR data did not reveal defendants \"familial, political, professional, religious, and sexual associations.\" Id. Furthermore, the record does not show that the ALPR data here allows police to \"reconstruct 'retrospective[ly],' and with no real effort, [Defendant's] comings and goings in any area. Chatrie, 146 S. Ct. at 2208 (alteration in original) (quoting Carpenter, 585 U.S. at 312).</p>\n<p>For these reasons, the record here does not reveal a privacy threat analogous to the issues addressed in Carpenter and Chatrie. And it does not present \"dragnet type law enforcement practices\" constituting a Fourth Amendment search. United States v. Knotts, 460 U.S. 276, 284 (1983).</p></blockquote>\n<p>This is just a trial court decision, of course, and I assume it will be appealed to the court of appeals.  Other courts are considering the same question, and we don't know how they will rule.  But given the public interest in the issue, I thought I would flag the new opinion.  As always, stay tuned.</p>"},{"title":"He Won the Nobel Prize for Protein Design. Now He Uses AI to Create Molecules Not Found in Nature","source":"Wired","author":"@wired","url":"https://www.wired.com/story/nobel-prize-protein-design-now-using-ai-to-create-molecules-beyond-nature/","category":"tech","categoryLabel":"Technology","wordCount":900,"readingTime":5,"content":"<p>The natural world as we know it represents only a fraction of what might exist. Based on this idea, AI BioDesign was born: a scientific project that combines artificial intelligence and large-scale laboratory experiments to design and test <a href=\"https://www.wired.com/story/scientists-using-ai-and-quantum-computing-to-generate-new-peptides/\" target=\"_blank\" rel=\"noopener\">new molecules</a> and biological functions that are not found in nature but are physically and chemically possible.</p><p>In doing so, the researchers are aiming to create databases, models, and tools that could serve as “seeds” for developing the medicines and technologies of the future. The authors envision, for example, new drugs to <a href=\"https://www.wired.com/story/smart-nanoparticles-deliver-mrna-directly-to-tumors-in-new-cancer-therapy/\" target=\"_blank\" rel=\"noopener\">treat cancer</a> and neurodegenerative diseases or enzymes capable of <a href=\"https://www.wired.com/story/could-plastic-eating-moth-larvae-be-a-solution-to-environmental-pollution/\" target=\"_blank\" rel=\"noopener\">breaking down plastics</a> in the ocean.</p><p>The initiative is led by the Allen Institute, a biomedical research nonprofit in Seattle, along with the University of Washington and the Fred Hutchinson Cancer Center. Among the scientists leading the charge is David Baker, who shared the 2024 Nobel Prize in Chemistry for his work in <a href=\"https://www.wired.com/story/alphafold-changed-science-after-5-years-its-still-evolving/\" target=\"_blank\" rel=\"noopener\">computational protein design</a>.</p><p>For much of the history of biology, scientists have studied the solutions forged by billions of years of evolution. Exploring possibilities that nature never produced is a fundamentally new approach. And as technology makes this now possible, one that a leaders of the field even compares the potential of these methods to historic transformations such as industrialization, electrification, and the digital revolution.</p><p>However, delving into completely novel regions of biology also inevitably leads to <a href=\"https://www.wired.com/story/security-news-this-week-from-hacks-to-bioweapons-claude-misuse-is-now-everywhere/\" target=\"_blank\" rel=\"noopener\">difficult questions</a>. WIRED en Español spoke with David Baker, chief scientific officer at AI BioDesign, to address this and other topics.</p><p><em>This interview has been edited for length and clarity.</em></p><p><strong>JORGE GARAY: AI BioDesign seeks to explore possible molecules and biological functions that have never existed in nature. Are there any particular risks involved in venturing into this uncharted territory? How can scientists anticipate those risks and what steps can they take to minimize them before a designed molecule leaves the lab?</strong></p><p><strong>DAVID BAKER:</strong> What’s exciting about biology is that nature has explored only a fraction of what is physically and chemically possible, which opens a world of possibilities for what we could design. When we explore those possibilities, the primary risks are not much different than those associated with any new biological technology—unintended interactions with living systems, unexpected environmental effects, or misuse.</p><p>The advantage we have today is that computational design allows us to evaluate many of these risks before a molecule is ever synthesized. We can screen designs computationally, test them extensively in contained laboratory settings, and subject them to increasingly realistic experimental validation before considering any real-world application.</p><p><strong>The project mentions possibilities ranging from new drugs to plastic-degrading enzymes and even biological computers. If we have greater predictive power when designing new molecules and biological functions, how far do you think this capability could take us?</strong></p><p>My team and I have lofty goals for protein design: We’re working to build a world where a cure for a new disease is created in weeks, not decades. Where our air, water, and soil are clean because we removed pollutants and reimagined the processes that contaminated them. Where crops thrive in conditions that once killed them. Where molecular machines pull critical minerals from waste and repair the infrastructure we depend on.</p><p>Proteins are the molecular machines life has developed to create all organic matter we know of here on Earth. Unlocking their full potential requires that we derive engineering principles that make it possible for innovative new ideas, including ones we can’t yet imagine, to be achievable.</p><p><strong>As these models become more capable, could AI eventually design functional molecules that scientists themselves do not fully understand? If so, would it be enough to experimentally demonstrate that they work and are safe, or do you think we also need to understand the mechanisms?</strong></p><p>Science has often progressed in stages, and we see that mirrored in how machine learning has advanced protein design. The first step is usually observing that something works, and we often only later understand why. Machine learning is really good at that first stage—it has vastly improved our capability to observe patterns that can be leveraged for biological design. Strong experimental evidence can justify moving forward with projects, but deeper understanding remains an important objective both for our research and scientific inquiry overall. Much of what we cannot achieve today is due to a lack of understanding or data that defines the parameters for how specific systems work or do not. This is the crux of the AI BioDesign program.</p><p><strong>Are there molecules or biological functions that, in your opinion, should not be designed, even if it were technically possible to do so? What criteria should determine where that line is drawn?</strong></p><p>Decisions should be guided by a balance of potential benefits and potential harms. Applications that address major challenges in health, sustainability, or human well-being have a strong case for development. Conversely, designs that create <a href=\"https://www.wired.com/story/openai-anthropic-letter-ai-biological-weapons/\" target=\"_blank\" rel=\"noopener\">significant risks</a> to public safety, security, or the environment deserve heightened scrutiny and, in some cases, clear restrictions.</p><p>Just as we have developed frameworks for other powerful technologies, we need governance structures that evolve alongside advances in AI and biotechnology. I’ve advocated that those restrictions should include monitoring and logging all synthetic DNA that is manufactured to record the sequence and its creator. This creates a practical barrier to misuse and a record of any ill-intentioned attempts.</p><p><em>This story originally appeared on</em> <a href=\"https://es.wired.com/articulos/el-nobel-que-usa-ia-para-crear-moleculas-ineditas-en-la-naturaleza-nos-habla-del-potencial-y-los-peligros-del-biodiseno\" target=\"_blank\" rel=\"noopener\">WIRED en Español</a> <em>and has been translated from Spanish.</em></p>"}];
