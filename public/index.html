*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

  padding: 0 1.25rem;

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {

  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {
  color: var(--accent);
  text-decoration: none;

.archive-link a:hover {
  text-decoration: underline;

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }

<script>
var articles = [{"title":"Some Realism About Constitutional Remedies Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/","category":"law","categoryLabel":"Law","wordCount":1143,"readingTime":6,"content":"<h2>Introduction</h2>\n<p>The Supreme Court has wavered between two approaches to questions of executive power, which are often labeled institutional formalism and realism.  Formalism treats an institution like the presidency as a “black box” to which the Constitution assigns certain powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  In <em>Trump v. Hawaii</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a> for example, the Supreme Court upheld President Trump’s infamous travel ban<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> by focusing not on the “particular President”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> and his past call for a “complete shutdown of Muslims entering the United States,”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> but rather on “the authority of the Presidency itself.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a>  That is the language of institutional formalism.</p>\n<p>Realism, on the other hand, peers into the “black box,” taking account of how an institution actually works and who actually populates it before defining its powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  At times, the Roberts Court has shown glimmers of a more realist orientation.  In <em>Department of Commerce v. New York</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a> for instance, the Court discredited the Trump Administration’s explanation for why it added a citizenship question to the census by noting that “we are ‘not required to exhibit a naiveté from which ordinary citizens are free.’”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  That is the language of institutional realism.</p>\n<p>One can appreciate the allure of both approaches.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  On the one hand, formalism may feel credulous and impotent in the face of presidential misconduct.  On the other hand, the Court must craft rules of presidential power that will apply long after the incumbent administration has departed.  Wherever one stands on this jurisprudential debate about presidential power, though, we argue in this Essay that a dose of realism is entirely appropriate when it comes to crafting <em>remedies</em> for the executive branch.  Remedies, after all, necessarily straddle “the ideal and the real.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-11\" target=\"_blank\" rel=\"noopener\">11</a>  They aim to effectuate constitutional values in the world as it is.  To achieve that aim, constitutional remedies should take account of the nature and propensities of the administration to which they will be addressed.</p>\n<p>The Essay has three Parts.  In the first Part, we explain why it is generally important to the rule of law that the executive branch “self-apply” legal limits without the involvement of the courts.  We then canvass the evidence that the current President and his Administration lack an ethos of self-application.  Part II explores two remedial questions now vexing the federal courts.  First, the Administration has canceled grants to a broad array of recipients in plain violation of governing statutes and prior obligations of funds.  Second, the Administration has purported to remove numerous officials from independent agencies in violation of statutory removal protections.  In the ensuing challenges to these aggressive actions, the federal courts have faced a choice of remedy: whether an injured party may seek an injunction in district court to undo or to end the unlawful action, or must instead pursue a damages remedy for lost funds or backpay in the Court of Federal Claims (CFC).  We argue that injunctive relief or its functional equivalent in a district court is available in both contexts under existing statutes and precedents.</p>\n<p>Putting the first two Parts together, Part III argues that equitable remedies must be available today to make up for a lack of “self-application” by executive officials.  Monetary remedies alone are inadequate to constrain an executive branch populated by Holmesian “bad” men — that is, people who view the “law” only as a prediction of what a court will force them to do and who do not heed “the vaguer sanctions of conscience.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-12\" target=\"_blank\" rel=\"noopener\">12</a>  A “bad man” Executive facing only damages could achieve all its aims even if the courts ultimately adjudicate its actions to be illegal.</p>\n<p>Enter equity.  Two of the traditional functions of equity are to step in when legal remedies are inadequate and to prevent opportunism.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-13\" target=\"_blank\" rel=\"noopener\">13</a>  If </p>\n<p>an equitable remedy cannot make bad actors good in fact, it can at least force them to abide by a better standard.  In practical terms, “generally equity will order to be done that which ought to have been done.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-14\" target=\"_blank\" rel=\"noopener\">14</a>  That should be the courts’ remedial lodestar when confronted with a bad man.  An injunction, of course, does not need to be <em>issued</em> in every case, but it should at least be <em>available</em> in accord with traditional equitable principles, both as an external check on the Executive and to fortify any voices within the Executive calling for restraint.</p>\n<p>In the end, the adequacy of certain judicial remedies to uphold the rule of law depends on a culture of legality within the executive branch.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-15\" target=\"_blank\" rel=\"noopener\">15</a>  When officials are not committed to that culture, more robust equitable remedies are needed to protect the underlying constitutional principles at issue.  And courts today should indulge some realism about the nature of the current Administration when crafting remedies to keep it within legal bounds.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1834.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Pildes, <em>Institutional Formalism and Realism in Constitutional and Public Law</em>, 2013 Sup. Ct. Rev. 1, 2 (2014).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> 138 S. Ct. 2392 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2418; <em>see</em> <em>id.</em> at 2418–20.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> Pildes, <em>supra</em> note 1, at 2.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> 139 S. Ct. 2551 (2019).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2575 (quoting United States v. Stanchich, 550 F.2d 1294, 1300 (2d Cir. 1977) (Friendly, J.)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> Despite the overlapping terminology, the debate between institutional realism and institutional formalism is analytically distinct from the debate between functionalism and formalism in the separation of powers context.  Pildes, <em>supra</em> note 1, at 21 n.52; <em>see </em>John F. Manning, <em>Separation of Powers as Ordinary Interpretation</em>, 124 Harv. L. Rev. 1939, 1942–44 (2011) (distinguishing functionalism from formalism).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">^</a> Paul Gewirtz, <em>Remedies and Resistance</em>, 92 Yale L.J. 585, 587 (1983).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">^</a> O.W. Holmes, <em>The Path of the Law</em>, 10 Harv. L. Rev. 457, 459 (1897).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Henry E. Smith, <em>Equity as Meta-Law</em>, 130 Yale L.J. 1050, 1076–77 (2021).  As Lord Millett once put it, “equity adopts . . . the ‘good man’ theory of law.”  Peter Millett, <em>Bribes and Secret Commissions</em>, 1 Restitution L. Rev. 7, 20 (1993).  (We thank Sam Bray for this apt reference.)  Indeed, Justice Holmes himself was careful to carve out equity from his “bad man” theory of law.  Holmes, <em>supra</em> note 12, at 462–63.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">^</a> Henry L. McClintock, Handbook of the Principles of Equity § 24, at 53 (2d ed. 1948).  This is often the practical upshot of the familiar “maxim that equity regards that as done which ought to be done.”  <em>Id.</em>\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">^</a> <em>See </em>Nicholas R. Parrillo, <em>The Endgame of Administrative Law: Governmental Disobedience and the Judicial Contempt Power</em>, 131 Harv. L. Rev. 685, 697 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"“Tributaries,” by Kyle Edwards","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/flash-fiction/tributaries-kyle-edwards","category":"fun","categoryLabel":"Interesting Reads","wordCount":863,"readingTime":5,"content":"<p>“Just pretend,” his mother said, “that you’re under Lake Agassiz—that big-ass ancient lake that doesn’t exist no more but used to be huge, bigger than all the Great Lakes combined.” She said shit like this all the time, before heading into the woods for the night, bound probably for the town and the bars, and he never knew how to take it. “Pretend,” she’d say, squeezing his cheeks and making hers big like a blowfish, “that you can breathe underwater.” “Pretend, for just a little bit, that you don’t exist,” she’d whisper, promising to be back soon. But this time she didn’t say when she’d be back.</p><p>The boy was a Freedom Baby. He had no citizenship, no government name. He was, as his mother explained to him many times, a conscript of statelessness. He was like a ghost, a drifting spirit brought up on the land, off the land. He never knew exactly why they lived out there in the middle of nowhere. He knew nobody but his mother, knew nothing of cousins or grandparents or friendship. His mom had told him once that they were defending the land, defending the silica sand, the finest there was in the world. It was like powder. It was all over the place, on the ground and in the grass. He liked to scoop it up in his hands and blow it into the air like dust. They never stayed in the same place for too long. Some nights he’d be shaken awake in their little tent. “They’re coming for us,” his mother would say. “The miners and their police. They want this sand, and they’ll kill us for it.” And then they’d gather their things and move to the next spot under a starry sky.</p><p>She taught him that the sand was valuable. It was used to extract oil because it could penetrate the smallest of cracks. “Agassiz,” she’d say, “is still under us, giving us life, and if you dig far enough you’ll hit fresh water. When these mining companies dig for the sand they corrupt the waters beneath us.” He believed her, believed everything she told him. But, on nights when he couldn’t sleep, he often saw her wander off into the damp woods with strange men. For some reason, these men glowed red as he looked at them, and he thought of the stories she’d told him about vampires and wondered if they could see themselves in a mirror.</p><p>Recently, she’d been going away for longer. She’d started taking these pills, you see, pills in a bright orange bottle. He’d seen pills before and knew that they were medicine, because there had been a time when he’d had a fever, and his mother, with him in her arms, had raced into town to procure something that could cure him. The land couldn’t do it. That one trip had taught him the way to other people, and he knew that if he ever needed medicine again he could go there, but it would take a whole day, or a whole night, of walking and fighting the bogs. He’d asked her once why she needed medicine and if she’d be O.K., and she’d said only, “Helps me breathe.”</p><p>“So just pretend,” she said, tucking him in to sleep, “pretend that you’re swimming and nothing else matters but swimming.” But the boy waited, waited until she’d left the small clearing of their camp and then followed her. He stepped quietly along a narrow path that he knew would split in two: one way leading to the town and the other to nowhere. It was this way that she went, not toward bars or medicine. It was dark, so he had to follow her sound, her shaky steps, and the eclipse her body made against the moonlit sky. He heard the wild cries and claws of lynx somewhere in the trees. As he walked, the ground became wet and his socks heavy with water. He knew that there were no bogs in these parts. He reached down and felt the water and it was coarse. He kept going, and it got deeper, until it opened up into a lake—the whole of Agassiz, rising and crashing into rocks and trees, snapping off their branches. Ahead of him, his mother stopped, pressed the orange bottle to her lips, and drained whatever was in there. He could see the moon flickering on the water. He heard her crying out in the dark. He couldn’t be sure if it was in sadness or joy or both. And then, in one motion, she dove into the lake, leaving small ripples on the surface. He waited a moment, holding his breath the way she’d told him to, until Agassiz rose and covered his chest, and then he let it take all of him. The water was smoky with sand, silica, and in the distance he could see her drifting gently, her body at the mercy of Agassiz. He watched her, watched her limbs dancing in the hollowness of it. He kept his lips tight and his cheeks big, and eventually, like her, he stopped trying to swim and just floated. ♦</p>"},{"title":"All the RPS Supporter rewards for July 2026: space battles, messy desks, and puzzling dreams","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/all-the-rps-supporter-rewards-for-july-2026-space-battles-messy-desks-and-puzzling-dreams","category":"gaming","categoryLabel":"Gaming","wordCount":643,"readingTime":4,"content":"<p>Also, a new RSS feed</p>\n    \n  \n  \n  \n\n            <p><a href=\"https://www.rockpapershotgun.com/were-making-some-changes-to-the-rps-supporter-program-all-of-them-good\" target=\"_blank\" rel=\"noopener\">As previously explainderised</a>, not only do we want to do a better job of rewarding RPS Supporters with exclusive articles and other fineries, we want to a better job of highlighting what your patronage gets you, including the chance to catch up on exclusives you may have missed. Here, then, is the first in a series of roundups in which we bring together all of the past month’s Supporter articles, plus recaps of any news and developments around the program itself.</p>\n<p>And, if you’re reading this but haven’t subscribed: like what you see? <a href=\"https://www.rockpapershotgun.com/subscribe\" target=\"_blank\" rel=\"noopener\">Becoming an RPS Supporter</a> is the best way to help sustain the work that we do, and on top of everything here – plus all other Supporter-exclusive articles, past and future – you’ll also get fully ad-free browsing across the site. Bargain.</p>\n\n<h2>RPS Supporter rewards for July 2026</h2>\n<h3><a href=\"https://www.rockpapershotgun.com/feed/supporter\" target=\"_blank\" rel=\"noopener\">The shiny new Supporters RSS feed</a></h3>\n<p>By reader request, we now have a dedicated RSS feed for Supporter articles. Syndicated, simply. Really. Technically speaking, you don’t need to be a Supporter to access the feed, but it would make <em>significantly</em> more sense if you were.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/goin-assassins-creed-rogue-the-ship-heavy-black-flag-follow-up-i-totally-missed-while-farting-about-in-france\" target=\"_blank\" rel=\"noopener\">Goin’ (Assassin’s Creed) Rogue, the ship-heavy Black Flag follow-up I totally missed while farting about in France</a></h3>\n<p>Mark visits, for the first time, 2014’s <a href=\"https://www.rockpapershotgun.com/games/assassins-creed-rogue\" target=\"_blank\" rel=\"noopener\">Assassin’s Creed Rogue</a>: the bad guy-fronted black sheep of Ubisoft’s stealth 'n' ship battle series.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/i-know-silksong-sea-of-sorrows-secret-new-puzzle-mechanics-because-they-came-to-me-in-a-dream\" target=\"_blank\" rel=\"noopener\">I know Silksong: Sea of Sorrow's secret new puzzle mechanics, because they came to me in a dream</a></h3>\n<p>Game design? I could do that in my sleep, as I demonstrate by recounting (and doodling) a vision of <a href=\"https://www.rockpapershotgun.com/hollow-knight-silksong-walkthrough\" target=\"_blank\" rel=\"noopener\">Hollow Knight: Silksong</a>’s <a href=\"https://www.rockpapershotgun.com/hollow-knight-silksongs-first-big-expansion-sea-of-sorrow-flows-into-our-lives-for-free-next-year\" target=\"_blank\" rel=\"noopener\">upcoming DLC</a>.</p>\n\n<h3><a href=\"https://www.rockpapershotgun.com/i-miss-disappearing-into-thiefs-impenetrable-shadows\" target=\"_blank\" rel=\"noopener\">I miss disappearing into Thief's impenetrable shadows</a></h3>\n<p>Edwin’s been replaying <a href=\"https://www.rockpapershotgun.com/games/thief-the-dark-project\" target=\"_blank\" rel=\"noopener\">Thief: The Dark Project</a>, and has some wistful words on how well it has you sinking into the blackness of its hiding places.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/scout-report-i-need-your-help-to-stop-playing-house-of-legacy-please\" target=\"_blank\" rel=\"noopener\">Scout Report: I need your help to stop playing House of Legacy. Please</a></h3>\n<p>Regretfully, help was not found, so Sin was still enveloped in clan-building sandbox <a href=\"https://www.rockpapershotgun.com/games/house-of-legacy\" target=\"_blank\" rel=\"noopener\">House of Legacy</a> last we saw her.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/letter-from-the-editor-18-how-i-almost-broke-the-rps-100\" target=\"_blank\" rel=\"noopener\">Letter From The Editor #18: How I almost broke the RPS 100</a></h3>\n<p>In his latest, now-more-regular editorial missive, Julian shares the <a href=\"https://www.rockpapershotgun.com/best-pc-games-of-all-time\" target=\"_blank\" rel=\"noopener\">RPS 100</a> revamp that never was (thanks to do-nothing naysayers like James Archer), and provides a peek at some of our Gamescom 2026 plans.</p>\n\n<h3><a href=\"https://www.rockpapershotgun.com/scout-report-sim-fans-rejoice-hopefully-a-long-time-from-now-for-spacefleet-colon-heat-death\" target=\"_blank\" rel=\"noopener\">Scout Report: Sim fans rejoice, hopefully, a long time from now, for Spacefleet Colon Heat Death</a></h3>\n<p>Before she became a full-time clan lord, Sin was off exploring the stars and calculating missile trajectories in <a href=\"https://www.rockpapershotgun.com/games/spacefleet-heat-death\" target=\"_blank\" rel=\"noopener\">Spacefleet: Heat Death</a>.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/buried-deep-in-this-examination-of-a-cluttered-desk-is-a-portrait-of-a-champion-sussex-hog\" target=\"_blank\" rel=\"noopener\">Buried deep in this examination of a cluttered desk is a portrait of a champion Sussex hog</a></h3>\n<p>Julian takes Supporters on a tour of his desk detritus – my personal favourite is the hacksaw – before challenging the rest of us to share photos of ours. Oooh, it’s like that, is it. We’ll see.</p>\n\n<h3><a href=\"https://www.rockpapershotgun.com/remembering-duel_store_3-a-bad-team-fortress-2-map-i-made-my-home\" target=\"_blank\" rel=\"noopener\">Remembering duel_store_3, a bad Team Fortress 2 map I made my home</a></h3>\n<p>Edwin pines for quality stealth games, I pine for structurally uninterested FPS maps from my teenage years. But God, <em>what</em> a structurally uninteresting FPS map from my teenage years that was.</p>\n<h3><a href=\"https://www.rockpapershotgun.com/scout-report-crabmeat-is-a-simple-but-unsettling-exercise-in-light-suspense\" target=\"_blank\" rel=\"noopener\">Scout Report: Crabmeat is a simple but unsettling exercise in light suspense</a></h3>\n<p>Sin’s first Scout Report of the month, the fact of which makes me wonder if I should have done this list in chronological order, takes us aboard frigid crabbing vessel as it’s accosted by vengeful crustaceo-monsters. Having your own boat sounds nice, at least.</p><p>What a feast, indeed, our kind and nice-smelling Supporters have enjoyed this month. And there’s much more to come in August, including a RPS reader survey in which you’ll have the chance to tell us what <em>you</em> want RPS subscriptions to look like.</p>\n<p>For instance: seriously, should these roundups be in chronological order? I feel like I should have done this in chronological order.</p>"},{"title":"DHS Is Hiring Bounty Hunters to Find and Photograph Deported People’s Homes Abroad","source":"Wired","author":"@wired","url":"https://www.wired.com/story/dhs-is-hiring-bounty-hunters-to-find-and-photograph-deported-peoples-homes-abroad/","category":"tech","categoryLabel":"Technology","wordCount":598,"readingTime":3,"content":"<p>US Customs and Border Protection is seeking to hire private investigators to track down <a href=\"https://www.wired.com/story/the-us-is-about-to-deport-an-immigrant-to-the-center-of-the-ebola-crisis/\" target=\"_blank\" rel=\"noopener\">deported immigrants</a> and others who have left the United States, and press them into paying the government money, according to records reviewed by WIRED. The work would cover Mexico, Honduras, and Guatemala, and potentially other countries.</p><p>The <a href=\"https://www.documentcloud.org/documents/28537136-22170b06c26q000000xxattachment1-statementofwork/\" target=\"_blank\" rel=\"noopener\">documents</a>, which cap the so-called Tracing and Payment Recovery Services program at $9 million over the next two years, call for “commercial data verification and physical observation services” to confirm where each person lives. They list photographs of the home as acceptable evidence, along with records such as utility bills, employment files, court documents, or, if the person has died, a death certificate.</p><p>The US government will also accept other documentation, so long as it deems it “relevant and credible.” Contractors are also required to deliver a printed flyer, approved by the US government and printed in English and Spanish, listing outstanding fines and fees CBP claims they owe.</p><p>As of July, the <a href=\"https://www.wired.com/tag/department-of-homeland-security/\" target=\"_blank\" rel=\"noopener\">Department of Homeland Security</a>, CBP’s parent agency, says it has issued <a href=\"https://www.dhs.gov/news/2026/07/23/dhs-announces-more-84-billion-civil-fines-issued-illegal-aliens\" target=\"_blank\" rel=\"noopener\">more than $84 billion in fines</a> to immigrants it has accused of failing to depart the United States, citing an obscure provision of a 1996 immigration law that sat unused until Donald Trump’s first term. Those fines run against people who are still in the country, at $998 a day for up to five years. Some have reached up to $1.8 million.</p><p>Hasan Shafiqullah, the Legal Aid Society’s immigration supervising attorney, says he’s seen some third-party collection agencies add <a href=\"https://www.documentcloud.org/documents/28537133-cmp-collection-letter/\" target=\"_blank\" rel=\"noopener\">$500,000</a> in additional administrative fees on top of the US government’s fees.</p><p>Legal experts say that the fine notices evade due process and are meant to intimidate people into self-deporting. A <a href=\"https://www.law.nyu.edu/sites/default/files/2026-08/Debt-and-the-Deportation-Agenda.pdf\" target=\"_blank\" rel=\"noopener\">recent report</a> from the New York University School of Law’s Immigrant Rights Clinic found that immigrants accused of failing to depart have had their tax returns seized, their wages garnished, and their credit scores ruined after receiving fine notices.</p><p>DHS promises that it will forgive failure-to-depart fines if people self-deport using the <a href=\"https://www.wired.com/story/trump-administration-wants-immigrants-to-self-deport/\" target=\"_blank\" rel=\"noopener\">CBP Home app</a>. A CBP spokesperson says, “Individuals who choose not to take advantage of available self-departure options via CBP Home may remain subject to previously assessed fines or penalties for failure to depart the U.S. even after they departed the country.”</p><p>The waiver does not include a separate $5,130 fee Congress created last year for people ordered removed in absentia and later arrested by ICE, which the statute bars from waiving or reducing. Someone who left through the app on the promise of a clean slate could still carry that balance.</p><p>Alina Das, a law professor and director of NYU’s Immigrant Rights Clinic, says going after people who have left the country with outstanding fines would be a “significant escalation in tactics.”</p><p>Charles Moore, a senior attorney at Public Justice, says that the move is “part and parcel” with the Trump administration’s harsh anti-immigration efforts and that it is likely meant to deter people in the countries targeted from wanting to come to the US in the future.</p><p>The three debt collection agencies CBP already uses have tried to reach people overseas by letter and phone. As of July, according to the documents, they had not located a single person outside the US. At that time, they say, the government had removed an estimated 66,387 people carrying unpaid CBP fines and penalties.</p><p>Mexico’s foreign ministry, Guatemala’s ministry of foreign affairs, and Honduras’s secretariat of foreign affairs did not respond to questions about whether the United States had consulted them or whether they would cooperate with the contractors.</p>"}];

  var hasMore = articles.length > 1;

}

}

function esc(s) {
