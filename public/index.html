*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Is Jensen Huang’s Affair a Crisis for the A.I. Boom?","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-lede/is-jensen-huangs-affair-a-crisis-for-the-ai-boom","category":"fun","categoryLabel":"Interesting Reads","wordCount":1260,"readingTime":7,"content":"<p>The Nvidia C.E.O. <a href=\"https://www.newyorker.com/newsletter/the-daily/what-jensen-huangs-affair-means-for-nvidia\" target=\"_blank\" rel=\"noopener\">Jensen Huang’s affair</a> with a Chinese businesswoman whom U.S. officials believe to be a spy could, as others have pointed out, turn out to be the costliest extramarital dalliance of all time. After <a href=\"https://www.nytimes.com/2026/10/29/us/politics/nvidia-china-jensen-huang-trump.html\" target=\"_blank\" rel=\"noopener\">the <em>Times</em> reported</a> on Huang’s relationship with the woman—Alice Huang, or Huang Le, an executive at a Singapore-based tech firm called Megaspeed International—he confessed over the weekend that he had been “unfaithful.” (The Chinese government has denied that Alice Huang is an intelligence asset and called the story “a smear.”) By Tuesday afternoon, Nvidia’s stock had tumbled by more than ten per cent, and Huang’s stake in the chip company had lost more than seventeen billion dollars of its value. On the plus side for Huang, the roughly eight hundred and seventy million shares that he and his family trusts own were still worth about a hundred and forty-five billion dollars.</p><p>Known for his A.I. evangelism and his black leather jackets, Huang, along with <a href=\"https://www.newyorker.com/magazine/2023/08/28/elon-musks-shadow-rule\" target=\"_blank\" rel=\"noopener\">Elon Musk</a> and Mark Zuckerberg, has led the trend of tech billionaires dressing like rock stars. On trips to Asia and Europe, he’s sometimes been mobbed by fans—a phenomenon that became known as Jensen-mania. His celebrity has rested on the foundational role that Nvidia plays in the A.I. ecosystem, where its high-powered microchips are used to train and run large language models like ChatGPT and Claude. A single Nvidia G.P.U. (graphics-processing unit) can cost <a href=\"https://www.newyorker.com/magazine/2026/10/26/computer-chips-are-the-most-magnificent-things-weve-ever-made\" target=\"_blank\" rel=\"noopener\">more than fifty thousand dollars</a>, and some big data centers employ tens of thousands of them. In the past few years, as the great A.I. build-out has proceeded, the demand for Nvidia’s products has greatly exceeded the supply, enabling the company to raise prices and <a href=\"https://www.newyorker.com/news/the-financial-page/the-ai-industry-is-booming-when-will-it-actually-make-money\" target=\"_blank\" rel=\"noopener\">generate vast profits</a>. In the quarter that ended in July, it made nearly sixty billion dollars on revenues of ninety-six billion—a margin that loan sharks would envy.</p><p>In Silicon Valley and on Wall Street, many people associate Nvidia and its success almost entirely with Huang, who founded the company in 1993 and who hasn’t made any succession plans. “In many ways, Jensen is Nvidia’s Steve Jobs,” Daniel Newman, the C.E.O. of Futurum Group, a tech-advisory firm, told the <em>Wall Street Journal</em>. Given Huang’s importance to his company, it is perhaps surprising that Nvidia’s stock didn’t fall by even more. When the rival chipmaker Intel issued weak earnings guidance last month, its shares plunged by about thirty per cent.</p><p>Huang and Alice Huang are now tabloid fodder: “HUANG HUANG BANG BANG” the front page of the New York <em>Post</em> blared on Monday. But the scandal goes beyond sex and money. According to the <a href=\"https://www.wsj.com/tech/the-chinese-woman-at-the-center-of-a-spy-probe-after-an-affair-with-jensen-huang-7bb406d2\" target=\"_blank\" rel=\"noopener\"><em>Journal</em>’s reporting</a>, Alice Huang, who had previously worked in television and finance, moved to Megaspeed in 2023, not long after the Biden Administration introduced restrictions on the sale of high-end Nvidia chips to China. The following year, <a href=\"https://www.nytimes.com/2025/10/09/technology/nvidia-chips-china-megaspeed.html\" target=\"_blank\" rel=\"noopener\">a <em>Times</em> investigation</a> revealed, Megaspeed started purchasing these Nvidia chips in large numbers. Some of them were installed in data centers in Malaysia and Indonesia, but U.S. officials grew concerned that others may have been diverted to China.</p><p>A spokesman for Nvidia told the <em>Times</em> last year that there was no evidence of smuggling. He also said the firm’s compliance department had looked into Megaspeed and found that it was “wholly owned and operated by a company based and headquartered outside China, with no China shareholders.” It’s hard to take that statement at face value. Last week, days before Jensen Huang confirmed the affair, the <em>Times</em> reported that the same Nvidia spokesman had said the C.E.O.’s interactions with Alice Huang were “not unusual,” and were consistent with meetings he has with many of Nvidia’s customers.</p><p>Senior members of the Trump Administration, beginning with the President, also have a lot of explaining to do. In the past couple of years, Huang has emerged as a close adviser to Donald Trump on A.I. policy, and a supporter in other areas, too. In October of last year, Nvidia donated twenty-five million dollars to one of the <a href=\"https://www.newyorker.com/magazine/2026/09/14/donald-trumps-capital-makeover\" target=\"_blank\" rel=\"noopener\">President’s pet projects</a>, the renovation of the East Wing. (Huang said at the time that he was “incredibly proud and delighted to help contribute in a small way.”) Just weeks later, in a significant relaxation of Biden’s export restrictions, Trump announced that Nvidia would be allowed to sell its powerful H200 chips to China.</p><p>In May, Huang accompanied Trump on a state visit to Beijing, hopping onto Air Force One in Alaska after a last-minute request from the President. According to the <em>Times</em>, the China trip came after a highly classified memo, produced under the oversight of Secretary of State Marco Rubio, warned top U.S. officials that the Nvidia C.E.O. was in a close relationship with a Chinese spy. In response to a question from reporters on Sunday, Trump said he didn’t regret not acting on the intelligence, adding that he regarded Huang as “an honorable guy” who “probably has an excuse for it.” On Monday, Trump said the F.B.I. was looking into the Huang matter, but added, “I think that he’ll be in good shape.” Trump also said that he had spoken to Huang, who had told him he hadn’t known that Alice Huang was a spy. “I really believe him,” the President added. That same day, Hakeem Jeffries, the likely next Speaker of the House, said Congress “needs more information” about the Nvidia scandal.</p><p>The emerging line from Huang’s defenders is that A.I. is so vital to America’s future, and Huang is so vital to Nvidia, that, like the big banks during the great financial crisis, he’s too big to fail. (“Jensen is irreplicable for America’s A.I. leadership,” the <em>MAGA</em>-friendly venture capitalist Shaun Maguire posted on X.) At least on the basis of the initial market reaction, this argument can be questioned. As shares in Nvidia slid on Monday, the rest of the stock market, which the A.I. trade has been driving all year, rallied strongly. The tech-heavy Nasdaq closed up by nearly 2.75 per cent.</p><p>Evidently, the fate of the <a href=\"https://www.newyorker.com/news/the-financial-page/the-ai-boom-and-the-spectre-of-1929\" target=\"_blank\" rel=\"noopener\">A.I. boom</a> rests on larger questions than whether Jensen Huang was aware, or should have been aware, that his lover was a spy. Among the tech companies whose stocks jumped on Monday were A.M.D., Intel, and Alphabet. Though Nvidia retains a big lead in chips used to train the most advanced large language models, all three produce chips that compete with its products in some parts of the A.I. ecosystem. A.M.D.’s revenues from sales to data centers rose by nearly a hundred per cent in the latest quarter. Alphabet’s Google division is developing chips designed for small language models used for specialized tasks, such as on-device translation and operating household devices.</p><p>Nvidia’s grip on the A.I. industry, which earlier this year propelled its market valuation to $5.5 trillion, could gradually become less tight. Right now, though, it would be folly to understate the company’s role in building and financing the A.I. infrastructure that already exists or is under development. As well as supplying many of the chips that A.I. data centers rely on, Nvidia has, according to one tally, provided three hundred billion dollars in financial support, including loans and credit guarantees, to the customers that bought these products. On Wall Street, there is intense debate about the soundness of these circular-financing arrangements; one thing not in doubt is that an acute crisis at Nvidia could propagate across the A.I. sector, with consequences that are hard to predict. The betting on Wall Street is that the spy scandal won’t rise to those proportions, but it’s still unfolding. ♦</p>"},{"title":"Even Black Friday Will Be More Expensive Than Usual","source":"Wired","author":"@wired","url":"https://www.wired.com/story/even-black-friday-2026-will-be-more-expensive-than-usual/","category":"tech","categoryLabel":"Technology","wordCount":595,"readingTime":3,"content":"<p>Black Friday, the deal-drenched <a href=\"https://www.wired.com/tag/black-friday/\" target=\"_blank\" rel=\"noopener\">marketing blitz</a> that kicks off the holiday shopping spree, might feel more muted this year.</p><p>That’s because just about everything is <a href=\"https://www.wired.com/story/we-are-in-the-knockout-round-of-price-increases-for-consumer-electronics/\" target=\"_blank\" rel=\"noopener\">getting more expensive</a>. As the global economy reckons with challenges from the AI industry’s <a href=\"https://www.wired.com/story/solving-the-pc-memory-crisis/\" target=\"_blank\" rel=\"noopener\">memory crisis</a> and the <a href=\"https://www.wired.com/story/how-the-iran-war-could-jack-up-prices-on-store-shelves/\" target=\"_blank\" rel=\"noopener\">ongoing war in Iran</a>, prices for many products have risen, especially consumer electronics like <a href=\"https://www.wired.com/tag/smartphones/\" target=\"_blank\" rel=\"noopener\">smartphones</a> and <a href=\"https://www.wired.com/story/sonys-ps5-price-hikes-prove-this-console-generation-is-far-from-over-good/\" target=\"_blank\" rel=\"noopener\">gaming consoles</a>.</p><p>While many <a href=\"https://www.wired.com/story/best-black-friday-deals-11%E2%80%9311%E2%80%932026/\" target=\"_blank\" rel=\"noopener\">sales have already begun</a>, the prices on offer may feel less like a deal than in years past. Weaker deals will likely revolve around products that use a lot of memory (RAM). Gadgets like <a href=\"https://www.wired.com/story/best-robot-vacuum/\" target=\"_blank\" rel=\"noopener\">robot vacuums</a>, <a href=\"https://www.wired.com/gallery/best-wireless-headphones/\" target=\"_blank\" rel=\"noopener\">headphones</a>, and other products that don’t rely as much on memory may see better prices.</p><p>“Things are getting more expensive, and they'll probably continue to get more expensive well into 2027, maybe even 2028,” says Jitesh Ubrani, <a href=\"https://my.idc.com/getdoc.jsp?containerId=PRF003967\" target=\"_blank\" rel=\"noopener\">director of Consumer Devices Research</a> at IDC. “When it comes to PCs, tablets, those kinds of devices, that's where everyone's going to struggle.”</p><p>Case in point: Amazon, the absolute behemoth of Black Friday and Cyber Monday sales, has <a href=\"https://www.wired.com/story/amazon-increases-prices-kindle-echo-sept-2026/\" target=\"_blank\" rel=\"noopener\">hiked the prices</a> of its latest <a href=\"https://www.wired.com/story/amazon-kindle-paperwhite-colorsoft-2026-refresh/\" target=\"_blank\" rel=\"noopener\">Kindles</a>, <a href=\"https://www.wired.com/story/amazon-alexa-tablets-2026/\" target=\"_blank\" rel=\"noopener\">tablets</a>, and <a href=\"https://www.wired.com/story/amazon-adds-an-alexa-photo-frame-and-a-bedside-clock-to-its-echo-family/\" target=\"_blank\" rel=\"noopener\">Echo speakers</a>, meaning its next sale on those devices likely won’t impress compared to years past.</p><p>Black Friday and Cyber Monday remain the best shopping days of the year, says Edgar Dworsky, a consumer advocate who has long used his website <a href=\"https://www.consumerworld.org/\" target=\"_blank\" rel=\"noopener\">Consumer World</a> to call out companies that <a href=\"https://www.nytimes.com/2022/11/26/climate/fighting-shrinkflation-consumer-products.html\" target=\"_blank\" rel=\"noopener\">stealthily raise</a> product prices.</p><p>“However, just because an item is advertised with significant savings claimed, doesn't mean it is a good deal or the best price,” Dworsky wrote in a message to WIRED.</p><p>Dworsky recommends tracking Amazon’s prices by monitoring price-history websites like <a href=\"https://camelcamelcamel.com/\" target=\"_blank\" rel=\"noopener\">CamelCamelCamel</a>. Google has a built-in price-tracking tool in the Chrome browser, but many other third-party extensions do the job as well.</p><p>“Because of high memory prices, laptops, desktops, and SSDs will still be on sale,” Dworsky predicts. “But not nearly as low-priced as previously offered.”</p><p>It might be a good move to buy a <a href=\"https://www.wired.com/story/buying-a-used-iphone-makes-more-sense-than-ever/\" target=\"_blank\" rel=\"noopener\">used or refurbished</a> gadget. Sean Cleland, vice president of Mobility Tech at the product resale company <a href=\"https://bstock.com/\" target=\"_blank\" rel=\"noopener\">BStock Solutions</a>, says some manufacturers are leaning into selling refurbished units more than ever, even buying them from resellers like BStock. They're filling gaps in the <a href=\"https://www.wired.com/story/best-cheap-phones/\" target=\"_blank\" rel=\"noopener\">budget phone</a> market by offering up refurbished products.</p><p>“The new trend that we're seeing is the [manufacturers] buying back their own stuff in the secondary market so that they can refurbish it and sell it as authorized refurbished or certified renewed,” Cleland says. “They're trying to get anything and everything back.”</p><p>What Black Friday will be good for, it seems, is the companies selling all this stuff. They get to set the costs, after all. With all the economic turmoil in the market, companies have been adept at passing additional costs to consumers.</p><p>“There's no good news right now for consumers,” Ubrani says. “It's unfortunate that the consumers are the ones who are going to struggle because of all this.”</p><p>So maybe the deals won’t be great. But they might be the best you can get for a while. The memory crisis isn’t ending anytime soon, so now might be the time to get something you need. If you do that, Ubrani recommends making sure it’s something you actually need. And something that will keep working for a long time.</p><p>“They should be purchasing the most amount of performance that they can afford today,” Ubrani says. “We're going to face elevated pricing for years. You want that device to last you for a while.”</p>"},{"title":"Supreme Court allows Trump administration to continue border wall construction","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/","category":"law","categoryLabel":"Law","wordCount":1004,"readingTime":6,"content":"<p>The Supreme Court on Monday cleared the way for the Trump administration to resume construction of a border wall in the Big Bend region of southwestern Texas. In a four-page, unsigned <a href=\"https://www.supremecourt.gov/opinions/26pdf/26a560_onkq.pdf\" target=\"_blank\" rel=\"noopener\">opinion</a>, the justices granted the government’s request to pause an order by a federal district judge that had temporarily halted the project. Only Justice Ketanji Brown Jackson indicated, without explanation, that she would have denied the government’s request.</p><p>The dispute began earlier this year, when then-Homeland Security Secretary Kristi Noem and her successor, Markwayne Mullin, issued three waivers of various environmental and conservation laws to authorize construction of the wall in the Big Bend region, which includes parts of Big Bend National Park. Noem and Mullin relied on a provision of the <a href=\"https://www.govinfo.gov/content/pkg/PLAW-104publ208/pdf/PLAW-104publ208.pdf\" target=\"_blank\" rel=\"noopener\">Illegal Immigration Reform and Immigrant Responsibility Act of 1996</a> that gives the DHS secretary <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153649084_Ruidosa_Application_Final.pdf\" target=\"_blank\" rel=\"noopener\">the power to</a> “waive all legal requirements” necessary “to ensure expeditious construction” of border walls and roads. When they announced the waivers, Noem and Mullin indicated that the Big Bend area “is an area of high illegal entry” requiring additional walls and barriers.</p><p>A group of plaintiffs opposed to the construction – an environmental group, a local landowner who works as a river guide, and a group formed to preserve a church – <a href=\"https://biologicaldiversity.org/programs/government-affairs/pdfs/0001-Complaint.pdf\" target=\"_blank\" rel=\"noopener\">went to federal court</a> to challenge the waivers’ legality. On <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153710031_Ruidosa_Appx_Final.pdf#page=203\" target=\"_blank\" rel=\"noopener\">Oct. 2</a>, U.S. District Judge Kathleen Cardone temporarily barred the Department of Homeland Security from continuing construction on the border wall in the Big Bend region “until and unless” the government complies with environmental and other applicable laws.</p><p>In a written <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153710031_Ruidosa_Appx_Final.pdf#page=205\" target=\"_blank\" rel=\"noopener\">opinion</a> that she released on Oct. 14, Cardone reasoned that the challengers were likely to prevail on their claim that the DHS secretary did not have the authority to issue the waivers. She relied on the major questions doctrine – the idea that if Congress intends to give a federal agency the power to make decisions of vast economic or political significance, it must say so very clearly. In particular, she emphasized, the Big Bend region is not an area with a high number of illegal entries. To the contrary, she stated, although it “comprises over 25% of the U.S.-Mexico border,” it makes up only a tiny percentage (“between 0.3% and 2.2%”) of the migrants apprehended while crossing the border. Therefore, she wrote, “if the Big Bend Sector is an area of high illegal entry, so is every other sector, and the waiver authority would apply to the entire U.S.-Mexico border. If that were the case, Congress could have simply authorized construction ‘to deter illegal crossings.’” The major questions doctrine instructs courts to avoid “interpretations that would render limiting language meaningless,” Cardone concluded.</p><p>After Cardone declined to pause her ruling to give the government time to seek Supreme Court review, the Trump administration <a href=\"https://www.scotusblog.com/cases/mullin-v-friends-of-the-ruidosa-church/\" target=\"_blank\" rel=\"noopener\">came to the Supreme Court</a>, where it asked the justices not only to temporarily freeze Cardone’s order but also to grant review and summarily (that is, without additional briefing or oral argument) reverse it. U.S. Solicitor General D. John Sauer <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153649084_Ruidosa_Application_Final.pdf\" target=\"_blank\" rel=\"noopener\">argued</a> that Cardone lacked the power to consider the challengers’ claim based on the major questions doctrine because their complaint specifically alleged that the DHS secretary “lacked ‘clear congressional authorization’ … to issue the waivers” under the IIRIRA – which, he said, was a statutory claim that “Congress denied district courts” the authority “to entertain.” But in any event, Sauer continued, even if the DHS secretary’s power to issue waivers under IIRIRA “implicates a question of ‘vast economic and political significance,’ Congress <em>did</em> clearly authorize the Secretary both to build border barriers and to waive legal requirements in order to facilitate their expeditious construction.”</p><p>The challengers urged the justices to leave Cardone’s order in place. Eric Glitzenstein, a lawyer representing the plaintiffs, told the justices in <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/431171/20261029144652160_RuidosaStayOppSCOTUS.pdf\" target=\"_blank\" rel=\"noopener\">a 40-page filing</a> that if her order were paused or lifted, it would permit the Trump administration to “immediately resume blasting, bulldozing, road construction, and other border barrier-related construction across one of the most remote and ecologically and culturally significant landscapes in the United States.”</p><p>The challengers argued that the major questions doctrine applied to their claim. They emphasized that the DHS secretary’s “decision to waive myriad federal, state, local, and tribal laws across vast geography for the purpose of building border infrastructure, even through national and state parks where border crossings are miniscule, is a truly ‘extraordinary’ assertion of power.” Because Congress “did not clearly authorize the sweeping exercise of power asserted here,” they wrote, the government’s “actions therefore amount to a constitutional violation of the major questions doctrine.”</p><p>In Monday’s opinion, the justices denied the government’s request to summarily reverse Cardone’s ruling but granted its request to put it on hold. “The Government,” the court explained, “is exceedingly likely to prevail on its argument” that Cardone did not have the power to consider the challengers’ “so-called major-questions-doctrine claim.” That claim, the court emphasized, contends only “that the Secretary exceeded his statutory authority,” which is not a constitutional claim. This is true, the court continued, even if the challengers rely on the major-questions doctrine, because that doctrine is a rule used to interpret laws. “There is no such thing as a ‘constitutional’ major-questions claim.”</p><p>The other factors that courts normally consider in deciding whether to pause a lower court’s decision also point in the government’s favor, the justices said. For example, Cardone’s order “delays the Government’s construction of border barriers and roads in the Big Bend Sector” and, as a result, “impedes the Government from advancing its ‘compelling interests’ in border security and integrity.” Moreover, the government is suffering permanent harm from the costs – “nearly half a million dollars … per day” – that it is incurring while the construction is on hold, but which cannot be recovered. Finally, the court wrote, “[t]he Government’s interest … outweighs any aesthetic, recreational, and environmental harm alleged by” the challengers.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Supreme Court allows Trump administration to continue border wall construction</em>, SCOTUSblog (Nov. 9, 2026, 3:37 PM), https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/</p>"},{"title":"Palworld developer Pocketpair gives employees time off for 'a 5-day business trip in Vice City when GTA 6 launches'","source":"PC Gamer","author":"Lincoln Carpenter","url":"https://www.pcgamer.com/games/grand-theft-auto/palworld-developer-pocketpair-gives-employees-time-off-for-a-5-day-business-trip-in-vice-city-when-gta-6-launches/","category":"gaming","categoryLabel":"Gaming","wordCount":506,"readingTime":3,"content":"<p>Amid the countless PTO requests and conspicuously-timed doctor appointment notices targeting November 19, one game studio's employees have been absolved of the need to provide themselves an alibi on <a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 6</a>'s launch day. Pocketpair <a href=\"https://x.com/Palworld_EN/status/2120864259907452930?a=loFbHIy9eN-R7RNSm5A&amp;s=20\" target=\"_blank\" rel=\"noopener\">announced on X</a> today that all of its employees \"have been granted special leave to attend to an urgent five-day business trip in Vice City when GTA 6 launches.\"</p><p>\"On November 19, millions of gamers around the world will find themselves sitting at school or work, gazing longingly out the window, knowing that a new era of gaming is about to begin,\" Pocketpair wrote in a memo announcing the company holiday. \"At Pocketpair, we believe such a historic occasion deserves our full attention.\"</p><p>From November 19 to November 23, \"all employees who intend to play Grand Theft Auto 6\" at Pocketpair will be \"excused from their regular duties and are instead encouraged to undertake a business trip to Vice City.\" Technically, since that time spans a weekend, it's only really granting <em>three </em>days of holiday time. But, you know, who's counting?</p><p>The studio also made sure to note that work is proceeding on updates for Palworld and Craftopia, which are \"expected to be carried out as scheduled,\" presumably in an effort to preempt anyone who might be reaching for their torches and pitchforks.</p><p>Pocketpair's not the only company providing those on its payroll with some well-timed time off. Earlier this week, <a href=\"https://www.tomshardware.com/video-games/pc-peripheral-maker-logitech-giving-all-of-its-7-000-employees-the-day-off-to-play-gta-6-company-announces-game-day-initiative-dedicated-vacation-day-to-play-video-games\" target=\"_blank\" rel=\"noopener\">Logitech announced Logi Game Day</a>, offering its 7,000 employees a day off to \"formally\" recognize \"the cognitive and professional benefits of gaming\"—which the company has chosen to acknowledge on November 19, specifically.</p><p>Robin Piispanen, general manager of the Logitech G gaming brand, did say employees are free to play whatever game they want, though. Corporate benevolence knows no bounds.</p><p>Outside of the immediate gaming industry ecosystem, California-based automotive performance parts manufacturer Burger Motorsports announced on its Instagram that it will be \"observing a temporary company-wide operational pause\" on GTA 6's launch day, after determining that \"normal business operations may be impacted.\" Likewise, Canadian truck manufacturer Edison Motors opted to <a href=\"https://zamin.uz/en/technology/209934-companies-worldwide-grant-employees-days-off-for-gta-vi-release.html\" target=\"_blank\" rel=\"noopener\">grant its employees a four-day weekend</a> beginning on November 19.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>We wish all of those enjoying time off next week—whether employer-provided or otherwise—some pleasant hours of gaming. Meanwhile, we'll be here, covering a game we still don't know when to expect on PC. It's fine. We're fine with it. Nobody's jealous.</p>\n\n<p>Lincoln has been writing about games for 12 years—unless you include the essays about procedural storytelling in Dwarf Fortress he convinced his college professors to accept. Leveraging the brainworms from a youth spent in World of Warcraft to write for sites like Waypoint, Polygon, and Fanbyte, Lincoln spent three years freelancing for PC Gamer before joining on as a full-time News Writer in 2024, bringing an expertise in Caves of Qud bird diplomacy, getting sons killed in Crusader Kings, and hitting dinosaurs with hammers in Monster Hunter.</p>"}];
