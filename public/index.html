*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"I Test Air Purifiers, and These Are the Deals I’d Shop Before Prime Day","source":"Wired","author":"@wired","url":"https://www.wired.com/story/shark-air-purifier-deal-october-2026/","category":"tech","categoryLabel":"Technology","wordCount":549,"readingTime":3,"content":"<p>The Shark NeverChange air purifier is already affordable, but this 40 percent discount makes it an even better deal. Like other models in Shark's NeverChange line, this <a href=\"https://www.wired.com/gallery/best-air-purifiers/\" target=\"_blank\" rel=\"noopener\">model</a> boasts a five-year filter lifespan when used and cleaned as recommended, potentially saving hundreds of dollars on replacement filters.</p><p>Shark has a few other WIRED-tested models on sale, which I've listed below. Although Amazon Prime Big Deal Days haven’t formally started yet (<a href=\"https://www.wired.com/story/amazon-prime-day-early-deals-09-26-2026/\" target=\"_blank\" rel=\"noopener\">see our early deal coverage here</a>), several popular air purifier brands, like Levoit and Coway, also have models already on sale. Be sure to read on to find which on-sale <a href=\"https://www.wired.com/gallery/best-air-purifiers/\" target=\"_blank\" rel=\"noopener\">air purifier</a> is best for your home.</p><p>Check out our guides to keeping your home's air quality in tip-top shape, including the <a href=\"https://www.wired.com/gallery/best-air-purifiers/\" target=\"_blank\" rel=\"noopener\">Best Air Purifiers</a>, <a href=\"https://www.wired.com/story/best-multi-use-air-purifiers/\" target=\"_blank\" rel=\"noopener\">Best Multiuse Air Purifiers</a>, <a href=\"https://www.wired.com/story/the-best-fans-2026/\" target=\"_blank\" rel=\"noopener\">Best Fans</a>, and <a href=\"https://www.wired.com/gallery/best-indoor-air-quality-monitors/\" target=\"_blank\" rel=\"noopener\">Best Air Quality Monitors</a>.</p><p><em>Love</em> WIRED? <a href=\"https://www.google.com/preferences/source?q=wired.com\" target=\"_blank\" rel=\"noopener\"><em>Add us as a preferred source on Google</em></a> <em>to see more of us.</em></p><p><a href=\"https://cna.st/p/79M9ga37RnrsB947S8du3VJSSfszs3pkmXqzgqkoJr1Ra4JTb2PX39ntzrZ7WkngLsT5y6sjsU54fmhmfaLg4RMWymfz9HkZqY6zMXgGyAq3vtsd6PTCfUbDkB4MBJ6Fo2eKti7r85f6rDAxywzPWX98wrxUnZjEJyprkVYxtKcPg38twRpsRDXqiVmJLsKFJSAUFgjq5epd5UikoxXJND8jfbj99ZaULSHDZa6PStt3MjKjmRjfBajNt3U75ZJc5ymiBxX3NXeP8ZU4MydKcpGEQtck3CNnLDW4qjhCe4NZSbQ7q3ADkDDJnAo5TiXFUwT5RsRGU8oC26ycbqVX6obRkFiXWcGXGMcnbw1hXJfN7y9b4vdxxBgDUnqqfcuNzuWWU1sHx8TmGU2geY2fXsjmfUwDKjGNBQsgp8RtpCPjaAg3uHqfYyMpB6oRqRf2bCbRHxytdmxT3q5hRRQL3PqPF36Fa4jfdq38J9G4upYUZfS9FjnhxpN8jdt1vMwNYpE\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Lisa Wood Shapiro</p><p>Shark</p><h3>NeverChange Air Purifier</h3><p>The Shark NeverChange Air Purifier exchanges the air nearly five times per hour in spaces up to 130 square feet, making it a good fit for small rooms such as bedrooms, bathrooms, and laundry rooms. It has a long-lasting HEPA filter that captures fine particles, and an activated carbon filter that traps odors and gases. As mentioned above, one standout feature of this budget-friendly purifier is its filter, which can last up to five years with regular cleaning and use on energy-saving settings. It’s also a good option for pet owners: There's a small cartridge filled with a fragrance pod to help offset pet odors and keep the air smelling fresh. This makes it ideal for rooms where you store your cat's <a href=\"https://www.wired.com/gallery/best-automatic-cat-litter-boxes/\" target=\"_blank\" rel=\"noopener\">litter box</a> or have your dog's crate.</p><p>If you want a compact air purifier that's ideal for smaller rooms, can operate close to a wall, and uses useful odor-neutralizing technology, the Shark NeverChange Air Purifier is a solid choice. At nearly $100 off, this discounted model is ideal for pet parents looking to fight odors and dander.</p><h2>Other Discounted Shark Models</h2><p>Shark</p><h3>NeverChange Air Purifier Max</h3><p>Like the model above, this purifier boasts up to five years of filter life and features a cartridge to fight smells. It's $130 off right now, the lowest price we'll see until the holidays.</p><p>Shark</p><h3>BreatheClear MAX with NeverChange Air Purifier</h3><p>This purifier's filter lasts up to six years, and it has an updated LCD screen with insights into the surrounding air. This includes metrics on current and historical air quality, temperature, and humidity; plus pollutant information, including measurements for PM 2.5 and 10, and VOCs.</p><h2>Other WIRED-Tested Discounted Air Purifiers</h2><p>Levoit</p><h3>Vital 200S-P Air Purifier</h3><p>This is my favorite budget air purifier. It automatically engages whenever pollutants are detected. Plus, the intuitive connected app helps monitor air quality and control the purifier while you're away. It's also got a HEPA filter for pet hair and dander.</p><p>Coway</p><h3>Airmega ProX</h3><p>This heavy-hitter is a whopping $366 off right now. It's quiet for its size and can clean the air four times per hour in a 1,000-square-foot space when running at its highest setting.</p><p><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><em><strong>Power up with unlimited access to</strong></em></a> <strong><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\">WIRED</a><em>.</em></strong> <em>Get best-in-class reporting and exclusive subscriber content that’s too important to ignore.</em> <em><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe Today</a>.</em></p>"},{"title":"Anthropic’s “Supply Chain Risk” Designation Stemmed from Its Refusing to Agree to Contract Terms, Not Its Speech","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/25/anthropics-supply-chain-risk-designation-stemmed-from-its-refusing-to-agree-to-contract-terms-not-its-speech/","category":"law","categoryLabel":"Law","wordCount":544,"readingTime":3,"content":"<p>From Judge Gregory Katsas, joined by Judge Neomi Rao, in today's D.C. Circuit decision in <em><a href=\"https://media.cadc.uscourts.gov/opinions/docs/2026/09/26-1049-2194984.pdf\" target=\"_blank\" rel=\"noopener\">Anthropic PBC v. U.S. Department of War</a></em>:</p>\n<blockquote><p>To succeed on such a First Amendment retaliation claim, the plaintiff or petitioner must prove that (1) it engaged in protected speech, (2) the government took materially adverse action against it, and (3) the speech caused the materially adverse action</p>\n<p>Anthropic has satisfied the first and second prongs of this test, but not the third. The First Amendment squarely protects Anthropic's advocacy regarding the safe and appropriate use of AI products. Moreover, the Department's exclusion of Claude from its supply chain plainly qualifies as a materially adverse action. However, we can discern no causal connection between the two. Instead, the record makes clear that the Department removed Anthropic from its supply chain not because of its advocacy, but because Anthropic refused to agree to a contract term the Department deemed essential to national security.</p>\n<p>Consider the timeline. By its own admission, Anthropic has advocated for use and safety restrictions since its founding: The company describes its own commitment to model safety as \"the core of Anthropic's mission,\" and describes its use restrictions as reflecting \"the very purpose for which [the] company was founded\" and its \"deeply held values.\" But throughout 2024 and 2025, the Department never acted adversely to Anthropic. Instead, it included Anthropic in a $200 million AI contract awarded in July 2025, and it sought to expand its relationship with Anthropic.</p></blockquote>\n<blockquote><p>Additionally, in January 2026, Amodei published a long article calling for \"limits\" and \"safeguards\" on the use of AI-powered weapons in democracies. But instead of retaliating against Anthropic because of this advocacy, the Department continued to pursue negotiations.</p>\n<p>Only when the negotiations broke down did the Department take action: On February 24, the Secretary met with Amodei and demanded that Anthropic accept an \"all lawful uses\" term by February 27. On February 26, Amodei published a final, public refusal to assent to that term. On February 27, the Secretary announced his intention to exclude Anthropic from the Department's supply chain. And on March 3, he made the formal, written determination required by the Supply Chain Security Act.</p>\n<p>Anthropic points to various pungent statements in the Secretary's February 27 social media post. Among other things, the Secretary denounced Anthropic's \"sanctimonious rhetoric,\" \"virtue-signaling,\" and \"Silicon Valley ideology.\" Such rhetoric seldom provides a sound basis for judging the lawfulness of federal executive action.</p>\n<p>In any event, for all its flourishes, the Secretary's social media post squarely addresses Anthropic's refusal to provide the \"all lawful uses\" contractual authorization. He described Anthropic's behavior as a \"textbook case of how not <em>to do business</em>\" with the Pentagon. He reiterated the Department's demand for \"full, unrestricted access to Anthropic's models for every lawful purpose in defense of the Republic.\" And he characterized Anthropic's refusal to provide that access as imposing an unacceptable \"veto power over the operational decisions of the United States military.\" The nub of this dispute was contractual, and the First Amendment did not require the Department to continue a contractual relationship that it viewed as creating a national-security risk.</p></blockquote>\n<p>Judge Karen LeCraft Henderson didn't reach the First Amendment question, because she concluded that the action against Anthropic wasn't authorized by statute.</p>"},{"title":"Prebuilt Steam Machine faceplate screens are here, delivering decent, surprisingly cheaper alternatives to Valve-approved DIY builds","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/prebuilt-steam-machine-faceplate-screens-are-here-delivering-decent-surprisingly-cheaper-alternatives-to-valve-approved-diy-builds","category":"gaming","categoryLabel":"Gaming","wordCount":736,"readingTime":4,"content":"<p>Get some ink</p>\n    \n  \n  \n  \n  \n            <p>If you own a <a href=\"https://www.rockpapershotgun.com/topics/steam-machine\" target=\"_blank\" rel=\"noopener\">Steam Machine</a>, and still cling to the misconception that my <a href=\"https://www.rockpapershotgun.com/behold-my-range-of-handmade-steam-machine-faceplates-tasteful-fan-covering-on-the-cheap\" target=\"_blank\" rel=\"noopener\">budget faceplate ideas</a> aren’t good enough for you, you basically have three options for front panel customisation. The first is to grab something off Etsy or suchlike. The second is take advantage of Valve’s open-source <a href=\"https://gitlab.steamos.cloud/SteamHardware/SteamMachine/inkterface\" target=\"_blank\" rel=\"noopener\">Inkterface</a> project to build yourself an E-Ink display, onto which you can electronically daub performance monitoring info. The third is to end up with more or less the same panel as option two, but have someone else make it for you. That’s what <a href=\"https://www.rockpapershotgun.com/best-steam-deck-accessories\" target=\"_blank\" rel=\"noopener\">arch accessory makers</a> JSAUX are proposing with their <a href=\"https://jsaux.com/products/faceplate-for-steam-machine?srsltid=AU7gw4UmE5zOYcWFiwBIIkAnn434ycoKxPbDNeXlscQPu-DYk6GXOdTb\" target=\"_blank\" rel=\"noopener\">Steam Machine E-Ink and Pixel Matrix faceplates</a>, which go on sale today after a few weeks of preening around the case mod scene.</p>\n<p>I’ve been using both on my Machine at home, and they’re quite good fun. The E-Ink faceplate, for which I sense the greater internet buzz, is a crisp, tidy little black-and-white panel, while the PixelMatrix trades detail density for colour and retro charm. Both have a few different display modes, switchable in SteamOS’s quick settings menu (via some clever integration with the <a href=\"https://www.rockpapershotgun.com/how-to-install-decky-loader-on-steam-deck\" target=\"_blank\" rel=\"noopener\">Decky Loader</a> plugin tool), and while I had to set this up manually, JSAUX say the requisite software will be downloadable via Steam itself from early October. Truly, it’s all the results of a DIY mod and more, conveniently pre-prepared for people who don’t own soldering irons.</p>\n\n<p>1 of 4 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Of the two, I narrowly prefer the PixelMatrix, that favouritism expanding significantly when using a faceplate for performance monitoring. The E-Ink model is pretty knackered in this respect, as its fastest refresh speed option is a hardly widowmaking once per minute, and I’m rarely interested in what my Steam Machine’s GPU was doing sixty seconds ago. I also, uh, like how the sun is actually yellow on the PixelMatrix’s weather view. This is apparently what RPS hardware coverage has come to.</p><p>Tell you what, here’s a cat picture. One advantage the E-Ink screen has over the dot matrix is that it makes much, much more sense for turning the Steam Machine into a digital photo frame; this holiday snap of a stray Baku resident was just too detailed for the PixelMatrix’s chunky LEDs to recognisably reproduce. The latter <em>might</em> work for pics of your favourite Jenga block, or perhaps an ironic, front-on photo of the Steam Machine itself, but for anything with eyes or hair you’re better off with the E-Ink.</p>\n\nImage credit: Rock Paper Shotgun\n\n<p>Granted, this isn’t the only shortcoming. I find it disproportionately annoying that the outer edges – on both faceplates – don’t quite line up perfectly with the USB/power button/ light strip section on the Machine’s bottom lip, and the right-sided USB-C port on the E-Ink panel forces the connecting cable to stretch unattractively across the same section. The FPS 'counter' on each screen’s performance monitors also downright misleads: it displays your TV/monitor’s refresh rate, in frames-per-second instead of Hz, and not actual in-game performance. It wouldn’t be very useful to get a once-per-minute framerate update on the E-Ink model anyway, but still.</p><p>At least when the E-Ink screen does refresh, though, it does so faster and less distractingly <a href=\"https://www.reddit.com/r/steammachine/comments/1utd8y1/i_built_the_inkterface_eink_faceplate_for_the/\" target=\"_blank\" rel=\"noopener\">than Valve’s Inkterface design</a>. A design which, if you follow the instructions by the book, will also give you a single performance monitoring screen, not the choice of performance, play time tracking, clock, weather, calendar, or photo frame modes that JSAUX’s ready-made screens have out of the box. And, in a major break from PC hardware convention, they both work out cheaper than taking the DIY option.</p>\n\n<p>Now, \"cheaper\" doesn’t necessarily mean \"cheap\" - the E-Ink is $100 and the PixelMatrix is $90, or roughly a tenth of the infamously ‘spenny Machine it latches onto. These are undoubtedly luxuries, for those who didn’t already blow their entire luxury budget on miniature PCs. Yet <a href=\"https://www.ifixit.com/Guide/Steam+Machine+Inkterface+Assembly+Guide/226061\" target=\"_blank\" rel=\"noopener\">totting up the combined component prices</a> of what you’d need for an Inkerface panel reveals it to cost $104.50, not including the expense of either 3D-printing the external housing or <a href=\"https://www.etsy.com/uk/listing/4538101992/steam-machine-e-ink-faceplate-cover-3d\" target=\"_blank\" rel=\"noopener\">buying something pre-printed</a> for an additional 15 dollaridoos.</p>\n<p>In a sense, then, the $100, sub-6in greyscale screen that only refreshes once a minute is... good value. Weird! But probably fine. Now I cross my fingers and hope Valve don’t kill it off in a few days’ time, like <a href=\"https://www.rockpapershotgun.com/valve-dropped-that-steam-machine-companion-cube-case-down-the-legal-incinerator-after-its-makers-neglected-to-get-their-permission\" target=\"_blank\" rel=\"noopener\">the last Steam Machine accessory I tried</a>.</p>"},{"title":"The President vs. the Press ","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/10/05/the-president-vs-the-press","category":"fun","categoryLabel":"Interesting Reads","wordCount":870,"readingTime":5,"content":"<p>Donald Trump’s decision, on September 18th, to summarily revoke White House access from three major news outlets—CNN, <em>Politico</em>, and MS NOW—is consistent with the mercurial, paranoid, and inscrutable style that has defined his political career but has been particularly prominent in his second term. Since Trump returned to the Presidency, his Administration has tended to justify its most belligerent actions by claiming national-security concerns or by couching said actions as an attempt to root out fraud. Earlier this year, the <em>Times</em> noted that Trump had cited “national security” as justification for acts as disparate as halting the development of wind farms off the East Coast, stripping union rights from federal employees, and continuing the construction of his behemoth ballroom. (He is now making the same argument regarding his colossal arch.) Accusations of fraud have been the reasoning for <em>doge</em>’s evisceration of the federal workforce, <em>ice</em>’s occupation of Minneapolis, and, just last week, the removal of three-quarters of a million people from the Affordable Care Act rolls. In a frenzied attempt to retrofit a rationale for Trump’s abrupt press ban, the White House turned to some version of both of these arguments.</p><p>Last Monday, the three news outlets filed suit, claiming that the ban violated their First Amendment rights. Dozens of other media organizations, including the <em>Times</em> and Condé Nast, which owns <em>The New Yorker</em>, filed an amicus brief in the case. Other outlets refused to participate in pool coverage of the President’s events, in solidarity with their banned peers. On Tuesday, the Department of Justice responded by claiming, in a brief, that the organizations had “threatened national security and spread falsehoods.” Further, it asserted that access to the White House is “a privilege,” not a right. Embarrassingly, the same day, the White House sent <em>Politico</em> a letter citing its reporting on the Iran war, which noted the concerns of an anonymous source, as an example of compromising national security. That source, <em>Status</em> reported, was Vice-President J. D. Vance, on a background briefing, highlighting yet another instance in which the right hand was unaware of what the right hand was doing.</p><p>In a Truth Social post announcing the ban, Trump had complained that “Media Outlets shouldn’t be able to constantly write or report FICTION and LIES when they’re covering the President of the United States.” This isn’t exactly an accusation of defrauding the public, but it pretty clearly charges the banned organizations with, at a minimum, misleading it. That said, even Trump seemed to know that he was on shaky ground, preëmptively arguing that the U.S. district judge hearing the case, Timothy J. Kelly, whom Trump himself had appointed, was an unfriendly draw for the Administration’s claims.</p><p>The ban followed the now familiar path of Trump’s potentially illegal or unconstitutional acts. As with his attempts to slap his name on the Kennedy Center and his effort to overrule the language of the Fourteenth Amendment, by curtailing birthright citizenship, that path typically travels from absurd idea to absurd (but nonetheless concerning) act, to a legal response that becomes another case study in which we evaluate the extent to which the judicial system is capable of reining in the arbitrary impulses of an aspiring autocrat.</p><p>Trump’s concerns about the current case, at least in the short term, proved warranted. Shortly after midnight on Thursday, Kelly imposed a fourteen-day suspension of the ban. That morning, the journalists were still denied entry, so Kelly issued a 12:30 <em>p.m.</em> deadline for compliance, and their access was restored. Meanwhile, China’s President, Xi Jinping, had arrived in Washington for his first state visit in eleven years. Photographers on the scene reported that Trump joked that China has the “friendliest press corps.” (According to Reporters Without Borders, China ranks a hundred and seventy-eighth out of a hundred and eighty nations in press freedom.) That evening, some of the journalists were again denied access.</p><p>It’s worth recalling the degree to which this debacle typifies Trump’s political behavior. During the 2016 election, he withheld campaign-event credentials from Univision, BuzzFeed, the Washington <em>Post</em>, and <em>Politico</em>. During his first term, he routinely blocked critics and news organizations from his Twitter feed, which resulted in a lawsuit and a district-court ruling that his actions were unconstitutional. In 2018, the Administration denied access to Jim Acosta, then a reporter for CNN. (Kelly also ruled in that case, requiring the White House to restore Acosta’s access.) Last year, the White House denied access to the Associated Press, for refusing to defer to Trump’s preferred designation for the body of water generally known as the Gulf of Mexico. In that instance, the district judge Trevor N. McFadden, another Trump appointee, ruled that “under the First Amendment, if the Government opens its doors to some journalists . . . it cannot then shut those doors to other journalists because of their viewpoints.” He added, “The Constitution requires no less.” The President has sued ABC News, the <em>Wall Street Journal</em>, CBS News, the Pulitzer Prize Board, the Washington <em>Post</em>, and the <em>Times</em>, for hundreds of millions of dollars. His behavior cannot be called unexpected at this point. What was noteworthy this time, however, was the way that the press responded.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
