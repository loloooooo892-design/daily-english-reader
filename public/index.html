*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;

.container {

.meta {

  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;

}

.category-tag {

  font-weight: 600;

  color: var(--accent);

  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;

  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;

}

.swap-bar {

  display: flex;
  align-items: center;
  justify-content: space-between;

}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {

  font-size: 0.8125rem;

  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;

.archive-link a {

  text-decoration: underline;

@media (max-width: 480px) {

<script>
var articles = [{"title":"Groups ask Supreme Court to leave lower court order in place halting border wall construction in southwestern Texas","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/10/groups-ask-supreme-court-to-leave-lower-court-order-in-place-halting-border-wall-construction-in/","category":"law","categoryLabel":"Law","wordCount":1015,"readingTime":6,"content":"<p>The plaintiffs challenging the Trump administration’s efforts to build a border wall in the Big Bend region of southwestern Texas urged the Supreme Court on Thursday to leave in place an <a href=\"https://www.biologicaldiversity.org/programs/government-affairs/pdfs/ORDER%20GRANTING%2034%20Motion%20for%20Preliminary%20Injunction%20Signed%20by%20Judge%20Kathleen%20Cardone.pdf?_gl=1*ty9zcs*_gcl_au*MTE2MDM2NjgzOS4xNzkyNjE1NjE3\" target=\"_blank\" rel=\"noopener\">order</a> by a federal trial judge in El Paso temporarily halting the construction. Eric Glitzenstein, a lawyer representing the plaintiffs, told the justices in <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/431171/20261029144652160_RuidosaStayOppSCOTUS.pdf\" target=\"_blank\" rel=\"noopener\">a 40-page filing</a> that granting the federal government’s <a href=\"https://www.scotusblog.com/cases/mullin-v-friends-of-the-ruidosa-church/\" target=\"_blank\" rel=\"noopener\">request</a> to lift that order would allow the Trump administration to “immediately resume blasting, bulldozing, road construction, and other border barrier-related construction across one of the most remote and ecologically and culturally significant landscapes in the United States.”</p><p>The dispute centers on three waivers of various environmental and conservation laws that then-Homeland Security Secretary Kristi Noem and her successor, Markwayne Mullin, issued earlier this year to authorize construction of the border wall in the Big Bend region, including areas in Big Bend National Park. Noem and Mullin relied on a provision of the <a href=\"https://www.govinfo.gov/content/pkg/PLAW-104publ208/pdf/PLAW-104publ208.pdf\" target=\"_blank\" rel=\"noopener\">Illegal Immigration Reform and Immigrant Responsibility Act of 1996</a> that gives the Secretary of Homeland Security the power to “waive all legal requirements” necessary “to ensure expeditious construction” of border walls and roads. With the waivers, Noem and Mullin determined that additional border barriers are required in the Big Bend area because it “is an area of high illegal entry.”</p><p>The plaintiffs in this case – an environmental group, a local landowner, and a group formed to preserve a church – <a href=\"https://biologicaldiversity.org/programs/government-affairs/pdfs/0001-Complaint.pdf\" target=\"_blank\" rel=\"noopener\">went to federal court</a> to challenge the waivers’ legality. On <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153710031_Ruidosa_Appx_Final.pdf#page=203\" target=\"_blank\" rel=\"noopener\">Oct. 2</a>, U.S. District Judge Kathleen Cardone temporarily barred the Department of Homeland Security from continuing construction on the border wall in the Big Bend region “until and unless” the government complies with environmental and other applicable laws.</p><p>In a written <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153710031_Ruidosa_Appx_Final.pdf#page=205\" target=\"_blank\" rel=\"noopener\">opinion</a> issued on Oct. 14 to explain her reasoning, Cardone concluded that the challengers were likely to prevail on their claim that under the major questions doctrine – the idea that if Congress intends to give a federal agency the power to make decisions of vast economic or political significance, it must say so explicitly – the DHS secretary did not have the authority to issue the waivers.</p><p>As an initial matter, Cardone rejected the government’s contention that she did not have the power to consider the challengers’ claims because they arose from a statute, while IIRIRA only allows federal courts to hear challenges to waiver decisions if they involve the Constitution. The major questions doctrine, she said, is a “constitutional … rule” based on the idea that “courts should expect Congress to speak clearly when it delegates major lawmaking authority to the executive.”</p><p>Turning to the question of whether the major questions doctrine barred the waivers, she observed that both the government and the challengers “appear to agree that the waiver of all legal requirements to construct a border wall in the Big Bend Sector is of ‘major economic and political significance.’” The key issue, she continued, is thus whether Congress clearly gave the DHS secretary the power to issue the Big Bend waivers. It did not, she wrote. She emphasized that another provision of IIRIRA authorizes the DHS secretary to “take such actions as may be necessary to install additional physical barriers and roads … in the vicinity of the United States border to deter illegal crossings in areas of high illegal entry into the United States.” When that provision is read together with the waiver provision, she said, it means that the DHS secretary can only waive legal requirements for “construction ‘to deter illegal crossings in areas of high illegal entry.’”</p><p>But the Big Bend region is not, she contended, such an area: although it “comprises over 25% of the U.S.-Mexico border,” it accounts for only a tiny percentage (“between 0.3% and 2.2%”) of all of the people apprehended crossing the border. This means, she said, that “if the Big Bend Sector is an area of high illegal entry, so is every other sector, and the waiver authority would apply to the entire U.S.-Mexico border. If that were the case, Congress could have simply authorized construction ‘to deter illegal crossings.’” The major questions doctrine instructs courts to avoid “interpretations that would render limiting language meaningless,” Cardone concluded.</p><p>The Trump administration <a href=\"https://www.scotusblog.com/cases/mullin-v-friends-of-the-ruidosa-church/\" target=\"_blank\" rel=\"noopener\">came to the Supreme Court</a> on Oct. 21, asking the justices to pause Cardone’s order and to grant review and summarily reverse it. First, U.S. Solicitor General D. John Sauer <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A560/430290/20261021153649084_Ruidosa_Application_Final.pdf\" target=\"_blank\" rel=\"noopener\">argued</a>, the district court did not have the power to consider the challengers’ claim based on the major questions doctrine because their complaint specifically alleged that the DHS secretary “lacked ‘clear congressional authorization’ … to issue the waivers” under the IIRIRA – a statutory claim that “Congress denied district courts” the authority “to entertain.” But in any event, Sauer continued, “[e]ven assuming that the Secretary’s waiver authority implicates a question of ‘vast economic and political significance,’ Congress <em>did</em> clearly authorize the Secretary both to build border barriers and to waive legal requirements in order to facilitate their expeditious construction.”</p><p>In their brief on Thursday, the challengers insisted that the major questions doctrine applied to their claim, stressing that “the decision to waive myriad federal, state, local, and tribal laws across vast geography for the purpose of building border infrastructure, even through national and state parks where border crossings are miniscule, is a truly ‘extraordinary’ assertion of power.” “Whatever authority Congress delegated, it did not clearly authorize the sweeping exercise of power asserted here, and” the government’s “actions therefore amount to a constitutional violation of the major questions doctrine.”</p><p>The challengers also argued that DHS will not suffer any permanent harm if the construction is temporarily blocked – one of the factors that courts consider in deciding whether to award temporary relief. To the contrary, they noted, before Cardone issued her order halting construction, “in response to intense local opposition,” DHS “voluntarily paused construction for weeks in vast portions of the project area.”</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Groups ask Supreme Court to leave lower court order in place halting border wall construction in southwestern Texas</em>, SCOTUSblog (Oct. 29, 2026, 4:58 PM), https://www.scotusblog.com/2026/10/groups-ask-supreme-court-to-leave-lower-court-order-in-place-halting-border-wall-construction-in/</p>"},{"title":"Is There Anything BPC-157 Can’t Cure?","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/10/30/wellness-bpc-157-pedtides-fda/","category":"fun","categoryLabel":"Interesting Reads","wordCount":546,"readingTime":3,"content":"<p>Do you know what BPC‑157 is? This cryptically named peptide is, according to its proponents, a miracle cure for all sorts of illnesses and injuries. Tom Bartlett remains firmly in the skeptical camp as he investigates exactly what research backs up the BPC‑157 claims. Almost all the studies prove to have a link to Croatian pharmacologist Predrag Sikirić—who is all too happy to meet Bartlett and exalt BPC‑157. But once you know what this is, the question remains: Would you take it?</p>\n<blockquote>\n<p>Amid the sellers of red-light panels and blue-light glasses at Beyond, I stumbled on a company marketing a drinkable version of BPC‑157. Its giveaway sticker read We Prefer Oral Peptides, with the word <em>peptides</em> in much smaller letters because haha sex. The representative behind the counter referred to BPC‑157 as “the soccer mom’s peptide” and nonchalantly squirted some from what was essentially a hand-soap dispenser into a tiny plastic cup, then held it out to me. I hesitated, and the peptide hung in the air, unclaimed. “Are you afraid of it?” he asked. The not-so-subtle subtext was that I shouldn’t be, that taking BPC‑157 was equivalent to trying the dissolvable herbal-tea strips a few tables down or giving the giant quartz bowl a whirl. For the record: We were in a hotel hallway and I was being encouraged—dared, really—to try a drug that isn’t FDA-approved, is prohibited by the World Anti-Doping Agency for athletes’ use, and allegedly works throughout the body via some mysterious mechanism that is not entirely predictable. I was being offered an unspecified dose, although I wouldn’t know what dose would be appropriate, because there are no agreed-upon dosing guidelines. I declined the peptide. The representative shrugged and drank it himself.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on wellness\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/09/09/theres-the-rub/\" target=\"_blank\" rel=\"noopener\">There’s the Rub</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSarah Larson | The New Yorker | September 8, 2025 | 5,883 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Each year, massage therapists from around the globe gather to face off, collaborate, and make sure that no body gets left behind.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/06/26/biohacking-conference-asprey/\" target=\"_blank\" rel=\"noopener\">Snake Venom, Urine, and a Quest to Live Forever: Inside a Biohacking Conference Emboldened by MAHA</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tWill Bahr | Wired | June 25, 2025 | 2,294 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“While biohacking isn’t new, the rise of Robert F. Kennedy Jr.’s Make America Healthy Again movement . . . has given the concept renewed zeal.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/11/22/how-an-empty-internet-gave-us-tradwives-and-trump/\" target=\"_blank\" rel=\"noopener\">How an Empty Internet Gave Us Tradwives and Trump</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTressie McMillan Cottom | The New York Times | November 21, 2024 | 2,164 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“If you are looking to understand Donald Trump’s unusual hold on our cultural politics, look to the tradwives, podcast bros and wellness influencers.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/09/24/the-cult-of-wellness/\" target=\"_blank\" rel=\"noopener\">The Cult of Wellness</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tOlivia Stren | Toronto Life | August 14, 2024 | 6,161 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A growing cohort of Torontonians are swapping the coke-fuelled, booze-soaked club scene for cold plunges, sobriety and superfood smoothies. Inside the expensive, obsessive, addictive quest for a perfect life.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/02/22/the-rise-of-the-scented-candle-industrial-complex/\" target=\"_blank\" rel=\"noopener\">The Rise of the Scented-Candle Industrial Complex</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSophie Elmhirst | 1843 Magazine | December 14, 2023 | 4,100 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Why is everyone waxing on about Diptyque?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2022/08/31/the-death-cheaters/\" target=\"_blank\" rel=\"noopener\">The Death Cheaters</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tCourtney Shea | Toronto Life | August 29, 2022 | 4,711 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The members of Longevity House are united by two things: a willingness to hand over $100,000 and a burning desire to live forever. Inside the weird world of cryotherapy, biocharging and fecal transplants.”</p>"},{"title":"Arc Raiders devs say that using generative AI voice acting was necessary as actors \"would just go crazy if they had to read all of that\"","source":"Eurogamer","author":"Connor Makar","url":"https://www.eurogamer.net/arc-raiders-ai-voice-acting-would-go-crazy","category":"gaming","categoryLabel":"Gaming","wordCount":584,"readingTime":3,"content":"<p>CCO states: \"We are not in the industry of replacing actors.\".</p>\n    \n  \n  \n  \n  \n            <p>Developers at Embark Studios, the company behind <a href=\"https://www.eurogamer.net/games/arc-raiders\" target=\"_blank\" rel=\"noopener\">Arc Raiders</a>, have spoken on the use of generative AI voice acting in the extraction shooter. It's argued that the initial use of generative AI line reads was a benefit to the voice actors, as they: \"would just go crazy if they had to read all of that\".</p>\n<p>This comes from a <a href=\"https://www.youtube.com/watch?v=_xwbP8KV530\" target=\"_blank\" rel=\"noopener\">recently released video by Embark</a>, focused on Arc Raider's sound and music. In it, several key members of staff speak on the game's use of generative AI, be it the initial use of it for voice lines, and the <a href=\"https://www.eurogamer.net/arc-raiders-ceo-says-studio-has-re-recorded-ai-lines-a-real-professional-actor-is-better-than-ai-thats-just-how-it-is\" target=\"_blank\" rel=\"noopener\">gradual replacement of it with human line reads</a>.</p>\n\n<p>Audio director Bence Pajor first spoke about the struggles he ran into at previous studios; how gameplay decisions couldn't be changed because voice lines were already locked in. He describes this as a \"true pain\", and that it places stress on the writing team, dialogue team, and voice actors who may have scheduling clashes. He said that using reachable voice actors in Stockholm, and using the tools available, made life easier for everyone.</p><p>Later in the video, Pajor explained that training data was made with the voice actor's performances. Due to the voice lines being required for each new feature, item, or weapon added into the game, he argues it would be too impractical to record every possible version of a line read. \"The actors would just go crazy if they had to read all of that,\" Pajor said.</p>\n<p>Pajor continues by pointing to Arc Raider's many updates and changes since its release in October 2025, it would be impractical to call in voice actors to record lines every time an altered line read needed to happen. Two voice actors present in the video - Jo Rideout (Shani) and Diana Gardner (Celeste) - also shared their feelings on it. Gardner said it was \"freeing\" that she could take a job somewhere else, without worrying about cancelling other shoots or projects.</p>\n<p>However, Gardner would later speak on the topic of her ownership of Celeste's many lines in the game: \"The contract seemed so fair [...] so it was a no-brainer in that sense. But I didn't know what to expect once I heard the voice come out. I was like, 'Can I take ownership for the performance?' [...] This is hours of work that I've put in, but can I take ownership for the final product? No.\"</p>\n<p>Even with these proposed benefits to using AI-powered performances, these voice lines are being replaced. Embark CCO Stefan Strandberg said: \"we are not in the industry of replacing voice actors\", and acknowledges that immersion-breaking experiences many players had when playing Arc Raiders and hearing these performances. Strandberg and Pajor both admit to understanding the AI critique, and point to the work being done to replace what they can.</p>\n<p>\"We are not in the industry of replacing actors,\" said Strandberg. \"Actually I think quite the opposite. We should celebrate the performance and give them more space. That's something I'm hoping to give to players over the coming years.\"</p>\n<p>Part of this critique over generative AI's use in Arc Raiders came from reviews, <a href=\"https://www.eurogamer.net/arc-raiders-review\" target=\"_blank\" rel=\"noopener\">including our own</a>. Embark Studios faced similar pushback for <a href=\"https://www.eurogamer.net/the-finals-criticised-by-actors-and-designers-for-use-of-ai-commentator-voiceovers\" target=\"_blank\" rel=\"noopener\">gen-AI voice acting in The Finals</a>, however Arc Raider's popularity while using the technology led Nexon to describe it as a \"trojan horse\" for gen AI's use in small team game development.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Top Uber Eats Promo Codes for November 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/uber-eats-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1172,"readingTime":6,"content":"<p>Uber began as a modern alternative to taxis, letting riders order through a phone app, track the driver’s route in real time, share their location with contacts, and even split the fare in the app—it was the convenience-obsessed answer to the old way of hailing cabs. Then in 2014, Uber leveled up with Uber Eats. Much like Uber was the convenient, modern answer to taxis, Uber Eats was the equivalent for food delivery.</p><p>Instead of calling a local restaurant and enlisting a delivery driver from that restaurant, Uber Eats draws from hundreds of participating restaurants, cafes, and stores in your area, tailoring deals and picks to your location and preferences. So if you want fresh sushi from your favorite local spot for a date night in, or just need some Advil and Gatorade after a night out, Uber Eats delivers the goods in minutes flat. Whether you’re new to the service or a longtime devotee, we have an Uber Eats promo code and other Uber Eats coupon codes to help you save big—and stay at home.</p><h2>Uber Eats Coupon Code for New Users</h2><p>One of the easiest ways to save big on Uber Eats is to create a new account. First-time Uber customers can save 30 to 50% on their first order, plus new offers with up to $20 off rides or $15 off Uber Eats orders. You don’t even need an Uber Eats promo code to get this steep discount—this offer applies automatically when you create your account and book your first trip or delivery.</p><h2>Save More With Uber One Membership</h2><p>If you use the rideshare app often or order takeout multiple nights a week, an <a href=\"https://cna.st/affiliate-link/4BfJvaXoLe6BJTwBLggEWnchF9n2AdF5J2aWoHwqsLhjwCsMe6UrxUn  an Uber One account may be a good idea—for only $10 per month, you can get, on average, $30 in savings on Uber rides and Uber grocery and meal delivery. You won’t have to worry about meal planning or expensive takeout bills. With Uber One discounts and promos, you can get multiple meals for the week at a lower cost. And if you’re a student, you can try Uber One for free for four weeks to make sure the service is a fit. After that, the service is half off at only $5 per month. No Uber Eats coupon code necessary. Just verify your student status to get the four weeks for free and $5 per month after.</p><h2>Get Your Groceries Delivered with Uber Eats</h2><p>If you’re not in the mood to eat out, stay in and get <a href=\"https://cna.st/affiliate-link/XtSR1GXKWeHnepe7k3epZoymr92kreQo9joW1ZP21QoN2XTsV6QSe2Z4949gdYTcF99fjXhZXUum5GfudDrUrjhrmZdPQrwzTKMQjZPyvksPDGV4kMEBys7hhxbXsiVLVqpJQiXM5cENZykiBc5MeM64oC4DMfSeGrBC9PrUfG3nBTaDcfRmPvBUZDBpncPLudwVgy33MnuQKmptYrcuQLWFC7jnZuMEtvLGXCmQRMyLkqNGBfmDbD9mCb5JUHCSqPFd1bFzRSoEx8XG9xBY42tjjHw2CLGcxMcH\" target=\"_blank\" rel=\"noopener\">groceries delivered with Uber Eats</a>. Uber Eats partners with hundreds of grocery stores near you—including your favorite supermarkets—for same-day delivery in as little as 25 minutes. Using your location, Uber Eats offers fast delivery from drugstores, grocery chains, and local stores, so whether you need toilet paper or a gallon of milk, Uber Eats delivers.</p><h2>Deliver With Uber Eats</h2><p>If you’re looking for a side hustle or gig work where you set your own schedule, <a href=\"https://cna.st/affiliate-link/252UdZcajgSFKLYYghnedaPfGbw1WcSShgSZqEqxKJPPNg6VFeHDSNSRHvvv61pCfE72uUUtJcago7bJWabuoZdD1h97jT9mCaGutXdqF6p7URh85ynTsr9KMBP5EtpwnPhASfgraKyF3ZfiThvb7yXy1CjCMqiAjTywDV6Z53nv712qbA9qwTiQQ2AmT7rqBueqdryyKEhkF7gJookfcHgYgkTB7vQfBhNy3DAibwiNEaSZS2hazbHiwBeVWyU6T5bjSVd8UohppEifdEMra7xY6VmDLy\" target=\"_blank\" rel=\"noopener\">delivering with Uber Eats</a> is a great way to earn extra cash. It's flexible in so many ways. You can deliver with a car, a bike, or on foot, for an hour, a day, or daily. Uber Eats makes it easy to see what you’ll earn and what your day will look like. You’ll be able to see how much you’ll earn by delivering before you accept a job, and the tips you get are all yours. With Instant Pay, you can cash out up to 6 times a day for a fee, and weekly earnings are automatically transferred to your bank account. The possibilities (and flexibility) are endless—you can sign up to deliver food and packages, as well as “Shop &amp; Deliver,” which allows you to earn by shopping for customers and delivering the order.</p><h2>Get Your Starbucks Delivered With Uber Eats</h2><p>If you’re like me and need about 40 oz. of coffee to get through the day, you know how important it is to have caffeine at a moment’s notice. With Uber Eats’ vast network, you can now get your <a href=\"https://cna.st/affiliate-link/XtSR1GXKWeHnepe7k3epZoymr92kreQo9joW1ZP21QoN2XTsV6QSe2Z4949gdYTcF99fjXhZXUum5GfudDgtuwvFJtJCE4u3x1d1ZB82UkABRUjsCG4BZZaH4zraAtkZzwqnBSg9p3oF3hjSJzhcE8eVA1HJaNywmVQrJxWayhepoAHTPvTwwDjTB9HkrWy8DgGwSKDMVKyTQAL1j3g7cbAat1FDcmgwG3QUE3bBsKzfNMjUNPFezFdC3dLKuskV5cfXxzALNw5188nsnyJUAu1WaFXfLM5eNXBb\" target=\"_blank\" rel=\"noopener\">Starbucks delivered</a>. Starbucks delivery with Uber Eats couldn’t be easier. There are hundreds of Starbucks locations across the country, with both delivery and pickup available through the convenient app. Enter your zip code to see the nearest matching pickup location. Whether you’re catering for a big meeting or just want a quick breakfast.</p><h2>FAQs</h2><p>Does Uber Eats Offer Promo Codes for New Users?</p><p>Yes, Uber Eats regularly offers first-order discounts for new customers, often a percentage off or a capped dollar amount (like $15–$25 off) on your first delivery.</p><p>How Do I Apply a Promo Code on Uber Eats?</p><p>In the app, go to your account menu, select \"Promotions\" (or \"Add promo/gift card\" at checkout), enter the code, and it should apply automatically if valid and still active.</p><p>Does Uber Eats Offer Discounts on Grocery or Convenience Store Orders?</p><p>Yes, Uber Eats has expanded beyond restaurants to include grocery, convenience, and retail delivery, and many promo codes apply across these categories</p><p>Can I Use Uber Eats Codes With Uber (Rides) Credits?</p><p>No. Uber Eats and Uber rides promo codes/credits are generally separate, though Uber One membership benefits apply across both rides and Eats.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
