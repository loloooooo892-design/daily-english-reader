<script>
var articles = [{"title":"Watch out with Dancing; It Might Lead to Sex","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/21/watch-out-with-dancing-it-might-lead-to-sex/","category":"law","categoryLabel":"Law","wordCount":1416,"readingTime":8,"content":"<p>Some excerpts from the longish opinion in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.mnd.216201/gov.uscourts.mnd.216201.95.0.pdf\" target=\"_blank\" rel=\"noopener\">Doe v. Carleton College</a></em>, decided yesterday by Judge Donovan Frank (D. Minn.):</p>\n<blockquote><p>Carleton is a private liberal arts college in Northfield, Minnesota with approximately 2,000 students. Doe was a student at Carleton between 2019 and 2023. While she was a student, Doe got involved in dance, first participating in Carleton's social dance club, then taking two salsa classes and an independent study in dance with Carleton staff member Donald Smith.</p>\n<p>Over time, Doe and Smith's relationship devolved, becoming inappropriate and abusive. Doe now sues Carleton based on its hiring, retention, and supervision of Smith under theories of direct and vicarious liability….</p>\n<p>After attending Smith's salsa workshop, Doe enrolled in Salsa I for the 2020 winter term. During the course, Doe and Smith developed a close relationship. They began taking walks together and communicating more frequently about personal details. In March 2020, Doe and two other students went to Smith's house for dinner with him and his wife.</p>\n<p>After Salsa I ended, Smith left a note in Doe's student mailbox asking if she would be his salsa co-instructor in future classes. During winter break, Doe and Smith met approximately ten times in Smith's office so Smith could continue teaching Doe. During those meetings, Smith made inappropriate comments, expressed his attraction to Doe, and touched her in ways that made her uncomfortable. Doe had some interaction with Smith during the 2020 spring term, including spending the night at his home. Doe had no concerns about that visit and had minimal contact with Smith for the rest of the term.</p></blockquote>\n<blockquote><p>Doe became Smith's co-instructor for Salsa I during the 2021 fall term. He offered to pay her $17.25 per hour for her time. Smith's PEAR supervisor was unaware that Smith had a co-instructor for Salsa I. At that time, the PEAR Department did not hire students as co-instructors for PEAR courses that were taught by Carleton faculty or staff. Smith paid Doe via personal check. As a co-instructor, Doe was required to participate in the class two times per week and meet with Smith for an hour on the weekends to prepare for class. The lesson planning meetings took place at Smith's house. Doe also enrolled in Smith's Salsa II class that term. Altogether, Doe spent about five hours per week with Smith. As the term progressed, Smith's behavior escalated. For example, he shared inappropriate personal information about his sex life and capacity for violence.</p>\n<p>At the start of winter break 2021, Doe spent two nights at Smith's home during the two-day gap between the closure of her dorm and her flight to visit family. On the second night, Smith invited Doe to see his basement and asked her to play \"truth or dare.\" Smith poured her a drink and after she finished it, Doe began to feel \"weird and ill.\" Smith pressured her to have another. Doe's memory of the rest of the night is hazy, but she remembers Smith making several inappropriate sexual comments toward her. At some point, Doe ran upstairs to vomit and then went to bed. When she woke up the next morning, there were red marks around her neck. Doe did not report the incident to Carleton or the police at the time.</p>\n<p>On January 28, 2022, Smith invited Doe to his house for a birthday \"surprise.\" When she arrived, Smith led her to the basement where there were twenty-one pieces of colored paper face-down on the table. Smith told Doe to turn over the pieces of paper one-by-one. Each paper had some kind of \"reward\" or \"punishment\" written on it. The punishments included sexually inappropriate conduct, including hitting. Eventually Doe insisted that the game stop and they went upstairs. Once upstairs, Smith and Doe practiced dancing.</p>\n<p>Afterwards, Smith bit Doe on her ear or shoulder, grabbed her arm and throat, and made sexually charged comments toward her once again. Doe left shortly thereafter….</p>\n<p>A few days later, Doe told her therapist about this incident, and they agreed that Doe's therapist would contact the Associate Dean of Students, Trey Williams. Williams arranged a meeting with Doe for February 9, 2022. Doe told Williams that one of her teachers attacked her at his house, that it had been affecting her academically, and that she needed help making it through the term. Doe did not tell Williams Smith's name at the time because she was afraid. Following the meeting, Williams submitted a form to the Title IX office describing his February 9th meeting with Doe and further discussed the situation during a CARE Team meeting. The CARE Team agreed that Williams would help Doe academically and {Laura Riehle-Merrill, Carleton's Title IX Coordinator,} would contact her about support resources. Riehle-Merrill invited Doe to meet with her, but Doe never responded.</p>\n<p>Doe finished winter term but failed two courses, so Carleton placed her on Academic Review. Smith suggested that Doe participate in an independent study with him to recover credits. [Judith Howard, Chair of the Theater and Dance Department,] was the supervisor of the independent study. As supervisor, she was tasked with approving the course proposal and checking in at the end. In preparation for the independent study, Smith and Doe performed a bachata dance for Howard. Howard felt uncomfortable watching the dance and contacted Riehle-Merrill. She was concerned about the power dynamic in the particular style of dance.</p>\n<p>Howard and Riehle-Merrill met in March 2022 to discuss the situation. Some of Riehle-Merrill's notes from the meeting include \"Judith feels this is grooming\" and \"Teacher 'gets off on this.'\" After the meeting, Howard met separately with Doe and Smith to discuss the independent study. After meeting with Howard, Smith and Doe rewrote the independent study proposal. Howard was satisfied with the conversations and the new proposal, so she signed off on the independent study. Around the same time, Howard contacted Riehle-Merrill to let her know about the \"good results,\" identifying both Smith and Doe by name.</p>\n<p>During the 2022 spring term, Smith's physical harassment became \"near constant.\" In April 2022, Doe received a letter purportedly from \"Katie,\" Smith's dance partner, encouraging Doe to have a sexual relationship with Smith. Doe suspected Smith wrote the letter himself, and when she did not mention it to him, he sent her a lengthy text message with the letter's exact wording….</p>\n<p>On May 9, 2022, Doe finally decided to report Smith by name to the Title IX Office. Doe and Riehle-Merrill met later that day, where Doe disclosed the inappropriate physical contact and inappropriate comments and identified Smith.</p>\n<p>Riehle-Merrill was concerned about Smith's presence on campus and immediately consulted Human Resources. She determined that the matter should be handled as an employment matter rather than a Title IX investigation because Doe did not want to go through a lengthy investigation or hearing process. Carleton fired Smith on May 13, 2022 ….</p></blockquote>\n<p>Doe sued Carleton, and in the process sought to introduce the testimony of expert witness Kaori Kenmotsu. Here's the court's analysis:</p>\n<blockquote><p>Kenmotsu has over twenty years of experience as a faculty member and lecturer in college dance departments and significant experience as a director, choreographer, and dancer. Her academic work has focused on \"dance pedagogy, power dynamics in the arts, and cross-cultural perspectives in performance.\" Her research and teaching has included \"issues of body autonomy, consent, and ethical pedagogy within dance and theater.\" …</p>\n<p>[T]he Court will allow Kenmotsu to testify about the heightened risk of sexual misconduct in dance instruction, which includes her testimony about hierarchies and dance pedagogy. Kenmotsu's experience is significant and qualifies her to give an opinion on risks in dance instruction, especially in the college setting. This information will be useful to the jury because the average jury is not familiar with college dance instruction and the surrounding culture. Carleton's arguments are well taken but go more to Kenmotsu's credibility and the weight the jury should give her opinion. Carleton is, of course, welcome to cross-examine Kenmotsu on those points and make those arguments in closing at trial….</p></blockquote>\n<p>And this evidence may be relevant to Doe's substantive claims:</p>\n<blockquote><p>For Doe's claims of vicarious liability assault and battery and vicarious liability sexual abuse to survive summary judgment, there must be evidence that assault, battery, and sexual abuse are well-known hazards between dance teachers and students…. Kenmotsu included in her opinion that there is a heightened risk of sexual misconduct in the field of dance instruction. This is not vague and creates a genuine issue of fact on foreseeability….</p></blockquote>"},{"title":"Melissa Auf der Maur’s Chronicle of Nineties Rock","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/photo-booth/melissa-auf-der-maurs-chronicle-of-nineties-rock","category":"fun","categoryLabel":"Interesting Reads","wordCount":1371,"readingTime":7,"content":"<p>The photographer, who played bass for Hole and the Smashing Pumpkins, captured a moment in which one generation’s subculture became the next generation’s mainstream.</p><p>August 22, 2026</p><p>Thirty-two years ago, in the summer of 1994, <a href=\"https://www.newyorker.com/recommends/listen/celebrity-skin-courtney-loves-twenty-year-old-opus\" target=\"_blank\" rel=\"noopener\">Courtney Love</a> staged a remarkable comeback. Earlier that year, her band, Hole, had released a furious and galvanizing album called “Live Through This,” but it had arrived in shops only four days after Love’s husband, <a href=\"https://www.newyorker.com/culture/personal-history/my-time-with-kurt-cobain\" target=\"_blank\" rel=\"noopener\">Kurt Cobain</a>, had been found dead of a self-inflicted gunshot wound. A few months after that, Hole’s bass player, Kristen Pfaff, died from a heroin overdose. And so, when Love appeared onstage at the Reading Festival, in August, no one knew what to expect. “Oh, yeah, I’m so goddam brave,” Love sneered. (She seemed to be preëmptively making fun of anyone who would make fun of <em>her</em>.) And then she introduced the band’s new member. “That’s Melissa, fuckin’, last name is French,” she said, turning toward the bass player. “What is it?”</p><p>“Auf der Maur,” came the phlegmatic reply. “ ‘On the wall,’ in German.”</p><p>“Auf der Maur,” Love repeated. “ ‘Off the wall,’ in German.” Like a number of Love’s utterances, this one seemed accidentally perfect. Her new bandmate, who only a few weeks before had been observing the American alternative-rock explosion from afar, in Montreal, was no longer above the fray—she was in it.</p><p>Or maybe <em>partway</em> in it. “As a new member of Hole, who didn’t play on the ‘Live Through This’ album, I feel half in and half out of the band, a wandering visitor who’s not quite sure how long she might stay,” Auf der Maur remembers. She had met Billy Corgan, from the Smashing Pumpkins, at a show in Montreal, and he had suggested her to Love, who didn’t so much recruit Auf der Maur as draft her: Auf der Maur had misgivings, but Love forcefully overrode them. Starting with that performance at Reading, which was ragged and triumphant, and continuing for the next five years, Auf der Maur toured with Hole, and she played and sang on the band’s 1998 album, “Celebrity Skin.” She was a sphinxlike presence onstage, but also a bona-fide rock star, with celebrity friends and besotted fans. (At one Hole show, concertgoers in the front row held up a banner that read “<em>MELISSA IS HOT</em>.”) In Montreal, she had been at least as serious a photographer as she was a bass player, and probably more so. And so she resolved to document her time in the spotlight. “I had two tools: my camera and my bass,” Auf der Maur told me, during a recent phone interview. She had acquired a new camera not long after joining the band. “I remember being on Canal Street and asking for the most durable point-and-shoot Nikon. I knew I was on assignment.”</p><p>Decades later, she has turned that assignment into a book, “My ’90s Rock Photographs” (AGO/DelMonico), which brings together about two hundred images from her archive of more than ten thousand; it will be published next month, in conjunction with an exhibition of the same name, at the Art Gallery of Ontario. There are images of friends and fans and, inevitably, of Love, a transfixing and disruptive presence wherever she went. Precisely because Auf der Maur was not entirely part of the maelstrom that surrounded Hole, she was able to see it clearly, and apparently to survive it intact. “That camera—and that outsider’s lens that I came in with—was my protector,” she told me. “Everyone on tour knew me as the person with the camera.” Many of her images were self-portraits, taken in an era before the term was commonly shortened to “selfie.” Auf der Maur had thought a lot about the relationship between artists and muses. Her mother, Linda Gaboriau, is an accomplished literary translator who had sometimes served as a photographers’ muse, and as an art student, Auf der Maur had been struck by her own resemblance to the muses of Botticelli and Gustav Klimt. A rock star is inevitably both an artist and an object, and Auf der Maur’s photography makes this dual role explicit: in these images, just about everyone seems a bit starstruck.</p><p>At the moment when Auf der Maur joined Hole, she had a sense that something important was happening in the world, as one generation’s subculture was becoming the next generation’s mainstream. In the Montreal underground scene that nurtured her, Hole might as well have been a pop group, and she told me that, to some of her old friends, her decision to sign up with Love was “the equivalent of me joining Céline Dion.” For the better part of a decade, a vaguely defined but fierce alternative culture had been thriving in clubs and record stores and magazines; now, in the aftermath of Nirvana’s rise and implosion, this cloistered world was being dragged into public view, as formerly independent-minded bands signed big record deals and went off in search of big audiences. In these photographs, you can see Auf der Maur trying to figure out what to make of the swirl of adoration and ambition that had suddenly engulfed her—“the power of our youth movement being absolutely co-opted,” as she puts it. As with any explosion, the energy and the destruction were part of the same process. To many of the people involved, it all felt revolutionary, although in retrospect it’s easier to see the continuities between Auf der Maur’s generation and other ones. The photographs are full of young people doing the things that young people have always loved doing: making music, making noise, having fun, dressing up, getting in trouble, trying to survive.</p><p>One thing they are mainly not doing, of course, is documenting their lives. Love was an early adopter, and Auf der Maur captures her talking on a cellphone the size of a walkie-talkie, and also keeping a tour diary on a Macintosh Powerbook. But mostly the fans at shows reach out empty-handed—no cellphones, hardly any cameras. “I remember seeing the joy in these girls’ faces, and seeing them blossoming because I turned the camera on them,” she recalls. “Now everybody can be seen. You can post <em>everything</em> online, equally.” In the book, Auf der Maur portrays this as an unhappy development. There is a handwritten postscript at the end, asking, “can we promise each other to keep the analogue dreams of music, art + people alive? to resist the digital tentacles that are sucking our time + magic together?” But, of course, these photographs also show why, in the years that followed, those “digital tentacles” got so powerful, displacing the magazines and radio stations that helped shape nineties rock. We found new, more efficient ways to satisfy our desire to look and to listen, to be seen and to be heard; new ways to lump and split our social tribes; new ways to see our darker selves under bright lights and recoil in horror. “When they get what they want, they never want it again,” as Love sang, with Auf der Maur adding harmony, at that show in Reading, and countless times afterward.</p><p>Auf der Maur quit Hole in 1999, and spent a little over a year touring the world as the bassist for the Smashing Pumpkins, after which she embarked on her own career as a musician and artist. (She is the co-founder of Basilica Hudson, an art and music space in Hudson, New York.) In her time with the Smashing Pumpkins, her photographic setup grew more ambitious. She mounted a camera on her amplifier so that she could more easily take pictures from the stage, using either a timer or a foot pedal attached to a long cable. In one of those photographs, from the summer of 2000, Corgan is at the microphone, dressed in black and bathed in red light, with his back to the camera. Auf der Maur, in white, is twisted away from the audience, staring intently at the lens. “I would look at the camera and send a message to myself in the future,” she told me. “I was saying, ‘Here I am, I fucking love my bass, I’m playing in my favorite band—but this will be over soon.’ ”</p><p><a href=\"https://www.newyorker.com/contributors/kelefa-sanneh\" target=\"_blank\" rel=\"noopener\"></a></p>"},{"title":"\"I think that might be a misread\": Thief designer on why making a triple-A immersive sim doesn't really work","source":"Rock Paper Shotgun","author":"Oisin Kuhnke","url":"https://www.rockpapershotgun.com/i-think-that-might-be-a-misread-thief-designer-on-why-making-a-triple-a-immersive-sim-doesnt-really-work","category":"gaming","categoryLabel":"Gaming","wordCount":537,"readingTime":3,"content":"<p>Stole the words out of my mouth</p>\n    \n  \n  \n  \n  \n            <p>\r\nBroadly speaking, it's fine for something to exist as a niche. Whatever form of media a thing might be, to fulfil a niche is to meet the expectations of at least a handful of people with a particular taste that many others don't, and I think that's a delightful thing to do. In video games, <a href=\"https://www.rockpapershotgun.com/the-10-best-immersive-sims-on-pc\" target=\"_blank\" rel=\"noopener\">immersive sims</a> might not be the most niche genre in the world, but they've historically not done gangbusters sales wise, meaning that triple-A takes don't quite make their money back. If you ask Randy Smith Evergreen, a designer on <a href=\"https://www.rockpapershotgun.com/games/thief-the-dark-project\" target=\"_blank\" rel=\"noopener\">Thief: The Dark Project</a>, perhaps avoiding the world of triple-A is the way to go for immersive sims.\r\n</p>\n<p>\r\nSpeaking to <a href=\"https://www.pcgamer.com/games/sim/thief-designer-says-that-the-immersive-sim-audience-is-too-small-for-aaa-games-theres-quite-a-few-of-us-who-think-the-way-to-do-it-is-be-iii-or-aa/\" target=\"_blank\" rel=\"noopener\">PC Gamer</a>, Evergreen explains that both him and other developers who have done a lot of work on immersive sims \"have a belief that the immersive sims that are being created today and are slated for the future are, by and large, thinking of themselves as [existing] in an arms race to be bigger and better.\" He notes how these games are trying to compete against much bigger names, saying that imsims have \"to be triple-A, and it's got to sit right alongside Ghost of Tsushima and GTA 6, and it's got to be a game that's big enough to capture the public's attention. But I think that might be a misread for the audience size of immersive sims.\"\r\n</p>\n<p>\r\nFrom Evergreen's perspective, as well as other imsim designers, he says, it's probably better to take the triple-I or double-A approach over chasing that triple-A money. \"So you're talking about a $3-10 million budget, a passionate team led by some of us folks who have experience with immersive sims or newcomers who just played a lot of immersive sims and really get it, making something that's a little bit smaller, more passionate, and can be made more quickly,\" he suggests.\r\n</p>\n<p>\r\nThe developer notes how the original Thief had a budget of $3 million, or roughly $6 million adjusted for inflation, and that he isn't entirely sure that a game with that kind of budget \"that you want to make in the year 2026 is going to sell disproportionately different amounts of copies than the $250 million one that comes out of a big studio. So I think that's an example of where the market is going, or [where] I think it should go at least.\"\r\n</p><p>\r\nI find myself agreeing with Evergreen, in part because of how the film industry used to be. These days it's all blockbusters that half the time don't make their multi-hundred dollar budgets back, when there was once a time where you'd get mid-budget films that served a particular niche and existed for the sake of having a broader portfolio (and would sometimes find success in DVD sales if they didn't in the box office, though that's harder to replicate in the games industry). There's a value in having niche, mid-budget games that appeal to a specific market that won't force a studio to close just because they weren't a number one bestseller. But what do I know! Surely the latest online gunslop will be a hit, just like the others.\n</p>"},{"title":"Top Canon Promo Codes: 30% Off for August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/canon-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1331,"readingTime":7,"content":"<p>If you know photography, you know Canon. This super advanced, often pricey gear is made more affordable with the ways to save at Canon we’ve found below. Some of the best ways to save on cameras, printers, accessories, and more is during the Canon holiday sales, with our 10% off Canon promo code, and student discounts on some of the best WIRED-tested <a href=\"https://www.wired.com/gallery/best-mirrorless-cameras/\" target=\"_blank\" rel=\"noopener\">cameras</a>, <a href=\"https://www.wired.com/gallery/best-printers/\" target=\"_blank\" rel=\"noopener\">printers</a>, and <a href=\"https://www.wired.com/story/work-from-home-home-office-gear-guide/\" target=\"_blank\" rel=\"noopener\">home office</a> essentials.</p><p>We love Canon’s lineup of <a href=\"https://www.wired.com/gallery/best-mirrorless-cameras\" target=\"_blank\" rel=\"noopener\">mirrorless cameras</a>, which deliver the same great image quality without the bulk. Plus, Canon has an online <a href=\"https://www.usa.canon.com/shop/deals\" target=\"_blank\" rel=\"noopener\">deals hub</a> with rotating offers so you can get the gear you need for all your projects for way less. There are plenty of other Canon discount codes and Canon coupons live now, so you can save up to $1,600 on lens kits, printers, cameras, and more.</p><h2>Score Canon Back to School Deals</h2><p>If you’ve been looking to upgrade your gear, shopping Canon Back to School Deals is a great way to save on discounted tech like cameras, lenses, and other essential gear. The <a href=\"https://www.usa.canon.com/gift-guides?guide=latest-tech\" target=\"_blank\" rel=\"noopener\">Canon Back to School guide</a
