    --warning-border: #5C4A28;
    --warning-text: #D4B87A;

  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;

  --swap-bg-hover: #2F3543;

  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;

  padding-top: 1.5rem;
  margin-top: 3rem;

  justify-content: space-between;

.footer a {

.footer a:hover {

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  text-align: center;

.archive-link a {

<script>
var articles = [{"title":"After nearly a year of silence following its last-minute delay, Kingmakers resurfaces with an extended gameplay video and new playtest","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/action/after-nearly-a-year-of-silence-following-its-last-minute-delay-kingmakers-resurfaces-with-an-extended-gameplay-video-and-new-playtest/","category":"gaming","categoryLabel":"Gaming","wordCount":540,"readingTime":3,"content":"<p>Kingmakers - Gameplay Deep Dive - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/PVsoaSB21BU\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>It's been just about a year since <a href=\"https://www.pcgamer.com/kingmakers/\" target=\"_blank\" rel=\"noopener\">Kingmakers</a>, the game about bringing a gun to a knife fight, was <a href=\"https://www.pcgamer.com/games/strategy/kingmakers-the-game-about-bringing-modern-weapons-to-medieval-battlefields-gets-delayed-just-5-days-ahead-of-launch-and-theres-no-new-release-date/\" target=\"_blank\" rel=\"noopener\">delayed just ahead of its planned launch</a>, and we've heard nothing about it since. Today developer Redemption Road finally broke that extended silence with a new \"deep dive\" trailer detailing everything players will be doing in the game, and also opened the door to signups for an upcoming playtest.</p><p>First things first: I would be remiss if I didn't at least acknowledge the awkward cinematic interludes. They're really not great, and all I can say is that hopefully they're just bits of exposition built specifically for the trailer and not actually part of the game.</p><p>That aside, there's a lot going on here. Fighting large numbers of hopelessly outclassed enemies is still the central hook in Kingmakers, but you're also going to be leading armies on a strategic scale, building and managing settlements, and collecting resources so you can buy better equipment.</p><p>I'm really not sure how I feel about all that. Rolling into Bannockburn behind the wheel of a Leopard 2 has obvious appeal, but do I really want to be worrying about placing farms and erecting fortifications when I could be punching 120mm HEAT-sized holes in some peasant's hovel? But on the other side of that coin, what happens when the novelty of 'you have a sword, I have a SAW' wears off? Sooner or later it might be nice to have other things to do, especially if you're the kind of gamer who occasionally asks questions like, 'Why am I in Bannockburn with a Leopard 2?'</p><p>(The famous Battle of Bannockburn, for the record, does not actually feature in Kingmakers, which is about assisting Welsh nobleman Owain Glyndŵ in his 1403 uprising against the English.)</p><p>If you have similar questions about how the full Kingmakers experience will compare to the initial <em>bonkersness </em>of its <a href=\"https://www.pcgamer.com/finally-a-game-that-lets-me-time-travel-to-medieval-europe-with-an-ak-47-and-a-pickup-truck/\" target=\"_blank\" rel=\"noopener\">2024 reveal</a>, the Kingmakers playtest may be a way to find answers, or at least get an early feel for which way it's headed. Go to the <a href=\"https://store.steampowered.com/app/2109770/Kingmakers/\" target=\"_blank\" rel=\"noopener\">Steam page</a>, mash the playtest signup button, and when (or if, I suppose) the time comes you'll receive an email notifying you that you're in.</p><p>One thing that isn't included in today's video, sorry to say, is a new release date—Kingmakers is still listed on Steam as \"coming soon.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"“The Journey,” a Five-Part Audio Investigation","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/podcast/in-the-dark/the-journey","category":"fun","categoryLabel":"Interesting Reads","wordCount":557,"readingTime":3,"content":"<p>Why did a mysterious couple collect babies in a Los Angeles mansion? A five-part podcast series from In the Dark investigates.</p><p>September 15, 2026</p><p>A woman who acts as a surrogate, carrying a child for someone else, is said to be going on a “journey.”</p><p>Kayla Elliott started her surrogacy journey at the age of twenty-six. She gave birth to a baby girl for a wealthy couple living in a mansion in L.A. County. The couple told her that they already had one child, who desperately wanted a sibling. But nothing about the situation was as it appeared.</p><p>Kayla soon learned that the couple already had twenty other children, most of them under the age of three, who had also been carried by surrogates. After one of the children was taken to an emergency room with head injuries, the police got involved, and then the F.B.I. As the scandal unfolded, the surrogates for the couple began to find one another.</p><p>Who was this mysterious couple, and why had they collected so many children?</p><p>“The Journey,” a five-part audio series, unravels what was going on inside the couple’s mansion and exposes a scheme that threatens the surrogacy industry.</p><p><em>New Yorker subscribers get early, ad-free access to all five episodes.</em></p><p>Episode One</p><h3>Gifts</h3><p>A woman in Texas agrees to carry a child for a wealthy couple in California. She thinks she’s helping a family in need. Then she becomes a whistle-blower.</p><p>Release date: September 2, 2026. <a href=\"https://www.newyorker.com/v2/offers/tnya01081?source=Site_0_HCL_NYR_HUB_SUBSCRIBE_LINK_0_ITD_RUNAWAY_2026_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe</a> to listen today.</p><p>Episode Two</p><h3>Intended Parents</h3><p>Ava investigates what is going on inside the Arcadia mansion. What is the couple actually up to? And why do they want so many kids?</p><p>Release date: September 22, 2026. <a href=\"https://www.newyorker.com/v2/offers/tnya01081?source=Site_0_HCL_NYR_HUB_SUBSCRIBE_LINK_0_ITD_RUNAWAY_2026_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe</a> to listen today.</p><p>Episode Three</p><h3>The Industry</h3><p>It takes a village to create such a large family. Ava uncovers how the stunning lack of regulation in the surrogacy industry enabled the couple’s plans.</p><p>Release date: September 29, 2026. <a href=\"https://www.newyorker.com/v2/offers/tnya01081?source=Site_0_HCL_NYR_HUB_SUBSCRIBE_LINK_0_ITD_RUNAWAY_2026_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe</a> to listen today.</p><p>Episode Four</p><h3>The Courts</h3><p>One of the surrogates secretly takes home the baby she carried. And in an unprecedented circumstance, it seems like she might have the chance to keep her.</p><p>Release date: October 6, 2026. <a href=\"https://www.newyorker.com/v2/offers/tnya01081?source=Site_0_HCL_NYR_HUB_SUBSCRIBE_LINK_0_ITD_RUNAWAY_2026_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe</a> to listen today.</p><p>Episode Five</p><h3>The Children</h3><p>Will the children be returned to the couple’s mansion? As the judge reaches a decision, Ava examines a confidential court file and makes a startling discovery.</p><p>Release date: October 13, 2026. <a href=\"https://www.newyorker.com/v2/offers/tnya01081?source=Site_0_HCL_NYR_HUB_SUBSCRIBE_LINK_0_ITD_RUNAWAY_2026_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe</a> to listen today.</p><h3>Credits</h3>Host and Lead ReporterAva KofmanSenior ProducerNatalie JablonskiProducerRehman TungekarManaging ProducerSamara FreemarkEditorAlison MacAdamAdditional EditingMadeleine Baran, Willing DavidsonTheme MusicAlex WestonAudio EngineerCorey Schreppel IllustrationVartika SharmaArt DirectorsAviva Michaelov, Ben KotheFact CheckingYinuo Shi, Iman HusainAdditional Reporting and TranslationZimo Li, Yinuo ShiSummer Research AssistantEthan Kan Legal ReviewFabio Bertoni, Ben MurrayManaging EditorJulia Rothchild <h3>More on this Story</h3><a href=\"https://newyorker.com/magazine/2026/02/16/the-babies-kept-in-a-mysterious-los-angeles-mansion\" target=\"_blank\" rel=\"noopener\"></a><p>A wealthy couple obtained dozens of children through surrogates. Did they want a family, or something else?</p><a href=\"https://newyorker.com/news/the-lede/the-fate-of-twenty-one-los-angeles-siblings\" target=\"_blank\" rel=\"noopener\"></a><p>Nearly two dozen kids were found at risk of abuse and neglect. Will their parents be held accountable?</p><h3>More from In the Dark</h3><p><a href=\"https://newyorker.com/blood-relatives\" target=\"_blank\" rel=\"noopener\"></a></p><p>Did the U.K.’s most famous family massacre end in a wrongful conviction? A six-part podcast series from In the Dark investigates.</p><a href=\"https://newyorker.com/season-3\" target=\"_blank\" rel=\"noopener\"></a><p>The New Yorker investigative podcast examines the killings of twenty-four civilians in Haditha, Iraq, and asks why no one was held accountable for the crime.</p><p><a href=\"https://newyorker.com/the-runaway-princesses\" target=\"_blank\" rel=\"noopener\"></a></p><p>A four-part podcast follows a powerful sheikh and the women who have tried to escape his control.</p>"},{"title":"Distortion by Omission: The New York Times and \"Pro-Palestine\" Demonstrations","source":"The Volokh Conspiracy","author":"ProfDBernstein","url":"https://reason.com/volokh/2026/09/15/distortion-by-omission-the-new-york-times-and-pro-palestine-demonstrations/","category":"law","categoryLabel":"Law","wordCount":1137,"readingTime":6,"content":"<p>If you are someone who gets their news primarily from the New York Times and NPR, as many liberal-leaning Americans do, you often get a distorted picture of what is going on the US and the world. This is often less because of outright errors in reporting, and more about what isn't said.</p>\n<p>For example, each outlet barely covered the <a href=\"https://www.law.georgetown.edu/public-policy-journal/in-print/volume-19-number-1-winter-2021/the-right-to-armed-self-defense-in-light-of-law-enforcement-abdication/\" target=\"_blank\" rel=\"noopener\">widespread nationwide rioting</a> that accompanied Black Lives Matters protests in summer 2020. I still meet people who think the the primary violence that summer was from police manhandling protestors, and are completely unaware of the deaths, injuries and massive property damage attributable to rioters.</p>\n<p>Similarly, I keep encountering people who have no idea that there was widespread antisemitic violence, intimidation, and threats on college campuses after Oct. 7, 2023, and instead think that university officials and later the Trump administration had no justification for clamping down on what they perceive as peaceful \"pro-Palestine\" protests. And that's because they are being misinformed by sources like the Times and NPR.</p>\n<p>Case in point: In a <a href=\"https://www.nytimes.com/2026/09/14/nyregion/mahmoud-khalil-columbia-lawsuit.html\" target=\"_blank\" rel=\"noopener\">puff piece</a> in yesterday's New York Times about a lawsuit filed by Mahmoud Khalil, alleging discrimination by Columbia University against Palestinian students and their \"pro-Palestine\" allies, the Times reports: \"The 2023 and 2024 protests divided the Columbia campus, with thousands joining in, and others, including some Jewish students, saying they were too disruptive or made them feel unsafe.\"</p>\n<p>Here, relying on a <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6029555\" target=\"_blank\" rel=\"noopener\">recent article of  mine</a>, is some of what happened at Columbia, limited to violence, threats, and intimidation--and this involves only the incidents that were publicly reported:</p>\n<p>In October 2023, an Israeli Columbia student was assaulted in front of Butler Library by a former student who was no longer affiliated with the university. The assailant allegedly struck the student with a stick; police arrested and charged the suspect. During a separate student walkout \"for Palestine,\" a Jewish student was allegedly shoved by a Columbia classmate wearing a keffiyeh and subsequently swarmed by protesters.</p>\n<p>Another incident outside Butler Library was more explicitly antisemitic. According to a subsequent civil-rights complaint, an individual confronted a Jewish student while yelling \"Free Palestine\" and \"Fuck the Jews.\" The assailant allegedly made the motivation explicit, telling the student that he had singled him out \"because you are a Jew.\"</p>\n<p>Other physical incidents followed. Columbia student Jonathan Lederer was assaulted while carrying Israeli flags on April 20, 2024; the source cited in my article reports that a suspect threw a rock at him. Lederer was assaulted again on December 11, 2024, while once again carrying an Israeli flag; this time, the assailant reportedly punched him and called him a \"Nazi.\" In another incident, a Jewish Columbia student wearing a kippah was spat upon and told, \"I hope you guys suffer.\"</p>\n<p>These individual confrontations occurred against a background of increasingly intimidating mass protests. Demonstrators at Columbia shouted \"Fuck the Jews,\" \"Death to Jews,\" and \"Fuck Israel,\" attempted to instigate fights, and screamed at a rabbi who was praying with students.</p>\n<p>At one demonstration, protest organizer Mohsen Mahdawi used a megaphone to direct protesters to push back a small group of pro-Israel students. Columbia officials themselves later acknowledged that the campus had experienced \"threatening rhetoric and intimidation.\"</p>\n<p>Protesters also targeted a Columbia class dealing with Israel, distributing flyers bearing such slogans as \"The enemy will not see tomorrow\" and \"Burn Zionism to the Ground.\" Jewish organizations characterized the messages as incitement.</p>\n<p>Perhaps the most notorious individual episode involved Columbia student protest leader Khymani James. James publicly declared that \"Zionists don't deserve to live\" and said that people should be \"grateful that I'm not just going out and murdering Zionists.\" Columbia suspended him, and even the White House condemned his statements.</p>\n<p>What happened afterward is also significant. Columbia University Apartheid Divest (CUAD), the umbrella organization for anti-Israel groups on campus (and to which Khalid was attached), initially apologized for James's statements. It subsequently withdrew the apology and expressly endorsed \"armed resistance.\" James likewise disavowed his expression of regret.</p>\n<p>There was another feature of the protests that mattered to many Jewish students: anonymity. At Columbia, as elsewhere, many demonstrators concealed their identities with masks, keffiyehs, and other face coverings while participating in protests that included rhetoric such as \"Globalize the Intifada.\"</p>\n<p>Whatever one's view of that slogan in isolation, its effect can be different when it is shouted by anonymous demonstrators amid actual incidents of assault and intimidation. Students encountering such protesters cannot necessarily know whether the masked people endorsing violent \"resistance\" are strangers, classmates, or people living in their own dormitories.</p>\n<p>The situation escalated dramatically during the spring 2024 encampment, when students blocked up a section of campus.</p>\n<p>The escalation culminated in the occupation of Hamilton Hall. Protesters broke into the building, vandalized it, and held two custodians against their will, while calling them \"Jew-lovers.\"</p>\n<p>Columbia's own findings provide important evidence about how this environment affected Jewish students.</p>\n<p>The university's Task Force on Antisemitism reported that Jewish students described not only verbal harassment and social ostracism, but also being physically targeted and feeling unsafe in their dormitories.</p>\n<p>By April 2024, the situation had become sufficiently alarming that a Columbia campus rabbi advised Jewish students to leave campus and return home as soon as possible because of concerns about their safety.</p>\n<p>To recap, Jewish and Israeli students were assaulted. A student wearing a kippah was spat upon. A Jewish student was told explicitly that he was being targeted because he was Jewish. Demonstrators shouted \"Death to Jews,\" attempted to instigate fights, and pushed pro-Israel students backward. A prominent student leader had declared that \"Zionists don't deserve to live\" and said others should be grateful he was not murdering them. Protest organizations embraced \"armed resistance.\" Masked demonstrators participated in increasingly lawless protests. And eventually protesters broke into a university building, vandalized it, and held employees against their will. Columbia's own antisemitism task force found Jewish students reporting that they had been physically targeted and felt unsafe even in their dormitories.</p>\n<p>With that in mind, we can see that the Times' description--The 2023 and 2024 protests divided the Columbia campus, with thousands joining in, and others, including some Jewish students, saying they were too disruptive or made them feel unsafe--is not  itself inaccurate. It's what it leaves out that leaves reader uninformed.</p>\n<p>Bonus: The article also reports: \"In a statement, Adam Guillette, the president of Accuracy in Media [a defendant], said his group had 'repeatedly delivered accountability to Columbia's pro-Hamas radicals,' using language that echoed the Trump administration's <a href=\"https://www.whitehouse.gov/releases/2025/07/president-trump-has-kept-his-promises-and-then-some/\" target=\"_blank\" rel=\"noopener\">description</a> of pro-Palestinian campus protesters.\"</p>\n<p>The leaders of Columbia's anti-Israel protests defended Oct. 7 within days, and were led by Students for Justice in Palestine, a pro-Hamas organization. So while not every protestor was pro-Hamas, the protestors, writ large, were indeed pro-Hamas radicals, but the Times wants you to think that this is just a Trump thing.</p>"},{"title":"Mistral x Mozilla: Private, Multilingual AI Browsing","source":"Hacker News Best","author":"","url":"https://mistral.ai/news/mistral-x-mozilla/","category":"tech","categoryLabel":"Technology","wordCount":554,"readingTime":3,"content":"<p>Today, we are announcing a partnership with Mozilla to bring privacy, control and choice to people using AI to browse online.</p><p><a href=\"https://blog.mozilla.org/en/firefox/firefox-smart-window/\" target=\"_blank\" rel=\"noopener\">Firefox Smart Window</a> (beta), Mozilla’s AI browsing assistant, is now powered by Mistral models. Smart Window helps you make sense of complex searches, remember something important you clicked away from and source information important to you based on your browser tabs. Mistral will help power Smart Window for users in France and North America, with the United Kingdom and Germany expected to follow later this year.</p><p>This partnership represents two open source advocates working together to bring Mistal’s scientific innovations to consumers around the world. We are building AI systems that are trained and fine-tuned on regional languages, dialects and cultural context, so anyone can get responses that understand their local nuance.</p><p>This announcement is important to the global AI ecosystem for four reasons:</p><ol><li><p><strong>Open technology needs open distribution: </strong>Mozilla has spent more than two decades fighting for an open web and Mistral has been releasing open weight, frontier models since our first release. This partnership is about demonstrating the potential of open source to serve people around the world.</p></li><li><p><strong>AI optimized for local countries and cultures, not exported to them:</strong> We’re fine-tuning our models on regional languages and dialects so that everyone, no matter where they are or how they communicate, can benefit from AI that understands their local nuances. This partnership extends this capability to people who use Firefox worldwide so that their AI experience feels native to them.</p></li><li><p><strong>Giving people control of their interactions with AI: </strong>Firefox has a long history of control and privacy in its DNA, and these are values we share at Mistral. Our partnership is rooted in a shared commitment to user choice, control and openness. Together, we’re blending Firefox’s privacy-first legacy with Mistral’s cutting-edge open models to give people autonomy over their browsing experience. Privacy protections are built into how Firefox Smart Window works: conversations aren’t saved on Mozilla’s servers by default, and partners like Mistral agree to zero data retention. </p></li><li><p><strong>Putting sovereign AI in everyone’s hands: </strong>At Mistral, we’re committed to putting sovereign AI in everyone's hands. While we traditionally focus on serving the enterprise, by partnering with ecosystem leaders like Firefox, we extend beyond businesses and reach their consumers worldwide. This way, end users can benefit from our technology that’s rooted in user control, transparency and open innovation.</p></li></ol><p>You can learn more about Smart Window <a href=\"https://www.firefox.com/en-US/smart-window/?view=download\" target=\"_blank\" rel=\"noopener\">here</a>.</p><p>AI is becoming part of how people experience the web every day. We want to make sure that doesn’t mean people are chained to one company’s self-serving pipeline. With the browser sitting at the heart of the web and online experience, it should be a place where different AI providers can compete and open source has a seat at the table. This isn't just a product partnership. A browser shouldn’t be a one-way funnel. It should preserve what made the internet powerful to begin with: the freedom to explore, discover different ideas and tech, and decide for ourselves where to go next.</p><p>Anthony Enzor-DeMeo, CEO, Mozilla Corporation</p><p>This partnership represents two open source advocates working together to bring Mistral’s scientific innovations to Mozilla’s consumers around the world. Together, we are bringing privacy, control and choice to AI-powered web browsing.</p><p>Arthur Mensch, co-founder and CEO of Mistral</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
