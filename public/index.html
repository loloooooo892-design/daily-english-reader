<script>
var articles = [{"title":"Where There’s Smoke, There’s Fire Towers","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/where-theres-smoke-theres-fire-towers","category":"fun","categoryLabel":"Interesting Reads","wordCount":808,"readingTime":5,"content":"<p>New Jersey’s fire season technically ended in May, and the state’s forest-fire service has since dispatched its firefighters to the west: currently, they are in Minnesota, Colorado, Montana, Idaho, and Washington. But to Bill Donnelly, the service’s warden, New Jersey’s fire season, like North America’s, can feel unending. “As of lately, it’s just been three-sixty-five,” he said the other day, as he climbed twelve flights of stairs in New Jersey’s new fire tower, its first since 1948. Donnelly, who is fifty-seven and has a graying crewcut, started in the service as a fire-tower observer in 1989, when he was twenty. Back then, the hourly weather check involved trekking up and down a hundred-foot tower. (Today, the data is in a cabin up top.) “Let me tell you, I had buns of steel back in the day,” he said.</p><p>The new tower, one of twenty-one in the state, is in Jackson Township. It replaced one evicted by a new housing development. The day Donnelly climbed, it was ninety degrees, with dry conditions and a stiff breeze. “This is the Cadillac,” he said, of the taut structure. A catwalk at the top commanded a twenty-mile view of blue sky, a bowl of green below. A wildfire, already observed, was under control on Joint Base McGuire-Dix-Lakehurst, a nearby military base.</p><p>Justin Sauers, the tower’s operator, opened a door in the cabin to greet Donnelly, releasing an arctic blast. “It’s about thirty degrees cooler in here,” he said.</p><p>The centerpiece of the cabin’s six-by-six-foot room is the alidade, a sighting device attached to a table-size compass rose. The operator aligns the sight with smoke on the horizon, notes the angle, then drags a string across a topographical map hanging from the room’s ceiling to take a reading. The map shows other towers close by, each radiating a string that is fastened to the map when other towers radio in readings. “The more strings, the more precise you can get on where the fire is,” Sauers said.</p><p>“Gotta go old school—more dependable,” Donnelly said. He was scanning the horizon, a long-standing habit.</p><p>“A lot of people don’t even know New Jersey has fire towers,” Sauers said. “I think after Jones Road last year”—a fire that burned fifteen thousand acres in twenty days—“people started realizing how many towers we still use. It is the best technology.”</p><p>Sauers, who wore a beige fire-service uniform and surfer sunglasses, grabbed his radio transmitter to start the daily weather broadcast, but Donnelly interrupted. “There’s a smoke problem right there,” he said, pointing. “We got a fire!”</p><p>“Cory, Cory,” Sauers said into his radio, addressing the operator of a nearby tower. “Look up towards me.”</p><p>The radio crackled. “What do you got?” Cory van den Berg said.</p><p>“Dark column coming up, my forty-eight. You have it?”</p><p>Van den Berg said,“The only column I see is coming off the base.”</p><p>Sauers turned to Donnelly. “Billy, call Deale.” That would be Deale Carey, the section warden.</p><p>“Where am I sending him?” Donnelly asked. “How many degrees?”</p><p>“Forty-eight.”</p><p>Donnelly radioed. “Hey, Deale, we’re picking up smoke at forty-eight degrees, about two and a half miles, along the edge of the river. You know Sixty Acre?” (A condo association.) “That’s a good place to start.”</p><p>After beginning as a tower operator, Donnelly spent decades in the field, fighting forest fires locally and out West and training out-of-state teams. “Montana was here this year,” he said. “They were blown away—like, holy shit, you guys have some big fires.” He also worked the canine fire-investigation unit; once, a bloodhound located a suspected arsonist’s father, hiding behind a screen door. “Guy’s telling me there’s no way his kid was outside and lit the fire,” Donnelly said. “And then the dog came right up the steps and . . . bloosh! I was, like, ‘Well, my dog seems to think so.’ ”</p><p>Sauers grew up nearby—his father is a part-time firefighter—but only got into tower work recently. “We had the big fire in Lakewood on March 14th of 2021,” he said. “My dad was there, and he suffered a medical emergency, and the way the forest-fire service came together to support my family through it—I was, like, this is what I want to do.”</p><p>Donnelly had raced up to Lakewood from a training exercise that day—the fire burned a hundred and seventy acres, forcing the evacuation of hundreds of families—to discover that Sauers’s father had been kept alive by a police defibrillator until an ambulance arrived. “His father got really knocked out,” Donnelly said. “But he came back.”</p><p>“Just yesterday I got to dispatch him,” Sauers said.</p><p>Deale radioed in, having pinpointed a homeowner with a fire in his yard. The warden would now move in. Deale reported himself available. “B9 is clear,” Deale said, using his service number.</p><p>“Copy that,” Sauers said. “Clear and available.” ♦</p>"},{"title":"Booksellers suspect AI firms are buying and then destroying rare books","source":"Ars Technica","author":"","url":"https://arstechnica.com/tech-policy/2026/08/heres-a-balm-if-the-idea-of-destroying-books-to-train-ai-breaks-your-heart/","category":"tech","categoryLabel":"Technology","wordCount":1496,"readingTime":8,"content":"<p>\n    \n  \n  \n    “Every collection is important”\n  \n</p>\n      \n      <p>\n        AI firms quietly bulk buying rare books face resistance from booksellers.\n      </p>\n          \n    \n<p>If you can truly appreciate an old book—and maybe even marvel at how its fragile, yellowing pages contain some of the earliest ways that people tried to make sense of the world around them—then headlines about tech companies that are <a href=\"https://www.theatlantic.com/technology/2026/08/ai-companies-buying-used-books-for-data/688167/\" target=\"_blank\" rel=\"noopener\">destroying</a> <a href=\"https://www.404media.co/ai-companies-are-buying-tons-of-old-books-because-theyre-free-of-ai-slop/\" target=\"_blank\" rel=\"noopener\">books</a> <a href=\"https://www.telegraph.co.uk/news/2026/07/30/why-ai-companies-are-destroying-millions-of-old-books/?ICID=continue_without_subscribing_reg_first\" target=\"_blank\" rel=\"noopener\">to train AI</a> likely torture a tender part of your soul.</p>\n<p>It’s indeed depressing to imagine piles of book spines waiting to be fed into wood chippers while torn-out pages are cropped, scanned, and trashed. But that’s the cheapest and easiest way to scan books as fast as possible, and AI companies are in a race to advance their models by training on the kind of engaging, high-quality long-form texts that can only be found in books. So book lovers fear it’s likely that the practice is happening on a grander scale than is currently being reported and that some physical copies of books will be lost forever.</p>\n<p>What makes this destruction extra painful, though, is that it doesn’t have to be this way.</p>\n<p>Google <a href=\"https://cdn.arstechnica.net/wp-content/uploads/2026/08/Google-Book-Scanning-patent-US-7508978-B1.pdf\" target=\"_blank\" rel=\"noopener\">patented</a> a non-destructive book-scanning technology in 2009 that AI firms could use to efficiently scan books—if they were willing to slow down and invest in the process. It’s not perfect, however; studies have found that the curve of the page can distort text, and pages can be missed. As Wired <a href=\"https://www.wired.com/story/google-books-glitches-gallery/\" target=\"_blank\" rel=\"noopener\">reported</a>, glitches can happen when workers move too quickly, including disembodied hands obscuring pages.</p>\n<p>Overall, the trade-offs in cost and speed may not appeal to AI firms looking for the cheapest way to scan millions of titles, and Google’s method may not be the best way to handle rare books anyway. The Internet Archive, which helps libraries preserve aging collections, has long understood that scanning old texts takes time and attention to limit handling, and that’s why it’s considered such a human job.</p>\n                  \n    \n<p>For AI companies bent on finding shortcuts, the Internet Archive’s method may feel almost alien.</p>\n<p>But if you’re a book lover looking for a balm while parsing rumors of AI-driven book destruction, an <a href=\"https://blog.archive.org/2021/02/09/meet-eliza-zhang-book-scanner-and-viral-video-star/\" target=\"_blank\" rel=\"noopener\">old post</a> from 2021 describes how the Internet Archive scans books to avoid damaging even the most precious rare books. In it, a book scanner who has been with the Archive since 2010, Eliza Zhang, offered a moment of zen by explaining what she likes so much about scanning books “the hard way.”</p>\n<p>The Internet Archive did try going the automated route, the post said, even testing out “commercial book scanners that feature a vacuum-powered page-turning arm.” But “it turns out those automated scanners didn’t really work well for brittle books, rare volumes, and other special collections—the kinds of material our library partners ask us to digitize,” the Internet Archive said.</p>\n<p>“The job requires keen concentration,” Zhang said, since the pages of “very old, fragile books” are “paper thin.” In the post, Andrea Mills, who helps lead the Archive’s book-scanning operations, explained that “clean, dry human hands are the best way to turn pages.”</p>\n<p>To ensure each rare book only has to go through the scanning process once, Zhang takes her time. She carefully raises the scanner glass with a foot pedal each time she turns a page, then adjusts the cameras and ensures the page is readable. She also takes note of any fold-outs, setting a reminder to go back and scan the inserts so that bonus materials aren’t lost while documenting the main pages of the work.</p>\n                  \n    \n<p>The whole time, she understands that if a page is skipped or an image is too blurry, Internet Archive’s proprietary software will stop the process and prompt her to scan it again. Practice makes perfect, though, and she reports a low error rate after more than a decade of finding a rhythm in the job.</p>\n<p>At the time, Zhang had scanned “more than 3 million pages, 14,000 foldouts, and 18,000 items (mostly books),” the post said, with the goal of guaranteeing “zero errors.”</p>\n<p>Ars asked the Internet Archive for comment, but Chris Freeland, the director of library services, said the post detailing Zhang’s work is “still the best description of our scanning process today.”</p>\n<p>The post came after a video of Zhang’s book scanning got 1.5 million views on what was then Twitter, accompanied by a caption that would resonate with book lovers appalled by AI-driven book destruction today.</p>\n<p>“At the Internet Archive, this is how we digitize a book,” the tweet said. “We never destroy a book by cutting off its binding. Instead, we digitize it the hard way—one page at a time.”</p>\n<h2>Rare booksellers flag suspicious bulk orders</h2>\n<p>Ever since a lawsuit in summer 2025 outed Anthropic for <a href=\"https://arstechnica.com/ai/2025/06/anthropic-destroyed-millions-of-print-books-to-build-its-ai-models/\" target=\"_blank\" rel=\"noopener\">destroying millions of print books</a> to train its AI models, book lovers have moved to defend some of the most precious collections from what feels like AI firms’ endless quest to feed all the books in the world into their large language models.</p>\n<p>The biggest fear for people who want to see books preserved through the training process is that AI firms will callously pulp rare books that can never be replaced.</p>\n                  \n    \n<p>As The Atlantic <a href=\"https://www.theatlantic.com/technology/2026/08/ai-companies-buying-used-books-for-data/688167/\" target=\"_blank\" rel=\"noopener\">reported</a> last week, social media “raged” after two recent reports indicated that AI was already endangering rare books. First, a Telegraph <a href=\"https://www.telegraph.co.uk/news/2026/07/30/why-ai-companies-are-destroying-millions-of-old-books/?ICID=continue_without_subscribing_reg_first\" target=\"_blank\" rel=\"noopener\">report</a> accused Silicon Valley of destroying millions of rare books and “shredding the originals,” then 404 Media <a href=\"https://www.404media.co/ai-companies-are-buying-tons-of-old-books-because-theyre-free-of-ai-slop/\" target=\"_blank\" rel=\"noopener\">reported</a> that a book-database company called ISBNdb was advertising that it could help AI firms source books in bulk.</p>\n<p>This backlash was expected, with ISBNdb reportedly warning its clients that the optics were bad. Anthropic started using a codename—“Project Panama”—for its destructive book-scanning in an effort to keep it hidden from the public.</p>\n<p>There is no indication that Anthropic ever destroyed rare books, and the company has denied doing so in statements. It’s also true that some AI firms are helping preserve rare books. OpenAI and Microsoft, for example, are <a href=\"https://www.wbur.org/news/2025/06/13/ai-chatbots-learning-books-public-domain-harvard-boston\" target=\"_blank\" rel=\"noopener\">working with Harvard librarians</a> on an initiative to train AI models on about 1 million public-domain books dating back to the 15th century. Others, including Elon Musk’s xAI, have publicly said they won’t destroy rare books to train AI. In a post on X, Musk said that he “asked the SpaceXAI team to preserve any rare books in a library and scan them the hard way vs just cutting off the spine and scanning.”</p>\n<p>But not everyone is convinced that the biggest AI firms are sincere in their promises to preserve rare books, even if copyright law allows them to destroy copies of books they’ve purchased. Critics on social media and Reddit have pointed out that Musk didn’t say the xAI team would not destroy <em>any</em> books, and it’s unclear how his company defines a “rare” book.</p>\n                  \n    \n        \n<p>Meanwhile, rare booksellers continue to flag strange orders, recognizing that most sincere buyers tend to seek out single books, not order large batches of widely varying selections.</p>\n<p>Just yesterday, an Irish bookstore called Kennys flagged a “bananas” order for 5,000 obscure titles, The Irish Times <a href=\"https://www.irishtimes.com/world/europe/2026/08/10/a-mysterious-buying-spree-is-unsettling-europes-booksellers/\" target=\"_blank\" rel=\"noopener\">reported</a>. Unlike bulk orders placed by universities or big libraries, this order seemed suspicious because the buyer made no attempt to haggle on the price—which has now become an obvious “red flag” that AI is potentially involved, the Times reported.</p>\n<p>Although some booksellers said they could benefit in the short term from large orders, they fear that selling to AI firms that are indiscriminately destroying their collections “may be signing their own death warrant,” the Times reported.</p>\n<p>Tomás Kenny of Kennys Bookshop told the Times that AI is “terrifying our industry,” and he plans to refuse orders likely destined for AI training in an effort to protect authors’ rights to their work and readers’ access to hard-to-find titles.</p>\n<p>“Booksellers tend to be at the forefront of a lot of moral dilemmas and political and ethical issues. In most scenarios, it is not for me to decide,” he said. “However, if they are taking a book and scanning it with a view to taking intellectual property, then Kennys do not want to be a part of that.”</p>\n<p>It’s possible that public backlash will pressure the biggest firms to adopt methods like the Internet Archive’s, which focus as much on preserving rare books physically as they do digitally. But it’s heartbreaking to imagine the alternative, where rare books become even rarer, especially for those who love the feeling of holding an old book in their hands.</p>\n<p>Zhang knows the allure of rare books, occasionally pausing her work to read parts of the titles she scans. When asked what she liked most about her job, Zhang responded with the same gusto that many book lovers feel while browsing the shelves in stores like Kennys.</p>\n<p>“Everything! I find everything interesting,” Zhang said. “I don’t feel it is boring. Every collection is important to me.”</p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/ashleybelanger/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Ashley is a senior policy reporter for Ars Technica, dedicated to tracking social impacts of emerging policies and new technologies. She is a Chicago-based journalist with 20 years of experience.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/tech-policy/2026/08/heres-a-balm-if-the-idea-of-destroying-books-to-train-ai-breaks-your-heart/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    409 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/tech-policy/2026/08/fcc-abolishes-gigabit-speed-goal-suggesting-it-is-unfair-to-slower-technologies/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"},{"title":"Understanding the court’s next major case on asylum seekers: Wassily v. Blanche","source":"SCOTUSblog","author":"Duncan Fulton","url":"https://www.scotusblog.com/2026/08/understanding-the-courts-next-major-case-on-asylum-seekers-wassily-v-blanche/","category":"law","categoryLabel":"Law","wordCount":1431,"readingTime":8,"content":"<p>This coming term, in <a href=\"https://www.scotusblog.com/cases/wassily-v-blanche/\" target=\"_blank\" rel=\"noopener\"><em>Wassily v. Blanche</em></a>, the Supreme Court will decide whether asylum beneficiaries are barred from obtaining lawful permanent residency if their asylum status has been terminated. <em>Wassily</em> is of considerable significance. While the termination of asylum status once was relatively uncommon, recent policy changes by the Trump administration have exposed far more immigrants to the risk of this.</p><p>The legal dispute in <em>Wassily</em>, which has divided the federal courts, dates back to unclear language in the <a href=\"https://www.govinfo.gov/content/pkg/STATUTE-94/pdf/STATUTE-94-Pg102.pdf\" target=\"_blank\" rel=\"noopener\">Refugee Act of 1980</a>. The Refugee Act laid the framework for the modern asylum system and defined legal standards for asylum officers, immigration judges, and other immigration adjudicators. The act used precise, detailed language in crafting the refugee process for noncitizens <em>outside</em> of the United States, but Congress left <em>internal</em> asylum procedures more undefined, with less statutory guidance. Over time, asylum claims increased dramatically, making unclear statutory gaps more and more troublesome.</p><p>Indeed, that lack of statutory clarity is front and center in <em>Wassily</em>. The Refugee Act specified that refugees processed outside the United States could only obtain a permanent resident green card if their refugee “admission has not been terminated.” By contrast, the act was unclear whether that same requirement also applied to asylees who had obtained asylum status from within the United States. For asylees applying to “adjust” to permanent resident status, as codified at <a href=\"https://codes.findlaw.com/us/title-8-aliens-and-nationality/8-usc-sect-1159/#:~:text=Upon%20approval%20of%20an%20application,the%20approval%20of%20the%20application.\" target=\"_blank\" rel=\"noopener\">8 U.S.C. § 1159(b)</a>, the Refugee Act did not mention termination at all. Instead, the act only said that the immigration official “may” grant the green card for “any alien granted asylum” who met the admissibility requirements. The act did not say whether “granted asylum” meant anyone who <em>previously</em> had been granted asylum or whether that phrase was limited to those with a <em>current</em> asylum status.</p><p>Tamer Wassily left his native Egypt and entered the United States in 1993. He was granted asylum in 2000 based on his claim of persecution in Egypt as a Coptic Christian. Later, he was convicted of stalking and child endangerment, at which point the DHS sought to terminate his asylum status before an immigration judge. The immigration judge agreed and terminated this based on the finding that Wassily’s stalking conviction was a “particularly serious crime.” But the immigration judge found him eligible to adjust to a green card because the immigration statute did not contain “an explicit requirement” of current asylum status.</p><p>Byron Velasquez Arreaga entered the United States in 1995 and was granted asylum. He later was convicted of multiple crimes for driving while intoxicated. The DHS sought to terminate his asylum status and scheduled an immigration court hearing. The immigration judge terminated his asylum status for particularly serious crimes. In contrast to Wassily’s immigration judge, this immigration judge found that without a current asylum status, Velasquez Arreaga could not adjust status to a green card and he was ordered removed to his native country of Guatemala.</p><p>The parties appealed both cases. The Board of Immigration Appeals weighed in on the statutory confusion in a precedent decision: <a href=\"https://www.justice.gov/eoir/page/file/1476746/dl?inline\" target=\"_blank\" rel=\"noopener\"><em>Matter of T-C-A-</em></a>. The BIA interpreted the statute as meaning that only a noncitizen with current asylum status could adjust to permanent resident status. In Wassily’s appeal, the BIA relied on <em>Matter of T-C-A-</em>. It found that Wassily’s terminated asylum status made him ineligible for adjustment to a green card. The BIA also found Velasquez Arreaga ineligible for adjustment.</p><p>In tandem cases for Wassily and Velasquez Arreaga, a <a href=\"https://cdn.sanity.io/files/pito4za5/production/daeb6a7c765ca6e0d68005fa0e0983857008bcb3.pdf\" target=\"_blank\" rel=\"noopener\">divided panel of the U.S. Court of Appeals for the 2nd Circuit agreed</a> with the majority of circuits that only noncitizens with current asylum status were eligible for asylee adjustment. The 2nd Circuit concluded that the statutory phrase “granted asylum” was best understood to require a current asylum “status” – a legally significant term as used by Congress. The panel majority said its reading was “buttressed” by statutory context, including <a href=\"https://www.congress.gov/bill/101st-congress/senate-bill/358#:~:text=Immigration%20Act%20of%201990%20%2D%20Title,for%20FY%201992%20through%201994.\" target=\"_blank\" rel=\"noopener\">the Immigration Act of 1990</a>. That act explicitly created a time-restricted exception that allowed some noncitizens to apply for green cards “regardless of whether or not such asylum has been terminated.” The circuit reasoned that this limited exception, as a “statutory note,” did not create a general rule that noncitizens could apply for permanent residency after termination.</p><p>In dissent, Judge Beth Robinson adopted the minority view of the circuits on this “difficult” statutory question. She reasoned that the asylee adjustment statute meant that “any” noncitizen was eligible to adjust who previously had been granted asylum. Under Robinson’s view, the absence of the word “status” from the statutory provision must have been an intentional omission by Congress.</p><p>The Supreme Court granted certiorari in June to review the statutory question of whether terminated asylees are eligible to apply for adjustment to permanent residency. In <a href=\"https://cdn.sanity.io/files/pito4za5/production/3ac81c7ef16a1a8bcd216b1248e998ea39812507.pdf\" target=\"_blank\" rel=\"noopener\">their petition for certiorari</a>, Wassily and Velasquez Arreaga argue that the statutory text and context are clear that any noncitizen who was “granted asylum” previously can seek permanent residence after termination. They interpret “granted” as a past tense verb, and they contend that the omission of “status” in the statutory language must be given effect because Congress knew how to include such a requirement.</p><p>As broader statutory context, Wassily and Velasquez Arreaga emphasize the adjacent Section 1159(c), which allows for a discretionary “waiver” of other requirements for the noncitizen’s admissibility. According to them, it would be “strange” to interpret the statute as “categorically” stripping the attorney general of that discretionary authority where the asylee’s status has been terminated.</p><p>Wassily and Velasquez Arreaga also invoke the rule of lenity – the canon that a statutory ambiguity should be construed in favor of the noncitizen. They claim that lenity is especially paramount after the Supreme Court’s 2024 decision in <a href=\"https://www.supremecourt.gov/opinions/23pdf/22-451_7m58.pdf\" target=\"_blank\" rel=\"noopener\"><em>Loper Bright v. Raimondo</em></a>, which eliminated the doctrine of <em>Chevron</em> deference to a federal agency’s (here, the BIA’s) reasonable interpretation of an ambiguous statute.</p><p>In an atypical move where only the U.S. Courts of Appeals for the 2nd, 4th, and 5th Circuits so far have looked at this issue,<a href=\"https://cdn.sanity.io/files/pito4za5/production/4e95f64d2e397b67cc23195afbf1f3d9a3fe8773.pdf\" target=\"_blank\" rel=\"noopener\"> Solicitor General D. John Sauer agrees</a> that the Supreme Court should grant review. Even so, the solicitor general maintains that the 2nd Circuit was correct in interpreting asylee adjustment as limited to noncitizens with current asylum status. The government says that Congress’ intent is best understood as giving effect to the termination of asylum “status” as a bar to obtaining a green card. The solicitor general relies on the statutory note in the Immigration Act of 1990 as evidence that Congress only excepted a small subset of asylees from the general rule barring terminated asylees from adjustment of status.</p><p>Without citing <em>Loper Bright</em>, the government disputes that the rule of lenity is applicable here at all. The solicitor general argues that the discretionary waiver at Section 1159(c) does not undermine the most natural reading of asylee adjustment because “the decision to terminate is itself discretionary” and the court should give effect to that waiver authority.</p><p>***</p><p>The Supreme Court’s resolution of this case could impact the interests of the millions of asylum applicants with cases pending in the immigration courts and asylum offices, as well as those persons granted asylum status in recent years. Even if the Supreme Court narrowly frames this case as a discrete statutory question, it will clarify the effect of the government’s termination authority for anyone granted asylum. This is especially timely: <a href=\"https://www.uscis.gov/sites/default/files/document/policy-alerts/PM-602-0192-PendingApplicationsHighRiskCountries-20251202.pdf\" target=\"_blank\" rel=\"noopener\">in December 2025, the DHS announced</a> that it would “comprehensively re-review” asylum approvals from “high-risk” countries since entry in 2021. At the end of that review, the DHS could elect to terminate asylum status. In June 2026, a <a href=\"https://www.govinfo.gov/content/pkg/USCOURTS-rid-1_26-cv-00132/pdf/USCOURTS-rid-1_26-cv-00132-0.pdf\" target=\"_blank\" rel=\"noopener\">federal district court vacated</a> the DHS re-review policy, but the government is challenging that ruling.</p><p>That’s not all. The case also could have <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6944598\" target=\"_blank\" rel=\"noopener\">broader implications</a> for federal administrative law if the justices take an interest in the parties’ arguments about the government’s discretionary authority or <em>Loper Bright</em>. The Supreme Court has not yet relied on <em>Loper Bright</em> in deciding an immigration case. In fairness, the 2nd Circuit found no need to do so, and the Supreme Court avoided a similar issue in <em><a href=\"https://www.supremecourt.gov/opinions/25pdf/24-777_9ol1.pdf\" target=\"_blank\" rel=\"noopener\">Urias-Orellana v. Bondi</a>, </em>a case that concerned the judicial standard of review for asylum “persecution” determinations. But that does not mean the court will continue to let this issue linger.</p><p><strong>Disclosure</strong><em>: When he was at the DOJ, the author litigated </em>Wassily<em> before the 2nd Circuit. He no longer has any involvement in the case or its litigation before the Supreme Court.</em></p><p><strong>Recommended Citation: </strong>Duncan Fulton, <em>Understanding the court’s next major case on asylum seekers: Wassily v. Blanche</em>, SCOTUSblog (Aug. 14, 2026, 10:00 AM), https://www.scotusblog.com/2026/08/understanding-the-courts-next-major-case-on-asylum-seekers-wassily-v-blanche/</p>"},{"title":"Industry legend Warren Spector is retiring: 'I'm feeling like I've done what I set out to do'","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/gaming-industry/industry-legend-warren-spector-is-retiring-im-feeling-like-ive-done-what-i-set-out-to-do/","category":"gaming","categoryLabel":"Gaming","wordCount":839,"readingTime":5,"content":"<p>Warren Spector is one of the industry's most storied developers, particularly among fans of immersive sims. His leading roles on games like <a href=\"https://www.pcgamer.com/reinstall-ultima-underworld-the-stygian-abyss/\" target=\"_blank\" rel=\"noopener\">Ultima Underworld</a>, <a href=\"https://www.pcgamer.com/system-shock-was-the-fps-that-changed-pc-games-forever/\" target=\"_blank\" rel=\"noopener\">System Shock</a>, and <a href=\"https://www.pcgamer.com/games/rpg/deus-ex-devs-say-they-werent-thinking-about-politics-when-they-made-one-of-the-most-political-games-of-all-time-what-i-think-is-the-right-future-for-humanity-is-irrelevant-its-all-about-what-each-player-thinks/\" target=\"_blank\" rel=\"noopener\">Deus Ex</a>—and you know what, even <a href=\"https://www.pcgamer.com/games/fps/deus-exs-maligned-sequel-was-the-most-2026-game-of-2003-it-clocked-the-21st-century-even-harder-than-metal-gear-solid-2/\" target=\"_blank\" rel=\"noopener\">Invisible War</a> and <a href=\"https://www.pcgamer.com/journeying-into-the-cradle-in-thief-deadly-shadows/\" target=\"_blank\" rel=\"noopener\">Deadly Shadows</a>, which are probably better than you think—established him as one of the field's most admired and enduring names. And now, after doing it for more than 40 years, he's calling it a day.</p><p>\"Let me cut right to the chase. I'm retiring from game development,\" Spector wrote on <a href=\"https://www.linkedin.com/posts/warrenspector_let-me-cut-right-to-the-chase-im-retiring-activity-7495321215083905025-DFaw/\" target=\"_blank\" rel=\"noopener\">LinkedIn</a>. \"At least I think so. I've been here before and changed my mind but this time I'm pretty sure I mean it.\"</p><p>Spector said he's had a \"great career\" and wouldn't change a thing, but added that he's coming up on 44 years as a developer, a span that's seen him work on tabletop RPGs, board games, and \"more digital games than [he] can remember,\" as part of teams ranging in size from a dozen people to 800. \"I've worked for big companies and done startups,\" he wrote. \"I like to think I've helped some insanely talented people along in their careers. (That last is the most important.)</p><p>\"With all that behind me and with age and health (my business) catching up with me I'm feeling like I've done what I set out to do. It's time to write some books, do a lot of reading, do some lecturing, maybe do some consulting. (Feel free to get in touch about those last two.) Also there's a keyboard here just waiting for me to get my piano chops back.\"</p><p>That reflects something I've always respected and admired about Spector: He's commonly held up as the \"creator\" of this game or that (I do it myself) but he's made a point in the past of reminding people that these aren't solo ventures.</p><p>\"You don't ship anything, let alone anything good, without a great team. The Deus Ex concept may have been mine, but the game itself, and all kudos aimed at it, belong to the great, great team that bought into a vision and made it a reality,\" he <a href=\"https://www.pcgamer.com/games/rpg/deus-ex-lead-warren-spector-pops-up-to-remind-everyone-he-didnt-make-the-game-alone-in-a-cave-wish-you-a-happy-25th-anniversary-and-get-me-wondering-if-something-deus-ex-related-is-happening-behind-the-scenes/\" target=\"_blank\" rel=\"noopener\">said in 2025</a>, marking the 25th anniversary of Deus Ex. More recently, he took a similar stance with Epic Mickey, <a href=\"https://www.pcgamer.com/movies-tv/epic-mickey-creator-warren-spector-is-a-little-bitter-that-his-studio-isnt-getting-props-for-sparking-oswald-the-lucky-rabbits-big-comeback/\" target=\"_blank\" rel=\"noopener\">calling out Disney</a> for failing to give \"the team at Junction Point\" proper credit for bringing Oswald the Lucky Rabbit back into the public eye.</p><p>Spector said he has mixed feelings about his retirement, saying there are three games in particular he'd still like to make: \"One is very big... one is very small... and one I don't know how to make which scares me.\" But the business has changed, \"and it's just not as much fun\" anymore—and, he added, \"there's a new generation of developers coming up who deserve their time in the sun.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>He also hasn't had much luck with his more recent venture at Otherside Entertainment, where he serves as studio director. Otherside's debut game, <a href=\"https://www.pcgamer.com/underworld-ascendant/\" target=\"_blank\" rel=\"noopener\">Underworld Ascendant</a>, was a catastrophe, and while <a href=\"https://www.pcgamer.com/thick-as-thieves/\" target=\"_blank\" rel=\"noopener\">Thick as Thieves</a>, released earlier this year, came out in far better shape, it failed to catch on with players and ended content updates just a couple months later. The studio had also been working on System Shock 3, but that came to an unhappy end in 2020 when the project was <a href=\"https://www.pcgamer.com/tencent-appears-to-be-the-new-owner-of-system-shock-3-and-4-websites/\" target=\"_blank\" rel=\"noopener\">taken over by Tencent</a> and, as far as anyone knows, subsequently left to die. It's doubly unfortunate because those are exactly the kind of games Spector is known for and should be able to crush, but it just hasn't worked out.</p><p>Despite that, I'll always hold out hope that Spector comes back someday, but mixed feelings or not, he does sound ready to pass the torch. \"I want you to remember that games are not a solved problem yet—there is, I hope, plenty of experimentation and innovation to come,\" he concluded. \"And to all you young developers out there, I've said it before and I'll say it again, your job is to make people forget people like me ever existed.</p><p>\"Will I come back? Never say never. But I think it's time to ride off into the sunset. Now stop reading and make great games.\"</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"}];
