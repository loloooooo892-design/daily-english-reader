<script>
var articles = [{"title":"What to Read After “Lonesome Dove”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/what-to-read-after-lonesome-dove","category":"fun","categoryLabel":"Interesting Reads","wordCount":897,"readingTime":5,"content":"<p><strong>Rachel Monroe</strong><em>A contributing writer covering the Southwest</em></p><p><strong>In Texas, where I live,</strong> someone always seems to be reading “<a href=\"https://cna.st/affiliate-link/DRqZQmpTgrbgHKjEbn6dA5ZzUXrCRuXFBPeAwpc9ZiScQxL3FnPZjdGKZ7UQLKS6anez1mhq6u3ZgVvaHLiL9pdEZV6VRRjR5KsrK2WTCXNuVq7rdf2HNMJ8QGRa9gBfBPsFkoRWm4Abh7EnurfimVC2HvQuNba15bLUbNu1sZ1zqC5H3QdpMFBW2UKFLk9M3JissV4YLfVGgVt73wHQy283X5E8TphfiJKPpsfccf3QfVSydDCsgQB7HViBufCQv4FiyvZuCtZreoesyVSP3zvxYU9hMJXfMm7NPZ57499S3TEfRpWz8pDnE38rmdo8zxZAC\" target=\"_blank\" rel=\"noopener\">Lonesome Dove</a>,” Larry McMurtry’s thrilling, ambivalent Western, first published in 1985. The rest of the country is catching on: the novel sold more copies in 2025 than it had in thirty years, and earlier this year it spiked on Google Trends. And I’m not surprised—“Lonesome Dove” is the kind of romantic, immersive story that gets BookTok going, but McMurtry shades his epic with just the right amount of regret. There’s never a bad time to hunker down with Gus, Call, and the other members of the Hat Creek outfit as they drive a herd of cattle from Texas to Montana, but summer is ideal. Nearly the whole novel takes place outdoors, through a series of vast landscapes that are at once brutal and beautiful. I guarantee you’ll cry at the end.</p><p>After it’s over, and you’ve dried your tears, you’ll be tempted to pick up one of the sequels or prequels that McMurtry churned out over the next few decades, to diminishing returns. I wouldn’t advise it. Here are some better options:</p><p><strong>If what you want is more of that McMurtry magic:</strong>Published in 1966, “<a href=\"https://cna.st/affiliate-link/HJ99Tbj4dgEiFYV435HzW8Es8z9AmDnL7nhegjade58wdJYWKEVsndBzmihCyRia4kyRhGXeMS45nLSzMUFAAF71p3WnKEWwqS28XThP8dLhbkuFTPVc5avPxTpUrRWptuoJfUJqaJHDbcWLNgXrnLVzw4DxH17BfJbv9rFyfT8g31EKTzdmcrgt1epPG6HncsTFT9ZmedCPLnb91GbXnDkpp46WHwSXnyD9U2Y1xY5Pt1tDpPhxTKqbSTeYtESjUvzEGPkfVexeh3VE8cQx3TF5kiABTVxjYRgAYqAmE7Wj7UxFePVzyPztqKQpS4FVLTYPjgdVPJvtpzDQU2E1gSwSKKimxsdswJ8rotciU2zZ1CusUg\" target=\"_blank\" rel=\"noopener\">The Last Picture Show</a>” is McMurtry’s third novel. It is a loosely autobiographical chronicle of adolescent lust and despair, set in the fictional Thalia, Texas—a stand-in for McMurtry’s home town—during the nineteen-fifties. Sexy and sad, a classic McMurtry combination.</p><p><strong>If you’re after further dissections of Lone Star State mythology:</strong>Carmen Boullosa’s historical fiction “<a href=\"https://cna.st/affiliate-link/2EvexLQGf2tBX5BxpQ9wzoYxCJFD46BR5NxiRLNwSidG47ES4PUaTANjXzP2Tr46Uwb63zjYFsBac76qoB3qC48F7bEXuSt6N8rBxbvmxWUcvkP7eUGa8LDGTF4c7SkSvC1JxNbNjUCgCqu9qwTwAzzR5C5gWmwYi1crooBa7qS5h4qoE9Hz1Uw8D9hMXtqbjN3ZhQGKvtkGmVduDNvBpVt2MbSDCPySD3kNM4DqyciiyJhxpQodbZMuaq8ztwZ5Doh4GeADqaamKHdvha1ibrEoHCAN3kS7PE1FWBAGqsETGwcp1N2VkiWAs78fk3rigp2MihnvidDD6K6HaAbMT9VsFSMhJKzM6AroGSpRiKrDsJcL749a\" target=\"_blank\" rel=\"noopener\">Texas: the Great Theft</a>,” from 2014, is a sprawling tale of nineteenth-century land theft in South Texas that features more than two hundred characters, not all of them human. Cacophonous, gossipy, and action-packed.</p><p><strong>If you’re hoping for another story of male friendship amid harrowing circumstances:</strong>“<a href=\"https://cna.st/affiliate-link/4h8jhTu8Afo9tnCLihrAQN8DiggTgUN9QjynhGYBZsL23nfQQcgcyZDTgav4ctpUt9bzFZX42TX9ncfxguTA1NVtoa9LY7fzUdMEv7a1n2T7g9kXrtgBzaWSzMXN3BEA7yTxFyZybcS7LDfXVjC2Be3qkhjxtZy1Z54kZecKWbSfZhXpeUPKLtFyHMxQSzxjew9N2QffoyQWgHAVuv9HfeVB3szqnp5S65dYQNYYsXFAXeenk19RN2ssTx9sYu7TD5BrK36hkKkvNnPFuPiRnHyUxdtyJ6kenpTWnThj9HLVqnD5a5T99xPvKUfDr5x4fBwANEtLNe2uZhc5yu1YMFfRYmBzYQc9bf2LjQmUUZVsxSX4Y\" target=\"_blank\" rel=\"noopener\">Alive</a>,” by Piers Paul Read, is a journalistic account from 1975 of the Uruguayan high-school rugby team who were on a flight when their plane crashed in the Andes. As they struggle to survive, the teen-agers discover their hidden heroism (and, sometimes, cowardice). Elemental and unexpectedly heartening.</p><p><strong>For more:</strong> read Monroe on <a href=\"https://www.newyorker.com/magazine/2023/09/25/larry-mcmurtry-a-life-tracy-daugherty-book-review\" target=\"_blank\" rel=\"noopener\">how McMurtry defined and undermined the idea of Texas.</a></p><p><strong>Jia Tolentino</strong><em>A staff writer covering culture</em></p><p><strong>As a known booster</strong> of the McMurtry masterpiece, I am frequently asked by friends who’ve just finished “Lonesome Dove”: What could possibly come next? What should a person read when she’s book-hungover from an absolutely breathtaking American doorstop and itchy, to the point of desperation, for more of the same? My best answer for this is sort of, actually, low-key . . . “<a href=\"https://cna.st/affiliate-link/Ziz49JQti6yB5VMaPiBiXtRcuy8MfJ6pE8iH2HbUxf4y956Angx3uoYRSkffnhcMhU4hPuTgUTxHzWrcz6pb9rhRmdvcEMhEJJPbJgCYoXwkX58PeR5SeCcvfgsPveQt3PQSHvXqXpta1qiaxbrWF3a3wGe38SL8FnHBAThCJFodrifkgdePzvzQhwXUCLkVLUShWpj8PbFa12xL1HFsgNqgFpgCS35UQCrgPUZsR8PtiLQ1e7afkQNZvdJD8CnYuM4UcGHcZtRekvP29mWjuWz8Rfvw3CZCNT2qvY99ebCkWtJAw2CCDYP2KJU76b9xQHSJKiCWvv8BMUqdULhjPgBpeuAY9ZTBzNcDdpnnE3W\" target=\"_blank\" rel=\"noopener\">Gone with the Wind</a>.”</p><p>Published in 1936, Margaret Mitchell’s epic was my favorite book by the end of elementary school, owing in large part to the indulgent material attention Mitchell pays to the Georgia landscape (“Spring had come early that year, with warm quick rains and sudden frothing of peach blossoms and dogwood dappling with white stars the dark river swamp and far-off hills”) and to Scarlett O’Hara’s wardrobe (I can still recite, like the Lord’s Prayer, her pre-barbecue choice between the rose organdie, the black bombazine, the sprigged muslin, and the green-plaid taffeta with the grease spot on the front of the basque). I’d considered rereading it many times in adulthood, but could never make it past the egregious dialect Mitchell uses for the enslaved characters—one of many, many manifestations of the book’s committed racism. This past winter, though, my reading pattern broke down in a way that could only be fixed by a big dose of pulp and sweep. I needed politics, history, romance, violence: bloody mud on the battlefield, babies and lace and ribbons at home. The war novel with a domestic lens is one of my favorite literary subtypes, but none break through a cognitive rut quite as bluntly as “Gone with the Wind.” And so, I recruited a friend and reopened my copy. “Scarlett O’Hara was not beautiful, but men seldom realized it,” the book begins, and I was instantly all the way in.</p><p>What ensued was about a thousand text messages back and forth as my friend and I sped through the book, and a slow contagion in which more of our friends have been convinced to pick it up. “Gone with the Wind” is evil, and far more interesting for being evil. (Scarlett, one of the finest comic characters ever written in literature, is, terrifyingly and amazingly, a lot like Donald Trump.) The novel registered to me as a paragon depiction of American political consciousness, or lack thereof. Scarlett’s world is constructed through immeasurable exploitation; it implodes in war and reconstitutes itself in hideous struggle. It all happens about a half-inch away from her face, and, yet, all she really thinks about is her wardrobe, her dinner options, her love life, her bank account. Plenty among us, as our country commits atrocities across the globe, might relate.</p><p><strong>For more:</strong> read Tolentino on <a href=\"https://www.newyorker.com/books/page-turner/summer-reading-2024\" target=\"_blank\" rel=\"noopener\">the time McMurtry had her “spellbound.”</a></p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Coming soon:</strong></p><ul><li>“<a href=\"https://cna.st/affiliate-link/DRqZQmpTgrbgHKjEbn6dA5ZzUXrCRuXFBPeAwpc9ZiScQxL3FnPZjdGKZ7UQLKS6anez1mhq6u3ZgVvaHLiL9uSzjQqZsxE5Rvtd735t6LA31WnKjGVnhn2KHSjXNTAvxyRB7uUqXPneWSPmcyAedsuFrmHfm4YxxzHaTw8wxQyiQD6hmSvW8n6QPLwpAnnp972ZPB3ZHARd7PhcRxE3GdK5T6kgHMBBDAgF3gvMisJzeqdEgNpwRdSVTcLreZ65W5TptMRaSzCjcr9qdk8ETf9xioASRB9RXqKcTXxBLPVVko4kT6XbML8YQEr9LhNJK3GUL\" target=\"_blank\" rel=\"noopener\">Sunrise</a>,” by Téa Obreht, which is publishing on August 11th, is about a woman who, after surviving a small-plane crash, finds herself in a seemingly abandoned town in the mountains of Wyoming.</li></ul>"},{"title":"Justice Elena Kagan on the Late, Great Prof. Richard Fallon","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/13/justice-elena-kagan-on-the-late-great-prof-richard-fallon/","category":"law","categoryLabel":"Law","wordCount":1258,"readingTime":7,"content":"<p>From the <a href=\"https://harvardlawreview.org/print/vol-139/in-memoriam-professor-richard-h-fallon-jr/\" target=\"_blank\" rel=\"noopener\"><em>Harvard Law Review </em></a>(thanks to <a href=\"https://x.com/RichardMRe/status/2087576498605572515\" target=\"_blank\" rel=\"noopener\">Prof. Richard Re</a> for the pointer):</p>\n<blockquote><p>Forty years ago, I walked into Dick Fallon's Fed Courts class in the now-demolished wing of Pound Hall. Dick was young—only 33. It was his third year teaching at Harvard Law School. It was his third time teaching Fed Courts. But even then, more students than he could possibly teach sought out his class because they had heard it would make them better thinkers and lawyers. I took many wonderful classes and had many wonderful teachers at HLS. But if forced to pick just one—as the most rigorous, most challenging, and most exciting—I'd pick Fallon on Fed Courts.</p>\n<p>I'm not sure I'd have guessed that on the first day. Dick didn't have an enormous classroom presence. He certainly wasn't a Kingsfield-type. He was as unfailingly kind—even gentle—inside the classroom as he was outside of it.</p>\n<p>And yet he had the highest of standards—for both his students and the law. He treated every issue in Fed Courts as a kind of mystery: What explained how a given doctrine had developed? What was its purpose, and how did it work? Did it accomplish its objectives, and were its objectives worth accomplishing at all? Every question was hard, every follow-up still harder. Dick demanded more analytic precision, more clarity of thought than any teacher had asked of me before. Time and again, when he called on me, my answers sooner or later came up short. And it was the most thrilling experience I ever had in a classroom.</p>\n<p>In the middle of that semester, Dick asked me and Carol Steiker (also one of Dick's later colleagues at HLS) to do some out-of-class work for him. He asked if we would read an article he was working on and come talk with him about it—to tell him what we thought of it and how he could improve it. That article was published the next year as <em>A Constructivist Coherence Theory of Constitutional Interpretation</em>. The worst thing about it was its title. The best thing about it was everything else. I very much doubt I had a single useful thing to say about how to make that article better. The benefit of the experience was 100% on my side. To be invited into an intellectual dialogue with a professor as brilliant as Dick Fallon? And then to soak up all I could from our talks? It blew me away. And it made me think that maybe I wanted to, and maybe I could, become a legal academic myself.</p></blockquote>\n<blockquote><p>Which, I'm quite sure, was the whole point of Dick's proposal. In the months since his death, I've heard so many of his former students talk about the influence he had on their careers. How he gave them, as he gave me, the confidence to pursue some path. Or helped them to develop an idea. Or read multiple drafts of their first article. Or pushed hard for them to get hired in some job. He was not just a great classroom teacher but a great mentor. He got to know lots of students. He thought their ideas were worth spending time on, and he engaged with them as peers. The legal world is full of HLS alumni grateful to Dick Fallon. I'm certainly one.</p>\n<p>When I returned to Harvard years later as a professor, I realized that Dick had a gift for personal relations of every sort. He was the best of colleagues; he was the best of friends. From David Shapiro and Lloyd Weinreb in a prior generation to Daphna Renan and Ben Eidelson in a much later one. I often heard from John Manning and Jack Goldsmith about the joys of working closely with Dick. But the person I most think of as in perfect synergy with him was Dan Meltzer. In all its long history, I doubt HLS has ever had such a partnership. I think what Dan would have said about it is that Dick's generosity knew no bounds. That Dick made everyone around him better. And that collaborating with Dick, on some of the greatest federal courts articles ever, was one of the prime joys of his academic life.</p>\n<p>As much as anyone who has ever graced HLS, Dick loved doing scholarship. What he wrote was at times not very fashionable or trendy. In 1986, for example, a person had to go against the grain (and by more than a bit) to write something like <em>A Constructivist Coherence Theory of Constitutional Interpretation</em>. But Dick had a strong sense of his own identity as a scholar—what he cared about, what he was best suited to, and what he thought was valuable. And as the years went by, Dick's scholarship came to be seen by pretty much everyone as of transcendent quality and lasting importance.</p>\n<p>Here are the three things I love most about it:</p>\n<p>First, it takes law—and particularly the enterprise of judging—deeply seriously. Dick didn't think that doing law was mechanical. He didn't believe in the \"just call balls and strikes\" view of the judge's role. He thought that values of various kinds did, had to, and indeed should enter the picture. But for all that, Dick believed that law had a there there—that it wasn't just politics or personal preferences by another name. And Dick thought that even when its determinacy ran out, law could be done with analytic rigor, adherence to principle, and fair-mindedness. Law could be done, that is, in much the way Dick wrote his articles. It's at once a realistic and an attractive vision of judging.</p>\n<p>Second, and relatedly, Dick took great pains to get everything right. There's no cutting corners in his scholarship. There's no gliding over or eliding the toughest issues. Dick was a grappler. And he didn't stop working on an article until he had tried, to the best of his ability, to nail everything down. As a result, Dick's work has a deep integrity. His articles weren't essentially finished before they were started. Every line in them was the product of meticulous thought.</p>\n<p>And third, Dick always showed respect for those who disagreed. He cast the views of his intellectual adversaries in their strongest form and their best light (before, that is, going on to shred them). The best example is his work on originalism. Dick wasn't a fan of the theory. But his work was scrupulously intent on giving its adherents their due. It's a good lesson in these contentious times. Dick didn't pull his punches. But he was never less than civil—indeed, he was generous—when engaging with those who held different views.</p>\n<p>In my first year on the Court, the Chief Justice assigned me the majority opinion in a case that could have been a fed courts exam, called <em>Camreta v. Greene</em>. It came out late in the Term, and Dick wrote me a letter about it that summer. The letter included some praise. And it included some trenchant criticism. All in all, I don't think Dick agreed with the opinion. But at the end of the letter, he wrote: \"I will always be proud that I taught Federal Courts to the person who wrote <em>Camreta v. Greene</em>.\" I relate that line only to convey that no note I've received in my fifteen-plus years on the bench has made <em>me</em> more proud. That's how much Dick's opinion meant and means to me, I think rightly. It was a gift that Dick Fallon was my teacher, both forty years ago and ever since.</p></blockquote>"},{"title":"There are a few gooduns in August's Xbox Game Pass line-up, including a surprisingly sexy, and funny, furniture dating sim","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/xbox-game-pass-lineup-august-2026","category":"gaming","categoryLabel":"Gaming","wordCount":726,"readingTime":4,"content":"<p>Couch co-op, if you know what I mean.</p>\n    \n  \n  \n  \n  \n            <p>A beleaguered Xbox has revealed the next batch of games coming to the Game Pass subscription during the first few weeks of August, and there are a few eye-catching additions among them.</p>\n<p>The big-ticket items for Game Pass Ultimate subscribers - the top tier - are brand-new <a href=\"https://www.eurogamer.net/beast-of-reincarnation-review\" target=\"_blank\" rel=\"noopener\">action role-playing game Beast of Reincarnation from Pokémon studio Game Freak, which we reviewed yesterday</a>, and the Gears of War: E-Day open beta, which starts tomorrow and will let you test the game's evolved, wave-based Horde mode.</p>\n<p>Elsewhere, the surprisingly entertaining dating game <a href=\"https://www.eurogamer.net/games/date-everything\" target=\"_blank\" rel=\"noopener\">Date Everything!</a> arrives on Game Pass Ultimate, Premium and PC Game Pass. This is the game made by Critical Role alumni Robbie Daymond's studio Sassy Chap, so it involves a lot of the Critical Role voice cast and their friends. The idea is brilliantly bizarre: you date items of furniture around a house that turn into people when you cast a kind of spell on them. It's thirsty, it's funny, it's well-put together, and it's very uplifting. It's well worth a try.</p>\n\n<p>Otherwise, a lot of the activity is games arriving on Game Pass Premium that were already on Ultimate and PC Game Pass, including <a href=\"https://www.eurogamer.net/games/grounded-2\" target=\"_blank\" rel=\"noopener\">Grounded 2</a>, which is about to welcome a big expansion; <a href=\"https://www.eurogamer.net/ball-x-pit-review\" target=\"_blank\" rel=\"noopener\">the incredibly compelling Ball x Pit</a>, which I wholeheartedly endorse; <a href=\"https://www.eurogamer.net/powerwash-simulator-2-review\" target=\"_blank\" rel=\"noopener\">PowerWash Simulator </a>2, which needs little explanation; and Metroidvania <a href=\"https://www.eurogamer.net/mio-memories-in-orbit-metroidvanias-after-hollow-knight-silksong\" target=\"_blank\" rel=\"noopener\">Mio: Memories of Orbit</a>, which seems to have been well received.</p>\n<p>Games leaving the service soon - on 15th August - include <a href=\"https://www.eurogamer.net/aliens-fireteam-elite-review-throwaway-thrills\" target=\"_blank\" rel=\"noopener\">Aliens: Firewatch Elite</a>, which is notable because there's <a href=\"https://www.eurogamer.net/explosive-co-op-shooter-aliens-fireteam-elite-gets-a-sequel-and-its-coming-soon\" target=\"_blank\" rel=\"noopener\">a sequel coming</a> soon, and <a href=\"https://www.eurogamer.net/firewatch-review\" target=\"_blank\" rel=\"noopener\">Firewatch, an indie game that's taken on a legendary kind of status</a>.</p>\n<p>The full Xbox Game Pass list for the first chunk of August follows. It arrives against the backdrop of an Xbox division in flux, as drastic restructuring sweeps the company, resulting in 1600 people already losing their jobs and 1600 more to lose their jobs between now and next summer. <a href=\"https://www.eurogamer.net/game-pass-latest-membership-figures-decline\" target=\"_blank\" rel=\"noopener\">Ailing Xbox console sales and Game Pass subscription numbers</a> are among the myriad reasons why Microsoft has found itself in this position. It's one of the reasons <a href=\"https://www.eurogamer.net/xbox-game-pass-price-cut-working-asha-sharma\" target=\"_blank\" rel=\"noopener\">new Xbox boss Asha Sharma significantly cut the price of Game Pass recently</a>, in order to drive subscriber numbers up.</p>\n<h2>Available now</h2>\n<ul>\n<li><strong>Heretic + Hexen</strong> (Cloud, Console, Handheld, and PC) – August 4, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li><strong>Beast of Reincarnation</strong> (Cloud, Xbox Series X/S, Handheld, and PC) – August 4, new on Game Pass Ultimate, PC Game Pass</li>\n</ul>\n<h2>Coming soon</h2>\n<ul>\n<li>Monsters are Coming! (Cloud, Xbox Series S/X, Handheld, and PC) – August 6, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li><strong>PowerWash Simulator 2</strong> (Cloud, Xbox Series S/X, and PC) – August 6, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li>Bounty Star (Cloud, Xbox Series S/X, and PC) – August 11, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li><strong>Date Everything!</strong> (Cloud, Xbox Series S/X, Handheld, and PC) – August 11, new on Game Pass Ultimate, Game Pass Premium, PC Game Pass</li>\n<li><strong>Grounded 2</strong> (Game Preview) (Cloud, Xbox Series S/X, Handheld, and PC) – August 11, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li><strong>Ball x Pit</strong> (Cloud, Xbox Series S/X, Handheld, and PC) – August 12, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li>Cricket 26 (Cloud, Console, and PC) – August 13, new on Game Pass Ultimate, Game Pass Premium, PC Game Pass</li>\n<li><strong>Mio: Memories in Orbit</strong> (Cloud, Xbox Series S/X, Handheld, and PC) – August 13, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n<li>Sandustry  (Game Preview) (PC) – August 13, new on Game Pass Ultimate, PC Game Pass</li>\n<li>Egging On (Cloud Xbox Series S/X, Handheld, and PC) – August 18, new on Game Pass Premium, already on Game Pass Ultimate and PC Game Pass</li>\n</ul>\n<h2>Leaving August 15</h2>\n<ul>\n<li>Menace (Game Preview) (PC)</li>\n<li>Atlas Fallen (Cloud, Console, and PC)</li>\n<li>Aliens: Fireteam Elite (Cloud, Console, and PC)</li>\n<li>Firewatch (Cloud, Console, and PC)</li>\n</ul>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n  \n    <p>\n      <a href=\"https://www.eurogamer.net/games/ball-x-pit-the-kenny-sun-story\" target=\"_blank\" rel=\"noopener\">Ball x Pit</a>\n    </p>\n    <p>\n        Android, Mac, Nintendo Switch, Nintendo Switch 2, PC, PS5, Xbox Series X/S, iOS\n    </p>\n  \n\n          \n            \nSee 6 more"},{"title":"This Ego Electric Mower Tamed My 2.5-Acre Lawn With Ease and in Less Time","source":"Wired","author":"@wired","url":"https://www.wired.com/review/ego-1300-electric-lawn-mower/","category":"tech","categoryLabel":"Technology","wordCount":1392,"readingTime":7,"content":"<p>Aug 12, 2026 7:00 AM</p><h2>Review: Ego 1300 Electric Lawn Mower</h2><p>Ego’s newest, biggest, self-propelled mower handles larger yards in less time with impressive performance and battery life.</p><p>Rating:</p><p>9/10</p><p>Wide cutting area reduced mowing times by 30 percent. Dual-blade system has more suction. Powerful self-propelling drive system. Good battery life. Wide range of clearly labeled cutting heights. Handle folds down for compact storage. Quiet and odor-free.</p><p>Overkill for smaller yards.</p><p>I dislike lawns. Vast unproductive expanses of grass are great for playing baseball, but I don't want one at my house. I want gardens, orchards, and silvopasture capable of producing food. And yet here I am, having recently purchased 5 acres of property, much of which is lawn, which therefore has to be mowed.</p><p>When my older, 21-inch gas mower died yet again at the start of summer, I decided it was time to jump ship for an electric mower. They are quieter, don't smell like exhaust, and are largely maintenance-free. The largest, most powerful residential electric mower I could find was Ego's 1300 series (30-inch) mower, which has made relatively quick work of my roughly 2.5 acres of mowing, but perhaps most enticing is how easy it makes the job.</p><h2>Cutting Through</h2><p>The 30-inch model is the newest member of Ego's line of cordless, self-propelled electric lawn mowers. The wider cutting path makes it an excellent choice for larger properties like mine, but the fact that the handle folds down to make it easier to store, combined with its surprising maneuverability, means it'll handle smaller properties in no time as well.</p><p>My old 21-inch gas mower was a Toro that a friend of mine found for free at the side of the road. He gave it to me, I replaced the carburetor, and it fired right up. Score! It ran fine for over a year. And mowing 5 acres with a small gas mower at an hourly rate made my son a relatively wealthy 11-year-old. But then it died again. And again. And at some point, small engine repair isn't fun anymore.</p><p>While I was spending weekends cleaning carbs, tracking down air filters, and not mowing, the grass was growing. In northern Wisconsin, grass grows so fast I'm pretty sure you can see it happening if you take the time. A wet June ensured that by the time the Ego arrived for testing, the grass was well out of control, up to 10 inches in the lower, wetter areas of the property.</p><p>I figured it would make a good torture test for the Ego, but I'd still need to go in afterward to hack it back with my string trimmer. To my surprise, the Ego 1300 plowed right through almost all of it in a single pass.</p><p>For the first pass, I set the height to 4.5 inches, which is easy to do using the height adjustment lever. Unlike an alarming number of mower makers, Ego's height adjustment system is a thing of beauty. The height markings aren't arbitrary letters or symbols that require you to consult a manual to translate to inches. On the Ego, the height adjustment is plainly printed in inches. Imagine that. This lets you know that if you set it to 4.5 inches, your grass will be 4.5 inches high when you're done.</p><p>Starting at 4.5 inches and running in Turbo mode allowed the Ego, in a single pass, to cut just about anything I pointed it toward. There is one patch of grass, below an active seeping spring, that was long enough and wet enough that I had to make two passes to get a nice even cut. After that initial mow, I then went back over it a few days later at 3 inches to finally get the height back to what I could call normal. The second mow was, dare I say, incredibly easy. Even the lowest self-propelled speed was generally fast enough for me, though I did crank it up to about the middle to get up the steeper slopes (and then turned it off entirely going downhill).</p><p>The Ego has options to mulch, bag, or side-discharge your clippings. I ran the mower in all three for testing purposes, but left to my own devices I'd mainly leave it in mulching mode. So far as I could tell in testing the three modes, what happens to the cuttings doesn't seem to have any impact on battery life or how well it cuts through tall grass. I will say, though, that the included rear bag holds way more than I would have thought.</p><p>The Ego 1300 is a big mower, by far the biggest walk-behind mower I've ever used. Despite that, pushing it on level ground when it's dead isn't difficult at all if you're in moderate shape. Uphill is another story. I definitely suggest saving some battery to get back up the hill if your yard has anything steep. That said, maneuvering the mower around trees, firepits, berry bushes, and other obstructions in my yard wasn't difficult. The self-propelled motor is easy to turn on and off as you navigate obstacles and makes the mower comfortable to hold onto when you're on a straight run.</p><p>Under the composite deck are two 15.2-inch mower blades, which look and function similarly to those you'd likely see under a riding mower (though, of course, these are smaller). The twin 6.0-Ah batteries drive dual brushless motors capable of producing 13.2 foot-pounds of torque. The blade speeds range up to 3,800 revolutions per minute, according to Ego, with a top speed of 15,100 feet per minute. The dual-blade design gives the Ego a stronger suction and lift than a traditional single-blade design. Out of the box, the blades were nice and sharp and delivered an excellent clean cut.</p><p>Battery life depends significantly on which mode you're using: 1, 2, or Turbo. That first mow, which I ran almost entirely on the Turbo setting, sucked down the power. I hit the flashing-red-light stage at around one hour. In the mows since, which have mostly been at the lowest power setting, I get more like an hour and 20 minutes. I haven't felt the need to mow the entire property in the 2 mode, but I suspect that would net around an hour and 10 minutes of run time.</p><p>Because the Ego 1300 is cutting about 30 percent more with every pass than a typical 21-inch mower, battery life proved less of a concern than I thought it would. That's a significant time savings, which translates to getting more grass cut on a single charge.</p><h2>Competition</h2><p>I know what you're thinking: If you hate mowing lawns, why not <a href=\"https://www.wired.com/gallery/best-robot-lawn-mowers/\" target=\"_blank\" rel=\"noopener\">get a robot lawn mower</a>? I have tried some, <a href=\"https://www.wired.com/review/husqvarna-435x-awd-automower/\" target=\"_blank\" rel=\"noopener\">including one I liked</a>, but quixotically, while I don't like lawns, there is a strange appeal to the chore of mowing. It gets me outside, gives me a little exercise, and there's a certain satisfaction in the job that a robot mower deprives me of. I also often make spur-of-the-moment decisions, like letting the clover-heavy patches of the mowed area temporarily go to flower, which brings the pollinators (which help the nearby raspberries and blueberries be more productive). That's difficult to do with a robot mower.</p><p>Another, perhaps saner, choice would be a riding mower, but the storage space required and expense make this a less appealing choice for me. The amount I mow shrinks every time I dig another swale, with the eventual goal of eliminating all but the paths between plantings.</p><p>In terms of other 30-inch electric mowers, probably the biggest competition is Ego's own commercial series, which is more expensive and intended for lawn professionals, but it is an option worth considering if you have a large property.</p><p>The Ego 1300 isn't cheap, but part of what you're doing here is buying into a battery system, which works across Ego's wide variety of lawn and garden electric tools. If you enjoy the chore of mowing the lawn, but want to cut down the time it takes, the Ego 1300 is a fantastic electric mower and well worth the expense.</p><p><a href=\"https://www.wired.com/author/scott-gilbertson/\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://www.wired.com/author/scott-gilbertson/\" target=\"_blank\" rel=\"noopener\">Scott Gilbertson</a> is Operations Manager for the WIRED Reviews Team. He was previously a writer and editor for WIRED’s Webmonkey.com, covering the independent web and early internet culture. You can reach him at luxagraf.net. ... <a href=\"https://www.wired.com/author/scott-gilbertson\" target=\"_blank\" rel=\"noopener\">Read More</a></p>"}];

}

function nextArticle() {

}
