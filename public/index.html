<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {

  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {

  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {

  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {

  text-decoration: none;

.footer a:hover {

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;

  text-align: center;

}

.archive-link a {
  color: var(--accent);

.archive-link a:hover {

@media (max-width: 480px) {

<script>
var articles = [{"title":"I Got a Free Meal From a Private Chef—Who Filmed It All to Train Robots","source":"Wired","author":"@wired","url":"https://www.wired.com/story/i-let-a-private-chef-film-my-kitchen-for-robot-training-data/","category":"tech","categoryLabel":"Technology","wordCount":1071,"readingTime":6,"content":"<p>When the private chef sent by Shift arrived at my apartment <a href=\"https://www.wired.com/tag/cooking/\" target=\"_blank\" rel=\"noopener\">to cook</a> a three-course meal, he was already ready to record. He walked through my front door wearing a baseball hat with a blocky, white camera attached to the brim.</p><p>I signed up for a free lunch in exchange for the whole experience being recorded and uploaded as <a href=\"https://www.wired.com/story/how-to-stop-your-data-from-being-used-to-train-ai/\" target=\"_blank\" rel=\"noopener\">training data</a>. As chef Ali unpacked his supplies and started on a gazpacho, the hat cam recorded his hand movements, with the intention that this data could help build a <a href=\"https://www.wired.com/story/the-1x-neo-robot-has-freaky-fast-fingers/\" target=\"_blank\" rel=\"noopener\">better robot</a>—one with culinary expertise.</p><p>It’s all part of the growing boom of <a href=\"https://www.wired.com/story/household-chores-training-robots/\" target=\"_blank\" rel=\"noopener\">egocentric data collection</a>—recording human hand movements from a first-person point of view. <a href=\"https://www.joinshift.us/\" target=\"_blank\" rel=\"noopener\">Shift</a> made waves earlier this year by providing free cleaning services in New York City under a similar arrangement: Let Shift record tasks in your home and, in exchange, you get a gratis service. The company expanded in San Francisco by offering free home-cooked meals. If, in the not-so-distant future, I’m able to buy a skilled humanoid to coexist with at home, I sure hope that its knife-wielding skills are up to par.</p><p>Shift is a division of the larger German startup <a href=\"https://www.microagi.ai/\" target=\"_blank\" rel=\"noopener\">Microagi</a>, which focuses on deploying robots in real life. “The goal of Shift is twofold. First, allow people to join the AI economy,” says Microagi CEO Bercan Kilic. “The other part is to handhold the entire society and governments together, from today until the abundance.”</p><p>In the short term, Kilic sees this as a way to build a marketplace where contractors can make some cash recording videos and contributing to the improvement of <a href=\"https://www.wired.com/story/frontier-labs-arent-the-only-ones-pursuing-self-improving-ai/\" target=\"_blank\" rel=\"noopener\">AI models</a>. Looking at the horizon, he believes impending tech innovations may usher in a new, utopian-esque age of <a href=\"https://www.wired.com/story/wealth-inequality-personal-service-access-artificial-intelligence/\" target=\"_blank\" rel=\"noopener\">widespread wealth</a>.</p><p>This year, I’ve spent dozens of hours with an <a href=\"https://www.npr.org/2026/05/27/nx-s1-5835190/he-filmed-himself-doing-household-tasks-for-ai-robots\" target=\"_blank\" rel=\"noopener\">iPhone strapped to my head</a>, attempting to understand this growing avenue of the gig economy. I’ve recorded my hand movements for <a href=\"https://www.wired.com/story/i-tried-doordashs-tasks-app-and-saw-the-bleak-future-of-ai-gig-work/\" target=\"_blank\" rel=\"noopener\">DoorDash</a> while scrambling eggs for breakfast and recorded my fingers tying shoelaces, over and over again, for another data collection startup. Shift offers a similar gig work setup for people who want to record and sell their own egocentric data. While my payouts have been skimpy, I was previously successful in monetizing my physical movements, to some degree, on other platforms. I felt curious about what it would feel like to be on the other side of the camera, for once.</p><h2>Free Lunch</h2><p>The uniform for Shift chefs blends elements of a restaurant worker's outfit with cyborg qualities. Ali, the chef, was wearing a white shirt and pants with a brown apron wrapped around his body. The camera attached to his hat was roughly the size of a <a href=\"https://www.wired.com/review/gopro-mission-1-pro/\" target=\"_blank\" rel=\"noopener\">GoPro</a>, with a white wire running through the top and down his back. The wire was attached to a smartphone, where the recordings from this free lunch were stored. It jiggled a bit as he cooked.</p><p>I’ve never had a private chef before in my cramped apartment, so I felt a bit weird just standing by in the kitchen as he prepared a gazpacho appetizer and started chopping trumpet mushrooms. The finesse and dexterity displayed (and recorded) with his knife skills go far beyond what my rudimentary chops could help train a robot to cook. My sense of awkwardness only increased as I remembered that everything was being recorded. <em>I</em> s<em>hould have scrubbed that oven more before it was immortalized as robot training data.</em> Even if the <a href=\"https://www.wired.com/tag/robots/\" target=\"_blank\" rel=\"noopener\">robots</a> don’t mind a bit of mess, my human ego still prevails.</p><p>The apartment smelled amazing as Ali got started on the main course, baked salmon with a creamy zucchini sauce, and I began to loosen up. Similar to how I respond when people use Meta’s <a href=\"https://www.wired.com/story/the-rise-of-the-ray-ban-meta-creep/\" target=\"_blank\" rel=\"noopener\">AI glasses to record in public</a>, I initially froze under the weight of being perceived so directly by technology. But as I chomped on the crispy salmon skin at my dinner table, I considered these recordings from a broader perspective. My kitchen would be just a single drop in the vast ocean of robot training data. I was beginning to get over myself and give in to the <a href=\"https://www.wired.com/story/humanoid-robot-soldier-eric-trump-foundation-future-industries/\" target=\"_blank\" rel=\"noopener\">humanoid future</a>.</p><p>Ali finished the meal with a beautifully-piped tiramisu and immediately got started cleaning up the kitchen. What good would a humanoid robot be if it could cook you some Michelin-star-level meal but left you with a pile of crusty pans soaking in the sink? Collecting cleaning data can be just as critical as collecting cooking data.</p><h2>Chef Bot-Yardee</h2><p>Kilic says Shift plans to branch out and eventually add other free services, or at least offer them at discounted rates, in exchange for recording the experience. While the boom of <a href=\"https://www.wired.com/story/sleeptime-compute-chatbots-memory/\" target=\"_blank\" rel=\"noopener\">large language models</a> was powered by scraping the internet for text data, no comparable, vast repository of egocentric video data exists for training robots. That’s why the inside of your home, alongside how to navigate it while completing tasks, is so valuable that a company would be willing to front you a private chef for a day.</p><p>He’s optimistic that we’ll soon be living with humanoids. “By this time next year we will have quite good home robots that are at reasonable prices,” he says. “It won't do all the tasks, but it will do most tasks quite well. It will be like <a href=\"https://www.wired.com/story/robot-vacuums-must-improve-rant/\" target=\"_blank\" rel=\"noopener\">vacuum robots</a> in 2020.”</p><p>I’m not worried about these bots gaining consciousness, but I am anxious about the ramifications of <a href=\"https://www.wired.com/story/this-robot-is-going-to-replace-your-interns-flexion/\" target=\"_blank\" rel=\"noopener\">physically embodying AI models</a> further and giving them tools. While a Roomba may smear dog poop all over the carpet when it messes up while you’re at work, a nascent, knife-wielding chef-bot could endanger the dog, or even you, if it glitched out.</p><p>I’m also skeptical that these robots, even if they eventually live up to the hype, will truly usher in an age of abundance. Yes, the Industrial Revolution changed aspects of the world for the better, but wealth inequality is <a href=\"https://wir2026.wid.world/insight/global-economic-inequity/\" target=\"_blank\" rel=\"noopener\">worse than ever</a>, and homelessness <a href=\"https://www.jchs.harvard.edu/blog/homelessness-declines-remains-near-record-high\" target=\"_blank\" rel=\"noopener\">remains near record highs</a> in the US. A revolution in robotics has the potential to improve baseline living conditions, without eliminating poverty.</p><p>Wealthy early adopters who are willing to spend thousands next year on home bots will have my apartment’s kitchen as well as chef Ali to thank, in small part, for their humanoid-crafted meals. Until then, I have an abundance of leftover tiramisu in the fridge to enjoy.</p>"},{"title":"HRW report says oil production in DRC poses severe environmental and health risks","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/hrw-report-says-oil-production-in-drc-poses-severe-environmental-health-risks/","category":"law","categoryLabel":"Law","wordCount":546,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/hrw-report-says-oil-production-in-drc-poses-severe-environmental-health-risks/#\" target=\"_blank\" rel=\"noopener\">HRW report says oil production in DRC poses severe environmental and health risks</a>\n</strong><p>Human Rights Watch (HRW) on Monday <a href=\"https://www.hrw.org/news/2026/07/27/dr-congo-oil-company-operations-pose-grave-pollution-threat\" target=\"_blank\" rel=\"noopener\">reported</a> that Perenco, the sole oil producer in the Democratic Republic of Congo (DRC), is ausing in production methods that pose grave health and environmental threats to local communities.</p><p>HRW Central Africa director Lewis Mudge stated: “The Congolese government transparency on oil pollution levels to meet its obligations to uphold the right to health and to fully enforce its laws. The authorities should acknowledge the threat to people’s health in oil concession areas, immediately report on pollution levels, and act to reduce population exposure.”</p><p>Despite the environmental laws in place to prevent harmful pollution by companies, Perenco has continued to engage in environmentally harmful practices such as <a href=\"https://www.worldbank.org/en/programs/gasflaringreduction/gas-flaring-explained\" target=\"_blank\" rel=\"noopener\">gas flaring</a> and waste burning at its production area near the western city of Muanda.</p><p>Oil and gas production in the DRC has caused severe health problems for residents such as respiratory illness, dizziness, and crop failure. Perenco has not prevented oil spills from wells and pipelines from leaking into soils and riverbeds, causing concentrations of heavy metals to appear in otherwise drinkable water and exacerbating the country’s severe <a href=\"https://dicf.unepgrid.ch/democratic-republic-congo/water\" target=\"_blank\" rel=\"noopener\">water crisis</a>.</p><p>Perenco has been operating in the DRC since 2000, with many facilities and extraction sites in or near residential areas. In response to probing by HRW, the company denied that its operations “cause air, soil and water pollution or detrimental acute health conditions”,  stating that it has invested in pollution prevention and local health initiatives. Despite these claims, HRW has been investigating harmful practices going as far back as to 2013, occurring with little consequence for the company even though they may violate several facets of environmental law at the national and international level.</p><p>At the international level, the DRC is party to the <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-economic-social-and-cultural-rights\" target=\"_blank\" rel=\"noopener\">International Covenant on Economic, Social, and Cultural Rights</a>, which guarantees individuals the right to the highest attainable level of physical health by obligating the government to ensure the “prevention and reduction of the population’s exposure to… harmful chemicals or other detrimental environmental conditions.” The covenant is monitored through a <a href=\"https://www.ohchr.org/en/treaty-bodies/cescr\" target=\"_blank\" rel=\"noopener\">UN expert committee</a>, but largely relies on the country itself to take measures to prevent such pollution.</p><p>At the national level, the DRC is one of about 100 <a href=\"https://www.genevaenvironmentnetwork.org/resources/updates/human-rights-and-the-environment/\" target=\"_blank\" rel=\"noopener\">countries</a> that expressly contains the right to a healthy environment within <a href=\"https://www.constituteproject.org/constitution/Democratic_Republic_of_the_Congo_2011#s250\" target=\"_blank\" rel=\"noopener\">Article 53</a> of its constitution. Additionally, the DRC has enacted several <a href=\"https://forestpolicy.org/sites/default/files/2019-08/5drc09.pdf\" target=\"_blank\" rel=\"noopener\">specific laws and programs</a> providing for environmental protections and safeguards, however, according to HRW, proper enforcement by the Congolese government has been lacking in these areas.</p><p>For example, the country’s 2011 <a href=\"https://www.iea.org/policies/11937-law-no-11009-of-09-july-2011-on-fundamental-principles-relating-to-the-protection-of-the-environment\" target=\"_blank\" rel=\"noopener\">Law on the Fundamental Principles of Environmental Protection</a> prohibits the disposal of waste in locations where it may harm the environment or public health and safety. However, HRW obtained video footage of open-air oil waste burning at a Perenco facility approximately two kilometers, or 1.2 miles, south of a residential village.</p><p>In the report, HRW indicated that one glaring issue is the lack of regular monitoring of environmental conditions in the region. Moving forward, HRW has called upon the Congolese government to publish findings of their environmental audits of the company, stating that the right to health obligates governments to provide access to information concerning main health problems in the community.</p>"},{"title":"Thimbleweed Park 2 is 'not really a sequel, not really a prequel,' but it is finally happening","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/adventure/thimbleweed-park-2-is-not-really-a-sequel-not-really-a-prequel-but-it-is-finally-happening/","category":"gaming","categoryLabel":"Gaming","wordCount":630,"readingTime":4,"content":"<p>Released in 2017, <a href=\"https://www.pcgamer.com/thimbleweed-park/\" target=\"_blank\" rel=\"noopener\">Thimbleweed Park</a> is a LucasArts-style point-and-click adventure about murder in a small town, headed up by LucasArts veterans Ron Gilbert and Gary Winnick. All that LucasArts pedigree added up to an 84% score in our <a href=\"https://www.pcgamer.com/thimbleweed-park-review/\" target=\"_blank\" rel=\"noopener\">review</a>, on the strength of \"challenging puzzles, oddball characters, and an intriguing, mystery-laden plot\"—and of course the familiar visual style that immediately conjures thoughts of Monkey Island, Day of the Tentacle, and Zak McCracken.</p><p>It's taken a decade (almost a decade, anyway, and it will be more than that when it happens) but a sequel is finally happening. Gilbert revealed on his <a href=\"https://www.grumpygamer.com/twp2_announce/\" target=\"_blank\" rel=\"noopener\">Grumpy Gamer blog</a> that Thimbleweed Park 2 is now in early development, and it's set to launch in early 2028. People from the original Thimbleweed Park dev team including Mark Ferrari, Gary Winnick, David Fox, Octavi Navarro, and Robert Megone are returning to the new project, and it will be available for <a href=\"https://www.pcgamer.com/tag/microsoft-windows/\" target=\"_blank\" rel=\"noopener\">Windows</a>, Mac, and Linux, on both Steam and GOG.</p><p>Agents Ray and Reyes, the leads of the original game, are also back for the new game—and so is <em>murder. </em>Thimbleweed Park 2 as a \"spoof of a classic whodunit\" inside the Edmund Mansion, where everyone's a suspect except the butler, who for once did <em>not</em> do it.</p><p>Also, interestingly, it's not really a sequel or a prequel: \"It's more Thimbleweed Park and just as weird.\" And, again, the dead body is the least of your problems.</p><p>This is a pretty big deal, especially for fans of adventure games. <a href=\"https://www.mobygames.com/person/1363/ron-gilbert/credits/\" target=\"_blank\" rel=\"noopener\">Gilbert</a> and <a href=\"https://www.mobygames.com/person/2846/gary-winnick/credits/\" target=\"_blank\" rel=\"noopener\">Winnick</a> headed up development of a slew of LucasArts point-and-clickers in the late 1980s and early '90s that made the company one of the foremost studios of the era, and <em>more of that</em> is always welcome. Ironically, Gilbert's own enthusiasm for the genre seemed to have faded in recent years: He said in 2025 that he <a href=\"https://www.pcgamer.com/games/adventure/monkey-island-creator-ron-gilbert-isnt-interested-in-returning-to-making-2d-adventure-games-when-were-all-dead-it-probably-wont-be-the-kind-of-thing-that-survives/\" target=\"_blank\" rel=\"noopener\">wasn't really interested</a> in making more 2D adventure games, describing them as \"one of those things that when we're all dead, it probably won't be the kind of thing that survives.\"</p><p>I'm inclined to disagree: I would never challenge Gilbert's understanding of the genre he helped popularize, but Wadjet Eye has been making memorable adventures for years, most recently the outstanding <a href=\"https://www.pcgamer.com/games/adventure/old-skies-review/\" target=\"_blank\" rel=\"noopener\">Old Skies</a>, and games like <a href=\"https://www.pcgamer.com/games/adventure/this-hand-embroidered-medieval-adventure-game-looks-like-a-lovely-chill-time-but-im-warning-you-dont-be-fooled-by-its-pleasant-exterior/\" target=\"_blank\" rel=\"noopener\">Scarlet Deer Inn</a> and <a href=\"https://www.pcgamer.com/games/adventure/the-drifter-review/\" target=\"_blank\" rel=\"noopener\">The Drifter</a> have also been well received.</p>\n<p>\nImage 1 of 6\n\n</p>\n\n<p>Another notable example is the Gilbert-led Return to Monkey Island, released in 2022, which earned a whopping <a href=\"https://www.pcgamer.com/return-to-monkey-island-review/\" target=\"_blank\" rel=\"noopener\">92% review score</a>—and you better believe we don't hand out numbers like that every day. There's no way of knowing how much of that influenced Gilbert's decision to return to Thimbleweed Park, if at all, but regardless I'm glad it's happening.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>There's not much to see yet, but as he did with the original game, Gilbert is going to start a Thimbleweed Park 2 dev blog to keep everyone up to date on how it's going. It's also up for wishlisting now on <a href=\"https://store.steampowered.com/app/4932120/Thimbleweed_Park_2/\" target=\"_blank\" rel=\"noopener\">Steam</a>.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"Glen Hansard’s Street-Corner Stories","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/postscript/glen-hansards-street-corner-stories","category":"fun","categoryLabel":"Interesting Reads","wordCount":1072,"readingTime":6,"content":"<p>There’s a <a href=\"https://www.youtube.com/watch?v=dKbkW1tb8g8\" target=\"_blank\" rel=\"noopener\">YouTube video</a> I love of Glen Hansard standing on a rainy street in Dublin, wearing a black jacket and a scarf, cradling a guitar that shows signs of wear, which was something of a Hansard signature. He’s playing a cover of Van Morrison’s song “Astral Weeks,” and some people have stopped to stand in the rain with him, smiling as they stare at the man’s hands tearing up and down his instrument with incredible ferocity, the camera spinning in a circle as Hansard shouts out an extended “<em>THEEEEEEERRRRRRREEEEEEEEEEE</em>” before landing on the line “there you go.” Then, with divine timing, he looks down and says, “There my string goes,” as one of his strings surrenders to the beating it has taken and hangs down loosely from the worn-out guitar.</p><p>There are other videos of Hansard busking that live on the internet, some from his early career and some from after the runaway success of the 2007 film “Once,” the musical drama in which he starred, with the Czech singer-songwriter Markéta Irglová, his romantic partner at the time, and which won an Oscar, for their indie-folk love song “Falling Slowly.” In one clip, he’s singing in Grafton with Bono. It’s a charity event, and a production. People are glued to the street, a thick crowd with cameras out. But I’ve become attached to the clip of Hansard singing Van Morrison for its simpler manifestation of lineage—one Irish storyteller stepping into the heart and mind of another, alone on the streets of Ireland. Hansard honed his busking skills as a teen-ager in Dublin, after dropping out of school. In the Van Morrison video, people are shuffling around him, walking directly in front of or around him, some of them appear to be hustling to somewhere more urgent, some of them may be stopping for a brief glance, and then moving on. Hansard knew that a busker is not only playing a song for people in hopes that they’ll toss some coin into an open guitar case. Sure, that is a nice and beneficial outcome, especially if you are a teen-ager—one of six children, from a family enduring financial insecurities—who quit school and needs to bring a little bit of cash home. But you are also trying to sell a transportative moment. You are attempting to get people to enter, for a few minutes, into a portal that reshapes a day. The street is a story, and the city is a story, and the people within it all have their different stories, and then, at the center of all that, there is an artist who stops by and insists that he can make you and those next to you feel one single thing. The busker sells a miracle and a myth. Now, hearing a song on the street, you are remembering when you were younger or when you were maybe just a little bit more in love than you are now, or you are remembering your beloved dead or the beloved living whom you haven’t heard from in a little while.</p><p>Glen Hansard died on Wednesday, in a motorcycle accident, at the age of fifty-six. I saw him play live just earlier this year, in Philadelphia. It was my fourth or fifth time seeing him live in the course of twelve years. I often tell people that the stage can be a lonely place. It can be as lonely as you want it to be, as a performer. If you, for example, look out on an audience of hundreds and decide that you would benefit from distance, you can put up as many invisible barriers as you’d like to signal that you’re not interested in close engagement. You can avoid talking between songs or poems. You can reduce eye contact. You can not respond to shouts or cheers. The stage itself is a hierarchical tool, and the person upon it has the power to dictate its terms, for better or worse. What I loved about seeing Glen Hansard live was that he, spiritually, never stopped being the guy playing on a rainy street, trying to capture the attention of people walking by, and that takes rigor, and care, and a willingness to insist upon the stage as a communal space. Hansard would weave long stories in between songs, or sometimes stop songs in the middle to tell a brief tale before starting up again. He’d often take the stage with the same beat-up guitar from the older videos, and he’d often play it with such volume and intensity that the strings would break. Even when they broke, he’d keep playing until the song was done. He was a folk-music hero, singing songs of triumph and heroics and loss, and the heart. His voice was so loud that it could fill a large room, even without a microphone, but it could also draw you in with a whisper. This skill, too, was undoubtedly learned on the streets. And yet, as musically talented as he was, he felt to me at times like someone you’d just run into somewhere, a wise elder (despite the fact that he wasn’t <em>that</em> old) who moved through the world eager to dispense some wisdom about the heart to someone who needed it, or someone who didn’t know they needed it. In his song “Bird of Sorrow”: “Love is gonna find us again / Love is gonna find us / We gotta be ready then.”</p><p>I will miss Glen Hansard. I will miss his writing, but most of all I will miss the urgency with which he brought writing to life, whether his own or that of others. Making the rounds this week as fans mourned were videos of Hansard singing the traditional Scottish song “The Parting Glass.” I watched him perform the song live once, in a city I can’t recall. I <em>do</em> recall that it was raining outside, because Hansard, preparing to sing the song as an encore, said that he was going to take his time with it, so that we didn’t have to go back outside in the rain. I recall being incredibly moved by that moment, as he began his leisurely rendition of a song that, among other things, insists we have reached a collective ending. We are required to leave, whether we want to or not. But in the universe of the song, until its final note, we were still together. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
