*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

.container {

.meta {

  flex-wrap: wrap;

  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;

  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {

  text-decoration: none;

.archive-link a:hover {

<script>
var articles = [{"title":"Klein and Thompson's Abundance Shows Abundant Lack of Introspection","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/08/11/klein-and-thompsons-abudance-shows-abundant-lack-of-introspection/","category":"law","categoryLabel":"Law","wordCount":517,"readingTime":3,"content":"<p>Ezra Klein and Derek Thompson's <em><a href=\"https://www.simonandschuster.com/books/Abundance/Ezra-Klein/9781668023488\" target=\"_blank\" rel=\"noopener\">Abundance</a> </em>was one of the most talked about policy books of 2025. In broad strokes, the book makes the case for \"a liberalism that builds\" and thus becomes the basis for a more affordable and more sustainable--or, they would say, abundant--future.</p>  <p>Much of the book provides a useful diagnosis of how existing policies and regulations make it too difficult to build hosing, deploy clean energy, develop innovative technologies, and bring innovations to market. In this respect, it is a useful intervention in policy debates that challenges the contemporary approach to governance to which many of their ideological compatriots are committed. Yet, as I note in my <a href=\"https://www.cato.org/regulation/summer-2026/book-review-abundance\" target=\"_blank\" rel=\"noopener\">review in <em>Regulation</em></a>, the book has its blind spots.</p> <p>Klein and Thompson recognize that many policies long championed by the left have produced unsustainable and undesirable results. Yet they show little interest in understanding why things went wrong. Their analyses of how regulatory policies make it unnecessarily costly and difficult to deploy clean energy and make housing more expensive and less available are sound, but they also are not new. I <a href=\"https://www.nationalreview.com/2007/09/foul-winds-renewable-energy-jonathan-h-adler/\" target=\"_blank\" rel=\"noopener\">have been arguing</a> that current approaches to permitting are particularly problematic for clean energy development for decades. Analyses showing how zoning and rent control choke off housing supply are older still.</p> <p>The question Klein and Thompson do not try to answer is why so many smart policy wonks on the left--themselves included--denied and rejected arguments for abundance before now. In this respect, I do not think their book (or the discussions of it to which I have listened) show much introspection.</p> <p>From <a href=\"https://www.cato.org/regulation/summer-2026/book-review-abundance\" target=\"_blank\" rel=\"noopener\">my review</a>:</p> <blockquote><p>Klein and Thompson admit they are discovering problems today that they studiously ignored in the past when flagged by market-oriented analysts. The recognition that progressive legal institutions are obstacles to growth, innovation, and solving societal problems is welcome. Yet they show little curiosity as to why they and their fellow-travelers had so many \"blind spots\" for so long. Other than a brief nod to Mancur Olson, they offer no real explanation for why well-intentioned laws become obstacles to economic and social progress, nor do they show much willingness to second-guess or revisit their own assumptions about the proper role of government in facilitating economic growth, technological innovation, or material abundance. Klein and Thompson may understand what it takes to build political support for supply-side thinking on the political left, but their lack of introspection renders much of their substantive analysis hollow.</p> <p>They close the book by offering \"a new set of questions around which our politics should revolve. What is scarce that should be abundant? What is difficult to build that should be easy? What inventions do we need that we do not yet have?\" A more fundamental inquiry would be who decides? And what sorts of institutional arrangements are necessary to answer such questions? In failing to even pose such questions, <em>Abundance</em> does not offer much of an answer to the problems it seeks to solve. Klein and Thompson say they want a \"liberalism that builds,\" but they never really consider how it was that liberalism once built.</p></blockquote>"},{"title":"A long-lost Lord of the Rings action RPG makes a surprise return to Steam","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/action/a-long-lost-lord-of-the-rings-action-rpg-makes-a-surprise-return-to-steam/","category":"gaming","categoryLabel":"Gaming","wordCount":561,"readingTime":3,"content":"<p>16 years ago, we used a trailer for the then-upcoming action RPG Lord of the Rings: War in the North to <a href=\"https://www.pcgamer.com/lord-of-the-rings-war-in-the-north-trailer/\" target=\"_blank\" rel=\"noopener\">drop a sick burn</a> on people who maybe take their Tolkien a little too seriously. The game launched a year later, in 2011, to middling reviews and disappointing sales, and there it sat until the delisting process began in late 2018; <a href=\"https://steamdb.info/app/32800/\" target=\"_blank\" rel=\"noopener\">SteamDB</a> indicates it got the axe on Steam the following February. </p><p>But now it's back, which you already knew because you read the headline, in a Legacy Edition version, with enhancements including hot-swappable characters, refined enemy-target locking, an improved interface, new autosave feature, and numerous bug fixes.</p>\n\n<p>The Lord of the Rings: War in the North™ - Legacy Edition | Launch Trailer - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/G_gZuaXTDEo\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>The Lord of the Rings: War in the North - Legacy Edition follows the \"untold story\" of Agandaûr, a servant of Sauron who's raised a powerful army in the ruins of Fornost. Naturally, it falls to you to deal with it while that other Fellowship is horsing around on Mount Doom: \"Build your own Fellowship of three heroes and confront the growing threat in the North, making your mark on Middle-earth in a grand adventure with visceral, satisfying combat and rich character progression.\"</p><p>It was never entirely clear why the original Lord of the Rings: War in the North was delisted, but the reasonable assumption—as always—is that expiring licenses had something to do with it.</p><p>That could also explain the comeback: It's complicated and I can't promise it makes sense, but Aspyr, the developer of the Legacy Edition, is owned by Embracer, which also owns Middle-earth Enterprises, and through that a whole bunch of Lord of the Rings stuff. So basically, it's all Embracer, so they can do what they want.</p><p>Embracer recently announced a plan to <a href=\"https://www.pcgamer.com/gaming-industry/embracer-group-cuts-itself-into-pieces-this-is-its-last-resort-bifurcation-new-listing-licensing-out-kain-and-jc-denton/\" target=\"_blank\" rel=\"noopener\">spin off Middle-earth Enterprises</a> and a bunch of other stuff it owns into a standalone company called Fellowship Entertainment, but you probably won't see a lot of light between them: Once the spinoff is complete, just about all of Embracer's C-suite—CEO Phil Rogers, COO Lee Guinchard, and CFO Müge Bouillon—will move to take the same roles at the new company.</p><p>As you might expect, given that it's all Embracer, there's more of this to come: \"Fans can look forward to even more classic releases by Aspyr from the beloved franchise in the future!\" the studio said.</p><p>The Lord of the Rings: War in the North - Legacy Edition is live now on <a href=\"https://store.steampowered.com/app/2523770/The_Lord_of_the_Rings_War_in_the_North__Legacy_Edition/\" target=\"_blank\" rel=\"noopener\">Steam</a> and currently 10% off its regular $20 price.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"The Quest to Understand the Forgotten Psychedelic","source":"Nautilus","author":"","url":"https://nautil.us/the-quest-to-understand-the-forgotten-psychedelic-1283763/","category":"fun","categoryLabel":"Interesting Reads","wordCount":734,"readingTime":4,"content":"<p>Mescaline, derived from cacti like peyote in North America and San Pedro in South America, is the drug that <a href=\"https://www.newyorker.com/magazine/2024/01/29/tripping-on-utopia-margaret-mead-the-cold-war-and-the-troubled-birth-of-psychedelic-science-benjamin-breen-book-review\" target=\"_blank\" rel=\"noopener\">gave psychedelics their name</a>. Psychiatrist Humphry Osmond coined the term in a letter to writer Aldous Huxley in 1956, a few years after he took his first mescaline trip. In a follow-up to Huxley a few days later, he penned a now famous rhyming couplet about the drug’s vertiginous effects: “To fathom Hell or soar angelic, just take a pinch of psychedelic.”</p><p>Featured Video</p><p>Some say mescaline isn’t just the original psychedelic, but also the first to be used by humans. Known to generate vivid visuals, deep emotional connectedness, and a dream-like state, it’s played a critical part in ritual practices in Indigenous societies throughout the Americas, including the Aztec and Huichol, for millennia. Archaeological <a href=\"https://www.sciencedirect.com/science/article/pii/S2173580814001527\" target=\"_blank\" rel=\"noopener\">evidence</a> of peyote use, in particular, traces back more than 5,000 years.</p><p><strong>Read more: “<a href=\"https://nautil.us/what-is-your-brain-doing-on-psychedelics-1242605\" target=\"_blank\" rel=\"noopener\">What Is Your Brain Doing on Psychedelics?</a>”</strong></p><p>But mescaline’s celebrated place in the psychedelic pantheon hasn’t translated into the same kind of research renaissance seen by other psychedelics such as psilocybin and LSD. The drug’s effects on the brain are vastly less well understood, so much so that one research paper from 2023 called mescaline “<a href=\"https://www.sciencedirect.com/science/article/pii/S0028390822003537\" target=\"_blank\" rel=\"noopener\">the forgotten psychedelic</a>.”</p><p>One of the reasons for the lack of research on mescaline may turn out to be wrong: Scientists who study psychedelics have generally assumed mescaline would produce similar effects in the brain to LSD and psilocybin, given that they all hit the same receptor: 5-HT2A. In fact, the effects may be quite different.</p><p>A <a href=\"https://link.springer.com/article/10.1007/s12264-026-01632-3\" target=\"_blank\" rel=\"noopener\">new study</a> of rats from Northeastern University has provided some glimmerings of what may happen when mescaline works its magic on the brain. The researchers used mescaline in rats that were awake and scanned their brains with fMRI. The only previous neuroimaging study of mescaline was conducted in 1992 in a small sample of 12 humans, with much cruder technology, while prior mescaline work in animals primarily looked at behavior rather than brain imaging. </p><p>LSD and psilocybin mostly seem to fire up the cortex, which handles high-level thinking and interprets senses, and the thalamus, which sorts sensory and motor signals. But the authors of the new study found that instead, mescaline primarily hits the cerebellum. A structure at the back of the brain that coordinates movement, the cerebellum has also been <a href=\"https://pubmed.ncbi.nlm.nih.gov/12879971/\" target=\"_blank\" rel=\"noopener\">hypothesized</a> to act as a kind of gatekeeper, distinguishing sensory input that’s routine and ordinary from input that’s surprising, only allowing the novel signals through.</p><p><strong>Read more: “<a href=\"https://nautil.us/the-long-history-of-psychedelic-theft-430330\" target=\"_blank\" rel=\"noopener\">The Long History of Psychedelic Theft</a>”</strong></p><p>More specifically, the researchers found that under the influence of mescaline, the rats’ cerebellum activity dropped locally, but this butterfly-like structure also started forming more connections with other brain regions, such as the hippocampus, thalamus, somatosensory cortex, and the midbrain. The team of scientists decided this may mean the mescaline breaks down the filtering function of the cerebellum so that it stops screening sensory input and begins broadcasting raw unfiltered signals to the rest of the brain, driving some of the perceptual strangeness and intensity of the mescaline experience.</p><p>A few caveats: The scientists only tracked a single dose in rats, and they didn’t follow heart rate or breathing during the scans, so some of the activity patterns they saw in the rats’ brains could be related to physiological changes rather than drug effects.  Animal-to-human translation is also, of course, uncertain, especially since the human experience of mescaline is heavy on the visuals, something that barely registered on the scans in rats.</p><p>Either way, don’t expect a sudden surge in mescaline studies. The other reasons that research is stalled on this particular drug may not change any time soon. The grueling 8-to-12-hour duration of the mescaline trip, and its tendency to produce physical nausea and vomiting, mean that research requires more intensive medical supervision than other psychedelics. And strict legal protections govern the slow-growing cacti that contain the drug, which are threatened by over-harvesting, and are central to ritual practice in the Native American Church.</p><p>Perhaps it’s fitting that the drug that gave elusive, mind-bending psychedelics their name is the one we understand the least. That said, scientists may finally be getting a peek through doors of perception that mescaline throws ajar. </p><p><em>Enjoying </em><a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free </em><a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead image: Frank Vincentz / Wikimedia Commons and rei310 / Adobe Stock</em></p>"},{"title":"Flock says its new tool will help identify police abuse, but hasn’t explained how it works","source":"TechCrunch","author":"Lorenzo Franceschi-Bicchierai","url":"https://techcrunch.com/2026/08/13/flock-says-its-new-tool-will-help-identify-police-abuse-but-hasnt-explained-how-it-works/","category":"tech","categoryLabel":"Technology","wordCount":955,"readingTime":5,"content":"<p>Surveillance technology startup Flock <a href=\"https://www.flocksafety.com/blog/flock-guardrails-address-lpr-privacy-concerns-and-police-transparency\" target=\"_blank\" rel=\"noopener\">announced</a> a series of new policies and tools on Thursday, claiming they will help curb abuse of its automated license plate camera reader systems and help keep its law enforcement customers accountable.</p>\n<p>Flock is now recommending police departments retain data for seven days rather than the previous 30 days. Along with this change, the company introduced what it calls “Evidence Mode,” which can be turned on when customers need to retain data for longer periods in “exceptional cases” and requires a specific case number. Customers will also now be able to set limits on the data they share with other customers based on the type of offense that’s under investigation. </p>\n<p>The company also highlighted a tool called “Audit Assistance” as one of the key changes. Flock <a href=\"https://www.globenewswire.com/news-release/2026/04/14/3273480/0/en/flock-safety-introduces-audit-assistance-its-latest-trust-compliance-tool-to-set-a-new-standard-for-accountable-public-safety-technology.html\" target=\"_blank\" rel=\"noopener\">launched the tool</a> in April. Since then, Flock said “more than one-third” of its customers have turned it on, and the startup is now requiring all customers to enable it by the end of the year.</p>\n<p>Flock said Audit Assistance “detects abnormal activity and flags it for Administrator review,” according to the blog post released Thursday. If that happens, the tool can automatically lock out users who have been flagged until an administrator intervenes. According to Flock, the tool has already helped customers spot and stop abuse.</p>\n<p>Several executives have touted the capabilities of Audit Assistance. But despite its stated importance, <a href=\"https://techcrunch.com/tag/flock/\" target=\"_blank\" rel=\"noopener\">Flock</a> has not explained in detail how Audit Assistance actually works.</p>\n<p>Some official comments provide some understanding of what Audit Assistance can do; it gets vague when trying to determine how it does it.</p>\n<p>For instance, Flock’s head of trust and compliance Ashley Haber <a href=\"https://youtu.be/zqnppkqKHSI?si=0NhdCxzB2tpjnKmg&amp;t=60\" target=\"_blank\" rel=\"noopener\">said in a video</a> that the Audit Assistance can flag “what may look like an odd search history from a specific user,” helping customers understand how their users are operating the system. <a href=\"https://youtu.be/o4Xw8ydy3po?si=6BLByoTnraEJYUNs&amp;t=65\" target=\"_blank\" rel=\"noopener\">In another video</a>, Flock co-founder Paige Todd said “Audit Assistance actually flags unusual patterns early. Think a user searching the same plate repetitively for more than 30 days.”</p>\n<p>And Major Patrick Krieg of the Dunwoody, Georgia Police Department, a Flock customer, <a href=\"https://www.globenewswire.com/news-release/2026/04/14/3273480/0/en/flock-safety-introduces-audit-assistance-its-latest-trust-compliance-tool-to-set-a-new-standard-for-accountable-public-safety-technology.html#:~:text=%E2%80%9CFlock%20is%20the%20only%20system%20we%20have%20that%20has%20ever%20built%20an%20algorithm%20that%20has%20notified%20us%20of%20any%20type%20of%20bias.%20We%20would%20love%20all%20our%20vendors%20to%20do%20that%2C%E2%80%9D%20said%20Major%20Patrick%20Krieg%20of%20the%20Dunwoody%2C%20Georgia%20Police%20Department\" target=\"_blank\" rel=\"noopener\">described the feature</a> in a press release as “an algorithm that has notified us of any type of bias.”</p>\n<p>Flock <a href=\"https://www.flocksafety.com/trust/compliance-tools\" target=\"_blank\" rel=\"noopener\">describes</a> Audit Assistance as a feature that can “surface atypical activity early and review it quickly with a clear, documented workflow.”</p>\n<p>What’s unclear — and TechCrunch has asked for answers about — is how this “algorithm” actually works, what data is it trained on, and if it was developed using a large language model. TechCrunch also asked what kind of patterns is it designed to surface and what exactly gets flagged as “abnormal activity”? </p>\n<p>According to Flock, Audit Assistance is not based on [Machine Learning] or AI. The company told TechCrunch that “It is a data tool that flags atypical search patterns for further review. One example that would trigger a flag is if a user searches for the same plate using multiple different case codes, as this could potentially indicate abuse. A flag does not mean that it is definitely abuse — it only means it warrants further investigation.” </p>\n<p>Numerous questions remain unanswered, however, including whether Flock has any statistics or data that shows how effective the tool is, what its false positive and false negative rates are, and if it has been audited by a third party?</p>\n<p>Privacy experts and Flock critics are not impressed by Audit Assistance. </p>\n<p>The American Civil Liberties Union senior policy counsel Chad Marlow <a href=\"https://www.aclu.org/news/privacy-technology/despite-new-updates-flocks-creepy-cameras-remain-major-civil-liberties-threat\" target=\"_blank\" rel=\"noopener\">wrote</a> in response to Flock’s announcement that “there is no evidence that the tool works consistently” to address abuse. </p>\n<p>“While dozens of officers have recently been arrested, fired, or otherwise disciplined for misusing Flock for personal reasons, Flock claims these arrests are proof its auditing tool works,” Marlow wrote. “However, unless we know the number of officers misusing the system, we cannot conclude if Flock and its auditing tools are catching 95% of violators or 5%. Flock needs to have its auditing tool analyzed by an independent evaluator to determine its actual effectiveness. Until then, we don’t know if the tool is a real security measure or just window dressing.”</p>\n<p>Cooper Quintin, a security researcher and senior public interest technologist at the Electronic Frontier Foundation, told TechCrunch that it may not even matter whether Audit Assistance works. </p>\n<p>“If it does work, law enforcement will figure out ways to get around it,” he said, adding that what matters in the end is whether abusers are caught and held accountable. “If there are no consequences for abuse and whoever [the tool] reports to is the same police agency that is doing the abuse, it’s just a fig leaf for Flock. The best way to ensure accountability is to pass laws constraining the use of this technology and requiring a warrant for its use.”</p>\n<p>Rachel Levinson-Waldman, the director of the Brennan Center’s Liberty and National Security Program, told TechCrunch that making Audit Assistance mandatory is a step in the right direction, and that “in theory” the tool is “a great idea.” But she also said the tool itself “needs to be audited” because there’s not enough information about how it works in practice.</p>\n<p>Flock’s announcements come after years of reported incidents of its customers <a href=\"https://www.404media.co/cops-keep-getting-arrested-for-using-flock-to-stalk-people/\" target=\"_blank\" rel=\"noopener\">repeatedly</a> abusing its technology. Earlier this week, three former Georgia sheriff’s deputies <a href=\"https://www.13wmaz.com/article/news/local/macon/3-macon-deputies-arrested-bso-probes-flock-camera-violations/93-3710cdf2-cbe6-42b4-9a02-13eb8f251829\" target=\"_blank\" rel=\"noopener\">were arrested and accused</a> of using Flock cameras to stalk people with whom they had a “personal relationship at the time,” as the Bibb County Sheriff’s Office said in a press release. In this case, Bibb County Sheriff David Davis specifically called out Flock’s new tool Audit Assistance for uncovering the misuse. </p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
