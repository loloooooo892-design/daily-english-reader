<script>
var articles = [{"title":"Why I Free-Solo El Capitan","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/28/why-i-free-solo-el-capitan","category":"fun","categoryLabel":"Interesting Reads","wordCount":792,"readingTime":4,"content":"<p>I’m going live right now because I’m, well, about sixteen hundred feet up the side of El Capitan. I currently have no ropes or harnesses on me. Just a chalk bag on my waist belt and a mike pinned to my shirt.</p><p>This is my third time doing a free-solo pass at El Capitan. And some of you asked if I’d record my thoughts as I hang by my fingertips over my impending death. I thought, Why not?</p><p>And there they go . . . So I just lost my sunglasses. Wait for it . . . I always love that. Anything you lose up here takes ten to twelve seconds to hit the ground. Anyway, I’m rambling on this live stream so I can give people some explanation for why we do this. Maybe even inspire someone to live a better life.</p><p>But first, in order to get my next foothold, I’m going to have to rely solely on fingerholds as I swing my foot over to a crevice. I’ve got a half-crimp hold with my left hand, and a mono with my right index finger. Aaand I got my toe in the crevice. O.K. Let’s find the next one.</p><p>That was perfect, actually. Just now, every part of my body and brain was focussed on the task at hand. Otherwise, I’m dead. So it’s very relaxing.</p><p>You have living, and you have dying. And zero time on life’s drama, spam calls, bills . . . Thankfully, debt collectors don’t tend to climb El Capitan, last I checked. And if they start to, all of us rock-jocks are in trouble! One second, I don’t like this sloper. I’m gonna need to get a better grip. Gonna push off my right leg and see if I can find a pocket up above me. Got one. Feels solid enough . . .</p><p>It’s the forced unplug for me. Like all of you, my inbox is filled with stressful e-mails, but those will have to wait. Like, “You took all our money blah blah your climbing school is a Ponzi scheme blah blah why did we have to get more students in order to pay the same thing we paid last year?”</p><p>O.K., this is a part of the wall I’ve never done. And I think that’s very sick. Or, as some of my friends would call it, very dumb. Especially because some of the rocks are flaking off. Like that one. Damn it.</p><p>So all I’m focussed on is: How do I navigate a new path around this chossy area? Goes without saying that right now I’m not worried about some Karens complaining, “Oh, you never taught our kids anything. You were smoking outside while they climbed up a little fifteen-foot-wall thing.” Or, “My son fell off your plastic wall and fractured his tailbone. I’ve informed the police.” Well, which is it? Is my climbing wall too small, or are kids fracturing tailbones when they fall from its great heights? Can’t be both.</p><p>And I hate to be that guy, but there’s also no girlfriend when you’re on El Cap. Trust me, I love Maya, but I think we both benefit from little breaks. Frankly, anyone would be open to taking a break from someone who lately just screams, “I hate youuuu . . . I’ve got evidence of what you did! I’ve got video evidence.”</p><p>O.K., I’m navigating out of the looser rocks and over to the Dawn Wall, which I’ve done before. It’s steeper, but there’s better footing.</p><p>Again, present moment taking priority over outside noise. Like the girl I cheated on Maya with <em>one time</em>, mind you, texting me, “I deserve half of that climbing-school money because you used all my pillow-talk ideas. Don’t make me destroy you online.” I’m, like, Destroy me how? Ya too late.</p><p>And, in some ways, the most stressful text of my morning: “Bro, you know why I’m reaching out. You cheated on my little sister and I don’t need to remind you I’m a Triple O.G. in my set of the Crips. I’ll see you later today when you do your little rock-climb thing.” Top ten suckiest text I’ve ever gotten probably.</p><p>So, yeah, in some ways I’d rather be dangling by three fingers than dealing with life’s day-to-day headaches.</p><p>Thankfully, Crips don’t tend to climb El Capitan, last I checked. They tend to park at the top and play loud music. Next to the police, apparently. Funny to see those two getting along. Do I get a Nobel Prize for that? Kidding. I’m thinking more about toeholds than whether I’m going to get a Nobel. That’s why I free-solo El Capitan. To not worry about whether I’ll win a Nobel Prize. ♦</p>"},{"title":"The Blood of Dawnwalker cost less than expected to make but former NetEase investor defends its status as a top-tier production","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/blood-of-dawnwalker-budget-revealed","category":"gaming","categoryLabel":"Gaming","wordCount":585,"readingTime":3,"content":"<p>UPDATE: \"In Poland, that budget is AAA.\"</p>\n    \n  \n  \n  \n  \n            <p><strong>UPDATE 22ND SEPTEMBER: </strong>Former NetEase studio investor and Rebel Wolves board director Simon Zhu has revealed the \"entire budget\" of The Blood of Dawnwalker as $45m, and said that: \"In Poland, that budget is AAA.\"</p>\n<p><a href=\"https://www.linkedin.com/feed/update/urn:li:activity:7507812308467916800/\" target=\"_blank\" rel=\"noopener\">In a post on LinkedIn</a>, Zhu said: \"In 2022, we funded the project in full at the outset - $45 million, the entire budget - so Konrad would never have to worry about money and could focus on getting the game finished and out. (The Fed was already signaling rate hikes. The party was about to end.) In Poland, that budget is AAA.\"</p>\n<p>Zhu's post went on to praise the game's success and highlight a few key reasons for it, such as games being \"made by people\", the importance of clear leadership, and having people there to \"strip away the distractions and solve the problems inside and outside game development\" - people like Zhu, it sounds like.</p>\n<p>What does Zhu know? Well, in their role as studio partner for NetEase they've worked on the boards of many game companies, including Quantic Dream, <a href=\"https://www.eurogamer.net/companies/thatgamecompany\" target=\"_blank\" rel=\"noopener\">Thatgamecompany</a>, Behaviour Interactive, Devolver, Kepler and more. But as of a year ago they've started their own thing: a funding group and game partner called <a href=\"https://www.greaterthan.group/\" target=\"_blank\" rel=\"noopener\">GreaterThanGroup</a>, which is - most notably - the partner for <a href=\"https://www.eurogamer.net/games/star-wars-fate-of-the-old-republic\" target=\"_blank\" rel=\"noopener\">Casey Hudson's hotly anticipated new Star Wars RPG Fate of the Old Republic</a>.</p>\n<p><a href=\"https://www.youtube.com/watch?v=1O6ACnSA0DE\" target=\"_blank\" rel=\"noopener\">Watch on YouTube</a></p><p><strong>ORIGINAL STORY 21ST SEPTEMBER:</strong> Polish developer Rebel Wolves has revealed the budget for dark fantasy vampire role-playing game The Blood of Dawnwalker, and it's lower than expected, aligning it more closely with a double-A production than a triple-A blockbuster.</p>\n<p>In an <a href=\"https://www.bloomberg.com/news/newsletters/2026-09-18/the-40-million-journey-behind-the-blood-of-dawnwalker\" target=\"_blank\" rel=\"noopener\">interview with Bloomberg</a>, studio co-founder and game director Konrad Tomaszkiewicz revealed Dawnwalker's budget as $40 million, which is a far cry from even <a href=\"https://www.reddit.com/r/GamingLeaksAndRumours/comments/1tsloon/danish_public_broadcaster_007_first_light_cost/\" target=\"_blank\" rel=\"noopener\">the budget of a fairly linear blockbuster like 007 First Light</a>, which reportedly cost $200m to make (though there were hefty licensing fees and high profile actors' wages to pay in that case).</p><p>A more pertinent comparison, perhaps, is to CD Projekt Red's <a href=\"https://www.eurogamer.net/games/the-witcher-3-wild-hunt\" target=\"_blank\" rel=\"noopener\">The Witcher 3</a>, which Tomaszkiewicz directed and which Dawnwalker is so alike. <a href=\"https://www.gamedeveloper.com/business/video-cd-projekt-s-budget-breakdown-of-i-the-witcher-3-i-\" target=\"_blank\" rel=\"noopener\">That game cost $80m to make</a>, though a large chunk of that figure reportedly went on marketing. Still, Tomaszkiewicz has often talked about the two games' productions being broadly equivalent in scope, which they don't quite appear to be; and  if you factor in that The Witcher 3 cost $80m more than a decade ago, the gap widens further still.</p>\n<p>Despite a lower budget, Rebel Wolves - a studio 29 percent owned by Chinese behemoth <a href=\"https://www.eurogamer.net/companies/tencent\" target=\"_blank\" rel=\"noopener\">Tencent</a> - does show triple-A ambition in Dawnwalker, and occasionally realises it, though there is a pervading sense the visuals aren't quite cutting edge and the world is sometimes stretched thin, becoming repetitive.</p>\n<p>But what Dawnwalker lacks in that regard it makes up for in originality, with a bold take on RPG structure that does away with a main quest and leaves your adventure up to you, while limiting the time you have available for it. Dawnwalker is exactly <a href=\"https://www.eurogamer.net/former-playstation-boss-shawn-layden-bringing-double-a-back\" target=\"_blank\" rel=\"noopener\">the kind of risk-taking game former PlayStation boss Shawn Layden said our industry is in desperate need of</a>, when he talked about bringing double-A games back.</p>\n<p><a href=\"https://www.eurogamer.net/the-blood-of-dawnwalker-review-rebel-wolves\" target=\"_blank\" rel=\"noopener\">I gave The Blood of Dawnwalker four stars in our review</a>. \"CD Projekt Red alumni create a familiar dark fantasy adventure,\" I wrote, \"but one with bold and provocative ideas of its own, that's mostly, enormously successful.\"</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"New Article: Landor v. Louisiana Department of Corrections: Bringing Clarity To The Necessary and Proper Clause","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/09/18/new-article-landor-v-louisiana-department-of-corrections-bringing-clarity-to-the-necessary-and-proper-clause/","category":"law","categoryLabel":"Law","wordCount":678,"readingTime":4,"content":"<p>Randy Barnett and I co-authored a new article forthcoming in the Harvard Journal of Law &amp; Public Policy: <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7483818\" target=\"_blank\" rel=\"noopener\"><em>Landor v. Louisiana Department of Corrections</em>: Bringing Clarity To The Necessary and Proper Clause</a>. Here is the abstract:</p>\n<blockquote>\n\n<p>It is often said that bad facts make bad law. Landor v. Louisiana Department of Corrections is an exception to this rule. Prison guards in Louisiana cut the hair of a Rastafarian prisoner in violation of his religious beliefs. In a 6-3 decision, the Supreme Court ruled that Landor could not sue the guards in federal court for monetary damages. Justice Neil Gorsuch's majority opinion got the Constitution right in two important respects. First, Landor affirmed a judicially enforceable limit to Congress's Spending power. Second, Landor affirmed judicially enforceable limits to the Necessary and Proper Clause. This decision, which may be the \"sleeper\" case of the term, should come to be viewed as a landmark separation of powers decision on par with Lopez, Morrison, Printz, and NFIB.</p>\n<p>Part I of this essay describes Landor's claim under the spending power. The Court held that Spending Clause conditions bind only those who consent to them. Part II turns to Landor's fallback argument based on the Necessary and Proper Clause. Here, the Court distinguished between executing an enumerated power and serving the goals of a statute enacted under it. Parts III and IV trace that distinction through the leading Commerce Clause cases: Lopez and Morrison, which confined the Substantial Effects doctrine to economic activity, and Raich, in which Justice Scalia's concurrence tied that doctrine and its exceptions to the Necessary and Proper Clause. Part V shows how Landor adopts Justice Scalia's framing of the inquiry and holds the proposed remedy \"improper\" as well. Part VI explains where the Landor dissent goes astray. We conclude with Landor's place in the decades-long effort to restore the Constitution's limits on federal power.</p>\n\n</blockquote>\n<p>This case largely flew under the radar last term, but it may prove to be nearly as important as <em>Slaughter</em>.</p>\n<p>Here is our conclusion:</p>\n<blockquote><p>In <em>Landor</em>, the Court insists that the Spending Clause, like the Commerce Clause, has its own limits. But the Court in <em>Landor</em> does more: it insists that the Necessary and Proper Clause has limits too.</p>\n<p>The decision also leaves work for future courts. Justice Jackson's dissent catalogued spending statutes that impose penalties on individuals who never themselves accepted federal funds: the Federal Nursing Home Reform Act authorizes civil penalties against nursing-home employees who falsify resident assessments; the Emergency Medical Treatment and Active Labor Act authorizes penalties against physicians in federally funded hospitals; and Title X of the Public Health Service Act imposes criminal penalties on state employees who coerce abortion or sterilization by threatening the loss of federally funded benefits.</p>\n<p>The majority let this catalog pass without comment. After <em>Landor</em>, each of these provisions is exposed to the same objection that defeated Landor's claim. The government will have to defend the statute as protecting the federal funds themselves, as in <em>Sabri</em>, or grounded in some other enumerated power. Or perhaps some of these parties can be said to have actually consented to be bound by the regulations.</p>\n<p><em>Landor</em> may not receive the same attention as the other term-ending blockbuster decisions. But in our view, this sleeper opinion may prove to be a landmark case, on par with <em>Lopez and</em> <em>Morrison</em>, <em>Printz</em> and <em>NFIB. </em>Each of these cases is part of a decades-long process of restoring the original meaning of the Constitution. <em>Raich</em> has widely been considered to have set back the so-called Rehnquist Court's federalism revolution. We agree. Moreover, Chief Justice Roberts's use of a \"saving construction\" in <em>NFIB</em> to uphold the Affordable Care Act further set back the attempt to hold Congress to its enumerated powers. But Roberts's Necessary and Proper Clause reasoning in <em>NFIB—</em>which he offered to justify the need for a \"saving construction\" of the statute as a tax—kept the flame of that revolution alive. With <em>Landor,</em> that flame now glows brighter. The federalism revolution still lives.</p></blockquote>\n<p>We welcome any comments!</p>"},{"title":"Introducing GPT-6 Sol and Luna","source":"Hacker News Best","author":"","url":"https://openai.com/index/introducing-gpt-6-sol-and-luna/","category":"tech","categoryLabel":"Technology","wordCount":1311,"readingTime":7,"content":"<p>Earlier this month, we introduced <a href=\"https://openai.com/index/gpt-6-astra/\" target=\"_blank\" rel=\"noopener\">GPT‑6 Astra</a>, the most intelligent and aligned model in the world. While the most demanding and important projects still call for Astra’s full depth, work happens at different scales, rhythms, and budgets.</p><p>That’s why we’re expanding the GPT‑6 universe with GPT‑6 Sol and GPT‑6 Luna. GPT‑6 Astra introduced a new generation of intelligence—these models help distribute the benefits of that intelligence by advancing the frontier on cost efficiency. We trained GPT‑6 Sol and Luna with similar methods as GPT‑6 Astra, bringing the advances behind Astra’s state-of-the-art performance in professional work, factuality, coding, computer use, and alignment to faster, more affordable models.</p><p>The GPT‑6 models lead across the cost–intelligence curve, combining exceptional capabilities at every tier with infrastructure that delivers them efficiently at scale. Improvements in caching and inference let us serve these models at lower cost, and we’re passing those savings directly on to users and customers by reducing API prices for Sol and Luna by 50% compared with their GPT‑5.6 promotional pricing. Together, these improvements make advanced AI practical for more everyday tasks and applications at scale.</p><h3>GPT‑6 API pricing</h3><p>Model</p><p>Input</p><p>Output</p><p>Price reduction</p><p>GPT‑5.6 Sol → GPT‑6 Sol</p><p>$4 → $2</p><p>$20 → $10</p><p>50% cheaper</p><p>GPT‑5.6 Luna → GPT‑6 Luna</p><p>$0.20 → $0.10</p><p>$1.20 → $0.50</p><p>50% cheaper</p><p>Prices are per 1 million tokens.</p><p>GPT‑6 Astra continues to be our best model across the board. Choose it when you want the best results and an uncompromising experience.</p><h2>A step up across the model family</h2><p>GPT‑6 Sol and Luna bring intelligence upgrades and cost efficiency to the models you already know and use across capabilities most useful for getting complex work done.</p><h3>Professional work</h3><p>GPT‑6 Sol can take on difficult work tasks while giving you more room to iterate with higher usage limits and lower cost, offering more intelligence and better results versus similarly priced competitor models.</p><p>On AutomationBench, a test of business workflows across apps, GPT‑6 Sol at xhigh effort outperforms Claude Opus 5 at max effort at just 9% of Opus 5’s cost per task. At high effort, GPT‑6 Luna improves on its predecessor by 5.4 percentage points at 58% lower cost per task.</p><p>GPT‑6 Sol also exceeds Claude Fable 5.1 at far lower cost, and even bests low-effort GPT‑6 Astra.</p><p>Model (and effort)</p><p>Score</p><p>Cost per task</p><p>GPT‑6 Sol (xhigh)</p><p>33.2%</p><p>$0.27</p><p>GPT‑6 Astra (low)</p><p>30.3%</p><p>3.9x GPT‑6 Sol</p><p>Claude Opus 5 (max)</p><p>26.9%</p><p>11.1x GPT‑6 Sol</p><p>Claude Fable 5.1 w/ Opus 5 Fallback (max)</p><p>31.4%</p><p>&gt;8.9x GPT‑6 Sol</p><p>(fallback cost not reported)</p><p>On Agents’ Last Exam, which evaluates agents on complex professional workflows, GPT‑6 Sol at max effort scores 56.4%, above Claude Opus 5’s highest score in the evaluation at 60% lower cost per task.</p><h3>Factuality</h3><p>The usefulness of an answer depends on getting the facts right, and we’re continuing to make progress on factual reliability. On our internal factuality evaluation, which is based on de-identified real-world conversations where users flagged mistakes by our models, GPT‑6 Sol makes about half as many mistakes as its predecessor, approaching Astra-level reliability at much lower cost. GPT‑6 Luna also improves substantially; at higher effort levels it matches GPT‑5.6 Sol at about a hundredth its cost.</p><h3>Coding</h3><p>This year, coding agents have begun tackling tasks with more complexity, scope, and duration than ever before. At OpenAI, our internal usage has grown exponentially. Valued at API prices, daily token usage has exceeded $600 for the median researcher and $7,000 for researchers at the 90th percentile (<a href=\"https://openai.com/index/research-acceleration-view-inside-openai/\" target=\"_blank\" rel=\"noopener\">Research acceleration: The view inside OpenAI⁠</a>). As coding agents take on longer and more demanding tasks, the cost of sustained use matters more. GPT‑6 Sol and Luna combine strong coding performance with lower API prices, giving developers more room to iterate and teams the confidence to be more ambitious about what they ask Codex to take on.</p><p>On FrontierCode, which evaluates whether coding agents produce changes ready to merge into real codebases, GPT‑6 Sol improves substantially over GPT‑5.6 Sol, and is able to match Claude Fable 5.1 xhigh at much lower cost.</p><p>On DeepSWE v1.1, which tests performance on complex software-engineering tasks in real codebases, GPT‑6 Sol at max effort scores 68.8%, within 1.1 percentage points of Claude Fable 5’s highest score in the evaluation—69.9% at xhigh effort—at approximately 80% lower cost per task.</p><p>GPT‑6 Luna at max effort scores 66.6%, comparable to Claude Opus 5 and Fable 5 at medium effort. In these comparisons, Luna costs 93% less per task than Opus 5 and 96% less than Fable 5.</p><h3>Computer use</h3><p>While GPT‑6 Astra remains the world’s best model for computer use, GPT‑6 Sol and Luna offer more cost-efficient performance than their predecessors. On OSWorld 2.0 offline, GPT‑6 Sol at xhigh effort achieves a similar score to Claude Opus 5 at medium effort—60.5% versus 60.3%—at approximately 80% lower cost per task. GPT‑6 Luna (max) is able to exceed GPT‑5.6 Sol (medium) at one tenth of its cost.</p><h3>Collaboration style</h3><p>We’ve also brought GPT‑6 Astra’s improved communication style to Sol and Luna, which we think will be especially noticeable in technical and coding conversations. Expect to see more clarity, less jargon, fewer odd turns of phrase, fewer low-value details, and slightly shorter answers overall without losing substance.</p><h2>Improving caching for agents and long conversations</h2><p>Alongside lower token prices, we’re helping developers building on GPT‑6 save more on the context their applications reuse. We’ve improved prompt caching for GPT‑6 to deliver higher cache hit rates by default, helping agents reuse more context, respond faster, and benefit from discounts of 90% on cached input-token reads.</p><p>Developers also have more ways to measure and optimize their caching performance:</p><ul><li><p>Monitor and diagnose. The <a href=\"https://platform.openai.com/usage?usage_section=prompt-caching\" target=\"_blank\" rel=\"noopener\">Prompt Caching Dashboard⁠(opens in a new window)</a> shows how much input is cached and how that changes over time. The <a href=\"https://developers.openai.com/api/docs/guides/prompt-caching/diagnostics\" target=\"_blank\" rel=\"noopener\">diagnostics tool⁠(opens in a new window)</a> helps explain missed opportunities for caching and what to fix.</p></li><li><p>Adjust reasoning effort and tool availability without breaking cache. Increase <a href=\"https://developers.openai.com/api/docs/guides/reasoning#change-reasoning-mid-conversation\" target=\"_blank\" rel=\"noopener\">reasoning effort⁠(opens in a new window)</a> for harder tasks or lower it for simpler follow-ups, and <a href=\"https://developers.openai.com/api/docs/guides/prompt-caching#how-to-optimize-prompt-caching\" target=\"_blank\" rel=\"noopener\">enable or disable tools⁠(opens in a new window)</a> as your agent’s needs change. Both controls now preserve earlier context for cache reuse.</p></li><li><p>Optimize which prefixes get cached. Explicit breakpoints let developers choose where cached prompt prefixes end. This gives developers more control over cache reuse and can improve performance.</p></li></ul><p>GitHub reports that, over the past several months, these improvements have reduced the share of prompt tokens requiring fresh processing by more than 50% across billions of requests to OpenAI models, helping Copilot respond faster.</p><h2>Continuing to improve alignment</h2><p>GPT‑6 Sol and Luna build on the alignment work introduced with Astra, our most aligned model to date. In our alignment evaluations, both Sol and Luna show improvements over their GPT‑5.6 counterparts, including lower rates of misleading claims about their coding work.</p><p>The evaluations below deliberately test challenging situations and do not measure failure rates in typical use. See the <a href=\"https://deploymentsafety.openai.com/gpt-6-astra\" target=\"_blank\" rel=\"noopener\">system card⁠(opens in a new window)</a> for the full results.</p><h2>Availability</h2><p>GPT‑6 Sol and GPT‑6 Luna are available in ChatGPT Work and Codex starting today for all Plus, Pro, Business, Enterprise, and Edu users. Free and Go users can access GPT‑6 Luna in the desktop app. These models are not yet available in Chat. In the OpenAI API, they are available as gpt-6-sol and gpt-6-luna.</p><p>To keep service stable for everyone, we plan to roll out these models in ChatGPT gradually throughout the day. If you don’t see the new models in ChatGPT Work or Codex, please try again later.</p><p>Evaluations of GPT were performed in our research environment or via our API, which may provide slightly different output from production ChatGPT due to differences in the system prompts, tools available, etc. Evaluations of competitor models were taken from publicly available reports. Scores for Claude Fable 5 were reported when scores for Claude Fable 5.1 were unavailable.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
