body {

<script>
var articles = [{"title":"$9.25M Verdict Against N.Y. Times, in Libel Case Brought by Alabama Basketball Player","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/21/9-25m-verdict-against-n-y-times-in-libel-case-brought-by-alabama-basketball-player/","category":"law","categoryLabel":"Law","wordCount":664,"readingTime":4,"content":"<p>The N.Y. Times (Katie Robertson) <a href=\"https://www.nytimes.com/2026/08/20/business/media/new-york-times-defamation-lawsuit-alabama.html\" target=\"_blank\" rel=\"noopener\">so reports</a>, and adds that \"The Times had not lost a defamation lawsuit brought in the United States over one of its articles in more than 50 years.\"</p>\n<p>Here's an excerpt of the decision from Judge Annemarie Carney Axon (N.D. Ala.) in May (<a href=\"https://storage.courtlistener.com/recap/gov.uscourts.alnd.185748/gov.uscourts.alnd.185748.172.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Spears v. N.Y. Times Co.</em></a>) that allowed the case to go forward:</p>\n<blockquote><p>Plaintiff Kai Spears was a walk-on basketball player for The University of Alabama men's basketball team and developed close friendships with other teammates, including Brandon Miller. In the early hours of the morning on January 15, 2023, Mr. Spears and Mr. Miller visited Moe's Original BBQ in Tuscaloosa, Alabama.</p>\n<p>Unbeknownst to Mr. Spears, another teammate—Darius Miles—asked Mr. Miller to bring Mr. Miles a gun that he had left in Mr. Miller's car. So Mr. Miller headed to Mr. Miles, and Mr. Spears started back to his dorm. A few minutes later, gunfire erupted on the Strip, and Michael Davis, Mr. Miles's childhood friend, shot and killed Jamea Harris using the gun that Mr. Miller had brought to Mr. Miles.</p>\n<p>{Two months later, the Times published an article, titled \"A Fourth Alabama Player Was at a Deadly Shooting, in a Car Hit by Bullets.\" The opening line said that the \"fatal January shooting that involved players from the University of Alabama basketball team could have been even more deadly, as surveillance video showed that two players were in a car struck by bullets in the crossfire.\"</p>\n<p>It added that Mr. Spears was in the car with Mr. Miller at the time of the shooting and that Mr. Miles had asked Mr. Miller to bring Mr. Miles's gun to the scene. The story said that the University had tried to \"distance itself from the shooting\" and keep \"quiet\" other players' involvement. The article then discussed widespread criticism that Mr. Miller and the University received when Mr. Miller continued to play after the shooting.}</p>\n<p>The statements about Mr. Spears were false, and this lawsuit followed….</p></blockquote>\n<p>The court concluded that Spears has the burden of showing \"that the allegedly defamatory statements were false in all material respects,\" but it concluded that he had introduced enough evidence of that to go to the jury:</p>\n<blockquote><p>At the motion to dismiss stage, the Times argued the article's statements were not defamatory because the article portrayed Mr. Spears as a potential victim. In addressing the Times's argument about the statements that Mr. Spears was \"in a car struck by bullets\" and that the shooting \"could have been even more deadly,\" Judge Coogler noted that \"[r]ead alone, these statements do not appear reasonably capable of conveying a defamatory meaning.\" But Judge Coogler added that—when considering whether a news article had a defamatory meaning—Alabama law requires the article to be read as a whole. Judge Coogler explained that the entire article could allow an ordinary reader to conclude \"[Mr.] Spears was somehow complicit in the shooting.\" ….</p>\n<p>Mr. Spears has produced sufficient evidence to meet his burden because a reasonable jury could conclude that Mr. Spears was not \"involved\" in the shooting. Although Mr. Spears was with Mr. Miller for the hours leading up to the shooting, Mr. Spears had no knowledge that Mr. Miller was communicating with Mr. Miles or that Mr. Miles had asked Mr. Miller to bring him his gun.</p>\n<p>On top of this, Mr. Spears did not know where Mr. Miller planned to go or what he planned to do when he left Moe's. Nor did he know that Mr. Miles's gun was in Mr. Miller's car. And of course, Mr. Spears did not get in Mr. Miller's car and was not at the scene of the shooting when it occurred. At the time of the shooting, Mr. Spears and his friends were on their way back to his dorm. Mr. Spears knew about the shooting only after it happened….</p></blockquote>\n<p>Mary Virginia Buck, R. Matt Glover (Prince, Glover &amp; Hayes P.C.), and Stephen P. New represent plaintiff.</p>"},{"title":"Top Squarespace Promo Codes: 20% Off in August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/squarespace-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":1391,"readingTime":7,"content":"<p>Squarespace helps small businesses and regular Joe Schmoes to get software help to build their own websites (for both personal and business), even including the commerce side of things with point of sale, inventory, and customer data features (both online or in person). In the age where literally everything is digitized and accessed through the World Wide Web, having an online presence is the most important thing you can do for your business or brand’s growth. <a href=\"https://www.wired.com/story/best-website-builders/\" target=\"_blank\" rel=\"noopener\">Creating a website</a> can be difficult, with the HTMLs and coding and what not—that’s where Squarespace comes in. And we’ve found some of the best Squarespace promo codes and coupons to help you save 10% on new websites, 20% on yearly plans, and up to 50%, while growing your business.</p><h2>Get 10% Off With This WIRED Exclusive Squarespace Promo Code</h2><p>One of the best things about Squarespace is the versatility of it—compared to other website builders, it’s hard to beat in terms of the large number of layout options, user-friendly interface, and the various features available. Some of those features include built-in ecommerce capabilities (for those hoping to sell their work), promotion marketing tools, and booking and appointment handling. WIRED even named Squarespace one of the <a href=\"https://www.wired.com/story/the-best-websites-to-show-off-your-portfolio-of-work/\" target=\"_blank\" rel=\"noopener\">best websites</a> to show off your portfolio of work. Right now, first-time users can get 10% off any website or domain plan, plus a 2 week free trial period. All you need to do is click the coupon above and enter the Squarespace promo code <strong>WIRED10</strong> into the box at checkout to see the savings roll in.</p><p>Make sure the world at large can see how talented you are.</p><h2>Unlock a Free Trial and 36% Off When You Choose a Squarespace Annual Plans</h2><p>Squarespace continues to reign at the top of our list of the <a href=\"https://www.wired.com/story/best-website-builders/\" target=\"_blank\" rel=\"noopener\">best website builders</a>, with features and customizable templates that help any skill level design like a pro. But don’t just take our word, users can start with a free 14-day trial and then make a decision on which plan best suits their personal or business' needs. Squarespace frequently releases discount codes for 20% off new websites, but forget needing one–the easiest way to save up to 36% is by locking in an annual price rather than a pay-as-you-go model with the monthly plan. You’ll need your business to have a website for longevity, so I’d recommend buying long term and saving big.</p><p>Prices per plan range, with the yearly plan discounts of up to $1,520, depending on the plan you choose. With the basic plan, you’ll pay $16 per month, but save 30% when you buy annually. For Core, the midrange tier, you’ll pay $23 per month, billed at $276 annually. Meaning that if you opt for the annual plan, you’ll save over $84 over a year, and over $1,520 with an Advanced annual plan. Plus, if you aren’t sure which service is right for you, Squarespace asks a series of questions to figure out which features you actually need and then it’ll recommend a plan based on your feedback. Additionally, all plans allow you to publish your website on your terms, and come with a free custom domain.</p><p>Don't fuss around with files and servers. Just use one of these WIRED-tested website builders.</p><h2>Students Get a 50% Off Squarespace Discount Code</h2><p>Like Millennials and Gen Z-ers, Squarespace knows just how important our digital footprint is in this day and age. That's why Squarespace is offering a student discount, where students can get 50% off annual plans to help launch their burgeoning business. All you need to do to get the Squarespace coupon code is verify your student status with Student Beans. Once you’ve verified using the free service, just input the offer code during checkout. Note: authorized students can obtain only one code every 12 months, whether the offer code is redeemed or not.</p><h2>Join Squarespace Circle for 20% Off and 40% Off Referral Discounts</h2><p>Squarespace Circle perks is how people can get rewarded for using the platform. While you previously had to launch three websites to be eligible for Squarespace Circle, now any creative professionals can join (for free).</p><p>There are a few subscription tiers to choose from. There’s the free tier, where you’ll get 10% off new annual subscriptions, along with 3 month-extended free website trials. Next is gold, where you can get 20% off annual subscriptions and a six-month free trial. The highest tier is platinum, which gets you 25% off annual subscriptions and a one year website trial.</p><p>Plus, there’s a <a href=\"https://support.squarespace.com/hc/en-us/articles/4418794433421-Squarespace-Circle-referral-payments\" target=\"_blank\" rel=\"noopener\">referral discount</a> for Circle members, where you can earn It includes a separate scheduling page clients can visit to book appointments, and you can embed your Acuity scheduler in almost any website. Then, if you decide to add a website from Squarespace, it’s super easy to use Squarespace’s tools and pre-designed templates. They make it easy, with a free trial option that requires no website or credit card. If you decide on a plan, you’ll save 20% annually on Starter and Standard, and 19% off Premium.</p><p>The online booking platform aims to streamline scheduling for everything from virtual appointments to workshops.</p><h2>Launch Your Business Today With Squarespace Business</h2><p>Knowing where to begin when starting a <a href=\"https://www.squarespace.com/small-business-website\" target=\"_blank\" rel=\"noopener\">small business</a> can be super daunting. Squarespace wants to make that easier, by providing an inclusive, all-in-one platform to help you run your entire business more efficiently. Squarespace has a whole suite of tools to manage and grow the business, with design-forward website templates to get started and customization options to make sure it fits with your business. Plus, there’s AI help available when needed to streamline the entire process.</p><p>Squarespace has basically everything you need to grow your online business: you can sell products, offer services, and book appointments, and Squarespace’s client management systems make booking seamless. You’ll be able to manage inventory, shipping, POS, and more from one convenient dashboard, making all of the moving parts of your <a href=\"https://www.squarespace.com/small-business-website\" target=\"_blank\" rel=\"noopener\">small business</a> a whole lot more manageable.</p><p><a href=\"https://cna.st/p/2qdfcznXFEUkJmfgWNZ4xavEbFeqMaCPtdMocD7t4Yyh53XPhXPfhh57A4yxkovucfiZU6ZdozQoQna8UdAYAifw3DgAEwgAYqLYmoVRfZrxrF671TjwTN5r7CQsb15YrsktVMaj4bGuxU9JiWsc51oVmMhTtqkV6Vd2u4N2adKyrrcbGaR4csaWtayGGjT9iT7LhDddogXYA6bX1XBc7pzJ2CRTTGsgbpLXbep1iSEwPhhepHzLURUwQzioQyNFW58kYtsuQHKHCaSQ8q5H9ZSinviCK4iCvwEfii5HRdKhw2wv8xQjQimFc2iQV31BTLQKzddPtUjvt2Z3LycbQsthtWgfeV1Ujc4b9zmHR9tig4T7vrVjHMmF\" target=\"_blank\" rel=\"noopener\"></a></p><p>Acuity via Molly Higgins</p><h3>Acuity Scheduling</h3><h2>Check Out the New Squarespace AI Website Builder</h2><p>AI is everywhere, and here at WIRED, we know it <a href=\"https://www.wired.com/search/?q=ai&amp;sort=score+desc\" target=\"_blank\" rel=\"noopener\">all too well</a>. Squarespace is jumping on the AI bandwagon, with its new <a href=\"https://www.squarespace.com/websites/ai-website-builder\" target=\"_blank\" rel=\"noopener\">Blueprint AI</a> service, which helps you smartly build your website. It’s free to use, although you need a paid Squarespace account to publish any website you create with Blueprint AI. If that’s not your jam and you prefer to go a little more old school, you can browse pre-built website <a href=\"https://www.squarespace.com/templates\" target=\"_blank\" rel=\"noopener\">templates</a>, including specific designs optimized for various business focuses and needs.</p><p>Squarespace recently <a href=\"https://newsroom.squarespace.com/\" target=\"_blank\" rel=\"noopener\">announced their partnership</a> with perplexity for AI optimization (AIO) tools. This basically means that Squarespace will serve as the website building and hosting partner for Perplexity’s browser, Comet, in an effort to build a seamless transition from AI-powered research to professional business building for users. Customers will be able to get fast guidance on domain registration, brand development, and design recommendations through the Comet AI chatbot.</p><p>Blueprint combines AI and curated designs to get your website up and running in a few minutes.</p>"},{"title":"Tomb Raider: Legacy of Atlantis, a remake of the first game, is getting RPG skill trees, crafting mechanics and a 'focus meter', and fans aren't happy","source":"Eurogamer","author":"Dom Peppiatt","url":"https://www.eurogamer.net/tomb-raider-legacy-of-atlantis-remake-rpg-focus-crafting","category":"gaming","categoryLabel":"Gaming","wordCount":532,"readingTime":3,"content":"<p>Taking the pistols.</p>\n    \n  \n  \n  \n  \n            <p>Amazon Game Studios and Crystal Dynamics have released a new trailer for <a href=\"https://www.eurogamer.net/games/tomb-raider-legacy-of-atlantis\" target=\"_blank\" rel=\"noopener\">Tomb Raider: Legacy of Atlantis</a>. It's the sixth instalment in a series of 'behind-the-scenes' videos chronicling the making of the upcoming remake, which is being developed by Flying Wild Hog. This latest video shows us some previously unknown elements of the game, and they mark a pretty big departure from the original 1996 title.</p>\n<p>Legacy of Atlantis' \"fiery, fabulous and fit\" incarnation of Lara has been designed to feel agile and dangerous. She also comes with a 'focus' meter that fills as you deal damage, take damage, and dodge attacks. 'Focus' allows you to slow down time around you and engage in acrobatic maneuvers that feel good \"on the sticks\". This is different from the original title where Lara could perform acrobatic movements on the fly, without the need for a specific 'focus' bar.</p>\n\n<p>\"When I played the Survivor series [Tomb Raider 2013 onwards] and I could suddenly affect and increase Lara's power in the game,\" says design director Jason Epps, \"I felt much more engaged.\" As a result, he notes, there is now an RPG-like skill tree in the game, as well as a mechanic that sees you collecting herbs that can be brewed to give you buffs that reduce damage or restore health. Unlike the Survivor series, you don't gain experience points for upgrades by performing different tasks, but rather by collecting artefacts found dotted around the levels.</p><p>\"No, sir, I don't like it,\" notes one user <a href=\"https://www.resetera.com/threads/tomb-raider%E2%80%99s-remake-legacy-of-atlantis-is-getting-some-rpg-elements.1606501/\" target=\"_blank\" rel=\"noopener\">on Resetera</a>, referring to the new-fangled mechanics making their way into the classic game. \"I hate it,\" replies another. \"I'm so disgusted, damn it,\" <a href=\"https://x.com/matthiew_bc/status/2089398404241576361?s=46\" target=\"_blank\" rel=\"noopener\">says a poster on X/Twitter</a>. \"I was really hoping to be rid of all the RPG elements after the Survivor trilogy.\" My favourite reply, though, reflects on the dissonance between mechanic and story here: \"Isn't she supposed [to be a] veteran treasure hunter in this game? Why would she be learning new skills at her age?\"</p>\n<p>Elsewhere in the video, Flying Wild Hog confirms that the iconic dual pistols - a \"baseline\" tool for Lara - make a return. \"We have four weapons in the game, and each weapon is focused on different playstyles, [for] different distances from your enemies,\" explains Marcin Steliga, senior system designer at the studio. The devs go on to detail how the shotgun, SMGs, and assault rifle will complement the dual pistols in different situations.</p>\n<p>These are some pretty big changes to the game that seem to be going down poorly with the Tomb Raider community. It's not the first time Amazon, Crystal Dynamics and Flying Wild Hog have come under fire during the development of this title, either: back in June, <a href=\"https://www.eurogamer.net/tomb-raider-legacy-of-atlantis-ai-use-explained\" target=\"_blank\" rel=\"noopener\">there was a furore over the studio's use of AI during the game's development.</a></p>\n<p>Tomb Raider was once slated for release in 2026, but <a href=\"https://www.eurogamer.net/tomb-raider-legacy-of-atlantis-gets-new-trailer-featuring-lara-natla-and-larson-as-well-as-slight-a-delay\" target=\"_blank\" rel=\"noopener\">Legacy of Atlantis will now arrive next year</a>, on 12th February, 2027, for PlayStation 5, Xbox Series X/S, <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a> and PC via Steam. Our own Chris Tapsell enjoyed his time with the game, <a href=\"https://www.eurogamer.net/tomb-radier-legacy-of-atlantis-preview-feels-double-a\" target=\"_blank\" rel=\"noopener\">and remarked on how strangely double-A the whole affair felt</a>.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Late Summertime Idylls by the Water","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/goings-on/late-summertime-idylls-by-the-water","category":"fun","categoryLabel":"Interesting Reads","wordCount":621,"readingTime":4,"content":"<p><strong>For the past two hundred years,</strong> summer in New York has best been spent by the water. “Circumambulate the city,” Melville writes in “<a href=\"https://cna.st/affiliate-link/6exhfamEeE8bstFxRoCH7D4E7zYfpsq59jSe42xDARrNA56GwsBAVANcGT4gmvTDweK4A1RT26GS4xVi9y6BDA3iLTcqo4a3Avas6ogCn3GCGk8wmjGCu8tpEvGHEmsYovNqCHBV6za4ztZGG1kC1c57rnxoCRJUk1eWpghzL7UmgKgUgkRNi7tx19HaPhfasRZcvrZEjq3vntRLmtCNMKaJXGEJkwigKF9B2k2G7hYeA9AyXiEKfcZeYrpaQrf6JqwuTNrsc4tJrvP6mqfRgCpDvAdoxosDqvbLbyTZKdM3QArtMcbBUFgDVjyJh\" target=\"_blank\" rel=\"noopener\">Moby-Dick</a>,” and you’ll find “thousands upon thousands of mortal men fixed in ocean reveries.” It’s true: all stripes of New Yorkers (not just men, Herman!) amble along the city’s promenades, eyes fixed on the water’s rippling surface. Frequently—and here’s another thing Melville didn’t mention—a good number of these coastal strollers have a refreshing drink in hand. Back then, maybe a hip flask with a dram of whiskey; now, you’re more likely to see a canned cocktail or brown-bagged beer. It’s no surprise, then, that with the arrival of summer also comes a wealth of seaside watering holes, from beachy burger shacks to boat bars.</p><p>Perhaps the oldest of these is <strong>Frying Pan,</strong> a cherry-red, hundred-and-thirty-foot vessel that the Coast Guard used, from 1930 to 1965, as a floating lighthouse. Now, however, it remains docked on the Hudson River, near West Chelsea, operating as a full-service bar and restaurant. Recently, one newcomer took in the midtown skyline as he feasted on a steak sandwich: a mouthwatering stack of rib eye, caramelized onions, horseradish aioli, and ciabatta. Afterward, he sauntered over to the beer garden and sampled the saccharine Mermaid’s Nectar, a hibiscus-tea mocktail mixed with guava purée and lime. To his starboard side, a group of frat guys had ordered a bucket of Heinekens and were starting their Friday night early.</p><p>A couple of miles south, things were much quieter (and pricier) at <strong>Grand Banks,</strong> a schooner turned oyster bar docked at Tribeca’s Pier 25, with views of the Statue of Liberty and the Freedom Tower. Under a collection of string lights, the riverine reveller sampled the Oysters Champagne, topped with shishito mignonette, cucumber, and shiso. A pair of middle-aged financiers sitting nearby recommended the L’été Sans Fin, a sweet, funky orange wine that nicely balanced out the appetizer’s tartness. They placed their own orders with the bartender, who smiled approvingly. “I took one look at your facial hair,” he said to one, whose salty Teddy Roosevelt ’stache was framed by a thick goatee and ill-fitting Wayfarers, “and I said to myself, ‘that’s a guy who eats kale every day!’ ”</p><p>Over at <strong>Fireboat,</strong> a repurposed F.D.N.Y. firefighting vessel from the nineteen-sixties, moored in the East River off of Brooklyn Heights, the vibes took a more Caribbean slant. The newcomer dug into a juicy jerk-chicken sandwich as he marvelled at the ship’s fire hoses, which were now dispensing beer at non-emergency velocity. The Governors Island ferry passed by periodically, rocking the ship in its wake, and the guest, sea legs shaking, decided to leave halfway through his Mariner, a summery, gin-based cocktail made with elderflower, matcha, and lemon.</p><p>He made one last stop at <strong>Rippers,</strong> a burger joint located on the Rockaway Beach boardwalk, near Beach Ninetieth Street. The screech of guitar feedback echoed from a makeshift stage outside, where a punk-rock band had just launched into their set, a fitting accompaniment to the bar’s kaleidoscopic selection of beer. A distinct piratical energy hung in the ocean air; the first-timer wouldn’t have been surprised had Blackbeard walked in, plunder in tow, and ordered a round for the bar. But night was setting in, and all he found were some ragtag surfers shaking sand from their hair in a sand-dollar-size mosh pit. Out beyond the shore, the sky had turned a wash of pink and gold—a celestial curtainfall soundtracked by the <em>thwack</em> of a snare drum, and the mellifluous burble of yet another pint being poured.</p><p><strong>P.S. Good stuff on the internet:</strong></p><ul><li><a href=\"https://www.theatlantic.com/magazine/archive/1957/09/summer-remembered/640682/\" target=\"_blank\" rel=\"noopener\"><em>“Summer Remembered,” by Isabella Gardner</em></a></li><li><a href=\"https://www.worldofinteriors.com/story/lydia-corbett-provence-farmhouse\" target=\"_blank\" rel=\"noopener\"><em>Where Picasso’s model lives</em></a></li><li><a href=\"https://www.theparisreview.org/blog/2026/07/27/the-bit-player-my-father-with-steve-zissou/\" target=\"_blank\" rel=\"noopener\"><em>The bit player of “The Life Aquatic”</em></a></li></ul>"}];
