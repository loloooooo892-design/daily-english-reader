*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {

  background: var(--accent-light);

  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;

}

  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;

}

  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;

  background: var(--swap-bg);

  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {

  cursor: default;
}

.swap-counter {

  color: var(--text-faint);

}

}

.article-body h2, .article-body h3, .article-body h4 {

  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {

.footer a {

.archive-link {

<script>
var articles = [{"title":"Presence of forever chemicals in the environment threatens human rights, UN expert says","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/presence-of-forever-chemicals-in-the-environment-threatens-human-rights-un-expert-says/","category":"law","categoryLabel":"Law","wordCount":525,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/presence-of-forever-chemicals-in-the-environment-threatens-human-rights-un-expert-says/#\" target=\"_blank\" rel=\"noopener\">Presence of forever chemicals in the environment threatens human rights, UN expert says</a>\n</strong><p>Newly appointed UN expert Bethanie Carney Almroth on Monday <a href=\"https://news.un.org/en/story/2026/09/1168329\" target=\"_blank\" rel=\"noopener\">warned</a> that toxic waste in the form of forever chemicals, or “PFAS,” poses severe risks to the basic human right of a healthy and safe environment.</p><p>Almroth referenced a recent <a href=\"https://docs.un.org/en/A/HRC/63/27?_gl=1*1nhftpw*_gcl_au*MTQzNzQ0NDcxMi4xNzg5NDc3NzUx*_ga*MTUwNjkyNDE4NC4xNzczMTUzMDQ3*_ga_S5EKZKSB78*czE3ODk0Nzc1MTEkbzIxJGcxJHQxNzg5NDc3NzUwJGoyOCRsMCRoMA..\" target=\"_blank\" rel=\"noopener\">UN report</a> conveying that as PFAS spreads and accumulates in the environment, it has the potential to remain there for centuries to come, because there is no effective technology to remove these chemicals from contaminated ecosystems. This not only raises extreme health and safety concerns, but has global <a href=\"https://www.jurist.org/news/2026/09/un-expert-urges-states-to-ensure-public-participation-in-sustainable-development-decisions/\" target=\"_blank\" rel=\"noopener\">environmental justice</a> implications, as many marginalized communities and developing nations are facing disproportionate impacts from the substances.</p><p>Per- and polyfluoroalkyl substances, PFAS, are chemicals that were <a href=\"https://www.ewg.org/what-are-pfas-chemicals\" target=\"_blank\" rel=\"noopener\">introduced</a> largely through non-stick and waterproof products in the 1900s. Heavy use has resulted in the contamination of drinking water, air pollution, and introduction of the substance into the food system and into many daily-use products such as cookware and cosmetics. The substances have been linked to severe health risks such as cancer and immune system failure, and have been found in many pregnant women, with potential consequences for newborns.</p><p>The chemical is concentrated in heavily industrialized areas like the US and southeastern China, but has traveled through the water system, air streams by burning waste, and trade routes to small local communities and <a href=\"https://blogs.worldbank.org/en/trade/how-forever-chemicals-are-impacting-international-trade\" target=\"_blank\" rel=\"noopener\">developing countries</a> such as African and pacific nations.</p><p>The <a href=\"https://www.epa.gov/newsreleases/epa-launches-cutting-edge-scientific-study-strengthen-nations-understanding-potential\" target=\"_blank\" rel=\"noopener\">highest concentrations</a> in the US can be found largely on the east coast, but nearly every state has reported water contamination in quantities above the Environmental Protection Agency’s (EPA) standards. The EPA has only just begun establishing legal limits on PFAS in drinking water, despite the knowledge that the chemical has posed health hazards for decades, but <a href=\"https://www.ewg.org/interactive-maps/pfas_contamination/\" target=\"_blank\" rel=\"noopener\">recent rollbacks</a> have impacted the effectiveness of these standards.</p><p>Presence of the substance in nearly every facet of daily life, violates the <a href=\"https://www.unep.org/news-and-stories/story/historic-move-un-declares-healthy-environment-human-right\" target=\"_blank\" rel=\"noopener\">human right</a> laid out by the UN, to a clean, healthy, and sustainable environment. While this carries no legal weight for UN member states, its implementation has led many countries to recognize the right to a healthy environment or place explicit environmental protections in their <a href=\"https://www.unep.org/pt-br/node/21166\" target=\"_blank\" rel=\"noopener\">constitution</a>.</p><p>Additionally, the UN report indicated that the use and dispersal of PFAS violates the principles of <a href=\"https://realaw.blog/2024/11/22/the-differentiated-impact-of-the-principle-of-prevention-in-international-and-eu-environmental-decision-making-by-francesco-maletto/\" target=\"_blank\" rel=\"noopener\">prevention</a> and the <a href=\"https://www.iisd.org/articles/deep-dive/precautionary-principle\" target=\"_blank\" rel=\"noopener\">precautionary principle,</a> as well as the <a href=\"https://environment.ec.europa.eu/economy-and-finance/ensuring-polluters-pay_en\" target=\"_blank\" rel=\"noopener\">polluter pays principle</a>, under which those who cause pollution have to bear the costs. This idea was outlined in the <a href=\"https://www.un.org/en/conferences/environment/rio1992\" target=\"_blank\" rel=\"noopener\">Rio Declaration</a> and has been influential in climate policy and litigation.</p><p>Many international regulatory frameworks directly and indirectly address PFAS as well, such as the <a href=\"https://www.unep.org/ozonaction/who-we-are/about-montreal-protocol\" target=\"_blank\" rel=\"noopener\">Montreal Protocol</a> or <a href=\"https://www.basel.int/\" target=\"_blank\" rel=\"noopener\">Basel Convention.</a> However, civil society organizations like the Environmental Investigation Agency (EIA) and the Center for International Environmental Law (CIEL) have <a href=\"https://eia-international.org/wp-content/uploads/2026-EIA-Submission-to-Basel-Convention-Secretariat.pdf\" target=\"_blank\" rel=\"noopener\">criticized</a> these as sparse and patchy, arguing that they do not <a href=\"https://asil.org/insights/volume-23-issue-7/\" target=\"_blank\" rel=\"noopener\">adequately regulate</a> all forms of the substance.</p><p>She indicated that the path forward to creating a healthier environment is not only addressing how to clean up the toxic pollutants, but also how to prevent their spread in the first place. This should be done through monitoring, inspections, and the dissemination of public information.</p>"},{"title":"Why Elon Musk’s “Self-Growing” Moon Cities Are Tragically Flawed - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/why-elon-musks-self-growing-moon-cities-are-tragically-flawed-1285049/","category":"fun","categoryLabel":"Interesting Reads","wordCount":529,"readingTime":3,"content":"<p>Humanity has been seriously considering building <a href=\"https://nautil.us/the-moon-bases-of-yesteryear-1281513\" target=\"_blank\" rel=\"noopener\">a permanent presence</a> on the moon for at least 70 years. Earlier this year, erratic billionaire Elon Musk went a bit further, <a href=\"https://x.com/elonmusk/status/2020640004628742577\" target=\"_blank\" rel=\"noopener\">promising</a> a “self-growing” lunar city within just 10 years. It’s kind of like the difference between adding a second story to your house and adding a self-sustaining skyscraper on top. </p><p>Featured Video</p><p>“The mission of SpaceX remains the same,” Musk <a href=\"https://x.com/elonmusk/status/2020640004628742577\" target=\"_blank\" rel=\"noopener\">wrote</a> on the social media platform he owns and spends much of his time on. “Extend consciousness and life as we know it to the stars.” </p><p><strong>Read more: “<a href=\"https://nautil.us/should-people-live-on-the-moon-257145\" target=\"_blank\" rel=\"noopener\">Should People Live on the Moon?</a>”</strong></p><p>Back on Earth, two astronomers from the Smithsonian Astrophysical Observatory are using their consciousness to throw cold water on the proposal. Or rather a lack of cold water—according to their new <a href=\"http://dx.doi.org/10.3389/frspt.2026.1894104\" target=\"_blank\" rel=\"noopener\">paper</a> in <em>Scientific Frontiers</em>, a settlement at the scale of a self-growing city (100,000 to 1 million people) would be hamstrung by a lack of precious H2O.</p><p>But first, some good news. The team actually crunched the numbers on both water and power requirements, and discovered generating enough electricity for a self-growing city will be a relatively lighter lift. Because of the moon’s high silica concentrations and low gravity, building and erecting massive solar panel towers could provide enough electricity for everyone (even data centers). These structures could be placed on the sun-drenched rims of polar craters, the so-called “peaks of eternal light.”</p><p>Then there’s the bad news—the “pits of eternal darkness.” That’s the term for the shadowy craters that harbor ice at a temperature of -260 degrees Fahrenheit, preventing it from evaporating. Also located primarily at the poles, these craters are estimated to hold several hundred million tons of water. But there’s other water scattered around the lunar surface as well, so the team expanded the estimate to a generous 1 billion tons of water.</p><p>Unfortunately, that’s still not enough for a self-growing city. The astrophysicists estimate these reserves will be exhausted by a city of 1 million within just a few years. Of course with the kind of water recycling efficiency achieved by the International Space Station (a herculean 98 percent) this could be extended, but only to a century. </p><p>Additionally, the moon may contain a lot less water. “This means that even a small city would run dry after just a decade or so,” study author Martin Elvis <a href=\"https://www.frontiersin.org/news/2026/09/14/no-cities-on-the-moon-there-isnt-enough-water-frontiers-space-technologies\" target=\"_blank\" rel=\"noopener\">wrote</a>. “A moon village with a thousand people, or even a town with 10,000 people, would instead be sustainable for several centuries or more.” </p><p>But don’t count humanity’s dream of a bustling lunar metropolis out yet. “There are potential solutions,” Elvis wrote. “We could improve the efficiency of water recycling by a factor of five or more; lower water usage from new techniques such as vertical farming; import water, probably from accessible asteroids; or, simply, find more water.”</p><p>If Elon wants to give us the moon, he might have to throw a lasso around a comet and pull it down. Given how many of his impetuous promises have amounted to vaporware, I won’t be holding my breath. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: Donald E. Davis</em></p>"},{"title":"US confirms for first time it has deployed space weapons","source":"Hacker News Best","author":"","url":"https://www.bbc.com/news/articles/ck790xg41ygro","category":"tech","categoryLabel":"Technology","wordCount":624,"readingTime":4,"content":"<p>14 hours ago</p><p><p>Bernd Debusmann Jrand</p><p>Chris Graham</p></p><p>The US has confirmed it deployed a space weapon in Earth's orbit, the first time it has acknowledged such offensive capabilities. </p><p>US Secretary of the Air Force Troy Meink said the \"on orbit\" weapon was necessary to safeguard US forces against hostile enemy action.</p><p>Speaking at the Air, Space and Cyber Conference on Monday, Meink said the US was ready for \"evolving threats\", but did not elaborate on the weapon's capabilities or when it was put into orbit.</p><p>Senior military leaders have previously said they planned to boost military capabilities in space, citing Russian and Chinese programmes developing ways to attack and disrupt US satellites in a future conflict. </p><p>China responded on Tuesday by warning against an \"arms race\" in space. </p><p>\"We urge the US side to stop expanding its military capabilities and preparing for war in outer space,\" AFP quoted a foreign ministry spokesman as saying.</p><p>Details of how the weapon operates have not been disclosed by US officials.</p><p>A US Space Force spokesperson said: \"Space control encapsulates the mission areas required to contest and control the space domain – employing kinetic and non-kinetic means to affect adversary capabilities through disruption, degradation and even destruction, if necessary. </p><p>\"These capabilities can be employed for offensive and defensive purposes at the direction of combatant commands.\"</p><p>An expert on military uses of outer space noted that \"precious little\" was publicly known about the technology, and told the BBC there could be a \"whole range of different weapons systems\".</p><p>Speaking to Radio 4's Today programme, Dr Bleddyn Bowen, from the Royal United Services Institute (RUSI), said he was \"totally guessing\" but that the US could have been referring to \"some kind electronic warfare or radio jamming platform\". </p><p>That would be the sort of weapon that already exists on Earth and could disrupt radio communications, Bowen said.</p><p>An alternative would be \"a kinetic kill vehicle of some sort - so a vehicle that would release a projectile of some sort that would ram into a satellite and destroy it\". </p><p>But this was less likely because such a physically destructive tool would be capable of creating a lot of debris, Bowen added.</p><p>The Trump administration has said that space-based capabilities - and interceptor missiles - are a crucial part of its planned \"Golden Dome\" defence system to protect the US from missiles and other airborne threats.</p><p>Last year President Donald Trump issued an executive order underlining the US Space Force's role in not only defending assets, but also as an attacking force.</p><p>The US Space Force - the first new branch of the US military for more than 70 years - was launched in 2019 as a way to protect American assets in space, including hundreds of satellites used for communication and surveillance. </p><p>A 1967 treaty banned weapons of mass destruction in orbit. Since then, key powers including the US, Russia, and China have been exploring other capabilities outside of the treaty, such as targeting rivals' satellites - which are key for military communications, surveillance and navigation. </p><p>Such interceptions may have allowed Russian intelligence services to read the sensitive data they transmit, or hypothetically, even to take control of the satellites.</p><p>In 2024, the US said Russia had launched a satellite which it believed may be capable of attacking other such probes. Russia did not publicly comment on the issue.</p><p>The US Space Force says China \"develops and operates space and counterspace capabilities as part of a military modernisation strategy,\" while Russia \"views space as a warfighting domain and believes space supremacy will be a decisive factor in future conflicts\".</p><p>Get our flagship newsletter with all the headlines you need to start the day. <a href=\"https://www.bbc.co.uk/newsletters/zhp28xs\" target=\"_blank\" rel=\"noopener\">Sign up here.</a></p><p>More on this story</p>"},{"title":"\"It's absolutely our goal to expand the market\" - Valve's new Steam Frame VR headset has a nifty idea for broader appeal","source":"Eurogamer","author":"@eurogamer","url":"https://www.eurogamer.net/valve-steam-frame-vr-demand-expand-market","category":"gaming","categoryLabel":"Gaming","wordCount":769,"readingTime":4,"content":"<p>\"For a long time, VR has turned itself into an accessory...\"</p>\n    \n  \n  \n  \n  \n            <p>Valve has said its new Steam Frame VR headset, despite costing nearly £900 for a base model, is intended to \"expand the market\" of virtual reality headsets. That's both because it's lightweight and standalone, but also because it addresses a fundamental and long-running problem VR headsets have had.</p>\n<p>\"For a long time, VR has turned itself into an accessory for your PC,\" Valve software engineer Jeremy Selan told Eurogamer in an interview <a href=\"https://www.eurogamer.net/steam-frame-vr-price-where-how-to-buy\" target=\"_blank\" rel=\"noopener\">ahead of Steam Frame's pricing announcement</a>, \"or in the case even of standalone, something that you have to decide to do first. Like, you might say, 'I want to play a non-VR game on my TV or on my PC,' or, 'I want to go try this specific VR experience.'\" Regardless, it's an either-or situation - one or the other.</p>\n\n<p>\"From the outset of this product, we were really looking to do something new and to try to make customers not have to think if they wanted to do VR or non-VR games,\" Selan said. Therefore, a much bigger emphasis has been put on your ability to easily switch between VR and non-VR games - or movies or web browsing - while using the device.</p><p>\"The non-VR experience is something that I use all the time,\" Selan went on, \"and it's so comfortable because of the ergonomics of the controllers, the lightweightness of the device where you can carry it and use it in a bunch of rooms. So I find myself with this device for the first time putting it on, not even having decided what I'm going to play.</p>\n<p>\"I have the Steam catalogue in front of me - of course it's your computer and you can install non-Steam games - and I could just say, 'Am I [in the mood for] this non-VR game? Am I in the mood for this VR experience?' And you can sort of jump back and forth. And so this friction of 'am I going to bring out my VR device or not?': if you're already in it, the friction is zero. So I find myself playing a lot more VR and a lot more non-VR simply because of the intermingling of this device.\"</p>\n<p>Matt picked up on this point in his <a href=\"https://www.eurogamer.net/steam-frame-review\" target=\"_blank\" rel=\"noopener\">Steam Frame review</a>, and it's these aspects, coupled with its physical design, that make Steam Frame potentially a broader market device, according to Valve. \"It's absolutely our goal to expand the market,\" Selans said.</p>\n<p>Valve hardware engineer Joy Lyons added: \"The idea here is that we want to have gamers be able to access more content through the Steam store and across all these different systems ... We see this as a product that's growing. This is obviously a great product for our PC VR users, and we love them and support them, this is for them, but we also see this as also a broadening of intent also for developers and then also for gamers just to have more access to more content and a really sort of premium experience in a VR headset.\"</p><p>Nevertheless, a base price of £889 for the 256GB Steam Frame model is a high hurdle to clear - <a href=\"https://www.eurogamer.net/valve-steam-machine-price-availability-reaction\" target=\"_blank\" rel=\"noopener\">a hurdle Valve's Steam Machine had to contend with</a> earlier this year. The component shortage crisis is largely responsible for Steam Frame's delay from an early 2026 release. \"We very much had to adjust the price targets and the volume targets and that's the reality,\" Selan said. \"But we still believe at the current pricing it's a super compelling product. It's a great value. It's an amazing piece of hardware.\"</p>\n<p>Joy Lyons added: \"If all hardware is unaffordable then no one is able to enjoy or release or do anything. So, if anything, it's more important to be able to provide equipment that we're really excited about and we think moves forward the gaming experience.\"</p>\n<p><a href=\"https://www.eurogamer.net/steam-frame-vr-price-where-how-to-buy\" target=\"_blank\" rel=\"noopener\">Steam Frame headset reservation sign-ups are now open</a>, meaning that if you want a chance to buy the device, you can sign up and then wait to see if you're randomly selected to order it - an ordering system Valve has used before to cope with high demand and limited supply. And you can read Matt's full <a href=\"https://www.eurogamer.net/steam-frame-review\" target=\"_blank\" rel=\"noopener\">Steam Frame VR review</a> elsewhere on the site.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n  \n    <p>\n      <a href=\"https://www.eurogamer.net/games/cuphead\" target=\"_blank\" rel=\"noopener\">Cuphead</a>\n    </p>\n    <p>\n        Mac, Nintendo Switch, PC, PS4, Xbox One\n    </p>\n  \n\n          \n            \nSee 2 more                      \n            \n\n      \n  \n    <p>\n      <a href=\"https://www.eurogamer.net/games/hades\" target=\"_blank\" rel=\"noopener\">Hades</a>\n    </p>\n    <p>\n        Mac, Nintendo Switch, PC, PS4, PS5, Xbox One, Xbox Series X/S, iOS\n    </p>\n  \n\n      \n  \n    <p>\n      <a href=\"https://www.eurogamer.net/games/no-mans-sky\" target=\"_blank\" rel=\"noopener\">No Man's Sky</a>\n    </p>\n    <p>\n        Mac, Meta Quest, Nintendo Switch, Nintendo Switch 2, PC, PS4, PS5, PlayStation VR2, Xbox One, Xbox Series X/S\n    </p>"}];

}

function nextArticle() {

function skipArticle() {

  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {

}
