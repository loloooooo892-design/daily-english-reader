*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

}

h1 {

}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }

<script>
var articles = [{"title":"AI usage generates a fragile codebase","source":"Hacker News Best","author":"","url":"https://evanxmerz.com/post/ai-usage-generates-a-fragile-codebase/","category":"tech","categoryLabel":"Technology","wordCount":1264,"readingTime":7,"content":"<p>I can only speculate as to the reasons why I was laid off from Meta in May, but I suspect that one of the reasons is that I was a little bit more resistant to adopting AI/LLMs as coding tools than some of my peers. Don't get me wrong, I generated at least 90% of my code using AI in my last few months there, which was the minimum for a decent rating. But AI didn't 10X the amount of code I was writing. It didn't even 2X it.</p>\n<p>I was focused on code quality. I saw the code being pushed by some of my peers who were heavily reliant on AI, and I saw that it was brittle code. There were many subtle issues that would lead to tech debt in the long term, and even some glaring issues were ignored by very good programmers. For instance, I saw one of the best programmers on my team try to merge code that used javascript events for mouseover CSS effects rather than using the :hover selector, which is a totally unscalable way of writing mouseovers.</p>\n<p>Now I'm employed at another large tech company and I've fully made the switch to generating 100% of my code using AI because that's the expectation today. Still, I can see lots of people becoming aware that this isn't a sustainable way to continue development of a large scale SaaS product. AI tends to solve the problems that can fit within its context window very well, but it's totally oblivious to the long term issues that can't be understood in that relatively small frame.</p>\n<p>In this post I'm going to list four ways that AI usage results in a fragile codebase that isn't resilient to the demands of highly available and highly scalable SaaS applications.</p>\n<p>By the way, every word of this article was written by a human. Even though the following image was generated by AI, this article isn't AI slop.</p>\n<h3>Four ways AI makes codebases fragile</h3>\n<p>Here are the four most common ways that I have seen AI generating a fragile codebase.</p>\n<h4>1. AI writes shallow tests</h4>\n<p>One of the most obvious failures of modern LLMs is that they tend to write simplistic automated test cases that don't cover the things that matter to humans. Frequently I see AI agents writing lots of tests of get/set methods which are trivial and don't typically require much testing. When AI writes e2e tests, they tend to only cover the cases which are already covered in the codebase. In other words, the AI writes tests only covering one type of user, or only covering surface level interactions. This creates massive gaps in the test coverage that are invisible to developers because they aren't captured by the line level coverage metric.</p>\n<h4>2. AI writes overly complex ccode</h4>\n<p>AI also tends to write overly complex code. It frequently uses two or three helper methods when a single one would suffice. It tries to follow coding guidelines, such as DRY, to a fault, without realizing that the added complexity of that rigidity makes the code more difficult for human developers to debug or understand.</p>\n<h4>3. Reliance on AI decreases human understanding</h4>\n<p>And that's the third issue with AI codebases: Humans don't understand them. The longer a company relies on AI agents to generate the code, the fewer developers are going to understand the codebase. This means that developers can't do the things that are necessary to build a resilient codebase. They don't understand the data structures and algorithms well enough to see when a pull request contains a new abstraction that doesn't work with the pre-existing structures.</p>\n<h4>4. AI moves too quickly to maintain a high quality bar</h4>\n<p>AI moves too quickly for human developers to maintain a high quality bar. Each pull request comes faster than the prior one and has to be reviewed in even less time. This leads to developers skimming the code and missing crucial details that result in long term tech debt. Small quality issues like testing gaps and poorly named variables accrue in the codebase until it becomes a morass of spaghetti code.</p>\n<h3>Four signs that you have a fragile codebase</h3>\n<p>If you're unsure whether coding agents are harming your codebase or not, then you might look for the following symptoms of a fragile, AI-generated codebase.</p>\n<h4>1. AI generated codebases have more incidents</h4>\n<p>When you switched the department over to agentic coding did the number of incidents slowly start rising? At first when we were all using agents to generate massive amounts of code, it didn't seem that different from traditional coding. The PRs came and were merged and everything seemed alright. But oh, there was that one p0 that came in at the end of the month, then there were two SEVs the following month. Then even more the next month. Now, after a year or two of agentic coding, it seems like there's an incident every weekend. AI coding agents are the reason why there are more incidents impacting customers.</p>\n<h4>2. Recovery from incidents takes longer in AI codebases</h4>\n<p>Not only are there more incidents, but the incidents take longer to be mitigated. The fact is that the human developers on your team now have a more shallow understanding of the codebase. If your coding agent can't find the issue that your customers are facing, then humans are going to have to dig through a codebase that is highly complex and poorly tested. They will essentially be entering unfamiliar territory, so it takes longer for them to figure out what is going wrong. Hence, companies lose more and more money to incidents that take longer to resolve.</p>\n<h4>3. AI generated codebases create errors that are only visible to users</h4>\n<p>When humans don't spend time in the code, they fail to see all of the use cases. They fail to understand how actual humans are using the code because they aren't ensuring that the AI is instrumenting analytics and catching all the errors properly. Hence, invisible errors start appearing in the codebase. Errors are uncaught and only visible to real world users, as opposed to the types of users that are being tested in automated tests or in developer manual testing.</p>\n<h4>4. AI results in a poor user experience</h4>\n<p>And that leads to the ultimate problem with AI codebases: they weren't made for humans. AI codebases are software made by AI for AI. They aren't being tailored to the way that human users use the product, and they aren't being tailored for the way human developers need to maintain the product. The experience degrades on both the user and the developer side, leading to a vicious cycle of enshittification.</p>\n<h3>Products made for humans require a human touch</h3>\n<p>The fact of the matter is that for a product to satisfy human customers, it has to be informed by a human perspective. Nobody likes ordering from machines at a restaurant. Shopping for clothes from a website always results in worse fits than shopping in person. The same is true of SaaS products. Any time you leave your SaaS product in the hands of a machine, you are losing the human touch that is valuable to your users and your developers. This may work for the cheapest products that only compete on price, but high quality software products will continue to have a human touch. The best, most expensive products will be tailored for human users by human developers. They will be charming and enjoyable to use. They won't be fragile because they won't be primarily developed by AI.</p>"},{"title":"Impeach Pete Hegseth","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/11/08/impeach-pete-hegseth/","category":"law","categoryLabel":"Law","wordCount":1219,"readingTime":7,"content":"<p>Outgoing GOP Representative Thomas Massie is<a href=\"https://www.forbes.com/sites/siladityaray/2026/11/05/gop-rep-massie-threatens-pete-hegseth-impeachment-unless-he-resigns/\" target=\"_blank\" rel=\"noopener\"> planning to introduce</a> an impeachment resolution against Secretary of Defense Pete Hegseth. Soon-to-be Democratic Speaker of the House Hakeem Jeffries <a href=\"https://www.washingtonpost.com/politics/2026/11/08/pete-hegseth-impeachment-would-be-hard-yes-hakeem-jeffries/\" target=\"_blank\" rel=\"noopener\">says he's a \"hard yes</a>\" on the idea. That makes it very likely it will happen. If not now, then when Democrats take control of Congress in January, after their big win in the midterm election. Hegseth richly deserves it, and should be convicted on at least two major charges: his role in starting an unconstitutional war and over 200 cases of outright murder.</p> <p>On September 15, Rep. Massie outlined <a href=\"https://massie.house.gov/news/documentsingle.aspx?DocumentID=395853\" target=\"_blank\" rel=\"noopener\">eight articles of impeachment</a> against Hegseth (see <a href=\"https://massie.house.gov/uploadedfiles/articles_of_impeachment_sec._hegseth.pdf\" target=\"_blank\" rel=\"noopener\">here</a> for his more detailed description). The two most compelling are these:</p> <blockquote><p><strong>Article I - Waging War in Contravention of the War Powers Resolution of 1973 Section 2(c): </strong>Charges Secretary Hegseth with waging the Iran war despite no declaration of war, statutory authorization, attack on the United States, or imminent threat. It establishes that the war was unlawful from its inception….</p> <p><strong>Article V - Extrajudicial Killings:</strong> Charges Secretary Hegseth with replacing maritime law enforcement with unauthorized lethal military targeting of suspected drug traffickers, resulting in at least 221 deaths. It also addresses denial of quarter, secondary strikes on survivors, failure to rescue shipwrecked persons, and the creation of artificial legal authorities for the campaign.</p></blockquote> <p>Massie's Article V is the single most damning, in my view. Hegseth is a principal architect of the Trump Administration's campaign of \"drug boat\" strikes in the Caribbean and the Pacific. It has now killed <a href=\"https://www.nytimes.com/interactive/2025/10/29/us/us-caribbean-pacific-boat-strikes.html\" target=\"_blank\" rel=\"noopener\">an estimated 244 people</a>, virtually all of them civilians (Massie's September figure of 221 is now somewhat outdated).</p> <p>I have previously written about why these strikes are illegal (see <a href=\"https://reason.com/volokh/2025/09/04/trumps-unjust-and-illegal-killing-of-11-venezuelans/\" target=\"_blank\" rel=\"noopener\">here</a> and <a href=\"https://reason.com/volokh/2025/10/26/why-fentanyl-smuggling-isnt-war-and-cannot-justify-extrajudicial-killing/\" target=\"_blank\" rel=\"noopener\">here</a>). But don't take my word for it, or even that of other libertarian or left-liberal experts, like <a href=\"https://www.justsecurity.org/119982/legal-issues-military-attack-carribean/\" target=\"_blank\" rel=\"noopener\">Brian Finucane</a>. Take that of <a href=\"https://www.washingtonpost.com/opinions/2025/09/23/trump-boat-strikes-drug-cartels-venezuela/\" target=\"_blank\" rel=\"noopener\">John Yoo</a>, former Bush Administration official, and leading academic advocate of sweeping executive power over foreign policy and national security issues. If you illegally order the deliberate killing of civilians - especially outside the context of a war - that's outright murder. And that's exactly what Pete Hegseth has done.</p> <p>This would be true even if those killed were all would-be drug dealers seeking to transport illegal drugs for sale in the US. I have <a href=\"https://reason.com/volokh/2025/09/04/trumps-unjust-and-illegal-killing-of-11-venezuelans/\" target=\"_blank\" rel=\"noopener\">previously explained</a> why it is unjust and illegal to kill suspected drug dealers out of hand and why they are not the legal or moral equivalent of terrorists or enemy combatants in a war. As GOP Sen. Rand Paul <a href=\"https://reason.com/volokh/2025/09/04/trumps-unjust-and-illegal-killing-of-11-venezuelans/\" target=\"_blank\" rel=\"noopener\">pointed out</a> when the drug boat strikes began, \"The reason we have trials and we don't automatically assume guilt is what if we make a mistake and they happen to be people fleeing the Venezuelan dictator? … off our coast it isn't our policy just to blow people up … even the worst people in our country, they still get a trial.\" But, in fact, the evidence indicates most were not on their way to the US and many were not transporting drugs at all. Some, for example, <a href=\"https://abcnews.com/International/family-colombian-fisherman-killed-us-boat-strike-files/story?id=128056901\" target=\"_blank\" rel=\"noopener\">were just fishermen</a>.</p> <p>The Constitution allows impeachment and removal of executive branch officials for \"high crimes and misdemeanors.\" You don't have to be a lawyer or legal scholar to figure out that complicity in over 200 murders qualifies as a \"high crime.\"</p> <p>Hegseth is also a key architect of the disastrous Iran War. In previous writings, I have explained why that war is illegal, violating both <a href=\"https://thedispatch.com/debates/donald-trump-iran-war-constitution-congress/\" target=\"_blank\" rel=\"noopener\">the Constitution</a>, and the <a href=\"https://reason.com/volokh/2026/05/01/trumps-iran-war-continues-to-violate-the-constitution-and-now-also-the-war-powers-act-of-1973/\" target=\"_blank\" rel=\"noopener\">War Powers Act of 1973</a>. Such a war requires congressional authorization, and Trump and Hegseth did not even try to get it. The war's illegality is <a href=\"https://reason.com/volokh/2026/06/14/an-unconstitutional-war-results-in-a-bad-deal/\" target=\"_blank\" rel=\"noopener\">one of the main reasons for its failure</a> to this point, as failure to secure the broad public support needed to get congressional authorization  ensured Trump lacked staying power to continue the fight effectively after the initial strikes didn't achieve a quick, decisive victory.</p> <p>Initiating and waging an illegal war isn't a violation of criminal law (though perhaps it should be). But massive non-criminal illegal acts and abuses of power are impeachable under the history and original meaning of the Impeachment Clause of the Constitution. On that point, see analyses by <a href=\"https://www.cato.org/publications/white-paper/indispensable-remedy-broad-scope-constitutions-impeachment-power\" target=\"_blank\" rel=\"noopener\">Gene Healy</a> of the Reason Foundation (formerly at the Cato Institute), and prominent conservative legal scholars Michael Stokes Paulsen (<a href=\"https://www.lawliberty.org/2018/06/28/taking-impeachment-seriously/\" target=\"_blank\" rel=\"noopener\">here</a>, <a href=\"https://www.lawliberty.org/2018/08/16/the-ratification-era-understanding-of-high-crimes-and-misdemeanors-impeachment/\" target=\"_blank\" rel=\"noopener\">here</a>, and <a href=\"https://www.lawliberty.org/2018/08/30/the-constitutional-categories-of-impeachable-offenses-impeachment/\" target=\"_blank\" rel=\"noopener\">here</a>), and <a href=\"https://www.lawfareblog.com/must-impeachable-offenses-be-violations-criminal-code\" target=\"_blank\" rel=\"noopener\">Keith Whittington</a>. There are few bigger illegal abuses of power than starting a massive unconstitutional war.</p> <p>In fairness, Trump and Hegseth are not alone in starting illegal wars. Barack Obama did it, too, with <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3063406\" target=\"_blank\" rel=\"noopener\">his unconstitutional wars against Libya and ISIS</a> (which, for those keeping score, I <a href=\"https://www.washingtonpost.com/news/volokh-conspiracy/wp/2015/06/13/still-no-legal-authorization-for-the-war-against-isis/?tid=a_inl\" target=\"_blank\" rel=\"noopener\">condemned at the time</a>). Obama likely deserved to be impeached, as well. But the fact that he got away with this illegality is no reason to spare Hegseth. To the contrary, past laxness is all the more reason to reestablish deterrence to prevent future wrongdoing. Furthermore, Trump and Hegseth's illegal war is on a much larger scale than Obama's were, and has had far worse results.</p> <p>The only potentially valid objection to impeaching Hegseth is that it might fail, and backfire politically. But the Iran War is highly unpopular, and therefore impeachment on that basis is unlikely to backfire. The politics of the boat strikes is more debatable. The administration will surely try to defend them by arguing the victims deserved it because they were trying to smuggle dangerous drugs. But that can be countered by presenting the extensive evidence demonstrating that many were not on their way to the US or even transporting drugs at all. Testimony from members of the bereaved families of the victims can help make that point, and influence public opinion against Hegseth and the administration.</p> <p>Hegseth <a href=\"https://www.axios.com/2026/11/05/hegseth-impeachment-midterms-trump\" target=\"_blank\" rel=\"noopener\">is unpopular on Capitol Hill</a>, which makes it potentially possible to secure the needed 11 or more GOP senators' votes required for conviction (the Democrats are going to have 54-56 senators in the next Congress, depending on the results of still-ongoing vote counts in close races in Alaska and Mississippi). But even if he gets acquitted, the process of impeachment and trial can send a useful signal, and further publicize the administration's massive criminality and wrongdoing.</p> <p>Obviously, the ultimate perpetrator of these illegal acts is not Hegseth, but Trump. The former was following the latter's illegal orders (though he likely also helped influence Trump to give those orders in the first place). But sanctioning officials for obeying illegal orders is still important. That's <a href=\"https://www.facinghistory.org/resource-library/obeying-orders\" target=\"_blank\" rel=\"noopener\">one of the lessons of the Nuremberg trials</a>. And, hopefully, the time will come for Trump to face sanctions for his many illegal actions, as well. As with Hegseth, the only plausible argument against impeaching him is political, not legal or moral.</p> <p>Massie's impeachment resolution also outlines several other charges against Hegseth. I think most of them have merit, but are less significant than those covered above. I will not attempt to assess these other charges here.</p> <p>UPDATE: Back in 2020, I <a href=\"https://reason.com/volokh/2020/01/21/the-case-against-the-slippery-slope-case-against-impeachment/\" target=\"_blank\" rel=\"noopener\">critiqued the \"slippery slope\" argument</a> against impeaching presidents for abuses of power that aren't technically crimes. My points apply with even greater force to any such argument against impeaching appointed officials, like Hegseth. In their case, there is no argument they have some kind of popular mandate from the electorate.</p>"},{"title":"Microsoft’s own upscaler and alternative to FSR just landed on Xbox Ally X handhelds - actually uses an NPU for something useful","source":"PC Gamer","author":"Jacob Fox","url":"https://www.pcgamer.com/hardware/handheld-gaming-pcs/microsofts-own-upscaler-and-alternative-to-fsr-just-landed-on-xbox-ally-x-handhelds-actually-uses-an-npu-for-something-useful/","category":"gaming","categoryLabel":"Gaming","wordCount":642,"readingTime":4,"content":"<p>A few months ago, Microsoft opened up <a href=\"https://www.pcgamer.com/hardware/handheld-gaming-pcs/rog-xbox-ally-x-owners-can-now-choose-between-amds-fsr-upscaler-or-microsofts-npu-powered-auto-sr-for-better-performance-though-only-for-docked-gaming/\" target=\"_blank\" rel=\"noopener\">Auto SR support for the Asus ROG Xbox Ally X</a>, allowing it to use the AI-aided upscaling tech to improve frame rates in games. But that was only for people using a Preview version of Windows, and you could only enable it when the handheld was in docked mode. Now, <a href=\"https://devblogs.microsoft.com/directx/autosr-performance-mode/\" target=\"_blank\" rel=\"noopener\">Auto SR has officially launched</a> in the main Windows OS for the Xbox Ally X and X20; plus, you can now run it when undocked.</p><p>The first question you might have is, 'Why would I use Auto SR instead of FSR?' The answer is: 'You wouldn't.'</p><p>You'll primarily use Auto SR for games that don't have FSR baked in by the devs, or when the FSR implementation doesn't work well for some reason. It should, in theory, actually give you better performance than FSR, assuming you have an NPU on board (like the Xbox Ally X and X20 do). That's because it uses the NPU rather than the GPU for its upscaling shenanigans, which frees up the GPU for other work.</p><p>FSR, however, is still preferred when possible, as it will look closer to what the game should look like.</p><p>When Auto SR originally came to the Xbox Ally X earlier in the year, you could only enable it in docked mode, presumably in part because that allows for more power draw for the APU (including the NPU that does the upscaling work). Microsoft explains the official reason, however, as being \"because that’s where Auto SR makes the biggest difference: 1440p-like detail alongside smooth framerates on larger screens where every frame matters.\"</p><p>Now, you can enable it when running on battery.</p><p>You can also use it with games running at 1080p and at a higher frame rate. Before, you could only run Auto SR up to 60 or 75 fps, but in a new 'Performance Mode', you can get up to 120 fps. Oh, and Auto HDR is supported if you're playing games that can benefit from it.</p><p>The PC Gamer Circuit Breaker newsletter breaks down the latest PC gaming tech, and finds you the best deals on the best products</p><p>The <a href=\"https://www.pcgamer.com/hardware/handheld-gaming-pcs/asus-rog-xbox-ally-x-review/\" target=\"_blank\" rel=\"noopener\">ROG Xbox Ally X</a> is actually the <a href=\"https://www.pcgamer.com/best-handheld-gaming-pc/\" target=\"_blank\" rel=\"noopener\">best handheld</a> on the market right now, by our estimation. That's in large part because its $1,000 price tag is actually very reasonable in the current, memory shortage-induced, price-inflated market. It helps that it's a decent handheld in its own right, especially thanks to its comfy grips and the new handheld Windows experience.</p><p>The <a href=\"https://www.pcgamer.com/hardware/handheld-gaming-pcs/asus-rog-xbox-ally-x20-review/\" target=\"_blank\" rel=\"noopener\">ROG Xbox Ally X20</a> is almost the same, except it has some nice additions such as an OLED screen and TMR sticks, plus better thermals. The regular version is a fair bit cheaper, though, and would be getting my vote for that reason.</p><p>At any rate, it's great to see our fave handheld getting the option for this kind of performance boost in those games that need it. Oh, and Microsoft says Auto SR will be available for \"select Windows Copilot+ PCs\", too, though I'm not entirely sure what the selection criteria is.</p>\n\n<p>Jacob got his hands on a gaming PC for the first time when he was about 12 years old. He swiftly realised the local PC repair store had ripped him off with his build and vowed never to let another soul build his rig again. With this vow, Jacob the hardware junkie was born. Since then, Jacob's led a double-life as part-hardware geek, part-philosophy nerd, first working as a Hardware Writer for PCGamesN in 2020, then working towards a PhD in Philosophy for a few years while freelancing on the side for sites such as TechRadar, Pocket-lint, and yours truly, PC Gamer. Eventually, he gave up the ruthless mercenary life to join the world's #1 PC Gaming site full-time. It's definitely not an ego thing, he assures us.</p>"},{"title":"The What and When of Longevity Dieting - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/the-what-and-when-of-longevity-dieting-1286564/","category":"fun","categoryLabel":"Interesting Reads","wordCount":523,"readingTime":3,"content":"<p>“Eat less to live longer” might be a good rule of thumb, but it’s horrible  in practice. While animals living in laboratories may enjoy longer lives on calorie-restricted diets, humans living in the wild don’t enjoy starving themselves. To thread the needle, a new review <a href=\"http://dx.doi.org/10.59717/j.xinn-nutri.2026.100034\" target=\"_blank\" rel=\"noopener\">published</a> in <em>Innovation Nutrition</em> advances a longevity diet based on precision nutrition, with different recommendations for different ages.</p><p>Calorie restriction amounts to taking an axe to your diet, but this new approach argues for using a scalpel instead. Drawing on more than 30 longitudinal studies and meta-analyses of research on both humans and animals, the researchers sought to mimic the lifespan-boosting benefits of calorie restriction without the drawbacks. So they focused on finding the proper proportions and sources of macronutrients (protein, carbohydrates, fat, and fiber) to min-max the molecular mechanisms of our metabolisms. </p><p><strong>Read more: “</strong><a href=\"https://nautil.us/longevity-research-has-a-bullshit-problem-1285933\" target=\"_blank\" rel=\"noopener\"><strong>Longevity Research Has a Bullshit Problem</strong></a><strong>”</strong></p><p>The result is a dietary framework that changes with age. Take protein, for example. According to the team, eating more animal protein during midlife correlates with a higher mortality rate (but not for plant-based protein), but after age 65, the relationship flips. As risks from muscle loss and frailty increase during old age, our protein intake should ramp up to combat them. We should get that protein from fish, legumes, and other sources, the researchers say. </p><p>Carbohydrates showed a J- or U-shaped relationship with mortality. The team found that risk of premature death was lowest in the middle of the graph, with 50 to 55 percent of the diet coming from carbs and emphasized that the source was important. Low-glycemic, plant-based, high-fiber carbohydrates from whole grains, legumes, vegetables, and whole fruits were much more conducive to a long life compared to refined grains and sugars. </p><p>The quality of fats was more important than the quantity, the researchers found. Polyunsaturated fats and monounsaturated fats from nuts, olive oil, and fish were linked to better cardiovascular health, while saturated and trans fats were linked to reduced mortality. One study found that swapping just 5 percent of energy from saturated fats to polyunsaturated fats was associated with a 25 to 42 percent reduction in coronary heart disease. </p><p>Fiber showed the most consistent link to longevity for all age groups. Our gut microbiome ferments fiber into short-chain fatty acids like butyrate that protect against creeping inflammation as we age. Altogether, higher fiber intake was associated with a 10 to 23 percent reduction in all-cause mortality, with fiber from plants and cereals showing the biggest gains. </p><p>Of course, your diet is a vital component of healthy aging and a longer life, but it’s not the only one. Proper sleep, exercise, and hydration are also important pieces of the longevity puzzle. To drive that point home, the team proposed their own “Dietary and Lifestyle Pyramid of Longevity” with these healthy practices providing a sturdy foundation. </p><p>The good news is that if we all follow it, we may live long enough to see a graphical representation of dietary recommendations in a shape that’s <a href=\"https://nautil.us/theres-a-new-international-food-pyramid-in-town-1286121\" target=\"_blank\" rel=\"noopener\">not a pyramid</a>. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: luigi giordano / Shutterstock</em></p>"}];

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';

  var hasMore = articles.length > 1;

  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;

    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
