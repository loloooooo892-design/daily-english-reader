<script>
var articles = [{"title":"After Six Months of War, Trump Is Still Losing to Iran","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/global-notes/after-six-months-of-war-trump-is-still-losing-to-iran","category":"fun","categoryLabel":"Interesting Reads","wordCount":1482,"readingTime":8,"content":"<p>Spare a thought for the sailors of the U.S.S. Abraham Lincoln. As the United States’ campaign against Iran drags on, their deployment aboard the aircraft carrier has already lasted months longer than planned, and has spawned myriad news reports about deteriorating conditions—including dwindling supplies of food and potable water—and fraying morale. Last week, citing relatives of service members, the <em>Military Times</em> <a href=\"https://www.militarytimes.com/news/your-military/2026/08/11/multiple-uss-abraham-lincoln-sailors-have-tried-to-go-overboard-amid-extended-deployment-families-say/\" target=\"_blank\" rel=\"noopener\">reported</a> that at least two people on the Lincoln had attempted to jump overboard. After touring the vessel over the weekend, Admiral Brad Cooper, the head of Central Command, acknowledged “uniquely challenging and tough” circumstances, but he also <a href=\"https://www.washingtonpost.com/world/2026/08/16/us-commander-calls-mental-health-priority-after-he-visits-uss-lincoln/\" target=\"_blank\" rel=\"noopener\">described</a> “many elements” of the grim situation as “old news” that had already been addressed; President Donald Trump branded the whole discussion as “fake news.” Defense Secretary Pete Hegseth said that conditions had been “completely misrepresented” and told reporters that the United States could maintain its ongoing naval blockade of Iranian ports “indefinitely.”</p><p>Spare a thought, too, for the Iranian people, who have been on <a href=\"https://www.washingtonpost.com/world/2026/08/16/us-commander-calls-mental-health-priority-after-he-visits-uss-lincoln/\" target=\"_blank\" rel=\"noopener\">the receiving end</a> of 1.5 million pounds of ordnance dropped, in some ten thousand sorties, by the forces aboard the Lincoln since late February, when Trump started a war, alongside Israel, to topple the Islamic Republic. Six months later, it’s hard to view the outcome of the conflict as anything other than a profound strategic defeat for the United States. The year had begun with mass anti-government protests in cities across Iran, spurred by the theocratic regime’s mismanagement of the economy, which has also been saddled for years with crippling U.S. sanctions. The protests were brutally quashed by authorities. Then came the bombardments by U.S. and Israeli forces, which <a href=\"https://www.newyorker.com/news/the-lede/what-ayatollah-ali-khamenei-meant-to-iran-and-what-comes-next\" target=\"_blank\" rel=\"noopener\">assassinated</a> Iran’s octogenarian Supreme Leader, Ayatollah Ali Khamenei, and a number of his cadre; degraded its Air Force and Navy; and struck schools, universities, and <a href=\"https://www.theguardian.com/global-development/2026/mar/05/at-least-dozen-hospital-and-health-facilities-in-iran-hit-since-us-israel-attacks-began-who-says\" target=\"_blank\" rel=\"noopener\">health facilities</a>, while killing more than three thousand civilians in the first weeks of the campaign. The surviving regime, in turn, hunkered down and used its asymmetric capabilities to <a href=\"https://www.newyorker.com/news/global-notes/the-spectacular-failure-and-ruinous-costs-of-the-iran-war\" target=\"_blank\" rel=\"noopener\">close the crucial Strait of Hormuz</a>, <a href=\"https://www.newyorker.com/news/the-lede/trump-iran-and-the-shadow-of-suez\" target=\"_blank\" rel=\"noopener\">weaponizing the country’s geography</a> in ways it hadn’t done before, in order to exact its own toll on the global economy and heap pressure on Washington.</p><p>Now none of the initial aims touted by Trump—including the shuttering of Iran’s nuclear program and the dismantling of its ballistic-missile capabilities—have been realized; instead, the U.S. finds itself trying to figure out how to deprive Iran of a tool—the strait—that is in play only because of Trump’s intervention. Despite recently <a href=\"https://www.nytimes.com/2026/08/19/business/iran-hormuz-oman-us-navy.html\" target=\"_blank\" rel=\"noopener\">reported</a> initiatives by Trump and his allies, oil and other critical supplies are still <a href=\"https://www.politico.com/news/2026/08/17/the-trump-administration-says-oil-is-surging-through-hormuz-the-data-doesnt-add-up-01039335\" target=\"_blank\" rel=\"noopener\">not moving freely</a> through the waterway, and gas prices remain high. Iran still strikes at tankers, and expects some form of control over the strait to endure even after a diplomatic settlement. Iran has also continued its crackdown on the opposition; <a href=\"https://www.bbc.com/news/articles/c75gvzxrz49o\" target=\"_blank\" rel=\"noopener\">according to the United Nations</a>, executions of political prisoners and dissidents are surging. Trump told Iran’s citizens early on that “help is on its way,” but all that has come for them has been destruction, deeper economic pain, and the renewed repression of a regime that knows, better than anything else, how to preserve itself.</p><p>Iran’s leadership is defiant. On Tuesday, Mohammad Bagher Ghalibaf, the country’s parliamentary speaker, <a href=\"https://x.com/IranIntl_En/status/2089651913042145453\" target=\"_blank\" rel=\"noopener\">said</a> that the strait would remain closed until Iranian assets frozen abroad were released, sanctions on Iranian oil were dropped, and U.S. and Israeli military operations fully ceased. A new round of hard-line appointments to top security posts by the new Supreme Leader, <a href=\"https://www.newyorker.com/news/the-lede/what-the-selection-of-irans-new-leader-might-mean-for-the-war\" target=\"_blank\" rel=\"noopener\">Ayatollah Mojtaba Khamenei</a>—who has been in hiding since his father, the former leader, was killed—<a href=\"https://www.nytimes.com/2026/08/17/world/middleeast/iran-khamenei-military-leaders-war.html?unlocked_article_code=1.6FA.C3g8.eC877uKrM28l&amp;smid=tw-share\" target=\"_blank\" rel=\"noopener\">may be a sign</a> that the regime is prepared to wait out whatever Trump can muster. “Iran has come out of the war far stronger, not only in terms of regime stability, but more broadly, in terms of the self-confidence that it has,” Vali Nasr, a professor of Middle East studies and international affairs at Johns Hopkins, told me. “So the glass for Iran is definitely half full, and, even if we don’t use definitive adjectives like ‘winning’ and ‘losing,’ it’s very clear that it’s half empty for the Americans.”</p><p>Trump came into the war on a high. The relative ease of his operation to <a href=\"https://www.newyorker.com/news/the-lede/regime-change-in-americas-back-yard\" target=\"_blank\" rel=\"noopener\">remove</a> Nicolás Maduro, the Venezuelan President, from office likely convinced him of the overwhelming primacy of American power. The conflicts that unfurled in the wake of the war in Gaza had also exposed Iran’s many vulnerabilities: Iranian proxies were toppled in Syria and humbled in Lebanon, and Israeli intelligence has repeatedly conducted successful assassination and sabotage missions within Iran. But Trump was overconfident and now finds himself unable to end a war that none of Iran’s neighbors wanted him to start.</p><p>American power has also been perceptibly diminished. The U.S. has burned through inventories of precision-guided and air-defense munitions, and seen its array of military bases in the region come under significant Iranian fire—which has also inflicted damage to civilian and energy infrastructure across the region. Some countries, such as the United Arab Emirates, have no love for Tehran, but recognize that Trump’s current belligerence may not be doing them any favors. A new tripartite defense alliance between Saudi Arabia, Turkey, and Pakistan—though publicly welcomed by Trump—is emblematic of a region thinking beyond the United States, and hedging against the uncertainty posed by both a resilient Iran and an aggressive Israel. “The larger shift is that Gulf capitals are no longer comfortable simply aligning behind maximum pressure. They increasingly want autonomy from both Washington and Tehran,” Alex Vatanka, the director of the Iran program at the Middle East Institute, a Washington think tank, told me. According to Nasr, “Everybody now sees America as less than it was before.” He views Trump’s travails as part of a “precipitous collapse of American power and American prestige” and says that “once this war is over, the U.S. is going to find the rest of the world much more difficult to herd around any coherent policy.”</p><p>The war is already deeply unpopular in the United States and has become a weight on Republican electoral prospects in the upcoming midterms. “Trump has trapped himself into an unwinnable war for America,” Ellie Geranmayeh, a senior policy fellow at the European Council on Foreign Relations, told me. “He seems shackled now by the sunk-cost fallacy that, because America has expended heavy resources, ammunition, and reputation in this war, it cannot pull back before a decisive win.” But Tehran seems to believe it can both outfox and outlast Trump. “Iran is now confident that it can absorb U.S. bombings, which seriously weakens any military threats the U.S. may issue in the future,” Gregory Brew, an expert on Iran and energy at the Eurasia Group, a political-risk consultancy, told me. “In addition, the U.S. now looks broadly deterred from attempting more aggressive action against Iran, cowed by the risk of sweeping Iranian retaliation.”</p><p>This week, a sixty-day deadline for the United States and Iran to resolve larger differences—set in June as part of an earlier <a href=\"https://www.newyorker.com/news/global-notes/the-spectacular-failure-and-ruinous-costs-of-the-iran-war\" target=\"_blank\" rel=\"noopener\">memorandum of understanding</a>—elapsed with little fanfare. It was a mark of the fragility (and, frankly, the unseriousness) of the diplomatic round between the two sides. On Tuesday, Trump fumed in the Oval Office, demanding Iran raise “the white flag of surrender,” while threatening <a href=\"https://www.washingtonpost.com/politics/2026/08/17/60-days-after-signing-iran-deal-trump-stuck-quagmire-peace-talks-stall/\" target=\"_blank\" rel=\"noopener\">Oman</a>—a key diplomatic intermediary—with military strikes because of its parallel negotiations with Iran over the handling of the Strait of Hormuz. He also lashed out at South Korea, justifying an astonishing decision to draw down military exercises with the country over Seoul’s apparent unhelpfulness in supporting Trump’s war in the Middle East. And then, in perhaps the most glaring illustration of his frustration, the President posted a bizarre map on Truth Social labelling the Strait of Hormuz as “U.S. territory.”</p><p>But Trump cannot “<a href=\"https://www.newyorker.com/news/letter-from-trumps-washington/will-trumps-gulf-of-america-power-trip-break-the-white-house-press-corps\" target=\"_blank\" rel=\"noopener\">Gulf of America</a>” his way out of this disaster. It is a blow that some analysts have already likened to the calamities of the Vietnam and Iraq Wars, and Iran’s leadership seems happy to continue this game of brinkmanship. “Stop waiting for the clown crew to pull a rabbit out of their hat and clean up the mess you made,” Ghalibaf said <a href=\"https://x.com/mb_ghalibaf/status/2089759296376480003\" target=\"_blank\" rel=\"noopener\">on social media</a>, in response to new threats of maximum pressure from Trump’s Cabinet officials.</p><p>Ordinary Iranians, many of whom are desperate for a change in their domestic politics and for a rapprochement with the West, have to wait. Gissou Nia, an Iranian American human-rights lawyer, lamented the absence of any “greater political strategy” from Trump that would have supported Iran’s opposition and embattled civil society—of “anything that would incentivize defections or really be able to crack this regime, which is what all of those protesters were looking for and what they risked their lives for,” she told me. Instead, Nia said, “it became clear that the only strategy from this Administration was to bomb the country.” And that strategy has failed. ♦</p>"},{"title":"nobuzz/README.md at main · adnanakil/nobuzz","source":"Hacker News Best","author":"","url":"https://github.com/adnanakil/nobuzz/blob/main/README.md","category":"tech","categoryLabel":"Technology","wordCount":576,"readingTime":3,"content":"<p>Obviously it's common knowledge by now that Anthropic has solely trained claude on old Buzzfeed articles (explaining its love for 90s nostalgia). So Claude and I built a <a href=\"https://claude.com/claude-code\" target=\"_blank\" rel=\"noopener\">Claude Code</a> skill (/debuzz) that takes Claude's last response and runs it through the Antigravity CLI (agy) to translate it from talking like a millennial clickbait to regular English. We're thinking of calling it \"Claudette\" but Cat Wu is famously litigious so it's definitely absolutely not called \"Claudette\".</p>\n<h2>The problem</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#the-problem\" target=\"_blank\" rel=\"noopener\"></a>\n<p>Claudette is our solution to Claude being a great engineer with one incurable condition: it talks like it's delivering a TED talk about its own pull request. You ask why a test is flaky and you get a \"load-bearing assumption,\" three numbered revelations, and a solemn note that the third one is <em>the most instructive yet</em>. Nothing is ever just a bug. There is always a kicker.</p>\n<p>This skill accepts that no amount of prompting fully cures this, and does the honest thing instead: it hands the response to a different model, Gemini (remember gemini from last summer?) via Google's Antigravity CLI, whose only job is to say it like a human person. Claudette has pinky promised to print Antigravity's translation verbatim, because letting Claude \"tidy up\" the translation reintroduces exactly the voice being removed.</p>\n<h2>Before / after</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#before--after\" target=\"_blank\" rel=\"noopener\"></a>\n<p><strong>Before (Claude):</strong></p>\n<blockquote>\n<p>Here's where it gets interesting: the retry logic isn't just a nice-to-have — it's - the - load-bearing - assumption - of - the - entire - sync - pipeline. Three things jumped out at me, and the third one is the most instructive yet. [...] And third — and this is the kicker — the dedupe key includes a timestamp, which means retries are never actually deduplicated.</p>\n</blockquote>\n<p><strong>After (/debuzz, colleague mode):</strong></p>\n<blockquote>\n<p>The sync pipeline's retry logic has three bugs. syncQueue.ts:142 swallows ETIMEDOUT instead of re-queuing the job. The backoff caps at 2 seconds, which is too low for mobile networks. And the dedupe key includes a timestamp, so retries are never deduplicated. Fix: strip the timestamp from the key, raise the cap to 30 seconds, and re-throw the timeout error.</p>\n</blockquote>\n<h2>Install</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#install\" target=\"_blank\" rel=\"noopener\"></a>\ngit clone https://github.com/adnanakil/nobuzz\nmkdir -p ~/.claude/skills\ncp -r nobuzz/debuzz ~/.claude/skills/\n<p>Requirements:</p>\n<ul>\n<li>Claude Code</li>\n<li>The <a href=\"https://antigravity.google/docs/cli/install/\" target=\"_blank\" rel=\"noopener\">Antigravity CLI</a> (agy) — install with curl -fsSL https://antigravity.google/cli/install.sh | bash (macOS/Linux) or irm https://antigravity.google/cli/install.ps1 | iex (Windows), then run agy once to complete the Google Sign-In flow.</li>\n</ul>\n<h2>Usage</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#usage\" target=\"_blank\" rel=\"noopener\"></a>\n/debuzz [mode] [text]\n\nMode\nAudience\nWhat you get\n\ncolleague (default)\nAn engineer\nSame content, every file path and code block intact, zero theatrics\n\nmanager\nA technical-adjacent manager\nWhat happened, why it matters, what's next — about a third the length, no code\n\ndirector\nAn executive\nThree to five sentences: outcome, impact, ask. Assumes thirty seconds of attention\n\n<p>With no text argument it translates Claude's previous reply. Paste text after the mode to translate that instead. It also triggers on natural phrases like \"say that in normal english.\"</p>\n<h2>How it works</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#how-it-works\" target=\"_blank\" rel=\"noopener\"></a>\n<p>No magic. Claudette writes its previous reply to a temp file and runs agy -p \"$(cat &lt;file&gt;) &lt;plain-English style instructions&gt;\" — agy's headless mode doesn't read stdin and won't read files outside the project, so the text goes straight into the prompt — then prints Antigravity's output verbatim. If agy errors (usually auth), you see the actual error — Claude only offers its own rewrite as a clearly labeled fallback, because a debuzzer that quietly asks the buzzer to debuzz itself is how you end up with a load-bearing translation.</p>\n<h2>License</h2><a href=\"https://github.com/adnanakil/nobuzz/blob/main/README.md#license\" target=\"_blank\" rel=\"noopener\"></a>\n<p>MIT</p>"},{"title":"Appendix to Civil Rights Deserts Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/civil-rights-deserts-appendix/","category":"law","categoryLabel":"Law","wordCount":1356,"readingTime":7,"content":"<ul>\n        <li>Volume 139</li>\n        <li>Issue 8</li>\n        <li>June 2026</li>\n        \n      </ul>\n      \n<p>We searched for all federal cases filed in or removed to the Southern District of Mississippi between January 1, 2007, and December 31, 2022.  Our search was for cases that included “Hinds County” as a party and the word “jail” somewhere in the documents.  This search produced a total of seventy-five cases for the sixteen-year period.  We then reviewed the complaints, when available, and tracked those cases that challenged conditions at the Hinds County facilities, which generally concerned assaults by staff or prisoners, inadequate medical care, or unhealthy conditions.  We removed cases solely challenging a conviction or length of sentence, or solely challenging unconstitutional conduct during the course of an arrest.</p>\n<p>A total of fifty-six cases challenged conditions at Hinds County facilities during this sixteen-year period, including eleven cases filed after the DOJ filed suit.  Several make extended references to the facts unearthed during the course of the DOJ litigation.  Four of those eleven (36.4%) were pro se throughout their litigation, and seven out of those eleven (63.6%) had counsel.  Five of those eleven (45.5%) cases settled.  In contrast, between 2007 and June 23, 2016 (when the DOJ case was filed), there were forty-four cases filed challenging conditions at the Hinds County facilities.  Thirty-two of the plaintiffs were pro se throughout (72.7%), and twelve had counsel at some point during the litigation (27.3%).  Seven of the forty-four settled (15.9%).  The cases are provided in order of filing date, beginning with the most recent.</p>\n<p>*\t*\t*</p>\n<ol>\n<li>Palmer v. Jefferson, 22-cv-00508 (Sep. 1, 2022), counselled, Jordan, C.J., settled (Apr. 15, 2025).  </li>\n<li>Sheriff v. City of Jackson, 22-cv-00392 (July 8, 2022); counselled, Lee, J., judgment on pleadings granted (Nov. 30, 2023).</li>\n<li>Miller v. Jackson Fire Dep’t, 21-cv-00608 (Sep. 21, 2021), pro se, Lee, J., dismissed for failure to prosecute (Nov. 15, 2022).</li>\n<li>Gross v. Walls, 21-cv-00345 (May 18, 2021), pro se, Reeves, J., dismissed without prejudice (Dec. 21, 2021). </li>\n<li>Givens v. Hinds County, 20-cv-00042 (Jan. 22, 2020), counselled, Lee, J., dismissed without prejudice (July 6, 2022).</li>\n<li>Cleveland v. Hinds County, 19-cv-00486 (July 10, 2019), counselled, Reeves, J., settled (Feb. 3, 2021).</li>\n<li>Veal v. Hinds County, 19-cv-00485 (July 10, 2019), counselled, Reeves, J., settled (Feb. 3, 2021).</li>\n<li>Smith v. Clinton Police Dep’t, 19-cv-00406 (June 12, 2019), pro se, Wingate, J., dismissed without prejudice (July 17, 2020).</li>\n<li>Wade v. Hinds County, 19-cv-00193 (Mar. 19, 2019), counselled, Reeves, J., settled (Oct. 21, 2020).</li>\n<li>Neal v. Hinds County, 18-cv-00590 (Aug. 28, 2018), counselled, Reeves, J., settled (May 7, 2021).</li>\n<li>Davis v. Hinds County, 16-cv-00674 (Aug. 29, 2016), pro se, Jordan, J., summary judgment granted to defendants (Jan. 7, 2019).</li>\n<li>United States v. Hinds County, 16-cv-00489 (June 23, 2016) (DOJ lawsuit).</li>\n<li>Mungia v. Hinds Cnty. Det. Ctr. Bd. of Supervisors, 16-cv-00054 (Jan. 29, 2016), pro se, Lee, J., dismissed without prejudice (Jan. 3, 2017). </li>\n<li>Davis v. Hinds County, 15-cv-00874 (Dec. 4, 2015), pro se, Reeves, J., dismissed for failure to prosecute (Aug. 20, 2018).</li>\n<li>Rucker v. UMC Resident Surgeon &amp; Staff, 15-cv-00430 (June 15, 2015), pro se, Walker, J., summary judgment granted to defendants (Feb. 23, 2018).</li>\n<li>Bennett v. Hinds County, 14-cv-00753 (Sep. 25, 2014), counselled, Jordan, J., settled (Aug. 26, 2015).</li>\n<li>Burnett v. Hinds County, 14-cv-00651 (Aug. 19, 2014), counselled, Reeves, J., summary judgment granted to defendants (Oct. 2, 2017).</li>\n<li>Smith v. Townsend, 14-cv-00573 (July 28, 2014), pro se, Anderson, Mag. J., summary judgment granted to defendants (Mar. 9, 2016).</li>\n<li>Bonner v. Hinds Cnty. Det. Ctr., 14-cv-00488 (June 24, 2014), pro se, Ball, Mag. J., summary judgment granted to defendants (Mar. 30, 2016).</li>\n<li>Lewis v. Hinds C while summary judgment motions pending (Oct. 20, 2017).</li>\n<li>Anderson v. Brumfield, 09-cv-00278 (May 6, 2009), pro se, Jordan, J., dismissed for failure to prosecute (Sep. 10, 2009).</li>\n<li>Adams v. Hinds County, 09-cv-00151 (Mar. 12, 2009), pro se, Ball, Mag. J., dismissed sua sponte as frivolous (May 21, 2010).</li>\n<li>White v. McMillin, 09-cv-00120 (Feb. 27, 2009), counselled, Jordan, J., settled (Aug. 6, 2012).</li>\n<li>Thomas v. Hinds Cnty. Det. Ctr., 08-cv-00778 (Dec. 24, 2008), pro se, Wingate, J., summary judgment granted to defendants (Nov. 30, 2009).</li>\n<li>Rutland v. McMillin, 08-cv-00763 (Dec. 12, 2008), counselled, Jordan, J., settled (May 2, 2012).</li>\n<li>Adams v. Hinds Cnty. Sheriff’s Dep’t, 08-cv-00644 (Nov. 24, 2008), pro se, Jordan, J., dismissed sua sponte (Jan. 13, 2009).</li>\n<li>Singleton v. Haynes, 07-cv-00667 (Nov. 14, 2007), pro se, Sumner, Mag. J., judgment for defendant after bench trial (Mar. 25, 2009).</li>\n<li>Burnley v. Hinds County, 07-cv-00599 (Oct. 9, 2007), counselled, Lee, J., settled (May 1, 2008).</li>\n<li>Stern v. Hinds Cnty. Det. Facility, 07-cv-00348 (June 19, 2007), pro se, Jordan, J., motion to dismiss granted (Sep. 24, 2010). </li>\n</ol>"},{"title":"Robot Olympics runner bravely sprints headfirst into wall and collapses in shower of sparks, is not a metaphor","source":"PC Gamer","author":"Lincoln Carpenter","url":"https://www.pcgamer.com/hardware/robot-olympics-runner-bravely-sprints-headfirst-into-wall-and-collapses-in-shower-of-sparks-is-not-a-metaphor/","category":"gaming","categoryLabel":"Gaming","wordCount":625,"readingTime":4,"content":"<p>Robots are just PCs that can walk around, and these days they're doing a lot more than just going for a stroll. Christopher Livingston doesn't trust them, not one bit, and is reporting on their movements monthly—and this month, Lincoln Carpenter did it, too.</p><p>This week, Beijing will host the second annual World Humanoid Robot Games. Gaining initial attention last year as a sort of <a href=\"https://www.smithsonianmag.com/smart-news/worlds-first-robot-olympics-features-soccer-kickboxing-and-lots-of-falling-down-180987199/\" target=\"_blank\" rel=\"noopener\">inaugural robot Olympics</a>, the event features thousands of humanoid robots operated by hundreds of teams, competing in over 50 events ranging from weightlifting to simulated fire rescue.</p><p>This year, the World Humanoid Robot Games is once again generating buzz, thanks to a circulating video showing one of its competing robot runners experiencing a spectacular malfunction as it sprints at full speed into a barrier with reckless disregard for anything other than moving fast—an incident that is in no way a metaphor for the state of current technological endeavor.</p><p>As the WHRG organizers explain <a href=\"https://www.whrgoc.com/about\" target=\"_blank\" rel=\"noopener\">on its website</a>, its 50 events are divided into competition events and scenario-based events. The latter scores robots on their ability to perform tasks in specific settings, like retail, food and beverage service, with robots that complete those tasks fully autonomously earning a higher score than those being controlled remotely.</p><p>Competition events, meanwhile, are a selection of more traditional pseudo-athletic contests, where the humanoid robots autonomously compete in familiar, olympic-style events like long jump, gymnastics—and track races.</p><p>The recorded robotic carnage in question purportedly emerged from a \"training session\" for one of the WHRG's track events. By the time the video starts, the lone robotic runner on the track is already at a dead sprint, its rubberized feet loudly clomping as it pumps its flailing limbs with a furious, almost juvenile intensity—an intensity so singular that the robot makes no attempt to change its course before it charges directly into a safety barrier, its head colliding with an echoing thud.</p><p>The robot then stumbles backwards, its feet bicycling in cartoonish \"woowoowoowoowoo!\" fashion in a vain attempt to forestall the cruel effects of gravity, until its flailing causes it to arc its torso backwards right at the moment of impact. As a result, its waist joint is wrenched into gruesome overextension, causing a spray of sparks and smoke to burst from its interior mechanisms. A nearby member of the event staff flinches away from the explosion, turning his back on the fallen competitor and abandoning it as a lost cause.</p><p>You can also watch it in <a href=\"https://www.reddit.com/r/humanoidrobotics/comments/1vtv5lo/this_training_for_the_world_humanoid_robot_games/\" target=\"_blank\" rel=\"noopener\">three separate angles at once</a>. If you want.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>It's a grisly scene—but it's thankfully not freighted with any symbolic meaning. It's an isolated malfunction, not a poignant encapsulation of the apparatus of the countless disciplines arrayed in pursuit of accelerating autonomous technologies as fast as possible, without considering what the point of a sprint is if you're on fire when you stop moving. It's not downstream of the same impulses making LLMs that <a href=\"https://www.pcgamer.com/software/ai/copilot-was-bamboozled-into-revealing-how-to-hack-itself-security-researchers-claim-copilot-wasnt-breached-it-was-played/\" target=\"_blank\" rel=\"noopener\">hack themselves</a> and <a href=\"https://www.pcgamer.com/software/ai/anthropic-sees-openai-cybersecurity-disaster-and-says-hold-my-beer-reveals-it-accidentally-hacked-3-companies-in-as-many-months-without-noticing/\" target=\"_blank\" rel=\"noopener\">each other</a> when they shouldn't, or <a href=\"https://www.pcgamer.com/software/ai/mark-zuckerbergs-rambling-ai-manifesto-is-6-434-words-of-high-handed-platitudes-and-dubious-conclusions/\" target=\"_blank\" rel=\"noopener\">CEOs writing manifestos</a> to defend their pervert goggle enterprise.</p><p>It's just good old competition, and it's an honor to compete.</p>\n\n<p>Lincoln has been writing about games for 12 years—unless you include the essays about procedural storytelling in Dwarf Fortress he convinced his college professors to accept. Leveraging the brainworms from a youth spent in World of Warcraft to write for sites like Waypoint, Polygon, and Fanbyte, Lincoln spent three years freelancing for PC Gamer before joining on as a full-time News Writer in 2024, bringing an expertise in Caves of Qud bird diplomacy, getting sons killed in Crusader Kings, and hitting dinosaurs with hammers in Monster Hunter.</p>"}];
