*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;

}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

<script>
var articles = [{"title":"Club Soko is cartoonishly dark puzzle game that's both splattered with beer and, I've realised, a totally wonderful twist on the genre","source":"Eurogamer","author":"Christian Donlan","url":"https://www.eurogamer.net/club-soko-impressions-cartoonishly-dark-sokoban-puzzle-game","category":"gaming","categoryLabel":"Gaming","wordCount":660,"readingTime":4,"content":"<p>All eyes on us.</p>\n    \n  \n  \n  \n  \n            <p>Sokoban games are those puzzlers that are all about pushing blocks around. They're spatial challenges at their most fiendish. I gather that the original Sokoban took place in a warehouse, and you were shifting crates back and forth. The latest iteration I've played is set in a nightclub, and that turns out to be a truly inspired choice of location.</p>\n<p>There are a couple of reasons why Club Soko has clicked with me quite so well. The first is just the sheer thrill of delivery. This is a nightclub delivered through goofy cartoon characters with thick felt pen outlines, and you can hear the expectant thud of music echoing through walls from the loading screen. Each suite of challenges sees you navigating a series of dance floors, with success leading you to a trap door that takes you deeper down into this dark, sticky complex. There's something gloriously oppressive at work, in other words: the crowd pushes close, you feel the building and its tiers of dance floors stacked high above you. All of Club Soko kind of leers in at you with a goofy grin as you play.</p>\n<p>But it's not just the presentation. One of the things I often struggle with in the information-rich worlds of Sokoban games is remembering what the various parts of each level do. You're basically given a grid in these games, and you need to clear a path through it. Because this grid is a dance floor in Club Soko, most of the obstacles are other dancers or members of staff. For some reason, this oddball personification makes it easier for me to keep track of how everything works.</p>\n\n<p>So bouncer types will push you away from the squares immediately next to them. A certain kind of clubber will grab you and move you one square to the left, while another will move you one square up. Later on you get metallers who will collide with you when you enter their row and rush you all across the screen until you reach an obstacle and stop. Learning how to navigate worlds filled with combinations of all these people is the main event here.</p><p>And because there's always a hatch square that you're aiming for, a good starting strategy is to work backwards. I know that hatch square is guarded by a bouncer, so I'm going to need to push an obstacle into position on the other side, so the bouncer can't push me away. But that obstacle is guarded by another bouncer, or one of the metallers... Onwards and outwards, I plan approaches, working my way around the grid, remembering that core rule of Sokobans in general: you can push obstacles but cannot pull them.</p>\n\n<p>1 of 3 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Compact levels means that I'm never too overwhelmed by the challenges I face, and the pushing and shoving that makes up the game is delivered with some wonderfully rubbery animation. It's a game of being jostled relentlessly by a crowd that sort of doesn't know that you're trying to be a part of it. Sokoban games often have an intellectual fingerprint in the way that they like to arrange their specific challenges, but this one has a genuine feel to it as well, a sweaty, elbowy texture.</p><p>All of this is great, but what really sells me each time I play is the amount of secrets the game contains. If you can get off the grid of the dancefloor, you can often pick a path through the crowd and find a secret exit leading to a secret level. Some of these are wildly challenging - the ones with the mimes who mirror each move you make are particularly brutal.</p>\n\n<p>But these secrets also tie into the theme so beautifully. You're exploring this weird, dark club, with music pulsing through the walls and glow sticks crushed underfoot. Who knows what kind of hidden spaces a place like this might contain?</p>"},{"title":"Top Breville Promo Codes: $700 Off This August 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/breville-promo-code/","category":"tech","categoryLabel":"Technology","wordCount":593,"readingTime":3,"content":"<p>I can’t blame you for wanting a Breville promo code. Breville makes the <a href=\"https://www.wired.com/story/best-latte-and-cappuccino-machines/\" target=\"_blank\" rel=\"noopener\">best latte machines</a>, <a href=\"https://www.wired.com/gallery/best-espresso-machines/\" target=\"_blank\" rel=\"noopener\">espresso machines</a>, and countertop appliances, and a Breville coupon makes them more affordable. The brand even makes good <a href=\"https://www.wired.com/gallery/best-toaster-ovens/\" target=\"_blank\" rel=\"noopener\">toaster ovens</a> and <a href=\"https://www.wired.com/gallery/best-blender/\" target=\"_blank\" rel=\"noopener\">blenders</a>. We’ve tested dozens of Breville appliances which are featured in numerous buying guides, and if you’re on the hunt for a Breville discount code, you’re in the right place.</p><h2>Shop the Breville Sale for Up to $300 Off</h2><p>This <a href=\"https://cna.st/affiliate-link/4pDSKR9fHyZqTp39e4j82Z2RHsHpr62Sy9fkuYRiM2ev33tbpuCrPDAWngbqvK6GHubXbCeacTFu45VPsxPWLB4mT2PGgeaC44apbr1n9jWXei1WcT9Fwg5VSQ9CqMxvFnXYyKERKSzE4N2mMWzQwjySHFaqmHa4kUFMBJmA4JUMZqkJevvmWTNPKTG2Qx4hnqC4gmwa92ES7RwyCVfu83qXkLKXHq18WGPqbdhR6JV1g5VJx3Kn21iERAU5xojs5iFF79pjGF92Rxe7SvAf1u3vx4ASwcarenKuWJDdV8cCgQPDh8SWvST7T\" target=\"_blank\" rel=\"noopener\">Breville sale</a> is a great way to save. Snag some Breville deals and get up to $300 off a variety of appliances like <a href=\"https://www.wired.com/gallery/best-espresso-machines/\" target=\"_blank\" rel=\"noopener\">espresso machines</a> and <a he <a href=\"https://www.wired.com/gallery/best-espresso-machines/\" target=\"_blank\" rel=\"noopener\">best espresso machines</a> must thread a delicate needle. Espresso is forceful and finicky, and a little intimidating, and yet so essential that astronauts might take it into orbit. However, not everyone wants to also buy a good <a href=\"https://www.wired.com/gallery/best-coffee-grinders/\" target=\"_blank\" rel=\"noopener\">coffee grinder</a> or spend four figures for their morning cup. For those who want milk-based drinks and a built-in grinder, we recommend the top-selling Breville Barista Express as the Goldilocks machine balancing performance and cost. For an entry-level device, we recommend the straight-ahead Breville Bambino, among the lowest-cost machines with PID-controlled temperature.</p><p>Needless to say, we are huge fans of Breville’s espresso and coffee machines, with Breville models topping our list every time. Be sure to check out the latest and greatest <a href=\"https://cna.st/affiliate-link/3aDLD4v8PzjSrfXUvrXgLMBhdBoYpvy6kGqdj1qsu27mT1W5CKMdwWYC3kjWRxofWJoBNFKURCxxZ1xb5e2RePYFkm2wKtzSqDvypLzpc2L1mTU5VxxpiZ7YRDABCmRfrQHag7NYL3SHwtMMjcF7kweNVH9FAm9pAxcra4F6CuNAZMAfNFW9CeaCEdwCdHTujASxwk2ApaAnQSFCteiCNnnkR6USK32KJ7ZAzYdVugbKPH7C6q7Wzr1DhGJ3U4JNYFWBqwFpNFeWpHauFg8Dod4Mh3s3EEnC3czLfqMkyLg4HsHWSPQbf\" target=\"_blank\" rel=\"noopener\">Breville Nespresso Coffee Machines</a> so you can start every day out right.</p><p>Breville</p><h3>Barista Express</h3><p>Breville</p><h3>Bambino</h3>"},{"title":"Appendix to Civil Rights Deserts Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/civil-rights-deserts-appendix/","category":"law","categoryLabel":"Law","wordCount":1356,"readingTime":7,"content":"<ul>\n        <li>Volume 139</li>\n        <li>Issue 8</li>\n        <li>June 2026</li>\n        \n      </ul>\n      \n<p>We searched for all federal cases filed in or removed to the Southern District of Mississippi between January 1, 2007, and December 31, 2022.  Our search was for cases that included “Hinds County” as a party and the word “jail” somewhere in the documents.  This search produced a total of seventy-five cases for the sixteen-year period.  We then reviewed the complaints, when available, and tracked those cases that challenged conditions at the Hinds County facilities, which generally concerned assaults by staff or prisoners, inadequate medical care, or unhealthy conditions.  We removed cases solely challenging a conviction or length of sentence, or solely challenging unconstitutional conduct during the course of an arrest.</p>\n<p>A total of fifty-six cases challenged conditions at Hinds County facilities during this sixteen-year period, including eleven cases filed after the DOJ filed suit.  Several make extended references to the facts unearthed during the course of the DOJ litigation.  Four of those eleven (36.4%) were pro se throughout their litigation, and seven out of those eleven (63.6%) had counsel.  Five of those eleven (45.5%) cases settled.  In contrast, between 2007 and June 23, 2016 (when the DOJ case was filed), there were forty-four cases filed challenging conditions at the Hinds County facilities.  Thirty-two of the plaintiffs were pro se throughout (72.7%), and twelve had counsel at some point during the litigation (27.3%).  Seven of the forty-four settled (15.9%).  The cases are provided in order of filing date, beginning with the most recent.</p>\n<p>*\t*\t*</p>\n<ol>\n<li>Palmer v. Jefferson, 22-cv-00508 (Sep. 1, 2022), counselled, Jordan, C.J., settled (Apr. 15, 2025).  </li>\n<li>Sheriff v. City of Jackson, 22-cv-00392 (July 8, 2022); counselled, Lee, J., judgment on pleadings granted (Nov. 30, 2023).</li>\n<li>Miller v. Jackson Fire Dep’t, 21-cv-00608 (Sep. 21, 2021), pro se, Lee, J., dismissed for failure to prosecute (Nov. 15, 2022).</li>\n<li>Gross v. Walls, 21-cv-00345 (May 18, 2021), pro se, Reeves, J., cv-00450 (June 6, 2014), counselled, Lee, J., settled (July 28, 2015).</li>\n<li>Mack v. Hinds Cnty. Bd. of Supervisors, 14-cv-00415 (May 22, 2014), pro se, Anderson, Mag. J., summary judgment granted to defendants (Sep. 29, 2016). </li>\n<li>Montgomery v. Miss. Dep’t of Corr., 14-cv-00079 (Jan. 30, 2014), pro se, Jordan, J., dismissed sua sponte (Mar. 18, 2014).</li>\n<li>Simmons v. Lewis, 13-cv-00624 (Oct. 7, 2013), pro se, Anderson, Mag. J., directed verdict granted to defendants after bench trial (Feb. 11, 2015).</li>\n<li>Barney v. Lewis, 13-cv-00611 (Sep. 30, 2013), pro se, Anderson, Mag. J., motion to dismiss granted (Sep. 15, 2014).</li>\n<li>Gaines v. Hinds Cnty. Bd. of Supervisors, 13-cv-00203 (Apr. 8, 2013), pro se, Ball, Mag. J., motion to dismiss granted (Mar. 11, 2014).</li>\n<li>Longino v. Hinds County, 13-cv-00167 (Mar. 20, 2013), counselled, Reeves, J., motion to dismiss and summary judgment granted to defendants (Sep. 11, 2014).</li>\n<li>Gallion v. Hinds County, 12-cv-00736 (Nov. 1, 2012), counselled Jordan, J., summary judgment granted to defendants (May 27, 2015).</li>\n<li>Kelleston v. Hurst, 12-cv-00665 (Sep. 24, 2012), pro se, Anderson, Mag. J., motion to dismiss granted (Sep. 10, 2014).</li>\n<li>Cunningham v. Hinds Cnty. Sheriff’s Dep’t, 12-cv-00634 (Sep. 12, 2012), pro se, Reeves, J., motion to dismiss granted (Nov. 1, 2012).</li>\n<li>Cole v. Hinds Cnty. Det. Facility, 12-cv-00581 (Aug. 15, 2012), pro se, Ball, Mag. J., summary judgment granted to defendant (Oct. 10, 2013).</li>\n<li>Chandler v. Raymond Det. Ctr., 12-cv-00519 (July 23, 2012), pro se, Anderson, Mag. J., directed verdict granted to defendants after bench trial (Nov. 3, 2014).</li>\n<li>Wilson v. Lewis, 12-cv-00488 (July 13, 2012), pro se, Anderson, Mag. J., dismissed for failure to prosecute (Apr. 1, 2014).</li>\n<li>Cunningham v. Lewis, 12-cv-00443 (June 29, 2012), pro se, Anderson, Mag. J., summary judgment granted to defendants (Mar. 27, 2014).</li>\n<li>Lewis v. Carr, 1 ary judgment motions pending (Oct. 20, 2017).</li>\n<li>Anderson v. Brumfield, 09-cv-00278 (May 6, 2009), pro se, Jordan, J., dismissed for failure to prosecute (Sep. 10, 2009).</li>\n<li>Adams v. Hinds County, 09-cv-00151 (Mar. 12, 2009), pro se, Ball, Mag. J., dismissed sua sponte as frivolous (May 21, 2010).</li>\n<li>White v. McMillin, 09-cv-00120 (Feb. 27, 2009), counselled, Jordan, J., settled (Aug. 6, 2012).</li>\n<li>Thomas v. Hinds Cnty. Det. Ctr., 08-cv-00778 (Dec. 24, 2008), pro se, Wingate, J., summary judgment granted to defendants (Nov. 30, 2009).</li>\n<li>Rutland v. McMillin, 08-cv-00763 (Dec. 12, 2008), counselled, Jordan, J., settled (May 2, 2012).</li>\n<li>Adams v. Hinds Cnty. Sheriff’s Dep’t, 08-cv-00644 (Nov. 24, 2008), pro se, Jordan, J., dismissed sua sponte (Jan. 13, 2009).</li>\n<li>Singleton v. Haynes, 07-cv-00667 (Nov. 14, 2007), pro se, Sumner, Mag. J., judgment for defendant after bench trial (Mar. 25, 2009).</li>\n<li>Burnley v. Hinds County, 07-cv-00599 (Oct. 9, 2007), counselled, Lee, J., settled (May 1, 2008).</li>\n<li>Stern v. Hinds Cnty. Det. Facility, 07-cv-00348 (June 19, 2007), pro se, Jordan, J., motion to dismiss granted (Sep. 24, 2010). </li>\n</ol>"},{"title":"Emma Cline on Rendering the Human Experience","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/this-week-in-fiction/emma-cline-08-17-26","category":"fun","categoryLabel":"Interesting Reads","wordCount":1042,"readingTime":6,"content":"<p><strong>In your story “<a href=\"https://www.newyorker.com/magazine/2026/08/17/the-blight-fiction-emma-cline\" target=\"_blank\" rel=\"noopener\">The Blight</a>,” David Hastings, a semi-retired executive who is grappling with the onset of dementia and travelling to Switzerland for a voluntary assisted death, stops off in London to have dinner with his daughter. What made you want to inhabit the consciousness of a character in this situation?</strong></p><p>As a writer, I’m always interested in consciousness, and how to render our experience as humans on the page. With David more specifically, I was interested in how his consciousness might be shaped by the knowledge that, very soon, on a specific day and time, he will die. How can anyone really take in the enormity of that? Yet David has to, somehow, and, in the meantime, the days keep coming and he still has to decide what to eat for breakfast. That unimaginable position really drew me in. The fragmentation of dementia sometimes makes David’s consciousness more sharply attuned to things, while entire other swaths of life fall away. What remains of our living? What of ourselves stays with us? These are questions that I struggle with as a mortal person, that I think all of us have to contend with in some way. We have a lot of systems to keep our eventual end out of our awareness—and thank God, because the awareness would be paralyzing. But David has to look into that void, if only in brief flares.</p><p><strong>Like some of your other protagonists, David isn’t an entirely sympathetic character. When you fictionalized a few days in the life of Harvey Weinstein, in your story “<a href=\"https://www.newyorker.com/magazine/2020/06/08/white-noise\" target=\"_blank\" rel=\"noopener\">White Noise</a>,” in 2020, <a href=\"https://www.newyorker.com/books/this-week-in-fiction/emma-cline-06-08-20\" target=\"_blank\" rel=\"noopener\">you said</a> that you were interested in exploring his “moments of humanity, the banality and self-delusion, the recognizable foibles.” Did you have a similar impetus with David?</strong></p><p>David is a pretty mild case, compared to my Harvey character. Maybe it’s funny with Harvey in particular, but in general, with writing, I don’t think in terms of sympathy. With David, I want to show the fullness of this person, who, like most of us, has probably failed at relationships, caused harm, let people down. But who has also just been a specific person, David, with all his particular references and experiences, and who, when he departs, will take with him the totality of David. “I am a human being, and nothing human is alien to me” (I had to look up the exact line, from a play I’ve never read, but I’ve always liked the sound of it): that’s something I feel strongly about as a writer—taking it as an absolute that every person who has ever lived has had a human consciousness that is not unlike mine. So I guess there’s no person who doesn’t have my “sympathy,” in the sense that I think their experience is of a piece with the human experience.</p><p><strong>David hasn’t been the best possible father to Rebecca, and he knows it. Does his cognitive decline, ironically, allow him to see that more clearly than he did when he was healthy?</strong></p><p>Moments of vulnerability or terror can maybe make people more aware of those around them. Facing your own peril can force you to look at the networks of intimacy and support that you have, or don’t have; and maybe the deficits in those networks or relationships can become more concerning to you. But it’s possible that you don’t get as much clarity or revelation as you might want. For David, I think there’s this desire to have a “reckoning,” a teleologically satisfying experience of accounting for his life and actions. But that tidy feeling eludes him. All the tools he has used to keep himself busy and prop up his idea of who David Hastings is have fallen away, and he’s left blinking and looking around at what remains.</p><p><strong>We see the dinner through David’s eyes. Rebecca seems nervous, on edge, unsure how to communicate with him. Do you think that her take on the meal would be different from what he imagines her experience to be?</strong></p><p>Who can ever know for sure what another is experiencing? Whatever David imagines is, of course, just his imagining. She brings her own little universe to the dinner, in the same way that David does, and these universes intersect but don’t really illuminate each other in any helpful way. Or maybe there are flashes of it—of genuine understanding—but those are rare. That distance—the difficulty of truly making contact with another person from the limits of the self—interests me as a writer. David is especially marooned, a man of a certain generation in a culture that’s rapidly slipping into illegibility for him.</p><p><strong>The story is adapted from part of your forthcoming novel, “<a href=\"https://www.amazon.com/Switzy-Novel-Emma-Cline/dp/0593595246\" target=\"_blank\" rel=\"noopener\">Switzy</a>,” which gives the full arc of David’s journey to Zurich and his experience there. How did you prepare to write the book? Was there a lot of research involved?</strong></p><p>I did a lot of reading of all kinds, and watched interviews and documentaries, both about navigating dementia and about medically assisted dying. I wanted to know concrete things, like the layout of the clinic room, what art is on the walls, what the parking lot looks like. I tried to poke around other corners, too: to write about David’s life and career, I looked at boarding-school yearbooks from the sixties and tax-planning forums; and I read broadly, from Ernest Becker’s “<a href=\"https://www.amazon.com/Denial-Death-Ernest-Becker/dp/0684832402\" target=\"_blank\" rel=\"noopener\">The Denial of Death</a>” to Rilke’s “<a href=\"https://www.amazon.com/Duino-Elegies-Rainer-Maria-Rilke/dp/0393309312\" target=\"_blank\" rel=\"noopener\">Duino Elegies</a>.” I liked watching videos of Sheldon Solomon, one of the psychologists who developed terror-management theory, whose amazing Hang Ten affect softens all the terror.</p><p>I travelled to London and Zurich with no real plan except to walk around. Some details I knew immediately I’d use in the novel, and other things jumped into focus as I was writing, and were nice surprises. The entire trip was worth it to me for this one thing alone, which I probably wouldn’t have found in any book: on the road to the Zurich Airport, there are these highway signs that say “<em>AUSFAHRT</em>,” meaning “exit.” That detail clicked into the novel in a great way for me, as did countless other little sights and encounters, which all started to form a world for David in my mind. ♦</p>"}];
