*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

<script>
var articles = [{"title":"Solasta 2 is getting multiplayer and warlocks in its next update","source":"PC Gamer","author":"Jody Macgregor","url":"https://www.pcgamer.com/games/rpg/solasta-2-is-getting-multiplayer-and-warlocks-in-its-next-update/","category":"gaming","categoryLabel":"Gaming","wordCount":531,"readingTime":3,"content":"<p>Solasta II - Update 1 teaser - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/_X68swKcwxc\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>While <a href=\"https://www.pcgamer.com/games/action/the-next-big-d-and-d-game-has-been-revealed/\" target=\"_blank\" rel=\"noopener\">gameplay footage of the upcoming D&amp;D game shows off a solo warlock</a>, if you'd like to play a warlock as a member of a classic party of adventurers then Solasta 2's next update has got your back. Early access update 1 will add the warlock class and two subclasses (the timekeeper and the dreamer), as well as co-op multiplayer.</p><p>Up to four people will be able to join the same multiplayer session, whether starting a new game or joining one already in progress. The host can assign a new player an existing character, or they can bring an existing one, or create a new one on the spot. Control of companions who join your party can also be split up as you go. Every player gets a vote on the big story and dialogue choices, and there's a ping system being added to help you communicate.</p><p>New features for people like me who want an entire gang of characters to ourselves include expanded customization (with more hairstyles, tattoos, warpaint, and beards), the option to roll your stats randomly, spell component rules being made optional so you can choose between accuracy to the rulebook or something simpler, roughly 30 extra world events to find while exploring, cloud saves, and a way to switch into cautious mode while playing with a controller.</p><p>And of course the warlock, joining the current class roster of fighter, wizard, rogue, cleric, paladin, and sorcerer. Solasta 2's warlock subclasses sound a bit different to your standard hexblade/archfey options. The timekeeper can buff allies to make them act faster as well as robbing enemies of their reactions, while the dreamer controls nightmares and can inflict exhaustion on enemies as well as putting them to sleep. In both cases I suspect they'll be falling back on the classic eldritch bolt a lot, because an endless supply of decently damaging ranged magic is the warlock's whole deal.</p><p>Early access update 1 will be out on September 10, and will also include various fixes and stability improvements. The update after that, adding another class, two more ancestries, the start of act two, an increased level cap, and a crafting system, is scheduled for the last quarter of the year. Solasta 2 is currently available on <a href=\"https://store.steampowered.com/app/2975950/Solasta_II/\" target=\"_blank\" rel=\"noopener\">Steam</a>.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Jody's first computer was a Commodore 64, so he remembers having to use a code wheel to play Pool of Radiance. A former music journalist who interviewed everyone from Giorgio Moroder to Trent Reznor, Jody also co-hosted Australia's first radio show about videogames, <a href=\"https://zedgamesau.net/tag/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zed Games</a>. He's written for <a href=\"https://www.rockpapershotgun.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Rock Paper Shotgun</a>, The Big Issue, <a href=\"https://www.gamesradar.com/author/jody-macgregor/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a>, <a href=\"http://www.zam.com/author/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zam</a>, <a href=\"https://web.archive.org/web/20170606042647/http://www.glixel.com/contributor/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Glixel</a>, <a href=\"https://fiveoutoftenmagazine.com/downloads/issue-16-identity/\" target=\"_blank\" rel=\"noopener\">Five Out of Ten Magazine</a>, and <a href=\"https://web.archive.org/web/20171009125722/https://www.playboy.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Playboy.com</a>, whose cheques with the bunny logo made for fun conversations at the bank. Jody's first article for PC Gamer was about the <a href=\"https://www.pcgamer.com/the-audio-of-alien-isolation/\" target=\"_blank\" rel=\"noopener\">audio of Alien Isolation</a>, published in 2015. Jody edited PC Gamer Indie from 2017 to 2018, and he eventually lived up to his promise to play every Warhammer videogame.</p>"},{"title":"Justice Department Opines That Federal Law Allows Carrying Guns in Post Offices for Self-Defense","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/25/justice-department-opines-that-federal-law-allows-carrying-guns-in-post-offices-for-self-defense/","category":"law","categoryLabel":"Law","wordCount":1374,"readingTime":7,"content":"<p>A short excerpt from the long Justice Department Office of Legal Counsel <a href=\"https://www.justice.gov/olc/media/1457751/dl\" target=\"_blank\" rel=\"noopener\">Aug. 12 memo</a> to the Attorney General:</p>\n<blockquote><p>You have asked whether 18 U.S.C. § 930(a) … is best read to impose criminal penalties on an otherwise law-abiding individual who carries weapons into a post office for the purpose of self-defense. We would have significant constitutional concerns if Congress <em>had</em> created such a blanket ban on the lawful carrying of constitutionally protected arms into a building frequented by the public since the Founding. But we ultimately need not reach that issue here, as Congress has exempted the \"lawful carrying\" of firearms or other dangerous weapons \"incident to hunting or other lawful purposes.\" Because carrying arms for self-defense when entering a building held open to the public is a paradigmatic \"lawful purpose[],\" that exception permits the lawful carrying of constitutionally protected firearms in post offices….</p>\n<p>[S]ection 930(d)(3) provides that section 930(a)'s bar against carrying firearms and dangerous weaponry does not apply to \"the lawful carrying of firearms or other dangerous weapons in a Federal facility incident to hunting or other lawful purposes.\" 18 U.S.C. § 930(d)(3). To fall within this exception with respect to firearms, an individual must satisfy two criteria: (1) the carrying of their firearm must be \"lawful\"; and (2) the carrying must be \"incident to\" a \"lawful purpose[],\" such as \"hunting.\"</p>\n<p>The first requirement is relatively straightforward. It excludes, for example, a person who is not legally allowed to carry a gun <em>anywhere</em>…. Under federal law, this exemption would not cover, for example, a person who has been convicted of a felony or a misdemeanor crime of domestic violence, a person who has been committed to a mental institution, or a person who is in the United States illegally. It may also exclude an individual who is forbidden from carrying a firearm in the relevant state because he is not licensed—so long as the licensing regime itself is not constitutionally infirm…</p>\n<p>The second requirement is less clear but is best read to cover an individual entering a post office that is open to the public while lawfully carrying a firearm for self-defense. \"Incident,\" used as an adjective, means \"occurring or likely to occur esp[ecially] as a minor consequence or accompaniment.\" In the legal context, \"incident\" means \"depends upon, appertains to, or follows another.\"</p></blockquote>\n<blockquote><p>But section 930(d)(3) does not specify whether the \"lawful purpose\" to which the carrying of a firearm must accompany is the purpose for entering a federal building or the purpose for carrying the firearm. Read in conjunction with background principles of law, we think the better view is that an individual needs <em>both</em> a lawful purpose to be in a federal facility and a lawful purpose to carry a firearm in order for the individual to qualify for the exception in section 930(d)(3), but not necessarily that the two must be related. So understood, an otherwise law-abiding citizen who carries a constitutionally protected firearm into a post office that is generally open to the public would fall within the scope of that exception….</p>\n<p>Carrying arms for self-defense when entering a building held open to the public is a paradigmatic lawful purpose…. Unless the property owner has clearly closed the property to firearms being carried for self-defense, such carrying is presumptively lawful. Yet far from closing post offices to firearms, Congress expressly permitted the carrying of firearms incident to any lawful purpose.</p>\n<p>Interpreting \"lawful purpose\" in section 930 to include self-defense in a building held open to the public is also consistent with other rules of statutory construction. For example, take the semantic canons of <em>noscitur a sociis</em> and <em>ejusdem generis. </em>In the Second Amendment context, hunting is often paired with self-defense as an archetypal lawful purpose. <em>See, e.g.</em>, 15 U.S.C. § 7901(b)(2) (outlining Congress's purpose of \"preserv[ing] a citizen's access to a supply of firearms and ammunition for all lawful purposes, including hunting, self-defense, collecting, and competitive or recreational shooting\"). So if an individual who is not legally disabled from possessing a firearm enters a post office that is held open to the public while properly carrying a firearm for self-defense, section 930(d)(3) applies to exempt them from section 930(a)'s carrying ban, as the individual is \"lawful[ly] carrying\" a firearm \"incident to\" a \"lawful purpose[].\" …</p>\n<p>This interpretation is further supported by the canon of constitutional avoidance, which \"imposes\"—at minimum—a \"'clarity tax' on Congress\" when it legislates in ways that raise constitutional doubts…. Because [§ 930(a)] falls within the plain text of the Second Amendment, the restriction is \"presumptively unconstitutional.\" As applied to post offices that are generally open to the public, we have grave doubts that the government could carry its burden to overcome that presumption by demonstrating the restriction \"is consistent with the Nation's historical tradition of firearm regulation.\" That would be a high hurdle because, for nearly two centuries, there was <em>no</em> \"\"historical tradition of firearm regulation\" in post offices. Moreover, it is unlikely that the government would be able to overcome that hurdle by reference to the \"sensitive places\" doctrine because ordinary post offices appear to bear no legally significant resemblance to the \"\"legislative assemblies, polling places, and courthouses\" where the Court has accepted that the government may presumptively restrict firearms….</p></blockquote>\n<p>The opinion was written by Lanora C. Pettit, Principal Deputy Assistant Attorney General.</p>\n<p>UPDATE 8/25/26, 1:45 pm: Check out also the recently posted <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7262838\" target=\"_blank\" rel=\"noopener\"><em>The Post Office Was the General Store: Sensitive Functions, Absent Premises, and the Post-Office Carry Ban</em></a>, by Jonathan S. Goldstein. The Abstract:</p>\n<blockquote><p>Modern law begins from an inverted premise: the armed citizen in the post office is treated as the problem, and the gun-free federal building as the timeless baseline. The history runs the other way.</p>\n<p>It is not that the post office sat inside a store and therefore could not be sensitive. At the founding, nearly everything sat inside a store or a tavern: the Congress of the Confederation sat in the French Arms Tavern, the War Office in Fraunces Tavern, and the Supreme Court above an open-air market. The building never carried the rule. What carried the rule was the function. The founding generation designated sensitive occasions rather than sensitive addresses — Delaware in 1776 disarmed \"the said elections,\" and Virginia in 1786 disarmed the man who came before \"the justices of any court .. . doing their office\" — and no founding-era designation of the mail has been located. There was nothing to designate.</p>\n<p>Nor is the omission explained away by the government's ownership of the modern building. The statute the government enforces does not turn on ownership: § 930 reaches a building \"owned or leased\" by the United States, and when Congress described the archetypal sensitive place in the same section it named a courtroom, a jury room and the chambers of a judge, with no ownership term at all. Title is not the axis. Function is — and the function performed across a post-office counter is retail.</p>\n<p>The Post Office Act of 1792 required only that \"every deputy postmaster shall keep an office,\" and the Act of 1825 that \"every postmaster\" do so — a duty that ran in each case to the man and not to the room; there would be no federal Supervising Architect until 1852, and no division of the Department devoted to post-office quarters until the second decade of the twentieth century; and what that record establishes is not that the sovereign lacked a deed, but what a citizen crossing the threshold was walking into. He was walking into a store.</p>\n<p>After New York State Rifle &amp; Pistol Ass'n v. Bruen, the government bears the burden of producing a founding-era tradition that would justify disarming the law-abiding citizen at the post office. It must therefore produce a tradition of disarming people at a place that did what the post office did. This Article marshals the affirmative record — the Postal Service's own institutional history, federal historic-site nominations, the surviving account books of merchant-postmasters, and the practice of a postal system that itself carried, mailed, and guarded arms — and shows that the post office is among the poorest available candidates for a founding-era \"sensitive place.\" The burden is the government's, and on this record it cannot carry it.</p></blockquote>"},{"title":"“Every Weekday at 4:45 P.M.,” by Libby Flores","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/flash-fiction/every-weekday-at-445-pm-libby-flores","category":"fun","categoryLabel":"Interesting Reads","wordCount":1021,"readingTime":6,"content":"<p>Every weekday at 4:45 <em>P.M.</em> the man comes in—he never brings a list. She is usually behind the counter at the deli slicing turkey, her brown hair held back in a net underneath a maroon visor, the store’s logo in white stitching across the front.</p><p>She hears him on the phone first, his voice a smooth, low baritone: How would two people get to see each other before the summer is over?</p><p>He listens, then a tender laugh tumbles out. A laugh that circles his entire body, that blends in with the bleeps of the checkout counter, the rattle of the carts, the soft rock piping through as kids and families populate the fresh A.C. with wet hair, flip-flops, and half-bared swimsuits—hungry and searching.</p><p>Wow, he says, followed by another laugh.</p><p>Well, when will you be there?</p><p>I could figure something out.</p><p>He says this last thing a lot. The deli woman has seen the man in here before, usually with his son. She wants to glance over the stainless-steel countertop to be sure, but she waits. He is picking up bags of crostini from the display with one hand. She can hear the crinkle of the package. She knows he’s looking at them, but also not. He’s got his phone in the corner of his shoulder and is holding the red plastic basket in his other hand.</p><p>My days are terrible without you.</p><p>She hears him say something that must be a nickname. Daisy Maisey, he says, hold on.</p><p>His face appears above the counter and she almost ducks.</p><p>He orders: “Three pounds of ham and American cheese.”</p><p>I don’t, either, but the kids like it. He says not to her but to Daisy Maisey. I know, I know.</p><p>The deli woman wonders what he knows so emphatically.</p><p>The man knows that he might love this Daisy, and that Daisy is a time bomb set to destroy his life in a five-month period—that he will be turned inside out, that this love will be a terror whispered in his ear in the blackness of insomnia, in the car midway home, and he will never recover, or, at least, his life will become unrecognizable from its original form.</p><p>What the deli woman doesn’t know is that, while picking up the crostini, the man is remembering a fight that he had with his wife in this very store. And that he knows, maybe, that the woman now slicing meats for his children had overheard it.</p><p>What the fight was about he could not recall. Then: cereal.</p><p>He had wished to let the kids have sugar cereal on Sundays. That was how he’d been brought up, but she thought it opened a door to worse things.</p><p>“A gateway drug?” He laughed, didn’t mean to, but then smiled—and repeated it. This did not please her.</p><p>She yelled, “It’s not funny,” and pulled her purse from the shopping cart, swung it back over her shoulder, and disappeared down the long aisle to go wait in the car.</p><p>They moved on. He relented and did not buy the variety pack. It made life easier. But, later, when they got to the ice-cream shop, <em>See</em>, he thought, as the kids, eight and ten, lapped up their strawberry and chocolate, almost tipping the top scoop that was in danger of falling. He said nothing. Then, halfway through his pralines and cream, she, out of earshot of the kids, said, “Jesus, Michael, can you take a break from looking at her?”</p><p>She was a woman who had not bothered to put on a shirt and was licking a slow drip from her cone in a bikini top and cutoffs. He’d not noticed the unconscious looking while savoring his sugary treat.</p><p>“I am not!”</p><p>“Looking, looking, looking,” she said.</p><p>“Honey, I was—”</p><p>“Repeat, repeat, repeat,” she said.</p><p>As they sat on their plastic ice-cream stools in the delicious heat, a summer breeze came and they fought as the woman sucked her ice cream through the bottom of her cone. He turned his back to face his wife and take the beating he knew he deserved. A man watching might think of him as a victim and weak, and he was, and Daisy’s soft skin made him both things.</p><p>Later, in bed, his wife relented and let him stroke her cheek and look her in the eyes. You see, she still loved him.</p><p>“Here you go,” the meat and cheese wrapped in wax paper is being handed to him. She does not look at him in any kind of way, but he searches for judgment and sees nothing from the deli woman but <em>Have a great day</em>.</p><p>He will repair things with his wife slowly.</p><p>He goes down all the aisles. His wife hates it when he forgets stuff, and we know he will because of the phone in his ear. The sound of Daisy’s sleepy voice. It’s morning for her, and she has taken the call because these are the types of errands she waits for—the baritone tickling her ear—savoring his undivided attention. She has become the queen of the silent cry; she is the empress of a pretty but empty butter dish; she is the baroness who cares for the junk pile in the mail room.</p><p>He remembers his wedding day nineteen years ago. They were standing outside the hotel where they had just gotten married, and a beautiful girl, wearing a straw hat, walked by, winked, and shouted congratulations. He was the only person who saw her.</p><p>They will hang up after he reaches his cul-de-sac and she will go down to the farmers’ market as she does on Fridays and buy berries, a newspaper, and hot coffee. Daisy will think of him as he prepares the meal. The ingredients she already knows, but what she doesn’t know is that he will grill the bread and make the aioli from scratch. She will never eat his artisanal sandwiches or his baked chicken—but at the grocery store when he calls, she always asks, What’s for dinner tonight? ♦</p><p><em>This is drawn from “<a href=\"https://www.amazon.com/dp/1972693042\" target=\"_blank\" rel=\"noopener\">All Good Men</a>.”</em></p>"},{"title":"Terabytes of credentials leaked in massive supply-chain attack","source":"Ars Technica","author":"","url":"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/","category":"tech","categoryLabel":"Technology","wordCount":1037,"readingTime":6,"content":"<p><a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#main\" target=\"_blank\" rel=\"noopener\">\n  Skip to content\n</a></p>\n            \n  \n      \n        <p>\n    \n  \n  \n    TEAMPCP’S RAMPAGE CONTINUES\n  \n</p>\n      \n      <p>\n        The data was scraped and exfiltrated from 2,500 users of a compromised AI package.\n      </p>\n          \n    \n<p>Terabytes worth of credentials, many belonging to the world’s biggest and most sensitive organizations, have been exposed in a supply-chain attack on LiteLLM, an open source tool that streamlines AI-driven software development. Microsoft, Amazon, Cisco, Samsung, and Salesforce are only a handful of the entities whose access secrets were exposed.</p>\n<p>The revelation was posted on <a href=\"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines\" target=\"_blank\" rel=\"noopener\">Tuesday</a> and <a href=\"https://www.hudsonrock.com/blog/largest-ai-supply-chain-breach-of-2026-litellm-hack-impacts-thousands-of-global-enterprises-claim-your-ethical-disclosure\" target=\"_blank\" rel=\"noopener\">Wednesday</a> by security firms CloudSEK and Hudson Rock. CloudSEK said it found cloud keys, repository tokens, SSH keys, Kubernetes secrets, package publishing credentials, environment variables, and AI provider keys that could allow attackers to gain access to more than 2,500 organizations.</p>\n<h2>40 minutes is all it takes</h2>\n<p>The credentials were extracted during a 40-minute window in March while the victims used compromised versions of LiteLLM downloaded from the package’s official location in the Python Package Index repository. Hudson Rock said it made the discovery after analyzing a 195TB file that it obtained. Neither firm identified the source of the information.</p>\n<p>The LiteLLM compromise was the result of a <a href=\"https://arstechnica.com/security/2026/03/widely-used-trivy-scanner-compromised-in-ongoing-supply-chain-attack/\" target=\"_blank\" rel=\"noopener\">previous supply-chain attack</a> that infected the widely used vulnerability scanner Trivy. Other software infected in the campaign includes <a href=\"https://www.kics.io/\" target=\"_blank\" rel=\"noopener\">KICS</a> and the <a href=\"https://developers.telnyx.com/development/sdk/python\" target=\"_blank\" rel=\"noopener\">Telnyx Python SDK</a>. TeamPCP, a ramshackle but extremely capable gang largely made up of teenagers, took credit for the attack, and researchers have largely corroborated the claim.</p>\n<p>“I’ve confirmed the data is legit, by the way, multiple victim orgs,” independent security researcher Kevin Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117082985466021541\" target=\"_blank\" rel=\"noopener\">said</a>. “It contains a significant volume of sensitive content at orgs. It’s a massive supply chain breach due to poor AI security—not because AI is the threat, but teens can run circles around orgs obsessed with rushing out AI and poor DevOps security.”</p>\n                  \n    \n<p>The compromised versions of all four software packages contained code that accessed the memory of infected machines, scraped its contents, and exfiltrated it through an attacker-controlled channel. The data is filled with an assortment of information. Interspersed in the wall of data are credentials to software pipelines maintained by the tens of thousands of organizations that ran LiteLLM during the 40-minute span that the supply-chain attack remained active.</p>\n<p>In all, both security firms said some 434,000 CI/CD (continuous integration/continuous delivery) software pipelines had credentials exposed after running the compromised LiteLLM versions. In many cases, researchers at CloudSEK and Hudson Rock had trouble identifying the organizations the credentials belonged to. For instance, an email address in the dump from the domain @siriusxm.com ultimately didn’t indicate a breach at the satellite broadcaster, but rather one within the infrastructure of SiriusXM subsidiary AdsWizz.</p>\n\n<p>A full list of organizations is <a href=\"https://exposure.cloudsek.com/ai-supply-chain-incident\" target=\"_blank\" rel=\"noopener\">here</a>. The researchers had high confidence that these organizations had their credentials exposed:</p>\n<ul>\n<li>Nvidia Corporation</li>\n<li>Amazon Web Services (AWS)</li>\n<li>Samsung Electronics</li>\n<li>samsung.com</li>\n<li>Salesforce, Inc.</li>\n<li>Cisco Systems, Inc.</li>\n<li>F. Hoffmann-La Roche AG</li>\n<li>ServiceNow</li>\n<li>Siemens AG</li>\n<li>S&amp;P Global</li>\n<li>Airbus US Space &amp; Defense</li>\n<li>John Deere</li>\n<li>Regeneron Pharmaceuticals, Inc.</li>\n<li>London Stock Exchange Group (LSEG)</li>\n<li>Thomson Reuters</li>\n<li>FedEx</li>\n<li>Munich Remunichre.com</li>\n<li>MediaTek Inc.</li>\n<li>Volkswagen AG</li>\n<li>Deloitte</li>\n<li>The Kroger Co.</li>\n<li>Siemens Energy</li>\n<li>Thales Group</li>\n<li>X Corp (Twitter)</li>\n<li>Zscaler, Inc.</li>\n<li>Epic Games</li>\n<li>Orange S.A.</li>\n<li>HP Inc.</li>\n<li>Philips</li>\n<li>Fortum Oyj</li>\n<li>Vodafone Group Plc</li>\n<li>Carl Zeiss AG</li>\n<li>Deutsche Bahn AG</li>\n<li>NGINX, Inc.</li>\n<li>BT Group</li>\n<li>Liebherr</li>\n<li>Krungthai Bank Public Company Limited</li>\n<li>Roku, Inc.</li>\n</ul>\n<p>“Many CI/CD pipelines are configured generically,” Hudson Rock said. “The dumped variables contain active database passwords, third-party API keys, and cloud credentials without any identifiable company email, custom domain string, or internal server name. This means countless organizations currently have active secrets sitting in this database, completely unaware of their exposure.”</p>\n<h2>Welcome to the new world of supply-chain attacks</h2>\n<p>Both firms are urging all organizations that used the compromised versions of LiteLLM—particularly those listed in the high-confidence section of the list—to thoroughly rotate all credentials in their pipelines. Hudson Rock instructed any organization that uses any AI proxy infrastructure, third-party CI/CD vulnerability scanners, or downstream AI packages to immediately audit their environment for versions 1.82.7 and 1.82.8 of LiteLLM, the two compromised versions of the software.</p>\n                  \n    \n        \n<p>The firm advised all those affected to perform “aggressive credential revocation,” assume any secret accessible to the LiteLLM environment is compromised, invalidate and rotate all cloud keys, Kubernetes service account tokens, and GitLab/GitHub PATs, and audit logging and egress filtering.</p>\n<p>As a cautionary tale, CloudSEK said that Trivy developers rotated but failed to fully revoke an automation token over a 20-day window. The lapse gave the attackers a nearly three-week period to force-push malicious code to third-party builds that used the vulnerability scanner. As Beaumont observed, organizations’ rush to integrate AI into their software delivery systems has also greatly contributed to the scale of the damage.</p>\n<p>Update: There are already signs that some of the affected organizations aren’t taking the disclosure with the seriousness warranted. After this post went live, Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117084862543112580\" target=\"_blank\" rel=\"noopener\">reported</a>:</p>\n<blockquote><p>These creds date from about March. One of the orgs impacted told me they’d rotated them all and it’s a nothingburger, so I looked at their responsible disclosure policy, it allows trying creds, so I tried them all. Almost every one worked. Submitted report. One of the biggest US techcos.</p></blockquote>\n<p>Ultimately, the new revelations concerning the LiteLLM supply-chain attack underscore the growing threat of such campaigns and hence the importance of maintaining vigilance around the use of open source software that, when infected, can spread rapidly across the Internet.</p>\n<p>“The key takeaway is how supply chains have evolved to make a single upstream breach affect thousands of companies simultaneously,” Alon Gal, co-founder and chief technology officer of Hudson Rock, wrote in an email. “A window of roughly 40 minutes in which the LiteLLM dependency was hacked led to over 430,000 instances in which millions of secrets were harvested. This magnitude pushes us into a completely new world regarding the type of response required from the cybersecurity industry.”</p>\n<p><em>Post updated to add image.</em></p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/dan-goodin/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Dan Goodin is Senior Security Editor at Ars Technica, where he oversees coverage of malware, computer espionage, botnets, hardware hacking, encryption, and passwords. In his spare time, he enjoys gardening, cooking, and following the independent music scene. Dan is based in San Francisco. Follow him at <a href=\"https://infosec.exchange/@dangoodin\" target=\"_blank\" rel=\"noopener\">here</a> on Mastodon and <a href=\"https://bsky.app/profile/dangoodin.bsky.social\" target=\"_blank\" rel=\"noopener\">here</a> on Bluesky. Contact him on Signal at DanArs.82.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    91 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/ai/2026/08/world-humanoid-robot-games-show-runners-breaking-records-bursting-into-flames/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"}];
