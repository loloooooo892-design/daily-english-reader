5,"content":"<p>In one of Kent Nishimura’s photographs of the White House press corps, which <em>The New Yorker</em> commissioned, the correspondent Beni Harmony readies herself for a segment featuring the President and the First Lady. She’s covering a 2025 Halloween event; her face, which is illuminated by an unseen source, has a waxy, flashlight-under-the-chin quality. The Washington Monument rises flimsily in the background, visually echoing a rickety ladder on which a photographer perches, wearing an uncertain expression as he looks in the same direction as Harmony. The image could be a still from a film about an alien invasion, although the ominous light almost makes the figures seem like cinemagoers transfixed by something unsettling playing out onscreen. The poet Rosemary Tonks once described movie theatres as places “where the criminal shadow-literature flickers over our faces.” Harmony’s features appear to have been darkly ignited by the Trump Show.</p><p>Nishimura, now a staff photographer with Agence France-Presse, has been documenting American news and politics for more than a decade. He started reporting on the White House at the tail end of Trump’s first Administration and stayed on through the Biden Presidency. Before what journalists often refer to as Trump 1.0, he told me, New York was considered the center of the journalistic world. The landscape shifted when a genius of attention-capture broke out of reality television and into a different type of celebrity. Between 2017 and 2021, outlets ramped up their White House coverage and freelance photographers poured into D.C. When Trump was reëlected, Nishimura said, “I was fascinated to see if that would happen again.”</p><p>But the second Trump Administration hasn’t led to more chroniclers so much as different ones. The White House press corps, the conduit that routes and shapes the official government narrative, has itself been reshaped, its composition altered to better reflect the President’s preferences. Since 2024, the body’s ranks have swelled to include a number of podcasters, Substackers, and other independent creators, along with right-wing outfits such as Turning Point USA, Breitbart, and Newsmax.</p><p>In another of Nishimura’s photographs, CNN’s chief White House correspondent Kaitlan Collins glances warily in the direction of Brian Glenn, a former White House correspondent for the conservative streaming network Real America’s Voice. Glenn, the fiancé of Representative Marjorie Taylor Greene, is turning toward something beyond the frame. The image of Collins is in focus, and her delicate features seem lined with suspicion, whereas Glenn’s form is out of focus, giving him an evasive aura. Despite the contrast between the journalists, the symmetry of their gazes is striking: both are looking slightly over their shoulders. Are they scanning the recent past or the near future?</p><p>The press corps aren’t allotted much space in the White House. They are allowed to congregate in the James S. Brady Press Briefing Room, with its jam-packed rows of theatre-style seats facing the podium; in the area just outside the briefing room; on the driveway to the West Wing; and on “Pebble Beach,” a stretch of the North Lawn dotted with tents, for live shots, that glow eerily at night. “I had to get creative,” Nishimura told me. “There’s not a lot of visual variety.” He said that his decision to shoot in black-and-white stemmed from a desire to strip away distraction, the coin of the realm in television: “Because TV relies not only on light but on color, on-air talent dress very nicely, with beautiful colors.” He wanted “to take it down to the bare essence of what is happening,” letting “the people and the moments and the images themselves do the heavy lifting.”</p><p>There’s no politics without stagecraft, and the photographs reveal the backstage labor that allows the show to go on. Nishimura said that he hoped to capture “slices of life in between scripted moments.” This meant moving outside of the traditional tableau of White House photojournalism—an orator on a pedestal—to show members of the press in postures of alertness or repose. In one shot, the correspondents Nancy Cordes, Aishah Hasnie, and Garrett Haake attend a briefing. Cordes and Haake are keen and tense, their hands raised, but Hasnie has relaxed, withdrawing briefly into her thoughts. It’s a glimpse of the performance paused, of the body as something to be inhabited rather than used or displayed.</p><p>Photography subjects can be self-conscious, but, for the most part, the subjects of Nishimura’s portfolio weren’t. As he pointed out, White House reporters are used to being surveilled. The shots are busy with equipment—boom mikes, bulb-flashes, wires and cables dripping like innards or snakes, the hungry Cyclopean eye of a mounted camera. Elsewhere, we see a shadow bifurcating the side of the White House; a taloned and bejewelled hand shooting up prayerfully; Trump either emerging from or disappearing behind a sliding door. These images, like those of the production gear, register as metaphors, even as they help to deliver the particular texture of a scene. In one snap, the President, viewed from above, points his finger crossly, as if scolding a scrum of unruly children. “There’s always a difference between what politicians say publicly and what they might feel privately,” Nishimura said. With Trump, though, “it does feel like he’s very candid.” A different type of honesty pervades a frame of press secretary Karoline Leavitt adjusting her hair before an interview, or one of heavily made-up television reporters exchanging quiet words.</p><p>There’s something powerful—and, yes, stripped down—about seeing these politicians and newscasters without being able to hear their language. Nishimura’s compositions offer truthful portraits of artifice. The photographs themselves demonstrate the journalistic art of eliciting the truth; in that way, they honor it.</p>"},{"title":"Steam's latest update finally brings order to the chaos of your wishlist, and might even nudge people into buying you some new games","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/steam-wishlists-gifting-big-updates","category":"gaming","categoryLabel":"Gaming","wordCount":544,"readingTime":3,"content":"<p>A gift of sequence.</p>\n    \n  \n  \n  \n  \n            <p>If you're among the millions whose Steam wishlists have been accumulating games for years, and you're too scared to venture in, Valve's latest Steam update should help.</p>\n<p>As detailed in the <a href=\"https://store.steampowered.com/news/app/593110/view/710028372767410959?l=english\" target=\"_blank\" rel=\"noopener\">company's latest blog update</a>, the keyword here is 'customisation'. First, it's now possible to create custom categories for your wishlisted games, and assign future additions to the ones you've created. The criteria is entirely unrestricted, and all categories are now displayed at the top of the page. A single click lets you show only the games that are part of that category.</p>\n<p>This also extends to the wishlist button on every game's store page. Now, when you add a game to your wishlist, you can pick which category it goes into. You can do the same with games you wished for previously, simply by visiting their store pages.</p>\n<p>Perhaps the coolest part is that you can also customise wishlist notifications to only be sent for the categories you want. Notifications are very helpful, but they can be daunting to scroll through if you have a massive wishlist, especially during sales. Speaking of notifications, it's now possible to be notified when a game on your list gets a demo, and the demo will be flagged on your wishlist too. Valve has also improved search within the wishlist page to autocomplete titles when you type, and to display results faster. In general, wishlist pages should be more informative too. Microtrailers now play, just like on store pages, and the navigation flow has been revamped on all platforms so the page brings you back to what you were looking at before.</p>\n<p>Additionally, when sharing wishlists, you can now set it so it lands on a specific category, almost like you're passive-aggressively trying to get someone to buy you a game.</p>\n\n<p>But that's not all. Valve's update also brings <a href=\"https://store.steampowered.com/news/app/593110/view/669497052089025104\" target=\"_blank\" rel=\"noopener\">a couple of improvements to Steam gifting</a>, making it easier to send digital gift cards as well as games to others. It has, for instance, expanded the guest checkout feature (enabling you to buy someone else an item on Steam without needing to have an account) so that it now  includes any game. It was previously limited to hardware and digital gift cards. This ties nicely into the wishlist updates, as your shared wishlist link can now be used to directly purchase something without the sender needing a Steam account.</p><p>Further to that, Steam games and digital gift cards now be sent to email addresses, even without knowing if that address is associated with a Steam account. Gifts expire within 30 days if unclaimed, however. Unfortunately, this feature is only available between Steam accounts in the same country, but Valve hasn't completely forgotten about cross-region gifting, which now supports games and not just digital gift cards.</p>\n<p>When you gift a game to a friend who lives in a different region, Steam will calculate the cost in their region at the checkout, making it possible for someone based in a region with lower pricing to gift to a friend in a higher-priced region.</p>\n<p>All this is available now as part of Steam's latest update across PC, the mobile app as well as hardware like Steam Deck and Steam Machine.</p>\n        \n      \n  \n      <p>Mentioned in this article</p>"},{"title":"Top AirDoctor Coupon Codes for July 2026","source":"Wired","author":"@wired var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
