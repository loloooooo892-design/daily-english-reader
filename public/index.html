<style>

  --swap-bg-hover: #DDE2EA;
}

    --bg: #191C22;

    --text-faint: #555D6E;

    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;

    --swap-bg-hover: #2F3543;
  }
}

  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;

  --warning-border: #5C4A28;

  --swap-bg-hover: #2F3543;
}

  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }

<script>
var articles = [{"title":"Republican groups file emergency application to court on broadcasting rates for political ads","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/08/republican-groups-file-emergency-application-to-court-on-broadcasting-rates-for-political-ads/","category":"law","categoryLabel":"Law","wordCount":696,"readingTime":4,"content":"<p>Two Republican groups on Monday <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A274/422424/20260828185340935_Brown%20v.%20FCC%20-%20Emergency%20Stay%20Application.pdf\" target=\"_blank\" rel=\"noopener\">asked the Supreme Court</a> to temporarily pause a ruling by a federal appeals court that, they told the justices, “rewrote longstanding rules about preferential broadcast rates for political ads.” With the upcoming midterm elections just over two months away, the National Republican Congressional Committee and the National Republican Senatorial Committee, which are devoted to electing Republicans to the U.S. House of Representatives and the U.S. Senate, urged the court to move quickly to block the decision by the U.S. Court of Appeals for the 4th Circuit.</p><p>Under <a href=\"https://www.law.cornell.edu/uscode/text/47/315\" target=\"_blank\" rel=\"noopener\">federal election law</a>, candidates for federal office are entitled to purchase advertising time at preferential rates during the 45-day run-up to the primary election and 60 days before the general election. In a “public notice” <a href=\"https://www.fcc.gov/document/bureau-issues-guidance-concerning-lowest-unit-charge-requirements\" target=\"_blank\" rel=\"noopener\">issued</a> on March 30, 2026, the Federal Communications Commission’s Media Bureau indicated that political parties and joint fundraising committees would also be entitled to the more favorable rates.</p><p>Four Democrats who are candidates for the House or Senate, including Sen. Jon Ossoff of Georgia, asked the FCC on April 29 to review the public notice. On June 19, before the FCC had acted on the challengers’ application for review, they went to federal court, where they argued that the public notice was inconsistent with federal election laws. As a practical matter, they contended that the rule favors Republicans, whose fundraising committees have more to spend, while Democratic candidates rely more on small-money donors.</p><p>A divided panel of the <a href=\"https://www.ca4.uscourts.gov/opinions/261785.P.pdf\" target=\"_blank\" rel=\"noopener\">4th Circuit agreed</a>. Writing for the majority, Judge Robert King held that federal law is “unambiguous”: it gives the preferential rates only to a “candidate” for his or her personal use, which does not extend to a candidate’s “mere authorization of someone else’s use.”</p><p>Judge J. Harvie Wilkinson dissented. In his view, it was too soon for the court of appeals to weigh in, because the FCC was still deliberating the issue. He regarded the text as ambiguous: it can “accommodate[], and may indeed favor, the FCC’s view.” Moreover, he added, the court’s decision “restrict[s] political speech in the sensitive period leading up to an election.”</p><p>The NRSC and the NRCC, which had joined the case, <a href=\"https://www.scotusblog.com/cases/national-republican-congressional-committee-v-brown/\" target=\"_blank\" rel=\"noopener\">came to the Supreme Court</a> on Monday, asking the justices to intervene. Like Wilkinson, they first contested the court’s power to consider the challenge in the first place. They dismissed the public notice as a “staff-level” document “that is neither final nor an agency action” – an important distinction because the court only has the power to review “final orders of the Federal Communications Commission.” Instead, they argued, the notice “is at most an interpretive guidance document restating the FCC’s longstanding position regarding” the preferential rates.</p><p>The 4th Circuit’s decision was also wrong on the merits, the committees continued. Whether an entity is entitled to a preferential rate hinges on whether a candidate or “any authorized committee of the candidate” <em>uses</em> a broadcasting station before the election; who <em>pays</em> for the advertisements is irrelevant, they argued. “Indeed,” they suggested, “a candidate might ‘use’ a broadcasting station by appearing in an advertisement authorized by the candidate.”</p><p>The 4th Circuit’s ruling, the committees wrote, “will, at a minimum, throw broadcasters, candidates, and campaigns into confusion” by upending current rules “during election season.”</p><p>The Trump administration <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A274/422454/20260831102801168_26A274GovtResponse.pdf\" target=\"_blank\" rel=\"noopener\">filed a brief</a> supporting the Republican groups. U.S. Solicitor General D. John Sauer argued (among other things) that the challengers lacked a legal right to sue, known as standing, because “the notice does not grant favored treatment to one side or the other; instead, the notice’s interpretation offers the same benefit to all sides, including the challengers themselves and the committees and parties supporting them.”</p><p>The Republicans’ request goes initially to Chief Justice John Roberts, who handles emergency appeals from the 4th Circuit. Roberts can act on the appeal himself or, as is more likely in this case, refer it to the full court.</p><p>The court on Monday afternoon directed the Democratic challengers to respond to the Republicans’ application by noon on Thursday, Sept. 3.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Republican groups file emergency application to court on broadcasting rates for political ads</em>, SCOTUSblog (Aug. 31, 2026, 5:26 PM), https://www.scotusblog.com/2026/08/republican-groups-file-emergency-application-to-court-on-broadcasting-rates-for-political-ads/</p>"},{"title":"Seven Steps to Financial Success, According to a Guy Who Won a Multimillion-Dollar Lawsuit Against the Circus","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/seven-steps-to-financial-success-according-to-a-guy-who-won-a-multimillion-dollar-lawsuit-against-the-circus","category":"fun","categoryLabel":"Interesting Reads","wordCount":602,"readingTime":4,"content":"<p>Everyone wants to know the secret to my success. The truth is, there are no shortcuts. You have to work hard, stay persistent, and trust that one day your efforts will pay off. Or, as in my case, that you’ll win a multimillion-dollar payout from the circus after getting hit in the face by a flying acrobat. Here are my seven simple and easy-to-follow steps to amassing a fortune.</p><p><strong>1. Set clear goals.</strong></p><p>Before embarking on any business venture, it’s important that you establish clear and tangible objectives for yourself. At the same time, you need to be open to adapting your goals to respond to any new developments that might arise. For example, I originally planned to make my money in cryptocurrency, and then pivot to agentic A.I. But I refocussed all my efforts on personal-injury law after I was smacked square in the face by the youngest member of the Flying Florescus, a family of Romanian acrobats who happened to be performing with the circus in my city.</p><p><strong>2. See setbacks as opportunities for growth.</strong></p><p>Most people would have given up after suffering severe facial and spinal fractures, but not me. My first thought upon regaining consciousness in the ambulance was <em>How can I turn this setback into monetary gain</em>? You’re bound to encounter struggles while climbing the economic ladder, but don’t let that hold you back, just like I didn’t let being trapped in a full-body cast for six months stop me from pursuing a seven-figure settlement from Mendelsohn’s Travelling Circus.</p><p><strong>3. Never stop learning.</strong></p><p>Knowledge is the key to success, so always be a student of life. I, for one, spent countless hours in the hospital library becoming well versed in the (surprisingly complex) nuances of Circus Law, ultimately discovering that assumption of risk does not apply when a spectator is injured due to reckless and/or intentionally dangerous actions, and this is exactly what I argued in court. The patriarch of the Flying Florescus claimed that it was an accident, but everyone in attendance saw him lock eyes with me before flinging his daughter straight into my face from fifty feet in the air. All because I refused to clap during their (mediocre) trapeze routine.</p><p><strong>4. Be in the right place at the right time.</strong></p><p>Let’s face it, every success story contains an element of luck. That said, you can always optimize your chances by insuring that you’re in the best possible position to get whacked in the face by wealth and prosperity, so to speak. In my case, that position was in the front row of the big-top tent at Syracuse’s first, and final, CircusFest. How’s that for strategic alignment?</p><p><strong>5. Surround yourself with successful people.</strong></p><p>You are inevitably influenced by the company you keep, so when it comes to who you associate with, choose carefully. Driving home from an A.I. convention, I found myself inexorably drawn to a billboard advertising “Eastern Europe’s Most Famous Family of Acrobats,” and seeking them out ended up being the best decision I ever made.</p><p><strong>6. Reinvest wisely.</strong></p><p>Don’t rest on your laurels. Three and a half million dollars may seem like a lot of money, but it won’t last forever, especially after costly hospital bills and physical therapy. Always be looking to build on what you have by investing in new projects, such as starting your very own law firm—exclusively representing victims of circus- and carnival-related injuries—called Barnum &amp; Pay Me.</p><p><strong>7. Go to the circus.</strong></p><p>Seriously—you never know when you’re going to come into a windfall by getting hit in the face by a free-falling Romanian acrobat. ♦</p>"},{"title":"In a sea of failed live service games, I'm shocked to see someone trying to make a MOBA","source":"PC Gamer","author":"Mollie Taylor","url":"https://www.pcgamer.com/games/moba/in-a-sea-of-failed-live-service-games-im-shocked-to-see-someone-trying-to-make-a-moba/","category":"gaming","categoryLabel":"Gaming","wordCount":838,"readingTime":5,"content":"<p>Making a live service game these days feels like trying to shoot an arrow at a flea while blindfolded. Striking gold with a hot new shooter or other team-based multiplayer game with a quirky twist seems like an exercise in futility, but that isn't stopping developers and publishers from trying to be the next big thing.</p><p>Personally, if I was trying to enter an already-volatile market, I'd probably be steering well clear of MOBAs. They're finicky, have a high barrier to entry, and require a ridiculous amount of time commitment to ever be remotely good at them. Even then, dragging a League or Dota player away from their game to try another one is a big ask. Hell, I'm still shocked Deadlock has managed to do it.</p><p>So I don't know whether to applaud developer Nirvanana for giving it a go with Project Zeta, or grab the team by the shoulders and give them a good old shake for doing something I perceive to be utterly reckless.</p><p>Though, as Nirvanana will maintain, Project Zeta isn't quite a MOBA. As the developer tells me, it's actually a 4v4 multi-team tactical arena battle. Not battle royale, just battle. \"We tried not to be tied down to those traditional things,\" Nirvanana tells me as I sit down to try Project Zeta at Gamescom, though admits the game did start out as a more traditional battle royale.</p><p>But from there, it's evolved into a sort of battle royale-MOBA-hero shooter hybrid, pitting four teams against each other as they fight across a sprawling map for victory. I'm shown flashy footage of Twitch streamers popping off after winning teamfights, proclaiming how good it feels to win in Project Zeta—emerging victorious from a teamfight refreshes cooldowns for the winners, as well as resurrecting any teammates who fell in the scuffle.</p><p>It seemed all well and good, but I couldn't help but wonder how it felt to be on the other side. Making a victory feel amazing for the winners usually means making the loss feel particularly bad on the other side of things. \"In the last test, that was actually the biggest feedback we received,\" Nirvanana admits to me.</p><p>Recent tweaks have apparently made it so that there's \"bigger risk\" for the winning team. \"The more you're ahead, the more you have to seek out other teams and wipe them out … there's a higher chance of you making mistakes, and that's a bigger risk for the winning team.\" It's something I'm still not entirely convinced of, but it does at least seem like Nirvanana is doing its best to iron out any kinks as it continues to drip-feed playtests to its core audience.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>How that core audience will eventually translate into playercounts with the full release, however? Nirvanana knows it's a tough ask. \"You have to have a clear message,\" the developer tells me. \"And you have to take the players that agree with that message, and you have to build a community before launch with those players. And I think that's the only way to secure success once the game launches.</p><p>\"And so, through these continuous player tests, we want to bring in those players that agree with Zeta's message to our team. These people will be the evangelists, basically, that promote the game for us. One thing I can say with confidence is that Zeta is a game that doesn't exist in a genre that doesn't exist, and it has a very clear message. And so we're going to continue to put up the message that this is what Zeta is. It's about team fights, dense team fights, and those who agree with that will be able to come into our community and we will continue to engage with them.\"</p><p>It all seems like a very hopecore way of looking at things, though Nirvanana does cap it all off by admitting: \"Games like us failed a lot. The track record isn't good.\" Well, for Project Zeta's sake, I hope it can carve out a slice of success in an increasingly difficult landscape.</p><p>If you're interested in checking out Zeta for yourself, there's a playtest running right now until 12am on September 7. You can sign up on the <a href=\"https://zeta.krafton.com/en\" target=\"_blank\" rel=\"noopener\">Project Zeta website</a>.</p>\n\n<p>Mollie spent her early childhood deeply invested in games like Killer Instinct, Toontown and Audition Online, which continue to form the pillars of her personality today. She joined PC Gamer in 2020 as a news writer and now lends her expertise to write a wealth of features, guides and reviews with a dash of chaos. She can often be found causing mischief in Final Fantasy 14, using those experiences to write neat things about her favourite MMO. When she's not staring at her bunny girl she can be found sweating out rhythm games, pretending to be good at fighting games or spending far too much money at her local arcade. </p>"},{"title":"A Transplanted Pig Kidney Is Still Working After a Record-Setting 9 Months in a Patient","source":"Wired","author":"@wired","url":"https://www.wired.com/story/pig-kidney-transplant-working-after-record-setting-9-months/","category":"tech","categoryLabel":"Technology","wordCount":668,"readingTime":4,"content":"<p>A woman has lived with a <a href=\"https://www.wired.com/story/heres-whats-next-for-pig-organ-transplants/\" target=\"_blank\" rel=\"noopener\">pig kidney</a> for more than nine months without needing dialysis, a record-setting achievement.</p><p>The woman underwent the operation at Massachusetts General Hospital on November 22 last year. As of Thursday, the kidney has been functioning for 285 days, according to Cambridge, Massachusetts-based eGenesis, the biotech company that used <a href=\"https://www.wired.com/tag/crispr/\" target=\"_blank\" rel=\"noopener\">Crispr gene editing</a> to make the organ fit for human transplantation. Previously, the record for a person living with a <a href=\"https://www.wired.com/story/man-has-pig-kidney-removed-after-living-with-it-for-a-record-9-months/\" target=\"_blank\" rel=\"noopener\">transplanted pig kidney</a> was 271 days, set by Tim Andrews.</p><p>Most people in need of a kidney transplant wait three to five years on average to receive one, though it can take longer depending on blood type and other factors. While they wait, patients often need dialysis, in which a person’s blood vessels are hooked up to a machine that removes excess fluid and waste from the bloodstream. Dialysis typically requires four-hour sessions three times a week and can damage blood vessels over time, making the procedure hard on the body.</p><p>Pig kidneys could <a href=\"https://www.wired.com/story/genetically-edited-pig-kidney-human-transplant-xenotransplantation-massachusetts-general-hospital/\" target=\"_blank\" rel=\"noopener\">offer an alternative</a> until a human organ is available. Pig organs are similar in size and function to human organs and are being investigated as a way to ease the shortage of human donor organs. To make them more suitable for humans, scientists are genetically editing them to prevent immediate rejection and reduce the risk of pig viruses being passed on to transplant patients.</p><p>Patients' health gets worse the longer they're on dialysis, “and their odds of getting a human transplant aren't rising fast enough to meet their declining health,” says Mike Curtis, CEO of eGenesis. The company used Crispr to remove certain pig genes that could cause an immune response and add a handful of human genes.</p><p>“What we saw with Mr. Andrews was a radical improvement in his overall health while he was on the pig kidney versus if he had stayed on chronic dialysis,” Curtis says.</p><p>The woman who has crossed the nine-month mark is the fifth person to receive an eGenesis kidney through a special regulatory pathway known as expanded access. The Food and Drug Administration allows patients with serious or life-threatening conditions to gain access to experimental treatments when there are no good alternatives.</p><p>Andrews’ case shows that pig kidneys may provide a temporary solution. He received a pig kidney in January 2025 and had it removed in October last year after a period of decreasing kidney function. He returned to dialysis but received a human kidney transplant in January this year. A second person has also successfully received a human transplant after having a pig kidney for eight months, according to eGenesis.</p><p>Curtis says the company is learning more with each transplant. In a paper published on Thursday in The Lancet medical journal, the surgical team that performed the transplants details Andrews’ experience. They determined that Andrews’ pig kidney eventually failed due to thrombotic microangiopathy, which means tiny blood clots formed in the transplanted organ.</p><p>The team is using that information to adjust the immunosuppressant medications that pig kidney recipients receive and how frequently they need to take those drugs. People who receive human organ transplants also need to take immunosuppressive drugs to prevent their body from rejecting the transplanted organ. Organ rejection can happen at any time following a transplant, ranging from minutes after the surgery to many years later.</p><p>Kidneys are the most-needed organ, with more than <a href=\"https://www.organdonor.gov/learn/organ-donation-statistics\" target=\"_blank\" rel=\"noopener\">95,000 people</a> waiting to receive one in the US. But due to a shortage of donor organs, fewer than 28,000 kidney transplants were performed in the US in 2025.</p><p>The FDA has given eGenesis the green light to conduct a more formal trial in up to 33 patients with kidney failure who are between 50 and 70 years old and on the wait list for a human kidney. That trial will not happen until 2027, but eGenesis plans to perform additional transplants under the expanded access pathway in the meantime. Their next goal is to get a transplanted pig kidney to function for a year.</p>"}];

function render() {

  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
