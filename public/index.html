<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"\"We ended up kind of cornered there\": Mortal Shell 2 devs say they didn't intend to \"lock everybody out\" by disabling achievements for Slayer Seal \"easy mode\" users","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/we-ended-up-kind-of-cornered-there-mortal-shell-2-devs-say-they-didnt-intend-to-lock-everybody-out-by-disabling-achievements-for-slayer-seal-easy-mode-users","category":"gaming","categoryLabel":"Gaming","wordCount":634,"readingTime":4,"content":"<p>They were caught out by the practicalities of selling the game on discs</p>\n    \n  \n  \n  \n\n            <p>Formidable fantasy soulslike <a href=\"https://www.rockpapershotgun.com/games/mortal-shell-2\" target=\"_blank\" rel=\"noopener\">Mortal Shell 2</a> has been getting it in the shins from certain players over the decision to 'lock them out' of Steam achievements, when they equip the notorious Slayer Seal.</p>\n<p>Trailers have <a href=\"https://www.rockpapershotgun.com/mortal-shell-2-will-let-you-lower-its-difficulty-by-making-executions-refill-your-health-or-up-the-challenge-by-turning-off-the-sun\" target=\"_blank\" rel=\"noopener\">characterised</a> the Slayer Seal as an in-game 'easy mode'. As Jeremy summarises in our own <a href=\"https://www.rockpapershotgun.com/mortal-shell-2-review-a-monumental-heavy-metal-sequel-with-the-spirit-of-a-90s-pc-game\" target=\"_blank\" rel=\"noopener\">Mortal Shell 2 review</a>, it gives \"you a pulverising punch and your ranged weapons the ability to deal Break damage\", which goes a fair way in an action-RPG this vicious. Not being able to earn achievements with the Seal equipped (or even after you unequip it) has sparked a few <a href=\"https://www.reddit.com/r/MortalShell/comments/1vuwshz/yes_we_know_slayer_seal_is_op_but/\" target=\"_blank\" rel=\"noopener\">Reddit threads</a> protesting that people are being punished for declining to punish themselves… while other people (hello!) wonder why anybody cares this much about Steam achievements at all.</p>\n<p>Developers Cold Symmetry have now addressed these fulminations in a video interview, explaining that the disabling of achievements for Slayer Seal users is actually a mistake. The devs had intended to offer different achievements for Slayer Seal users, encouraging people to play through twice over and get to grips with an alternative playstyle. However, they decided to do this only after the game's content had been set in stone, in order to sell it on discs at launch.</p>\n<p>\"What we wanted to do is have a separate set of achievements for the Slayer Seal than the normal playthrough, and they would be sort of mutually exclusive,\" studio co-founder Andrew McLennan-Murray explains in a chat with the <a href=\"https://www.youtube.com/watch?v=8D9vE3mt9-w&amp;t=3829s\" target=\"_blank\" rel=\"noopener\">Between Levels Podcast</a>. \"And our original vision for Slayer Seal wasn't just an easy mode, but also like, an alternate game mode, [to] experience the game in a whole different way. And so even if you're a hardcore player, to go back and play again with the Slayer Seal, earn those additional achievements.\"</p><p>Unfortunately, McLennan-Murray added, \"we didn't know that since we have a disc version of the game that was simultaneously shipping with the [digital] version, all those achievements were defined like months, months and months ago. And we came to find out that, oh you can't change these anymore. They're like, locked in on the consoles.</p>\n<p>\"And we were like, there isn't any for the Slayer Seal, and that was supposed to be the whole thing,\" he went on. \"So we ended up kind of cornered there, where we had to lock all the achievements at some point. And in the open beta the language around it was a little different, because we still thought we could do this 'duelling achievements' kind of thing. And then when we realised we couldn't, we were like, well what can we do now?\"</p>\n<p>Pressed by a podcast host about whether Cold Symmetry might yet introduce another set of achievements, specifically for disabled players who might need Slayer Seal to get through the game, McLennan-Murray agreed that this might form part of some free DLC. \"It wasn't that we had planned to lock everybody out,\" he reiterated. \"So you know, maybe there will be some other tools that we introduce in the future, that will make the game more accessible.\" (Methods for updating games with new achievements vary between platforms.)</p>\n<p>As I delicately hinted above, I don't give a tinker's cuss about achievements, myself, but I do like the idea of using them to motivate different ways of playing. It's also intriguing to read that the Slayer Seal wasn't intended simply as a diegetic difficulty setting, despite marketing to that effect.</p><p>Anyway, if you need advice about making headway in Cold Symmetry's latest, let me elbow you towards our <a href=\"https://www.rockpapershotgun.com/mortal-shell-2-walkthrough\" target=\"_blank\" rel=\"noopener\">Mortal Shell 2 walkthrough</a>. The game has been <a href=\"https://www.rockpapershotgun.com/mortal-shell-2s-first-balance-patch-makes-its-in-game-economy-a-lot-more-lenient-and-nerfs-some-enemies-and-bosses-for-a-smoother-ride\" target=\"_blank\" rel=\"noopener\">updated a bit since launch</a>, partly to stop people <a href=\"https://www.rockpapershotgun.com/amid-accusations-of-a-post-beta-difficulty-bump-mortal-shell-2-devs-patch-the-new-soulslike-to-stop-players-riposting-so-hard-they-steal-enemy-weapons\" target=\"_blank\" rel=\"noopener\">riposting so hard they accidentally stole enemy weapons</a>.</p>"},{"title":"Appendix to Montesquieu’s Day in Court: Recovering a Classical Understanding of Separated Powers Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/montesquieus-day-in-court-appendix/","category":"law","categoryLabel":"Law","w ><p>Loving v. United States</p><p>517 U.S. 748 (1996)</p><p>756–57</p><p>Plaut v. Spendthrift Farm, Inc.</p><p>514 U.S. 211 (1995)</p><p>241–42 (Breyer, J., concurring in the judgment)</p><p>Mistretta v. United States</p><p>488 U.S. 361 (1989)</p><p>394</p><p>Young v. United States <em>ex rel.</em> Vuitton et Fils S.A.</p><p>481 U.S. 787 (1987)</p><p>824 (Scalia, J., concurring in the judgment)</p><p>Bowsher v. Synar</p><p>478 U.S. 714 (1986)</p><p>721–22</p><p>INS v. Chadha</p><p>462 U.S. 919 (1983)</p><p>999 n.25 (White, J., dissenting)</p><p>Nixon v. Adm’r of Gen. Servs.</p><p>433 U.S. 425 (1977)</p><p>442 n.5</p><p>Buckley v. Valeo</p><p>424 U.S. 1 (1976)</p><p>120–21 (per curiam)</p><p>Bronston v. United States</p><p>409 U.S. 352 (1973)</p><p>360</p><p>Scales v. United States</p><p>367 U.S. 203 (1961)</p><p>266–67 (Douglas, J., dissenting); 273–74 (Douglas, J., dissenting)</p><p>Dennis v. United States</p><p>341 U.S. 494 (1951)</p><p>590 n.5 (Douglas, J., dissenting)</p><p><em>In re</em> Oliver</p><p>333 U.S. 257 (1948)</p><p>269 n.23</p><p>Cramer v. United States</p><p>325 U.S. 1 (1945)</p><p>15 n.21; 24</p><p>Myers v. United States</p><p>272 U.S. 52 (1926)</p><p>116; 230 (McReynolds, J., dissenting); 234 (McReynolds, J., dissenting)</p><p>Farrington v. Tennessee</p><p>95 U.S. 679 (1877)</p><p>682</p><p>Trist v. Child</p><p>88 U.S. (21 Wall.) 441 (1874)</p><p>450 n.†</p><p><em>Ex parte</em> Garland</p><p>71 U.S. (4 Wall.) 333 (1866)</p><p>388 (Miller, J., dissenting)</p><p><em>Ex parte</em> Milligan</p><p>71 U.S. (4 Wall.) 2 (1866)</p><p>65</p><p>Teal v. Felton</p><p>53 U.S. (12 How.) 284 (1851)</p><p>287–88</p><p>United States v. Wood</p><p>39 U.S. (14 Pet.) 430 (1840)</p><p>437–38</p><p>Bank of Augusta v. Earle</p><p>38 U.S. (13 Pet.) 519 (1839)</p><p>538</p><p>Rhode Island v. Massachusetts</p><p>37 U.S. (12 Pet.) 657 (1838)</p><p>691</p><p>Jackson v. Ashton</p><p>36 U.S. (11 Pet.) 229 (1837)</p><p>239</p><p>Johnson v. M‘Intosh</p><p>21 U.S. (8 Wheat.) 543 (1823)</p><p>567 &amp; n.a; 569–70; 570 n.a</p><p>Green v. Biddle</p><p>21 U.S. (8 Wheat.) 1 (1823)</p><p>36</p><p>Brown v. United States</p><p>12 U.S. (8 Cranch) 110 (1814)</p><p>113–14; 145</p><p>Fletcher v. Peck</p><p>10 U.S. (6 Cranch) 87 (1810)</p><p>121</p><p>Cooper v. Telfair</p><p>4 U.S. (4 Dall.) 14 (1800)</p><p>17–18</p>"},{"title":"Create Custom Windows 11 Notifications to Remind Yourself of Anything","source":"Wired","author":"@wired","url":"https://www.wired.com/story/create-custom-windows-11-notifications-to-remind-yourself-of-anything/","category":"tech","categoryLabel":"Technology","wordCount":699,"readingTime":4,"content":"<p>While there are plenty of ways to <a href=\"https://www.wired.com/story/silence-gadgets-do-not-disturb-nighttime/\" target=\"_blank\" rel=\"noopener\">limit notifications</a> on our digital devices and avoid distraction overload, there’s nothing inherently wrong with these alerts. They just need to be well managed and kept in their place.</p><p>Keeping <a href=\"https://www.wired.com/tag/notifications/\" target=\"_blank\" rel=\"noopener\">notifications</a> useful and timely can help you get more done in the day, not less, and <a href=\"https://www.wired.com/tag/windows/\" target=\"_blank\" rel=\"noopener\">Windows 11</a> comes with built-in tools for setting up custom notifications that run on a schedule you specify.</p><p>You can use these scheduled notifications however you want. Maybe you need reminders to take breaks, or you want to make sure you devote specific blocks of time to certain projects, or you need alerts for when it’s time to go and pick the kids up.</p><p>However you want to use these custom notifications, here’s how to set them up—plus some extra apps that can help too.</p><h2>Custom Notifications in Windows 11</h2><p>If you want to set up custom notifications in Windows 11 without turning to an app, the Task Scheduler is the utility you want. Type “task scheduler” into the search box on the taskbar or the Start menu, then select it when it appears.</p><p>Open the <strong>Action</strong> menu, choose <strong>Create Basic Task</strong>, and then give it a suitable name and description so you can identify it later. Click <strong>Next</strong>, and you can set the frequency of the notification: Your options are <strong>Daily</strong>, <strong>Weekly</strong>, <strong>Monthly</strong>, <strong>One time</strong>, <strong>When the computer starts</strong>, <strong>When I log on</strong>, and <strong>When a specific event is logged</strong>, so there’s a lot of flexibility.</p><p>Click <strong>Next</strong> again, and if you’ve chosen a recurring task then you can set exactly when it recurs—4 pm every afternoon, for example. Click <strong>Next</strong>, then choose <strong>Start a program</strong>, and select <strong>Next</strong> again. This opens up the dialog box screen for composing your notification.</p><p>In the <strong>Program/script</strong> field, you need to enter “msg,” and in the <strong>Add arguments (optional)</strong> field, you put your actual notification text: “Reminder: get up and do some stretching” or whatever it happens to be. With another click on <strong>Next</strong> you can review your notification, and then choose <strong>Finish</strong> to confirm.</p><p>Your notification is created, and will pop up at the specified time, whether or not Task Scheduler is open. If you ever need to edit or delete the task, you can head back to Task Scheduler to find it—it’ll be listed under the <strong>Task Scheduler Library</strong> heading, and you can right-click on the task to make changes.</p><h2>Setting Notifications Through Apps</h2><p>The appeal of the Task Scheduler is that it’s built right into the Windows operating system, so you don’t need any other apps running to get your notifications, but there are ways to do this with apps as well. The Microsoft Clock app comes preinstalled with Windows, for example, and lets you set custom alarms.</p><p>Once you’ve launched the app through the Start menu or taskbar search box, select <strong>Alarm</strong> to set one. Click on the <strong>+</strong> (plus) button in the lower right corner to create a new alarm, and you can give it a name—which is essentially the text you want for your notification. You can configure the time for the alarm, and when it should recur.</p><p>If that doesn’t do exactly what you want, another app that comes with Windows is Microsoft To Do—again, you can search for it from the taskbar or Start menu. As the name suggests, this is a fully fledged to-do app, but you can create custom notifications through it by attaching reminders to tasks.</p><p>Click <strong>Add a task</strong> to get started, and once you’ve given your new task a name, you can set the reminder details: What time and date you want the alert to appear, and whether or not you want the notification to repeat on a schedule. There's also the option to put your reminders into categories, if needed.</p><p>In terms of third-party apps, any clock, reminder, or to-do list app would do the job—something like <a href=\"https://ticktick.com/\" target=\"_blank\" rel=\"noopener\">TickTick</a>, for instance—but these take you further away from the clean simplicity of just generating custom notifications and nothing else. Those apps will also come with extras you don’t necessarily need for this particular task.</p>"},{"title":"The Unique Horrors of A.I. Food Slop","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/infinite-scroll/the-unique-horrors-of-ai-food-slop","category":"fun","categoryLabel":"Interesting Reads","wordCount":1242,"readingTime":7,"content":"<p>What do we hope to communicate when we film and photograph food? In his 1957 collection, “<a href=\"https://www.amazon.com/dp/0374521506\" target=\"_blank\" rel=\"noopener\">Mythologies</a>,” Roland Barthes argued that food photography was often an exercise in whitewashing: the highly stylized pictures featured in glossy magazines, which he called “ornamental cookery,” precluded a person “from touching on the real problems concerning food,” such as the “primary nature of foodstuffs, the brutality of meat or the abruptness of sea-food.” These photos were “meant for the eye alone, since sight is a genteel sense,” Barthes wrote. Modern food television, meanwhile, engaged in a different kind of beautification. Bill Buford, <a href=\"https://www.newyorker.com/magazine/2006/10/02/tv-dinners\" target=\"_blank\" rel=\"noopener\"><em>writing</em></a> for <em>The</em> <em>New Yorker</em>, in 2006, explained that cooking shows often filmed food “so close that you can see an ingredient’s ‘pores’ . . . which then triggers some kind of Neanderthal reflex.” (As Bob Tuschman, then the Food Network’s head of programming, told Buford: “If you’re flicking from channel to channel and come upon food that has been shot in this way, you will be hardwired as a human being to stop, look, and bring it back to your cave.”) The term “food porn” grew in popularity around this time, becoming a catchall for visuals of ornate dishes “divorced from [their] nutritive or taste qualities,” as the critic Richard Magee put it, in a journal article from 2007. Salivating over images of a blue-rare steak or a crystallized-apple crumble permitted one to feel as if culinary appreciation could be refined in the abstract, without needing to perform labor, expend capital, or actually eat anything.</p><p>The next frontier of food imagery has proven far less appealing than whatever food porn was. From Minneapolis to Hexentanzplatz, restaurants are plastering menus and promotional materials with A.I.-generated renditions of <a href=\"https://x.com/samfbiddle/status/2091599814144467298\" target=\"_blank\" rel=\"noopener\">shrimp scampi</a> and <a href=\"https://x.com/REMARKSIST/status/2092937530257617036\" target=\"_blank\" rel=\"noopener\">quiche</a>, <a href=\"https://x.com/RifewithKatie/status/2077412505576472913\" target=\"_blank\" rel=\"noopener\">chicken nuggets</a> and <a href=\"https://x.com/Radio33Crystal/status/2091657444359577817?s=20\" target=\"_blank\" rel=\"noopener\"><em>burritos</em></a>, <a href=\"https://www.businessinsider.com/menus-are-getting-ai-sloppified-and-the-images-are-terrifying-2026-8\" target=\"_blank\" rel=\"noopener\">Italian subs</a> and <a href=\"https://www.reddit.com/r/antiai/comments/1vmn4cl/aislop_food_images_on_a_menu_should_be_declared_a/\" target=\"_blank\" rel=\"noopener\">bacon, egg, and cheeses</a>. Anyone with even the mildest case of trypophobia—the sense of revulsion from tiny clusters and holes—should avert their eyes. A nauseating, nightmarish quality defines A.I.’s insectified interpretation of human cuisine, as if food were just another surrealist goo to stochastically iterate upon. This may explain the categorical outrage over this latest misuse of generative A.I.: such renderings of food—genuinely, slop—offend the materiality of the living in a way that A.I.’s distortions of words and other inanimate objects somehow do not. These images violate science; they mock life itself. It is Barthes’ conception of ornamental cookery infested with maggots; it is the Food Network, aired from hell.</p><p>As A.I. weasels its way into every corner of daily life, it was only a matter of time before it came for our food. Unlike film and music and literature, there have hardly been any anxieties about the machines coming for cooking—though perhaps there should be. Beyond graphic design, restaurants have started integrating A.I. into their business operations to “optimize both topline sales and overall profitability,” according to <a href=\"https://www.newyorker.com/culture/the-food-scene/the-return-again-of-the-power-lunch-four-twenty-five\" target=\"_blank\" rel=\"noopener\"><em>Jean-Georges Vongerichten</em></a>, a chef who owns and operates fine-dining establishments around the world. By inserting “sales metrics and menu design” into a large language model like ChatGPT, Vongerichten says that his restaurants can determine which dishes belong on a menu and which don’t, and which should be prioritized to maximize profits. Ben Triola, the executive chef at the Chloe, in New Orleans, <a href=\"https://www.foodandwine.com/restaurants-ai-artificial-intelligence-technology-11683792\" target=\"_blank\" rel=\"noopener\">told</a> <em>Food &amp; Wine</em> that he used A.I. for inspiration to produce “images and ideas foreign to classically trained chefs by pulling ingredient pairings and plating ideas from across the world,” an exercise that Vongerichten also confessed to implementing.</p><p>One could argue that automating administrative tasks—such as answering customer phone calls and handling reservations—may save a business money and time, in turn allowing its staff to devote their energies to food preparation and culinary experimentation. But employing A.I. to “collaborate” on recipes and menu development seems to eschew a fundamental element of preparing and sharing food. “The food we make for ourselves, and for our people, reflects where we come from and what we turn to for comfort,” the celebrity chef Marcus Samuelsson wrote, in a <a href=\"https://www.nytimes.com/2023/06/22/special-series/marcus-samuelsson-cooking-heritage.html\" target=\"_blank\" rel=\"noopener\">2023 essay</a> for the <em>Times</em>. “It shows love and respect. It is a language that is learned.” Such is a common, almost clichéd, refrain among professional and home cooks: the most nourishing, affirming food contains some ineffable concoction of soul and spirit and ingenuity. Although the essayist William Deresiewicz has <a href=\"https://www.nytimes.com/2012/10/28/opinion/sunday/how-food-replaced-art-as-high-culture.html\" target=\"_blank\" rel=\"noopener\">argued against romanticizing food</a>, writing that food cannot be considered art because it “does not speak” and houses no philosophical ambiguity, a dish can nonetheless communicate a whole slew of subterranean meanings: a family or geographical history; a long-forgotten memory; a feeling of almost inexorable exaltation or disgust. For this reason, Triola’s belief that a machine’s aggregation acumen presents chefs with an innovative tool for designing recipes strikes me as misguided. Just as an L.L.M. pulls “images and ideas” from literary texts yet produces vapid and meaningless “literature” of its own, a statistical model can pair flavors and ingredients without conveying any of the essential spirit or experience needed to make a dish sing. It is food not as culture, and not even as science, but as math.</p><p>Have visual artists ever been able to apprehend the spirit and sanctity of what we eat? In the mid-eighteen-hundreds, amid the advent of photography, the Victorians shot still-life arrangements of lizards crawling over fruit and dead game birds hanging from a nail, capturing with their new technology the savagery of hunger, the oneness between natural decay and human appetite. For much of the following century, food photography functioned as a sort of ethnographic art, a form of restrained realism preoccupied with light and shadow, shape and symbolism. But, in the nineteen-thirties, the introduction of color printing to advertising changed how food was shot on camera, and thus conceived of culturally. Dishes were now a thing to be drooled over and sold, products that emphasized the sensual, the luscious, the beautiful: thick triple-layered cakes and buttered biscuits, perfectly proportioned milkshakes and overflowing cartons of French fries. As advertising became more sophisticated, so did photo manipulation. Squares of cardboard were pinned under burger patties to reinforce plumpness; motor oil was poured over pancakes so as not to overly moisten them. The surreality of commercial food photography and its later evolution into food porn may have been an artificial and sensationalist representation of the things we ate, but it at least managed to seduce. Its concerns were aesthetic, its ends gluttony and lust.</p><p>Restaurants choosing to showcase computer-generated approximations of the dishes they serve inspire neither gluttony nor lust. A menu promising a glistening digital cheesesteak or an eerily geometrical turkey club evokes little more than horror in those who behold it. Why, then, are so many eateries and establishments relying on generative A.I. to create their promotional materials? It’s free, for starters—human photographers and graphic designers cost money, even bad ones. Most of the offenders, too, appear to be delis and bodegas and fast-casual food carts, venues where quality is secondary to moving product quickly and cheaply out the door. The A.I. images are a sort of shorthand for saying, Yes, we serve food, but it is slop, just like the photos we use to market it—likely frozen and factory-made, shoved into a grease-caked frier, and still somehow lukewarm and soggy when you take your first bite. It’s the opposite of ornamental cookery; these images, as gross as they are, invite us to confront the truth about what it is that we’re feeding ourselves. <em>♦</em></p>"}];
