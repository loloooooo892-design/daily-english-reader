<script>
var articles = [{"title":"Watching Roku’s AI channel is like eating from a trough","source":"The Verge","author":"Charles Pulliam-Moore","url":"https://www.theverge.com/entertainment/976939/roku-fairground-ai-fast-channel","category":"tech","categoryLabel":"Technology","wordCount":763,"readingTime":4,"content":"<p>The appeal of <a href=\"https://www.theverge.com/23680217/fast-services-tubi-roku-pluto-tv\" target=\"_blank\" rel=\"noopener\">free ad-supported streaming television</a> (FAST) channels has always been the way they make it easier to (re)discover classic films and series. But Roku’s latest experiment in the FAST space has less to do with traditionally produced entertainment and is entirely focused on giving viewers access to a constant source of AI-generated content.</p><p>This week, <a href=\"https://cordcuttersnews.com/roku-adds-4-new-free-channels-to-roku-tvs-roku-players-in-august-2026/\" target=\"_blank\" rel=\"noopener\">Roku added four new channels</a> to its library of streamable programming. Along with dedicated feeds for old episodes of <em>Mad TV</em>, <em>Whose Line Is It Anyway?</em>, and a variety of Black sitcoms, the platform also debuted a 24/7 stream filled with projects from <a href=\"https://fairground.tv/\" target=\"_blank\" rel=\"noopener\">Colin Petrie-Norris’ AI startup, Fairground</a>. Partnering with Roku is a significant step up for Fairground, which launched in 2025 and is <a href=\"https://variety.com/2025/digital/news/fairground-xumo-colin-petrie-norris-ai-generated-movies-1236394554/\" target=\"_blank\" rel=\"noopener\">reportedly working on</a> its own AI-generated adaptations of <em>Robin Hood </em>and <em>Dracula</em>. But watching the Fairground channel, you get the distinct sense that Roku hasn’t really gotten all that much out of the deal aside from the ability to say that it’s getting in on the gen AI craze.</p><p>Like all FAST channels, Fairground AI Creator TV is filled with a curated selection of programming that you’re meant to watch somewhat passively. While you can scrub forward and backward a few seconds, there’s no way to choose exactly what kinds of videos the channel serves up. That might add a fun sense of discovery to the channel if it featured series and films that were actually riveting. But everything that I saw while watching for about an hour was more or less the same kind of short-form slop that text-to-video models have become known for.</p><p>Aside from being produced with AI, there’s no consistent theme or genre to any of Fairground’s programming — all of which is made by a selection of content creators who have partnered with the company. Some videos are clearly generated by models trained on footage ripped from professionally produced anime, while others just look like terrible “lifelike” CGI. Surprisingly, there were semi-cohesive narratives to some of what I watched. I could follow what was going on in a “live-action” horror about people destroying a demon by making fun of it, and I got the sense that a fantasy about Greek heroes might have been <a href=\"https://www.theverge.com/entertainment/965616/ash-koosha-odysseus-the-fall-foundtain-zero-tilly-norwood\" target=\"_blank\" rel=\"noopener\">inspired by <em>The Odyssey</em></a>.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/Screenshot-2026-08-06-at-1.31.37-PM.png?quality=90&amp;strip=all&amp;crop=17.008928571429,0,65.982142857143,100\" target=\"_blank\" rel=\"noopener\"></a></p><p>Image: Roku / Fairground</p><p>You can tell from the videos’ length and the way their audio is mixed that there was some degree of post-production editing. But the videos’ general lack of visual polish makes it obvious that they were cobbled together from machine-generated clips rather than shots crafted by a human artist. And the overall shoddiness of Fairground’s programming becomes especially apparent whenever the stream cuts to an ad — this is a FAST channel — for one of the traditionally produced movies and shows Roku offers.</p><p>Fairground’s website <a href=\"https://fairground.tv/company/about-us\" target=\"_blank\" rel=\"noopener\">makes a point</a> of emphasizing that it pays its content partners for their generations in addition to giving them an undisclosed share of the platform’s revenue. There’s no mention of which models are used to create Fairground’s content or whether it secured rights to use whatever training data is in the mix. But Fairground does stress that its programming is designed for “the living room, not the feed,” which says a lot about what kind of niche Petrie-Norris and his team are trying to carve out.</p><p>Most AI production startups have framed themselves as being poised to revolutionize the entertainment industry with technologies that will render traditional production workflows obsolete. Generally, the “Hollywood is so cooked” set insists that AI will soon be able to churn out films and shows comparable to a major studio’s, but that doesn’t really seem like the approach Fairground is leaning into. Rather than trying to be just as good or better than regular programming, it feels like Fairground simply wants its content to exist in the same general space as stuff that people might intentionally go looking for. Apparently, Roku thinks Fairground’s offerings are good enough to be platformed, which is depressing, but not altogether shocking as <a href=\"https://www.theverge.com/streaming/950644/fox-roku-acquisition-lachlan-murdoch-fox-news-consolidation\" target=\"_blank\" rel=\"noopener\">the company enters its Fox era</a>.</p><p>Fairgrounds’ content isn’t at all impressive, but its presence on Roku gives the startup a way to reach a massive audience of potential viewers. It’s easy to imagine an AI company seeing a business opportunity in the “looking for something mindless to play in the background” crowd, but this stuff doesn’t feel like something anyone would want to put on.</p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Charles Pulliam-Moore</li></ul>"},{"title":"Divided D.C. Circuit Panel Upholds Injunction Against White House Ballroom Construction; Next Stop, One First Street","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/08/07/divided-d-c-circuit-panel-upholds-injunction-against-white-house-ballroom-construction-next-stop-one-first-street/","category":"law","categoryLabel":"Law","wordCount":1312,"readingTime":7,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/tag/standing/\" target=\"_blank\" rel=\"noopener\">Standing</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/08/07/divided-d-c-circuit-panel-upholds-injunction-against-white-house-ballroom-construction-next-stop-one-first-street/\" target=\"_blank\" rel=\"noopener\">Divided D.C. Circuit Panel Upholds Injunction Against White House Ballroom Construction; Next Stop, One First Street</a>\n\t\t\t\t\t<p>Judge Rao writes a powerful dissent that is likely to find a receptive audience at One First Street. </p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.7.2026 1:23 PM\n</p>\n\t</h2>\n\t\n\t\t<p>This morning, declaring that \"the White House is the People's House,\" a divided panel of the U.S. Court of Appeals for the D.C. Circuit upheld the district court injunction against the construction of the new White House ballroom. According  to the court, \"Whether or not a massive ballroom should be constructed is for Congress to decide and is not a matter for Executive self-help.\"</p>\n<p>The 100-page majority opinion in <a href=\"https://media.cadc.uscourts.gov/opinions/docs/2026/08/26-5123-2187096.pdf\" target=\"_blank\" rel=\"noopener\"><em>National Trust for Historic Preservation v. National Park Service</em></a> was written jointly by Judges Millett and Garcia. Judge Rao dissented.</p>\n<p>The panel stayed its decision for fourteen days for the express purpose of allowing the Trump Administration to seek review from the Supreme Court, and I would expect such a filing in due course.</p>\n<p>If the Supreme Court does intervene, either on the interim docket or after argument, this case might present a good opportunity for the justices to revisit--and perhaps restrain--the permissive approach to standing in cases against the federal government, particularly those relying upon aesthetic standing. As Judge Rao explains in her dissent, there are serious questions about NTHP's standing here, both as an organization and as a representative of members who claim \"injury\" from the ballroom's construction.</p>\n<p>On the first point, it is not clear NTHP can claim standing on its own behalf given its limited charter:</p>\n<blockquote><p>The fundamental problem for the Trust's standing is that this lawsuit is not germane to its purposes because Congress did not provide the Trust with any statutory authority or interest pertinent to the White House. . . .</p>\n<p>The Trust . . . is not a private association. It is a congressionally chartered nonprofit corporation that \"owes its creation to an act of Congress\" and \"derives all of its capacities, faculties and powers\" from statute.  . . . As a congressionally chartered nonprofit, the Trust can sue only to vindicate its statutory authority. The Trust's lawsuit is not germane to its statutory purposes and powers. Congress empowered the Trust to serve four enumerated \"purposes\": (1) receiving donations of historic sites, buildings, and objects; (2) preserving and administering those sites, buildings, and objects; (3) accepting and administering gifts to carry out its preservation efforts; and (4) executing other specified statutory functions. 54 U.S.C. § 312102(b). The list  notably does not include any sweeping purposes and simply states the principal actions the Trust is authorized to take. Congress also provided more detail about the \"powers\" of the Trust, all of which may be exercised only \"[t]o the extent necessary to enable it to carry out the functions vested in it by this chapter.\" Id. § 312105(a). Of particular relevance here, the Trust may acquire real property for preservation but is prohibited from acquiring property within the National Park System. See id. § 312105(g).</p>\n<p>The White House is located within President's Park, which is part of the National Park System. The Trust therefore has no statutory authority related to the White House: it cannot acquire donations of real property within President's Park, and it cannot preserve or administer such property. . . .</p>\n<p>Our associational standing precedents allow private entities some latitude to define their purposes. The Trust, however, is a federal entity limited to exercising the powers conferred by Congress. It cannot generate standing by redefining its purposes to include aesthetic oversight of the White House, property that Congress has explicitly withheld from the Trust's purview. This lawsuit is not germane to the Trust's statutory authority, and therefore the Trust lacks standing to challenge the building of the ballroom</p></blockquote>\n<p>As Judge Rao notes further, the theory of germaneness adopted by the panel majority were forfeited by the parties (and we know how the current Court feels about lower courts deviating from the party-presentation principle).</p>\n<p>Judge Rao also challenges the overly broad assertion of aesthetic injury asserted by the NTHP member who submitted an affidavit to support the organization's standing.</p>\n<blockquote><p>The Trust rests its standing on a single member, Alison Hoagland, who alleges aesthetic harm that might arise from completion of the ballroom. The district court's standing analysis rests on an embellished account of Hoagland's declaration, filling in claims of harm that she perhaps could have made but did not. Looking at Hoagland's actual statements, she has failed to demonstrate an imminent and particularized injury in fact. . . .</p>\n<p>Her asserted aesthetic injury can be understood in two ways—as a speculative injury to her particular use of the White House, or as an imminent but generalized injury from incidentally viewing the ballroom. Either way, she lacks standing to sue.</p>\n<p>If Hoagland's aesthetic injury is to her specific use and enjoyment of the White House, as the district court and majority maintain, she fails to demonstrate her harm is imminent. In her declaration, she does not state any concrete plans to use and enjoy President's Park. Hoagland details her academic credentials, past academic work, and historical preservation efforts around Washington, D.C., but she nowhere states that her work or her other activities specifically require viewing the White House without the planned ballroom. . . . Hoagland instead claims that she expects to \"travel to the area around the White House … about once a month\" to \"attend functions in neighboring buildings.\" Id. ¶ 12. Her assertions about future use of President's Park are tenuous at best and do not satisfy the Trust's burden at the preliminary injunction stage to make a clear showing of imminent aesthetic injury to a member.</p>\n<p>If Hoagland's aesthetic injury is instead incidentally viewing a ballroom she finds displeasing, her harm is imminent but not particularized. Her declaration merely states that about once a month she will walk by the White House on her way to other buildings. Id. On these walks, she anticipates being \"impressed\" with the White House but displeased with the planned ballroom. Id. These allegations mirror those of the petitioner in Environmental Defense Fund, who lacked standing because she complained only about an \"eyesore\" that she occasionally passed while traveling elsewhere. 2 F.4th at 968–69. Since Hoagland's objection to the appearance of the ballroom could be made by anyone planning to travel by the White House, it constitutes nothing more than a generalized grievance insufficient for Article III standing. . . .</p>\n<p>By allowing standing for the Trust based only on Hoagland's declaration, the majority's reasoning would permit adjudication of any government action that a plaintiff finds unsightly. But that contravenes the settled understanding that \"general emotional 'harm,' no matter how deeply felt, cannot suffice for injury-in-fact for standing purposes.\" Humane Soc. of U.S. v. Babbitt, 46 F.3d 93, 98 (D.C. Cir. 1995). I would decline the Trust's \"unprecedented and limitless\" assertion of standing, which would improperly convert the federal courts into a \"vehicle for the vindication of the value interests of concerned bystanders.\" Alliance, 144 S. Ct. at 1556, 1562 (cleaned up).</p>\n<p>In sum, Hoagland falls short of making a clear showing of standing for a preliminary injunction. And having failed to demonstrate it likely has a member with standing, the Trust lacks associational standing.</p></blockquote>\n<p>Judge Rao also contests the majority's statutory holding, but I suspect the standing issues alone will be enough to engage the Supreme Court's interest and (if I had to predict) reverse this decision.</p>\n<p>Perhaps the bigger question is whether we will get a standing opinion from Justice Kavanaugh, who is perhaps becoming the Court's leading expositor of standing principles, having authored <a href=\"https://www.supremecourt.gov/opinions/20pdf/20-297_4g25.pdf\" target=\"_blank\" rel=\"noopener\"><em>Transunion</em></a>, <a href=\"https://www.supremecourt.gov/opinions/22pdf/22-58_i425.pdf\" target=\"_blank\" rel=\"noopener\"><em>U.S. v. Texas</em></a>, <a href=\"https://www.supremecourt.gov/opinions/23pdf/23-235_n7ip.pdf\" target=\"_blank\" rel=\"noopener\"><em>Alliance for Hippocratic Medicine</em></a>, and <a href=\"https://www.supremecourt.gov/opinions/24pdf/24-7_8m58.pdf\" target=\"_blank\" rel=\"noopener\"><em>Diamond Alternative</em></a>.</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/07/ai-combines-the-illusion-of-thorough-review-and-analysis-with-the-temptations-of-speed-and-low-cost/\" target=\"_blank\" rel=\"noopener\">NEXT: AI \"Combines the Illusion of Thorough Review and Analysis with the Temptations of Speed and Low Cost\"</a>\n    </p>\n\t<a href=\"https://reason.com/tag/standing/\" target=\"_blank\" rel=\"noopener\">Standing</a><a href=\"https://reason.com/category/law/administrative-law/\" target=\"_blank\" rel=\"noopener\">Administrative Law</a><a href=\"https://reason.com/tag/white-house/\" target=\"_blank\" rel=\"noopener\">White House</a><a href=\"https://reason.com/tag/trump-administration/\" target=\"_blank\" rel=\"noopener\">Trump Administration</a><a href=\"https://reason.com/tag/neomi-rao/\" target=\"_blank\" rel=\"noopener\">Neomi Rao</a>"},{"title":"Couple's dispute over playing Slay the Spire 2 in bed gets a ruling from comedian John Hodgman: 'Pick an arbitrary battle and stick with it'","source":"PC Gamer","author":"Christopher Livingston","url":"https://www.pcgamer.com/games/roguelike/couples-dispute-over-playing-slay-the-spire-2-in-bed-gets-a-ruling-from-comedian-john-hodgman-pick-an-arbitrary-battle-and-stick-with-it/","category":"gaming","categoryLabel":"Gaming","wordCount":826,"readingTime":5,"content":"<p>Amidst the constant flood of negative and depressing stories about the gaming industry, it's nice to get a glimmer of good news now and then. Today that news comes via the court of Judge John Hodgman, who has ruled that it is perfectly legal to play Slay the Spire 2 in bed—even if the person in bed with you doesn't agree.</p><p>Some background, if you don't know what the hell I'm talking about: actor, author, and all-around funny person John Hodgman has a podcast called <a href=\"https://maximumfun.org/podcasts/judge-john-hodgman/\" target=\"_blank\" rel=\"noopener\">Judge John Hodgman</a> where he rules on the disputes brought into his virtual courtroom.</p><p>These gentle disputes are typically between friends, family members, or partners, and consist of good-natured beefs or unusual disagreements: for example, one memorable case I listened to recently involved one person who thought it was perfectly normal to <a href=\"https://www.youtube.com/watch?v=-_x7chX_bGk\" target=\"_blank\" rel=\"noopener\">flush leftover soup down the toilet</a> instead of dumping it in the sink, and another who (rightfully, imho) thought that was a pretty goddamn weird thing to do.</p><p>Hodgman hears both sides of cases like this and then makes a thoughtful ruling on who is in the right, with the plaintiff and defendant agreeing to abide by his decision. (I won't spoil the soup case: it is fascinating.)</p><p>This most recent dispute brought before Judge Hodgman involves whether or not it's OK to play games, particularly <a href=\"https://www.pcgamer.com/slay-the-spire-2/\" target=\"_blank\" rel=\"noopener\">Slay the Spire 2</a>, when in bed with a partner, and really, who better to adjudicate such a case than John Hodgman? He not only plays PC games (until recently he was regularly <a href=\"https://www.youtube.com/@JudgeJohnHodgmanPod/search?query=simcity\" target=\"_blank\" rel=\"noopener\">streaming himself playing SimCity 2013</a>) but he also portrayed the PC in the old <a href=\"https://www.youtube.com/watch?v=0eEG5LVXdKo\" target=\"_blank\" rel=\"noopener\">Mac vs PC</a> ads that foolishly tried to convince us that a hoodied, goateed Justin Long was more appealing than a nerdy yet dapper John Hodgman. What the hell were you thinking, Apple?</p><p>In the case, Dan complains that his fiancée, Elissa plays her favorite game, Slay the Spire 2, in their bed on a laptop. Dan believes screens don't have a place in the bedroom and Elissa's nighttime gaming habits are ruining her chances for healthy sleep. Elissa says playing games before bedtime actually <em>helps </em>her sleep and she has trouble drifting off if she doesn't do some gaming before bed. Who's right and who's wrong?</p><p>Well, as you already know from subtle context clues like me saying earlier that Dan is wrong, Dan is wrong—but for a few reasons. First, Dan admits Elissa's gaming habits aren't actually keeping him awake at night: the light from her laptop screen and whatever tapping or clicking she's doing don't interfere with his rest at all.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>\"Pick an arbitrary battle and stick with it,\" Hodgman says when Dan admits to stubbornly storming off to sleep on a couch when he sees Elissa bringing her laptop into their bedroom.</p><p>\"One of the major arguments for marriage is to have someone in the room with you while you're playing a video game,\" Hodgman says. \"When Dan leaves the premarital bed out of spite to prove a point to you, Elissa, how does that make you feel? Really eager to marry him?\"</p><p>I know there's a school of thought that says you should cut down on screentime right before bed, and some folks feel similarly to Dan that bedrooms should only be for sleeping and, well, let's call it \"WooHoo\" to keep it videogame related.</p><p>But Judge Hodgman ultimately rules in favor of Elissa because, honestly, Dan really doesn't have a case: he wasn't himself losing sleep due to Elissa's gaming habits, he just believed she should share an identical sleeping philosophy. And since he's her fiancee and not, y'know, <em>her dad</em>, Hodgman ruled Elissa can decide for herself what she wants to do before going to sleep.</p><p>I think it's a sound ruling, though I do have one sticking point: as a legal expert myself (I took a single business law class in community college 15 years ago and got a B) I think Hodgman should have recused himself from this case, and any case dealing with sleep, as he frequently advertises a mattress company on his podcast. Classic case of conflict of interest and grounds for appeal.</p><p>You can watch the entire case <a href=\"https://youtu.be/E_msT4suxpw?si=PITNDkFOL2dbFQvq\" target=\"_blank\" rel=\"noopener\">on YouTube</a> or download the Judge John Hodgman podcast <a href=\"https://maximumfun.org/podcasts/judge-john-hodgman/\" target=\"_blank\" rel=\"noopener\">here</a>.</p>\n\n<p>Chris started playing PC games in the 1980s, started writing about them in the early 2000s, and (finally) started getting paid to write about them in the late 2000s. Following a few years as a regular freelancer, PC Gamer hired him in 2014, probably so he'd stop emailing them asking for more work. Chris has a love-hate relationship with survival games and an unhealthy fascination with the inner lives of NPCs. He's also a fan of offbeat simulation games, mods, and ignoring storylines in RPGs so he can make up his own.</p>"},{"title":"A Mostly True History of Marco Rubio","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/a-mostly-true-history-of-marco-rubio","category":"fun","categoryLabel":"Interesting Reads","wordCount":605,"readingTime":4,"content":"<p>For a while—like, the first thirty or forty years—being Marco Rubio was somewhat normal.</p><p>No one knows Marco Rubio’s age. It’s part of his mystery. So is his height. Look it up. No one knows.</p><p>Also, you can’t call him just Marco, or Mr. Rubio. It’s gotta be Marco Rubio all at once, or kick rocks.</p><p>I mean, he was a lawyer, with four kids, which one assumes poses the usual challenges. Still, he was just sort of a regular, ageless guy—lawyering during the day, screaming at the kids to go to bed at night, and no longer having sex with his wife like they did in their twenties and thirties and even sometimes (when they drank) in their forties.</p><p>Then, out of nowhere, he became a senator.</p><p>Even so, things remained as bland as they could be, for a Florida senator.</p><p>Next thing you know, he ran for President. His opponent? Donald Trump. Shit goes sideways.</p><p>Donald Trump began taunting “Little Marco” about surface stuff—his boot heels, his floppy ears. Trump even attacked him for drinking water and sweating. You know, human things.</p><p>Then, in a steely, strategic move, Marco Rubio used Trump’s schoolyard style against him. He hinted that Trump wet his pants. He said that Trump used makeup to hide a sweat-stache.</p><p>Anyway, it didn’t work. Marco Rubio lost. Fully emasculated, he endorsed Trump.</p><p>Now, to be clear about this next section: It’s made up.</p><p>Marco Rubio went home that night, the night he endorsed Trump. His wife exclaimed, “What? After all those things he said?” And Marco Rubio replied, “Honey, I see a path. It’s a crazy path, sure, but it leads to ultimate power. I just have to keep my head down and, like, have a sense of humor about all this.”</p><p>Marco Rubio’s wife gathered up the children and left.</p><p>Years went by, as did Trump’s first Administration. Joe Biden became President, in a spectral kind of way. He once sniffed Marco Rubio’s wife’s hair (they had gotten back together). Actually, Joe Biden sniffed so much hair that it honestly might not have been Marco Rubio’s wife.</p><p>Marco Rubio’s strategy paid off. Trump was reëlected and made Marco Rubio his Secretary of State.</p><p>Looking around, Marco Rubio could tell that he was different from the rest of the Cabinet, which had a certain clown-car-crash charm. In fact, he sort of stood out for being normal. No one talked about how much water he drank, or his ears, or the fact that he had stopped aging, mysteriously, decades ago.</p><p>Suddenly, Little Marco was dispatched to put out fires across the globe—Ukraine, Palestine. Iran. Forget, for the moment, that they’re mostly still raging.</p><p>In a flex, Trump tried to bully the Pope, a man who more than 1.4 billion people believe can infallibly interpret the word of God.</p><p>As an apology, Marco Rubio gave the Pope a glass football.</p><p>Marco Rubio might have said something like, “Hey, sorry about all that. Here’s a glass football.” Nobody knows.</p><p>But this next part was reported. The Pope, upon receiving the football, said, “Wow, O.K.”</p><p>That’s the type of thing you say when you have no words. Marco Rubio left the Pope speechless.</p><p>Donald Trump showered Marco Rubio with gifts. O.K., just one: a pair of shoes that didn’t fit.</p><p>Marco Rubio wore them anyway. There are pictures.</p><p>Then the media started to say that Marco Rubio was, like, maybe the adult in the room. It’s either him or J. D. Vance in 2028, they postulated. They sounded thankful that he was even there.</p><p>Even Marco Rubio couldn’t have been prepared for that. ♦</p>"}];
