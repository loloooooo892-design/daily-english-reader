<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>
</head>

<main class="container">

    <span id="word-count"></span>

    <span id="reading-time"></span>

    <div class="swap-actions">
      <button class="swap-btn" id="skip-btn" onclick="skipArticle()">Skip</button>

    <span class="swap-counter" id="swap-counter"></span>

  <article class="article-body" id="article-body"></article>

</main>

var articles = [{"title":"Three Books Sheila Heti Recommends","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/three-books-sheila-heti-recommends","category":"fun","categoryLabel":"Interesting Reads","wordCount":891,"readingTime":5,"content":"<p><strong>Sheila Heti</strong>—whose new story “<a href=\"https://cna.st/affiliate-link/JqU1MqWt4YRNcWXtaBB7yqCoNQva4BEcxh4hW1WqQu1ZXZRnJouRiNoRdzyJRkQbDZKi7Y7R3k1zXGxoQg7w4BTxuZf16qY62tyWFmGDSsye4SpYSWvRVhNa5rJAyuvK15RGHhDADoBk1CJxRV1P6UpggmJDZ1ftsJ7JBqo5GFfpL8pqbqYXSXKnCgKbPUxKsUbJfSZeQ6jGvdSkmUv5SbJjLToEB2nMgzJHs7HrMRAr9kfSgHuMxMPR7AzdttLpbdrCe7zxPxzpP4Mjq8rzWtWrYyTfyiwKZuLoL8sic4zHAnNxYY6XZkCvqWCCdN1WPk7jyzPR1uBXaeozeun7zuu47fZymEfExgZ51B7Cg7TYCK2srpV6Pf3sdFwR3Xszr\" target=\"_blank\" rel=\"noopener\">Earthly Delights</a>,” about the mysteries of lust, appears in this week’s issue—wrote one of my favorite books ever: “<a href=\"https://cna.st/affiliate-link/8R1h8mj7jPeedMvbkfLCDtXVyrsc3LHGggMgRm66RqxGtfzMo9bgB9jTqRr6ASy3RaKWYUHvMGd6D8DcGxfiJmUVknUir5U7okY7iL9SsGr7oFpgG5VD3rFzQesaYBTWrN2AXfnn2LVvgwyGaKXAwrNwNKccYkaSsMMXeQk5YP2PWpcwcxFN3T3zXjamGgPRYvwRf6EyD957fGYcD53QVY3qgALprnaUmKXA6XYZH2cfRMQbz1qwDQN1KwE5QnJWB6WUFEbNHokUkDkPyqFhov6NM3XAz6XNNk5StycPCZD57AVUKdQ1obKYWpzhhiVsw3AWXew3MctBf7Uei9rLqi7m4k6qi1fvPyGzWbiMKg\" target=\"_blank\" rel=\"noopener\">Motherhood</a>.” The narrator is in her thirties, watching her fortieth birthday tick closer and trying to decide if she wants to get pregnant. “Whether I want kids is a secret I keep from myself,” she thinks. “It is the greatest secret I keep from myself.” In her search for answers, things get philosophical, mystical, emotional. The book was the first by Heti that I read, and my admiration for it—shared by many people—kicked off a deep dive into her body of work, which also includes the wonderful “<a href=\"https://cna.st/affiliate-link/P5DkZRf1FvK8nM4ByiqZZ7v3bPjjfiKJQ2MCWJWVgmxtvJp7x5YPPuZZnL18N4yhgDnuhHibrnm4LzPDmVDHvJncrov99NRMx3SbJXTMwToUAARWtg68r7yfRmE6HCHFGoroCCVk94uRGwVfFfmT3rLJoE92VccRiygrzJK27iSs8rB31dEqyWtZPGpWdjbfdnt19vC4JRy1Ps4S4XvTRQFNwB2irHZFJnn859Cm1vuGvTrLM7Dr5ta5MckhUV8WAdgkdyHHWHtT9umhBYRPkZTzoJ8aAAyFqorRsXf4x9uWyaCbyw5UaimBS1VjS5fDdH84MEHRkZPfCW3cBT88CL3jE1uue4wFKdcEFht\" target=\"_blank\" rel=\"noopener\">How Should a Person Be?</a>” I recently asked her about her own reading habits and recommendations.</p><p><em>Our conversation has been edited and condensed.</em></p><p><strong>What is your favorite book to recommend?</strong></p><p>“<a href=\"https://cna.st/affiliate-link/3VSJpsdrTERLwUp9pPEnJKKyfWnjUC2UfSy3BigFCQf2Wnd3pCfKyr4RgtfjgCiF4McTKJ6YmEDy3zrnJFLWZgWnMW9gSdbkMJnfM279XL4RKmynyiNKeMA8sRq2eSaZKPBw3fhMn6YGXvMchAMQDuVXno23zPymhsoV4iLnEXRZ8q6P8N4x4RZ5367iuL5RzrdSJ8inHX5vLySknNJ1gqN4upwobTYi4QneZebbAhWce9rWGuB7hm6FruobaYKZcTMR9UUizDGtz1zcBAqtP4GQSdbjWKLN6XcsQABJinfumD4GNPMPAUUUzvpWnevCtJKcbcXkLVNzzHevsxUbvPU3aL6kv8RLvRrRJkHvg1KJ2\" target=\"_blank\" rel=\"noopener\">Two Serious Ladies</a>,” by Jane Bowles. It’s so original, and completely follows its own rules and logic, and it is so funny. I thought about it again last night after watching “A Streetcar Named Desire.” Bowles and Tennessee Williams were very good friends. He called her “the most important writer of prose fiction in modern American letters,” although I didn’t know that when I first read her, in my early twenties. I would have been surprised: she seemed to have come out of no milieu, to have lived in nothing so literal as a city, or in something as ordinary as time. It’s a book like no other, and I’m sure I would have written completely differently if I had never read it.</p><p><strong>Which book has taught you the most about another medium?</strong></p><p>I’m not sure if a department store can be considered “another medium,” but I love Émile Zola’s “<a href=\"https://cna.st/affiliate-link/qWr6YUDVveeMo37jXYyxbEsTfShwFow1rAEyhgEitH6DsDnBLQvv9CtMkUt7mpTi3QLKFcouSVai9Y2pfR3YdJA2MLzqudVytSoUQBR7JVpUZUMbC1cRk6QCGdcRfQ4yMB9neuV6iFqQoJgQmZigJ9rDB7Gow5kx3tnqNVuuaZcnhbaejt1xanfYEZA7RxYmvP6S6ZEXdUtZSJPLj8a3pHDNNPGpvQmxnKyQHSoPYM3nqJCbdH2kKHteMuCKYyMSSLdvDxtzwy6s5PeKJPvUTXJYrDwvxuFNLzPv4NYMrt6DmTy27y3VqCWPi6TJjbhGJRuNTPMsbQZheYNz3xwygs6rXuJwFuPwYMkmxhCQWS8P5ox\" target=\"_blank\" rel=\"noopener\">The Ladies’ Paradise (Au Bonheur des Dames)</a>,” from 1883, which is as brilliant as any book could be about marketing, advertising, the rapacious swallowing up of smaller shops by larger ones, and the hard life of being a salesgirl from the provinces, trying to earn a living in Paris.</p><p>I love all the delicious details of the store’s wares: enticing displays of umbrellas, lace, linen, and gloves. And how Zola, having researched Le Bon Marché (one of the first modern department stores), works into his story all the inventive ways his capitalist visionary, Octave Mouret, fans the flames of his female customers’ desire for new and beautiful things, likening his methods to how the seducer stirs up lust in a woman. It’s just one of my favorite novels.</p><p><strong>Is there a book best suited to reading while in transit?</strong></p><p>I read Vigdis Hjorth’s “<a href=\"https://cna.st/affiliate-link/mKseyLofgnuon54VQ5MnNSAJ5og7gGAnfEHF3GS7xZoZEndBzasKdPdNSJ619LxRAzwWkWsKX7gHhqrdLwAsGePV9yHDPyM6JpLtfU68XjE5d4hfJUVMrdJWHFNsyUnVSJCBMht7rAaNyarteMMMT9wf4tvn8Wm8oGog6W3faNAJY8NtkrXugsyaVGt5iLhY11TeiB9Yr484Mue2R2t8pyiz8Azyn2SsqsExZKKJnipQLnbN9qEmdc11uGFXRhScz2iM3gLc2RyuCKxwzxgdbR9nKBxHKnb73MTiQeQwyAfUXMDEBbjH4ipcTzY4JvTqK2Zkos6VbBPT9Chg5qF2yPTwJCbvU2dY\" target=\"_blank\" rel=\"noopener\">If Only</a>” at the subway station, then on the subway, then in the airport, then on the plane across the ocean, then in the taxi after landing, then finally in the hotel. I can’t separate the feeling of movement and travel from the feelings that book gave me: the vertigo of falling disastrously in love with exactly the wrong man, being shunned by him, taken up by him again, suffering from the love, and all the twists and turns of the relationship which the book depicts.</p><p>The passage of time in that novel, and the passage of moods through the protagonist’s mind and body, mixed with my passage from one continent to another, and across time zones, feeling dizzy with sleeplessness and jet lag, were perfectly suited to each other. It was one of the best reading experiences I’ve had.</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><h2><em>On Our Radar</em></h2><p><strong>Our thoughts on a few of</strong> <a href=\"https://thebookerprizes.com/the-booker-library/prize-years/2026\" target=\"_blank\" rel=\"noopener\"><strong>the Booker Prize longlist</strong></a> <strong>picks:</strong></p><ul><li><a href=\"https://www.newyorker.com/books/under-review/gwendoline-rileys-new-novel-surveys-the-wreckage-of-middle-age\" target=\"_blank\" rel=\"noopener\">Lynn Steger Strong reviewed</a> “<a href=\"https://cna.st/affiliate-link/4h8jhTu8Afo9tnCLihrAQN8DiggTgUN9QjynhGYBZsL23nfQQcgcyZDTgav4ctpUt9bzFZX42TX9ncfyAqwLQ49ycJ7BU4ZNsdnYcWZ7vvNRb6F5TbpqqZyLabT9yy483FrhGt77zkLbEa1hjmsyMWhPvNKrx43GW1vAohSMZmaFdqgL8m8RpfxyReLRqSr6W8cvArR7LJKYrEBAAhkH4Th51rMqEXZqfLqGwj9uG1ywq5uRKR16a19FSg3YieyLYzs4g5h422UrFNLUmu74UQvHqorCEduBcxhSbLV9ZaPqSpXN4QtWg1nDEAXqtNibB9pPKAhbFG1U1RicNQ7bCDd3BwxnoimTS3v4BvF2XErabo5KY\" target=\"_blank\" rel=\"noopener\">The Palm House</a>” by Gwendoline Riley.</li><li><a href=\"https://www.newyorker.com/books/under-review/a-trollish-new-campus-novel-hates-students-and-professors-alike\" target=\"_blank\" rel=\"noopener\">Hannah Gold reviewed</a> “<a href=\"https://cna.st/affiliate-link/2EvexLQGf2tBX5BxpQ9wzoYxCJFD46BR5NxiRLNwSidG47ES4PUaTANjXzP2Tr46Uwb63zjYFsBac76qpSQ7EwgrzUmN8UZV1BmNJpVvhydAt1AygDEqHujsMh8w9CKWyrgrDhYxX dystopian future</a>.</li></ul><p><strong>Everybody’s talking about:</strong></p><ul><li>“The Five-Star Weekend”—a streaming series starring Jennifer Garner and enjoying a huge viewership on Peacock—is adapted from <a href=\"https://cna.st/affiliate-link/HJ99Tbj4dgEiFYV435HzW8Es8z9AmDnL7nhegjade58wdJYWKEVsndBzmihCyRia4kyRhGXeMS45nLSyWG1BpBr81J7xvjV8PpXAjKA5yj1sJ3RZKoP5KUEQZTAkEuqUHeaQnjS9eYuc25a5Td8odV1vrsaEieUHBbWLdMzgaV441ECMDdsY4mcoVkd4vZdx7jFgqhAEgxFQbR4k5qvHSsUeu7SHH1okA8Qw3wnfUSR9hUTKjbT8F7s8axLeC6N3AQjHfd89sgYznYbfTkYAvXfLvGL4yE3sWqC2DgKUTFKsrkY7H5WprjSxtqnx6dgpfJSq5UM7xfkHqHwcDr5vhbMpNiGMCSWF9kt8LV3BaGv9QGLD5L\" target=\"_blank\" rel=\"noopener\">a novel written by Elin Hilderbrand</a>.</li><li>If you’re enjoying Colson Whitehead’s new novel, “<a href=\"https://cna.st/affiliate-link/4h8jhTu8Afo9tnCLihrAQN8DiggTgUN9QjynhGYBZsL23nfQQcgcyZDTgav4ctpUt9bzFZX42TX9ncfxkfR61WbHm4ox3rwGjvZTf4neVgbTCVoAAhReLtZwo8gk4scWT5ggvC6fUxbR7ehiM3AEkW48KxpVS71zSwtiUw4fVybzoiiQPFT1pFyFmC8UT8K6pS2DePE7CDJWG5mPu8iGaM8bQP3ZpEwGECcKLduZwUXJj8fwc1njCqQhb3URxn3e9YDnrjhHzRkj4MUwM3LhY2gDEVodHjQAiQBYpZgELGt3aZ4KTG8DYxn5aEsQqsbGJhFDYv2fix6imW9iFjjggFQTtabLQPzKBpmy8XtEP8dJNVJdQ\" target=\"_blank\" rel=\"noopener\">Cool Machine</a>,” you might also be interested in hearing him read his short story “<a href=\"https://www.newyorker.com/magazine/2019/04/01/the-match\" target=\"_blank\" rel=\"noopener\">The Match</a>,” an excerpt, published in the magazine in 2019, of his Pulitzer Prize-winning book “<a href=\"https://cna.st/affiliate-link/HJ99Tbj4dgEiFYV435HzW8Es8z9AmDnL7nhegjade58wdJYWKEVsndBzmihCyRia4kyRhGXeMS45nLSzeDURwE55o7BGdhcwp7juXCdSzKGdxyCnziPhDwcdwVmV4yertU1XAp9nvtYLWmXiDonB1JLiiFzS9tfLXriuRWMRGRFTRq7mu15xFjhbTUtbjB81abwQY29P1cLcAdU8hPCGjnQgyfxNsWAkQujmtJ5ZWqHnvip54P1xJ6Wj4DTzSRGJnBRJuZrWASNsy5Tx71TiTjsJXDCmFrsbHi2YfJahN9Lroice5hDVxdxCzm5NGBQ9wRYkV7WxFdD35FfB24AqEmxnNivKkKD524sSrKzhgxn98kgdWi\" target=\"_blank\" rel=\"noopener\">The Nickel Boys</a>.” (Or, going further back in time, check out <a href=\"https://www.newyorker.com/magazine/2001/05/07/tote-that-ephemera\" target=\"_blank\" rel=\"noopener\">John Updike’s review</a> of Whitehead’s 2001 novel, “<a href=\"https://cna.st/affiliate-link/qWr6YUDVveeMo37jXYyxbEsTfShwFow1rAEyhgEitH6DsDnBLQvv9CtMkUt7mpTi3QLKFcouSVai9Y2oqfcfRveoUtMvrLqN8KJmzbekcVKDjBVZSk1mRsgqb2KQkAvUrSXWksG3gANL3XT3qcHn2XWvQLY6zYbSctXCwnMNq8KRrK3WfM3uPNsXUzv99ecJJPa71bVu15FaGTNvXHsX5Y4iyWNTpJ1owZ81f1XRx86rmJqD2f2oxvsPgoNbQN9wzqprZtKvMXkQazuE8tUpcF6GDNQBke3t4D16SYqKvsBYweksRJKNMGgJCLyNbzdGfuBN4wo1RbQqX4FvpKxXYtwnQUQLRDJYSAcvbkrm5DnLh3Q\" target=\"_blank\" rel=\"noopener\">John Henry Days</a>.”)</li></ul><p><strong>P.S. Douglas Stuart,</strong> whose book “<a href=\"https://cna.st/affiliate-link/613tZGZB2ZvVx8iWDrMX2qh7UjJqds9E1ESsdztYRREa4U9Qn71mVkdNvmdjT55EkKkw5bboQy8iYGGTYTBGfnwtK26aikCZAFo3DZPKfqbqQkbLdtA5M9WAQ9FxYkzgf7V5gdkb7rJp1voNV6TuW4q2nM2VcRBPeSZn9jer1oChzrsNXs99T9rfcehJPT7MGb6rEGL2gNZrmCYSN4GVx1mQe2JgY3nx6CoLX2USTnb7nW2ekGb3NMsm7XKumnb5tyi1NLGcgUiQ1ZmwRsVJed2VgwPPET9MZoaZDY3HRMbn1Qxgh9jbB23tSEXvdbBFcMaE41zXXNAox9HVNRTwqUdU5ybG6iiiNpt3BY\" target=\"_blank\" rel=\"noopener\">John of John</a>” also made the Booker longlist, gave us his own list: <a href=\"https://www.newyorker.com/books/book-currents/douglas-stuart-on-great-novels-of-gay-life\" target=\"_blank\" rel=\"noopener\">great novels about gay life</a>.</p>"},{"title":"One of These Ethernet Switches Will Give Your Router the Ports You Need","source":"Wired","author":"@wired","url":"https://www.wired.com/story/best-ethernet-switches/","category":"tech","categoryLabel":"Technology","wordCount":1182,"readingTime":6,"content":"<p>Modern routers and mesh systems offer better performance than ever, but many of them have a limited supply of ports. The best Ethernet switches enable you to add several Ethernet ports so you can wire up your most important connections for maximum speed, efficiency, and security.</p><p>Whether you want to set up a wired backhaul for better Wi-Fi performance, plug in your TV to banish buffering, or hook up a local, <a href=\"https://www.wired.com/story/best-subscription-free-security-cameras/\" target=\"_blank\" rel=\"noopener\">subscription-free security camera system</a> using Power over Ethernet (PoE), Ethernet switches can help you do it. I’ve tested several, and these are the brands I recommend.</p><p>You may also want to dip into my other home networking guides, including <a href=\"https://www.wired.com/story/what-is-ethernet/\" target=\"_blank\" rel=\"noopener\">What Is Ethernet</a>, <a href=\"https://www.wired.com/story/how-to-run-ethernet-cables-around-your-home/\" target=\"_blank\" rel=\"noopener\">How to Run Ethernet Cables Around Your Home</a>, <a href=\"https://www.wired.com/story/how-to-buy-a-router/\" target=\"_blank\" rel=\"noopener\">How to Buy a Router</a>, <a href=\"https://www.wired.com/gallery/best-wifi-routers/\" target=\"_blank\" rel=\"noopener\">Best Wi-Fi Routers</a>, and <a href=\"https://www.wired.com/story/best-mesh-wifi-routers/\" target=\"_blank\" rel=\"noopener\">Best Mesh Systems</a>.</p><p>Table of Contents</p><h2>Netgear Ethernet Switches</h2><ul><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li></ul><p>Netgear</p><h3>5-Port Gigabit Network Switch (GS305)</h3><p>I’ve used a few different Netgear switches over the years and found them to be very reliable and well made.</p><p>If you just need a few extra ports, this affordable unmanaged switch from Netgear is nice and straightforward. The compact metal case offers five Gigabit ports; it’s plug-and-play, and it’s completely fanless for silent operation. It comes with a power adapter, each port has a green LED to show when it’s in use, and you can wall-mount or tuck it away. (Mine has been hiding in a cable tidy box).</p><ul><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li></ul><p>Netgear</p><h3>8-Port Gigabit Ethernet Plus Switch (GS308E)</h3><p>If you need more ports, this smart switch has eight auto-sensing Gigabit Ethernet ports, each supporting up to 1,000 Mbps. It's plug-and-play and has a silent, fanless design. There’s a web-based user interface if you want to dig into settings to configure virtual local area networks (VLANs), set up Quality of Service (QoS) to prioritize traffic, mirror ports, and more.</p><h2>TP-Link Ethernet Switches</h2><p><a href=\"https://cna.st/p/YgEK7CGHVcmdjto2ZDz8bzRXfAAiPRVqH6N6uxgoFg2f9jYyXnQ2ZVM7RsQJfp8Kax4UbjsfjkBzZX4eQ6FZ1eMyoMLFspdHStqL7UZUJVCyWeSgW3SVsTkzUdqbu1JAwR4nZSdk3Jp9NRxs8xoo6LmenDZUCx3byCRmXjSH3bnDNb8fnW3oZwjcihwmUo2EHVu8EqJ7so5gfRqSyFJLbFqpoMhf2jTSt5XvFchKF7XtA2b2j9KfrdECiHkgdJ8qesYNrUSEpw2NsZ85QjRi6gJHt2gBbonqdS9dK5n6uCx88YLEoTnj3uBh6dPUqAhAwFyJvcR4qFUoAcwuPjYhNVSofpd81YueRAabgFMq9ZxHGEY8ysSDrnYHS7DVvPhazR3fnnmdW56iMRVziMUi111xps1n7QEWrkS\" target=\"_blank\" rel=\"noopener\"></a></p><p>Photograph: Simon Hill</p><p>TP-Link</p><h3>8-Port Gigabit Ethernet Switch (TL-SG108S)</h3><p>Folks on a budget should consider an Ethernet switch from TP-Link. These are the ones I’ve tried and can recommend.</p><p>As simple as you get, this plug-and-play switch is sturdy with a metal case, has a silent fanless design, and gives you eight Gigabit Ethernet ports. I’ve been using it for several months to hook up various security camera hubs, <a href=\"https://www.wired.com/story/best-nas-devices/\" target=\"_blank\" rel=\"noopener\">NAS devices</a>, and a Sonos speaker, and it works perfectly.</p><p>If you want a more compact, stylish design, my colleague has been using the <a href=\"https://cna.st/affiliate-link/3uiV3LmVK1YzRAxqun7PmFUa64tL6xTEnuGear5TDY2r25sAMpuRgVmSL5F7oRQa6o3cEWZu6ViZkKkFrqaSvBrUDKbgCBUY6oroZbLz24uWsT26aKEEazwwBP4xpuiQZtTGarXrqtyHtLCe86chsQoJwbX9LMBCKBEjvemJQyQ4397KmAE6RrPbCftqoGuiZsHShMFzpbGvfkaB4kg3Lr8Lce6DozEirLW38XUuVVM4MPpfyKF9RRatWQbW8RkE3VPzEy4VmMRt\" target=\"_blank\" rel=\"noopener\">TP-Link 8 Port Gigabit Ethernet Network Switch (TL-SG1008D) ($25)</a> for years and says it works well.</p><ul><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li></ul><p>TP-Link</p><h3>8-Port Gigabit PoE Switch (TL-SG1008P V4)</h3><p>I got this switch to connect three Power over Ethernet (PoE) cameras recently. It also has eight Gigabit ports, but four of them are PoE ports capable of supplying power (up to 30 watts each, but 64 watts in total), as well as carrying data. It’s sturdy and silent with LEDs on the front and ports on the back, which makes it a little easier to keep tidy and see what’s working at a glance. It’s also sturdy and silent. But because it’s fanless, it can get warm.</p><h2>Other Ethernet Switch Manufacturers</h2><p>I’m planning to test more Ethernet switches in the coming months, but most folks will be well served by something affordable from Netgear or TP-Link. I'm highlighting Ethernet switches for the average home user here, but there are many faster and larger options on the market. Other popular brands worth considering include Cisco, Trendnet, Zyxel, and Ubiquiti. I would steer clear of unknown brands.</p><p><strong>How Many Ports Do You Need?</strong></p><p>You can get Ethernet switches in all kinds of sizes, from four ports up to 24 or more. It’s probably a good idea to get a switch with at least a couple of spare ports to give yourself some space to add more wired devices in future. Remember, though, that one of the ports will be required for the incoming internet connection from your router.</p><p><strong>What Speed Do You Need?</strong></p><p>Most Ethernet switches for home users are rated at a Gigabit, so each port is capped at 1 Gbps. They will also have a backplane limit. It’s unlikely you’ll run into this as you probably won’t be maxing out every port simultaneously, but an 8-port Gigabit switch with a 4-Gbps backplane will be limited to 500 Mbps per port if they’re all maxing out. In practice, it will be less because you never get maximum efficiency.</p><p>You will, of course, also be limited by your overall internet speed. If your internet connection is only a max of 2 Gbps (and everything is online and maxed out), it’s going to be 250 Mbps per port maximum. You will still get the benefits of higher-rated gear for transfers between devices on your network, as they won’t be limited by your internet connection speed.</p><p><strong>Unmanaged or Managed Switches?</strong></p><p>Unmanaged switches are simple plug-and-play devices that don’t require any configuration, while managed switches allow you to configure and monitor your network. Most folks looking to add wired connections to their home network can save money and hassle by opting for an unmanaged switch.</p><p>If you want to use your switch to prioritize traffic, limit bandwidth, or create virtual local area networks (VLANs) you might consider a managed switch. One common use case might be to isolate specific devices like security cameras. You can usually configure these by visiting the IP address in your web browser or using a console client.</p><p>You can also get so-called “smart switches,” which behave like unmanaged switches out of the box but can be configured to some degree. These are a middle ground between unmanaged and managed.</p><p>Do You Need PoE?</p><p>If you are connecting security cameras or access points that support Power over Ethernet, you need a switch that can deliver that power. PoE switches deliver power and data via a single cable. Make sure your switch has enough PoE ports (some switches have a mix of regular and PoE ports) and can handle your overall power requirements. There are different PoE standards capable of delivering a different power budget per port, but you also have to consider the overall power budget.</p><ul><li>Type 1 (IEEE 802.3af or PoE) can send 15 watts</li><li>Type 2 (IEEE 802.3at or PoE+) can send 30 watts</li><li>Type 3 (IEEE 802.3bt or PoE++) can send 60 watts</li><li>Type 4 (IEEE 802.3bt or PoE++) can send 90 watts</li></ul><p>All of them will lose some power between the switch and device. You also have to match capable <a href=\"https://www.wired.com/story/what-is-ethernet/\" target=\"_blank\" rel=\"noopener\">Ethernet cables</a>.</p><ul><li><p>Photograph: Simon Hill</p></li><li><p>Photograph: Simon Hill</p></li></ul><p>Amazon Basics</p><h3>RJ45 Cat6 Ethernet Patch Cable</h3><p>This affordable cable is fine for data up to 1 Gbps, and I don't think most folks need to spend more. But if you are hooking up PoE devices, you'll need cables that can handle the additional load.</p><p><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><em><strong>Power up with unlimited access to</strong></em></a> <a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><strong>WIRED</strong></a><em><strong>.</strong></em> <em>Get best-in-class reporting and exclusive subscriber content that's too important to ignore.</em> <a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><em>Subscribe Today</em></a><em>.</em></p>"},{"title":"South Africa president urges cooperation among African states to address migration challenges","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/south-africa-president-urges-cooperation-among-african-states-to-address-migration-challenges/","category":"law","categoryLabel":"Law","wordCount":523,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/south-africa-president-urges-cooperation-among-african-states-to-address-migration-challenges/#\" target=\"_blank\" rel=\"noopener\">South Africa president urges cooperation among African states to address migration challenges</a>\n</strong><p>South African President Cyril Ramaphosa on Monday <a href=\"https://www.gov.za/news/speeches/president-cyril-ramaphosa-first-ordinary-session-7th-legislature-pan-african\" target=\"_blank\" rel=\"noopener\">called for</a> greater cooperation among African states in tightening immigration enforcement regimes.</p><p>The speech was part of the opening address to the Pan-African Parliament. Based in Midrand, South Africa, the Parliament serves as the legislative body of the African Union. Ramaphosa spoke extensively on the need to harmonize laws and policy and to present a united front against shared challenges, stating: “We call on this Pan-African Parliament to take up the mantle of leadership, to be at the forefront of finding sustainable solutions to this issue. The measure of Africa’s development will not only be the ease with which Africans can move across borders. It will also be the extent to which every African country offers all its citizens sufficient opportunity, dignity and hope.”</p><p>Ramaphosa’s speech comes as recent weeks have seen a flare-up of <a href=\"https://www.thepresidency.gov.za/address-president-cyril-ramaphosa-migration-union-buildings-tshwane\" target=\"_blank\" rel=\"noopener\">xenophobic violence</a> in the post-apartheid state. At least four migrants have been killed as a result of this violence and since March of this year, over 160,000 migrants have left South Africa, either by deportation or due to threats of violence. Earlier this June, President Ramaphosa announced a series of reforms meant to address the issue of undocumented migrants, but also cautioned against the use of violence by non-state actors to that end. Anti-migrant groups have set an unofficial deadline of June 30th for all undocumented migrants to leave South Africa. However, violence ravaging throughout the country against immigrants has only reached <a href=\"https://issafrica.org/events/xenophobia-in-south-africa-myths-and-realities\" target=\"_blank\" rel=\"noopener\">unprecedented levels</a>.</p><p>South Africa has acted as a regional magnet of economic migration in Africa due to its relative economic opportunities, however migrants are often stuck in a cycle of<a href=\"https://gjia.georgetown.edu/human-rights-development/xenophobia-a-pervasive-crisis-in-post-apartheid-south-africa/\" target=\"_blank\" rel=\"noopener\"> economic abuse</a>, with many given salaries falling below the minimum-wage threshold, constantly deprived of their rights under employment and labour law, alongside being expected to carry out their duties under <a href=\"https://cers.leeds.ac.uk/wp-content/uploads/sites/97/2016/04/Xenophobia-in-South-Africa-Nomsa-Dumani.pdf\" target=\"_blank\" rel=\"noopener\">subpar working conditions</a>. Amnesty International has previously <a href=\"https://www.amnesty.org/en/documents/afr53/1206/2026/en/\" target=\"_blank\" rel=\"noopener\">called for</a> South Africa to address these concerns and the persistent culture of xenophobic violence in the country.</p><p>Additionally, critics have condemned the South African Police Service (SAPS) for failing to <a href=\"https://www.hrw.org/news/2026/05/20/south-africa-new-waves-of-xenophobic-attacks\" target=\"_blank\" rel=\"noopener\">provide adequate protection</a> to African migrants and asylum seekers who are constantly targeted in hate crimes. Critics have also pointed out that instead of arresting violent vigilantes, SAPS officers frequently <a href=\"https://www.wits.ac.za/news/latest-news/opinion/2026/2026-06/xenophobia-in-south-africa-states-complicity-with-gangs-and-vigilantes.html\" target=\"_blank\" rel=\"noopener\">conduct raids</a> where individuals with proper and legitimate documentation are sometimes detained under the guise of enforcing immigration laws.</p><p>Foreign ministries have also joined forces in condemning South African law enforcement for its role in perpetrating extrajudicial killings, pinpointing specific incidents where migrants have lost their lives or been subjected to torture while in police custody. The major cause of this sudden spike in hate crimes against migrants and foreign nationals is largely due to the misplaced notion that they contribute to violent crime, although studies have <a href=\"https://issafrica.s3.amazonaws.com/site/uploads/sar-53.pdf\" target=\"_blank\" rel=\"noopener\">dismantled this prejudiced mindset</a> by proving otherwise.</p><p>Beyond Ramaphosa’s call for tighter immigration laws and stricter enforcement of existing legislation, he has also highlighted the need to address the root causes of migration, as well as the role of <a href=\"https://www.afrobarometer.org/wp-content/uploads/2022/02/afropaperno173_xenophobia_in_south_africa.pdf\" target=\"_blank\" rel=\"noopener\">xenophobia</a>, misinformation, and scapegoating in the recent protests.</p>"},{"title":"\"Dragon Age: Origins wasn’t the most attractive game\": BioWare's old series producer still thinks a DA remaster trilogy is worth it, but the knowhow isn't there","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/dragon-age-origins-wasnt-the-most-attractive-game-biowares-old-series-producer-still-thinks-a-da-remaster-trilogy-is-worth-it-but-the-knowhow-isnt-there","category":"gaming","categoryLabel":"Gaming","wordCount":699,"readingTime":4,"content":"<p>Hands up if you understand the Eclipse engine</p>\n    \n  \n  \n  \n  \n            <p>Former <a href=\"https://www.rockpapershotgun.com/games/dragon-age\" target=\"_blank\" rel=\"noopener\">Dragon Age</a> series producer Mark Darrah has shared his tuppence worth on the likelihood of BioWare and EA ever commissioning a full-on original Dragon Age trilogy remaster or remake. He thinks such a remastering or remakering would sell pretty well, not least because OG Dragon Age looks like a toilet bowl in a Silent Hill game (I exaggerate the sentiments here slightly). But he also thinks the odds of such a project are low, for the straightforward reason that nobody either inside or outside BioWare really understands the proprietary technology those older RPGs run on. Ah well. We'll always have the <a href=\"https://www.rockpapershotgun.com/dragon-age-thedas-at-war-is-a-bioware-rpg-inspired-crusader-kings-3-total-conversion-mod-thats-here-to-keep-the-series-alive-while-it-sits-in-ea-limbo\" target=\"_blank\" rel=\"noopener\">mods</a>.</p>\n<p>Released in 2011, <a href=\"https://www.rockpapershotgun.com/games/dragon-age-origins\" target=\"_blank\" rel=\"noopener\">Dragon Age: Origins</a> used BioWare's proprietary Eclipse Engine, an updated version of the Aurora Engine created for <a href=\"https://www.rockpapershotgun.com/games/neverwinter-nights\" target=\"_blank\" rel=\"noopener\">Neverwinter Nights</a>. The subsequent Dragon Age 2, released in 2011, ran on another Aurora variant called the Lycium Engine. 2014's <a href=\"https://www.rockpapershotgun.com/games/dragon-age-inquisition\" target=\"_blank\" rel=\"noopener\">Dragon Age: Inquisition</a>, finally, was built with the Frostbite Engine devised for DICE's Battlefield shooters. Some context: at the time of Inquisition's development, EA were on the warpath about getting all their games to use the same engine. This caused chaos for the Dragon Age team, who found that Frostbite lacked many of the features they needed for role-playing development.</p>\n<p>Getting three games that use different, proprietary tech to hum along together in one remaster package is a tall order. Certainly, a taller order than <a href=\"https://www.rockpapershotgun.com/games/mass-effect-legendary-edition\" target=\"_blank\" rel=\"noopener\">remastering the original Mass Effect trilogy</a> – all those games run on Epic's publicly licensed Unreal Engine, which is pretty well-understood across the industry. Nonetheless, Darrah – who left BioWare in 2020, returning briefly in 2023 to work as a consultant on <a href=\"https://www.rockpapershotgun.com/dragon-age-the-veilguard-top-tips-beginners\" target=\"_blank\" rel=\"noopener\">Dragon Age: The Veilguard</a> - did envisage a \"Champion's Trilogy\" at one point in his BioWare tenure. <a href=\"https://www.rockpapershotgun.com/mass-effect-5-devs-should-scapegoat-veilguard-and-a-dragon-age-trilogy-remaster-was-pitched-to-ea-says-ex-bioware-producer\" target=\"_blank\" rel=\"noopener\">Back in August last year</a>, he discussed the pitch on his Youtube channel. The rough idea was to create some Frostbite tools and then \"find a mod house that seems talented, and just uplift them, and pay them to do a remake of Dragon Age: Origins.\"</p>\n<p>\"That was always my plan was like, we’re going to do a champion’s trilogy,\" Darrah reiterated to FRVR, in a <a href=\"https://frvr.com/blog/dragon-age-creator-says-a-mass-effect-style-remaster-trilogy-wont-happen-as-no-one-understands-the-games-unique-game-engines/\" target=\"_blank\" rel=\"noopener\">podcast interview this week</a>. \"We’re going to kind of retroactively kind of like turn this into like, these are three games with three different important figures. And we’re going to group them in, collect them together into, we’re going to retroactively turn it into a trilogy.\"</p><p>He still thinks a trilogy of Dragon Age remasters would \"sell super well\", noting that \"even at the time, Dragon Age: Origins wasn’t the most attractive game\". Ooof, what a slap in the face for enthusiasts of dark fantasy muck and grime. But Darrah thinks that at this stage, you'd need to create a brand new team within BioWare to build up expertise with the old engines.</p>\n\n<p>“There is basically no one at BioWare anymore that understands the Aurora Engine,” Darrah told FRVR. “There’s basically no one outside of BioWare anymore that understands the Aurora engine. So unlike Mass Effect, which is Unreal… there are basically no companies that could help you.”</p>\n<p>EA may not be in the mood to approve any Dragon Age games at all. They're in the middle of being acquired by a consortium led by Saudi Arabia's public investment wing. Leaving aside the Saudi Arabian regime's policy of brutalising women, queer people and migrants, which <a href=\"https://www.rockpapershotgun.com/i-would-fight-it-tooth-and-nail-the-sims-artist-would-challenge-any-mandate-to-reduce-diversity-after-ea-saudi-buyout\" target=\"_blank\" rel=\"noopener\">doesn't seem a great fit for the diversity politics of The Sims</a>, this will saddle EA with <a href=\"https://www.rockpapershotgun.com/eas-new-owners-are-making-a-huge-bet-on-generative-ai-cost-cutting-to-help-repay-a-20-billion-loan-claims-report\" target=\"_blank\" rel=\"noopener\">a $20 billion debt</a>, to be theoretically recouped by way of the magic bean technology that is generative AI. EA are on a <a href=\"https://www.rockpapershotgun.com/ea-are-making-another-round-of-layoffs-as-they-seek-to-better-meet-fans-changing-needs-according-to-reports\" target=\"_blank\" rel=\"noopener\">cost-cutting drive</a> right now. They've already <a href=\"https://www.rockpapershotgun.com/bioware-quietly-lay-off-key-dragon-age-team-members-while-talking-up-the-next-mass-effect\" target=\"_blank\" rel=\"noopener\">made layoffs</a> at BioWare following the release of the extremely troubled Dragon Age: The Veilguard. Reportedly, those who remain at BioWare are <a href=\"https://www.rockpapershotgun.com/bioware-are-focused-exclusively-on-the-next-mass-effect-says-exec-producer-along-with-a-krogan-teaser\" target=\"_blank\" rel=\"noopener\">focussing on the next Mass Effect</a>.</p><p>In general, I'm very interested in how companies try to retain expertise about their proprietary tools from generation to generation, in the face of team cuts and departures. Many studios learn the value of good documentation the hard way – <a href=\"https://www.rockpapershotgun.com/it-was-chaos-how-the-witcher-4-and-cyberpunk-2-are-learning-from-decades-of-cd-projekts-documentation-mistakes\" target=\"_blank\" rel=\"noopener\">just look at The Witcher and Cyberpunk developers CD Projekt</a>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
