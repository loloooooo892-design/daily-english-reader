<script>
var articles = [{"title":"The Conditions on a US Aircraft Carrier Sound Concerning","source":"Nautilus","author":"","url":"https://nautil.us/the-conditions-on-a-us-aircraft-carrier-sound-concerning-1283806/","category":"fun","categoryLabel":"Interesting Reads","wordCount":922,"readingTime":5,"content":"<p>Things seem to be getting dicey on the high seas. Sailors aboard the U.S.S. Abraham Lincoln, a large aircraft carrier deployed to the Middle East to support the United States’ war with Iran since January of this year, are communicating through family members that conditions, morale, and crewmember mental health are deteriorating.</p><p>Featured Video</p><p>Every day, new reports are filtering in from reporters receiving messages from the families of some of the 5,000 service members on the aircraft carrier, which has been at sea since departing from its home post in San Diego in November of last year. Text messages from an anonymous sailor to a family member and shared with reporter Aaron Parnas at miedasnews.com allege food shortages aboard the carrier. “So the supply ship that comes here can’t bring fruits and stuff cause it can’t stay fresh long enough with the time it gets [sic] them to get here,” <a href=\"https://meidasnews.com/news/rotten-meat-no-milk-troops-detail-life-aboard-the-uss-abraham-lincoln\" target=\"_blank\" rel=\"noopener\">read</a> one. “So we haven’t had anything fresh …”</p><p>“Haven’t had milk in 3 months,” <a href=\"https://meidasnews.com/news/rotten-meat-no-milk-troops-detail-life-aboard-the-uss-abraham-lincoln\" target=\"_blank\" rel=\"noopener\">read</a> another.</p><p>“[E]veryone is just burned the fuck out and they gave us 2 days off and a beer day,” reads a message sent to Parnas and <a href=\"https://x.com/AaronParnas/status/2087965048744427681?s=46&amp;t=4mQCca6Pg0PDqi1ykDVksw\" target=\"_blank\" rel=\"noopener\">reposted</a> on X (formerly Twitter).</p><p><strong>Read more: “<a href=\"https://nautil.us/the-psychological-challenges-of-just-getting-to-mars-237100\" target=\"_blank\" rel=\"noopener\">The Psychological Challenges of Just Getting to Mars</a>”</strong></p><p><em>Stars and Stripes</em>, an outlet that operates inside the Department of Defense but is editorially independent, <a href=\"https://www.stripes.com/theaters/us/2026-08-11/abraham-lincoln-middle-east-mental-health-town-hall-meeting-22506344.html\" target=\"_blank\" rel=\"noopener\">reported</a> this week that it had interviewed active-duty sailors and their family members and found that “dozens of public social media comments and posts by crew members, describe sailors struggling with exhaustion and declining morale, including reports of suicidal thoughts and at least one instance where a crew member was prevented from jumping overboard.”</p><p><em>The Military Times</em>, another independent news outlet covering the United States military community, <a href=\"https://www.militarytimes.com/news/your-military/2026/08/11/multiple-uss-abraham-lincoln-sailors-have-tried-to-go-overboard-amid-extended-deployment-families-say/\" target=\"_blank\" rel=\"noopener\">spoke</a> to the wife of a sailor who attempted jumping into the sea, off the aircraft carrier’s deck. “He’s scared,” Annabelle Loma, one sailor’s wife, told the outlet. “He thinks he’ll get a dishonorable discharge, and just because he was burnt out, his 13-year career is ruined, just like that. That’s not fair, that’s not right. That’s not what he should be worrying about right now.”</p><p>And <em>MS Now</em> yesterday <a href=\"https://www.ms.now/news/uss-abraham-lincoln\" target=\"_blank\" rel=\"noopener\">reported</a> that a crewmember jumped overboard and was in the water for almost an hour before being rescued. “i think the boat is finally getting to me and i really dont think i can keep up my peace act anymore,” that sailor reportedly wrote in a text message to his wife on July 21, before he jumped overboard. “i dont think i can do another deployment after this and i dont even know if i can finish this deployment.”</p><p>While the alleged conditions on the USS Abraham Lincoln appear to stem from a confluence of unfortunate circumstances and logistical breakdowns, mental health is often compromised by humans inhabiting extreme environments in tight quarters: crews of ships on the open ocean, <a href=\"https://nautil.us/why-these-researchers-are-drawn-to-the-worlds-edge-3-237668\" target=\"_blank\" rel=\"noopener\">inhabitants of polar outposts</a>, and astronauts traversing space.</p><p>Coincidentally, a NASA-funded <a href=\"https://www.nature.com/articles/s41526-026-00618-9\" target=\"_blank\" rel=\"noopener\">study</a> appeared this week that addressed the issue of designing such spaces to optimize the mental health of the people who make temporary homes in them. In the <em>npj microgravity</em> paper, researchers from the Massachusetts Institute of Technology and the University of Colorado Boulder unveil an online tool, the <a href=\"https://hecia.space/\" target=\"_blank\" rel=\"noopener\">Human-Environment Connection &amp; Interaction Atlas</a> or HECIA, that purports to guide users through designing habitats for extreme environments by mapping out the specific mission stressors and potential behavioral health outcomes.</p><p>“Submarines, oil rigs, polar expeditions, and even refugee camps or war zones are incredibly stressful environments,” Mich Lin, an MIT Ph.D. candidate and the study’s lead author, said in a <a href=\"https://news.mit.edu/2026/how-space-habitat-design-supports-its-residents-mental-health-0812\" target=\"_blank\" rel=\"noopener\">statement</a>. “We try to make this work applicable to a lot of scenarios and identify points of intervention in habitat design to reduce stress in those extreme environments.”</p><p><strong>Read more: “<a href=\"https://nautil.us/why-these-researchers-are-drawn-to-the-worlds-edge-3-237668\" target=\"_blank\" rel=\"noopener\">Why These Researchers Are Drawn to the World’s Edge</a>”</strong></p><p>The behavioral outcomes that Lin and her collaborators considered after reviewing relevant literature and interviewing experts included anxiety, nostalgia, curiosity, fatigue, and others. Mapping these emotions and experience onto habitat design features could help predict their effects on these aspects of mental well-being. Designers of such habitats could use HECIA to craft optimal living and working quarters for people engaged in extreme missions, for example eventual manned missions to Mars. “They may read that research has found ‘access paths, stairs, entrances, contribute to the formation of friendships and social cohesion,’” Lin said. “So that would give them an idea of connecting public spaces in the habitat, via the private spaces, so people have to mingle, essentially.”</p><p>It follows that such an approach may also help with the design of aircraft carriers and other military habitats where we ask service people to endure long stays in less-than-comfortable environments.</p><p>This, of course, doesn’t do much to help the sailors on board the USS Abraham Lincoln. But <em>The Wall Street Journal</em> <a href=\"https://www.wsj.com/politics/national-security/u-s-sending-fresh-aircraft-carrier-to-middle-east-amid-iran-war-strain-d0d6e98d?mod=hp_lead_pos2\" target=\"_blank\" rel=\"noopener\">reported</a> yesterday that the USS George Washington is heading to the Middle East to replace the USS Abraham Lincoln. This would give the service members aboard the latter a much-deserved rest after a historic deployment of more than 250 days, far longer than typical deployments.</p><p>Perhaps in the future we could attack this problem on two fronts: use science to design habitats and supply logistics for members of the military that better support their mental health while not waging interminable wars that stretch deployments to the breaking point. </p><p><em>Enjoying </em><a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free </em><a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead image: Mass Communication Specialist 3rd Class Clint Davis</em></p>"},{"title":"Immortality creator Sam Barlow's new video-scouring game is sci-fi horror Precognition, a collab with filmmaker Brandon Cronenberg, in which you see and change the future","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/sam-barlow-immortality-precognition-brandon-cronenberg","category":"gaming","categoryLabel":"Gaming","wordCount":676,"readingTime":4,"content":"<p>\"If you imagine something like the movie Memento...\"</p>\n    \n  \n  \n  \n  \n            <p>The new game from <a href=\"https://www.eurogamer.net/games/her-story\" target=\"_blank\" rel=\"noopener\">Her Story</a> and Immortality maker Sam Barlow - and his studio Half Mermaid - has a name: it's called Precognition. It's a sci-fi horror and it's releasing in spring 2028, as one of the debut games from <a href=\"https://www.eurogamer.net/games/phasmophobia\" target=\"_blank\" rel=\"noopener\">Phasmophobia</a> company Kinetic's new publishing label.</p>\n<p>As with Barlow's previous games, Precognition is a game about scouring archives of video clips to solve a mystery. Here, in Precognition, those archives are the future memories of main character Diana.</p>\n<p>The set-up is that Diana received an experimental implant which allows her to see visions of her future. And when she does, she's able to focus on moments within them and commit them to memory. But there's a catch: by doing so, she'll set off a butterfly effect that changes her future. The idea then is to actively manipulate her memories to change the outcome.</p>\n\n<p>The other notable thing about Precognition is it's being made in collaboration with horror filmmaker Brandon Cronenberg, who I haven't heard of because I'm that sort of person, but who made the films Infinity Pool, Possessor, and Antiviral. I have heard of his father David Cronenberg, though, who created legendary movies like The Fly. Brandon Cronenberg co-developed the story of Precognition and wrote it alongside Barlow.</p><p>In a Q&amp;A session following a showcase for Precognition, which I attended, Barlow revealed a few more details about the game. \"The thing that's really neat here is Diana is a former child prodigy,\" he began. \"She has a photographic memory and her brain is very malleable, and she's brought into this experiment where they're putting implants in people's heads, ostensibly to augment or improve memory, fix how people's memory works, and they discover a side effect of this device is that people start receiving memories of the future.\"</p>\n<blockquote><em>\"As a player, you watch these visions of the future and you hold the triggers down and that commits [it] to memory\" -Sam Barlow</em></blockquote>\n<p>Everyone else quickly forgets what they've seen but Diana: she doesn't. \"She is able to see these visions, these memories of her future, and watch them, and then choose an instant from these memories to collect and commit to memory,\" Barlow said. \"As a player, you watch these visions of the future and you hold the triggers down and that commits [it] to memory.</p>\n<p>\"So if you imagine something like the movie Memento, where he's walking around with his Polaroids: Diana is collecting Polaroids of her future. So as the player, you have complete freedom to decide 'What do I think is useful to send back - what is important information that I can send back from the future?', and as soon as you do that, the future changes and you get a new vision.\"</p><p>You're effectively amassing an \"inventory of alternate possible futures\", Barlow explained. And sure, you could do something boring with this power like get the winning lottery numbers, but you could also do more intriguing things. \"It might be interesting to know that your partner of 10 years has been cheating on you with your brother or something, right?\" Barlow mused.</p>\n<p>There's \"a huge amount\" of freedom in the game - it's very systemic - and he said that \"very quickly you get into this really cool gameplay [loop] of creating and kind of sculpting an inventory to steer the future ... and it gets very exciting and surprising\". There's a few more layers to it but that's it in essence.</p>\n<p>\"This is the most grokkable - I can't say grok any more, can I? Damn you, [Elon] Musk! It's the most grokkable mechanic of our games in terms of there's a really concrete understanding of its role in the story,\" Barlow concluded. \"It is a diegetic mechanic and it has these direct consequences for the story that unfolds.\"</p>\n<p>Precognition is in development for PC (Steam), PlayStation 5, Xbox Series S/X and <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a>.</p>\n\n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 2 more                      \n            \n\n      \n  \n    <p>\n      <a href=\"https://www.eurogamer.net/games/immortality\" target=\"_blank\" rel=\"noopener\">Immortality</a>\n    </p>\n    <p>\n        Android, Mac, PC, PS5, Xbox Series X/S, iOS\n    </p>"},{"title":"Some Realism About Constitutional Remedies Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/","category":"law","categoryLabel":"Law","wordCount":1143,"readingTime":6,"content":"<h2>Introduction</h2>\n<p>The Supreme Court has wavered between two approaches to questions of executive power, which are often labeled institutional formalism and realism.  Formalism treats an institution like the presidency as a “black box” to which the Constitution assigns certain powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  In <em>Trump v. Hawaii</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a> for example, the Supreme Court upheld President Trump’s infamous travel ban<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> by focusing not on the “particular President”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> and his past call for a “complete shutdown of Muslims entering the United States,”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> but rather on “the authority of the Presidency itself.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a>  That is the language of institutional formalism.</p>\n<p>Realism, on the other hand, peers into the “black box,” taking account of how an institution actually works and who actually populates it before defining its powers.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  At times, the Roberts Court has shown glimmers of a more realist orientation.  In <em>Department of Commerce v. New York</em>,<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a> for instance, the Court discredited the Trump Administration’s explanation for why it added a citizenship question to the census by noting that “we are ‘not required to exhibit a naiveté from which ordinary citizens are free.’”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  That is the language of institutional realism.</p>\n<p>One can appreciate the allure of both approaches.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  On the one hand, formalism may feel credulous and impotent in the face of presidential misconduct.  On the other hand, the Court must craft rules of presidential power that will apply long after the incumbent administration has departed.  Wherever one stands on this jurisprudential debate about presidential power, though, we argue in this Essay that a dose of realism is entirely appropriate when it comes to crafting <em>remedies</em> for the executive branch.  Remedies, after all, necessarily straddle “the ideal and the real.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-11\" target=\"_blank\" rel=\"noopener\">11</a>  They aim to effectuate constitutional values in the world as it is.  To achieve that aim, constitutional remedies should take account of the nature and propensities of the administration to which they will be addressed.</p>\n<p>The Essay has three Parts.  In the first Part, we explain why it is generally important to the rule of law that the executive branch “self-apply” legal limits without the involvement of the courts.  We then canvass the evidence that the current President and his Administration lack an ethos of self-application.  Part II explores two remedial questions now vexing the federal courts.  First, the Administration has canceled grants to a broad array of recipients in plain violation of governing statutes and prior obligations of funds.  Second, the Administration has purported to remove numerous officials from independent agencies in violation of statutory removal protections.  In the ensuing challenges to these aggressive actions, the federal courts have faced a choice of remedy: whether an injured party may seek an injunction in district court to undo or to end the unlawful action, or must instead pursue a damages remedy for lost funds or backpay in the Court of Federal Claims (CFC).  We argue that injunctive relief or its functional equivalent in a district court is available in both contexts under existing statutes and precedents.</p>\n<p>Putting the first two Parts together, Part III argues that equitable remedies must be available today to make up for a lack of “self-application” by executive officials.  Monetary remedies alone are inadequate to constrain an executive branch populated by Holmesian “bad” men — that is, people who view the “law” only as a prediction of what a court will force them to do and who do not heed “the vaguer sanctions of conscience.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-12\" target=\"_blank\" rel=\"noopener\">12</a>  A “bad man” Executive facing only damages could achieve all its aims even if the courts ultimately adjudicate its actions to be illegal.</p>\n<p>Enter equity.  Two of the traditional functions of equity are to step in when legal remedies are inadequate and to prevent opportunism.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-13\" target=\"_blank\" rel=\"noopener\">13</a>  If </p>\n<p>an equitable remedy cannot make bad actors good in fact, it can at least force them to abide by a better standard.  In practical terms, “generally equity will order to be done that which ought to have been done.”<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-14\" target=\"_blank\" rel=\"noopener\">14</a>  That should be the courts’ remedial lodestar when confronted with a bad man.  An injunction, of course, does not need to be <em>issued</em> in every case, but it should at least be <em>available</em> in accord with traditional equitable principles, both as an external check on the Executive and to fortify any voices within the Executive calling for restraint.</p>\n<p>In the end, the adequacy of certain judicial remedies to uphold the rule of law depends on a culture of legality within the executive branch.<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-ref-15\" target=\"_blank\" rel=\"noopener\">15</a>  When officials are not committed to that culture, more robust equitable remedies are needed to protect the underlying constitutional principles at issue.  And courts today should indulge some realism about the nature of the current Administration when crafting remedies to keep it within legal bounds.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1834.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Pildes, <em>Institutional Formalism and Realism in Constitutional and Public Law</em>, 2013 Sup. Ct. Rev. 1, 2 (2014).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> 138 S. Ct. 2392 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2418; <em>see</em> <em>id.</em> at 2418–20.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> Pildes, <em>supra</em> note 1, at 2.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> 139 S. Ct. 2551 (2019).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2575 (quoting United States v. Stanchich, 550 F.2d 1294, 1300 (2d Cir. 1977) (Friendly, J.)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> Despite the overlapping terminology, the debate between institutional realism and institutional formalism is analytically distinct from the debate between functionalism and formalism in the separation of powers context.  Pildes, <em>supra</em> note 1, at 21 n.52; <em>see </em>John F. Manning, <em>Separation of Powers as Ordinary Interpretation</em>, 124 Harv. L. Rev. 1939, 1942–44 (2011) (distinguishing functionalism from formalism).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">^</a> Paul Gewirtz, <em>Remedies and Resistance</em>, 92 Yale L.J. 585, 587 (1983).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-11\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">^</a> O.W. Holmes, <em>The Path of the Law</em>, 10 Harv. L. Rev. 457, 459 (1897).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-12\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Henry E. Smith, <em>Equity as Meta-Law</em>, 130 Yale L.J. 1050, 1076–77 (2021).  As Lord Millett once put it, “equity adopts . . . the ‘good man’ theory of law.”  Peter Millett, <em>Bribes and Secret Commissions</em>, 1 Restitution L. Rev. 7, 20 (1993).  (We thank Sam Bray for this apt reference.)  Indeed, Justice Holmes himself was careful to carve out equity from his “bad man” theory of law.  Holmes, <em>supra</em> note 12, at 462–63.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-13\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">^</a> Henry L. McClintock, Handbook of the Principles of Equity § 24, at 53 (2d ed. 1948).  This is often the practical upshot of the familiar “maxim that equity regards that as done which ought to be done.”  <em>Id.</em>\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-14\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">^</a> <em>See </em>Nicholas R. Parrillo, <em>The Endgame of Administrative Law: Governmental Disobedience and the Judicial Contempt Power</em>, 131 Harv. L. Rev. 685, 697 (2018).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/some-realism-about-constitutional-remedies/#footnote-15\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"Terabytes of credentials leaked in massive supply-chain attack","source":"Ars Technica","author":"","url":"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/","category":"tech","categoryLabel":"Technology","wordCount":1037,"readingTime":6,"content":"<p><a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#main\" target=\"_blank\" rel=\"noopener\">\n  Skip to content\n</a></p>\n            \n  \n      \n        <p>\n    \n  \n  \n    TEAMPCP’S RAMPAGE CONTINUES\n  \n</p>\n      \n      <p>\n        The data was scraped and exfiltrated from 2,500 users of a compromised AI package.\n      </p>\n          \n    \n<p>Terabytes worth of credentials, many belonging to the world’s biggest and most sensitive organizations, have been exposed in a supply-chain attack on LiteLLM, an open source tool that streamlines AI-driven software development. Microsoft, Amazon, Cisco, Samsung, and Salesforce are only a handful of the entities whose access secrets were exposed.</p>\n<p>The revelation was posted on <a href=\"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines\" target=\"_blank\" rel=\"noopener\">Tuesday</a> and <a href=\"https://www.hudsonrock.com/blog/largest-ai-supply-chain-breach-of-2026-litellm-hack-impacts-thousands-of-global-enterprises-claim-your-ethical-disclosure\" target=\"_blank\" rel=\"noopener\">Wednesday</a> by security firms CloudSEK and Hudson Rock. CloudSEK said it found cloud keys, repository tokens, SSH keys, Kubernetes secrets, package publishing credentials, environment variables, and AI provider keys that could allow attackers to gain access to more than 2,500 organizations.</p>\n<h2>40 minutes is all it takes</h2>\n<p>The credentials were extracted during a 40-minute window in March while the victims used compromised versions of LiteLLM downloaded from the package’s official location in the Python Package Index repository. Hudson Rock said it made the discovery after analyzing a 195TB file that it obtained. Neither firm identified the source of the information.</p>\n<p>The LiteLLM compromise was the result of a <a href=\"https://arstechnica.com/security/2026/03/widely-used-trivy-scanner-compromised-in-ongoing-supply-chain-attack/\" target=\"_blank\" rel=\"noopener\">previous supply-chain attack</a> that infected the widely used vulnerability scanner Trivy. Other software infected in the campaign includes <a href=\"https://www.kics.io/\" target=\"_blank\" rel=\"noopener\">KICS</a> and the <a href=\"https://developers.telnyx.com/development/sdk/python\" target=\"_blank\" rel=\"noopener\">Telnyx Python SDK</a>. TeamPCP, a ramshackle but extremely capable gang largely made up of teenagers, took credit for the attack, and researchers have largely corroborated the claim.</p>\n<p>“I’ve confirmed the data is legit, by the way, multiple victim orgs,” independent security researcher Kevin Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117082985466021541\" target=\"_blank\" rel=\"noopener\">said</a>. “It contains a significant volume of sensitive content at orgs. It’s a massive supply chain breach due to poor AI security—not because AI is the threat, but teens can run circles around orgs obsessed with rushing out AI and poor DevOps security.”</p>\n                  \n    \n<p>The compromised versions of all four software packages contained code that accessed the memory of infected machines, scraped its contents, and exfiltrated it through an attacker-controlled channel. The data is filled with an assortment of information. Interspersed in the wall of data are credentials to software pipelines maintained by the tens of thousands of organizations that ran LiteLLM during the 40-minute span that the supply-chain attack remained active.</p>\n<p>In all, both security firms said some 434,000 CI/CD (continuous integration/continuous delivery) software pipelines had credentials exposed after running the compromised LiteLLM versions. In many cases, researchers at CloudSEK and Hudson Rock had trouble identifying the organizations the credentials belonged to. For instance, an email address in the dump from the domain @siriusxm.com ultimately didn’t indicate a breach at the satellite broadcaster, but rather one within the infrastructure of SiriusXM subsidiary AdsWizz.</p>\n\n<p>A full list of organizations is <a href=\"https://exposure.cloudsek.com/ai-supply-chain-incident\" target=\"_blank\" rel=\"noopener\">here</a>. The researchers had high confidence that these organizations had their credentials exposed:</p>\n<ul>\n<li>Nvidia Corporation</li>\n<li>Amazon Web Services (AWS)</li>\n<li>Samsung Electronics</li>\n<li>samsung.com</li>\n<li>Salesforce, Inc.</li>\n<li>Cisco Systems, Inc.</li>\n<li>F. Hoffmann-La Roche AG</li>\n<li>ServiceNow</li>\n<li>Siemens AG</li>\n<li>S&amp;P Global</li>\n<li>Airbus US Space &amp; Defense</li>\n<li>John Deere</li>\n<li>Regeneron Pharmaceuticals, Inc.</li>\n<li>London Stock Exchange Group (LSEG)</li>\n<li>Thomson Reuters</li>\n<li>FedEx</li>\n<li>Munich Remunichre.com</li>\n<li>MediaTek Inc.</li>\n<li>Volkswagen AG</li>\n<li>Deloitte</li>\n<li>The Kroger Co.</li>\n<li>Siemens Energy</li>\n<li>Thales Group</li>\n<li>X Corp (Twitter)</li>\n<li>Zscaler, Inc.</li>\n<li>Epic Games</li>\n<li>Orange S.A.</li>\n<li>HP Inc.</li>\n<li>Philips</li>\n<li>Fortum Oyj</li>\n<li>Vodafone Group Plc</li>\n<li>Carl Zeiss AG</li>\n<li>Deutsche Bahn AG</li>\n<li>NGINX, Inc.</li>\n<li>BT Group</li>\n<li>Liebherr</li>\n<li>Krungthai Bank Public Company Limited</li>\n<li>Roku, Inc.</li>\n</ul>\n<p>“Many CI/CD pipelines are configured generically,” Hudson Rock said. “The dumped variables contain active database passwords, third-party API keys, and cloud credentials without any identifiable company email, custom domain string, or internal server name. This means countless organizations currently have active secrets sitting in this database, completely unaware of their exposure.”</p>\n<h2>Welcome to the new world of supply-chain attacks</h2>\n<p>Both firms are urging all organizations that used the compromised versions of LiteLLM—particularly those listed in the high-confidence section of the list—to thoroughly rotate all credentials in their pipelines. Hudson Rock instructed any organization that uses any AI proxy infrastructure, third-party CI/CD vulnerability scanners, or downstream AI packages to immediately audit their environment for versions 1.82.7 and 1.82.8 of LiteLLM, the two compromised versions of the software.</p>\n                  \n    \n        \n<p>The firm advised all those affected to perform “aggressive credential revocation,” assume any secret accessible to the LiteLLM environment is compromised, invalidate and rotate all cloud keys, Kubernetes service account tokens, and GitLab/GitHub PATs, and audit logging and egress filtering.</p>\n<p>As a cautionary tale, CloudSEK said that Trivy developers rotated but failed to fully revoke an automation token over a 20-day window. The lapse gave the attackers a nearly three-week period to force-push malicious code to third-party builds that used the vulnerability scanner. As Beaumont observed, organizations’ rush to integrate AI into their software delivery systems has also greatly contributed to the scale of the damage.</p>\n<p>Update: There are already signs that some of the affected organizations aren’t taking the disclosure with the seriousness warranted. After this post went live, Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117084862543112580\" target=\"_blank\" rel=\"noopener\">reported</a>:</p>\n<blockquote><p>These creds date from about March. One of the orgs impacted told me they’d rotated them all and it’s a nothingburger, so I looked at their responsible disclosure policy, it allows trying creds, so I tried them all. Almost every one worked. Submitted report. One of the biggest US techcos.</p></blockquote>\n<p>Ultimately, the new revelations concerning the LiteLLM supply-chain attack underscore the growing threat of such campaigns and hence the importance of maintaining vigilance around the use of open source software that, when infected, can spread rapidly across the Internet.</p>\n<p>“The key takeaway is how supply chains have evolved to make a single upstream breach affect thousands of companies simultaneously,” Alon Gal, co-founder and chief technology officer of Hudson Rock, wrote in an email. “A window of roughly 40 minutes in which the LiteLLM dependency was hacked led to over 430,000 instances in which millions of secrets were harvested. This magnitude pushes us into a completely new world regarding the type of response required from the cybersecurity industry.”</p>\n<p><em>Post updated to add image.</em></p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/dan-goodin/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Dan Goodin is Senior Security Editor at Ars Technica, where he oversees coverage of malware, computer espionage, botnets, hardware hacking, encryption, and passwords. In his spare time, he enjoys gardening, cooking, and following the independent music scene. Dan is based in San Francisco. Follow him at <a href=\"https://infosec.exchange/@dangoodin\" target=\"_blank\" rel=\"noopener\">here</a> on Mastodon and <a href=\"https://bsky.app/profile/dangoodin.bsky.social\" target=\"_blank\" rel=\"noopener\">here</a> on Bluesky. Contact him on Signal at DanArs.82.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    82 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/gadgets/2026/08/first-test-flight-of-largest-all-electric-aircraft-used-just-5-of-electricity/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"}];

  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
