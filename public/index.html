<script>
var articles = [{"title":"Don't Expect a Lame-Duck Supreme Court Vacancy (But There Are Other Nominations to Consider)","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/11/04/dont-expect-a-lame-duck-supreme-court-vacancy-but-there-are-other-nominations-to-consider/","category":"law","categoryLabel":"Law","wordCount":561,"readingTime":3,"content":"<p>There has been rampant speculation that one of the older conservative justices (namely Justice Sam Alito or Justice Clarence Thomas) might choose to retire before the end of the year so that President Trump could name a replacement while there is still a Republican majority in the Senate. But that is all it is: Speculation.</p>\n<p>I have previously predicted that neither Justice Alito nor Justice Thomas would retire during this presidential term (let alone this year). I adhere to this view.</p>\n<p>Today, the <a href=\"https://www.nytimes.com/2026/11/04/us/politics/alito-trump-supreme-court-not-retiring.html?unlocked_article_code=1.OFE.qNtF._HxIMW0sg7tW&amp;smid=url-share\" target=\"_blank\" rel=\"noopener\"><em>New York Times</em></a> and <a href=\"https://news.bloomberglaw.com/product/blaw/bloomberglawnews/exp/eyJpZCI6IjAwMDAwMWExLWE5NTctZGQ3OS1hN2FmLWVkZmYxYWE3MDAwMyIsImN0eHQiOiJMV05XIiwidXVpZCI6IkVNeHY4SnJNUHhDb1k4aDdKbm5OL0E9PUJ0REpvVjBUYi9IK3NpTHZhMkkvNnc9PSIsInRpbWUiOiIxNzkzODQyOTQyNjM3Iiwic2lnIjoiekxJdXFtUUloeDNkSVZOSlZYOWJrZVgrSTJjPSIsInYiOiIxIn0=?channel=us-law-week&amp;emailQueueID=462b88c2-0e4e-30e3-21b2-ce7d6343536b&amp;senderID=50339658\" target=\"_blank\" rel=\"noopener\">Bloomberg</a> each report that Justice Alito has reaffirmed that he is not planning to retire this year, and that this week's election results have not altered his intentions.</p>\n<p>From the <em>Times</em>:</p>\n<blockquote>\n<p>Justice Samuel A. Alito Jr. has told people close to him that he does not intend to retire immediately from the Supreme Court, despite Democrats' commanding win in Senate contests on Tuesday, which means Republicans will hold the chamber for only a short time longer.</p>\n<p>As a result, Republicans may have missed the window for President Trump to name a fourth or even a fifth justice to the Supreme Court in the final two years of his presidency.</p>\n<p>Justice Alito shared his plans with friends after the election results were clear this week, according to two people close to the justice who spoke on the condition of anonymity.</p>\n</blockquote>\n<p>From Bloomberg:</p>\n<blockquote>\n<p>The 76-year-old Alito, an anchor of the court's conservative wing, has been the subject of speculation that he might abruptly step down to let President Donald Trump fill the vacancy before Republicans relinquish control of the Senate in January. Such a move could extend Trump's imprint on the court by letting him add a younger, conservative jurist to serve for decades.</p>\n<p>The chatter has continued even though Alito said in an interview with Bloomberg News in late September that he had decided to remain no matter how the election turned out. \"I intend to stick around through this term,\" he said then, referring to the nine-month court session that runs through June. \"I made that decision many months ago.\"</p>\n<p>Alito indicated that stance hasn't changed despite the Democratic takeover in Tuesday's election, said the person, who asked not to be identified discussing a private conversation with the justice on Wednesday.</p></blockquote>\n<p>While there is no equivalent report on Justice Thomas, there is little reason to think he is going anywhere. Justice Thomas is on the verge of becoming the longest serving justice in the nation's history. Moreover, Justice Thomas has previously said he intends to spend at least 43 years on the Court. Were he to stick to that plan, he would have several more years to go.</p>\n<p>While there may not be a Supreme Court nomination to keep the Senate busy during the lame-duck period, there are lower court nominations to consider, including nominees for the U.S. Courts of Appeals for the Fifth, Eighth, and Tenth Circuits. As Michael Fragoso <a href=\"https://www.wsj.com/opinion/this-is-the-last-chance-to-confirm-originalist-judges-fcb39316?st=8HQgEM&amp;reflink=desktopwebshare_permalink\" target=\"_blank\" rel=\"noopener\">notes in the <em>Wall Street Journal</em></a>, the lame duck may be Republicans' last opportunity to confirm conservative constitutionalist judges for some time.</p>\n<blockquote><p>Republican senators can make a difference and send a message by putting the Constitution first and confirming the originalist nominees now pending. Petty or parochial squabbles with Mr. Trump may get favorable headlines today but they will be forgotten in a week. A judicial appointment can last a lifetime.</p></blockquote>"},{"title":"Corruption on the Ballot","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/09/corruption-on-the-ballot","category":"fun","categoryLabel":"Interesting Reads","wordCount":1031,"readingTime":6,"content":"<p>Sarah Chamberlain, the president and C.E.O. of the Republican Main Street Partnership, was observing a focus group of <em>MAGA</em> voters in Colorado in late August when she first started to hear a surge of complaints about government corruption. Chamberlain’s organization is dedicated to electing House Republicans—it began with a moderate orientation but has been adjusting to the new world of Trump voters—and she was in the state to help insure that the <em>MAGA</em> faithful would turn out in close races. At that meeting of voters and at subsequent ones, Chamberlain recalled, “we didn’t prompt them. It just came up.” She added, “They are tired of watching their members of Congress get wealthy, and they’re struggling to fill their gas tanks.”</p><p>The polls would soon reflect the same angry sentiment, across the ideological spectrum. Most strikingly, a Fox News poll released in mid-October found that “corruption in government” was voters’ top concern—above inflation, gas prices, and health care. Eighty-eight per cent said that they were “extremely” or “very” concerned about it. Corruption “has steadily gained in importance on the list of the most critical issues facing the country,” Whit Ayres, a Republican pollster, said. “I never remember corruption as an issue being as important as it is now.”</p><p>Corruption is always a tempting message for the party out of power. Donald Trump used that playbook in 2016, vowing to drain the Washington swamp. Bemoaning corruption is risk-free: no voters are in favor of it, even if they have differing interpretations of what the term entails. In the meantime, hitting corruption lets the opposition party duck the harder tasks of producing a detailed legislative agenda. But, in this cycle, what could catapult the issue from a topic of chronic bellyaching to an actual mechanism for changing votes is the gloomy economic climate. Voters who are feeling flush may be willing to tolerate a degree of self-dealing from politicians that becomes insupportable when grocery bills are high. Corruption “is always a useful word, but it’s more effective at some times than others,” Robert Boatright, a political-science professor at Clark University and the co-author of the 2025 book “American Corruption Talk,” noted. “It’s a way to put your finger on people’s general dissatisfaction with our politicians, with our economy, with the state of the world.”</p><p>Then, there is the matter of President Trump. Chamberlain said that Trump did not come up in her focus groups, though participants did cite Donald, Jr.,’s oligarch-financed post-wedding festivities, along with stock trading by the husband of the former House Speaker Nancy Pelosi—this was a <em>maga</em> crowd, after all. But it doesn’t take much to imagine that the swirl of self-dealing around Trump—the Qatari jet gifted for the President’s use; the millions paid to Melania Trump’s production company for her documentary; a billion-plus in crypto profits that flowed into the family coffers—contributed to the fury. Indeed, in a Washington <em>Post</em>/ABC News/Ipsos poll released on October 18th, sixty-six per cent of voters said that they believed Trump was using the Presidency for personal gain, up from fifty-six per cent a year earlier. Ominously for Republicans, the shift came largely from G.O.P. voters and Republican-leaning independents.</p><p>Even with an already cynical electorate, the toll is measurable. In September, Gallup found that Americans’ perception of corruption in government was at its highest level in two decades of polling; eighty-nine per cent said that it is widespread, up ten percentage points from a year earlier. And the blame is not spread evenly. In an A.P.-<em>NORC</em> poll from September, forty-nine per cent of respondents said that the word “corrupt” describes Republicans extremely or very well; just thirty-seven per cent took that view of Democrats.</p><p>Little wonder, then, that Democrats have jumped on the issue. According to the tracking firm AdImpact, Democrats have spent a hundred and eighty-two million dollars this year on corruption-focussed advertising in House and Senate races—far more than Republicans have and more than Democrats did during the previous four elections combined. Their strategy is not simply to highlight corruption but to link it to economic consequences. As a September memo from the Senate Majority <em>PAC</em>, the main super <em>PAC</em> backing Senate Democrats, advised, “The strongest reason to vote against a Republican continues to be that they have raised our costs; do not sacrifice the cost piece in favor of communicating about corruption alone, as corruption charges that are not anchored to costs do not clear the bar.” Hence an ad run against Michael Whatley, the G.O.P. candidate for an open Senate seat in North Carolina: “He got rich lobbying for Big Oil, while they jacked up prices on you.”</p><p>In the Maine Senate race, Democrats have launched a three-million-dollar ad buy, seizing on a report by <em>ProPublica</em> about an F.B.I. investigation, which was shut down last year, into whether Susan Collins, the Republican incumbent, had accepted illegal contributions from a defense contractor. (Collins has denied any wrongdoing.) “Maybe there’s a reason Susan Collins does anything Donald Trump wants her to,” a woman who looks like she’s straight out of an L. L. Bean catalogue says to the camera. Geoff Garin, a Democratic strategist working with the Senate Majority <em>PAC</em>, said that the two points—Collins’s support for Trump and her alleged ethical lapses—are intertwined. “If we only did the Trump without the other, I don’t think we would have as good a chance of defeating her as we do,” Garin said.</p><p>Nowhere, however, is spending on corruption ads greater—or the volume louder—than in the Texas Senate race, between the state attorney general, Ken Paxton, and the state representative James Talarico. Paxton’s Republican-primary opponent, Senator John Cornyn, paved the way with commercials that urged, “Defeat the crook,” citing, among other things, Paxton’s pocketing of a fellow-lawyer’s thousand-dollar Montblanc pen. (A spokesperson has said that Paxton took the pen by “mistake.”) Talarico has called Paxton “everything that’s wrong with this broken, corrupt political system.” In a formulation used by other Democratic candidates, he told voters, “We have an affordability crisis because we have a corruption crisis.” As a matter of pure economics, this linkage may be debatable. But, in a sour season, it could be enough to secure Democratic wins. ♦</p>"},{"title":"Dragon's Dogma 2 gets a timed collaboration with beloved anime and manga series Delicious in Dungeon, and it's out right now on PC, PlayStation and Xbox (but Switch players will have to wait)","source":"Eurogamer","author":"Dom Peppiatt","url":"https://www.eurogamer.net/dragons-dogma-2-dungeon-meshi-collaboration-out-now","category":"gaming","categoryLabel":"Gaming","wordCount":941,"readingTime":5,"content":"<p>Meshi with your head.</p>\n    \n  \n  \n  \n  \n            <p>Have you ever seen - or read - the wonderful Dungeon Meshi (known in English as 'Delicious in Dungeon')? It's a phenomenal manga series written and illustrated by Ryoko Kui, which was adapted into an anime series produced by Trigger in 2024. Long story short, it's about a group of adventurers in a fantasy world who lose an encounter with a dragon - who eats one of the party. What follows is a quest to revive the fallen party member (who happens to be the sister of one of the main characters), with the adventuring party learning to cook and eat monsters in dungeons as they uncover the stranger truth behind the world they inhabit.</p>\n\n<p>If you can't tell, I think it's excellent, and the wait for the next season - landing in October 2027 - is practically killing me. It combines two of my biggest loves, cooking and fantasy, in a melting pot of a world that is intricately crafted and a story that is well-told. So imagine my surprise when I saw that Capcom announced a <a href=\"https://www.eurogamer.net/games/dragons-dogma-2\" target=\"_blank\" rel=\"noopener\">Dragon's Dogma 2</a>: Dark Arisen x Delicious in Dungeon collaboration… and that it is live literally right now on PS5, Xbox, and PC platforms, coming in with a new update to the game.</p>\n<p>\"New allies and equipment are coming to the world of <a href=\"https://www.eurogamer.net/dragons-dogma-2-guides-tips-tricks-9422\" target=\"_blank\" rel=\"noopener\">Dragon’s Dogma 2</a>: Dark Arisen with the arrival of Official Pawns and special collaboration outfits inspired by Delicious in Dungeon characters Laios and Marcille,\" reads a press release from the publisher. \"Delicious in Dungeon is a hit manga series created by Ryoko Kui that follows the adventurer Laios and his party as they venture deep into a dungeon, cooking and eating the monsters they encounter along the way. These iconic characters collide with the classic fantasy world of Dragon's Dogma 2: Dark Arisen in a limited-time collaboration that arrives today for PlayStation 5, Xbox Series X|S, and PC.\"</p>\n\n<p>For those playing on the newly-released <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Nintendo Switch 2</a> version of the game, this update will become available on Wednesday, 11th November.</p>\n<p>Official Pawns modeled after the heavily-armored Laios and the elven mage Marcille can be recruited from the Riftstones, but there's a catch: these Pawns will only be available until Thursday, 28th January, 2027 on all platforms. So we've got a few months to play with them, but these helpful characters will not be permanent.</p><p>Additionally, players that load their data for Dragon's Dogma 2 during the collaboration period will receive special crossover outfits modeled after the attire of Laios and Marcille. These collaboration outfits will automatically be added to in-game storage and can be equipped by both the Arisen and Pawns. Once redeemed, these outfits will remain available even after the collaboration event ends.</p>\n<p>Check out the full patch notes for the new update below:</p>\n<h3>Bug Fixes</h3>\n<p><strong>Vocations</strong></p>\n<p>Warfarer</p>\n<ul>\n<li>Fixed a bug where equipping an Unmaking Arrow in a specific sequence would cause the Arisen to T-pose and the game would freeze.</li>\n</ul>\n<p>Enemies</p>\n<ul>\n<li>Fixed a bug where some enemies in a Rancor's Vortex could not be defeated, resulting in the Vortex being unable to be dispelled.</li>\n<li>Fixed a bug where the barrier effect would still remain when finishing an Evil Eye off with an Unmaking Arrow.</li>\n</ul>\n<p>Pawns</p>\n<ul>\n<li>Fixed a bug where calling a pawn from the opposite side of a cliff would cause them to jump off the cliff.</li>\n<li>Fixed a bug where Thief pawns would continue to pull on the corpses of large enemies by using Ensnare.</li>\n<li>Fixed a bug where pawns would sometimes not say certain lines.</li>\n</ul>\n<p>NPCs</p>\n<ul>\n<li>Fixed a bug where Jiera would unexpectedly die under certain conditions.</li>\n</ul>\n<p>UI</p>\n<ul>\n<li>Fixed a bug where the \"Put previously worn equipment in storage?\" dialogue would sometimes appear on the appraisal results screen at times not fitting the situation.</li>\n<li>Fixed a bug where, when the Arisen's vocation is Warfarer and they have 1 or fewer weapons equipped, the \"Change Equipment\" option would not display when moving to the appraisal results screen.</li>\n</ul>\n<p>Quests</p>\n<ul>\n<li>Fixed a bug in the quest A Game of Wits where, even after being placed on the Sphinx's pedestal, pawns would sometimes move to the shrine's entrance.</li>\n<li>Fixed a bug in the quest Seeking the Sage, where during Riddle of the Body, the shape of the mountainside cliff did not change, resulting in the path becoming impassable.</li>\n<li>Fixed a bug in the quest Beyond Ruin-Night where the quest could not be completed due to some enemies not dying.</li>\n</ul>\n<p>Gimmicks</p>\n<ul>\n<li>Fixed a bug where, after entering either the Precipitous Catacombs or Mired Conduit, saving near the entrance and then loading that saved data would cause the entrance door to be closed, making it impossible to leave.</li>\n<li>Fixed a bug where some ladders could not be climbed in the Beorcan Stronghold.</li>\n<li>Fixed a bug where pillars of ice would not break and would deal continuous damage when touched.</li>\n</ul>\n<p>Other</p>\n<ul>\n<li>Fixed a bug where any weapons and armor given to a pawn when dismissing them would not be removed from your inventory.</li>\n<li>Fixed a bug where Offering Flames could not be obtained when using multiple saved data slots.</li>\n<li>Fixed a bug where certain armor would display unnaturally when equipped at the same time as the Beastren Mask.</li>\n<li>Fixed a bug where some hairstyles would disappear when wearing certain headgear.</li>\n<li>Fixed a bug where background music would not play under certain conditions.</li>\n<li>Fixed a bug where the character's mouth would not move when equipped with the Leather Throat Guard.</li>\n<li>Fixed a bug where, in some bodies of water, the Arisen would be taken by the Brine but pawns and enemies would not be.</li>\n</ul>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"‘Blade Runner 2099’ Shows the ‘Silver Linings’ of a Replicant Takeover","source":"Wired","author":"@wired","url":"https://www.wired.com/story/wired-world-fair-2026-blade-runner-2099/","category":"tech","categoryLabel":"Technology","wordCount":545,"readingTime":3,"content":"<p>Ridley Scott’s 1982 film <a href=\"https://www.wired.com/tag/blade-runner/\" target=\"_blank\" rel=\"noopener\"><em>Blade Runner</em></a> casts a long shadow. In some ways, literally.</p><p>It defined what noir sci-fi would look like for years to come: the rain, the dramatic lighting, the trenchcoats. <a href=\"https://www.wired.com/story/denis-villeneuve-dune-q-and-a/\" target=\"_blank\" rel=\"noopener\">Denis Villeneuve</a> delivered a worthy sequel in 2017 with <a href=\"https://www.wired.com/2017/09/behind-the-scenes-blade-runner-2049-sequel/\" target=\"_blank\" rel=\"noopener\"><em>Blade Runner 2049</em></a>, but for some fans nothing will ever touch the original.</p><p>Silka Luisa tries not to think about these things. “If I didn’t love <em>Blade Runner</em> this would’ve been way too hard,” the showrunner of Prime Video’s limited series <a href=\"https://www.amazon.com/gp/video/detail/B0H8MH1JP1\" target=\"_blank\" rel=\"noopener\"><em>Blade Runner 2099</em></a> said Wednesday during the WIRED World Fair event in Miami.</p><p>Luisa’s show differs quite a bit from its forebears. It still has the humanoids known as replicants, but in <em>2099</em>’s future, they’re the ones calling the shots, giving humans the grunt work they used to do. Set 80 years after <em>Blade Runner</em> and 50 years after <em>2049</em>, it focuses on a replicant Blade Runner, Olwen (Michelle Yeoh), on the search for rogue agents. Along the way she gets teamed up with Cora, played by Hunter Schafer, a human pretending to be a replicant to survive. (We’d say more, but the show doesn’t premiere until November 25, and, you know, spoilers.)</p><p>If this vision of dystopia sounds too familiar for comfort, Luisa hears you. When asked about how she chose to tackle the franchise, she noted that in the last couple of decades, “the present caught up to the films” as megacorporations and environmental collapse became realities in ways they weren’t in 1982. The point of her <em>Blade Runner</em> is to show what happens in a post-revolution world and “not focus on the fears we’re living with right now.”</p><p>That doesn’t mean that <em>Blade Runner 2099</em> is entirely a dystopian tale. For Luisa, it’s about showing the “silver linings” of a world run by replicants. To do that, she picks up on some of the environmental themes touched on in Villeneuve’s movie, which showed how Earth had been wrecked by human activity. <em>Blade Runner 2099</em> depicts a world that replicants are trying to bring back from the brink of ecological collapse using the skills they gained when they were working for humans. “They’re able to rehabilitate the planet,” Luisa says.</p><p><em>Blade Runner 2099</em> also gave Schafer a chance to flex some action-hero muscles—something she’d never done before and something her costar, Yeoh, has been doing for decades. Schafer jumped right in, running and diving across the screen from the pilot onward. For the fight scenes, though, she got some help from Yeoh.</p><p>“It was really physically demanding,” Schafer said during WIRED’s conference. “I felt so lucky to have Michelle Yeoh, who is the fucking master, as a scene partner.”</p><p>But back to that shadow cast by Scott’s original adaptation of Philip K. Dick’s novel <em>Do Androids Dream of Electric Sheep?</em> In addition to being a sci-fi classic, it also created a whole new template for what dystopian fiction could look like. It broods.</p><p>Luisa insists there’s a little more hope in hers—and hopes audiences see that, too. She also wants audiences to know that replicants aren’t the same as the AI bots humans are fixated on in 2026. “They’re more akin to us,” she said. “AI, I just don’t have that same sympathy for.” Hear that, Claude?</p>"}];

}
