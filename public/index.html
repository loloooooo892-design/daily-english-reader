<script>
var articles = [{"title":"Trump administration brings White House ballroom battle back to Supreme Court","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/11/trump-administration-brings-white-house-ballroom-battle-back-to-supreme-court/","category":"law","categoryLabel":"Law","wordCount":1152,"readingTime":6,"content":"<p>The Trump administration <a href=\"https://www.scotusblog.com/cases/national-park-service-v-national-trust-for-historic-preservation-in-the-united-states/\" target=\"_blank\" rel=\"noopener\">returned to the Supreme Court</a> last week, once again asking the justices to intervene in its ongoing efforts to build a new White House ballroom. On Aug. 31, <a href=\"https://www.scotusblog.com/2026/08/supreme-court-allows-construction-on-white-house-ballroom-to-continue/\" target=\"_blank\" rel=\"noopener\">a divided court paused a ruling</a> by a federal judge in Washington, D.C., that would have halted above-ground construction on the project. In a <a href=\"https://www.supremecourt.gov/DocketPDF/26/26-599/431999/20261105171019690_National_Park_Serv._v._Natl_Trust_for_Hist._Preservation_final.pdf\" target=\"_blank\" rel=\"noopener\">petition</a> filed on Nov. 5, U.S. Solicitor General D. John Sauer asked the court to reverse the lower court’s ruling outright or to take up the case and hear oral arguments on the merits. He told the justices that their earlier ruling “has all but answered the question presented” by the dispute, and that the project “should be permitted to move forward outside the shadow of judicial superintendence.”</p><p>Construction on the project began in October of last year with the demolition of the East Wing. In December, the <a href=\"https://savingplaces.org/we-are-saving-places\" target=\"_blank\" rel=\"noopener\">National Trust for Historic Preservation</a> – a private nonprofit that describes itself as having “led the movement to save America’s historic places” “[f]or more than 75 years” – <a href=\"https://www.courtlistener.com/docket/72028010/1/national-trust-for-historic-preservation-in-the-united-states-v-national/\" target=\"_blank\" rel=\"noopener\">filed a lawsuit</a> in federal court, seeking to block the construction until the <a href=\"https://www.ncpc.gov/\" target=\"_blank\" rel=\"noopener\">National Capital Planning Commission</a> and the <a href=\"https://www.cfa.gov/\" target=\"_blank\" rel=\"noopener\">Commission of Fine Arts</a> could review the plans for the construction; the NCPC could approve those plans; and Congress could authorize the construction.</p><p>To support its argument that it had a legal right to sue, known as standing, the trust submitted a <a href=\"https://cdn.savingplaces.org/2025/12/17/08/22/16/f2b9145e-404e-40d0-9f45-d3838b24be95/2025.12.12%20DE%202-3%20-%20Declaration%20of%20Alison%20K.%20Hoagland.pdf\" target=\"_blank\" rel=\"noopener\">declaration</a> from Alison Hoagland, a member who lives in Washington, D.C., and said that she visits the area where the White House is located approximately once per month. Hoagland, who has “expertise in historic architecture,” claimed that the project caused “‘injuries’ to her ‘aesthetic, cultural, and historical interests’ because she finds the ‘scale,’ ‘height,’ and ‘massing’ of the government’s design distasteful.”</p><p>Senior U.S. District Judge Leon issued an <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.dcd.287645/gov.uscourts.dcd.287645.60.0_2.pdf\" target=\"_blank\" rel=\"noopener\">order</a> in late March that temporarily barred the construction of the ballroom above ground but allowed underground construction – of, for example, bomb shelters and bunkers – to move forward, along with any above-ground construction necessary for safety and security.</p><p>Before Leon’s ruling could go into effect, the U.S. Court of Appeals for the District of Columbia Circuit froze it to give that court time to consider the government’s appeal. In August, a divided three-judge panel of the D.C. Circuit <a href=\"https://www.washingtonpost.com/documents/d63cccba-4384-448c-9859-afe5f9f5b3c3.pdf?itid=lk_inline_manual_2\" target=\"_blank\" rel=\"noopener\">upheld</a> Leon’s ruling but delayed its effective date for 14 days to allow the federal government to go to the Supreme Court.</p><p>Writing for the majority, Judges Patricia Millett and Bradley Garcia emphasized that Congress, and only Congress, has the power “to regulate the construction and demolition of White House structures,” but it has not approved any money for the ballroom construction.</p><p>In her dissent, Judge Neomi Rao contended (among other things) that the trust did not have a legal right to bring a lawsuit, known as standing, to try to stop the ballroom construction.</p><p>Calling Leon’s ruling “extraordinary and unlawful,” the Trump administration <a href=\"https://www.scotusblog.com/cases/national-park-service-v-national-trust-for-historic-preservation/\" target=\"_blank\" rel=\"noopener\">came to the court</a> on its interim docket on Aug. 13. Sauer <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A203/419029/20260813211858520_August%20Ballroom%20Application%20-%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">asked</a> the justices to temporarily pause Leon’s ruling, telling them that it would “halt the ongoing construction of the integrated military complex, including a totally secure ballroom space, at the East Wing of the White House, which is vitally required by national security.” He argued that the trust lacks standing to sue, because its claims rest on a member’s “dislike” for the new construction – which, it said, is not the kind of injury that would allow the lawsuit to go forward.</p><p>On Aug. 21, the day that Leon’s order was scheduled to go into effect, Chief Justice John Roberts <a href=\"https://www.scotusblog.com/2026/08/supreme-court-allows-white-house-ballroom-construction-to-continue-for-now/\" target=\"_blank\" rel=\"noopener\">issued</a> an administrative stay – that is, an order that kept Leon’s order on hold (and permitted construction to continue) – to give the justices additional time to consider the government’s request.</p><p>By a vote of 5-4, the court on Aug. 31 granted the government’s application and continued the pause on Leon’s order. In an <a href=\"https://www.supremecourt.gov/opinions/25pdf/26a203_2b8e.pdf\" target=\"_blank\" rel=\"noopener\">eight-page, unsigned opinion</a>, the majority stressed that it was not deciding whether the project was legal. Instead, it said, the trust likely lacks standing to challenge the project at all. The harms that Hoagland alleges, the majority wrote, are not the kind of “concrete” and specific injuries required to bring a lawsuit. Moreover, the majority said, if Leon’s order were allowed to go into effect, the government would be permanently harmed – another key criterion in determining whether to grant emergency relief. Among other things, it noted, senior government officials “attest[] that constructing <em>something</em> approximating the height and mass of the intended above-ground ballroom is ‘crucial’ to the security of the below-ground military installation.”</p><p>Roberts dissented, in an opinion joined by Justices Sonia Sotomayor, Elena Kagan, and Ketanji Brown Jackson. In his view, the construction “is likely unlawful,” and the majority’s decision was “no victory for the separation of powers.” He contended that the trust did have standing to sue because “[a] historic preservationist such as Hoagland can be aesthetically injured in a concrete, particularized way by the transformation of a historic building that she frequently enjoys, just as,” based on prior court precedent, “an environmentalist can sustain a concrete, particularized aesthetic injury from the extinction of a particular animal or the transformation of a particular forest or river that he regularly enjoys.”</p><p>In its Nov. 5 petition, the Trump administration argued that “the East Wing renovation is a vital national-security effort taking place on the White House grounds with the President’s personal involvement,” and that it has “proceeded swiftly since construction began in October 2025, in keeping with the urgency of remedying the East Wing’s obsolete and vulnerable security infrastructure, all as this President faces an onslaught of assassination attempts.” Because Leon’s order blocked the project “at the behest of a single passerby who complains that she expects to dislike its ultimate design,” Sauer wrote, his “decision is demonstrably flawed.”</p><p>Sauer acknowledged that the court’s Aug. 31 ruling came on the interim docket and therefore “only involve[d] a preliminary look at the merits and equities” of the dispute. But, he continued, in this case “[t]here is nothing further or new that this Court needs to decide after its” earlier opinion “in order to answer the question presented” by the government’s new filing – specifically, whether Leon was wrong to block “the ongoing renovation of the East Wing of the White House.” This is especially true, Sauer suggested, given the court made its Aug. 31 decision “after extensive briefing, and issue[d] detailed majority and dissenting opinions addressing” the issues in the case.</p><p>Sauer urged the court to summarily reverse Leon’s decision – that is, to reverse it without additional briefing or oral argument – or, at a minimum, grant review and hear oral arguments.</p><p>The trust’s response to the government’s petition is currently due on Dec. 7. </p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Trump administration brings White House ballroom battle back to Supreme Court</em>, SCOTUSblog (Nov. 10, 2026, 9:50 AM), https://www.scotusblog.com/2026/11/trump-administration-brings-white-house-ballroom-battle-back-to-supreme-court/</p>"},{"title":"Do We Think in Pictures, Words, or… Code? - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/do-we-think-in-pictures-words-or-code-1286476/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1402,"readingTime":8,"content":"<p>“I have no words,” people often say when they feel or think something so transformative or moving that the effect seems beyond coherent expression. Love, grief, death, and awe, in particular tend to elude language’s grasp.</p><p>Poetry, which rejects many of the conventions of everyday language, may have the greatest capacity to name the unnameable. And yet, many of us think our most private thoughts in words—our inner monologues galloping an inside track through our minds all day long. So what is the role of language in thought?</p><p>This is a subject that MIT cognitive scientist and professor Evelina Fedorenko has spent decades researching. Using studies of behavior, brain imaging, intracranial recordings and stimulation, and computational modeling, she has investigated how people understand and produce language, and where language and thought overlap.</p><p><strong>Read more:</strong> <a href=\"https://nautil.us/how-does-your-brain-know-a-cat-is-a-cat-1280394\" target=\"_blank\" rel=\"noopener\"><strong>“How Does Your Brain Know a Cat Is a Cat?”</strong></a></p><p>I recently interviewed Fedorenko via email about the definition of a “thought,” the role of language and culture in perception, attention and memory, and what large language models can teach us about the nature of human reasoning.</p><p><strong>Is there such a thing as a discrete “thought” with edges, and if so how would you define it or recognize it? </strong></p><p>This is a tricky one because it really depends on how you define “thought.” There certainly <em>can be</em> discrete thoughts with edges, but there also seem to sometimes be thoughts that are maybe half-formed, like partial intuitions, a glimpse of something that is hard to call discrete.</p><p>How would you recognize a discrete thought is a hard question, but one possible operational definition is that you can translate it into a symbolic form, be it a sentence or a little piece of a computer program.</p><p><strong>What is your best hypothesis about the form of human thoughts? Are they composed of pictures, words, sounds, feelings—all of those things at once? </strong></p><p>It’s not my hypothesis: I think this is the field’s current best guess. Much of human, and perhaps non-human, thought and reasoning can be construed as pieces of computer code, what is often referred to as “probabilistic language of thought,” or PLOT.</p><p>So, actually not pictures or words. And as a side note, I think the fact that this term “language of thought” has been in common use for many years has added to the confusion between language and thinking, but the term does not suggest that we think in language. In fact, there is now strong evidence that we don’t.</p><p>It’s also worth noting that there are many different things we think about. We think and reason about the physical world, about other people, about abstract relations—for example, imagine thinking through a way to solve a logic or a math problem. And there is now evidence that these different aspects of thought are supported by separate mechanisms in our brain.</p><p>For example, we have brain regions that help us reason about gravity, other regions that help us figure out what someone else believes or wants, and yet other regions that help us figure out how abstract elements relate to one another. Why these different capacities separate is a great question, and many of us are working to figure that out.</p><p><strong>You authored a paper in 2024 that found that language is a tool for communication rather than thought. What was the basis for this finding, and if this is so, why then do so many of us have internal monologues?</strong></p><p>There are two primary bodies of evidence that support the idea that we don’t use or need language to think. One comes from studies of patients with severe brain damage that affects the language areas, severe aphasia.</p><p>Some such individuals can nevertheless think just fine: They can do math, navigate in space, make social judgments, solve sudoku puzzles, and so on.</p><p>So what they lose because of their brain damage is the ability to <em>translate</em> their thoughts into language, and also to infer meanings from what others say or write, but they seem to preserve their ability to think.</p><p>The other line of evidence comes from brain imaging, mostly functional MRI. Work in our group and some others have shown across many different kinds of experiments that the brain areas that allow you to understand and produce language—your “language areas”— are working hard whenever we use language, but are not active when you perform various thinking tasks. So they don’t show activity when you solve a math problem or when you have to reason about someone else’s mind. Instead, other parts of the brain are hard at work.</p><p>The phenomenology of what you referred to as “internal monologue” or what is sometimes referred to as “inner speech” is super interesting and is actively studied. We know that engaging in inner speech cannot be critically important for complex thought because a non-trivial fraction of humans report no such percepts. And yet, you are right that many humans do experience it. I hope some of the ongoing work, including by Anya Ivanova at Georgia Tech, will help us understand the role inner speech may play in the minds of those who experience it often.</p><p><strong>Some researchers have suggested that language actively influences perception, attention, and memory. For example, research on Aboriginal communities like the Kuuk Thaayorre, who speak</strong> <strong><em>Guugu Yimithirr</em>, shows they use absolute cardinal directions—north, south, east, west—instead of egocentric terms like “left” and “right,” causing them to construct space and time relative to the landscape rather than their own bodies. How can we square this finding with the idea that language and thought are distinct?</strong></p><p>I think this literature on cross-linguistic effects is fraught with confusion. Many confuse language and thinking. An even larger fraction of scientists and non-scientists alike seem to conflate language and culture. There are absolutely strong and robust effects of culture on cognition and these effects are necessarily reflected in that culture’s language, but none of the reported effects show that language affects thinking.</p><p>For example, say you live in a small farmer-forager village in Amazonia, and in your culture a certain landmark—say, a river—is really important for you to orient in space. Your thinking about space will certainly be different from someone who lives in downtown Manhattan, and the words you use to describe space will reflect the importance of the landmark.</p><p>But this is not language affecting thought, this is culture affecting your way of life and your thinking and reasoning. Language is simply a reflection of that. That’s what language does for us. It allows us to share the mental contents of our minds with each other. If I think about a banana grove being up the river, I will also talk about it in this way.</p><p><strong>What can large language models teach us about the nature of thought? </strong></p><p>Many things. When LLMs emerged, they nicely highlighted that language can kind of exist without the ability to think. Early models like GPT2 produced fluent language but were weak at reasoning. Of course, as models got larger and more sophisticated, they got better at many cognitive tasks.But those models are no longer just models trained on linguistic text with the objective of predicting the next word. They were also trained on massive databases of computer code—which, by the way, in the human brain is processed by different brain regions from those that process language! And often with additional objectives and with humans in the loop in some way.</p><p>So, how and why these modern models become so cognitively competent gets harder to unpack, but there is a lot of great work using mechanistic interpretability approaches to do so.</p><p>In a really exciting recent <a href=\"https://arxiv.org/abs/2608.13567\" target=\"_blank\" rel=\"noopener\">finding</a>—this is work with Andrea de Varda, Pengrui Han, and Jacob Andreas—we see that models that are cognitively competent seem to develop separate components for language and for different aspects of thought, very much like the human brain.</p><p>And more generally, because these models are much more penetrable than the human brain (we can use all sorts of approaches that we simply can’t with current methods we have in human neuroscience), we may get some cool insights into how these models solve a math problem or reason socially, and these insights can then hopefully be tested in humans. So I think AI models will continue to inform human cognition for many years to come. </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: HAKINMHAN / Shutterstock</em></p>"},{"title":"Christopher Nolan's The Odyssey Officially Sets Home Release Date","source":"Polygon","author":"@mikemcwhertor","url":"https://www.polygon.com/the-odyssey-christopher-nolan-home-release-date/","category":"gaming","categoryLabel":"Gaming","wordCount":754,"readingTime":4,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/michael-mcwhertor/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Nov 10, 2026, 5:52 PM EST\n                                </p>\n                    \n                                            \n                                                                                                <p>\n                                Michael McWhertor is a New York-based journalist and editor with more than 20 years of experience covering games, industry events, technology, movies, and TV.\n                            </p>\n                                                            \n                                    \n                                                                        <p>Odysseus returns home at record speed</p>\n    \n        \n    \n                                                     <p>After a $1.8 billion run at the global box office, Christopher Nolan's <a href=\"https://www.polygon.com/the-odyssey-2026/\" target=\"_blank\" rel=\"noopener\"><em>The Odyssey</em></a> is coming home. Universal Pictures Home Entertainment confirmed that Nolan's adaptation of Homer's epic will get a digital and physical release in November, letting viewers relive <em>The Odyssey</em> at home — now with \"exclusive content never-before-seen by audiences.\"</p>    \n<p>Universal says that <em>The Odyssey</em>'s home video release will arrive \"months\" before <a href=\"https://www.polygon.com/the-odyssey-streaming-release-date-peacock-netflix/\" target=\"_blank\" rel=\"noopener\">the film comes to streaming services</a> (likely NBCUniversal's Peacock), confirming a 2027 debut on streaming.</p>    \n<h2>\n                        The Odyssey home video release date confirmed\n               </h2>\n<p><em>The Odyssey</em> will officially be released on digital platforms, 4K Ultra HD, Blu-ray, and DVD on Nov. 17.</p>    <p>The home release will include more than 90 minutes of special features, which were \"personally overseen by Christopher Nolan,\" Universal said in a news release. The collection of bonus features includes behind-the-scenes footage, interviews with the cast and crew, and the film's IMAX-exclusive prologue. Some of the film's special features will be exclusive to <em>The Odyssey</em>'s physical releases.</p>    \n<h3>\n            The Odyssey home release special features\n    </h3>\n    <ul>\n                    <li>\n                                        <strong>Plotting A Course</strong> - Hear how Christopher Nolan approached the daunting challenge of adapting a classic literary work into a cinematic epic.\n                        </li>\n                    <li>\n                                        <strong>Icons</strong> - Casting, costuming, hair, and makeup combine with layered performances to create <em>The Odyssey</em>'s iconic characters.\n                        </li>\n                    <li>\n                                        <strong>The Widest Window</strong> - Discover how Christopher Nolan turned a long-held filmmaking dream into reality, pushing the boundaries of cinema to achieve an unprecedented milestone.\n                        </li>\n                    <li>\n                                        <strong>On Location</strong> - Journey with the cast and crew across the globe as they brave extreme conditions to capture the world's most extraordinary locations on film.\n                        </li>\n                    <li>\n                                        <strong>The Horse</strong> - Since the Trojan Horse may be the most well-known trick in history, a new design refashions its features to look like a completely convincing ruse.\n                        </li>\n                    <li>\n                                        <strong>The Fall of Troy</strong> - Become immersed in the expansive Moroccan set where special lamps simulate fire, entire armies take up swords, and the sense of scale is enormous.\n                        </li>\n                    <li>\n                                        <strong>Ithaca</strong> - Blending a 15th-century castle on Italy's Favignana island with soundstage interiors, filmmakers create the home Odysseus was determined to return to.\n                        </li>\n                    <li>\n                                        <strong>Battle Ready</strong> - Matt Damon, Tom Holland, and the stunt team work together to bring realism and intensity to the film's remarkable action sequences.\n                        </li>\n                    <li>\n                                        <strong>Apparent Magic</strong> - Discover how the special effects and visual effects teams worked in lockstep to bring fantastical elements to life with stunning realism.\n                        </li>\n                    <li>\n                                        <strong>The Sea People</strong> - Retrofitted Viking ships, challenging open-sea conditions, and immersive storm effects combine to bring Odysseus' perilous voyage to life.\n                        </li>\n                    <li>\n                                        <strong>The Score</strong> - Composer Ludwig Göransson opens his studio to reveal how ancient instruments, vocals, and experimentation shaped <em>The Odyssey</em>'s intimate and emotional soundtrack.\n                        </li>\n                    <li>\n                                        <strong>Bringing It Home</strong> - Explore the post-production process, where meticulous editing and immersive sound design complete the film's cinematic journey.\n                        </li>\n                    <li>\n                                        <strong>The Journey of Film on The Odyssey</strong>* - Content creator Reece Feldman asks Christopher Nolan for a precise walkthrough of what happens to the film once it leaves the set.\n                        </li>\n                    <li>\n                                        IMAX Exclusive Prologue*\n                        </li>\n                    <li>\n                                        James Blake, Travis Scott, and Ludwig Göransson - \"When I'm Home\" music video*\n                        </li>\n                    <li>\n                                        Trailers\n                        </li>\n            </ul>\n<p><em>* Denotes features only available on physical formats</em></p>    \n    \n                                                                                            \n        \n<p> <em>The Odyssey</em> was written and directed by Christopher Nolan. The movie stars Matt Damon, Tom Holland, Anne Hathaway, Robert Pattinson, Lupita Nyong’o, and Samantha Morton, with Zendaya and Charlize Theron. They are joined by John Leguizamo, Jon Bernthal, Himesh Patel, Bill Irwin, Elliot Page, and Benny Safdie.</p>    \n<p>Nolan's adaptation of Homer's epic was both a box office success — it's the second-highest-grossing film of 2026, behind <a href=\"https://www.polygon.com/spider-man-brand-new-day/\" target=\"_blank\" rel=\"noopener\"><em>Spider-Man: Brand New Day</em></a> — and a critical darling. In <a href=\"https://www.polygon.com/the-odyssey-review-christopher-nolan/\" target=\"_blank\" rel=\"noopener\">Polygon's review of <em>The Odyssey</em></a>, entertainment editor Jake Kleinman called it \"one of the most epic and beautiful films of all time.\"</p>    <p><em>The Odyssey</em>, Kleinman wrote, is Nolan \"at the height of his power, using every skill, trick, technique, and ounce of Hollywood cred at his disposal to tell a story that's both awe-inspiring and shockingly unambiguous. With a sprawling cast of stars, jaw-dropping special effects, inexplicable visuals, and a masterful score from Ludwig Göransson, <em>The Odyssey</em> is Nolan's purest picture ever. It's his Lord of the Rings trilogy boiled down to one three-hour saga, a meticulous tribute to a beloved story told with just the right mix of fealty and creative liberty to forge something timely and timeless all at once.\"</p>"},{"title":"Meta shocked by $25B fine after N.M. refused to join multistate settlement","source":"Ars Technica","author":"","url":"https://arstechnica.com/tech-policy/2026/10/meta-whines-new-mexico-is-impossible-to-please-after-historic-25-billion-fine/","category":"tech","categoryLabel":"Technology","wordCount":1333,"readingTime":7,"content":"<p>\n    \n  \n  \n    “Many false promises”\n  \n</p>\n    \n    <p>\n      Meta will appeal a ruling imposing the largest fine Mark Zuckerberg has ever seen.\n    </p>\n    \n            <p><a href=\"https://cdn.arstechnica.net/wp-content/uploads/2026/10/GettyImages-1968308632.jpg\" target=\"_blank\" rel=\"noopener\">\n              \n            </a></p>\n          \n  \n    \n<p>Meta must pay $25 billion to New Mexico after a jury found the tech giant guilty of nearly 44 million violations of state consumer protection laws.</p>\n<p>The largest fine to ever hit Meta came after New Mexico Attorney General Raúl Torrez declined to join an <a href=\"https://arstechnica.com/tech-policy/2026/08/meta-settles-states-child-safety-claims-for-18b-florida-rejects-deal-as-peanuts/\" target=\"_blank\" rel=\"noopener\">$18 billion settlement Meta reached earlier this year</a> with attorneys general in nearly all states.</p>\n<p>In his <a href=\"https://cdn.arstechnica.net/wp-content/uploads/2026/10/State-of-New-Mexico-v-Meta-Judgment-10-21-26.pdf\" target=\"_blank\" rel=\"noopener\">opinion</a> Wednesday, US district court judge Francis J. Mathew said there was no “bright line rule” for determining the appropriate penalty for Meta’s repeated and willful deception of users since 2010 about their “control of data, third-party data misuse, misinformation, hate speech, and equal enforcement.”</p>\n<p>New Mexico had asked the court to impose even higher fines, up to $40 billion. The entire state of 2 million people were harmed by Meta’s conduct, Torrez argued, and it seemed dubious that Meta would make meaningful changes unless the penalty impacted Meta’s stock price.</p>\n<p>Mathew found that the trial record—which showed that top leadership, including Mark Zuckerberg, were aware that the company, then known as Facebook, was making misleading public representations—supported “the highest level of penalty allowed by the NM Unfair Practices Act.”</p>\n<p>“The jury was unequivocal: Facebook systematically misled the public” and “took advantage of the public’s lack of knowledge respecting Facebook’s practices to a grossly unfair degree,” Mathew wrote.</p>\n<p>To Mathew, it seemed that Meta made a choice to avoid transparency with users in a bid to capitalize on data they didn’t realize they were sharing and better compete with one of its main rivals, the platform then known as Twitter.</p>\n<p>“The violations the jury found were not the product of a single misleading statement or isolated incident,” Mathew noted. “They arose from repeated public representations over more than 11 years, concerning multiple core aspects of Facebook’s platform and business.”</p>\n                  \n    \n<p>Meta had hoped that New Mexico’s penalty would be more in line with a<a href=\"https://arstechnica.com/tech-policy/2019/07/ftc-fines-facebook-5-billion-imposes-new-privacy-oversight/\" target=\"_blank\" rel=\"noopener\"> $5 billion settlement</a> the company made with the Federal Trade Commission to address the Cambridge Analytica fallout. At most, they expected to pay $3.4 billion, while arguing that anything more would be “unconstitutional,” AP News <a href=\"https://apnews.com/article/facebook-penalty-cambridge-analytica-new-mexico-b329f82c3d3db3758a159405acbd4d0e\" target=\"_blank\" rel=\"noopener\">reported</a>.</p>\n<p>But Mathew said that the FTC settlement “cannot be viewed in a vacuum” while noting that so far, “penalties, consent agreements, and decrees have not deterred Meta from using deceptive trade practices” since the Cambridge Analytica scandal was first exposed.</p>\n<p>“To induce users to provide their personal information to Facebook, Facebook made many false promises respecting the security and control of that data over the course of more than a decade,” Mathew wrote.</p>\n<h2>Meta will appeal</h2>\n<p>In a <a href=\"https://nmdoj.gov/press-release/the-new-mexico-department-of-justice-secures-another-landmark-victory-against-big-tech-with-historic-25-billion-penalty-against-facebook/\" target=\"_blank\" rel=\"noopener\">press release</a>, Torrez celebrated the ruling, calling it “a historic day for New Mexico and for consumers across the country.”</p>\n<p>“For too long, powerful technology companies have operated as though their size and influence put them beyond the reach of the law,” Torrez said. “A New Mexico jury found nearly 44 million violations of our consumer protection statute, and this penalty order demonstrates that those violations carry real consequences. We took on one of the largest companies in the world because New Mexicans deserve honesty, accountability, and the protection of their personal information. Today’s result makes clear that no corporation is too powerful to be held accountable.”</p>\n<p>A Meta spokesperson confirmed to Ars that the company plans to appeal. Legal experts told Reuters the company has a decent chance at slashing the fine on appeal based on constitutional claims. On top of likely claiming that the penalty is unconstitutional, Meta also feels that “this ruling, and the Attorney General’s approach to enforcement, makes it all but impossible to do business in the state of New Mexico,” the spokesperson said.</p>\n                  \n    \n<p>The eye-popping fine following the multistate settlement appears to be making the company uncomfortable, despite critics claims that New Mexico’s penalty is just a “drop in the bucket” for a company that makes $200 billion annually. On Thursday, the Verge <a href=\"https://www.theverge.com/tech/1015877/meta-q3-2026-earnings-child-safety-settlement\" target=\"_blank\" rel=\"noopener\">highlighted</a> Meta’s third-quarter earnings <a href=\"https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Third-Quarter-2026-Results/default.aspx\" target=\"_blank\" rel=\"noopener\">report</a>, which showed the company paid close to $10 billion for the multistate settlement. Without that expense, Meta’s income from operations would have been $22 billion higher, the report said.</p>\n<p>The high penalties come as <a href=\"https://arstechnica.com/ai/2026/08/with-new-open-models-meta-pitches-another-reboot-of-its-struggling-ai-strategy/\" target=\"_blank\" rel=\"noopener\">Meta attempts to reboot its struggling AI strategy</a>, and Meta appeared to signal to Donald Trump’s administration to possibly support its appeal by nodding to its AI wing in its statement opposing the ruling.</p>\n<p>“At its core, this lawsuit seeks to impose a tax on speech to enforce new rules for what people can say online,” Meta’s spokesperson said. “We are confident we will prevail on appeal. In the meantime, Meta will continue to build a safe and free platform to connect millions of Americans, grow small businesses, and help the country maintain its competitive edge.”</p>\n<h2>AGs warned to keep watch on Meta AI</h2>\n<p>Nidhi Hegde, executive director of a watchdog nonprofit called the American Economic Liberties Project, told AP News that Meta users want more enforcers willing to take the company to trial rather than settle matters in ways that the FTC settlement suggested weren’t genuine.</p>\n<p>In his opinion, Mathew noted that the jury found that Meta internal messages and investigation results showed that “rather than seek to educate Facebook’s users… Zuckerberg chose instead to capitalize on that lack of understanding in order to manipulate users into sharing more of their personal information publicly.” In one message, Zuckerberg was found laying out a plan to deceive users, saying, “Give them a chance to change their privacy settings but obviously don’t encourage it.”</p>\n                  \n    \n        \n<p>The company also failed to notify users when apps misused their data, only flagging two of 2,000 unique apps associated with data misuse, Mathew said. Following its investigation, Meta’s “decision was deliberately made to narrow Facebook’s internal definition of data misuse so that Facebook would not have to notify as many people due to the operational burden of doing so,” he wrote.</p>\n<p>Additionally, Facebook continued knowingly profiting off of pages with misinformation and hate speech, Mathew wrote. Internal research found “substantial amounts of misleading, false, and possibly false political, health, and science content,” with Meta documenting a “greater concentration of false content in top performing advertising content than in top performing Facebook content.”</p>\n<p>Rather than share that research, Meta buried it, while also deceiving users in dozens of other ways, including by misrepresenting that the average Facebook users gets “equal treatment” to celebrities and influencers. While Meta claimed everyone was treated the same, one class of users received warning to remove violating content before strikes were applied and frequently got harmful or sketchy content decisions overturned in cases where most users would not.</p>\n<p>Hegde told AP News that she thinks as Meta and other company’s AI products grow more popular, it will be increasingly important for states to remain watchful and protect residents from unknown harms.</p>\n<p>“Right now, they are rolling out Muse, an AI assistant encouraging people to trust it with everything from their bank accounts to their medical information,” Hegde said. “Which is why we need more enforcers with courage and laws with actual teeth to rein them in.”</p>\n<p>Torrez vowed to keep watch in New Mexico and to continue using the blueprint from the Meta case to enforce consumer protection laws and prevent tech giants’ misuse of data.</p>\n<p>“This case has always been about more than one company or one scandal,” Torrez said. “It is about whether corporations can mislead consumers about what happens to their personal information without facing meaningful consequences. New Mexico stood its ground, took this case to trial, and secured a verdict establishing millions of violations of our law. This outcome reinforces a fundamental principle, companies that do business in our state must follow our laws and respect the rights of our people.”</p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/ashleybelanger/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Ashley is a senior policy reporter for Ars Technica, dedicated to tracking social impacts of emerging policies and new technologies. She is a Chicago-based journalist with 20 years of experience.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/tech-policy/2026/10/meta-whines-new-mexico-is-impossible-to-please-after-historic-25-billion-fine/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    218 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/tech-policy/2026/11/man-who-lost-308000-on-sports-bets-sues-kalshi-for-offering-illegal-gambling/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"}];

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
