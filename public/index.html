<script>
var articles = [{"title":"Wellness Influencers Are Pushing ‘Natural’ and Unproven Alternatives to Adderall","source":"Wired","author":"@wired","url":"https://www.wired.com/story/wellness-influencers-are-pushing-natural-and-unproven-alternatives-to-adderall/","category":"tech","categoryLabel":"Technology","wordCount":1317,"readingTime":7,"content":"<p>In May 2025, Health and Human Services secretary <a href=\"https://www.wired.com/tag/robert-f-kennedy-jr/\" target=\"_blank\" rel=\"noopener\">Robert F. Kennedy Jr.</a>’s “Make America Healthy Again” Commission released a <a href=\"https://www.whitehouse.gov/wp-content/uploads/2025/05/MAHA-Report-The-White-House.pdf\" target=\"_blank\" rel=\"noopener\">report</a> that sought to identify key drivers of childhood chronic disease. The last was by far the most controversial: “The Overmedicalization of Our Kids.”</p><p>Beyond his <a href=\"https://www.wired.com/story/no-one-knows-where-us-vaccine-policy-goes-next/\" target=\"_blank\" rel=\"noopener\">anti-vaccine position</a>, Kennedy has a history of inflammatory opinions on common prescription drugs. He has sought to blame the national epidemic of mass shootings on <a href=\"https://www.motherjones.com/politics/2025/12/rfk-jr-mass-shootings-ssri-antidepressants/\" target=\"_blank\" rel=\"noopener\">antidepressants</a>, for example, and claims that people have been “<a href=\"https://www.nytimes.com/2025/03/27/well/mind/adhd-adderall-ritalin-stimulant-facts.html\" target=\"_blank\" rel=\"noopener\">poisoned</a>” by psychiatric drugs, including stimulants used to treat attention deficit hyperactivity disorder, such as Adderall and Vyvanse.</p><p>It so happens that as the HHS moves to further <a href=\"https://thehill.com/policy/healthcare/5164123-robert-kennedy-jr-psychiatric-drugs-children/\" target=\"_blank\" rel=\"noopener\">restrict access</a> to these stimulants, a host of <a href=\"https://www.google.com/search?q=wired+make+america+healthy+again&amp;sca_esv=75280e57e4653e14&amp;rlz=1C5GCEM_enUS1154US1154&amp;sxsrf=APpeQntsj4jKdXquSaVaT0DBNgiqLJ7oPg:1784760602842&amp;ei=Gklhapv2Muez5NoPn-OZsQY&amp;start=10&amp;sa=N&amp;sstk=AU9db-DT8PlVF4vzxoFI4-BdQdYzKEE5Fl_tWahNNHCGr0W1MobGBBFXgGZxXVdc2iAHIR8GA-vlzxCJ9kst-PSAlYkxCrSxxyLkCg&amp;ved=2ahUKEwib6_atr-eVAxXnGVkFHZ9xJmYQ8NMDegQIRRAW&amp;biw=1277&amp;bih=739&amp;dpr=2\" target=\"_blank\" rel=\"noopener\">alternative medicine</a> brands are flooding <a href=\"https://www.wired.com/category/business/social-media/\" target=\"_blank\" rel=\"noopener\">social media</a> with advertisements that cast them in a negative light—and suggest they can be replaced with, or at least aided by, supplements that promise mental clarity, calmness, and emotional balance. The companies include Graymatter Labs, Stasis, Magic Mind, Thesis, and Nello, and they tout the supposed cognitive benefits of nootropic pills and drinks containing the amino acid L-theanine, the herb ashwagandha, turmeric, B vitamins, and much more.</p><p>Across Instagram, TikTok, and YouTube, influencers hype the biohacking treatments in paid partnership videos, often comparing them favorably to stimulants, which they characterize as having disruptive negative side effects. The gray-market dietary supplements they offer as alternatives, unlike psychiatric medications, don’t have to be evaluated and approved by the Food and Drug Administration before they’re marketed.</p><p>“I was on Adderall from college to my late twenties,” says a content creator named Katie Silbar in a <a href=\"https://www.instagram.com/p/DWkUu2ijCEv/\" target=\"_blank\" rel=\"noopener\">March video</a> endorsing Thesis, which sells pills with varied formulas like “Motivation” and “Neuroprotection” for <a href=\"https://takethesis.com/products\" target=\"_blank\" rel=\"noopener\">$59 a jar</a>. “And somewhere in there, I decided I didn’t want to be on a stimulant anymore.” Silbar goes on to say that she has been on Thesis for several weeks and feels “way less jittery” and “focused” in a way that “isn’t forced.” She adds that while the price for Thesis supplements may be steep, she’d gladly pay double for the results she has seen.</p><p>Magic Mind, which counts comedian Pete Holmes and Los Angeles Rams quarterback Matthew Stafford as spokesmen, shares video clips in which Adderall is <a href=\"https://www.instagram.com/p/DWjg5dzgPGv/\" target=\"_blank\" rel=\"noopener\">described as addictive</a>. (Stimulants can be misused, which is why Adderall and Vyvanse are federally classified Schedule II controlled substances, but medical experts emphasize that they are <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3489818/\" target=\"_blank\" rel=\"noopener\">safe and effective</a> if taken as directed under medical supervision.) On Graymatter Labs’ socials, you can hear from a father who says that its Bright Mind drink mix (containing 27 plant-based nootropics and adaptogens) helped him <a href=\"https://www.instagram.com/p/DP7V7i1DIcY/\" target=\"_blank\" rel=\"noopener\">overcome mood swings</a> caused by Adderall and made him more patient with his young son.</p><p>None of the companies mentioned in this article returned a request for comment on their scientific claims or the risk of potentially steering people away from ADHD medications. Meta declined to comment on the record, as did TikTok, though a US spokesperson said that several of the brand accounts were taken down in accordance with their guidelines against health-related misinformation. YouTube spokesperson Boot Bullwinkle said in a statement that the same brand accounts on that platform were not in violation of guidelines.</p><p>A spokesperson from Takeda Pharmaceuticals, which manufactures Vyvanse and extended-release Adderall, told WIRED in a statement: “As with any medication, decisions regarding the management of individual patients and their treatment must be made by the treating health care provider.”</p><p>Many online testimonials mention an “<a href=\"https://www.instagram.com/p/DavoRa4zS1G/\" target=\"_blank\" rel=\"noopener\">afternoon crash</a>” from stimulants that leads to irritability and brain fog. “Gentle reminder that if Adderall has you crashing at 3:47 pm, snapping at your kids, and feeling guilty and ashamed for it, scientists at Yale created Stasis,” reads an <a href=\"https://www.instagram.com/p/DWFZW5TgB8U/\" target=\"_blank\" rel=\"noopener\">Instagram post</a> from that company, which offers pill subscription bundles for as much as $79 per month. Stasis markets its supplements as a helpful complement to stimulants prescribed for ADHD rather than a replacement, but it consistently portrays those drugs as insufficient.</p><p>This messaging is cause for concern, according to ADHD specialists who spoke with WIRED.</p><p>“Stimulant medications have been in existence for nearly 100 years, and approved for use in children since the 1960s,” says Kristen Leinung, a mental health nurse practitioner and director of psychiatric services at the Northwest ADHD Treatment Center in Portland, Oregon. The drugs are well-studied for efficacy and have predictable side effects, she adds, but because they can be misused, they’re often stigmatized online. “This style of advertising does further that stigma.”</p><p>Leinung believes that with their pessimistic framing of Adderall and similar pharmaceuticals, these supplement ads could lead people to go off their medication, which can be dangerous. “We know untreated or under-treated ADHD carries a high mortality and morbidity risk,” Leinung says, <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7617439/\" target=\"_blank\" rel=\"noopener\">decreasing life expectancy</a> and doubling the risk of <a href=\"https://www.upstate.edu/whatsup/2015/0615-premature-death-rates-about-double-for-people-with-adhd-study-says.php\" target=\"_blank\" rel=\"noopener\">premature death</a>; it’s associated with factors that range from less exercise and worse sleep to riskier driving and a higher likelihood of smoking.</p><p>US pharmacies have seen shortages of the stimulants Adderall, Vyvanse, Ritalin, and Concerta since 2022. Though the Drug Enforcement Administration increased production quotas last fall, various production bottlenecks have continued to create supply problems, according to the nonprofit <a href=\"https://www.understood.org/en/articles/dea-increases-adhd-stimulant-limits-effect-on-shortage\" target=\"_blank\" rel=\"noopener\">Understood</a>, which supports Americans with learning and thinking differences including dyslexia and ADHD.</p><p>The difficulty of accessing these medications may factor into someone’s decision to try unproven alternative treatments instead, says Cindy Goldrich, a mental health counselor, educator, and ADHD coach in Boulder, Colorado. That’s what makes the supplement ads feel “exploitative” to her.</p><p>“When someone can't get their prescription filled and doesn't know when they will, a product promising to fill that gap—or claiming you didn't need the ‘harsh’ medication anyway—becomes very appealing, very fast,” she says. “It's not just selling to people who are curious about alternatives. It's selling to people in crisis, who are scared and out of options through a system failure that has nothing to do with whether their medication works.”</p><p>Andrew Kahn, a psychologist and associate director of expertise and behavioral health at Understood, says these supplements also lack robust regulation while suggesting, without evidence, “benefits equal to or similar to medication.” But unlike prescription and over-the-counter drugs, he explains, “supplements don't have to prove they're safe or effective to the FDA before they're sold.”</p><p>That very fact can become a selling point. “People are wary of big pharma, wary of side effects, and a ‘natural’ option feels safer even when it isn't better tested,” Goldrich says. Some of the more common ingredients in the supplements, like omega-3s, L-theanine with caffeine, and certain adaptogens “have modest supporting research as general cognitive or mood support, and there's nothing wrong with someone using them alongside medication if their doctor is aware.\" But an underlying problem, she adds, is that whether a person takes medication or supplements or both, they still need to learn skills like planning and emotional regulation.</p><p>In the MAHA era, of course, medically suspect claims often circulate unchallenged. Kennedy, who swears by dubious supplements like the synthetic dye <a href=\"https://gizmodo.com/6-supplements-rfk-jr-loves-but-science-says-are-mostly-useless-2000672074\" target=\"_blank\" rel=\"noopener\">methylene blue</a>, has in many ways normalized these fringe products as the top authority of the vast US health care apparatus. In a statement to WIRED, HHS press secretary Emily G. Hilliard reiterated the department’s position that the nation is facing a challenge of “overmedicalization in behavioral health care,” with patients and parents not always informed about the potential hazards of psychiatric drugs. “Under Secretary Kennedy's leadership, HHS is embedding informed consent, transparency, and evidence-based alternatives into federal policy and practice,” Hilliard said.</p><p>Leinung, however, feels people should think twice before making that decision based on a video they saw on social media. “I do worry that encouraging people to stop or avoid starting prescribed medication to treat their ADHD can negatively impact their quality of life,” she says. “I would caution any person considering stopping their prescribed stimulants to have a thorough discussion with their health care provider.”</p>"},{"title":"UN agencies warn that conflicts and climate change threaten progress against global hunger","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/07/un-agencies-warn-that-conflicts-and-climate-change-threaten-progress-against-global-hunger/","category":"law","categoryLabel":"Law","wordCount":518,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/07/un-agencies-warn-that-conflicts-and-climate-change-threaten-progress-against-global-hunger/#\" target=\"_blank\" rel=\"noopener\">UN agencies warn that conflicts and climate change threaten progress against global hunger</a>\n</strong><p>Five UN specialized agencies <a href=\"https://www.ifad.org/en/w/news/un-report-global-hunger-levels-ease-for-third-consecutive-year-as-regional-disparities-persist\" target=\"_blank\" rel=\"noopener\">reported</a> on Tuesday that global hunger rates declined for the third consecutive year in 2025, but the distribution of these improvements remained uneven across regions, and also noted the persistence of significant impediments to progress due to energy shocks and armed conflicts.</p><p>The UN agencies released a <a href=\"https://www.ifad.org/en/w/publications/the-state-of-food-security-and-nutrition-in-the-world-2026\" target=\"_blank\" rel=\"noopener\">report</a> entitled “The State of Food Security and Nutrition in the World” (SOFI 2026), which found that the global progress in reducing hunger and malnutrition remains fragile and insufficient to achieve the <a href=\"https://sdgs.un.org/goals\" target=\"_blank\" rel=\"noopener\">Sustainable Developments Goals (SDG)</a> by 2030.</p><p>In their report, UN agencies noted a slow but steady decline in global hunger rates compared to previous years. However, recovery is uneven across world regions. While Asia and Latin America recorded a steady improvement, Africa still has the highest number of people facing hunger, with more than half of its population facing moderate or severe food insecurity. Additionally, food insecurity is more prevalent in rural regions than in urban ones.</p><p>Furthermore, the report highlighted that projections indicated that hunger rates are likely to increase over the next five years due to multiple factors, including the conflict in the Middle East, which has significant impacts on food inflation by driving up energy and fertilizer prices. These findings align with those of the World Food Programme (WFP), which <a href=\"https://www.jurist.org/news/2026/03/world-food-programme-warns-of-mass-food-insecurity-if-middle-east-conflict-continues/\" target=\"_blank\" rel=\"noopener\">indicated </a> that escalating hostilities in the Middle East could lead to record levels of food insecurity and the largest disruption in the global economy since the COVID-19 pandemic. In addition, extreme weather events, such as <a href=\"https://www.fao.org/newsroom/detail/el-nino-is-coming-here-is-where-the-risks-to-agriculture-are-highest/en\" target=\"_blank\" rel=\"noopener\">El Niño </a>effects, are expected to worsen drought, flood, and heat, which severely affects agricultural conditions and food prices.</p><p>SOFI 2026 also underscored that the cost of a healthy diet, which is the average minimum expenditure required to afford locally available foods that meet energy and nutrient requirements, is another barrier that prevents the elimination of food insecurity. The report revealed that while the global cost of a healthy diet recorded a global rise, the number of people able to afford a healthy diet declined in 2025 compared to previous years. Nevertheless, these results are also marked by regional disparities, with Africa having the lowest affordability rates compared to other continents.</p><p>In response, the UN agencies emphasized the need to reduce the cost of a healthy diet to all populations, despite the fact that this measure alone is insufficient to improve nutrition quality.  Numerous rights groups and international organizations have previously warned of alarming levels of <a href=\"https://www.jurist.org/news/2026/01/un-warns-surging-global-famine-and-displacement-threaten-economic-stability/\" target=\"_blank\" rel=\"noopener\">food insecurity</a> in the world, particularly in regions affected by armed conflicts and poverty such as <a href=\"https://www.jurist.org/news/2025/08/famine-confirmed-in-gaza-sparking-renewed-calls-for-ceasefire-and-humanitarian-access/\" target=\"_blank\" rel=\"noopener\">Gaza</a>, <a href=\"https://www.jurist.org/news/2026/07/rights-group-warns-of-increasing-food-insecurity-in-afghanistan/\" target=\"_blank\" rel=\"noopener\">Afghanistan</a>, and <a href=\"https://www.jurist.org/news/2025/10/millions-in-haiti-face-acute-hunger-as-armed-groups-tighten-control/\" target=\"_blank\" rel=\"noopener\">Haiti</a>. However, the African continent remains the most impacted by malnutrition. In January 2026, the UN <a href=\"https://www.jurist.org/news/2026/02/un-warns-millions-at-risk-of-starvation-due-to-worsening-somalia-food-crisis/\" target=\"_blank\" rel=\"noopener\">warned </a> that millions in Somalia faced hunger and acute food insecurity due to political instability, armed conflicts, and climate change.</p><p>Additionally, the WFP <a href=\"https://www.jurist.org/news/2026/01/un-world-food-programme-warns-millions-in-nigeria-face-extreme-hunger-without-urgent-funding/\" target=\"_blank\" rel=\"noopener\">stated </a> that over a million people in Nigeria faced food insecurity and lacked humanitarian assistance amid funding shortfalls. Another African country dealing with emergency-level hunger is <a href=\"https://www.jurist.org/news/2026/07/un-djibouti-faces-severe-food-insecurity/\" target=\"_blank\" rel=\"noopener\">Djibouti </a>due to many factors, such as high food prices.</p>"},{"title":"Jensen Huang's first-ever post on X is in defense of open access to AI models, alongside Google, OpenAI, and Meta","source":"PC Gamer","author":"James Bentley","url":"https://www.pcgamer.com/software/ai/jensen-huangs-first-ever-post-on-x-is-in-defense-of-open-access-to-ai-models-alongside-google-openai-and-meta/","category":"gaming","categoryLabel":"Gaming","wordCount":567,"readingTime":3,"content":"<p>Nvidia's CEO Jensen Huang joined X last month, and<a href=\"https://x.com/JensenHuang/status/2080643682408321103?s=20\" target=\"_blank\" rel=\"noopener\"> recently made his first-ever post</a>. As you could probably guess, it's about AI. He argues, alongside companies like Google, OpenAI, and Meta, that the US should not aim to restrict open models 'prematurely', as they're important for the growth of AI (among other things).</p><p>Taking a quick step back, Open models are ones that give access to weights or even code to see how it runs and to allow users to modify them. These can be run locally and are customisable. Closed models are those that tend to be run by specific companies, accessed via the cloud and APIs, and keep all their weights hidden.</p><p>Open models out of China, like DeepSeek, <a href=\"https://www.pcgamer.com/hardware/chatgpt-vs-deepseek-which-ai-can-build-me-a-better-gaming-pc/\" target=\"_blank\" rel=\"noopener\">became a problem for American AI firms</a> at the start of last year. They exploded onto the scene, offering similar services to the likes of OpenAI, but totally free and available locally. Just last week, the <a href=\"https://www.tomshardware.com/tech-industry/artificial-intelligence/trump-administration-reportedly-reviving-push-to-ban-chinese-ai-models-following-kimi-k3-launch-citing-cybersecurity-concerns-downloadable-open-weights-could-make-an-outright-u-s-ban-nearly-impossible-to-enforce-amid-growing-adoption\" target=\"_blank\" rel=\"noopener\">Trump administration was reportedly looking to ban Chinese AI models</a> due to cybersecurity concerns.</p><p>The battle between closed and open models is also partially a digital proxy war between American and non-American AI. Open models give access to anyone, and the US is hoping for AI dominance. Sharing how it builds its world-leading models could pose a risk to American hegemony, even if AI makers posit that open models are a benefit to everyone.</p><p>Microsoft's open letter claims that open weights strengthen competition and \"expand access to the AI economy\". Effectively, the wider adoption of AI is good for the companies betting on it, and the likes of AMD, Cloudflare, Google, GitHub, IBM, Hugging Face, LM Studio, Meta, OpenAI, and of course Nvidia have signed the appeal.</p><p>The letter claims to want to avoid \"premature restrictions on open models that stifle competition or drive innovation overseas\".</p><p>Huang says \"AI will transform every industry, power every company, and be built by every country. Open models strengthen safety and cybersecurity, accelerate innovation and diffusion, and enable sovereignty. The world needs both frontier closed models and frontier open models.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>The letter does acknowledge problems with open models, though. It says \"open weights carry real and distinct risks. Once released, the weights are beyond the original developer’s control, and modified versions are difficult to trace or reverse. But the right response to this risk is not to prohibit open weights.\"</p><p>Not only is wider adoption good for these companies, but they argue the insights gained from open models can be used to counter the negative effects or risks of leaving them widely accessible to all. And, ultimately, it's in the interest of the companies causing the memory crisis to justify AI of all kinds. The increasing prices of hardware, use of water, and general strain on resources have got to be worth all the effort, right?</p>\n\n<p>James is a more recent PC gaming convert, often admiring graphics cards, cases, and motherboards from afar. It was not until 2019, after just finishing a degree in law and media, that they decided to throw out the last few years of education, build their PC, and start writing about gaming instead. In that time, he has covered the latest doodads, contraptions, and gismos, and loved every second of it. Hey, it’s better than writing case briefs.</p>"},{"title":"Which Way Should the Democratic Party Go Now?","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/03/which-way-should-the-democratic-party-go-now","category":"fun","categoryLabel":"Interesting Reads","wordCount":1066,"readingTime":6,"content":"<p>At seven-fifteen in the morning on Monday, July 13th, when Democrats in Maine were in the midst of a hastily created process to find a replacement for <a href=\"https://www.newyorker.com/news/the-lede/the-changing-face-of-authenticity-in-politics\" target=\"_blank\" rel=\"noopener\">Graham Platner</a>, who had just withdrawn as their nominee for the U.S. Senate race, a security camera in the city of Biddeford captured a white Kia circling slowly through an intersection. The driver, a twenty-five-year-old immigrant from Colombia named Joan Sebastián Durán Guerrero, had been shot and killed by an <em>ICE</em> agent. This winter, after federal agents killed two people during an immigration crackdown in Minneapolis, Democrats were able to say that the mass protests they supported in response had forced <em>ICE</em> to retreat. Now, as the prospective candidates in Maine rushed to express their outrage at Guerrero’s death, it was obvious that the retreat had been temporary.</p><p>The fast-approaching 2026 midterm elections present the Democrats with both an opportunity and a crisis. The opportunity exists because President Donald Trump is unpopular, has failed to stop the rise in consumer prices that helped doom his predecessor, and seems unable to end the aimless <a href=\"https://www.newyorker.com/news/global-notes/the-spectacular-failure-and-ruinous-costs-of-the-iran-war\" target=\"_blank\" rel=\"noopener\">war in Iran</a> that he started. Americans now tell pollsters that they are more likely to vote for Democrats than for Republicans this fall. The crisis is that a narrow victory may not be sufficient to dislodge Trumpism, which is now deeply entrenched in government. And, though the Democratic leadership is looking to recapture the resistance spirit of 2018, its defining problem is a long-standing one in the Party of how to manage the movement that <a href=\"https://www.newyorker.com/magazine/2026/01/26/bernie-for-burlington-the-rise-of-the-peoples-politician-dan-chiasson-book-review\" target=\"_blank\" rel=\"noopener\">Senator Bernie Sanders</a> started a decade ago, whose populist appeal and generational momentum it needs in this anti-institutional moment but whose principles it does not fully share.</p><p>That tension has been most vividly on view in Maine, where the Republican senator Susan Collins is now seeking a sixth term in a state that <a href=\"https://www.newyorker.com/news/the-lede/who-can-lead-the-democrats\" target=\"_blank\" rel=\"noopener\">Kamala Harris</a> won by more than six points in 2024. Platner’s emergence there last year had the quality of myth. A couple of left-wing political operatives saw Platner, an oyster farmer, in a local video opposing the development of a corporate salmon farm in Frenchman Bay, and matched his name to records of donors to Sanders’s campaigns. Platner, they learned, was also a harbormaster and a veteran of two Marine combat tours in Iraq and an Army tour in Afghanistan. One of the operatives reportedly e-mailed colleagues that Platner was “one of the most talented politicians of our time. Maybe any time”; both Sanders and Senator <a href=\"https://www.newyorker.com/tag/elizabeth-warren\" target=\"_blank\" rel=\"noopener\">Elizabeth Warren</a> endorsed him. He did turn out to be a commanding barnstormer, a foul-mouthed and fluent denouncer of wealth and corruption, whose appeal drove the sitting governor of Maine, Janet Mills, out of the race. But his candidacy collapsed in a series of scandals, involving first a Nazi-associated tattoo and offensive posts, then allegations of bad behavior toward women, and, finally, untenably, an accusation of rape. Platner denied it, but he dropped out.</p><p>One theory heard often in politics is that the Democrats are repeating, in ideological inverse, the experience of the Republicans in 2010, when the Tea Party overtook the G.O.P., eventually clearing the way for Trump. (“Warning for Democrats’ Future Is Lurking in GOP’s Past,” a <em>USA Today</em> headline put it, with impressive concision.) Such takes refer to a parallel not just in the rise of populists like Platner but also in primary upsets of powerful incumbents by radical newcomers affiliated with the Democratic Socialists of America. The chair of the Congressional Hispanic Caucus, Representative Adriano Espaillat, of New York City, and Representative Diana DeGette, of Denver, a progressive stalwart, were defeated by young insurgents, Darializa Avila Chevalier and Melat Kiros, respectively, who came out of the Gaza protest movement and the D.S.A., and who took some positions far outside the mainstream. (During an interview with the online publication <em>The New York Editorial Board</em>, Chevalier declined to specify whether her support of prison abolition meant that a man who randomly killed another man should not be sent to prison.) A columnist for <em>The Atlantic</em> wrote, “The D.S.A. is a parasite.”</p><p>That reaction perhaps suggests that there have been more of these upsets than is the case. In races where an incumbent congressional Democrat has lost this year, anger over Gaza has played a role, and in each of them the issue has drawn both donations and attention. But across the country only five Democratic incumbents have lost primaries—two of them because of redistricting—which does not really add up to a revolution. An alternative theory to the Tea Party one is that the general sense of emergency in 2026 has led Democrats, and especially the rising young figures hoping to lead the Party, to embrace political pragmatism.</p><p>This summer, two politicians have caught the attention of the Party’s base, both of whom are under forty. On the left, Representative Alexandria Ocasio-Cortez, of New York, pointedly declined to endorse Platner—even before the rape accusation, she called the mounting claims against him “hard to stomach”—and has been favorably cited by David Axelrod, Barack Obama’s political guru, for echoing the former President’s themes of hope and change. From the center, Jon Ossoff, running for reëlection to the Senate in Georgia, spoke critically of the Gaza war early on, and has focussed a controlled campaign on the President’s corruption, a traditional populist theme. These approaches seem to be working: in an Emerson 2028 Presidential-primary poll, Ocasio-Cortez and Ossoff were tied for third place, just behind Pete Buttigieg and Gavin Newsom.</p><p>Such political talent is rare. In Maine, to replace Platner, the Democrats eventually settled on Troy Jackson, the most organized of the prospects. A former logger who finished third in this year’s gubernatorial primary, Jackson lacked Platner’s ability to excite the public, but he was preferred by supporters of Sanders, who had endorsed him for governor. (Collins called Jackson a “Bernie bro.”) And, having spent six years as the president of the state Senate, he was palatable to the Party establishment. Last week, Jackson tweeted that Collins had “helped destroy Roe v. Wade, she advanced Trump’s $990 billion Medicaid cuts, and she gave ICE $70 billion to continue its rogue terror campaigns.” Political pabulum, yes, but maybe also a preview of what the Democrats’ campaigns this fall will offer: not exactly transformation, not even resolution, just a dogged and prosaic insistence that things in the country are going very badly. ♦</p>"}];

  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
