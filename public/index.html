<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"Legacy of Atlantis isn't even out yet, but already this Tomb Raider remake feels like an old relic - in all the wrong ways","source":"Eurogamer","author":"Matt Wales","url":"https://www.eurogamer.net/tomb-raider-legacy-of-atlantis-gamescom-preview","category":"gaming","categoryLabel":"Gaming","wordCount":1257,"readingTime":7,"content":"<p>Archaeological digs.</p>\n    \n  \n  \n  \n\n            <p>Last year, on a bit of a whim, I ended up playing Tomb Raider 1's superb remaster <em>and</em> Crystal Dynamics' 2007 remake <a href=\"https://www.eurogamer.net/games/tomb-raider-anniversary\" target=\"_blank\" rel=\"noopener\">Tomb Raider: Anniversary</a>. Both, it turns out, are enormously enjoyable - and very different - ways to play Lara Croft's trailblazing original platform adventure, which celebrates its 30th anniversary this year. So I can understand why the minds behind Tomb Raider: Legacy of Atlantis might want to do something beyond a slick visual overhaul. But after my latest Gamescom look, I'm not exactly convinced this remake - now due to arrive early next year - is heading the right way.</p>\n<p>Unlike <a href=\"https://www.eurogamer.net/tomb-radier-legacy-of-atlantis-preview-feels-double-a\" target=\"_blank\" rel=\"noopener\">Chris' \"strangely double-A\" hands-on time with Legacy of Atlantis earlier this year</a>, its Gamescom showing was strictly hands-off; a \"first look\" at developer Flying Hog Games' reinterpretation of Greece - a location that comes roughly a quarter of the way into the original game. And for this latest showing, Crystal Dynamics, which is overseeing the project for Amazon, opted to show off an \"updated and reimagined\" version of the Damocles Room sword puzzle deep beneath St. Francis' Folly.</p>\n<p>Our presentation begins in what's perhaps one of Tomb Raider 1's most memorable areas: the intimidatingly vertical chamber directly below the church, where what remains of a vast central column, stretching up from the depths, provides a treacherous means of reaching different gates situated on different floors of the chamber's perimeter. In the original, it's a complex bit of level design, requiring both navigational prowess - most of the walkways and staircases between areas are long gone - and puzzle-y thinkery in order to acquire the keys required to proceed.</p>\n\n<p>And there's no doubt Legacy of Atlantis' take captures the original's spirit: you'll still navigate the imposingly vertiginous chamber, puzzling your way into four different rooms so you can puzzle your way back out with four different keys (technically gemstones in this version). And there's no doubt it looks a treat while it's doing it; shafts of light striking through the ancient darkness, as thick vegetation, rich with colourful bursts of flowers, run wild across stone. And it's a joy to hear new Lara Croft voice actor Alix Wilton Regan warmly quip her way around the place - immediately, welcomely resetting the tone back to the past, a million miles away from the wretched misery of Crystal Dynamics' divisive reboot trilogy.</p>\n\nImage credit: Flying Wild Hog/Crystal Dynamics/Amazon Game Studios\n\n<p>But as Crystal Dynamics experience director Jeff Adams, who's narrating this alpha gameplay playthrough, reminds us, Legacy of Atlantis goes beyond an audio-visual makeover. \"The team seeks to preserve what made these locations so special in the beginning\", he says, \"but we want to find new ways to surprise and delight\". The goal is to give newcomers a \"sense of awe and wonder\", while old-hands feel like they've had their first play experience \"reignited\". The level's bat enemies have, for instance, now been turned into thick undulating swarms with more unpredictable movement patterns. But there's the other, more controversial stuff Crystal Dynamics is shoving into Legacy of Atlantis, including the reboot era's RPG-like progression elements - skill trees, crafting, and other faff (not to mention <a href=\"https://www.eurogamer.net/tomb-raider-legacy-of-atlantis-ai-use-explained\" target=\"_blank\" rel=\"noopener\">its own dollop of gen-AI</a>).</p><p>In this new version, Lara can snaffle up environmental junk - I'm pretty sure I see her swipe a turnip at one point, despite not being a vegetable known to thrive in the ancient half-light - in order to craft the likes of boon-granting foods. Which leads to the comical sight of our demo player scrolling through a list of recipes - an enormous plate of stew, a massive pan of baked beans - which Lara promptly twiddles out of thin air. And after that, it's onto Legacy of Atlantis' other big new feature - a scanner - which players can use to analyse environments for \"greater insight\" into how to proceed.</p>\n\n<p>In the example we see, Lara scans an imposing gate situated near some sort of opening mechanism containing four visible slots. \"The gate is still shut,\" Lara usefully explains after the scan is done, \"and the opening mechanism has four distinct slots\". Exactly the kind of insight a skilled treasure hunter with years of tomb raiding experience might need! It's clearly a gambit intended to ease less experienced players into this world, but - as with a lot of Atlantis' new additions shown in the demo - there's something about the immersion-busting implementation that just feels inelegant and ill-considered.</p>\n<p>Incidentally, Adams notes the scanner is \"optional\", if you're the kind of person who'd prefer not to hint themselves out of an adventure. But then comes word of a secondary function: the ability for Lara to scan the world to learn of its history, as if the one thing a woman of her knowledge and experience has always needed is some kind of portable ChatGPT.</p><p>Perhaps I'm just getting unnecessarily hung up on this stuff, though. And some of Legacy of Atlantis' additions look neat! A nicely-animated leopard fight on the way to finding the Key of Damocles shows some enhanced enemy behaviour - in this case, the cat can hide and perform a sneak attack - suggesting there'll be a little more meat to combat beyond frantic twirl-and-shoot. Lara's grappling hook, meanwhile, has some new utility that lets her grasp onto distant levers, ascend and descend from certain grapple spots, or latch onto masonry and whizz over gaps. There are artefacts to collect that unlock outfits (the Tomb Raider community <em>loves</em> an unlockable outfit), and the demo ends with a particularly striking view.</p>\n\nImage credit: Flying Wild Hog/Crystal Dynamics/Amazon Game Studios\n\n<p>As Lara emerges out of a gloomy tunnel, we're suddenly met with an impressively sprawling vista: an ancient city built into the walls of a huge underground cavern, its elaborately arranged buildings peering above a canopy of thick, green foliage amid towering waterfalls. \"We have preserved that beauty of classic Greek culture, but we've now fused it into this vast subterranean wilderness that you're gonna get a chance to explore\", Adams notes, so there's perhaps more room for deviation here than we were previously aware.</p><p>As for the reimagined Sword of Damocles puzzle, if you were wondering, the big twist is that once you've run under the giant swords to bring them crashing down, you can climb onto them in order to navigate the room. And if you don't want to risk your neck, they can also be dislodged by shooting them - as long as you've extended their range by unlocking the Dead-eye skill from the skill tree, of course. And at one point early in the sequence, as Lara collects the key from the chamber's inevitably booby trapped plinth, she needs to dodge the falling swords by doing, yes, three back-to-back QTEs.</p>\n\n<p>I love Tomb Raider (not so much the dour reboot trilogy, admittedly), and I'd love nothing more than to see Amazon's long-awaited series revival restore the elaborate exploratory rhythms and vivacious energy of the series in its heyday. But if Legacy of Atlantis is any indication of Crystal Dynamics' future plans for the series, I'm going to need more convincing. The familiar Tomb Raider action looks enjoyable enough, but - and I hope I'm wrong - all that other stuff shoehorned around it is already giving the impression of a remake that feels tired and outmoded before it's even got here. The superfluous crafting, the scanning, the progression, the QTEs; it all seems so graceless - exactly the opposite of what Lara Croft should be.</p>"},{"title":"Helen, Help Me: Juice That’s Worth the Squeeze","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-food-scene/helen-help-me-juice-thats-worth-the-squeeze","category":"fun","categoryLabel":"Interesting Reads","wordCount":652,"readingTime":4,"content":"<p><strong>My partner and I moved in together recently, and she was horrified to learn that I cook with bottled citrus juice—you know, the little plastic lemons and limes that are on the grocery shelf near the drink mixers. They’re easy and convenient, and I don’t see what all the fuss is about, when it’s all going to get mixed in with other flavors anyway. I’ve been cooking and making cocktails for her for years, and I’m pretty sure she never even noticed until we started sharing a fridge. Am I missing out on something huge? Is my partner just a snob?</strong><em>—K.P., Manhattan</em></p><p>The law of the home kitchen is thus: if it works for you, it works for you. Are you happy with your process, happy with your outcomes? Terrific—carry on with your chubby little juice grenades and tell your partner that love means never criticizing someone’s convenience foods. But, I wonder, are you at all interested in the possibility of being happier? Your partner may indeed be a snob, but she’s also got a point: your citrus squeezies have been heat-treated and acid-adjusted within an inch of their lives, in the name of shelf stability, and what’s left bears only the faintest, saddest relation to the bright, floral zing of its freshly squeezed counterpart. What you’re using is, to put a point on it, <em>cooked</em>, not fresh, juice.</p><p>This isn’t to say that shelf-stable citrus juice is entirely without value: since it’s cooked already, it is—true to your pre-cohabitation experiences!—largely indistinguishable from fresh when cooked into certain dishes, like complex curries or long-braised meats, in which time and spices help enliven its flat, sour flavor. But, in those cases, you could get pretty much the same effect from swapping in a bit of vinegar. A friend of mine swears by ReaLemon-brand lemon juice for his homemade aioli, but once, in a pinch, he made a version with no-name white vinegar instead, and I swear I couldn’t taste a difference under all that garlic. (The general antipathy to bottled citrus falls into the same category as serious cooks’ dislike of jarred, minced garlic—sometimes known as “jarlic”—which undergoes life-lengthening chemical processes similar to those that your preferred juices do, rendering it both cooked and pickled, so it delivers only the faintest whisper of allium bite.)</p><p>As for using bottled citrus juice raw—in cocktails, in salad dressings, or sprinkled on top of some nice grilled fish or roasted veggies—well, I can’t say I endorse it. I don’t think of myself as an ingredients snob; indeed, I’ve been known to top a shepherd’s pie with instant mashed potatoes a time or two. But maybe you’ve helped me find my limit. If you’re using the bottled stuff right out there in the open, without the camouflaging benefits of heat, then it’s a wonder that your partner didn’t notice sooner. The one decent substitute in that regard might be cold-pressed juices—the big, refrigerated bottles of, for instance, Persian-lime juice and Eureka-lemon juice from the bartender-founded mixer brand <a href=\"https://www.twistedalchemy.com/collections/home-mixology\" target=\"_blank\" rel=\"noopener\">Twisted Alchemy</a>. These retain a striking amount of verve and complexity, and taste fresh enough to use raw. But, other than that, just buy some lemons and limes, my friend! Keep them in the crisper drawer! Zest them! Spritz them! Love them! You’ll probably want a nice juice squeezer, too—I love <a href=\"https://www.williams-sonoma.com/products/dreamfarm-fluicer/\" target=\"_blank\" rel=\"noopener\">the Fluicer</a>, a funky little contraption that gets every last bit of liquid out of a halved lime or lemon (the lemon-size one works for both) and takes up nearly no space at all in your kitchen junk drawer. Ask your partner to buy it, as a gift to you both.</p><p><strong>What’s the secret to an actually good birthday dinner at a restaurant?</strong><em>—A.B., Brooklyn</em></p><p>A round table, slightly overcrowded. Family-style ordering. No presents. Lots of cocktails. Fill dead air with silly toasts. One check, paid discreetly. Call about the cake ahead of time. ♦</p>"},{"title":"Death of Baloch student raises concerns amid enforced disappearances and extrajudicial killings, UN experts say","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/death-of-baloch-student-raises-concerns-amid-enforced-disappearances-and-extrajudicial-killings-un-experts-say/","category":"law","categoryLabel":"Law","wordCount":545,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/death-of-baloch-student-raises-concerns-amid-enforced-disappearances-and-extrajudicial-killings-un-experts-say/#\" target=\"_blank\" rel=\"noopener\">Death of Baloch student raises concerns amid enforced disappearances and extrajudicial killings, UN experts say</a>\n</strong><p>UN experts on Friday <a href=\"https://www.ohchr.org/en/press-releases/2026/09/pakistan-un-experts-denounce-student-killing-amid-ongoing-enforced\" target=\"_blank\" rel=\"noopener\">raised alarm</a> over the alleged enforced disappearance, torture and extrajudicial killing of Imran Ali, a student from Balochistan province, calling it part of a state-sponsored pattern of targeting ethnic Baloch people and urging Pakistan to conduct an urgent investigation.</p><p>In commenting on the importance of <a href=\"https://edm.parliament.uk/early-day-motion/64831/escalating-human-rights-violations-in-balochistan\" target=\"_blank\" rel=\"noopener\">transparency and accountability</a> in shedding light on the circumstances surrounding Imran Ali’s death, the experts stated:</p><p>The enforced disappearance of Imran Ali and his death in custody must be subject to a prompt, thorough, independent, and impartial investigation. Such an investigation must include independent forensic examinations, proper identification of the body, and its dignified return to the family. It should establish the cause, manner, and circumstances of Ali’s death, while identifying those responsible, with a view to ensuring accountability.</p><p>In late August 2025, Ali was kidnapped from his residence by around 20 agents from the Counter-Terrorism Department before being subsequently taken to a secret location. His fate and precise location <a href=\"https://www.jurist.org/news/2023/12/pakistan-dispatch-violent-crackdown-on-peaceful-baloch-protesters-in-islamabad-highlights-ongoing-injustices-in-balochistan-region/\" target=\"_blank\" rel=\"noopener\">remained a mystery</a> for a year, leading to a period of agonizing uncertainty for his family. However, former detainees who were in captivity with him confirmed that he  often endured periods of torture by personnel from the Counter-Terrorism Department, a measure that directly contravenes <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-against-torture-and-other-cruel-inhuman-or-degrading\" target=\"_blank\" rel=\"noopener\">Article 2</a> of the Convention against Torture and Other Cruel, Inhuman or Degrading Treatment or Punishment and <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">Article 7</a> of the International Covenant on Civil and Political Rights.</p><p>His fate only came to light approximately a year after he went missing, when a police officer testified before a hearing before Pakistan’s Commission of Inquiry on Enforced Disappearances saying that Ali had lost his life in May 2026, but due to delays by authorities in properly identifying his body and the alleged inability to preserve his remains, he was later buried. This testimony led his family to seek more concrete answers by visiting the Civil Hospital in Quetta, which functions as the <a href=\"https://www.icj.org/pakistan-icj-condemns-attack-on-lawyers-and-others-in-quetta/\" target=\"_blank\" rel=\"noopener\">primary public hospital</a> and morgue in the region where state authorities bring unidentified bodies in the aftermath of security operations.</p><p>Ali’s family identified his body from the provided photographs, and although it provided<a href=\"https://x.com/UN_SPExperts/status/2095833350275531141\" target=\"_blank\" rel=\"noopener\"> tangible evidence</a> of his fate, the UN experts said that a new set of questions opened up regarding the timeline of events leading up to his death, alongside the possibility of a <a href=\"https://www.amnesty.org.uk/get-involved/join-the-movement/join-a-group-or-network/country-coordinators/country-specialists-blog/forced-disappearances-pakistan-case-mahrang-baloch/\" target=\"_blank\" rel=\"noopener\">deliberate cover-up</a>. The experts also drew attention to the possibility of <a href=\"https://www.unodc.org/e4j/es/terrorism/module-8/key-issues/arbitrary-deprivation-of-life.html\" target=\"_blank\" rel=\"noopener\">foul play</a> in the deaths of six other people, whose bodies were brought to the hospital.</p><p>The <a href=\"https://www.state.gov/reports/2024-country-reports-on-human-rights-practices/pakistan\" target=\"_blank\" rel=\"noopener\">human rights landscape</a> in the region of Balochistan has deteriorated in recent years, with organizations such as Amnesty International denouncing the <a href=\"https://www.amnesty.org/en/latest/news/2010/10/pakistan-investigar-asesinato-tortura-baluchis/\" target=\"_blank\" rel=\"noopener\">hostility</a> shown towards Baloch leaders and political activists by the Pakistani army. The severe friction between the Baloch people and the Pakistani military stems from a deeply rooted <a href=\"https://hrcbalochistan.com/balochistan-the-state-of-human-rights-in-2025/\" target=\"_blank\" rel=\"noopener\">ethnic and economic conflict</a>.</p><p>The rise in insurgent groups such as the <a href=\"https://www.state.gov/releases/office-of-the-spokesperson/2025/08/terrorist-designation-of-the-majeed-brigade\" target=\"_blank\" rel=\"noopener\">Baloch Liberation Army (BLA)</a> has further <a href=\"https://www.ohchr.org/en/press-releases/2025/04/un-experts-urge-pakistan-address-human-rights-violations-balochistan\" target=\"_blank\" rel=\"noopener\">entrenched this conflict</a> since assertive <a href=\"https://www.hrw.org/news/2024/07/31/pakistan-respect-rights-response-balochistan-march\" target=\"_blank\" rel=\"noopener\">political activism</a> and nationalist movements are now subject to increased surveillance, with the military often designating them as potential recruiters for the BLA. Additionally, <a href=\"https://gjia.georgetown.edu/conflict-security/the-balochistan-quagmire-a-cycle-of-violence-political-mobilization-and-repression/\" target=\"_blank\" rel=\"noopener\">grievances by local leaders</a> who were dissatisfied with the central government’s control of Balochistan’s natural resources like copper and gold, have further intensified tensions.</p>"},{"title":"Terabytes of credentials leaked in massive supply-chain attack","source":"Ars Technica","author":"","url":"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/","category":"tech","categoryLabel":"Technology","wordCount":1037,"readingTime":6,"content":"<p><a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#main\" target=\"_blank\" rel=\"noopener\">\n  Skip to content\n</a></p>\n            \n  \n      \n        <p>\n    \n  \n  \n    TEAMPCP’S RAMPAGE CONTINUES\n  \n</p>\n      \n      <p>\n        The data was scraped and exfiltrated from 2,500 users of a compromised AI package.\n      </p>\n          \n    \n<p>Terabytes worth of credentials, many belonging to the world’s biggest and most sensitive organizations, have been exposed in a supply-chain attack on LiteLLM, an open source tool that streamlines AI-driven software development. Microsoft, Amazon, Cisco, Samsung, and Salesforce are only a handful of the entities whose access secrets were exposed.</p>\n<p>The revelation was posted on <a href=\"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines\" target=\"_blank\" rel=\"noopener\">Tuesday</a> and <a href=\"https://www.hudsonrock.com/blog/largest-ai-supply-chain-breach-of-2026-litellm-hack-impacts-thousands-of-global-enterprises-claim-your-ethical-disclosure\" target=\"_blank\" rel=\"noopener\">Wednesday</a> by security firms CloudSEK and Hudson Rock. CloudSEK said it found cloud keys, repository tokens, SSH keys, Kubernetes secrets, package publishing credentials, environment variables, and AI provider keys that could allow attackers to gain access to more than 2,500 organizations.</p>\n<h2>40 minutes is all it takes</h2>\n<p>The credentials were extracted during a 40-minute window in March while the victims used compromised versions of LiteLLM downloaded from the package’s official location in the Python Package Index repository. Hudson Rock said it made the discovery after analyzing a 195TB file that it obtained. Neither firm identified the source of the information.</p>\n<p>The LiteLLM compromise was the result of a <a href=\"https://arstechnica.com/security/2026/03/widely-used-trivy-scanner-compromised-in-ongoing-supply-chain-attack/\" target=\"_blank\" rel=\"noopener\">previous supply-chain attack</a> that infected the widely used vulnerability scanner Trivy. Other software infected in the campaign includes <a href=\"https://www.kics.io/\" target=\"_blank\" rel=\"noopener\">KICS</a> and the <a href=\"https://developers.telnyx.com/development/sdk/python\" target=\"_blank\" rel=\"noopener\">Telnyx Python SDK</a>. TeamPCP, a ramshackle but extremely capable gang largely made up of teenagers, took credit for the attack, and researchers have largely corroborated the claim.</p>\n<p>“I’ve confirmed the data is legit, by the way, multiple victim orgs,” independent security researcher Kevin Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117082985466021541\" target=\"_blank\" rel=\"noopener\">said</a>. “It contains a significant volume of sensitive content at orgs. It’s a massive supply chain breach due to poor AI security—not because AI is the threat, but teens can run circles around orgs obsessed with rushing out AI and poor DevOps security.”</p>\n                  \n    \n<p>The compromised versions of all four software packages contained code that accessed the memory of infected machines, scraped its contents, and exfiltrated it through an attacker-controlled channel. The data is filled with an assortment of information. Interspersed in the wall of data are credentials to software pipelines maintained by the tens of thousands of organizations that ran LiteLLM during the 40-minute span that the supply-chain attack remained active.</p>\n<p>In all, both security firms said some 434,000 CI/CD (continuous integration/continuous delivery) software pipelines had credentials exposed after running the compromised LiteLLM versions. In many cases, researchers at CloudSEK and Hudson Rock had trouble identifying the organizations the credentials belonged to. For instance, an email address in the dump from the domain @siriusxm.com ultimately didn’t indicate a breach at the satellite broadcaster, but rather one within the infrastructure of SiriusXM subsidiary AdsWizz.</p>\n\n<p>A full list of organizations is <a href=\"https://exposure.cloudsek.com/ai-supply-chain-incident\" target=\"_blank\" rel=\"noopener\">here</a>. The researchers had high confidence that these organizations had their credentials exposed:</p>\n<ul>\n<li>Nvidia Corporation</li>\n<li>Amazon Web Services (AWS)</li>\n<li>Samsung Electronics</li>\n<li>samsung.com</li>\n<li>Salesforce, Inc.</li>\n<li>Cisco Systems, Inc.</li>\n<li>F. Hoffmann-La Roche AG</li>\n<li>ServiceNow</li>\n<li>Siemens AG</li>\n<li>S&amp;P Global</li>\n<li>Airbus US Space &amp; Defense</li>\n<li>John Deere</li>\n<li>Regeneron Pharmaceuticals, Inc.</li>\n<li>London Stock Exchange Group (LSEG)</li>\n<li>Thomson Reuters</li>\n<li>FedEx</li>\n<li>Munich Remunichre.com</li>\n<li>MediaTek Inc.</li>\n<li>Volkswagen AG</li>\n<li>Deloitte</li>\n<li>The Kroger Co.</li>\n<li>Siemens Energy</li>\n<li>Thales Group</li>\n<li>X Corp (Twitter)</li>\n<li>Zscaler, Inc.</li>\n<li>Epic Games</li>\n<li>Orange S.A.</li>\n<li>HP Inc.</li>\n<li>Philips</li>\n<li>Fortum Oyj</li>\n<li>Vodafone Group Plc</li>\n<li>Carl Zeiss AG</li>\n<li>Deutsche Bahn AG</li>\n<li>NGINX, Inc.</li>\n<li>BT Group</li>\n<li>Liebherr</li>\n<li>Krungthai Bank Public Company Limited</li>\n<li>Roku, Inc.</li>\n</ul>\n<p>“Many CI/CD pipelines are configured generically,” Hudson Rock said. “The dumped variables contain active database passwords, third-party API keys, and cloud credentials without any identifiable company email, custom domain string, or internal server name. This means countless organizations currently have active secrets sitting in this database, completely unaware of their exposure.”</p>\n<h2>Welcome to the new world of supply-chain attacks</h2>\n<p>Both firms are urging all organizations that used the compromised versions of LiteLLM—particularly those listed in the high-confidence section of the list—to thoroughly rotate all credentials in their pipelines. Hudson Rock instructed any organization that uses any AI proxy infrastructure, third-party CI/CD vulnerability scanners, or downstream AI packages to immediately audit their environment for versions 1.82.7 and 1.82.8 of LiteLLM, the two compromised versions of the software.</p>\n                  \n    \n        \n<p>The firm advised all those affected to perform “aggressive credential revocation,” assume any secret accessible to the LiteLLM environment is compromised, invalidate and rotate all cloud keys, Kubernetes service account tokens, and GitLab/GitHub PATs, and audit logging and egress filtering.</p>\n<p>As a cautionary tale, CloudSEK said that Trivy developers rotated but failed to fully revoke an automation token over a 20-day window. The lapse gave the attackers a nearly three-week period to force-push malicious code to third-party builds that used the vulnerability scanner. As Beaumont observed, organizations’ rush to integrate AI into their software delivery systems has also greatly contributed to the scale of the damage.</p>\n<p>Update: There are already signs that some of the affected organizations aren’t taking the disclosure with the seriousness warranted. After this post went live, Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117084862543112580\" target=\"_blank\" rel=\"noopener\">reported</a>:</p>\n<blockquote><p>These creds date from about March. One of the orgs impacted told me they’d rotated them all and it’s a nothingburger, so I looked at their responsible disclosure policy, it allows trying creds, so I tried them all. Almost every one worked. Submitted report. One of the biggest US techcos.</p></blockquote>\n<p>Ultimately, the new revelations concerning the LiteLLM supply-chain attack underscore the growing threat of such campaigns and hence the importance of maintaining vigilance around the use of open source software that, when infected, can spread rapidly across the Internet.</p>\n<p>“The key takeaway is how supply chains have evolved to make a single upstream breach affect thousands of companies simultaneously,” Alon Gal, co-founder and chief technology officer of Hudson Rock, wrote in an email. “A window of roughly 40 minutes in which the LiteLLM dependency was hacked led to over 430,000 instances in which millions of secrets were harvested. This magnitude pushes us into a completely new world regarding the type of response required from the cybersecurity industry.”</p>\n<p><em>Post updated to add image.</em></p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/dan-goodin/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Dan Goodin is Senior Security Editor at Ars Technica, where he oversees coverage of malware, computer espionage, botnets, hardware hacking, encryption, and passwords. In his spare time, he enjoys gardening, cooking, and following the independent music scene. Dan is based in San Francisco. Follow him at <a href=\"https://infosec.exchange/@dangoodin\" target=\"_blank\" rel=\"noopener\">here</a> on Mastodon and <a href=\"https://bsky.app/profile/dangoodin.bsky.social\" target=\"_blank\" rel=\"noopener\">here</a> on Bluesky. Contact him on Signal at DanArs.82.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    91 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/gadgets/2026/09/lg-tv-shown-capable-of-tracking-user-activity-even-when-offline/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"}];
