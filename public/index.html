<style>

  --accent-light: #E8EDF4;

  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;

  --swap-bg-hover: #DDE2EA;
}

  :root {
    --bg: #191C22;
    --bg-card: #1F232B;

    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;

  --border: #2A2F3A;

  --swap-bg-hover: #2F3543;
}

  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Influencers and Resellers Are Turning Empty Boxes Into Big Cash","source":"Wired","author":"@wired","url":"https://www.wired.com/story/when-the-packaging-is-the-product-empty-boxes-influencers/","category":"tech","categoryLabel":"Technology","wordCount":721,"readingTime":4,"content":"<p>Doctor Who, One Piece, Pokémon, Star Wars. Empty product boxes from these popular properties have been <a href=\"https://www.ebay.com/sch/i.html?_nkw=empty+box&amp;_sacat=0&amp;_from=R40&amp;_sop=16&amp;_pgn=1\" target=\"_blank\" rel=\"noopener\">listed on eBay for $2,500</a> and up. It’s not too surprising to anyone familiar with modern nerd-dom that even the empty boxes for these perennial collectibles would command high prices.</p><p>But look what they’re joined by in that elite bracket: a Bottega Stardust Sparkling Rosé bottle and box (listed for $8,105), the box for a 1980s Rolex Explorer 1016 ($3,850), a “rare” Hermes Bolide box from Japan ($3,450), and a Suntory Hibiki bottle and box ($3,000).</p><p>One big reason for this is that buyers are paying big bucks to acquire the original packaging for an item they want to auction off; selling the collectable with an original box almost always boosts the resale price. For high-priced items—a secondhand Rolex Explorer 1016 <a href=\"https://www.chrono24.co.uk/rolex/vintage-explorer-ref-1016-stainless-steel-nos-box-papers-tritium-dial-bj-1985-full-set--id34150114.htm?searchHash=fc54a131_6utmX7&amp;pos=1\" target=\"_blank\" rel=\"noopener\">sells for</a> between $19,000 and $52,000—spending a couple grand on an original box is a worthwhile investment. It’s not just collectibles either; even for items like a <a href=\"https://www.wired.com/review/dyson-airwrap-co-anda2x/\" target=\"_blank\" rel=\"noopener\">Dyson Airwrap</a> or <a href=\"https://www.wired.com/review/nintendo-switch-2/\" target=\"_blank\" rel=\"noopener\">Nintendo Switch</a>, it can make sound financial sense for a seller to track down the original packaging.</p><p>There are currently over 160,000 “empty box” listings on eBay (many under $25), and over 140,000 on eBay UK. WIRED requested sales statistics on empty box sales from eBay, Vinted, and Poshmark; eBay declined to provide data, and Vinted and Poshmark did not respond.</p><p>There is also an illicit side to this business: Counterfeiters will acquire and use authentic boxes to ship fake products to buyers, hoping to bolster the illusion that the shipped item is real. Sometimes, sellers will ship an authentic box filled with <a href=\"http://www.tiktok.com/@code23191/video/7173108699815251246\" target=\"_blank\" rel=\"noopener\">nothing at all</a> in what’s known as an empty box <a href=\"https://www.instagram.com/reels/DFaX5cVtvl9/\" target=\"_blank\" rel=\"noopener\">scam</a>.</p><h2>Buying Clout</h2><p>A seller on Vinted with the username wildswhim, whose listings include jewelry packaging (Vivienne Westwood, Michael Kors) deliberately avoids including “actual empty tubes or containers” in sales to deter counterfeiters. The seller also frequently describes listings as being “for props, staging, or storage.”</p><p>Yes, props and staging: Often, these empty boxes are going to influencers and video producers who use them to decorate their film set. Independent creators and aspiring influencers will use empty boxes, bottles, and packaging to stage their Instagram posts and TikTok videos to give their clips a whiff of the luxury lifestyle.</p><p>There are currently over 1,500 listings on eBay specifically for the search term “empty box decor.” Listings include a “rare” empty <a href=\"https://www.ebay.com/itm/227134320758\" target=\"_blank\" rel=\"noopener\">Abercrombie &amp; Fitch “PR box</a>” listed for $50 and a “rare” empty <a href=\"https://www.ebay.com/itm/800190821558\" target=\"_blank\" rel=\"noopener\">Fenty Beauty</a> “multi-tier influencer PR launch box” selling for $245. Both of these were originally sent out to select influencers by the companies’ respective public relations teams, indicating that the OG influencers are reselling the items to the next generation of creators coming up behind them.</p><p>The Vinted seller tonym528, who is based in London, sold an empty orange Louis Vuitton box for £23 (around $32) this month. He doesn’t ask his buyers questions but suspects that people are using “those kinds of boxes to show off fake wealth.” Seller MattyHornby, based in York, UK, has resold empty packaging from Supreme, Gucci, Balenciaga, Prada, retailer Selfridges, and skateboard and streetwear label Palace for similar prices per bag or box.</p><p>Seller Rafal tells WIRED that the “absolutely crazy” prices are why he started selling empty packaging (Nike, Apple, Puma, Dior) on Vinted. Seller mariaharris1967 also jumped on the trend. “I couldn’t believe it,” she tells WIRED. “I was able to get rid of loads. LV, Burberry, and Hermès sell super quickly.” She is one of the sellers who labels empty boxes and bags with descriptions such as “great for room staging,” “good for social media staging,” “decor, staging, or room props” and “#instagram” to target aspiring creators.</p><h2>Signaling Success</h2><p>Branded packaging arranged to appear in the shot—but in the background, not as the central focus —in social posts is often used to imply an association with an aspirational brand, says Tama Leaver, a social media researcher at Curtin University in Perth, Australia. Influencers are doing it, he says, “clearly with a view to making those intended relationships into real ones.”</p><p>Platforms like Giggster and Home Studio List, which rent out prestaged sets to influencers, are very good customers too. The Vinted seller wildswhim says “the studios catering to influencers are bulk buyers now” for empty packaging listings.</p>"},{"title":"What Your Swimwear Says About You","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/what-your-swimwear-says-about-you","category":"fun","categoryLabel":"Interesting Reads","wordCount":513,"readingTime":3,"content":"<p><strong>Two-Piece</strong>You’re fine with sunburning your midriff.</p><p><strong>One-Piece with Flirty Cutouts</strong>You’re fine with sunburning a few awkward little squares on your lower back.</p><p><strong>No-Nonsense One-Piece Racerback</strong>You learned how to swim at a Y.M.C.A., and a boa-constrictor-compression solid-black Speedo is all you know.</p><p><strong>Yellow Polka-Dot Bikini</strong>You were deeply affected by a Yoplait Light commercial as a youth and consider this suit to be the physical manifestation of confidence. You long for the days when yogurt was the main thing being advertised in the weight-loss space.</p><p><strong>Lots of Strings</strong>You don’t own a cat.</p><p><strong>Lots of Strings, Some Frayed or Missing</strong>You do own a cat. Check under your couch for lost strings.</p><p><strong>Strapless</strong>You like to live dangerously.</p><p><strong>Jean Shorts and a Cute Top</strong>You just got pushed into the pool, and, DAMN IT—your phone was in your pocket!</p><p><strong>Zebra-Striped</strong>You heard that zebra stripes repel sharks, which is technically irrelevant because you only ever swim in an above-ground pool in a landlocked state.</p><p><strong>Victoria’s Secret Bombshell Cut</strong>You bought this in the seventh grade against your mom’s wishes, and, twenty-some years later, it actually somewhat fits—that’s called smart investing!</p><p><strong>A Tricorn Hat and a Jacket with Brass Buttons</strong>You are a pirate going down with your ship. Goodnight, sailor.</p><p><strong>Lily Pulitzer Sundress and Tory Burch Sandals</strong>You openly judge anyone who isn’t wearing the “right” kind of swimwear for their age and body type. You are a moral paragon (according to you). Everyone <em>loves</em> spending time with you at the pool (also according to you). Take a deep breath and get ready to yell, “NO ROUGHHOUSING IN THE POOL!”</p><p><strong>Board Shorts and a Puka-Shell Necklace</strong>You watched “Blue Crush” in 2002 and have been pretending to be a surfer ever since. You smell like an Abercrombie &amp; Fitch store in a mall.</p><p><strong>Full-Body Wetsuit</strong>You’re actually a surfer. And you want <em>everybody</em> to know it.</p><p><strong>Red “Baywatch” One-Piece</strong>You still haven’t gotten over failing the lifeguard test that one summer in high school, and blame all of your life’s shortcomings on that fateful day in the pool when you were just ten measly seconds shy of treading water long enough to make the squad. All of your friends became lifeguards, and they got the best suntans and the juiciest gossip, even though you know for a fact that you were better at C.P.R. than Casey. Sure, she could tread water seemingly forever, but her chest compressions were weak as hell. Making the best of a bad situation, you still went to the pool every day to hang out with your lifeguard friends, even though it was clear that you weren’t really “with them” anymore. And when they’d all go to the lifeguard lounge together during their fifteen-minute breaks, you were left sitting on your towel, alone, miserably munching on the soggy concession-stand nachos that you had to pay for with babysitting money.</p><p><strong>Lime-Green Thong Mankini</strong>You’re looking for a husband, someone with a sense of humor who does a good Borat impression.</p><p><strong>Nothing</strong>You’re in Europe, you lucky bastard. ♦</p>"},{"title":"This week in PC games: Gamescom and GTA 6 fight for our attention, but don't forget Folk Emerging, MGS4 and the horror game about balancing a cake","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/this-week-in-pc-games-gamescom-and-gta-6-fight-for-attention-but-dont-forget-folk-emerging-mgs4-and-the-horror-game-about-balancing-a-cake","category":"gaming","categoryLabel":"Gaming","wordCount":1120,"readingTime":6,"content":"<p>What we're feeding the Maw</p>\n    \n  \n  \n  \n  \n            <p>Hello all! I regret to report that the Maw is in a really good mood this week. Its scales have an almost flirtatious lustre, flashing in and out of visibility as I gaze from my eyrie above north London. Its crimson coral coils and fins of mounded verdigris can be seen reflected in the distant moneytemples of Canary Wharf. Its fractal teeth and hair form expressionist whorls and divots among the haggard late summer clouds.</p>\n<p>The Maw is merry because this week is Gamescom week - a time of much videogame news and thus, a time of feasting for extradimensional gods with a hankering for headlines. It also happens to be the week in which Rockstar and Netflix will stream a GTA 6 documentary (27th August), giving rise to many, many articles in the vein of \"50 individually rendered breakfast cereal shapes you missed from the all-new Vice City\". As if all that wasn't enough, there are a load of uncommonly chunky new PC releases to contend with. Here's my latest list.</p>\n<h2>Monday 24th August</h2>\n<ul>\n<li><a href=\"https://store.steampowered.com/app/3985330/BURNED_HORIZONS/\" target=\"_blank\" rel=\"noopener\">Burned Horizons</a> (early access) is a complex production, in several senses: a hard-eyed milsim and squad tactics game with 'no-XP' customisation, set during a fictional 2002 Europe-wide war against Russia. The devs characterise it as a fable about Putin's imperialism, writing that \"monsters like him don’t stop - until someone stops them.\" It's from a team based in Ukraine, the UK and the USA.</li>\n<li><a href=\"https://store.steampowered.com/app/4833450/Money_for_Girls_Amortized/\" target=\"_blank\" rel=\"noopener\">Money for Girls: Amortized</a> is a horror detective visual novel from lauded hypertext designer and former RPS columnist Porpentine.</li>\n</ul>\n<h2>Tuesday 25th August</h2>\n<ul>\n<li><a href=\"https://store.steampowered.com/app/3949550/1666_Amsterdam/\" target=\"_blank\" rel=\"noopener\">1666: Amsterdam</a> (early access) is the time-jumping, Dan Brownian witch 'em up from Assassin's Creed creative director Patrice Désilets. Once in development at now-dead THQ, the project has changed hands repeatedly in the course of an extended feud between Désilets and Ubisoft.</li>\n<li><a href=\"https://store.steampowered.com/app/3448650/Aliens_Fireteam_Elite_2/\" target=\"_blank\" rel=\"noopener\">Aliens: Fireteam Elite 2</a> looks like a pleasant bit of 1-4 player xenomorph grand guignol, to purge the synapses while you wait for the probably more-elegant Alien: Isolation 2.</li>\n<li><a href=\"https://store.steampowered.com/app/4568830/ASTRAL_COURT_DX/\" target=\"_blank\" rel=\"noopener\">Astral Court DX</a> is a bullet hell that's set in heaven but isn't an actual \"bullet heaven\", in the sense of Vampire Survivors. It casts you as a celestial convict doing platform challenges to stave off their execution. There are 189 levels, apparently. It looks like a Y2K shareware release (complimentary).</li>\n<li><a href=\"https://store.steampowered.com/app/2431080/Blood_Dungeon/\" target=\"_blank\" rel=\"noopener\">Blood Dungeon</a> is a frantic and suffocating platformer with bullet hell/heaven elements, from the creators of Nidhogg. Big fan of the apparent default character's scrambling arms and expression of constant panic.</li>\n<li><a href=\"https://store.steampowered.com/app/4054100/Sokogram/\" target=\"_blank\" rel=\"noopener\">Sokogram</a> is a hybrid puzzler that combines the block pushing of sokoban games with the paint-by-numbers of nonograms. This is somebody's very specific wet dream. Please don't tell me if it's yours – I have no need to be aware of such things.</li>\n<li><a href=\"https://store.steampowered.com/app/2358630/Western_Rye/\" target=\"_blank\" rel=\"noopener\">Western Rye</a> (early access) is kind of like Red Dead Redemption: Undead Nightmare but with more of a survival game element, including base construction. In other words, big ole cowboy sim plus carpentry and zombies.</li>\n</ul>\n<h2>Wednesday 26th August</h2>\n<ul>\n<li><a href=\"https://store.steampowered.com/app/2275300/Folk_Emerging/\" target=\"_blank\" rel=\"noopener\">Folk Emerging</a> is a nomadic and ambitious 4X that begins during the long stretches of prehistory before humans started to get really into building cities. I think it could be great.</li>\n<li>People who dig very looty 90s RPGs are probably going to like the looks of <a href=\"https://store.steampowered.com/app/4423580/Shadow_Dungeon/\" target=\"_blank\" rel=\"noopener\">Shadow Dungeon</a>, though I think it has a dollop of Vampire Survivors DNA as well.</li>\n<li><a href=\"https://store.steampowered.com/app/3211430/BRIGANDINE_ABYSS/\" target=\"_blank\" rel=\"noopener\">Brigandine Abyss</a> is about loudly dressed anime factions duking it out for control of a continent, with a turn- and hex-based combat system. Six of the factions star in a story component featuring the revival of an empire. It's from a few of the people who worked on well-regarded metroidvania Ender Lillies.</li>\n<li><a href=\"https://store.steampowered.com/app/4323130/Sniper_Camouflage_Orange_Spy_Warrior_I_Buried_Two_Bodies_in_the_Garden_and_the_Police_Havent_Figured_Out_Yet_That_Theyre_Missing_Because_They_Were_a_Lonely_Old_Couple_Who_Had_No_Relatives_Simulator_2026/\" target=\"_blank\" rel=\"noopener\">Sniper Camouflage Orange Spy Warrior I Buried Two Bodies in the Garden and the Police Haven't Figured Out Yet That They're Missing Because They Were a Lonely Old Couple Who Had No Relatives Simulator 2026</a> is a very long and unpleasant name for a game.</li>\n</ul>\n<h2>Thursday 27th August</h2>\n<ul>\n<li><a href=\"https://store.steampowered.com/app/4406280/the_cabin_game/\" target=\"_blank\" rel=\"noopener\">the cabin game</a> (early access) is a much shorter name for a game, necessitating some additional description: you are stuck in a haunted cabin with up to four of your friends, playing cards that add rooms to the cabin while also, generally, making the cabin worse.</li>\n<li><a href=\"https://store.steampowered.com/app/2100020/Lous_Lagoon/\" target=\"_blank\" rel=\"noopener\">Lou's Lagoon</a> is a jolly adventure platformer set on an archipelago, in which you can loaf about in a seaplane. Jak &amp; Daxter with a touch of the Brew Barons, maybe.</li>\n<li><a href=\"https://store.steampowered.com/app/2075800/STAR_WARS_Zero_Company/\" target=\"_blank\" rel=\"noopener\">Star Wars: Zero Company</a> is an Ahsoka-era squad tactics game from old XCOM talent. I recently <a href=\"https://www.rockpapershotgun.com/time-will-tell-bit-reactor-talk-queerness-in-star-wars-zero-company-and-whether-theyll-keep-working-with-saudi-owned-ea\" target=\"_blank\" rel=\"noopener\">interviewed the developers</a> about their publisher EA being suddenly acquired by a Saudi Arabia-led consortium.</li>\n<li><a href=\"https://store.steampowered.com/app/3859630/METAL_GEAR_SOLID_MASTER_COLLECTION_Vol2/\" target=\"_blank\" rel=\"noopener\">Metal Gear Solid: Master Collection Vol. 2</a> brings together MGS4 and Peace Walker in a new remaster package with a sprinkling of archive materials, including Metal Gear's first handheld outing, Metal Gear: Ghost Babel.</li>\n<li><a href=\"https://store.steampowered.com/app/2713000/Resonance_A_Plague_Tale_Legacy/\" target=\"_blank\" rel=\"noopener\">Resonance: A Plague Tale Legacy</a> takes the Asobo series' third-person action to an island caught between the Middle Ages and ancient Minoan times, where there are light-based puzzles and creatures who follow you with unknowable intent.</li>\n<li><a href=\"https://store.steampowered.com/app/2172910/CAPTAIN_TSUBASA_2_WORLD_FIGHTERS/\" target=\"_blank\" rel=\"noopener\">Captain Tsubasa</a> is back to save your silly footballs from the mediocrity of licensed realism.</li>\n</ul>\n<h2>Friday 28th August</h2>\n<ul>\n<li><a href=\"https://store.steampowered.com/app/3160640/Dont_Drop_The_Cake/\" target=\"_blank\" rel=\"noopener\">Don't Drop The Cake</a> (pictured) invites you to balance a tray while navigating a nightmare of conveyor belts and blokes with daisies for heads.</li>\n<li>Autobattling, attention-based automation, Lewis Carroll, and spooky mansion delving combine in <a href=\"https://store.steampowered.com/app/4529120/Alices_Gaze/\" target=\"_blank\" rel=\"noopener\">Alice's Gaze</a>. \"Experience the deepest chills in the laziest way\" is a pretty neat sales pitch.</li>\n<li>Stripped-down city tender <a href=\"https://store.steampowered.com/app/1530850/A_Little_Age/\" target=\"_blank\" rel=\"noopener\">A Little Age</a> is your laidback end to the week, probably.</li>\n</ul>\n<p>We're taking a different approach to Gamescom this year. The major thing is that we won't be liveblogging Opening Night Live, the annual Geoff Keighley scorched earth trailerdump, or trying to write up individual news articles on the night. Repeated experience has shown that trying to digest Keighley's bombardments as they happen a) doesn't deliver traffic returns that justify knackering ourselves, and b) risks a glut of relatively thoughtless pieces that make us look like the rapidly decomposing zombies we secretly are.</p><p>Instead, we'll be covering Gamescom at our own pace, trying to focus on the games and stories we think are most deserving. James, Julian and Mysterious Surprise Guest will be attending the event itself in Cologne, interviewing a lot of people and playing a lot of demos. Mark and I are team homefront, with Oisin covering alternate evening news shifts as usual. Meanwhile, guides writers Ollie, Jeremy, Callum and Dion continue to operate in an alternate editorial universe of Roblox games, <a href=\"https://www.rockpapershotgun.com/games/mortal-shell\" target=\"_blank\" rel=\"noopener\">Mortal Shell</a> 2, and nu-Onimusha. What are you up to this week? You are allowed to say: not playing or thinking about videogames at all. I hear that can be healthy in moderation.</p>"},{"title":"Reconciling Hayek and Mill's Divergent Defenses of Liberty","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/08/23/reconciling-hayek-and-mills-divergent-defenses-of-liberty/","category":"law","categoryLabel":"Law","wordCount":1150,"readingTime":6,"content":"<p>Nobel Prize-winning economist F.A. Hayek and the great political philosopher John Stuart Mill both reached generally libertarian conclusions. But, as prominent Harvard law Porf. and political theorist Cass Sunstein points out in <a href=\"https://casssunstein.substack.com/p/mill-hayek-and-liberalism\" target=\"_blank\" rel=\"noopener\">an excellent recent post</a>, they did so for quite different reasons:</p> <blockquote><p>Mill was a romantic about choosers (about you and me, and what we know, and what we are capable of), while Hayek was not a romantic about choosers at all (not close). He was a romantic, or something like that, about undesigned orders and traditions, and a skeptic about planners.</p> <p>Mill put a bright spotlight on individuals, their knowledge, their potential, and their agency. Hayek put a bright spotlight on markets and traditions, and on government planners and what they cannot know.</p></blockquote> <p>In sum, Mill emphasized the merits of individual freedom of choice, which he famously argued would enable each person to exercise control over his or her affairs, and result in valuable \"experiments in living.\" By contrast, Hayek emphasized the defects of government planners, and their lack of knowledge.</p> <p>As Sunstein notes, these two ideas are not inherently opposed. They can even be mutually reinforcing, in so far as they provide alternative justifications for the same conclusion. But there is a tension, in so far as Hayek also emphasized the value of \"spontaneous order\" and the traditions it generates, which he viewed as better guides to decision-making than the unaided reason of individuals. This contrasts with Mill's emphasis on individual autonomy and reasoning skills.</p> <p>Moreover, if tradition is so valuable, as Hayek suggests, why not use government power to enforce it against people who go against it? And if individual reason and experimentation are so beneficial, as Mill argued, why not trust voters' judgements at the ballot box, and let them use those decisions to constrain individual choice?</p> <p>I cannot resolve all tensions between these two perspectives. But the gap can be greatly reduced by recognizing that individuals make better decisions in some circumstances than in others. In particular, they do better when the \"vote with their feet\" than when the vote at the ballot box. And that divergence bolsters both Mill's confidence in individual autonomy, and Hayek's condemnation of planning and support for spontaneous order.</p> <p>As I have explained <a href=\"https://reason.com/volokh/2020/06/23/three-types-of-foot-voting/\" target=\"_blank\" rel=\"noopener\">previously</a> (and more fully in my book book <a href=\"https://www.amazon.com/dp/0190054581/ref=nosim?tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\"><em>Free to Move: Foot Voting, Migration, and Political Freedom</em>)</a>, people can vote with their feet by making choices in the private sector, by deciding with jurisdiction to live in within a federal system, and through international migration. What unites these three types of choices is that, <a href=\"https://reason.com/volokh/2020/06/21/how-foot-voting-promotes-political-freedom-better-than-ballot-box-voting/\" target=\"_blank\" rel=\"noopener\">in each case, the individual makes a decision that is highly likely to have a decisive impact</a>. By contrast, when you vote at the ballot box, the odds that your vote will have a decisive effect on the outcome are infinitesimally small: usually one chance in a million or even less (perhaps 1 in 60 million in a US presidential election, though the exact figure varies by state).</p> <p>As a result, foot voters have strong incentives to seek out relevant information and evaluate it objectively. As discussed in my book and elsewhere, historical and experimental evidence shows they often make good decisions even under bad conditions, as in the cases of people fleeing totalitarian regimes that censor information from the outside world, and poorly educated Blacks fleeing slavery and segregation. By contrast, a combination of <a href=\"https://balkin.blogspot.com/2013/10/why-political-ignorance-is-serious.html\" target=\"_blank\" rel=\"noopener\">\"rational ignorance\" (lack of incentive to seek out political information) and \"rational irrationality\"</a> (lack of incentive to engage in unbiased evaluation). In combination, these ensure they are often ignorant of very basic political information (such as what the three branches of government are or which officials are responsible for which issues) and often act as biased \"political fans\" in evaluating the information they do learn.</p> <p>Once we recognize that individuals generally make much better decisions as foot voters than as ballot box voters, Hayek and Mill's perspectives are much easier to reconcile.</p> <p>In the case of Hayek, this distinction can explain why he had respect for traditions developed through \"spontaneous order,\" but was also highly critical of conservatives' support for the enforcement of tradition through state power, as in his famous essay \"<a href=\"https://www.cato.org/sites/cato.org/files/articles/hayek-why-i-am-not-conservative.pdf\" target=\"_blank\" rel=\"noopener\">Why I am Not a Conservative</a>.\" The answer is that traditions generated by individuals' foot voting choices are likely to have greater epistemic value than those imposed by force, whether by democratic governments or authoritarian ones.</p> <p>Hayek was not actually an across-the-board fan of tradition. He was more than willing to reject traditions imposed and perpetuated by government coercion. For example, he <a href=\"https://www.cato.org/commentary/libertarians-have-long-led-way-marriage\" target=\"_blank\" rel=\"noopener\">rejected anti-sodomy laws</a> and other restrictions on consensual sexual activity, even though they were longstanding traditions. The distinction between foot voting and ballot box voting decisions can help justify this stance.</p> <p>The same goes for Mill's emphasis on individual autonomy. Foot voters are likely to make better choices than ballot box voters, and thus also create better \"experiments in living.\" Mill, in fact, worried greatly about the problem of voter ignorance. In <a href=\"https://www.gutenberg.org/files/5669/5669-h/5669-h.htm\" target=\"_blank\" rel=\"noopener\"><em>Considerations on Representative Government</em></a>, he <a href=\"https://volokh.com/posts/1202019183.shtml\" target=\"_blank\" rel=\"noopener\">emphasized that voters have a duty to become well-informed</a>, and advocated giving extra votes to more educated voters in order to improve the quality of decision-making.</p> <p>But he failed to consider that even relatively more educated voters are still susceptible to rational ignorance (though they do, on average, know more than the less-educated) and still likely to act as <a href=\"http://www.volokh.com/posts/1222317278.shtml\" target=\"_blank\" rel=\"noopener\">biased \"political fans.\"</a>  Any given set of people are likely to make better decisions when voting with their feet than at the ballot box. The superior incentives of foot voters justify granting them greater scope and autonomy, while tightly limiting the power of government to override their choices.</p> <p>As I argue in <em>Free to Move</em> and other writings, these circumstances also justify decentralizing government power so as to give people more opportunities to vote with their feet in federal systems. This last is a point consonant with Hayek's advocacy of decentralized federalism in some of his early writings, including <a href=\"https://fee.org/ebooks/the-economic-conditions-of-interstate-federalism/\" target=\"_blank\" rel=\"noopener\">a 1939 article</a> where he emphasized the importance of \"do[ing] away with the impediments as to the movement of men, goods, and capital between the states.\"</p> <p>In sum, incorporating the problem of voter ignorance and the informational advantages of foot voting bolster both Hayek's argument for liberty and Mill's. Liberty enables people to make better-informed decisions in the private sector, thus reinforcing Mill's emphasis on autonomy. Voter ignorance further reduces the quality of government planning, thereby bolstering Hayek's argument against the latter, while helping to explain why he supported some traditions, but not others.</p> <p>The points covered here don't do away with all differences between Mill and Hayek. And, by themselves, they don't make a comprehensive case for a libertarian/classical liberal political system. But they do show how the superior decision-making of foot voters relative to ballot box voters bolster both Hayek and Mill's arguments, and make them mutually reinforcing.</p>"}];
