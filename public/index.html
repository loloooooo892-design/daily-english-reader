*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;

  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {

  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;

  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {

}

  font-size: 0.8125rem;

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);

  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;

  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {

  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {

}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {

  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;

  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {

.archive-link {

@media (max-width: 480px) {

<script>
var articles = [{"title":"Universal Health Coverage Could Save $1 Trillion and 114,000 Lives Every Year, Yale Study Projects","source":"Hacker News Best","author":"Matt Kristoffersen","url":"https://ysph.yale.edu/news-article/universal-health-coverage-could-save-one-trillion-dollars-and-114000-lives-every-year/","category":"tech","categoryLabel":"Technology","wordCount":673,"readingTime":4,"content":"<p>By Matt Kristoffersen</p><p>August 13, 2026</p><p>A single-payer universal health care system could cover every American, save more than 100,000 lives a year, and still cost $1 trillion less than the system it would replace, according to a new preprint study led by researchers at the Yale School of Public Health.</p><p>For <a href=\"https://doi.org/10.64898/2026.07.22.26358689\" target=\"_blank\" rel=\"noopener\">the study</a>, which has not yet been peer reviewed, the researchers modeled what would happen if the United States adopted a national public insurance program like the one proposed in the <a href=\"https://www.congress.gov/bill/119th-congress/senate-bill/1506\" target=\"_blank\" rel=\"noopener\">Medicare for All Act</a>. Using 2024 spending, insurance coverage, and mortality data, they estimate that the universal coverage would reduce annual health expenditures by $1.04 trillion, or nearly 20% — even after accounting for the additional care that uninsured and underinsured people would receive.</p><blockquote><p>Healthcare  costs have been rising faster than inflation, and a staggering share of that  spending is consumed by administrative middlemen, soaring drug prices, and  emergency care for conditions that should have been treated earlier and for  less.</p><a href=\"https://ysph.yale.edu/profile/alison-galvani/\" target=\"_blank\" rel=\"noopener\"><p>Alison Galvani, PhD</p><p>Burnett and Stender Families Professor of Epidemiology (Microbial Diseases) and Director, Center for Infectious Disease Modeling and Analysis</p></a></blockquote><p>“Healthcare costs have been rising faster than inflation, and a staggering share of that spending is consumed by administrative middlemen, soaring drug prices, and emergency care for conditions that should have been treated earlier and for less,” said senior author Alison Galvani, the Burnett and Stender Families Professor of Epidemiology at YSPH and the director of the Yale Center for Infectious Disease Modeling and Analysis. “Medicare for All strips out those sources of waste while providing everyone with healthcare, saving over a trillion dollars and 114,000 lives every year.”</p><p>The model identified five major sources of savings: lower pharmaceutical prices, Medicare-level payments to providers, reduced administrative overhead, less fraudulent billing, and fewer avoidable emergency department visits and hospitalizations. Even under more conservative assumptions about drug prices and fraud reduction, the researchers projected that the savings would reach at least $663 billion a year. Both figures account for an estimated $304 billion in additional spending to meet unmet medical needs, reimburse care that now goes unpaid, and provide universal dental coverage.</p><p>A universal healthcare policy would also save tens of thousands of lives, the researchers project. They estimate that adequate coverage for all could avert about 62,863 deaths annually — and that nearly half, or 29,631, would be among people who already hold insurance. These are the underinsured: the more than 45 million working-age adults whose deductibles and cost-sharing put care beyond financial reach anyway. Reversing coverage rollbacks and other health policies enacted since 2025 would avert a further 51,311 deaths each year, the researchers project, bringing the annual total to 114,174.</p><p>The study builds on findings Galvani, co-author Meagan Fitzpatrick, and other colleagues published in <a href=\"https://doi.org/10.1016/S0140-6736(19)33019-3\" target=\"_blank\" rel=\"noopener\">The Lancet</a><a href=\"https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(19)33019-3/abstract\" target=\"_blank\" rel=\"noopener\"> in 2020</a>, which projected that universal health care would save $450 billion and more than 68,000 lives annually. The larger estimates in the new study reflect ballooning health expenditures, a widening gap between commercial and Medicare payment rates, and new estimates on recent policy changes and the underinsured.</p><p>The authors caution that direct estimates of excess mortality among underinsured adults are unavailable, requiring them to model that risk. Their spending analysis also does not account for transition costs, administrative job losses, or how providers might respond to Medicare payment rates.</p><blockquote><p>A  system that covers everyone, costs $1 trillion less, and averts more than  100,000 deaths annually requires no new discovery to implement, only enactment.</p></blockquote><p>Even with those limitations, the researchers argue that the United States already spends enough to provide universal coverage. The problem, they conclude, is how that money is allocated.</p><p>“A system that covers everyone, costs $1 trillion less, and averts more than 100,000 deaths annually requires no new discovery to implement, only enactment,” they wrote.</p><p>The study’s other authors are Abhishek Pandey, senior research scientist in epidemiology (microbial diseases); Chad Wells, postdoctoral research associate; and Yang Ye, associate research scientist in epidemiology (microbial diseases), at YSPH.</p><h2>Article outro</h2><h3>Author</h3><p>Matt Kristoffersen</p><h3>Featured in this article</h3>"},{"title":"Move Over, Aaron Judge—the Real Yankees M.V.P. Is George Costanza","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/move-over-aaron-judge-the-real-yankees-mvp-is-george-costanza","category":"fun","categoryLabel":"Interesting Reads","wordCount":614,"readingTime":4,"content":"<p>Debbie Tymon, the New York Yankees’ senior vice-president of marketing, has an office at the Stadium, situated behind home plate, with a window that overlooks the concourse where fans line up to get in on game days. She can thus witness the fruits of her labor when the line forms earlier than usual for such promotional events as Yankees Bucket Hat Night or Yankees Soccer Jersey Night, when the first clutch of fans—typically eighteen thousand of them—are handed freebies as they enter.</p><p>The gates might open at five for a seven-o’clock first pitch. “But, for the hottest items, they’ll start lining up at one in the afternoon, twelve-thirty even,” Tymon said the other day. The Stadium has four main entry gates, where the lines can overlap and even snake back toward the subway exits. This sounds like hell if you’re a baseball fan, but it’s heaven for Tymon, who is pleased to play a part in boosting attendance. “It really is gratifying,” she said.</p><p>Her workspace is cheerfully cluttered with Yankees memorabilia—pretty much what a twelve-year-old might fantasize a Yankees executive’s office to look like. On the desk sat what is likely this season’s most anticipated giveaway: a bobblehead likeness of George Costanza, the “Seinfeld” character played by Jason Alexander, which will be handed out at a game against the Houston Astros this month. Some of this summer’s giveaways have nothing to do with the Yankees—Hello Kitty and “KPop Demon Hunters” bobbleheads, for example. But not the Costanza bobblehead: the character worked for the Yankees across several seasons as “the assistant to the travelling secretary,” making this giveaway, now an annual event, the rare promotion with genuine synergy. Last year’s Costanza day was a sensation. As fans exited the Stadium, lurking entrepreneurs offered a hundred dollars for the figurines; today, sellers ask for as much as a thousand bucks on eBay.</p><p>This year’s Costanza bobblehead wears a Yankees jacket and holds a calzone—a tribute to the 1996 episode in which George’s employment becomes contingent on procuring daily eggplant calzones for the team’s real-life owner, the late George Steinbrenner. (The character is seen only from behind on the show and was voiced by the series’ co-creator Larry David.) At her desk, Tymon hoisted the pleasingly solid, seven-inch figurine, and pointed out the carefully painted bits of pepperoni and eggplant in the calzone. “Look at the quality!” she said. “Compare this”—she held up a chintzy-looking pin that another major-league team had given out to its fans—“to <em>this</em>”—the bobblehead.</p><p>Tymon is in her forty-second season with the Yankees, having begun her pin-striped tenure in the nineteen-eighties, as the director of group- and season-ticket sales. An elegant, slender woman, she was wearing a white dress with a chunky turquoise necklace and could have passed for a gallerist in Santa Fe or somewhere on the coast of Maine. She was joined by her colleague Craig Cartmell, the team’s senior associate director of marketing and promotions, who was dressed more predictably, in a Yankees polo shirt and jeans.</p><p>Cartmell, who worked with the vender who made the Costanza bobblehead, explained the multistep process. First, a deal had to be struck with Warner Bros., which controls the rights to the show. Then Jason Alexander had to sign off on the concept. (Jerry Seinfeld, a prominent Mets fan, had no say in the matter, although Tymon said that he’s a fan of the bobbleheads.) Warner Bros. then worked with the manufacturer to design the head, assuming responsibility for the actor’s likeness, while the Yankees took charge of the body. It’s worth noting that the contours of the bobblehead’s bald spot map precisely onto Alexander’s in the calzone episode—again, attention to detail.</p>"},{"title":"As developer Arc System Works promises a fix, Marvel Tōkon's suffering PC players are creating some bizarre home remedies for its dire performance woes","source":"Eurogamer","author":"Connor Makar","url":"https://www.eurogamer.net/marvel-tokon-pc-problems-strange-fixes","category":"gaming","categoryLabel":"Gaming","wordCount":560,"readingTime":3,"content":"<p>Epic solutions.</p>\n    \n  \n  \n  \n  \n            <p>Marvel Tōkon: Fighting Souls has been out for a few days now, and the PC version appears a little busted. Wide-ranging reports, including stuttering, online matchmaking issues, and CPU strain, are plaguing Windows warriors who have joined during the game's opening week.</p>\n<p>However, some strange workarounds have been discovered by some forward-thinking fighting game fanatics, which could remedy some of the game's technical issues on PC. Some of these are a bit bizarre though - fair warning - and few seem to have been effective for everybody.</p>\n\n<p>First up, there's an option in-game that has seemingly helped some players. Within the settings, you can select the \"set graphics automatically\" option. For some, this option works magic on their hardware, pulling out better performance than manually setting the game to its worst graphics settings.</p>\n\n<blockquote><p>Somehow its working AND recording for me on 60fps locked now?????????? All I did was use the \"set graphics automatically\" and it ran much better than potato mode???????????? <a href=\"https://t.co/4gIVtHzajq\" target=\"_blank\" rel=\"noopener\">pic.twitter.com/4gIVtHzajq</a></p>— Venom (@Lord__Venom) <a href=\"https://x.com/Lord__Venom/status/2085445863116038522?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">August 6, 2026</a></blockquote>\n\n<p>Next, if the in-game settings are no help, there are steps you can take without starting Marvel Tōkon up. One big issue some players are running into revolves around frame pacing. Basically, the frame rate will spike every now and again, throwing off the performance and causing major problems in online matches. To fix this, <a href=\"https://www.reddit.com/r/MarvelTokon/comments/1vit0sg/marvel_tokon_pc_frame_pacing_fix/\" target=\"_blank\" rel=\"noopener\">KineticNinja on the Marvel Tōkon Reddit</a> suggests taking the game's framerate into your own hands.</p><p>\"Turns out the that game's native FPS cap is super f*cky and causes consistent frame timing spikes every 30 frames or so,\" they write. \"To fix this frame pacing issue, simply set a manual 60 FPS frame rate cap in either RivaTuner, Nvidia App / Nvidia Control Panel, or your respective AMD software.</p>\n<p>\"I also enabled ultra low latency mode and enabled v-sync for the MTFS game profile within the Nvidia app / Nvidia Control Panel (leave v-sync disabled within the game's graphics settings) After using these settings, the frame time graph was super smooth and the dips that occurred every 30 frames or so were completely eliminated.\"</p>\n<p>Okay, so there's a suggestion that sounds pretty smart. Now here's a stranger alternative, seemingly tied to the game's use of Unreal technology: for some users, <a href=\"https://x.com/WheelsFGC/status/2085938280609046753\" target=\"_blank\" rel=\"noopener\">running the Epic Game Store in the background clears up PC lag</a>. You don't have to run the game through the Epic Game Store either - simply boot it up before starting the game on Steam and your issues may be resolved. Again, it's not a universal fix, sadly, with many reporting that performance woes persisted even with Tim Sweeney's darling open in the background.</p>\n<p>If none of these work for you, it's possible you've joined the tragically large group of PC Marvel Tōkon players left saddened by - and unable to fix - these performance problems. Still, there may be hope. Earlier today, an announcement made on the <a href=\"https://x.com/MARVELTokon/status/2086800882004279631\" target=\"_blank\" rel=\"noopener\">official Marvel Tōkon Discord</a> server informed players that PC performance fixes are coming later today. The post reads: \"This update includes PC performance and stability improvements, including reduced lag and fixes for frame drops.\"</p>\n<p>So with a mix of community-sourced fixes, and hard work from the developers at Arc System Works, maybe the PC version of Marvel Tōkon will be tip-top in no time. Or maybe it's truly doomed. Let's hope not!</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Introduction: To Keep Government Generally Within the Bounds of Law Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/","category":"law","categoryLabel":"Law","wordCount":747,"readingTime":4,"content":"<p>The current President of the United States has a relationship with the law that is casual at best and contemptuous at worst.  Whether the nation is facing a constitutional crisis has thus become a topic of debate among scholars and the public.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a>  The answer turns in important part on the degree to which the judiciary can help confine the emboldened Executive to constitutional limits.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  But alongside individual judges,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a> the institution of judicial review (through which courts can determine whether government actions comply with the law and counteract them if not) is under attack.  Combatants include President Donald Trump,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a> Administration officials,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a> congressional partisans,<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> and state lawmakers.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a>  Judges, including members of the Supreme Court, have entered the fray.<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a></p>\n<p>This Symposium, titled “Judicial Review in Jeopardy?,” seeks to make sense — and suggest some ways out — of these circumstances.  To do so, this Introduction proposes, we should see judicial review through the lens of Professors Richard Fallon and Daniel Meltzer’s contention that our constitutional structure “demands a system of constitutional remedies adequate to keep government generally within the bounds of law.”<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a>  To realize that system, federal courts must remain willing — and recognize their authority — to both check <em>and </em>balance assertions of political power.  By this, I mean that in agenda setting and doctrinal development, courts (including the Supreme Court) ought not rest on the abstract ability of judicial review to respond to some governmental abuses.  Within methodological margins, courts should instead consider the actual extent and efficacy of constitutional remedies to confront a meaningful proportion of constitutional violations — a proportion, that is, capable of producing substantial deterrence across varied and evolving circumstances.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1734.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Adam Liptak, <em>Trump’s Actions Have Created a Constitutional Crisis, Scholars Say</em>, N.Y. Times (Feb. 12, 2025), https://www.nytimes.com/2025/02/10/us/politics/trump-constitutional-crisis.html [https://perma.cc/J3Z4-HDGB]; Sarah Bryner et al., SNF Agora Inst. at Johns Hopkins Univ. &amp; Pub. Agenda, Understanding Evolving Republican Attitudes Towards Democracy 7 (2025), https://snfagora.jhu.edu/wp-content/uploads/2025/11/Understanding-Evolving-Republican-Attitudes-Towards-Democracy.pdf [https://perma.cc/Q8SM-EBGJ].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> Liptak, <em>supra</em> note 1 (explaining that “legal scholars agree” that a constitutional crisis “is generally the product of presidential defiance of laws and judicial rulings”); <em>see also</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707, 726 (2009) (stating that President Franklin Dela arget=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Kimberly Kindy &amp; Alice Crites, <em>The Texas Abortion Ban Created a “Vigilante” Loophole. Both Parties Are Rushing to Take Advantage.</em>, Wash. Post (Feb. 22, 2022), https://www.washingtonpost.com/politics/2022/02/22/texas-abortion-law-vigilante-loophole-supreme-court [https://perma.cc/JN6B-PM6K] (describing state legislation attempting to shield government officials from constitutional litigation).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Abbie VanSickle, <em>Courts Must “Check the Excesses” of Congress and the President, Roberts Says</em>, N.Y. Times (May 7, 2025), https://www.nytimes.com/2025/05/07/us/politics/supreme-court-roberts-judicial-independence.html [https://perma.cc/WVC4-LRSP] (discussing “rare public remarks” by Chief Justice Roberts and noting Justice Jackson’s “critici[sm of] what she called ‘relentless attacks’ on judges” (quoting Justice Jackson)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/introduction-to-keep-government-generally-within-the-bounds-of-law/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> Richard H. Fallon, Jr., &amp; Daniel J. Meltzer, <em>New Law, Non-Retroactivity, and Constitutional Remedies</em>, 104 H var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
