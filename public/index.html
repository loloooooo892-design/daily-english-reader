var articles = [{"title":"Aggregation and the \"Universal\" Injunction Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/","category":"law","categoryLabel":"Law","wordCount":730,"readingTime":4,"content":"<h2>Introduction</h2>\n<p>A crucial function of judicial review is not only “to say what the law is,”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a> but also to provide the remedies to vindicate that law.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Judicial review plays an especially important role when government officials act in ways that violate federal law, including when they violate the Constitution.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  When government officials violate the law, the judicial review function supports a remedy that requires officials to comply with federal law by ceasing to pursue the illegal policy or practice.</p>\n<p>Such “compliance” injunctions have been given the label “universal” or “nationwide” injunctions insofar as they go beyond giving “complete relief <em>to the plaintiffs before the court</em>.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a>  Among other things, this framing couches compliance injunctions as aggregation devices — as improper attempts to “create de facto class actions.”<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-5\" target=\"_blank\" rel=\"noopener\">5</a>  Although this characterization has never been entirely accurate,<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-6\" target=\"_blank\" rel=\"noopener\">6</a> the majority in <em>Trump v. CASA, Inc.</em><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-7\" target=\"_blank\" rel=\"noopener\">7</a> embraced it and, as a result, narrowly construed the federal courts’ statutory authority to issue such injunctions in cases brought by individual plaintiffs.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-8\" target=\"_blank\" rel=\"noopener\">8</a>  The <em>CASA </em>decision makes it imperative to reckon with “universal” injunctions through the lens of aggregation — specifically, through the lens of class actions under Rule 23 of the Federal Rules of Civil Procedure.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-9\" target=\"_blank\" rel=\"noopener\">9</a></p>\n<p>In this Essay, we begin with a brief summary of the <em>CASA </em>decision’s holding regarding the availability of “universal” injunctions.<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-ref-10\" target=\"_blank\" rel=\"noopener\">10</a>  Part II discusses the relationship between remedies and judicial review and the important role that such injunctions play in that regard.  Part III explores how class actions could serve as an alternative path for federal courts, after engaging in judicial review, to make their decisions meaningful by requiring officials to comply with the law and to cease illegal actions or policies.  We also respond to several objections to the use of class actions in this context.  The final Part addresses some implications of the class action route to “universal” injunctions, identifying the core functional connection between class actions and such injunctions, but also acknowledging some of the problems that this class action route may pose.</p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1791.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> Marbury v. Madison, 5 U.S. (1 Cranch) 137, 177 (1803).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 163 (“[I]t is a general and indisputable rule, that where there is a legal right, there is also a legal remedy by suit or action at law, whenever that right is invaded.” (quoting 3 William Blackstone, Commentaries *23)).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> <em>E.g.</em>, United States v. Lee, 106 U.S. 196, 220–21 (1882).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Trump v. CASA, Inc., 145 S. Ct. 2540, 2548 n.1, 2557 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">^</a> <em>Id.</em> at 2556 (quoting Smith v. Bayer Corp., 564 U.S. 299, 315 (2011) (emphasis omitted)).  Professor Maureen Carroll describes individual plaintiff litigation to obtain compliance injunctions outside of class actions as “quasi-individual” actions.  Maureen Carroll, <em>Aggregation for Me, but Not for Thee: The Rise of Common Claims in Non-Class Litigation</em>, 36 Cardozo L. Rev. 2017, 2020 (2015).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-5\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>CASA</em>, 145 S. Ct. at 2600 n.2 (Jackson, J., dissenting) (arguing that “the majority’s primary premise — that universal injunctions ‘grant relief to nonparties’ — is suspect” because “[w]hen a court issues an injunction (universal or otherwise), it does so via an order that governs the relationship between the plaintiff and the defendant”).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-6\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">^</a> 145 S. Ct. 2540 (2025).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-7\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">^</a> <em>See</em> <em>supra</em> notes 4–5 and <em>infra</em> notes 20–22 and accompanying text.\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-8\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally, e.g.</em>, David Marcus, <em>The Class Action After Trump v. CASA</em>, 73 UCLA L. Rev. Discourse 2 (2025) (discussing the role of class actions after the <em>CASA </em>decision).  Class actions are not the only vehicle for obtaining compliance injunctions against governmental policies that violate federal law.  <em>See</em> <em>infra</em> notes 24–29 and accompanying text (discussing how <em>CASA</em> did not rule out such relief either (a) in suits by individual, governmental, or associational plaintiffs in certain circumstances, or (b) when authorized by the vacatur provision of the Administrative Procedure Act).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-9\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">^</a> For an explanation of why we put “universal” injunctions in quotation marks, see Portia Pedro, <em>Toward Establishing a Pre-Extinction Definition of “Nationwide Injunctions</em>,<em>”</em> 91 U. Colo. L. Rev. 847, 849–50 (2020).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/aggregation-and-the-universal-injunction/#footnote-10\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>\n\n\t\t\t<p>\n\t\t\tJune 10, 2026\t\t</p>"},{"title":"“Paper Tiger” Views Family as Deadweight","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/16/paper-tiger-movie-review","category":"fun","categoryLabel":"Interesting Reads","wordCount":1466,"readingTime":8,"content":"<p>There are no ticking clocks or flipping calendar pages in James Gray’s new film, “Paper Tiger,” but it’s nonetheless a drama of time implacably passing. Call it a September song: the story opens on Labor Day in 1986, in Queens, at the home of the Pearl family. Early in the morning, the jovial, still youthful paterfamilias, Irwin (Miles Teller), has his power tools going in the narrow driveway beside the house, waking his sons—Scott (Gavin Goudey), who’s about to turn eighteen, and Ben (Roman Engel), maybe five years younger—on their last day of summer vacation. As Jerry Lewis’s annual telethon blares from a TV in the kitchen, Irwin and his wife, Hester (Scarlett Johansson), tell the boys that they’re all going to visit Hester’s mother, Iris (Cindy Katz), at a country club near her home, in the prosperous and largely Jewish Long Island suburb of Great Neck.</p><p>From this banal beginning, Gray launches a tale of fear and violence, criminal conspiracies and paranoia. That night, after the family gets back home, Irwin’s older brother, Gary (Adam Driver), arrives with princely pomp, bringing a takeout feast from the venerable steak house Peter Luger. A former high-ranking cop now earning a grand living as a security consultant—and basking in the admiration of his former N.Y.P.D. colleagues—Gary, who drives a Mercedes and is seemingly sewn into sharply tailored suits, is as dashing as Irwin is staid. The fancy meal is the prelude to a proposition: he wants Irwin, an environmental engineer, to team up with him as a co-consultant to the owners of a grossly polluted site on the Gowanus Canal, in Brooklyn, which is about to undergo a federally funded cleanup. Gary is sure that the job will be lucrative and tells Irwin that the owners, recently arrived Russians whom he describes as scientists and engineers, are in need of Irwin’s regulatory and technical expertise.</p><p>At a preliminary meeting in Gowanus, little about the prospective clients’ rough manner and crude appearance bears out Gary’s claims. And a few days later, when the overeager Irwin, following his usual procedure, visits the site to take stock—proudly bringing his sons along to see the world of his work—he finds that he’s dealing with gangsters of rare ruthlessness and brutality. By this time, though, he and Gary are in too deep: the gangsters beat Irwin and menace Hester and the boys. To protect the family, Gary goes into heavy debt to the syndicate; the movie’s title comes from the description he offers of his gangland creditors to allay Irwin’s fears. “I’m N.Y.P.D.,” Gary says, adding, “They’re not gonna touch me.” “But they can touch <em>me</em>,” Irwin skeptically retorts. As the days until payment is due tick grimly by, Irwin and Hester grow increasingly fretful and angry, and their widening divisions wrench the family apart, to intimately catastrophic effect.</p><p>Such lovequakes are a through line of Gray’s directorial career, which began in 1994, with “Little Odessa.” Gray, one of cinema’s great homebodies, grew up in Queens, and most of his movies are set there or in Brooklyn and deal bruisingly with the financial tensions, thwarted dreams, and frayed bonds of middle-class Jewish families like the one in which he was raised—stressed, streetwise, and crime-proximate. His previous film, “Armageddon Time,” from 2022—to my mind, his hitherto most accomplished one—is, like “Paper Tiger,” set in his home neighborhood, Fresh Meadows. That film takes place in 1980, with frequent allusions to Ronald Reagan’s ongoing Presidential campaign, and it focusses on a family very similar to the one in “Paper Tiger”: a father named Irving, who is a contractor; a mother named Esther; and two sons, the younger of whom transfers from public school to a nearby private day school dominated by a wealthy local family—the Trumps.</p><p>Gray conceived “Paper Tiger” as a sequel to “Armageddon Time” but altered his plans when the actors who played the parents in the earlier film, Anne Hathaway and Jeremy Strong, were unavailable. The two works remain cognate, but their differences are crucial. Strong’s Irving was tougher, more abrasive than Irwin is; conversely, Hathaway’s Esther, a teacher, was relatively refined and educated, whereas Johansson’s counterpart sleeps with rollers in her hair, like a vestige of the pre-Beatles sixties; speaks in a Queens accent that could cut metal; and holds the family together with her life-worn smarts and iron will. Yet she’s as unworldly as the nerdy Irwin, looking up to him with his fund of “facts and figures.”</p><p>But fires of rage burn below the surface of “Paper Tiger,” exemplified in the opening visit to Great Neck. Iris wants Hester and her family to move there; Hester demurs, explaining that college tuition for the boys must come first, but Irwin openly scoffs: “Everyone here was born with a silver spoon in their mouth, or stole one.” Iris, seeing suburban luxury as her daughter’s birthright, thinks that Hester’s marriage has been a comedown. The Pearls aren’t poor, but they’re burdened by expenses and tantalized by comforts just out of reach, especially now that their sons’ heads have been turned by Gary’s flashy success. (Comparing his uncle’s Mercedes with his parents’ cars, Scott whines, “Why do we always have to buy crappy stuff and live crappy?”)</p><p>Irwin’s run-in with the Mob dispels the fantasy of easy money; instead, he packs suitcases and makes plans to get the family out of town for their safety. Yet “Paper Tiger” is far more than a tale of criminal violence piercing the domestic bubble. It’s a story of silences, ones that form a conspicuous contrast with its precursor. “Armageddon Time,” with its expressly political context, is a film of rich discourse, filled with rhetorical expositions of ideology and history, reminiscences and commentaries. In “Paper Tiger,” there’s plenty of talk throughout, but hardly any of it involves cultural context, broader observation, or deeper reflection; it’s not a film of ideas. Instead, the heated dialogue is an expression of the inner life of the family and its time.</p><p>Interviews with directors have become a familiar part of movie promotion, but Gray’s interviews are different, often less like conversations than like performances. He’s among the most publicly funny of filmmakers, a gifted impersonator; I’ve long hoped that he would direct a comedy (he hasn’t yet) and appear in it. But his talent for mimicry comes across thrillingly in the dialogue of “Paper Tiger”—Gray wrote the screenplay himself—which adds an extra dimension to the story’s autobiographical elements. Both in ordinary chitchat and in big confrontations, the dialogue plays like a musical score of language built from a trove of memories. The film’s wondrously street-lyrical patter, its emblematic phrases and inflections, amount to a vast act of world-building—a lost milieu brought back to life in bygone clichés.</p><p>Much of this evocative talk also proves evasive. Just as Gary’s forecast for the Gowanus venture turns out to have been misleading, the fallout from that calamitous misadventure quickly brings on further elisions and secrets, transforming a happy home and a stable marriage into a curtained stage of furtive designs, hidden agendas, and stealthy exploits. Gary’s Mephistophelian temptations break the façades of business, law, and marriage, revealing the profound and irreparable solitude that lurks beneath life’s fundamental bonds.</p><p>Gray has always displayed a probing visual style, boldly confrontational yet painfully tender. In “Paper Tiger,” he refines these tendencies into lapidary images—spare, taut, and precise—that evoke the fierce solidity of the family circle and the fearsome emptiness that’s left when it shatters. With a quietly dazzling repertory of shadows and reflections, fragmented glimpses, truncated vistas, and blocked perspectives, he conjures everything the film keeps hidden, the illusions and limitations that inhere in frank gazes and point-blank views. I’ve seen “Paper Tiger” on the big screen but am looking forward to its streaming release in order to rewatch it as a silent film. Amid all its chatter, Gray has found the space to let images be eloquent, too. And their eloquence is greatest when expressing the silence and solitude of Hester.</p><p>In this regard, Gray’s movie resembles a pair of recent classics by Martin Scorsese, “The Irishman” and “Killers of the Flower Moon,” both of which feature women who respond to betrayal by men with silences deafening enough to rend the films’ finely textured surfaces. In “Paper Tiger,” the cycle of tragedy finds its definitive voice in Hester’s reproachful silences, which turn out to be radical rejections of the tight little world she inhabits. Determined and relentless, Hester, as incarnated by Johansson, dominates the action and steals the film with a decisive form of passive aggression—one that Gray condenses into a breathtakingly rapid, boldly symbolic special effect. By the time September winds down, Hester is on a timetable all her own, out of synch with her family, detached from its cares, paradoxically and bitterly free. ♦</p>"},{"title":"Richard Garriott on the state of the games industry: 'The bells and whistles are no longer what's important'","source":"PC Gamer","author":"Jody Macgregor","url":"https://www.pcgamer.com/gaming-industry/richard-garriott-on-the-state-of-the-games-industry-the-bells-and-whistles-are-no-longer-whats-important/","category":"gaming","categoryLabel":"Gaming","wordCount":652,"readingTime":4,"content":"<p>State of the Video Game Industry w/Lord British - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/lI8WAIlAlGA\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>Ultima creator Richard Garriott was one of several developers on a recent panel hosted by the Georgia Game Developers Association, and Lord British was in fine form. Calling himself the \"great-grandpa\" of the group, he began by summarizing the current problems faced by the videogame industry.</p><p>\"It's not just one thing,\" Garriott began. \"I think if it was one thing it would be a lot easier to diagnose and come back from, but it's a lot of folks who don't understand videogames trying to make money off of videogames, it's a political climate, it's a billion things. All the threads have woven together into this horrible knot that we're seeing now.\"</p><p>He went on to describe a cycle he's seen play out multiple times over his years in the industry, where a technological advance comes along and everyone races to make a simple game that highlights that advance—whether it's the CD-ROM or a 3D-rendering pipeline or the internet—and only in the short gaps between these leaps forward is there much demand for something deeper.</p><p>\"That cycle has been normal,\" Garriott said. \"But we're at a new one, and this new one is machines are now fast enough to where the bells and whistles are no longer what's important.\" Without another advance having the same impact, he said, \"we're at this kind of creative cliff where I think people don't know exactly what to do to prevent it and I think we've lost a lot of the original creators that were associated with those IPs and the bigger companies, and so I think we're floundering.\"</p><p>Garriott also had something to say about the way publishers have responded to the current state of the industry—by canceling games and laying off staff. Referring to his own publisher, Origin Systems, which he sold to EA in 1992, Garriott said, \"Origin pre-EA, we never cancelled a project. Our theory was that if that team is capable of getting across the finish line, even if it doesn't sell well, they'll now know what it feels like to finish. And they will get feedback from the sales and the public as to what they did and didn't do right and so that team will be more strong, the individuals will be stronger, and we'll be able to circle back and do a more competent game next time.</p><p>\"If you cancel a project, that means all those people on that team think you the publisher suck, because obviously their idea must've been brilliant, and so your willingness to cancel it was not their fault, but you the evil publisher. And half of them are probably going to leave or get fired, and maybe you'll scoop a few of them over into some other project that's now the priority project, but we thought that was a bad move on our own.\"</p><p>Things changed once EA snapped up Origin and took control, however. After that? \"We canceled more projects than we completed by a long shot,\" Garriott said.</p><p>From the creators of Edge: A free weekly videogame industry newsletter, featuring in-depth news, expert analysis and exclusive interviews</p>\n\n<p>Jody's first computer was a Commodore 64, so he remembers having to use a code wheel to play Pool of Radiance. A former music journalist who interviewed everyone from Giorgio Moroder to Trent Reznor, Jody also co-hosted Australia's first radio show about videogames, <a href=\"https://zedgamesau.net/tag/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zed Games</a>. He's written for <a href=\"https://www.rockpapershotgun.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Rock Paper Shotgun</a>, The Big Issue, <a href=\"https://www.gamesradar.com/author/jody-macgregor/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a>, <a href=\"http://www.zam.com/author/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Zam</a>, <a href=\"https://web.archive.org/web/20170606042647/http://www.glixel.com/contributor/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Glixel</a>, <a href=\"https://fiveoutoftenmagazine.com/downloads/issue-16-identity/\" target=\"_blank\" rel=\"noopener\">Five Out of Ten Magazine</a>, and <a href=\"https://web.archive.org/web/20171009125722/https://www.playboy.com/authors/jody-macgregor\" target=\"_blank\" rel=\"noopener\">Playboy.com</a>, whose cheques with the bunny logo made for fun conversations at the bank. Jody's first article for PC Gamer was about the <a href=\"https://www.pcgamer.com/the-audio-of-alien-isolation/\" target=\"_blank\" rel=\"noopener\">audio of Alien Isolation</a>, published in 2015. Jody edited PC Gamer Indie from 2017 to 2018, and he eventually lived up to his promise to play every Warhammer videogame.</p>"},{"title":"The Best Early Black Friday TV Deals","source":"Wired","author":"@wired","url":"https://www.wired.com/story/early-black-friday-tv-deals-11-5-26/","category":"tech","categoryLabel":"Technology","wordCount":696,"readingTime":4,"content":"<p>You should never buy a TV at full price. This is a hill I will die on, and I am proven right every year when I see 20-, 30-, and even 50-percent-off deals on some of the <a href=\"https://www.wired.com/gallery/best-tvs/\" target=\"_blank\" rel=\"noopener\">best TVs</a>. Even though <a href=\"https://www.wired.com/tag/black-friday/\" target=\"_blank\" rel=\"noopener\">Black Friday</a> is weeks away, I'm already seeing some great TV deals available now.</p><p>If you're in the market for a new screen, now is a smart time to shop options of all sizes, from big, premium <a href=\"https://www.wired.com/gallery/best-oleds/\" target=\"_blank\" rel=\"noopener\">OLED TVs</a> for a home theater to small <a href=\"https://www.wired.com/story/best-art-tvs/\" target=\"_blank\" rel=\"noopener\">art TVs</a> for the bedroom. Because you'll be ahead of the deal-hunting masses, you probably won't have to worry about shipping delays or out-of-stock notifications. A WIRED reviewer has tried every TV featured below (with one exception, the LG C6, which is currently in testing).</p><p>For more great discounts, check out our <a href=\"https://www.wired.com/story/black-friday-deals-10-27-2026/\" target=\"_blank\" rel=\"noopener\">Best Early Black Friday Deals</a>, as well as early discounts on <a href=\"https://www.wired.com/story/early-black-friday-smart-bird-feeder-deals-october-2026/\" target=\"_blank\" rel=\"noopener\">smart bird feeders</a>, <a href=\"https://www.wired.com/story/best-early-bfcm-mattress-deals-10-30-2026/\" target=\"_blank\" rel=\"noopener\">mattresses</a>, and <a href=\"https://www.wired.com/story/early-black-friday-coffee-espresso-deals-2026/\" target=\"_blank\" rel=\"noopener\">espresso machines</a>.</p><p>Featured in this Article:</p><h2>Best OLED TV Deals</h2><p><a href=\"https://cna.st/p/6oLvJjdU7CNCwWF5cXerRwx571VBH8m18adHAGEgemJNED1xjEZuDERDTN4uKxvqasvQWdphywmuWygPAMNT9iZgMAjKcCatCD3XZqPxz2PPzopVwgaF1U9rTieq2n1mPtDNvWfR5949tLTojn9TxDJJK33g56Q8MFnzPG6NpHTtiMctx7UA2Ur4Xqk2U5VxkJXMh6nDT2YHmghkYa1DTXtXE3bFg776csV26kCvMnm62N3QX2whwFpkKChgrDy4mXs8MiZrfUBAKZAhvKfeGNPDzvjMCJGNxofoa2tq6RDsX7ja16PdqD3Va4wcq3kqq7Hes3euALnLT83Gya3PhsuQtjAUnbp1Zns57VzWeBFKuNXiRNbxpAjS7Qr532w6v3JbrKFRDeCNBxWYttVVQwEfERFqDrmn9MUat8iz1na5sxgzS7hnpjS6xZnz\" target=\"_blank\" rel=\"noopener\"></a></p><p>Courtesy of Amazon</p><p>LG</p><h3>C6 OLED TV</h3><p>This is the lowest price I've ever seen for the 65-inch LG C6, a fantastic deal on an excellent OLED TV. LG's C-Series TVs are consistently among our top picks due to their high brightness, uniform blacks, and vivid, natural colors. Add in their ample connectivity, which makes them versatile enough for gamers, and it's clear why this is a top OLED pick.</p><ul><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li></ul><p>Samsung</p><h3>S95H</h3><p>The premium 2026 <a href=\"https://www.wired.com/review/samsung-s95h/\" target=\"_blank\" rel=\"noopener\">Samsung S95H OLED TV</a> is now at its lowest price yet. WIRED reviewer <a href=\"https://www.wired.com/author/john-brandon/\" target=\"_blank\" rel=\"noopener\">John Brandon</a> praised the TV for its accurate color and deep blacks. New to the latest S95H model is a silver bezel that’s recessed behind the main OLED panel, making the TV look like a metal picture frame.</p><ul><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li></ul><p>LG</p><h3>B6</h3><p>I understand wanting a nice OLED TV but not wanting to pay premium OLED prices. That's where budget OLEDs like the <a href=\"https://www.wired.com/review/lg-b6/\" target=\"_blank\" rel=\"noopener\">LG B6</a> shine—especially when steeply discounted. The 48-inch version, in particular, is 50 percent off at Best Buy right now, which is such a good deal, I thought it was a typo. (I won’t be surprised if the price mysteriously goes up.) Brandon praised the TV's thin size, simple setup, and deep and rich blacks.</p><h2>Best LED TV Deals</h2><ul><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li></ul><p>TCL</p><h3>QM6K QLED</h3><p>This isn’t a huge discount, and I wouldn’t be surprised if the price went down closer to Black Friday. Even so, the <a href=\"https://www.wired.com/review/tcl-qm6k/\" target=\"_blank\" rel=\"noopener\">TCL QM6K</a> is one of the best TVs for most people, according to former WIRED reviewer <a href=\"https://www.wired.com/author/ryan-waniata/\" target=\"_blank\" rel=\"noopener\">Ryan Waniata</a>, because of its well-rounded picture and reasonable price (even when not on sale).</p><ul><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li><li><p>Photograph: Ryan Waniata</p></li></ul><p>Hisense</p><h3>U7SG QLED</h3><p>Again, this isn’t the biggest discount I’ve seen for this TV, but 33 percent off is nothing to sneeze at for an already good-value television. In his <a href=\"https://www.wired.com/review/hisense-u7sg/\" target=\"_blank\" rel=\"noopener\">U7SG review</a>, Waniata called this a near-premium model with a new-and-improved stand and an anti-reflective matte screen reminiscent of high-end Samsung models.</p><h2>Best Art TV Deals</h2><ul><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li><li><p>Photograph: John Brandon</p></li></ul><p>Samsung</p><h3>The Frame Pro (2026)</h3><p>The best art TV is <a href=\"https://www.wired.com/review/samsung-the-frame-pro-2026/\" target=\"_blank\" rel=\"noopener\">Samsung's Frame Pro (2026)</a> thanks to its excellent image quality, contrast, color depth, and anti-glare technology that far outshines competition, says Brandon. The only problem is that it's historically been high-priced. While 17 percent off may not sound that impressive, it’s actually matching the Prime Day low I saw earlier this year for the same model.</p><ul><li><p>Photograph: Martin Cizmar</p></li><li><p>Photograph: Martin Cizmar</p></li></ul><p>Hisense</p><h3>CanvasTV S7N</h3><p>This discount isn't as low as its Prime Day price (yet), but 50 percent off is still great and makes this budget-friendly art TV even more appealing—especially for secondary rooms. It's not as bright as Samsung's art TVs, but it does come with a far broader free art library, no subscription fee needed.</p><p><strong><a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\"><em>Power up with unlimited access to</em> WIRED</a><em>.</em></strong> <em>Get best-in-class reporting and exclusive subscriber content that's too important to ignore. <a href=\"https://www.wired.com/v2/offers/wir_generic_ctrl?source=Site_0_HCL_WIR_EDIT_HARDCODED_0_COMMERCE_AFFILIATE_ZZ\" target=\"_blank\" rel=\"noopener\">Subscribe Today</a>.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;

  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
