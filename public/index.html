<script>
var articles = [{"title":"Voter Ignorance and the Problem of Confusion Caused by Candidates With Similar Names [Updated]","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/08/18/voter-ignorance-and-confusion-caused-by-candidates-with-similar-names/","category":"law","categoryLabel":"Law","wordCount":1361,"readingTime":7,"content":"<p>As Cornell law Professor Michael Dorf explains in <a href=\"https://www.dorfonlaw.org/2026/08/courting-voter-confusion-in-alaska.html\" target=\"_blank\" rel=\"noopener\">an interesting recent blog post</a>, the currently ongoing Senate election in Alaska includes two candidates with almost identical names, one of whom may well be in the race to siphon off votes from the other:</p> <blockquote><p>In today's Senate primary election, Alaska voters will have many choices, including two named Dan Sullivan. One is the incumbent Republican. The other is a retired schoolteacher from Petersburg, Alaska with the same name. Republicans claim that the man I'll call Teacher Dan is running for the sole (or at least main) purpose of siphoning votes off from the incumbent and thus potentially handing victory to the Democratic challenger in a tight race. That's a plausible allegation given the jungle primary format. The top four finishers in today's primary advance to the general election. If two of those candidates are named Dan Sullivan, that could be enough to tip the outcome in favor of Democratic challenger and current House member Mary Peltola.</p> <p>Is Teacher Dan in it only (or mostly) to siphon votes from Incumbent Dan? <a href=\"https://www.nytimes.com/2026/08/18/us/politics/dan-sullivan-alaska-senate-primary.html\" target=\"_blank\" rel=\"noopener\">A NY Times story</a> today reaches an uncertain verdict. Teacher Dan vociferously denies that he's running as a spoiler/siphoner, professing a desire to turn the Republican Party away from MAGAism and back towards its traditional norms and positions. However, the same story also indicates that Teacher Dan's views, as expressed through activism and donations, are pretty mainstream liberal Democratic….</p></blockquote> <p>The names are not quite completely identical. The incumbent senator is Dan S. Sullivan, and \"Teacher Dan\" (as Dorf calls him) is Dan J. Sullivan. But the similarity is great.</p> <p>As Dorf notes, if \"Teacher Dan's\" campaign succeeds in exploiting voter confusion about the two men's names, there is an obvious sense in which it is undermining effective voter choice. I agree, even though - like Dorf - I would ultimately prefer that Democrat Mary Peltola win this race, as her positions are much less bad than those of most Republicans in the current Trump-dominated version of the GOP.</p> <p>As Dorf notes, this is far from the first time that voters may get confused by candidates with similar names. In addition to cases he indicates, there is the example of the 2003 California gubernatorial recall election, where<a href=\"https://www.foxnews.com/story/voters-may-have-confused-little-known-candidate-with-arnold\" target=\"_blank\" rel=\"noopener\"> little-known candidate George Schwartzman finished ninth</a> out of 135 candidates, beating several better-known ones, likely because voters were confused by the fact that his name is similar to that of famous actor Arnold Schwarzenegger. Schwarzenegger still won easily. But in a close election, the nearly 11,000 votes that Schwartzman got might have proved decisive.</p> <p>Dorf points out that if \"Teacher Dan\" really is in the race primarily to siphon off votes through confusion, it is not clear whether his actions are illegal. While such exploitation of confusion is morally reprehensible, I am not sure it is a good idea to prosecute candidates who do this. They are indeed trying to deceive voters. But the same is true of many other candidates who routinely lie about and distort  issues of all kinds.</p> <p>Donald Trump is a particularly egregious example, going all the way back to <a href=\"https://www.cnn.com/2016/05/12/opinions/political-ignorance-somin\" target=\"_blank\" rel=\"noopener\">his first campaign in 2016</a>, and more recently with<a href=\"https://www.cato.org/commentary/trump-big-lie-isnt-about-2020\" target=\"_blank\" rel=\"noopener\"> his lies about the 2020 election</a> and other issues. But more conventional politicians also <a href=\"https://reason.com/volokh/2016/10/25/why-politicians-lie/\" target=\"_blank\" rel=\"noopener\">often resort to lies and deception</a>, even if not to the same degree.  President Obama, for example, famously  lied when he claimed that, under the Affordable Care Act, <a href=\"http://www.politifact.com/truth-o-meter/article/2013/dec/12/lie-year-if-you-like-your-health-care-plan-keep-it/\" target=\"_blank\" rel=\"noopener\"> \"if you like your health care plan, you can keep it.\"</a> That deception won the 2013<a href=\"http://www.politifact.com/truth-o-meter/article/2013/dec/12/lie-year-if-you-like-your-health-care-plan-keep-it/\" target=\"_blank\" rel=\"noopener\"> Politifact Lie of the Year</a> award. But it still helped Obama get reelected in 2012. I am not sure exploiting voter confusion about names is any worse than exploiting their ignorance about policy issues like crime, immigration, and health care.</p> <p>Trying to prevent such exploitation through criminal and civil liability is likely to violate the First Amendment. In addition, it would likely end up giving incumbent political leaders broad power to curb speech and control electoral campaigns that they cannot be trusted with.</p> <p>Ultimately, both exploitation of voter confusion about names and other deceptions used in campaigns seek to exploit <a href=\"https://www.amazon.com/dp/0804799318/ref=nosim?tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\">widespread voter ignorance</a>. Because of the combination of <a href=\"https://balkin.blogspot.com/2013/10/can-education-or-information-shortcuts.html\" target=\"_blank\" rel=\"noopener\">\"rational ignorance\" (lack of incentive to seek out political information) and \"rational irrationality\" (lack of incentive to engage in unbiased evaluation)</a>,  most voters know little about government and public policy, and often do a poor job of evaluating the information they do know. This makes them vulnerable to deception and manipulation, and <a href=\"https://reason.com/volokh/2016/10/25/why-politicians-lie/\" target=\"_blank\" rel=\"noopener\">incentivizes politicians to lie</a> and otherwise distort the truth.</p> <p>Voter confusion about candidates with similar names is just another example of this broader problem. Voters who follow politics closely and pay careful attention to their ballots should have little trouble distinguishing between the two Dan Sullivans. Indeed, they would likely know about this issue ahead of time thanks to all the media coverage it has gotten, and would thereby watch out for it when at the polls. The same goes for the difference between Schwarzenegger and Schwartzman, and other such situations. But, due to the incentive structure of voting, most people do not pay such close attention and are not especially careful in filling out ballots. Thus, many might be confused by candidates with similar names.</p> <p>There is no easy solution to the problem of voter ignorance. But I assess a range of possible options in my 2023 article on \"<a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4201759\" target=\"_blank\" rel=\"noopener\">Top-Down and Bottom-Up Solutions to the Problem of Political Ignorance</a>, and in my earlier book <a href=\"https://www.amazon.com/dp/0804799318/ref=nosim?tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\"><em>Democracy and Political Ignorance.</em></a> I believe the best approach is to make fewer decisions at the ballot box and more by \"voting with your feet,\" where <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2160388\" target=\"_blank\" rel=\"noopener\">incentives to seek out information and evaluate it wisely are much better</a>. But I  recognize that any effective approach will take time, and there may be no one fix that is sufficient by itself.  We may need to pursue multiple strategies. In the meantime, voters are likely to continue to be ignorant and confused about a variety of issues, and politicians and interest groups are likely to keep on exploiting that.</p> <p>UPDATE: I have made minor additions to this post.</p> <p>UPDATE #2: At the Election Law Blog, prominent election law scholar Rick Hasen <a href=\"https://electionlawblog.org/2026/doj-issues-grand-jury-subpoenas-in-dan-j-sullivan-case-raising-serious-first-amendment-issues-in-potentially-prosecuting-someone-for-impure-political-motives/\" target=\"_blank\" rel=\"noopener\">notes that the Justice Department is investigating Dan J. Sullivan</a>, and argues that an prosecution here would raise serious First Amendment concerns, and likely be unconstitutional:</p> <blockquote><p>If J. ultimately is charged with violating the Ku Klux Klan Act (<a href=\"https://www.law.cornell.edu/uscode/text/18/241\" target=\"_blank\" rel=\"noopener\">18 U.S.C. s 241</a>), which punishes a conspiracy to \"injure, oppress, threaten, or intimidate any person in any State. . . in the free exercise or enjoyment of any right or privilege secured to him by the Constitution or laws of the United States,\" I think J. would have a very strong First Amendment defense (and likely for the wire fraud claims too, but I don't know enough about what the basis for those charges might be)….</p> <p>[T]his is not a case about tricking someone about the mechanics of the election not to vote. Nor is it a case of impersonation: J. is really named \"Daniel Sullivan.\" It is not even a case about J. telling a campaign lie….</p> <p>This is a case about someone running for office with impure motives who is lucky enough to have a name that could confuse some voters….</p> <p>I don't see how the government could criminalize his running for office for having impure motives. And if it could do so, then it could be a crime every time that the Republican Party backs a Green Party candidate, or Democrats support a MAGA candidate in a primary in the hopes that the candidate would be weaker against a Democrat in the general election. This stuff happens all the time.</p> <p>It would be quite dangerous for the state to start criminally prosecuting people for their political beliefs and secret motives. Are we going to put people on trial and probe their political allegiances?</p> </blockquote> <p>I largely agree with Hasen's analysis on this point. \"Teacher Dan's\" behavior may be reprehensible, as is that of many politicians who use lies and deception exploit voter ignorance. But it probably cannot be prosecuted.</p>"},{"title":"Google’s Pixel Watch 5 Pumps Up Its Fitness Smarts","source":"Wired","author":"@wired","url":"https://www.wired.com/review/google-pixel-watch-5/","category":"tech","categoryLabel":"Technology","wordCount":535,"readingTime":3,"content":"<p>Whether you’ll actually use all of this depends on your active lifestyle, but I can see it being particularly useful for someone new to the gym who wants a little structure that feels personal. I do appreciate that it syncs to the watch, so I can see rep counts and rest intervals without unlocking my phone.</p><p>Gemini is still one of Pixel Watch’s best features, and it can now tackle offline tasks, such as starting a workout, which is handy if you tend to leave your phone at home on runs. The dual-band GPS is the same, but Google says route tracking is now twice as accurate in urban environments. It now accounts for atmospheric interference and multipath errors, which should help it maintain more accurate positioning around tall buildings. So far, I’ve had zero issues with route mapping in Chicago, and I can say the same for the previous model. I’m curious whether people in New York City might notice a bigger difference.</p><p>The Watch 5 retains several health features from its predecessors, including <a href=\"https://www.wired.com/story/google-new-pixel-watch-3-can-detect-a-loss-of-pulse/\" target=\"_blank\" rel=\"noopener\">Loss of Pulse</a> detection, ECG, and skin temperature tracking. It also introduces four Health Guardian tools that have undergone clinical validation and will be available in September: Insulin Resistance Trends, Blood Pressure Trends, <a href=\"https://www.wired.com/story/googles-pixel-watch-5-can-now-detect-breathing-emergencies/\" target=\"_blank\" rel=\"noopener\">Breathing Emergency Detection</a>, and Sleep Breathing Quality Trends.</p><p>Insulin Resistance Trends analyzes weeks of physiological data to identify shifts in metabolic health without requiring a blood draw. The watch can also passively track pulse and motion patterns throughout the month to estimate blood pressure trends without manual calibration. Breathing Emergency Detection monitors blood oxygen levels for potentially dangerous drops and, if you become unresponsive, can automatically contact emergency services.</p><p>Lastly, Sleep Breathing Quality uses minute-by-minute variations in blood oxygen levels to understand your breathing patterns better while you sleep. Every morning, you’ll see how much of the night you spent with optimal breathing, along with a monthly assessment to recognize longer-term trends. Most of these Health Guardian features, except for Breathing Emergency Detection, are more useful for identifying patterns and should not be used for diagnosis. I wasn’t able to evaluate Health Guardian during testing, considering many of these features aren't available yet and they require a month of data before establishing meaningful trends.</p><p>On the topic of slumber, sleep tracking gets a refresh, too. Google says the Pixel Watch 5 is 15 percent more accurate at tracking sleep than its predecessor. There’s now a dedicated Bedtime Mode that silences notifications, disables the always-on display, simplifies the watch face, and adds a red tint designed to be easier on your eyes in the dark. If you enable the setting, the watch can also automatically pause media when it detects that you’ve fallen asleep.</p><p>Smart Wake Alarms aim to wake you during a 30-minute window when you’re in your lightest stage of sleep. This is one of those features that will depend on your personal preference. I value every last minute of sleep, and I find that Smart Wake inevitably wakes me earlier than I want. It’s also worth remembering that sleep-stage tracking is better as a way to identify long-term patterns than as a precise measurement, which makes me a little skeptical of Smart Wake’s accuracy.</p>"},{"title":"GTA 6 footage once again appears to leak online, this time because of a group that wants games like The Crew to have offline modes and the end of digital preorders","source":"Rock Paper Shotgun","author":"Oisin Kuhnke","url":"https://www.rockpapershotgun.com/gta-6-footage-once-again-appears-to-leak-online-this-time-because-of-a-group-that-wants-games-like-the-crew-to-have-offline-modes-and-the-end-of-digital-preorders","category":"gaming","categoryLabel":"Gaming","wordCount":508,"readingTime":3,"content":"<p>Their priorities are straight at least</p>\n    \n  \n  \n  \n\n            <p>\r\nYeah, it's happened again: some <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto-vi\" target=\"_blank\" rel=\"noopener\">GTA 6</a> bits appear to have leaked. I'm not going to link to any of them for I hope obvious reasons, as well as the fact I don't want John Rockstar to send me an email wagging their virtual finger at me. But, having seen them, they do seem to be legit, consisting of a couple of clips and a handful of screenshots showing the in-game map.\r\n</p>\n<p>\r\nDon't worry too much about spoilers when it comes to the footage. One shows one of the game's protagonists, Jason Duval, playing some basketball at his home. Nothing particularly complicated or revealing can be seen in this one outside of the fact there's two money counters, whatever that may mean, and that playing basketball builds up your focus stat. The other clip just shows essentially what every single person who has ever played a GTA game has done: driving a slightly destroyed car, crashing it, and getting into a fight.\r\n</p>\n<p>\r\nThe aforementioned images show what looks to be the full Leonida map, so I suppose that's slightly more spoilery. These leaks seemingly come from a group called Cyberleek, who shared a trio of commandments that they want the games industry to follow, in part because of Take-Two only releasing the game digitally. They also namecheck <a href=\"https://www.rockpapershotgun.com/games/the-crew\" target=\"_blank\" rel=\"noopener\">The Crew</a>, a Ubisoft game notable for being the driving force (pun intended) Stop Killing Games, the pro consumer movement that seeks to ensure all online games have an offline mode in case servers are ever shut down.\r\n</p>\n<p>\r\nI'm not going to directly link to anything Cyberleek have posted, but to summarise their three commandments, it's that they want the end of digital preorders, the end of single-player DLC that's \"already present in the base game files the consumer purchased,\" and that single-player games shall be preserved by the release of a patch to ensure they're always playable offline.\r\n</p><p>\r\n\"These three commandments are the floor - not the ceiling - of what is acceptable,\" Cyberleek write at the end of their statement. \"If publishers violate them, they will be targeted. Cyberleek will continue to disrupt their operations until they issue a public statement and apology with a concrete commitment to fix the harm they caused… Publishers should beware. If Cyberleek can reach Rockstar, no one is safe. This is a message to all big corpo: behave, or be the next target.\"\r\n</p>\n<p>\r\nIt is worth noting that there isn't anything substantial to these GTA 6 leaks, nothing that could necessarily hurt the game that <a href=\"https://www.eurogamer.net/gta-6-pre-orders-ultimate-edition-100-dollars\" target=\"_blank\" rel=\"noopener\">most people are pre-ordering the more expensive edition of</a>. Still, I'd also like it if discs didn't die out! But more importantly right now, make sure you take note of what fired Rockstar workers are asking us to do right now: <a href=\"https://www.rockpapershotgun.com/rather-than-calling-for-gta-6-boycott-fired-rockstar-workers-urge-players-to-support-them-in-their-legal-battle-against-the-studio-by-buying-union-merch\" target=\"_blank\" rel=\"noopener\">support their legal battle against the studio by buying union merch</a>. Seems like a much better use of your time than hunting for clips of a game you'll see thousands of clips of in a few months time.\n</p>"},{"title":"New York’s Hottest Club Is . . . the Jacob Riis Bathhouse?","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/24/new-yorks-hottest-club-is-the-jacob-riis-bathhouse","category":"fun","categoryLabel":"Interesting Reads","wordCount":671,"readingTime":4,"content":"<p>Say what you will about Robert Moses, but the man had an eye for bathhouses. For Jones Beach, he insisted on expensive brick for his “people’s palaces” because it complemented the sand. His follow-up, a giant Art Deco complex in Jacob Riis Park, in the Rockaways, introduced generous amenities to Depression-era New Yorkers: a solarium, an open-air dance floor, a skating rink. After the city ceded control of Riis to the federal government, in the nineteen-seventies, the monument to public recreation was shuttered. Since then, it has lain dormant, hovering over the People’s Beach like a ruin.</p><p>This month, the Jacob Riis Bathhouse is reopening as the Rockaway Ocean Club. The project began with the firm behind Brooklyn Bazaar, which once threw warehouse parties in Williamsburg and now runs some boardwalk concessions. Overhauling the historic building required eighty-eight million dollars in investment, along with some upscaling of the original mission. A portion of the complex is now a private club, with members-only access to a new pool, a co-working space, and other perks. Annual memberships start at two thousand dollars, not including a hefty joining fee. The club offers discounts for locals and people under thirty. To some on the peninsula, the rescue was a betrayal.</p><p>“It seems like the government is selling off our public property,” Janet Fash, a Rockaway resident and the city’s first female chief lifeguard, said the other day. The club had reached out to Fash, who is sixty-six, about hosting a reading of her new memoir, “Lifeguard: A Love Story.” A few days before the soft opening, a tour was arranged for Fash and her husband, Bob.</p><p>Ursula Damani, a co-owner of the club, was leading the tour and had been trying to get ahead of the criticism. “People keep talking about how the bathhouse was free, it was public,” she said near the entrance. “But actually it wasn’t free.” She stopped at some original limestone ticket windows, where beachgoers once paid a quarter for a locker or fifty cents for a dressing room.</p><p>Fash, who had on a turquoise bucket hat and a floral-print dress, read from a plaque, dated 1932: “Erected by the city of New York for the recreation of its citizens.”</p><p>“This has guided everything in our project,” Damani said. They passed through a courtyard into a restaurant that will serve Mediterranean cuisine. Bob, who wore a polo with the logo of an F.D.N.Y. motorcycle club, asked about the dress code. “We just had this conversation about whether we’re requiring shoes,” Damani said. “We have to, because of insurance.”</p><p>When the government took over Riis, the east wing of the crumbling bathhouse was given over to the National Park Service lifeguards. “People joked the chief lifeguard used it like it was his garage,” Fash said. She recalled going to parties in the asbestos-filled building as a teen-ager: “All the Rockaway girls would come. One night there was nitrous. Everyone was talking like a duck.”</p><p>After a recent boardwalk heckling incident, Damani said she had been consoled by Fash’s memoir, which traces her long battle against corruption and sexism in the lifeguard union. “I learned that if I give the shit back to them, they respect me,” Damani said.</p><p>On the second floor, a construction crew worked on finishing twenty-eight hotel rooms, set to open next summer. A private lounge, clad in original aquamarine tiles, faced the sea. The shoreline below has been fenced off for more than two years, pending the removal of old wood pilings. “They have not maintained the park,” Fash said. “It doesn’t make sense to me.” Damani blamed bureaucracy, which she said had also delayed the club’s opening: “It took us six years to sign the lease. I’ve probably dealt with every acronym in the federal government.” She was less concerned about a boycott by a coalition representing the beach’s long-standing queer community, which has called the club a “flimsy privatization scheme.” “Once we open and they see <em>this</em>,” she said. “I’m not too worried about it.”</p>"}];

function skipArticle() {

}
