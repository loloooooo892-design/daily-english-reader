<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;

  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;

  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;

  --swap-bg: #EBEEF3;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"The World Isn't Ready for 6K Gaming Monitors","source":"Wired","author":"@wired","url":"https://www.wired.com/review/samsung-g8-g80hs/","category":"tech","categoryLabel":"Technology","wordCount":523,"readingTime":3,"content":"<p>That’s a lot of pixels, and it results in an extremely sharp image. How much of a difference it makes is likely up to your viewing preferences, and perhaps even your visual acuity, but I found the difference obvious and dramatic.</p><p>The thing about sharpness is that it can make virtually everything you view look sharper. The Windows desktop is better. Games are sharper. Photos—if they’re of high quality—are sharper. The only thing that won’t see much improvement is video, as very few video sources exceed 4K resolution.</p><p>And the leap to 6K can solve some persistent visual quality issues in games. Fine objects, like power lines or a chain-link fence, are notoriously difficult for games to render without blocky, jagged aliasing. 6K nearly eliminates the problem, providing a clean and crisp image with extreme detail in even the smallest, finest objects.</p><h2>Too Many Pixels?</h2><p>Unfortunately, 6K has a big downside, too. You need a PC that can actually handle it, and most can’t.</p><p>Modern PCs will generally output 6K without an issue, though if you're on a system more than five years old, you should double-check your available video outputs. Hitting 6K at 165 Hz is a different story, though. You’re going to need a DisplayPort 2.1 output or an HDMI 2.1 output. That’s not rare on new PC hardware, but your PC may lack these ports if it’s more than a few years old.</p><p>Even if you have the required ports, though, rendering a 3D game at 6K resolution is a lot more demanding than rendering a 2D application. As mentioned, it’s a roughly 155 percent increase in pixel count over 4K—and an incredible 10X increase over 1080p.</p><p>Rendering all those extra pixels isn’t easy, and odds are high that your PC can’t handle it in modern games at a playable frame rate and acceptable detail settings. Mine certainly can’t, at least not in demanding titles, and I’m fortunate enough to have a gaming desktop with a recently released AMD Radeon RX 9070 XT graphics card. Most PC gamers aren’t so lucky. Even the mighty <a href=\"https://www.wired.com/review/nvidia-rtx-5090-fe-review/\" target=\"_blank\" rel=\"noopener\">Nvidia RTX 5090</a> is going to struggle if you’re playing path-traced games like <em>Alan Wake 2</em> or <em>Halo Campaign Evolved</em>.</p><p>To be fair, you can play these games at a lower resolution, like 4K, without a hugely bothersome hit to image quality. Modern image upscaling can also make up some of the difference. But if you have to play at 4K or lower to achieve playable frame rates, you’ve lost the 6K monitor’s greatest strength.</p><p>6K resolution can also lead to problems in older games. Titles more than a decade old often have a user interface that targets a lower resolution. Sometimes the UI can’t scale up, which results in tiny icons and text. In other cases the UI can scale up, but the art assets remain at a lower resolution, which leads to a fuzzy and muddy look.</p><h2>LCD in an OLED World</h2><p>On its own, the G80HS’s resolution would be an acceptable compromise. It requires a beefy rig but also delivers unparalleled sharpness. Unfortunately, there’s another problem. The monitor has an IPS-LCD panel.</p>"},{"title":"Robb Moss Is Still Going with the Flow","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/10/robb-moss-is-still-going-with-the-flow","category":"fun","categoryLabel":"Interesting Reads","wordCount":681,"readingTime":4,"content":"<p>In 1978, a Californian named Robb Moss, then twenty-eight, went on a five-week float trip through the Grand Canyon with a bunch of fellow river rats. As an aspiring filmmaker, Moss brought along two cameras (a synch-sound handheld and a Bolex on a tripod he lashed to the stern of a dory) and later cut the footage, much of it of his friends naked on the sand and stone, into a short documentary called “Riverdogs.” The idea was to memorialize a vanishing Eden and the end of his five years of vagabonding, working on rivers, paying no rent. This trip was a last hurrah. “I considered the film to be like a cave painting,” he said recently. “I was commemorating our life, our deeds, as though it was a hunt.”</p><p>Moss was walking along another water course, the Loch, the stream in the Ravine, at the north end of Central Park. He’d just spent a day scouting at Mount Sinai Hospital, for a documentary that he was planning about its neurosurgery department, and he was getting a gulp of greenery before dinner. He is now, at seventy-six, a film professor and former department chair at Harvard, and is a half century (and more than a dozen films) removed from that restless seeker wearing no pants in the Big Ditch. Still, he has a serene aspect that one might guess is the ripening of that rudderless youth—or of what he learned from his subsequent films about its expiration.</p><p>Twenty years after “Riverdogs,” he made “The Same River Twice,” a feature-length update, combining a lot of the 1978 footage with fresh film following five of those riverdogs as they navigate the banalities and indignities of middle age. This film attracted a keen fan base. The past-present juxtapositions—of bodies, circumstances, attitudes, and even film stock—made for a sly and poignant ode to (or lament over) time’s passage. The lives had layers, like the geological strata of the canyon’s walls.</p><p>Eight years ago, Moss returned to those waters a third time. His new movie, “The Bend in the River,” again repurposes the old footage and incorporates new material featuring the same friends, now on the crest of old age. The years are not solely unkind.</p><p>“The Bend in the River” is being screened at Film Forum this month. Moss would love the trilogy to be shown together. “Each film is about the view from there, which was then the view from here,” he said. (He wouldn’t run them chronologically; he’d show “The Same River Twice,” then “Riverdogs,” then “The Bend in the River.”)</p><p>The Ravine, on this evening, was as verdant as the Grand Canyon hundreds of millions of years ago, when it consisted of coastal lowland and swamp. Moss mentioned another film he’d made called “Containment.” “It was about the difficulty of containing nuclear materials for time frames longer than anyone can imagine,” he said. While he was filming, the Fukushima accident occurred, and, two years later, he went to Japan. “Everything was covered in this nuclear dust, a coat of cesium and strontium. It didn’t change the color of the vegetation, but it made the exquisite beauty of it more poignant. That’s what this color green reminds me of.”</p><p>When Moss was seventeen, at Palisades High School in Los Angeles, his brother was drafted and sent to Vietnam. Moss graduated early and began travelling, getting as far as Afghanistan before abandoning a vague plan to go to Vietnam to find his brother. Instead, he went to college, at U.C. Berkeley. It was 1968.</p><p>“After I graduated, I felt that my job was to work against whatever ambitions I had accrued in my first twenty-two years,” Moss said. “Ambition was the handmaiden of the status quo.” So began the untethered era, whose end he celebrated in “Riverdogs.” With an old summer-camp friend, Barry Wasserman, he hitchhiked across the Sahara, south to north, then visited Paris, where he made his first film, a day-in-the-life piece. “It was that diaristic impulse, the urge to film the things around you. How do you know where you are?”</p>"},{"title":"Appendix to Montesquieu’s Day in Court: Recovering a Classical Understanding of Separated Powers Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/montesquieus-day-in-court-appendix/","category":"law","categoryLabel":"Law","wordCount":598,"readingTime":3,"content":"<p>Caption</p><p>Citation</p><p><strong>Pincite(s)</strong></p><p>Learning Res., Inc. v. Trump</p><p>146 S. Ct. 628 (2026)</p><p>683 n.2 (Thomas, J., dissenting); 684 (Thomas, J., dissenting)</p><p>Trump v. CASA</p><p>145 S. Ct. 2540 (2025)</p><p>2598 (Jackson, J., dissenting)</p><p>SEC v. Jarkesy</p><p>144 S. Ct. 2117 (2024)</p><p>2131–32</p><p>CFPB v. Cmty. Fin. Servs. Ass’n of Am.</p><p>144 S. Ct. 1474 (2024)</p><p>1493–94 (Alito, J., dissenting)</p><p>Students for Fair Admissions v. President &amp; Fellows of Harvard Coll.</p><p>143 S. Ct. 2141 (2023)</p><p>2193–94 (Thomas, J., concurring)</p><p>Seila L. LLC v. CFPB</p><p>140 S. Ct. 2183 (2020)</p><p>2226 (Kagan, J., concurring in the judgment with respect to severability and dissenting in part)</p><p>Bostock v. Clayton County</p><p>140 S. Ct. 1731 (2020)</p><p>1824 (Kavanaugh, J., dissenting)</p><p>Patchak v. Zinke</p><p>583 U.S. 244 (2018)</p><p>267 (Roberts, C.J., dissenting)</p><p>Bank Markazi v. Peterson</p><p>578 U.S. 212 (2016)</p><p>238 (Roberts, C.J., dissenting); 241 (Roberts, C.J., dissenting)</p><p>Zivotofsky <em>ex rel.</em> Zivotofsky v. Kerry</p><p>576 U.S. 1 (2015)</p><p>35–36 (Thomas, J., concurring in the judgment in part and dissenting in part)</p><p>Dep’t of Transp. v. Ass’n of Am. R.Rs.</p><p>575 U.S. 43 (2015)</p><p>75 (Thomas, J., concurring in the judgment)</p><p>Perez v. Mortg. Bankers Ass’n</p><p>575 U.S. 92 (2015)</p><p>116–17 (Thomas, J., concurring in the judgment)</p><p>United States v. Windsor</p><p>570 U.S. 744 (2013)</p><p>790 (Scalia, J., dissenting)</p><p>Decker v. Nw. Env’t Def. Ctr.</p><p>568 U.S. 597 (2013)</p><p>619–20 (Scalia, J., concurring in part and dissenting in part)</p><p>Stern v. Marshall</p><p>564 U.S. 462 (2011)</p><p>483</p><p>Talk Am., Inc. v. Mich. Bell Tel. Co.</p><p>564 U.S. 50 (2011)</p><p>68 (Scalia, J., concurring)</p><p>Clinton v. City of New York</p><p>524 U.S. 417 (1998)</p><p>450–51 (Kennedy, J., concurring)</p><p>Loving v. United States</p><p>517 U.S. 748 (1996)</p><p>756–57</p><p>Plaut v. Spendthrift Farm, Inc.</p><p>514 U.S. 211 (1995)</p><p>241–42 (Breyer, J., concurring in the judgment)</p><p>Mistretta v. United States</p><p>488 U.S. 361 (1989)</p><p>394</p><p>Young v. United States <em>ex rel.</em> Vuitton et Fils S.A.</p><p>481 U.S. 787 (1987)</p><p>824 (Scalia, J., concurring in the judgment)</p><p>Bowsher v. Synar</p><p>478 U.S. 714 (1986)</p><p>721–22</p><p>INS v. Chadha</p><p>462 U.S. 919 (1983)</p><p>999 n.25 (White, J., dissenting)</p><p>Nixon v. Adm’r of Gen. Servs.</p><p>433 U.S. 425 (1977)</p><p>442 n.5</p><p>Buckley v. Valeo</p><p>424 U.S. 1 (1976)</p><p>120–21 (per curiam)</p><p>Bronston v. United States</p><p>409 U.S. 352 (1973)</p><p>360</p><p>Scales v. United States</p><p>367 U.S. 203 (1961)</p><p>266–67 (Douglas, J., dissenting); 273–74 (Douglas, J., dissenting)</p><p>Dennis v. United States</p><p>341 U.S. 494 (1951)</p><p>590 n.5 (Douglas, J., dissenting)</p><p><em>In re</em> Oliver</p><p>333 U.S. 257 (1948)</p><p>269 n.23</p><p>Cramer v. United States</p><p>325 U.S. 1 (1945)</p><p>15 n.21; 24</p><p>Myers v. United States</p><p>272 U.S. 52 (1926)</p><p>116; 230 (McReynolds, J., dissenting); 234 (McReynolds, J., dissenting)</p><p>Farrington v. Tennessee</p><p>95 U.S. 679 (1877)</p><p>682</p><p>Trist v. Child</p><p>88 U.S. (21 Wall.) 441 (1874)</p><p>450 n.†</p><p><em>Ex parte</em> Garland</p><p>71 U.S. (4 Wall.) 333 (1866)</p><p>388 (Miller, J., dissenting)</p><p><em>Ex parte</em> Milligan</p><p>71 U.S. (4 Wall.) 2 (1866)</p><p>65</p><p>Teal v. Felton</p><p>53 U.S. (12 How.) 284 (1851)</p><p>287–88</p><p>United States v. Wood</p><p>39 U.S. (14 Pet.) 430 (1840)</p><p>437–38</p><p>Bank of Augusta v. Earle</p><p>38 U.S. (13 Pet.) 519 (1839)</p><p>538</p><p>Rhode Island v. Massachusetts</p><p>37 U.S. (12 Pet.) 657 (1838)</p><p>691</p><p>Jackson v. Ashton</p><p>36 U.S. (11 Pet.) 229 (1837)</p><p>239</p><p>Johnson v. M‘Intosh</p><p>21 U.S. (8 Wheat.) 543 (1823)</p><p>567 &amp; n.a; 569–70; 570 n.a</p><p>Green v. Biddle</p><p>21 U.S. (8 Wheat.) 1 (1823)</p><p>36</p><p>Brown v. United States</p><p>12 U.S. (8 Cranch) 110 (1814)</p><p>113–14; 145</p><p>Fletcher v. Peck</p><p>10 U.S. (6 Cranch) 87 (1810)</p><p>121</p><p>Cooper v. Telfair</p><p>4 U.S. (4 Dall.) 14 (1800)</p><p>17–18</p>"},{"title":"Repair sick robots and contemplate the role of healthcare providers in the deeply textured, pixel art, cyberpunk visual novel All Our Broken Parts","source":"Rock Paper Shotgun","author":"Oisin Kuhnke","url":"https://www.rockpapershotgun.com/repair-sick-robots-and-contemplate-the-role-of-healthcare-providers-in-the-deeply-textured-pixel-art-cyberpunk-visual-novel-all-our-broken-parts","category":"gaming","categoryLabel":"Gaming","wordCount":538,"readingTime":3,"content":"<p>What's up ripperdoc?</p>\n    \n  \n  \n  \n  \n            <p>\r\nAll Our Broken Parts is a game that is a lot to take in almost out the gate. It's a cyberpunk <a href=\"https://www.rockpapershotgun.com/the-10-best-visual-novels-on-pc\" target=\"_blank\" rel=\"noopener\">visual novel</a> with resplendently detailed pixel art where you play as a robot doctor taking care of other robots, each with their own unique affliction. Oh, and humans have disappeared, the ocean doesn't exist anymore, and after a medical mishap, you've been forced into a tiny clinic with not much going for you.\r\n</p>\n<p>\r\nAfter a mysterious and atmospheric opening, you fairly quickly come across your first patient. It (everyone is referred to with \"it,\" seemingly implying something of a post-gender world) is a robot like you, but one who draws for living, forced into getting a checkup by its unkind manager. Only inside of its left eye is another sort of consciousness that is entirely dedicated to drawing, meaning it doesn't have to do any of the processing work, just the physical act, a textual and metaphorical representation of generative AI, installed in the name of efficiency.\r\n</p>\n<p><a href=\"https://www.youtube.com/watch?v=DiD-_G7gpzA\" target=\"_blank\" rel=\"noopener\">Watch on YouTube</a></p><p>\r\nThe problem it faces is that the eyeball consciousness can't get the colours right, so you have to diagnose the main unit. This brings us to an electrically tactile interface where the back of the given robot's head is opened up for us to diagnose. A wirejack allows us to plug into various sections, so you insert it into the unit's own eye and find that it sees everything in black and white, a normal side effect of having the drawing unit installed. What's abnormal is that the main unit can remember what colours look like, so you inspect its memories to see where specific colours come from.\r\n</p><p>\r\nTactility continues here, as strips of perforated paper denoting those memories are insertable into a separate machine, reels of film revealing remembrances. You figure out that you need to sever the memory bridge of the main unit so that it can't recall colour any more. It agrees, all so that it can perform better at its place of work. You meet it outside later, the robot's dialogue steeped in regret, but work is work. You feel like crap.\r\n</p>\n<p>\r\nThere is so much to unpack here, that I don't really think I have time to totally explore in a single post. The intersection of memory and artistic ambitions being overruled by the need to bring results to your employer. The role the healthcare system has in not offering a solution suitable for the individual's emotional needs, but for their material ones; not getting fired (or in this world, recycled), paying rent. And all of this is wrapped up in such deeply textured pixel art, the feeling of the world compelling emanating from the screen instantly.\r\n</p>\n<p>\r\nI do have some criticisms, amongst all of my appreciation for the themes on display. Some of the dialogue could do with some punching up, the non-diegetic UI feels slightly underdeveloped compared to the diegetic pieces, and the actual repairing process can feel a touch sluggish at times. But all of its positives presented in the demo outweigh the negatives, and have left me hungry for more. You can try out All Our Broken Parts for yourself on Steam right <a href=\"https://store.steampowered.com/app/3473430/All_Our_Broken_Parts/\" target=\"_blank\" rel=\"noopener\">here</a>.\n</p>"}];

    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
