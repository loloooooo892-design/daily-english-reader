<style>

  --swap-bg-hover: #DDE2EA;

    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"BMW is taking on Tesla’s FSD with urban driver assist starting in 2027","source":"The Verge","author":"Andrew J. Hawkins","url":"https://www.theverge.com/transportation/1024616/bmw-level-2-city-driver-assist-2027","category":"tech","categoryLabel":"Technology","wordCount":545,"readingTime":3,"content":"<p><a href=\"http://newsroom.bmwgroup.com/global/bmw-to-expand-urban-driver-assistance-functions-from-2027/\" target=\"_blank\" rel=\"noopener\">BMW says</a> that it will expand its navigation-guided, partially automated driving capabilities into urban environments starting in 2027, launching first in Germany with other markets to follow.</p><p>The new system can help steer, speed up, and slow down the vehicle on both highways and city streets using its built-in GPS navigation. While driving in town, it can assist with changing lanes, making turns, yielding to other cars, and driving through roundabouts. But as a Level 2 driver assist system, it still requires drivers to keep their eyes on the road and stay ready to take over at any moment. On the highway, BMW will allow drivers to remove their hands from the steering wheel — but on local roads, they’ll need to keep their hands on the wheel.</p><p>BMW is the latest automaker to commit to releasing a partially autonomous city driving feature to its customers, as the industry races to keep up with Tesla and its Full Self-Driving (FSD) system. BMW, in particular, recently introduced its <a href=\"https://www.theverge.com/transportation/837394/bmw-ix3-first-drive-neue-klasse-specs-price\" target=\"_blank\" rel=\"noopener\">next-generation Neue Klasse platform</a>, which includes a driver assist system <a href=\"https://www.theverge.com/news/771917/qualcomm-bmw-snapdragon-ride-pilot-adas\" target=\"_blank\" rel=\"noopener\">partly powered by Qualcomm’s technology</a>. And with hands-free highway driving now widely available in many mass-market vehicles, the next frontier is a safe and capable city driving feature that rivals FSD.</p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461417.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461418.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461420.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461423.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461424.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DI26_000461426.jpg?quality=90&amp;strip=all\" target=\"_blank\" rel=\"noopener\"></a></p><p><strong>1/6</strong>Image: BMW</p><p>BMW says its system works cooperatively with drivers rather than fighting their control, which means they can steer, brake, or speed up at any point to adjust their driving without shutting the system off. At the same time, the car shows what it sees and what the assistance system is doing right in your line of sight through the heads-up display and in a clear 3D map on the main dashboard screen.</p><p>The necessary cameras and sensors already come built into models like BMW’s 3 Series, 7 Series, X5, iX3, and iX4. BMW can activate the feature through an over-the-air software update. The system follows new European safety rules that let cars suggest and make automated driving moves on city streets for the first time. BMW says that outside experts have already road-tested the setup and confirmed it meets the technical standards, with final official government approval expected in early 2027.</p><p>With more cars equipped with partial automation hitting the road, <a href=\"https://www.theverge.com/2024/11/26/24306519/adas-partial-automation-driver-attention-steering-iihs\" target=\"_blank\" rel=\"noopener\">safety researchers are growing increasingly worried</a> about driver attention and the potential for these systems to cause crashes. There is compelling evidence that, regardless of the company, <a href=\"https://newsroom.aaa.com/2019/12/long-term-use-of-advanced-driver-assistance-technologies-can-result-in-disengaged-drivers/\" target=\"_blank\" rel=\"noopener\">most driver-assist systems are less safe than normal human driving</a>. Drivers tend to develop an overreliance on these systems to drive the car for them — even after a short period of use. And when it’s time to take back control of the vehicle, their reaction times are slower than what’s considered safe.</p><p>BMW is entering risky territory with the adoption of a Level 2 driving feature. Much like Tesla, the company is emphasizing that drivers remain responsible for the vehicle even while using the partially autonomous system in urban environments. Tesla does the same for its FSD feature, but some customers have <a href=\"https://www.theverge.com/news/717754/tesla-autopilot-crash-liable-jury-trial-damages\" target=\"_blank\" rel=\"noopener\">successfully argued in court</a> that the company bears some responsibility for crashes when they occur.</p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Andrew J. Hawkins</li></ul>"},{"title":"New Jersey, the Diesel State","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/11/09/new-jersey-the-diesel-state","category":"fun","categoryLabel":"Interesting Reads","wordCount":816,"readingTime":5,"content":"<p>For people who worry about the health of the New Jersey Meadowlands, the giant tidal estuary that is the brackish heart of the Hudson-Raritan watershed, it was a complicated summer. During the <em>FIFA</em> World Cup, MetLife Stadium, built on what was once essentially an island in the middle of marshes, was described by organizers as being in a mythical-sounding land called “New York New Jersey.” Then, last month, five thousand gallons of diesel leaked from a Secaucus data center that nobody really knew was there into a creek just off the Hackensack River, and suddenly, as guys in hazmat suits swarmed the noxious water, it was back to seeing the Meadowlands as both properly in New Jersey and a dumping ground.</p><p>Even New Jersey’s environmental officials downplayed the spill’s impact. But not Bill Sheehan, the Hackensack Riverkeeper. “The people talking for the people who spilled the diesel are saying that none of it got out here in the river,” Sheehan said the other day, as he floated up the Hackensack on a thirty-foot pontoon boat. He was nearing some orange booms that blocked the entrance to Anderson Creek Marsh, at the mouth of the contaminated waterway. “I don’t know how that’s possible, since it took them something like fourteen hours to get these booms set up.”</p><p>It was nearly high tide, and Sheehan was taking two scientists out to perform water-quality readings. Born and raised in Secaucus, Sheehan, who is seventy-seven and founded the Hackensack Riverkeeper advocacy organization in 1997, was wearing a hoodie and aviators; his white hair and horseshoe mustache made his silver hoop earring read “pirate.” As the scientists readied their monitoring devices, Sheehan steered, cranking classic rock on the boat’s radio. The floating booms, to starboard, looked like flimsy protection against the spill. “I know data centers are suddenly the cause célèbre, or whatever,” he said. “But the damn thing was over there for twenty-five years and nobody cared, and nobody told me about the danger. I thought Data was a character on ‘Star Trek’!”</p><p>He headed upriver to the testing sites. The scientists ducked as the boat floated beneath a rusty drawbridge, completed in 1911 and designed by Joseph Strauss, the Golden Gate Bridge’s chief engineer. Picking up speed, Sheehan noted a fourteen-story hotel—windows all broken, rooms gutted. “It used to be the Crowne Plaza,” he said. “I busted them because I found out they were dumping raw sewage in the river three times a week. They pled guilty, and took the Crowne Plaza name off it.” Lately, he’s been hearing that it will be “a Class A hotel.” “We’ll see,” he said.</p><p>Sheehan steered north, past the American Dream mall, a liquid-natural-gas plant, ospreys and great-blue herons, the Moonachie and Bashes Creeks, Secaucus High School, the Mill Creek Marsh and park, a Bloomberg Radio tower, a power plant, and a tiny tugboat. Offshore from the Vince Lombardi Service Area, two fishermen were in a motorboat.</p><p>“Ahoy!” Sheehan shouted.</p><p>“Whatever you catch, don’t eat it!” one of the scientists added.</p><p>“In the seventies, there were maybe, like, half a dozen species of fish that could survive in here,” Sheehan said. “And now we’ve got well over seventy species, with striped bass up to thirty-five pounds being caught on a pretty regular basis.”</p><p>The radio played Zeppelin, Petty, and Bruce as the scientists took readings under a Route 46 bridge. The temperature and the dissolved-oxygen levels weren’t great, but they weren’t terrible; back at their labs, the scientists would test for nutrients and fecal bacteria. (The lower Hackensack is an E.P.A. Superfund site.) They tested under the Turnpike, near a Bergen County sewage-treatment plant, and then in Kingsland Marsh, a wide tidal wetland filled with delicate spartina grass, which marks good food and habitat for aquatic life of even the most microscopic kind. The marsh had the day’s best readings; being there felt like being on Cape Cod.</p><p>Back in Secaucus, Sheehan let the scientists off at a dock. He was frustrated with the newfound outrage over data centers, which he reckoned had more to do with utility bills than with larger water-quality concerns. He planned to urge the state to file a Natural Resource Damage claim, as it had in 1994, after a barge carrying more than three hundred thousand gallons of caustic-soda solution overturned. “That’s the active ingredient in Drano,” he said. Settlements for that spill—combined with settlements for groundwater chromium contamination and for an Exxon oil spill in the Arthur Kill—restored wetlands in Jersey City. A former dump got rehabilitated. “We also got a nine-hole public golf course, for people that want to shoot white balls around for no good reason, at the princely sum of about thirty dollars a round,” Sheehan said. “On the Hudson River side, they’ve got to pay half a million dollars to join those clubs. I call this one the People’s Golf Course.” ♦</p>"},{"title":"Romero Games has a new publisher for the game Xbox abandoned, but its 110-person team is now just 16 devs: 'I needed to basically design a new game that could use as much of that stuff as possible'","source":"PC Gamer","author":"Ted Litchfield","url":"https://www.pcgamer.com/games/fps/romero-games-has-a-new-publisher-for-the-game-xbox-abandoned-but-its-110-person-team-is-now-just-16-devs-i-needed-to-basically-design-a-new-game-that-could-use-as-much-of-that-stuff-as-possible/","category":"gaming","categoryLabel":"Gaming","wordCount":829,"readingTime":5,"content":"<p>In a new interview with <a href=\"https://www.videogameschronicle.com/news/john-romero-confirms-his-axed-xbox-game-has-a-new-publisher-and-hes-rehired-some-staff/\" target=\"_blank\" rel=\"noopener\">VGC</a>, FPS legend John Romero revealed how things were going at Romero Games, the studio he leads alongside his wife, veteran designer Brenda Romero. After its unannounced shooter project was <a href=\"https://www.pcgamer.com/gaming-industry/legendary-fps-developer-john-romero-says-his-studio-survived-the-cancellation-of-our-huge-game-and-its-shooter-project-will-be-new-to-people-the-way-that-going-through-elden-ring-was-a-really-new-experience/\" target=\"_blank\" rel=\"noopener\">canceled by Xbox last year</a>, Romero Games managed to secure a new publisher, but there's a catch: The team is now only a tenth the size it was while funded by Xbox. Romero says they've rescoped to use the material they already had on a smaller, more focused game.</p>\n\n<p>\"Last year we basically got defunded, like a lot of people did, and so we had to spend time figuring out what we were going to do. Eventually we decided that we can’t keep everybody on forever, and we kept them on as long as we could, trying to find funding to finish the game, keep everybody there, but as time goes on and people leave you can’t build that game again.</p><p>\"So we went down to five people, we had this big game that we had made. We 100% own everything. We own the name, we own all the IP, all the art, all the graphics, the code and everything. And so I needed to basically design a new game that could use as much of that stuff as possible, to just basically get a head start.</p><p>\"I just contacted somebody that I knew, and we basically did a deal, and so we have a new publisher. Can’t say anything about who it is, or when the announce is, or any of that stuff.</p><p>\"We don’t need to be bigger than [The 15-16 people team the studio has now], the game is scoped for a team that size, and we’re just super happy. The game’s going extremely well, we’re very happy with it. It’s a shooter⁠—that part totally makes sense⁠—but everything else around it is really new, and everybody on the team is so excited. We’re very excited with how the game is turning out.</p><p>\"We’re not getting [the project's original form] to the end. That game we can’t get to the end, because it’s a 110-person game. So this is a complete redesign of a totally different game, but it uses a lot of the work that we had in the previous games.</p><p>\"As far as I’m concerned, I love small teams, and it’s way more fun making games on small teams. You can pivot⁠—in hours you can completely pivot everything if you have to.</p><p>\"It’s also the deal that we have … Every publisher has various things that they put in the contract. And most of the time you’re working with the publisher to make the game that they believe will make money, and that your vision is going to hopefully meet at the same point of making money.</p><p>\"A lot of times the publisher changes what your game is going to be because they have a specialization, or they know something you don’t, and they want to steer you in a certain direction because of whoever they are. The publisher we’re with right now has zero creative goals for this game. They’re like 'you make what you want, we’re publishing it, we’re not going to tell you what to make.' That’s the perfect deal.\"</p>\n\n<p>A lot of what Romero's saying about team size lines up with what I've heard from other developers: There's a liberating quality to creative constraints and small team sizes. This is even more borne out by Romero's own output. His greatest successes (Commander Keen, Wolfenstein, Doom, Sigil) came from smaller teams or even solo development.</p><p>The large and ambitious Quake, meanwhile, <a href=\"https://www.pcgamer.com/games/fps/30-years-after-it-ruined-id-software-quake-gets-another-big-update-while-the-studio-once-again-grapples-with-adversity/\" target=\"_blank\" rel=\"noopener\">taxed id Software to the breaking point</a> and resulted in Romero's departure. Romero's most divisive game, Daikatana, was made with the largest team and most resources he ever had access to.</p><p>All the same, that team size question is still the silver lining in a massive bummer: Given the choice, I don't think Romero would want things to have gone this way if his hand hadn't been forced. If this game comes together, it's a shame that Xbox's fecklessness and the misery of those 95 laid-off developers are part of the story.</p><p>As for who Romero Games' mystery benefactor is, I certainly have my guesses. But rather than engage in baseless speculation, I'm happy to wait and see when the studio's project gets its long-awaited full reveal.</p>\n<p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Ted has been thinking about PC games and bothering anyone who would listen with his thoughts on them ever since he booted up his sister's copy of Neverwinter Nights on the family computer. He is obsessed with all things CRPG and CRPG-adjacent, but has also covered esports, modding, and rare game collecting. When he's not playing or writing about games, you can find Ted lifting weights on his back porch. You can follow Ted on <a href=\"https://bsky.app/profile/dilfpatrol.bsky.social\" target=\"_blank\" rel=\"noopener\">Bluesky</a>.</p>"},{"title":"Supreme Court declines Trump administration's request to intervene in California ballot dispute","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-intervene-in-california-ballots-dispute/","category":"law","categoryLabel":"Law","wordCount":531,"readingTime":3,"content":"<p>The Trump administration on Monday morning <a href=\"https://www.scotusblog.com/cases/united-states-v-california-2/\" target=\"_blank\" rel=\"noopener\">asked</a> the Supreme Court to intervene in its efforts to keep California from counting ballots cast by what it contends are more than 20,000 noncitizens who have registered to vote in that state. In a brief, unsigned order released to reporters shortly before 6 p.m., however, the court turned down the government's request. There were no noted dissents.</p><p>In a <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A624/431463/20261102111302952_California%20Application.pdf\" target=\"_blank\" rel=\"noopener\">19-page filing</a>, U.S. Solicitor General D. John Sauer requested an order from the justices that would require California to keep those ballots separate until the voters’ citizenship could be verified. “Once California commingles the challenged ballots with lawful ones,” Sauer wrote, “there is no way to get the challenged ballots back.”</p><p>The filing was the latest chapter in the Trump administration’s push to combat alleged voter fraud. It began last month, when the administration went to federal court in Los Angeles, seeking an order directing the state not to send ballots to, or count the ballots of, voters who were likely not citizens.</p><p>On Oct. 28, U.S. District Judge David Carter <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cacd.1043513/gov.uscourts.cacd.1043513.149.0.pdf\" target=\"_blank\" rel=\"noopener\">turned down</a> the government’s request for a temporary order directing California to sequester the ballots of “likely noncitizens.” Among other things, he questioned the credibility of the Trump administration’s allegations that the voters it had identified were not U.S. citizens. On Friday, the U.S. Court of Appeals for the 9th Circuit also <a href=\"https://cdn.ca9.uscourts.gov/datastore/opinions/2026/10/30/26-7231.pdf\" target=\"_blank\" rel=\"noopener\">rejected</a> the Trump administration’s motion for emergency relief.</p><p>With the midterm elections now just one day away, the Trump administration sought relief next in the Supreme Court. Sauer argued that the government is likely to prevail on the merits of its claim – a key factor that courts consider in deciding whether to grant temporary relief – because federal law bars anyone who is not a U.S. citizen from voting in federal elections. Therefore, he wrote, “it follows that any ballot cast by an alien is unlawful” and states cannot count them.</p><p>The United States will also suffer permanent harm (another factor that courts consider in deciding whether to award temporary relief), Sauer continued, because “‘California admits that there is no way to trace a ballot after it is processed.’” The government’s “injury will continue to mount,” Sauer contended, “through Tuesday, November 10 (a week after election day, California’s deadline for receiving mail ballots.)”</p><p>By contrast, Sauer said, California will not suffer “undue hardship” from having to sequester the ballots at issue in this case. Indeed, he suggested, “California’s own election laws contemplate the segregation of challenged ballots, and the segregation of challenged ballots is a standard remedy in election cases.”</p><p>Sauer asked the court to also issue an immediate temporary order, known as an administrative injunction, “that requires California to segregate mail ballots from persons whom the United States has identified as likely noncitizens” while the justices consider the government’s request.</p><p>The Trump administration’s filing went first to Justice Elena Kagan, who has primary responsibility for emergency appeals from the 9th Circuit. Kagan then referred it to the full court, which declined the Trump administration’s request.</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Supreme Court declines Trump administration's request to intervene in California ballot dispute</em>, SCOTUSblog (Nov. 2, 2026, 1:33 PM), https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-intervene-in-california-ballots-dispute/</p>"}];
