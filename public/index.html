*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;

  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }

var articles = [{"title":"There are less than 48 hours to save up to $300 on your TechCrunch Disrupt 2026 ticket ","source":"TechCrunch","author":"TechCrunch Events","url":"https://techcrunch.com/2026/08/20/there-are-less-than-48-hours-to-save-up-to-300-on-your-techcrunch-disrupt-2026-ticket/","category":"tech","categoryLabel":"Technology","wordCount":614,"readingTime":4,"content":"<p>The lowest prices for <a href=\"https://techcrunch.com/events/techcrunch-disrupt/\" target=\"_blank\" rel=\"noopener\">TechCrunch Disrupt 2026</a> end in just a few days, this Friday, August 21 at 11:59 p.m. PT. Once that window closes, your chance to <a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?utm_source=tc&amp;utm_medium=post&amp;utm_campaign=disrupt2026&amp;utm_content=rb&amp;promo=post_rbend&amp;display=\" target=\"_blank\" rel=\"noopener\">save up to $300 on your pass</a>, or get an even larger discount on group pricing, will come to an end.</p>\n<p>If you’ve been circling around Disrupt, then <a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?utm_source=tc&amp;utm_medium=post&amp;utm_campaign=disrupt2026&amp;utm_content=rb&amp;promo=post_rbend&amp;display=\" target=\"_blank\" rel=\"noopener\">now’s the best time to lock in your pass</a> and start getting ready to join the rest of the startup community gathering in San Francisco from October 13-15 at Moscone West!   </p>\n<p>If Disrupt has been on your radar, <strong>now is the time to lock in your pass</strong> before Friday’s deadline.</p>\n<h2><strong>TechCrunch Disrupt: Where the startup ecosystem moves forward</strong></h2>\n<p>Each year, TechCrunch Disrupt brings together more than 10,000 founders, investors, and startup community members, driving innovation forward. And for our event this year, you’ll find a keen focus on building and developing in the AI era across all of our stages of programming. If you want to be on the cutting edge running into 2027, this is the event for you.</p>\n<p>And you don’t have to be a founder to get value out of Disrupt. Whether you’re raising capital, scouting investments, hiring talent, launching a startup, or building strategic partnerships, Disrupt puts you in the middle of the conversations shaping what’s next and can help you make the connections that propel your next year of growth. </p>\n<p>Here’s just a glimpse of what you gain by attending:</p>\n<ul>\n<li><strong>Actionable insights</strong> from founders, operators, and VCs actively building and investing in today’s market. Our agenda features a wide range of topics, curated to focus on insights that lead to action.</li>\n<li><strong>Direct access to investors</strong> looking for their next portfolio company and founders seeking the right partners. Plus, you can get AI-powered networking opportunities through our app or take deeper dives through our many Side Events.</li>\n<li><strong>Early visibility</strong> into emerging technologies and startups before they break into the mainstream through our Exhibit Hall.</li>\n<li><strong>High-value connections</strong> that lead to funding, partnerships, customers, and career opportunities. Disrupt is about growth, both for startups and yourself!</li>\n</ul>\n<h2>What’s new at TechCrunch Disrupt 2026</h2>\n<p>Keeping that focus on building companies in the AI era in mind, <a href=\"https://techcrunch.com/events/techcrunch-disrupt/agenda/\" target=\"_blank\" rel=\"noopener\">we have a great slate of new stages and programming</a> to inspire and educate:</p>\n<ul>\n<li><strong><a href=\"https://techcrunch.com/2026/08/05/techcrunch-disrupt-2026s-real-world-ai-stage-features-robots-automated-factories-and-extinct-animals/\" target=\"_blank\" rel=\"noopener\">Real World AI Stage</a>: </strong>AI is moving beyond the screen and into the physical world. Explore how robotics, autonomous systems, manufacturing, healthcare, and defense are turning AI breakthroughs into real-world products and businesses.</li>\n<li><strong><a href=\"https://techcrunch.com/2026/07/24/techcrunch-disrupt-2026s-new-smart-money-stage-explores-fintech-payments-ai-and-everything-between/\" target=\"_blank\" rel=\"noopener\">Smart Money Stage</a>: </strong>Follow the money. From fintech to stablecoins to payments, embedded finance, and AI-driven financial services, this stage explores how technology is reshaping the movement of capital.</li>\n<li><strong><a href=\"https://techcrunch.com/2026/07/27/power-up-your-ai-infrastructure-a-first-look-at-the-smart-systems-stage-agenda-at-techcrunch-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">Smart Systems Stage</a>:</strong> Every AI breakthrough depends on the infrastructure behind it. Discover the innovations in chips, compute, energy, networking, and data centers that will determine the next generation of technology companies.</li>\n</ul>\n<p>Our <a href=\"https://techcrunch.com/2026/07/30/techcrunch-disrupt-2026s-biggest-stage-features-leaders-from-amazon-replit-tether-with-much-more-to-come/\" target=\"_blank\" rel=\"noopener\">Disrupt</a>, <a href=\"https://techcrunch.com/2026/07/29/discover-whats-next-for-ai-from-the-saas-reckoning-to-the-agent-security-gap-at-techcrunch-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">AI</a>, and <a href=\"https://techcrunch.com/2026/07/01/builders-stage-agenda-revealed-practical-strategies-for-scaling-startups-at-techcrunch-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">Builders</a> Stages are also returning this year, and we have excellent speakers joining us across them all: </p>\n<ul>\n<li><a href=\"https://techcrunch.com/2026/08/11/rivian-ceo-rj-scaringe-is-betting-on-evs-robots-and-autonomy-all-at-once-hell-explain-why-at-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">Rivian CEO and founder RJ Scaringe</a></li>\n<li><a href=\"https://techcrunch.com/2026/08/11/what-comes-after-the-smartphone-amazons-panos-panay-will-make-his-case-at-techcrunch-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">Amazon SVP of Devices, Alexa and Leo, Panos Panay</a></li>\n<li><a href=\"https://techcrunch.com/2026/08/13/can-social-media-start-over-blueskys-ceo-and-coo-deliver-their-case-at-techcrunch-disrupt-2026/\" target=\"_blank\" rel=\"noopener\">Bluesky CEO Toni Schneider and COO Rose Wang</a></li>\n</ul>\n<p>You can <a href=\"https://techcrunch.com/events/techcrunch-disrupt/speakers/\" target=\"_blank\" rel=\"noopener\">explore the rest of our extensive speaker lineup right here</a>! </p>\n<h2>Don’t miss out on the best TechCrunch Disrupt’s prices!</h2>\n<p>This is your last chance to save before rates increase, so <a href=\"https://techcrunch.com/events/techcrunch-disrupt/tickets/?utm_source=tc&amp;utm_medium=post&amp;utm_campaign=disrupt2026&amp;utm_content=rb&amp;promo=post_rbend&amp;display=\" target=\"_blank\" rel=\"noopener\">lock in your pass before Friday, August 21 at 11:59 p.m. PT to get the best prices</a>, whether you’re a student looking to get their introduction to the community or an established investor in search of an untapped opportunity. </p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Three Books That Will Transport You","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/three-books-that-will-transport-you","category":"fun","categoryLabel":"Interesting Reads","wordCount":802,"readingTime":5,"content":"<p><strong>I’m going through a phase lately</strong> where almost everything reminds me of “<a href=\"https://www.poetryfoundation.org/poems/43285/adams-curse\" target=\"_blank\" rel=\"noopener\">Adam’s Curse</a>,” by William Butler Yeats. The poem is about how our most worthwhile pursuits—things like art, love, and beauty—often seem to demand a measure of toil. Or, as a woman in the poem wistfully puts it, how “we must labour to be beautiful.” The speaker reflects that “I strove / To love you in the old high way of love.” He sounds tired from the effort.</p><p>Then I read my colleague <a href=\"https://www.newyorker.com/culture/essay/our-longing-for-inconvenience\" target=\"_blank\" rel=\"noopener\">Hanif Abdurraqib’s gorgeous essay</a> about our collective longing for inconvenience, in which he discusses a friend who “wants to fall in love <em>the old-fashioned way</em>,” meaning without using a dating app. I thought immediately, “The curse!” Abdurraqib’s point, though, appears to be that the curse might be a blessing in disguise, or at least that our attempts to outrun the curse might be more cursed than the curse itself. (Yeats, proto-friction-maxxer that he seems to be, might agree: the poem ends on the image of a “hollow moon,” an emblem of empty, unsatisfying escapism if there ever was one.)</p><p>So when I was asked, by this newsletter’s editor, to recommend some “transporting” summer reads, I wanted, in the spirit of the curse, to highlight a few books whose transports can’t be separated from their “inconvenient” qualities: unconventionality, abstruseness, even unresolved emotional pain. I hope you love them in the old high way of love.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/613tZGZB2ZvVx8iWDrMX2qh7UjJqds9E1ESsdztYRREa4U9Qn71mVkdNvmdjT55EkKkw5bboQy8iYGGTm8eadTq29gRzrQ946TEG1xWW4W6aovtwA1b2VBRs9LHPGhze89db7U3f8ses9aErhAiXraYYbSo6PUV8PPAZX2YaoaEYf4HxxdMx1hXdNQ72wmA2ex6wiJqxgCW1RP7KdbCqY8FWcWeu9ouwkpT38Zj14Jju64oFVnURp3piGwSBFGnuQTyJQsaF7mNvduKqBiYxw8j7P3x1Le3YAXNk9JuWNnR3Pg86AmGVW7YrVWAm8Q7LFEYi8xWfxVvMTFrzHwrRtifEMLNCGSdgkHBe1J\" target=\"_blank\" rel=\"noopener\">Orbital</a>,” by Samantha Harvey</strong></p><p>Harvey’s novel centers on a group of six astronauts living in an international space station, hundreds of miles above Earth. No crisis hits, aliens don’t attack, the fuel supply is fine. Rather than a conventional setup-climax-dénouement plot, we get eerily domestic moments aboard the shuttle, affecting scraps of the characters’ memories, some of the most dazzling descriptions of light I’ve ever read—imagine Dante’s “Paradiso” with a secular overlay, as if space were simultaneously the seventh heaven and Earth’s untended back yard—and a sense of being out of history and time (“the whipcrack of morning arrives every ninety minutes,” Harvey writes). The novel—an astonishing work of humanism sheathed in an escapist premise—should be required reading for every faux-utopian tech stooge who wants to loot the planet so their A.I. systems can displace and replace people. (Not that I’m mad about it!)</p><p><strong>“<a href=\"https://cna.st/affiliate-link/97eqTt3vVpVUL4DFvYgQ6qDksBTYAg8skFZEtnEbvkjK8wGeRvvnq7Ujmzm7SsW689eiBdkQqJGSGZ8vyDFcLSQtRPQUoPa6PiLmmk7VD6nTDmkbqLzRC97SUh1MxWNsTWHyb8rPpqcALAodhzHov4FQvBtEaH4YJEGMNgdV6zyUN3pMcaw9PU8pXhmnvVY58Z9gqb4VDXsSaK4hyYsSDqRDc3WuXydwc51ETYbURRafveVhQvNeUNB2edToWL4GnkJZss7e5zMvGFcKuJtEPneszJpV9ewdAZbKdMYm3auAJJYojSYeGjP9Tx9oRN8NAwDBruJsXTnBCxaNJPNpn8mDqwRQU2NL7LSf9QBs7iwosWnRk4i1TVDqe\" target=\"_blank\" rel=\"noopener\">The Sense of an Ending</a>,” by Frank Kermode</strong></p><p>My editor recommended this book to me after I pitched her a somewhat convoluted essay idea. She thought Kermode’s formal analysis of delay and catharsis in classic literary texts might be useful. Not only was it <em>highly</em> useful (I abandoned the essay idea), it was thrilling, dense, complex, absorbing—and a real struggle to get through. I had to sit for a long time with individual sentences, in part because they demanded to be reality-tested against my own perceptions and in part because that’s what it took for me to understand them. Such deep concentration caused me to lose track of my surroundings—a true escape.</p><p><strong>“<a href=\"https://cna.st/affiliate-link/4NeJabgQykde5TvvQLrEjFc42QD1eUHxCXjcgy17siFnVHrNjXAV7DcsXceR5dq5bh8jcK4q6jvUQjGeNGbLFua7n67HKC72cDcXY1vEUJdCPospEW3gcaabXv7ZVcAMhK5VSUP8ErZebfRJ3vnoy2jWz94apdSQj4TvCesHjVBJtAwi5S1e68FpdoRq1RRdNdGTnDbejabBgFc5i9chQtHCsTMKURdCx2WENesbTf5wQcQdUayZTjBVYeTSd8Eeu7hHfmqvHirCWHLqPoY1waAQYwoLadFdwqp8Qwb4qKeDdLvScekRDdDJ5bp6amAgMzADXH8RGzbzP1X79oG649N8yjJuQFv6SG\" target=\"_blank\" rel=\"noopener\">A Truce That Is Not Peace</a>,” by Miriam Toews</strong></p><p>This book’s “inciting incident” is that, in order to participate in a conference, Toews has to answer the question “Why do you write?” Her mind returns to two formative events: the deaths, by suicide, of her father and sister, both of whom walked in front of trains. The experience of losing these family members, Toews shows, organizes her art, the way she is always hoping somehow, through language, to resurrect her loved ones, even as she insists she can’t. She expresses a preference for silence over false speech—a scorn for easy fictions is something she shared with her father and sister—but not over true speech, or true writing. Does this memoir, about some of the worst things that can happen to a person, offer escape? Sure—of the kind more commonly known as art.</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Everybody’s talking about:</strong></p><ul><li>“<a href=\"https://www.amazon.com/Life-M-Novel-Rachel-Cusk/dp/0374618380\" target=\"_blank\" rel=\"noopener\">Life of M</a>,” by Rachel Cusk, is among the most anticipated books of the moment. <a href=\"https://www.newyorker.com/magazine/2026/08/24/life-of-m-rachel-cusk-book-review\" target=\"_blank\" rel=\"noopener\">See what our critic Becca Rothfeld has to say about it</a>.</li></ul><p><strong>Coming soon:</strong></p><ul><li>Emma Cline’s “<a href=\"https://www.amazon.com/Switzy-Novel-Emma-Cline/dp/0593595246\" target=\"_blank\" rel=\"noopener\">Switzy</a>,” which is long-listed for a Booker Prize this year, will be out on September 8th. Until then, read an excerpt <a href=\"https://www.newyorker.com/magazine/2026/08/17/the-blight-fiction-emma-cline\" target=\"_blank\" rel=\"noopener\">recently published in <em>The New Yorker</em></a><em>.</em></li><li>John Green is back to fiction, with “<a href=\"https://www.amazon.com/Hollywood-Ending-Signed-John-Green/dp/0525556656\" target=\"_blank\" rel=\"noopener\">Hollywood Ending</a>,” out on September 22nd. It’s about two actors cast in an Andy Warhol bio-pic.</li><li>“<a href=\"https://www.amazon.com/True-Confessions-First-Lady-Freeman/dp/0063383071\" target=\"_blank\" rel=\"noopener\">The True Confessions of First Lady Freeman</a>,” by Deesha Philyaw, is centered on the wife of a megachurch pastor. It’s out September 29th.</li></ul><p><strong>P.S. Have you read</strong> all the books Barack Obama plans to discuss on <a href=\"https://www.audible.com/about/newsroom/president-barack-obama-to-host-a-great-book-on-audible\" target=\"_blank\" rel=\"noopener\">his new podcast</a>? 🎙️</p>"},{"title":"How to get Chromite in Palworld","source":"PC Gamer","author":"Andrea Shearon","url":"https://www.pcgamer.com/games/survival-crafting/palworld-chromite/","category":"gaming","categoryLabel":"Gaming","wordCount":517,"readingTime":3,"content":"<p>Chromite isn't actually rare in <a href=\"https://www.pcgamer.com/palworld/\" target=\"_blank\" rel=\"noopener\">Palworld</a>, but you've got to have a specific tool (or pal) to mine it, which is different from most other resources. To save you from the guesswork, I'll show you how to use a metal detector to get Chromite initially and also a passive farming solution for bigger hauls so you're set up to make your first batch of Hexolite when you're ready.</p><h2>Palworld Chromite location</h2>\n<h3>Prepare for a visit to Feybreak Island </h3>\n\n<p><strong>Chromite is found underground on Feybreak Island</strong>, just south of Mount Obsidian, but you'll need to craft a <strong>Metal Detector or catch a Smokie</strong> to assist in digging it up. Using Smokie's partner skill is the easiest way to farm early on, but I'd recommend crafting a Metal Detector if you have the spare materials. It's expensive to make, but it's much faster and won't take up a pal slot.</p>\n<h3>Use Smokie's partner skill</h3><ul><li>Catch a wild Smokie roaming Feybreak Island</li><li>Craft and equip Smokie's Harness (from the Level 58 tech tree)</li><li>Use the Pal Essence Condenser to improve its skill</li></ul><h3>Craft a Metal Detector</h3><ul><li>Unlock the blueprint from Level 58 on the tech tree</li><li><strong>Requires</strong>: 30 Plasteel, 100 Paldium Fragments, 15 Computers, 20 Nightstar Sand</li></ul><p>The <strong>Metal Detector</strong> is easy to use and automatically scans the soil around you as you explore. If you use <strong>Smokie's partner skill</strong> you've got to spam it by pressing the E key while you walk around instead. When either method detects Chromite, a rocky node (highlighted by a blue beacon) sprouts from the ground. Harvest it with a pickaxe, just like you would any other ore.</p><h2>Easy Chromite farm</h2>\n<h3>Breed Smokies for a passive Chromite farm</h3>\n\n<p>If you don't mind the wait, <strong>passively farm Chromite by hatching little Smokies</strong>. Don't get too attached, because those Dark Eggs are headed to slaughter. Here's the whole process: </p><ol><li>Catch one male and one female Smokie</li><li>Leave them at the Breeding Farm with regular Cake, or use Vegetable Cakes to double up on eggs</li><li>Hatch your continuous supply of Smokie eggs</li><li>Use the Pal Disassembly Conveyor to butcher the Smokies</li><li>Collect the Chromite they leave behind</li></ol><p>It's a grim process, but hey, it works. The remains of every Smokie you put in the conveyor should drop Chromite, so long as you don't mind the wait for eggs it's an easy, passive alternative to hunting down nodes around the map. </p>\n<p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Andrea has been covering games for nearly a decade, picking up bylines at IGN, USA Today, Fanbyte, and Destructoid before joining the PC Gamer team in 2025. She's got a soft spot for older RPGs and is willing to try just about anything with a lovey-dovey \"I can fix them\" romance element. Her weekly to-do always includes a bit of MMO time, endlessly achievement hunting and raiding in Final Fantasy 14. Outside of those staples, she's often got a few survival-crafting games on rotation and loves a good scare in co-op horror games. </p>"},{"title":"Malaysia dispatch: revisiting the ‘To Kill A Movement’ exhibition","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/08/malaysia-dispatch-revisiting-the-to-kill-a-movement-exhibition/","category":"law","categoryLabel":"Law","wordCount":974,"readingTime":5,"content":"<p>On July 29, the Malaysian government <a href=\"https://www.malaymail.com/news/malaysia/2026/07/29/anwar-says-myanmar-agrees-to-accept-5000-rohingya-refugees-from-malaysia/229470#goog_rewarded\" target=\"_blank\" rel=\"noopener\">announced</a> that around 5,000 Rohingya refugees will be repatriated to Myanmar, where they face an obvious risk of persecution or torture. The government later <a href=\"https://www.nst.com.my/news/nation/2026/08/1504749/updated-malaysia-wont-repatriate-myanmar-refugees-if-lives-risk-says#google_vignette\" target=\"_blank\" rel=\"noopener\">clarified</a> that the refugees will not be repatriated if such risks are deemed to be real. But in June, a <a href=\"https://www.sinarharian.com.my/article/782577/berita/semasa/pusat-komas-gesa-changeorg-turunkan-petisyen-cetus-kebencian-terhadap-pelarian-rohingya\" target=\"_blank\" rel=\"noopener\">petition</a> calling for the removal of the Rohingya community from Malaysia had garnered at least 280,000 signatures within one week.</p><p>Rights group Pusat KOMSAS responded to the petition, stating: “Narratives like this deliberately portray the Rohingya community as only taking from the country, while ignoring the fact that many of them contribute to Malaysia’s economy despite living in precarious conditions and facing frequent exploitation.”</p><p>These recent events have rekindled my bittersweet memory of working as a volunteer at an exhibition titled “To Kill A Movement” organized by Amnesty International Malaysia from June 21 to July 5.</p><p>Firstly, it’s a sweet memory because I had the opportunity to network with new people and work alongside them, spending my weekend meaningfully. On the other hand, the memory is somehow tainted by the display of horrific images of the destruction caused by the conflict in Myanmar following the military junta’s coup d’état in 2021.</p><p>The primary purpose of the exhibition was to showcase photos taken by journalists during the conflict in Myanmar and the disturbing images of children being tortured by the military. During the launch of the exhibition, we also had a panel discussion with speakers from diverse backgrounds, including those who had lived the experience.</p><p>The theme “To Kill A Movement” is derived from Myanmar’s long struggle linked to wider movements against authoritarianism across borders. A movement rarely dies in a single blow. Rather, what kills any legitimate movement is persistent repression. The cornering, exhaustion, fracturing, starvation, enforced disappearance, and defamation effectively kill a movement from pursuing its end goal.</p><p>It is heart-wrenching to even visualize the cruelty that the people in Myanmar had to experience merely because they were born Muslims in their country. It provokes me further when Malaysians relentlessly seek the removal of refugees from the country without having regard to the fact that the very removal could not only jeopardize someone’s life but endanger an entire generation.</p><p>This is the reality of today’s humanity that exists not only in Malaysia but in all parts of the world, where geographical privilege renders someone born in a secure country losing sight of the realities of those born in a conflict country. State leaders cannot advocate for justice, equality, and a rules-based order when they actively engage in inhumane actions or are passively complicit in genocide by returning refugees to countries where they face a risk of persecution or torture.</p><p>It is essential to emphasize here that although Malaysia has not ratified <a href=\"https://www.unhcr.org/media/1951-refugee-convention-and-1967-protocol-relating-status-refugees\" target=\"_blank\" rel=\"noopener\">the 1951 Refugee Convention</a>, the principle of non-refoulement is <a href=\"https://www.unhcr.org/my/media/cartagena-declaration-refugees-adopted-colloquium-international-protection-refugees-central\" target=\"_blank\" rel=\"noopener\">universally recognized</a> and obliges all countries to refrain from returning refugees who are at risk of persecution or torture. As the conflict in Myanmar is ongoing, particularly the perpetration of violence against the Rohingya community, Malaysia has an international obligation to provide temporary shelter for the refugees or deport them to a third country where they do not face a risk of persecution or torture.</p><p>Although the exhibition was focused on the destruction caused to the Myanmar community in general, the risk of repatriating the Rohingya community to Myanmar is nonetheless a relevant issue here, as they face an increased risk of torture and persecution during the military junta’s administration.</p><p>Here are some of the pictures that I had taken during the exhibition:</p><p>These pictures show the bombing of residential areas and schools.</p><p>These are pictures of online protesters using flowers as a weapon of defiance.</p><p>These are a few of nearly 1,000 images taken after the abduction, torture, and extrajudicial killing of children, women, and men, and published in military-controlled Telegram channels since 2021.</p><p>These pictures show the systemic targeting of educational and civilian infrastructures, subjecting schools and hospitals to relentless artillery fire and aerial bombardments.</p><p>This is a photo of a soldier being taken care of by a comrade in a bunker following an arm amputation, as most of the hospitals were destroyed in the bombing.</p><p>These cloths hung from the ceiling were an imitation of how htamein, the traditional cloth long associated with women’s daily life, was transformed by women and gender diverse communities as a weapon of defiance and to confront the misogyny and superstition embedded in military power.</p><p>Although Malaysia is not a party to the Refugee Convention, it <a href=\"https://www.unhcr.org/my/where-we-work/countries/malaysia\" target=\"_blank\" rel=\"noopener\">hosts around 181,000</a> refugees and asylum-seekers on humanitarian grounds, with 85 percent of them from the Rohingya community. In July, Malaysia also <a href=\"https://www.freemalaysiatoday.com/category/nation/2026/07/25/refugee-registation-document-initiative-to-start-with-detainees-at-immigration-depots\" target=\"_blank\" rel=\"noopener\">launched</a> a national registration system for refugees and asylum-seekers as the single authoritative registration in the country, aiming to replace the registration system managed by the UNHCR.</p><p>Relatedly, Amnesty International Malaysia’s spokesperson Divya Shesshan <a href=\"https://www.amnesty.my/2026/07/23/refugee-protection-cannot-be-paused-during-transition-to-dpp-system/\" target=\"_blank\" rel=\"noopener\">said</a>, “While we welcome the government’s efforts to develop a national refugee registration system and move towards formal recognition of refugees in Malaysia, any transition away from UNHCR registration must not leave refugees and asylum-seekers without access to protection procedures.” This, in essence, underscores the nuances behind policies involving refugees and asylum-seekers, as well as the importance of the government stepping up to implement the policies.</p><p>Ultimately, to address the situation involving refugees more effectively, we, as human beings, must cultivate compassion and forbearance within ourselves. With the prevalence of populist-based politics around the world, the way citizens treat vulnerable communities is crucial in determining whether a nation can be pressured to uphold its international duty towards these “unwelcome guests.”</p><p>While recognizing the collective legal responsibility of states is vital, we should also advocate for the moral responsibility of society in a country if we wish to see a world where people fleeing conflicts are welcomed warmly rather than expelled coldly.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
