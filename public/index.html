<script>
var articles = [{"title":"The fundamental confusions of federal Indian law","source":"SCOTUSblog","author":"Matthew L.M. Fletcher","url":"https://www.scotusblog.com/2026/09/the-fundamental-confusions-of-federal-indian-law/","category":"law","categoryLabel":"Law","wordCount":1064,"readingTime":6,"content":"<p>I wanted to begin this series for SCOTUSblog by discussing some fundamentals (and fundamental confusions) of federal Indian law. Despite the <a href=\"https://www.scotusblog.com/2016/01/scotus-for-law-students-indian-cases-at-the-court/\" target=\"_blank\" rel=\"noopener\">common understanding that federal Indian law is difficult and confounding</a>, I teach my students that its foundational principles are actually fairly simple. Federal law is supreme in Indian affairs, preempting state law (<a href=\"https://www.oyez.org/cases/2018/16-1498\" target=\"_blank\" rel=\"noopener\"><em>Washington v. Cougar Den</em></a>). Tribal nations (or “Indian tribes,” to use the parlance of the Constitution) are sovereign governments (<a href=\"http://www.oyez.org/cases/2000-2009/2003/2003_03_107/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Lara</em></a>). The judiciary is to interpret ambiguous treaty and statutory provisions to the benefit of tribal interests (<a href=\"https://www.oyez.org/cases/2018/17-532\" target=\"_blank\" rel=\"noopener\"><em>Herrera v. Wyoming</em></a>). Congressional enactments rationally related to the fulfillment of that responsibility are constitutional (<a href=\"https://www.oyez.org/cases/1973/73-362\" target=\"_blank\" rel=\"noopener\"><em>Morton v. Mancari</em></a>).</p><p>Despite this relative simplicity, Supreme Court justices regularly complain that federal Indian law precedents are difficult and even incompatible with the Constitution. Justice Clarence Thomas, known for regularly assailing federal Indian law precedents, decried in 2004 “<a href=\"https://supreme.justia.com/cases/federal/us/541/193/#tab-opinion-1961567\" target=\"_blank\" rel=\"noopener\">the confusion reflected in our precedent</a>” in a case involving the power of Congress to restore or reaffirm tribal nations’ inherent power to prosecute nonmember Indians. Justices Samuel Alito and Brett Kavanaugh repeatedly asserted during one oral argument that an equal protection challenge to the <a href=\"https://www.bia.gov/bia/ois/dhs/icwa\" target=\"_blank\" rel=\"noopener\">Indian Child Welfare Act</a> (a 1978 federal law that seeks to keep Indian children with Indian families) raised “<a href=\"https://www.supremecourt.gov/oral_arguments/argument_transcripts/2022/21-376_1p23.pdf\" target=\"_blank\" rel=\"noopener\">difficult</a>” questions. (Kavanaugh even <a href=\"https://supreme.justia.com/cases/federal/us/599/21-376/\" target=\"_blank\" rel=\"noopener\">wrote separately to encourage a future vehicle to challenge aspects of the act</a>.) They were joined by the federal government’s counsel, there to defend the statute, who nevertheless opined during a series of hypothetical scenarios from the court that these questions were “difficult to defend.”</p><p>In fact, in the entire history of federal Indian affairs enactments, only two federal statutes have been struck down by the Supreme Court. One case, 1911’s <a href=\"https://www.oyez.org/cases/1900-1940/219us346\" target=\"_blank\" rel=\"noopener\"><em>Muskrat v. United States</em></a>, taught in federal courts classes nationally, involved a strange statutory provision that allowed Cherokee tribal citizens to challenge an act of Congress only potentially impacting them, essentially authorizing the federal judiciary to render an advisory opinion. The second law, struck down twice by the court, allowed first the Interior Department and then tribal nations to confiscate “de minimus” property interests in Indian lands without compensation (see <a href=\"https://www.oyez.org/cases/1986/85-637\" target=\"_blank\" rel=\"noopener\"><em>Hodel v. Irving</em></a> and <a href=\"https://www.oyez.org/cases/1996/95-1595\" target=\"_blank\" rel=\"noopener\"><em>Babbitt v. Youpee</em></a>).</p><p>And yet the litany of judges figuratively throwing up their hands in frustrated confusion continues. Perhaps it’s useful to separate the areas of confusion into three buckets.</p><p>The first bucket is Congress. Thanks to the <a href=\"https://www.law.cornell.edu/constitution-conan/article-1/section-8/clause-3/commerce-with-indian-tribes\" target=\"_blank\" rel=\"noopener\">Indian commerce clause</a> and to the exercise of the <a href=\"https://constitution.congress.gov/browse/essay/artII-S2-C2-1-3/ALDE_00012954/\" target=\"_blank\" rel=\"noopener\">treaty power</a>, Congress has first stab at making Indian affairs policy. In the history of federal Indian law and policy, Congressional policy has vacillated between two opposing poles. On one hand, from the founding until the late 1960s or early 1970s, Congressional policy more or less consistently favored the slow eradication of tribal governments and Indigenous land holdings. Congress wavered on how to go about this project. At times, Congress directly sought to scrub out whole regions of Indian country, as it did during the early- to mid-19th century’s <a href=\"https://americanindian.si.edu/nk360/removal/\" target=\"_blank\" rel=\"noopener\">Removal Era</a> and the mid-20th century’s <a href=\"https://www.potawatomiheritage.com/encyclopedia/termination-era/\" target=\"_blank\" rel=\"noopener\">Termination Era</a>. Mostly, Congress sought to create incredibly difficult conditions for tribal nations that might force them into oblivion, such as the <a href=\"https://project1492.org/category/allotment-assimilation/\" target=\"_blank\" rel=\"noopener\">Allotment and Assimilation Era of the latter half of the 19th century</a>. In the 1970s until the current period, an era we call the Self-Determination Era, Congress has aggressively supported tribal interests – the polar opposite policy from removal, termination, and assimilation. Despite congressional consistency for the last 50 years, Thomas still has referred to Indian affairs policy by the inaccurate and questionable label, “<a href=\"https://ictnews.org/archive/justice-clarence-thomas-and-us-v-lara/\" target=\"_blank\" rel=\"noopener\">schizophrenic</a>.” This is because such vacillating policies, for Thomas, create inconsistent precedents.</p><p>The second bucket is jurisprudential. Recently, the court lamented the “confusion” in its precedents that have sustained congressional power without identifying the source or scope of that power (see <a href=\"https://supreme.justia.com/cases/federal/us/599/21-376/#tab-opinion-4753196\" target=\"_blank\" rel=\"noopener\"><em>Haaland v. Brackeen</em></a>). As far back as 1886, in <a href=\"https://supreme.justia.com/cases/federal/us/118/375/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Kagama</em></a>, for example, the court described the relationship of Indian tribes to the national government as “an anomalous one, and of a complex character.” Perhaps the most infamous incidence of confusion was in <a href=\"https://supreme.justia.com/cases/federal/us/435/191/\" target=\"_blank\" rel=\"noopener\"><em>Oliphant v. Suquamish Indian Tribe</em></a> and <a href=\"https://supreme.justia.com/cases/federal/us/435/313/\" target=\"_blank\" rel=\"noopener\"><em>United States v. Wheeler</em></a>, decided 16 days apart in 1978. In the first case, the court concluded that inherent tribal powers can be divested through an “unspoken assumption” of federal, state, and tribal actors in the absence of an act of Congress regulating or abrogating that power, while in the second, the court concluded that tribal powers are retained absent explicit divestiture through an act of Congress.</p><p>The third bucket of confusion arises from the court’s musings about the policy implications of its decisions. For example, complexities involving Indian country criminal jurisdiction long have perplexed the judiciary, with Congress doing little to better the situation (see <a href=\"https://supreme.justia.com/cases/federal/us/439/463/\" target=\"_blank\" rel=\"noopener\"><em>Washington v. Yakima Indian Nation</em></a>). Luckily, tribes and local governments usually choose to reach agreement amongst themselves about how to police Indian country (see <a href=\"https://www.oyez.org/cases/2020/19-1414\" target=\"_blank\" rel=\"noopener\"><em>United States v. Cooley</em></a>). In recent years, the court has both identified jurisdictional complexity as a problem (see<em> <a href=\"https://www.oyez.org/cases/2019/18-9526\" target=\"_blank\" rel=\"noopener\">McGirt v. Oklahoma</a></em>’s dissent arguing against a shift from state to federal criminal jurisdiction on the Creek Reservation) and attempted to resolve it by acknowledging additional state authority over Indian country crime (see <a href=\"https://www.oyez.org/cases/2021/21-429\" target=\"_blank\" rel=\"noopener\"><em>Oklahoma v. Castro-Huerta</em></a>). All this despite the court’s <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2236570\" target=\"_blank\" rel=\"noopener\">documented lack of institutional capacity to make sound policy judgments in Indian affairs</a>.</p><p>Where does this leave us? Recently, scholars such as <a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7345543\" target=\"_blank\" rel=\"noopener\">Michelle Bryan and Kekek Stark</a> have taken up suggestion from Justices Neil Gorsuch and Thomas that the court’s Indian law precedents arising from an “<a href=\"https://turtletalk.blog/2025/11/10/justices-gorsuch-and-thomas-signal-interest-in-overruling-kagama-commentary/\" target=\"_blank\" rel=\"noopener\">atmosphere</a>” of colonialism be reconsidered. Undoing some of the most odious precedents of the past that are inconsistent with the modern tribal self-determination would undoubtedly clear up most of the confusion. But it is my sense that those judges most likely to express frustration with the precedents may also be frustrated with the very idea of tribal sovereignty. So we may be stuck going in circles, with a federal Indian law that is both needlessly confusing and difficult. Throughout this series, I will attempt to further unpack how those difficulties have been addressed and how that circle might be squared.</p><p><strong>Recommended Citation: </strong>Matthew L.M. Fletcher, <em>The fundamental confusions of federal Indian law</em>, SCOTUSblog (Sep. 18, 2026, 10:00 AM), https://www.scotusblog.com/2026/09/the-fundamental-confusions-of-federal-indian-law/</p>"},{"title":"Paula Cole Doesn’t Want to Wait","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/21/paula-cole-doesnt-want-to-wait","category":"fun","categoryLabel":"Interesting Reads","wordCount":730,"readingTime":4,"content":"<p>The 1998 Grammy Awards should have been a triumphant night for the singer-songwriter Paula Cole. She was nominated for seven awards for her second album, “This Fire,” including Producer of the Year, Non-Classical, an honor that has yet to go to a woman (a factoid that she calls “deeply fucked”). That night, Cole, then twenty-nine, performed “Where Have All the Cowboys Gone?” and won Best New Artist, beating out Hanson, Erykah Badu, Fiona Apple, and Puff Daddy. Yet all anyone could talk about, afterward, was the sight of Cole’s unshaven armpits at the ceremony. On “The Tonight Show,” Jay Leno trotted out a Cole doll and shined his shoes with its copious pit hair. When <em>Entertainment Weekly</em> airbrushed out her fuzz, Cole called the magazine “cowardly.” “If I look back,” she said the other day, “I see myself just nose-diving into unhappiness. I felt like prey. There was a deadening behind my eyes.”</p><p>Cole, who is now fifty-eight and has an Earth Mother vibe—baggy jeans, chore coat, beaded necklaces, orange Hokas—was sitting in the Conservatory Garden in Central Park. She had come, as she put it, “to commune with pollinators” before kicking off a national tour marking the thirtieth anniversary of “This Fire.” She views the tour, along with the release of a new two-album set called “Sonic Memoir: Demos 1989-1998,” as a chance to reclaim the idealistic artist she was before the music business chewed her up. “After my third record, I had a complete nervous breakdown on tour in Germany,” she said. Although she stepped away from the industry, she never stopped working, quietly releasing eight more records, including two that she funded through Kickstarter. “I have found solace in being independent and not working with labels anymore,” she said. “I get to keep the music pure.” She survives mostly on royalties from her 1997 single “I Don’t Want to Wait,” which became the theme song to “Dawson’s Creek.” “That song is like Robin Hood,” she said. “I take that money and put it into my lesser-known art.”</p><p>She is still astounded by the fascination with her grooming preferences. “I was just this small-town girl,” she said, shaking her silver hair, which she’d braided and pinned across her head, milkmaid style. Going au naturel was an extension of her bohemian upbringing in coastal Massachusetts, where her mother worked as an artist, and where her father was a biology professor and the bass player in a polka band. “Music was a living language in our house,” she said, then tilted her head. “Listen to them!” she said, referring to some chirping crickets. “They are sending out messages to each other, like ‘O.K., it’s the end of the season, the light is changing. We better mate and propagate.’ ” She went on,“My dad studied entomology. I think we need to befriend insects. They are the largest kingdom existing on Earth, and we are fucking it up. We’re dusting our crops with glyphosates. We’re destroying soil. We import compost. It’s completely illogical, and we’re headed for a breakdown.”</p><p>Cole splits her time between Manhattan and ten acres in Massachusetts, where she cultivates the land. A few years back, she discovered a book called “The Resilient Farm and Homestead,” by the naturalist Ben Falk, and became a convert to his “permaculture” philosophy. Cole dug rainwater swales, installed a woodstove, and planted vegetables. (She hasn’t eaten meat since she was fourteen.) This summer, she visited Falk’s farm in Vermont, where she worked alongside hippies half her age. “I came screeching in as this old city person,” she said. “I had to share a bathroom with nine men, which was really hard-core. Everyone was barefoot, just slipping in and out of their Crocs, and I was, like, ew. But I overcame that, and started putting my feet on the land. You feel your bones spread out. It’s fantastic.”</p><p>Cole strolled along a path lined with daylilies and Japanese anemones. She smiled at a sculpture of a boy and a girl from Frances Hodgson Burnett’s “The Secret Garden.” “It has never been easy to be a woman in the public eye,” she said. Cole was instrumental in launching Lilith Fair, in 1997. “I’d opened for Sarah McLachlan,” she said. “Every night I’d go out and I would thank her for having a female opener, because it just didn’t happen. Promoters said women don’t sell tickets.”</p>"},{"title":"European Commission's proposed EU Kids Act could see online games forced to enact stricter age verification amid new rules around accounts for under 15s","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/european-commissions-proposed-eu-kids-act-could-see-online-games-forced-to-enact-stricter-age-verification-amid-new-rules-around-accounts-for-under-15s","category":"gaming","categoryLabel":"Gaming","wordCount":512,"readingTime":3,"content":"<p>\"The Union's approach should allow ​minors to benefit from the huge potential of digital services, while protecting them from abuse and exploitation\"</p>\n    \n  \n  \n  \n  \n            <p>The European Commission are reportedly set to propose new rules around how under 15s access the likes of social media, AI chatbots, and online video games. Dubbed the EU Kids Act, the proposed legislation in its current form demands the setting up of a tiered system governing the types of accounts children under 15 can create to access such services. As with the <a href=\"https://www.rockpapershotgun.com/valve-now-require-uk-steam-users-to-verify-their-ages-using-a-credit-card\" target=\"_blank\" rel=\"noopener\">UK's Online Safety Act</a>, that'd result in the rolling out of age verification hoops everyone has to jump through to access these allegedly risky platforms.</p>\n<p>According to reports from <a href=\"https://www.politico.eu/article/eu-to-propose-new-legislation-on-minors-protection-on-thursday/\" target=\"_blank\" rel=\"noopener\">Politico</a> and <a href=\"https://www.reuters.com/legal/litigation/eu-is-set-propose-ban-social-media-ai-chatbots-under-15s-2026-09-14/\" target=\"_blank\" rel=\"noopener\">Reuters</a>, who've seen documents outlining the Commission's proposed act, in its current form it would apply to online games in addition to social media, video sharing platforms, and AI chatbots. The middle two appear to be the original main focuses, with <a href=\"https://www.euronews.com/my-europe/2026/09/11/the-netherlands-spain-push-for-eu-wide-minimum-age-on-social-media\" target=\"_blank\" rel=\"noopener\">Euro News</a> reporting that The Netherlands and Spain have recently pushed for the proposed legislation to apply to online games and AI bots too.</p>\n<p>If the act came into force as outlined in the docs, it'd introduce new rules dictating the sorts of accounts children under 15 can hold with affected services. Kids under 13 would only be allowed accounts for services deemed to meet strict safety standards, with these accounts being totally controlled by their parents/guardians. Those between 13 and 15 would have to ask a parent to open an introductory account that comes with parental controls as well as limits on why they can talk to and their screen time. Only over 15s would be able to set up their own accounts. Oh, and kids under 3 would be allowed no access whatsoever, in a huge blow for toddler rights.</p>\n<p>The bottom line? Age verification that'll most likely end up putting the onus on adults to prove they're of age via established means such as <a href=\"https://www.rockpapershotgun.com/valve-now-require-uk-steam-users-to-verify-their-ages-using-a-credit-card\" target=\"_blank\" rel=\"noopener\">owning a credit card</a>, official identity documentation, or <a href=\"https://www.rockpapershotgun.com/discord-roll-out-global-age-verification-system-including-an-age-inference-model-that-runs-in-the-background\" target=\"_blank\" rel=\"noopener\">video-based facial age estimation</a>. The rollout of such initiatives continues to <a href=\"https://edri.org/our-work/why-age-verification-misses-the-mark-and-puts-everyone-at-risk/\" target=\"_blank\" rel=\"noopener\">face pushback</a> rooted in concerns about data protection and anonymity.</p><p>\"The Union's approach should allow minors to benefit from the huge potential of digital services, while protecting them from abuse and exploitation,\" the Commission reportedly wrote in their proposal doc. \"It needs to limit the access of tech companies to our children, and not the other way around.\" The body are proposing that enforcement of the new rules would be paid for via supervisory fees levied at companies.</p>\n<p>As of right now, it's important to bear in mind the EU Kids Act is still just a proposal, so will be subject to scrutiny and potential changes as it's debated by European governments and the European Parliament before it either is or isn't set in stone as law. For example, there reportedly doesn't seem to be a strong definition of what is or isn't viewed as a 'high-risk' service for kids to be using at the moment, so that'd likely require some debating to thrash out.</p>"},{"title":"Bend","source":"Hacker News Best","author":"","url":"https://bend-lang.com/","category":"tech","categoryLabel":"Technology","wordCount":556,"readingTime":3,"content":"<a href=\"https://bend-lang.com/\" target=\"_blank\" rel=\"noopener\">~/bend</a>\n  <a href=\"https://github.com/bendlang/bend\" target=\"_blank\" rel=\"noopener\"></a><a href=\"https://discord.bend-lang.com/\" target=\"_blank\" rel=\"noopener\"></a><a href=\"https://x.com/bendlang\" target=\"_blank\" rel=\"noopener\"></a><a href=\"https://www.reddit.com/r/bendlang/\" target=\"_blank\" rel=\"noopener\"></a><a href=\"https://hub.bend-lang.com/\" target=\"_blank\" rel=\"noopener\">hub</a><a href=\"https://bend-lang.com/bender\" target=\"_blank\" rel=\"noopener\">bender</a><a href=\"https://bend-lang.com/#get\" target=\"_blank\" rel=\"noopener\">get Bend</a>\n\n    <p><a href=\"https://bend-lang.com/#!\" target=\"_blank\" rel=\"noopener\">×</a></p><h3>1.Install</h3>\ncurl -fsSL https://bend-lang.com/install.sh | sh\n    <h3>2.Add this to your AGENTS.md</h3>\nWhen using Bend:\n- run `bend guide` to learn it\n- use `LAWS.bend` to keep important rules\n- run `bend PROOF.bend` before committing\n- parallelize the code whenever possible\n    <h3>3.Enjoy bug-free, fast vibe-coded apps!</h3>\n  \n\n  <p>a fast language that blocks AI mistakes via proof</p>\n  <p>C speed · CUDA parallelism · Lean proofs · Python syntax</p>\n\n  <p>In the post-AGI economy, humans will eventually stop writing\nand reading code, but we still need an ambiguity-free way to\ntell the AIs building the world around us what we want done.</p>\n  <p>With laws, our intents can be much more precise than natural\nlanguage. With proofs, we can verify that the AI implemented\nour prompts correctly. And a fast compiler runs it at speed.</p>\n  <p>That's Bend - and nothing else.</p>\n\n  <h2>1.Bend runs FAST.</h2>\n  <p>Bend compiles to native code. On one core, it runs nearly as\nfast as C. The same binary also runs on sixteen cores, or on\nthe GPU, running up to a hundred times faster than one core.</p>\n  \n\n  <h2>2.Bend compiles FAST.</h2>\n  <p>Bend's type checker is a proof checker, as in Lean and Rocq.\nThose can take minutes on a mid-sized codebase. Bend takes a\nsecond at most, so an AI agent can check after every change.</p>\n  \n\n  <h2>3.Bend is PARALLEL.</h2>\n  <p>No threads, no locks, no kernels to write. Split the work in\ntwo, and Bend spreads the calls over every core it can find,\nthen joins them back. Now watch pow2 run on 4,096 GPU cores:</p>\n  \n\n  <h2>4.Bend BLOCKS mistakes - with proof</h2>\n  <p>How can you trust code you never read? By demanding a proof.\nLAWS.bend is where you declare laws. From then on, no AI can\nship one line that breaks them, ever. Watch it guard a game:</p>\n  \n  \n    <p>New feature:</p>\n    <p>“Claude, make the board wrap around”</p>\n  \n  \n  \n  <p>Without LAWS.bend, the bug went live. With LAWS.bend, the AI\nhad to retry until it built a wall and proved the law holds.\nMerging a bug is mathematically impossible: it is a <em>theorem</em>.</p>\n<p>LAWS.bend</p>\n# LAW: no move sequence leads to victory.\nlaw you_cant_win:\n  for moves: List&lt;Move&gt;            # any sequence of moves\n  board = replay(start(), moves)   # replayed from the start\n  is_won(board) == False{}         # never leads to victory\n<p>PROOF.bend</p>\n# PROOF: you_cant_win holds.\ndef Laws.you_cant_win(moves):\n  # ... written by the AI\n  <p>LAWS.bend is AGENTS.md backed by proof.\n“Make no mistakes” is now <em>type-checked</em>.</p>\n  <p><a href=\"https://bend-lang.com/#lab\" target=\"_blank\" rel=\"noopener\">Skeptical? Try breaking the game.</a></p>\n\n  <h2>5.Get started.</h2>\n  <h3>5.1.Install</h3>\ncurl -fsSL https://bend-lang.com/install.sh | sh\n  <h3>5.2.Tell your agent to use Bend</h3>\n  <p>Add this to your AGENTS.md:</p>\nWhen using Bend:\n- run `bend guide` to learn it\n- use `LAWS.bend` to keep important rules\n- run `bend PROOF.bend` before committing\n- parallelize the code whenever possible\n  <p>Then, just say: \"use Bend\"!</p>\n  <h3>5.3.Enjoy bug-free, fast vibe-coded apps!</h3>\n  <p>Hints: ask it to write laws for whatever should never break,\nand to parallelize everything you want running fast. Bend is\nyoung: if anything goes wrong, ask it to open an issue. Bend\nworks best on the back-end, on Linux and on macOS. Enjoy! &lt;3</p>\n\n  <h2>6.References.</h2>\n  <p>Guide: <a href=\"https://github.com/bendlang/bend/blob/main/guide/GUIDE.md\" target=\"_blank\" rel=\"noopener\">GUIDE.md</a> is the whole language; bend guide prints it.\nPaper: <a href=\"https://github.com/bendlang/bend/blob/main/paper/BendTT.pdf\" target=\"_blank\" rel=\"noopener\">BendTT</a>, an affine dependent type theory, Bend's core.\nPaper: <a href=\"https://github.com/bendlang/bend/blob/main/paper/BendRT.pdf\" target=\"_blank\" rel=\"noopener\">BendRT</a>, a parallel runtime for CPUs and GPUs, the VM.</p>\n  <p>Bend is still evolving. Expect bugs, and please <a href=\"https://github.com/bendlang/bend/issues\" target=\"_blank\" rel=\"noopener\">report them</a>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
