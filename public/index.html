*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

<script>
var articles = [{"title":"Forward-deployed engineers are the AI industry’s latest talent obsession","source":"TechCrunch","author":"Rebecca Bellan","url":"https://techcrunch.com/2026/07/30/forward-deployed-engineers-are-the-ai-industrys-latest-talent-obsession/","category":"tech","categoryLabel":"Technology","wordCount":967,"readingTime":5,"content":"<p>Executive search firm Christian &amp; Timbers estimates that there are only about 2,000 engineers in the U.S. with the special cocktail of sector know-how, gravitas, and hands-on applied AI experience needed to consistently help enterprises see a return on their AI expenditures. </p>\n<p>“Not 2,000 available,” <a href=\"https://www.christianandtimbers.com/elite-fde-scarcity-study\" target=\"_blank\" rel=\"noopener\">reads the study</a>, shared exclusively with TechCrunch, “2,000 total.”</p>\n<p>As enterprises move from trying to access the best models to figuring out how to implement them into workflows that meaningfully improves their bottom line, it appears the forward-deployed engineer (FDE) — engineers who work within client organizations to build, implement, and deploy software or AI models — is about to become among the most sought-after specialist in the AI industry. </p>\n<p>Demand for FDEs is already rising rapidly, according to the C&amp;T study, which projects demand for these specialists to surge by 2,100% by the end of the year. </p>\n<p>The research draws on interviews with more than 250 C-suite hiring executives across 180 companies, a focused survey of 80 Fortune 500 executives, and interviews with more than 300 FDEs and applied AI engineers between January and June 2026. </p>\n<p>At the start of the year, only 5% to 10% of companies were planning to hire FDEs, and mostly only for small pilots. By the end of the second quarter, however, that number jumped to 70%, with the largest consulting and services firms reporting a need to increase their FDE headcount by 10 times, building full teams of 20 to 100 employees. </p>\n<p>“This is all happening at a speed I’ve never seen. Enterprises are hiring in the middle of summer,” Jeff Christian, founder of C&amp;T told TechCrunch.</p>\n<p>That kind of demand will outstrip supply, if C&amp;T’s study is accurate. The report found that there are roughly 17,000 U.S. FDEs on the market today, a good chunk of whom are already employed by Palantir, which invented the concept of the FDE years ago. (Christian said some of his clients are even buying Palantir’s technology just so they can access the firm’s FDEs.) </p>\n<p>Only a fraction of the FDEs out in the wild are apparently elite enough to deliver true ROI, which these days is measured as “multiple tens of millions of dollars of ROI impact,” according to Christian. That could manifest as revenue acceleration on the go-to-market side (lead generation) or “replacing FP&amp;A or replacing 2,300 document processors in India,” Christian says. </p>\n<p>As Chris Taylor, CEO of <a href=\"https://techcrunch.com/2026/07/15/anthropic-blackstone-bet-the-next-trillion-dollar-ai-business-is-implementation-not-models/\" target=\"_blank\" rel=\"noopener\">Ode with Anthropic</a> (a new FDE-focused services firm), put it: “Many FDEs are well equipped to help you roll Claude Code out to your workforce. Very few are capable of building your flagship AI product feature.”</p>\n<p>Now that tokenmaxxing has morphed into valuemaxxing, and <a href=\"https://techcrunch.com/2026/06/05/the-token-bill-comes-due-inside-the-industry-scramble-to-manage-ais-runaway-costs/\" target=\"_blank\" rel=\"noopener\">enterprises are taking a harder look</a> at their balance sheets, accounting for AI spending is becoming more important than ever.</p>\n<p>“This fall, [Wall Street] is about to say, ‘Hey, we’ve given you two years to figure this out…and you haven’t. There’s no ROI. So we’re going to start punishing those that have spent hundreds of millions, maybe even billions on this, and aren’t generating ROI, and rewarding those that have’,” Christian said.</p>\n\n<p>Loading the player…</p>\n\n<p>AI companies are under pressure, too, as they’ve already spent tens of billions to train and deploy their models. For frontier AI firms, reaching profitability will depend on whether they can inject their technology into as many enterprises as possible, though that task is now being threatened by cheaper, increasingly capable open-weight models from China. </p>\n<p>That’s why firms like <a href=\"https://techcrunch.com/2026/05/04/anthropic-and-openai-are-both-launching-joint-ventures-for-enterprise-ai-services/\" target=\"_blank\" rel=\"noopener\">OpenAI and Anthropic</a> have set up their own ventures — <a href=\"https://techcrunch.com/podcast/inside-ode-with-anthropic-the-private-equity-backed-startup-betting-ai-services-are-the-future-of-enterprise/\" target=\"_blank\" rel=\"noopener\">Ode with Anthropic </a>and OpenAI’s <a href=\"https://techcrunch.com/2026/05/04/anthropic-and-openai-are-both-launching-joint-ventures-for-enterprise-ai-services/\" target=\"_blank\" rel=\"noopener\">Deployment Company</a> — and staffed them with FDEs whose sole purpose is to go forth and spread their tech around the enterprise. </p>\n<p>It’s not only top AI firms and large consultancies clamoring for FDEs, however. Enterprises from insurance and fintech to healthcare and gaming are seeking out these specialists, Christian said.  </p>\n<p>Companies are hiring teams of FDEs instead of bringing them in from firms like Ode, or Deployment Co., seeking to keep knowledge of proprietary processes in-house and protect them from the likes of OpenAI and Anthropic.</p>\n<p>“Everybody’s concerned that if they give up their proprietary business processes, [the AI firms] can compete with them, which is true in many different areas,” Christian said. “So having this muscle internally is so important.”</p>\n<p>Taylor said he’s starting to hear the phrase “internal forward-deployed engineers” more often, but his clients aren’t yet asking Ode to put together internal FDE teams for them.</p>\n<p>While many an enterprising young engineer might think they have the industry expertise and AI chops to take advantage of what may turn out to be a talent war, Christian warns that the FDE may not always be in demand. </p>\n<p>“Maybe in two years, everything’s automated, and agents are automating agents as opposed to humans automating agents,” Christian said. “That is something that could occur. Hopefully, it doesn’t, and we continue to need these people within companies.”</p>\n<p>In the medium-term, he thinks the need for FDEs will shift from enterprise AI to physical AI as companies try to implement things like humanoid robots into their workflows. But within five or 10 years, he says it’s entirely possible that the role of FDE will “go away.”</p>\n<p>That may be true for all knowledge work, if AI leaders and CEOs’ vehement predictions come true. While C&amp;T focuses on recruiting for fast-growing industries and hasn’t seen a pullback yet, Christian says more general search firms have definitely experienced a slowdown in recruitment requests. </p>\n<p>Everything to do with AI is growing and in demand, he says. For now.</p>\n<p>“I think that there’s absolutely a time soon where we’re going to see an impact in our business,” Christian said.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Rebekah Jones, Claimed 2020 Florida Health Department COVID-19 Whistle-Blower, Loses Lawsuit Over Firing","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/07/29/rebekah-jones-claimed-2020-florida-health-department-covid-19-whistle-blower-loses-lawsuit-over-firing/","category":"law","categoryLabel":"Law","wordCount":1351,"readingTime":7,"content":"<p>From <a href=\"https://flcourts-media.flcourts.gov/content/download/2492938/opinion/Opinion_2025-0732.pdf\" target=\"_blank\" rel=\"noopener\"><em>Jones v. Florida Dep't of Health</em></a>, decided by Florida Court of Appeal Judges Joseph Lewis, Ross Bilbrey, and Thomas Winokur:</p>\n<blockquote><p>Jones was … the Environmental Health Program Consultant in the [Florida Department of Health] Division of Disease Control and Health Protection. In March 2020, as part of DOH's response to the COVID-19 pandemic, Jones was assigned to work on the Department's \"COVID-19 Dashboard\" to provide an interactive illustration of COVID-19 testing data to the public. The parties agreed that Jones' chain of command began with her immediate supervisor, IT Director Craig Curry. Their Division Director was Dr. Carina Blackmore. Authority proceeded to then-Deputy Secretary Dr. Shamarial Roberson ….</p>\n<p>[O]n or about April 9, 2020, Curry learned that Jones had posted Facebook messages identifying herself as the person who maintained DOH's COVID-19 Dashboard and explaining the information displayed on the Dashboard. About twelve days later, Curry discovered that Jones had given an interview to DOH's outside geographic information system (GIS) vendor describing her work as the Dashboard manager.</p>\n<p>Curry also found out about a blog Jones published, representing herself as the author of DOH's COVID-19 Dashboard and posting charts of DOH data she had created stemming from her job duties. Curry was concerned that Jones had not obtained permission from DOH's Office of Communications before making these public statements as a DOH representative about the Dashboard information.</p>\n<p>In late April 2020, to facilitate the State's plan to reopen counties with lower rates of new COVID-19 infections, Jones was tasked with creating and presenting reopening criteria to include on the Dashboard. Jones presented her work on this \"county scorecard project,\" including positivity rates for each county, to Deputy Secretary Roberson on April 26, 2020.</p>\n<p>According to Jones, Roberson disapproved of Jones' presentation because her COVID-19 figures exceeded the target percentage rates for reopening many counties. {The veracity of Jones' allegations is immaterial to our disposition.} Jones testified that Roberson instructed her to reconfigure the data by lowering the infection rates and exempt counties with smaller populations from the \"scorecard\" materials.</p></blockquote>\n<blockquote><p>Jones alleged that she considered this a directive to falsify the data, and she refused to do so. Jones added that ultimately, the county scorecard data was not published. Although she disagreed with instructions given by Roberson, Jones did amend the COVID-19 Dashboard to reflect new case positivity rates and other data provided by DOH epidemiologists.</p>\n<p>Jones continued to publish data to the public through DOH's open data hub, including data not approved for publication by DOH. On May 5, 2020, Jones was instructed to take the data hub offline temporarily so the information could be vetted, but she was openly defiant…. Jones was removed from her assignment on the COVID-19 Dashboard on May 6, 2020.</p>\n<p>Jones admitted that on May 7, 2020, she altered the Dashboard files and removed several team members' administrative software rights, preventing their access and hindering their ability to do their jobs. Curry instructed Jones to restore the administrative privileges for her colleagues and directed her not to impede their work with the Dashboard. But Jones never complied. Instead, Curry had to contact the software vendor directly to get the access privileges reinstated.</p>\n<p>The following week, on May 14, 2020, Jones texted Curry that she was considering filing a whistleblower complaint about \"how I'm being treated, the Dashboard mess, gross mismanagement.\" … The next day, Jones emailed an outside GIS COVID data listserve group informing the recipients that she was no longer the manager of the COVID-19 Dashboard and that the new team running the Dashboard was not expected to \"continue the same level of accessibility and transparency\" as she had….</p></blockquote>\n<p>Jones was fired on May 18, 2020, and sued on various grounds. The court rejected Jones' whistle-blower claim:</p>\n<blockquote><p>[Jones] admitted, and the trial court found, that she presented no evidence that she engaged in whistleblower activity protected by the statute before her employment was terminated. It was undisputed that Jones made no report of a violation of law or prohibited act by DOH, as defined by section 112.3187(5), to a recipient listed in section 112.3187(6), and submitted no written and signed complaint under section 112.3187(7) before her termination. Thus, we agree with the trial court that Jones failed to establish a prima facie case of retaliation under section 112.3187.</p>\n<p>The trial court rejected Jones' argument that she was prevented from filing a written report by her termination. The court found that Jones \"had ample opportunity to make a protected disclosure under the FWA … if she intended to do so after her alleged refusal to falsify data on April 26, 2020.\" The record supports the trial court's finding that Jones was not prevented by DOH or any supervisor from meeting the requirements of section 112.3187(5), (6) and (7) before her employment was terminated on May 18, 2020….</p>\n<p>Jones' text on May 14, 2020 … stating she wanted to complain about \"how I'm being treated\" was not a protected disclosure of a law violation by DOH under section 112.3187(5). The court applied the correct rule that \"personal complaints\" are not protected disclosures under section 112.3187. <em>Pickford v. Taylor Cnty. Sch. Dist</em>. (Fla. App. 2020) (holding complaint about salary not protected); <em>Nazzal</em> <em>v. Fla. Dep't of Corrs.</em> (Fla. App. 2019) (holding that complaints about personal conflict with supervisor not protected under section 112.3187)….</p>\n<p>Jones does not contest the trial court's citations to her deposition and the depositions of the other witnesses to establish that shortly before she was terminated, she interfered with other employees' access to the COVID-19 Dashboard and refused to reinstate this access when directed to do so. The trial court also cited deposition pages supporting its finding that before Jones' termination, she messaged a large group of people outside DOH disparaging the new Dashboard team after she was reassigned.</p>\n<p>The trial court's finding that Jones' termination of employment was based on these instances of insubordination and violation of DOH policy, and not retaliation for protected whistleblower reports as defined by section 112.3187(5), (6), and (7), was supported by competent, substantial evidence….</p></blockquote>\n<p>And the court rejected Jones' First Amendment claim:</p>\n<blockquote><p>To show that her communications were protected speech under the First Amendment, Jones was required to demonstrate she (1) spoke as a private citizen; (2) on a matter of public concern; and (3) her interest in publishing the speech outweighed the employer's interest in regulating the speech.</p>\n<p>The character of speech as a citizen and not as an employee depends on whether the speech \"owes its existence to a public employee's professional responsibilities.\" … Jones testified that she was assigned to create and manage DOH's COVID-19 Dashboard and that she was responsible for communicating with the public and the media on DOH's behalf about the Dashboard….</p>\n<p>Jones agreed that in her personal blog post and Facebook post she identified herself as the DOH Dashboard manager speaking with authority derived from her employment. Thus, Jones' public-facing comments about the Dashboard and her reassignment away from that duty were made as a DOH employee, not as a citizen on her own behalf.</p>\n<p>On appeal, Jones does not argue that her refusal to comply with her supervisor's directives (to refrain from public dissemination of data until they were vetted by DOH personnel, to reconfigure COVID-19 data for a new purpose, and to reinstate access to the Dashboard for fellow DOH employees after she removed it) were protected by the First Amendment. Likewise, Jones does not argue that her public criticism of the DOH team assigned to the Dashboard in her place was protected citizen speech.</p>\n<p>As the Supreme Court has recognized, \"the government as employer indeed has far broader powers than does the government as sovereign.\" And \"even many of the most fundamental maxims of our First Amendment jurisprudence cannot reasonably be applied to speech by government employees.\" … Jones could not demonstrate that her employment was terminated in retaliation for her exercise of speech protected by the First Amendment….</p></blockquote>\n<p>Miriam R. Coles and Dawn M. McMahon (Henry Buchanan, P.A.) and C. Alan Lawson, Jason Gonzalez, Jessica Slatten, and Taylor Greene (Lawson Huck Gonzalez, PLLC) represent defendants.</p>"},{"title":"“Furious” Is a Crime Drama for a Post-Epstein World","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/10/furious-tv-review-hulu","category":"fun","categoryLabel":"Interesting Reads","wordCount":1282,"readingTime":7,"content":"<p>The first episode of “Furious” ends with a date from hell. It’s a late night in Manhattan, and Oliver (Rob Delaney) is a wealthy, middle-aged lawyer and a walking assemblage of red flags. Between lines of coke, he yammers on to Catherine (Lola Petticrew), the young server he’s just picked up, about how his ex-wife’s incessant chatter led to the end of their marriage, and how she should’ve made more allowances for his sex addiction. When Catherine leans in to kiss him, he presents her with an N.D.A. It’s a relief to know that the only reason this tiny, sharp-eyed woman is putting up with his nonsense is that she plans to kill him. Even when forcibly injecting him with fentanyl, she’s the more sympathetic figure: their first sexual encounter, she explains, took place years ago, when she was a fifteen-year-old trafficking victim. Catherine remembers that he brought her a glass of water afterward, so she returns the favor, offering him a few sips. Just before finishing him off, she coaxes him to repeat a phrase that helped her endure: “I’m not here.”</p><p>Catherine’s homicidal pursuit of the men involved in the most calamitous night of her life composes one half of the new Hulu crime drama; the other half traces the investigation into the murders by two female F.B.I. agents, who gradually realize that the dead men are connected via a pedophilic network. Alice (Emmy Rossum), an N.Y.P.D. detective turned Bureau rookie, and Nora (Quincy Tyler Bernstine), a veteran of the sex-crimes unit, recognize the case for the career-maker it could be. Eager as the women are to nab a serial killer, going after the network’s Epstein-like billionaire ringleader proves even more tempting. Having spent decades watching powerful men evade justice, Nora is doubly determined to bring this one down, and regards Catherine’s vigilantism as an obstacle to a larger victory. But, given the slow pace and compromised priorities of the legal system, there are limits to what the agents can accomplish within the Bureau’s bounds.</p><p>“Furious,” which débuted this week, initially recalls the 2019 Netflix miniseries “Unbelievable,” about two female detectives’ extraordinary efforts to catch a serial rapist. Based on real-life events, “Unbelievable” depicts a male-dominated police force in which indifference to, if not outright hostility toward, survivors of sexual assault enables a predator to find more victims. The new series, too, features a law-enforcement culture where disinterest in gendered violence is the norm, and cops knowingly patronize establishments that traffic underage girls. But in “Furious,” unlike its predecessor, the grim subject matter isn’t accompanied by respectful solemnity—nor are Alice and Nora beacons of benevolence, like the heroine of “Mare of Easttown,” a policewoman who serves as a de-facto social worker for the struggling members of her town. After a conventional start, “Furious” comes to feel alive and delightfully contradictory: at once cerebral and pulpy, compassionate and unhinged. Catherine’s story line evokes a feverish what-if scenario in which a survivor musters the requisite recklessness, talent for murder, and wig collection to mete out retribution. The season is streaked with mordant humor, and the show’s greatest achievement is its balance of genre-savvy thrills and seriousness of purpose.</p><p>The tonal volatility complements the show’s central theme: that survival is inevitably messy. This empathetic impulse is a signature of “Furious” ’s creator, Elizabeth Meriwether, who’s established herself as a TV auteur to follow. Still best known for the Zooey Deschanel sitcom “New Girl,” which aired from 2011 to 2018, Meriwether has since pivoted to darker fare. “The Dropout,” her 2022 miniseries about the biotech scammer Elizabeth Holmes, and “Dying for Sex,” last year’s dramedy about a Stage IV cancer patient’s final journey of sensual soul-searching, were both shows about real-life women driven by unusual wants, with scripts that reflected Meriwether’s diligent research and interest in procedure. Her tendency toward didacticism lent “Dying for Sex” a clinical quality, but it’s a welcome feature in “Furious,” where the exposition shines a necessary light on a murky world. Nora instructs Alice in why so many trafficking cases fall apart, how to interrogate young people with shock-induced memory gaps, and why it’s sometimes worth it, prosecutorially speaking, to threaten a teen-age victim with legal consequences. (That teen, Nora says, may already be recruiting other vulnerable girls into the sex trade, if only to lighten her own workload.) To fully humanize survivors, the series contends, it’s necessary to resist the assumption that suffering confers goodness.</p><p>“Furious” sometimes risks overstating its argument: Nora’s musings that “victims of violence are the most violent” and that “being a victim just makes you colder, more calculating” can feel pitiless, even when describing a serial killer. But those observations are more compelling when applied to Alice, a former teen-age runaway who, in another life, might have ended up where Catherine is now. Alice is the show’s emotional center of gravity, and her relationships with the rest of the ensemble are suitably nuanced. Though the reappearance of her abusive ex-boyfriend, Marshall (Jake Lacy), triggers symptoms of P.T.S.D., her gratitude toward his mother, who helped raise her, is deep-rooted enough that she attempts a reconciliation of sorts. Marshall’s presence also complicates Alice’s will-they, won’t-they dynamic with her old partner on the force, Danny (Scoot McNairy), a sensitive outlier within the N.Y.P.D. who nurses her back to functionality. (Meriwether’s knack for crafting rumpled, swoon-worthy male love interests may be the biggest carryover from her “New Girl” days.) But the heart of the series is the tentative alliance between Alice and Nora, who are drawn to each other even as they’re acutely aware of the other’s shortcomings. Alice craves mentorship but can’t help noting how often Nora drinks on the job; Nora, who discovers Alice having a panic attack in the bathroom, wonders whether the newbie stands a chance of making it in the Bureau. Both have found ways of coping within misogynistic institutions that have actively sidelined them. But they truly bond as survivors who can acknowledge the unexpected forms desire and resilience can take. On an after-hours drive, a visibly bruised Alice confesses to Nora that she asks her hookups to strike her. To her surprise, Nora is unruffled. “You think I’ve never asked someone to smack me around a little in the throes of a passionate embrace?” the older woman asks. “You think I’ve never let someone take a few whacks at this piñata?”</p><p>The show is less successful at fleshing out its killer, who too often comes across as a cinematic contrivance: a sexy-creepy seductress with trauma-prompted mood swings and selective, narratively convenient amnesia about the night that haunts her. Even in her character’s hokiest moments—as when she recites a nursery rhyme to Oliver’s sleeping form—Petticrew is a mesmerizing presence, moving fluidly between übercompetent steeliness and self-doubting softness. But Catherine’s essential loneliness makes her difficult to know; she seldom lets the mask fall, and her sense of self is riddled with holes. When she finally finds a confidant, she says, with heartbreaking casualness, “My memory sucks. It’s ’cause I got strangled so much.”</p><p>Given the circumstances, it becomes hard not to root against Alice and Nora’s efforts to arrest the billionaire—far more satisfying to see him dead by Catherine’s hand. But, if Catherine can feel like a cipher, the dramatization of the criminal coterie she pursues is genuinely persuasive. Far from the chumminess on display in the Epstein files, her targets express fear of and even disdain for one another. Each man has seemingly convinced himself that, whatever his flaws, <em>he’s</em> not the group’s most depraved member. Catherine doesn’t discriminate between direct perpetrators and silent bystanders, but her totalizing quest reveals a more subtle truth: there are many ways to be complicit. ♦</p>"},{"title":"Steam Machine reservation queue should be caught up by the end of 2026, Valve says","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/hardware/steam-machines/steam-machine-reservation-queue-should-be-caught-up-by-the-end-of-2026-valve-says/","category":"gaming","categoryLabel":"Gaming","wordCount":566,"readingTime":3,"content":"<p>In a new update on <a href=\"https://www.pcgamer.com/hardware/gaming-pcs/steam-machine-review-2026/\" target=\"_blank\" rel=\"noopener\">Steam Machine</a> sales, Valve says it's \"fulfilling orders on a daily basis,\" and that it expects that everyone currently in the reservation queue will have an opportunity to purchase the machine they've been waiting for—by, uh, the end of the year.</p><p><a href=\"https://www.pcgamer.com/hardware/gaming-pcs/steam-machine-reservations/\" target=\"_blank\" rel=\"noopener\">Announced in June</a>, Valve's system for determining who gets first crack at a Steam Machine was essentially a lottery. Signups were taken until June 25, after which all entries were randomized into a reservation order: Those near the top of the list were added to the reservation queue and would have a Steam Machine reserved for them, while everyone else was put on a waitlist, where they'd linger until more stock became available.</p><p>\"With each reservation queue and corresponding waitlist being per-product, per-region, they can move at different speeds based on demand,\" Valve explained in the <a href=\"https://steamcommunity.com/groups/steam_hardware/announcements/detail/698770449667981837\" target=\"_blank\" rel=\"noopener\">latest update</a>. \"This means for some products in some regions, we've reached the end of the reservation queue and have started inviting folks from the waitlist.\"</p><p>Valve also noted that this does not mean anyone on the waitlist will leapfrog people who already have a reservation: \"We're only dipping into waitlists if and when we reach the end of the reservation queue for that product and region.\"</p><p>Being moved into the reservation queue is actually the penultimate step in the process—once you receive the email notifying you of your ascended status, you've got three days to pull the trigger and actually buy the thing, or your reservation will go to someone else. So it's not necessarily that everyone will have their <a href=\"https://www.pcgamer.com/steam-deck/\" target=\"_blank\" rel=\"noopener\">Steam Deck</a> by the end of 2026, just that emails enabling purchases should be sent out by then. As Valve explained:</p><p>\"If you have a reservation, you can expect an email offering you the chance to purchase by the end of the year. If you have a spot on one of the waitlists, there is a chance you could be moved into reservations depending on which product you're on the list for; in those instances we will email you about your new reservation status first, with a purchase email to follow once your spot in that queue comes up.\"</p><p>So it's good news to the extent that yes, they're coming, but not great news because, y'know, <em>it's July</em>. There's still a lot of 2026 left, and that means at least some of you eager Steam Machine beavers out there are in for long waits ahead before you can actually get your hands on your hot (well, <a href=\"https://www.pcgamer.com/hardware/gaming-pcs/steam-machine-review-2026/\" target=\"_blank\" rel=\"noopener\"><em>warm</em></a>) new rig. Here's to 2027, I guess?</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"}];
