<script>
var articles = [{"title":"htmx 4.0.0 has been released!","source":"Hacker News Best","author":"htmx","url":"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released","category":"tech","categoryLabel":"Technology","wordCount":1482,"readingTime":8,"content":"<h2><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#htmx-400-release\" target=\"_blank\" rel=\"noopener\">htmx 4.0.0 Release</a></h2>\n<p>The htmx team is very happy to announce the release of htmx 4.0.0!  This is the culmination of 8 months of work (plus\na <a href=\"https://four.htmx.org/game\" target=\"_blank\" rel=\"noopener\">game</a>) and we are very happy with the results.</p>\n<p>The idea of htmx 4 started to germinate when I decided to create <a href=\"https://fixiproject.org/\" target=\"_blank\" rel=\"noopener\">fixi</a> and, in doing so, got\nmore familiar with the fetch() API and async programming in JavaScript.  (htmx had always\nused <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest\" target=\"_blank\" rel=\"noopener\">XMLHttpRequest</a> due\nto backwards compatibility issues.)</p>\n<p>One chance evening I was contacted by Christian, who had some interesting ideas\naround <a href=\"https://four.htmx.org/docs#streaming-html\" target=\"_blank\" rel=\"noopener\">streaming HTML</a> that\ngot me thinking that moving the internals to fetch() would simplify things for him and for the library in general.\nAfter a bit of work I managed to get Michael and Alex on board, and we were off to the races.</p>\n<p>Development has been very smooth. We started a port of fixi + the htmx test suite. Over time, we rediscovered why htmx\ndid many of the things that it did and moved our new implementation closer and closer to the old one. At this point\nthe behavioral differences between 2.x and 4.x are relatively small and where they do diverge we have made explicit\nchoices that we feel will put htmx-based applications in a good spot for\nbeing <a href=\"https://www.youtube.com/watch?v=lASLZ9TgXyc\" target=\"_blank\" rel=\"noopener\">100-year web services</a></p>\n<p>Note that we are not marking 4.0 as <a href=\"https://docs.npmjs.com/cli/v10/commands/npm-dist-tag#purpose\" target=\"_blank\" rel=\"noopener\">latest</a> in NPM\nbecause we do not want to force-upgrade users who are relying on non-versioned CDN URLs for htmx. Instead, 2.x will\nremain latest and the 4.0 line will remain next until some point in early 2027. The website, however, will reference 4.0.</p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#major-changes\" target=\"_blank\" rel=\"noopener\">Major Changes</a></h3>\n<p>As mentioned above, htmx 4, from a user’s viewpoint, is almost identical to htmx 2. There are three major changes:</p>\n<ul>\n<li>Attribute inheritance is now explicit by default rather than implicit by default (this is the biggest upgrade item)</li>\n<li>The htmx event names have been standardized &amp; cleaned up. Some advanced users may need to change the events they\nlisten for.</li>\n<li>History support now does not use localStorage by default (which was a cause of many support headaches). Most people\nwon’t notice this at all.</li>\n</ul>\n<p>Internally, we migrated from XMLHttpRequest to fetch() but that should be transparent for most users of htmx.</p>\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#attribute-inheritance\" target=\"_blank\" rel=\"noopener\">Attribute Inheritance</a></h4>\n<p>In htmx 2 many attributes were “inherited” by default. This allows you to place attributes on parent elements and\ntheir behavior will apply to child elements. This behavior, which came from\nthe <a href=\"https://intercoolerjs.org/\" target=\"_blank\" rel=\"noopener\">intercooler.js</a> days, was inspired by CSS and, unsurprisingly, worked out about the same\nas CSS: powerful but difficult to understand at times.</p>\n<p>In htmx 4 attributes are not inherited unless you <a href=\"https://four.htmx.org/docs#attribute-inheritance\" target=\"_blank\" rel=\"noopener\">explicitly say so</a> by adding an\n:inherited after the attribute name:</p>\n&lt;!-- htmx 2 --&gt;\n&lt;div hx-confirm=\"Are you sure?\"&gt;\n    &lt;button hx-delete=\"/item/1\"&gt;Delete&lt;/button&gt;\n&lt;/div&gt;\n\n&lt;!-- htmx 4 --&gt;\n&lt;div hx-confirm:inherited=\"Are you sure?\"&gt;\n    &lt;button hx-delete=\"/item/1\"&gt;Delete&lt;/button&gt;\n&lt;/div&gt;\n<p>This will be the largest upgrade burden in migrating from htmx 2 to htmx 4. To make things easier, we have provided\na <a href=\"https://four.htmx.org/docs#upgrade-checker\" target=\"_blank\" rel=\"noopener\">command line tool</a> to find places you need to mark as inherited.</p>\n<p>Note that attributes like hx-disinherit, etc. are no longer required and should be removed.</p>\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#events\" target=\"_blank\" rel=\"noopener\">Events</a></h4>\n<p>The events triggered by htmx 2 had grown organically over the life of the library and were not particularly well\norganized, making it difficult to know exactly which event was fired when.</p>\n<p>In htmx 4, all events now follow htmx:phase:action[:sub-action]:</p>\nhtmx 2htmx 4htmx:beforeRequesthtmx:before:requesthtmx:afterRequesthtmx:after:requesthtmx:beforeSwaphtmx:before:swaphtmx:afterSwaphtmx:after:swaphtmx:configRequesthtmx:config:request\n<p>In addition, the following changes were made:</p>\n<ul>\n<li>Most error events collapse into <a href=\"https://four.htmx.org/reference/events/htmx-error\" target=\"_blank\" rel=\"noopener\">htmx:error</a>. HTTP error responses fire\n<a href=\"https://four.htmx.org/reference/events/htmx-response-error\" target=\"_blank\" rel=\"noopener\">htmx:response:error</a>.</li>\n<li>The htmx:xhr:* events are removed. htmx 4 uses fetch().</li>\n<li>The htmx:validation:* events are removed in favor of native browser form validation.</li>\n</ul>\n<p>The full table is in <a href=\"https://four.htmx.org/docs/whats-new-in-htmx-4\" target=\"_blank\" rel=\"noopener\">What’s New in htmx 4</a>.</p>\n<p>The command line upgrade checker flags old event names in hx-on attributes and in your JavaScript where it can find\nthem.</p>\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#history\" target=\"_blank\" rel=\"noopener\">History</a></h4>\n<p>History support has always been included in htmx, allowing you to implement back-button aware actions with simple\nattributes. In htmx 2, a cache in localStorage was used to snapshot pages for restoration. Unfortunately a large\nsource of issues was that this snapshot could include DOM mutations by 3rd party JavaScript libraries. When the page was\nrestored, those mutations remained but the underlying JavaScript logic was not.</p>\n<p>htmx 4 does not cache pages in localStorage. On back navigation htmx re-fetches the page and swaps it into &lt;body&gt;,\nor into the [hx-history-elt] element if one is present. This allows 3rd party JavaScript libraries to “just work” in\nmost cases and, with good request caching, is very fast.</p>\n<p>If you want local caching instead, we now ship a very complete <a href=\"https://four.htmx.org/extensions/hx-history-cache\" target=\"_blank\" rel=\"noopener\">hx-history-cache</a>\nextension that restores history from sessionStorage and is designed to integrate well with scripting solutions like\nAlpine.js, etc.</p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#new-features\" target=\"_blank\" rel=\"noopener\">New Features</a></h3>\n<p>There are two big new features in htmx 4, both of which we are really excited about:</p>\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#morph-swaps\" target=\"_blank\" rel=\"noopener\">Morph Swaps</a></h4>\n<p>We now support <a href=\"https://four.htmx.org/docs#morphing-swaps\" target=\"_blank\" rel=\"noopener\">morphing swaps</a> out of the box with htmx.  I created <a href=\"https://github.com/bigskysoftware/idiomorph\" target=\"_blank\" rel=\"noopener\">idiomorph</a> and\nnearly included it in htmx 2.x but decided against it.  In htmx 4, Michael has done great work improving on that\nalgorithm and integrating it seamlessly into htmx.</p>\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#hx-partial\" target=\"_blank\" rel=\"noopener\">&lt;hx-partial&gt;</a></h4>\n<p>Another major new feature is the &lt;hx-partial&gt; tag.  This tag is similar to <a href=\"https://four.htmx.org/docs#out-of-band-swaps\" target=\"_blank\" rel=\"noopener\">out-of-band swaps</a>,\nbut is much clearer when you want to do something beyond just replacing a single element with a new version of itself:</p>\n&lt;hx-partial hx-target=\"#messages\" hx-swap=\"beforeend\"&gt;\n    &lt;div&gt;New message&lt;/div&gt;\n&lt;/hx-partial&gt;\n&lt;hx-partial hx-target=\"#count\"&gt;\n    &lt;span&gt;5&lt;/span&gt;\n&lt;/hx-partial&gt;\n<h4><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#extensions\" target=\"_blank\" rel=\"noopener\">Extensions</a></h4>\n<p>Much of the excitement in htmx 4 is in the extensions.  Switching to fetch() internally let us rethink how extensions\ncan and should work, and sparked the creation (and recreation) of many new extensions, for example:</p>\n<ul>\n<li>hx-preload - preload content (e.g. on mouseover) to speed requests up</li>\n<li>hx-download - native, fetch-based file downloads</li>\n<li>hx-alpine-compat - smooths over compatibility issues between htmx and <a href=\"https://alpinejs.dev/\" target=\"_blank\" rel=\"noopener\">Alpine.js</a></li>\n<li>hx-history-cache - caches history in sessionStorage, provides Alpine.js compatibility</li>\n</ul>\n<p>Additionally, there are three new or updated streaming HTML extensions:</p>\n<ul>\n<li><a href=\"https://four.htmx.org/extensions/hx-sse\" target=\"_blank\" rel=\"noopener\">hx-sse</a> streams over text/event-stream.</li>\n<li><a href=\"https://four.htmx.org/extensions/hx-ws\" target=\"_blank\" rel=\"noopener\">hx-ws</a> streams and sends over WebSockets.</li>\n<li><a href=\"https://four.htmx.org/extensions/hx-multipart\" target=\"_blank\" rel=\"noopener\">hx-multipart</a> streams over multipart/mixed</li>\n</ul>\n<p>Finally, we decided it was time to try our hand at our own small front-end scripting solution that tightly integrates with htmx.  <a href=\"https://four.htmx.org/extensions/hx-live\" target=\"_blank\" rel=\"noopener\">hx-live</a> is inspired by Alpine.js, <a href=\"https://jquery.com/\" target=\"_blank\" rel=\"noopener\">jQuery</a> and <a href=\"https://hyperscript.org/\" target=\"_blank\" rel=\"noopener\">hyperscript</a>, and makes front end scripting pleasant and fun.  It even supports what we are calling DOM-based, HATEOAS-friendly reactivity.</p>\n<p>There is a new <a href=\"https://four.htmx.org/docs/htmax\" target=\"_blank\" rel=\"noopener\">htmax.js</a> bundle in the distribution which packages htmx with the most popular of these in a single file if you don’t want to think about which ones you want to pick.</p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#upgrading\" target=\"_blank\" rel=\"noopener\">Upgrading</a></h3>\n<p>For a complete upgrade guide see  <a href=\"https://four.htmx.org/docs/whats-new-in-htmx-4\" target=\"_blank\" rel=\"noopener\">What’s New in htmx 4</a>.</p>\n<p>As mentioned earlier, we are providing an upgrade tool to help you:</p>\n$ npx htmx.org@4.0.0 upgrade-check -- ./templates\n\nFile extensions: .html, .php, .js, .ts, .jinja, .jinja2, .j2, .erb, .hbs\nUse --ext to add more (e.g. --ext .vue --ext .svelte)\n\nScanning 1 file(s)...\n\nFound 8 issue(s) in 1 of 1 file(s).\ntemplates/index.html:1: [inheritance] hx-headers needs :inherited suffix (descendant on line 3 has hx-delete) (this looks like a CSRF token; without :inherited the header does not reach child elements and the server rejects the request)\ntemplates/index.html:2: [inheritance] hx-target needs :inherited suffix (descendant on line 3 has hx-delete)\ntemplates/index.html:2: [inheritance] hx-confirm needs :inherited suffix (descendant on line 3 has hx-delete)\ntemplates/index.html:3: [renamed-attr] hx-disable -&gt; rename to hx-ignore (hx-disable now means 'disable during request')\ntemplates/index.html:4: [removed-attr] hx-vars is removed -&gt; use hx-vals with js: prefix\ntemplates/index.html:4: [removed-attr] hx-prompt is removed -&gt; load the hx-prompt extension to keep the same syntax\ntemplates/index.html:9: [old-event] old event name \"htmx:afterRequest\" -&gt; \"htmx:after:request\"\ntemplates/index.html:9: [old-api] htmx.addClass() is removed -&gt; use element.classList.add()\n<p>We are also shipping an <a href=\"https://four.htmx.org/docs/editor-support#ai-coding-assistants\" target=\"_blank\" rel=\"noopener\">agent skill</a> to assist in upgrading</p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#installing\" target=\"_blank\" rel=\"noopener\">Installing</a></h3>\n<p>htmx 4.0 can be installed via a package manager referencing version 4.0.0, or can be linked via a CDN:</p>\n\n&lt;script src=\"https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js\"&gt;&lt;/script&gt;\n<p>or <a href=\"https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js\" target=\"_blank\" rel=\"noopener\">Downloaded</a></p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#llms\" target=\"_blank\" rel=\"noopener\">LLMs</a></h3>\n<p>Like it or not, a lot of people are using LLMs and we are providing the following skills files for LLMs:</p>\n<ul>\n<li><a href=\"https://raw.githubusercontent.com/bigskysoftware/htmx/v4.0.0/dist/skills/htmx-guidance.md\" target=\"_blank\" rel=\"noopener\">htmx-guidance</a> - core htmx skills for developing with htmx 4</li>\n<li><a href=\"https://raw.githubusercontent.com/bigskysoftware/htmx/v4.0.0/dist/skills/htmx-debugging.md\" target=\"_blank\" rel=\"noopener\">htmx-debugging</a> - diagnosing htmx issues during dev</li>\n<li><a href=\"https://raw.githubusercontent.com/bigskysoftware/htmx/v4.0.0/dist/skills/htmx-extension-authoring.md\" target=\"_blank\" rel=\"noopener\">htmx-extension-authoring</a> - writing and debugging htmx 4 extensions</li>\n<li><a href=\"https://raw.githubusercontent.com/bigskysoftware/htmx/v4.0.0/dist/skills/htmx-upgrade-from-htmx2.md\" target=\"_blank\" rel=\"noopener\">htmx-upgrade-from-htmx2</a> - migrating a codebase from htmx 2.x to 4.x</li>\n</ul>\n<p>(Let’s leave aside if releasing a new version of a library in the LLM era is a good or bad thing!)</p>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#conclusion\" target=\"_blank\" rel=\"noopener\">Conclusion</a></h3>\n<p>We hope you enjoy htmx 4.  htmx 2 will continue to be supported indefinitely so don’t feel any pressure to upgrade.</p>\n<p>I’d like to thank the following people for all their help with this release:</p>\n<ul>\n<li><a href=\"https://github.com/MichaelWest22\" target=\"_blank\" rel=\"noopener\">Michael West</a> - Incredible teammate &amp; grug-brained developer</li>\n<li><a href=\"https://github.com/scriptogre\" target=\"_blank\" rel=\"noopener\">Christian Tanul</a> - Inspired htmx 4 &amp; led the streaming &amp; live extensions</li>\n<li><a href=\"https://github.com/alexpetros\" target=\"_blank\" rel=\"noopener\">Alex Petros</a> - For keeping the ship on an even keel</li>\n<li>Stephen Mitchell - The genius behind the <a href=\"https://four.htmx.org/game\" target=\"_blank\" rel=\"noopener\">game</a></li>\n<li>Stu Kennedy - Our WebSockets expert</li>\n<li>André Ahlert Jr. - Providing IDE &amp; Editor Support</li>\n<li>Dien Hoa Truong - For kicking the tires on early htmx 4 and helping fix many bugs</li>\n</ul>\n<h3><a href=\"https://four.htmx.org/announcements/2026-08-28-htmx-4.0.0-is-released#upgrade-music\" target=\"_blank\" rel=\"noopener\">Upgrade Music</a></h3>\n<p>Wouldn’t be an htmx update without upgrade music:</p>"},{"title":"Modern Warfare 4 beta's first update is live, adding a new map, mode, and toned-down footsteps","source":"Eurogamer","author":"Vikki Blake","url":"https://www.eurogamer.net/modern-warfare-4-beta-day-1-update-footstep-audio-weapon-balance","category":"gaming","categoryLabel":"Gaming","wordCount":1174,"readingTime":6,"content":"<p>Sound decision.</p>\n    \n  \n  \n  \n  \n            <p><a href=\"https://www.eurogamer.net/companies/infinity-ward\" target=\"_blank\" rel=\"noopener\">Infinity Ward</a> has deployed the first proper update to the<a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-maps-modes-campaign\" target=\"_blank\" rel=\"noopener\"> Modern Warfare 4 beta</a>, addressing a chunk of the feedback from the beta's opening day, including footstep audio, weapon lethality, and map voting.</p>\n<p>\"We heard you loud and clear on the footstep volume, so we've adjusted things downward for today,\" the studio said in its<a href=\"https://www.callofduty.com/patchnotes/2026/08/call-of-duty-modern-warfare-4-beta-patch-notes\" target=\"_blank\" rel=\"noopener\"> official patch notes blog post</a>. As a result, enemy footstep and gear audio have had both their volume and audible range reduced.</p>\n\n<p>Time-to-kill has also been tuned down on some weapons, with the ISO Nightshade SMG and Oris 8.6 marksman rifle both seeing their damage ranges and headshot multipliers reduced.</p>\n<p>Infinity Ward says these are just the first adjustments and more changes are coming as it continues reviewing feedback and data.</p>\n<p>A new map, Cachette, and a new mode, Inflation, have also joined the multiplayer rotation. Inflation tasks players with eliminating enemies and defeating HVT operators to collect cash, with the richest players becoming marked targets for everyone else to hunt. Cachette's addition also means there are now enough maps in the pool for map voting to be switched on, something Infinity Ward said needed four total maps to work properly.</p><p>Elsewhere, Transit 213 has had its shadowed areas brightened and its overall colour balance adjusted for visibility, and there's a long list of smaller bug fixes, covering everything from Mobility Course completion issues to controller reconnection errors. On PC, Infinity Ward says it's working to improve the Secure Attestation Wizard, the tool used to diagnose and fix issues getting into the beta.</p>\n<p>Not everything's fixed yet, though: join in progress remains temporarily disabled on Kill Block, and cooking certain lethals can still cause an FPS drop, both of which Infinity Ward says it's still working on.</p> \n<blockquote><p>Day 1 of the <a href=\"https://x.com/hashtag/MW4?src=hash&amp;ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">#MW4</a> Beta is almost in the books. We saw the conversation, and we're already cooking our first update for tomorrow with:</p><p>🔊 Footstep audio tuning🗳️ Map voting turned on🔫 Weapon balance adjustments🛠️ Bug fixes and more</p><p>And we’ve got new content coming too.</p><p>Full…</p>— Infinity Ward (@InfinityWard) <a href=\"https://x.com/InfinityWard/status/2091026639253905562?ref_src=twsrc%5Etfw\" target=\"_blank\" rel=\"noopener\">August 22, 2026</a></blockquote>\n\n<p>Here's the full patch notes:</p>\n<blockquote><p>Thank you to everyone for your energy on Day 1 of the Early Access Beta. We had a blast playing with you, and we're ready to run it back all weekend.</p>\n<p>Day 2 will bring a variety of bug fixes and gameplay adjustments, including a new Map and Mode which join the Multiplayer rotation at 10:00am PT</p>\n<p>We'll be deploying an update shortly that aims to address a lot of the community feedback from yesterday. We heard you loud and clear on the footstep volume, so we've adjusted things downward for today. We've been following the conversation and agree that time-to-kill (TTK) isn't quite right yet, so we've tuned down the lethality of some of our guns to start. Finally, we made a tweak to boost visibility on Transit 213. Let us know if you think these adjustments are in the right direction, and expect more in the future.</p>\n<p>We also know some of you had some trouble getting into the Beta yesterday, and we'll be working over time to clarify in-game error messaging and improve our <a href=\"https://support.activision.com/articles/trusted-platform-module-and-secure-boot\" target=\"_blank\" rel=\"noopener\">Secure Attestation Wizard</a> for PC players. Keep in mind the wizard doesn't just diagnose issues, it fixes them too, so give it a try if you haven't already.</p>\n<p>We're working every day of the Beta to improve the experience, so keep the feedback coming. We're listening.</p>\n<p>CONTENT</p>\n<p>Maps</p>\n<ul>\n<li>NEW: Cachette</li>\n</ul>\n<p>Modes</p>\n<ul>\n<li>NEW: Inflation</li>\n<li>Eliminate enemies to collect cash.</li>\n<li>Defeat HVT Operators to steal the cash they're carrying.</li>\n<li>The richest players become marked HVTs for everyone to hunt.</li>\n<li>Survive Overtime and get increased cash multipliers.</li>\n</ul>\n<p>Here are the Patch Notes for today's update:</p>\n<p>MAPS</p>\n<p>Map Voting</p>\n<ul>\n<li>We need 4 total maps to enable voting effectively, so with Cachette in the mix this is coming with today's update.</li>\n</ul>\n<p>Transit 213</p>\n<ul>\n<li>Brightened shadowed areas.</li>\n<li>Adjusted overall color balance.</li>\n</ul>\n<p>WEAPONS &amp; ATTACHMENTS</p>\n<p>An extra word from the Weapons Team:</p>\n<p>Thanks for joining us in the Beta! The changes below are the ones we're already feeling good about, and we're keeping an eye on your feedback and data. Keep sharing it, we're listening!</p>\n\n<p>Attachments</p>\n<ul>\n<li>Frangible Rounds</li>\n<li>Reduced Frangible slow duration by 26.8%.</li>\n<li>Reduced Frangible slow magnitude by 21.4%.</li>\n</ul>\n<p>AUDIO</p>\n<p>Footsteps &amp; Player Sound Effects</p>\n<ul>\n<li>Reduced the distance at which enemy footstep and gear audio can be heard.</li>\n<li>Decreased overall enemy footstep and gear audio volume.</li>\n</ul>\n<p>Our objective for movement audio is to indicate when enemies are approaching without revealing their exact positions at a distance. We'll continue looking at feedback on this topic throughout the Beta.</p>\n<p>CHALLENGES</p>\n<p>Daily Challenges</p>\n<ul>\n<li>Enabled the ability to reroll Daily Challenges.</li>\n</ul>\n<p>BUG FIXES</p>\n<ul>\n<li>Fixed an issue where players were unable to start or complete the Mobility Course.</li>\n<li>Fixed a bug that could cause footstep audio to incorrectly use wet-surface sounds when players were moving across dry areas.</li>\n<li>Fixed an issue that prevented the Global Panel from being opened using its assigned keybind.</li>\n<li>Fixed a disconnect issue caused by Seeker Drones.</li>\n<li>Fixed various errors when navigating in the front-end menu.</li>\n<li>Fixed an issue that could cause an error when entering the Gunsmith without a valid Weapon selected.</li>\n<li>Fixed various errors when switching between or reconnecting controllers.</li>\n<li>Fixed an issue where joining a friend from the menu would prevent you from being able to access some settings.</li>\n<li>Fixed a bug that caused party members to remain in a looping animation in the Multiplayer Lobby.</li>\n<li>Fixed an issue that could make certain magnified Optics opaque while aiming down sights.</li>\n<li>Fixed a rare disconnect issue in Gunfight 10v10.</li>\n</ul>\n<p>KNOWN ISSUES</p>\n<ul>\n<li>Join in progress is temporarily disabled on Kill Block</li>\n<li>We know this isn't ideal! We're actively working on a fix for this issue that's caused by a bug in the round transition.</li>\n<li>Cooking some lethals can result in an FPS drop.</li>\n<li>We're investigating reports of this and hope to have a fix soon.</li>\n</ul>\n<p><a href=\"https://trello.com/b/tocA5kKG/modern-warfare-4-infinity-ward\" target=\"_blank\" rel=\"noopener\">Follow our Trello board</a> for live issue tracking throughout the day.</p>\n<p>NEXT UP</p>\n<p>We love seeing your posts, clips, and videos - keep them coming. Your feedback is what is going to make this game the best Modern Warfare, and we're focused on those improvements.</p>\n<p>We'll see you in the lobby.</p></blockquote>\n<p>It follows<a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-compiling-shaders-fix\" target=\"_blank\" rel=\"noopener\"> a separate blog post from the developers</a> earlier this week that addressed the beta's fix for \"Compiling Shaders\" stutter on PC, an issue common enough across the industry that it's notable when a game doesn't have it.</p>\n<p><a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-maps-modes-campaign\" target=\"_blank\" rel=\"noopener\">The first leg of the beta went live</a> following the conclusion of Call of Duty: Next, the showcase event where many of the beta's maps and modes were revealed. This is Early Access, running until 25th August for anyone who's pre-ordered, ahead of a separate Open Beta weekend from 28th August to 1st September that's free for everyone.</p>\n<p>If you want to jump in on PC, don't forget you'll need to make sure<a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-anti-cheat-tpm-2-0-secure-boot\" target=\"_blank\" rel=\"noopener\"> TPM 2.0 and Secure Boot are enabled</a>, both of which are required to play.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"A Wall Of Separation Between LGB and T","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/08/26/a-wall-of-separation-between-lgb-and-t/","category":"law","categoryLabel":"Law","wordCount":1434,"readingTime":8,"content":"<h2><a href=\"https://reason.com/volokh/2026/08/26/a-wall-of-separation-between-lgb-and-t/\" target=\"_blank\" rel=\"noopener\">A Wall Of Separation Between LGB and T</a>\n\t\t\t\t\t<p>The Log Cabin Republicans will no longer advocate for transgender issues.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.26.2026 12:58 AM\n</p>\n\t</h2>\n\t\n\t\t<p>Shortly after <em>Obergefell</em> was decided, it became clear that transgender rights was simply the next stop on the train. But the pairing of LGB and T never made sense to me. Gays and lesbians urged society to accept them as they are. Transgender people compelled society to accept they as they are not. More pressingly, transgender rights advocates focused nearly all of their efforts on children: bathrooms in school; teachers telling students to lie to their parents about secret transitions; medical procedures for minors; biologically male athletes in sports; and so on. For generation, gay men were targeted for grooming young children. Growing up in New York City in the 1990s, I heard nonstop jokes about gay priests and Boy Scout troop leaders abusing kids. Yet the T in LGBT focused on the kids.</p>\n<p>The issues for gays and lesbians always seemed quite different. I wondered whether gay rights groups were quietly concerned about this merger of LGB and T, but didn't speak up for fear of being labeled transphobic. I think the other shoe has finally dropped.</p>\n<p>The Log Cabin Republicans will no longer advocate on transgender issues. Ross Hemminger, the President of LCR, published an <a href=\"https://townhall.com/columnists/ross-hemminger/2026/08/20/log-cabin-republicans-renews-its-national-advocacy-focus-n2681600\" target=\"_blank\" rel=\"noopener\">essay</a> in Townhall discussing the issues.</p>\n<blockquote><p>In 2015, the Log Cabin Republicans Board of Directors voted to add the \"T\" under the umbrella of our mission — out of a belief that all adults should be allowed to pursue their own happiness, free of government interference, as long as it did not impede on the inalienable rights of others.</p>\n<p>At the time, we did not believe that we would find ourselves where we are today. The transgender movement has ceased focusing on adults at all — nearly all of their efforts and those of their aligned special interest groups focus on minors. They push schools to teach radical gender ideology; they want biological men in women's sports regardless of the consequences; perhaps most offensively, they support gender reassignment treatments for minors, often without the knowledge or consent of the parents, knowing full well these treatments are mostly irreversible.</p></blockquote>\n<p>And Hemminger recognizes how support for gay marriage is declining because of transgender ideology.</p>\n<blockquote><p>Gay men and women are losing public support across the country, and support for gay marriage and other once-widely accepted rights is eroding. Why? Because many voters today weren't alive or cognizant of the politics of gay marriage winding its way through the courts and gaining ground in public opinion. Their view of the gay community is based on today's radical transgender activists with their unnecessary and discomfiting focus on America's youth.</p>\n<p>That is why, after significant discussion with our membership, our Board of Directors voted to refine Log Cabin Republicans' national advocacy focus to concentrate specifically on issues of sexual orientation and conservative values — in other words, we are an LGB advocacy organization, as our founders envisioned and as our moral center calls us to be.</p></blockquote>\n<p>The <em>New York Times</em> <a href=\"https://www.nytimes.com/2026/08/25/us/politics/log-cabin-republicans-transgender.html\" target=\"_blank\" rel=\"noopener\">quotes</a> Danny Stevens, who previously served as the President of the Houston Chapter of the Log Cabin Republicans:</p>\n<blockquote>\n\n<p>Danny Stevens, a former president of the Log Cabin Republicans chapter in Houston, said he thought the national group had made a smart move by abandoning trans rights issues, which it embraced in 2015.</p>\n<p>The issue was a nonstarter for many Texas Republicans.</p>\n<p>\"At some point, I just kept thinking, why are we spending all this time convincing Republicans that we're not crazy while associating ourselves with a movement pushing things most of them are never going to accept?\" Mr. Stevens wrote in a text message on Tuesday.</p>\n<p>He wishes the national Log Cabin group had abandoned trans issues sooner, he said. \"I actually think it was necessary,\" he said, if the group \"wants to keep making progress within the Republican Party.\" </p>\n\n</blockquote>\n<p>I spoke at Danny's chapter in Houston last year about <em>Obergefell</em>. I explained that regardless of what one thinks about same-sex marriage, Justice Kennedy's decision was legally indefensible, and a shaky foundation on which to build the institution. The audience was respectful, even if they disagreed. During Q&amp;A, there were a number of questions about transgender rights, and it was clear to me which way the members were trending.</p>\n<p>Danny actually stepped down from leadership, largely due to LCR's stance on the transgender issue. I asked Danny if I could publish his letter, and he gladly shared it. I think Danny makes some important points here that are worth considering:</p>\n<blockquote><p>First, I want to say that I love LCR and want the best for our chapter and the entire org. I'm also writing this as Danny. My opinions may/may not represent the singular voice of our Houston board.</p>\n<p>I'm growing more concerned and frustrated that the trans issue is not only harming us, but it's undoing much of the work we've accomplished as a chapter and as an organization.</p>\n<p>I plan to write a more formal letter, but I needed to get my initial thoughts off my chest now.</p>\n<p>My belief is that we need to take a leadership position on this issue, one we have not yet taken. Yes, we have echoed the mainstream Republican positions on men in women's sports and gender transitioning for minors. But this isn't far enough.</p>\n<p>Gender dysphoria has been and still is a clinically diagnosed mental illness. From where the illness roots and determination on appropriate treatment is above my paygrade. However, affirming this condition as an equal to sexual orientation is no longer something I'm willing to do.</p>\n<p>What someone chooses to do with their own bodies is up to each person. But our willingness as a society to affirm their decision as healthy or normal is not up to the trans movement.</p>\n<p>We have many allies in the local Republican Party who have personally and publicly expressed concerns to me about the effects the trans movement has on the greater LGB population. I don't disagree with them.</p>\n<p>Furthermore, all of the hardwork, energy and resources our chapter has invested in making gains towards being recognized by the Republican Party of Texas is completely undone by a stream of headline news stories about trans individuals and despicable crimes they are committing at seemingly disproportionate rates relative to their population. Note that I realize there are good and decent trans people. But this doesn't prohibit us from stating what broader issues we are facing as an organization or as a society.</p>\n<p>Every time I utter the acronym LGBT, I shutter knowing I'm turning off many in the audience that would otherwise support us. The very usage of this term immediately paints a picture in peoples' minds that is not valid or fair to gay men like all of us in this email.</p>\n<p>To me, this is more of an economic argument than anything else. How many gay and lesbian prospective or current members are we losing because of our unwillingness to state what many of us are thinking? Are we really willing to lose 20 gay men to attract 1 trans member?What ratio is acceptable to LCR National?</p>\n<p>Let's look at chapter-level contributions in time, labor and money. For our chapter, 99% of this comes from gay men, not our two trans members. In fact, one of our trans members is disenchanted with the Republican Party due to Pres. Trump's policies on trans individuals, primarily ones in the military. I suspect they will no longer be a member if they haven't already stopped membership payments.</p>\n<p>Charlie Kirk's assassination was a real turning point for me. It's clear that we have a lot of healing to do as a nation. And we have a lot of soul searching to do as an organization. This starts with being honest with ourselves and with each other.</p>\n<p>I'm not willing to continue pouring my heart into a cause that is continually undermined. Really, why bother?</p>\n<p>I'm starting to ask myself if my time, energy and passion is better spent outside of LCR. I would bet others are probably asking themselves the same question.</p>\n<p>This is a defining issue for the future of LCR. I fear it could really be our undoing unless we face this challenge head on.</p>\n<p>Sincerely,\nDanny Stevens</p></blockquote>\n<p>As I wrote in April in City Journal, the <a href=\"https://www.city-journal.org/article/supreme-court-transgender-rulings\" target=\"_blank\" rel=\"noopener\">tide has turned</a>. At some point, even progressive gay rights groups may decide to reconsider the merger of LGB and T.</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/26/oklahoma-attorney-general-responsible-for-two-terrible-supreme-court-decisions-loses-gubernatorial-primary/\" target=\"_blank\" rel=\"noopener\">NEXT: Oklahoma Attorney General Responsible For Two Terrible Supreme Court Decisions Loses Gubernatorial Primary</a>\n    </p>"},{"title":"The Books Behind Peter Heller’s “The Dog Stars”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/what-were-reading/the-books-behind-peter-hellers-the-dog-stars","category":"fun","categoryLabel":"Interesting Reads","wordCount":782,"readingTime":4,"content":"<p><strong>You may be aware</strong> that Jacob Elordi is in a new movie out this week: “The Dog Stars,” directed by Ridley Scott, and also starring Josh Brolin and Margaret Qualley. What you might not know is that the film is based on a 2012 book by Peter Heller. “<a href=\"https://cna.st/affiliate-link/gChDhNS3tFzZTbhnb5mo8u6q62rBsEFWcomxiFnxVmTY1vwXPjnAUTTPz3u34Gc6VqE11PXpZvSJfm3vc5jJyTgFzi3iSwQhY5yuXAfDgjax1qnDvyVju1xGkwB358fjBPWYdJwhENsTmCekJTjju35NFNP1WF5G7TndSiwnpm7sQeGDnpZdvqkeW6mf8FyNMs81npwjyjLcpnpLBcnMKuRJ1hwFhpwNTyvuEzzqypbtJPfRj7gLKcHF9E54kN6zJidspyw8PXRciw6isEYRzjwCtv11JL7NWm5D3S4u7dj57ro9KhgncSygiTG2uEAvLf8o9sfUMmYjGh1E8Qy8r7qn2Yy3LB2dootpTMEKJumFjf7F7y6mpXLc8WB2hWeLyoztUL5B2\" target=\"_blank\" rel=\"noopener\">The Dog Stars</a>” centers on two lonely survivors of a super-flu pandemic, Hig and Bangley, living in an abandoned airport in Colorado with a loyal hound named Jasper. “It’s like ‘Deliverance’ in an airplane,” <a href=\"https://www.newyorker.com/books/page-turner/what-were-reading-postapocalit-love-among-the-chickens\" target=\"_blank\" rel=\"noopener\">John Seabrook wrote when the novel was published</a>. “But it also has lyrical descriptions of landscape and nature reminiscent of James Dickey’s poetry.” I recently spoke with Heller about some of the books that have inspired him, both at work and in his life.</p><p><em>Our conversation has been edited and condensed.</em></p><p><strong>What fiction put you in a post-apocalyptic state of mind, as you were writing yours?</strong></p><p>I had recently read Melville’s “<a href=\"https://cna.st/affiliate-link/NNEw2ziszMQLBwHM6VfyE1uSXcHeP7CrariBUQhXSAtqgzZd6RNxJBNQYXcWjNhobftYTFXBPRyF4y79DB6xw9JbCToLY31rZWqAVrgPvKQXofQVq2egxDcrqx1fHxuethyPR2hUAHMFGvarKXR2qf61LsB5CAJk5SNts2fStBtpsnadudqRD6p9RbA9rmsEyP4a2vEFr2aoz2kpxnAqFJnQR67GEYrwg3cFo8JjBEJtrPgNbQ6dLMze5rbejGxpzHK1bLb4zgGEAxX9j2dBquWeGhaFRpsakNf9x62CFmXcnVjg1pEo1WYUK79PvE6Y4EBmgfwVoViLtWeVi4ppUctdtg3ThwLwmjmee55gizgnyLtgSpwsAW8j2zX189rntsChBXuJ9Dj8RrjipVMQqsNX5beYiGC\" target=\"_blank\" rel=\"noopener\">Typee</a>” when I began writing my book. It’s a utopian Polynesian fever dream that tilts into nightmare. But “The Dog Stars” was my first novel, and I didn’t want to plot or plan. I wanted to have as much fun as the reader would in following the narrative current. It didn’t really hit me that my book was post-apocalyptic until I got to about page 3, and I thought, “Crap, I don’t want to write a post-apocalyptic novel . . .”</p><p><strong>Which book most corresponds to your personal philosophy of survival?</strong></p><p>“<a href=\"https://cna.st/affiliate-link/2MivCay8tNdgaPjMLdRufoqm5fWbSu2B7ioqKm3GggUZUZt8Nyc2Q5dDukJsVvEb7rgHKmrLRrMCa2F1u6tLKCFBpmhk3z9nkikWZKgSZ9hLR2DQZh4EMTEbA7V6ALG2ex6319axd4kxeXmQgEq5LKeTC2UfVVFUEjU6f4w1sBRLPTiFqiHF7nMuPqMzQpfSmtBEocJ2DbFN1cjn7U8nKK7og7CPnTbzZUWEszrgDoxYgzBRkbpQE2hTBNjiYE8kB6HuDx259jQYN7v8f6udnriaQjwmoKiP9p6gSGhB5yGhr1cfiy6r5zYZBvs1RKspBao1Hnx3ociwT3LCmLf1BD8wAik3u2Anks6mrybD8T8kXSfXMtESzR24jZYRDPFDfpY\" target=\"_blank\" rel=\"noopener\">On the Beach</a>,” by Nevil Shute, skewered me: the idea that one could keep up daily rituals and courtesies as the shadow of mass death approached. I thought that doing so would take tremendous courage, and I’d like to think I might live that way to the end. There’s also “<a href=\"https://cna.st/affiliate-link/juaeQxcctp6YnmFpJEcs6vKgz1Ac2jfNWxU7oeKHW8t6on8Yk4zbhXoH1BdU23zoy6dQ9FGAPr6Xw89WuBR7zTfdJoZLsvoNfULJ9EYaSCtPpyV49KKpoRsDGNi1geSoy5JcVAWfxUWgkDqjxhyeqCdMbbYL8RzyYDPMdcEbzTXQ43fcfyVFTdVF2JqDjRNpvftbFgvigyAs1ijN6YNDvoqiFgQ71Y1byJdTzZjaQTzqocLziUf1Qc4cwbWgfZACgEqJ2zKxh8RmV6gL4G7UBcjnkmEHAZsFxgxWM8t1U4vFLWYyjFYz4evYzex2ZUPWJSTnAyKShDJtAtXFBsenbV3PX4Rh2YmQEQcPey4QHgQ4RGdSus4xQNNjozriHwVNujQSMAjCsQV5QbRSAtmFVcHJ\" target=\"_blank\" rel=\"noopener\">Ishi in Two Worlds</a>”; like its protagonist, I take great solace in wild places.</p><p><strong>If you could only have one book in your bunker, what would it be?</strong></p><p>Red Pine’s translation of “<a href=\"https://cna.st/affiliate-link/8BFLxn9SwWrY9EjojNfEFihicjaNr98MYDD9tCGpu9J2J2oibx7b2osqLDdEmnWvU3GGWEG5yHHw3DKpXrwnYv3FgdtcW8XVMpsEeizWmQEaXnshwmR2dextKAPLB9oh8EjAQNv4fxMmyAuTSiWyVJrD1Bn2BQPSn8kfVHrqiXNAz5UPYYfBvZudGgYf5Cag4JTSAG3d4W9nLHcXKU77xNdpifKm5xMw8f31v5TdcWeYoXsYoD7NozVYLGMBzvoXKrGtTHk9ZZbQSkDUfgbGYWo9kskdKJTioZ2KJhkGKVTTuoAuxxBRhcEV3xWcNrdoovagecYpXYbv1AFz8qAvrFY5EoSvvQmKYMmSKjyV1SNEyfjDcoRJo8usCZBNxcFBThJUpdSeaMooyFDYUsAoPsswv3LhpyfkdS\" target=\"_blank\" rel=\"noopener\">Poems of the Masters</a>.” I am enchanted with the poetry of the Tang Dynasty: Li Bai, Xue Tao, Du Fu, Li Shangyin. With only a few lines they can place you knee-deep in a mountain creek, and then break your heart. They are the original blues men and women.</p><p><strong>Is there a book you read years ago that you still think about all the time?</strong></p><p>It is a poem that haunts me. I cannot shake T. S. Eliot’s “<a href=\"https://cna.st/affiliate-link/3z2cX3BbZjFB4GQB2DS4idrxjFDA6xhV3j3TSu6HqwyE7u75f9MpLpBmWSong5RsuGFrP2iT2xJrgz5RxcxArKhYyNYepGRWxpsqdNbMDJbuGmCsH6Sb8Pijci2Qy1qqeh3sg7yu8UMvf7MxkzGr4tM1zc2giQkr2g9FyvzZTtm3gip1mN6UjN8zQoHFXUtoDbs3Sh5t8jWDJSERMsDk5ZibRmqzYxbCfSBmvj6eZbMAbTHd2XXFtFL7G6pFmUc5FePhjEYLUFgGsi1tdwep5hoE3CzcXZykrgp564KNTzrS3TbLe5gUXixDDF3mnQPsASHr7Qw6Ve8MMQfL377RJadfXv6AX91TjRgSaiyNGJxewg9zptQqCSY7pHyFTd2ebLYXMTGWUvQ\" target=\"_blank\" rel=\"noopener\">Four Quartets</a>.” The music and cadence of its passages and stanzas, even specific lines, come to me often, and I am often moved again.</p><p><strong>What is your favorite novel to recommend to others?</strong></p><p>“The Snow of the Admiral,” the first novella in Álvaro Mutis’s brilliant “<a href=\"https://cna.st/affiliate-link/6JJRoyFH2Fdjs9RdMutzEX9nZWXiPottYiYLLQw1iv8sQgSn3J6xtroxZdPqTBHV8E2i4QmKE62jaCyL5YWKa47yua6Rhj7Tbbq1oSUwVc994rz7ft6GieEvH1keuPT3TaW3X87oNo7BM6fJitdAiHcoptBQDKsVfHs4cn8i9mQLr5k3518knHuZbi6gSLjUfrHZ68QxJN5HRJcLhx7hagKFp9VbBU37aT1Eb5YKZctMex43FypSssoKb3yWj4xmQD7UKQKFhNA12ng5GSiKAfK8EAKaLf4c6JdNXGyDxh4skvyn1rTSGf8TkwTRcig8VUy7PgnHBky9Vp22ikF8haf6pRHbxRK969znHJWVQL3MsVioGzpijhQ5saymNvHWzKYPQMB3Lgiqs4cojz7uyasPz7wZoLpFWHygS5PnVaVKJ\" target=\"_blank\" rel=\"noopener\">The Adventures and Misadventures of Maqroll</a>.” It’s a Colombian up-the-river story that, in its ruminative lyricism and propulsion, rivals “Heart of Darkness.”</p><p><strong>Where do you weigh in on the adaptation debate? And are there any adaptations you particularly like?</strong></p><p>I loved “Hamnet” because I thought it captured the spirit of <a href=\"https://cna.st/affiliate-link/gChDhNS3tFzZTbhnb5mo8u6q62rBsEFWcomxiFnxVmTY1vwXPjnAUTTPz3u34Gc6VqE11PXpZvSJfm3wxLVr5hByaFkvozBv2u45BVQwLyE92PFzAZBgEeTWQUfUfTeduRqAXexCMjoyPUQMgvaRdeULzqWzCsTBLSzXCEJsSF5rAZgC2wqPspaqQWdqkPhV4gyAeFxG2MDZxXebLkCVNxsu6Y4tytMSm3e24xxqmbYMgb3zu7GByyXp5zXxjxm8chJ89aZcwVfdSxgnLX5Z7upFRtEYdWbym2CksyaXpJVDCt157rNkAh1Zzv6MJKyDRT9gr71AySHkJEZTvJr1GPRhZzf7HTCewaeUm2FW67661KDbUS1t85drwim6uRTh3Gn3ikgbe\" target=\"_blank\" rel=\"noopener\">the book</a>—love, grief, the alchemy of creative genius—while crafting a completely compelling two-hour romp. <a href=\"https://www.newyorker.com/culture/the-front-row/what-makes-an-adaptation-good\" target=\"_blank\" rel=\"noopener\">Richard Brody’s incisive piece about adaptation</a> speaks to the essential question of creative freedom as a filmmaker adapts a work of literature. When Mark L. Smith, who wrote the script for the adaptation of “The Dog Stars,” called to ask if he could change this or that scene, I would say, “I’m honored that another artist is inspired by the book to create a discrete, new work of art. Have at it.” Freedom.</p><p>Our editors and critics choose the most captivating, notable, brilliant, surprising, absorbing, weird, thought-provoking, and talked-about books. <a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\"><strong>Find your next great read »</strong></a></p><p><strong>Coming soon:</strong></p><ul><li>Robert Harris, the author of “<a href=\"https://cna.st/affiliate-link/2VASdQonq3VuP2nzW2m7ShdFY8hX5BqcevwcR2mGgeoepyfobAfTxxTRGSBL1nv1B7WfKfjDpVdxS2P64LAHM2wXb9aKYAqMGHyAaaUn3aa8jfRtcLHn2FFwV9dVFjHKVvnxxBs7Wesiq4D7bxG3gEWo8kLczY4bVMKUe7PULRkkkFFMeX8AseqTVexgJEgqrenKSy8EMpBdp14td8Ld4QkEtPM77ererWdBzjrBog8EbkXSooR4aMhS564m2RDxm41WAJKTDS8ZBJHNpg9wAAVnVPC46jLNc3CTYRv6jDFuTjJbvSNXQXKAv69LfDoErUZkwDh6u8pC4ufaoku9GGPJoYZhjtLsynFR2T52nwj9UQTNV2YXVeRrwg5tmiykmxdXjPLrA5jHeRx3YQ\" target=\"_blank\" rel=\"noopener\">Conclave</a>,” has a new book coming out September 1st: “<a href=\"https://cna.st/affiliate-link/3Qp9kvLiToJt4KL62VL4JarTQzL2LLswideiwDo6Z7az52j14K4MXZtA985e8pagpc7EJ1PKzoAXkeNxVRhE3bwPXVosghnXmBtN2tFaTteeTLfZGV1vxoSHwjM2Q7niRnn9vKYRmskwRXd1ZcwbjbViUYrXimRHF6uezpC9UfxV3nj9r2yNDHLnJVd7KD3YtzcK52GT6wfJ1UQQXgvcQW1k8r5WXxgUEcMMPWEfVzCYRD6MGjaTW3cacqQgFGmnPeXvTCh5uC9VJF18SrR8QdJ4oQB5dpNuUA74SJ7tYKPe7xdGSHqV3r5b1WjYPM2ufU18f4M2PwGBV3g4wSrPH7Gvp99FMhY2mPVj1dLjPxa3jFfBxRKwcYVJJnvFa4C88vBJbvDGFEfVp6n9ZARCbofDijBsh8GXwpTdN\" target=\"_blank\" rel=\"noopener\">Agrippa</a>.” It’s about a young commoner in ancient Rome who becomes the protector of a potential emperor.</li></ul><ul><li><p>Also out on the 1st is “<a href=\"https://cna.st/affiliate-link/3Cjw7rzrGZesRbhJZMqDHmnMzvPYkXGRTmvoXgoTGLxsPPiqb6yMmSxx7ssWHNsaHSoibSuJQCjpqDek9WV8UPzb87AEWwRXiKFdXsBaX5YprusbEEqk5bMneQ7MySTy1AsCpqrEP4hEAK3C3T34WfzKwrCwAGHLVjpZW1uMh1iY1av5YerpWhijDDZxLFs6xRFTrU7uGnfpFh1es9xYv5YYdKKErZCi54xUQoCfbep762eHcyEaQ5vRG2Np9i35QbcPyLzV1NcbZ4MbGaV3FvTai12tjURtQNgaLTW1tEUwGqnhNrcRPzCipNv6gGLL3iW9tfiSpWmGw4HBB7rkzAfAZxyhHfhPFAjY9PDzPb961T4kvwW6GGFkVe3b4D6VBK6YLYGDN5cZcwLLS5U4uJ\" target=\"_blank\" rel=\"noopener\">The Disappearers</a>,” Marlon James’s highly anticipated novel about a group of gay men in Kingston, Jamaica, in 1988.</p></li><li><p>Grace Krilanovich, who wrote “<a href=\"https://cna.st/affiliate-link/FQtSsbCs7qxyqxQ4bTX8nesTSgpJ6pQ3dZ9bVhGnfFWY2by2vuupu4GETbU4isdK64gmmN4HQyTwRHLXAfPFHhGaBUrjmHAR1Pr5U5nJ9FWgdN65oGmmsgAz5f8NNp5F2qbqMxiRxAggGWKDvoqN5y2YYS3mGo27t3D8jm35HizMwkrjx4AUywjRZqCoZV85oe133rnMZBeuLfXVQfJn5yw4ucsHkSvwz12VBwAKwLsp94NnDq63NSFNdGgfedDHT8swVzzpYDEqTAjNCm7epyhr2dEB5CKKpKABSdevbSNKwKybbajekXVpg2o7s8V2S6Rndjjwrz6aFhPggfHqKCPDn5HjK8PkFmd5jwg7wHUcWKUFhhn3mkdt8ZkgWkX2hSafY1oYeutbRyysNQWTRbw8PkG\" target=\"_blank\" rel=\"noopener\">The Orange Eats Creeps</a>,” has a new book out on September 8th, called “<a href=\"https://cna.st/affiliate-link/FQtSsbCs7qxyqxQ4bTX8nesTSgpJ6pQ3dZ9bVhGnfFWY2by2vuupu4GETbU4isdK64gmmN4HQyTwRHLVQ9j96ac5yBBdPrtUiS7ZHvEyLTPyVtBrgcWq4vx725XcYWCECqmvbZ88CvzcxqKC6LcZRBwbji7915SBSDMq3War1bb1mf4GQ1F8S4pf2MdwXoxLxPEy78sMJEhQvsLMRmxK3baNPnV8GqyNnGP1A43XY6fdLvdW4piS8xyBw2SBMjEAn1bdL5ypoj9aWurb7rZZG4awaxLqg5cAT1mSWMA7Q3SMRLL2bTGPZ3KAToKGoUDYMsWFxGydCcKThRUjP7uyKrfqS6BBxB6RKjsaqvSUUZYWjpD31awj27mDjpeceFs1iw89y3CMCnKZsiTQn1CAcF9S9AC\" target=\"_blank\" rel=\"noopener\">Acid Green Velvet</a>.” It’s set on the California coast, in the late nineteenth century.</p></li><li><p>Speaking of the apocalypse…Emily St. John Mandel’s new book, “<a href=\"https://cna.st/affiliate-link/2VASdQonq3VuP2nzW2m7ShdFY8hX5BqcevwcR2mGgeoepyfobAfTxxTRGSBL1nv1B7WfKfjDpVdxS2P65rsyM7ZDdtdmTaBhjLamX4x69pypF7CfMRTpr95JWshvS74pCBuuhymjRFeV6t5RcWw2CYh1vNYjWbSZM5mv5cUewMjCVMB2T49cFH6N54GKs6jtuuJa2PYMUASjDayqLQvfNe2JgJ9DPuD4jasHQqSVLRCggVMM1xYuBkZuX3XM84VeN2nHLDt34dkjGgDQP18WUpbxgoNEwQTQxjeh6mvp7Sttj4vneWxye9Lvb8b1CevDTJ9E4UgB3Q8rGDyW4NzNoLQJHjnXuLHhVFQUNP6w4411eEM4toWz3cgqHmWtcZUESzgr6CZHjXULMJkS3W\" target=\"_blank\" rel=\"noopener\">Exit Party</a>,” out on September 15th, is set in L.A., in 2031—the first spring after the fall of the United States. Will it be as prescient as “<a href=\"https://cna.st/affiliate-link/AipVsHgLTh89Za8tVpwoF2fDgeeX96b4yBJUNSg2vj7bPqHfTXMkfBbxHMXvFHYDuauCb3KqoQp27pqciYMA7NwnGYpz8MZmCiBYrZAuDZ2jS7mMtaJfHdL6UWQpk7VGn31a2u4Z4HZ6fhnptsjLDE4mNotnWTGmdMhnZ3vSqXwfpAtbtuX1i8rRADmks29wqYmNrmxfiLE88ZhB3kRyFg5BJQPs4ctxt5DgxKmW7yJikUXUEgC879Q32yCEJY4rbnxQ1VzvgSNTqR1pYhN7LG6McqytiHwpE9LEwNxHKytCAksAqTW8M2qfLKqnqFSLpscVSUHp1gZkaW1DTfWBnkyzoFsunUxyNDgxZ8JDPQroSuwRQmWvjB7i5ciuxxXk27dq6Spu8USQoqJ2NVRENDi\" target=\"_blank\" rel=\"noopener\">Station Eleven</a>” once felt?</p></li></ul><p><strong>P.S. Mackenzie Scott</strong> appears to be publishing a historical novel, in parts, <a href=\"https://lastdaysintwonations.substack.com/\" target=\"_blank\" rel=\"noopener\">on Substack</a>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
