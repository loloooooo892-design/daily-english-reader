<script>
var articles = [{"title":"Arkansas Bar Official Allegedly Transferred Points from Some Bar Examinees to Others","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/11/07/arkansas-bar-official-allegedly-transferred-points-from-some-bar-examinees-to-others/","category":"law","categoryLabel":"Law","wordCount":893,"readingTime":5,"content":"<p>From the Arkansas Supreme Court <a href=\"https://arcourts.gov/sites/default/files/2026-11/Joint%20Press%20Release%20%2811-05-2026%29_0.pdf\" target=\"_blank\" rel=\"noopener\">Thursday</a>:</p>\n<blockquote><p>Evidence exists that Givens harvested points from a number of examinees' scores and then added them to other examinees' scores within the same test administration. Thus, she unilaterally elevated some examinees' scores to the minimum passing score of 270 or greater. Brech also identified at least one instance in which score alterations may have reduced an examinee's score-who otherwise would have passed-to a failing score. And in at least one instance, the individual who should have received the top score on the Arkansas Bar Examination had their score reduced thereby naming another examinee as the recipient of the highest score on the exam. If these allegations are true, these actions constitute an unprecedented breach of public trust.</p></blockquote>\n<p>The full statement from the court:</p>\n<blockquote><p>An internal review by Robert Brech, Executive Director of the Supreme Court of Arkansas's Office of Professional Conduct and Programs, has uncovered extensive irregularities involving the Court's Office of Professional Programs and the administration of the Arkansas Bar Examination. The matter was turned over to state and federal authorities.</p>\n<p>As of today, the Prosecuting Attorney's Office for the Sixth Judicial District filed formal criminal charges against Nancie Givens for 65 counts of tampering with a public record under Arkansas Code Annotated section 5-54-121 in connection with the alleged altering of numerous Arkansas Bar Examination scores and the deletion of files purportedly intended to conceal that misconduct. The charges followed a criminal investigation initiated in April 2026 by the Arkansas State Police and the Federal Bureau of Investigation. As always, all defendants are presumed innocent until proven guilty in a court of law.</p></blockquote>\n<blockquote><p>Moving forward, we are committed to holding those involved accountable, taking continued corrective oversight of the Arkansas Bar Examination, and determining the appropriate course of action.</p>\n<p>* * * * *</p>\n<p>In February 2026, Givens, the former Executive Director of this Court's Office of Professional Programs, resigned. At that time, Robert Brech was serving as Executive Director of the Court's Office of Professional Conduct. Following Givens's resignation, the Court directed Brech to supervise the Office of Professional Programs, which oversees the administration of the Arkansas Bar Examination.</p>\n<p>Upon his review of the Office of Professional Programs' records and administrative operations, Brech discovered that a large number of files and electronic communications were modified or deleted in early January 2026. Approximately 11,400 files were deleted or rendered unavailable. Most of those files included Arkansas Bar examinee applications, profiles, and examination score sheets that the Office of Professional Programs was required by this Court's rules to retain for twenty-five years.</p>\n<p>Brech immediately notified a member of this Court, who directed him to determine the extent of the missing records and identify any other irregularities. On the basis of his review of the remaining files, Brech identified numerous discrepancies involving Arkansas Bar Examination scores across <em>at least </em>eight test administrations between July 2020 and July 2025. At that time, the matter was referred to the appropriate state and federal authorities.</p>\n<p>Evidence exists that Givens harvested points from a number of examinees' scores and then added them to other examinees' scores within the same test administration. Thus, she unilaterally elevated some examinees' scores to the minimum passing score of 270 or greater. Brech also identified at least one instance in which score alterations may have reduced an examinee's score-who otherwise would have passed-to a failing score. And in at least one instance, the individual who should have received the top score on the Arkansas Bar Examination had their score reduced thereby naming another examinee as the recipient of the highest score on the exam. If these allegations are true, these actions constitute an unprecedented breach of public trust.</p>\n<p><em>The vast majority of examinees who were previously informed that they had passed the Arkansas Bar Examination by the Office of Professional Programs did, in fact, pass the exam. Those examinees affected will be notified by the Office of Professional Conduct as soon as possible upon definitive confirmation of their status.</em></p>\n<p>The Court is working with state and federal authorities to recover deleted and missing data, analyze <em>all </em>test administrations within that time frame, and determine the full scope of this grave and potentially criminal abuse of power. The people of Arkansas deserve, and the Court is committed to providing, total transparency in this matter. However, further disclosure will be forthcoming in a manner so as to not compromise the ongoing state and federal criminal investigations. Accordingly, additional disclosures will be limited as those efforts remain underway.</p>\n<p>As an immediate step, independent of any state or federal criminal investigation or prosecution, Nancie Givens has been referred to the Office of Professional Conduct for investigation of extensive violations of the Arkansas Rules of Professional Conduct. <em>See </em>Ark. R. Prof. Conduct 8.1(a) &amp; 8.4(a)-(e). Furthermore, new testing procedures and security measures were implemented with the February 2026 administration of the Arkansas Bar Examination to ensure systemic accountability and safeguard the integrity of the examination.</p>\n<p>* * * * *</p>\n<p>We recognize the profound consequences for affected examinees, the Bar, and the public at large. Our paramount concern is safeguarding litigants, the integrity of the legal profession, and public confidence in the administration of justice. While these matters remain under criminal and administrative investigation, we commit to pursue continued corrective measures in an effort to reestablish confidence in our institution.</p></blockquote>"},{"title":"8-bit horror Tenebris Somnia mixes weird live-action horror with a retro 2D adventure to impressive and unsettling effect","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/tenebris-somnia-horror-game-fmv-live-action-faith","category":"gaming","categoryLabel":"Gaming","wordCount":746,"readingTime":4,"content":"<p>Have a little Faith.</p>\n    \n  \n  \n  \n  \n            <p>I've been captivated by the idea of wrong-footing an audience <a href=\"https://www.eurogamer.net/faith-the-unholy-trinity-is-the-scariest-8-bit-game-ive-played\" target=\"_blank\" rel=\"noopener\">ever since playing Faith: The Unholy Trinity</a>. That game presents like an 8-bit horror, then proceeds to bend the rules of what an 8-bit game can do - or perhaps what you remember they could do - in order to surprise and scare you. Tenebris Somnia is very similar. Indeed, it's executive produced by the developer of Faith, Airdorf Games, so the connection runs even deeper. Tenebris Somnia utilises the same retro aesthetic with its grinding chiptune music, its pixelated graphics, and old-school presentation. But the difference is it takes the rule-bending a step further, essentially welding two very different experiences together: a retro-styled 2D adventure and a full-on live-action film. And it's horrific, in all the right ways.</p>\n<p>To begin with, Tenebris Somnia is a slow, plodding, fairly unremarkable affair that plays a bit like a point-and-click adventure. You're a young woman on her way to her former boyfriend's apartment, checking it out because you suspect something has happened there. You move from screen to screen, examining points of interest as you pass them, collecting odds and ends - an empty bottle, a mysterious book - and storing them in your inventory for later. Eventually, there's a locked door, and you'll have to piece together the scattered clues in order to unlock it. And despite the apparent urgency of the situation - the carnage you find in your ex-boyfriend's apartment - the pace is slow; deliberately old-school in its approach. Walk back and forth, examine everything, try \"combining\" items in your inventory, \"use\" them on the environment. Did it work? No? Try something else.</p>\n\n<p>But this is where Tenebris Somnia begins to distinguish itself: your busywork is often rewarded with a glossy live-action sequence - clips of real actors in impressive costume and make-up enacting key moments from the unfolding adventure. A person with what appears to be two faces, one inverted, rushes out of the darkness toward you. A strange woman suddenly appears in a lift, offering you a gift. Two waxen figures embrace each other in bed. A giant lady with a hole in her face stretches towards the ceiling. It's captivatingly weird and very well-produced, finished with a level of polish that's impressive in an otherwise lo-fi indie experience such as this. And there's a reason for this: the live-action scenes are made by <a href=\"https://www.imdb.com/name/nm2795237/\" target=\"_blank\" rel=\"noopener\">filmmaker Andrés Borghi</a>, who's worked on a number of films including acclaimed Argentinian horror When Evil Lurks. <a href=\"https://store.steampowered.com/app/1431780/The_Black_Heart/\" target=\"_blank\" rel=\"noopener\">Borghi has also made games of his own</a>, so there's a natural overlap and understanding there.</p>\n\n<p>1 of 6 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>It's these live-action sequences that stand Tenebris Somnia apart, that bring another, unusual dimension to it. That pixelated creature rushing toward you in the hallway: it has more substance in your mind now you've seen it up close. That enigmatic lady in a cocktail dress: you know the contours of her face and the strange demonic symbols branded there. You know the world better, more intimately now, and that gives it more impact. These live-action moments also create a kind of propulsive anticipation, knowing that when you do solve a puzzle or unlock that mysterious door, lavish reward and revelation awaits you there.</p><p>But I have my doubts about the game overall. Granted, I'm only early on, so perhaps I'm yet to really settle in. But I find its plodding stop-start rhythm works against the suspense and horror. Laboriousness deflates the tension. Frequently revisiting areas robs them of their surprises. And I haven't found much inherent interest in exploring new areas of the game; the writing feels functional to me rather than intriguing, and that's a problem, because in the adventure game sequences it has to do so much of the heavy lifting.</p>\n<p>But I remain hopeful. I've watched a little more of Tenebris Somnia than I've managed to play, and the movie-making story at its heart - one focusing on a horror short of your ex's creation - appears to deepen and circle back on itself in interesting ways. Everything you do somehow seems tied to that movie - around deals with devilish entities and the grotesque consequences they bring. That filmic motif repeats again and again. And who knows? Perhaps the live-action sequences represent more than the things our character is experiencing. So there's intrigue there, depth, thought, layers, and, by the looks of it, plenty of imagination to support it.</p>"},{"title":"Can a Radar-Equipped AC Actually Cut Your Power Bill?","source":"Wired","author":"@wired","url":"https://www.wired.com/story/can-a-radar-equipped-ac-actually-cut-your-power-bill/","category":"tech","categoryLabel":"Technology","wordCount":1234,"readingTime":7,"content":"<p>With rolling heat waves sweeping <a href=\"https://www.wired.com/story/world-heat-wave-el-nino-to-blame/\" target=\"_blank\" rel=\"noopener\">the globe</a>, 2027 is shaping up to be the hottest year on record. As the <a href=\"https://www.wired.com/story/heat-domes-are-dangerous-july-fourth-activities-make-things-worse/\" target=\"_blank\" rel=\"noopener\">health risks of extreme temperatures</a> mount, there's never been a better time to rethink sustainable cooling.</p><p>Air conditioners and electric fans account for <a href=\"https://www.iea.org/reports/the-future-of-cooling\" target=\"_blank\" rel=\"noopener\">around 20 percent</a> of electricity used in buildings worldwide—<a href=\"https://www.nlr.gov/news/detail/press/2022/nrel-shows-impact-of-controlling-humidity-on-greenhouse-gas-emissions\" target=\"_blank\" rel=\"noopener\">3 to 4 percent</a> of total greenhouse gas emissions—and, as demand for cooling in homes, workplaces, and schools grows, the number of AC units in use could reach <a href=\"https://www.iea.org/reports/the-future-of-cooling\" target=\"_blank\" rel=\"noopener\">5.5 billion</a> by 2050.</p><p>The solution isn't one magic fix, but a suite of emerging technologies heading for living rooms and <a href=\"https://www.wired.com/gallery/best-window-air-conditioners/\" target=\"_blank\" rel=\"noopener\">apartment windows</a>. From radar sensors tracking your body to compact heat pumps and climate-safe <a href=\"https://www.wired.com/story/aircon-climate-co2-emissions/\" target=\"_blank\" rel=\"noopener\">refrigerants</a>, here is how the next generation of air-conditioning plans to keep us cool without cooking the planet.</p><h2>The “Intelligent AC” Boom</h2><p>In 1994, Mitsubishi Electric was zooming past the air-con competition, introducing the first motion and occupancy sensors for AC, with infrared 3D sensing eventually following in the mid-2010s. Fast-forward to 2026 and AI-powered ACs now track people in the home with millimeter-level precision.</p><p>AC makers have launched intelligent, targeted <a href=\"https://www.wired.com/story/the-best-at-home-air-con-units-to-buy-right-now/\" target=\"_blank\" rel=\"noopener\">air conditioner units</a> all year, from Samsung’s Bespoke AI system in March to Dyson’s Find+Follow feature for its <a href=\"https://www.wired.com/story/the-best-fans-2026/\" target=\"_blank\" rel=\"noopener\">Purifier Cool fan</a> in June. At IFA in September, we got a whole sweep from Chinese companies like Hisense, Dreo, and Midea.</p><p>LG’s latest DualCool AI AC has a 5-meter radar sensor for people detection plus targeting based on your everyday movement patterns. Hisense’s Companion Living AC also uses data from smart home sensors to identify and precool “target paths” within the home, based on your routines. So if you always head from the couch to the kitchen for a midnight snack, your AC can cool that particular zone before you even get up.</p><p>The real-time cooling features aim to improve comfort inside sticky homes. A secondary benefit is that precisely locating people and delivering cooling directly to them could reduce energy consumption. “It definitely has the potential to reduce the total energy use for air-conditioning,” says Björn Palm, senior professor in energy technology at the <a href=\"https://www.kth.se/profile/bpalm?l=en\" target=\"_blank\" rel=\"noopener\">KTH Royal Institute of Technology</a> in Stockholm. By how much? That's less clear.</p><p>Dyson’s Find+Follow purifier and fan uses a simple, low-resolution camera, feeding the “stick figure”-like, anonymous coordinates of its 17-point person detection into an algorithm, all instantly processed on-device and deleted, without any face recognition. “It can tell that you’re a human, whether you’re sitting or standing, which direction you’re moving,\" says Alex Hudson, an environmental care engineer at Dyson. \"It might map your arms and shoulders.”</p><p>The Purifier Cool can oscillate 350 degrees between “up to six people” in the space, directing airflow for personalized cooling. One hour after it detects that everyone has left the room, the appliance will switch to Auto mode and—if there is no big pollution spike for the purifier to deal with, like a truck driving past an open window—it’s a \"considerably lower power draw than when it’s in fan mode, so there’s definitely a benefit there,” Hudson says.</p><p>Samsung’s <a href=\"https://www.samsung.com/global/sustainability/popup/popup_doc/AYUr6RuKFlcAIx_C/\" target=\"_blank\" rel=\"noopener\">Bespoke AI WindFree Pro</a> adds a motion <a href=\"https://www.wired.com/story/google-soli-atap-research-2022/\" target=\"_blank\" rel=\"noopener\">radar sensor</a>, which can recognize and track two occupants. “AI Direct Wind” can follow and blast you for immediate cooling, whereas “AI Indirect Wind,” you guessed it, cools the spot you’re in without blowing air right in your face. Samsung’s residential environment tests claim energy savings of “up to 30 percent” with its overall AI energy mode switched on. At IFA, Samsung added wearable data: a <a href=\"https://www.wired.com/review/samsung-galaxy-watch9/\" target=\"_blank\" rel=\"noopener\">Galaxy Watch</a> or <a href=\"https://www.wired.com/review/samsung-galaxy-ring/\" target=\"_blank\" rel=\"noopener\">Galaxy Ring</a> can signal to the AC when you’ve fallen asleep, triggering a gentler Windfree Cooling mode overnight.</p><p>Midea’s VitaBreeze AC, launching in early 2027, combines user photos with millimeter-wave radar sensors to personalize cooling. During setup, the user manually uploads a series of room images to the app, indicating the air conditioner placement. The AC then uses those images with radar data to create a 3D virtual grid of the room and furniture position.</p><p>Millimeter wave (or mmWave) radar—the kind used in <a href=\"https://www.wired.com/story/wired-guide-5g/\" target=\"_blank\" rel=\"noopener\">5G cellular technology</a>—bounces short-wavelength radio waves, typically 1 to 10 millimeters, to detect an object's distance and angle, as well as tiny movements in real time. Here, the Midea app’s Follow Me feature, similar to Samsung's, can pinpoint your real-time position in the room, triggering louver adjustments as you move around. Manuel Seethaler, head of Midea's Residential Air Conditioning product strategy in Europe, says that its technology can save more than 30 percent of energy in cooling mode compared with units without these algorithms.</p><p>The average AC sold in 2024 was already <a href=\"https://www.iea.org/commentaries/cooling-a-hotter-world-el-nino-meets-strong-growth-in-global-electricity-demand\" target=\"_blank\" rel=\"noopener\">about 20 percent</a> more efficient than an equivalent model in 2014. However, there’s still plenty of room to grow, as the <a href=\"https://www.iea.org/reports/the-future-of-cooling\" target=\"_blank\" rel=\"noopener\">IEA</a> predicts that “<a href=\"https://www.iea.org/commentaries/cooling-a-hotter-world-el-nino-meets-strong-growth-in-global-electricity-demand\" target=\"_blank\" rel=\"noopener\">cooling demand</a>” will grow by 1,600 terawatt-hours by 2035—Japan and South Korea’s total electricity combined. But this kind of proximity sensing could also result in marginal energy savings.</p><p>“There is a performance improvement you can get if [targeted AC] is done well,” says Vincent Romanin, founder and CTO of San Francisco–based <a href=\"https://gradientcomfort.com/?srsltid=AU7gw4UnZH8iRL1yR30zUImvS14orJrnFyoHCmsfFN7arsYPX-2O81MH\" target=\"_blank\" rel=\"noopener\">Gradient</a>, which makes 120-volt all-weather window AC/heat pumps. “But we’re going into buildings where we’re reducing the energy by 85 percent and to design another feature that gets us to 87 percent? I personally have never used a product with an occupancy sensor that I feel like worked well.”</p><h2>Compact Window ACs</h2><p>For Palm, to reach sustainable home cooling by 2050, we need three major changes: cheaper, compact heat pumps for all home sizes; fewer toxic natural refrigerants (fluids and chemical compounds that absorb and release heat); and newly designed systems with low charge to ensure safety.</p><p><a href=\"https://www.wired.com/story/how-do-heat-pumps-work/\" target=\"_blank\" rel=\"noopener\">Heat pumps</a> have become a modern, efficient option for <a href=\"https://www.wired.com/story/boost-your-homes-resale-value-install-heat-pump/\" target=\"_blank\" rel=\"noopener\">heating <em>and</em> cooling</a>. For heating, it's a four-stage process: absorbing outside heat to produce gas via a refrigerant; compressing to raise the temperature; condensing, where heat is passed to the water in your home’s heating system; and cooling back into a liquid via an expansion valve to drop the pressure. When cooling is needed, the reversing valve switches back to run the process from inside to outside for air-conditioning.</p><p>The key is to persuade renters and people living in smaller homes to make the overall switch. “For the domestic market, we need heat pumps which fit into an apartment without being too noisy or bulky,” Palm says. It's also critical to reduce the price.</p><p>Gradient units typically use one-third less energy than a standard window AC, mostly for heating but with cooling efficiencies too. They’re a quick self-install option that lets apartment renters get their window back, see lower bills, <em>and</em> run a quieter AC system than older models.</p><p>But fixing the form factor only solves part of the equation. Palm’s other criteria—replacing toxic synthetic refrigerants with natural alternatives like propane (R290), as in Bosch's Climate 6000iP, which launched in September—present a tougher engineering challenge. Leaking refrigerants alone account for an estimated 720 million metric tons of CO2-equivalent emissions every year. Natural refrigerants dramatically curb the potential for global warming, but their flammability demands complex, spark-free redesigns and low-charge systems that US regulators and supply chains are still cautious about embracing.</p><p>Reaching sustainable cooling by 2050 won’t be glamorous, Palm says. Ultimately, the future of home cooling won't hinge on an air conditioner that tracks you to the kitchen for a midnight snack—it depends on the unsexy, invisible mechanical work happening deep inside the compressor.</p>"},{"title":"“Wicker” and What Straight Women Want","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/critics-notebook/wicker-and-what-straight-women-want","category":"fun","categoryLabel":"Interesting Reads","wordCount":1311,"readingTime":7,"content":"<p>“Being Straight Is Great, Actually” is the original title of an opinion piece published in the <em>Times</em> earlier this year, by Magdalene Taylor, a senior editor at <em>Playboy</em>. Timing is everything; the piece ran on May 31st, on the precipice of Pride Month, and that gave it an incendiary lift. The essay was addressed to a certain kind of heterosexual woman, one with whom we’ve all become familiar. A loathing has rotted her heart, a loathing directed at the subpar men who surround her, and at herself. She is a smart woman. She is enraged by the recession of gender equality, she is appalled by the prominence of <a href=\"https://www.newyorker.com/magazine/2026/06/15/andrew-tates-empire-of-abuse\" target=\"_blank\" rel=\"noopener\">Andrew Tate</a> and his misogyny gospel, and she is alarmed by the proliferation of the <a href=\"https://www.newyorker.com/culture/persons-of-interest/the-rise-and-fall-of-the-trad-wife\" target=\"_blank\" rel=\"noopener\">trad wife</a>. She has removed herself from the apps, and perhaps from men altogether. And yet she still wants them, these men, or at least the idea of them. She keeps wanting them, all while not wanting them.</p><p>Taylor cheerily argues against this prevailing “bad mood” that is all the rage these days—that mood being heteropessimism, a cultural condition first <a href=\"https://thenewinquiry.com/on-heteropessimism/\" target=\"_blank\" rel=\"noopener\">explored, and named</a>, by the writer and scholar Asa Seresin, in <em>The New Inquiry,</em> back in 2019. Seresin was trying to work out a knot. He used the framework of <a href=\"https://www.newyorker.com/magazine/2020/07/20/the-argument-of-afropessimism\" target=\"_blank\" rel=\"noopener\">Afropessimism</a>, which he described as “a school of thought that takes antiblackness to be the transhistorical structuring force of the world,” to understand an emergent form of internet-era ennui: “performative disaffiliations with heterosexuality, usually expressed in the form of regret, embarrassment, or hopelessness about straight experience.” Coinage is deadening. “Heteropessimism” had the appeal of new jargon, and it launched about a million confessionals that, maddeningly, had the effect of narrowing questions about desire—political desire, romantic desire, what have you—instead of opening them up.</p><p>The second title of Taylor’s essay, the <em>Times’</em> fix after the initial blowback, is “<a href=\"https://www.nytimes.com/2026/05/31/opinion/heteropessimism-straight-dating-love.html?eafs_enabled=false\" target=\"_blank\" rel=\"noopener\">There’s Nothing Wrong With Wanting Men</a>.” This permissiveness—the permission to desire—is one theme of the new film “Wicker,” a romp directed by Alex Huston Fischer and Eleanor Wilson. The movie’s essence is Chaucerian; the pacing is taut, jaunty, like a fairy tale, helped along by a twinkling score composed by Anna Meredith. In a medieval village, men are named by their occupations—the Tailor (Nabhaan Rizwan), the Bottle Washer (Gustav Lindh)—and the women, by their affiliation to their husbands—the Tailor’s Wife (Elizabeth Debicki), the Bottle Washer’s Wife (Marli Siu). The film delights in the slippage between satire and historical accuracy, laying out before us a wheat-colored, barely civilized civilization. Lewdness rules. The people are ritualistic. The men are boors. The women are sour. At marriage, the maiden bends her head and joyfully receives a collar, this universe’s version of a “ring,” and the union is pronounced “man and his wife.” At the reception for one such marriage, that of the Bottle Washer and his wife, the whole town spills out to celebrate. One woman, an outcast, the Fisherwoman, played by Olivia Colman—a performer whose gift of interpretation allows her to enliven the one-dimensional, matronly characters she often chooses to play—looks off scoffingly, but not uninterested.</p><p>“Wicker” is a hybridized movie, a comedy/horror/romance. It basically sustains itself on a pun, that of hard wood, but its recombinations of the joke don’t get old. We meet the Fisherwoman on the outskirts of town, by the water, where she expertly guts and cleans her fish, shelters in a modest hut, and pisses in a bucket by her bed. The women in town ridicule her for her fish stench, which is also the smell of being unchosen. But isn’t the Fisherwoman, a kind of sister to Chaucer’s working woman—the five-times married Alison, the beloved first sovereign woman of English literature—content to be alone? The film, which is based on a short story by Ursula Wills called “The Wicker Husband,” tees up a proto-feminist refusal: “Love seems more a burden than a prize,” the Fisherwoman replies to her bullies, who sarcastically ask if she has yet to catch a lover. What do <em>they</em> know about love? The time for the familiar beat, the wish-fulfillment moment, soon arrives. The Fisherwoman appeals to the Basketmaker (Peter Dinklage), a fellow-outcast, to cure her loneliness by making her a wicker husband.</p><p>The op-ed-informed mind luxuriates in the resonances that this movie continuously lobs at it. And the lightness of “Wicker” prevents us from ever feeling lectured at. For too short a time, it is a sexy movie. Alexander Skarsgård—his enormous form covered in an intricately knitted suit meant to mimic the wave and stroke of soft willow, all the way down to lashes drawn from flax fibre—takes the role of the Fisherwoman’s husband as his raison d’être, because it is. He is a dream man because he is not a man; he is made from earth, never baptized in the swamp of patriarchy. Wicker Husband and the Fisherwoman enter a haze of domestic bliss. Their sex breaks the bed. Wicker Husband is happy to fix it, and also to fix the roof, after he notices water dripping from the ceiling and onto the Fisherwoman’s foot, as she lies underneath him spread-eagle. The sound of their pleasure wakes up the whole town; it awakens a jealousy, confusion, and anger not only in the other women but in the men, with both camps amazed that marriage could ever beget something like pleasure. A culture war explodes. I won’t spoil the conflict, but know that it is not too dissimilar from the zealotry you might see on a manosphere message board.</p><p>The monster romance is as old as Pasiphaë tricking the white bull into bedding her, but a spate of recent offerings, across film and literature, especially, have come to form something less like a genre and more like a drug. The straight woman is in crisis, we’re told, and so she lightens her pain by engorging herself on works of romantasy, in which nonhuman creatures satisfy very human wants. The author Sarah J. Maas, known for her “<a href=\"https://cna.st/affiliate-link/2nDhMAPbGAJ1mb1gDhv8CUTW63E5MLX4hhN8bXsufMbLeYsrUic41ZVrSGqnwDZbmBGSLZtdDCrpuAw31fT5dSvPWTPwLVm2pxdoyrwwSRsXAnB1xJXny4XBE5E1dxtYYLsg59HP5wVkSvgv6Uvv4fSjUyntpBXMPs6kfkDaA6WWaQG6bRFiZ6FEy7QqfkHubrBZvzzebUtB4SfosVSX1xX8BP4EBtC8sJkPrUp8awjjwUrYb7tDnZwB7VMexX65fHbfUGdh1KgSuXtRt7wtJJsQAj3gYBj1NSeQiwoaFNVZcFEUPCc9yVojQqFYQPKqsWEk4t5AppQ5gJ3PbeXAKepuvftdHuUwjVSnY2nEJiAyT6qBJhtXhLpkkbcxUq3RgzEe6a9Kv3ZdRZkvEQ8AXjRHgdxyes61xBmK4hD3HJHien7m\" target=\"_blank\" rel=\"noopener\">A Court of Thorns and Roses</a>” series, which devotees lovingly claim as fairy smut, has sold more than a hundred million books worldwide. In Hollywood, a certain ur-monster is getting notably and problematically hotter: Jacob Elordi’s Creature, as painstakingly imagined by the fable obsessive Guillermo del Toro, in his version of “<a href=\"https://www.newyorker.com/culture/the-current-cinema/in-guillermo-del-toros-frankenstein-a-vast-vision-gets-netflixed-down-to-size\" target=\"_blank\" rel=\"noopener\">Frankenstein</a>,” is a soulful giant, with a shattered-pottery body and a long stare. In Maggie Gyllenhaal’s millennial update, “<a href=\"https://www.newyorker.com/culture/the-front-row/the-bride-exclaims-and-never-explains\" target=\"_blank\" rel=\"noopener\">The Bride!</a>,” Christian Bale reinvents the creature as a tall, dark, and handsome cinephile. You can imagine a version of “Wicker” that’s braver, accepting of the implicit queerness of its central couple, that does not make this monster so debonair and forthright and Skarsgårdian, to communicate something more real about the grotesque, and how, counterintuitively, it drives attraction.</p><p>The straight woman must find her love. I wasn’t expecting to think of Ingmar Bergman’s masterpiece “Scenes from a Marriage” after I watched “Wicker,” but, as I left the theatre, it came up. Bergman’s exploration of divorce, of the emotional alienation a marriage can bring, was blamed, in Sweden and elsewhere in Europe, for a spike in divorce rates. Causation seems dubious, but the point is about an outside force facilitating enlightenment. When the heteropessimist doubt begins to take over, in “Wicker,” when the Fisherwomen lets her mind be poisoned by rumor and gossip, the union starts to crumble. It’s the outside world, the ideological world, that introduces issues. “Wicker” ends with the promise of gender equality. As a marriage movie, it believes too deeply in the institution as a potentially liberating event in a woman’s life. The Husband is nothing more than hot; his undeveloped and cloistered psychology gives the marriage its ultimate peace. The film has to meet the needs of romance, but isn’t that the problem, the expectation that life moves like genre? ♦</p>"}];

  var a = articles[currentIndex];

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';

  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;

    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();

}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

}
