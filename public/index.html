<style>

  --border: #E2E5EB;

  --warning-text: #8A6D3B;

  --swap-bg-hover: #DDE2EA;
}

    --bg: #191C22;
    --bg-card: #1F232B;

    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Laid off id Software developer says crunch on Doom: The Dark Ages' Revelations DLC was \"brutal\" with up to 17-hour days","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/doom-the-dark-ages-revelations-id-software-crunch","category":"gaming","categoryLabel":"Gaming","wordCount":545,"readingTime":3,"content":"<p>\"You spend so much of your energy and sacrifice a bunch of things, and then they lay you off.\"</p>\n    \n  \n  \n  \n  \n            <p><a href=\"https://www.eurogamer.net/games/doom-the-dark-ages\" target=\"_blank\" rel=\"noopener\">Doom: The Dark Ages</a> - Revelations, an expansion-sized DLC, was released in July, in the same week <a href=\"https://www.eurogamer.net/microsoft-xbox-layoffs-2026-double-fine-compulsion-ninja-theory\" target=\"_blank\" rel=\"noopener\">Microsoft announced its sweeping 3,200 staff layoffs</a>. The layoffs impacted almost the entirety of the Xbox studio portfolio - including Doom maker id Software.</p>\n<p>One of the developers who had spent weeks crunching to ship Revelations on time were laid off just as the expansion was released. Producer Andrew Willis said they spent the two months leading up to launch \"working something like at least 12 hours every day\".</p>\n<p>\"I know I hit 17 [hours] a couple of days. It was brutal, and the majority of the game got made in three or four months,\" Andrew Willis told <a href=\"https://insider-gaming.com/doom-the-dark-ages-revelations-worst-crunch-franchise-history/\" target=\"_blank\" rel=\"noopener\">Insider Gaming</a>. \"There were days where I didn't see my son the whole day; multiple days of that that I sacrificed to get this out the door at the level of quality. And it's not just me, but everybody on the team was really putting in the hours.\"</p>\n<p>Id Software was hit especially hard in the layoffs, with <a href=\"https://www.eurogamer.net/xbox-layoffs-july-2026-id-software\" target=\"_blank\" rel=\"noopener\">the studio reportedly losing over half of its members</a>. The extent to which the dismissals will have on the studio's future has been a matter of debate. <a href=\"https://www.eurogamer.net/doom-quake-studio-id-software-gutted-xbox-cuts-game-ideas\" target=\"_blank\" rel=\"noopener\">Some suggested id Software was gutted, as it lost key senior and longtime staff</a>, many of whom responsible for the id Tech engine and several other core disciplines. <a href=\"https://www.eurogamer.net/id-software-xbox-cuts-doom\" target=\"_blank\" rel=\"noopener\">Co-studio director Hugo Martin, however, pushed back at some of those sentiments</a>, saying that the team that remains is about the size of the one that made Doom (2016).</p>\n\n<p>Willis said crunch wasn't mandated by the studio, but everyone was overloaded with work that they had to find a way to do it all. \"You get loaded up with 60 hours of work in a week, and what do you do?\" Willis added.</p><p>\"You can make a version of that work that would probably be just barely passable, but is that what you want to put your name on? It's almost this thing, like, at the level of quality that the players expect and that you expect from yourself, it's kind of, like, almost pseudo-induced crunch.\"</p>\n<p>Willis added that some of the people on the team had worked for Hollywood for 20 years and game development for 10 \"said that this was the worst crunch they'd been a part of\".</p>\n<p>\"You spend so much of your energy and hours of your life, and sacrifice a bunch of things, to get something out the door, and then they lay you off the day before,\" Willis said. \"It's such a wild feeling\".</p>\n<p><a href=\"https://www.eurogamer.net/what-sense-to-make-from-id-software-layoffs-microsoft-xbox\" target=\"_blank\" rel=\"noopener\">As Rick Lane argues, regardless of how grim you think things are looking for id Software at the moment, the cuts don't make a lot of sense</a>. Chris Hayes, lead services provider at id - who remains at the studio - <a href=\"https://www.eurogamer.net/id-software-slams-xbox-interview-impossible-aaa-games\" target=\"_blank\" rel=\"noopener\">recently spoke out against Xbox's layoffs, saying it's \"impossible\" to make games like 2016's Doom</a> with the number of people that remains.</p>\n<p>Revelations is the only add-on to be released for Doom: The Dark Ages. It's not yet clear what id's next project is going to be.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Waymo goes on offense ahead of Tesla’s Cybercab launch","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/09/01/waymo-goes-on-offense-ahead-of-teslas-cybercab-launch/","category":"tech","categoryLabel":"Technology","wordCount":976,"readingTime":5,"content":"<p>Waymo argued last week that fully autonomous vehicles are not possible without using a mix of sensors, and that “pure end-to-end” AI systems are not safe enough — shots at Tesla, despite the Alphabet-owned company not naming names.</p>\n<p>The company took these swings in a <a href=\"https://waymo.com/blog/2026/08/10ailessons/\" target=\"_blank\" rel=\"noopener\">blog post</a> and <a href=\"https://www.axios.com/2026/08/26/waymo-ai-shortcut-self-driving\" target=\"_blank\" rel=\"noopener\">an interview with Axios</a> just one week ahead of a September 3 event where Tesla is expected to formally introduce its two-seater Cybercab into its own small-but-growing robotaxi fleet. Waymo also announced three new markets on Tuesday morning, further extending its robotaxi network, which is serving customers in <a href=\"https://techcrunch.com/2026/09/01/waymo-accelerates-robotaxi-expansion-with-launches-in-denver-san-diego-and-tampa/\" target=\"_blank\" rel=\"noopener\">more than a dozen U.S. cities</a>.</p>\n<p>Despite being technical and a bit wonky, Waymo’s claims kicked off a social media fight that lasted all weekend.</p>\n<p>“Arguments they bring forward are poor,” Pierre Ferragu, an analyst and managing partner at New Street Research who covers Tesla, <a href=\"https://x.com/p_ferragu/status/2093127637681983906\" target=\"_blank\" rel=\"noopener\">wrote on X.</a> “My read: Waymo built a driving gas plant that AI at scale makes irrelevant, and now falls into incumbent rhetoric. Innovator dilemma 101.”</p>\n<p>“How it feels to say your data and record of success leads you to believe driverless mileage, AI interpretability, and multiple sensor types are critical for safe, fully autonomous driving at scale,” <a href=\"https://x.com/ethanteicher/status/2093769005802676679\" target=\"_blank\" rel=\"noopener\">wrote Ethan </a><a href=\"https://x.com/ethanteicher/status/2093769005802676679\" target=\"_blank\" rel=\"noopener\">Teicher</a>, a Waymo spokesperson, while sharing a John Wick promo image that depicts more than a dozen guns pointed at the head of Keanu Reeves’ character.</p>\n<p>The metaphorical knives — or guns, apparently — are out because if Tesla can prove the Cybercab is capable of performing at scale, it would set up a major fight between the two companies and their disparate approaches to developing autonomous vehicles. At stake is a market that <a href=\"https://www.goldmansachs.com/insights/articles/robotaxis-to-become-a-400-billion-dollar-market-in-2035\" target=\"_blank\" rel=\"noopener\">could be worth</a> <a href=\"https://www.morganstanley.com/insights/articles/robotaxis-1-trillion-dollar-investor-opportunity\" target=\"_blank\" rel=\"noopener\">hundreds of billions of dollars</a>.</p>\n<p>For years, this fight was more academic or philosophical than anything. But last week Waymo flexed its real-world experience.</p>\n<p>“Cameras are incredible, but they aren’t enough,” Srikanth Thirumalai, a VP who oversees Waymo’s driving software, wrote in the company’s blog post. “For years, there’s been a debate over whether cameras alone could solve full autonomy. Now, after more than 200 million real-world miles, the data is clear: safe, fully autonomous operations at scale require more. By combining inputs from cameras, lidar, and radar, the Waymo Driver creates a rich, redundant world view that no single sensor can replicate.”</p>\n<p>Thirumalai also wrote that a pure end-to-end neural architecture that “takes in raw pixels and directly outputs steering commands” — which is Tesla’s approach to autonomy — will “run the risk of black box failures.”</p>\n<p>“Even the best AI models with trillions of parameters still hallucinate,” he told <a href=\"https://www.axios.com/2026/08/26/waymo-ai-shortcut-self-driving\" target=\"_blank\" rel=\"noopener\">Axios</a>. “There is no click reboot or reload or refresh [in] physical AI. You have to deal with the consequences of it.”</p>\n<p>Waymo has long taken the approach of integrating a mix of cameras, radar, and lidar sensors into vehicles built by other manufacturers. While it’s a more conservative technological approach, it has allowed the company to scale to a fleet of around 4,000 robotaxis across 14 U.S. cities, which provides 500,000 paid trips per week.</p>\n<p>At Tesla, Elon Musk has long derided the use of lidar, calling it a “crutch.” The company has instead put all its efforts into trying to make fully autonomous cars using just cameras and AI. And Tesla has spent the last few years developing the Cybercab, a purpose-built two-seater gold sedan designed to be autonomous from the get-go.</p>\n<p>The Cybercab has no steering wheel or pedals and a relatively small battery, and Tesla plans to pump out thousands of them — a recent filing shows the company aiming to <a href=\"https://assets-ir.tesla.com/tesla-contents/IR/TSLA-Q2-2026-Update.pdf\" target=\"_blank\" rel=\"noopener\">build more than 125,000 annually</a>.</p>\n<p>Of course, Tesla still needs to show that its self-driving software is capable of full autonomy. The company is years behind schedule; Musk once promised there would be 1 million robotaxis on the road in 2020 — though the company has spent the last year trialing its own Tesla Robotaxi network in a handful of cities in Texas and Florida using modified Model Y SUVs.</p>\n<p>Those trials have stayed small, with Tesla claiming it’s prioritizing safety over scale. It’s only within the last few weeks that Tesla has <a href=\"https://www.theverge.com/transportation/982759/tesla-robotaxi-unsupervised-austin-robotaxi-tracker\" target=\"_blank\" rel=\"noopener\">pulled safety monitors out of a majority of those cars</a>. </p>\n<p>But that is likely about to change. Tesla has started registering Cybercabs with the Texas DMV ahead of the September 3 event. It’s unclear how quickly the company plans to scale the fleet after introducing the shiny two-seater, though social media users have spotted dozens of them sitting in parking lots around the country.</p>\n<p>If Tesla can show that its AI-first approach to self driving can work at scale, it would be a major accomplishment for the company and validation for its software engineers.</p>\n<p>The company will still have to demonstrate that it can solve all the other problems that come with operating a robotaxi network, though — problems that Waymo continues to discover as it operates thousands of self-driving cars. Those include navigating harsh weather, steering clear of emergency situations, and operating safely around school zones.</p>\n<p>But beyond the technological differences, there’s another fight brewing: cost. Waymo’s technological approach is naturally more expensive. It uses more sensors, and installs them on vehicles that other companies manufacture. That means Waymo has to buy those vehicles and, in the case of the Zeekr-made Ojai, pay import taxes on them before they’re even outfitted with self-driving technology.</p>\n<p>Tesla makes its own cars and is betting its AI will be capable enough to never need anything other than a few cameras to navigate the world. It’s a major gamble — one Waymo clearly thinks won’t pay off. But if it does, it gives Tesla the chance to outcompete Waymo, or possibly even Uber, on price.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"SCOTUS sides with Trump administration in mail-in voting dispute ","source":"SCOTUSblog","author":"Blake Fox","url":"https://www.scotusblog.com/2026/08/scotus-sides-with-trump-administration-in-mail-in-voting-dispute/","category":"law","categoryLabel":"Law","wordCount":760,"readingTime":4,"content":"<p><em>Today, as part of our Closer Look series on famous Supreme Court plaintiffs, we look at the Schechter brothers, the plaintiffs in the case </em><a href=\"https://supreme.justia.com/cases/federal/us/295/495/\" target=\"_blank\" rel=\"noopener\">A.L.A. Schechter Poultry Corporation v. United States</a><em> (the “sick chicken case”), in which the justices defied FDR and which is one of just <a href=\"https://supreme.justia.com/cases/federal/us/293/388/\" target=\"_blank\" rel=\"noopener\">two</a> times in American history that the Supreme Court struck down a federal statute under <a href=\"https://www.law.cornell.edu/wex/nondelegation_doctrine#:~:text=The%20non%2Ddelegation%20doctrine%20is,government%20or%20to%20private%20entities.\" target=\"_blank\" rel=\"noopener\">the non-delegation doctrine</a>.</em></p><p>Joseph, Martin, Aaron, and Alex Schechter were four Jewish brothers who were <a href=\"https://www.nytimes.com/1935/05/28/archives/schechter-takes-decision-gloomily-60000-cost-of-legal-fight-tempers.html\" target=\"_blank\" rel=\"noopener\">born</a> in Hungary between the late 1890s and early 1900s. Sometime in the early 20th century, the Schechter brothers immigrated to the United States from Hungary with their parents. As young men, they became notable figures in Brooklyn’s <a href=\"https://www.chabad.org/library/article_cdo/aid/113425/jewish/What-Is-Kosher.htm\" target=\"_blank\" rel=\"noopener\">kosher</a> food industry. Joseph <a href=\"https://supreme.justia.com/cases/federal/us/295/495/\" target=\"_blank\" rel=\"noopener\">ran</a> the Schechter Poultry Corporation in East Flatbush, Brooklyn, and Martin, Aaron, and Alex owned A.L.A. Schechter Corporation in Farragut, Brooklyn.</p><p>As slaughterhouse operators <a href=\"https://fee.org/articles/thats-not-kosher-how-four-jewish-butchers-brought-down-the-first-new-deal/\" target=\"_blank\" rel=\"noopener\">in</a> the poultry industry (their last name, Schechter, means “slaughterer” in Yiddish), the brothers would purchase birds from sellers at <a href=\"https://villagepreservation.org/2017/04/17/the-end-of-the-west-washington-market/\" target=\"_blank\" rel=\"noopener\">West Washington Market</a> in New York City, railroad depots around New York City, and occasionally Philadelphia. The birds would then be trucked to the Schechters’ poultry shops in Brooklyn. Upon purchase by customers, the birds would be immediately slaughtered by a <em>schochtim</em>, a kosher slaughterer employed by the Schechters.</p><p>In 1933, President Franklin D. Roosevelt signed the National Industrial Recovery Act, a part of the New Deal that aimed to reduce competition. Violations could result in criminal charges. The Roosevelt administration believed <a href=\"https://www.historynewsnetwork.org/blog/57574\" target=\"_blank\" rel=\"noopener\">too</a> much competition was reducing prices, which then lowered wages and consumers’ purchasing power. The National Recovery Administration, created under the NIRA, thus instituted <a href=\"https://www.historynewsnetwork.org/blog/57574\" target=\"_blank\" rel=\"noopener\">regulations</a> aimed at increasing wages and stabilizing trade practices. Section 3 of the NIRA gave the president broad authority to set “codes of fair competition” and, under this authority, the Roosevelt administration <a href=\"https://www.thirteen.org/wnet/supremecourt/capitalism/landmark_schechter.html\" target=\"_blank\" rel=\"noopener\">promulgated</a> the Live Poultry Code. One such rule under this code was for “straight killing,” requiring most purchasers to purchase either a coop or half coop of chickens rather than allowing them to pick out individual chickens. The Roosevelt administration believed that this rule would stabilize competition by preventing customers from selecting just the best chickens and leaving sellers with difficult-to-sell birds.</p><p>A year after the NIRA was instituted, inspectors found numerous violations of the Live Poultry Code at the Schechters’ poultry shops. (The Roosevelt administration had targeted the poultry field because of alleged corruption in the industry.) The Schechter brothers and their businesses were indicted on more than 60 counts, <a href=\"https://www.nytimes.com/1934/07/27/archives/nra-indictments-name-poultry-men-four-schechter-brothers-face.html\" target=\"_blank\" rel=\"noopener\">including</a> “sell[ing] for human consumption unfit poultry” and various violations of rules for selecting chickens.</p><p>At trial, the Schechters were convicted on 19 counts. The U.S. Court of Appeals for the 2nd <a href=\"https://law.justia.com/cases/federal/appellate-courts/F2/76/617/1564472/\" target=\"_blank\" rel=\"noopener\">Circuit</a> upheld every one of these but two. The Schechters then took their case to the Supreme Court and challenged the NIRA, particularly Section 3. They argued Congress had given, or “delegated,” too much of its lawmaking power to the president by giving him broad power to create such regulations.</p><p>In 1935, in a unanimous decision, the Supreme Court struck down the NIRA, including Section 3, as an unconstitutional delegation of legislative power to the president. Additionally, the court struck down the NIRA on the basis that Congress had no power to pass the statute under the commerce clause since they were regulating businesses that were entirely <a href=\"https://constitutingamerica.org/schechter-poultry-corp-v-u-s-1935-guest-essayist-tony-williams/\" target=\"_blank\" rel=\"noopener\">intrastate</a>.</p><p>The Schechter brothers praised the court’s decision, stating through their lawyer that “[o]ur victory indicates that American justice does not permit persecution.”</p><p>Roosevelt was not so pleased. He criticized the justices’ <a href=\"https://kevinterralbrewer.com/sickchicken/\" target=\"_blank\" rel=\"noopener\">“horse-and-buggy”</a> interpretation of the commerce clause. The decision is also <a href=\"https://kevinterralbrewer.com/sickchicken/\" target=\"_blank\" rel=\"noopener\">believed</a> to have contributed to his proposal to “pack” the court.</p><p>Despite winning before the justices, Joseph Schechter ultimately regretted litigating the case given its significant financial cost to him: A 1935 New York Times article <a href=\"https://www.nytimes.com/1935/05/28/archives/schechter-takes-decision-gloomily-60000-cost-of-legal-fight-tempers.html\" target=\"_blank\" rel=\"noopener\">reported</a> that Schechter owed $60,000 ($1.4 million in today’s money) in legal fees. (After the article ran in the Times, Schechter received donations from across the country, <a href=\"https://www.nytimes.com/1935/06/02/archives/100-sent-to-schechter-cincinnatian-helps-defray-cost-of-famous.html\" target=\"_blank\" rel=\"noopener\">including</a> from several business groups, but he never <a href=\"https://kevinterralbrewer.com/sickchicken/\" target=\"_blank\" rel=\"noopener\">fully</a> recovered his legal fees.)</p><p>A Times article published on the one-year anniversary of the decision <a href=\"https://kevinterralbrewer.com/sickchicken/#_ftn52\" target=\"_blank\" rel=\"noopener\">revealed</a> that due to financial difficulties, A.L.A. Schechter Corporation had gone out of business. At the time of the article’s publication, Joseph was unemployed while Aaron and Alex ran a small poultry store and Martin worked at a chicken market. Later, Joseph Schechter was <a href=\"https://cmn-cdn-001.sagepub.com/books/titles/245976/att_sb1_73821.pdf?utm_source=chatgpt.com\" target=\"_blank\" rel=\"noopener\">reported</a> to have been working at “Schechter Poultry” into the late 1970s. Located in Brighton Beach, Brooklyn, the store specialized in selling cooked chickens; by that time live poultry markets were a rarity.</p>"},{"title":"New Maps Show How Israel Has Thwarted Hopes for a Palestinian State","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/a-reporter-at-large/new-maps-show-how-israel-has-thwarted-hopes-for-a-palestinian-state","category":"fun","categoryLabel":"Interesting Reads","wordCount":844,"readingTime":5,"content":"<p>Ten years ago, Frank Lowenstein, then the United States special envoy for Israeli-Palestinian negotiations, presented President Barack Obama with <a href=\"https://www.newyorker.com/news/news-desk/the-map-of-israeli-settlements-that-shocked-barack-obama\" target=\"_blank\" rel=\"noopener\">maps of settlements</a> by Israeli Jews in the occupied West Bank. The maps revealed that a chronic problem had turned critical. The expansion of settlements crisscrossing the West Bank threatened the hope of establishing a contiguous Palestinian state there. As Jews and Palestinians lived in roughly equal numbers in Israel and the territories it had occupied since 1967, those settlements also imperilled Israel’s claim to be both Jewish and democratic. By gradually accomplishing a de-facto annexation of the West Bank, the settlements would require Israeli Jews either to rule over a resentful non-Jewish population of about equal size or to surrender the Jewish identity of their state. From the perspective of the United States, either scenario would undermine the stability of the region.</p><p>Obama was in the final weeks of his Presidency, and Lowenstein’s maps helped persuade him to let the United Nations Security Council pass a resolution condemning the settlements, which most of the world had long considered violations of international law. (The U.S. declined to exercise its veto and abstained from the vote.) In a speech a few days later, on December 28, 2016, Secretary of State John Kerry defended that decision with a stark warning that settlement expansion was “increasingly cementing an irreversible one-state reality.” He continued, “Is ours the generation that gives up on the dream of a Jewish democratic state of Israel living in peace and security with its neighbors? Because that is really what is at stake.”</p><p>Ten years later, Lowenstein, now a policy fellow at the liberal Zionist advocacy group J Street, is still updating those maps. He told me that the breakneck expansion of officially authorized settlements and unauthorized (or not yet authorized) settler “outposts” has made Kerry’s warning seem impossibly hopeful. Last week, the government of Prime Minister Benjamin Netanyahu, in an apparent effort to shore up support ahead of the upcoming Israeli elections, issued a tender offer for the construction of another twelve hundred units of settler housing in a location explicitly meant to divide the remaining Palestinian-administered areas of the West Bank. The European Union and more than twenty governments, including the United Kingdom, France, and Germany, have urged Israel to immediately retract the tender, because the construction would “undermine the prospect of the two-state solution by driving a wedge through the West Bank.” The U.S. has not signed the statement. But the tender prompted even the Trump Administration to reiterate its opposition to the annexation of the West Bank, saying that “a stable West Bank keeps Israel secure.”</p><p>Lowenstein told me that the evolving maps have drained the meaning from those Obama-era debates about the viability of a Palestinian state, forcing a revision of the vocabulary that American politicians use to talk about the conflict. More than five hundred thousand Jewish settlers already reside among more than three million Palestinians in the West Bank, which has been designated as part of a future Palestinian state since the 1947 United Nations resolution that proposed the creation of the state of Israel. And the Israeli government’s support for those settlements has grown increasingly bold. During the eight years of the Obama Administration, Israel approved just three new settlements in the West Bank; since the start of 2023, roughly when the current Israeli government came to power, it has approved one hundred and four. It has authorized construction of more than fifty-eight thousand units of housing, and the total number of settlements and outposts has more than doubled over the same period, from about three hundred to about six hundred and forty. Violence against the Palestinians, meanwhile, has increased in tandem with the settlements, often perpetrated with the apparent protection or approval of the Israeli security forces. In 2016, the United Nations counted a hundred and seven settler attacks that damaged Palestinian property, caused Palestinian casualties, or both. Since 2023, the U.N. has documented more than fifty-three hundred—a rate of more than four a day. More than eleven hundred Palestinians in the West Bank have been killed either directly by settlers or by the Israeli security forces. (In the first seven months of 2026, there were at least one thousand three hundred and eighty settler attacks, a rate of more than six a day, and seventy-six Palestinians were killed.) Over the same three years, according to the U.N., demolitions and intimidation in the West Bank fully or partially displaced one hundred and seventeen Palestinian communities, uprooting over fifty-nine hundred Palestinians.</p><p>Where such assaults or evictions once occurred sporadically, Lowenstein told me, “now it is going haywire every day.” And since Hamas attacked Israel on October 7, 2023, the Israeli military has also devastated Gaza, taking over more than sixty-five per cent of its territory, damaging or destroying over ninety per cent of the homes. Almost all of Gaza’s two million residents now live crowded into tent camps in the remaining thirty-five per cent of the land. (The Israeli assault has killed more than seventy thousand Palestinians.)</p>"}];
