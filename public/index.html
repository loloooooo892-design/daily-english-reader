<script>
var articles = [{"title":"Turns out Brits would quite like their private messages to stay private","source":"Hacker News Best","author":"Carly Page","url":"https://www.theregister.com/security/2026/08/30/turns-out-brits-would-quite-like-their-private-messages-to-stay-private/5292994","category":"tech","categoryLabel":"Technology","wordCount":611,"readingTime":4,"content":"<p>security</p>\n        <p>Polling finds two-thirds don't trust this government, or any future one, with access to their encrypted chats</p>\n\n                        \n<p>Brits have delivered a fairly unambiguous verdict on giving the government access to their encrypted messages: no, thanks.</p><p>New <a href=\"https://cdt.org/press/british-public-oppose-secret-surveillance-powers-and-want-strong-protections-for-encrypted-communications/\" target=\"_blank\" rel=\"noopener\">polling</a> commissioned by the Center for Democracy &amp; Technology (CDT) found that 93 percent of British adults believe they have a right to private conversations online, while 89 percent think nobody should be able to access their personal messages without a court order.</p><p>Perhaps more awkwardly for Westminster, two-thirds said they would not trust either the current government or any future one with the power to access encrypted messages.</p>\n        <p>REG AD</p>\n\n<p>That distrust crosses political lines. Among people who voted in the 2024 general election, 58 percent of Labour voters said they wouldn't trust any government with the power, alongside 59 percent of Conservatives, 56 percent of Liberal Democrats, 69 percent of Greens and 75 percent of Reform voters.</p>\n        <p>REG AD</p>\n\n<p>Public First did the asking, polling 2,000 British adults for CDT in April and weighting the results to reflect the wider population. The margin of error is 2.2 percentage points.</p><p>The findings land as the UK government's appetite for slurping encrypted data continues to collide with the tech industry's insistence that encryption works best when nobody has a spare key lying around.</p><p>That fight became particularly public when <a href=\"https://www.theregister.com/security/2025/02/24/apple-ends-icloud-advanced-data-protection-for-uk-customers/588745\" target=\"_blank\" rel=\"noopener\">Apple withdrew Advanced Data Protection from UK users</a> after receiving a secret Technical Capability Notice (TCN) under the Investigatory Powers Act. Apple challenged the order, and while the US government later said Britain had withdrawn its demand for access to Americans' encrypted data, reports have since suggested another TCN was issued focusing on British users.</p><p>Despite the international row, 55 percent of those polled hadn't heard about the Apple notice at all. Once presented with the idea, enthusiasm remained thin.</p><p>Just 12 percent backed the government being able to secretly order companies to provide access to users' information while preventing those companies from revealing the order. A third said the government shouldn't have that power at all, while another 41 percent wanted greater transparency or parliamentary oversight.</p><p>Nor were respondents particularly sold on sacrificing security for law enforcement. 53 percent said the security risks of accessing encrypted messages outweighed the benefits, compared with 28 percent who thought the benefits came out on top.</p><p>The reasons will sound familiar to anyone who has followed the encryption debate for more than five minutes. 84 percent worried that mechanisms allowing access to encrypted messages could introduce vulnerabilities for hackers and criminals, while 82 percent were concerned the powers could be abused.</p><p>Knowing someone might be watching could also change how people behave. 65 percent said they'd become more cautious about what they liked, shared or commented on, while 41 percent said they'd self-censor criticism of public institutions or government officials.</p>\n        <p>REG AD</p>\n\n<p>CDT is not a disinterested observer: the digital rights group campaigns for strong encryption and commissioned the research as part of that work. The polling itself, however, was carried out independently.</p><p>Commenting on the research, Jim Killock, executive director of Open Rights Group, said: “The British public instinctively know that being able to communicate privately is crucial to our individuality and to the survival of a free and open society.</p><p>“The government persists with the myth that it can weaken encryption to target the bad guys only. Attacks on the security of our phones, security tools and messaging apps harm us all and make our democracy weaker.”</p><p>None of this is likely to end Westminster's long-running pursuit of encrypted communications. But if ministers were hoping the public was enthusiastically behind them, the numbers suggest otherwise. ®</p>"},{"title":"Supreme Court allows construction on White House ballroom to continue","source":"SCOTUSblog","author":"Amy Howe","url":"https://www.scotusblog.com/2026/08/supreme-court-allows-construction-on-white-house-ballroom-to-continue/","category":"law","categoryLabel":"Law","wordCount":1329,"readingTime":7,"content":"<p>The Supreme Court on Monday granted the Trump administration’s <a href=\"https://www.scotusblog.com/cases/national-park-service-v-national-trust-for-historic-preservation/\" target=\"_blank\" rel=\"noopener\">request</a> to allow construction on a new White House ballroom to continue. By a vote of 5-4, the court paused a ruling by a federal judge in Washington, D.C., that would have halted above-ground construction of the ballroom project.</p><p>In an <a href=\"https://www.supremecourt.gov/opinions/25pdf/26a203_2b8e.pdf\" target=\"_blank\" rel=\"noopener\">eight-page, unsigned opinion</a>, the majority emphasized that it was not deciding whether the project was legal. Instead, it stressed, the plaintiff likely lacks a legal right, known as standing, to challenge the project at all.</p><p>The court’s decision came 10 days after Chief Justice John Roberts issued a temporary order, known as an administrative stay, that put the lower court’s ruling on hold to give the justices more time to consider the government’s plea. On Monday, Roberts joined the court’s three Democratic appointees in dissenting. In their view, the construction “is likely unlawful,” and the majority’s decision was “no victory for the separation of powers.”</p><p>The order by Senior U.S. District Judge Richard Leon had never actually gone into effect. Monday’s announcement by the Supreme Court raises the prospect that the project, which the Trump administration on Aug. 13 <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A203/419029/20260813211858520_August%20Ballroom%20Application%20-%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">described</a> as “65% complete in its entirety, and moving quickly toward total completion,” could be finished, or nearly so, by the time the dispute is finally resolved.</p><p>The plaintiff in the case, the <a href=\"https://savingplaces.org/we-are-saving-places\" target=\"_blank\" rel=\"noopener\">National Trust for Historic Preservation</a>, is a private nonprofit that describes itself as having “led the movement to save America’s historic places” “[f]or more than 75 years.” It<a href=\"https://www.courtlistener.com/docket/72028010/1/national-trust-for-historic-preservation-in-the-united-states-v-national/\" target=\"_blank\" rel=\"noopener\"> went to federal court</a> in Washington, D.C., in December, where it asked Leon to pause construction until the <a href=\"https://www.ncpc.gov/\" target=\"_blank\" rel=\"noopener\">National Capital Planning Commission</a> and the <a href=\"https://www.cfa.gov/\" target=\"_blank\" rel=\"noopener\">Commission of Fine Arts</a> could review the plans for the construction; the NCPC could approve those plans; and Congress could authorize the construction.</p><p>On March 31, Leon issued an <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.dcd.287645/gov.uscourts.dcd.287645.60.0_2.pdf\" target=\"_blank\" rel=\"noopener\">order</a> that temporarily blocked the construction of the ballroom above ground but allowed underground construction – of, for example, bomb shelters and bunkers – to move forward, along with any above-ground construction necessary for safety and security. The U.S. Court of Appeals for the District of Columbia Circuit paused Leon’s ruling before it could go into effect to give that court time to consider the government’s appeal.</p><p>On Aug. 7, by a vote of 2-1, the D.C. Circuit <a href=\"https://www.washingtonpost.com/documents/d63cccba-4384-448c-9859-afe5f9f5b3c3.pdf?itid=lk_inline_manual_2\" target=\"_blank\" rel=\"noopener\">affirmed</a> Leon’s ruling but gave the federal government 14 days to seek relief from the Supreme Court. Unless the justices intervened, it said, Leon’s ruling would go into effect on Aug. 21.</p><p>Writing for the majority, Judges Patricia Millett and Bradley Garcia emphasized that Congress, and only Congress, has the power “to regulate the construction and demolition of White House structures,” but it has not approved any money for the ballroom construction. If the construction is not put on hold, they said, and the ballroom is built, it will permanently harm (an important factor that courts consider in deciding whether to grant temporary relief) the members of the National Trust because the new structure will cause “irreversible historical-preservation, architectural, and visual damage.”</p><p>Judge Neomi Rao dissented. She argued (among other things) that the trust did not have standing to try to stop the ballroom construction. Moreover, she added, the president has the power to improve his residence, which likely includes the ballroom.</p><p>The Trump administration on Aug. 13 <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A203/419029/20260813211858520_August%20Ballroom%20Application%20-%20FINAL.pdf\" target=\"_blank\" rel=\"noopener\">asked</a> the Supreme Court to step in and temporarily block Leon’s ruling, calling it “extraordinary and unlawful.” U.S. Solicitor General D. John Sauer told the justices that Leon’s ruling would “halt the ongoing construction of the integrated military complex, including a totally secure ballroom space, at the East Wing of the White House, which is vitally required by national security.”</p><p>Like Rao, the Trump administration contended that the trust lacks standing to sue, because its claims rest on a member’s “dislike” for the new construction – which, it said, is not the kind of injury that would allow the lawsuit to go forward. Moreover, the government wrote, Congress <em>has</em> authorized the project, both by giving Trump and other presidents the power “to make ‘alteration[s]’ and ‘improvement[s]’ to the White House” and because it “broadly authorized the Executive to construct buildings in national parks.”</p><p>In <a href=\"https://www.supremecourt.gov/DocketPDF/26/26A203/419350/20260818115836924_26A203%20Respondents%20Opp.%20to%20App.%20for%20Stay%20of%20Injunction%202026-08-18.pdf\" target=\"_blank\" rel=\"noopener\">its 40-page filing</a>, the National Trust – represented by Tad Heuer of Foley Hoag – countered that Congress, rather than the president, “decides whether a ballroom can be built on federal property.” If the Trump administration “believe[s] there is a pressing need for a ballroom,” it contended, it can seek permission and funds from Congress to build one. But the government’s “efforts to foil judicial review and arrogate Congress’s exclusive powers should not be rewarded with a stay that allows [it] to complete a ballroom [it] lacked any authority to commence in the first place.”</p><p>If the Supreme Court denies the Trump administration’s request to pause Leon’s order, the trust argued, the Trump administration will not suffer any permanent harm. There is, it wrote, “nothing in the district court’s carefully tailored injunction [that] prevents them from continuing work on the bunker, securing the East Wing site, or ensuring the safety of the President, his family, and staff. All the injunction stops is construction of a ballroom without prior congressional approval.”</p><p>But if the court grants the government’s request and pauses Leon’s order, Heuer wrote, the trust will be permanently harmed. The government, he emphasized, has “raced to build as much of the ballroom as [it] can before the injunction goes into effect, proclaiming that ‘the structure should be substantially finished by November 2026.’” Indeed, he noted, the government has said that the project is now “beyond the point of return,” so that there would be no way to either take it down or change it.</p><p>On Aug. 21, the day that Leon’s order was scheduled to go into effect, Roberts <a href=\"https://www.scotusblog.com/2026/08/supreme-court-allows-white-house-ballroom-construction-to-continue-for-now/\" target=\"_blank\" rel=\"noopener\">issued</a> a brief administrative stay that allowed construction to continue until the justices took further action.</p><p>On Monday, a divided court granted the government’s request for a stay, permitting construction to move forward while the litigation continues in the lower court. The majority’s opinion focused primarily on its conclusion that the National Trust likely does not have standing to challenge the project. The trust had submitted a declaration from Alison Hoagland, a member who lives in Washington, D.C., and said that she visits the area where the White House is located approximately once per month. Hoagland, who has “expertise in historic architecture,” claimed that the project caused “‘injuries’ to her ‘aesthetic, cultural, and historical interests’ because she finds the ‘scale,’ ‘height,’ and ‘massing’ of the government’s design distasteful.” But those are not the kind of “concrete” and specific injuries required to bring a lawsuit, the majority explained.</p><p>The majority also concluded that the government would be permanently harmed if Leon’s order were allowed to go into effect – another key criterion in determining whether to grant emergency relief. Among other things, it noted, senior government officials “attest[] that constructing <em>something</em> approximating the height and mass of the intended above-ground ballroom is ‘crucial’ to the security of the below-ground military installation.”</p><p>In his six-page dissent, which Justices Sonia Sotomayor, Elena Kagan, and Ketanji Brown Jackson joined, Roberts countered that “[a] historic preservationist such as Hoagland can be aesthetically injured in a concrete, particularized way by the transformation of a historic building that she frequently enjoys, just as,” based on prior court precedent, “an environmentalist can sustain a concrete, particularized aesthetic injury from the extinction of a particular animal or the transformation of a particular forest or river that he regularly enjoys.” Roberts ended the opinion by quoting Winston Churchill, who said that “[w]e shape our buildings, and afterwards our buildings shape us.” “All the more reason,” according to Roberts, “to ensure that those responsible follow the rules in deciding what to tear down and what to build up at the People’s House.”</p><p><strong>Recommended Citation: </strong>Amy Howe, <em>Supreme Court allows construction on White House ballroom to continue</em>, SCOTUSblog (Aug. 31, 2026, 5:19 PM), https://www.scotusblog.com/2026/08/supreme-court-allows-construction-on-white-house-ballroom-to-continue/</p>"},{"title":"Call of Duty: Modern Warfare 4 beta Steam numbers haven't budged in the second weekend, despite Warzone's arrival and transformative patch","source":"Eurogamer","author":"Sherif Saed","url":"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-second-weekend-major-patch-steam-numbers","category":"gaming","categoryLabel":"Gaming","wordCount":574,"readingTime":3,"content":"<p>UAVoidable.</p>\n    \n  \n  \n  \n  \n            <p>We're deep in the second and final session of the Call of Duty: Modern Warfare 4 beta. This open portion is available on one more platform - <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a>, and can be accessed without the need for a pre-order. It also includes a sampler of Warzone's next Resurgence map and two Ground War maps, alongside all the maps and modes from the first beta weekend. None of that appears to have moved the needle, at least on Steam.</p>\n<p>The beta's <a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-weekend-one-steam-numbers\" target=\"_blank\" rel=\"noopener\">peak concurrent player count of 115,145</a>, which was achieved over the first weekend, has yet to be beaten. The closest it has got was a little over 113,000 on Friday, likely due to player interest in Warzone. Of course, it's always worth keeping in mind that we have no visibility on PlayStation 5, Xbox or Switch 2 numbers - it's possible some or all of those platforms saw big turnouts in the second weekend.</p>\n<p>All that said, Steam is often a good barometer for the performance of most major games, and it's notable that despite the new stuff and the beta's free accessibility, the numbers didn't improve.</p>\n<p>Beyond simply comparing and contrasting numbers, there's also the matter of the key gameplay changes <a href=\"https://www.eurogamer.net/companies/infinity-ward\" target=\"_blank\" rel=\"noopener\">Infinity Ward</a> introduced to the beta this session to address the most popular points of feedback.</p>\n<p>Once players got their hands on the game during the first weekend, it became clear that movement was going to be the first point of contention. <a href=\"https://www.eurogamer.net/call-of-duty-modern-warfare-4-beta-player-reaction\" target=\"_blank\" rel=\"noopener\">Many believe the game's movement speed and movement abilities make for an uncontrollable pace</a>, so Infinity Ward wanted to change several of those parameters to see if they'll make a difference. Even for a beta, this is unusual, especially considering the extent to which the developer was willing to go to address feedback.</p><p>For starters - as an experiment - the developer removed Tactical Sprint by default, tying it instead to the Blood Rush Perk. Tactical Sprint offers faster sprint speeds but delays how quickly you can get your gun up. Despite that penalty, players figured out years ago you can eliminate that by sliding out of it, essentially giving you two advantages. This was on display all across the first weekend, hence the change. Slides were also nerfed, with their distance and speed cut, and the slide-to-jump delay increased.</p>\n<p>Time to Kill was another hotly-debated topic in weekend one because of how fast it felt. Infinity Ward addressed that by reducing the damage of every gun in the beta. Together with the movement changes, the pace of the game has slowed, and the time it takes to kill an opponent has increased alongside it.</p>\n\n<p>The transformative patch tweaked spawns, too, to cut down on the chaos of the first weekend, where players were spawning at random points across the map next to teammates, rather than in more predictable spots at the edges of the map. The patch also made Killstreaks harder to get by increasing the required number of kills by one across the board to prevent spam.</p><p>As a result of all that, the beta's second weekend feels considerably different to play than the first. But whether or not you agree with the changes, I feel they offer enough incentive for both disgruntled players and those happy with the game's previous state to see the differences for themselves. At least on Steam, that clearly hasn't borne out by the numbers.</p>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"},{"title":"Where to Get Fire Outfits for Burning Man","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/07/where-to-get-fire-outfits-for-burning-man","category":"fun","categoryLabel":"Interesting Reads","wordCount":647,"readingTime":4,"content":"<p>That vague daydream you have about going to Burning Man someday—the one where you emerge from the radical-honesty workshop wearing nothing but patchouli oil and then proceed to writhe ecstatically on the desert floor until dawn—may need a little fine-tuning. After all, winds on the Black Rock Desert’s playa, or prehistoric lake bed, can reach up to seventy-five miles an hour and are loaded with enough alkali particles to burn the skin, and temperatures can range from a hundred and ten to forty. So you’re really going to expose your bare ass to some kind of thermally fluctuating, crust-forming Shake ’n Bake situation? Dude.</p><p>Nancy Marcus and her colleagues have you covered. Since 2013, Marcus has organized pop-up bazaars at which she and other designers sell clothes that they’ve designed or curated expressly “for the Burn.” Now in its fortieth year, Burning Man—which has attracted such unlikely pilgrims as Mark Zuckerberg, Paris Hilton, and Grover Norquist—was described by one longtime Burner as “a shantytown-trailer-park tailgate party.” But this summer’s Burner bazaar, held in SoHo, felt more like Mad Max, the Department Store. Nestled into a space the size of an airport Cinnabon, Marcus and thirteen other designers manned racks of clothes heavy on iridescence, leather, Day-Glo, and fake fur; the over-all vibe was, as one shopper put it, “very non-essential worker.” Marcus, in a lizardy, hand-painted skirt and bib, said that durability was an important aspect of designing for the Burn: “We build a city and we take it down, and we leave no trace. You can’t have sequins falling off your outfit.” She held up a pair of low-slung gold lamé pants to an older male customer, who enthused about the “dropped crotch.” Marcus encourages clients to buy clothes outside their comfort zone and to practice wearing them at home. Some purchase fourteen different outfits, one for each day and night of the festival.</p><p>One of Burning Man’s ten governing principles is radical self-expression, and the clothes complied. “It has a built-in assassin mask,” a designer named Ali Sardar said, of a mouth-level band of fabric emanating from the collar of a calf-length gray coat recycled from a vintage curtain ($750). Sardar was wearing a topee, sunglasses, and a leopard-print shirt unbuttoned to the navel: the playah on the playa. Jessica Ding, another designer, shyly said, of her leather holsters, “I have a high-femme warrior-queen aesthetic.”</p><p>The Russian American designer Lunara Love, a Burning Man veteran, was mellower. (“I used to go like religion, like a church you can’t stop,” she said. “Then I came to my senses.”) She was selling swaths of wrinkled gauzy muslin and cotton fabric in neutral colors ($200-$300), just the thing to wear when cupping a stranger’s face in your hands and announcing, “I forgive you.” Love emphasized that a week of partying and art viewing on the playa can breed ferocity. “One time, I jumped ten feet down from an art car in platform shoes because I thought I was a cat,” she said. “Burning Man: safety third.”</p><p>A petite vender named Audra Rodriguez was selling tiny leather pouches—“for your herbs and powders and pills,” she explained. After Eva Bogdanova showed a preppy customer one of her minimalist “Adam” belts—essentially, a golf-ball-size metal ring attached to a narrow belt—the customer remarked that he had once been invited to a workshop called “The Nuance of the Pelvic Bowl.” She stared at him as if receiving instructions from outer space.</p><p>The designers were mostly united in their distaste for what are known on the playa as Sparkle Ponies. As Burning Man’s website describes them, “Often fashionably attired, they may have packed too many costumes and not enough radical self-reliance.” Love castigated “influencer girls who think they are queens and need to be served.” Marcus cautioned against “wedges that are too high” and “headpieces that are moving around and falling off the head.”</p>"}];

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
