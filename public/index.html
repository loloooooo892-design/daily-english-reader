<style>

    --warning-border: #5C4A28;

}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {
  color: var(--accent);
  text-decoration: none;

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {

<script>
var articles = [{"title":"Bentley Wants Its Torcal SUV to Break the Curse of the Luxury EV","source":"Wired","author":"@wired","url":"https://www.wired.com/story/bentley-wants-its-torcal-suv-to-break-the-curse-of-the-luxury-ev/","category":"tech","categoryLabel":"Technology","wordCount":1317,"readingTime":7,"content":"<p>Bentley has taken the covers off its first-ever fully <a href=\"https://www.wired.com/tag/evs-and-hybrids/\" target=\"_blank\" rel=\"noopener\">electric car</a>, the Torcal, making it the automaker's fourth model line, joining the Continental GT, the Flying Spur sedan, and the <a href=\"https://www.wired.com/story/bentley-bentayga-hybrid-electric/\" target=\"_blank\" rel=\"noopener\">Bentayga</a> SUV. The luxury brand is confident about the launch, too, with Bentley chairman and CEO Frank-Steffen Walliser saying he believes “this is one of the best Bentleys ever.”</p><p>When WIRED first reported on the car <a href=\"https://www.wired.com/story/bentley-reveals-its-first-electric-car-amid-the-wreckage-of-the-luxury-ev-market/\" target=\"_blank\" rel=\"noopener\">in July</a>, we said the EV would have more than 300 miles of range. Well, turns out it has considerably more: up to 375 miles (on the <a href=\"https://www.jdpower.com/cars/shopping-guides/electric-vehicle-range-testing-understanding-nedc-vs-wltp-vs-epa\" target=\"_blank\" rel=\"noopener\">WLTP cycle</a>, maybe 330 miles on EPA), and can charge from 10 to 80 percent in just 16 minutes at 400 kilowatts.</p><p>Prodigious performance from a motor on each axle sees the five-seat Torcal—smaller than the Bentayga and so perhaps more of an urban SUV—get 888 metric horsepower (PS) and 1,350 newton-meters (Nm) of torque in the sporting S models, resulting in 0 to 60 mph in as little as 2.9 seconds and a top speed of 162 mph. The “core\" model drops to 821 PS and 1,194 Nm, with standstill to 60 mph in 3.4 seconds, and a max of 155 mph.</p><p>However, luxury brands get worried about their existing client bases when they switch to <a href=\"https://www.wired.com/tag/electric-vehicles/\" target=\"_blank\" rel=\"noopener\">electric vehicles</a>—<a href=\"https://www.wired.com/story/i-like-ferrari-luce-ev-but-this-is-why-its-heartbreaking/\" target=\"_blank\" rel=\"noopener\">look to Ferrari</a> as a prime example—so it's no surprise that Bentley is keen to point out how this new model embodies the finest elements of the brand, just like every other high-end marque does going into electrification. “The Torcal is a Bentley first and foremost,\" says the launch literature. “In every aspect of its design, technology, craftsmanship, materials, and sustainability, it is a template for future Bentleys, regardless of powertrain.”</p><p>The reason for leaning into brand heritage is obvious on dealership lots. The first-ever EV Bentley will roll off the production line into a decidedly twitchy luxury auto market where Lamborghini <a href=\"https://www.wired.com/story/lamborghini-is-latest-to-pull-the-plug-on-luxury-evs/\" target=\"_blank\" rel=\"noopener\">shelved its Lanzador electric GT</a>—with CEO Stephan Winkelmann stating demand among its buyers was “going almost to zero, if not to zero”—and Mercedes-Benz selling <a href=\"https://www.wired.com/story/this-is-why-high-end-electric-cars-are-failing/\" target=\"_blank\" rel=\"noopener\">just 1,450 of its electric G Wagen</a> in Europe through April 2025. <a href=\"https://www.wired.com/review/review-rolls-royce-spectre/\" target=\"_blank\" rel=\"noopener\">Rolls-Royce Spectre</a> sales are down nearly by half, with the brand hoping that a model refresh will turn things around.</p><p>And make no mistake that the Torcal is aiming for the luxury dollar. At $218,000 or £173,300 for the base model, and $258,200 or £199,300 for the First Edition S, this EV is priced higher than the <a href=\"https://www.wired.com/story/the-range-rover-electric-has-finally-arrived/\" target=\"_blank\" rel=\"noopener\">Range Rover Electric</a>, which has a similar range and starts in the US at $138,000. But a fairer comparison to the Torcal would be the Range Rover Electric Autobiography model, which clocks in at $208,000. Keep that in mind, and it's easy to see that Bentley is trying to take market share from JLR with its new SUV: Spend an extra $10,000, people, and you can drive off in an electric Bentley instead of a Range Rover.</p><p>At 4,983 mm long (161 mm shorter than a Bentayga) and 2,016 mm in width, the Torcal is not far off the size of the Range Rover Electric, but the most drastic difference is in height. The Range Rover Electric towers over the Torcal by nearly 20 centimeters. Also, while Bentley insists the Torcal has off-road chops, it's probably safe to say the Range Rover Electric will have it pipped there.</p><p>Where Bentley wants the Torcal to pull ahead is in the luxury refinements. Despite being smaller than its stablemate, the Torcal is a powerful, purposeful-looking SUV, with a switchable glass sunroof and newly designed light clusters, which are particularly evident at the rear. Unlike the Bentayga, the Torcal roofline drops down at the back for better aero efficiency.</p><p>At the front, undoubtedly the most striking visual element of the car is the new Torcal grille: Ventilation to a traditional radiator no longer needed, the upright front is now a solid wall of illuminated acrylic “crystals” that light up as you approach, and on a night in a rearview mirror on a freeway or mountain road will be deliberately unsubtle, and a far cry from <a href=\"https://en.wikipedia.org/wiki/Quiet_luxury\" target=\"_blank\" rel=\"noopener\">quiet luxury</a>.</p><p>Inside, Bentley continues to ram home the high-end message. All-round power doors open up to reveal a mixture of OLED screens and <a href=\"https://www.wired.com/story/why-car-brands-are-finally-switching-back-to-buttons/\" target=\"_blank\" rel=\"noopener\">physical switchgear</a>. The central display curves pleasingly downward, reminiscent of the <a href=\"https://www.wired.com/story/porsche-reveals-everything-about-its-cayenne-electric-apart-from-one-vital-thing/\" target=\"_blank\" rel=\"noopener\">new Cayenne</a>, but there is deliberately no separate passenger screen option.</p><p>Bentley brought in <a href=\"https://foxflannel.com/\" target=\"_blank\" rel=\"noopener\">Fox Brothers</a> to engineer a wool tough enough to be used to panel some of the interior, which is apparently a world first. An attractive new wood finish developed for the Torcal is formed from 1,000 layers of walnut off-cuts and recycled paper pressed together, then sliced to less than a millimeter thick. The Torcal has new massage and power-folding seats, and an optional Naim 1,780-watt sound system with 28 speakers including seat shakers and headrest speakers, as well as Dolby Atmos 7.1.</p><p>What's impressive is the digital trickery Bentley has employed in both audio and visual manners—mirroring the crystal switchgear, Bentley has created animations on the screens that show light passing through cut glass. After trying to do this completely with computer animation, it was decided the effect was not real enough, as the model could not account for minute imperfections in the glass that subtly affect the light patterns cast. So Bentley had to film these animations using real crystal instead. The effect of the central console and instrument panel is striking.</p><p>Then to address the sticky issue of driving sound for a pure EV, instead of creating a digital replica of combustion, Bentley decided to shun electronic imitation and re-create the rhythm of a Bentley V8 using real instruments (including drums, viola, and bass guitar) to create a soundscape that, like the glass animations, had subtle variations and tiny imperfections.</p><p>Now, this sounds like it might be a terrible idea, but on the very limited demo WIRED heard, it's actually remarkably convincing and will supposedly provide genuine aural feedback to the driver, rather than simply approximately imitating engine notes. Mercifully, for those not looking to keep things rooted in combustion, it can be turned off if you wish. Bentley even went as far as to record indicator sounds (a hammer striking a leather surface) and the digital assistant wake note (the sound of a crystal glass as you run your finger around the rim).</p><p>Bentley has thrown in more tech as well: an augmented reality head-up display; a Refresh mode that uses light and air for a “more invigorating” cabin environment; face recognition so the Torcal can set itself up for individual drivers; mobile phone keys; some 25 radars, sensors, and cameras for assisted driving systems; and space detection, where if another car is encountered on a narrow road, the Torcal can automatically reverse to a point it’s already identified to let the car pass.</p><p>None of this is, in the world of automotive, groundbreaking anymore. Chinese brands are coming for the SUV sector as well, and are offering much more for much less. Take a look at <a href=\"https://www.wired.com/story/xiaomi-has-a-luxury-suv-all-western-brands-should-fear/\" target=\"_blank\" rel=\"noopener\">Xiaomi's new SkyNomads</a>. These stacked SUVs are coming to Europe next year and will massively undercut both Bentley and Range Rover. They have more range, more features, and crucially are thinking about car interiors in genuinely new ways, adding built-in projector systems and seating systems that are reconfigurable. The SkyNomad even has a heated floor, for heaven's sake.</p><p>Walliser has a simple answer to this threat from Asia, a threat that is contributing to Bentley's parent Volkswagen Group now cutting 50,000 jobs (though Bentley is doing well financially), and that is to lean into the one thing that Chinese brands cannot copy or improve: heritage. Bentley, founded in 1919, has bags of it. Will it be enough to secure its continued commitment to full-electric cars? Hopefully. But WIRED's not sure that's a winning tactic for the long term.</p>"},{"title":"Learning to Yearn with Georgia Oakley","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/28/learning-to-yearn-with-georgia-oakley","category":"fun","categoryLabel":"Interesting Reads","wordCount":817,"readingTime":5,"content":"<p>When Georgia Oakley was in her final year of secondary school, in Berkshire, England, she went to a movie audition on a lark. She didn’t land a main role—those went to Saoirse Ronan and Romola Garai, who helped propel the film, “Atonement,” to multiple awards in 2007—but she was cast as a nurse. “We had to learn how to fold hospital corners on beds and tie bandages,” Oakley recalled recently. One day on set, she opened a cupboard: it was full of glass bottles with handwritten labels. “They were never going to be seen on camera,” she said. “I just remember thinking, Wow, this is all so that everybody feels like this really is a hospital.” Having taken the gig to make some cash, Oakley emerged with a vocation as a filmmaker.</p><p>The other day, Oakley was taking a walk along the towpath of the Regent’s Canal, London’s watery thoroughfare on which construction began in 1812, just after the publication of Jane Austen’s first novel, “Sense and Sensibility.” Oakley has directed a new interpretation of the book, starring Daisy Edgar-Jones as the sensible Elinor Dashwood and Esmé Creed-Miles as her more emotive sister, Marianne. Coming three decades after Ang Lee’s beloved adaptation, Oakley’s film is being promoted as Austen for Gen Z. “I could barely tell you what Gen Z is—all I know is that the marketing team keep using the word ‘yearning,’ ” Oakley, who is thirty-eight, said, dodging a passing e-bike. “Apparently, it’s a Gen Z thing—everyone’s obsessed with yearning. Daisy seems to be the queen of yearning.”</p><p>Oakley, who was born only a few miles from Austen’s birthplace, in Hampshire, and grew up outside Oxford, has lived for the past five years in Mallorca, with her wife, Alice Gomme, who runs a textile archive, and their ten-year-old daughter. (They are expecting another child in November.) “We live in the middle of the countryside—there are people driving horse and trap down our road,” Oakley said: very Jane Austen. Much of the movie was shot on location in the southwest of England, and in a still occupied Georgian mansion. “It was a little bit fraying carpets and peeling paint,” Oakley said, with approbation. (An artist made drawings to be stowed in Elinor’s drawer.) The film emphasizes the book’s outdoorsy wildness. “This is not a story where everyone is standing around in drawing rooms,” Oakley said. Thus far, online commentary has focussed on what the trailer reveals of the sisters’ hair, which is often undone, even unkempt. “I felt very strongly that there were certain aspects to a lot of Austen adaptations that kept me at arm’s length from the human experience of the characters,” Oakley explained, rubbing the back of her own cropped head. “We know how women wore their hair when they were having their portrait painted, or when they were attending a ball, let’s say—but we don’t really know how they wore their hair when they weren’t being observed.”</p><p>“Sense and Sensibility” is Oakley’s favorite Austen novel. “For me, the central love story was about the sisters—there are these quite clear limitations to the romantic relationships because of the time, whereas the sisterly relationship has no limits,” she said. Their dynamic exists in non-sibling relations, too. “I’m an Elinor, and my wife is a Marianne,” Oakley remarked. As long ago as 1991, the critic Eve Kosofsky Sedgwick detected queer themes in the book; in her essay “Jane Austen and the Masturbating Girl,” she characterizes the novel’s “erotic axis” as “the unwavering but difficult love” of Elinor for Marianne. Oakley said, “I wouldn’t say I explicitly see it as a queer romance, but there are aspects of it, particularly Marianne’s character, where we are showing a character who is rejecting the status quo. If we were to make that story now, then she probably would be a queer character.” At the same time, Oakley has amplified the romance between Elinor and Edward Ferrars—the latter, in Austen’s text, a more compromised love object than the twinkly-eyed George MacKay of the new version. “I was interested in ‘the good guy,’ ” Oakley said. Meanwhile, Frank Dillane plays Willoughby, Marianne’s love interest, with such commitment that the actor was surprised to learn his character is universally acknowledged to be a scoundrel. “At one point, we were talking about Willoughby as a villain, and Frank was, like, ‘What?’ ” Oakley said, with a laugh.</p><p>At a screening in Los Angeles, Oakley was delighted to see younger members of the audience cheering when Willoughby gets his comeuppance and when Elinor and Edward finally kiss. “I should go to the cinema in America more often,” she said. “It was so <em>not</em> British.” A bigger surprise was that, for all the Gen Z talk, men over fifty seemed to love the film. “I guess there’s men over fifty needing a happy ending,” she said. Yearning knows no bounds: very Jane Austen. ♦</p>"},{"title":"Blizzard say Battle.net isn't looking to fight Steam and Epic for supermassive storefront supremacy, despite recently nabbing The Witcher 3 and Cyberpunk 2077","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/blizzard-say-battlenet-isnt-looking-to-fight-steam-and-epic-for-supermassive-storefront-supremacy-despite-recently-nabbing-the-witcher-3-and-cyberpunk-2077","category":"gaming","categoryLabel":"Gaming","wordCount":502,"readingTime":3,"content":"<p>\"It's a much more focused approach\"</p>\n    \n  \n  \n  \n  \n            <p>No siree. We are not trying to fight those big bosses. It's arguably a bit of a weird thing for a publisher with Diablo and <a href=\"https://www.rockpapershotgun.com/games/world-of-warcraft\" target=\"_blank\" rel=\"noopener\">World of Warcraft</a> in their arsenal to say, but that's the stance Blizzard are sticking to with their storefront Battle.net, even though it now boasts two big CD Projekt Red RPGs. Instead of an unknowably girthy hoard of games, the publishers say <a href=\"https://www.rockpapershotgun.com/topics/battlenet\" target=\"_blank\" rel=\"noopener\">Battle.net</a>'s still designed to feel like a handpicked basket of things to play.</p>\n<p>\"We're obviously not out there trying to do the Steam or Epic Game Store thing,\" Blizzard senior vice president  Andrew Guerrero told <a href=\"https://www.polygon.com/blizzcon-interview-battle-net/\" target=\"_blank\" rel=\"noopener\">Polygon</a> in an interview at this year's BlizzCon, where the company <a href=\"https://www.cdprojekt.com/en/media/news/cyberpunk-2077-comes-to-battle-net/\" target=\"_blank\" rel=\"noopener\">announced that</a> <a href=\"https://www.rockpapershotgun.com/games/cyberpunk-2077\" target=\"_blank\" rel=\"noopener\">Cyberpunk 2077</a> will be joining The Witcher 3's <a href=\"https://www.rockpapershotgun.com/cd-projekt-red-sweeten-the-witcher-3-songs-of-the-past-honeypot-with-a-free-base-game-remaster-and-oh-yeah-both-original-expansions-too\" target=\"_blank\" rel=\"noopener\">upcoming remaster</a> on Battle.net.</p>\n<p>\"We really look at ourselves as, you know, we have our audience,\" he continued. \"We have a passionate core of people that play Blizzard games and games similar to Blizzard, and if something makes sense for them, we'll get after it. It's a much more focused approach, I'd say, of 'What do we think our players would absolutely love? What are the top-tier quality experiences out there that we might be able to get some more exposure to, and does it make sense?'\"</p>\n<p>It's not too surprising a way to position Battle.net, given that unless you're going full Tim Sweeney and are prepared to risk being seen to tussle with the behemoth on top, PC storefronts tend to stick to selling themselves on one or two niches. For <a href=\"https://www.rockpapershotgun.com/whats-next-for-gog-publishing-games-maybe-but-its-new-owner-isnt-in-any-rush\" target=\"_blank\" rel=\"noopener\">GOG</a>, it's retro games that might not get the time of day elsewhere and keeping them up to date so they can be played easily. For Battle.net, it's something like 'yo, we heard you like Blizzard, so we put some games similar to Blizzard ones next to your Blizzard games'.</p><p>Guerrero did also point out that Battle.net's not currently designed to be a place new games can be published on with metronomic regularity, as has to be the case with storefronts looking to offer an unending sea of games. Though, he did note that Blizzard have worked on making their publishing process \"much more straightforward\" so their store can be home to select third-party games like The Witcher and Cyberpunk in a way that meshes with its curated small basket ethos.</p>\n<p>For all the chat about doing what players love, Blizzard have <a href=\"https://kotaku.com/the-witcher-3s-geralt-skin-for-diablo-4-has-a-really-annoying-requirement-2000734239\" target=\"_blank\" rel=\"noopener\">still locked</a> a Geralt crossover skin for <a href=\"https://www.rockpapershotgun.com/games/diablo-iv\" target=\"_blank\" rel=\"noopener\">Diablo 4</a> barbarians behind pre-ordering The Witcher 3's upcoming <a href=\"https://www.rockpapershotgun.com/games/the-witcher-3-wild-hunt-songs-of-the-past\" target=\"_blank\" rel=\"noopener\">Songs of the Past DLC</a> on Battle.net. I know there will inevitably be at least one person who does, but the idea of someone playing TW3 for the first time in 2026 because it's finally hit the launcher you use for <a href=\"https://www.rockpapershotgun.com/games/overwatch-2\" target=\"_blank\" rel=\"noopener\">Overwatch 2</a> boggles my mind a bit. Then again, <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-v-skyrim\" target=\"_blank\" rel=\"noopener\">Skyrim</a>'s been ported to toasters and outdoor heaters, so CD Projekt Red have a ways to go yet before they reach that level of 'ok, who is this actually for?'.</p>"},{"title":"When You're in a College Electrical Circuits Lab, Better Follow the Teacher's Instructions","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/19/when-youre-in-a-college-electrical-circuits-lab-better-follow-the-teachers-instructions/","category":"law","categoryLabel":"Law","wordCount":965,"readingTime":5,"content":"<p>From <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.txwd.1172858485/gov.uscourts.txwd.1172858485.43.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Soliz v. Alamo Colleges Dist.</em></a>, decided by Judge David Ezra (W.D. Tex.) on Sept. 16:</p>\n<blockquote><p>Plaintiff Joseph Soliz, who is proceeding <em>pro se</em>, was at all times relevant to this case a student at St. Philip's College, an individual college within the Alamo Community Colleges District (\"ACCD\") system. He was enrolled in a class taught by Roy Ruiz, named as a defendant here.</p>\n<p>On January 17, 2024, Soliz and Ruiz got into a dispute during class. Soliz was working on a lab exercise regarding electrical circuits. His digital multimeter alarmed at least once. Ruiz came over and offered to assist him, and Soliz told him that he would \"get it figured out.\" Ruiz then explained multiple times to Soliz that he was not following directions. Soliz insisted that he was doing it his own way and asked Ruiz not to \"micromanage\" him. Ruiz took away his lab papers, and Soliz took them back, refusing to relinquish them. Ruiz threatened to summon campus police and instead summoned Elizabeth Leon, a St. Philip's staff member. Ms. Leon attempted to resolve the issue with Soliz, but Soliz did not cooperate and \"told [her] the conversation was over.\"</p>\n<p>The next morning, Ruiz sent an email to Soliz asking him not to attend class that day. The email explained that, in Ruiz's view, Soliz had been unduly combative and had misused equipment, which Ruiz believed posed a safety risk, and that Soliz had refused to follow instructions and disrupted the class. Soliz attended class anyway. Ruiz approached Soliz and said that if he refused to leave, Ruiz would call campus police. Soliz refused, and Ruiz followed through on his statement.</p></blockquote>\n<blockquote><p>Campus police arrived and took Soliz with them to \"temporary campus police offices.\" They showed Soliz the email that Ruiz had sent that morning, establishing the grounds for his removal from class. Campus administrators came by and were discussing the matter outside the office. Soliz, \"hearing discussion about [him], left the campus police temporary offices and entered the hallway.\" Soliz briefly talked over the incident with school administrators, who planned to scheduled him for a student conduct meeting to be held on Monday, January 22, 2024. They then sent Soliz a notification for a Zoom meeting to take place on January 19, 2024. Soliz states he did not attend the meeting because it was too short notice, and because he was unable \"to engage counsel or be able to research or craft a defense.\" As a result of the classroom dispute, Soliz states, he \"was barred from both of Roy's class[es] he was enrolled in until he had additional safety instruction.\" …</p></blockquote>\n<p>Soliz sued on various theories, and the court rejected them all, adopting Magistrate Judge Richard Farrer's <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.txwd.1172858485/gov.uscourts.txwd.1172858485.42.0.pdf\" target=\"_blank\" rel=\"noopener\">report and recommendation</a>. Here's the analysis of the First Amendment claim (for more on the Fourth Amendment and Due Process Clause claims, see the opinion) from the Magistrate Judge:</p>\n<blockquote><p>Soliz does not identify a constitutionally protected activity for purposes of his First Amendment retaliation claim. He states only that he was engaged in \"protected academic inquiry,\" but that is a legal conclusion, and his earlier-pleaded facts make clear he is complaining about how an instructor handled his failure to follow directions and enforce basic classroom rules.</p>\n<p>His quibbles about the procedures in a lab assignment are not protected speech, and his cited cases largely regard the raising of viewpoints and intellectual disagreement in a school context. Nowhere else in Soliz's pleadings does he identify any particular statement or protected speech at issue.</p>\n<p>He perhaps comes closest when he makes reference to his \"objection to the use of religious symbols during class instruction\" at some prior, unspecified time, but the pleadings make clear that the conduct complained of in the instant case is based on the immediate dispute between Soliz and Ruiz over disruptions of class and failure to follow instructions, and not in retaliation for these objections. Thus, Ruiz's actions were clearly not substantially motivated by this (vaguely described) earlier objection, or any other statement or activity. Any First Amendment retaliation claim that could be attempted against the police-officer defendants or other government actors would fail for the same reasons. Ultimately, the First Amendment retaliation claim is vague and conclusory as pleaded and fails as a matter of law.</p>\n<p>Moreover, Soliz's pleaded facts establish that his dispute with Ruiz disrupted class. It is well settled that \"conduct by the student, in class or out of it, which for any reason—whether it stems from time, place, or type of behavior—materially disrupts classwork or involves substantial disorder or invasion of the rights of others is, of course, not immunized by the constitutional guarantee of freedom of speech.\" <em>Tinker v. Des Moines Indep. Cmty. Sch. Dist.</em> (1969). Soliz's pleaded facts deprive him of any claim on First Amendment grounds for this reason as well. <em>See</em> Dkt. No. 1-2 at 28 (\"The Office of Student Conduct received four (4) [reports] and one Police Report between January 17-18, 2024. Every report alleges disruptive behavior, safety hazard concerns, among other possible violations of the [ACCD] Student Code of Conduct….\").</p>\n<p>Soliz's own pleaded facts demonstrate that he repeatedly refused to follow Ruiz's instructions during a lab assignment involving electric circuity. Soliz at one point caused a circuit to start alarming. Soliz rebuffed Ruiz twice when asked or reminded to follow instructions.  Ruiz ultimately had to call Elizabeth Leon for assistance, and Leon then talked to Soliz.  Soliz was uncooperative throughout. When asked not to return to class the next day, Soliz did so, necessitating the intervention by campus police discussed above, resulting in the cancellation of class. Plaintiff's First Amendment claim fails as a matter of law for this reason as well….</p></blockquote>\n<p>Gunnar Peterson Seaquist and Sara Labashosky (Bickerstaff Heath Delgado Acosta LLP) represent defendants.</p>"}];
