<!DOCTYPE html>

<title>Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"European Commission tightens oversight on AI companies to combat deepfakes and cyber threats","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/08/european-commission-announces-ai-companies-to-face-tighter-eu-oversight-over-deepfakes-and-cyber-threats/","category":"law","categoryLabel":"Law","wordCount":516,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/08/european-commission-announces-ai-companies-to-face-tighter-eu-oversight-over-deepfakes-and-cyber-threats/#\" target=\"_blank\" rel=\"noopener\">European Commission tightens oversight on AI companies to combat deepfakes and cyber threats</a>\n</strong><p>The European Commission on <a href=\"https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714\" target=\"_blank\" rel=\"noopener\">Friday</a> announced that its AI Office in Brussels and national regulators will begin enforcing key provisions of the EU Artificial Intelligence Act on August 2, including new duties to identify deepfakes, label AI-generated material and oversee risks linked to powerful AI systems.</p><p>This move gives EU regulators greater power to inspect advanced AI models, demand technical records and act against companies that fail to label synthetic content or control serious cyber risks.The larger team will investigate whether companies operating in the EU are operating in strict compliance with the <a href=\"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai\" target=\"_blank\" rel=\"noopener\">Artificial Intelligence Act</a>. Officials may seek technical records, examine how models work, question company staff and order changes where systems fail to meet legal requirements. The Commission has also created confidential channels for employees and users to report suspected violations.</p><p>This latest development comes as European regulators have started paying closer attention to the plethora of security risks created by increasingly capable AI agents. OpenAI and Anthropic recently informed EU officials about separate cases involving <a href=\"https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals\" target=\"_blank\" rel=\"noopener\">unauthorized</a> cyber activity by AI systems. The incidents have added to concerns that safety controls must continue after a model is released, rather than ending at the testing stage.</p><p><a href=\"https://artificialintelligenceact.eu/article/50/\" target=\"_blank\" rel=\"noopener\">Article 50</a> of Regulation (EU) 2024/1689 requires that people be informed when they are interacting with certain AI systems. It also requires providers to make AI-generated or manipulated material detectable in a machine-readable form. Those using AI to produce realistic images, audio or video must disclose when the material has been artificially created or altered. However, it must be noted that this law does not impose a blanket ban on all deepfakes. Its purpose is to simply make synthetic content easier to identify and to reduce the risk of fraud, impersonation and manipulation. Deepfakes used for <a href=\"https://www.jurist.org/commentary/2026/06/invisible-panopticon-how-ai-glasses-are-fueling-a-new-era-of-image-based-sexual-abuse/\" target=\"_blank\" rel=\"noopener\">illegal purposes</a> remain subject to other criminal, privacy and platform laws.</p><p>Previously, Grok AI has faced intense global scrutiny and been subjected to regulatory investigations for its generation of <a href=\"https://www.jurist.org/news/2026/06/canada-privacy-watchdog-says-grok-generates-explicit-deepfakes-without-users-valid-consent/\" target=\"_blank\" rel=\"noopener\">non-consensual sexualized deepfakes</a>, often involving women and minors. Grok AI has been used as an example to reinforce the argument that safety controls in AI systems  should be monitored continuously, especially in light of new updates to its image-editing tools which created a loophole and permitted users to <a href=\"https://www.jurist.org/news/2026/07/uk-lawmaker-suing-musks-xai-seeks-order-to-stop-grok-generating-sexualised-images/\" target=\"_blank\" rel=\"noopener\">generate obscene images</a> of innocent people.</p><p>The AI Act entered into <a href=\"https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113\" target=\"_blank\" rel=\"noopener\">force</a> in August 2024 and is being introduced in stages. Its bans on certain unacceptable uses began applying in February 2025. The August 2026 phase introduces broader transparency requirements and stronger oversight of general-purpose AI models.</p><p><a href=\"https://artificialintelligenceact.eu/article/79/\" target=\"_blank\" rel=\"noopener\">Member States</a> must establish effective, proportionate and dissuasive penalties. National market-surveillance authorities may require a non-compliant system to be corrected, withdrawn or recalled, generally within 15 working days or any period set under other applicable EU law. Violations of Article 50 can result in <a href=\"https://artificialintelligenceact.eu/article/99/\" target=\"_blank\" rel=\"noopener\">fines</a> of up to €15 million or three percent of worldwide annual turnover. Breaches involving prohibited AI practices may attract penalties of up to €35 million or seven percent, while smaller businesses are subject to the lower applicable ceiling.</p>"},{"title":"Angela Nissel faces down grief with a laugh","source":"The Verge","author":"Terrence O'Brien","url":"https://www.theverge.com/report/974226/angela-nissel-interview-good-grief-pass-the-bread-mom-is-dead","category":"tech","categoryLabel":"Technology","wordCount":1151,"readingTime":6,"content":"<p>Angela Nissel’s latest book, <a href=\"https://www.amazon.com/dp/0063345110?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback&amp;tag=theverge02-20\" target=\"_blank\" rel=\"noopener\"><em>Good Grief, Pass the Bread, Mom Is Dead</em></a><em>, </em>is my kind of memoir. Sure, it’s a deeply emotional tale about caring for a terminally ill parent. But it’s delivered with the sort of gallows humor that I often turn to to get me through tough times.</p><p>Of course, that sort of dark humor should come as no surprise from Nissel. She first made a splash with <a href=\"https://www.amazon.com/Broke-Diaries-Completely-Hilarious-Misadventures/dp/0679783571/ref=pd_lpo_d_sccl_2/147-6007463-8645753?pd_rd_w=CWait&amp;content-id=amzn1.sym.4c8c52db-06f8-4e42-8e56-912796f2ea6c&amp;pf_rd_p=4c8c52db-06f8-4e42-8e56-912796f2ea6c&amp;pf_rd_r=774AS2NSH8H4533PAGJK&amp;pd_rd_wg=fzM79&amp;pd_rd_r=9e261540-4291-47ee-aef2-c0466f6b286c&amp;pd_rd_i=0679783571&amp;psc=1&amp;tag=theverge02-20\" target=\"_blank\" rel=\"noopener\"><em>The Broke Diaries</em></a>, which grew out of a blog she kept in college detailing her daily struggles and, at times, embarrassment at being a broke student. Eventually she went on to produce and write for hit shows including <a href=\"https://go.skimresources.com/?id=1025X1701640&amp;xs=1&amp;url=https%3A%2F%2Fwww.hulu.com%2Fseries%2Fbba197b5-eb03-4a09-b5f6-f04c053471d7\" target=\"_blank\" rel=\"noopener\"><em>Scrubs</em></a> and <a href=\"https://hbomax.prf.hn/click/camref:1101lqHRA/%5Bp_id:1011l394533%5D/destination:https%3A%2F%2Fwww.hbomax.com%2Fshows%2Fboondocks%2Fc43c65e7-49fe-4795-9e13-759bad094a78%3Futm_source%3Duniversal_search\" target=\"_blank\" rel=\"noopener\"><em>The Boondocks</em></a>.</p><p>One of her most lasting contributions is undeniably <a href=\"https://www.okayplayer.com/\" target=\"_blank\" rel=\"noopener\">Okayplayer</a>, which she co-founded with Questlove. Though, as we’ll find out shortly, being involved with one of the most important online outlets in hip hop is something of a bittersweet memory for Nissel.</p><p>Oh, and she has my favorite GIF submission yet.</p><p><strong>What is your most indispensable tool?</strong></p><p>A knockoff Swiss Army Knife. It was a gift from the <em>Scrubs</em> grips over 20 years ago. I always have a screwdriver, a knife, and a corkscrew in my pocket. I feel like a badass.</p><p><strong>Which is the most underappreciated?</strong></p><p>My dog. He’s analog and breaks down my cardboard boxes in seconds. Now they all fit in the recycle bin.</p><p><strong>What is the first app you install on a new phone or computer? (Do not count preinstalled software like Gmail.)</strong></p><p>Craigslist. Youngins sleep on Craigslist. I’ve found a free patio set and in the early aughts when I was lonely and new in L.A. I made a friend to go clubbing with. I forgot my wallet, and she thought I was scamming her and we never hung out again, but I still love Craigslist.</p><p><strong>What is one thing you wish you could change about your phone?</strong></p><p>That I somehow still butt dial people. The phone biometrically knows my face, but can’t tell when it’s my wallet accidentally dialing someone?</p><p><strong>What sites do you have pinned to your tab bar?</strong></p><p>Wordle. Connections. Essays I swear I’m going to get around to reading but never do. Now I feel badly. I’m going to read one.</p><p><strong>How many tabs do you have open right now?</strong></p><p>I limited myself to four or my anxiety starts skyrocketing.</p><p><strong>Which social media platform do you use the most (if any)?</strong></p><p>Instagram, because I’ve been told by my book publisher that in 2026 I have to make “charismatic vertical videos” to sell my latest book. I’m working on being both vertical and charismatic.</p><p><strong>What is your happy place online?</strong></p><p>A small corner of Reddit where we laugh at the shenanigans of one celebrity wife. I love that place so much I even thanked our group by nickname in my latest book’s acknowledgments.</p><p><strong>What is your favorite gadget you’ve ever owned?</strong></p><p>My first Fitbit. For a person who grew up on Commodore 64s that took an hour to load video games, wearable tech that instantly tells you how lazy you are seemed like something out of <em>The Jetsons</em>. Now robots are performing surgeries, and the goalpost for futuristic tech has moved.</p><p><strong>Which was the most disappointing?</strong></p><p>Wearable tech that was supposed to shock me into breaking bad habits. I was like, “Why am I doing this to myself?”</p><p><strong>What game do you have the fondest memories of?</strong></p><p><em>Castle Wolfenstein</em>! The mechanics of that game on the Commodore 64 blew me away! Of course, now, it looks like <em>Pong</em> compared to newer games, but when I played it with my brother, I remember feeling like I was in the future, yet killing Nazis from the past.</p><p><strong>What is one thing you wish you had created?</strong></p><p>I wish I’d created <em>The Blackening</em>. It’s a movie. It’s so brilliant that I’m unsure how they got it made. A lot of brilliance tends to die in development out here in Hollywood to make way for “sure money bet” reboots.</p><p><strong>What creation are you most proud of?</strong></p><p>The groundbreaking site I created with Questlove.</p><p><strong>Which are you least proud of?</strong></p><p>The groundbreaking site I created with Questlove. For 25 years, I’ve had to answer questions about why the only woman involved isn’t mentioned in the creation of the website, why the man I hired suddenly replaced me, or why I don’t know who owns the site. I’ve also learned of how many women — mostly of color — have been erased from their creations as the Internet moved from “cool place to hang” to corporate megamall. I’m proud of my part in Internet hip-hop history, but I hate how many women I meet who have been erased.</p><p><strong>What’s the best piece of advice you’ve ever received?</strong></p><p>Be interesting and interested! That means get offline and have things to talk about besides what social media is talking about. Despite us being so connected, we have a loneliness problem in the US. Getting offline, taking local community college classes, and free birdwatching groups has taught me so much and given me new acquaintances, both bird and human.</p><p><strong>What do you do when you need to focus?</strong></p><p>Take an edible. I’m an experienced user now. They used to make me paranoid, but now I’m like an edibles master, and I know just the right dose to take so my anxiety disappears, and I can relax into making some art without the voice in my head that says “This sucks! Everyone is going to hate this, and you’ll die broke!”</p><p><strong>What do you do when you’re feeling stuck?</strong></p><p>Give myself permission to relax and take in someone else’s creation. Permission to be stuck and get inspiration from someone else’s book / movie / Substack has been a big help for me. There’s so much amazing art around, and when I look at other people’s, it reminds me why I feel the drive to create.</p><p><strong>When was the last time you went somewhere without your phone?</strong></p><p>Every day I go to the dog park without it. I feel we can learn so much from just watching nature, including our beloved mutts. I feel we stole the game of American football from how dogs play. My dog is always defense, btw.</p><p><strong>What’s the last piece of physical media you bought?</strong></p><p>Books! Last book purchase was <em>If I Ruled the World</em> by Amy Dubois Barnett.</p><p><strong>What do you think is worth splurging on?</strong></p><p>Anything that gives you more free time to just relax. So, again, books, lol. For $20-$40 bucks, I get DAYS of brain relaxation.</p><p><strong>What would the tagline for your biopic be?</strong></p><p>She had jokes, trauma, and a very suspicious relationship with pigeons.</p><p><strong>What’s the last GIF or meme you used?</strong></p><p><a href=\"https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/get-off-my-lawn-old-lady.gif?quality=90&amp;strip=all&amp;crop=0,0,100,100\" target=\"_blank\" rel=\"noopener\"></a></p><p><strong>Follow topics and authors</strong> from this story to see more like this in your personalized homepage feed and to receive email updates.</p><ul><li>Terrence O'Brien</li></ul>"},{"title":"Xbox rolls out ad-supported game streaming test for its insider programs, as hardware supply and affordability crisis rages on","source":"Eurogamer","author":"Connor Makar","url":"https://www.eurogamer.net/xbox-game-advertising-insider-affordability","category":"gaming","categoryLabel":"Gaming","wordCount":563,"readingTime":3,"content":"<p>Who could have done this?</p>\n    \n  \n  \n  \n  \n            <p>Xbox has announced a test for an ad-supporting streaming service for its Xbox Insider program. It will allow players to stream select games from their library for free for one-hour sessions, with advertisements playing before play sessions.</p>\n<p>As seen in <a href=\"https://news.xbox.com/en-us/2026/07/23/game-streaming-ad-supported-xbox-insiders/\" target=\"_blank\" rel=\"noopener\">a new blog post on the official Xbox website</a>, the details of the test are broken down in full. Ads will play before the one-hour sessions, with the article emphasising \"the core game experience is unchanged\", and the ad-supported streaming service is optional. It says: \"Players can choose other ways to play at any time.\"</p>\n\n<p>The stated reason why this is being tested, the article explains, is that Xbox owners have devices that already allow them to stream games, and that this allows players with weaker hardware like the Xbox One to play games made for the Xbox Series X/S. The post reads: \"That can be especially meaningful in places where consoles are harder to find or less affordable, giving more players another way to access great games on devices they already have.\"</p><p>Of course, a big reason why hardware is proving harder to find - and becoming less affordable - is due to the generative AI boom, which has resulted in console components becoming scarce and the cost of hardware products like the Xbox Series X/S being raised. <a href=\"https://www.eurogamer.net/xbox-major-price-increases\" target=\"_blank\" rel=\"noopener\">Microsoft has already hiked the price of its consoles last month in response</a>, citing rising memory costs. Microsoft is also one of the main culprits of the generative AI boom, fueling generative AI software like Azure and Copilot with its multi-billion contracts with OpenAI.</p>\n<p>The blog post then states: \"Advertising has existed in gaming for decades, from in-game placements to free-to-play models. But it hasn’t always been built with the player in mind.\" It claims that advertising \"can help lower the cost of access\", and it can create \"another way for players to get into games without an upfront streaming purchase and expands audiences through new ways to play.\"</p>\n<p>There is, of course, a substantial difference between believable advertisements within sports titles, or games <a href=\"https://www.eurogamer.net/games/league-of-legends\" target=\"_blank\" rel=\"noopener\">League of Legends</a> advertising its own merch and events within its own client, and external advertising placed at the start of a streaming session.</p>\n<p>Finally, the article breaks down how Xbox will approach ad-supported streaming. The first point being: \"We start with the player. Ads should create value.\" How exactly value is created for players seeing ads when playing games they own is unclear. It also states these will not interrupt the flow of gameplay, that ads will match the \"same quality bar as our content\", there will be clarity on what's being advertised, and an effort will be made to make sure advertisements fit what players expect on each platform.</p><p>This is far from the first time a video game company has toyed with introducing advertisements into its games. Earlier this month <a href=\"https://www.eurogamer.net/ea-in-game-advertising-opportunity\" target=\"_blank\" rel=\"noopener\">EA said in-game advertisements as a \"huge opportunity\"</a>, having <a href=\"https://www.eurogamer.net/ea-advertising-ads-in-game-content-integrations\" target=\"_blank\" rel=\"noopener\">launched its own ad platform the month prior</a> having toyed<a href=\"https://www.eurogamer.net/ea-has-teams-looking-at-thoughtful-implementations-of-ads-inside-its-game-experiences\" target=\"_blank\" rel=\"noopener\"> with the idea for years</a>. Former Anthem executive producer Mark Darrah <a href=\"https://www.eurogamer.net/dragon-age-mark-darrah-games-monetisation\" target=\"_blank\" rel=\"noopener\">believes it's a good idea too</a>.</p>\n<p>With hardware costs not looking to drop any time soon, even if the generative AI bubble were to burst, the gaming ecosystem might just be right for ad-support aspirations. How it'll be received remains to be seen.</p>\n        \n      \n  \n      <p>Mentioned in this article</p>"},{"title":"“One and No One,” by Gabriel Winslow-Yost","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/books/flash-fiction/one-and-no-one-gabriel-winslow-yost","category":"fun","categoryLabel":"Interesting Reads","wordCount":1431,"readingTime":8,"content":"<p>When the angel came to Craig, he was seven, squatting in the outhouse at camp. You had to flush it with a bucket of water, if you remembered, which Craig always did, and the angel was a field of pink and blue about a foot wide, with no depth at all. Flat beyond flat, like an edge to the world. Craig leaned forward and put his left hand into it, up to the wrist.</p><p>It blinked, or Craig blinked, or both—there was a gap in his vision of it, just long enough for him to notice. And already it was changing. At first, the blue and pink had simply swirled together, in the angel, but with Craig’s wrist in the middle it began to cohere. Pink by the wrist, bluer beyond. Craig’s hand felt far off, as if he had loved it once, long ago, and was beginning to forget. He made a fist, and the pink seemed to spread.</p><p>Craig wondered what would happen if he put his face into the angel. Was there anything in there to see? Was there even any there in there, for things to be in? Would his body forget him if he was away too long? And was the angel getting brighter? It was, and Craig passed out.</p><p>When he woke, he was nine. It was a bright October morning and he was in a circle of third graders in a yellow room. They were sitting on red pillows on the floor. He was sitting, too. He opened his mouth to speak and blood surged out, and then from his eyes, his ears, his nose.</p><p>This felt fine, or even good: the world and his body hurtling joyously through each other. To everyone else, it was horror arriving in the room. They all started crying. His teacher grabbed him and ran him bleeding down the halls, in circles, screaming through the school until help caught up.</p><p>From this, Craig learned that he should be quiet. He closed his eyes and let himself be carried. He let the bleeding stop on its own, in the hospital, and he mourned it in silence. He didn’t mention the angel to anyone. Every time he closed his eyes, he thought he’d see it there, living in his head, but he never did. His teacher sobbed whenever she saw him.</p><p>The events of the missing years, during which he had, apparently, talked and moved around normally, he picked up as he could, from the clues he was given. He learned the names of his new friends when they signed their get-well cards. What mistakes he made were put down to the shock of the incident. People were very patient. Day by day, his parents got better at pretending they had forgotten. They touched him as they would a normal child, and he smiled. He walked and played and went to school, went to college, got a job, moved to a city.</p><p>Two years. What had he missed? He would ask himself this now and then, as he got older and older. The answer was nothing. Those years had never been his. He had never been theirs.</p><p>What had he seen, there in the angel? Also nothing. But the other nothing—there was nothing and nothing, like the left hand and the right. That was something he knew. He had been right-handed, once, and now he was not.</p><p>When the angel came to Kristin, she was twenty-five, on a blind date at the nicest bar in Chico, California. There were three chandeliers, there were wood walls with mirrors on them. The man was pale and round and smiling. The angel spread across the top of her martini, starting at the olive, pink and blue, pinker near the rim, and then it detached itself and floated gently up and filled the space in front of her eyes.</p><p>The man was discussing gold. The angel obscured his face entirely, as if he had been all along just a voice and a set of arms, cuffs, a watch. He seemed to see nothing, and kept talking. Kristin opened her mouth a little, not to speak, and the angel brightened, and the man’s voice got farther away. She ran her tongue along the backs of her teeth and saw the angel swirl. She touched it to the roof of her mouth and the pink brightened. It is dancing, she thought, we’re dancing. She opened her mouth wider, as wide as she could, and the angel entered.</p><p>When she woke, she was married, though not to that man. This man was a little less solid, a little more tan. He was standing in the kitchen pointing at a cactus in a pot. She was wearing a caftan, yellow and white, and her feet were bare. It was a very obvious situation, she felt: the rings, the room, his face. No need to ask what she’d missed.</p><p>So she spoke. Life was a tunnel, she told her husband, and the walls were the same in light or in darkness. You didn’t need to see them to know they were there. He should close his eyes, she said. He should put out his hands and feel what they touched.</p><p>He looked frightened. As her words came out, smoke billowed from her body, filling her clothes, lapping out around her feet in rings. He dropped to his knees. White smoke. She felt held by it, cradled, even as it left her, even as it rushed out and filled the room. When she could no longer see him, when she could no longer be seen, she left.</p><p>It had been four years, she learned when she got to a gas station and saw a paper. Four years and three months and a few days. She bought sandals and water and a bag of trail mix, and when she went up to the counter the boy behind it just smiled, and she smiled, and on she went. She walked. She hitched to a city. She told the drivers—two truckers, a salesman, a teen with elaborate hair—about the angel, but no one believed. They laughed and laughed and let her out.</p><p>The days flaked off and fell, and she left them to the ground. Worked, begged, slept in attics and basements and under benches in parks. Every day there seemed a little less of her, a little less of the world, fewer days in front of her eyes. And she knew that one day there would be nothing left, nothing between her and the angel, and it would stand before her again, aglow with itself. As if one night all the lights in all the buildings would be turned off at once, and the cars and the street lamps and the screens, and even the stars would be dark overhead, and there is the moon. But it didn’t happen.</p><p>They met at the movies, a comedy about a serial killer and his mom. She was in the front row, napping, and he was behind her. He put his hands over her eyes and she opened them and her lashes brushed his palms. On a bench down the block, they sat side by side and told each other about the angel—the hand, the mouth, the smoke, the blood. They were at the edge of a park, and people walked by them and cars went past, and they talked with their knees touching.</p><p>The sun was down. A warm breeze seemed to blow in a circle around them, tighter and tighter. Their eyes, they saw, were pink and blue. They lay down together in the dirt and grass and went to sleep. She dreamed that she was lying there and the angel appeared and a little hand came out of it, a child’s hand, grubby, reaching toward her, and it made a fist. He dreamed he was curled up in her mouth.</p><p>When they woke it was morning and the other was gone. He was alone. She was alone. They called each other’s names. They went back to the theatre, they ran in and out of stores, they ran up and down the streets and stared into the faces of strangers, hoping just for resemblance. They searched all day for each other, circling out and out through the city and finding only other people.</p><p>And when the sun went down again the clouds were pink and then blue and then darker, and stars swarmed in. They closed their eyes. They saw the angel, just as they remembered. They opened them, and saw nothing. ♦</p>"}];

function render() {
  var a = articles[currentIndex];

  document.getElementById('author-block').innerHTML = a.author

  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
