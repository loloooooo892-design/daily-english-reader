*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

var articles = [{"title":"Norton Coupon Codes and Deals: 58% Off","source":"Wired","author":"@wired","url":"https://www.wired.com/story/norton-coupon-code/","category":"tech","categoryLabel":"Technology","wordCount":503,"readingTime":3,"content":"<p>Norton Antivirus is the only anti-virus software I've ever used, in part because many years ago I switched to Linux, which eliminates the need for antivirus software. If you're still on macOS or Windows, though, Norton Antivirus is still a solid choice. None of these services is something anyone is excited to run, but they can save you bacon if you make a bad decision downloading questionable files or clicking links you shouldn't have. The best way to stay protected without spending a fortune is to use a Norton coupon code to get yourself a deal.</p><h2>Norton Coupons: Up to 58% off 360 and Antivirus Plans</h2><p>While I’ve only ever used the Antivirus offering, the real way to save is to bundle several services and use a coupon code for the lot. With Norton that means Norton 360, which gets you the Antivirus, malware, ransomware, and hacking protection, along with a VPN and dark web monitoring, for up to three devices. You also get a password manager and 2GB of online storage. With this Norton coupon code, you get all that $40 for the first year, which is about <a href=\"https://www.wired.com/gallery/best-vpn/\" target=\"_blank\" rel=\"noopener\">the same as paying for a VPN alone</a>. Norton 360 Deluxe gets you everything that comes with the regular version, but it works with five devices and gives you 50GB of online storage.</p><h2>Get Unbeatable Norton With LifeLock Protection From $8.33 per Month</h2><p>LifeLock is Norton’s usual online protection suite, but adds up to $1 million in potential coverage if you experience financial loss due to identity theft. With this Norton <a href=\"https://cna.st/affiliate-link/2HJc3Q4E4T5tpv1ZdAX3NzkpS9wdL23WrqA1VjdeJpMqZfHA7wpnJJJTWgyNxKGu7dXfgYyhuJFuetDqontQeornQuxKLBcRwvr8WdDMq p1mKAPWKS9mQrxF16BEtyqqoTf7eK9cZydTc1tvVA4DiBVjNcF694JQLf2b2dpWLwtMBzaoDvZteVuH3k2FeQjAxHF7y2HD8dSYzt3DPT26bGfB9XSSSVLLx5kZFDZmyh7K9CUnZXwN563Ue9UTDQfSERVSjpZYERXsUxat1MpWMmbjFbX9joEBqUcyDsnNJVxZpAPQAFbydsPikevjAkrWEpexGdvzCAFHabN1sv2mnqzGgf98FCKEyFc8QKFthAWD3m9PsQUphBWDCbQm1jPNR81T\" target=\"_blank\" rel=\"noopener\">small business plans</a> are the way to go. These coupons will get you $100 off the Small Business Premium plan, and $80 off Small Business. These plans cover two devices per user and up to five users.</p><h2>Test Out Norton 360 for Yourself With a Free Trial</h2><p>Not sure if Norton 360 is worth the money? You can try it out for seven days, though set yourself a reminder because after the initial <a href=\"https://cna.st/affiliate-link/yfqaSfxPVvWDRySJ3tES3Xy9jSLmdixMtLCG9ppMTQiotjhwt6s6EnimQrMdNnsNbSexJpZ9NTk3z33QRhX4c6VXMotpyuhaVtEXWFvHoCesPBXUV7ux8rxjy7GZxbEt2QSkFnFjkGyEiyUrbki2fefwF2k5yvDcrpSywkwC2AEcR1QzKnrUN2C4dFCqjoFUmTm3KfjkTmmKUH8pYB457cHPpptjxb5L7t6N6uDXuSXFcvao1mE2DMF5Nh5xSsAMCrDbZroiG7Lur5\" target=\"_blank\" rel=\"noopener\">7-day free trial</a>, your paid subscription will begin unless you cancel before.</p>"},{"title":"Moonlighter 2: The Endless Vault review – a pleasant bout of number go up that’s most remarkable for how much of an improvement it is","source":"Rock Paper Shotgun","author":"@rockpapershot","url":"https://www.rockpapershotgun.com/moonlighter-2-the-endless-vault-review-a-pleasant-bout-of-number-go-up-thats-most-remarkable-for-how-much-of-an-improvement-it-is","category":"gaming","categoryLabel":"Gaming","wordCount":951,"readingTime":5,"content":"<p>10x multiplier</p>\n    \n  \n  \n  \n  \n<p>The <a href=\"https://www.rockpapershotgun.com/games/moonlighter\" target=\"_blank\" rel=\"noopener\">Moonlighter</a> games cast you as Will, a dungeoneer-merchant hybrid, delving into randomly shifting combat arenas by night and selling the treasures you unearth there by day. In the dungeons, you fight various monsters and beasties and are then offered upgrades to your combat build or a handful of relics you must fit in your bag. In the shop, you figure out how to get the best price for these items. And then you spend that money on upgrades that help you to dungeon delve better and start all over again.</p>\n<p>All this time, you will be thinking about multipliers.</p>\n<p>The least complicated version of these multipliers is in combat, so let’s start there. You can choose between one of four weapons, each of which has an attack and a special, and you always have a gun and, of course, your trusty backpack which you can use to whack stunned enemies out of the level. These steps come together into excellent choreography, especially as you develop your build further into the dungeon. You might, for instance, unlock a perk that means your attack does extra damage after you shoot something, or one that gives you a spot of healing whenever you knock an enemy off the level with your backpack, or one that adds fire damage to your basic attack, and so no two dances are quite the same. But overall you’ll find a familiar core and the extra damage will be a perk rather than a necessity.</p> \n\n<p>The combat in Moonlighter 2 isn’t especially difficult, and death, though rare, isn’t punishing either. Will has a pendant he can use to whisk himself out of danger, but if you mistime it and bite the dust your treasures will simply lose half of their quality. And it's these quality points where the real multiplicative tricks come in. Many items have rules that activate when you place them in your bag. An item might double the value of the treasure in the slot to its left or, conversely, it may destroy it. Puzzling out where to slot an item to maximise the value of your combined loot is key. Complicating matters is the fact that in each of the three (six if you include variants) themed dungeons, items placed in your bag may have additional specific effects on other items. In the museum, for example, electrocuting and repairing treasures will add to their quality, and other items may provide cascading effects, such as adding to the quality of everything in the bag when adjacent to a shocked item. Placement and timing become extremely important, building a puzzly breather into every few dungeon chambers.</p>\n\n<p>Once you escape with these varying-quality treasures, the multiplication only gets more complicated. Will must figure out the price people will pay for an item in his store, but they can be persuaded to shell out much, much more than its base value depending on what furniture is present in the shop, what perks you’ve unlocked using your trusty robotic chest, and what adorable teacup-pig like mascot you’ve decided to pet that day. It is extremely satisfying to spend an entire dungeon run pumping up the quality of an item and then place it perfectly to make tens of thousands of gold pieces.</p><p>And you’ll need every one of them, because Will is fighting to buy his home back. The events of Moonlighter are recapped very briefly at the beginning of the game, and the entire story of Moonlighter 2 is very light touch, but there’s enough there to provide a decent scaffold of meaning to what would otherwise be a straightforward bit of number going up. The overarching quests being “make a whole bunch of cash” helps to keep the game ticking along at a steady rhythm and spaces out upgrades to the various shops around the village who exist in symbiotic relationship to you, providing potions and weapon upgrades and such. As you need to make more and more money, you can pour it into them, and they’ll help you make even more money, and so on. Support small businesses! Keep cash in the local economy!</p>\n\n<p>I was pleasantly surprised by the fact this narrative doesn’t outstay its welcome. It suggests it’s going to be about 25% longer than it actually is and as I reached that marker I began to get worried that the game would grind into, well, a grind. But then it makes a sidestep and concludes neatly right where it ought to (I finished in just under 30 hours). That does make the pacing a little odd, but with the story itself being secondary to the experience of hell yeah, huge number! it doesn’t really affect the experience too much. And there are plenty of sidequests, secondary challenges, and, as the name suggests, endless modes if you’re clamouring for more.</p>\n<p>All in all, everything I’ve detailed here is perfectly pleasant and easy to recommend. But it elides the thing that surprised me most about Moonlighter 2, which is that every single thing I’ve talked about is a detail that blows the original game out of the water. They’re either new additions, or they’re something that’s been significantly improved. That goes for tiny but intensely important quality of life changes (you can see the base sale price of an item without having to press any additional buttons) all the way up to the overall structure of the game (having the challenge be making huge amounts of dough rather than beat all the dungeons means it can be much more relaxed and enjoyable). And every single one acts as a multiplier that turns something that could have been decent into something much more remarkable.</p>"},{"title":"Sound of da Harassment Prosecution","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/09/sound-of-da-harassment-prosecution/","category":"law","categoryLabel":"Law","wordCount":1074,"readingTime":6,"content":"<p>From N.Y. (Town of Patterson) Justice Court judge Michael Caruso in <em><a href=\"https://law.justia.com/cases/new-york/other-courts/2026/2026-ny-slip-op-26082.html\" target=\"_blank\" rel=\"noopener\">People v. Lando</a></em>, decided in April:</p>\n<blockquote><p>This prosecution … [is for] Harassment in the Second Degree in violation of Penal Law § 240.26(3), which is a violation [i.e., a petty offense punishable by no more than 15 days in jail -EV].</p>\n<p>The complainant alleges, based upon personal knowledge, that on May 30, 2025, at approximately 5:30 p.m., Defendant stopped her vehicle in front of the complainant's driveway and played music at an excessive volume, causing annoyance and alarm. The complainant further alleges that the music included the phrase \"it's the sound of the police,\" and that this conduct, as a whole, was undertaken in response to the complainant's prior report to law enforcement concerning Defendant's alleged excessive noise. According to the information, Defendant then backed up her vehicle and shouted to the complainant, \"Why don't you call them [the police] for me being too loud.\" …</p>\n<p>The supporting deposition alleges that on May 29, 2025, an individual identified as \"Frank\" drove past the complainant's residence and shouted vulgar and offensive language, including \"Fucking faggot!\" It further alleges that, later that same day, the same individual parked his vehicle in the roadway, thereby obstructing the complainant's wife from operating her vehicle, while staring at her and her daughter.</p>\n<p>The supporting deposition further alleges that on May 30, 2025, the same individual again drove past the complainant's residence, shouting additional vulgar and offensive remarks, including \"Gay fuck,\" directed at the complainant. It is also alleged that Defendant engaged in a course of conduct over a time period, including parking her vehicle conspicuously near the complainant's residence for extended periods with the windows down while playing loud music, specifically the song \"Sound of da Police\" by KRS-One, and operating her vehicle at excessive speeds along the roadway….</p></blockquote>\n<p>The court denied defendant's motion to dismiss the prosecution. It concluded that defendant's alleged conduct could qualify as second-degree harassment, defined as \"engag[ing] in a course of conduct or repeatedly commits acts which alarm or seriously annoy such other person and which serve no legitimate purpose.\" And the court concluded that the defendant wasn't protected by the First Amendment:</p>\n<blockquote><p>The Court is mindful that the playing of music constitutes artistic expression protected by the First Amendment, and it is not the function of this Court to adjudicate the expressive value or viewpoint of a particular musical work. The song at issue, which neither of the parties dispute, is \"Sound of da Police\" by KRS-One. This song, like countless others, is widely recognized as a form of constitutionally protected political expression, employing metaphor, hyperbole, and socio-political critique. Accordingly, the lyrics themselves are not to be construed as literal threats in the absence of contextual evidence demonstrating such intent….</p>\n<p>However, the protections afforded to expressive content do not preclude the Court from considering the manner, context, and surrounding circumstances in which such expression is allegedly used relative to the parties herein. Thus, the inquiry at this stage is not whether the song and musical, more generally, is protected in the abstract, but whether its repeated use, in conjunction with other alleged conduct, forms a factual basis sufficient to establish the elements of the charged offenses. The Court finds that it does.</p>\n<p>Here, the accusatory instruments allege that Defendant, on multiple occasions, played the KRS-One song entitled \"Sound of da Police\" at a high and disruptive volume from her vehicle while simultaneously directing offensive, suggestive, and threatening remarks toward the complainant near the complainant's home. While the playing of music alone would not suffice to establish criminal liability, the allegations, taken together, describe a pattern of conduct that may reasonably be interpreted as intended to alarm, annoy, threaten, or harass.</p>\n<p>The Court takes judicial notice of the recording \"Sound of da Police\" by KRS-One (1993), a widely distributed hip-hop song. The work features a forceful vocal delivery, repetitive chant elements, and a pronounced rhythmic beat that distinguish it from more subdued or conventionally \"soothing\" musical genres such as, for example, classical music or certain modes of jazz. For example, the refrain \"woop woop, that's the sound of da police\" is delivered in a loud, attention-commanding manner in the song.</p>\n<p>{Additionally, other portions of this song include statements such as, \"[t]he police, dem have a likkle gun / So when I'm on the streets, I walk around with a bigger one,\" which conveys a theme of escalation in armed confrontation, and \"[a]nd if you fight back they put a hole in your chest,\" which echoes an expression of violent engagement. Read together, these lyrics and the use of this song could conceivably support allegations that Defendant's actions, collectively, were intended to convey sentiments of antagonism and referencing retaliatory force that a reasonable listener could interpret as threatening in nature.}</p>\n<p>The Court makes this reference not to evaluate the speech, lyrics, or song itself, but to assess how a reasonable listener might perceive its volume, tone, and expressive content. Accepting the allegations of the accusatory instrument as true and according them every favorable inference, the Court cannot conclude, as a matter of law, that the use or playing of such a recording, especially given its emphatic and high-energy auditory qualities, would be incapable of producing the type of reaction or effects on the complainant as alleged by the People…. Whether the recording was in fact played at the volume, in the manner, or under the circumstances as alleged, and whether it had the effect attributed to it on the complaint, are factual questions ultimately to be resolved on trial and not on this motion….</p>\n<p>The Court further recognizes that hip hop and rap music as a genre often employs figurative and exaggerated language, and should not be interpreted literally without the appropriate context. Nevertheless, the Court may take notice that the song at issue is forceful and confrontational in tone, such that, when repeatedly amplified and directed toward a specific individual in conjunction with alleged verbal confrontations and targeted presence when using a motor vehicle, it may plausibly contribute to an atmosphere of intimidation and apprehension….</p>\n<p>The repeated playing of loud, confrontational music, coupled with the alleged operation of a vehicle very close to the complainant's residence and the simultaneous use of offensive and threatening language, provides nonhearsay factual allegations of an evidentiary nature sufficient to support the inference of a course of conduct directed at the complainant….</p></blockquote>\n<p>Andres Gil represents the prosecution.</p>"},{"title":"Rethinking the Mechanisms of Alzheimer’s Disease - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/rethinking-the-mechanisms-of-alzheimers-disease-1284912/","category":"fun","categoryLabel":"Interesting Reads","wordCount":1108,"readingTime":6,"content":"<p>Alzheimer’s disease is the <a href=\"https://alzheimer.ca/en/about-dementia/what-dementia/dementia-numbers-canada\" target=\"_blank\" rel=\"noopener\">most common form of dementia</a>. For many years, researchers believed that its main cause was a buildup of toxic proteins. But recent findings suggest that the problem may have another origin, specifically in the bloodstream.</p><p>Featured Video</p><p>Contrary to a commonly held belief, dementia isn’t just about memory. Imagine the brain as a car. To run properly, this complex system depends, among other things, on an engine (our neurons, the central component) and a set of pipes (our cerebral vascular system) to deliver fuel (oxygen and nutrients) to the engine.</p><p>As we age, this machinery wears out. If the pipes become damaged, rust sets in. If the engine breaks down, it affects the vehicle’s performance and inevitably leads to premature failure. In the case of Alzheimer’s disease, the “rust” is characterized by the accumulation of two toxic proteins: amyloid plaques and tau fibres, which bring about a decline in cognitive abilities, <a href=\"https://www.nia.nih.gov/health/alzheimers-and-dementia/what-alzheimers-disease\" target=\"_blank\" rel=\"noopener\">including memory</a>.</p><p>However, several observations call into question the role of these proteins. It becomes essential to identify the cause of this “rust” and understand its origin.</p><p><strong>The Amyloid Hypothesis</strong></p><p>For many years, pharmaceutical research on Alzheimer’s disease has focused on <a href=\"https://doi.org/10.1126/science.1566067\" target=\"_blank\" rel=\"noopener\">the amyloid hypothesis</a>, which is one form of “rust.” According to this hypothesis, the accumulation of Beta-amyloid proteins in the brain, in the form of plaques, is believed to be the primary cause of dementia.</p><p><a href=\"https://doi.org/10.3389/fnagi.2017.00339\" target=\"_blank\" rel=\"noopener\">Beta-amyloid protein is cleared</a> naturally by the blood and lymphatic systems, or is eliminated within the brain by protective cells (microglia and astrocytes) and enzymes. A malfunction in these cleanup mechanisms, combined with the production of Beta-amyloid, leads to the accumulation of Beta-amyloid proteins and the formation of plaques. <a href=\"https://doi.org/10.3233/JAD-179941\" target=\"_blank\" rel=\"noopener\">Prolonged exposure</a> to this protein over decades is thought to damage neurons and cause memory loss.</p><p>However, two major discoveries have challenged this hypothesis:</p><ul><li><a href=\"https://doi.org/10.1186/s40478-014-0135-5\" target=\"_blank\" rel=\"noopener\">The presence of plaques in healthy people</a>: Significant accumulations of plaques have been discovered in individuals with no cognitive impairment. It is also important to understand that amyloid is a protein that can be produced naturally in response to a viral infection or inflammation.</li><li><a href=\"https://doi.org/10.1002/14651858.CD016297\" target=\"_blank\" rel=\"noopener\">The limitations of new treatments</a>: Recently, drugs like lecanemab and aducanumab have been developed to directly break down these plaques. However, even though amyloid is almost completely eliminated, cognitive decline continues at a similar rate as with older treatments, which have the advantage of being less expensive and better tolerated.</li></ul><p>These findings suggest a new idea: amyloid plaques may not be the source of the problem, but rather the consequence of an underlying abnormality.</p><p>But then, where does this initial inflammation—which causes the accumulation of proteins—come from?</p><p>To return to our metaphor, relentlessly scrubbing rust off a car does not solve the problem that causes it. Since the damage is already done, the vehicle’s lifespan is permanently altered. Consequently, the focus must be on prevention and the early detection of the first signs of wear and tear.</p><p>This is where biomarkers come into play—biological indicators that help identify the disease before symptoms appear, in the hope of tracing the problem back to its true source.</p><p><strong>The Importance of the Blood System</strong></p><p>In this context, the cerebral vascular system has come under the microscope of scientists. Consistent with our metaphor, if the pipes that carry fuel are damaged, the engine’s performance drops and the machinery eventually fails.</p><p>Similarly, the brain’s proper operation depends on the vascular system, which supplies neurons with oxygen and nutrients. <a href=\"https://doi.org/10.1016/j.nrleng.2015.07.008\" target=\"_blank\" rel=\"noopener\">A new hypothesis</a> has emerged over the past decade: certain conditions, such as vascular diseases, hypertension, or type 2 diabetes, damage blood vessels and create areas of inflammation. In addition to restricting blood flow to the brain, inflammation is thought to cause the accumulation of Beta-amyloid, ultimately leading to the death of neurons.</p><p>Many important findings support this hypothesis. Today, vascular abnormalities—such as <a href=\"https://doi.org/10.1016/j.neurobiolaging.2010.02.005\" target=\"_blank\" rel=\"noopener\">changes in blood flow dynamics</a> (that is, a decrease in blood flow and blood volume), as well as the <a href=\"https://doi.org/10.1016/j.nicl.2022.103204\" target=\"_blank\" rel=\"noopener\">presence of hemorrhages</a>—are recognized as early signs of Alzheimer’s disease.</p><p>Furthermore, one of the <a href=\"https://doi.org/10.1016/S0140-6736(24)01296-0\" target=\"_blank\" rel=\"noopener\">most comprehensive reviews of the literature on dementia</a> recently found that certain risk factors could account for up to 45 per cent of dementia cases. Looking at the figure above, we see that a significant proportion of these risks is directly linked to our vascular health. Among these are high levels of LDL cholesterol, physical inactivity, type 2 diabetes, smoking, high blood pressure, excessive alcohol consumption and obesity.</p><p>Together, these factors carry significant weight and contribute substantially to the risk of developing a form of dementia. Addressing these factors provides concrete avenues for action to prevent or treat these conditions throughout life, thereby reducing the burden on our brains.</p><p>All these findings point to a crucial role of the vascular system in the development of Alzheimer’s disease. The current challenge? To precisely characterize the vascular system at an early stage—even decades before diagnosis—to identify the changes that lead to the disease.</p><p>In fact, while the relationship between the vascular system and dementia is beginning to be studied in greater depth, there is a significant lack of precise data on the subject.</p><p><strong>Toward a Comprehensive Approach Beyond Amyloid</strong></p><p>Fortunately, research is increasingly examining <a href=\"https://doi.org/10.14336/AD.2023.0608\" target=\"_blank\" rel=\"noopener\">non-amyloid factors</a> that may be responsible for the disease.</p><p>Among other things, the <a href=\"https://doi.org/10.3389/fnins.2018.00025\" target=\"_blank\" rel=\"noopener\">tau protein</a> appears to play an important role. But other mechanisms are also attracting interest from the scientific community: the role of the <a href=\"https://doi.org/10.1038/nrn3880\" target=\"_blank\" rel=\"noopener\">immune system</a>, <a href=\"https://doi.org/10.1016/j.neurot.2023.10.002\" target=\"_blank\" rel=\"noopener\">mitochondrial dysfunction</a> and <a href=\"https://doi.org/10.3390/neurolint18020037\" target=\"_blank\" rel=\"noopener\">communication problems between neurons</a>. Today, more and more scientists are even proposing a <a href=\"https://doi.org/10.1093/brain/awz384\" target=\"_blank\" rel=\"noopener\">multi-factorial approach</a> in which the various aspects of the disease interact with one another rather than acting in isolation.</p><p>The emergence of new vascular biomarkers supports the idea that damage to the brain’s blood-brain barrier is linked to Alzheimer’s disease. For example, the <a href=\"https://doi.org/10.1002/alz.70957\" target=\"_blank\" rel=\"noopener\">discovery that certain cells from the blood system infiltrate the central nervous system</a>—a sign that our “plumbing” is leaking—is correlated with cognitive decline and the presence of amyloid plaques.</p><p>Furthermore, with <a href=\"https://doi.org/10.1038/s41551-021-00697-x\" target=\"_blank\" rel=\"noopener\">improvements in imaging techniques</a> and the <a href=\"https://link.springer.com/article/10.1007/s44411-026-00545-x\" target=\"_blank\" rel=\"noopener\">advent of artificial intelligence in biomedical research</a>, we can assess the brain’s health much faster and with greater sensitivity than was previously possible.</p><p>We are gradually getting closer to finding a way to defeat this disease.</p><p>While we wait for the development of these new therapeutic approaches, the best way to protect your brain is to focus on what you can control. In other words, keep your “car” in good working order by staying active, both physically and socially, throughout your life. </p><p><em>This article is republished from </em><a href=\"https://theconversation.com/im-part-of-the-team-writing-the-next-bible-of-psychiatry-for-the-first-time-the-dsm-will-use-biology-to-understand-mental-disorders-288064\" target=\"_blank\" rel=\"noopener\">The Conversation</a><em> under a Creative Commons license. Read the <a href=\"https://theconversation.com/inside-the-brain-rethinking-the-mechanisms-of-alzheimers-disease-290095\" target=\"_blank\" rel=\"noopener\">original article</a>.</em></p><p><em>Lead image: Niphon / Adobe Stock</em><a href=\"https://images.theconversation.com/files/750996/original/file-20260729-57-x8316r.png?ixlib=rb-4.1.1&amp;q=45&amp;auto=format&amp;w=1000&amp;fit=clip\" target=\"_blank\" rel=\"noopener\"></a></p>"}];
