<style>

    --bg: #191C22;

    --accent-light: #252D3A;

    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;

    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }

<script>
var articles = [{"title":"The GTA 6 reveal has me wowed by Vice City and underwhelmed by Rockstar's same old missions","source":"PC Gamer","author":"Morgan Park","url":"https://www.pcgamer.com/games/grand-theft-auto/the-gta-6-reveal-has-me-wowed-by-vice-city-and-underwhelmed-by-rockstars-same-old-missions/","category":"gaming","categoryLabel":"Gaming","wordCount":592,"readingTime":3,"content":"<p>Grand Theft Auto VI: An Extended Look - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/tJbzMqJGH4k\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n\n<p>Reaction</p>\n\n<p>Reaction</p>\n\n<p>I renewed my Netflix subscription so I could dutifully report that, yep, GTA 6 looks cool as heck. But about those missions...</p>\n<p>The big gameplay reveal for <a href=\"https://www.pcgamer.com/grand-theft-auto-6/\" target=\"_blank\" rel=\"noopener\">GTA 6</a> has come and gone, and I'm surprised by how mixed I am on it.</p><p>In some ways, I'm more excited than ever play it. Vice City gives an amazing first impression—I'm already convinced it'll be the special sort of open world that you just want to exist in. Rockstar is packing it full of little activities and human touches that might make GTA 6 a borderline life sim: eating, drinking, sleeping, recreation, hanging out with buds, skydiving, dirt bike racing, and store robbing (I didn't say the activities were all aspirational). I'm seeing a lot of stuff I want to do.</p><p>That stuff looks so good it's almost overwhelming, but the bits in between all that—those fragments of story missions—were less impressive. I was hoping 13 years would change the shape of GTA's authored action, but Rockstar is still very much working with the same tools.</p><p>In the first mission we see Jason and Lucia doing a drug deal for Boobie Ike, and I bet you can guess what happens: The pair exchange some uneasy words with the buyer, then the deal goes wrong when the cops show up. Our heroes shoot their way out of the building.</p><p>A mission shown off later in the video takes place further in the story: Jason and Lucia are more established, taking on a job as security detail for some corpo bigwig. There's some walking, some talking, a speech about a company's new US headquarters, then the party is interrupted by professional killers with guns. The pair shoot their way out of the building.</p><p>This isn't just a trend throughout this gameplay reveal. Rockstar missions have had this pattern since the early GTA days: meet a weird new character, talk and drive with them for a while, then shoot 18 people, mission over. It's as if Rockstar believes every story beat has to check off the same bullet points. The format wore especially thin in Red Dead 2's overly long story, so much that I've struggled to replay the whole thing despite loving everything else about it.</p><p>My hope is that the majority of GTA 6 can buck this trend, and that today's reveal prioritized action for the sake of spectacle. I want to see quieter moments—missions centered around choices, mysteries, or just having fun. I know it's GTA, but wouldn't the explosions of action be more thrilling if they weren't always expected?</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>We've got a lot of GTA 6 reading for you today, including a <a href=\"https://www.pcgamer.com/news/live/grand-theft-auto-6-reveal-live-coverage-breaking-down-the-netflix-extended-look-event/\" target=\"_blank\" rel=\"noopener\">live blog</a> that catalogued details from the reveal as they happened.</p>\n\n<p>Morgan has been writing for PC Gamer since 2018, first as a freelancer and currently as a staff writer. He has also appeared on Polygon, Kotaku, Fanbyte, and PCGamesN. Before freelancing, he spent most of high school and all of college writing at small gaming sites that didn't pay him. He's very happy to have a real job now. Morgan is a beat writer following the latest and greatest shooters and the communities that play them. He also writes general news, reviews, features, the occasional guide, and bad jokes in Slack. Twist his arm, and he'll even write about a boring strategy game. Please don't, though.</p>"},{"title":"Cyborg Roaches Could Be the Future of Triage Medicine - Nautilus","source":"Nautilus","author":"","url":"https://nautil.us/cyborg-roaches-could-be-the-future-of-triage-medicine-1284583/","category":"fun","categoryLabel":"Interesting Reads","wordCount":510,"readingTime":3,"content":"<p>Australia has a reputation for harboring some particularly heinous wildlife. There are more than 100 species of venomous snakes, saltwater crocodiles, creeping tarantulas, and the giant burrowing cockroach. This massive insect (the world’s heaviest) can grow over three inches long. So, even though it’s not considered a pest, you might not want to encounter one if you’re, say, buried beneath some rubble. </p><p>Featured Video</p><p>Unless it was there to help. </p><p>Recently, Australian engineers developed a way to transform these beefy bugs into mini cyborg paramedics and <a href=\"http://dx.doi.org/10.1002/advs.76973\" target=\"_blank\" rel=\"noopener\">published</a> the results in <em>Advanced Science</em>.</p><p><a href=\"https://nautil.us/watch-this-cyborg-cockroach-test-its-new-diving-suit-1282592\" target=\"_blank\" rel=\"noopener\">Cyborg roaches</a> aren’t new. Biomechanical engineers have been experimenting with fusing insects and electronics for quite some time. Their relatively rudimentary nervous systems, agile legs, and small bodies make them excellent recon drones capable of squeezing into tight spaces to locate disaster survivors. The problem is, that once they search, they can’t really rescue, and that’s what the team wanted to remedy.</p><p><strong>Read more: </strong><a href=\"https://nautil.us/watch-this-cyborg-cockroach-test-its-new-diving-suit-1282592\" target=\"_blank\" rel=\"noopener\"><strong>“Watch This Cyborg Cockroach Test Its New Diving Suit”</strong></a></p><p>“A lot of people might not like the sight of a giant cockroach scurrying towards them, but if you’re trapped in rubble or stuck in a cave and need help, it could make a real difference between life and death.”</p><p>The researchers outfitted North Queensland giant burrowing cockroaches with lightweight cameras, electronic controls, and a new device of their own design—an auto-inject mechanism. Built mostly from off-the-shelf parts, this device contains a tiny syringe dart that can be filled with any liquid drug of choice. Once launched, the needle strikes the skin while citric acid and potassium bicarbonate powder mix in the cartridge, producing carbon dioxide. As the gas expands, it injects the drug, and a hypothetical buried patient gets a new lease on life.</p><p>The next step was testing their new paraborgs (as they called them). They plopped the cyborg roaches in a basic obstacle course, navigated them to a silicone target, and fired off their payloads. The auto-inject mechanism worked great, deploying successfully in 95 percent of the tests. The trick was stabilizing the insects before firing, something they only achieved in 72 percent of the tests. </p><p>So what kind of drugs could these paraborgs carry? </p><p>The researchers mention oxytocin for postpartum hemorrhage and antivenom for snake bites (it is Australia after all), but epinephrine for allergic reactions and insulin for diabetics could work too.  </p><p>And they wouldn’t be working alone—the team has also developed <a href=\"https://news.uq.edu.au/2025-07-cyborg-beetles-could-revolutionise-urban-search-and-rescue\" target=\"_blank\" rel=\"noopener\">wall-climbing cyborg beetles</a>. According to the researchers, beetles and paraborgs could be part of a platoon of insect helpers deployed at disaster sites to work with each other and human first responders. </p><p>“Some could carry cameras and environmental sensors, while others could carry specialized emergency or medical equipment,” study author Thang Vo-Doan said in a <a href=\"https://news.uq.edu.au/2026-08-paramedic-cockroaches-cyborg-care-when-rescuers-cant-reach\" target=\"_blank\" rel=\"noopener\">statement</a>. “Hopefully, within the next 5 to 10 years, we could see cyborg insect rescue teams deployed to help people in real emergencies, provided we have the resources to accelerate the research and field testing.” </p><p><em>Enjoying</em> <a href=\"https://nautil.us/\" target=\"_blank\" rel=\"noopener\">Nautilus</a><em>? Subscribe to our free</em> <a href=\"https://nautil.us/newsletter/?_sp=c43011db-6fcf-42f2-a38c-e033b87a4a1d.1759265717430\" target=\"_blank\" rel=\"noopener\"><em>newsletter</em></a>.</p><p><em>Lead Image: The University of Queensland</em></p>"},{"title":"A Georgia Cop Used Flock to Track 2 Other Cops: His Ex and Her Friend","source":"Wired","author":"@wired","url":"https://www.wired.com/story/a-georgia-cop-used-flock-to-track-2-other-cops-his-ex-and-her-friend/","category":"tech","categoryLabel":"Technology","wordCount":652,"readingTime":4,"content":"<p>In recent months, there has been a <a href=\"https://ij.org/the-ij-database-of-alpr-abuse/\" target=\"_blank\" rel=\"noopener\">surge</a> in reports of <a href=\"https://www.wired.com/story/flock-videos-highlighted-police-departments-that-face-misuse/\" target=\"_blank\" rel=\"noopener\">police officers misusing automatic license plate readers</a> (ALPRs) sold by <a href=\"https://www.wired.com/story/flock-safety-os-investigate/\" target=\"_blank\" rel=\"noopener\">Flock Safety</a> to stalk former romantic partners—but details about these incidents are often scarce.</p><p>Now, with documents obtained via a public records request, WIRED can reveal specific details about one extensive Flock-fueled surveillance campaign and the subsequent investigation and fallout.</p><p>Dustin Bozzo, who until this month worked as a patrolman in the Atlanta-area suburb of Alpharetta, Georgia, allegedly used Flock 56 times between March and May to search for the license plate of a former romantic partner—a fellow member of the Alpharetta Police Department. (Their relationship itself violated the city’s ban on workplace dating, documents show.) When Bozzo noticed that his ex’s car was often near that of another police officer, he began searching for that officer’s vehicle as well. He did so 29 times between March and May.</p><p>Lieutenant Jason Hiott of the Alpharetta Police Department tells WIRED that Bozzo was placed on paid leave on July 20 and resigned on August 5 following an internal investigation. He adds that an “ongoing criminal investigation” is underway in the department's Criminal Investigations Division.</p><p>Alpharetta police chief Trent Lindgren tells WIRED that the investigation will likely be finished soon, adding that the department holds itself to a “high standard,” and took “immediate action” when misuse was identified. Flock did not respond to a request for comment.</p><p>Bozzo did not respond to multiple requests for comment. He changed his Facebook profile picture and name after WIRED messaged him on the platform.</p><p>In the civilian world, a breakup may tempt people to check up on their former lovers by pulling up their social media profiles. But in the police world, many officers have instant access to Flock—a powerful, informative, and invasive tool for tracking people’s locations. Across the country, there have been <a href=\"https://ij.org/the-ij-database-of-alpr-abuse/\" target=\"_blank\" rel=\"noopener\">at least 45</a> documented incidents of police officers misusing Flock in order to look up or track current or former romantic partners.</p><p>According to the documents—which include the full internal report written by Alpharetta police Sergeant Jabbar Braithwaite—Bozzo says that he didn’t use Flock with the intent to intimidate or cause harm. The sequence of events they describe nonetheless show that even in such a case, the misuse of this technology can quickly and easily escalate into a serious offense.</p><p>Per the internal report, Bozzo admitted to Braithwaite that he had a fling with a then-fellow officer that started in late 2025. (That officer is now a civilian employee of the department.) The other officer, for her part, claimed that most, if not all of their romantic communications happened on Snapchat.</p><p>It’s unclear how much of the relationship may have played out during work hours. Bozzo, upon first being asked if he “had ever been romantically involved” with the former officer, responded by asking, \"At work?\" according to the documents.</p><p>“To clarify the question, I asked whether, at any time, either while employed together or otherwise, he and [redacted] had engaged in a sexual relationship,” Braithwaite wrote. “Patrolman Bozzo responded that they had.”</p><p>The former officer also admitted that they had been sexually intimate, but both maintained that it never occurred while they were on duty. Nevertheless, their behavior had caught the attention of multiple people within the department.</p><p>According to the documents, multiple people reported that Bozzo and the other officer “frequently spent personal time together while on duty” and were “not engaged in their assigned responsibilities” while doing so. The reports prompted the police department to separate the officers, who had been assigned to the same squad and patrol beat, and issue them a “written directive” about “acceptable workplace interactions.”</p><p>However, the officers seemingly continued the affair. One sergeant reported that he saw the pair meeting in a “dark, secluded park,” per Braithwaite’s summary, at about 2:30 am while Officer Bozzo was on duty but the other officer was not.</p>"},{"title":"\"This Case Begins with a Viral Video\" (and Goes on to Involve \"the Anti-Doxing League\")","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/28/this-case-begins-with-a-viral-video-and-goes-on-to-involve-the-anti-doxing-league/","category":"law","categoryLabel":"Law","wordCount":749,"readingTime":4,"content":"<p>From today's decision by Judge Kyle Dudek (M.D. Fla.) in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.flmd.422321/gov.uscourts.flmd.422321.674.0.pdf\" target=\"_blank\" rel=\"noopener\">Noshirvan v. Couture</a></em> (for a 2023 decision stemming from the same incident, see <a href=\"https://reason.com/volokh/2023/12/04/plaintiff-sues-defendant-alleging-defendants-niche-is-cancel-culture/\" target=\"_blank\" rel=\"noopener\">Plaintiff Sues Defendant, Alleging Defendant's \"Niche Is Cancel Culture\"</a>):</p>\n<blockquote><p>This case begins with a viral video. Plaintiff Danesh Noshirvan is a citizen journalist who built a social media following by exposing bad behavior in public spaces. In January 2022, he posted a video of Defendant Jennifer Couture confronting a young woman in a Dunkin Donuts parking lot. The video caught fire, resulting in criminal charges for Couture and public backlash. Couture and her now-husband, Defendant Dr. Ralph Garramone, allegedly decided to get even.</p>\n<p>According to Noshirvan, Couture and Garramone—acting individually and through Garramone's various business entities—hired a convicted computer hacker named Joseph Camp to retaliate. Camp, in turn, connected the couple with Defendant Patrick Trainor, a New Jersey lawyer who operates the Anti-Doxing League. What followed, Noshirvan alleges, was a retaliatory conspiracy by these defendants to systematically destroy his life and livelihood.</p>\n<p>Trainor responded to Noshirvan's lawsuit with counterclaims for defamation and civil conspiracy. According to Trainor, Noshirvan used his social media account to falsely brand Trainor as a \"Nazi,\" a \"White supremacist,\" and a \"pedophile.\"</p></blockquote>\n<blockquote><p>Trainor also alleges that Noshirvan enlisted two non-parties—James McGibney (who runs the account @bullyville) and an anonymous user known as @credibleintel—to amplify the smear campaign and republish the offending statements. Noshirvan then allegedly weaponized these posts to file bogus complaints against Trainor with state and federal law enforcement, as well as the New Jersey Office of Attorney Ethics. …</p>\n<p>The conflict with Trainor ignited in January 2024, when McGibney emailed Trainor to accuse him of misrepresenting facts to a court. That private dispute quickly spilled onto the internet. Between February 2024 and 2025, Noshirvan, McGibney, and @credibleintel unleashed a barrage of social media posts targeting Trainor. The publications accused him of harassment, professional misconduct, conspiring with a fugitive, and being a Neo-Nazi and pedophile. According to Trainor, the offending posts remain publicly visible today….</p></blockquote>\n<p>The court threw out Trainor's claims against Noshirvan, concluding:</p>\n<blockquote><p>Trainor cannot defeat summary judgment with a patchwork of stale claims, non-actionable opinions, and a conspiracy theory lacking an actual agreement. Yet that is all he offers. Trainor has failed to muster the specific facts necessary to show a conspiratorial agreement between Noshirvan and his associates. Strip away the conspiracy framework, and Trainor's defamation case reduces to statements that are either time-barred or constitutionally protected hyperbole.</p></blockquote>\n<p>The court concluded that defamation claims based on statements from before July 30, 2024 are barred by New Jersey's one-year defamation statute of limitations. The court also rejected Trainor's civil conspiracy claims, as well as Trainor's attempt to hold Noshirvan liable for McGibney's claims:</p>\n<blockquote><p>Viewing the documents cited by Trainor that he contends evidence a conspiracy between Noshirvan and McGibney, no reasonable jury could find an agreement to defame. Trainor's first document reflects McGibney offering to post about Noshirvan's lawsuit on two social media accounts \"couture.camp\" and \"bullyville\"—nothing more. Other communications between Noshirvan and McGibney are either too temporally disjunctive from the underlying conspiracy, do not relate to any conspiracy at all, or discuss a motion filed by Trainor or a drafted filing rather than the alleged defamatory posts. Through no stretch of the imagination could a reasonable jury conclude Noshirvan, McGibney, and @credibleintel entered an agreement to defame Trainor based on these documents.</p></blockquote>\n<p>And the court concluded that the post-July 30, 2024 statement by Noshirvan is not actionable:</p>\n<blockquote><p>The post features a screenshot of Senator Dick Durbin questioning [Kash] Patel about his appearances on a podcast whose host \"promotes conspiracy theories and worked with a neo-Nazi.\" Below the exchange, a caption reads, \"Sounds like Patrick Trainor.\" Trainor insists this post is actionable because it effectively brands him a neo-Nazi.</p>\n<p>But rhetorical hyperbole and name-calling do not amount to defamation. Under New Jersey law, a general statement accusing someone of bias is an opinion. Instead, there must be some other \"reasonably specific facts that are capable of objective proof of truth or falsity.\" Generalized accusations of bigotry or extreme bias—without a tether to specific, verifiable facts—are protected opinions. <em>Gomez Noriega v. City of Jersey City</em> (D.N.J. 2025) (statement that the plaintiffs \"hate Jews\" was not actionable as defamation); <em>Jorjani v. New Jersey Inst. of Tech.</em> (D.N.J. 2019) (\"[C]alling someone a racist, hater, or bigot—without more—will not result in defamation liability[.]\"). Noshirvan's snarky caption is a textbook example of a non-actionable, rhetorical comparison….</p></blockquote>\n<p>Nicholas A. Chiappetta (Chiappetta Trial Lawyers) represents Noshirvan.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
