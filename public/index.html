*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

<script>
var articles = [{"title":"Games industry honours beloved actor Sir Patrick Stewart, as the legendary Star Trek and X-Men actor passes away","source":"Eurogamer","author":"Robert Purchese","url":"https://www.eurogamer.net/patrick-stewart-dies-oblivion-uriel-septim-castlevania","category":"gaming","categoryLabel":"Gaming","wordCount":545,"readingTime":3,"content":"<p>\"An emperor, a captain, and an inspiration to us all.\"</p>\n    \n  \n  \n  \n  \n            <p>As I'm sure you're all now already aware, legendary British actor Sir Patrick Stewart has died, aged 86. <a href=\"https://www.instagram.com/p/DfFxNrvAVwK/?hl=en&amp;img_index=1\" target=\"_blank\" rel=\"noopener\">His Instagram account</a> announced the news yesterday, saying he died at home in Los Angeles surrounded by friends and family, following \"a brief and poignant journey with Alzheimer's Disease and Lewy Body Dementia\".</p>\n<p>Stewart, a poised and charming actor, was probably best known for his on-screen roles as Captain Jean-Luc Picard in Star Trek: The Next Generation, and Charles Xavier-slash-Professor X in various X-Men films. But he also enjoyed a long and celebrated career on stage.</p>\n<p>Stewart appeared in games, too, most notably in Bethesda's fourth Elder Scrolls game, Oblivion, as Emperor Uriel Septim 7th. He effectively kicked the adventure off, narrating the game's intro with gravitas before appearing as Septim to the player in their prison cell. There, he declared he'd seen the player in his dream and proceeded to let us free.</p>\n\n<p>\"I️ was born 87 years ago,\" Stewart's opening monologue began. \"For 65 years I've ruled as Tamriel's emperor. But for all these years I've never been the ruler of my own dreams. I have seen the gates of Oblivion, beyond which no waking eye may see. Behold, in darkness a doom sweeps the land. This is the 27th of Last Seed, the year of Akatosh 433. These are the closing days of the Third Era, and the final hours of my life.\"</p><p><a href=\"https://x.com/BethesdaStudios/status/2115912168575017218\" target=\"_blank\" rel=\"noopener\">Bethesda, upon hearing of Stewart's passing, posted a picture of Emperor Uriel Septim</a> from the recent Oblivion remaster, alongside the words: \"Rest in peace to Sir Patrick Stewart - an emperor, a captain, and an inspiration to us all. Our thoughts are with his loved ones.\"</p>\n<p>Stewart also notably voiced the narrator in both of MercurySteam's Castlevania: Lord of Shadows games, and appeared in a number of X-Men games and Star Trek games, as well as smaller projects like <a href=\"https://www.eurogamer.net/patrick-stewart-to-narrate-promising-polish-holocaust-themed-platformer-my-memory-of-us\" target=\"_blank\" rel=\"noopener\">Polish Holocaust game My Memory of Us</a>. In honour of his life and work, <a href=\"https://www.reddit.com/r/sto/comments/1xja1vy/honour_guard_present_arms/\" target=\"_blank\" rel=\"noopener\">The Star Trek Online community gathered in large numbers</a>, arranging spaceships in long lines to mark his passing.</p>\n<p>Messages celebrating the person Stewart was have flooded social media overnight, written by the many people he impacted during his life and long career. <a href=\"https://www.instagram.com/p/DfF36ZYo_jX/?hl=en&amp;img_index=1\" target=\"_blank\" rel=\"noopener\">Long-time X-Men collaborator and Wolverine actor Hugh Jackman said</a>: \"We lost one of the greats of stage and screen today. And, in my book, a tremendous friend and man. I learned so much from him. I will miss you, Patrick Stewart, all of my days.\"</p>\n<p><a href=\"https://www.instagram.com/p/DfGRUe0B63I/?hl=en\" target=\"_blank\" rel=\"noopener\">And Sir Ian McKellen, the Magneto actor who was considered one of Stewart's best friends, gave an overview</a> of the many years the two had known each other, from being \"ambitious young actors with the Royal Shakespeare Company half a century ago\", to working on X-Men together. McKellen recalled cautioning Stewart about taking the lead role in Star Trek because of the effect it would have on his stage career - advice Stewart fortuitously overrode. McKellen referred to his friend as \"the most respected and beloved actor of his generation on either side of the Atlantic\".</p>\n<p>Rest in peace, Sir Patrick Stewart. There won't be another like you.</p>\n\n      \n  \n        \n      <p>Mentioned in this article</p>\n    \n      \n\n      \n\n          \n            \nSee 15 more                      \n            \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      \n\n      <p>\nAwaiting cover image      </p>"},{"title":"Justices grapple with how to apply pretrial procedure rules in improper firing dispute","source":"SCOTUSblog","author":"Rodger Citron","url":"https://www.scotusblog.com/2026/11/justices-grapple-with-how-to-apply-pretrial-procedure-rules-in-improper-firing-dispute/","category":"law","categoryLabel":"Law","wordCount":1366,"readingTime":7,"content":"<p>How rigidly to apply the Federal Rules of Civil Procedure surfaced this week in <a href=\"https://www.scotusblog.com/cases/younge-v-fulton-judicial-circuit-district-attorneys-office/\" target=\"_blank\" rel=\"noopener\"><em>Younge v. Fulton Judicial Circuit District Attorney’s Office, Georgia</em></a>, argued on Nov. 2, in which the Supreme Court addressed whether a defendant’s failure to amend its pleading and present an affirmative defense prevents that party from moving for summary judgment on the basis of that defense. To put it perhaps a bit too simply, a number of justices made clear that rules exist for a reason and should be followed.</p><p>As detailed in my <a href=\"https://www.scotusblog.com/2026/10/justices-to-decide-whether-failure-to-plead-an-affirmative-defense-prevents-moving-for-summary-j/\" target=\"_blank\" rel=\"noopener\">preview</a> of the case, the pretrial procedural issues arise in the context of a civil rights suit in which the plaintiff asserts that she was improperly dismissed from her job. Jasmine Younge held a high-level position in the Fulton County District Attorney’s Office for about two months until she was fired in July 2019 by District Attorney Paul Howard. Younge says she was dismissed from her job about two weeks after telling Howard that she was pregnant. Subsequently, she sued the Fulton County District Attorney’s Office for a number of civil rights violations, including the claim that she was terminated because of her pregnancy in violation of Title VII of the Civil Rights Act of 1964.</p><p>The DA’s office answered the complaint but never asserted in its pleadings the personal-staff exemption defense upon which it prevailed at summary judgment. (Under Title VII, certain officials are exempted from the statutory definition of employee, including members of an elected official’s “personal staff.”) Younge objected unsuccessfully to the motion, arguing as a procedural matter that it had been too late for the DA’s office to assert new affirmative defenses given that it had not amended its pleading.</p><p>Younge based her argument on <a href=\"https://www.law.cornell.edu/rules/frcp/rule_16\" target=\"_blank\" rel=\"noopener\">Federal Rule of Civil Procedure 16(b)(4)</a>, which requires the district court to issue a pretrial scheduling order that may be modified only upon a showing of “good cause.” The pretrial scheduling order sets deadlines for the parties and, as relevant here, limits the time for parties to amend their pleadings.</p><p>Younge’s objection also was supported by <a href=\"https://www.law.cornell.edu/rules/frcp/rule_15\" target=\"_blank\" rel=\"noopener\">Rule 15(a)(2)</a>, which sets out the standard for a litigant to amend a pleading. Under the 1962 case of <a href=\"https://supreme.justia.com/cases/federal/us/371/178/\" target=\"_blank\" rel=\"noopener\"><em>Foman v. Davis</em></a>, still the leading Supreme Court case on amendment under Federal Rules of Civil Procedure 15(a), the court is required to consider a number of factors, including “undue delay, bad faith or dilatory motive on the part of the movant, repeated failure to cure deficiencies by amendments previously allowed, [and] undue prejudice to the opposing party by virtue of allowance of the amendment.”</p><p>The lower courts, including the U.S. Court of Appeals for the 11th Circuit, analyzed only whether Younge would be prejudiced by allowing the personal-staff defense to be asserted. They <a href=\"https://cdn.sanity.io/files/pito4za5/production/3a5d71c09f30bae60e72ff2155aa219291a11288.pdf#page=52\" target=\"_blank\" rel=\"noopener\">found</a> that there was no prejudice and concluded on the merits that Younge was a member of the district attorney’s personal staff and therefore not covered by Title VII.</p><p>Younge successfully petitioned for review of the 11th Circuit’s judgment regarding whether amendment is required before a defendant may move for summary judgment on the basis of an unpled affirmative defense.</p><p>Eric Schnapper, an experienced Supreme Court advocate, argued on behalf of Younge at the Supreme Court. The initial questions from Justices Clarence Thomas and Justice Ketanji Brown Jackson focused on prejudice. That seems to be because even if, as Younge argued, the DA’s office did not follow Rule 15(a)(2) and amend its pleading before moving for summary judgment, the question remained: Why did the failure to amend matter when “undue prejudice” was a factor to be considered under <em>Foman</em> and the 11th Circuit found that Younge was not prejudiced by the DA’s failure to amend?</p><p>Yet Justice Amy Coney Barrett homed in on the core point of Younge’s argument when she stated, “going back and forth about whether you were prejudiced or not doesn't help you in your fundamental argument, which is that, procedurally, this wasn't done right.”</p><p>After several follow-up questions from Justice Elena Kagan, Schnapper responded by adopting a modest but clear position: “[T]he Court should reverse this decision, send it back, and tell the defendant if it wants to raise [an] affirmative defense to move to amend. That’s all we’re asking this Court to hold.” Over the course of the argument, his approach seemed to grow in its appeal to the justices.</p><p>Barrett also asked whether the defendant would have to file a separate motion to amend its answer or the court effectively could “construe” the defendant’s summary judgment motion as a motion to amend. She noted that the 10th Circuit has such a rule in which the court applies the standards for whether amendment is allowed without requiring the defendant to “go through the formalist exercise of actually filing a Rule 15 or 16 motion” to amend.</p><p>Schnapper did not reject the approach suggested by Barrett, commenting, “You would have to be sure to let the parties brief” whether amendment was proper. To be sure, Schnapper did not endorse the 10th Circuit’s approach. But so long as the district court is required to be asked for leave to amend, whether in a separate motion to amend or as part of a summary judgment motion, Younge would prevail in the Supreme Court because the DA’s office never sought amendment.  </p><p>Several justices questioned the need for reversal and remand given the 11th Circuit’s finding that Younge had not shown prejudice by the DA office’s failure to bring this defense in its pleadings. Thomas asked what prejudice Younge suffered, commenting at one point, “I thought it was admitted that she was a member of his personal staff.” Justice Samuel Alito also seemed to resist the requirement of “a formalistic rule about filing a motion to amend for an affirmative defense.”</p><p>Stephen Petrany argued on behalf of the Fulton County DA’s office. During his argument, several justices expressed discomfort about adopting the 11th Circuit’s prejudice standard without requiring amendment. Justice Neil Gorsuch inquired about an “incredibly dilatory” affirmative defense, such as one asserted “because of reasons of bad faith,” and why that would be acceptable.</p><p>When Petrany replied that the court “has the inherent authority” to reject a summary judgment motion on that basis, Gorusch said “[t]hat seems to be an admission that Rule 15 … applies,” requiring a request to file an amended pleading so that the court can consider the conduct of the party moving for summary judgment (which may have been dilatory) as well as the actual or claimed prejudice on the nonmoving party. Shortly after that exchange, Justice Ketanji Brown Jackson expressed her concern that Petrany’s position would “disincentivize parties to actually bring motions to amend.” </p><p>The court’s order granting certiorari included a question about <a href=\"https://www.law.cornell.edu/rules/frcp/rule_16\" target=\"_blank\" rel=\"noopener\">Rule 16(b)(4)</a>, which provides that the pretrial schedule “may be modified only for good cause and with the judge's consent.” In this case, because the DA’s office moved for summary judgment after the discovery period had closed (which would have been after the deadline in the pretrial schedule for amending pleadings had passed), Younge argued that Rule 16(b)(4) applies in addition to Rule 15(a)(2), which generally governs amendment of the pleadings.</p><p>There were a number of questions about Rule 16(b)(4) during the argument, including whether it was necessary to consider this rule in order to decide the case. But the court seems likely to land where Kagan did during an exchange with Petrany: To reverse and remand the 11th Circuit with instructions to require the DA’s office to amend its answer to include the personal-staff defense and for the lower court to determine whether to allow that amendment under Rule 15(a)(2) and the factors in <em>Foman</em>.</p><p>Of course, it may be the case that the lower courts will allow the amendment and that the DA’s office will again prevail on its summary judgment motion. But, even if they would not have changed the ultimate outcome in this case, as Kagan put it, “The rules provide standards here. Why not just use them?” A majority of the justices seemed to agree.</p><p><strong>Recommended Citation: </strong>Rodger Citron, <em>Justices grapple with how to apply pretrial procedure rules in improper firing dispute</em>, SCOTUSblog (Nov. 5, 2026, 6:40 PM), https://www.scotusblog.com/2026/11/justices-grapple-with-how-to-apply-pretrial-procedure-rules-in-improper-firing-dispute/</p>"},{"title":"Struggling to spell ‘male chauvinist pig’? Apple’s grey list means your iPhone won’t help you","source":"Hacker News Best","author":"https://www.theguardian.com/profile/aisha-down","url":"https://www.theguardian.com/technology/2026/nov/06/struggling-to-spell-male-chauvinist-pig-apple-grey-list-means-your-iphone-wont-help-you","category":"tech","categoryLabel":"Technology","wordCount":556,"readingTime":3,"content":"<p>“Australia is a very bad place to question your sexuality on MDMA with NSA spies” might be a text you would wish to send to your friends, if you have had an extraordinarily complicated night out in Sydney.</p><p>But your <a href=\"https://www.theguardian.com/technology/iphone\" target=\"_blank\" rel=\"noopener\">iPhone</a> won’t help you spell any of it if you try to swipe-type it – that is, by gliding a finger across a keyboard as opposed to pecking out a word.</p><p>New research shows that <a href=\"https://www.theguardian.com/technology/apple\" target=\"_blank\" rel=\"noopener\">Apple</a> has a “grey list” of more than 100,000 words and phrases that it has restricted from being completed by its predictive text.</p><p>So if a user wishes to type phrases such as “Dictator Trump”, “NSA spies” or, surprisingly, “Australia is a very bad place”, “question your sexuality” or “on MDMA”, they will have to spell them out.</p><p>Apple’s predictive text will not suggest these words. And, if a user attempts to swipe-type them, they will often stumble, changing “United Ireland” to “United Iceland”, for example, or “Tibetan independence” to “Tibetan independences”.</p><p>The “grey list” was discovered by the independent researcher Derik Kauffman, whose other <a href=\"https://derikk.com/#projects\" target=\"_blank\" rel=\"noopener\">projects</a> include using AI to find errors in scientific papers. After noticing that he had problems typing certain phrases – but not others – on his iPhone, Kauffman was able to unearth a table containing the list, encoded in Apple’s operating system.</p><p>The list he found includes some unsurprising words and phrases. Apple’s iPhone will not autocomplete references to drugs, sexual acts and, perhaps in the spirit of corporate protection, “iMessage isn’t working”.</p><p>But it also includes possibly politically charged phrases, which Kauffman <a href=\"https://www.reuters.com/business/retail-consumer/apples-predictive-text-restrictions-include-dictator-trump-sleepy-joe-researcher-2026-11-06/\" target=\"_blank\" rel=\"noopener\">described</a> to Reuters as a “light-touch form of censorship”. Among these are “Trayvon Martin”, the name of the Black teenager shot in Florida in 2012, “Kashmir dispute”, “Muslim extremist” and “male chauvinist pig”.</p><p>In Hebrew, Apple will not autocomplete the phrase “the occupied territories”. In Arabic, it will not autocomplete the phrase “the Hamas movement”.</p><p>The list is one more glimpse into the dark bowels of how autocorrect – the chirpy keyboard partner that helps you look more educated to your loved ones – actually works.</p><p>The technology has taken many forms. In its earliest version, Unix, an operating system, would look up each word a user typed against a table of words, to determine if this word was spelled correctly.</p><p>This evolved into n-grams, a tool which allows an operating system to statistically predict what words might come next, based on the words before it. These form the basis of Apple’s familiar <a href=\"https://www.theguardian.com/technology/2025/nov/01/ducking-annoying-why-has-iphones-autocorrect-function-gone-haywire\" target=\"_blank\" rel=\"noopener\">autocorrect</a>, which was known to change expletives into prudish alternatives: “fork” and “ducking”, among other gaffes.</p><p>Last year, Apple launched a new autocorrect – a “transformer-based” system that was more akin to an LLM. Reddit sleuths <a href=\"https://www.theguardian.com/technology/2025/nov/01/ducking-annoying-why-has-iphones-autocorrect-function-gone-haywire\" target=\"_blank\" rel=\"noopener\">saw this</a> as a possible reason behind a spate of avant-garde spelling suggestions their iPhones made last year.</p><p>This hard-coded list illuminates one longstanding mystery behind the world’s spelling coach. Others remain, such as a brief <a href=\"https://www.bbc.co.uk/news/articles/c5ymvjjqzmeo\" target=\"_blank\" rel=\"noopener\">glitch</a> in which users of the dictation feature saw the name “Trump” flash across their screen when they spoke the word “racist” into their iPhones – which Apple quickly remedied.</p><p>Apple said that it designed its keyboard to avoid offering inappropriate or offensive predictive suggestions. It said iPhone users could always type out specific words or phrases, and override predictive text suggestions to achieve their desired meaning.</p>"},{"title":"Life as a D.C. Insider, as Imagined by a D.C. Outsider","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/life-as-a-dc-insider-as-imagined-by-a-dc-outsider","category":"fun","categoryLabel":"Interesting Reads","wordCount":568,"readingTime":3,"content":"<p>I wake to the sound of legislation being thrown at my window. I look at the legislation and angrily get on the phone. “There should be more carcinogens,” I demand.</p><p>Breakfast is scrambled eggs and toast, prepared and hand-fed to me by Mitt Romney.</p><p>I put on a different suit and tie from the ones that I slept in and walk outside. The air is crisp and refreshing. The Lincoln Memorial gives me a wink and a thumbs-up. Then a tourist approaches and it goes back to normal.</p><p>I text my best friend, Coal Lobby, and ask if he wants to play outside. “Sorry, I have to be at the Capitol today,” he replies. He adds a sad emoji. I cry.</p><p>I go for a jog. Midway through, a journalist calls me. I’m one of their anonymous sources. “The government has the flu,” I say. I finish my jog. My suit and tie are all sweaty. I keep them on.</p><p>I go to visit C.I.A. and ask how the spying is going. “Good,” says C.I.A. “One of the people I spy on is watching ‘Widow’s Bay.’ It’s funny, but also scary. You should watch it.” I tell C.I.A. that I’m too busy. “I get it,” C.I.A. says. “There are so many shows. It’s hard to keep up.” Talking to C.I.A. is so boring.</p><p>I’m getting hungry. I go to a diner whose only employee is Chuck Grassley. “The usual?” Chuck asks me. I say yes. We high five.</p><p>My phone buzzes. It’s a text from Coal Lobby. “It turns out I’m free!” he says. “Apparently I’m supposed to be at the Capitol tomorrow. Today it’s Verizon’s turn. Want to jump rope?” We jump rope. My suit and tie are now even sweatier. I disrobe completely.</p><p>I am thirsty. I go to a dive bar called something like Phil-a-Buster’s or Making This Dead Body Disappear Will Cost Forty Thousand Dollars. I order a Martini. The bartender notices that I am not wearing clothes and asks if I would like to put on his suit and tie. I say yes.</p><p>I glance at the television over the bar and see an important speech being given by a gun. The audience is also guns. I rise and applaud.</p><p>I leave the bar. I notice how many columns and archways this city has. “Just like ancient Rome,” I say to myself. Then I think of “Gladiator” and wonder how that movie holds up. I call Coal Lobby and ask if he wants to watch “Gladiator” with me. He says it’s rated R, so he has to ask his mom. “Forget it,” I say. “She’ll say no. Remember when we were going to wander around the woods to try and find that dead amendment and she said you couldn’t?” Coal Lobby remembers. He cries.</p><p>Somebody walks by me. It’s Mitt Romney. I wonder why he serves me breakfast by hand every morning. It’s not something we’ve discussed.</p><p>I leave the bar. A bird flies past and gives me a secret note. It says to meet at the place where all the rich people gather in masks and robes. I show up and they’re playing Scrabble. It’s kind of a letdown.</p><p>I go home. I put on a new suit and tie and get into bed. The journalist from before calls me. “Does government still have the flu?” they ask. I say yes. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
