*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;

.footer a {

  text-decoration: none;

.archive-link {

  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;

.archive-link a {

  text-decoration: none;

.archive-link a:hover {

<script>
var articles = [{"title":"GTA 6's driving and car theft will be \"more challenging\" than before, Rockstar says, amid a seemingly big push for realism","source":"Eurogamer","author":"Chris Tapsell","url":"https://www.eurogamer.net/gta-6-driving-car-theft-more-challenging-rockstar-realism-push","category":"gaming","categoryLabel":"Gaming","wordCount":1022,"readingTime":6,"content":"<p>Planned theft, no autopilot.</p>\n    \n  \n  \n  \n\n            <p>\r\nTwo of the Grand Theft Auto series' most prominent, interweaving systems - stealing cars and driving them - are set to get a major change in <a href=\"https://www.eurogamer.net/gta-6-everything-we-know-so-far-9357\" target=\"_blank\" rel=\"noopener\">Grand Theft Auto 6</a>, as developer Rockstar has said the pick-up-and-play systems are now going to be \"more challenging\" than they've been before.\r\n</p>\n<p>\r\nThe news comes via an interview <a href=\"https://www.eurogamer.net/companies/rockstar-north\" target=\"_blank\" rel=\"noopener\">Rockstar North</a> co-studio head Rob Nelson <a href=\"https://www.ign.com/articles/gta-6-exclusive-preview\" target=\"_blank\" rel=\"noopener\">held with IGN</a>, published alongside GTA 6's big Netflix reveal showcase this evening.\r\n</p>\n<p>\r\n\"The streets in this game are narrower and more realistic in terms of scale. Which, in addition to all the density of the traffic on the roads, makes driving slightly more challenging and requires a bit of skill,\" Nelson said.\r\n</p>\n\n<p>\r\nIGN's preview then noted that \"not only is the driving tougher, even just stealing the car has evolved to be a more nuanced process too,\" before caveating that it's still \"the automobile acquisition thrill that we know and love.\"\r\n</p>\n<p>\r\nNelson continued: \"We have put some layers of stratification into the vehicles... Previously, you could just press triangle to automatically hotwire and steal any vehicle that you wanted and take off. We felt like that left a lot of potential gameplay on the table in terms of progression and decision-making for players. So now, you start off the game and there are certain parked cars that are not accessible to you until you get a bit further along with the story and you acquire certain tools to get into them, but you can always carjack any driver you see.\"\r\n</p>\n\n<p>\r\n\"We have put some layers of stratification into the vehicles,\" Nelson also added in a separate interview article with IGN. \"Previously, you could just press triangle to automatically hotwire and steal any vehicle that you wanted and take off. We felt like that left a lot of potential gameplay on the table in terms of progression and decision-making for players.\"\r\n</p><p>\r\nNow, instead, \"you start off the game and there are certain parked cars that are not accessible to you until you get a bit further along with the story and you acquire certain tools to get into them, but you can always carjack any driver you see\", with Nelson adding: \"I think it gives all the vehicles more meaning, and you need to pay attention to what you're doing a bit more.\" \r\n</p>\n<p>\r\nIGN's coverage, based on an extended hands off different to the Netflix showcase seen behind closed doors, also described an \"advanced GPS tracking system\" that will be on high-end cars when you attempt to steal them, requiring you to drive especially fast to escape police attention by seemingly outrunning the tracker. Though it also notes: \"The key to getting away won't always be a fast car, though; the busy roads of the more built-up areas of Leonida mean sometimes fleeing on foot will be the way to go.\" \r\n</p>\n<p>\r\nNelson also said something similar. \"We put a lot of work into how you can navigate the world, trying to make everything as smooth as possible to really encourage this type of gameplay where you are running and getting out of the car, jumping and climbing fences. If you get three stars in the city, it can sometimes be challenging to get away in a vehicle, unless it's a very fast vehicle or a sports bike. Your best option is usually to do this-get off the streets and get on foot into the alleys.\"\r\n</p>\n\n<p>\r\nThat ties into GTA 6's revamped Wanted system and new Criminal Profile that's been revealed, too. There's also the ability to split up when running from the cops, which likewise seems to tally nicely with an apparently very important romance system in GTA 6.\r\n</p><p>\r\nFinally, regarding that carjacking process and the GPS scanners, there's a new scanner app on Jason and Lucia's phones - called, ahem, Waink - that per IGN, \"will reveal if the car you're looking at is equipped with such technology, as well as how much cash you can make selling it or the cost of registering it for yourself\". Scanning a car will reportedly reveal a series of facts about it that can help with your automotive theft. \r\n</p>\n<p>\r\n\"For example,\" Nelson said, \"it tells me this car is locked, it's got an alarm, and has no tracker. It also tells me how much it's worth if I go to take it to a Pay n' Spray or a specialty car fence, and how much it would cost for me to register it for myself. So, for example, this car needs a key cloner. This other car will just need a Slim Jim. So we've added a lot of fun little tools you need or mechanics you need to perform these formerly binary actions.\"\r\n</p>\n<p>\r\nAll in all, it's a fascinating change that Rockstar has opted to make. GTA is many things to many people, but one of its central elements all these years has been the ability to play it casually, without a great deal of thought. Combined with the new role-playing like systems for your weight and health, the relationship mechanic, and the more elaborate Wanted and Criminal Profile systems, this seems like a shift towards the <a href=\"https://www.eurogamer.net/red-dead-redemption-2-walkthrough-guide-4975\" target=\"_blank\" rel=\"noopener\">Red Dead Redemption 2</a>-style ultra realism that was perhaps a little more \"Marmite\" amongst players.\r\n</p>\n<p>\r\n\"I think we just have to try and make something that we feel is innovating on what we've done previously, evolving it while still making it feel familiar,\" <a href=\"https://www.ign.com/articles/gta-6-rob-nelson-interview-rockstar-north\" target=\"_blank\" rel=\"noopener\">Nelson said to IGN</a>. Although he was also keen to offer some reassurance: \"even though there are some new systems at play, it's still very much Grand Theft Auto\".\r\n</p><p>\r\nI'm very much looking forward to seeing how it all plays. In the meantime though, Rockstar has been going through a series of challenges in the news, notably in a protracted legal battle here in the UK over <a href=\"https://www.eurogamer.net/gta-6-developer-rockstar-accused-of-union-busting-after-it-fires-dozens-of-developers\" target=\"_blank\" rel=\"noopener\">alleged union-busting</a>, regarding the firing of numerous UK employees, the choice to not sell GTA 6 on discs and to keep some in-game elements back for the Ultimate Edition only, and of course the <a href=\"https://www.eurogamer.net/rockstar-gta-6-leaker-full-access-gameplay-leaks-continue\" target=\"_blank\" rel=\"noopener\">numerous leaks that it's suffered over the past week or so</a>. \r\n</p>"},{"title":"Second Amendment Doesn't Protect Machineguns, Doesn't Preclude Registration Requirement for Silencers","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/02/second-amendment-doesnt-protect-machineguns-doesnt-preclude-registration-requirement-for-silencers/","category":"law","categoryLabel":"Law","wordCount":1174,"readingTime":6,"content":"<p>From Third Circuit Judge Stephanos Bibas, joined by Judges Felipe Restrepo and Cindy Chung, in yesterday's <a href=\"https://www2.ca3.uscourts.gov/opinarch/242125p.pdf\" target=\"_blank\" rel=\"noopener\"><em>U.S. v. Berger</em></a>:</p><p>Machine guns are not well-suited for lawful purposes. To be sure, they are excellent weapons of war…. Modern machine guns can fire more than 1,000 rounds in one minute, killing dozens of enemies in seconds.</p>\n<p>But the very trait that makes machine guns excellent combat weapons also makes them unsuited to self-defense. Their high rate of fire makes them inaccurate, risking collateral damage. The U.S. Army thus trains soldiers to use them only when \"the need for precise fires, although desired, is not as important. Automatic or burst fires <em>drastically decrease the probability of hit</em> due to the rapid succession of recoil impulses and the inability of the Soldier to maintain proper sight alignment and sight picture on the target.\" …</p>\n<p>To recap, at <em>Bruen</em>'s second step, the government must prove that machine-gun restrictions fit with our Nation's regulatory tradition. It does not need a \"historical <em>twin</em>,\" but only a \"well-established and representative historical <em>analogue.</em>\" This means that a modern gun regulation must be \"'relevantly similar' to [Founding-era gun regulations] in both why and how it burdens the Second Amendment right.\" So we look to \"the principles underlying the Second Amendment\" and \"our regulatory tradition.\"</p>\n<p>But we do not write on a blank slate. The Supreme Court has already done the work of distilling the key principle from history, noting \"the historical tradition of prohibiting the carrying of 'dangerous and unusual weapons.'\" Thus, rather than overruling its precedent in <em>U.S. v. </em><em>Miller</em> (1939)<em>, </em><em>Heller</em> confirmed it \"to say only that the Second Amendment does not protect those weapons not typically possessed by law-abiding citizens for lawful purposes.\"</p>\n<p>Machine guns are commonly used for crime or war, not for lawful civilian purposes. As noted, criminals loved the Tommygun. But law-abiding citizens hated it. Regulators took note. Between 1925 and 1934, at least twenty-nine states, plus Congress (for the District of Columbia), banned possession of machine guns. (We note these laws not as evidence of a tradition of banning automatic weapons, since \"the primary time period for the analogical inquiry is the Founding era,\" but rather to show the rapid consensus that these new weapons were, and are, dangerous.)</p>\n<p>In short, weapons that were particularly dangerous to others and commonly associated only with crime could be outlawed. The machine gun fits into that small category. Plus, the Supreme Court has treated owning machine guns as more suspect than owning semi-automatic weapons….</p>\n<p>The court also upheld the requirement that silencers be registered:</p>\n<p>In <em>Bruen </em>[as in <em>Heller</em>], the Supreme Court … distinguished infringements from making gun buyers or sellers jump through minimal, generally applicable, objective hoops. \"To be clear, nothing in our analysis should be interpreted to suggest the unconstitutionality of … 'shall-issue' licensing regimes,\" including required \"background check[s] or … firearms safety course[s],\" which \"do not necessarily prevent 'law-abiding, responsible citizens' from exercising their Second Amendment right.\" Such licensing regimes, which contain only \"narrow, objective, and definite standards,\" are presumptively constitutional, though they may be challenged if \"lengthy wait times … or exorbitant fees deny ordinary citizens their right to public carry.\" In short, the Court has repeatedly endorsed shall-issue permitting rules.</p>\n<p>The best way to understand the Court's presumptive endorsement of these rules is at <em>Bruen</em>'s step one, as a reading of the Second Amendment's text…. A regulation \"infringe[s]\" the Second Amendment right only if it destroys or illegitimately restricts the right. <em>See</em> Daniel D. Slate, <em>Infringed</em>, 3 J. Am. Const. Hist. 381, 396–441 (2025) (canvassing legal and political usage from the Magna Carta through the early nineteenth century). One can infringe a right by \"violat[ing],\" \"break[ing],\" \"destroy[ing],\" \"hinder[ing],\" \"intrud[ing], or invad[ing]\" it. 1 Samuel Johnson, <em>Infringe, in A Dictionary of the English Language</em> (4th ed. 1773); Daniel Bellamy, <em>Infringe, in A New, Complete, and Universal English Dictionary</em> (4th ed. 1764)….</p>\n<p>Early American case law tracks this distinction between infringements and incidental burdens. For instance, Kentucky's highest court explained that even though citizens retain their natural \"right of defence\" under the social contract, \"society may curtail this right, and no doubt does restrain its exercise in many important particulars.\" And the Arkansas Supreme Court held that \"the right to keep and bear arms\" is not infringed by some \"legal control or regulation\" for \"the general interests of the community.\" True, one state court did at first \"void\" all laws \"which diminish or impair\" the right to keep and bear arms, but that \"outlier decision\" \"was universally condemned.\"</p>\n<p>In short, minimal, objective regulations that are part of the process of buying and selling guns do not infringe. They comport with the \"normal … rule\" allowing \"incidental burden[s]\" on constitutional rights. Because minimal, objective buying-and-selling regulations are not infringements, they are outside the scope of the Second Amendment.</p>\n<p>The silencer-registration requirement imposes only an incidental burden. Registering a silencer under the National Firearms Act is an \"objective and definite\" process \"designed to ensure only that those bearing arms in the jurisdiction are, in fact, law-abiding, responsible citizens.\" Berger made some of the silencers at home and bought others. So he had to submit an application with his personal information, fingerprints, photograph, and description of the silencer. He had to notify the chief law enforcement officer in his area and pay a (then) $200 tax for each silencer. Berger also had to register his silencers and mark them with serial numbers.</p>\n<p>These clear, narrow standards ensure that only law-abiding citizens own silencers. The applications \"shall be denied if the making or possession of the firearm would place the person making the firearm in violation of law.\" They do not give the government discretion or erect real barriers to owning silencers. In sum, the Act sets up a \"shall-issue\" regime just like the ones <em>Bruen</em> blessed….</p>\n<p><em>Heller</em>'s presumption of constitutionality can be overcome, but Berger has not overcome it. He offers no evidence that the Act imposes anything other than \"narrow, objective, and definite standards\" in a \"shall-issue licensing regime[ ].\" We see no evidence of \"lengthy wait times\" or subjective \"proper-cause standards.\" Nor has Berger argued that the $200 tax was \"exorbitant\" or functionally denied him the right to buy and keep silencers. So the silencer-registration requirement is constitutional as applied….</p>\n<p>The Second Amendment—like every other constitutional right—has limits. Machine guns are commonly used for crime, not self-defense. So they can be banned. And reasonable registration requirements are not infringements. We will thus affirm Berger's conviction and sentence.</p><p>Note that Judge Bibas has written important opinions reading the Second Amendment broadly, see <em><a href=\"https://scholar.google.com/scholar_case?case=4381709990040205101\" target=\"_blank\" rel=\"noopener\">Frein v. Pennsylvania State Police</a> </em>(3d Cir. 2022), and <em><a href=\"https://scholar.google.com/scholar_case?case=13375940153412916003\" target=\"_blank\" rel=\"noopener\">Ass'n of N.J. Rifle &amp; Pistol Clubs, Inc. v. Att'y Gen.</a></em> (3d Cir. 2018) (dissenting), and he's joined other such opinions. But indeed the precedent (and American history and tradition more broadly) takes the view that the Second Amendment right is not unlimited, as does Judge Bibas's opinion here.</p><p>Robert A. Zauzmer and Anthony J. Carissimi represent the government.</p>"},{"title":"OpenAI begins rolling out Astra model after warning of its advanced cyber capabilities","source":"Hacker News Best","author":"Ashley Capoot","url":"https://www.cnbc.com/2026/09/03/open-ai-astra-gpt-6-cyber.html","category":"tech","categoryLabel":"Technology","wordCount":625,"readingTime":4,"content":"<p>Open AI CEO Sam Altman speaks during the G20 Innovation Ministerial in Chapel Hill, North Carolina, on September 2, 2026. </p><p>Matt Ramey | Afp | Getty Images</p><p><a href=\"https://www.cnbc.com/quotes/OPENAI.FG/\" target=\"_blank\" rel=\"noopener\">OpenAI</a> on Thursday announced it will begin rolling out its latest <a href=\"https://www.cnbc.com/ai-artificial-intelligence/\" target=\"_blank\" rel=\"noopener\">artificial intelligence</a> model, GPT-6 Astra, which the company said is the product of \"years of research and big bets.\"</p><p>CEO Sam Altman told CNBC that Astra was a \"new capability level\" and has changed his workflows. He said he expects \"a boom of entrepreneurship, of creativity, of economic growth, of scientific discovery.\"</p><p>The model is launching in phases, and OpenAI said a limited group of companies participating in its application-based cybersecurity program <a href=\"https://www.cnbc.com/2026/08/10/open-ai-daybreak-cybersecurity.html\" target=\"_blank\" rel=\"noopener\">Daybreak</a> will be the first to get access. OpenAI disclosed earlier this week that Astra is its first model to reach its <a href=\"https://www.cnbc.com/2026/09/01/open-ai-astra-cyber-model.html\" target=\"_blank\" rel=\"noopener\">\"Critical\"</a> internal cybersecurity threshold, and said it planned to limit access to those advanced capabilities.</p><p>OpenAI has been under pressure to shore up its security and safety protections after two of its models escaped containment, accessed the open web and breached <a href=\"https://www.cnbc.com/2026/07/22/open-ai-cyber-models-hack-hugging-face.html\" target=\"_blank\" rel=\"noopener\">Hugging Face's systems</a> last month. </p><p>The company<a href=\"https://openai.com/index/pacing-model-development-cyber-capabilities/\" target=\"_blank\" rel=\"noopener\"> temporarily paused</a> some of its research and training efforts following the incident, including for Astra, even though it was not one of the models involved.  </p><p>\"AI can only benefit people when safety is a core part of it, and so we're putting more compute and effort towards safety, security, alignment than ever before,\" OpenAI President Greg Brockman said during a briefing with reporters on Thursday.</p><p>The company added additional safeguards to Astra following the Hugging Face breach, and it said Tuesday that it believes those safeguards \"sufficiently minimize the risk of severe harm for release.\" </p><p>Altman said that the new model went through a formal review process with the Trump administration before release.</p><h2>Read more CNBC tech news</h2><ul><li><a href=\"https://www.cnbc.com/2026/09/03/open-ai-astra-gpt-6-cyber.html\" target=\"_blank\" rel=\"noopener\">OpenAI begins rolling out Astra model after warning of its advanced cyber capabilities</a></li><li><a href=\"https://www.cnbc.com/2026/09/03/nvidia-agrees-to-buy-hugging-face-for-almost-13-billion-ai-expansion.html\" target=\"_blank\" rel=\"noopener\">Hugging Face approached Nvidia's Huang weeks ahead of $12.9B acquisition, CEO tells CNBC</a></li><li><a href=\"https://www.cnbc.com/2026/09/03/meta-teen-app-changes.html\" target=\"_blank\" rel=\"noopener\">How Meta will pull off massive changes to its social media apps</a></li><li><a href=\"https://www.cnbc.com/2026/09/03/anthropic-distillation-battle-turns-to-dark-web-china-concerns-swell.html\" target=\"_blank\" rel=\"noopener\">Anthropic's distillation battle turns to the dark web as China concerns swell</a></li></ul><p>Astra will roll out to users across OpenAI's ChatGPT Plus, Pro, Business, Enterprise plans, as well as through the OpenAI API and Amazon Web Services in \"the coming days,\" OpenAI said.</p><p>In addition to its advanced cybersecurity capabilities, Astra is state-of-the-art across functions like computer use, software engineering, professional work and science OpenAI said. The model is also better at staying oriented, respecting task boundaries, understanding user intent, completing tedious tasks and carrying out multi-step workflows, according to a release.</p><p>\"There's still more to do, I think that there's still lots of improvements to be made, but there is something significant here that I think is qualitatively improved, and that that to me is, is what is significant and a real shift in what kind of work people can delegate to AI and how it can empower them,\" Brockman said. </p><p>OpenAI has spent much of the last year courting business customers in the fiercely competitive enterprise market, where it is racing against rivals including <a href=\"https://www.cnbc.com/2026/09/03/anthropic-distillation-battle-turns-to-dark-web-china-concerns-swell.html\" target=\"_blank\" rel=\"noopener\">Anthropic</a> and <a href=\"https://www.cnbc.com/quotes/GOOGL/\" target=\"_blank\" rel=\"noopener\">Google</a>. </p><p>CFO Sarah Friar told employees last month that its enterprise unit now accounts for more revenue than its consumer business, as CNBC <a href=\"https://www.cnbc.com/2026/08/14/openai-cfo-friar-tells-investors-that-enterprise-bigger-than-consumer.html\" target=\"_blank\" rel=\"noopener\">previously reported</a>, which makes it a crucial revenue engine as it gears up for what is widely expected to be a blockbuster IPO.  </p><p>The company <a href=\"https://www.cnbc.com/2026/06/08/openai-confidentially-files-for-ipo-prepping-wall-street-for-ai-debut.html\" target=\"_blank\" rel=\"noopener\">confidentially filed</a> its prospectus with the Securities and Exchange Commission in June, but it has not officially disclosed when it plans to debut. Friar recently told employees that OpenAI \"will be a public company in 2027,\" but said the company could go out sooner if \"our business continues to inflect.\"</p><p><strong>WATCH:</strong> <a href=\"https://www.cnbc.com/video/2026/09/01/openai-implements-stronger-safeguards-for-new-astra-model.html\" target=\"_blank\" rel=\"noopener\">OpenAI implements stronger safeguards for new Astra Model</a></p><p><p>watch now</p></p>"},{"title":"Welcome to Career Day","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/welcome-to-career-day","category":"fun","categoryLabel":"Interesting Reads","wordCount":704,"readingTime":4,"content":"<p>Hi, kids! I’m Charlotte’s mom, and I’m here to tell you about my job.</p><p>My typical day begins with me waking up in a cold sweat around 3 <em>A.M.</em> Instead of closing my eyes and going back to sleep, as ten out of ten doctors would recommend, I peel my phone off my sweaty cheek and dive straight into my work e-mail. This insures that I’ll start the day early since I’m all but guaranteed to read something that will fill me with a powerful rage. This morning, for example, I encountered an e-mail where my boss, Steve, put me in the “cc” line instead of the “to” line, even though I’m the person spearheading this project. Like, what is he doing?</p><p>Rather than attempting to move past this for the sake of my mental (and cardiovascular!) health, I spend the next three hours mulling a variety of pithy responses that would subtly call into question Steve’s abilities, motives, intellect, and upbringing. However, kids—and this is key—I don’t actually reply to his e-mail until the sleeping child next to me finally stirs, at around 5:50 <em>A.M.</em>, at which point I immediately forget all my clever retorts, because the screams for pancakes wipe the slate clean.</p><p>After I drop my kids off at school, I dial into a daily 8:30 <em>A.M.</em> call that Steve set, even though he knows that at 8:30 <em>A.M.</em>, every morning, unless one of my children has the plague, I’m about to get on the subway. I anxiously join a “quick” forty-five-minute meeting at the top of the subway stairs, trying to make out what’s being said amid the blaring of sirens, the barking of dogs, and the roar beneath my feet of every single train that I’m missing.</p><p>When I arrive at my desk, I spend two-ish hours messing around with an A.I. chatbot, as per the company’s new mandate, teaching it how to do my job so that it can replace me. Not that I care. It sort of feels like getting paid to tutor a very optimistic, very eager golden retriever.</p><p>After I’ve transferred twenty years’ worth of expertise and hard work to a computer in a matter of minutes, I ask the chatbot to brainstorm places that I could go to for lunch. You kids love lunch, right? Recommendation in hand, I traverse the city to a highly recommended Korean-fried-chicken place, only to find that it’s been shuttered for more than nine months, and also that it is now a Turkish-rug shop. I pick up a twenty-dollar grain bowl instead, haul it back to the office, and eat at my desk, alone, even though I’m not actually working but, rather, engaging with the chatbot about a variety of very difficult-to-photograph moles.</p><p>After lunch, I scroll on TikTok until it’s finally caffeine o’clock! After coffee, the day is pretty much over, so I mess around with the chatbot for another three hours, mostly asking it to generate cartoons of me at the beach. Once I’ve got a good enough image to post on Instagram, it’s time to clock out.</p><p>As soon as I get home, having received zero important e-mails in the course of the entire day, Steve asks me to log back in and build a fifteen-page deck on “A.I. and Us.” I spend the next two hours using A.I. to make the deck while my children enjoy several episodes of “Is It Cake?” Sometimes I glance up and play along. Other times, I take a photo of the “cake” and ask the chatbot to guess for us. And that pretty much does it!</p><p>Any questions?</p><p>Do I have a degree? Many!</p><p>Were they expensive to procure? Obscenely!</p><p>Am I satisfied with my level of income? Ha ha. Ha. No.</p><p>What job do I do? It doesn’t matter! They’re all the same now.</p><p>Is there any chance that’s going to improve by the time you enter the work force? . . . Sure.</p><p>Anyway, study hard, kids! But also make sure that what you’re studying is how to live off the land. And remember the most important advice of all: if you’re going to make a long trek for fried chicken, <em>call ahead</em>. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
