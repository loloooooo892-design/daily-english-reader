<script>
var articles = [{"title":"Second Amendment Roundup: The Militia of the Sea","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/12/second-amendment-roundup-the-militia-of-the-sea/","category":"law","categoryLabel":"Law","wordCount":581,"readingTime":3,"content":"<h2><a href=\"https://reason.com/volokh/2026/08/12/second-amendment-roundup-the-militia-of-the-sea/\" target=\"_blank\" rel=\"noopener\">Second Amendment Roundup: The Militia of the Sea</a>\n\t\t\t\t\t<p>The Marque and Reprisal Clause as Textual Proof of Private Heavy-Arms Ownership at the Founding</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t8.12.2026 9:26 PM\n</p>\n\t</h2>\n\t\n\t\t<p>Jonathan Goldstein, Adjunct Professor at University of Pennsylvania Law School, has published a comprehensive analysis of the power of Congress to \"grant letters of marque and reprisal, and make rules concerning captures on land and water,\" U.S. Const., Art. I, § 8, cl. 11.  Historically, this meant that private citizens could possess cannon and ships and could wage war at sea on enemies approved by Congress.</p>\n<p>\"You couldn't buy a cannon when the Second Amendment was passed,\" President Joe Biden <a href=\"https://www.newsweek.com/biden-second-amendment-when-passed-couldnt-buy-cannon-1711480\" target=\"_blank\" rel=\"noopener\">quipped</a> in 2022.  Well, actually you could, and you still can.  Cannon were never restricted until included in the revision of the National Firearms Act in 1968, which taxes and requires registration of \"<a href=\"https://www.law.cornell.edu/uscode/text/26/5845\" target=\"_blank\" rel=\"noopener\">destructive devices</a>,\" defined as weapons that expel a projectile by the action of an explosive or other propellant, the barrel of which has a bore of more than one-half inch in diameter, excluding sporting arms.</p>\n<p>According to <em>Heller</em>, \"the Second Amendment extends, prima facie, to all instruments that constitute bearable arms, even those that were not in existence at the time of the founding.\"  The Marque and Reprisal Clause was adopted in the original Constitution prior to ratification of the Second Amendment, and it has an interesting history of its own.</p>\n<p>For fresh insights into the obscure Marque and Reprisal Clause, see Prof. Goldstein's new article \"<a href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7195398\" target=\"_blank\" rel=\"noopener\">The Militia of the Sea</a>: The Marque and Reprisal Clause as Textual Proof of Private Heavy-Arms Ownership at the Founding.\"  Here's the Abstract:</p>\n<p>Courts and litigants increasingly say the Second Amendment reaches only the weapons one person can carry. The Constitution refutes that twice, in a single Article.</p>\n<p>Article I, § 8, cl. 11 lets Congress \"grant letters of marque and reprisal, and make rules concerning captures on land and water.\" That is a license to send a private citizen to war at sea in his own ship, with his own cannon, for profit. A license presupposes what it licenses. The Clause takes a privately owned, cannon-armed fleet as given; nothing in the Constitution creates it. Two clauses later, Article I, § 10 forbids a state to \"keep troops, or ships of war in time of peace\" without the consent of Congress. The Framers made a sovereign ask permission to keep a warship. They made the shipowner ask no one.</p>\n<p>Under Article I, the only power over private armed force at sea that Congress received was power over the commissioning of that private force on behalf of the United States. Congress did not give permission for the ship owner to arm the ship with cannon. The Founders who ratified the Constitution's Article I in 1788 and the Second Amendment three years later in 1791 did not appear troubled that private parties owned heavily armed ships. Indeed, they took the widespread ownership of such heavily armed ships as a given, so much so that Congress principally concerned itself not with the private ownership of significant armaments, but rather with the transformation of that private ownership into a lawful use on behalf of the federal government itself.</p>\n<p>With textual support from a documented record of roughly 1,700 Revolutionary-era privateering commissions — granted per voyage, in the years before the Constitution was ratified — this Article refutes the modern categorical claim that heavy arms were never \"arms.\"</p>\n\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/08/12/donald-trumps-unsustainable-presidential-administration/\" target=\"_blank\" rel=\"noopener\">NEXT: Donald Trump's Unsustainable Presidential Administration</a>\n    </p>"},{"title":"Instructions for Pet-Sitting My Dog, Cerberus","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/instructions-for-pet-sitting-my-dog-cerberus","category":"fun","categoryLabel":"Interesting Reads","wordCount":820,"readingTime":5,"content":"<p>Thank you again for watching my pooch! I put together these instructions to make sure everything goes smoothly while my fiancée, Sandy, and I spend a long weekend out of town to see if this will work out. Text me if anything comes up. I’ll have my phone on me, which Sandy says is part of the problem.</p><p>My dog, Cerberus (he’s a rescue and came with the name), is a big ol’ boy with a few quirks you should know about. Like, you’ll immediately clock that he has three heads.</p><p>You’ll also notice that his mane is made of snakes, he has the claws of a lion, and his tail is a serpent. This might seem unconventional at first, but you’ll forget all about it when you gaze into his six puppy-dog eyes, which are black and beady, like those of a mangled Teddy bear. If they start flashing, that means he’s angry. Retreat slowly and give him a minute to cool down.</p><p>Despite appearing terrifying, he’s a goofy, loyal fellow. The animal shelter said that his last owner was some odd crank who forced Cerberus to “guard the gates of the Underworld to prevent the dead from leaving,” so it’s just an old habit for him to block the front door. If he’s stationed there, do <em>not</em> order delivery. Cerberus also loves lying down right in front of the Wi-Fi router whenever you need to check the password. (Do <em>not</em> reach around him.)</p><p>Unlike being engaged to someone who doesn’t hesitate to share how little she respects you, Cerberus is nothing to be afraid of. Call me sappy, but I love my fearsome good boy! He may be a mutt with extra parts, a complicated past, and a reptilian tail, but he has one big heart.</p><p>On the fridge is the number for the emergency vet, which you can’t use because they banned Cerberus after he ate a <em>bunch</em> of parrots. You shouldn’t need the vet anyway, as Cerberus has no allergies or medications. We never even bothered to get him vaccinated for rabies because, when he’s bitten people, they’ve perished immediately—hence his “Do Not Pet” harness.</p><p>The morning routine: Cerberus is up at 6:45 <em>A.M.</em> on the dot. He won’t bark or whine—you will simply wake up to him at the side of the bed staring into your soul.</p><p>He gets two scoops of food in the morning and another two scoops at night. Two scoops, that’s it. He’ll wail for a third scoop, which makes sense—one scoop per head, right? But, no. Two. We’re trying to keep him lean!</p><p>Cerberus is easy to walk as long as you stick to his route. No need to learn the way beforehand—he will simply drag you along the dark and wretched path beneath the Earth’s upper crust.</p><p>We suggest taking him out four-ish times a day. Poop bags are on the table by the front door. We do use the prong collar on him. Not that it helps with the pulling. It just makes him look so fucking metal.</p><p>Our neighbors have been littering a bunch, so Cerberus has taken to eating stuff off the street when no one is looking. Be careful scrolling while strolling, because our triple-throated guy loves to use one head for loose chicken-wing bones, another for rogue garbage, and the third to fend off anyone who attempts a physical intervention.</p><p>He needs an hour of play daily. His slab of human flesh is his most prized possession, and lives under the coffee table. He doesn’t always want to engage with it. Sometimes he just wants you to know it’s there. Throw it if he brings it to you. He’ll bring it back at least once before losing interest and carrying it to his bed, where he’ll protect it for the rest of the evening.</p><p>Cerberus is not afraid of thunder and lighting. In fact, lightning and thunder are afraid of him! Enjoy perpetually clear skies and a sense of impending doom while looking after Cerberus.</p><p>If he has an accident on a rug, no worries. There’s a pet-stain remover under the sink, which, of course, does nothing. You think a scented enzyme spray called Nature’s Miracle stands a chance against anything that Nature’s Abomination spews? Paper towels are on the counter.</p><p>Bedtime is 10:30 <em>P.M.</em> Cerberus sleeps in his crate because it reminds him of guarding the cave between the living and the dead. Turn off the lights and act like you’re winding down, and he’ll walk into the crate on his own. In case of emergency, there’s a lyre on the nightstand that lulls him asleep.</p><p>He may randomly bark at the corner of the bedroom at 3 <em>A.M.,</em> because he detects a demonic umbra watching you sleep. That, or he’s gotta pee.</p><p>Remember that Cerberus is all bite and no bark! Sandy and/or I will be back Monday. Text us pictures! ♦</p>"},{"title":"Tech Visionary Says the Big AI Labs Don’t Get What People Want","source":"Wired","author":"@wired","url":"https://www.wired.com/story/tech-visionary-says-the-big-ai-labs-dont-get-what-people-want/","category":"tech","categoryLabel":"Technology","wordCount":1237,"readingTime":7,"content":"<p>Tim O’Reilly’s yardstick for measuring the worth of a company, person, or society has long been <em>create more value than you capture.</em> It’s no surprise that O’Reilly—<a href=\"https://www.oreilly.com/products/superstreams.html?utm_medium=paid+search&amp;utm_source=google&amp;utm_campaign=b2b+search+emea&amp;utm_content=superstreams+emea&amp;gad_source=1&amp;gad_campaignid=23785077000&amp;gbraid=0AAAAADHuAxM-gZpFPX6DvPbUufhag6E2Y&amp;gclid=CjwKCAjw1vXTBhB-EiwAEKr_kybd91zf2V5QNB-p1PI3JowNVKe4x310eT0mVLqHEUnFYS4cumsM_RoConoQAvD_BwE\" target=\"_blank\" rel=\"noopener\">publisher</a>, <a href=\"https://cybercultural.com/p/1993-global-network-navigator/\" target=\"_blank\" rel=\"noopener\">internet pioneer</a>, <a href=\"https://www.linkedin.com/company/o'reilly-alphatech-ventures/home/\" target=\"_blank\" rel=\"noopener\">VC</a>, <a href=\"https://www.oreilly.com/AI-Codecon/\" target=\"_blank\" rel=\"noopener\">conference organizer,</a> and <a href=\"https://www.wired.com/2005/10/oreilly/\" target=\"_blank\" rel=\"noopener\">dispenser of tech wisdom</a>—is applying that metric to the way people design and use AI. Specifically, he’s pushing for a future where <a href=\"https://www.wired.com/story/chinas-open-ai-models-are-challenging-silicon-valleys-playbook/\" target=\"_blank\" rel=\"noopener\">open-source AI</a> is an elixir for the masses. He worries that, like Microsoft in the 1990s, today’s hyperscalers are trying to lock users into their products. So he is promoting efforts to open-source AI technology—not only making critical technical details such as neural-net weights accessible, but unlocking the whole stack of an AI system, giving control to designers and users.</p><p>O’Reilly sees AI as a new creative medium, which he uses extensively—and even <a href=\"https://timoreilly.substack.com/\" target=\"_blank\" rel=\"noopener\">has a blog</a> about his chats with it. During our conversation, we discovered that we disagree about AI’s role in producing original content. Guess who took which side.</p><p><strong>STEVEN LEVY: You are all in on open-source AI. Make your case.</strong></p><p><strong>TIM O'REILLY:</strong> First, let's make sure we're talking about the same thing. When most people talk about open-source AI, they're really just talking about open-weight models. It’s much bigger than that. In the ’90s, when everybody else was focused on open-source licenses, I was like, “No, no, it's about the architecture of the system. Does it enable participation?”</p><p><strong>Why is that needed?</strong></p><p>The big labs are reading the future wrong. They have told themselves a narrative where having the biggest, best model is the key to the future. Big models like Claude are optimizing for particular use cases, but they aren't necessarily the use cases <a href=\"https://www.wired.com/story/why-normal-people-arent-using-ai-agents/\" target=\"_blank\" rel=\"noopener\">that people want</a>. I want to embed my own special sauce. The most important thing is having a clean separation between the model, the <a href=\"https://www.databricks.com/blog/ai-harness\" target=\"_blank\" rel=\"noopener\">harness</a>, and the application. And right now we're not getting that. They built an architecture of control rather than an architecture of freedom and participation, so they have the ability to track you.</p><p><strong>Isn’t it against the interests of big companies to give up control?</strong></p><p>Oh, it's totally against their interests. But that doesn't mean that they're making the right strategic decision. For a long time, the latest and greatest models were really better for everything. Now they’re better for some things and worse for others. People are talking a lot about how <a href=\"https://www.wired.com/story/model-behavior-anthropic-will-charge-consumers-extra-to-use-claude-fable-5/\" target=\"_blank\" rel=\"noopener\">Fable</a> and <a href=\"https://www.wired.com/story/openai-models-escaped-containment-and-hacked-huggingface/\" target=\"_blank\" rel=\"noopener\">Sol</a> are worse writers than the lower-level models. [Note: Anthropic and OpenAI would disagree.] The breakthroughs that we're getting in so-called frontier AI are actually pushing us further away from what ordinary people are going to need. We could win frontier AI here in the US, and China will kick our ass because they have lower-level models diffused widely through society. The goal is to give people the ability to innovate freely, to paint outside the lines.</p><p><strong>People worry that open-source software can be a security risk, since bad actors will be able to jump the frontier model’s guardrails.</strong></p><p>All of the cybersecurity incidents we’ve seen are <a href=\"https://www.wired.com/story/ok-well-there-are-even-more-ai-agent-hacking-incidents/\" target=\"_blank\" rel=\"noopener\">from the frontier models</a>. So risks like cybersecurity and the ability to develop pathogens are actually an argument for slowing down the frontier models more than an argument for restricting open-weight models.</p><p><strong>So you feel that with open source the AI powers will no longer be dominant?</strong></p><p>I don't predict the future. but I will say the world is proceeding the way that I hoped it would. What if the big frontier models end up like mainframes or supercomputers—aimed at really hard problems, which are not actually the thing that gets diffused throughout society? People are building things like <a href=\"https://pi.dev/\" target=\"_blank\" rel=\"noopener\">Pi</a>, an open-source [agentic] harness. One of the things we're working on at my nonprofit, the <a href=\"https://ai-disclosures.org/\" target=\"_blank\" rel=\"noopener\">AI Disclosures Project</a>, is the idea of an open-memory consortium. Mark Zuckerberg’s thesis is, he’s going to lock you in because Meta will give you the AI that knows you best. The open-source vision needs to say no to this. Open source can give you the ability to switch models, switch providers, and maintain all the context that it needs.</p><p><strong>You recently wrote <a href=\"https://www.economist.com/by-invitation/2026/07/12/elon-musk-is-building-a-form-of-capitalism-that-adam-smith-would-loathe\" target=\"_blank\" rel=\"noopener\">a piece in the Economist</a> about how Elon Musk—as well as other tech leaders—have so much power in their companies that they are anti-capitalist, in the sense that their desires, rather than the marketplace, determine strategy.</strong></p><p>In general, Silicon Valley has become anti-capitalist. They use the language of markets. But around 2010, the whole model came into play with Uber and Lyft. Funded by VCs, they literally spent billions of dollars to subsidize rides. The venture capitalists picked the winner rather than the market. That became the template. All the capital piles on and chokes out other possible paths.</p><p><strong>In AI, all the money is funneling into a few companies, but none seem to have a lock.</strong></p><p>Because it's a failed model. The real action is open source. Just like in the early 1990s, when everybody thought it was all a battle for who ruled the PC, and then the web came out of left field while nobody was paying attention. I think that the real AI future will be a ferment of innovation that's not being funded by venture capital—in the same way that the web wasn't funded by VCs.</p><p><strong>One of those disruptions might be your own company, built on books and writing.</strong></p><p>The book business has been in decline for 25 years. At our peak, our book business was maybe $70 million, and it's now $30 million. As books generated less revenue, we had to find a way to compensate people for sharing their knowledge, because that's our fundamental business. So now AI comes along and hoovers everything up. Can we build a set of tools that help people with that? Being able to invoke the knowledge of experts is a superpower, and we have to figure out what that looks like now.</p><p><strong>When I edit this interview I will boil down our long conversation to a shorter one, but I won’t use AI to do it. And of course, the writing in the introduction will be all mine. It’s actually our policy.</strong></p><p>I think that's a legacy thing that's going to go. My ability to have a thought partner in AI when I'm writing is very powerful.</p><p><strong>AI does your writing for you?</strong></p><p>No, no. I use it for brainstorming, and sort of just functional writing. When I interview somebody for an hour, I go to AI and say, “Turn it into something I can use.” I don't have the time to write up all those interviews.</p><p><strong>Aren’t you worried that AI will eventually supplant human writing?</strong></p><p>AI is literally a medium, in the same way that written words are a medium, or paint or music is a medium. When I talk to an AI or design art with it, I get something different out of it than you do, in the same way that Michelangelo and Van Gogh got completely different things out of paint. The idea that you can't write with AI will seem as curious as the idea that you can't make a good portrait or landscape with a camera. There will be people who are masters at expressing their ideas by summoning words from LLMs. People used to ride horses. Now, few do. We're in the early days.</p><p><em>This is an edition of</em> <a href=\"https://www.wired.com/author/steven-levy/\" target=\"_blank\" rel=\"noopener\"><em><strong>Steven Levy’s</strong></em></a> <em><a href=\"https://www.wired.com/newsletter?sourceCode=editarticle\" target=\"_blank\" rel=\"noopener\"><strong>Backchannel newsletter</strong></a>. Read previous newsletters</em> <a href=\"https://www.wired.com/tag/backchannel-nl/\" target=\"_blank\" rel=\"noopener\"><em><strong>here.</strong></em></a></p>"},{"title":"Underwater housing, major quality of life improvements, and sweeping fixes: Pokémon Pokopia's free 2.0 update  is here alongside paid DLC, and it's making a splash","source":"Eurogamer","author":"Connor Makar","url":"https://www.eurogamer.net/pokemon-pokopia-version-bubbly-basin-patch-notes","category":"gaming","categoryLabel":"Gaming","wordCount":1437,"readingTime":8,"content":"<p>Diving in.</p>\n    \n  \n  \n  \n  \n            <p><a href=\"https://www.eurogamer.net/pokemon-pokopia-walkthrough\" target=\"_blank\" rel=\"noopener\">Pokémon Pokopia'</a>s 2.0 major update is here, allowing players to venture deep below the waves to meet new Poké-pals and mess around with a variety of new features.</p>\n<p>A full list of features and fixes has been released with the release of this major update. Major new additions include the ability to dive below the water, build houses in these new oceanic biomes, and a vast amount of customisation options such as new hair colours and a new pattern.</p>\n\n<p>Quality of life fixes have also been added with this free update. A new function to move items in bulk between the storage box and bag, the ability to delete items placed inside objects like garbage bins, and improved tools to allow for fine-tuning depth placement for windows, doors, and similar items. These should all make the act of building and managing in the game much easier.</p><p>There are also a lot of gameplay improvements added with the 2.0 update. Lost Relics can be appraised in batches of ten at a time, Rollout can now destroy certain items in the environment when used, and Strength can now be used underwater.</p>\n<p>All these changes and fixes - which you can read in full below - come to a version of the game expanded with <a href=\"https://www.eurogamer.net/all-new-pokemon-pokopia-bubbly-basin-dlc#section-2\" target=\"_blank\" rel=\"noopener\">a variety of new water-type Pokémon</a> you can interact with. <a href=\"https://www.eurogamer.net/pokemon-pokopia-bubbly-basin-walkthrough\" target=\"_blank\" rel=\"noopener\">Bubbly Basin itself has a host of new mysteries to uncover</a>, which these new features and fixes should go a long way in streamlining. If you need a hand seeing all the Pokémon in the game, <a href=\"https://www.eurogamer.net/pokemon-pokopia-pokedex\" target=\"_blank\" rel=\"noopener\">Eurogamer's full Pokopia Pokédex</a> should be a massive help. If you want a peek at <a href=\"https://www.eurogamer.net/pokemon-pokopia-200-patch-notes\" target=\"_blank\" rel=\"noopener\">our favourite parts of the version 2.0 patch notes</a>, we've got that sorted for you too!</p>\n<p>Here's the full patch notes for <a href=\"https://www.eurogamer.net/games/pokemon-pokopia\" target=\"_blank\" rel=\"noopener\">Pokémon Pokopia</a> version 2.0:</p>\n<p>New features</p>\n<ul>\n<li>Added the move Dive, allowing players to move freely underwater.</li>\n<li>The Build specialty can now be used to build houses underwater.</li>\n<li>Added new items such as the portal pod and safe.</li>\n<li>Recipes can be purchased after increasing Palette Town’s environment level.</li>\n<li>Added the new pattern, dynamic Ditto print.</li>\n<li>Can be obtained by talking to Smearguru after acquiring the diploma.</li>\n<li>Added new emotes: Lie Down and Ready, Set, Go!</li>\n<li>Can be obtained in Bleak Beach and on Dream Islands.</li>\n<li>Added five new hair colors: orange, light pink, yellow-green, blue-green, and brown.</li>\n<li>Added a function to move items in bulk between the storage box and bag.</li>\n<li>Added a function to delete items placed inside objects such as the garbage bin.</li>\n<li>Added the ability to fine-tune depth placement when placing windows, doors, and similar items.</li>\n<li>Added an option in Settings to hide the confirmation message shown when canceling Magnet Rise.</li>\n<li>Added an option in Settings allowing movement while the move wheel is open.</li>\n<li>Added motion-sickness reduction settings for the camera.</li>\n<li>The following items can now be painted: stylish stool, handrail, metal chain, workbench, vending machine, bike, bookcase, Pokémon Center counter, arrow sign, rope.</li>\n</ul>\n<p>New improvements</p>\n<ul>\n<li>Even if a Pokémon’s habitat is destroyed, it will move back in if the same habitat is rebuilt within a certain area.</li>\n<li>Pokémon that are sad because furniture was removed will now notice more quickly when the same furniture is replaced.</li>\n<li>Pokémon that taught you an emote will now respond with the same emote when you use it.</li>\n<li>If a Pokémon being searched for in the Pokédex is in another town, you can now travel to that town using Return Home.</li>\n<li>Reduced ordinary conversation indicators so that special Pokémon conversations and requests directed at Ditto stand out more clearly.</li>\n<li>Lost relics can now be appraised in batches of up to 10 at a time.</li>\n<li>Paint, Gather Honey, and Collect can now be performed multiple times in the same interaction.</li>\n<li>During crafting, materials in the storage box next to the workbench will be consumed before materials in the bag.</li>\n<li>Increased the placement limit for power generators (excluding furnaces) from 64 to 128.</li>\n<li>Increased the number of different photos that can be displayed in a town from 10 to 40.</li>\n<li>When sucking up liquid, a short press of the move button to hold liquids in Ditto’s mouth will allow liquid to be held in their mouth without removing it from the environment.</li>\n<li>When releasing stored water, adjusted water levels now automatically match nearby water levels.</li>\n<li>Smearguru can now learn patterns from photos stored in References.</li>\n<li>Improved visibility of the target item when painting with paint balloons.</li>\n<li>Increased the amount of treasure discoverable with the Dowsing Machine on Dream Islands.</li>\n<li>Pokémon companions can now follow you while moving with Surf, Glide, Rollout, or Magnet Rise.</li>\n<li>Inhaling items and opening the bag are now possible while rolling using Rollout.</li>\n<li>Rollout can now destroy certain natural objects such as large boulders.</li>\n<li>Surf can now be activated on land by pressing the Surf button while holding the focus button.</li>\n<li>Improved activation conditions for Surf and Waterfall so they occur more smoothly.</li>\n<li>Leafage can now be used on farm soil to revert it to a normal soil block.</li>\n<li>Strength can now be used underwater.</li>\n<li>Added an All tab to both the Pokédex and Habitat Dex.</li>\n<li>Made it clearer that buildings can still be remodeled even when items such as the Ditto Flag are attached to roofs or walls.</li>\n<li>During construction, any Pokémon not assigned to the Build role in a building project can now help with cooking.</li>\n<li>Prevented treasures in Sparkling Skylands from appearing when using the Dowsing Machine in locations where breaking terrain would cause them to fall.</li>\n<li>Improved messaging when there are insufficient materials for copying items using the 3D Printer.</li>\n<li>Items can now be placed on top of square plants.</li>\n<li>Hide-and-sneak can now be canceled midway.</li>\n<li>Adjusted in-game event notifications shown at startup so they are displayed only during specific remaining-day periods.</li>\n<li>Certain roof items now block water.</li>\n<li>Increased output when crafting curved eaves to 10.</li>\n<li>Tidal Bell and Clear Bell can now be triggered using laser sensors and switches.</li>\n<li>Adjusted sound effects for camping chair and sleeping bag.</li>\n<li>Improved performance for certain rendering processes.</li>\n</ul>\n<p>Fixed issues</p>\n<ul>\n<li>When talking to a Pokémon that is currently assigned to construct buildings, options such as “Follow me!” may sometimes fail to appear.</li>\n<li>Suicune and Gholdengo may be unable to travel across water.</li>\n<li>Pokémon may occasionally fall into the ocean or off cliffs when appearing from their habitats.</li>\n<li>Even when using honey, Pokémon may sometimes fail to return to their habitats.</li>\n<li>Using Magnet Rise may occasionally cause Pokémon to scold or warn the player.</li>\n<li>Pokémon that dislike water may sometimes be unable to move across duckweed and flowering duckweed on the water’s surface.</li>\n<li>Requests from Pokémon may occasionally ask for items that the requesting Pokémon actually dislikes.</li>\n<li>When processing berries in the community box, paint may not be produced correctly.</li>\n<li>The timing of the note played by the music mat (high Do) is offset incorrectly.</li>\n<li>Certain furniture can be painted through specific procedures even on parts where the colors are not actually changeable.</li>\n<li>Painting certain items may use more paint than intended.</li>\n<li>The light color of a painted surface light may fail to change correctly.</li>\n<li>Under specific conditions, it is possible to place more than one party cooking pot in the same town.</li>\n<li>Some items may display unnaturally when viewed from a distance.</li>\n<li>For some items, visual effects may disappear when viewed through glass.</li>\n<li>Under certain conditions during multiplayer, building may become impossible to complete or cancel.</li>\n<li>In certain situations, it may be unclear why actions such as building or relocation cannot be performed.</li>\n<li>On Cloud Islands, players other than the administrator may be able to place a relocation kit.</li>\n<li>Under certain conditions, a building kit may become unrecoverable when remodeling a house.</li>\n<li>Under certain conditions, painted portions of the sand house may be reset.</li>\n<li>Using Rock Smash while falling may cause Ditto’s position or height to become significantly displaced.</li>\n<li>During the Withered Wasteland request “Clear the path!” Slowpoke may stop moving partway through.</li>\n<li>During the Sparkling Skylands request “Follow Tinkmaster!” certain actions may prevent the request from progressing.</li>\n<li>During the Sparkling Skylands request “Pokémon Center tour guide!” searching for Tinkmaster in the Pokédex may guide the player to the town containing their habitat rather than the town where they are currently located.</li>\n<li>Loading may occasionally fail to finish when returning from a Dream Island.</li>\n<li>Returning from a Dream Island may incorrectly send the player to Palette Town.</li>\n<li>Under certain conditions when an online session ends, the player may be transported to a Dream Island.</li>\n<li>On the Cloud Island loading screen, the player’s gender pronoun may sometimes be displayed incorrectly in some languages.</li>\n</ul>\n        \n      \n  \n        \n      <p>Mentioned in this article</p>"}];

  var hasMore = articles.length > 1;

  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;

    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();

}

function skipArticle() {
  if (articles.length <= 1) return;

  render();
}

function esc(s) {

}
