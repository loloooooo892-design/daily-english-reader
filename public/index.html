*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {

  background: var(--bg);

  letter-spacing: 0.01em;
}

}

}

.swap-counter {

}

}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {

  padding-left: 1.25em;

  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;

.footer a:hover {
  text-decoration: underline;

.archive-link {

.archive-link a {

.archive-link a:hover {

@media (max-width: 480px) {

<script>
var articles = [{"title":"UN warns of rising food prices due to climate change and energy price hikes","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/08/un-warns-of-rising-food-prices-due-to-climate-change-and-energy-price-hikes/","category":"law","categoryLabel":"Law","wordCount":508,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/08/un-warns-of-rising-food-prices-due-to-climate-change-and-energy-price-hikes/#\" target=\"_blank\" rel=\"noopener\">UN warns of rising food prices due to climate change and energy price hikes</a>\n</strong><p>The United Nations <a href=\"https://news.un.org/en/story/2026/08/1168096\" target=\"_blank\" rel=\"noopener\">reported </a> on Friday that the cost of key foods increased in July as a result of searing heatwaves and ongoing geopolitical instability, which have affected global energy prices amid persistent hunger risks in multiple countries.</p><p>According to the UN Food and Agriculture Organisation (FAO), the Food Price Index (FPI) <a href=\"https://www.fao.org/worldfoodsituation/foodpricesindex/en/\" target=\"_blank\" rel=\"noopener\">averaged </a> 131.1 points in July 2026, representing an increase of one percent in the cost of  a basket of staple foods compared to 2025, with millions of people experiencing hunger and food insecurity despite slight improvements in harvests. This situation is attributed to recurrent <a href=\"https://www.jurist.org/news/2026/08/amnesty-international-calls-global-extreme-heat-a-human-rights-emergency/\" target=\"_blank\" rel=\"noopener\">heatwaves</a>, described as a global human rights emergency; the effects of <a href=\"https://wmo.int/news/media-centre/strong-el-nino-expected-intensify\" target=\"_blank\" rel=\"noopener\">El Niño</a> on harvests; and growing <a href=\"https://www.jurist.org/news/2026/03/un-climate-chief-promotes-renewable-energy-amidst-oil-price-crisis/\" target=\"_blank\" rel=\"noopener\">uncertainty</a> resulting from geopolitical tensions, which have not only resulted in an oil crisis but also disrupted global supply chains.</p><p>The FAO added that increases in price indices included those of cereals, sugar and vegetable oils, while price indices for meat and dairy products declined. The organization detailed that the cereal price index surged by 3.4 percent from June, reversing the declines seen in 2025. Additionally, global wheat prices rose by 5.8 percent due to persistent <a href=\"https://www.ifpri.org/blog/tensions-in-the-black-sea-and-regional-droughts-spark-rising-global-wheat-prices/\" target=\"_blank\" rel=\"noopener\">disruptions </a>to Black Sea exports, which are linked to both the impact of heatwaves on crop yields as well as the war between Ukraine and Russia.</p><p>The FAO also noted the the vegetable oil price index reached its highest price since 2022, which is linked to demand from Indonesia’s biodiesel sector and higher crude oil prices.</p><p>Furthermore, the UN highlighted that although some progress in reducing hunger levels has been seen in countries such as Malawi, nearly 1.9 million people still live in crisis levels of acute food insecurity, classified as Phase 3 under the <a href=\"https://www.wfp.org/stories/5-steps-food-security-famine\" target=\"_blank\" rel=\"noopener\">Integrated Food Security Phase Classification (IPC)</a>.</p><p>Finally, experts raised concerns about the future developments of global food prices given the existence of numerous factors that are expected to exacerbate the situation, including inflation, below-average staple production, and forecasts of El Niño effects during the 2026-2027 rainy season.</p><p>Many nations worldwide—from <a href=\"https://www.jurist.org/news/2026/07/rights-group-warns-of-increasing-food-insecurity-in-afghanistan/\" target=\"_blank\" rel=\"noopener\">Afghanistan</a> to <a href=\"https://www.jurist.org/news/2026/07/un-djibouti-faces-severe-food-insecurity/\" target=\"_blank\" rel=\"noopener\">Djibouti</a> to <a href=\"https://www.jurist.org/news/2026/06/climate-change-threatens-livelihoods-in-honduras-rights-group-warns/\" target=\"_blank\" rel=\"noopener\">Honduras</a>—are experiencing <a href=\"https://www.jurist.org/news/2026/07/un-agencies-warn-that-conflicts-and-climate-change-threaten-progress-against-global-hunger/\" target=\"_blank\" rel=\"noopener\">food insecurity</a> due to two main factors, identified as <a href=\"https://www.jurist.org/news/2026/03/world-food-programme-warns-of-mass-food-insecurity-if-middle-east-conflict-continues/\" target=\"_blank\" rel=\"noopener\">armed conflicts</a> and climate change, placing the lives of millions of people at risk. In June, the UN <a href=\"https://www.jurist.org/news/2026/06/un-warns-rapidly-changing-ocean-putting-future-of-humanity-at-risk/\" target=\"_blank\" rel=\"noopener\">warned </a> that the rapidly deteriorating health of the ocean poses threats to human health and well-being due to its impacts on biodiversity and food security.</p><p>There has been a growing concern about the environmental <a href=\"https://www.jurist.org/news/2026/06/un-calls-for-ai-regulation-amidst-expanding-environmental-footprint-by-daily-use/\" target=\"_blank\" rel=\"noopener\">impacts </a> of the daily use of Artificial Intelligence (AI) technologies, given massive energy and water demands by data centers in a world already struggling with water scarcity as well as the environmental <a href=\"https://www.jurist.org/news/2026/04/rights-group-backs-those-affected-by-contaminated-zambia-mining-site/\" target=\"_blank\" rel=\"noopener\">consequences </a> of extractive activities.</p><p>Despite the <a href=\"https://www.jurist.org/news/2026/05/un-experts-welcome-general-assembly-resolution-affirming-state-obligations-to-combat-climate-change/\" target=\"_blank\" rel=\"noopener\">adoption </a> of a UN resolution confirming member states’ obligations to combat climate change, there have been increasing calls for accountability of all entities involved in environmental crimes. Last month, a South American multinational law enforcement campaign <a href=\"https://www.jurist.org/news/2026/08/five-south-american-nations-arrest-hundreds-and-seize-illicit-assets-in-landmark-amazon-rainforest-crackdown/\" target=\"_blank\" rel=\"noopener\">resulted </a>in hundreds of arrests and the seizure of illicit assets in minerals and livestock.</p>"},{"title":"'Thank you so much for the best weekend ever': The id Software gang got together at QuakeCon, and it sure looks like everyone had a great time","source":"PC Gamer","author":"Andy Chalk","url":"https://www.pcgamer.com/games/thank-you-so-much-for-the-best-weekend-ever-the-id-software-gang-got-together-at-quakecon-and-it-sure-looks-like-everyone-had-a-great-time/","category":"gaming","categoryLabel":"Gaming","wordCount":628,"readingTime":4,"content":"<p>The recently concluded QuakeCon was a big one, marking the 30th anniversary of the game that started it all and, more notably, bringing id Software co-founders Adrian Carmack, John Carmack, Tom Hall, and John Romero together for the first time in a very long time.</p><p>I had wondered, in the lead-up to the event, if it might get a little awkward or uncomfortable: Differences between the Johns were \"<a href=\"https://www.pcgamer.com/john-romero-and-john-carmack-are-still-buds-and-theyre-going-to-prove-it-by-teaming-up-for-a-livestream-celebrating-dooms-30th-anniversary/\" target=\"_blank\" rel=\"noopener\">over-dramatized</a>\" over the years, according to Romero Games co-founder Brenda Romero, but Adrian Carmack filed a lawsuit over his removal from the studio back in 2005, and other internal conflicts over the years led to the dismissal of well-liked employees like American McGee and Paul Steed. The more recent layoffs of Xbox that left the studio in varying states of \"<a href=\"https://www.pcgamer.com/gaming-industry/dev-at-id-software-says-microsoft-burned-a-lot-of-bridges-in-the-industry-they-fundamentally-dont-understand-art-they-dont-understand-games/\" target=\"_blank\" rel=\"noopener\">gutted</a>,\" depending on who you ask, also threatened to overshadow the whole thing.</p><p>So, you know: <em>you wonder</em>.</p><p>Now that everything is wrapped up, I'm happy to report that if there was any awkwardness or discomfort between the studio's famed founders, everyone kept it to themselves and they all seemed to have a really good time. \"QuakeCon was fantastic this year, especially reuniting with the original founders!\" John Carmack wrote on X.</p><p>Adrian Carmack, who I will note for the record (again) is no relation, shared the post and added his own enthusiasm for the moment. \"This was one of the best times of my life. Truly. I haven’t seen John Carmack in 20 years. I was so damn excited and it surpassed my expectations. We haven’t all been together since 94. Damn.\"</p><p>Tom Hall reposted a clip of himself and the Johns looking at an archive of old Doom design notes, calling the experience \"amazing.\"</p><p>Romero Games shared a photo on Bluesky accompanied by a lovely message: \"Thank you so much for the best weekend ever.\"</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><blockquote><p>Thank you so much for the best weekend ever. ❤️</p>— @romerogames.bsky.social (<a href=\"https://bsky.app/profile/did:plc:cxumluk6uferxhndrp5wugky?ref_src=embed\" target=\"_blank\" rel=\"noopener\">@romerogames.bsky.social.bsky.social</a>) <a href=\"https://bsky.app/profile/romerogames.bsky.social/post/3msmpn4cmwk23\" target=\"_blank\" rel=\"noopener\">2026-08-10T20:05:06.492Z</a></blockquote><p>In a particularly nice touch, Donna Jackson—the famous \"id mom\"—showed up for the reunion. Jackson was hired in January 1994 to assist with office and business management, and as far as I know she's still there: She's <a href=\"https://www.mobygames.com/person/38103/donna-jackson/credits/\" target=\"_blank\" rel=\"noopener\">credited</a> as \"Office manager and id mom\" in the studio's most recent release, Doom: The Dark Ages.</p><p>And American McGee, who was fired in 1998 under somewhat murky circumstances, shared some warm thoughts of his own, crediting Carmack and Romero for transforming his life \"beyond imagination.\"</p><p>It's nice, isn't it? There's a lot going on with the videogame industry right now, and the world as a whole, and sometimes it's good to be reminded that not everything inevitably has to suck. For as small and simple a thing as it is, this reunion, with all four of id Software's founders so clearly happy to see each other and hang out for a bit, is just goddamn <em>nice</em>, and frankly I'm happy for all of us that we got it.</p>\n\n<p>Andy has been gaming on PCs from the very beginning, starting as a youngster with text adventures and primitive action games on a cassette-based TRS80. From there he graduated to the glory days of Sierra Online adventures and Microprose sims, ran a local BBS, learned how to build PCs, and developed a longstanding love of RPGs, immersive sims, and shooters. He began writing videogame news in 2007 for The Escapist and somehow managed to avoid getting fired until 2014, when he joined the storied ranks of PC Gamer. He covers all aspects of the industry, from new game announcements and patch notes to legal disputes, Twitch beefs, esports, and Henry Cavill. Lots of Henry Cavill.</p>"},{"title":"The 7 Best TV Shows to Stream This Month","source":"Wired","author":"@wired","url":"https://www.wired.com/story/the-7-best-shows-to-stream-right-now/","category":"tech","categoryLabel":"Technology","wordCount":1014,"readingTime":6,"content":"<p>The big screen is having a moment. <a href=\"https://www.wired.com/story/spider-man-brand-new-day-is-a-superhero-movie-for-yearners/\" target=\"_blank\" rel=\"noopener\"><em>Spider-Man: Brand New Day</em></a> is breaking box office records, while Christopher Nolan’s <a href=\"https://www.wired.com/story/the-odysseys-success-is-inspiring-unprecedented-levels-of-cope/\" target=\"_blank\" rel=\"noopener\"><em>The Odyssey</em></a> has people <a href=\"https://www.wired.com/story/the-new-odyssey-movie-is-sparking-a-right-wing-backlash-this-female-scholar-knows-it-well/\" target=\"_blank\" rel=\"noopener\">dusting off Homer</a> for the first time since high school. But <a href=\"https://www.wired.com/category/culture/tv/\" target=\"_blank\" rel=\"noopener\">television</a> is keeping pace with a slate of can’t-miss new releases and beloved old favorites that are worth revisiting.</p><p>While plenty of outlets will tell you what everyone is watching (see: <em>Ted Lasso</em>), that’s not our goal. As always, the TV shows we’re watching this month reflect the kinds of stories WIRED covers every day—shows that explore technology, <a href=\"https://www.wired.com/category/science/\" target=\"_blank\" rel=\"noopener\">science</a>, <a href=\"https://www.wired.com/category/politics/\" target=\"_blank\" rel=\"noopener\">politics</a>, <a href=\"https://www.wired.com/category/culture/\" target=\"_blank\" rel=\"noopener\">culture</a>, and the sometimes unsettling ways they intersect.</p><p>From prestige dramas to absurd comedies and one truly groundbreaking sci-fi series, these are the TV shows we think are worth making time for this month.</p><h2><em>Star Trek: The Original Series</em></h2><p>On September 8, 1966, science fiction changed forever with the premiere of the original <em>Star Trek</em> TV series. In the 60 years since, Gene Roddenberry’s ahead-of-its-time tale of the USS Enterprise crew’s journeys into deep space has spawned dozens of films, TV series, and video games, plus hundreds of books and comics—not to mention a number of <a href=\"https://www.wired.com/story/the-star-trek-communicator-is-now-a-high-end-wristwatch/\" target=\"_blank\" rel=\"noopener\">real-world tech innovations</a>. The legendary series has also shaped pop culture in countless other ways, giving us everything from Vulcan salutes and Klingons to the Prime Directive and the immortal command to “beam me up.”</p><p>Whether you’re a lifelong Trekkie or a curious newcomer, there’s never been a better time to see where one of television’s most influential franchises began. Though it ran for just three seasons, <em>Star Trek: The Original Series</em> left an outsized legacy, breaking barriers with one of television’s first interracial kisses, featuring a remarkably diverse cast at the height of the Civil Rights Movement, and inspiring generations of scientists, engineers, and storytellers to imagine a more optimistic future. Sixty years later, its blend of adventure, social commentary, and boundless curiosity remains as compelling as ever. Best of all, <a href=\"https://www.paramountplus.com/collections/star-trek/\" target=\"_blank\" rel=\"noopener\">Paramount+ is home to nearly every corner of the Star Trek universe</a>, from the beautifully remastered original series to its many spinoffs and feature films. If you’re celebrating the franchise’s 60th anniversary, there’s no better place to boldly go back to where it all began.</p><h2><em>Futurama</em></h2><p>Following a decade-long hiatus, <em>Futurama</em> made a triumphant comeback in 2023, complete with gags about <em>The Twilight Zone</em> and “Momazon” drone deliveries. Created by Matt Groening and David X. Cohen, the animated sci-fi comedy is set in the 31st century and follows the employees of the Planet Express delivery company as they stumble through bizarre adventures, alien encounters, and laugh-out-loud takes on everything from AI to corporate greed.</p><p>On August 3, the series kicked off its 14th season, which delivers more of the razor-sharp tech satire and surprisingly thoughtful science that have long made it one of television’s smartest comedies.</p><h2><em>President Curtis</em></h2><p>This summer is a particularly ripe moment for fans of irreverent animated sci-fi, as it also brings <em>President Curtis</em>, a new spinoff set in the <em>Rick and Morty</em> universe. While <em>Futurama</em> looks ahead at the possibilities—and absurdities—of the distant future, <em>President Curtis</em> takes a stranger route, following President Andre Curtis (voiced by Emmy-winning baritone Keith David) and his eccentric staff as they navigate inter-dimensional diplomacy, paranormal investigations, and other bizarre crises. The 10-episode series, which premiered on July 26, airs new episodes each Sunday night on Adult Swim, which then drop on HBO Max on Monday.</p><h2><em>Lanterns</em></h2><p>DC is taking its Green Lanterns in a decidedly darker direction with <em>Lanterns</em>, a new series that trades traditional superhero spectacle for a cosmic murder mystery. Starring Kyle Chandler as Hal Jordan and Aaron Pierre as John Stewart, the series follows the two Lanterns as they investigate a mystery that stretches across Earth and beyond.</p><p>With <em>Lost</em> cocreator Damon Lindelof, <em>True Detective</em> producer Chris Mundy, and comic book writer Tom King behind the series, <em>Lanterns</em>—which arrives on August 16—brings a noir-inspired edge to one of DC’s most iconic franchises.</p><h2><em>The Idaho Murders: College Nightmare</em></h2><p>In the early morning hours of November 13, 2022, the city of Moscow, Idaho, changed forever when four University of Idaho students were killed in their off-campus home. The investigation that followed captivated the nation, as authorities worked to piece together what happened and identify a suspect in a horrifying quadruple murder that appeared to have no clear motive.</p><p><em>The Idaho Murders: College Nightmare</em> chronicles the investigation through access to victims’ friends and families and police footage, while examining how digital evidence and forensic technology helped investigators unravel one of the most closely watched true crime cases in recent years.</p><h2><em>Dark Matter</em></h2><p>What if the life you’re living isn’t the one you were meant to have? That’s the question at the heart of <em>Dark Matter</em>, the sci-fi thriller based on Blake Crouch’s best-selling novel. Season one followed physicist Jason Dessen (Joel Edgerton), who is pulled into an alternate version of his life after being transported to a parallel reality.</p><p>Season two, which premieres on August 28, picks up with Dessen and his family attempting to build a quiet existence in a world that finally feels safe … until new threats force them back into the multiverse with the help of a mysterious device known as the Box. As the search for the Box continues, the series dives deeper into questions of identity, choice, and the endless possibilities of the paths we could have taken.</p><h2><em>The Undeclared War</em></h2><p>Four years after its debut, <em>The Undeclared War</em> is back with a chillingly timely premise: a cyberattack targeting a nation’s election system. The British thriller returns to the shadowy world of GCHQ (the UK’s intelligence, security, and cyber agency), where analysts battle digital threats that could have devastating real-world consequences.</p><p>Set in a post-pandemic 2024, the series follows a team of analysts racing to defend the country’s digital infrastructure as tensions with Russia escalate. With <em>Shaun of the Dead</em> star Simon Pegg starring as operations chief Danny Patrick, the new season, which arrives on August 27, explores how cyberwarfare has transformed the nature of modern espionage.</p>"},{"title":"Letters from Our Readers","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/08/17/letters-from-the-august-17-2026-issue","category":"fun","categoryLabel":"Interesting Reads","wordCount":940,"readingTime":5,"content":"<h2>Call Her by Her Name</h2><p>In the beginning was the Word, and the Word was wrong. I was startled to find in Melanie Thernstrom’s profile of the concierge gynecologist Sally Greenwald—which extolls the joys, and pricey maintenance, of female-oligarch orgasms—just how far we have not come (“Billionaires’ Vagina Club,” July 6th &amp; 13th). Here, yet again, one of the few remaining publications of note reinforces, via repetition, the diminishment of female sexual anatomy by misidentifying it in both title and text.</p><p>The vagina is merely one of the many moving parts—mons pubis, labia majora and minora, clitoris, cervix, uterus, fallopian tubes, ovaries, numerous glands, endless nerves, and, yes, the adjoining vagina—that compose the vulva and her internal sisters. How would it fly if we all, including social-media influencers and other cultural leaders, conspired to call the penis the perineum? Or maybe the prostate? Oops! Wrong landmark; right neighborhood. So how did “vagina,” the nom du jour for decades now (with ten appearances in the piece, four of them incorrect, three of those introduced by the good doctor herself), come to represent the entire site? And, more interestingly, why?</p><p>When will we women stop our filial collaboration with Papa Freud in his denunciation of our sexual core—it is the wretched, much lost and found clitoris of which I speak—and refuse to repudiate our own central charge? We expect it of men, whose biology dictates their prime interest in the mostly insensate tube of the vagina, but when will we cease our complicity in the patriarchy and stop skirting ourselves?</p><p><em>Toni Bentley</em><em>Los Angeles, Calif.</em></p><h2>Reality Check</h2><p>Nikhil Krishnan’s review of “How to Kill a Language,” by Sophia Smith Galer, errs in the same way that the book does, when it treats as literal the “death” of language which, unlike that of the giant panda, is entirely metaphoric (Books, July 27th). The death of a language is like that of square dancing, or of doing algebra by pencil and paper, and mistaking metaphor for reality is one of the surest routes to woolly thinking.</p><p>Language, as Krishnan highlights at the top of the piece, is, first and foremost, a means of communication. So long as effective communication persists, the reflex to mourn the disuse of a language can be motivated only by something else—nostalgia or, perhaps, the loss of a group’s ability to easily demarcate itself. Krishnan rightly points out that actively suppressing language ought to be condemned, but that suppression and obsolescence are wholly different. No reasonable person would forbid the speaking or learning of any language, but surely no reasonable person should compel it if the only use of a language is its further teaching or translation.</p><p>The Bible is widely read and loved in spite of the fact that most people don’t speak any of the languages in which it was originally written. “The Odyssey” is one of the blockbusters of the year even though the language in which the story first appeared is long dead. The reanimation of Hebrew in Israel was less about preserving the language than about choosing a common tongue, one that wouldn’t favor one group of Jewish people over another. If Smith Galer wants to speak Emilian, no one is standing in her way. But to refer to the fact that few people seem to want to speak it as “killing” it, well, that’s killing language by misuse.</p><p><em>Kurt Tidmore</em><em>Carrigaline, Ireland</em></p><h2>Profane and Profound</h2><p>Louis Menand, in his examination of Andres Serrano’s “Piss Christ,” contends that the outrage the photograph elicited among American Christians in the nineteen-eighties was the opening salvo in the culture wars that rage to this day (Books, July 20th). I was not old enough to participate in the early debates, but speaking today, as a Christian minister, I would like to convince my fellow-believers that this indignation misses something fundamental about the central symbol of our faith. Indeed, Serrano’s image is, to me, comparable to an icon, worthy of sincere contemplation.</p><p>The cross represents the most sadistic and extreme form of mockery and humiliation, so if one considers dipping something in urine to be profane, doing this with the crucifix is actually redundant. The cross did much worse to the one whom Christians believe to be the human incarnation of God, yet Jesus’ followers believed that his very crucifixion was the key to unlocking the revelation of God’s grace. In the New Testament, Paul called the idea of a crucified Saviour “a scandal.”</p><p>But centuries of casual display has domesticated the image of the cross. For this reason, Serrano’s work, with its uncannily beatific admixture of the sacred and the profane, recovers something of the original impact of Paul’s scandalous proclamation. Serrano’s intentions, which he seems to wish to keep obscured, are beside the point. An understanding of the sacred in which the sacred collapses when it comes into contact with the profane is impoverished, falling short of the transcendence that is worthy of the word “God.”</p><p>A foundational insight of Christianity is that the sacred has the power to sanctify the profane. The social implications are crucial: Jesus concretely identified himself with “the least of these,” elevating as sacred the dignity of anyone whose humanity society wishes to piss on or flush away. This, rather than sanctimonious display, is what should motivate Christians.</p><p><em>The Reverend Nathaniel Mahlberg</em><em>Philadelphia, Pa.</em></p><p>•</p><p><em>Letters should be sent with the writer’s name, address, and daytime phone number via e-mail to <a href=\"mailto:themail@newyorker.com?Subject=Letters\" target=\"_blank\" rel=\"noopener\">themail@newyorker.com</a>. Letters may be edited for length and clarity, and may be published in any medium. We regret that owing to the volume of correspondence we cannot reply to every letter.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
