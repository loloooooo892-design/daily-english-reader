<script>
var articles = [{"title":"The 1940s: \"A Systematic Avalanche of Falsehoods\"","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/17/the-1940s-a-systematic-avalanche-of-falsehoods/","category":"law","categoryLabel":"Law","wordCount":1245,"readingTime":7,"content":"<p>During the Second World War, America was flooded with \"hate literature.\" A \"systematic avalanche of falsehoods\" besieged the nation, in the words of one commentator. Native fascist groups and agents of Nazi Germany circulated pamphlets and periodicals with titles like <em>America Preferred</em>, <em>The Cross and the Flag</em>, <em>The Defender</em>, <em>Patriotic Research Bulletin</em>, and <em>X-Ray</em>. \"Vicious literature … assailing minority groups on racial and religious grounds\" was being spread in large quantity in major cities. Crude leaflets containing racist, antisemitic, and anti-Catholic invective were being distributed in war factories and at Army and Navy camps. The purpose of this \"hate literature\" was to undermine the morale and unity that was needed for the war effort by fomenting violence between races and religions.</p> <p>This \"hate propaganda\" seemed to be having its intended effects. \"Hate propaganda\" was said to be responsible for major riots in munitions plants in Boston, Los Angeles, and Harlem that resulted in deaths and property damage running into the millions. A June 1943 race riot that killed thirty-four in the war production center of Detroit was tied to material distributed by Nazi sympathizers. In New York, attacks on Jews had been provoked by Father Coughlin's <em>Social Justice</em> magazine. Antisemitic gangs confronted people on the streets, demanded to know if they were Jewish, and beat them if they said they were. Gangs desecrated nearly every synagogue in Washington Heights.</p>  <p>In Boston, bands of Irish Catholic youths, members of Coughlin's Christian Front, assaulted Jews in the streets with blackjacks and vandalized stores and homes. Youths deliberately entered neighborhoods to go \"Jew hunting.\" The New York newspaper <em>PM </em>described it as a \"reign of terror.\"</p> <p>Under these circumstances, many believed, America had to take drastic steps to curb \"hate propaganda.\" The defamation of racial and religious groups was said to present \"clear and immediate dangers\" to the production of munitions and carrying out the war effort. Defamation of minority groups tugged at the consciences of Americans who embraced the democratic ideals of equality and tolerance that the nation was fighting for. Many believed that in the context of war and social unrest, it was more important to curtail the defamation of groups than it was to halt the defamation of individuals.</p> <p>Between 1940 and 1945, the United States embarked on a historic experiment with group libel and \"race hate\" legislation. Hate speech laws were passed, with most of them imposing criminal liability for statements about racial and religious groups that caused breaches of the peace or that defamed those groups. The stated purpose of the laws was to protect domestic peace and the war effort by thwarting attempts to \"set … labor against management, race against race, [and] religion against religion.\" …</p>  <p>… During World War II, several prominent lawyers and academics advocated hate speech laws, portraying them as a means of fostering democracy and social order in a world that was wracked by prejudice and conflict. One of the most noted advocates of hate speech laws was a law professor named David Riesman ….</p> <p>At Harvard Law School, Riesman had been a protégé of professor Felix Frankfurter. He later served as a clerk for Supreme Court justice Louis Brandeis. In the late 1940s, he left the field of law for sociology. It was only then that Riesman became a household name with his bestselling book <em>The Lonely Crowd</em> (1950), a critique of American consumer culture that defined a generation and that was so renowned that it made the cover of <em>Time</em> magazine.</p> <p>In mid-1941, Riesman took a one-year fellowship at Columbia Law School. During that year, he wrote a series of three articles that were published in <em>The</em> <em>Columbia Law Review</em>, under the title \"Democracy and Defamation.\" His trilogy would go down in history as foundational writings on the law and theory of group defamation.</p> <p>Defamation of minority groups was hardly a new phenomenon, Riesman observed. What was new and especially dangerous was the dissemination of group hatreds through the mass media. He described how Nazis were using mass-mediated propaganda against Jews to justify their annihilation. \"In the fascist tactic, defamation becomes a form of verbal sadism, to be used in the early stages of the conflict, before other forms of sadism are safe,\" Riesman wrote. Pointing to the rise of Father Coughlin, he noted that America was hardly immune to the struggle between democracy and fascism.</p> <p>Riesman believed that carefully crafted group defamation laws might curb the spread of fascist movements and permit minority groups to fight back against their attackers. He was inspired by the work of German émigré political scientist Karl Loewenstein, who advocated the concept of \"militant democracy.\" In a series of articles published in American law journals, Loewenstein, who fled the Nazis in the mid-1930s, argued that democracies must become \"militant.\" When faced with existential threats, such as the rise of internal fascist groups, democracies must adopt antidemocratic laws as a means of saving democracy. Because fascists played to people's emotions rather than reason, democracies could not rely on counterspeech to dispel fascist propaganda, Loewenstein argued. Only by denying fascists freedom of speech and press could democracies \"fight fire with fire.\" Loewenstein contended that European countries with the most extensive commitments to free speech were those where fascism had taken root. Only those nations that had suspended civil liberties had been successful in defeating fascism, according to Loewenstein. By denying fascists freedom of speech and press, democracies removed their opponents' most powerful tools for raising popular support.</p> <p>Riesman advocated the adoption of group defamation laws but noted potential obstacles to their passage. The American tradition of freedom of speech was not the only hurdle. Another difficulty was the American tendency to see reputation as something belonging only to individuals and not to groups. Libel laws punished only the defamation of individuals and could not be used against \"group hatreds.\" The adoption of group defamation laws would require a fundamental reassessment of \"the role of groups in the social process,\" Riesman wrote. He speculated that personal reputation was not as important in the United States as it was in Europe, where it was tied to dignity and honor. In the United States, where tradition is \"capitalistic rather than feudalistic,\" reputation was viewed as \"an asset like goodwill, and not an attribute to be sought after for its intrinsic value,\" according to Riesman. Lawyers who viewed reputation in these market-oriented terms were \"not likely to strike effective blows\" at the fascist 'conquer by division' tactic of disingenuous assaults upon the Catholics, Jews, and other convenient minorities,\" he argued.</p> <p>Foreshadowing dialogues around hate speech that would take place more than a half century later, Riesman contended that liberals, with their traditional fear of the state, had underestimated the potential of group defamation laws as \"a weapon for democracy.\" Such laws could prevent the takeover of democracy by fascism, and secondarily, permit a means for defamed groups to vindicate their reputations and their dignity. Group defamation laws, Riesman asserted, were not merely a restraint on speech but a tool that liberals could use in defense of democratic values. His articles would provide the intellectual basis for the majority opinion in <em>Beauharnais v. Illinois</em>, the 1952 Supreme Court decision upholding the Illinois hate speech law that was authored by his mentor, Felix Frankfurter.</p> <p>Excerpted from <a href=\"https://www.amazon.com/dp/0520401964/ref=nosim?lv=shuf&amp;channelId=500&amp;plpRedirect=mhFallback&amp;tag=reasonmagazinea-20\" target=\"_blank\" rel=\"noopener\"><em>Hate Speech: The Legal and Cultural History of an American Dilemma</em></a> by Samantha Barbas, courtesy of the University of California Press. Copyright © 2026.</p>"},{"title":"The Extraordinary Untold Story of Freddie Mercury: Mary Austin on Her Best Friend–and Love of Her Life","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/09/09/queen-freddie-mercury-mary-austin/","category":"fun","categoryLabel":"Interesting Reads","wordCount":528,"readingTime":3,"content":"<p>Mary Austin was the woman behind Freddie Mercury, quietly supporting him for decades, from their intense early romance to the long years they remained close friends after accepting that he was gay. The vast legacy he left her—his home, much of his fortune, and his most personal belongings—has been a mixed blessing that she has spent her life trying to navigate with loyalty and discretion. As Simon Hattenstone explores Austin’s life in this interview, the unresolved emotion of the shared past with Mercury is still palpable.</p>\n<blockquote>\n<p>Did the piano change him? “Yes, there was much more purposeful energy. He would sit at the piano, play the odd key, hum a bit and he looked very happy. Transported.” By now they were spending less time together. When she was working at Biba, he would often be sleeping. When she returned home, he would be preparing for a gig.</p>\n<p>They’d been living together for four years when Mercury said he had something to tell her. He struggled to get the words out. He said, ‘I think I’m bisexual.’ I said ‘No, Freddie, I think you’re gay.’” He didn’t argue. Was that a huge upset? “No, it was a huge relief, because I wasn’t sure whether we were travelling in the same direction any more. Some time earlier I saw a dress and thought, that would be a really nice wedding dress. I asked Freddie, is it worth me buying it, and he looked at me and shook his head. So I knew from there on …”</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks on rock music\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/06/05/the-inside-story-of-the-athens-music-scene/\" target=\"_blank\" rel=\"noopener\">The Inside Story of the Athens Music Scene</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTommy Tomlinson | Garden &amp; Gun | June 1, 2026 | 5,453 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“How did the college football town spawn the B-52s, R.E.M., and Widespread Panic, to name just a few? The maestros and misfits who led Athens’s rise to one of the world’s most influential and improbable music towns tell all.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/01/08/acid-blues-slight-return/\" target=\"_blank\" rel=\"noopener\">Acid Blues (Slight Return)</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJames McManus | The American Scholar | January 5, 2026 | 3,188 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The music of Jimi Hendrix continues to strike a chord.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/04/14/the-portal-opens/\" target=\"_blank\" rel=\"noopener\">The Portal Opens</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAmanda Petrusich | The New Yorker | April 14, 2025 | 9,925 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“People who love Phish do so with a quasi-religious devotion. People who dislike Phish do so with an equal fervor.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/05/22/how-kid-rock-went-from-americas-favorite-hard-partying-rock-star-to-a-maga-mouthpiece/\" target=\"_blank\" rel=\"noopener\">How Kid Rock Went From America’s Favorite Hard-Partying Rock Star to a MAGA Mouthpiece</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tDavid Peisner | Rolling Stone | May 19, 2024 | 7,785 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The man born Bob Ritchie calls Trump his ’bestie’ and spouts right-wing talking points. Many close to him wonder what the hell happened.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/05/18/the-dave-matthews-guide-to-living-and-dying/\" target=\"_blank\" rel=\"noopener\">The Dave Matthews Guide to Living and Dying</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAlex Pappademas | GQ | May 18, 2023 | 5,777 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Now 56, Matthews has been singing about mortality for a long time, and he’s confronting its specter in new and surprising ways.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/03/02/all-you-touch-and-all-you-see-dark-side-of-the-moon-at-50/\" target=\"_blank\" rel=\"noopener\">All You Touch and All You See: “Dark Side of the Moon” at 50</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tTal Rosenberg | The Ringer | March 1, 2023 | 4,397 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“A half-century ago, Pink Floyd unleashed a classic that still lingers on the Billboard charts and in college dorms to this day. But what’s the legacy of the blockbuster album?”</p>"},{"title":"We just saw a big chunk of Thief Remastered gameplay, and I'm more desperate than ever to play","source":"PC Gamer","author":"Joshua Wolens","url":"https://www.pcgamer.com/games/sim/we-just-saw-a-big-chunk-of-thief-remastered-gameplay-and-im-more-desperate-than-ever-to-play/","category":"gaming","categoryLabel":"Gaming","wordCount":540,"readingTime":3,"content":"<p>Thief: The Dark Project Remastered gameplay trailer - PC Gaming Show 2026 - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/uUNypn7Moqo\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>There aren't many things I'm looking forward to more than Nightdive's remaster of the original Thief. Is this because I'm old? Yes, but it's also because Thief is an all-timer videogame and I can't wait to see Nightdive work its magic on it.</p><p>At the PC Gaming Show Tokyo Direct, we got a hefty helping of gameplay in a new trailer for the remaster, showing Garrett stuffing his pockets in all manner of poorly-lit, erm, manors, plus sewers, crypts, tombs, dungeons—you know, Thief places.</p><h3>Wishlist Thief: The Dark Project Remastered on Steam</h3><p><strong>Release date: TBA</strong></p><p>Get ready to stuff your pockets because Nightdive's Thief remaster looks downright glorious in a new, gameplay-heavy trailer. We even got a peek at the controller UI, which looks to be taking its cues from the original game's mod scene. Good choice. There's no release date just yet, so make sure you <a href=\"https://store.steampowered.com/app/4200960/Thief_The_Dark_Project_Remastered/\" target=\"_blank\" rel=\"noopener\">wishlist it on Steam</a> to keep up with the news.</p><p><a href=\"https://store.steampowered.com/app/4200960/Thief_The_Dark_Project_Remastered/\" target=\"_blank\" rel=\"noopener\">Wishlist now</a></p><p>It looks great. I've said it before and I'll say it again: Nightdive has gotten 'making games look how you <em>remember</em> them looking' down to an art. No ugly uprezzed textures or weirdly 3D models, just a lot of deft touches that keep the game's original art style intact.</p><p>I'm also pretty sure we got a glimpse of the game's controller support, and it looks like the remaster is taking its cues from the (very good) already-existing controller mods for the un-remastered version of the game.</p><p>You can select items using a handy-dandy inventory wheel, which is just how the mods do it. Supposing Nightdive is taking its cues from them, then I imagine we're going to get something that feels almost weirdly well-suited to a PC game originally released in 1998. The mods make flicking between your various arrow types (remember to stock up on water and moss, hard-mode players) very easy indeed—I imagine Nightdive's version might make it even easier.</p><p>I'll say this, though: this trailer, with its driving soundtrack and ample blackjacking and arrow-loosing, doesn't quite match <em>my</em> memories of Thief, which mostly consist of a lot of standing in dark corners and memorising guard patrol routes. Where's the 10-hour 'Hanging out with Garrett behind a door' ASMR YouTube video, Nightdive? You're missing a trick there.</p><p>Check out our <a href=\"https://store.steampowered.com/curator/1850/sale/PCGamingShowTokyoDirect\" target=\"_blank\" rel=\"noopener\">Steam page</a> with all the games, updates, and DLC featured in the show. You can also read our <a href=\"https://www.pcgamer.com/gaming-industry/events-conferences/everything-announced-at-the-pc-gaming-show-tokyo-direct-2026/\" target=\"_blank\" rel=\"noopener\">roundup article</a> which includes every announcement from the show in the order it aired.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>One of Josh's first memories is of playing Quake 2 on the family computer when he was much too young to be doing that, and he's been irreparably game-brained ever since. His writing has been featured in Vice, Fanbyte, and the Financial Times. He'll play pretty much anything, and has written far too much on everything from visual novels to Assassin's Creed. His most profound loves are for CRPGs, immersive sims, and any game whose ambition outstrips its budget. He thinks you're all far too mean about Deus Ex: Invisible War.</p>"},{"title":"Justice for CSS","source":"Wired","author":"@wired","url":"https://www.wired.com/story/justice-for-css/","category":"tech","categoryLabel":"Technology","wordCount":1275,"readingTime":7,"content":"<p>The first <em>S</em> in CSS stands for “style.” Think colors and fonts, borders and shadows, rows and columns, animations and transitions. CSS is the programming language that makes a website look pretty (or pretty ugly, often). It’s what makes this very webpage look like itself—look WIRED.</p><p>One paragraph in, a certain reader will already be smarting at my description of CSS. “It’s a <em>style sheet</em> language,” I can hear them say, “not a <em>programming</em> language.” (The second <em>S</em> indeed stands for “sheets,” and the <em>C</em>, if anyone cares, for “cascading.”) Or, “it’s a domain-specific language, not a general-purpose language.” Also, “it doesn’t <em>execute</em>” and, of course, “it’s not Turing complete” (<a href=\"https://notlaura.com/is-css-turing-complete/\" target=\"_blank\" rel=\"noopener\">although <strong>…</strong></a> ). Granted, CSS is a little different. There’s no compile step, and it doesn’t throw errors at run time like other languages. But that’s all beside the point.</p><p>The gatekeeping over whether CSS is a “real” programming language exists partly because it’s so simple to start—anyone can grok “background: red” right away. But <em>simple</em> does not mean <em>easy</em>, as the programmer-writer <a href=\"https://adactio.com/journal/12571\" target=\"_blank\" rel=\"noopener\">Jeremy Keith observed</a>, and calling CSS easy or unserious should be tired by now. There were about 50 properties in the initial CSS specification in 1996 (like “color” and “font-size”); today there are at least 10 times as many (get ready for “hanging-punctuation”). The language has changed so much in three decades, and by now it is just <em>so</em> capable. One programmer recently re-created <a href=\"https://cssdoom.wtf/\" target=\"_blank\" rel=\"noopener\"><em>Doom</em> in CSS</a>. Others have used it to build <a href=\"https://poke-holo.simey.me/\" target=\"_blank\" rel=\"noopener\">holographic Pokémon cards</a> and <a href=\"https://polycss.com/gallery/\" target=\"_blank\" rel=\"noopener\">3D-rendering engines</a>. Cassidy Williams, who competed in this year’s inaugural <a href=\"https://madcss.com/\" target=\"_blank\" rel=\"noopener\">March MadCSS tournament</a>, built an experimental database-query engine entirely in CSS. When she demo’d it at Microsoft Build, even the emcees—seasoned programmers themselves—took a cheap shot at CSS. “You’re one of the people that likes it,” they snarked. “You might be the only one.”</p><p>Why is the lore of JavaScript’s creation so famous (Brendan Eich, Netscape, 10 days) and yet hardly any programmer would recognize the name of CSS creator Håkon Wium Lie? It might have something to do with Lie being a Norwegian guy with a diacritic in his name, not an American in Silicon Valley like Eich nor a Brit like <a href=\"https://www.wired.com/2017/04/tim-berners-lee-inventor-web-plots-radical-overhaul-creation/\" target=\"_blank\" rel=\"noopener\">Tim Berners-Lee</a>, who invented HTML. And to be fair, <a href=\"https://www.wired.com/story/javascript-runs-the-world-maybe-literally/\" target=\"_blank\" rel=\"noopener\">JavaScript</a> and <a href=\"https://www.wired.com/story/html-is-actually-a-programming-language-fight-me/\" target=\"_blank\" rel=\"noopener\">HTML</a> each have a chip on their own shoulder to worry about. But in the browser’s holy ternary of JavaScript-​HTML-CSS, people tend to treat CSS as less than or purely decorative. Styling <em>can</em> be decorative—and wonderfully so—but the legibility and rich design it affords are important. People care how things look!</p><p>There’s another, uglier explanation for the CSS disrespect: It’s considered a “feminine” language. CSS developers work on the frontend—the part of a website you can actually see. There’s the obvious undertone that dealing with style and beauty is Female Work, along with the recycled joke that a CSS developer is “a freak in the style sheets.” How seriously a language is taken has knock-on effects on programmer salaries, what skills are sought out and tested in job interviews, and how accessible websites are for people with disabilities.</p><p>I recently talked to a friend, a talented backend engineer, about this. In college, she got an internship at a reputable software company in San Francisco doing entirely backend work. “I’d never expressed any interest in frontend at all, almost to an extreme extent,” she told me. “I don’t like frontend.” And yet, when she joined the company full-time after graduation, she was immediately assigned … a frontend role. She eventually worked her way back to the backend, and by now she’s used to the skepticism. “I’ve been in a million and one conversations with the classic man engineer who doesn’t think I know what I’m talking about until they work with me for six months and see my first backend project.”</p><p>I didn’t know this specific story when I first asked my friend if, maybe, I dunno, she had any experience with people assuming she was a CSS girlie. But the “coincidence” is really more of a probability. To overcorrect for such situations, she’s taken to branding herself as unmistakably backend-y. When we worked together, whenever it came time to distribute tasks among our team, she made it quite clear that she did <em>not</em> want to touch the frontend. (I don’t think we ever played Nose Goes, but that was the spirit.) I’d have been seriously obtuse to make the same mistake her manager did.</p><p>That same friend used to teach at <a href=\"https://www.kodewithklossy.com/\" target=\"_blank\" rel=\"noopener\">Kode With Klossy</a>, a tech camp for young women and gender-expansive students started by supermodel Karlie Kloss. Her experience there was all about the other, optimistic side of the coin: CSS can be a gateway into software for those who don’t fit the nerdy-computer-boy stereotype. “These girls would come in who had no interest in coding but just thought that Karlie Kloss was cool, and they would have so much fun,” she said. “They would grow to care more about, like, OK, how does this work?”</p><p>Within the industry, the Klossy approach is reflected in slightly better (but still really bad) gender diversity in front-of-the-frontend engineering jobs, compared to back-of-the-frontend and pure backend roles. Of a few thousand respondents in the State of CSS survey last year, 11 percent were women and 3 percent were nonbinary or gender-nonconforming. Pathetic, I know. But the State of JavaScript reported only 6 percent female and 1 percent nonbinary.</p><p>Another downstream consequence of CSS neglect is the sameness of websites across the internet, especially in Startup-land. If CSS is what makes a website look like itself, then the more recent fast fashion of <em>frameworks</em> is what makes them all look alike. There was a Bootstrap era, a Tailwind look, and now a distinctive Claudeslop aesthetic. Frameworks are athleisure, and if you’re not into fashion, they’re a shortcut to looking OK. Fair enough. But it does bum me out, in the same way the grayification of American cars bums me out compared to those old photos of technicolor parking lots.</p><p>WIRED was one of the first major, high-traffic sites to adopt CSS. It was a “<a href=\"https://www.wired.com/2002/10/wired-news-a-site-for-your-eyes/\" target=\"_blank\" rel=\"noopener\">Site for Your Eyes</a>,” WIRED declared, and it was. But back then, there was no Flexbox nor Grid, no custom properties, and no @keyframes, transitions, and transforms for JavaScript-free animations. In this decade alone, so many powerful CSS features have landed in browsers that it’s hard to keep up. I’m no CSS expert, but I know enough to be past the overconfidence cliff in the Dunning-Kruger curve and into the valley of respect and reverence. I delight in one-off goodies like “text-wrap: pretty” (which prevents an orphan word stuck on its own line from ending a paragraph) as much as broad improvements like nested declarations. In the last few years alone, we got container queries, the :has() pseudo-class, and new color spaces like oklch(). CSS supports right-to-left languages, like Hebrew and Arabic. It interpolates positioning of the pieces of a web page to create buttery animations and gradients. And now, with if() conditionals and @function in development, even the “well, technicallyyy” explanations of why CSS isn’t a legit programming language might finally be put to rest. This is not your mother’s CSS.</p><p>The fact that CSS is simple to start, yet deep to explore and master, is part of why I love it so much. It’s the closest language we have to end-user programming, the idea that software should be customizable by any user. Style sheets are like spreadsheets in that way: A novice can build something useful in an hour, and experts can build fucking <em>Doom</em>.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
