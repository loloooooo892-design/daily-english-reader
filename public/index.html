<style>
:root {

    --bg: #191C22;

    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;

    --warning-text: #D4B87A;

  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;

}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"Your Parents’ Fall TV Preview","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/your-parents-fall-tv-preview","category":"fun","categoryLabel":"Interesting Reads","wordCount":822,"readingTime":5,"content":"<p>It’s that dreary time of year again—back to school, back to work. Thank God for the fall TV lineup. But, since exciting new shows are constantly slipping through the algorithmic cracks and getting cancelled before you even hear about them, it’s harder than ever to figure out what’s right for you. That’s why we asked some trusted sources for their entertainment suggestions. Grab a spot on the couch and enjoy your parents’ picks for what to watch this season.</p><p><strong>“Liminal” (Season 1) on Apple TV</strong></p><p>This sci-fi nail-biter stars that one actress (Zoe Saldaña), from that movie your parents liked (“Emilia Pérez”), as a physicist who discovers a “parallax dimension” that allows humans to travel between our universe and other realities. Season 3 of “Liminal” is about to première, but your parents are just now starting at the beginning, despite how enthusiastically you recommended the show when it débuted, in 2018. They don’t remember any of that, but they will recap every single episode to you over the phone. That’s actually going to be kind of helpful because there haven’t been new episodes of “Liminal” in five years, and you’ve forgotten most of what happened.</p><p><strong>“North of South of the Border” on Paramount+</strong></p><p>Welcome to El Paso, where men are men and women are cast mostly in nonspeaking roles. Taylor Sheridan’s latest drama stars Mel Gibson as a Border Patrol agent who feels conflicted about his work because his bosses won’t let him arbitrarily deport Jews and Greek people. Sheridan’s shows currently take up so much of Paramount’s programming that there isn’t enough time in the day to air “North of South of the Border” as its own hour-long drama. It appears exclusively in snippets on television sets that characters are watching within the show “Landman,” which your parents refer to as “Yellowstone.”</p><p><strong>“Don’t Indict My Love: The True Story of Lou and Mabel Patterson” on Netflix</strong></p><p>You may remember Lou and Mabel Patterson as Pitter Patter, the husband-and-wife R. &amp; B. duo that topped the charts with such wholesome hits as “That Baby’s My Baby” and “Toodle-oo, Ladybug,” before abruptly receding from the public eye. This six-part documentary, that really could have been a two-part documentary, reveals what led to the couple’s disappearance, thanks to a trove of documents that the F.B.I. director, Kash Patel, accidentally left in a Ruth’s Chris Steak House in the greater Dallas area. Essentially, in 1970, the national-security apparatus became worried that, if Pitter Patter continued to churn out innocent and joyful music like “Press Two to Tango” and “She Kissed Me (Where the Sun Shines),” draftees would begin conscientiously objecting to the Vietnam War in droves. The Bureau invented the charge of “rocketeering”—conspiring to make and disseminate rock-and-roll music—and slammed the Pattersons with a hundred and seventeen counts. When rumors of an unfinished demo for the mildly political song “Civil Rights, That Sounds Nice” were confirmed by Elvis Presley, under oath, the Pattersons knew they were sunk. As part of a plea deal, the two agreed to retire from the music industry and sell their catalogue to the white businessman Stan Lundt, who buried the master recordings underneath a shed, next to his wife, for whose murder he had recently been exonerated.</p><p><strong>“So You Think You Can Think” on CBS</strong></p><p>The comedian Nate Bargatze challenges habitual ChatGPT users to write original one-sentence e-mails about things that happened to them in the past week, that also incorporate basic facts about their loved ones. “He seems nice,” muses your mom.</p><p><strong>“Tendershire Farms” (Season 18) on BritBox</strong></p><p>Maude Tendershire (Olivia Gingerbottom) works as the caretaker for her family’s historic camomile farm. That’s about it. The show is so cozy and soothing that the actors frequently fell asleep during takes and can be spotted snoozing in the background. This season, low jinks ensue after Lord Gilderoy (Hankleton Dunderthorpe III) stops by for a visit, but he’s already eaten so he doesn’t stay for tea. A lamb wanders off but soon returns. And, for one entire episode, a gentle breeze rustles the branches of a weeping willow as an inaudible conversation takes place nearby.</p><p><strong>“Six Hours a Day of MSNBC” on MS NOW</strong></p><p>Or Fox News, depending on your specific parents.</p><p><strong>“Dr. Shaft, M.D.” on Fox</strong></p><p>An underground facility known as Drive Shaft, Maryland, is home to the Washington, D.C., metro area’s most cutthroat drag-racing scene—and there’s a new driver tearing up the quarter-mile track. Other gearheads know him as Smooth J., but, at his day job, at the Foggy Bottom Urology Clinic, Jason Shafterton goes by Dr. Shaft. Will his addiction to fast driving undermine his commitment to providing affordable penile health care to residents of our nation’s capital? Only time will tell. Your parents really aren’t that interested in the racing scenes or, frankly, the medical stuff. But your mom refuses to miss an episode because the show stars Daveed Diggs, from the original cast of “Hamilton.” ♦</p>"},{"title":"eBay Coupons in September 2026","source":"Wired","author":"@wired","url":"https://www.wired.com/story/ebay-coupon-code/","category":"tech","categoryLabel":"Technology","wordCount":997,"readingTime":5,"content":"<p>Long before we had Amazon, Facebook Marketplace, or thousands of other online retailers, we had eBay. And now, we have an eBay coupon to help you save on basics like vacuums and phones, as well as your most niche needs—because eBay has everything from haunted objects to ironic <a href=\"https://www.wired.com/gallery/retro-tech-phones-we-love/\" target=\"_blank\" rel=\"noopener\">landline</a> phones to <a href=\"https://www.wired.com/gallery/best-retro-gaming-consoles/\" target=\"_blank\" rel=\"noopener\">retro gaming consoles</a>. One of the first and most enduring online shopping platforms, eBay has stood the test of time, providing us with the old-school feel of estate sales, complete with bidding wars and gently used items of quite literally every type.</p><h2>Find What You Love with 20% Off at eBay</h2><p>One of the best ways to save is to shop the rotating <a href=\"https://cna.st/affiliate-link/8uvTiuNRgn5tyRjNWiSy546tbR1Y8S6C9LTLxtHtcGyQeGaAh8S5PTWd9VconBL1pqf54tr6BhuSCFuJKtxvEyYK1hNh6siCFRr1cDUjXzf8BJBY5MCQEkEkRDPYXVRfcpwNK2MnaYxxWVBa6tjpRHFan3BBZH8wLUC1H65Pcv3RjK7iN9hV5QodQexFA7npWQVhC4bEkZroGkyTVJpRrTX2aghNLnVByyEDX9uLzPvRK3ecTnW2CgJZm7\" target=\"_blank\" rel=\"noopener\">deals</a> section, where you can get 20% off home, tech, and more with the eBay promo code <strong>FINDYOURS20</strong> until September 27. They have deals on virtually all of their items across many categories, and some of the best deals we’ve found include the Apple iPad 11 A16 (2025) for $376 and the new Lenovo Legion Adapter Charger for $16, plus free shipping. Be sure to check out these <a href=\"https://cna.st/affiliate-link/8uvTiuNRgn5tyRjNWiSy546tbR1Y8S6C9LTLxtHtcGyQeGaAh8S5PTWd9VconBL1pqf54tr6BhuSCFuJKtxvEyYK1hNh6siCFRr1cDUjXzf8BJBY5MCQEkEkRDPYXVRfcpwNK2MnaYxxWVBa6tjpRHFan3BBZH8wLUC1H65Pcv3RjK7iN9hV5QodQexFA7npWQVhC4bEkZroGkyTVJpRrTX2aghNLnVByyEDX9uLzPvRK3ecTnW2CgJZm7\" target=\"_blank\" rel=\"noopener\">rotating deals</a> and use the eBay coupon code above to save 20% for a limited time.</p><h2>Save up to 60% on Your Next Purchase at eBay</h2><p>eBay has <a href=\"https://cna.st/affiliate-link/8uvTiuNRgn5tyRjNWiSy546tbR1Y8S6C9LTLxtHtcGyQeGaAh8S5PTWd9VconBL1pqf54tr6BhuSCFuJKtxvEyYK1hNh6siCFRr1cDUjXzf8BJBY5MCQEkEkRDPYXVRfcpwNK2MnaYxxWVBa6tjpRHFan3BB y anything else you can imagine.</p><h2>Shop These Rotating eBay Deals</h2><p>eBay has <a href=\"https://cna.st/affiliate-link/8uvTiuNRgn5tyRjNWiSy546tbR1Y8S6C9LTLxtHtcGyQeGaAh8S5PTWd9VconBL1pqf54tr6BhuSCFuJKtxvEyYK1hNh6siCFRr1cDUjXzf8BJBY5MCQEkEkRDPYXVRfcpwNK2MnaYxxWVBa6tjpRHFan3BBZH8wLUC1H65Pcv3RjK7iN9hV5QodQexFA7npWQVhC4bEkZroGkyTVJpRrTX2aghNLnVByyEDX9uLzPvRK3ecTnW2CgJZm7\" target=\"_blank\" rel=\"noopener\">rotating deals</a>, such as 20% off up-and-coming brands, so be sure to check their page often to see which deals are next. They also feature spotlighted, trending, and <a href=\"https://cna.st/affiliate-link/2xoTpiFhHURJG3khGq2KwPkTAuWKgr9XnGvqE3KPXPFthbWVZZeseYHHtK7NjMCHwi14R3DDWgZC3HHb3oZHnvSrnf9b4afRNrQ6GzT3AdYyV8TfXyR9y2GmNETeoPpPv4MkSCaDueU7KtVCtFY3BeyMuj7PzC6j61ZdoM8sYCsL76eUPuqT8waZHhmmpiVNH6SKJ2d5H5EAXrXBhEzqTP1GTMLejsWwmxxNYsPWBv94bzQmQquEcP71ozcLygwAvshHJPx1\" target=\"_blank\" rel=\"noopener\">featured</a> deals for huge savings on a myriad of products, including auto parts, golf clubs, shoes, and more. eBay offers a <a href=\"https://cna.st/affiliate-link/iqZ9y5iK3WikqF64Z6iaV1PFzGdy6wr1EVtcQn3v6NTwsimYy53i7kLZN1QNzFtU45dThkijA8A94WawiMhCau5VAxaPATFBNCxFXkzpq7SndAe55EG1x9SHwUCfFdWD2fNprqKcDdM8xAJe7EAvU8gjjMd1SQCk9UCLJmk3nm47u11ayccCS3W8fTSzb6AGeTDfTr3QXJiNavBpVsaaKPXT1tsRVqsP4Rw2ACh3AX5AtL8F8TvGZHnSkBATi81QbNYs5iyoG714Dms9JMSb57p53\" target=\"_blank\" rel=\"noopener\">money-back guarantee</a> to ensure you get the item you ordered or your money back.</p><h2>Shop With eBay Mastercard to Get More Rewards</h2><p>Have you heard of an <a href=\"https://cna.st/affiliate-link/6qoid9Au77JLK59xfPNtdZYLCbHzYGLBuuKyzVy5RmapAdxuGpgX6Jh3NALGsmTz58iHWovSgYbnWVYx1JzVT1g19pWKGvy9b647G4pmKEsXNmxjSazPnjY4rGoPACoojTuWSUjBEGuTxvG3todzfTXWkhm8wjJq3qKeT1F3jLktvpRUEvRWHnXifneZhfraDdvyPTpqiJtztj4aY6XL1fNe3WzzNBEqWe9mrcqB2R2fhcup9tqP9NSByLNncFKbrWQjX\" target=\"_blank\" rel=\"noopener\">eBay Mastercard</a>? I hadn’t either, but if you’re a collector or a frequent eBay shopper, an eBay Mastercard is a smart way to save on purchases you were already planning to make. After you spend $1,000 on eBay in a calendar year, you’ll earn five times the points for the rest of the year. Until then, you’ll earn three times the points per $1 spent on eBay, up to $1,000 in a calendar year. You can also earn twice as many points per $1 spent on gas, restaurants, and groceries, and 1 times as many points per $1 spent on all other Mastercard purchases.</p><h2>Get Daily Deals With the eBay App</h2><p>If you’re someone who shops or sells on eBay often, I’d suggest downloading the eBay app for even more perks. The <a href=\"https://cna.st/affiliate-link/AUmSbTSfyktbrSrBKbpwFxNMcdd1vukjCDSHder9QRM9oqS3iFWcbcCEDv7Cn9MiviNrYtbNnZtTkPZcgA9QjnSa7YS9Ub1xDhsvTYt4qFKeXAVwNaTzvUMyFwoBG98pqUB9kxxLC5xvNr7XdZ6wfgUdTvKr6GW8AsMgQ2bMR5fPVUgqVAA2WTobP5NDZ1PStG37MHUTkvwFqf91ZdeimzfrJwWPTV6JP1RzcfkXycSNeL5wGQZVjoUBbXtCQbfgUsp3u3SjhzMHGWvE16FvLgGD\" target=\"_blank\" rel=\"noopener\">eBay mobile app</a> makes it easy to find the best rotating deals on various items and to access the hottest deals and discounts of the day before they leave. Through the app, you can browse everything from trendy items to power tools to tech gadgets, then choose whatever price looks best. There are also app-only discounts and special offers exclusively for eBay app users. Plus, eBay will help you figure out when’s the best time to buy, with price notifications to let you know when the price has dropped.</p><h2>Try an eBay Gift Card</h2><p>Looking for a gift for the quirky fashionista or vintage collector in your life? Instead of a run-of-the-mill present, give them an <a href=\"https://cna.st/affiliate-link/3aDLD4v8PzjSrfXUvrXgLMBhdBoYpvy6kGqdj1qsu27mT1W5CKMdwWYC3kjWRxofWNyuDPuobJzQrArvZsnNgpnrzzHehxwYfph7iBhicTdSXmjjh65p19vHjxRm8kRgJ7fK7mfeTQBkb5gLvg6SDig9LMYJNTQkdtLSJ5Yfmp7y96xy9mjHPFW1ReSuRpvgR2SbNqbHpivGYgzSzg9bqDmmjYF4xuwTUsZyoNGyCZ78zgGrZrdMt5ncZvnByDYcxfPJo4FiC6VqfVfL6TtiWEGgZNmB6tLDz8wYcwBTZNgnzPvDG3ukh\" target=\"_blank\" rel=\"noopener\">eBay gift card</a> so they can expand their rare baseball collection or get a discounted Nintendo Switch. eBay gift cards can be used to pay for almost any item online. You can get a digital gift card <a href=\"https://cna.st/affiliate-link/tn2HCMyCtD1Ykqut5LgN9tnLmz49XvFVt3J5QHbAdfopzNnT37DPzrzPmZhy2LQJueqtMxqsqVBuX36mtACyyPNgXh5g1KrLazmgY27fefXA66QNUtBhzftGmRxT3c3vQcf49CD7mMtEqfmTL6Z136t7CG3bp5zn134VV2MgLBmHFi1YejKiw8579mXEepoQpf5FE6EzVBSCANLCLxeMq78KiPhdrdVqVVs93VxyAdPj1kKygpGtCgpsawMrgX7\" target=\"_blank\" rel=\"noopener\">on eBay</a>, or buy a physical eBay gift card at CVS, Walgreens, and <a href=\"https://cna.st/affiliate-link/L31kjCrBRWwQVAgouRzw9zeAqFBnRDPrg5dR5RszGG7KuhjToQoiVbGoZNcqSc6Fp2miVsvyXpiN8nt9NPAx8hjR7h8foaw5jZL3hAu53q8g73tT6ak4YVnoqnHZAYiZX9uAaabzB2HgWYtns2TyD3Rw9WVXumDuzsLYM4zALfDYB3T4w83oqkCoQTUG2VTw8cNyaZdyYqfr7NFtFD7XgJvZhSG9or9i8VGcghZDnMbjMc1ccP2ot2K5jW8uYbZdpVrQeFQR3ZboWAQeZ\" target=\"_blank\" rel=\"noopener\">other retailers</a>.</p><h2>Don’t Miss the eBay Auction Hub</h2><p>eBay has grown significantly but was originally popular as the first online auction platform, opening up global trading and rare item markets. Today, it’s more efficient with the <a href=\"https://cna.st/affiliate-link/7PpuYtEvLfvatp9mv5GRz6VPBzG477coTCxU9ZdQf8NKCxUwUDMbWBAkWzVzWUgpCbq3Y6nDKiL229as1g4F1nu1B9BTZFCkKEZyREYPo8LNqET1M62dsX41GrbrcEEHiaq6bcm5ZNvnnX8DYrG1v8Ej7bVxbHzMuCuvK59c2LrBX7n5qMGQRP1fJsUh8pEdwCgToWWq5GjMsHeuuXVfkpErt4K3o47h4j3f42Hq4cR1H3s4T7ywNPQQ3jw5guheXb224H5UeUniM3gaffP3\" target=\"_blank\" rel=\"noopener\">eBay auction hub</a>, where users can catch weekly drops of rare collectibles from leading vendors. Popular items include Pokemon, baseball, basketball, and football cards. If you want to enhance your collection, this is the place to begin.</p><h2>Shop Car and Truck Parts at eBay</h2><p>You probably don’t think of eBay when you think of <a href=\"https://cna.st/affiliate-link/GP5sCMm2xCt7Xa7GagkWfg5176uYfYXU9DuRgcAD6FUB2FCRG5R53BpYNyApvcPMtkgkxFFJubNkjT4MwpAGAbGJ21k1fcMHU9kzVZr52FiTYbqz3MSWw34NSrLp67iHWjeqgoTYEHeebgL8FAESm5sQmPdY3eo8vZikvdw9UiG3Mih1m4tXYm4t1tJLDFJGH6bAhuzXsD3wuYRSzqJQDCXUVk24sMDGJPVSnEu9gdP4LAo7VGAjikSEYtNCCfXuGEaT7jR92qz78NP6RxqM9GsRgULe2gkp2B1VTKA36gD\" target=\"_blank\" rel=\"noopener\">car parts and accessories</a>, but eBay has a wide range of everything you need for car additions and maintenance for far less than buying new at a chain retailer. On eBay, you can shop by popular car and truck parts categories, like racks, cargo carriers, towing parts, exhaust and emission systems, brakes, starters, alternators, and more.</p>"},{"title":"Federal Judge Refers Philly DA to Department of Justice for Potential Prosecution","source":"The Volokh Conspiracy","author":"jadler1969","url":"https://reason.com/volokh/2026/09/16/federal-judge-refers-philly-da-to-department-of-justice-for-potential-prosecution/","category":"law","categoryLabel":"Law","wordCount":1171,"readingTime":6,"content":"<p>Philadelphia District Attorney Larry Krasner is perhaps the nation's most prominent <a href=\"https://www.americanprogress.org/article/progressive-prosecutors-reforming-criminal-justice/\" target=\"_blank\" rel=\"noopener\">\"progressive prosecutors.\"</a> Among his priorities as Philly's DA has been to facilitate sentence reductions and the undoing of criminal prosecutions where there are allegations of prosecutorial misconduct or actual innocence claims. The zeal with which Krasner's office has pursued these aims has raised eyebrows, however.</p>\n<p>In June, the Pennsylvania Supreme Court <a href=\"https://www.pacourts.us/assets/opinions/Supreme/out/J-6-2025mo%20-%20106819216362682526.pdf\" target=\"_blank\" rel=\"noopener\">rebuked Krasner's office</a> for withholding evidence and violating its duty of candor to the court when conceding that a death row inmate was entitled to a new trial, and that these failings were not an isolated occurrence. Rather, according to Justice  \"There have been numerous instances of untrustworthy concessions, lack of candor, misrepresentations of fact, lack of adequate investigation, and avoidance of hearings\" by the office's Conviction Integrity Unit. Accordingly, the court ordered that the Pennsylvania Attorney General's office would receive notice and a right to intervene in any case in which Krasner's office offered concessions to those seeking post-conviction relief.</p>\n<p>Yesterday, federal district court judge Paul Diamond concluded that the ethical and legal problems in Krasner's office may be even more serious that the Pennsylvania Supreme Court had found. In a blistering order, he concluded that Krasner and one of his deputies, Matthew Stiegler, may have committed criminal misconduct in a case in which the office sought to undo a criminal conviction, despite a weak legal basis for doing so. Among other things, Judge Diamond accused them of dishonesty to the court, efforts to evade discovery of their conduct, and conspiring to falsely blame a junior attorney for errors in a legal filing for which Stiegler was responsible.</p>\n<p>Judge Diamond <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.paed.508869/gov.uscourts.paed.508869.174.0.pdf\" target=\"_blank\" rel=\"noopener\">disqualified</a> Krasner and Stiegler from further work on the case due to their conflict of interest and, more notably, referred them to the U.S. Attorney's office for investigation and potential prosecution.</p>\n<p>From Judge Diamond's <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.paed.508869/gov.uscourts.paed.508869.173.0_1.pdf\" target=\"_blank\" rel=\"noopener\">opinion</a>:</p>\n<blockquote><p>The evidence before me and the facts I have found reveal more than a disabling conflict. I refer here not to Mr. Krasner's use of another's email address, his concern that documents written to him might be discoverable, his repeated insistence that there should be no hearing in this Court, or his almost irrational refusal to refer Johnson to the OAG even though he recently made such a referral. Although that conduct might reveal that Mr. Krasner is aware that he might have acted improperly, it is not itself criminal conduct.</p>\n<p>The credible evidence is tantamount to a prima facie showing of conduct that may constitute false statements, false declarations made under oath, perjury, obstruction of justice, and conspiracy. See 18 U.S.C. § 1001 (false statements); id. § 1623 (false declaration); id. § 1621 (perjury); id. § 1503 (obstruction of justice); id. § 371 (conspiracy).</p>\n<p>Three days after Mason resigned, Stiegler told Ernst that Mason \"had purposefully inserted the false facts into the response,\" that \"this was one hundred percent her fault, zero percent his fault,\" and that the DAO should tell me that her other cases contained mistakes too, so that I would \"view this as one rogue ADA.\" Stiegler made the same pitch to Napiorski, who understood him to want Mason \"paint[ed] . . . as a rogue actor.\" He presented it to Mr. Krasner, who deemed it a \"really good idea\" and urged [four other attorneys in the office] to implement it. Even after they refused, Stiegler repeated it in Mr. Krasner's presence.  Yet Stiegler testified before me that Mason was \"one of our strongest ADAs in the [U]nit.\" Stiegler was thus urging the DAO to present the Court with a false account to shield himself.</p>\n<p>Moreover, at the July 17 hearing, Stiegler acknowledged that he had spoken with Mr. Krasner about this case \"possibly twice.\" When I asked what they discussed he answered:</p>\n<p>What I remember about that conversation, Your Honor, is that he was interested in my input about the office's handling, and that what I was saying to him was that my view was that we had information about what had happened here, that this was—I think I said something to the effect of this was not a who done it, that we had information about how these errors had occurred and that we should act—and that information primarily was the drafts that had resulted in the ultimate filing. And that the office should make a decision on the basis of the information that it had, if there were errors that had occurred, it should acknowledge those errors and go forward.</p>\n<p>My position was that the errors that occurred here were not intentional, not an effort to deceive the Court, and that the information that the office had showed that and that that's how I believed that the office should proceed.</p>\n<p>It is disturbing that Stiegler omitted that he urged Mr. Krasner to blame Mason alone for the Concession's errors and paint her as a \"rogue ADA.\"</p>\n<p>Moreover, Stiegler's hearing testimony that the errors \"were not intentional\" cannot be squared with what he told Ernst on June 5: that Mason \"had purposefully inserted the false facts.\" These material omissions and falsehoods may well amount to perjury.  Moreover, in urging that others lie to me, Stiegler might be liable for obstruction of justice.</p>\n<p>Mr. Krasner's actions are more troubling. He did not simply learn of the Stiegler proposal; he urged the Law Division supervisors—who serve at Mr. Krasner's pleasure—to implement it and to present a false narrative to the Court.  Mr. Krasner directed that the DAO stay involved in Johnson \"to protect the office\"—which Napiorski believed also meant protecting Mr. Krasner himself—and that the Four \"not do any investigation\" \"[Mr. Krasner] didn't want people poking around in what occurred.\" He thus sought to direct the very lawyers obligated by law to correct the Concession's errors to do just the opposite. Even worse, when told that the Four believed they had to alert me, Mr. Krasner responded that \"there would be consequences for Ms. Ernst if she alerted the Court to the conflict issue,\" and that there would be consequences \"if anyone did.\" Both Wildberger and Napiorski understood Mr. Krasner to be threatening their jobs. Lin confirmed this when she told Napiorski that their \"jobs may be salvageable.\" Mr. Krasner's threat thus could amount to obstruction of justice.</p>\n<p>Moreover, as Ernst testified, she could not understand why Mr. Krasner took these actions. If he or Stiegler did so to conceal that he had a hand in making the Concession Brief's misrepresentations intentionally, this, too, could be obstruction of justice.</p>\n<p>Finally, I have also found that Mr. Krasner and Stiegler worked together to try to convince [four other attorneys in the  office] to urge the Court to accept a false narrative. This might amount to criminal conspiracy.</p>\n<p>I have thus reluctantly concluded that Philadelphia's highest law enforcement official and one of his top assistants may have violated the law. In these circumstances, with the issuance of this Memorandum, I refer the DAO, Mr. Krasner, and Stiegler to this District's United States Attorney's Office for investigation and other appropriate action.</p></blockquote>"},{"title":"Marked For Mayhem is a 4-player dungeon crawler that wants you to try to win as a team while also beating all your teammates as a player—good luck","source":"PC Gamer","author":"Joshua Wolens","url":"https://www.pcgamer.com/games/action/marked-for-mayhem-is-a-4-player-dungeon-crawler-that-wants-you-to-try-to-win-as-a-team-while-also-beating-all-your-teammates-as-a-player-good-luck/","category":"gaming","categoryLabel":"Gaming","wordCount":557,"readingTime":3,"content":"<p>Marked For Mayhem world premiere trailer - PC Gaming Show Tokyo Direct 2026 - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/uQpwAnazizE\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>Heads up, hotshot: you are being dispatched to a hostile alien planet. You will have to overcome life-or-death challenges that test your wits, physicality, and raw luck. You may die. You will almost certainly be hurt. Also, the whole thing is being televised. How many friends would you like to take with you?</p><p>If you answered three, you're in luck—Marked For Mayhem is a four-player dungeon crawler which just got a world premiere at the PC Gaming Show Tokyo Direct, and I pretty much just gave you its elevator pitch in the opening paragraph. The aim of the game is to venture to planets that would really quite like to kill you and complete bounties, beat foes, take on bosses, and even partake in a few minigames.</p><h3>Wishlist Marked for Mayhem on Steam</h3><p><strong>Release date: TBA</strong></p><p>Marked For Mayhem is a four-player dungeon crawler with an interesting premise: what if you had to deal with two essentially contradictory goals at once? Here, it means working with your team to overcome challenges while also competing with your teammates for the singular, individual winner position. I predict broken friendships aplenty. <a href=\"https://store.steampowered.com/app/2818700\" target=\"_blank\" rel=\"noopener\">Sign up for the beta</a>.</p><p><a href=\"https://store.steampowered.com/app/2818700\" target=\"_blank\" rel=\"noopener\">Wishlist now</a></p><p>To do that, you'll need to cooperate with your pals. But this is no love-in: you're competing with them too. In addition to trying to beat missions as a team, you're all competing individually to see who can nab the highest score. And if that ain't a dose of tension that will absolutely, definitely result in a few teams biffing their missions in a fit of competitive pique, I don't know what is.</p><p>We get a little of this in the trailer, where we see teams of competitors uniting to take on big robotic bosses, taking on hordes of foes in spacious arenas, and navigating environmental hazards. But they're collecting points all for themselves, too, and at the end just one of them gets to take centre stage as the singular winner.</p><p>It's an interesting wrinkle, ain't it? I rather like the idea of compelling players to deal with two contradictory impulses at once—to function as a team and to win as an individual. I'll be honest, it's the kind of thing that might lead to me and my pals not speaking to one another for months. But so long as I win, well, it's all worth it.</p><p>Check out our <a href=\"https://store.steampowered.com/curator/1850/sale/PCGamingShowTokyoDirect\" target=\"_blank\" rel=\"noopener\">Steam page</a> with all the games, updates, and DLC featured in the show. You can also read our <a href=\"https://www.pcgamer.com/gaming-industry/events-conferences/everything-announced-at-the-pc-gaming-show-tokyo-direct-2026/\" target=\"_blank\" rel=\"noopener\">roundup article</a> which includes every announcement from the show in the order it aired.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>One of Josh's first memories is of playing Quake 2 on the family computer when he was much too young to be doing that, and he's been irreparably game-brained ever since. His writing has been featured in Vice, Fanbyte, and the Financial Times. He'll play pretty much anything, and has written far too much on everything from visual novels to Assassin's Creed. His most profound loves are for CRPGs, immersive sims, and any game whose ambition outstrips its budget. He thinks you're all far too mean about Deus Ex: Invisible War.</p>"}];
