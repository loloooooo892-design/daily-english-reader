<style>

  --accent-light: #E8EDF4;

  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;

  --swap-bg-hover: #DDE2EA;
}

  :root {
    --bg: #191C22;

    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;

  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}
</style>

<script>
var articles = [{"title":"Briefly Noted Book Reviews","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/28/the-maltese-version-that-summers-end-berlin-before-and-after-jean-toomer","category":"fun","categoryLabel":"Interesting Reads","wordCount":575,"readingTime":3,"content":"<p><a href=\"https://www.newyorker.com/magazine/2026/09/28/the-maltese-version-that-summers-end-berlin-before-and-after-jean-toomer#main-content\" target=\"_blank\" rel=\"noopener\">Skip to main content</a></p><a href=\"https://www.newyorker.com/\" target=\"_blank\" rel=\"noopener\"></a><ul><li><a href=\"https://www.newyorker.com/newsletters?sourceCode=navbar\" target=\"_blank\" rel=\"noopener\">Newsletter</a></li></ul><ul><li><a href=\"https://www.newyorker.com/latest\" target=\"_blank\" rel=\"noopener\">The Latest</a></li><li><a href=\"https://www.newyorker.com/news\" target=\"_blank\" rel=\"noopener\">News</a></li><li><a href=\"https://www.newyorker.com/culture\" target=\"_blank\" rel=\"noopener\">Books &amp; Culture</a></li><li><a href=\"https://www.newyorker.com/fiction-and-poetry\" target=\"_blank\" rel=\"noopener\">Fiction &amp; Poetry</a></li><li><a href=\"https://www.newyorker.com/humor\" target=\"_blank\" rel=\"noopener\">Humor &amp; Cartoons</a></li><li><a href=\"https://www.newyorker.com/archive\" target=\"_blank\" rel=\"noopener\">Magazine</a></li><li><a href=\"https://www.newyorker.com/crossword-puzzles-and-games\" target=\"_blank\" rel=\"noopener\">Puzzles &amp; Games</a></li><li><a href=\"https://www.newyorker.com/video\" target=\"_blank\" rel=\"noopener\">Video</a></li><li><a href=\"https://www.newyorker.com/podcasts\" target=\"_blank\" rel=\"noopener\">Podcasts</a></li><li><a href=\"https://www.newyorker.com/goings-on\" target=\"_blank\" rel=\"noopener\">Goings On</a></li><li><a href=\"https://store.newyorker.com/\" target=\"_blank\" rel=\"noopener\">Shop</a></li><li><a href=\"https://festival.newyorker.com/\" target=\"_blank\" rel=\"noopener\">Festival</a></li></ul><a href=\"https://www.newyorker.com/\" target=\"_blank\" rel=\"noopener\"></a><p>“The Maltese Version,” “That Summer’s End,” “Berlin Before and After,” and “Jean Toomer.”</p><p>September 21, 2026</p><p><a href=\"https://www.amazon.com/dp/B0FR68F3FN\" target=\"_blank\" rel=\"noopener\"><strong>The Maltese Version</strong></a><em>, by Katy Simpson Smith (Farrar, Straus &amp; Giroux)</em>. The timeworn saying about there being two sides to every story gains new dimension in this probing novel, which posits that “two sides means there are two stories.” Here, readers are presented with four sides, each belonging to a different woman connected to the same man: Max, a literary translator. One of the women, Max’s mentor, Herschel, induces him to go to Malta, to work on a collection by a local poet, Ana. When his girlfriend, Leonie, can’t get ahold of him, she deploys her friend Rhoda to investigate. As their lives intersect, Smith asks, How do we make meaning, and how do we convey it?</p><p><a href=\"https://www.amazon.com/dp/0593804031\" target=\"_blank\" rel=\"noopener\"><strong>That Summer’s End</strong></a><em>, by Lee Seong-bok, translated from the Korean by Anton Hur (Knopf)</em>. Nature, loss, and longing inspire these quiet verses, which conjure a sense of the immense mysteries governing the observable world. “How do feelings come / a bough first blossoms,” the book’s opening poem, “Feeling,” begins. “Is that how feelings come / a bough first drops its blossoms / Is that how feelings fall.” Lee’s lines have the intimacy and metaphysical heft of prayer; their elegant recursions and repetitions call to mind the cycles of life, death, and rebirth. Many of his poems are titled simply, in reference to the people, objects, animals, and abstractions on which he trains his attention—“Sea,” “Mountain,” “Cat,” “Child.” Throughout, Lee’s invocations imbue his subjects with an air of divinity.</p><h2><a href=\"https://www.newyorker.com/best-books-2026\" target=\"_blank\" rel=\"noopener\">What We’re Reading</a></h2><p><em>Discover notable new fiction, nonfiction, and poetry.</em></p><p><a href=\"https://www.amazon.com/dp/B0GYFVCTGY\" target=\"_blank\" rel=\"noopener\"><strong>Berlin Before and After</strong></a><em>, by Wendy Lesser (Harper)</em>. This adoring tribute to Berlin considers the city’s history as a “cautionary mirror” for the present. Lesser, as a secular Jew born in California in the shadow of the Second World War, confesses to having once possessed an “ingrained distaste” for Germany. Yet when she began travelling there, in 2003, she developed an intense fondness for its capital. As her narrative moves from the vivid cultural ferment of the Weimar Republic to the era of Berlin’s division and on to today, it touches on figures such as Bertolt Brecht, Gerhard Richter, and Jenny Erpenbeck, and examines how Germany has memorialized the crimes perpetrated by the Nazis and the German Democratic Republic. Ultimately, Lesser’s goal is to show what other cultures can learn from the fact that, there, “the desire to wipe out the disparaged past did not prevail.”</p><p><a href=\"https://www.amazon.com/dp/0300267738\" target=\"_blank\" rel=\"noopener\"><strong>Jean Toomer</strong></a><em>, by George Hutchinson (Yale)</em>. This illuminating biography focusses on the Harlem Renaissance writer, best known for the experimental work “Cane,” from 1923, which has since become a highlight of modernist and African American literature. As Hutchinson makes clear, Toomer had a complex relationship to Blackness; his grandfather was the mixed-race son of an enslaved woman—a heritage that Toomer embraced, before pretending ignorance of it. He also rejected the overtly racialized way that his work was categorized, a view that sprang from his belief that all people belong to the same “basic human stock,” and that, as Hutchinson writes, “the so-called separate races were products of false labeling.”</p><ul><li><p>Parents disagreed on whether to vaccinate their children. Then the kids <a href=\"https://www.newyorker.com/magazine/2026/09/07/the-maha-custody-battle\" target=\"_blank\" rel=\"noopener\">got sick</a>.</p></li></ul>"},{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/the-sunday-papers-828","category":"gaming","categoryLabel":"Gaming","wordCount":1153,"readingTime":6,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays - well, very early Sunday mornings - are for watching a whole queue of hungry wild animals pass your kitchen window, because a neighbour has decided to leave a bollard-sized catfood dispenser outside the block entrance while they're away on holiday. I'm pretty sure the neighbour's cat wouldn't eat from the dispenser even if there <em>wasn't</em> a badger wedged eagerly inside it. She's an aloof and disdainful creature, who hates going near the front door because that's where those stinky humans come from.</p>\n<p>Will I try to feed the poor moggy, denied her dinner by a bunch of Farthing Wood rejects? No I will not, because I'm too busy reading articles about videogames, and things that are vaguely in the orbit of videogames. Here are a few of those articles. Look, please stop fretting about the cat. She's perfectly plump and glossy, whereas that badger looks like he hasn't had a square meal since August.</p>\n<p>Chloe Mashiter writes about <a href=\"https://chloemashitermakesthings.wordpress.com/2026/09/14/a-dangerous-castle/\" target=\"_blank\" rel=\"noopener\">the labyrinthine question of safety protocols</a> when playing a live-action role-playing game inside another live-action role-playing game.</p>\n<blockquote>The best place to start is how The Castle works: set in contemporary England, it is focused on a group of people who live as if they are a medieval court. Every player therefore has a ‘persona’ – a figure at the court – and a ‘character’ – the modern-day individual who is pretending to be that ‘persona’. (I’ll continue to use this language from the game to help distinguish between the two, with ‘player’ meaning the actual real-life person participating in the larp.)<p>\nSo, as a player, you’re pretending to be someone (the character) who is in turn pretending to be someone (the persona).</p><p>\nIt is entirely possible for you as a player to play in a way that’s safe, respectful, conscientious and suchlike, whilst your character is playing in an unsafe, abusive, exploitative, manipulative way. It is also entirely possible for The Castle as a game to be (comparatively) safe, whilst the charade (the in-world name for the pretence of the medieval court) is not.</p></blockquote>\n<p>For <a href=\"https://www.rascal.news/one-hundred-tales-of-solidarity/\" target=\"_blank\" rel=\"noopener\">Rascal</a>, Thomas Manuel writes about the 30-60 player game of Band of Blades that spanned an entire school, discussing how troupe play and the sharing of characters may become a kind of institution-building, with a closing aside on Covid and <a href=\"https://www.rockpapershotgun.com/games/game-thrones\" target=\"_blank\" rel=\"noopener\">Game of Thrones</a>.\n</p><blockquote>By asking you to refract every step of that experience through dozens of different view points and to empathize with them all to some degree, it prompts a story that is full of people who can’t be classified into good and evil, loyal and disloyal, weak and strong. It makes you appreciate diversity. You need both the person who is polite and the person who cuts to the point a little too quickly; you need both the person who follows rules and the person who does whatever it takes to get the job done. You need the person who will take up leadership and the person who is skeptical of it.</blockquote>\n<p>When was the last time you read something depressing about generative AI? Five minutes ago? Time for another helping: Futurism's Maggie Harrison Dupré and Jon Christian <a href=\"https://futurism.com/artificial-intelligence/brown-brothers-media-ai-slop-empire\" target=\"_blank\" rel=\"noopener\">report at length on Brown Brothers Media</a>, a firm who buy established journalism outlets in order to transform them into lakes of stochastic gruel.</p>\n<blockquote>Their trainwreck-laden funhouse mirror of a respectable media company has masqueraded as a purveyor of genuine news and information, enjoying enormous success at capturing reader eyes and attention through platforms that actual journalism relies on — while publishing oceans of trash that would get a real journalist fired immediately, and responding to questions with empty and contradictory platitudes about transparency, accountability, and responsible AI use.</blockquote>\n<p>It will have taken you at least another five minutes to read that, I reckon, so how about one more? Here's 404 Media reporting on <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.640396/gov.uscourts.nysd.640396.1977.1.pdf?ref=404media.co\" target=\"_blank\" rel=\"noopener\">unredacted court filings</a> in which Microsoft and OpenAI executives state rather unambiguously that generative AI is, as one put it, the “largest theft of labor in human history.” </p>\n<blockquote>OpenAI’s policy director Jack Clark wrote that the company was “creating systems that substitute for the labor of the people that define the ‘culture’ of society” and Microsoft, in a policy document, wrote that generative AI could “significantly disrupt the employment of the very people who generated the data on which the foundation model was trained […] LLMs are a product that destroys its supply chain.” OpenAI called itself an “existential threat” to news publishers, and an OpenAI software engineer testified that “no matter how prominently we show the links, users won’t click.”</blockquote>\n<p>Let's counteract the genEnnui with this sprawling bit of StreetView sleuthing about <a href=\"https://whereweretheynow.blogspot.com/2026/08/microprose.html\" target=\"_blank\" rel=\"noopener\">the early days of MicroProse</a> from Where Were They Now - a blog dedicated to revisiting the offices of some of Britain's foundational videogame developers. The write-up includes a few jolly mentions of embryonic videogame journalists, busy plying their trade in a prehistoric utopia when articles didn't have farking comments threads underneath them.</p>\n<blockquote>The UK press seemed suspicious of MicroProse in its early days. Maybe it all started to go wrong with the official company launch at the American embassy. It had been the scene of a memorable anti-Vietnam war riot in 1968 and the flat-roofed modernist building (complete with a 35 foot gilded aluminum aluminium bald eagle glowering down from the top) seemed to give flashbacks to some hacks.</blockquote>\n<p>In much the same way that a billion typewriter monkeys will eventually produce the works of Shakespeare, so it is said that if you throw enough Jank.cool writers at a videogame, you will eventually have a good article about that videogame. Not <a href=\"https://www.jank.cool/how-much-money-can-we-make-in-wardogs-on-a-0-budget/\" target=\"_blank\" rel=\"noopener\">this group write-up</a> about trying to play Wardogs without spending any money on gear, mind you. This write-up is a document of disgrace. Here's Jonty making the best of it:</p>\n<blockquote>As I begin my fourth life I get lucky with an SUV. I try touting for passengers, but apparently my zero-budget attire radiates a one-star Uber rating. Eventually somebody launches and immediately crashes a helicopter, which earns me one presumably desperate passenger and a decent sum for delivering them. I drive around for a bit and stop to drag a downed colleague off a hill and get the $500 for rubbing him back to life. I try to parlay this into a regular ambulance gig but there’s nobody around, so I resort to my established tactic of following other people to control points and getting sniped. A nice man with a Scandinavian accent bandages me up, which makes me realise that I’ve been playing for half an hour with a red-tinged screen. I tip him, warn him about the sniper, then we both go outside anyway and are killed.</blockquote>\n<p>As for this week's music: please <a href=\"https://www.youtube.com/watch?v=tq3bYPLBcA4\" target=\"_blank\" rel=\"noopener\">howl like Pink Floyd</a>, <a href=\"https://www.youtube.com/watch?v=8IM684GBNnE\" target=\"_blank\" rel=\"noopener\">hurl like Pretty Sick</a>, or <a href=\"https://www.youtube.com/watch?v=hySiB28eS5o\" target=\"_blank\" rel=\"noopener\">dance like it's Final Fantasy 9</a>. Have a good Sunday. Don't let the badgers grind you down.\n</p>"},{"title":"Why No One Wants to Date Tech Bros","source":"Wired","author":"@wired","url":"https://www.wired.com/story/tech-bros-dating-palantir-tesla/","category":"tech","categoryLabel":"Technology","wordCount":1347,"readingTime":7,"content":"<p>Engaged in a flirtatious conversation at a bar in Manhattan, 23-year-old Gary stood with a Guinness in hand as he explained to a woman why he took an engineering job at <a href=\"https://www.wired.com/tag/palantir/\" target=\"_blank\" rel=\"noopener\">Palantir</a>, the data analytics company cofounded by <a href=\"https://www.wired.com/story/alex-karp-goes-to-war-palantir-big-interview/\" target=\"_blank\" rel=\"noopener\">Alex Karp</a> and Peter Thiel. Raking in a $250,000 salary would allow him to help pay off his parents’ mounting medical bills, he explained.</p><p>Gary wasn’t met with sympathy. Medical debt, the woman told him, was “not an excuse to work somewhere like <em>that</em>.” She was referring, of course, to Palantir’s <a href=\"https://www.wired.com/story/palantir-employees-are-starting-to-wonder-if-theyre-the-bad-guys/\" target=\"_blank\" rel=\"noopener\">controversial work</a> with <a href=\"https://www.wired.com/story/hhs-is-using-ai-tools-from-palantir-to-target-dei-and-gender-ideology-in-grants/\" target=\"_blank\" rel=\"noopener\">governments</a>, including the US and Israel, which use the company’s <a href=\"https://www.wired.com/story/congress-turns-up-pressure-on-dhs-over-palantirs-role-in-immigration-crackdown/\" target=\"_blank\" rel=\"noopener\">surveillance tools</a> for law enforcement and <a href=\"https://www.wired.com/story/palantir-demos-show-how-the-military-can-use-ai-chatbots-to-generate-war-plans/\" target=\"_blank\" rel=\"noopener\">military operations</a>.</p><p>Since joining the tech company in 2025, Gary has noticed that naming his employer prompts brutal reactions from prospective paramours. One woman, he says, called him the devil; another asked how he lives with himself. “Sometimes people would just straight up stop talking to me,” he says.</p><p>Recently, Gary’s buddies requested he not mention Palantir on their nights out together so as to not tank the whole group’s chances of getting laid. “I get nervous now. I don’t bring it up,” he says. (Gary, along with the other daters in this piece, have been given pseudonyms to protect against professional, if not romantic, repercussions.)</p><p>Gary has resorted to saying he works in AI. “Even that gets some pretty bad responses sometimes,” he says. His Hinge profile doesn’t mention his employer. And sometimes he makes up stories out of thin air to justify working for Palantir—like that line about the medical debt. His parents don’t have any, nor are they ill.</p><p>The bachelors of Palantir aren’t the only tech bros dealing with the industry’s <a href=\"https://www.wired.com/story/silicon-valley-doesnt-get-why-you-hate-ai/\" target=\"_blank\" rel=\"noopener\">fall from grace</a>. Take 29-year-old James, who lives in San Francisco and works at Tesla. Earlier this year, on his third date with a woman he met on Raya, she asked whether he’d voted for Donald Trump in the 2024 election. A self-described “moderate liberal or moderate progressive” who “always votes blue and always will, probably,” James was offended. “I was like, ‘Are you kidding me? Did I really give that off?’” She replied, “You work for Tesla, so I just need to check.”</p><p>James says skepticism of his politics has “come up repeatedly” in his dating life. “If I don’t immediately say that I don’t like Elon Musk, people think that I’m conservative, which is generally not something that people like in San Francisco,” he says.</p><p>Once seen as a groundbreaking leader in sustainability and a quirky futurist, Musk—recently crowned the world’s first trillionaire—is better known these days for his record-breaking donation to Trump’s 2024 campaign, being the brain behind DOGE, the dismantling of Twitter, an apparent Nazi salute, frequent ketamine use, racist tweets, and something of a breeding kink.</p><p>Long gone is the cliché of the optimistic tech guy in flip-flops and a ratty old hoodie. The tech industry is now seen as the locus of unchecked power. Meta created an environment where Russian bots could influence elections and designed features that foster social media addiction among teens. Amazon, which has been widely accused of unfair labor practices and of generating a staggering amount of waste, has aided in the collapse of small, independent businesses, while a glowed-up Jeff Bezos has become a poster child for extreme wealth inequality. More recently, the AI industry is being widely maligned over claims that it’s exacerbating job loss, pollution, and a critical-thinking crisis.</p><p>Amy Laurent, the founder of a high-end matchmaking company, has a front-row seat to the way Big Tech’s moral failings are causing problems for single, rank-and-file tech bros. Turns out their cushy paychecks often aren’t enough of an upside anymore.</p><p>“I think 10 years ago, saying you worked in tech was more about innovation, ambition, intelligence,” says Laurent. Now, many people charge Big Tech with “causing the breakdown of society,” whether they’re worried about “AI, job displacement, wealth inequality, privacy and surveillance, content moderation, or political influence.”</p><p>Laurent says that when she pitches her tech-employed male clients to women, she acknowledges their hesitation right off the bat: “Listen, I have a great guy to tell you about. He’s such a good match for you. Now hear me out: He’s in tech.” The justifications are a new feature of her work.</p><p>Jessica Engle, a family and marriage therapist, has noticed that men in tech worry about being perceived as red-pilled. Recently, one of her clients expressed concern about having his Apple Watch visible in his dating profile photos. He wondered whether the gadget “would make him look like a tech bro” and whether it might signal a “very particular kind of toxic masculinity that we’re seeing more and more in the news.”</p><p>Engle’s client wasn’t wrong to worry. Mira, a 29-year-old Bay Area resident, says she perceives a career in tech as a possible “right-wing flag” or a sign that someone might be “manosphere-coded” or libertarian.</p><p>When 28-year-old Helen was an undergraduate at Stanford from 2016 to 2020, she viewed men in tech as guys who “stay up late and maybe have bad hygiene.” But her feelings toward them have gotten even worse over time as she’s questioned the industry’s overall impact.</p><p>Helen’s family is from the Tigray region of Ethiopia, whose population, beginning in 2020, was subjected to a prolonged period of human rights abuses. “When I started thinking about questions around genocide and the technology that kills or tracks or excludes,” Helen says, “I realized that the things these people are building are secretly, or under the surface, really nefarious, and I could not personally be with someone who is a puzzle piece in that tapestry.”</p><p>Helen herself has worked in tech. Soon after graduating from college, she accepted a job at Grammarly. But after about a year, she went to work for a mutual-aid platform and now is employed at an impact investing firm funding technology for underserved communities. Similarly, Sasha, a 31-year-old Oakland resident, had a brief stint working in AI before heading to a sustainability-focused tech company, where she is now chief of staff. In dating, when she meets someone who works or wants to work in AI, she wonders, “Does that mean that we have the same values in terms of climate and sustainability and thinking about human rights?”</p><p>Even if they do, she adds, “then the issue I have is there’s clearly this cognitive dissonance happening between what you’re working on and what you care about, which I have a really hard time accepting.”</p><p>James, the Tesla employee, confesses that he embodies plenty of tech bro stereotypes that might work against him, including “paying too much in rent” (or “just generally gentrifying”), ordering most of his meals on DoorDash (“I suck at cooking”), and not “really contributing to the culture of the city that much.”</p><p>“I really fit the mold so much that it’s sort of like, I have to at least be self-aware of it,” James says.</p><p>The pushback James gets IRL makes him wonder how much more happens behind screens. “There’s less visible rejection because you kind of get prefiltered out,” he says. “If I were to write on the dating app that I work at Tesla, I think it would just cut a lot of people right away.” His experience seems to bear this out. On his Hinge profile, he disclosed his place of work; on Raya he decided against it. He says he’s had more success on Raya.</p><p>In fact, about four months after joining Raya, he met someone. His new girlfriend had recently moved to the Bay Area for medical school and, before dating James, had managed to stay insulated from tech culture. “I was talking to my now girlfriend, and she was like, ‘Yeah, I feel like I’ve gotten lucky. I didn’t really know what the tech bro stereotype is.’”</p><p>“I was like, ‘Thank God. I don’t think I would have made it if you did.’”</p><p><em>Let us know what you think about this article. Submit a letter to the editor at</em> <em><a href=\"https://www.wired.com/cdn-cgi/l/email-protection#402d21292c0037293225246e232f2d\" target=\"_blank\" rel=\"noopener\">[email protected]</a>.</em></p>"},{"title":"UK anti-migrant activist arrested for suspected criminal damage and endangerment","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/uk-anti-migrant-activist-arrested-for-suspected-criminal-damage-and-endangerment/","category":"law","categoryLabel":"Law","wordCount":502,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/uk-anti-migrant-activist-arrested-for-suspected-criminal-damage-and-endangerment/#\" target=\"_blank\" rel=\"noopener\">UK anti-migrant activist arrested for suspected criminal damage and endangerment</a>\n</strong><p>UK police <a href=\"https://www.hampshire.police.uk/news/hampshire/news/news/2026/september/man-arrested-after-boat-damaged-in-english-channel/\" target=\"_blank\" rel=\"noopener\">confirmed</a> the arrest of a far-right agitator on Thursday, on suspicion of <a href=\"https://x.com/MittensOff/status/2102435073492742525?ref_src=twsrc%5Etfw%7Ctwcamp%5Etweetembed%7Ctwterm%5E2102435073492742525%7Ctwgr%5Eabb9f6b8fdb124ac9ea72b1159fbdef27fc9c700%7Ctwcon%5Es1_&amp;ref_url=https%3A%2F%2Fwww.lbc.co.uk%2Farticle%2Fdanny-tommo-slashes-small-boat-channel-5HjdhpK_2%2F\" target=\"_blank\" rel=\"noopener\">destroying</a> a migrant boat on the English Channel and endangering the safety of a French coastguard official.</p><p>Daniel Thomas, also known as “Danny Tommo,” is an “anti-migrant activist” and associate of <a href=\"https://www.jurist.org/news/2025/09/london-unite-the-kingdom-rally-clashes-with-police/\" target=\"_blank\" rel=\"noopener\">Tommy Robinson</a>, the British “far-right and <a href=\"https://www.jurist.org/news/2024/07/far-right-activist-tommy-robinson-arrested-under-terrorism-act-2000-following-protest/\" target=\"_blank\" rel=\"noopener\">anti-Islam activist.”</a>  On Tuesday, Thomas allegedly tailed two small inflatable dinghy boats in the English Channel for several hours, as rescuers were working to assist in disembarking asylum seekers from France to the UK. Livestream <a href=\"https://x.com/MittensOff/status/2102435073492742525?ref_src=twsrc%5Etfw%7Ctwcamp%5Etweetembed%7Ctwterm%5E2102435073492742525%7Ctwgr%5Eabb9f6b8fdb124ac9ea72b1159fbdef27fc9c700%7Ctwcon%5Es1_&amp;ref_url=https%3A%2F%2Fwww.lbc.co.uk%2Farticle%2Fdanny-tommo-slashes-small-boat-channel-5HjdhpK_2%2F\" target=\"_blank\" rel=\"noopener\">footage</a> shows Thomas reaching over to the dinghy; stabbing and slashing its sides repeatedly with a small knife while a rescue worker stands onboard.</p><p>Hampshire and Isle of Wight Constabulary announced that Thomas was arrested on Wednesday night on suspicion of the following offenses: destroying ships or fixed platforms or endangering their safety under<a href=\"https://www.legislation.gov.uk/ukpga/1990/31/section/11\" target=\"_blank\" rel=\"noopener\"> Section 11 of the Aviation and Maritime Security Act 1990,</a> criminal damage and criminal damage with intent to endanger life contrary to the <a href=\"https://www.legislation.gov.uk/ukpga/1971/48\" target=\"_blank\" rel=\"noopener\">Criminal Damage Act 1971,</a> and conduct endangering ships, structures, or individuals under <a href=\"https://www.legislation.gov.uk/ukpga/1995/21/section/58\" target=\"_blank\" rel=\"noopener\">Section 58 of the Merchant Shipping Act 1995.</a></p><p>Thomas called on supporters to protest the arrival of the asylum seekers in Gosport, Hampshire, where he mistakenly believed they would arrive. According to Hampshire and Isle of Wight Constabulary, protesters <a href=\"https://www.hampshire.police.uk/news/hampshire/news/news/2026/september/police-and-partners-respond-to-small-boat-crossing-in-the-english-channel/\" target=\"_blank\" rel=\"noopener\">became hostile</a> towards officers, and six arrests were made, including for suspicion of assaulting an emergency worker. Three people <a href=\"https://www.hampshire.police.uk/news/hampshire/news/news/2026/september/three-charged-following-incidents-in-gosport-on-22-september/\" target=\"_blank\" rel=\"noopener\">have since been charged. </a></p><p>In a <a href=\"https://rnli.org/news-and-media/2026/september/22/rnli-statement-on-channel-incident\" target=\"_blank\" rel=\"noopener\">statement,</a> the Royal National Lifeboat Institution (RNLI) said that the small boat crossing had been “underway for 36 hours”, and the RNLI were deployed to support in the case of a “catastrophic failure of the dinghy and people ending up in the water.” The HM Coastguard then directed the RNLI to “remove people from their dinghy” and transfer them to a Border Force vessel “out of concern for their safety and their deteriorating health”.</p><p>The RNLI emphasized the danger of the English Channel, which is made even more perilous by “overcrowded and unseaworthy boats”. It expressed that its role was to save lives, not to “question whether people have the right to be in the UK”.</p><p>Migration and asylum in the UK continues to be a contentious subject. Home Secretary Shabana Mahmood recently introduced the<a href=\"https://bills.parliament.uk/bills/4254\" target=\"_blank\" rel=\"noopener\"> Immigration and Asylum Bill</a> to parliament, which seeks to make changes to the asylum system and UK migration rules. Notably, if approved, asylum seekers would be required to repay the government for asylum support received, and would narrow the scope of <a href=\"https://www.legislation.gov.uk/ukpga/1998/42/schedule/1/part/I/chapter/7\" target=\"_blank\" rel=\"noopener\">Article 8</a> of the Human Rights Act 1998.</p><p>It also seeks to change how <a href=\"https://www.gov.uk/government/collections/modern-slavery\" target=\"_blank\" rel=\"noopener\">modern slavery</a> cases are assessed. Rights groups such as Amnesty International have <a href=\"https://www.amnesty.org.uk/knowledge-hub/all-resources/immigration-and-asylum-bill-second-reading-briefing-house-of-commons/\" target=\"_blank\" rel=\"noopener\">criticized</a> the bill, stating that it continues a disastrous deterrence strategy that prevents people from seeking safe asylum. The Joint Council for the Welfare of Immigrants (JCWI) <a href=\"https://jcwi.org.uk/updates/stop-the-immigration-and-asylum-bill/\" target=\"_blank\" rel=\"noopener\">opposed</a> the bill, and <a href=\"https://righttoremain.org.uk/the-immigration-and-asylum-bill-2026-what-we-know-so-far/\" target=\"_blank\" rel=\"noopener\">argued</a> that it is <a href=\"https://www.lawsociety.org.uk/topics/immigration/immigration-and-asylum-bill\" target=\"_blank\" rel=\"noopener\">incompatible</a> with human rights standards.</p><p>Daniel Thomas remains in police custody at this time.</p>"}];

}

function nextArticle() {

  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
