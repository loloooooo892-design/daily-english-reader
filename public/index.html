<script>
var articles = [{"title":"Defendant's Refusal to Identify Herself Leads to Recommended Default Judgment Against Her","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/08/07/defendants-refusal-to-identify-herself-leads-to-recommended-default-judgment-against-her/","category":"law","categoryLabel":"Law","wordCount":1302,"readingTime":7,"content":"<p>From today's Report and Recommendations by Magistrate Judge Elizabeth A. Staffordt (E.D. Mich.) in yesterday's <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.mied.381801/gov.uscourts.mied.381801.175.0.pdf\" target=\"_blank\" rel=\"noopener\">Evans v. Robertson</a></em>:</p>\n<blockquote><p>Plaintiff Sybrena Evans, proceeding pro se, sues Defendant Danielle Robertson … for copyright infringement, defamation, fraud, and harassment. {Robertson made a special appearance as a Jane Doe stating that \"Danielle Robertson\" is an online alias and not her legal name. For the sake of clarity, the Court will nevertheless refer to this individual as Robertson.}</p>\n<p>Evans moved for an order requiring Robertson to show cause why she should not be held in contempt and sanctioned for disobeying two of Judge Levy's orders to disclose her identity. The Court granted the motion and Robertson was ordered to show cause why she should not be sanctioned. Robertson responded that the Court should defer enforcement of Judge Levy's orders until it resolves the viability of Evans's claims.</p>\n<p>\"The orderly and expeditious administration of justice by the courts requires that an order issued by a court with jurisdiction over the subject matter and person must be obeyed by the parties until it is reversed by orderly and proper proceedings.\" Because of this bedrock principle, Robertson should be sanctioned with a default judgment for her violations of Judge Levy's orders….</p>\n<p>Evans, a Michigan resident, alleges that Robertson engaged in a pervasive campaign of harassment and cyberbullying on her social media platforms and websites from 2022 to 2024. Robertson allegedly posted YouTube videos calling Robertson [perhaps meaning Evans? -EV] \"Teddy Bundy\" and falsely accusing her of stalking and other crimes. Evans also alleges that Robertson published deepfake pornography using Evans's likeness. In a YouTube video, Robertson allegedly discussed Evans's divorce and published documents from those proceedings, and encouraged her followers to likewise post content harassing Evans.</p></blockquote>\n<blockquote><p>Posing as Evans's family member, Robertson allegedly made several fraudulent calls to local police to report concerns about Evans's mental health and animal cruelty. Officers then performed wellness checks on Evans and recorded her on bodycam. Evans claims that Robertson obtained the bodycam footage through a Freedom of Information Act (FOIA) request and published content from the footage to YouTube and her websites.</p>\n<p>Evans next alleges that Robertson conspired with an unnamed petitioner to obtain a personal protective order (PPO) against Evans, posted about a hearing on the PPO, and published the PPO on her website. Robertson then allegedly obtained content from the virtual PPO hearing that she published in a YouTube video.</p>\n<p>In social media postings, Robertson allegedly accused Evans, a physician assistant, of being found guilty of medical malpractice. Evans claims that Robertson later reported her for professional misconduct to the Michigan's Department of Licensing and Regulatory Affairs (LARA). One of the complaints was allegedly made by the PPO petitioner in coordination with Robertson, as Robertson posted about the complaint and published a letter from LARA on YouTube and her website.</p>\n<p>Robertson also urged her social media followers to file anonymous complaints against Evans and provided links to the required forms on the LARA website…. And Evans claims that Robertson created a Change.org petition accusing Evans of unethical behavior and seeking to damage her professional reputation…. The unethical behavior Robertson alleged in the petition included stalking, \"doxxing,\" and cyberbullying. LARA informed Evans that no violations could be substantiated and closed the matters.</p>\n<p>Evans has her own YouTube channels, \"Unwinewithteddy\" and \"RunTellThatToo.\" Robertson allegedly impersonated others to file hundreds of false copyright and privacy complaints with YouTube, claiming ownership of Evans's content. YouTube terminated Evans's accounts but later reinstated some videos after finding the claims invalid. Robertson also allegedly filed multiple copyright infringement claims against Evans with the Copyright Claims Board (CCB).</p>\n<p>Three of Evans's claims survived Robertson's motion to dismiss:</p>\n<p>(1) copyright infringement stemming from the use of Evans's likeness;</p>\n<p>(2) defamation stemming from Robertson's alleged posts about Evans's professional misconduct, false reports to police, and posts including bodycam footage; and</p>\n<p>(3) cyberbullying and harassment stemming from Robertson's posts about Evans's divorce.</p>\n<p>In September 2025, the Court considered several motions involving Robertson's positions that she should be allowed to proceed anonymously and that the action should be dismissed because Evans failed to serve her properly or use her legal name. Finding that Robertson may not use her anonymity \"simultaneously as a shield to protect her privacy and as a sword to undermine the litigation,\" the Court ordered alternate service on Robertson's email address and that Robertson disclose her legal name and postal address…. Robertson did not comply and instead moved for reconsideration …. Judge Levy struck Robertson's motion for reconsideration because it contained a factitious citation and ordered Robertson to disclose her legal name and postal address …. Again, Robertson did not comply….</p></blockquote>\n<p>The court therefore awarded default judgment against Robertson:</p>\n<blockquote><p>[1.] Robertson has stubbornly disobeyed Judge Levy's orders for her to disclose her identity. And a court order \"'must be obeyed by the parties until it is reversed by orderly and proper proceedings.'\" Even if an order is erroneous, the remedy is to appeal unless enforcement of the order is stayed. Judge Levy twice ordered Robertson to disclose her identity, and Robertson defied both orders….</p>\n<p>To justify her continued defiance, Robertson repeats her argument from her October 2025 motion to dismiss that the orders to disclose her identity violate the First Amendment protections against \"unmasking\" anonymous online critics. Robertson is correct that \"[a]n author's decision to remain anonymous is an aspect of the freedom of speech protected by the First Amendment.\" In litigation involving anonymous internet users, courts have weighed the validity of the claims and the plaintiff's need to uncover the users' identities against the First Amendment's protection of anonymous speech.</p>\n<p>But Judge Levy's determination that Robertson must disclose her identity is the law of the case and may not be revisited absent extraordinary circumstances…. And Robertson waived her First Amendment argument \"by failing to assert it [i]n any of [her] previously-filed briefs\" about the anonymity issue….</p>\n<p>Robertson did raise the First Amendment argument in her motion for reconsideration of Judge Levy's order overruling the objections and directing Robertson to disclose her identity. But Judge Levy struck that motion because Robertson included a factitious citation in support of her First Amendment argument, despite previous sanctions and many warnings that such citations would not be tolerated. Forfeiting her First Amendment argument was a justified consequence of Robertson's reckless litigation practices.</p>\n<p>In the order to show cause, the Court explained that Robertson must follow Judge Levy's orders even if they are later found erroneous and that Robertson had waived her First Amendment arguments. Still, Robertson has continued to stubbornly violate the orders, relying on her private determinations about what the law requires. Her stubborn disobedience amounts to bad faith….</p>\n<p>The Court thus <strong>RECOMMENDS </strong>that a default judgment be entered against Robertson. \"Once default is entered, the defaulting party is deemed to have admitted all of the well-pleaded factual allegations in the complaint regarding liability, including jurisdictional averments.\"</p>\n<p>Subsequent proceedings will be necessary to decide the remedies to which Evans is entitled. In her complaint, she requests actual and punitive damages, injunctive relief, and attorney's fees and costs. An evidentiary hearing should be held to determine the amount of damages. But because no factual issues remain in dispute, an evidentiary hearing is not needed to determine Evans's entitlement to injunctive relief.</p>\n<p>Still, Evans should be required to better outline the injunctive relief that is supported by her factual allegations and by the remaining claims for relief. She asks to Court to prohibit Robertson \"and any co-conspirators from engaging in further conspiratorial acts, including fraud, harassment, or defamatory conduct against the plaintiff of her associated entities.\" But no conspiracy or fraud claims remain, and her requests for injunctive relief are too broadly written. Thus, Evans should be required to specify the injunctive relief to which she is entitled stemming from her existing claims….</p></blockquote>"},{"title":"The Electability of Abdul El-Sayed","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/election-2026/the-electability-of-abdul-el-sayed","category":"fun","categoryLabel":"Interesting Reads","wordCount":1227,"readingTime":7,"content":"<p>In late July, when Michigan’s governor, Gretchen Whitmer, endorsed Haley Stevens in the state’s <a href=\"https://www.newyorker.com/news/election-2026/michigan-is-the-next-big-test-for-the-democratic-party\" target=\"_blank\" rel=\"noopener\">Democratic Senate primary</a>, it was unclear what the move meant. Was Whitmer’s intervention an indication of the Democratic establishment’s confidence that Stevens, a <a href=\"https://www.newyorker.com/news/the-lede/what-does-it-even-mean-to-be-a-moderate\" target=\"_blank\" rel=\"noopener\">centrist</a> congresswoman who’d struggled to gain traction for much of the campaign, was now, just eleven days before the vote, on a path to victory, and just needed a final push to get over the finish line? Or was it a sign that the establishment was panicked that Stevens’s opponent, <a href=\"https://www.newyorker.com/news/the-new-yorker-interview/abdul-el-sayeds-argument-for-america-and-against-his-own-party\" target=\"_blank\" rel=\"noopener\">Abdul El-Sayed</a>, a liberal former public-health official, was in the lead—and that the only way to prevent him from winning was a desperate, last-minute endorsement from the most popular Democrat in the state, who’d previously pledged to remain neutral? After last night, it’s clear that the latter was the case—and that the Hail Mary failed.</p><p>El-Sayed’s <a href=\"https://www.newyorker.com/news/election-2026/michigan-primary-election-map-live-results\" target=\"_blank\" rel=\"noopener\">win</a> over Stevens in Michigan, while not the blowout the final polls suggested it would be, is nonetheless the insurgent left’s most important victory of 2026—a year that has already featured many successful challenges to the Party’s establishment. So it’s fitting that El-Sayed is also the most politically talented of the group. He has the charisma of Graham Platner, the populist oysterman who won Maine’s Democratic Senate primary before <a href=\"https://www.newyorker.com/culture/infinite-scroll/graham-platners-very-online-undoing\" target=\"_blank\" rel=\"noopener\">withdrawing</a> from the race after being accused of sexual assault, which he denied, but none of Platner’s skeletons: El-Sayed, a devout Muslim, does not drink, and he and his wife married when they were both in college. As a Rhodes Scholar with an M.D. and a Ph.D., El-Sayed is even more academically credentialled than Darializa Avila Chevalier, a Columbia grad and a doctoral student who unseated a five-term congressman in New York—plus, unlike Avila Chevalier, he’s a gifted orator who can think on his feet and doesn’t wilt under tough questioning. And, though some of El-Sayed’s detractors dismissed his campaign as an internet phenomenon—“I think there’s an extent to which Abdul is certainly winning in the online contest, but Haley is strongly winning with actual voters,” the Michigan congresswoman Hillary Scholten, who endorsed Stevens, said last week—El-Sayed ran an impressive real-life grassroots operation, with nearly five hundred campaign events in more than a hundred different towns and cities, that helped him overcome Stevens’s nine-to-one TV-spending advantage.</p><p>As much as El-Sayed’s win is a testament to his talents, it’s also an indictment of the Democratic establishment. Stevens was elected to Congress in 2018, but her Senate campaign was centered on the work she did in 2009, as a twenty-five-year-old factotum on the Obama Administration team that orchestrated the rescue of the U.S. auto industry. Television ads backing Stevens featured Obama almost as much as they did the candidate herself, even though Obama did not endorse Stevens’s bid. When Stevens visited the Greater Emmanuel Institutional Church of God in Christ, a Black Pentecostal church on Detroit’s west side, on a Sunday in May, the church’s pastor introduced her as “the former chief of staff, I think, for President Barack Obama.” Stevens did not correct him. “I will be honored to continue to do the work that I did alongside the great President Barack Obama,” she told the congregation.</p><p>Stevens, who benefitted from about sixty million dollars in spending from outside groups, more than half of which reportedly came from the pro-Israel lobbying group <em>AIPAC</em>, had much less to say, at the church and in her campaign, about her four terms in Congress. Although she, like pretty much every Democrat these days, described herself as a “fighter” against President Donald Trump, it remained unclear to Michigan Democrats what, exactly, her fighting had got them. El-Sayed, by contrast, spoke openly about his fight against the Democratic establishment and about how he hoped his victory in the state he called “the carotid artery of American politics” would propel a progressive candidate to capture the Party’s Presidential nomination in 2028.</p><p>The challenge now for El-Sayed is how to take that fight to the Republicans. Until last night, all of the progressive victories this year came in deep-blue congressional districts or cities, where the Democratic primary is the whole ballgame. But Michigan is a purple state—Trump won there in 2016 and 2024—and El-Sayed will have more than token Republican opposition in the general election in November. Mike Rogers, the G.O.P. nominee, is a former seven-term congressman who, two years ago, came within twenty thousand votes of winning the U.S. Senate race in Michigan. Indeed, the biggest reason that so many establishment Democrats, in both Michigan and Washington, have been so worried about El-Sayed winning the primary is that they believe a candidate as liberal as El-Sayed—who supports Medicare for All and the abolition of <em>ICE</em>, and who calls Israel’s war in Gaza a genocide—cannot win a general election. The bitter nature of the primary contest in its final weeks—with El-Sayed attacking Stevens as “a suit with a large <em>AIPAC</em> bank account” who’s unable “to string together two coherent sentences,” and Stevens accusing El-Sayed of wanting to “blame all of your problems on Jewish Americans”—has only intensified that concern. <em>AIPAC</em> will likely spend heavily on Rogers’s behalf, perhaps even more than it spent on Stevens’s. In the Democratic primary, <em>AIPAC</em>’s support for Stevens turned out to be a boon for El-Sayed—such is the lobbying group’s toxicity among Democratic voters these days—but he’s unlikely to enjoy a similar dynamic in the general election this November.</p><p>But El-Sayed is operating with a different theory of electability. He believes that, for every older Michigander whose vote he loses because of his decision to campaign with the leftist streamer <a href=\"https://www.newyorker.com/magazine/2025/03/24/the-battle-for-the-bros\" target=\"_blank\" rel=\"noopener\">Hasan Piker</a>, who has said he didn’t “have an issue” with Hezbollah and that “America deserved 9/11,” he’ll gain more support from younger Michiganders who didn’t previously vote but turned out because they heard about El-Sayed on Piker’s live stream. He believes that his bro-y campaign style, which struck some voters as sexist when employed against Stevens, will hold greater appeal when he turns it against Rogers, whom he recently dubbed a “<a href=\"https://www.newyorker.com/news/the-new-yorker-interview/abdul-el-sayeds-argument-for-america-and-against-his-own-party\" target=\"_blank\" rel=\"noopener\">beta character</a>.” “You know what I’m gonna do to that man?” he <a href=\"https://www.semafor.com/article/06/30/2026/el-sayed-unloads-on-media-democratic-criticism\" target=\"_blank\" rel=\"noopener\">boasted</a> to <em>Semafor’s</em> David Weigel last month. “By the time I’m done, his best friends are gonna look at him and think what I think, say what I say. I’m gonna define him into eternity.”</p><p>Most of all, El-Sayed believes that, in 2026, it’s no longer good politics to be identified with Washington or to play it safe. When I spoke with him in Michigan in late May, he reflected on how the political climate has changed since his first campaign, in 2018, when he unsuccessfully ran for governor. “When Trump won the first time, it felt like the record had skipped, and this time around everyone understands that it’s baked into the infrastructure of American politics,” he said. “I think we’re learning that the Michigan electorate is actually sick and tired of having two options that look virtually the same. I think they want an option that is going to take on the inherited wisdom of the establishments—both of them.” On Tuesday night, Michigan’s Democrats backed El-Sayed in his gamble that an aggressive, combative, and at times divisive approach to politics will work in a swing state. “If perfectly inoffensive was what wins Michigan,” El-Sayed told me, “Donald Trump would never have won Michigan.” ♦</p>"},{"title":"Blocky zombie survival sim Unturned releases its source code so players can build a 'lasting legacy' for the game 'regardless of the changes we make'","source":"PC Gamer","author":"Rick Lane","url":"https://www.pcgamer.com/games/survival-crafting/blocky-zombie-survival-sim-unturned-releases-its-source-code-so-players-can-build-a-lasting-legacy-for-the-game-regardless-of-the-changes-we-make/","category":"gaming","categoryLabel":"Gaming","wordCount":527,"readingTime":3,"content":"<p>Smartly Dressed Games, developer of the wildly popular free-to-play zombie survival sim Unturned, has released the game's source code for non-commercial use.</p><p>\"Unturned's source code and project files are now freely available!\" the developers wrote in a<a href=\"https://store.steampowered.com/news/app/304930/view/679628250084807263?l=english\" target=\"_blank\" rel=\"noopener\"> Steam post</a>. \"Whether you have a new feature or total conversion in mind, the sky's the limit.\"</p><p>The source code is available via<a href=\"https://github.com/SmartlyDressedGames/U3-SDK\" target=\"_blank\" rel=\"noopener\"> GitHub</a>. In an accompanying<a href=\"https://docs.smartlydressedgames.com/en/stable/u3-sdk/faq.html\" target=\"_blank\" rel=\"noopener\"> FAQ</a>, Smartly Dressed Games explained that the reason behind the release is to further support the community's creative efforts.</p><p>\"Unturned's greatest strength is our passionate community,\" the studio wrote. \"Releasing the source files allows you and other players to further expand upon the game as you see fit, building a lasting legacy for the game regardless of the changes we make or how many years pass.\"</p><p>There are some conditions for players and modders who want to use the source code. In the FAQ, Smartly Dressed Games stressed that uses for the source code \"must be strictly non-commercial\" and that \"players must be able to play and access all features and content of your mod for free.\" Some elements of code have also been removed from the game because Smartly Dressed Games doesn't have the rights to redistribute it, such as code relating to anti-cheat systems and third-party pathfinding programs.</p>\n\n<p>Unturned's Source Code Released + Adding a Heat-Seeking Missile - YouTube\n\n</p>\n\n<a href=\"https://youtu.be/CqJnkcWfmEY\" target=\"_blank\" rel=\"noopener\">Watch On </a>\n<p>The developers also note that the source code release does not mean that Unturned itself is open source, as the non-commercial license does not meet the Open Source Initiative's definition of the term. It is something that Smartly Dressed Games would like to do in the future. \"Once we finish another game and are hopefully able to re-acquire certain rights, we'd like to re-license the U3 SDK under the MIT License.\"</p><p>Unturned was one of the early products of the post-Minecraft/DayZ survival sim craze. Built by Nelson Sexton when he was still a teenager, it<a href=\"https://www.pcgamer.com/unturned-review-early-access/\" target=\"_blank\" rel=\"noopener\"> was released into Steam early access</a> in 2014, hitting 1.0 three years later.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>Nine years on, and although<a href=\"https://www.pcgamer.com/zombie-survival-classic-unturned-hits-new-highs-for-no-reason-other-than-that-its-free-and-fun/\" target=\"_blank\" rel=\"noopener\"> it's long past its peak</a>, Unturned is still going strong, attracting<a href=\"https://steamcharts.com/app/304930#1y\" target=\"_blank\" rel=\"noopener\"> thousands of players</a> every day. In April, Smartly Dressed Games released a<a href=\"https://store.steampowered.com/news/app/304930/view/502855621608997213?l=english\" target=\"_blank\" rel=\"noopener\"> huge update</a> that overhauled the game's California map. Developed over six years, the update increased the size of the map sixfold, added over 100 quests and significantly expanded Unturned's endgame.</p>\n\n<p>Rick has been fascinated by PC gaming since he was seven years old, when he used to sneak into his dad's home office for covert sessions of Doom. He grew up on a diet of similarly unsuitable games, with favourites including Quake, Thief, Half-Life and Deus Ex. Between 2013 and 2022, Rick was games editor of Custom PC magazine and associated website <a href=\"http://bit-tech.net/\" target=\"_blank\" rel=\"noopener\">bit-tech.net</a>. But he's always kept one foot in freelance games journalism, writing for publications like Edge, Eurogamer, the Guardian and, naturally, PC Gamer. While he'll play anything that can be controlled with a keyboard and mouse, he has a particular passion for first-person shooters and immersive sims.</p>"},{"title":"Top Ulta Beauty Promo Codes: 50% Off","source":"Wired","author":"@wired","url":"https://www.wired.com/story/ulta-coupon/","category":"tech","categoryLabel":"Technology","wordCount":1201,"readingTime":7,"content":"<p>At Ulta Beauty, you can stock up on skincare, makeup, and haircare, then head to the salon to get your brows shaped, your hair styled, and your ears pierced, all in a single visit. You’ll find brands like Dior, Estée Lauder, and Gucci alongside more affordable favorites and drugstore staples. Many locations house a Benefit Cosmetics BrowBar, so you can sample products and book an in-store brow service in the same visit. Ulta’s return policy is very forgiving, allowing you to bring back “gently used” products within 30 days for a full refund. Add in its weekly sales, the <a href=\"https://www.ulta.com/promotion/21-days-of-beauty\" target=\"_blank\" rel=\"noopener\">21+ Days of Beauty Event</a>, and stackable Ulta coupons, and you’ll rarely pay full price.</p><p>I’ve tested a wide range of beauty products that are sold at Ulta, from <a href=\"https://www.wired.com/gallery/best-hair-dryers/\" target=\"_blank\" rel=\"noopener\">hair tools</a>, r<a href=\"https://www.wired.com/story/best-red-light-therapy-for-hair-growth/\" target=\"_blank\" rel=\"noopener\">ed-light therapy tools for hair growth</a>, and <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">LED devices</a> to <a href=\"https://www.wired.com/story/how-do-pimple-patches-work/\" target=\"_blank\" rel=\"noopener\">pimple patches</a> and <a href=\"https://www.wired.com/gallery/the-best-lip-balms/\" target=\"_blank\" rel=\"noopener\">lip balms</a>. Here’s how to shop smarter, with the best Ulta promo codes and Ulta coupons to keep on your radar.</p><h2>15% Off at Ulta Beauty When You Download the App</h2><p>If you already shop at Ulta often, downloading (and using) the <a href=\"https://www.ulta.com/company/app\" target=\"_blank\" rel=\"noopener\">Ulta app</a> is one of the best ways to save money on purchases you were planning to make. All you need to do is download the Ulta app (fo’ free), by texting \"Beauty\" to 95637. From there, you’ll get an Ulta promo code <strong>APP15</strong> sent to you to use for 15% off your next purchase. Plus, with the Ulta app, you’ll be able to virtually try on thousands of beauty products with GLAMlab, use the Ulta Foundation Matcher to virtually match your skin tone to find your best shade match, and an AI-powered analysis of your skin to get customized skin care recommendations.</p><p>Plus, <a href=\"https://www.ulta.com/company/app\" target=\"_blank\" rel=\"noopener\">Ulta app</a> members get exclusive in-app features, offers, and deals. You’ll also be able to monitor your membership rewards status and points, and get notified of app-exclusive deals, discounts, brand offers and more. And with the handy bar code scanner, shopping has never been easier—you can scan any product’s bar code to see information on ingredients and product reviews. When you’re an Ulta member, you’ll get 1 point for every $1 spent and birthday perks.</p><p>Conair</p><h3>InfinitiPRO by Conair SmoothWrap Hair Dryer</h3><p>Dyson</p><h3>Supersonic r Hair Dryer</h3><h2>Ulta Promo Code: Get 10% Off When You Sign Up</h2><p>You can instantly score 10% off your order when you sign up for text alerts. Text “ULTA” to 95637, and you should receive a one-time use discount code for online purchases only. There are a couple of brand exclusions, like Chanel, and you can’t use the discount on Black Friday deals, so make sure to <a href=\"https://www.ulta.com/promotion/coupon\" target=\"_blank\" rel=\"noopener\">read the fine print</a>.</p><p>Shark</p><h3>CryoGlow LED Face Mask</h3><p>Shark</p><h3>SpeedStyle Pro Flex Hair Dryer System</h3><h2>Use Ulta Beauty Rewards for Ulta Discounts</h2><p>The <a href=\"https://www.ulta.com/rewards/all\" target=\"_blank\" rel=\"noopener\">Ulta Beauty Rewards program</a> is free to join and offers many perks with minimal effort required from you. First, you earn points for every dollar you spend. The program has multiple tiers: as a standard member, you earn 1 point per dollar; platinum members earn 1.25 points, and diamond members earn 1.5 points. To qualify for platinum status, you need to spend $500 per year, and diamond members must spend $1,200 annually.</p><p>These points can be redeemed for discounts, and the best part is that they do not expire. (To activate your rewards, you need to download the Ulta Beauty app.) Here's how the points translate into savings: 100 points gives you $3 off, 250 points offers an $8 discount, 500 points saves you $17.50, and 750 points grants you $30 off.</p><p>During your birthday month, you get even more special perks. These include earning extra points on every qualifying purchase, a free gift, and a $10 coupon exclusively for platinum and diamond members. Some other benefits include exclusive beauty deals, early access to sales, and full-size gifts for diamond members. Diamond members also get a $25 discount on beauty services and free shipping on orders over $25.</p><p>La Roche-Posay</p><h3>Effaclar Duo+M Multi-Target Blemish Patches</h3><p>CeraVe</p><h3>Hydrocolloid Blemish Patches</h3><h2>Score Trending Beauty Tech at Ulta</h2><p>Always check Ulta's Featured Deals and Sale pages, as they regularly update with new offers. In addition to makeup and skincare products, Ulta also provides discounts on <a href=\"https://www.wired.com/gallery/best-hair-dryers/\" target=\"_blank\" rel=\"noopener\">hair care tools</a> and <a href=\"https://cna.st/affiliate-link/VDkSwjASRpoWbh7jFFq7H1EGwVjShzD22fmppo1hRHX5MmtKR7XuHmt35Nnxq7CjQXNzWVwfAkb92r5CaCoVFqfrVhBWSb1MWgjVtfWakNqVKXqKNSDdFE7ALJaxYcsb66hWjTBRSYeBXiND9ti9CrgRMNbL7WhCZGansNqpTA1YPwdaD5wymbBnzfgRWWvaCBpx4TqkipBkd5mRFn8dTRgVstgoTo1uqvVd13juDoXmSqT5yTMefZdKbP3KXjnQtXXZLkufk7XSZ36a6atbo\" target=\"_blank\" rel=\"noopener\">wellness technology</a> that we have tested and recommended.</p><p>Look out for <a href=\"https://www.wired.com/gallery/best-dyson-hair-tools/\" target=\"_blank\" rel=\"noopener\">Dyson products</a>, which frequently go on sale. Some of my favorites include the <a href=\"https://www.wired.com/review/dyson-supersonic-nural-hair-dryer/\" target=\"_blank\" rel=\"noopener\">Supersonic Nural</a>, the <a href=\"https://www.wired.com/review/dyson-airwrap-co-anda2x/\" target=\"_blank\" rel=\"noopener\">Airwrap i.d. Multistyler</a>, and the <a href=\"https://www.wired.com/review/dyson-airstrait-straightener/\" target=\"_blank\" rel=\"noopener\">Airstrait Wet-to-Dry Straightener</a>. If you're looking for a more affordable option, <a href=\"https://www.wired.com/review/shark-flexstyle-drying-and-styling-system/\" target=\"_blank\" rel=\"noopener\">Shark's FlexStyle Air Styling System</a> and <a href=\"https://www.ulta.com/p/speedstyle-pro-flex-professional-performance-high-velocity-hair-dryer-system-pimprod2048807\" target=\"_blank\" rel=\"noopener\">SpeedStyle Pro Flex Hair Dryer</a> (currently on sale) are also often discounted. Other hair stylers we've noticed on these pages include the <a href=\"https://www.wired.com/review/loreal-professionnel-airlight-pro/\" target=\"_blank\" rel=\"noopener\">L'Oreal Professionnel AirLight Pro</a>, <a href=\"https://www.ulta.com/p/aire-iq-intelligent-hair-dryer-pimprod2050646\" target=\"_blank\" rel=\"noopener\">T3 Aire IQ Intelligent Hair Dryer</a> (currently on sale), <a href=\"https://www.ulta.com/p/duet-style-2-in-1-hot-air-styler-pimprod2037487\" target=\"_blank\" rel=\"noopener\">Ghd Duet Style 2-in-1 Hot Air Styler</a> (currently on sale), and the <a href=\"https://www.ulta.com/p/smart-x-dryer-diffuser-set-pimprod2039347\" target=\"_blank\" rel=\"noopener\">Bio Ionic Smart-X Dryer</a>.</p><p>If you’re shopping for <a href=\"https://www.wired.com/story/led-face-masks-and-red-light-therapy/\" target=\"_blank\" rel=\"noopener\">red light therapy masks</a>, keep an eye out for sales, as they frequently occur. My personal favorite is the <a href=\"https://www.wired.com/review/shark-cryoglow/\" target=\"_blank\" rel=\"noopener\">Shark Beauty CryoGlow LED Mask</a>, which often sells out, likely because of its cooling pads for the under-eye area. The <a href=\"https://cna.st/affiliate-link/3pKFbPPXy9yLiFKKrnLYTKWBQVjzZMwjSpmBgHH2pyATWwF2bNuVeBkEJcExHLHAa2yZQhAuHNWNncCjkqQBARkW4xq9HYR7sy2H3dB7KiwbZcJEbh71Ws5ZMZ1RdVDabTbzXwXvQf51X4FU3h2udTRr8G8jD8ZMLKz796NSuHEVKwGmhQPhAESGsNfj8Tb6Ce8Zyps89jkSEj3ZvsCiT483QgoD5UvMEym988gaLqcdgjV3oFSZfrLWFQ2FrwpsJYPb2KkHx8reaujXzvggyAuTYicp85Z5xExQAz319k6PmAqqyVwHpQnhLkNxzwCdpcJh\" target=\"_blank\" rel=\"noopener\">Therabody TheraFace Mask Glo</a> and the <a href=\"https://cna.st/affiliate-link/6exhfamEeE8bkUyUzd1bW5vQN2U7Lwc6nwYmBqAjfe2yM9xKFeytwMN423RrcUR4yX9ixnd1s914BrFZKohJA4e9snpHvn4Mauo3pTmoijx57YefgAT8x5cCkhWdf6nHKZ28VdofKALAHzHvK8xrFjaH8TyWxkvHn6MVVv9i7GcovCWK8zL1xK6M54oKrsYpBjjbcGdw2FnYiyUvTJC3MVXfaJnptAQ5w4DEKx8mYQ4E6jW5eujUVRkDgQWhHicJBT8g2hiQJF2UUJGhR6LhX6roiyXQb4Wcs97EyRjtvufWqQ1X6qn4uxS2bK5RP\" target=\"_blank\" rel=\"noopener\">Solawave 4-in-1 Radiant Renewal Wand</a> are also currently available at a discount.</p><p>Solawave</p><h3>4-in-1 Radiant Renewal Wand</h3><p>Therabody</p><h3>TheraFace Mask Glo</h3><h2>Unlock Free Standard Shipping on Your $35 Purchase</h2><p>All online customers qualify for free standard shipping on purchases of $35 or more. It's easy to rack up this amount at Ulta, even with all the discounts.</p><p>Aquaphor</p><h3>Lip Repair Ointment</h3><p>BabylissPro</p><h3>Nano Titanium Prima3000 Ionic Hair Straightener</h3><h2>What We’ve Learned From Tracking Ulta Beauty Coupon Deals</h2><p>We’ve been doing this awhile, and we’ve become pretty good at tracking and determining the best offers available, and bringing them to you, of course. We check Ulta often, testing the Ulta coupon codes ourselves and bringing them to you here weekly (if not more often). These are often deals for things like 20% off certain beloved brands or beauty categories, as well as BOGO deals.</p><p>GHD</p><h3>Chronos Max</h3><p>Chi</p><h3>Lava Ministyler</h3><h2>FAQs</h2><p>Why Is My Ulta Beauty Coupon Not Working?</p><p>One of the best ways to determine if your Ulta coupon isn’t working is to check the fine print—oftentimes, deals end on specific dates, so make sure you’re within that time frame. Also, make sure that the product you want to buy is included in the sale, as many items and brands aren’t eligible on certain offers. If you still aren’t sure why, reach out to support for further help.</p><p>Does Ulta Offer Student, Military, or Healthcare Worker Discounts?</p><p>Ulta doesn't currently have a standing student, military, or healthcare discount program. Savings mainly come through Ultamate Rewards and sale events instead.</p><p>How Do Ulta Reward Points Work?</p><p>Members earn 1 point per $1 spent (2 points/$1 for Diamond and Platinum tiers). Points convert to redeemable dollars off, usually in $3–$50 increments, and typically expire at year-end if unused.</p><p>Are Ulta Coupons Stackable?</p><p>Ulta allows one coupon per transaction, though reward point redemptions can often be combined with a separate promo code. Coupons usually can't be combined with each other.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
