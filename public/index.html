*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

}

.swap-btn:disabled {

}

.swap-counter {

.article-body h3 { font-size: 1.175rem; }

.article-body a {

.footer a {

<script>
var articles = [{"title":"First Circuit Refuses to Stay District Court Injunction Against Trump's Executive Order on Mail-In Voting","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/09/10/first-circuit-refuses-to-stay-district-court-injunction-against-trumps-executive-order-on-mail-in-voting/","category":"law","categoryLabel":"Law","wordCount":803,"readingTime":5,"content":"<p>I recently <a href=\"https://reason.com/volokh/2026/09/08/trumps-mail-order-ballot-order-is-an-assault-on-federalism-and-separation-of-powers/\" target=\"_blank\" rel=\"noopener\">wrote about</a> how Donald Trump's executive order seeking to curb mail-in voting is an attack on federalism and separation of powers. The Constitution gives states primary authority over election administration, subject to potential modification by congressional legislation. Today, in <a href=\"https://s3.documentcloud.org/documents/28614067/usps.pdf\" target=\"_blank\" rel=\"noopener\"><em>League of Women Voters v. Trump</em></a>, a unanimous panel of the US Court of Appeals for the First Circuit rejected the Trump Administration's motion to stay the trial court injunction blocking implementation of the US Postal Service rule implementing Trump's order. Here is a key excerpt from the ruling:</p> <blockquote><p>Appellants have not demonstrated entitlement to a stay. Most prominently, appellants have not made a strong showing that the district court erred in determining that the Final Rule is likely unlawful. The district court concluded, and we agree, that the Final Rule is likely a regulation of the manner of holding elections for members of Congress, which the Elections Clause of the Constitution assigns to the States and Congress, and not to an executive agency, such as the Postal Service, acting without congressional authorization.2 See U.S. Const. art. I, § 4, cl.  Appellants seek to avoid the constitutional problem by denying that the Final Rule regulates the manner of holding elections. The district court charitably concluded that \"[t]his denial rings hollow.\" <em>League of Women Voters of Mass. v. Trump</em>, Nos. 26-cv-11549, 26-cv-13917, 2026 WL 2620871, at *14 (D. Mass. Sep. 4, 2026). The title of the Final Rule is \"Ballot Mail for Federal Elections,\" and the Final Rule explicitly and exclusively regulates election mail. 91 Fed. Reg. at 54966, 54990-92. It requires action by the States' \"chief election official[s]\" and its policy justification is \"protect[ing] the integrity of federal elections….\"</p> <p>To the extent that appellants argue that we should read statutes authorizing the Postal Service to issue general postal regulations as supplying the necessary congressional authorization for the Final Rule, see 39 U.S.C. § 401(2) (authorizing USPS to make \"such rules and regulations, not inconsistent with this title, as may be necessary in the execution of its functions\"); id. § 401(10) (authorizing USPS to exercise \"all other powers incidental, necessary, or appropriate to the carrying on of its functions or the exercise of its specific powers\"); id. § 404(a)(1) (conferring on USPS the power \"to provide for the collection, handling, transportation, delivery, forwarding, returning, and holding of mail, and for the disposition of undeliverable mail\"), their argument likely fails. Appellants have not convinced us that it is likely that Congress would delegate constitutionally assigned tasks relevant to maintaining our electoral system to the Postal Service through the \"wafer-thin reed\" of a general grant of authority to manage the postal system. <em>Biden v. Nebraska,</em> 600 U.S. 477, 499 (2023). As appellees point out, Congress historically has been explicit in its exercise of authority under the Elections Clause when it seeks to displace the background assumption that the States will act as the primary regulator of elections. The general authority on which appellants rely here is far removed from that sort of specific congressional action.</p></blockquote> <p>I think this is exactly right. And it's notable the court cited the major questions doctrine case of <em>Biden v. Nebraska</em>, which <a href=\"https://www.cnn.com/2023/06/30/opinions/supreme-court-decision-student-loan-was-right-somin\" target=\"_blank\" rel=\"noopener\">rightly rejected</a> President Biden's effort to use vague statutory language as a tool for forgiving hundreds of billions of dollars in federal student loan debt. As explained in <a href=\"https://reason.com/volokh/2026/09/08/trumps-mail-order-ballot-order-is-an-assault-on-federalism-and-separation-of-powers/\" target=\"_blank\" rel=\"noopener\">my earlier post</a> on this issue, and by the district court, Trump's claim to be able to use the Postal Service authorization law to leverage massive changes in state mail-in ballot rules also creates a major questions issue, as control over rules for tens of millions of ballots is clearly an issue of vast political significance and (in the words of Chief Justice John Roberts in the recent <em>Learning Resources</em> tariff case) a \"highly consequential power.\"</p> <p>When the executive claims Congress has delegated it such a vast power, the major questions doctrine requires proof that the delegation is clearly stated in the relevant statute. Here, there is nothing like that.</p> <p>Trump has also<a href=\"https://www.scotusblog.com/2026/09/trump-administration-again-appeals-mail-in-ballot-dispute-to-the-supreme-court/\" target=\"_blank\" rel=\"noopener\"> asked the Supreme Court to stay the district court ruling</a>, and that court will have the final say, if it wants it. Hopefully, the justices will recognize that the district court and the First Circuit got this issue right.</p> <p>While recent events have <a href=\"https://reason.com/volokh/2026/02/08/donald-trump-makes-the-case-for-decentralized-control-of-elections-great-again/\" target=\"_blank\" rel=\"noopener\">led me</a> and some other scholars (e.g. - prominent election law specialist <a href=\"https://slate.com/news-and-politics/2026/02/trump-threatens-nationalize-elections-bongino-yikes.html\" target=\"_blank\" rel=\"noopener\">Rick Hasen</a>) to take a more favorable view of election-law federalism, there are still plausible arguments for increasing federal control over some aspects of election administration. But any such increase must be properly enacted by Congress, not unilaterally imposed by the executive. There are good reasons for the Constitution's rejection of the idea that any one person should have sweeping power to alter electoral rules - especially so close to the date of a major federal election.</p>"},{"title":"The Hearing Aid That Plays It by Ear","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/21/the-hearing-aid-that-plays-it-by-ear","category":"fun","categoryLabel":"Interesting Reads","wordCount":701,"readingTime":4,"content":"<p>In 2023, the comedian, actor, writer, and banjo virtuoso Steve Martin was walking through SoHo, followed closely by two men holding a laptop. The laptop was connected by an Ethernet cable to a 3-D-printed plastic box, and the box was connected by wires to Martin’s head. A passerby recognized him and asked whether the benefits of celebrity included having assistants literally tethered to him. But the men with the laptop weren’t working for Martin. They were engineers, and Martin was serving as a beta tester for an invention of theirs, a new kind of hearing aid. The men referred to the laptop as the “diesel-powered” version of their device, which they were hoping to refine, then shrink. Late last year, with continuing help from Martin and others, they succeeded. Their company is called Fortell. Its inaugural hearing-aid-fitting clinic is at Sixty-first and Park. Their waiting room is decorated with paintings that Martin (without assistance) brought from his collection.</p><p>“We started crude and got better,” Matthew de Jonge, one of Fortell’s four co-founders, said not long ago, in the waiting area. “The thing that’s novel about our hearing aid is that it filters out sound that, in our estimation, is unimportant and thus distracting, and it does it in real time.”</p><p>In bars, clubs, and other loud, crowded places, young people almost always hear better than old people. One reason is that the un-degraded auditory circuitry in their heads is able to zero in on the people they’re trying to hook up with while blocking out everyone else, a minor superpower known as the cocktail-party effect. “As people lose hearing, they also become less capable of listening selectively,” Cole Morris, another Fortell co-founder, said. Modern hearing aids have some ability to compensate, by using directional microphones and conventional noise cancellation. “They’re pretty good at dialling down so-called stationary sounds, like the hum of an air-conditioner,” de Jonge said. “What they have never been able to do is to separate speech you want to hear from speech you don’t, and to do it even if the speech you don’t want to hear is louder than the speech you do.”</p><p>De Jonge and Morris were roommates at Princeton, and later de Jonge was among the creators of Butterfly iQ, an A.I.-enhanced handheld medical-imaging device that is now one of the best-selling sonogram systems in the world. (It was used on the International Space Station to evaluate an astronaut who was later evacuated, and it has appeared in a supporting role in episodes of “The Pitt.”) Early in the Butterfly project, the team received an e-mail from a professor at Harvard, who told de Jonge that he was working with the best physics-Ph.D. student he’d ever had. “He said the guy’s field was quantum optics, whatever that is, but that what he really wanted to do was A.I. for health care,” de Jonge recalled. “He said the guy had no experience in either A.I. or health care but asked if I would hire him. I said yes.”</p><p>The physics Ph.D. was Igor Lovchinsky, a Russian émigré. “There are special Russian music schools, and I was admitted to one of them when I was four,” he said. He moved to the United States with his family, won a scholarship to Juilliard, and became a celebrated concert pianist, before switching to physics. He designed Butterfly’s neural networks, then did the same for Fortell, of which he is also a co-founder. The fourth co-founder, Andrew Casper, designed the custom chips used in both projects. Fortell’s hearing aids sell for sixty-eight hundred dollars per pair, about average for the top of the line.</p><p>Paul Krawitz is a sixty-seven-year-old retired ophthalmic surgeon in Cold Spring Harbor, on Long Island. He first realized he had a hearing problem ten years ago. “When my bedroom windows were open, I could hear the crickets in my yard if my right ear was on the pillow, but not when I rolled over,” he said. He tried six different hearing aids, but wasn’t happy with any of them. “I was a pain in the ass as an audiology patient,” he said. “I wanted cognitively transparent improvement in my hearing, not just an increase in volume.”</p>"},{"title":"What are we all playing this weekend?","source":"Rock Paper Shotgun","author":"Julian Benson","url":"https://www.rockpapershotgun.com/what-are-we-all-playing-this-weekend-398","category":"gaming","categoryLabel":"Gaming","wordCount":546,"readingTime":3,"content":"<p>Well? Do tell!</p>\n    \n  \n  \n  \n  \n            <p>This is the first Saturday in a month I've woken up without a blocked nose or a mucus-hurling cough. Trips to Spain, Sweden, and Germany in quick succession and loaded on top of a cross country bike ride may have been a touch to much for my ageing body.</p>\n<p>Still, at last, I am well. In body, if not in spirit. So, better start playing some games then, right?</p>\n<p>Here's what the team are up to this weekend.</p>\n<p><strong>James</strong>I'm trying to get into the Wardogs closed beta, on the grounds that - I'm told - you can ignore the gruesome gunshooty aspects of war and just spend your time ferrying crates to and from the frontlines in an old truck. Sometimes it's nice just to get away from it all.</p><p><strong>Edwin</strong>I've managed to persuade the Gamer Network overlords to loan me a gaming laptop for reviews, so I'll be trying out various swankier 3D things on that, including Blood of Dawnwalker. I also need to finish <a href=\"https://www.rockpapershotgun.com/games/pathologic-3\" target=\"_blank\" rel=\"noopener\">Pathologic 3</a>. I'm open to suggestions for recent, higher-end fare. Are they still making those Silent Hill games? What about Jak &amp; Daxter?</p>\n<p><strong>Mark</strong>No games for me after two vamp-heavy weekends, I'm off to sit in a field and watch cars go round in circles near Darlington. If I'm lucky, I'll manage not to burn during the 20 minutes the sun gets out, despite being daubed in factor 50.</p>\n<p><strong>Ollie</strong>The lads and I are dipping our toes back into <a href=\"https://www.rockpapershotgun.com/games/the-finals\" target=\"_blank\" rel=\"noopener\">The Finals</a>, for the first time in quite a while. It's as I remember: fun, but hectic as all hell. Hopefully remembering how everything works will allow us to take the reins a bit more this weekend.</p>\n<p><strong>Jeremy</strong>I will be playing Blood of the Dawnwalker this weekend, which I've enjoyed very much so far. Thus far, my Coen is a very gentle boy who cares for his family and will hopefully retire to the swamp to live happily ever after with his witchy wife Anca at the end of this sordid tale, but he also won't hesitate to blast back when Brencis' guards are being corrupt. I ended up killing every dude keeping Mert the Miller under lock and key, and I did it with only the starter sword and armour, because why not. They were being arseholes.</p>\n<p><strong>Callum</strong><em>A letter left on Callum's pillow reads:</em></p>\n<blockquote><p><em>Suck it, fogeys. I've gone into the woods with my youthful friends. You used to be able to do this before your bodies got tired of the earth.</em></p></blockquote>\n<p><strong>Julian</strong>I've been bookending my days with Star Wars: Zero Company this week. Edging my galactic campaign forward one turn at a time, all the while making notes for our review. I'll hopefully get the bulk of the game finished this weekend. While playing, I am also turning over how I want to talk about this game in light of EA's new owners. It's certainly not something I'm interested in ignoring. Nor the news that 80% of the studio's staff were put on furlough weeks before the game's release.</p>\n<p>When I'm not thinking about human rights abuses, I plan to bake another ginger and orange treacle tart.</p>\n\n<p><em>And you, reader dear, what are you playing this weekend…?</em></p>"},{"title":"macOS 27: new Siri takes on AI productivity apps","source":"TechCrunch","author":"Ivan Mehta","url":"https://techcrunch.com/2026/09/14/macos-27-new-siri-takes-on-ai-productivity-apps/","category":"tech","categoryLabel":"Technology","wordCount":758,"readingTime":4,"content":"<p>The two most noticeable things about <a href=\"https://www.apple.com/newsroom/2026/09/major-updates-for-apples-software-platforms-are-now-available/\" target=\"_blank\" rel=\"noopener\">macOS 27 Golden Gate</a> are the <a href=\"https://www.apple.com/newsroom/2026/09/siri-ai-a-profoundly-more-capable-and-personal-assistant-is-here/\" target=\"_blank\" rel=\"noopener\">newly updated Siri AI </a>and the design changes that make windows and icons more consistent. Siri AI offers the same features and capabilities as on iOS 27, but the Mac gives it access to different context — and new ways to be useful.</p>\n<p>Over the last few years, apps and browsers have tried to learn more about your work and what you want to use AI assistants for, so they can better answer your questions or perform tasks. Today, many top web browsers, excluding Safari, come with a sidebar-based AI assistant that can look at one or multiple open tabs to provide contextual answers. Apps like <a href=\"https://highlightai.com/\" target=\"_blank\" rel=\"noopener\">Highlight</a>, <a href=\"https://caddy.app/\" target=\"_blank\" rel=\"noopener\">Caddy</a>, and <a href=\"https://littlebird.ai/\" target=\"_blank\" rel=\"noopener\">Littlebird</a> can also look at your current window, then use that information as context for your queries.</p>\n<p>The new Siri is similar. You can invoke Siri anywhere on your screen, allowing it to answer questions about what it sees, summarize information, or provide you with more details. For instance, if you are looking at an item you want to purchase, you could ask Siri to show you alternative options too. </p>\n<p>Instead of having Siri look at the whole page, you can also select a part of the page via Apple’s new Visual Intelligence features. If you press Command + Shift + Space, you can add the currently focused window to your context for the AI. </p>\n<p>To select a specific part, press Command + Shift + 6 to bring up a crosshair selection tool. After this, you can directly ask a question or perform an image search. Based on your selection, you will also get shortcuts like “Select,” “Add to Contact,” and “Look up Location.”</p>\n\n<p>Apple has also improved Spotlight Search on Mac. You can directly ask Siri questions within Spotlight to get answers from the web, and now you can also select Applications, Files, Actions, and Clipboard to search within that particular area of context. Plus, Spotlight now allows you to run Shortcuts or look up your recent search history.</p>\n<p>Since Siri has access to your files, emails, and messages, you can search for a variety of things that you couldn’t before. In tests, I pulled up membership IDs without opening my files, asked for details about an upcoming trip, and looked up the embargo date for an upcoming news story in the works. While I don’t find Spotlight as advanced as the highly extensible Mac productivity tool <a href=\"https://techcrunch.com/2024/09/25/raycast-raises-30m-to-bring-its-mac-productivity-app-to-windows-and-ios/\" target=\"_blank\" rel=\"noopener\">Raycast</a>, it’s still much better than before.</p>\n\n<p>Siri can also now help you with reviewing documents or performing writing tasks. Since the desktop is one of the better surfaces for writing long text, I found it to be more useful here than on the iPhone. You can do things like select a block of text and ask Siri to proofread it, improve it, or rewrite it. You can also ask Siri to draft something for you within any text box.</p>\n<p>Safari, meanwhile, has added AI-powered page tracking, which is useful for keeping an eye on things like price drops, privacy policy changes, or new blog posts on pages when there is no RSS support. Plus, Safari can automatically organize tabs based on topics, which is handy.</p>\n\n<p>One small but neat new feature is that when you download a file or rename it, the system suggests a name based on context in the Finder or when you’re saving the document.</p>\n<p>Apart from Siri, macOS 27 Golden Gate brings design changes with new Liquid Glass icons, an adjustable slider for the Liquid Glass design, and a better way to “diffuse” content when you move windows around.</p>\n<p>The company said that app windows have a more consistent corner radius. Sidebars now stretch edge to edge and have new colorful icons. The new operating system update also better highlights active windows.</p>\n<p>The OS update additionally adds features like enhanced child safety controls, shared cross-platform photo albums, and an updated eraser, better search in email, app resizing for iPhone mirroring, and quick suggestions for adding events to the calendar.</p>\n<p><a href=\"https://www.apple.com/newsroom/2026/09/major-updates-for-apples-software-platforms-are-now-available/\" target=\"_blank\" rel=\"noopener\">Starting today</a>, macOS 27 Golden Gate is available for MacBook Air and MacBook Pro 2020 versions with Apple Silicon or later, iMac with Apple Silicon (2021 or later), Mac Mini (2020 or later), Mac Studio (2022 or later), Mac Pro (2023 or later), and MacBook Neo. Go to System Settings &gt; General &gt; Software Update to get the latest version.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
