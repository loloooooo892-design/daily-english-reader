*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;

.container {

  display: flex;

  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {

}

.category-tag {

}

h1 {

  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;

  color: var(--text);

.feed-warning {

  font-size: 0.8125rem;
  line-height: 1.5;

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;

}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;

  gap: 0.5rem;

  font-size: 0.8125rem;

  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;

  letter-spacing: 0.01em;

.swap-btn:hover {

  color: var(--text);
}

.swap-btn:disabled {

  cursor: default;
}

.swap-counter {

  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;

.article-body h2, .article-body h3, .article-body h4 {

}

.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

  padding-left: 1.25em;

  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);

  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {

  text-decoration: none;

<script>
var articles = [{"title":"Every Samsung Galaxy Phone Comes With This Unique Add-On","source":"Wired","author":"@wired","url":"https://www.wired.com/story/every-samsung-galaxy-phone-comes-with-this-unique-add-on/","category":"tech","categoryLabel":"Technology","wordCount":822,"readingTime":5,"content":"<p>If you opt for an <a href=\"https://www.wired.com/tag/android-phones/\" target=\"_blank\" rel=\"noopener\">Android phone</a> over an <a href=\"https://www.wired.com/tag/iphone/\" target=\"_blank\" rel=\"noopener\">iPhone</a>, there are certain features you get as standard as part of Android. Then there are other features specific to certain manufacturers, as each Android phone maker puts its own spin on the software.</p><p><a href=\"https://www.wired.com/story/best-google-pixel-phone/\" target=\"_blank\" rel=\"noopener\">Pixel phones</a>, for example, get the Now Playing widget on the home screen and lock screen that works like an instant Shazam. It'll tell you the name of the song playing in your environment before you've even searched for it.</p><p>With <a href=\"https://www.wired.com/gallery/best-samsung-phones/\" target=\"_blank\" rel=\"noopener\">Samsung phones</a>, one of the best perks isn't as widely known about or used as it should be. It's called the Edge Panel, and it works like a customizable shortcut bar that gives you speedy access to the other parts of your phone.</p><p>If you own a Galaxy device and have never come across the Edge Panel, or you used it once but have since forgotten about it, here's what it's capable of now—and how you can make the most of it to optimize your mobile experience.</p><h2>How the Edge Panel Works</h2><p>You can think of the Edge Panel as being a little bit like the Start menu on Windows, or the dock on macOS. It provides something that Android doesn't have by default, which is a user-configurable launcher for collecting your favorite apps and feature shortcuts.</p><p>When it's enabled, the Edge Panel appears as a faint line along the side of the screen, and you can swipe across it to open the pane. If you don't see it, head to Settings and choose <strong>Display &gt; Edge Panels</strong> to turn it on (via the toggle switch) or customize what the panels show (by tapping the menu entry).</p><p>There are actually seven different types of panel to choose from, as you'll see when you start to customize the feature: <strong>Apps</strong>, <strong>People</strong>, <strong>Tasks</strong>, <strong>Weather</strong>, <strong>Tools</strong>, <strong>Clipboard</strong>, and <strong>Reminder</strong>. You can have just one of them active, or all seven, or something in between (once you've got the Edge Panel up, swipe across it to switch between the different types).</p><p>The names of these panels give you some idea of what they can do. You can use the <strong>Apps</strong> panel to access the apps you use the most, without having to hunt for them in the main app drawer or having them clutter up your home screen. You can also jump to your most important people on the <strong>Contacts</strong> panel in the same way.</p><p>The <strong>Clipboard</strong> panel gives you quick access to the phone clipboard, while <strong>Tasks</strong> features shortcuts such as taking screenshots, adding new calendar events, adding alarms, and taking a screenshot. Having these shortcuts on the Edge Panel means you don't have to dig through menus or remember key combinations for the same functions.</p><p><strong>Tools</strong> is actually just a single tool: a compass that tells you your current location and points you north, south, east, or west. <strong>Weather</strong> is pretty self-explanatory, while <strong>Reminder</strong> syncs information from the Reminder app that comes preinstalled on Galaxy devices.</p><h2>Customize the Edge Panel</h2><p>The Edge Panel works fine in its default state, but to make the most of it you really need to set it up to suit you and the way you use your phone. From the main Settings menu, choose <strong>Display,</strong> then tap <strong>Edge Panels</strong>.</p><p>First, select <strong>Panels</strong> to pick which panes are shown. Put a check next to the panes you want to have available. If you tap the three dots (top right) then <strong>Reorder</strong>, you're able to choose the order they appear in as well—place the panes you use most often furthest to the left, as they'll be available in fewer swipes.</p><p>You can also tap the three dots then <strong>Hide on Lock screen</strong> if you don't want the Edge Panel to appear before you've unlocked your phone. Bear in mind that you might not want some information—such as the contents of the clipboard or your reminders—being available to anyone who picks up your handset.</p><p>With <strong>Apps</strong>, <strong>People</strong>, and <strong>Tasks</strong>, you can customize what's included. Just tap the <strong>Edit</strong> button underneath the pane. In each case, there are more available options than there are slots on the Edge Panel, so you need to prioritize accordingly.</p><p>Back on the <strong>Edge Panels</strong> screen, there are a couple of other options worth knowing about. If you pick <strong>Handle</strong>, you can set the properties of the little onscreen strip that Edge Panel is activated through. Pick the size and transparency level of the handle, its color, and which side of the screen it appears on.</p><p>Finally, there's the <strong>Show in landscape mode</strong> toggle switch; disable this if you don't want to see the Edge panel when you're using your phone in its landscape orientation. This mode is mainly used for watching videos and playing games, in which case the Edge Panel and its handle might distract you.</p>"},{"title":"Tom Sachs Channels Chanel","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/14/tom-sachs-channels-chanel","category":"fun","categoryLabel":"Interesting Reads","wordCount":1317,"readingTime":7,"content":"<p>At his downtown studio, the perennially provocative artist makes a lo-fi version of the brand’s flagship Parisian store.</p><p>September 7, 2026</p><p>In the winter of 1994, Barneys, the former high-end Manhattan department store known for its daring storefront displays, unveiled its Christmas windows: three hundred and nine original works by both well-established and emerging artists which the store planned to auction off to support local schools. What began as a gesture of holiday charity, however, soon devolved into chaos, after a three-by-two-by-two-foot sculpture, “Hello Kitty Nativity Scene,” drew the ire of Catholic groups. Fashioned out of colored duct tape by a then little-known twenty-eight-year-old sculptor named Tom Sachs, it was a punky act of pop-culture bricolage that starred Madonna as the Virgin Mary, three Bart Simpsons as the wise men, and the titular white cat as the baby Jesus. After weeks of public protest, Barneys removed the work and apologized in a full-page ad in the <em>Times</em>. In the kind of career-making scandal that many young artists dream of, Sachs, who was born in Manhattan, grew up in Connecticut, and studied art at Bennington College, became the city’s newest enfant terrible.</p><p>On a recent sweltering morning, Sachs, now sixty, stood outside his sprawling SoHo studio, on Centre Street—where he has been making art for the past forty years—thinking, yet again, about a window display. For his latest work, “31 Rue Cambon,” an immersive installation that opens to the public on September 11th, during New York Fashion Week, Sachs converted part of his studio into an uncanny simulacrum of the luxury fashion house Chanel’s flagship boutique, in Paris. Viewers will enter directly from the street, where Sachs and his team of around twenty people were in the process of re-creating the iconic Chanel storefront, with cream-colored awnings made of cardboard and wrought-iron gates emblazoned with the brand’s interlocking “C”s. Inside, viewers will find a mirrored entrance hall and a showroom stocked with handbags, shoes, sparkly baubles, and Chanel’s signature two-piece suits—all painstakingly handcrafted out of everyday materials such as cardboard, paper, plywood, and broken glass. Sachs, who has the garrulous, jittery mien of a hyperactive teen-ager, explained that he intended to conceal the exterior till the last possible minute. “We’re keeping butcher paper up on the windows until we open,” he said. “I think shock and awe is best.”</p><p>This is not the first time Sachs has repurposed Chanel’s enduring iconography in order to shock: in 1998, he made a giant, fully functional guillotine out of stolen police barriers and covered it in Chanel logos—in part, he has said, to make a statement about “cultural fascism.” (The piece now resides in the permanent collection of Paris’s Centre Pompidou.) Over the years, Sachs, whose work is also found in the collections of the Metropolitan Museum, the Museum of Modern Art, and the Guggenheim, has positioned himself as a cultural provocateur who re-creates loaded objects and spaces—he’s made a toilet plunger out of Hermès wrapping, a McDonald’s meal from Tiffany packaging, and a model of a Nazi death camp stamped with Prada insignia—in what he has called a dual exercise in “brand critique and brand affection.” But “31 Rue Cambon” may be his most comprehensive engagement with consumerism yet, and it comes at a moment when Chanel frenzy is at a newfound high, thanks to the brand’s creative director, Matthieu Blazy. (The French label reported a revenue increase of about sixteen per cent in the first half of 2026.) “This store, for me, is <em>real</em>, even though you cannot buy anything in it,” he said. “Maybe, in a way, that inaccessibility makes it feel more real. For me, the lust for consuming things is replaced by making them.” As a maximalist <em>Gesamtkunstwerk</em>, it echoes another of Sachs’s major works, “Space Program,” which débuted at the Gagosian gallery, in 2007. For that, he built a spacesuit, a <em>NASA</em> command center, and a to-scale lunar module out of plywood, plumbing, and found materials. Most recently, he showed a collection of his furniture design at the Upper East Side gallery Salon 94.</p><p>On Centre Street, Sachs pointed toward a chandelier in the entrance hall, reminiscent of one in Coco Chanel’s Paris apartment; he and his team built it out of cast-iron woks, Citi Bike reflectors, and lead fishing sinkers. He pushed through a mirrored panel to reveal the main boutique, where, around the room’s perimeter, a dozen or so flat Chanel “suits,” all painted on slabs of three-quarter-inch plywood, were hung up like dream clothes for a life-size paper doll. Coco Chanel began creating suits for women in the nineteen-twenties, but it was a design of hers from 1954—a tweed skirt with a boxy, collarless matching jacket—that became one of her most recognizable silhouettes. Since then, Chanel suits have been worn by style icons from Marlene Dietrich to Michelle Obama. The current version of the ensemble retails for more than ten thousand dollars. A Sachs suit sculpture, by contrast, requires “maybe seven dollars’ worth” of materials. The value, he told me, is in the labor: each one took more than ten days to produce, as he and his team mimicked individual textiles by using experimental techniques. To make a famous ivory-navy-and-red bouclé suit worn by Coco herself, for example, the team used combs from Walmart to crosshatch the paint’s surface and added dollops of paint to imitate bouclé’s popcorn texture. The hand-painted gold buttons, decorated with ornate laurel wreaths, are tiny works of art in themselves, shaped out of sculpted polymer.</p><p>Thirty-one suits in total will be on view, mimicking those worn by celebrities such as Naomi Campbell, Elizabeth Taylor, and Olivia Rodrigo, whom Sachs calls “the muses.” A rickrack trim on one suit was made by a staffer piping a wriggle of paint out of a syringe and then smooshing it with wax paper; the look of rough tweed on another was evoked by mixing paint with pumice gel. The accessories featured similar contrasts: a Gripoix brooch of diamantés and Lego elements (the “jewelry” will be presented in a sleek set of glass-fronted drawers and a wall-mounted cabinet), and, nearby, a cardboard facsimile of classic Chanel pumps with stacked wooden heels. Sachs ran his hands over a powder-blue suit, modelled on one worn by Princess Diana. “Sometimes I come into the studio and, like, start crying,” he said. “Because we’re having so much fun. The things that we’ve come up with are so fucked up!”</p><p>In recent years, however, Sachs has faced criticism that his studio was not so fun; in 2023, several former staffers accused him of fomenting a toxic and cultlike workplace. Sachs denied specific allegations of harassment, but he did face consequences. Nike, with which he’s put out limited-edition sneakers since 2012, dropped him, though it renewed the relationship a year later, and Sachs had to issue a public apology and undergo sensitivity-and-awareness training. When I asked him about the allegations, he balked a bit. “I’m not sure how much more I can possibly add to what I’ve already said,” he said. “I will say I’m proud of the work that we’re doing here. I could not have done a show of this complexity without an incredibly dedicated team who shares the vision of this.”</p><p>Indeed, his team, which works out of a carpentry shop in the basement and a painting studio upstairs, did seem dedicated; I observed a cadre of young artisans gluing hundreds of seed-size rhinestones onto plastic bezels to evoke the look—if not the price—of lavish jewelry. “For me, this show is not about Chanel,” Sachs said. (In fact, he hasn’t spoken to anyone at the brand about the project.) “It’s about honoring and obsessing.” ♦</p><ul><li><p>Parents disagreed on whether to vaccinate their children. Then the kids <a href=\"https://www.newyorker.com/magazine/2026/09/07/the-maha-custody-battle\" target=\"_blank\" rel=\"noopener\">got sick</a>.</p></li></ul><p><a href=\"https://www.newyorker.com/contributors/rachel-syme\" target=\"_blank\" rel=\"noopener\"></a></p><p><a href=\"https://www.newyorker.com/contributors/rachel-syme\" target=\"_blank\" rel=\"noopener\">Rachel Syme</a> is a staff writer at The New Yorker. She has covered Hollywood, style, literature, music, and other cultural subjects since 2012.</p>"},{"title":"Steam Week in Review: 54 idle games released on Steam last week, and many look eerily similar","source":"PC Gamer","author":"Shaun Prescott","url":"https://www.pcgamer.com/gaming-industry/steam-week-in-review-54-idle-games-released-on-steam-last-week-and-many-look-eerily-similar/","category":"gaming","categoryLabel":"Gaming","wordCount":940,"readingTime":5,"content":"<p>When Cookie Clicker and Candy Box both released in quick succession in 2013, I remember them being received mostly as a joke, or else as an amusing parody of \"watch numbers go up\" RPG gameplay. Then something weird happened: all my colleagues became fixated on Cookie Clicker. So did I. Lots of people on the internet, on Twitter and in various forums like Reddit, confessed to having become addicted to it.</p><p>Cookie Clicker did have an antecedent in Ian Bogost's Cow Clicker, which was <a href=\"https://www.gdcvault.com/play/1013828/Making-a-Mockery-Ruminations-on\" target=\"_blank\" rel=\"noopener\">a very deliberate satire</a>. But Cookie Clicker wasn't presented as satire. And yet, it was so transparently meaningless that people doubted it could be anything else. You click a cookie repeatedly to generate more cookies. Once you earn enough cookies, you can invest those cookies into various ways of expediting the cookie making process. You click and watch numbers go up. It's stupid.</p><p>Fast forward more than a decade later and idlers, also known as incremental games, are massive on Steam. Last week, 54 games with the tag \"idler\" released. In total, there are 4,314 games with that tag on Steam.</p><p>Some of these look pretty good as far as idlers go. <a href=\"https://store.steampowered.com/app/4536900/Next_Reign_Kingdom/\" target=\"_blank\" rel=\"noopener\">Next Reign: Kingdom</a> has pretty handmade pixel art, atmospheric music and strategic elements. We Need More Humans! Has a novel premise—you have to become increasingly proficient at abducting humans—and, as far as this genre goes, a distinctive art style. <a href=\"https://store.steampowered.com/app/4412000/Zad_Archery/\" target=\"_blank\" rel=\"noopener\">Zad Archery</a>'s art style, on the other hand, is very generic but it has nearly 700 \"mostly positive\" reviews, so it must be doing something right.</p><p>None of those listed above are likely to rival genre heavyweights like Bongo Cat (currently being played by 135,803 people), Task Bar Hero (66,292 people) and Banana (3,628). But they have at least managed to rise above the onslaught of idler AI slop. The vast majority of the idlers that released on Steam last week have an AI disclosure.</p><p>And many of them look oddly, almost uncannily similar. Compare the UIs in the gallery below:</p><p>There's a special fondness for a roughly similar shade of blue, isn't there? They are not pleasant UIs. What is going on here? Why do these games all look roughly the same?</p><p>From the creators of Edge: A free weekly videogame industry newsletter, featuring in-depth news, expert analysis and exclusive interviews</p><p>A quick look at their AI disclosures may be telling. Vespera has \"AI generated images and other AI made components\". Nexus: \"Some assets were created using AI. I'm not as [sic] artist lol.\" Brainrot Clicker, fittingly, has \"some pre-generated visual assets, written content, and development-related creative work\", while Path of the Idle Cultivator used AI \"for UI and some translations\".</p><p>These are just four examples: browse the raw <a href=\"https://store.steampowered.com/search/?sort_by=Released_DESC&amp;hwtype=0&amp;tags=615955&amp;category1=998&amp;os=win&amp;supportedlang=english&amp;ndl=1\" target=\"_blank\" rel=\"noopener\">unfiltered list of Steam idler games</a> and you'll find many, many more examples of games with loosely the same approach to UI, both in terms of layout and that gravitation towards a dark blue background colour.</p><p>The amount of games bearing the idler tag spiked dramatically last year, according to SteamDB. In 2020 there were 100, in 2024 there were 647, last year there were 1033 and this year—so far!—there are 1811. There are 1119 coming soon and 380 \"TBA\".</p><p>I don't mean to be too dismissive of the idler as a genre: there are decent examples. But the whole situation feels almost implausibly silly: Steam is being flooded with <em>thousands </em>of mindless \"numbers go up\" games developed primarily with the aid of generative AI. It's got to be the quintessence of brainrot.</p><p>If you'd told me in 2013 as I dumbly clicked on cookies that this was the future of the idler genre, I wouldn't have believed you at first. Then, maybe five minutes later, after giving it some thought, I'd probably have to admit to the inevitability of it.</p><h2>Top Steam games by revenue (August 25 - September 1)</h2>\n<p>\nSwipe to scroll horizontally\n</p>\n\n<p><strong>Rank</strong></p>\n<p><strong>Game</strong></p>\n\n<p>1</p>\n<p>Star Wars Zero Company</p>\n\n<p>2</p>\n<p>Counter-Strike 2</p>\n\n<p>3</p>\n<p>How to Fish</p>\n\n<p>4</p>\n<p>Dota 2</p>\n\n<p>5</p>\n<p>Apex Legends</p>\n\n<p>6</p>\n<p>NBA 2K27</p>\n\n<p>7</p>\n<p>Crimson Desert Enhanced</p>\n\n<p>8</p>\n<p>Dead by Daylight</p>\n\n<p>9 </p>\n<p>EA Sports FC 27</p>\n\n<p>10</p>\n<p>Wardogs</p>\n\n<p>Star Wars Zero Company tops the list, which wasn't necessarily guaranteed: yes, it's a Star Wars game, but it's also a strategy RPG in the style of XCOM. Unfortunately, the offices at Bit Reactor probably aren't thrumming with post-launch elation: 80 percent of its workforce has reportedly been <a href=\"https://www.pcgamer.com/gaming-industry/the-studio-behind-star-wars-zero-company-which-is-currently-a-steam-bestseller-has-reportedly-furloughed-the-majority-of-its-staff/\" target=\"_blank\" rel=\"noopener\">furloughed</a>.</p><p>The Blood of Dawnwalker and Onimusha both released after the period tracked by this chart, but for what it's worth—and perhaps that's not much—The Blood of Dawnwalker's pre-orders had it at 17, while Onimusha came in at 28. Given The Blood of Dawnwalker has already sold <a href=\"https://www.pcgamer.com/games/rpg/the-blood-of-dawnwalker-sold-1-million-copies-in-just-3-days/\" target=\"_blank\" rel=\"noopener\">a million units</a> just three days after release (across all platforms) but we don't know how Onimusha has done.</p><p><a href=\"https://www.pcgamer.com/elden-ring/\" target=\"_blank\" rel=\"noopener\">Elden Ring</a> Tarnished Pack came in at 29, which is quite low considering it's Elden Ring DLC. Most reviews suggest it's not worth the $5: \"Not worth the money,\" one Steam user wrote. \"Should have been free as it is a very small update made to promote the launch of the game on the Switch.\" A lot of reviews are in agreement.</p><h2>Last week's Steam deep cuts</h2>\n\n<p>Shaun Prescott is the Australian editor of PC Gamer. With over ten years experience covering the games industry, his work has appeared on GamesRadar+, TechRadar, The Guardian, PLAY Magazine, the Sydney Morning Herald, and more. Specific interests include indie games, obscure Metroidvanias, speedrunning, experimental games and FPSs. He thinks Lulu by Metallica and Lou Reed is an all-time classic that will receive its due critical reappraisal one day. </p>"},{"title":"School Can Control What Flags Schoolteachers Hang on Classroom Walls","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/01/school-can-control-what-flags-schoolteachers-hang-on-classroom-walls/","category":"law","categoryLabel":"Law","wordCount":564,"readingTime":3,"content":"<p>A short excerpt from the longish <a href=\"https://ww3.ca2.uscourts.gov/decisions/OPN/25-1197_opn.pdf\" target=\"_blank\" rel=\"noopener\"><em>Dole v. Connetquot Central School Dist.</em></a>, decided yesterday by Second Circuit Judge Alison Nathan, joined by Judges Michael Park and Maria Araújo Kahn:</p> <blockquote><p>Christopher Dolce, Sarah Ecke, and Shinaide McAleavey-Polley are teachers at Connetquot Central High School and \"open members of the LGBTQ+ community.\" Connetquot Central School District officials ordered Ecke to take down two pride flags that hung on the walls of her math classroom. They also told Dolce and McAleavey-Polley that they could not place pride flag stickers on their classroom doors….</p> <p>{Under <em>Garcetti v. Ceballos</em> (2006), and its progeny, when public employees' speech \"owes its existence\" to their \"professional responsibilities,\" the Government—their employer—can control the content of that speech without implicating their First Amendment rights.} … [A] public high school teacher's classroom wall decorations are speech that \"owes its existence\" to their \"professional responsibilities.\" After all, teachers decorate their classroom walls as part of their duty to create physical classroom spaces conducive to the curricula they are assigned to teach. Those decorations are thus the Government's speech, and the First Amendment does not apply to them….</p></blockquote>  <blockquote><p>To be sure, the <em>Garcetti</em> Court reserved for another day whether the public-employee speech doctrine \"would apply in the same manner to a case involving speech related to scholarship or teaching.\" That carveout resulted from concerns that applying <em>Garcetti</em>'s \"official duties\" rule in cases involving public university professors would \"exil[e] all public-university faculty scholarship and instruction from the shelter of the First Amendment.\"</p> <p>But public university professors \"are paid … to speak, and to speak freely, guided by their own professional expertise\" in ways that public school teachers are not. As a result, when this Court declined to apply <em>Garcetti</em> to a public university professor's \"teaching and academic writing,\" we left open whether <em>Garcetti</em> might nevertheless apply to a public school teacher's curricular speech. Like many of our sister circuits, we now conclude that it does.</p> <p>The District, for its part, offers another First Amendment theory. It insists that \"speech in the traditional classroom to a captive audience during … instructional time is speech that a reasonable person would perceive to be school-sponsored[.]\" … [But t]he problem is not that the students in Ecke's math classroom are a \"captive audience\" to her messages, or that her speech took place in a classroom. Otherwise, anything a teacher says or does in view of her students might be placed beyond the ambit of the First Amendment—an application of <em>Garcetti</em> that the Supreme Court rejected in <em>Kennedy v. Bremerton School Dist. </em>(2022). For example, just as <em>Kennedy</em> made clear that a school district may not use <em>Garcetti</em> to \"fire a Muslim teacher for wearing a headscarf in the classroom,\" <em>Garcetti</em> may not \"transform\" something like a progress pride flag pin on a teacher's blazer or a picture of their same-sex spouse \"into government speech\" simply because the teacher wears that pin or displays that photo in their classroom.</p> <p>But here, Ecke, Dolce, and McAleavey-Polley's particular speech at issue—the displays covering the walls and doors of their classrooms—is speech that they are \"expected to deliver in the course of carrying out\" their jobs. And that speech thus falls directly into <em>Garcetti</em>'s heartland—whether or not they had a \"captive audience\" when making it….</p></blockquote> <p>Rondiene E. Novitz and Julissa M. Proana (Cruser, Mitchell, Novitz, Sanchez, Gaston &amp; Zimet, LLP) represent defendants. Moran.</p>"}];
