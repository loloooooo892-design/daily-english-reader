var articles = [{"title":"Ollaya · Run decision models locally.","source":"Hacker News Best","author":"","url":"https://ollaya.dev/","category":"tech","categoryLabel":"Technology","wordCount":692,"readingTime":4,"content":"<p>Ask typed questions about any text or JSON and get calibrated answers in milliseconds. Private, open source, on your own hardware.</p><p><a href=\"https://ollaya.dev/download\" target=\"_blank\" rel=\"noopener\">Download</a><a href=\"https://ollaya.dev/search\" target=\"_blank\" rel=\"noopener\">Browse models </a></p><h2>Fast</h2><p>Decisions in milliseconds.</p><p>A decision model answers in a single forward pass, with no token-by-token generation. On your own GPU, a five-question request to Laya takes about 10 ms, end to end through the HTTP API.</p><h2>Drop-in compatible</h2><p>Speaks TypeSafe's API.</p><p>Ollaya serves /v1/systemone and /v1/models with TypeSafe's request and response shapes. The official TypeSafe Python SDK 0.7.1 works unchanged against a local server.</p><p>Request</p># Point the TypeSafe SDK at Ollaya\nexport TYPESAFE_BASE_URL=http://localhost:11435\nexport TYPESAFE_API_KEY=local        # any value works\nexport TYPESAFE_DEFAULT_MODEL=laya\n# …or call the compatible endpoint directly\ncurl http://localhost:11435/v1/systemone -d '{\n    \"model\": \"laya\",\n    \"state\": \"Can I get an invoice for last month?\",\n    \"questions\": {\n      \"intent\": {\n        \"type\": \"choice\",\n        \"instructions\": \"What does the customer want?\",\n        \"criteria\": {\n          \"invoice\": \"Needs an invoice or receipt\",\n          \"refund\": \"Wants money back\",\n          \"other\": \"Anything else\"\n        }\n      }\n    }\n  }'<p>Response</p>{\n  \"model\": \"laya:en\",\n  \"answers\": {\n    \"intent\": {\n      \"type\": \"choice\",\n      \"choice\": \"invoice\",\n      \"confidence\": 0.9547,\n      \"probabilities\": {\n        \"invoice\": 0.9698,\n        \"refund\": 0.0172,\n        \"other\": 0.013\n      }\n    }\n  },\n  \"usage\": {\n    \"input_tokens\": 43,\n    \"output_tokens\": 0\n  }\n}<p><a href=\"https://ollaya.dev/docs/typesafe-compatibility\" target=\"_blank\" rel=\"noopener\">TypeSafe compatibility guide </a></p><h2>Open models</h2><p>Open weights, ready to pull.</p><p>Pick by what you need: laya is the fastest, decider the most accurate, von reads up to 8,192 tokens, and qwen3guard screens text for safety. The models page shows each one’s accuracy and speed.</p><ul><li><a href=\"https://ollaya.dev/library/laya\" target=\"_blank\" rel=\"noopener\">layaOpen decision models from Convai Innovations. Typed, calibrated answers to choice, score and yes/no questions in a single forward pass, in English and 100+ languages.322m · 421m</a></li><li><a href=\"https://ollaya.dev/library/decider\" target=\"_blank\" rel=\"noopener\">deciderDecoder decision models by Mapika on Qwen3.5: the answer is read from option-letter logits in one forward pass. decider:2b scores 0.591 on typed decisions.0.75b · 1.9b</a></li><li><a href=\"https://ollaya.dev/library/nli\" target=\"_blank\" rel=\"noopener\">nliZero-shot classifiers by Moritz Laurer: every option becomes a hypothesis scored for entailment. The most accurate encoder model on typed decisions in our tests.396m · 435m</a></li><li><a href=\"https://ollaya.dev/library/gliclass\" target=\"_blank\" rel=\"noopener\">gliclassInstruction-following zero-shot classifier by Knowledgator: all options of a question are scored in one pass, so cost barely grows with the number of options.439m</a></li><li><a href=\"https://ollaya.dev/library/qwen3guard\" target=\"_blank\" rel=\"noopener\">qwen3guardSafety guard by the Qwen team: is a text safe, controversial or unsafe, and which unsafe category? It answers its own built-in questions, in 119 languages, in one forward pass.0.6b</a></li><li><a href=\"https://ollaya.dev/library/decision\" target=\"_blank\" rel=\"noopener\">decisionDecision models by the vLLM Semantic Router contributors: a fully fine-tuned Qwen3.5 backbone plus an endpoint head that scores every option at its own last token against the question, in one forward pass per question. 16k-token rows.0.75b</a></li><li><a href=\"https://ollaya.dev/library/kev\" target=\"_blank\" rel=\"noopener\">kevDecision models by Jared Palmer: a LoRA on a Qwen3.5 base plus a pointer head that scores every option at its own span, in one forward pass per question. Calibrated with Kev's own temperature.0.76b · 4.2b · 7.9b</a></li><li><a href=\"https://ollaya.dev/library/von\" target=\"_blank\" rel=\"noopener\">vonDecision model by Victor Hugo Panisa on ModernBERT-large: every option is scored at its own marker, all options of a question in one pass, with an input-conditioned calibration. 8k-token context.395m</a></li></ul><p><a href=\"https://ollaya.dev/search\" target=\"_blank\" rel=\"noopener\">Browse all models </a></p><h2>Your data stays yours</h2><p>Private by default.</p><p>Tickets, emails and user messages are often the most sensitive data you have. With Ollaya they are scored where they already live.</p><h2>Platforms</h2><p>Runs where you work.</p><p>A desktop app and a command line for macOS, Windows and Linux, and a Docker image for servers. Every model runs on the CPU; an NVIDIA GPU on Linux, Windows, WSL 2 or Docker takes a request down to milliseconds.</p>PlatformDesktop appCommand lineGPUmacOSApple silicon, macOS 14+Desktop appMenu bar app.dmgCommand lineInstall scriptGPUApple GPULaya and NLI on MLXWindows10 and 11, x64Desktop appDesktop app.exe or .msiCommand linePowerShell scriptGPUNVIDIA, CUDA 13Command lineLinuxx86-64Desktop appDesktop appAppImage, .deb, .rpmCommand lineInstall scriptsystemd serviceGPUNVIDIA, CUDA 13LinuxARM64Desktop appNot availableCommand lineInstall scriptsystemd serviceGPUCPU onlyWSL 2Linux on WindowsDesktop appNot availableCommand lineInstall scriptSame as LinuxGPUNVIDIA, CUDA 13Dockeramd64 and arm64Desktop appNot availableCommand lineImage on GHCRGPUNVIDIA, CUDA 13:cuda image, amd64<a href=\"https://ollaya.dev/download\" target=\"_blank\" rel=\"noopener\">Install for your platform </a><p>NVIDIA GPUs need driver R580 or newer; the install scripts fetch the CUDA libraries only when they find one. On a Mac, laya and nli run on the Apple GPU through MLX; other models, AMD and Intel GPUs, and the Windows and Linux desktop apps use the CPU.</p><h2>Get up and running in minutes.</h2><p>One binary, one command: ollaya run laya.</p><p><a href=\"https://ollaya.dev/download\" target=\"_blank\" rel=\"noopener\">Download</a></p><p>macOS, Windows, Linux and Docker · Apache-2.0 · <a href=\"https://github.com/ollaya-dev/ollaya\" target=\"_blank\" rel=\"noopener\">GitHub</a></p>"},{"title":"The Violent Feud That Shocked the Horse World","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/09/16/the-violent-feud-that-shocked-the-horse-world/","category":"fun","categoryLabel":"Interesting Reads","wordCount":515,"readingTime":3,"content":"<p>Ian Parker does not hold back in painting the egos of the characters in this horse‑world scandal, clearly growing tired at times of the pomposity of Michael Barisone, a U.S. dressage trainer and former Olympian who shot his student, Lauren Kanarek, after an escalating feud. Claiming that Kanarek’s online taunts and complaints drove him insane, Barisone was eventually found not guilty, though later banned from his sport by the U.S. Center for SafeSport. Tread carefully as you enter this arena; narcissism lurks everywhere.</p>\n<blockquote>\n<p>The first time I called him, he said, of the case, “You’re going to find it is a John Grisham novel combined with ‘Fatal Attraction’ combined with ‘Yellowstone.’ ” Barisone’s story has its evident hero, and its villain is Kanarek, his victim. In this presentation of events—a “scum of the earth” client, in his words, and a terrific guy who snapped, as anyone would have—Barisone has enjoyed near-universal support from the dressage community, and beyond. In much of the online discussion about the case, including in the forums of <em>The Chronicle of the Horse</em>, a long-established magazine, commenters have identified two victims, not one, and have almost always found Barisone’s victimhood the more compelling. A woman was shot, but a man was driven to shoot her, because she was annoying, and at times belligerent, in person and on social media. Kanarek has been widely scorned as a dressage interloper and as an embodiment of contemporary ills: a bullshitter, an entitled troll.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore horsey picks \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/11/cloning-came-to-polo-then-things-got-truly-uncivilized/\" target=\"_blank\" rel=\"noopener\">Cloning Came to Polo. Then Things Got Truly Uncivilized</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMatt Reynolds | Wired | July 10 | 5,668 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“A polo legend and a businessman joined forces to copy the player’s greatest horse. But with a single clone worth $800,000, some technologies are a breeding ground for betrayal.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/11/20/he-thought-he-knew-horses-then-he-learned-to-really-listen/\" target=\"_blank\" rel=\"noopener\">He Thought He Knew Horses. Then He Learned to Really Listen.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSterry Butcher | New York Times Magazine | November 12, 2024 | 3,896 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Warwick Schiller made his name as an expert trainer. An enigmatic little horse completely changed his outlook.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/10/10/do-you-need-a-visit-to-the-confident-man-ranch/\" target=\"_blank\" rel=\"noopener\">Do You Need a Visit to the Confident Man Ranch?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tRosecrans Baldwin | GQ | September 28, 2023 | 4,594 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“At the foot of the Rockies, the operators of a dude ranch retreat are blending cowboy culture and group therapy.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/07/11/ride-the-good-witches/\" target=\"_blank\" rel=\"noopener\">Ride the Good Witches</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tPam Houston | Outside | July 11, 2023 | 2,708 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“She threw herself into bonding with a breed of horse that seems touched by Viking spirit.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/04/11/saving-the-horses-of-our-imagination/\" target=\"_blank\" rel=\"noopener\">Saving the Horses of Our Imagination</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAshley Stimpson | Sunday Long Read | April 9, 2023 | 5,236 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Creamer wasn’t just coming up against locals’ attachment to their horses, but a pernicious human tendency to confuse profound affection for animals with wisdom about what’s best for them.” </p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2017/07/07/a-kingdom-for-a-horse-kokpar-and-the-future-of-kazakhstan/\" target=\"_blank\" rel=\"noopener\">A Kingdom for a Horse: Kokpar and the Future of Kazakhstan</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tWill Boast | Virgina Quarterly Review | July 3, 2017 | 5,100 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“[N]owhere in this region is the contrast between the contemporary and the ancient higher than in Kazakhstan. And nowhere is the interplay between the two more starkly embodied than in professional Kazakh kokpar.”</p>"},{"title":"Ahead of GTA 6, Rockstar warn modders against making unofficial main story expansions, unauthorised ports and mods that combine GTA maps","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/ahead-of-gta-6-rockstar-warn-modders-against-against-making-unofficial-main-story-expansions-unauthorised-ports-and-mods-that-combine-gta-maps","category":"gaming","categoryLabel":"Gaming","wordCount":799,"readingTime":4,"content":"<p>\"Like all creators, we have the right to set limits on how others can use our games and brand\"</p>\n    \n  \n  \n  \n  \n            <p>There still might not yet be a release date for <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto-vi\" target=\"_blank\" rel=\"noopener\">GTA 6</a>'s PC port, but Rockstar appear to be preparing for the massive uptick in mods for their games that'll inevitably accompany it. In new modding guidelines posted this month, the studio have expressly warned against a bunch of things modders could do, including building on established storylines from the base game, pulling over bits of older GTAs, and porting the game to platforms it's not hit yet.</p>\n<p>Rockstar's new <a href=\"https://www.rockstargames.com/community-resources/mod-guidelines\" target=\"_blank\" rel=\"noopener\">modding guidelines</a> were originally posted on September 10th, but seemingly only unearthed this past weekend by posters on <a href=\"https://www.resetera.com/threads/rockstar-games-lays-out-modding-guidelines-for-their-games.1638472/\" target=\"_blank\" rel=\"noopener\">ResetEra</a> and other <a href=\"https://x.com/videotech/status/2101779470034079767\" target=\"_blank\" rel=\"noopener\">social sites</a>. They're pitched as general modding rules for all of Rockstar's games, but with GTA 6's initial console launch not too far away, it's hard not to see them as the studio setting their current position in stone before releasing their next big game. </p>\n<p>The guidelines have been broken up into four sections: one about not infringing on copyright, one about obeying Rockstar's community rules about treating other players acceptably, one about \"unauthorized or abusive monetisation\", and finally one pitched as being about respecting Rockstar's games. The latter's given top priority and issues the following decrees regarding the sorts of mods the company won't tolerate:</p>\n<ul>\n<li>Do not expand or modify Rockstar Games' official storylines, plots, missions, characters, or other elements of our established continuity.</li>\n<li>Do not make mods that combine maps, locations, characters, storylines, in-game assets, or other IP from one Rockstar Games title into another title.</li>\n<li>Multiplayer modding is limited to Rockstar Games’ official licensed Creator Platform or else as otherwise licensed directly by Rockstar Games.</li>\n<li>Do not modify our games to operate on consoles, hardware devices, or other platforms where they have not been officially released by Rockstar Games.</li>\n</ul>\n<p>Naturally, some of those are categories modding projects Rockstar have taken action against in recent years would fall under. The <a href=\"https://www.rockpapershotgun.com/somebody-recreated-all-of-gta-4s-liberty-city-in-gta-5-aaaaand-its-gone\" target=\"_blank\" rel=\"noopener\">\"friendly takedown\" of the Liberty City Preservation Project</a>, a re-creation of GTA 4's version of New York in <a href=\"https://www.rockpapershotgun.com/games/grand-theft-auto-v\" target=\"_blank\" rel=\"noopener\">GTA 5</a>, is the main one that comes to mind for me, and would have fit the bill of combining the maps of multiple Rockstar Games in one. As would YouTuber Dark Space's efforts to re-create GTA 6's map in GTA 5 prior to a <a href=\"https://www.ign.com/articles/gta-6-map-in-gta-5-mod-suffers-inevitable-take-two-takedown-creator-believes-it-was-probably-a-little-too-accurate-and-could-have-ruined-the-surprise\" target=\"_blank\" rel=\"noopener\">March 2025 takedown order</a>. \"Rockstar Games creates unique worlds, characters, and stories, which form the official continuity of our games,\" reads the company's intro to the game-respecting section. \"Like all creators, we have the right to set limits on how others can use our games and brand.\"</p>\n<p>The limiting of multiplayer mods to places officially licensed by Rockstar is arguably a bit cheeky, given the company have <a href=\"https://www.gamesindustry.biz/rockstar-acquires-roleplay-modding-team-cfxre\" target=\"_blank\" rel=\"noopener\">bought up roleplay modding team Cfx.re</a>, makers of the previously unofficial FiveM and RedM multiplayer mods.</p>\n<p>Noteworthy discouraged modding elements or activities from the other sections include \"cheat menus or other software that interferes with Rockstar Games’ official multiplayer, online services, or licensed Creator Platform\" and \"conflict roleplay or military simulations depicting real-world armed organisations\".</p>\n<p>In terms of monetisation, Rockstar specify that it can only be done via \"via digital storefront providers approved by Rockstar Games and in compliance with all applicable laws, rules, and policies\". Mods are explicitly barred from including \"real money gambling, 'loot boxes,' 'gacha,' or similar chance mechanics for real money\", with the same applying to selling \"in-game virtual currency\" or trying to hawk cryptocurrency. Finally, any third-party promotion or advertising through mods will get you put on the naughty list.</p><p>In theory, having a proper list of things Rockstar aren't fans of modding-wise out in the open could be useful for modders in terms of being aware whether an idea they have carries any risk of incurring takedown action or a less formal reach out from the company telling them to knock it off. That said, Rockstar make clear that they \"can revise this policy at any time\" and \"reserve the right to take down any mod or other user generated content at any time for any reason\", meaning that works which fall outside of these rules aren't guaranteed to be safe ground either.</p>\n<p>I don't reckon the new guidelines will have much of an impact in terms of what GTA 6's modding scene looks like, unless they lead some larger modding groups not to put years of effort into ambitious ideas they now know for sure Rockstar won't like and thus may come to naught but wasted time. Beyond that, people will still make the mods they want to for GTA 6 and Rockstar will go after whichever targets they deem worth the effort to take down, as has been the case up until now. </p>"},{"title":"TRO Issued Ordering Reinstatement of CNN, MS NOW, and Politico White House Access","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/24/tro-issued-ordering-reinstatement-of-cnn-ms-now-and-politico-white-house-access/","category":"law","categoryLabel":"Law","wordCount":1307,"readingTime":7,"content":"<p>From Judge Timothy Kelly's TRO today in <em><a href=\"https://storage.courtlistener.com/recap/gov.uscourts.dcd.296754/gov.uscourts.dcd.296754.24.0_1.pdf\" target=\"_blank\" rel=\"noopener\">CNN, Inc. v. Trump</a></em>:</p>\n<blockquote><p>On the afternoon of September 18, 2026, President Trump announced in a social media post that, \"effective immediately,\" he was \"banning\" the news organizations CNN, MS NOW, and POLITICO \"from the White House.\" And those news organizations allege that over the weekend their reporters were denied access to the White House and had their \"hard pass\" press credentials deactivated. Plaintiffs—the three news organizations and three individual reporters—sue the President and several White House officials and move for a temporary restraining order, asking the Court to order the immediate reinstatement of their hard passes pending further proceedings. The Court's resolution of their Motion is dictated by the application of well-known D.C. Circuit precedent that this Court must faithfully apply. For the reasons explained below, the Court will grant the Motion….</p>\n<p>Plaintiffs have shown a likelihood of success, at least on their Fifth Amendment procedural due process claim. The merits of this claim are assessed in two steps: \"the first asks whether there exists a liberty or property interest which has been interfered with by the State; the second examines whether the procedures attendant upon that deprivation were constitutionally sufficient.\" Plaintiffs have shown they are likely to succeed at both steps.</p>\n<p>As for the first, the D.C. Circuit held in <em>Sherrill v. Knight </em>(D.C. Cir. 1977) that \"the interest of a bona fide Washington correspondent in obtaining a White House press pass … undoubtedly qualifies as [a] liberty [interest] which may not be denied with-out due process of law under the fifth amendment.\" And if there were any doubt about what <em>Sherill </em>meant, the D.C. Circuit more recently reaffirmed this conclusion in <em>Karem v. Trump </em>(D.C. Cir. 2020), holding that \"a duly issued hard pass may not be suspended without due process.\"</p></blockquote>\n<blockquote><p>Plaintiffs are also likely to succeed in showing that their hard passes were revoked without constitutionally adequate due process. The \"general rule\" is that \"individuals must receive notice and an opportunity to be heard before the Government deprives them\" of a constitutionally protected interest. Indeed, the Supreme Court has \"described the root requirement of the Due Process Clause as being that an individual be given an opportunity for a hearing <em>before </em>he is deprived of any significant property interest.\"</p>\n<p><em>Karem </em>also holds that, because of the substantial interests at stake, before the Government can revoke the White House-issued hard pass of a reporter it must promulgate rules or standards governing the conduct that would lead to such revocation. And the reporter must \"receive fair notice not only of the conduct that would subject him to punishment, but also of the magnitude of the sanction that the White House might impose.\"</p>\n<p>Defendants do not dispute that Plaintiffs did not receive notice and an opportunity to be heard before their hard passes were revoked. And, as in <em>Karem</em>, the record is bereft of any relevant \"formally articulated standards\" in place <em>before </em>any of the conduct for which Defendants revoked their hard passes. One standard Defendants appear to offer—reflected in letters they sent to Plaintiffs on September 22, 2026, identifying their objectionable reporting—is so vague it hardly does the trick. <em>See, e.g.</em>, ECF No. 16-1 (\"[Y]our organization has exhibited behavior in violation of the standards of professionalism and decorum expected of those given access to the White House Complex.\"). Moreover, Defendants renewed Plaintiff Betsy Klein's hard pass several months <em>after </em>she published some of the identified reporting, undercutting any argument that she or her employer, for example, had the requisite notice that the conduct at issue violated a relevant standard. Finally, nothing put Plaintiffs on notice of the magnitude of the sanction Defendants imposed.</p>\n<p>None of Defendants' arguments convince the Court that Plaintiffs are <em>not </em>likely to succeed on their due process claim. Defendants say that <em>Sherrill </em>and <em>Karem </em>were wrongly decided. Maybe—but this Court is bound by D.C. Circuit precedent, full stop.</p>\n<p>Defendants also point to the letters referenced above, which they assert afford Plaintiffs post-deprivation notice of the revocations and an opportunity to be heard. And Defendants cite cases that suggest that such a post-deprivation process suffices in \"extraordinary circumstances.\" These are such circumstances, Defendants argue, because Plaintiffs have endangered national security through their reporting.</p>\n<p>But the circumstances here are not so \"extraordinary\" as to permit deviation from the \"essential principle of due process\" that a deprivation of liberty \"be <em>preceded </em>by notice and opportunity for hearing.\" <em>Zevallos </em>holds that post-deprivation due process may suffice in unusual situations, such as when \"providing notice before blocking the assets of international narcotics traffickers would create a substantial risk of asset flight.\" But nothing in the record suggests the need for such urgency here. Indeed, some of the reporting identified by Defendants in the letters to Plaintiffs stretches back months or years. The sorts of stories Defendants identify in the letters to Plaintiffs are routine. And as discussed further below, the Court is skeptical—at least on this record—that Defendants' interest in safeguarding national security is the actual motivation for, or is even advanced by, the revocation of Plaintiffs' hard passes. Finally, even if the circumstances here allowed for post-deprivation process, Defendants are still left with the problem that, before the reporting at issue, Plaintiffs still did not \"receive fair notice\" of either the \"conduct\" that would lead to a sanction or of \"the magnitude of the sanction that the White House might impose.\"</p>\n<p>{At the hearing on the Motion, Defendants argued that an adequate standard relating to the revocation of Plaintiffs' hard passes had been promulgated because the public is generally on notice that disclosure of classified information is unlawful. The Court is doubtful that the laws governing the retention, sharing, or mishandling of classified information provided Plaintiffs the sort of notice that satisfies <em>Karem </em>for several reasons, but especially given the lack of precedent for applying those laws to reporters. Moreover, just as the record lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security (as discussed below), the record also lacks factual support for Defendants' contention that Plaintiffs violated these statutes, at least at this stage.} …</p>\n<p>[And] nothing in the record that predates this suit suggests that the revocation of Plaintiffs' hard passes was motivated by national security concerns. Certainly, that is not what President Trump said when he announced that he was \"banning\" Plaintiffs from the White House—instead, he focused on the alleged lack of truthfulness and negativity of Plaintiffs' reporting. And even the justifications provided to Plaintiffs after this case was filed are ambiguous about the true purpose of the revocations: while Defendants' letters to Plaintiffs mention national security concerns, they purport to identify reporting that \"threatened national security and/or spread falsehoods,\" leaving open the possibility that all the stories fall into the later bucket, rather than the former….</p>\n<p>[T]he record [also] lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security or that national security will be endangered if the Court orders their passes reinstated while this litigation proceeds. Defendants offer no declarations or other support—classified or unclassified—explaining how any of the reporting they identified in their letters to Plaintiffs damaged the national security…. And supplemental declarations filed by Plaintiffs show that, in most cases, the reporters who authored the stories Defendants identify in their letters <em>did not even hold hard passes</em>. In the remaining cases, Defendants afford no reason to believe that the reporter's possession of the hard pass was integral to the stories identified….</p></blockquote>\n<p>For the First Amendment analysis (which the court didn't have to reach given its decision on the Due Process Clause), see <a href=\"https://reason.com/volokh/2026/09/18/can-president-trump-ban-cnn-ms-now-and-politico-from-white-house/\" target=\"_blank\" rel=\"noopener\">this post</a>.</p>\n<p>Ted Boutrous, Katie Townsend, Patrick J. Fuster, Connor S. Sullivan, and Connor P. Mui  (Gibson, Dunn &amp; Crutcher LLP) represent the media.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
