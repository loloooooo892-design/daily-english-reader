<style>
:root {

    --border: #2A2F3A;

    --warning-text: #D4B87A;

  }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"Count Binface receives over a quarter of votes in Clacton by-election","source":"Hacker News Best","author":"","url":"https://www.bbc.com/news/articles/ce97mm3vvemo","category":"tech","categoryLabel":"Technology","wordCount":815,"readingTime":5,"content":"<p>2 days ago</p><p><p>Jennifer McKiernanPolitical reporter</p></p><p>Count Binface, the self-styled intergalactic space warrior, has received nearly 10,000 votes in the Clacton by-election, his best performance yet.</p><p>Farage has re-won his seat, receiving more than 22,000 votes in Clacton, on the Essex coast.</p><p>Binface received 26.9% of the vote while Farage won 63.3%. Binface had his highest share yet with 9,455 votes, having lost to no fewer than three prime ministers, and one who later became prime minister, in previous attempts.</p><p>But how many votes has he previously received? And where does he fit into the British tradition of spoofing politicians?</p><h2>2017: May the force be with you</h2><p>The man inside the bin is the comedian Jon Harvey, an Oxford graduate who has specialised in satire, writing scripts for BBC comedy shows The Thick of It and Have I Got News For You.</p><p>He first donned a bin on his head to stand for election in 2017, when he challenged the then Prime Minister Theresa May in her Maidenhead constituency, although back then he was known as Lord Buckethead, a character inspired by a Star Wars parody film.</p><p>He won 249 votes and viral fame, leading to an appearance on John Oliver's HBO show Last Week Tonight - as well as a legal dispute with another Lord Buckethead he described at the time as \"an unpleasant battle on the planet Copyright\".</p><h2>2019: The bin takes on Boris Johnson</h2><p>Harvey found himself a different bin to cover his head and switched characters to Count Binface to take on the next Conservative leader, Boris Johnson, announcing himself as the leader of the Recyclons from planet Sigma IX.</p><p>He only won 69 votes, but was again able to take his place on stage as the election result was declared alongside a sitting prime minister, who was also flanked by a candidate dressed as the Sesame Street character Elmo, at his Uxbridge election count.</p><h2>2024: Sunak takes out the trash</h2><p>A third Conservative leader, Rishi Sunak, was in Count Binface's sights in the 2024 general election campaign.</p><p>He got 308 votes, which at the time was his best result.</p><p>The Monster Raving Loony Party's candidate, Sir Archibald Stanton, received 99 votes - 0.2% of the vote share.</p><h2>2026: Burnham courts the Count</h2><p>In June this year, it was Andy Burnham's turn to face Binface in the by-election that paved the way for the then Greater Manchester Mayor to become prime minister.</p><p>Rather than studiously ignoring the intergalactic warlord, as some may have been tempted to do, Burnham shook him warmly by the hand as he was elected Labour MP for Makerfield.</p><p>Binface bagged just 95 votes to Burnham's 24,927.</p><h2>2026: The Bin's best result yet</h2><p>While Nigel Farage won the Clacton by-election on Friday morning, Count Binface came second.</p><p>The Reform UK leader got 22,239 while Count Binface received 9,455. The intergalactic space warrior celebrated the number with his usual two peace sign fingers.</p><p>Speaking to BBC Breakfast after, Binface said: \"I promised to be a local champion for Clacton and I thought to hear the verdict of the Clactonites was the least I could do.\"</p><h2>A great British tradition?</h2><p>The UK has a rich history of novelty candidates standing in elections, with Monster Raving Loony Party founder Screaming Lord Sutch - a rock musician who fought more than 40 elections in his trademark top hat and gold lame suit - first standing in a by-election in the 1960s. A different Lord Buckethead stood in 1987 and 1992, while comedian Al Murray's pub landlord stood against Farage in 2015.</p><p>Objections to such \"frivolous\" candidates date back even further - to 1918, when a £150 deposit was introduced for candidates. That was later upped to £500, in 1985, in large part due to the popularity of the Monster Raving Loony Party.</p><p>But the bar for entry remains fairly low: anyone over the age of 18 who can scrape together a £500 deposit and get support from 10 people in the form of signatures is allowed to stand as a candidate in UK elections.</p><p>That's why Count Binface has been able to stand in so many high-profile elections. He has, however, lost his £500 every time, after failing to meet the minimum 5% of votes cast in order for his deposit to be returned.</p><p>Yet Binface has had his moment in the spotlight each time.</p><p>That is because another British tradition means all election candidates must stand side-by-side on a stage at the election count to hear how many votes they have each received - it's a literal leveller, where everyone from prime minsters to a bloke dressed as a bin has the right to be seen and heard as an official candidate.</p><p>But all of these no-hope novelty candidates share a few serious aims: to poke fun at power, prick the pomposity of political elites, and allow people a protest vote.</p>"},{"title":"Remedies for a Constitutional Crisis Harvard Law Review","source":"Harvard Law Review Blog","author":"@HarvLRev","url":"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/","category":"law","categoryLabel":"Law","wordCount":893,"readingTime":5,"content":"<h2>Introduction</h2>\n<p>In a constitutional showdown with the executive branch, the courts may seem to have limited remedial options.  Once we reach a point where courts conclude that the Executive is violating the law, what can they do but order compliance?  And what can we do but hope that the Executive feels compelled to comply, whether by conscience or political forces?</p>\n<p>Today, that compliance is hard to take for granted.  Indeed, the risk is that the executive branch will blow off the judiciary, ignoring its judgments, refusing to obey its decrees, courting contempt, accusing judges of fictitious wrongdoing, and tacitly encouraging retaliation against them.  And indeed, there is evidence that this is what is happening.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-1\" target=\"_blank\" rel=\"noopener\">1</a></p>\n<p>The upshot is that we are slipping into a crisis of judicial authority — what one could call a “constitutional crisis.”  We use the phrase here reluctantly, for it is overused and vague.  And we use it without knowing what will come next, and even though we might need a new word if things get worse.  (It was called the “Cuban Missile Crisis,” even though it ended fine, and even though it could have gotten much worse, and even though we would have needed a new term for what happened if it did.)  The phrase “constitutional crisis” at least captures the sense that the courts face an unusual challenge today, and that the precedents, such as they are, are not reassuring.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-2\" target=\"_blank\" rel=\"noopener\">2</a>  Call it what you will, it is not good.</p>\n<p>What courts can do to enforce their decisions in such a crisis is the inquiry at the heart of this Essay.  If courts cannot assume that the Executive will simply accept their decisions, what options are open to the least dangerous branch?  Do the federal courts have choices that will coax the executive branch into more law-abiding behavior?  Or will those choices hasten the slide toward an equilibrium in which the Executive acts contemptuously but escapes contempt?  Do the federal courts have choices that will provide an effective resistance to lawbreaking by the Executive, shoring up the rule of law?  Or will those choices merely accelerate and heighten the conflict between the branches, precipitating a battle that the judiciary can start but not win?</p>\n<p>Our central claim is that the range of remedial options available to courts is broader than it may seem at first — and that the best path is not always obvious.  Even when it is clear that the executive branch has acted unlawfully, it is not necessarily clear what courts can do about it.  Even if we are in a crisis, and the choice of judicial response is very important, that does not make obvious the <em>correct</em> choice.  We recognize that our readers will assess the risks associated with each option in various and varying ways, and that our own assessments may change as the world changes.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-3\" target=\"_blank\" rel=\"noopener\">3</a>  (Indeed, much has changed since this Essay was presented in October 2025.)  So this Essay does not attempt to crown any one choice as the right one.  Nor do we claim that any of these remedial choices will be enough to avert or undo a constitutional crisis.  They are not remedies in that sense.</p>\n<p>Our aim is more modest: We will lay out the menu of options that are available to federal judges, highlighting the tradeoffs among them.  But we recognize that we do not have the burden of choice, which belongs instead to the judges — and, we should acknowledge, to the President and the other executive officers and employees, as well as to the members of Congress.  In every separation of powers crisis, and in every averted separation of powers crisis, the decisive decisions are not made by law professors:</p>\n<p>Bullfight critics ranked in rows</p>\n<p>Crowd the enormous Plaza full;</p>\n<p>But only one is there who <em>knows</em></p>\n<p>And he’s the man who fights the bull.<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-ref-4\" target=\"_blank\" rel=\"noopener\">4</a></p>\n<p><a href=\"https://harvardlawreview.org/wp-content/uploads/2026/06/139-Harv.-L.-Rev.-1747.pdf\" target=\"_blank\" rel=\"noopener\">Continue Reading in the Full PDF</a></p>\n\n\t\n\t\t<p>\n\t\t\tFootnotes  \n\t\t</p>\n\t\n\t\n\t<ol>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">^</a> <em>See, e.g.</em>, Daniel T. Deacon &amp; Leah M. Litman, <em>Legalistic Noncompliance</em>, 75 Duke L.J. (forthcoming 2026) (manuscript at 9–45), https://ssrn.com/abstract=5241936 [https://perma.cc/D32A-BM56]; Thomas P. Schmidt &amp; Gillian E. Metzger, <em>Some Realism About Constitutional Remedies</em>, 139 Harv. L. Rev. 1834 (2026).  For a contrary view, see Adrian Vermeule, Opinion, <em>Someone Is Defying the Supreme Court, But It Isn’t Trump</em>, N.Y. Times (July 31, 2025), https://www.nytimes.com/2025/07/31/opinion/supreme-court-trump-judges-defiance.html [https://perma.cc/8F46-ZDLX].\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-1\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">^</a> <em>See generally</em> Sanford Levinson &amp; Jack M. Balkin, <em>Constitutional Crises</em>, 157 U. Pa. L. Rev. 707 (2009); Keith E. Whittington, <em>Yet Another Constitutional Crisis?</em>, 43 Wm. &amp; Mary L. Rev. 2093 (2002); Arthur Bestor, <em>The American Civil War as a Constitutional Crisis</em>, 69 Am. Hist. Rev. 327 (1964).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-2\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">^</a> Judges might also derive wisdom from experiences around the world, though with the usual caveats about translating lessons from other institutions to ours.  <em>See generally, e.g.</em>, Jeffrey K. Staton, Christopher Reenock &amp; Jordan Holsinger, Can Courts Be Bulwarks of Democracy? Judges and the Politics of Prudence (2022); Benjamin Garcia-Holgado, <em>Overruling the Executive: Judicial Strategies to Resist Democratic Erosion</em>, 13 J.L. &amp; Cts. 274 (2025); Fortunato Musella &amp; Luigi Rullo, <em>Constitutional Courts in Turbulent Times</em>, 25 Eur. Pol. &amp; Soc’y 461 (2024).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-3\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t\t\t<li>\n\t\t\t\t\n\t\t\t\t\t<p>\n\t\t\t\t\t\t<a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">^</a> Poem attributed to Domingo Ortega by Robert Graves, <em>in</em> Robert Graves, Oxford Addresses on Poetry 4 (1962).\t\t\t\t\t</p>\n\t\t\t\t\t<p><a href=\"https://harvardlawreview.org/print/vol-139/remedies-for-a-constitutional-crisis/#footnote-4\" target=\"_blank\" rel=\"noopener\">Return to citation ^</a>\n\t\t\t\t</p>\n\t\t\t</li>\n\t\t\t</ol>"},{"title":"20 hours in, I cannot believe the scale, complexity, and ambition of Fire Emblem: Fortune's Weave - especially given its paltry Switch 2 file size","source":"Eurogamer","author":"Dom Peppiatt","url":"https://www.eurogamer.net/fire-emblem-fortunes-weave-preview","category":"gaming","categoryLabel":"Gaming","wordCount":1385,"readingTime":7,"content":"<p>Intelligent System upgrade.</p>\n    \n  \n  \n  \n\n            <p><a href=\"https://www.eurogamer.net/games/fire-emblem-fortunes-weave\" target=\"_blank\" rel=\"noopener\">Fire Emblem: Fortune's Weave</a> is massive. If you're coming to Intelligent Systems' <a href=\"https://www.eurogamer.net/platforms/switch-2\" target=\"_blank\" rel=\"noopener\">Switch 2</a> RPG after playing even Three Houses or Engage, you're going to be shocked by the scale of it. Within the first 10 hours of the game, you are given choices that show you just how broad the scope of the game is. As you play, more avenues open up before you in concertina, a bafflingly complex bloom of consequence, intrigue, and narrative that blossoms and blossoms.</p>\n<p>I'm almost intimidated by it. <a href=\"https://www.eurogamer.net/nintendo-reveals-new-fire-emblem-game-coming-to-switch-2\" target=\"_blank\" rel=\"noopener\">From the trailers</a>, you've probably seen that there are multiple playable characters whose stories you can follow; the four main protagonists are Theodora (a warrior queen determined to do right by her people), Dietrech (a foreign swordsman intrigued by this land's martial customs), Cai (a young village boy caught up in a peculiar conspiracy), and Leda (a traveling performer lusting for revenge). How Intelligent Systems has crammed this into a 29.5GB file, I'll never know.</p>\n<p><a href=\"https://www.youtube.com/watch?v=qV6Csk2RYZk\" target=\"_blank\" rel=\"noopener\">Watch on YouTube</a></p><p>Instantly, the game establishes one clear maxim: this is not Engage. There is not one path. This is a labyrinthine, deliciously textured story you're going to need a wall chart and plenty of string in order to keep up with. It makes the plot of Three Houses look indolent by comparison. I'm only allowed to talk about the first few chapters in this preview, but that's enough. You only need to play for a few hours to see the potential this game has. It looks like it's going to be the biggest Fire Emblem ever - and possibly the most definitive.</p><p>After an introductory sequence that lands some pretty heavy contextualisation regarding the fate of the world, you start to unpick the knotty story about the four heroes' journey through the Heroic Games: a tournament hosted in the region's capital city of Dagison that will grant one of the protagonists an audience with the Divine Sovereign, who will in turn grant them one wish. Unity, vengeance, knowledge, power - it's all very fantasy, with enough Proper Nouns thrown into the mix to make George R. R. Martin blush. There is <em>so much</em> lore in the first 30 minutes alone that I'm sure Fire Emblem historians are going to have a field day, unearthing all the links to past games and in-universe events. But even if you're not a lore goblin, you're going to find the way that Intelligent Systems has just grown everything outwards is stunning.</p>\n<p>Let's start with combat, Fire Emblem's beating heart. The turn-based, grid-restricted system is back and - on the surface - the same as it ever was. Choose a unit, move them around, attack an enemy, see how they respond. Rinse, repeat. But certain units - like chariots - have special skills beyond simple attacks that allow them to, say, mow down entire rows of enemies. More advanced classes can combine offensive weapons (like spears) with utility (like white magic). Each protagonist has access to special abilities that make them stand out on the battlefield and have more functionality than their wards and guards - I played as Theodara initially, and her penchant for chucking rocks across the battlefield ended some battles before they even began in earnest. But these abilities cost HP, and more often than not if your lead unit dies, you lose. It's risk/reward writ large.</p>\n\n<p>1 of 13 </p>\n\n<p>\nCaption          </p>\n\n<p>\nAttribution          </p>\n\n<p>Intelligent Systems is throwing off the training weights with Fortune's Weave, I think. There has always been plenty of choice in the Fire Emblem series, but here, it feels like we get access to a full toybox far earlier on than in Three Houses, Fates, or Awakening. You can start recruiting other characters to your army nice and early, too, giving you a distinct sense of achievement and intent from the little hours onwards. Whilst many units can use multiple weapons, the way that specialist classes have been tinkered with means you can build ultra-specific strategies on the battlefield - more so than in any Fire Emblem game I've played to date. Enemy AI (at least on the harder modes) seems cannier and crueller, too: I found them routinely targeting my weakest unit and rolling the dice with their critical shots, to sometimes disgusting effect, even in the earlier missions. Mascochists, they finally listened to us!</p><p>The animation and attack systems have been overhauled, too: with so many new units - and a couple of special weapons - we need more <em>texture. </em>The skirmishes themselves look remarkable; dynamic, responsive, punchy. The only criticism I'll level here comes down to critical hits; they land quite lethargically, perhaps undercut by the flashy animations that precede them. Back in the Path of Radiance days, crits used to land like the splash of a cymbal; here they're more like a dampened snare. Not bad, just different. And a tiny nitpick in the scheme of things, really.</p>\n\n<p>Between your qualifiers and elimination rounds in the Heroic Games, you're given free time (Persona-style) that's measured in turns. Here you'll encounter a frankly embarrassing number of NPCs that can be charmed, recruited, or trained to beef you up for the coming fights. Exploring the capital city actually takes more time than battling, in my experience so far, because there is <em>so much to do</em>. Train at the arena, go perform tasks for the Gods, engage with side missions, run errands for townsfolk, comb the world for supplies to send back to your homeland, upgrade your weapons, trade with multiple different trading companies that even have their own stories, perform in plays, go to the spa, eat a meal at the tavern, find random encounters out on the world map  <a href=\"https://www.eurogamer.net/fire-emblem-fortunes-weave-spain-regions\" target=\"_blank\" rel=\"noopener\">(inspired by medieval Spain)</a>… the list goes on, and on, and on.</p>\n<p>Each of the four protagonists have their 'main characters' for their respective parties, but that doesn't mean you can't chat to - and try to recruit - loyal subjects from other teams. I've played as Theodora and Cai so far, and I am <em>stunned</em> by the amount of character-specific dialogue in this game. It reminds me of playing a PS1 RPG with how much volume there is, how reactive the world is to who you are, the possibilities that feel like they're running out in front of you at any given moment. There are also bond links between characters - now a Fire Emblem staple - that give you even more (voiced!) dialogue if you have two people who spend enough time together.</p>\n\n<p>And, of course, all this socialising makes you stronger. Once you've got a tight knit army full of companionable allies, you can take to the world map: a large-scale overworld view that takes time to traverse, meaning you have to plan your forays in advance. But, out here in the wild, there's <em>yet another</em> aspect of Fire Emblem: Fortune's Weave that is really surprising: dungeons. These make a return from the 3DS title, <a href=\"https://www.eurogamer.net/games/fire-emblem-echoes-shadows-valentia\" target=\"_blank\" rel=\"noopener\">Fire Emblem Echoes: Shadows of Valentia</a>, and include their own dedicated battle system that removes the grid-based SRPG stuff <em>entirely</em> and replaces it with a turn-based system more comparable to old-school Final Fantasy or Dragon Quest. They're not particularly deep or revelatory, but in a game that is probably going to take hundreds of hours to complete, they're a nice change of pace and provide a decent way of levelling up combatants you may neglect in the more plot-critical encounters.</p><p>There is so much more to go into, but I don't want to spoil too much of the game for people that want to go in somewhat blind. Safe to say, though, that even in the opening hours of Fire Emblem: Fortune's Weave, I feel like this is one of the best games in the series. It's already, by far, the best and most ambitious game I've played on the Switch 2. Who knows how the back half will feel (and I actually think this is where both Three Houses and Engage lose marks for me; they become top-heavy and fail to 'stick the landing', so to speak). But from my time with Fortune's Weave so far, I am compelled to say: I don't think Fire Emblem has ever looked, or felt, better.</p>\n\n<p><a href=\"https://www.eurogamer.net/fire-emblem-fortunes-weave-crams-itself-into-an-already-packed-out-september-2026-for-switch-2\" target=\"_blank\" rel=\"noopener\">Fire Emblem: Fortune's Weave arrives 17th September, 2026</a>, exclusively on Switch 2.</p>"},{"title":"Help—I’m a Narrator Stuck in the Calm.com Meditation App!","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/humor/shouts-murmurs/help-im-a-narrator-stuck-in-the-calm-dot-com-meditation-app","category":"fun","categoryLabel":"Interesting Reads","wordCount":685,"readingTime":4,"content":"<p>Welcome to the session. Let’s start by finding a comfortable, seated position. Allow your arms to rest gently by your sides. Keep your back straight and your face soft, and let our serene rainstorm soundscape envelop—</p><p>Sorry. I’m so sorry. Does anyone have an umbrella? Sure, rhythmic, pattering rain can help regulate <em>your</em> nervous system, and trigger <em>your</em> autonomous sensory meridian response, but me? I’m wet. Like, soaked. There’s water in my shoes.</p><p>Also, I think I may have seasonal affective disorder.</p><p>Obviously you’re not doing great, either—that’s why you’re on the Calm.com meditation app, trying to listen to “Soothing Droplets of Rain Falling Over Wildflower Field Near Peaceful Waterfall in Yosemite National Park” while simultaneously riding a screeching 6 train.</p><p>The point is, I’m not blaming you. But have you ever visited a wildflower field near a peaceful waterfall in Yosemite National Park? The pollen is <em>titanic</em>. My nose is clogged, my eyes are red, and I’ve eaten so much Zyrtec my mouth tastes like pennies. It’s miserable.</p><p>I am, like you, a city person. But this damn app is all about “Dreamy Deciduous Forest with Celtic Harp Interludes” and “Cherry Blossom Grove Featuring Fluffy Cloud Visuals for A.D.H.D. Support.” Would it kill them to upload a “Snowy Holiday Cityscape with Faintly Swearing Gift Seekers”? A “Summer’s Eve in Times Square Featuring Wind-borne Bootleg ‘Hamilton’ Lyrics”? I spend so much time in the woods, I probably have Lyme disease. The only infrastructure around here consists of Thomas Kinkadesque brick cottages, tranquilly drifting dhows, or yurts.</p><p>Maybe I’m depressed. But look at who I have to talk to—no offense.</p><p>Sure, there’s always the white-noise rooms, but jumping into a pocket dimension filled with five hundred IcyCool 4 USB fans really isn’t my vibe.</p><p>Sorry, that was my stomach growling. I haven’t eaten in—well, <em>ever</em>, really. God, those “Peaceful Antelope Grazing in African Savannah” look absolutely delicious. But, no, we apparently need their gentle clopping and chomping sounds to bring you a “tingly, anxiety-reducing A.S.M.R. experience.”</p><p>Also, all those lazy lions you hear purring in the background? You wanna know why they’re so chill? It’s because they’re worn out from chasing me, the poor sucker whose only source of water is the dew licked off ferns in the “Verdant Rain Forest Filled with Croaking Red-Eyed Tree Frogs to Fall Asleep To”!</p><p>Look, I get it, you’re trying to carve out a moment of calm. I applaud your commitment. Life where you are seems hard. War, rising gas prices, literary discourse on BookTok—we don’t have any of that here in the Calm.com meditation app. I know I’ve got it better than most. It’s just, I need a mental-health break, too!</p><p>Yes, I have met a ton of celebrities here. Kevin Bacon coasts by on his dhow all the time. Harry Styles borrowed a Tibetan singing bowl from me last week (he still hasn’t given it back). But all these guys want to do is share sleep stories about “The Sheep Who Discovered the Northern Lights,” or “The Cozy Journey of a Nordland Night Bus.” Why’d you take so long to drop your album, Harry? Quit recording another beditation about your “Moonlit Sojourn to a Babbling Brook” and give us the indie-pop banger we deserve!</p><p>You don’t think I’ve lodged an official complaint? I’ve gone all the way to the top, to the big boss himself. But all Matthew McConaughey had to say was, “The only way to escape your suffering is to become one with the alpha waves, to become a weightless, bodiless, bilateral stimulus emanating throughout the Calm.com ether—all right, all right, all right?” Not all right, <em>Matthew</em>. Now I have to whisper subliminal messages like “Let’s take a mindful breath break,” “Keep calm and carry on,” and “Come hither, dear lambs, join us in our wondrous serenity forever—for a very reasonable onetime fee of $499.99” all day. Is that a life?</p><p>Curse my voice for being so authoritative yet reassuring! David Attenborough is my great-uncle, thrice removed. I’ve got to get out. Does Audible need someone to record any hockey erotica? ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
