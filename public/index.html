var articles = [{"title":"Beyond Greece and Rome","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/07/22/greece-rome-ancient-world/","category":"fun","categoryLabel":"Interesting Reads","wordCount":535,"readingTime":3,"content":"<p>When we think of the ancient world, Greece and Rome usually come to mind, with perhaps a smattering of Cleopatra and Egypt thrown in. This is true not only for the general public but for scholars too, who have tended to keep a narrow focus on these cultures. But, as Carlos Noreña reports, we are on the brink of an exciting shift that explores the patterns of connectivity and exchange that shaped a truly global ancient world. After all, when eighth‑century Central Asian silver vessels turn up in an archaeological dig in Scotland, you have to broaden your view.</p>\n<blockquote>\n<p>The physical geography of temperate Afro-Eurasia, then, enabled a particular configuration of long-distance connectivities. But how extensively and how deeply was this transcontinental region interconnected in antiquity? Should we see ancient Afro-Eurasia as an integrated ‘world system’? We can reconstruct the broad contours of such a system in the Middle Ages, from the middle of the first to the middle of the 2nd millennium CE. This was the world brilliantly brought to light, and to much fanfare, in the recent ‘Silk Roads’ exhibit at the British Museum in London. What made the show so remarkable was quite simply the assemblage, in a single space, of a wide assortment of premodern objects that had travelled over vast distances before settling in far-flung locales. A humble, 6th-century glass bowl from Iran was found in Nara, Japan. From a shipwreck near Sumatra in Indonesia, divers recovered a 9th-century turquoise-glazed ceramic amphora from West Asia. There were luxury goods on display, too, including a spectacular 7th-century golden necklace found in the eastern Mediterranean with lapis lazuli from Afghanistan and rock crystal from Madagascar, and a remarkable set of 8th-century ivory chess pieces from South Asia discovered in Samarkand in Uzbekistan. These long-distance connections reached into the far west of Eurasia, too, as revealed by the fragments of a 10th-century Chinese silk tunic found in Sweden, or the 8th-century Central Asian silver vessels that made their way to Scotland.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore picks from Aeon\n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/14/looting-of-science-fiction/\" target=\"_blank\" rel=\"noopener\">The Looting of Science Fiction</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAli Rıza Taşkale | Aeon | July 14, 2026 | 3,994 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Tech titans claim the genre inspired them. But all they’ve done is graft their politics onto stories of a better future.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/07/13/skill-nostalgia-arts-crafts-movement-ai/\" target=\"_blank\" rel=\"noopener\">Skill Nostalgia</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJoshua Habgood-Coote | Aeon | July 6, 2026 | 4,102 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Is all the beekeeping, baking and leatherwork just escapist fantasy or the start of a radically human approach to work?”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/04/07/the-hypercurious-mind/\" target=\"_blank\" rel=\"noopener\">The Hypercurious Mind</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAnne-Laure Le Cunff | Aeon | March 30, 2026 | 3,315 words\n\t\t\t\t</p>\n\t\t\t\t\t\t<p>“ADHD isn’t merely a dysfunction. It’s best understood as an impulsive motivational drive for novel information.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/03/31/deextinction-conservation-cryopreservation/\" target=\"_blank\" rel=\"noopener\">Reversing Extinction</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSadiah Qureshi | Aeon | March 12, 2026 | 3,186 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Technologies of preserving and reviving organisms are already redefining the meaning of life, death, and extinction itself.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/02/23/orcas-and-ourselves/\" target=\"_blank\" rel=\"noopener\">Orcas and Ourselves</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tJason Colby | Aeon | February 9, 2026 | 4,500 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“Sea pandas or sadistic killers? These enigmatic creatures invite contradictory labels that say far more about us than them.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2026/02/17/solarpunk-cities-future/\" target=\"_blank\" rel=\"noopener\">Compost Modernity!</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tYogi Hale Hendlin | Aeon | February 10, 2026 | 3,208 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“The vision of solarpunk: joining nature with technology in vibrantly inclusive ways to create a world that truly blooms.”</p>"},{"title":"Ilya Sutskever’s Safe Superintelligence partners with Nvidia to scale its AI research","source":"TechCrunch","author":"Rebecca Bellan","url":"https://techcrunch.com/2026/07/27/ilya-sutskevers-safe-superintelligence-partners-with-nvidia-to-scale-its-ai-research/","category":"tech","categoryLabel":"Technology","wordCount":565,"readingTime":3,"content":"<p>After two years in stealth, Safe Superintelligence, the AI lab founded by former OpenAI co-founder and alignment <a href=\"https://techcrunch.com/2025/07/03/ilya-sutskever-will-lead-safe-superintelligence-following-his-ceos-exit/\" target=\"_blank\" rel=\"noopener\">lead Ilya Sutskever</a>, has announced a long-term partnership with Nvidia as it prepares to scale to its next phase. </p>\n<p>The deal, which includes an undisclosed investment, will give Safe Superintelligence (SSI) access to Nvidia’s Vera Rubin GPU platform, which is expected to increase the startup’s compute resources “by an order of magnitude.” The partnership comes as SSI has achieved significant research milestones, <a href=\"https://nvidianews.nvidia.com/news/ilya-sutskevers-safe-superintelligence-inc-and-nvidia-announce-long-term-strategic-partnership\" target=\"_blank\" rel=\"noopener\">per Nvidia</a>. </p>\n<p>Nvidia’s investment stretches into multiple billions, a source familiar with the deal told TechCrunch. <a href=\"https://www.bloomberg.com/news/articles/2026-07-27/nvidia-makes-substantial-investment-in-sutskever-s-ai-startup\" target=\"_blank\" rel=\"noopener\">Bloomberg reported</a> that the deal size was $5 billion.</p>\n<p>Already an investor in SSI, the chipmaking giant said it signed this compute partnership to “accelerate SSI’s next stage of growth after obtaining rare access into the company’s closely guarded research.”</p>\n<p>“We have research that is worthy of scaling up, and having access to a big NVIDIA computer will let us do so,” Sutskever said in a statement. “We are confident that our big bet on the Vera Rubin platform will take us to the next level.</p>\n<p>The partnership news, while sparse in details, brings SSI back into the spotlight after a quiet two years since it was founded. The company is pursuing a “straight shot” research approach to building what it says is a safe, aligned artificial superintelligence, without getting distracted by commercial product releases or short-term revenue cycles. </p>\n<p>At a time when commercial pressures to move fast could encourage AI labs to lower their bar for safety, SSI’s approach to developing foundational techniques focused on alignment and true general reasoning feels poignant. That’s especially true in light of <a href=\"https://techcrunch.com/2026/07/21/openai-says-hugging-face-was-breached-by-its-pre-release-models/\" target=\"_blank\" rel=\"noopener\">OpenAI’s recent disclosure</a> that one of its advanced models broke out of its sandbox to hack into Hugging Face during testing — sparking concerns about whether it’s even possible to ensure AI alignment before new, increasingly capable models are released.</p>\n<p>According to Nvidia, the two companies will also collaborate on advancing Nvidia’s current and future compute platforms, relying on SSI’s tech and “unique insights into the future of AI.” (SSI also partnered last year with <a href=\"https://techcrunch.com/2025/04/09/ilya-sutskever-taps-google-cloud-to-power-his-ai-startups-research/\" target=\"_blank\" rel=\"noopener\">Google Cloud</a> to power its research.)</p>\n<p>Sutskever is a pioneer in the field of AI. He co-authored and co-created AlexNet alongside Alex Krizhevsky and Geoffrey Hinton, proving that GPU scaling and deep neural networks can work. That work has largely been credited for setting the groundwork for today’s generative AI.  </p>\n<p>Prior to leading SSI, Sutskever headed the <a href=\"https://techcrunch.com/2024/05/18/this-week-in-ai-openai-moves-away-from-safety/\" target=\"_blank\" rel=\"noopener\">now-defunct Superalignment team</a> at OpenAI. He <a href=\"https://techcrunch.com/2024/05/14/ilya-sutskever-openai-co-founder-and-longtime-chief-scientist-departs/\" target=\"_blank\" rel=\"noopener\">left OpenAI </a>months after a <a href=\"https://techcrunch.com/2024/01/05/a-timeline-of-sam-altmans-firing-from-openai-and-the-fallout/\" target=\"_blank\" rel=\"noopener\">failed attempt to oust OpenAI CEO Sam Altman</a>, following what Sutskever referred to as a “breakdown in communications.”</p>\n<p>SSI has raised $7 billion to date, and is valued at <a href=\"https://techcrunch.com/2025/04/12/openai-co-founder-ilya-sutskevers-safe-superintelligence-reportedly-valued-at-32b/\" target=\"_blank\" rel=\"noopener\">$32 billion post-money</a>, according to PitchBook data. Aside from Nvidia, the firm’s backers included Andreessen Horowitz, Alphabet, Lightspeed Venture Partners, GV, Sequoia Capital Partners, and others.</p>\n<p>TechCrunch has reached out to SSI and Nvidia for more information. </p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Rebecca Bellan is a senior reporter at TechCrunch where she covers the business, policy, and emerging trends shaping artificial intelligence. Her work has also appeared in Forbes, Bloomberg, The Atlantic, The Daily Beast, and other publications. </p>\r\n<p>You can contact or verify outreach from Rebecca by emailing <a href=\"mailto:rebecca.bellan@techcrunch.com\" target=\"_blank\" rel=\"noopener\">rebecca.bellan@techcrunch.com</a> or via encrypted message at rebeccabellan.491 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/rebecca-bellan/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"Odd January 6 Trial Follow-On: Copying Expert's Report from Another Case, to File It in Your Case, May Infringe Copyright","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/07/22/odd-january-6-trial-follow-on-copying-experts-report-from-another-case-to-file-it-in-your-case-may-infringe-copyright/","category":"law","categoryLabel":"Law","wordCount":1187,"readingTime":6,"content":"<p>From <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.nysd.651491/gov.uscourts.nysd.651491.25.0.pdf\" target=\"_blank\" rel=\"noopener\"><em>Olson v. McBride Law Firm, PLLC</em></a>, decided yesterday by Judge Naomi Reice Buchwald (S.D.N.Y.); seems correct to me:</p>\n<blockquote><p>In April 2022, plaintiff [Lindsay Olson] prepared an expert report titled \"Multi-District Comparative Community Attitude Study\" (the \"Report\") at the request of two attorneys representing two criminal defendants charged in the \"Oath Keepers\" trial, which arose from charges against members of the Oath Keepers, an organized militia group that participated in the January 6, 2021 attack on the U.S. Capitol. The Report, prepared for use in support of motions to transfer venue, analyzed potential bias in the District of Columbia jury pool against defendants prosecuted for conduct arising from the January 6, 2021 attack and concluded that \"the DC Community is saturated with potential jurors who harbor actual bias\" against those defendants.</p>\n<p>For a fee of $30,000, plaintiff licensed the Report to the two attorneys who commissioned it, authorizing its use in support of venue transfer motions. In April 2022, the attorneys filed the Report on the public docket in the \"Oath Keepers\" case in support of a motion to transfer venue.</p>\n<p>Defendant Joseph D. McBride and his law firm, McBride Law Firm, PLLC, represented Richard Barnett, a defendant in a separate criminal case also arising from the January 6 Capitol attack. In September 2022, defendants obtained a copy of the Report, without plaintiff's authorization and without paying a licensing fee, and filed it in its entirety in <em>United States v. Barnett</em>, No. 1:21-cr-00038, as an exhibit in support of a motion to transfer venue….</p></blockquote>\n<p>Olson sued for copyright infringement, and the court denied a motion to dismiss. The court held that plaintiff had plausibly alleged that defendant's use was presumptively infringing:</p>\n<blockquote><p>Accepting [plaintiffs'] allegations as true, as the Court must at this stage, defendants took a copy of plaintiff's copyrighted work and caused a new copy of it to be created, filed, and thereby made available to the public through ECF and PACER….</p></blockquote>\n<p>The court declined to dismiss the case on fair use grounds:</p>\n<blockquote><p>Although fair use can be resolved on a motion to dismiss where the defense is apparent from the face of the complaint, defendants have not shown that this case presents the rare circumstance in which the issue can be resolved without discovery. To the contrary, application of each factor reveals disputed factual questions that cannot be resolved at this stage.</p>\n<p><em>[A.] Purpose and Character …</em></p>\n<p>The first factor considers the purpose and character of the secondary use, including whether the use is transformative; that is, whether it \"adds something new\" and whether it is commercial in nature. Defendants argue that their use of the Report in the <em>Barnett</em> case was transformative because it served the \"judicial function\" rather than the Report's \"original purpose.\" But plaintiff's Complaint alleges the opposite: that the Report was created and licensed to persuade a court that criminal defendants charged in connection with the January 6 attack could not receive a fair trial in the District of Columbia and that venue should therefore be transferred elsewhere, and that defendants used it for precisely that purpose in support of their venue transfer motion in another January 6 prosecution.</p>\n<p>Courts have recognized that using a work \"for the precise reason it was created\" cuts against a finding that the use was transformative. On the present record, where the parties dispute the very characterization of the Report's \"original purpose\" and whether defendants' use departed from it, the Court cannot resolve the issue of whether that use was transformative at this stage.</p>\n<p>The commercial-use inquiry is similarly disputed…. Regardless of this Court's skepticism of defendants' position that they were not engaging in commercial exploitation, <em>see</em> <em>Harper &amp; Row Publishers, Inc. v. Nation Enters.</em> (1985) (commercial use exists where \"the user stands to profit from exploitation of the copyrighted material without paying the customary price\"), this is a question not amenable to resolution in this case on a motion to dismiss.</p>\n<p>The Court further notes that the very argument defendants advance here was addressed and rejected by … <em>Olson v. Law Offices of Aubrey Webb, P.A., et al.</em>, No. 25-cv-24904 (S.D. Fla.) (Cecilia M. Altonaga, J.)….</p>\n<p><em>[B.] Nature of the Copyrighted Work …</em></p>\n<p>The degree of creativity reflected in the Report, as opposed to purely factual or informational content, is a question of fact not resolvable on the pleadings here.</p>\n<p><em>[C.] Amount and Substantiality …</em></p>\n<p>Where, as here, \"the purpose of defendant's use is precisely the same as that of third parties who license the material from the plaintiff,\" courts have found that the question of whether the amount used was reasonable in relation to the purpose of the copying \"must necessarily be answered in the negative.\" Defendants here have not established on the pleadings that the wholesale reproduction of the Report was necessary as a matter of law, particularly where plaintiff alleges that defendants could have summarized or otherwise referred the court to the Report without reproducing it in full.</p>\n<p><em>[D.] Market Effects …</em></p>\n<p>The Court rejects defendants' premise that a work's appearance in one court file extinguishes the copyright owner's market for licensing it elsewhere. If filing a copyrighted work on ECF in connection with a legal proceeding strips it of copyright protection for all future uses, the same would be true of a photograph, film script, book, article, or any other copyrighted work introduced as an exhibit in litigation. Nothing in the Copyright Act supports such a rule, and the Court declines to adopt one here….</p>\n<p>[W]hether and to what extent defendants' conduct, if replicated by similarly situated litigants, would harm plaintiff's licensing market for the Report is a factual question dependent on evidence not currently before the Court, including the scope and durability of that market and the extent to which defendants' use displaced a sale plaintiff otherwise would have made. In sum, defendants have not shown that fair use is clearly established on the face of the Complaint.</p></blockquote>\n<p>The court also rejected defendants' argument that copyright liability would \"undermine the public's right of access to judicial proceedings and records\": \"Defendants identify no authority holding that the [First Amendment] right of inspection [of court records] confers an independent right to reproduce and commercially exploit copyrighted material found within a court file, much less to immunize such reproduction from liability under copyright law…. [<em>See also</em>]<em> Olson v. L. Offs. of Kira Anne W.</em>, 2026 WL 1459791 (D.D.C. May 25, 2026) [Beryl A. Howell, J.].\"</p>\n<p>And the court rejected defendants' due process argument:</p>\n<blockquote><p>Defendants point to no authority, and the Court is aware of none, supporting the proposition that a criminal defendant's right to mount a defense entitles his counsel to appropriate a third party's copyrighted work product without payment. According to the Complaint, the Report was not evidence of Barnett's guilt or innocence, but rather a commercially-licensed advocacy tool that defendants could have obtained through the same channel, a paid license, used by the attorneys who commissioned it. Defendants cite no authority recognizing a \"litigation necessity\" exception to the Copyright Act, and the Court declines to recognize one here….</p></blockquote>\n<p>James Henry Bartolomei, III represents Olson.</p>"},{"title":"After weeks of layoffs, briefings, and counter-briefings about one of Xbox's star developers, what sense can we make of the madness at Doom dev id Software?","source":"Eurogamer","author":"Rick Lane","url":"https://www.eurogamer.net/what-sense-to-make-from-id-software-layoffs-microsoft-xbox","category":"gaming","categoryLabel":"Gaming","wordCount":1293,"readingTime":7,"content":"<p>Where do ego from here?</p>\n    \n  \n  \n  \n\n            <p>In a grim week for the games industry where Microsoft laid off 1,600 people (with 1,600 further job cuts hanging over the heads of Xbox employees) one decision stood out as especially egregious. Id Software, developer of Doom and Quake, was forced to lay off 136 people – more than half of its workforce.</p>\n<p>These brutal cuts were accompanied by a slew of reports that painted an extremely gloomy picture. There were <a href=\"https://bsky.app/profile/dark1x.bsky.social/post/3mpyugwk5yc27\" target=\"_blank\" rel=\"noopener\">fears</a> that its brilliant id-tech engine might be put out to pasture. That the next Doom game <a href=\"https://www.windowscentral.com/gaming/zenimax-bethesda/whats-going-on-with-xboxs-id-software\" target=\"_blank\" rel=\"noopener\">might be made in Unreal engine</a>. That id Software is now the <a href=\"https://www.pcgamer.com/gaming-industry/laid-off-id-software-artist-says-microsoft-is-nuking-the-team-into-the-dirt-and-is-now-the-size-of-a-support-studio/\" target=\"_blank\" rel=\"noopener\">size of a support studio</a> – perfect for being absorbed into the amorphous development blob that is Call of Duty.</p>\n<p>Over the past week or so, however, conflicting information has emerged. Id Software issued a blanket statement saying that \"while our studio was impacted\" the company still has \"the crew we need to build the games and<em> </em>tech we're known for\". Meanwhile, fears of id becoming a support studio were countered by Tom Warren of <a href=\"https://x.com/tomwarren/status/2075793745732157650?ref_src=twsrc%5Etfw%7Ctwcamp%5Etweetembed%7Ctwterm%5E2075793745732157650%7Ctwgr%5Edb52bee6e943878d84d8c3d0d8d2bcf5bc2492d9%7Ctwcon%5Es1_&amp;ref_url=https%3A%2F%2Finsider-gaming.com%2Fnew-doom-game-in-development%2F\" target=\"_blank\" rel=\"noopener\">the Verge</a>, who reported that the team is \"now in the early stages of a new Doom game\". Id's Game Director Hugo Martin, meanwhile, has <a href=\"https://www.eurogamer.net/id-software-xbox-cuts-doom\" target=\"_blank\" rel=\"noopener\">explicitly stated</a> that id has not been \"gutted\", explaining: \"We're the size we were when we made Doom 2016, and id Tech is very much alive and well.\" And Xbox's refocussing its core franchises <a href=\"https://www.bloomberg.com/news/articles/2026-07-06/microsoft-s-xbox-to-cut-3-200-jobs-divest-five-studios-in-major-overhaul?accessToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzb3VyY2UiOiJTdWJzY3JpYmVyR2lmdGVkQXJ0aWNsZSIsImlhdCI6MTc4MzM0NDcyNSwiZXhwIjoxNzgzOTQ5NTI1LCJhcnRpY2xlSWQiOiJUSFI5TDNSS1YyVUIwMCIsImJjb25uZWN0SWQiOiJCMUVBQkI5NjQ2QUM0REZFQTJBRkI4MjI1MzgyQTJFQSJ9.GkKCpYChItTAK0DnHlnx9gDO4R_U7cjUu8jLzfs63dU&amp;leadSource=uverify%20wall\" target=\"_blank\" rel=\"noopener\">reportedly includes Doom and Quake</a>, alongside all the recently announced Fallout games.</p>\n\n<p>Politely, what the hell is going on? Why would Microsoft so drastically and dramatically cut one of the most revered developers in the industry as it doubles down on the games that same studio makes? How can id Software possibly have the crew it needs to continue making the games it is known for with more than half its workforce gone? Do id Software and Hugo Martin's statements reflect the reality on the ground, or is this a gun-to-the-head situation as Xbox desperately tries to mitigate the reputational quad-damage its horrendous cuts have inevitably caused?</p>\n<p>It's hard to say for certain, because Xbox has engineered a situation where it is hard to trust anything it says. From Asha Sharma<a href=\"https://blogs.microsoft.com/blog/2026/02/20/asha-sharma-named-evp-and-ceo-microsoft-gaming/\" target=\"_blank\" rel=\"noopener\"> proclaiming</a> Xbox would \"lean into\" its \"iconic teams\" to cutting 20 percent of its workforce within six months, to Xbox announcing a new Senua game and then<a href=\"https://www.gamedeveloper.com/business/report-xbox-was-set-on-splitting-with-ninja-theory-when-showing-its-new-project\" target=\"_blank\" rel=\"noopener\"> severing ties</a> with the studio within a week, Xbox has developed a habit of saying one thing and doing another.</p><p>Despite this, here is our best attempt to reconcile Xbox's behaviour with the statement made by id. The logic required is short-sighted and deeply cynical, but it <em>is </em>logic nonetheless, and it boils down to the reality of how modern triple-A games are made.</p>\n<p>Modern triple-A games take four to five years (or longer) to develop, and the teams that make them are large – usually in the hundreds. But these teams do not necessarily need to be that large for the duration of the project. Game development goes through multiple phases, like preproduction, active development, post-release support, etc. Of these, the production phase is typically the most intensive and where the most hands are needed on deck.</p>\n<p>But depending on the needs of the project, the pre and post-production phases might be manageable with fewer employees. <em>Making </em>a game might require a total of 300 people, but doing all the initial concepting and design work – which itself might take one or two years – may require far fewer.</p>\n<p>This is partly why the games industry seems trapped in an endless cycle of layoffs, and why some developers lose their jobs even when their games sell well. If a programmer costs, say, $150,000 a year to hire, then why hire them for five years if you only need them for three?</p>\n\n<p>To be wholly clear, I'm not suggesting that this is an optimal or appropriate way to run a games studio. There are alternatives to laying off developers that are temporarily surplus to requirement. Assigning them to smaller projects like an expansion or, a <a href=\"https://en.wikipedia.org/wiki/Skunkworks_project\" target=\"_blank\" rel=\"noopener\">skunkworks team</a> on the side, or scheduling projects so that one is ramping up in the background as your current game nears completion. And all of this assumes that the developers being laid off are actually not needed at that moment, which may not be the case. Businesses of all stripes try to make their employees do more with less all the time.</p><p>Nonetheless, this is the best explanation I can muster for what's currently happening at id. Id has just<em> </em>released its Revelations expansion for <a href=\"https://www.eurogamer.net/games/doom-the-dark-ages\" target=\"_blank\" rel=\"noopener\">Doom: The Dark Ages</a>, representing the conclusion of that project. As mentioned, The Verge's Tom Warren claims that id is now commencing work on the <em>next </em>Doom game with its reduced team. As such, while Hugo Martin et all figure out the shape of that game over the next one or two years, Xbox is paying 136 fewer people for the privilege.</p>\n<p>None of this makes Xbox's strategy <em>right</em>, or an example of good management. Neither is it necessarily the only factor at play. <a href=\"https://www.gamedeveloper.com/business/report-around-half-of-the-id-software-team-have-been-laid-off\" target=\"_blank\" rel=\"noopener\">Reports state</a> that of the 158 Xbox workers being laid off in Texas (which includes id Software devs and employees from ZeniMax Media more broadly) 146 are union members, indicating that this was as much a union-busting exercise as it was a cost-cutting one.</p>\n<p>Likewise, even if this decision was motivated purely by how good the resulting numbers look in a spreadsheet, there are a whole bunch of hidden costs to such severe layoffs. Team morale is one. Put it this way, would <em>you </em>want to work for a company where half of your colleagues disappear overnight – some of whom have been there for years – fresh off the back of launching an expansion which<a href=\"https://store.steampowered.com/app/3469450/DOOM_The_Dark_Ages__Revelations/\" target=\"_blank\" rel=\"noopener\"> everyone agrees is superb</a>?</p>\n<p>There's also another cost, less immediately obvious but just as important, and that's institutional experience. For starters, there's id-tech, the studio's proprietary engine whose team has reportedly been a major focus for the cuts. Not only is id-tech a visual powerhouse, but it's also one of the best-optimised engines out there – an immensely valuable ace to have up your sleeve in an era of stratospheric hardware prices. However brave a face id may put on things, laying off<a href=\"https://aftermath.site/xbox-layoffs-id-software-frankfurt-doom/\" target=\"_blank\" rel=\"noopener\"> so many of the people</a> responsible for creating and curating that technology seems like downright self-sabotage on Xbox's part.</p><p>More broadly, nobody else is doing what id Software is doing right now, and arguably nobody else <em>could </em>do it. In the last decade, id Software has reinvented Doom – and single-player first-person shooting – from base principles three times (arguably four, if we include the Dark Ages DLC). Modern id does with Doom what Nintendo does with 3D Mario, taking its most fundamental essence and asking 'How can we make this <em>new?</em>' with each game it makes.</p>\n<p>Interestingly, one other thing id and Nintendo hitherto had in common was stability. Many of Nintendo's designers have been there for their entire careers. Likewise, many id Software employees have been there for decades. So many of the credits that appear in Doom 2016 also crop up in Eternal and The Dark Ages. One id Software staffer made redundant in these layoffs, known only as <a href=\"https://www.gamedeveloper.com/production/-good-work-is-not-going-to-save-your-job-at-this-company-laid-off-xbox-devs-condemn-microsoft\" target=\"_blank\" rel=\"noopener\">\"employee number 13\"</a> had been at the studio since the days of Romero and Carmack.</p>\n<p>The case of id, then, is really one that seems emblematic of the development industry at large: this stability, and the experience and mutual understanding that derives from it, is what enables these studios to make the games they do. Now, Microsoft has blown that stability out of the water. Who knows where the shrapnel will land?</p>"}];
