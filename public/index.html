<script>
var articles = [{"title":"Terabytes of credentials leaked in massive supply-chain attack","source":"Ars Technica","author":"","url":"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/","category":"tech","categoryLabel":"Technology","wordCount":1037,"readingTime":6,"content":"<p><a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#main\" target=\"_blank\" rel=\"noopener\">\n  Skip to content\n</a></p>\n            \n  \n      \n        <p>\n    \n  \n  \n    TEAMPCP’S RAMPAGE CONTINUES\n  \n</p>\n      \n      <p>\n        The data was scraped and exfiltrated from 2,500 users of a compromised AI package.\n      </p>\n          \n    \n<p>Terabytes worth of credentials, many belonging to the world’s biggest and most sensitive organizations, have been exposed in a supply-chain attack on LiteLLM, an open source tool that streamlines AI-driven software development. Microsoft, Amazon, Cisco, Samsung, and Salesforce are only a handful of the entities whose access secrets were exposed.</p>\n<p>The revelation was posted on <a href=\"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines\" target=\"_blank\" rel=\"noopener\">Tuesday</a> and <a href=\"https://www.hudsonrock.com/blog/largest-ai-supply-chain-breach-of-2026-litellm-hack-impacts-thousands-of-global-enterprises-claim-your-ethical-disclosure\" target=\"_blank\" rel=\"noopener\">Wednesday</a> by security firms CloudSEK and Hudson Rock. CloudSEK said it found cloud keys, repository tokens, SSH keys, Kubernetes secrets, package publishing credentials, environment variables, and AI provider keys that could allow attackers to gain access to more than 2,500 organizations.</p>\n<h2>40 minutes is all it takes</h2>\n<p>The credentials were extracted during a 40-minute window in March while the victims used compromised versions of LiteLLM downloaded from the package’s official location in the Python Package Index repository. Hudson Rock said it made the discovery after analyzing a 195TB file that it obtained. Neither firm identified the source of the information.</p>\n<p>The LiteLLM compromise was the result of a <a href=\"https://arstechnica.com/security/2026/03/widely-used-trivy-scanner-compromised-in-ongoing-supply-chain-attack/\" target=\"_blank\" rel=\"noopener\">previous supply-chain attack</a> that infected the widely used vulnerability scanner Trivy. Other software infected in the campaign includes <a href=\"https://www.kics.io/\" target=\"_blank\" rel=\"noopener\">KICS</a> and the <a href=\"https://developers.telnyx.com/development/sdk/python\" target=\"_blank\" rel=\"noopener\">Telnyx Python SDK</a>. TeamPCP, a ramshackle but extremely capable gang largely made up of teenagers, took credit for the attack, and researchers have largely corroborated the claim.</p>\n<p>“I’ve confirmed the data is legit, by the way, multiple victim orgs,” independent security researcher Kevin Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117082985466021541\" target=\"_blank\" rel=\"noopener\">said</a>. “It contains a significant volume of sensitive content at orgs. It’s a massive supply chain breach due to poor AI security—not because AI is the threat, but teens can run circles around orgs obsessed with rushing out AI and poor DevOps security.”</p>\n                  \n    \n<p>The compromised versions of all four software packages contained code that accessed the memory of infected machines, scraped its contents, and exfiltrated it through an attacker-controlled channel. The data is filled with an assortment of information. Interspersed in the wall of data are credentials to software pipelines maintained by the tens of thousands of organizations that ran LiteLLM during the 40-minute span that the supply-chain attack remained active.</p>\n<p>In all, both security firms said some 434,000 CI/CD (continuous integration/continuous delivery) software pipelines had credentials exposed after running the compromised LiteLLM versions. In many cases, researchers at CloudSEK and Hudson Rock had trouble identifying the organizations the credentials belonged to. For instance, an email address in the dump from the domain @siriusxm.com ultimately didn’t indicate a breach at the satellite broadcaster, but rather one within the infrastructure of SiriusXM subsidiary AdsWizz.</p>\n\n<p>A full list of organizations is <a href=\"https://exposure.cloudsek.com/ai-supply-chain-incident\" target=\"_blank\" rel=\"noopener\">here</a>. The researchers had high confidence that these organizations had their credentials exposed:</p>\n<ul>\n<li>Nvidia Corporation</li>\n<li>Amazon Web Services (AWS)</li>\n<li>Samsung Electronics</li>\n<li>samsung.com</li>\n<li>Salesforce, Inc.</li>\n<li>Cisco Systems, Inc.</li>\n<li>F. Hoffmann-La Roche AG</li>\n<li>ServiceNow</li>\n<li>Siemens AG</li>\n<li>S&amp;P Global</li>\n<li>Airbus US Space &amp; Defense</li>\n<li>John Deere</li>\n<li>Regeneron Pharmaceuticals, Inc.</li>\n<li>London Stock Exchange Group (LSEG)</li>\n<li>Thomson Reuters</li>\n<li>FedEx</li>\n<li>Munich Remunichre.com</li>\n<li>MediaTek Inc.</li>\n<li>Volkswagen AG</li>\n<li>Deloitte</li>\n<li>The Kroger Co.</li>\n<li>Siemens Energy</li>\n<li>Thales Group</li>\n<li>X Corp (Twitter)</li>\n<li>Zscaler, Inc.</li>\n<li>Epic Games</li>\n<li>Orange S.A.</li>\n<li>HP Inc.</li>\n<li>Philips</li>\n<li>Fortum Oyj</li>\n<li>Vodafone Group Plc</li>\n<li>Carl Zeiss AG</li>\n<li>Deutsche Bahn AG</li>\n<li>NGINX, Inc.</li>\n<li>BT Group</li>\n<li>Liebherr</li>\n<li>Krungthai Bank Public Company Limited</li>\n<li>Roku, Inc.</li>\n</ul>\n<p>“Many CI/CD pipelines are configured generically,” Hudson Rock said. “The dumped variables contain active database passwords, third-party API keys, and cloud credentials without any identifiable company email, custom domain string, or internal server name. This means countless organizations currently have active secrets sitting in this database, completely unaware of their exposure.”</p>\n<h2>Welcome to the new world of supply-chain attacks</h2>\n<p>Both firms are urging all organizations that used the compromised versions of LiteLLM—particularly those listed in the high-confidence section of the list—to thoroughly rotate all credentials in their pipelines. Hudson Rock instructed any organization that uses any AI proxy infrastructure, third-party CI/CD vulnerability scanners, or downstream AI packages to immediately audit their environment for versions 1.82.7 and 1.82.8 of LiteLLM, the two compromised versions of the software.</p>\n                  \n    \n        \n<p>The firm advised all those affected to perform “aggressive credential revocation,” assume any secret accessible to the LiteLLM environment is compromised, invalidate and rotate all cloud keys, Kubernetes service account tokens, and GitLab/GitHub PATs, and audit logging and egress filtering.</p>\n<p>As a cautionary tale, CloudSEK said that Trivy developers rotated but failed to fully revoke an automation token over a 20-day window. The lapse gave the attackers a nearly three-week period to force-push malicious code to third-party builds that used the vulnerability scanner. As Beaumont observed, organizations’ rush to integrate AI into their software delivery systems has also greatly contributed to the scale of the damage.</p>\n<p>Update: There are already signs that some of the affected organizations aren’t taking the disclosure with the seriousness warranted. After this post went live, Beaumont <a href=\"https://infosec.exchange/@GossiTheDog@cyberplace.social/117084862543112580\" target=\"_blank\" rel=\"noopener\">reported</a>:</p>\n<blockquote><p>These creds date from about March. One of the orgs impacted told me they’d rotated them all and it’s a nothingburger, so I looked at their responsible disclosure policy, it allows trying creds, so I tried them all. Almost every one worked. Submitted report. One of the biggest US techcos.</p></blockquote>\n<p>Ultimately, the new revelations concerning the LiteLLM supply-chain attack underscore the growing threat of such campaigns and hence the importance of maintaining vigilance around the use of open source software that, when infected, can spread rapidly across the Internet.</p>\n<p>“The key takeaway is how supply chains have evolved to make a single upstream breach affect thousands of companies simultaneously,” Alon Gal, co-founder and chief technology officer of Hudson Rock, wrote in an email. “A window of roughly 40 minutes in which the LiteLLM dependency was hacked led to over 430,000 instances in which millions of secrets were harvested. This magnitude pushes us into a completely new world regarding the type of response required from the cybersecurity industry.”</p>\n<p><em>Post updated to add image.</em></p>\n                  \n  \n  \n          <p><a href=\"https://arstechnica.com/author/dan-goodin/\" target=\"_blank\" rel=\"noopener\"></a></p>\n  \n  \n    <p>\n      Dan Goodin is Senior Security Editor at Ars Technica, where he oversees coverage of malware, computer espionage, botnets, hardware hacking, encryption, and passwords. In his spare time, he enjoys gardening, cooking, and following the independent music scene. Dan is based in San Francisco. Follow him at <a href=\"https://infosec.exchange/@dangoodin\" target=\"_blank\" rel=\"noopener\">here</a> on Mastodon and <a href=\"https://bsky.app/profile/dangoodin.bsky.social\" target=\"_blank\" rel=\"noopener\">here</a> on Bluesky. Contact him on Signal at DanArs.82.\n    </p>\n  \n\n  <p>\n    <a href=\"https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/#comments\" target=\"_blank\" rel=\"noopener\">\n    \n    91 Comments\n  </a>\n      </p>\n              \n  \n  \n      \n    <ol>\n              <li>\n                      <a href=\"https://arstechnica.com/gadgets/2026/09/the-army-just-used-a-20-kilowatt-laser-to-take-out-three-drones/\" target=\"_blank\" rel=\"noopener\">\n              \n            </a>\n        </li>\n                      \n                      \n                      \n                      \n                      </ol>"},{"title":"No TRO Against Arkansas Democrat-Gazette as to Publishing of Data Center Plans","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/02/no-tro-against-arkansas-democrat-gazette-as-to-publishing-of-data-center-plans/","category":"law","categoryLabel":"Law","wordCount":551,"readingTime":3,"content":"<p>From <a href=\"https://www.kark.com/news/arkansas-courts/entergy-files-in-federal-court-to-stop-disclosure-of-west-memphis-data-center-agreement/\" target=\"_blank\" rel=\"noopener\">KARK (Alex Kienlen)</a> today, reporting on a decision by Judge Lee Rudofsky (E.D. Ark.) in <em>Entergy Arkansas LLC v. Arkansas Democrat-Gazette Inc.</em>:</p>\n<blockquote><p>A federal judge issued a decision on Wednesday denying a request by lawyers for Entergy Arkansas to stop the use of documents released under the Freedom of Information Act (FOIA) to a Little Rock woman….</p>\n<p>The Democrat-Gazette reported on Monday that the Entergy documents, including some marked \"confidential,\" were released after Jessica Kivell filed her FOIA request with the Public Service Commission and shared them with the newspaper….</p>\n<p>The filing asked that the defendants be immediately prohibited from using or disclosing the documents, since it would do \"irreparable harm\" by disclosing Entergy Arkansas' trade secrets.</p></blockquote>\n<p>There is no written opinion from Judge Rudofsky; but besides the general First Amendment rules against temporary restraining orders barring speech, the matter also seems to me to be governed by <em>Florida Star v. B.J.F. </em>(1989).</p>\n<p><em>Florida Star</em> basically says (to oversimplify slightly) that people have a First Amendment right to publish information that was disclosed by the government, even if the government erred in disclosing it. That case involved publishing the name of a rape victim that was erroneously disclosed by a police department; even though state law barred newspapers from publishing rape victims' names, the Court held that the newspaper had a First Amendment right to do so. Likewise, even if trade secret law bars newspapers from publishing information that they indirectly obtain (and I'm not sure that it does), they have the right to do so when it is obtained from the Public Service Commission, even if the Commission erred in disclosing it (again, far from clear).</p>\n<p>Unfortunately, the motion for a temporary restraining order is sealed, so it's hard to be sure of the arguments plaintiff made. I hope the motion will be unsealed at some point soon, though.</p>\n<p>For more on the underlying controversy, see the Monday story in the <a href=\"https://www.arkansasonline.com/news/2026/aug/31/google-to-pay-entergy-arkansas-526-million-for/\" target=\"_blank\" rel=\"noopener\">Democrat-Gazette (Sydney Sasser)</a>:</p>\n<blockquote><p>Google will pay Entergy Arkansas $526 million to build Cypress Solar, about one-third of the $1.6 billion price tag of the solar and battery facility.</p>\n<p>That plant—a 600-megawatt solar field and 350-megawatt battery solar facility—will feed the grid from which <a href=\"https://www.arkansasonline.com/news/2026/jun/04/google-data-center-poises-west-memphis-for-boom/\" target=\"_blank\" rel=\"noopener\">Google's West Memphis data center</a> will draw massive power.</p>\n<p>Google will pay an additional $190 million to Entergy for transmission system upgrades needed to serve the project….</p>\n<p>In an Oct. 2 news release, Entergy Arkansas said the West Memphis data center \"will be bolstered by a new 600-megawatt solar project, backed by a 350-megawatt battery storage system that will be located in Jefferson County, Arkansas. Google will pay rates that cover the cost of this resource.\"</p></blockquote>\n<p>As I understand it, one of the questions was whether Google had promised to pay for all the costs or just the $526M (or $526M+$190M). The KARK story quotes a Google spokesperson as saying that,</p>\n<blockquote><p>\"Google is fully committed to covering 100% of the power and infrastructure costs for our West Memphis data center. While upfront payments total $526 million, our ongoing monthly rates over the 20-year agreement will completely fund our operational footprint. Entergy's regulatory filings demonstrate that this project will actually lower overall system costs, providing more than $1.1 billion in net benefits to Arkansas residents.\"</p></blockquote>\n<p>John T. Adams (James &amp; Carter PLLC) represents defendants.</p>"},{"title":"Having taken over Cities: Skylines 2's resurrection, Iceflake Studios are also making a bricky city builder called Lego Skylines","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/having-taken-over-cities-skylines-2s-resurrection-iceflake-studios-are-also-making-a-bricky-city-builder-called-lego-skylines","category":"gaming","categoryLabel":"Gaming","wordCount":585,"readingTime":3,"content":"<p>Block party</p>\n    \n  \n  \n  \n  \n            <p>You probably don't need me to recap the difficult life <a href=\"https://www.rockpapershotgun.com/games/cities-skylines-2\" target=\"_blank\" rel=\"noopener\">Cities: Skylines 2</a> has had since hitting the streets in 2023. Plagued by <a href=\"https://www.rockpapershotgun.com/cities-skylines-2-pc-performance-system-requirements-and-best-settings\" target=\"_blank\" rel=\"noopener\">performance issues</a> and <a href=\"https://www.rockpapershotgun.com/cities-skylines-2-review\" target=\"_blank\" rel=\"noopener\">prompting questions</a> over whether its additions made it a worthy sequel right out of the gate, thus followed years of tweaks aiming to undo the damage. Eventually, original developers Colossal Order <a href=\"https://www.rockpapershotgun.com/cities-skylines-creators-colossal-order-are-handing-the-series-over-to-the-surviving-the-aftermath-devs\" target=\"_blank\" rel=\"noopener\">handed over the game and series' reins</a> to Iceflake Studios, with Paradox Interactive staying on as publishers.</p>\n<p>The latter two have now revealed the next game in the Skylines series - a brick-built city builder dubbed Lego Skylines. It's not a bad name, but surely they could have gone with Lego Cities.</p>\n\n<p>Regardless, the game's been revealed during Gamescom Opening Night Live. In a press release, Paradox and Iceflake suggested it to be a \"playful\" take on metropolis crafting. \"You’re encouraged to build a city that's both beautiful and functional,\" they wrote. \"First, cover the basics like roads, electricity, food, and water to make your city run smoothly. Then, make it a place your citizens love. Add cozy homes for them to return to after work, green parks where they can unwind, quirky stores stocked with their favourite goods, and well-equipped hospitals to keep everyone in one piece. Turn your city into a cultural capital with great museums and impressive sports arenas, or plop bakeries on every street corner, serving delicious donuts baked with wheat from your own farms.\"</p><p>Growing your Lego city unlocks new buildings and services, which in turn up the city’s rating and the happiness of its denizens. A big enough selection of customisable buildings and plots is promised that your city shouldn't end up looking like everyone else's, or like the generic image on the box to put it in real world Lego terms.</p>\n<p>\"With LEGO Skylines, we want to turn city building into a more personal experience, where only your imagination limits what kind of cities you can build,\" said Iceflake co-founder and game director Lasse Liljedahl. \"We can't wait to see how players bring their dreams to life in it.\" Meanwhile, the Lego Group's SVP and Global Head of GAME - the latter possibly being the best job title in the industry - Fredrik Löving declared that \"From the beginning, our ambition wasn't just to make a Lego city-builder, it was to create a game that is considered among the best in the genre.\"</p>\n<p>That's rather a bold quote to be putting out there right off the bat given how Skylines 2 went, but hey, you can't fault the Lego man for hoping the series can firmly re-establish itself as the biggest collection of skyscrapers and multi-storey car parks on the block. That said, I think Lego Skylines is the ideal way to try and get the series back on track. The Lego element might give it a wider appeal outside of established city builder players and means the game doesn't come with the inevitably huge weight of expectation <a href=\"https://www.rockpapershotgun.com/games/cities-skylines\" target=\"_blank\" rel=\"noopener\">Cities: Skylines</a> 3 will face whenever it gets made. Plus, in my experience Lego games are generally a pretty good time no matter what form they take. Here's me and James <a href=\"https://www.rockpapershotgun.com/lego-voyagers-building-is-better-when-you-and-a-friend-are-the-blocks\" target=\"_blank\" rel=\"noopener\">having a nice time</a> in Lego Voyagers as proof.</p>\n<p>Plus, you can recreate <a href=\"https://www.youtube.com/watch?v=vQWAvuTAV0E\" target=\"_blank\" rel=\"noopener\">all</a> <a href=\"https://www.youtube.com/watch?v=iCeL-2MP47M&amp;list=PLLowhN4iw-_GAzuOZkFl5Cp0-cDE5y1hz&amp;index=4\" target=\"_blank\" rel=\"noopener\">of</a> <a href=\"https://www.youtube.com/watch?v=H45Aki9udK4\" target=\"_blank\" rel=\"noopener\">the</a><a href=\"https://www.rockpapershotgun.com/\" target=\"_blank\" rel=\"noopener\"></a> <a href=\"https://knowyourmeme.com/memes/a-man-has-fallen-into-the-river-in-lego-city\" target=\"_blank\" rel=\"noopener\">memes</a> about a man having fallen into the river in Lego City.</p>\n<p>Beyond Lego Skylines, which is without a release date for now, Paradox <a href=\"https://www.rockpapershotgun.com/crusader-kings-devs-paradox-officially-reveal-afterworld-a-fallout-flavoured-grand-strategy-game-in-which-you-can-overrun-america-with-a-cannibal-cult\" target=\"_blank\" rel=\"noopener\">have already spilled the beans</a> on the grand strategy game they've been teasing. It's a post-apocalyptic wasteland tribe-battler called Afterworld.</p>"},{"title":"The New Yorker Festival Releases Its Full 2026 Lineup ","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/press-room/2026-festival-lineup","category":"fun","categoryLabel":"Interesting Reads","wordCount":819,"readingTime":5,"content":"<p>The New Yorker Festival, the magazine’s annual celebration of culture and ideas, will return on October 23rd through October 25th, in New York City. This year’s events feature some of today’s most influential thinkers and entertainers, among them Conan O’Brien, Isabel Wilkerson, Colson Whitehead, Mariska Hargitay, and Aaron Sorkin, in conversation with the magazine’s writers and editors. Tickets for all events went on sale Wednesday morning, with exclusive discounts for subscribers.</p><p>The full program appears below. You have the opportunity to purchase General Admission, Early Entry, or Student &amp; Educator tickets.</p><p>To receive discounts and other benefits, <a href=\"https://www.newyorker.com/v2/offers/nyr_us_generic?source=Site_0_HCL_NYR_0_FESTIVAL_PRESS_TIX_ONSALE_07232026_ZZ\" target=\"_blank\" rel=\"noopener\">become a subscriber</a>. You’ll receive a free tote with annual plans.</p><p><strong>This year’s events include:</strong></p><ul><li>The comedian and host <strong>Conan O’Brien</strong> in conversation with <em>The New Yorker’s</em> <strong>David Remnick</strong></li><li>The writer and activist <strong>Gloria Steinem</strong> in conversation with <em>The New Yorker’s</em> <strong>Jia Tolentino</strong></li><li>The screenwriter, director, and playwright <strong>Aaron Sorkin</strong> in conversation with <em>The New Yorker’s</em> <strong>Tyler Foggatt</strong></li><li>The filmmaker <strong>Ken Burns</strong> in conversation with <em>The New Yorker’s</em> <strong>Michael Luo</strong></li><li>The actor <strong>Parker Posey</strong> in conversation with <em>The New Yorker’s</em> <strong>Michael Schulman</strong></li><li>The actor and comedian <strong>Hannah Einbinder</strong> in conversation with <em>The New Yorker’s</em> <strong>Rachel Syme</strong></li><li>The actor <strong>Mahershala Ali</strong> in conversation with <em>The New Yorker’s</em> <strong>Vinson Cunningham</strong></li><li>The actor <strong>Matthew Broderick</strong> in conversation with <em>The New Yorker’s</em> <strong>Naomi Fry</strong></li><li>The actor and comedian <strong>Benito Skinner</strong> in conversation with <em>The New Yorker’s</em> <strong>Michael Schulman</strong></li><li>The actor and producer <strong>Michael Douglas</strong> in conversation with <em>The New Yorker’s</em> <strong>Ariel Levy</strong></li><li>The actor and filmmaker <strong>Ethan Hawke</strong> in conversation with <em>The New Yorker’s</em> <strong>Emily Nussbaum</strong></li><li>The comedian, actor, and writer <strong>Cole Escola</strong> in conversation with <em>The New Yorker’s</em> <strong>Julian Lucas</strong></li><li>The clinical psychologist <strong>Becky Kennedy</strong> and the parenting economist <strong>Emily Oster</strong> in conversation with <em>The New Yorker’s</em> <strong>Dhruv Khullar</strong></li><li>The artist <strong>Lorna Simpson</strong> in conversation with the curator <strong>Thelma Golden</strong></li><li>The actor, producer, and director <strong>Mariska Hargitay</strong> in conversation with <em>The New Yorker’s</em> <strong>Rachel Syme</strong></li><li>The comedians <strong>Atsuko Okatsuka</strong> and <strong>Chris Fleming</strong> in conversation with <em>The New Yorker’s</em> <strong>Emma Allen</strong></li></ul><p><strong>There will also be conversations accompanied by musical performances:</strong></p><ul><li>The alternative-rock band <strong>Pixies</strong> talk <em>with The New Yorker’s</em> <strong>Amanda Petrusich</strong> and perform</li><li>The trumpeter and composer <strong>Wynton Marsalis</strong> talks <em>with The New Yorker’s</em> <strong>Nick Trautwein</strong> and performs</li><li>The singer-songwriter <strong>King Princess</strong> talks <em>with The New Yorker’s</em> <strong>Amanda Petrusich</strong> and performs</li></ul><p><strong>Discussions with authors of note:</strong></p><ul><li>The author <strong>Colson Whitehead</strong> in conversation with <em>The New Yorker’s</em> <strong>Julian Lucas</strong></li><li>The authors <strong>Min Jin Lee</strong> and <strong>Elizabeth Strout</strong> talk with <em>The New Yorker’s</em> <strong>Katy Waldman</strong></li><li>The authors <strong>Ben Lerner</strong> and <strong>Valeria Luiselli</strong> talk with <em>The New Yorker’s</em> <strong>Cressida Leyshon</strong></li><li>The authors <strong>Tessa Hadley</strong> and <strong>Colm Tóibín</strong> talk with <em>The New Yorker’s</em> <strong>Deborah Treisman</strong></li><li>The authors <strong>Ann Patchett</strong> and <strong>Louise Erdrich</strong> talk with <em>The New Yorker’s</em> <strong>Deborah Treisman</strong></li></ul><p><strong>Roundtables on a variety of subjects:</strong></p><ul><li>Critics at Large Live: A special live taping of <em>The New Yorker’s</em> culture podcast, featuring <em>The New Yorker’s</em> <strong>Vinson Cunningham</strong>, <strong>Naomi Fry</strong>, and <strong>Alexandra Schwartz</strong></li><li>The Political Scene Live: A special live taping of <em>The New Yorker’s</em> politics podcast, featuring <em>The New Yorker’s</em> <strong>Susan B. Glasser</strong>, <strong>Jane Mayer</strong>, and <strong>Evan Osnos</strong></li><li>Who Gets to Be an American?, featuring the <em>New Yorker</em> writers <strong>Jonathan Blitzer</strong> and <strong>Jelani Cobb</strong>, and the author <strong>Isabel Wilkerson</strong>, moderated by <em>The New Yorker’s</em> <strong>Michael Luo</strong></li><li>The Future of A.I., featuring <em>The</em> <em>New Yorker’s</em> <strong>Jill Lepore</strong>, <strong>Gideon Lewis-Kraus</strong>, and <strong>Andrew Marantz</strong>, moderated by <em>The New Yorker’s</em> <strong>Joshua Rothman</strong></li><li>Portraits in Power, a discussion about interviewing and investigating some of the world’s most powerful people, featuring <em>The New Yorker’s</em> <strong>Isaac Chotiner</strong>, <strong>Clare Malone</strong>, <strong>Jane Mayer</strong>, and <strong>Lawrence Wright</strong>, moderated by <em>The New Yorker’s</em> <strong>Daniel Zalewski</strong></li></ul><p><strong>And master classes and interactive events:</strong></p><ul><li>Cartoon Improv, featuring the cartoonists <strong>Ellie Black</strong>, <strong>Drew Dernavich</strong>, <strong>Ellis Rosen</strong>, and <strong>Will Kiley Santino</strong>, judged by the writers and comedians <strong>Josh Gondelman</strong> and <strong>Alison Leiby</strong>, and hosted by the cartoonist <strong>Emily Flake</strong></li><li>Trivia Night with <em>The New Yorker</em>, hosted by the TV analyst and “Celebrity Jeopardy!” winner <strong>Mina Kimes</strong></li><li>A Shouts &amp; Murmurs Master Class, featuring the writers and humorists <strong>Cora Frazier</strong> and <strong>Ian Frazier</strong>, with <em>The New Yorker’s</em> <strong>Susan Morrison</strong></li><li>Theater of War Live, featuring the actor <strong>Paul Dano</strong>, who will read an upcoming <em>New Yorker</em> piece, followed by an audience discussion led by the author, translator, and artistic director <strong>Bryan Doerries</strong></li></ul><p><strong>Additional events and offerings:</strong></p><ul><li>A panel conversation on the politics of freedom, featuring notable scholars and activists, sponsored by the Marguerite Casey Foundation</li><li>A tea salon sponsored by Taylors of Harrogate, offering a selection of complimentary black, green, fruit, and herbal blends for attendees to enjoy between events</li></ul><p>Ticketing information and further details are available at <a href=\"https://festival.newyorker.com/\" target=\"_blank\" rel=\"noopener\">newyorker.com/festival</a>. To receive updates about Festival programming, plus the best of <em>The New Yorker’s</em> news coverage, cultural commentary, humor, and more, <a href=\"https://www.newyorker.com/newsletter/daily\" target=\"_blank\" rel=\"noopener\">sign up for our daily newsletter</a>. ♦</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
