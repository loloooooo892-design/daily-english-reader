t checkout. Sometimes codes are applied automatically, but it’s always good to double-check that you are applying the best discount code for your shopping cart.</p><p>Why is my Reebok discount code or coupon not working and how can I fix common issues?</p><p>A Reebok discount or coupon code may not work for a few reasons. Some products, such as select new launches, sneakers, and third-party collaborations, are often excluded from discount codes altogether. Others are time-limited and may have expired. Double-check your code before looking elsewhere—it could be a typo.</p><p>Does Reebok offer a student, military, or hero discount and how do I verify my status to claim it?</p><p>Reebok offers a coupon code for students, military, teachers, healthcare professionals, and more through its <a href=\"https://cna.st/affiliate-link/5B83M5vYZfeZ6TP6pUtRyWQ4769KdmCZvsxT9ie1U8UvBuVGQXAVTgJ3mWXXXGNCroaJWY6Lzm4bCvgYyNC1r1jrFmtudadgoZd74PFuWJiWmLp2dSYLSyGKqpafL7ueJHKoAfZLazvdVP56oSfRVWVML9DBtZy8CT8p4ezC7E5REjLPzrVcR27aCLqrksnsxGeFj9g1RyiXapxweLZWLscs98Dkvws4d9RvNDnPSnHdymc5Q2ijvhy2wBfuLWaxYMJJSPqa7JuzTFXA5Nj2UAdznSHszBUNN8gzZRYXEaF9TJAce3qnA837ywQ1dnR9EcTWe6wo\" target=\"_blank\" rel=\"noopener\">Reebok Heroes discount</a> program. To verify your status, you’ll be prompted to log in to ID.me at checkout to receive your single-use discount code.</p><p>Can I stack a Reebok discount code with sale prices, membership perks, or other promotions?</p><p>Yes, you can stack Reebok discount codes with sale prices and other promotions. Items in seasonal sales and clearance sections can be combined with promo codes and free shipping benefits from an Authentics Membership.</p><p>Is there a Reebok first-order or new customer discount and what are the rules for using it?</p><p>Yes, Reebok offers a discount code for first-time customers placing their first order. To get yours, create a new account on Reebok online or sign up in the Reebok app. After verifying your email address, you can get 15% off your first order with the code <strong>MOVE15</strong>. Standard exclusions, such as third-party collaborations, still apply, though.</p>"},{"title":"The Return of “Salt”","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/28/the-return-of-salt","category":"fun","categoryLabel":"Interesting Reads","wordCount":810,"readingTime":5,"content":"<p>The writer Mark Kurlansky, a seventy-seven-year-old man with a bad back, was futzing around in his apartment on the Upper West Side the other day when his daughter flashed her phone at him with some surprising news: “Salt: A World History,” Kurlansky’s nonfiction best-seller from 2002, was suddenly trending.</p><p>The book had sold half a million copies when it came out, but sales had since flattened. Two years ago, Wyatt Derman, a twenty-eight-year-old American living abroad, picked up a copy in a London Waterstones, and, as he recently said on TikTok, became “a man who can’t pass a salt shaker without feeling the weight of human civilization.”</p><p>Kurlansky, who has a scruffy Santa-white beard and matching curls, had never seen TikTok, or Instagram. But Derman is all over both, lately having professed his love for “Salt” to his five hundred thousand followers in various posts, including a ninety-second reel. Of all the words derived from salt, he seems most drawn to “salary.” “Did you know Romans were paid in salt?” he asks in the reel. “Party fact. I dropped it once, and people went, <em>Whoa</em>.”</p><p>People also went to Amazon. “Salt” was suddenly a <em>Times</em> best-seller again.</p><p>Derman was in town from Paris, and he tracked down his new favorite author for brunch, to celebrate IRL. Kurlansky arrived first, wearing saggy Levi’s held up by fish suspenders (“sharks, snappers, a grouper or two”). Waiting for Derman to arrive, Kurlansky talked about “Salt” ’s social-media resurrection. “He really <em>got</em> the book,” he said. “But he failed to say my name! Or the title. People wrote in and said, ‘It’s Mark Kurlansky, you jerk!’ ”</p><p>Since Derman’s posts, paperback sales of the book have increased by more than four hundred per cent. In a stroke of luck, Bloomsbury was already planning a twenty-fifth-anniversary hardcover edition.</p><p>“This whole thing has been an education, ” Kurlansky said. “Maybe publishers are doing something wrong.”</p><p>Derman arrived, beaded in sweat, having just docked a Citi Bike. He extended a hand and apologized for being late.</p><p>As a gift, Kurlansky had brought a copy of his 1999 book, “The Basque History of the World.” “I want you to get into the Basques,” he said. “I’ve never gotten a Pulitzer, but how many people can say they’re in the Basque Hall of Fame? I’m not even Basque!”</p><p>“I’m still learning French,” Derman said.</p><p>Kurlansky had moved to Paris during his twenties, too. They swapped street names and extolled the Sixth Arrondissement. “Oh, you’ll love this,” Derman said. “I lived in Gertrude Stein’s building!”</p><p>Latkes and bagels ordered, Derman started asking questions about writing.</p><p>“It’s just all I do,” Kurlansky said. “From 6 <em>a.m</em>. until the Red Sox come on.” He asked Derman, “So, have you always done this Instagram thing?”</p><p>“For about a year and a half,” Derman replied. “I resisted it hard for a while.” After high school, in Minnesota, he went to Los Angeles to try acting. He appeared in a social-media campaign for Dove Men’s hair-and-body wash. “I was a guy who wants to smell good and feel good for a date,” he said. “It wasn’t great.” Then he spent a summer in Oxford, studying Shakespeare.</p><p>Kurlansky, a theatre major, approved. “I might’ve not gone to college,” he said. “Except there were these people in the government trying to get me to go to Vietnam.”</p><p>Derman forked a latke—his first. Kurlansky said, “He’s never had a latke! That solves that. My wife’s first question was ‘Is he Jewish?’ ” Then he added, “<em>Wyatt</em>, though.” He asked his new young friend, “Who are all these people buying my book?”</p><p>“They’re curious. They want depth,” Derman said. “They’re not just bookworms. They’re interested in storytelling, in something unexpected.” He added that his reel about “Salt” had around eight million views.</p><p>“That’s the population of some countries!” Kurlansky said. “My daughter just set me up on Instagram.” (His handle is @codlansky, a nod to his 1997 hit, “Cod.”) “Every morning, I say, ‘Hey, chief, how many members now?’ ”</p><p>Derman said that he’d followed his posts on “Salt” with one about pepper. (It didn’t quite perform.)</p><p>Kurlansky scrunched his nose. “Pepper’s just not a good story,” he said.</p><p>Talk turned to potential collaborations. A live Q. &amp; A.? Maybe Derman would like to record the audio version of Kurlansky’s forthcoming book, “Lobster”? (He would.)</p><p>“Wasn’t lobster prison food at one time?” Derman asked.</p><p>“Fertilizer,” Kurlansky corrected.</p><p>A server asked whether they would like cheesecake (the title of Kurlansky’s fortieth book, from 2025, a novel). They declined, and Kurlansky grabbed his cane. “This old writer has just been kicking around for years,” he said. “You don’t expect anything new to happen, you know?”</p><p>Derman smiled. “You’re doing very well for yourself, Mark,” he said. “I hope I have your hair when I’m your age.” ♦</p>"},{"title":"May President Trump Exclude CNN from Air Force One? Very Likely Yes","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/26/may-president-trump-exclude-cnn-from-air-force-one-very-likely-yes/","category":"law","categoryLabel":"Law","wordCount":1343,"readingTime":7,"content":"<p>After being <a href=\"https://reason.com/volokh/2026/09/24/tro-issued-ordering-reinstatement-of-cnn-ms-now-and-politico-white-house-access/\" target=\"_blank\" rel=\"noopener\">blocked</a> in his attempt to keep CNN out of the White House altogether (including the main press briefing room), President Trump has <a href=\"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e\" target=\"_blank\" rel=\"noopener\">excluded</a> CNN from traveling with him on Air Force One. This, though, he is quite likely allowed to do.</p>\n<p>As you likely recall, last year Trump kicked AP out of the Oval Office press pool, because the AP had refused (in my view correctly refused) to call the Gulf of Mexico \"the Gulf of America.\" A D.C. Circuit panel majority, to oversimplify slightly, concluded that this was <a href=\"https://reason.com/volokh/2025/06/09/no-first-amendment-violation-in-excluding-associated-press-from-the-room-where-it-happens/\" target=\"_blank\" rel=\"noopener\">constitutionally permissible</a>, both as to the Oval Office and as to Air Force One. An excerpt from that <a href=\"https://reason.com/volokh/2025/06/09/no-first-amendment-violation-in-excluding-associated-press-from-the-room-where-it-happens/\" target=\"_blank\" rel=\"noopener\">2025 decision</a> (<em>AP v. Budowich</em>):</p>\n<blockquote><p>The White House is likely to succeed on the merits because these restricted presidential spaces {Oval Office, … Air Force One, and … the President's home in Mar-a-Lago} are not First Amendment fora opened for private speech and discussion. The White House therefore retains discretion to determine, including on the basis of viewpoint, which journalists will be admitted.</p></blockquote>\n<p>The majority concluded that those spaces differed from some more broadly open spaces in the White House:</p>\n<blockquote><p>Reporters and photographers have long been permitted access to the White House complex to cover the President and his administration. The White House manages access by requiring journalists to obtain a press credential called a hard pass. More than one thousand journalists hold hard passes, through which they may access spaces such as the James S. Brady Briefing Room, where the White House Press Secretary delivers regular briefings.</p>\n<p>Hard pass holders may also sign up via a reservation system to attend larger events hosted in the East Room, which is often used for meetings with foreign leaders, executive order signings, and press conferences. Because the White House has opened these press facilities \"to all bona fide Washington-based journalists,\" hard passes may not be denied arbitrarily or based on the content of a journalist's speech. <em>Sherrill v. Knight</em> (D.C. Cir. 1977)….</p>\n<p>When the White House opens its facilities to the press generally, as it does in the Brady Briefing Room, it cannot exclude journalists based on viewpoint. <em>Sherill v. Knight</em>.</p>\n<p>On the other hand, we have never suggested that there are any First Amendment restrictions on \"the discretion of the President to grant interviews or briefings with selected journalists.\" <em>Sherrill</em>. In deciding which journalists to speak with, the President may of course take into account their viewpoint. If President Trump sits down for an interview with Laura Ingraham, he is not required to do the same with Rachel Maddow. The First Amendment does not control the President's discretion in choosing with whom to speak or to whom to provide personal access. It is a time honored and entirely mundane aspect of our competitive and free press that public officials \"regularly subject all reporters to some form of differential treatment based on whether they approve of the reporters' expression.\" <em>The Baltimore Sun Co. v. Ehrlich</em> (4th Cir. 2006).</p>\n<p>These uncontested principles provide the framework for assessing the AP's claim that the Oval Office and other restricted spaces become nonpublic fora [in which viewpoint discrimination is forbidden -EV] when the White House selects a small group of journalists (such as the press pool) to be present for observational newsgathering and reporting…. The Oval Office is the President's office, over which he has absolute control and discretion to exclude the public or members of the press. As the district court explained, the Oval Office \"is a highly controlled location … shrouded behind a labyrinth of security protocols,\" which \"few members of the public will ever\" enter. The President uses the space for myriad purposes, including speeches, signing ceremonies, and meetings with senior officials or heads of state. When events in the Oval Office are broadcast to the public, they feature the President's speech and expressive activity.</p>\n<p>It hardly needs to be said that the Oval Office, Air Force One, or even the East Room are not places \"traditionally open to assembly and debate,\" nor are they open to the public for expressive activity…. Only about one percent of hard pass holders can fit in spaces like the Oval Office. When access to government property is very limited, considerations of viewpoint may be permissible….</p>\n<p>{Both the AP and the district court at various points suggest that if the White House maintains something like the press pool, it must allow access on a viewpoint neutral basis. For the reasons already explained, a group of journalists observing presidential events is not a forum of any sort. Accordingly, the White House should not have to choose between excluding all journalists and admitting journalists under the restrictions of a nonpublic forum. By recognizing the distinctions between different fora \"we encourage the government to open its property to some expressive activity in cases where, if faced with an all-or-nothing choice, it might not open the property at all.\"} …</p>\n<p>The messages conveyed in the Oval Office are government speech and opportunities for the President's administration to express its message. \"When government speech is involved, forum analysis does not apply and the Government may favor or espouse a particular viewpoint.\" … Choosing who may observe or possibly speak with the President in these spaces is not the type of action that supports a retaliation claim. Rather, it is more akin to a decision about how the President wields the bully pulpit….</p></blockquote>\n<p>To be sure, CNN has also argued that the revocation of its reporters' White House press passes violated the Due Process Clause as well as the First Amendment. Indeed, the judge's order Thursday morning requiring the White House to reinstate those press passes relied on the Due Process Clause, and didn't reach the First Amendment. (The D.C. Circuit <em>Sherrill v. Knight </em>decision, which the judge relied on Thursday and which <em>AP v. Budowich </em>discussed, concluded that denial of a White House press pass based on viewpoint would violate both the First Amendment and the Due Process Clause.)</p>\n<p>But the logic of the D.C. Circuit <em>AP v. Budowich </em>decision, it seems to me, applies equally to the Due Process Clause. The <em>Sherrill </em>precedent expressly yoked the First Amendment and Due Process Clause claims together:</p>\n<blockquote><p>In our view, the procedural requirements of notice of the factual bases for denial, an opportunity for the applicant to respond to these, and a final written statement of the reasons for denial are compelled by the foregoing determination that the interest of a bona fide Washington correspondent in obtaining a White House press pass is protected by the first amendment. This first amendment interest undoubtedly qualifies as liberty which may not be denied without due process of law under the fifth amendment.</p></blockquote>\n<p><em>AP v. Budowich </em>concluded that there was no protected First Amendment interest in access to the Oval Office or Air Force One (as opposed to in getting a White House press pass more broadly), analogizing to the President's power to decide which reporters to give personal interviews. It seems to me to follow that there would likewise be no protected Due Process Clause interest, just as reporters can't claim a Due Process Clause violation if the President decides to stop giving interviews to them.</p>\n<p>Finally, note that, just as the precedents that limit revocation of White House press passes don't apply to exclusion from the Oval Office and Air Force One, the <a href=\"https://storage.courtlistener.com/recap/gov.uscourts.cadc.41932/gov.uscourts.cadc.41932.01208746547.0_1.pdf\" target=\"_blank\" rel=\"noopener\">Thursday order's terms</a> likewise cover only White House press passes:</p>\n<blockquote><p>Defendants (except for President Trump) and their agents, representatives, and all persons or entities acting in concert with them shall immediately return, reinstate, and restore the White House \"hard pass\" press credentials held by employees of CNN, MS NOW, and POLITICO that were revoked on or about September 18, 2026, until further Order of the Court or the expiration of this Temporary Restraining Order.</p></blockquote>\n<p>So the President's Air Force One decision doesn't violate the district court's order, as well as being consistent with D.C. Circuit precedent. None of this makes the President's decision wise, but I think it is constitutionally permissible.</p>"},{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"James Archer","url":"https://www.rockpapershotgun.com/the-sunday-papers-829","category":"gaming","categoryLabel":"Gaming","wordCount":1074,"readingTime":6,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays are for recovering from the friend-of-a-spouse’s wedding you attended on Saturday while suffering from an acute case of Old Person’s Back. Unfortunately, the time for recovery has in fact passed, as you have already moved to the more immediately satisfying phase of <em>assigning blame</em>. Possible suspects: your swivel chair, your mattress, the PC monitor you had to laboriously re-box for transit, your sofa, and that most connviving, spine-bending bastard of all, light walking. Spoiled for choice, you sit down in your untrustworthy chair and begin to read some of the week’s writing highlights instead.</p>\n<p>Here’s Mazen Haggag for <a href=\"https://www.deletedsaves.com/the-cultural-void-of-final-fantasy-xvis-dhalmekia/\" target=\"_blank\" rel=\"noopener\">Deleted Saves</a> on <a href=\"https://www.rockpapershotgun.com/games/final-fantasy-xvi\" target=\"_blank\" rel=\"noopener\">Final Fantasy XVI</a>’s ropey attempt at working in Middle Eastern and North African cultural influences.</p>\n<blockquote>The problem is that Dhalmekia - the only non-white nation in the base game — is all surface, no substance. It is a desert nation of craftspeople whose wealth comes from trading artisan goods across Valisthea. Much in the tradition of fantasy games, each of its towns has its own specialty goods or services: Tabor has its tanneries, Dravozd features an entire questline about its smithing, and Dalimil’s main attraction is its hot springs, which are surrounded by shops, including a carpet shop, a shisha stall, stores that sells herbs and spices, a brass ornament shop, and a bakery. For the latter, the variety tells a visual story about how the town has grown due to the captive audience of travelers enjoying the hot springs and a populace who make the most of the opportunities they get. While various objects and accoutrements on display add visual flavor, this flavor never extends to the people that occupy the country.</blockquote>\n<p>Lilith, of mononymic outlet <a href=\"https://gamesline.net/deathmachine-living-as-a-bullet/\" target=\"_blank\" rel=\"noopener\">Gamesline</a>, looks at violence, games that scold you for violence, the both-sidesing of violence, and the empowerment of violence, mostly through the optics of a big stompy mech.</p>\n<blockquote>Armored Core 6 understands that violence is not glamorous. Death is ugly and it comes in screams and gunfire; war is filled with people who don’t get a moment to have a catchy one-liner before dying. But, depending on the route, that same violence can be cathartic. I’ve said it before: the aesthetics of death and violence are loud. Blood is bright. Some emotions are too loud to whisper. A story where a violent regime is overthrown by the downtrodden is not the same power fantasy where you uncritically protect the status quo. Both stories are violent, yet that violence is not equal.</blockquote>\n<p>I continuously fail to compile a Sunday Papers without someone talking sense, however sadly, about AI. <a href=\"https://www.possibilityspace.org/blog/posts/i-love-ai/\" target=\"_blank\" rel=\"noopener\">Dr. Michael Cook</a>, artificial intelligence researcher and sometime <a href=\"https://www.rockpapershotgun.com/authors/michael-cook\" target=\"_blank\" rel=\"noopener\">RPS contributor</a>, remembers the optimism of earlier AI work and contrasts it with what big tech has warped it into.</p>\n<blockquote>I reviewed an AI paper the other day, and I'm not breaking anonymity with this description because it's one of about a dozen identical papers I've reviewed this year alone, where the core contribution was simply: we asked an LLM to do this thing. That was the paper's contribution to AI research. They took a product built by a private company and they asked it to do something, and then they reported that it did it (with no evaluation). It's perfectly okay if this is AI research now, that's fine, maybe you see value in someone reporting that they learned this was possible. Times change, words change, and if I am no longer in this field any more then I will come to accept it and find a new space to be in. But I look at papers like this today and I just find it... impossible to reconcile with the world I got excited about two decades ago. So much of AI research now is simply using the products of a handful of companies to claim they can do something. If you're lucky, they might ask another LLM to evaluate the results. The research is investigating the applications of capital, not expanding our understanding of the world.</blockquote>\n<p>Also on a Papers meta note: including Nathan Brown’s <a href=\"https://newsletter.hitpoints.co/398-deckchairs-on-the-titanic/\" target=\"_blank\" rel=\"noopener\">Hit Points</a> is roundupping on easy mode. But it’s also one of the best, funniest, most elegantly furious newsletters in games. This one’s on the Microsoft layoffs.</p>\n<blockquote>Obviously no one is fooled. Sure, there’s a certain logic to, say, folding the Halo team — which has spent a lot of money, and taken a lot of time, to make pretty much the square root of fuck-all — into Activision, whose well-oiled Call Of Duty production line knows how to actually ship stuff. But I don’t think there’s a soul outside the Xbox C-suite who believes any of this is any good, or will work. The Xbox tarot deck these days consists solely of Death cards. Shuffle them all you like; it’s nice to feel busy, after all. Just don’t expect anything to change.</blockquote>\n<p>Bit of not-games to finish, perhaps. Here’s Niko Stratis for <a href=\"https://www.pastemagazine.com/music/nirvana/nirvana-nevermind-turns-35\" target=\"_blank\" rel=\"noopener\">Paste Magazine</a> on Nevermind’s 35th birthday.</p>\n<blockquote>We never really talked about the words; we just warned of what they meant. My Baptist neighbors told me they were satanic, evil even, and I learned that my feelings, those that felt at home and reflected in Cobain’s lyrics, were bad. Sinful, like pride and murder before it. My mom didn’t think much of them until he died by suicide, and when he did, his sinful lyrics became desperate warnings. We never talked about why he was sad, why he was so happy but alone, ugly but okay. We never talked about mental health, or the weight of the 1990s—a decade that is often remembered as many things, but to me it is always a little dark. It’s the brown wallpaper and dark carpet in our living room. It’s the nights that seemed to find more hours to be dark. It’s all the words I didn’t have for why <em>Nevermind</em> spoke to me so deeply. Why it was my favorite record to an annoying degree once it became my record, once its unknowable form became tangible to me in a way that it would never be for anyone else.</blockquote>\n<p>Actually, it’s not writing, but I’d be remiss not to link <a href=\"https://www.youtube.com/watch?v=kKwpp-Bn8jI\" target=\"_blank\" rel=\"noopener\">People Make Games’ report on Bobby Kotick’s press-targeting lawfare</a>, a two-year (!) investigation primarily by journalist <a href=\"https://bsky.app/profile/leadergrev.bsky.social\" target=\"_blank\" rel=\"noopener\">Mikhail Klimentov</a>.</p>\n<p>Music this week is, if you’ll forgive the lack of imagination, the <a href=\"https://www.youtube.com/watch?v=Cq_IvqvC9Mc&amp;list=OLAK5uy_nvx1nxQLkWHfvN-UnbBjdgjy0JJUmGwMg\" target=\"_blank\" rel=\"noopener\">Control Resonant OST</a>. Am especially fond of <a href=\"https://youtu.be/jzZWUHvkCNY?si=Wl_hNaykX-HN4BPo\" target=\"_blank\" rel=\"noopener\">whatever the fuck this is</a>.</p>"}];

function render() {
  var a = articles[currentIndex];

  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
