<script>
var articles = [{"title":"The Sunday Papers","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/the-sunday-papers-820","category":"gaming","categoryLabel":"Gaming","wordCount":1124,"readingTime":6,"content":"<p>Read more</p>\n    \n  \n  \n  \n  \n<p>Sundays are for sobbingly lifting exactly one boulder from the groaning dreampile that is my backlog. Good news, Vacuity, cpt_freakout and the rest – I'm trying out your precious, precious Troubleshooter game. I hear it's a hundred hours long, so please do not take this as a promise that a write-up is forthcoming. So far my major takeaways are 1) I enjoy collecting masteries, aka packages of abilities and modifiers, and 2) <a href=\"https://www.youtube.com/watch?v=MhFNlQA_hhM\" target=\"_blank\" rel=\"noopener\">this \"Short Break\" track</a> is cooool. Please hum along while browsing our latest collection of Rollicking Reads.</p>\n<p>For <a href=\"https://aeon.co/essays/silicon-valley-has-a-science-fiction-problem\" target=\"_blank\" rel=\"noopener\">Aeon</a>, Ali Rıza Taşkale analyses how self-appointed big tech visionaries have borrowed the trappings of Western sci-fi and fantasy works such as Neuromancer, the Foundation novels, and Star Trek for their political projects. I think you could get a whole 'nother essay out of this excerpt on how the threat of sci-fantasy apocalypse gets perversely deployed as a means of distraction.</p>\n<blockquote>It is the triumph of the speculative sci-fi scenario over human solidarity: why fix the world we inhabit when we can spend billions preventing a robot uprising that exists only in the imagination? By trying to steer policy debates toward distant catastrophic scenarios – killer robots, rogue AI, existential risk – the industry diverts attention from regulating the systems already causing harm: algorithmic bias in hiring, facial recognition’s racial disparities, platform amplification of extremism.</blockquote>\n<p>For the <a href=\"https://www.lrb.co.uk/the-paper/v48/n13/jenny-turner/hated-and-loved-in-a-breath\" target=\"_blank\" rel=\"noopener\">LRB</a>, Jenny Turner writes about the Scottish novelist Lewis Grassic Gibbon (birthname James Leslie Mitchell), exploring nationalism, patriarchy, class, place, language, and changing times. I've never read any Gibbon/Mitchell, but I found this piece quite enveloping. It's a longer one – 10,000 words.</p>\n<blockquote>Scots is love, English learning, and you can’t do much of the latter before you lose your roots: it still runs deep, this Oedipal confusion of nation and class and agency and power, and without it, there’s no way [Nicola] Sturgeon’s vaguely social-democratic Scottish nationalism would ever have wrung and held the hearts of people the way it did. Much of it, as Sturgeon senses, has to do with ‘Scots words’, as instruments of interpellation really, especially when your heart is getting held and wrung by them at school. Gibbon’s use of Scots is quite confusing, an artefact that looks authentic although it’s not: ‘The technique,’ as he confessed, ‘is to mould the English language into the rhythms and cadences of Scots spoken speech, and to inject into the English vocabulary such minimum number of words from Braid Scots as that remodelling requires.’ He was keen for his book to sell, to American audiences in particular, and appended a glossary of around a hundred words to the American edition. The most used ‘Scotticisms’, according to William K. Malcolm’s new biography, are modifiers such as awful, bit, coarse, fair, fell, ‘cosmetic rather than descriptive’, easy enough for diaspora Scots, more than a quarter of a million of whom left for North America in the 1920s alone.</blockquote>\n<p>For <a href=\"https://www.stopcar.ing/the-women-who-kill-are-the-ones-that-saved-me/\" target=\"_blank\" rel=\"noopener\">Stop Caring</a>, an anonymous writer considers gender dysphoria by way of two games I would somehow never have thought to place together: <a href=\"https://www.rockpapershotgun.com/games/stellar-blade\" target=\"_blank\" rel=\"noopener\">Stellar Blade</a> and <a href=\"https://www.rockpapershotgun.com/games/brush-burial-gutter-world\" target=\"_blank\" rel=\"noopener\">Brush Burial: Gutter World</a>. Beware spoilers for each.</p>\n<blockquote>She is the epitome of what I wish I could be. An androgynous, femme-leaning killing machine with a fat ass and a tight waist. I can’t look at her without feeling a concoction of wild lust and furious jealousy. I love the way her eight eyes stare down at me and tell me to beg. I love the forked tail she strikes with, the way she folds her enemies and twists them like dolls, the suffocating thighs and calves she clamps down on brutish guards with. And all of it, she does to help her and her partner breathe a little easier while they try to make it through life in this rotting world.  </blockquote>\n<p>Jim Rossignol, formerly of this parish, has a little <a href=\"https://bsky.app/profile/rossignol.bsky.social/post/3mrhnzd34qk2l\" target=\"_blank\" rel=\"noopener\">Bluesky thread</a> about the creation and success of tweedy sandbox robo-avoider Sir, You Are Being Hunted. It maketh me feel old.</p>\n<blockquote>So here we had a confluence of events that is unrepeatable in spacetime. Kickstarter was a viable way to raise good amounts for a videogame project, Early Access was a novelty that everyone wants to check out, Steam was still curated, people were fascinated in the idea of procedural generation.</blockquote>\n<p>This one is from 2021, but I don't care: Lizzie Marx has <a href=\"https://publicdomainreview.org/essay/picturing-scent/\" target=\"_blank\" rel=\"noopener\">a fascinating essay</a> on the stench of dead whales in 17th century Dutch art, which doubles as an invitation to consider smell in aesthetics and art production more generally. Compare and contrast efforts to <a href=\"https://www.bbc.co.uk/news/articles/cgkjz3r1j68o\" target=\"_blank\" rel=\"noopener\">make videogames stink</a>.</p>\n<blockquote>Some decades after the beached whale foretold the fate of Amsterdam, visitors in the city came to admire the latest works by Rembrandt van Rijn in his studio. As Rembrandt’s biographer Arnold Houbraken recounts, when visitors edged closer to the paintings, the artist pulled them away, saying, “The smell of the paint would irritate you”.11 Oil paint combines pulverised pigments with linseed oil, a sharp-smelling binding medium which is extracted from pressed flax seeds. The compound produces a wonderfully supple and jewel-like paint that can achieve fine details and varying textures. In Rembrandt’s self-portrait, he does not use oil paint sparingly, but practically sculpts with it. He smears out flesh-coloured oils to construct his nose, and in order to evoke the folds of his headpiece, he scrapes out lines of blue and yellow paint revealing the dark ground beneath. In the studio, the odour of linseed oil must have been a disruptive force, and Rembrandt used it to persuade his visitors to distance themselves from the painting, to best behold the rough, impasto slicks of paint. The painting has retained most of its lustre, but the odour, in time, has faded. </blockquote>\n<p>I note with agony that Nic Reuben, former RPS librarian, has joined the musty has-beens of Jank.cool on their quest to publish no good writing whatsoever. <a href=\"https://www.jank.cool/sol-cesto-review\" target=\"_blank\" rel=\"noopener\">Here he is on Sol Cesto</a>.</p>\n<blockquote>It's the second heatwave of the year in the UK right now. My PC quivers like angry blancmanche at the suggestion it perform even the laziest task, and Snickers ice creams melt down my palm and form crunchy bangles around my wrist before I can ferry them home to my face. Sol Cesto, you say? The sun has ceased? Sign me up!</blockquote>\n<p>Get in the filthmobile, loser, <a href=\"https://itch.io/jam/pervertjam-2026\" target=\"_blank\" rel=\"noopener\">Pervert Jam 2026</a> is underway. The goal is to \"create games with no public in mind but yourself\", with the optional theme \"A Pound of Flesh\". Oh, you had already pledged your intellectual faculties to Critical Distance's latest \"friendslop\"-themed <a href=\"https://critical-distance.com/2026/07/20/blogs-of-the-round-table-friendslop-jam/\" target=\"_blank\" rel=\"noopener\">Blogs of the Round Table</a>? Very well, then. We will watch your career with great interest.</p>\n<p>Here's some <a href=\"https://www.youtube.com/watch?v=WiwWeFx-H1U\" target=\"_blank\" rel=\"noopener\">Modest Mouse</a> to play us out.</p>"},{"title":"Is [redacted] really dead after House of the Dragon season 3 episode 6?","source":"Polygon","author":"@xcomCoreyIsAFox","url":"https://www.polygon.com/house-of-the-dragon-season-3-episode-6-ending-corlys-velaryon-explained/","category":"gaming","categoryLabel":"Gaming","wordCount":836,"readingTime":5,"content":"<p>\n                                                                        Follow\n                                                            </p>\n            \n<p>Link copied to clipboard\n</p>\n                \n                \n                                            \n                                                                                                                                                                                                                                <a href=\"https://www.polygon.com/author/corey-plante/\" target=\"_blank\" rel=\"noopener\">\n                                            \n                                        </a>\n                                                                    \n                                        \n                                                                                                                                            <p>Published Jul 26, 2026, 10:00 PM EDT\n                                </p>\n                    \n                                                            \n                                                                        <p>This one character cheated death before — can they do it again?</p>\n    <h2>House of the Dragon leaves one character's fate hanging by a thread</h2>\n    \n        \n    \n            <a>\n            <p>Sign in to your Polygon.com account</p>\n        </a>\n<p>Aside from some major deaths, some of the toughest drama to watch in <a href=\"https://www.polygon.com/house-of-the-dragon/\" target=\"_blank\" rel=\"noopener\"><em>House of the Dragon</em></a> season 3 has everything to do with the fabled Sea Snake, Corlys Velaryon (Steve Toussaint), reckoning with his life and legacy. After his wife, Princess Rhaenys Targaryen (Eva Best), died at the Battle of Rook’s Rest in season 2, something in Corlys changed. He acknowledged that Alyn and Addam were his sons, and especially after his near-death experience in the Battle of the Gullet — during which his castle, High Tide, was ransacked — Corlys looked to the future even more. After Rhaenyra Targaryen (Emma D’Arcy) successfully took over King’s Landing and claimed the Iron Throne, he pleaded with her to legitimize Alyn (Abubakar Salim) and Addam (Clinton Liberty) as his rightful heirs. Yet she refused.</p>    <p>That tension simmers in season 3 episode 6, and it ultimately makes what happens at the very end of the episode so difficult to watch.</p>    <p>[<strong>Ed. note: </strong>Spoilers follow for <em>House of the Dragon</em> season 3 episode 6 and the source material <em>Fire &amp; Blood.</em>]</p>    \n<p>Episode 6 feels like one of those classic <a href=\"https://www.polygon.com/game-of-thrones/\" target=\"_blank\" rel=\"noopener\"><em>Game of Thrones</em></a> episodes where a lot of little things happen to slowly inch various plotlines forward. There aren’t any enormous battles, dragon fights, or even shouting matches. The show feels rather spread out across its various characters and subplots. One of the few spectacles happens early in the episode when <a href=\"https://www.polygon.com/24199725/house-dragon-criston-cole-fabien-frankel-episode/\" target=\"_blank\" rel=\"noopener\">Ser Criston Cole</a> (Fabien Frankel) stands ready to fight to the death against Team Black’s army only for him to be unceremoniously peppered with arrows from a distance. It’s as satisfying for the viewer as it was unsatisfying for Cole himself. The rest of the episode is a lot of simmering tension as the plot inches forward.</p>    <p>In King’s Landing, Alyn of Hull is coming into his own as the de facto Hand of the King. <a href=\"https://www.polygon.com/house-of-the-dragon-season-3-episode-5-gold-cloak/\" target=\"_blank\" rel=\"noopener\">Episode 5</a> explored how a mystery group of people loyal to Team Green — specifically Daeron’s claim to the throne as puppeted by Ormund Hightower (James Norton) — and now gold cloaks have resigned en masse. Alyn comes up with a solution: leverage Velaryon troops in King’s Landing to serve as the temporary city watch. She requests that he petition Corlys for more.</p>    <p>Alyn catches up with Corlys, who’s been fighting against repeated Triarchy raids, to put the request in. Corlys agrees but remains angry at the fact that Rhaenyra refuses to legitimize Addam and Alyn. “And how many years did it take you to do the same?” Alyn replies.</p>    \n    \n<p>Toward the end of the episode, seemingly in direct response to Rhaenyra sending assassins to Tumbleton that posed as Baratheon soldiers, the queen receives a message that reads, “Kick this dog and it will bite your hand.” Then the episode cuts to Corlys’ camp. He delivers an impassioned speech to his soldiers in which he admits that he’s been gone from the city for too long.</p>    <p>Afterward, he turns and sees a stranger (who is one of Ormund's personal guards), before he’s quickly grabbed from behind and seemingly strangled. The moment is left deliberately ambiguous — doubly so because nothing like this sequence of events is presented in <em>Fire &amp; Blood</em>. Is this the end of Corlys Velaryon?</p>    <h2>\n                        Is Corlys Velaryon dead?\n               </h2>\n    \n                                                                                            \n        \n<p> Given the fact that <em>Fire &amp; Blood</em> is presented as a maester aggregating various historical accounts of the Dance of Dragons, concrete details about private conversations and secret assassinations are scarce. As such, <em>House of the Dragon</em> consistently takes a lot of liberties to flesh out those finer details.</p>    \n<p>It’s certainly possible that Corlys Velaryon dies here, but unlike Cole who takes an arrow to the face, we never actually see Corlys clearly getting stabbed. After he’s grabbed from behind, the camera cuts to a wide shot far behind him as he seemingly struggles against his attackers. Other assassins swarm the woods around them, attacking his troops. Corlys has already survived what looked like certain death once this season, and he seems destined to do so again.</p>    <p>The fact is, Corlys still has a very important role to play in the events of the civil war moving forward. Our best guess is that no, Corlys is not dead. He’s merely been captured by assassins sent by Ormund Hightower. The Dance with Dragons takes a major turn following the impending battle at Tumbleton, and Corlys maintains an important political figure through the rest of the war. If he were to die now, it would mark the single biggest deviation from the books that the show has taken yet. Which is to say that you can likely consider Corlys safe — for now.</p>    <p> House of the Dragon<em> airs weekly at 9 p.m. Eastern on HBO and HBO Max.</em></p>"},{"title":"Check out the best Netflix Original anime of all time","source":"Polygon","author":"Debopriyaa Dutta","url":"https://www.polygon.com/best-netflix-original-anime-you-need-to-watch/","category":"gaming","categoryLabel":"Gaming","wordCount":1352,"readingTime":7,"content":"<p>When it comes to mainstream access to <a href=\"https://www.polygon.com/anime/\" target=\"_blank\" rel=\"noopener\">anime</a>, Crunchyroll has largely dominated streaming. The most popular (and most anticipated) titles, including summer anime like <a href=\"https://www.polygon.com/one-piece-heroines-anime-announcement-fan-letter/\" target=\"_blank\" rel=\"noopener\"><em>One Piece: Heroines</em></a><em> </em>and <a href=\"https://www.polygon.com/chrunchyroll-best-summer-romance-anime/\" target=\"_blank\" rel=\"noopener\"><em>Smoking Behind the Supermarket with You</em></a><em>,</em> can only be streamed on Crunchyroll. Other streaming services are doing their utmost to catch up, as is the case with Prime Video’s <a href=\"https://www.polygon.com/manga-like-ghost-in-the-shell-sci-fi-cyberpunk/\" target=\"_blank\" rel=\"noopener\"><em>The Ghost in the Shell</em></a>, which has gathered a lot of momentum with its fresh, exciting take on the beloved source material.</p>\n    <p>Although Netflix has a decent and ever-growing anime library, the streaming service has also produced some excellent original anime over the years. Some of its most popular animated originals — like <a href=\"https://www.polygon.com/tv/2017/7/29/16062578/netflix-castlevania-religion-corruption-warren-ellis/\" target=\"_blank\" rel=\"noopener\"><em>Castlevania</em></a> and <a href=\"https://www.polygon.com/animation-cartoons/2020/10/30/21542531/blood-of-zeus-die-talos-hera-heron-in-greek-mythology/\" target=\"_blank\" rel=\"noopener\"><em>Blood of Zeus</em></a> — aren't technically anime, but they still boast complex storytelling and spectacular animation.</p>    <p>On the anime front, Netflix has marketed <em>Blue Period</em>, <em>Kengan Ashura</em>, <a href=\"https://www.polygon.com/mobile-suit-gundam-hathaway-the-sorcery-of-nymph-circenew-movie/\" target=\"_blank\" rel=\"noopener\"><em>Mobile Suit Gundam Hathaway</em></a>, <em>Altered Carbon: Resleeved</em>, and <a href=\"https://www.polygon.com/cosmic-princess-kaguya-review-anime-netflix/\" target=\"_blank\" rel=\"noopener\"><em>Cosmic Princess Kaguya!</em></a> (among many others) as Netflix Originals over the years. The most coveted Netflix Original in recent times, <a href=\"https://www.polygon.com/netflix-jojo-steel-ball-run-premiere-impressions/\" target=\"_blank\" rel=\"noopener\"><em>JoJo's Bizarre Adventure: Steel Ball Run</em></a>, has only a <a href=\"https://www.polygon.com/jojo-steel-ball-run-netflix-release-schedule-controversy-explained/\" target=\"_blank\" rel=\"noopener\">double-premiere release</a> to its name so far, but it has already proven impressive enough that fans are clamoring for more.</p>    <p>Here are the 7 best Netflix Original anime that are well worth your time.</p>    <h2>\n            1 \n        \n                            Blame!\n                    \n       </h2>\n    \n                                                                                            \n        \n<p> Tsutomu Nihei’s <em>Blame!</em> is a pure distillation of the <a href=\"https://www.polygon.com/features/2018/8/30/17796680/cyberpunk-2077-history-blade-runner-neuromancer/\" target=\"_blank\" rel=\"noopener\">cyberpunk ethos</a>. Nihei’s manga embraces the cosmic chaos of a universe that feels indifferent to human civilization, where existential dread radically remaps the story’s dystopian landscape. While <em>Blame!</em> unravels perfectly on monochrome pages, translating such a layered, abstract tale to the big screen is no walk in the park.<em> Blame!</em> revolves around a silent loner named Killy, who wanders the vast, dystopian space of The City in search of an extinct generic marker that can help humanity regain control over civilization.</p>    <p>Netflix’s <em>Blame!</em> might not replicate the depth of its source material, but it does a wonderful job of turning these abstractions into an action-heavy sci-fi spectacle. There’s a lawlessness to Nihei’s manga that cannot be parsed on a visual level, which is why this <em>Blame! </em>adaptation takes the self-contained route while leaning into gritty cyberpunk aesthetics. Instead of embarking on a journey with no end, the cyborg Killy brandishes his Gravitational Beam Emitter whenever things get dire, and the story primarily shifts to the Electrofishers and their fight for survival.</p>    <h2>\n            2 \n        \n                            Dorohedoro\n                    \n       </h2>\n<p>Quirky, absurdist, and unpredictable at all times, Netflix’s <a href=\"https://www.polygon.com/dorohedoro-season-3-confirmed-netflix/\" target=\"_blank\" rel=\"noopener\"><em>Dorohedoro</em></a> will give you the best kind of genre whiplash. Set in a post-apocalyptic world that thrives on class-based division, Dorohedoro follows Caiman, a lizard-headed amnesiac who is in search of the sorcerer responsible for his unique condition.</p>    <p>Caiman begins his journey with the aid of his friend Nikaido and ends up confronting uncomfortable truths along the way. The show’s distinct aesthetic allows the most grotesque elements to pop onscreen, which serves the anime’s tendency to jump between slapstick comedy and gory, traumatic moments. MAPPA has been doing some incredible work over the years, but <em>Dorohedoro </em>shows off the studio’s ability to experiment with tone and atmosphere without losing any momentum.</p>    <h2>\n            3 \n        \n                            Cyberpunk: Edgerunners\n                    \n       </h2>\n<p>You don’t <em>need </em>to play <a href=\"https://www.polygon.com/game/cyberpunk-2077/7564/\" target=\"_blank\" rel=\"noopener\"><em>Cyberpunk 2077</em></a> before experiencing the absolute perfection that is <a href=\"https://www.polygon.com/reviews/23349865/cyberpunk-edgerunners-netflix-review-2077/\" target=\"_blank\" rel=\"noopener\"><em>Cyberpunk: Edgerunners</em></a>, but familiarity with Night City will certainly make you appreciate this Netflix miniseries even more. The story maps the tragic life of David Martinez, who sheds his humble Street Kid origins to become an Edgerunner, a cybernetically enhanced mercenary outlaw who lives on the fringes of society.</p>    <p>Like any compelling entry in the world of <em>Cyberpunk 2077, Edgerunners </em>explores the cost of obsessive cybernetic modification, the death of innocence in a dystopian metropolis, and the rampant corruption in every strata of society. David’s story, especially his romantic relationship with the Netrunner Lucy, becomes the emotional core of an anime that opens up the world while bringing complex in-game concepts to life. <em>Edgerunners </em>retroactively adds crucial context to V’s branching fates in the game, but even as a standalone story, it captures the tragedy of a young man whose dreams remain unfulfilled even after he claims the coveted moniker of “legend.”</p>    <h2>\n            4 \n        \n                            Great Pretender\n                    \n       </h2>\n    \n                                                                                            \n        \n<p> In Netflix’s<em> </em><a href=\"https://www.polygon.com/2020/8/20/21376734/great-pretender-review-netflix-new-anime-wit-studio/\" target=\"_blank\" rel=\"noopener\"><em>Great Pretender</em></a>, Makoto Edamura is a petty con-artist who boasts that he’s a renowned swindler. An attempt to hoodwink a French tourist goes south, and Makoto ends up getting targeted by the police. Unprepared to deal with the gravity of the situation, Makoto is further destabilized when he’s roped into the world of skilled con artists who target powerful public figures.</p>    <p>What makes this a solid anime is its ability to pull off intricate, globe-trotting heists and blend such a high-octane premise with enthusiastic comedy. Some heists are smooth and stylish, modeled after the ones in the <em>Ocean’s </em>franchise, while others use the heist framework to unravel Makoto as a character. Deception is the name of the game here, which means that these adventures are often structured in ways to catch the audience (and by extension, Makoto) off guard.<em> </em>As a bonus, <em>Great Pretender</em> also features Queen’s rendition of the eponymous track as its main theme.</p>    <h2>\n            5 \n        \n                            Devilman Crybaby\n                    \n       </h2>\n    \n                                                                                            \n        \n<p> An unforgettable one-season wonder, <a href=\"https://www.polygon.com/2018/1/8/16862868/devilman-crybaby-season-1-review-netflix/\" target=\"_blank\" rel=\"noopener\"><em>Devilman Crybaby</em></a> adapts Go Nagai’s <em>Devilman </em>manga while updating its 1970s setting to the current era. Akira and his dear friend Ryo are up against an ancient race of demons hell-bent on destroying humanity, which makes them believe that the best way to defeat them is to tap into their powers. Things take a decidedly heartbreaking turn from this point onwards, with <em>Devilman Crybaby</em> telling a raw, emotionally resonant tale about empathy and paranoia.</p>    <p>The core appeal of the anime lies in its eagerness to dabble in grey areas. The definition of what makes someone a “monster” is questioned at every turn, as humans end up hunting innocents out of unfounded suspicion. There’s also a staunch anti-war philosophy at the heart of <em>Devilman Crybaby</em> — every conflict ends in unchecked violence and countless casualties, making it impossible to crown either side as “righteous.” Akira and Ryo’s relationship is recontextualized through a stunning metaphor towards the end, adding greater weight to the nihilistic ending that the story chooses to embrace.</p>    <h2>\n            6 \n        \n                            Delicious in Dungeon\n                    \n       </h2>\n<p>Dungeon crawl anime like<em> </em><a href=\"https://www.polygon.com/best-anime-like-solo-leveling/\" target=\"_blank\" rel=\"noopener\"><em>Solo Leveling</em></a> and<em> Made in Abyss</em> tackle the central trope in interesting ways, but <a href=\"https://www.polygon.com/24025746/delicious-in-dungeon-netflix-finally-some-good-food/\" target=\"_blank\" rel=\"noopener\"><em>Delicious in Dungeon</em></a> emerges as an incredible standout. In this world, adventuring parties raid dungeons in hopes of finding the mysterious Golden Country. A human spellcaster named Falin gets consumed by a dragon during one such expedition, but she manages to magically teleport her party to safety.</p>    \n<p>Led by Falin’s brother Laios, this party survives the harsh conditions by harvesting, prepping, and cooking the monsters they encounter during their quest. Netflix’s <em>Delicious in Dungeon </em>makes a hearty meal out of its layered world-building and attention-heavy storytelling, where every detail allows us to better understand the environments they interact with. Although these segments have a warm, cozy quality, the anime gradually ramps up its stakes and veers into its dark fantasy roots without ever losing its charm or humor.</p>    <h2>\n            7 \n        \n                            Violet Evergarden\n                    \n       </h2>\n    \n                                                                                            \n        \n<p> Netflix helped put a spotlight on <a href=\"https://www.polygon.com/netflix-kyoto-animation-sparks-of-tomorrow-trailer/\" target=\"_blank\" rel=\"noopener\">Kyoto Animation</a>’s <em>Violet Evergarden</em>, a beautifully animated, 13-episode gem that will definitely make you cry. Set in the land of Telesis after The Great War, the anime focuses on a young girl named Violet, who had been raised as a weapon of war. Having lost both arms during the final battle, Violet uses prosthetics to write letters on behalf of clients after the war ends.</p>    <p>Violet feels disconnected from herself and those around her, as she is yet to comprehend what love and empathy truly mean. As a child soldier, Violet needs to process unimaginable trauma while navigating these heavy emotions, which isn’t easy when she isn’t sure what kind of person she is (or wants to be). <em>Violet Evergarden</em> dwells on these somber themes while mapping a steady path of forgiveness and acceptance for its protagonist. It is a gorgeous, moving story about the power of the written word, which acts as an emotional tether for Violet during her journey.</p>"},{"title":"Capcom wants to release a Resident Evil every year and sees remakes as the way to make it happen","source":"PC Gamer","author":"Ted Litchfield","url":"https://www.pcgamer.com/games/resident-evil/capcom-wants-to-release-a-resident-evil-every-year-and-sees-remakes-as-the-way-to-make-it-happen/","category":"gaming","categoryLabel":"Gaming","wordCount":514,"readingTime":3,"content":"<p>As part of an interview in the latest issue of <a href=\"https://gameinformer.com/\" target=\"_blank\" rel=\"noopener\">GameInformer</a> (spotted via <a href=\"https://www.gamesradar.com/games/resident-evil/resident-evil-remakes-allow-capcom-to-release-yearly-games-in-the-series-and-invest-money-back-into-new-games-like-pragmata-producer-says/\" target=\"_blank\" rel=\"noopener\">GamesRadar</a>), Capcom producer Masachika Kawata outlined the resurgent Japanese publisher's approach to Resident Evil: Quality <em>and</em> quantity, with remakes bolstering the process and helping fund the development of more adventurous projects.</p><p>According to Kawata, Capcom would like Resident Evil to be a fully annual franchise, but \"producing a new entry in the Resident Evil series every year would be quite an undertaking and a difficult task.\" That's where the remakes come in.</p><p>\"Being able to revisit older games and remake them helps Capcom meet that goal of releasing a Resident Evil title each year, but it also allows the team to continually challenge themselves and hone their craft,\" said Kawata. \"That's not to say the remakes are any less important. In fact, they're just as important as the mainline titles.</p><p>\"Capcom is lucky enough to have found this cycle that can continue to provide us with the financial resources to create things like new entries in the Resident Evil series and completely new IP like Pragmata. So there is that relationship there.\"</p><p>Phrases like \"every year\" tend to get my dander up when it comes to game development, but Capcom has a track record as perhaps one of the most successful and, crucially, <em>healthy</em> game publishers of the 2020s. After a mixed decade-plus in the late aughts and early '10s, it's been hit after hit since the one-two punch of Street Fighter 5 in 2016 and Resident Evil 7 in 2017.</p><p>Even its less beloved recent games⁠—like the RE3 remake or <a href=\"https://www.pcgamer.com/monster-hunter-wilds/\" target=\"_blank\" rel=\"noopener\">Monster Hunter Wilds</a>⁠—have their defenders (not to mention profitable sales figures). Other publishers and developers at Capcom's scale have sloughed off staff and struggled to release games in a timely fashion, but the long-lived giant just keeps trucking.</p><p>As GamesRadar pointed out, though, we're running out of runway on Resident Evil remakes after this year's <a href=\"https://www.pcgamer.com/games/resident-evil/resident-evil-code-veronica-remake-announced/\" target=\"_blank\" rel=\"noopener\">Code Veronica</a>. The OG RE1 GameCube remake was a perfect game I don't think you could improve on⁠—though that didn't stop Capcom from trying with RE4. After that, you've got some pretty mixed reputation entries up for grabs in Residents Evil 0, 5, and 6. I'm not a fan of the three, but as PCG news writer Joshua Wolens has pointed out, why not <a href=\"https://www.pcgamer.com/why-remake-the-witcher-when-we-could-remake-something-much-worse-instead/\" target=\"_blank\" rel=\"noopener\">remake flawed games <em>into</em> good ones</a> instead of mucking up something that already works? Though, the less said about Resident Evil's <em>real</em> stinkers like Survivor or <a href=\"https://www.youtube.com/watch?v=j1-zO0UX604\" target=\"_blank\" rel=\"noopener\">Dead Aim</a>, the better.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p>\n\n<p>Ted has been thinking about PC games and bothering anyone who would listen with his thoughts on them ever since he booted up his sister's copy of Neverwinter Nights on the family computer. He is obsessed with all things CRPG and CRPG-adjacent, but has also covered esports, modding, and rare game collecting. When he's not playing or writing about games, you can find Ted lifting weights on his back porch. You can follow Ted on <a href=\"https://bsky.app/profile/dilfpatrol.bsky.social\" target=\"_blank\" rel=\"noopener\">Bluesky</a>.</p>"}];
