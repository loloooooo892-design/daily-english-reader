<script>
var articles = [{"title":"Toxic yuri story Kaschei is a marvelous free visual novel that turns your Downloads folder into a little labyrinth of mirrors","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/toxic-yuri-story-kaschei-is-a-marvelous-free-visual-novel-that-turns-your-downloads-folder-into-a-little-labyrinth-of-mirrors","category":"gaming","categoryLabel":"Gaming","wordCount":518,"readingTime":3,"content":"<p>Don't look up \"kaschei\" on Wikipedia before playing</p>\n    \n  \n  \n  \n  \n            <p>\r\nI too often default to thinking of videogames as singular, monolithic things, rather than hives of collectively made functions and assets, secreted behind a launcher icon. Kaschei, an experimental visual novel created for <a href=\"https://itch.io/jam/toxic-yuri-vn-jam-2/rate/4764436\" target=\"_blank\" rel=\"noopener\">Toxic Yuri VN Jam 2</a>, is an openly piecemeal arrangement of mutually informing or sabotaging fictions, stretched across different interfaces and timeframes, held together by a lot of lovely and hateful emotions. A really good kind of carefully networked, absolute mess. People and pieces in orbit.\r\n</p>\n<p>\r\nIt's a story of belonging, hollowness and resentment pursued by way of linked artworks, almost akin to a forensic investigation game like The Roottrees Are Dead in places, though its capital-C Choices are few - they mostly boil down to what you open next. It invites you to perform a formal analysis by steadily overlaying itself, introducing fresh incarnations of itself that feel both binary and consecutive. While broadly a mystery, written in the style of an instant messager conversation, it covers a handful of styles and genres, from epistolary fiction to sci-fantasy. </p>\n<p>It has fun with a few interface conventions – there's a wonderfully condescending, menu-level characterisation of the player as an inexplicable basement dweller - but it's not just a spoofy dismantling. As with many a great visual novel, it express a lot by way of deceptively simple questions of font, text colour and text SFX. It also has very cool music.\r\n</p>\n<p>\r\nNew to \"toxic yuri\"? Here are some framing excerpts from the jam page: \"This is a jam for stories that really dig in to [and] tackle trauma and problematic relationships. Stories that show despair, jealousy and rage. Stupid girls that make each other worse. Sadistic girls being manipulative on purpose. Societal trauma and the destructive ways it manifests in girlthings. You know, all that stuff. Basically, we love it when girls suffer, yaaaay!\"\r\n</p><p>\r\nFurther down, the organisers add that: \"Toxic yuri can be interpreted as anything from idiots navigating awful inexperienced romance to intentionally abusive violent criminal relationships. There isn't a strict criteria for what counts as toxic and it is a very vibes based interpretation. The jam is still created with the expectation that we can have a place for people to submit games leaning further towards the more intense themes.\"\r\n</p>\n<p>\r\nSpeaking as Johnny Squareman, Esq of Cisgender Towers, I'm nobody's ideal interlocutor for stories about \"stupid girls that make each other worse\". But I am very intrigued by how Kaschei works the chop and change of its relationship angst into a series of internal estrangements. The game is often so busy talking to itself, interrupting itself, that it needs a kind of 'reception' layer that is amusingly upfront in addressing the player.</p>\n<p>My one complaint is that it ends rather abruptly (I finished it in a couple of evenings), which perhaps reflects the gamejam timeframe, but may also reflect my not picking up on certain pieces of foreshadowing. There's so much to get into, here, but I've blathered enough - you can get into the rest yourself. <a href=\"https://bagenzo.itch.io/kaschei\" target=\"_blank\" rel=\"noopener\">Download Kaschei for free from Itch.io</a>.\r\n</p>"},{"title":"Hint, a new AI startup co-founded by Martha Stewart, offers an AI assistant for homeowners","source":"TechCrunch","author":"Sarah Perez","url":"https://techcrunch.com/2026/07/29/hint-a-new-ai-startup-co-founded-by-martha-stewart-offers-an-ai-assistant-for-homeowners/","category":"tech","categoryLabel":"Technology","wordCount":988,"readingTime":5,"content":"<p>Martha Stewart is entering the AI software era in the most Martha Stewart way possible: She has joined the co-founding team at Hint, an app that leverages AI technology to manage the tasks surrounding home maintenance and management. With the <a href=\"https://hinthome.com/\" target=\"_blank\" rel=\"noopener\">Hint</a> app, which launches today, homeowners can tackle challenges around maintenance schedules/tasks and energy management, learn about their soil and air quality, weigh insurance claims, and more.</p>\n<p>It can also serve as storage for various contracts, files, and invoices related to the home and its upkeep, which can be queried through the built-in AI assistant. </p>\n\n<p>Co-founder and CTO at Hint, New York-based Kyle Rush, says the home and hospitality empire founder lives nearby and is “very involved” with the startup, but is not a financial investor.</p>\n<p>“She’s a real co-founder with a serious stake in equity, and she does work for the company and the app. She’s not a figurehead. I go over about twice a week,” he says. “We sit down and look at the app, and she looks at what it’s saying — when it’s wrong about soil, she’ll say it, and when it’s not right about something about the home…she’ll mention it, and she’ll comment on what I design and the branding and the language. And so she’s, I would say, very involved.”</p>\n<p>The startup began in 2024 as a tool to help people navigate decarbonization incentives related to their home, but realized that broadening its use cases had more potential.</p>\n<p>“We really quickly realized, why can’t this be the AI for your home? People don’t really have an app to manage their homes…so we just pivoted,” says Rush. </p>\n<p>The <a href=\"https://apps.apple.com/us/app/hint-home-intelligence/id6758353765\" target=\"_blank\" rel=\"noopener\">app</a> joins others in the AI ecosystem that are working to expand AI beyond chatbots to apply the technology to solve real-world problems, while also adding Martha Stewart’s personal expertise to refine the experience.</p>\n\n<p>To get started with <a href=\"https://hinthome.com/\" target=\"_blank\" rel=\"noopener\">Hint</a>, users enter their home address, and the app builds a profile of the home from public data, like property records, weather and soil information, utilities, and more. Users can then upload documents, like inspection reports, home warranties, mortgage documents, contracts, insurance policies, invoices, and more.</p>\n\n<p>This data can tell you things about the soil below the foundation, and how that may affect lawn drainage or foundation risk movement. You can also learn about the air quality surrounding your home or how climate or drought information could impact the potential for floods, your home insurance rates, or your energy usage, among other things. </p>\n\n<p>Then, homeowners upload photos of the home’s major appliances, which allows the app to guide you through any “how to” questions or other maintenance tasks. </p>\n<p>This can be surprisingly revealing, as many people don’t know about the smaller tasks related to appliance upkeep. </p>\n\n<p>For instance, you may know to change your refrigerator’s water filter, but did you know that you should occasionally vacuum out the coils on some models to prevent fire hazards? Do you know when to flush a water heater or when to check the salt level for a home well?</p>\n<p>Hint’s personalized home maintenance schedule means you won’t have to remember these things, as it sends proactive push notifications about what needs attention and when. This schedule evolves with your home, leveraging its understanding of the house itself, its systems, and the macro environment. </p>\n\n<p>This is where Martha Stewart’s decades of experience in managing homes comes into play, as she’s guided the app development in key areas. In addition, homeowners can use Hint to add one-off tasks to their maintenance plans — like a reminder to replace a damaged window screen or re-caulk some baseboards, or anything else that comes up.</p>\n<p>Hint also provides an overall “home score,” offering an at-a-glance number that tells you how good of a job you’re doing managing your home to date. </p>\n\n<p>Meanwhile, Hint’s in-app AI chatbot lets you ask any questions related to your home or your documents. That means you could ask questions as simple as when was the last time you had the AC serviced, or as complex as what you’re paying per kilowatt hour for electricity or whether a <a href=\"https://www.consumerfinance.gov/ask-cfpb/what-is-a-home-equity-line-of-credit-heloc-en-107/\" target=\"_blank\" rel=\"noopener\">HELOC</a> would be a good idea to tap into your home equity.</p>\n<p>The app can also guide you through questions related to your homeowner’s insurance, like whether your deductibles are too high, if you’re missing coverage, or whether it makes sense to file a claim for a repair.</p>\n\n<p>Ahead of founding Hint, Rush led engineering at mattress startup Casper during its growth phase and was CTO at online retailer Maisonette. Before that, he built technology for both the Obama and Hillary presidential campaigns. <a href=\"https://www.linkedin.com/in/yihhanma/\" target=\"_blank\" rel=\"noopener\">Yih-Han Ma</a>, co-founder and CEO, based out of Charlotte, North Carolina, was previously SVP and GM at Red Ventures, a digital media and technology company.</p>\n\n<p>Rush says the idea for Hint came about as he grew interested in applied AI technology and how it could be put to use for the average homeowner in a more practical way. Under the hood, Hint uses commercial libraries, largely those from OpenAI, as well as Gemini for image work. </p>\n<p>The plan is to keep Hint’s AI intelligence free, but later add a premium subscription that could introduce power user features like managing additional properties. The app today generates affiliate revenue from its partner network of service providers, which Rush says is firewalled from the AI so it’s not biased in its recommendations. </p>\n<p><a href=\"https://hinthome.com/\" target=\"_blank\" rel=\"noopener\">Hint</a> (whose name combines the “H” from “home” with “intelligence”) is backed by <a href=\"https://www.businesswire.com/news/home/20260512987617/en/Martha-Stewart-Announces-Hint-a-New-Home-Management-Platform-Built-on-Human-Expertise-and-AI\" target=\"_blank\" rel=\"noopener\">$10 million</a> in funding from investors, including Montauk Capital, Brian Kelly (The Points Guy), Slow Ventures, Tusk Venture Partners, Energy Impact Partners, Amplo VC, and Hannah Grey.</p>\n<p>The <a href=\"https://apps.apple.com/us/app/hint-home-intelligence/id6758353765\" target=\"_blank\" rel=\"noopener\">iOS app</a> is currently available for free without subscriptions or ads. “We want it to be in the hands of every homeowner in the country,” says Rush.</p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>"},{"title":"Liberty Justice Center Files First Lawsuit Challenging Trump's Massive New Section 301 Tariffs","source":"The Volokh Conspiracy","author":"IlyaSomin","url":"https://reason.com/volokh/2026/07/24/liberty-justice-center-files-first-lawsuit-challenging-trumps-massive-new-section-301-tariffs/","category":"law","categoryLabel":"Law","wordCount":557,"readingTime":3,"content":"<p>\n\t\t\t\t<a href=\"https://reason.com/tag/donald-trump/\" target=\"_blank\" rel=\"noopener\">Donald Trump</a>\n\t\t\t</p>\n\t\t\t\t<h2><a href=\"https://reason.com/volokh/2026/07/24/liberty-justice-center-files-first-lawsuit-challenging-trumps-massive-new-section-301-tariffs/\" target=\"_blank\" rel=\"noopener\">Liberty Justice Center Files First Lawsuit Challenging Trump's Massive New Section 301 Tariffs</a>\n\t\t\t\t\t<p>The complaint explains why the tariffs violate the requirements of Section 301, and also run afoul of the major questions and nondelegation doctrines.</p>\n\t\t\t\t<p>\n\t\t\t\t\t\t|\n\t\t\t7.24.2026 3:55 PM\n</p>\n\t</h2>\n\t\n\t\t <p>Today, the Liberty Justice Center filed <em>Burlap &amp; Barrel, Inc. v. Greer</em>, the first case challenging Donald Trump's massive new Section 301 tariffs. The complaint is available <a href=\"https://libertyjusticecenter.org/wp-content/uploads/002-Burlap-and-Barrel-v.-Greer-Compl-2026-07-24.pdf\" target=\"_blank\" rel=\"noopener\">here</a>. LJC is the same group that I worked with on <em>V.O.S. Selections v. Trump</em>, the IEEPA tariff case <a href=\"https://reason.com/volokh/2026/02/20/supreme-court-decides-our-tariff-case-and-we-won/\" target=\"_blank\" rel=\"noopener\">decided by the Supreme Court in February</a>. LJC also filed one of the two cases challenging Trump's Section 122 tariffs, which <a href=\"https://reason.com/volokh/2026/05/07/us-court-of-international-trade-rules-against-trumps-section-122-tariffs/\" target=\"_blank\" rel=\"noopener\">prevailed in the US Court of International Trade in May</a> (it is now on appeal).</p> <p>The current case is before the US Court of International Trade. LJC's clients are two small businesses who import goods from many of the countries covered by the new tariffs.</p> <p>I am not directly involved in the Section 301 case. But I completely support it, and commend LJC for getting it in so quickly. I know from personal experience how hard it can be to do this on short notice.</p> <p>Commentators such as <a href=\"https://reason.com/volokh/2026/06/14/the-courts-should-rein-in-trumps-proposed-section-301-tariffs-as-well/\" target=\"_blank\" rel=\"noopener\">Peter Harrell</a>, <a href=\"https://thedispatch.com/newsletter/dispatch-markets/trump-tariffs-section-301-forced-labor-pretext/?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=dispatch-markets_20260723&amp;utm_content=124768\" target=\"_blank\" rel=\"noopener\">Scott Lincicome</a>, <a href=\"https://www.justsecurity.org/139675/delegation-tariff-authority-other-means/\" target=\"_blank\" rel=\"noopener\">Gregory Shaffer and Jeremiah May</a>, and <a href=\"https://reason.com/volokh/2026/07/23/trump-imposes-massively-harmful-and-illegal-section-301-tariffs/\" target=\"_blank\" rel=\"noopener\">myself</a> have previously laid out a variety of reasons why the Section 301 tariffs are illegal. I summarized them in <a href=\"https://reason.com/volokh/2026/07/23/trump-imposes-massively-harmful-and-illegal-section-301-tariffs/\" target=\"_blank\" rel=\"noopener\">my post</a> yesterday. The LJC complaint makes many of these same points. To briefly summarize it argues:</p> <p>1.  The Section 301 tariffs violate many of the procedural and substantive requirements of the statute; Trump is trying to turn a law intended to target specific trade practices into a tool for waging a massive worldwide trade war against virtually all our trading partners, using \"forced labor\" as a pretext.</p> <p>2. This runs afoul of the major questions doctrine (MQD), which <a href=\"https://supreme.justia.com/cases/federal/us/573/302/\" target=\"_blank\" rel=\"noopener\">requires Congress</a> to \"speak clearly\" when authorizing the executive to make \"decisions of vast economic and political significance.\" If it is unclear whether Section 301 grants Trump the sweeping authority he claims, MQD requires resolving the ambiguity against the administration.</p> <p>3. If Section 301 somehow does grant Trump the authority he claims, the law is unconstitutional under the nondelegation doctrine, which limits delegation of congressional power (here, the tariff authority) to the executive.</p> <p>4. The constitutional avoidance canon requires interpreting Section 301 to reject the administration's position. This canon requires courts to interpret federal laws to avoid constitutional problems whenever it is \"fairly possible\" to do so. Here, doing so is needed to avoid a massive nondelegation issue.</p> <p>Not surprisingly, I agree with all four of these arguments, and I will likely have more to say about them later.</p> <p>Another notable aspect of the lawsuit is that the plaintiffs are seeking class action certification. If it is granted, and they prevail on the merits, the ruling will completely block the Section 301 tariffs with respect to virtually all importers, not just LJC's two clients.</p> <p>I think it likely there will be additional lawsuits challenging the Section 301 tariffs. I hope  to write more about these issues soon.</p> <p>UPDATE: LJC has a helpful statement summarizing the case <a href=\"https://libertyjusticecenter.org/pressrelease/liberty-justice-center-challenges-unlawful-section-301-tariffs-as-administration-replaces-expiring-section-122-tariffs/\" target=\"_blank\" rel=\"noopener\">here</a>.</p>\t\n\n\t\t<p>\n        <a href=\"https://reason.com/volokh/2026/07/24/short-circuit-an-inexhaustive-weekly-compendium-of-rulings-from-the-federal-courts-of-appeal-69/\" target=\"_blank\" rel=\"noopener\">NEXT: Short Circuit: An inexhaustive weekly compendium of rulings from the federal courts of appeal</a>\n    </p>\n\t<a href=\"https://reason.com/tag/donald-trump/\" target=\"_blank\" rel=\"noopener\">Donald Trump</a><a href=\"https://reason.com/tag/free-trade/\" target=\"_blank\" rel=\"noopener\">Free Trade</a><a href=\"https://reason.com/category/economics/tariffs/\" target=\"_blank\" rel=\"noopener\">Tariffs</a><a href=\"https://reason.com/category/law/executive-branch/executive-power/\" target=\"_blank\" rel=\"noopener\">Executive Power</a><a href=\"https://reason.com/tag/nondelegation/\" target=\"_blank\" rel=\"noopener\">Nondelegation</a><a href=\"https://reason.com/tag/major-questions-doctrine/\" target=\"_blank\" rel=\"noopener\">Major Questions Doctrine</a>"},{"title":"Trump’s Cabinet Has Joined TikTok—and It’s Not Great","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/infinite-scroll/the-department-of-labored-content","category":"fun","categoryLabel":"Interesting Reads","wordCount":847,"readingTime":5,"content":"<p>When the White House announced, last week, that President Donald Trump’s Cabinet members were launching TikTok accounts, it urged users not to “miss a second of the hype” because the Administration was “CRUSHING IT for American Workers and on TikTok.” The Health and Human Services Secretary, <a href=\"https://www.newyorker.com/magazine/2024/08/12/robert-f-kennedy-jr-profile-presidential-campaign\" target=\"_blank\" rel=\"noopener\">Robert F. Kennedy, Jr.</a>, declared in his first official post that he was “making TikTok healthy again,” while a montage of him doing pullups and handling snakes played to Boston’s “More Than a Feeling.” The Secretary of Veterans Affairs, <a href=\"https://www.newyorker.com/news/the-lede/the-department-of-veterans-affairs-is-not-ok\" target=\"_blank\" rel=\"noopener\">Doug Collins</a>, promised to tailor his TikTok to “special and relevant” veterans’ concerns, which has so far brought us a handful of A.I.-generated A.S.M.R. animations and N.F.L. highlights. The Justice Department’s account has featured numerous alarmist posts about cartels and immigrant crime, while positioning the acting Attorney General, <a href=\"https://www.newyorker.com/magazine/2026/06/22/why-todd-blanche-should-not-be-attorney-general\" target=\"_blank\" rel=\"noopener\">Todd Blanche</a>, as a beacon of law and order. Other Trump officials are presenting their arrival on TikTok as a public service, a way to speak directly to voters and spread policy information without the news media muddling the message. As <a href=\"https://www.newyorker.com/news/election-2026\" target=\"_blank\" rel=\"noopener\">the midterms</a> fast approach, and Trump’s approval ratings hover around forty per cent, the Administration is presumably hoping to flood the algorithm with as much <em>MAGA</em> content as possible, turning to TikTok to reinvigorate a base whose enthusiasm has dwindled in the dying light of Trump’s second and final term in office.</p><p>The Administration’s embrace of TikTok follows years of bipartisan attempts to ban the platform over national-security concerns. U.S. officials have long alleged that ByteDance, the Beijing-based company that created TikTok, mined American user data and manipulated content for political influence, in concert with the Chinese government (a charge the company has denied). In January, 2025, after the Supreme Court upheld a law that President Joe Biden had signed requiring ByteDance to divest TikTok’s U.S. operations, <a href=\"https://www.newyorker.com/culture/infinite-scroll/tiktok-and-the-retreat-from-technological-globalization\" target=\"_blank\" rel=\"noopener\">the platform went offline</a> in the U.S. for several hours, sending content creators into a panic. For a moment, it seemed like the end of a generation-defining social-media app and an anticlimactic conclusion to a years-long saga. Trump, however, sensed a business opportunity; on his first day back in the White House, he signed an executive order to delay the shutdown and announced that an American-based “joint venture” would soon take fifty per cent ownership of the app. “Essentially, with TikTok, I have the right to sell it or close it,” he said, after signing the order. In the following months, a consortium emerged that included Oracle, the tech-giant co-founded by the conservative billionaire Larry Ellison; the private-equity firm Silver Lake; and M.G.X., an Emirati-backed investment fund with cryptocurrency connections to the Trump family. Anxieties about TikTok’s status as a data-harvesting foreign interloper gave way to a new concern: the app was now under the domain of a Republican mega-donor and private investors <a href=\"https://www.newyorker.com/news/the-financial-page/donald-trumps-tiktok-deal-looks-like-crony-capitalism\" target=\"_blank\" rel=\"noopener\">with direct ties to Trump</a>. “If I could, I’d make it a hundred per cent <em>MAGA</em>-related,” Trump said, referring to the app’s feed, after TikTok’s new ownership structure was made official.</p><p>Although Trump claimed victory in the deal—“I saved TikTok, so you owe me big,” he pronounced, in a celebratory address directed at the “young people of TikTok”—questions remained about ByteDance’s continued involvement in the platform’s operations. It was unclear, for instance, how much influence the Chinese company retained over TikTok’s recommendation algorithm and to what extent it could access U.S. user data. Timothy Edgar, a Harvard Law lecturer and cybersecurity expert, has argued that, since the change in ownership, some national-security risks have been made “even worse.” This development has been compounded by Trump’s decimation of <a href=\"https://www.newyorker.com/magazine/2026/03/16/the-zombie-regulator\" target=\"_blank\" rel=\"noopener\">the Federal Trade Commission</a>, which now has little incentive to investigate privacy violations or consumer-protection abuses committed by tech conglomerates, especially those which have pledged allegiance to Trump. And so it goes: the line between government and private interests has blurred beyond distinction during Trump’s second term, the President’s economic policy resembling a system of patronage rather than a rules-based market economy.</p><p>Having handpicked TikTok’s new majority ownership, the White House now wants the app’s devoted audience, too. It’s certainly a bet worth taking—the proportion of adults who consume traditional news media has significantly shrunk in the past decade, and social-media sites have become the primary way in which millions of Americans engage with the world of ideas and current events. Political messaging always had a natural home on X and Facebook, whose interfaces invite <a href=\"https://www.newyorker.com/news/letter-from-silicon-valley/trump-twitter-facebook-and-the-future-of-online-speech\" target=\"_blank\" rel=\"noopener\">text-based discourse</a>, evident in comment threads that amplify conflict and extreme perspectives. TikTok entered the ecosystem as a different animal. The app makes it easy to stitch together video clips and overlay them with audio and text, its content optimized for a vertical smartphone screen, the infinite scroll. This is how TikTok became synonymous with dancing and lip-synch routines—a playpen of viral-aspiring remix and reaction videos, comedy sketches and cooking tutorials, makeup reviews and day-in-the-life narratives. Even though TikTok is still strongly associated with Gen Z and youth culture, the app’s audience has expanded well beyond its early demographic, and it now attracts anyone interested in an endless stream of algorithmically personalized short-form videos.</p>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
