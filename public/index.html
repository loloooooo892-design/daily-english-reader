<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
    --warning-bg: #2A2518;
    --warning-border: #5C4A28;
    --warning-text: #D4B87A;
    --swap-bg: #262B35;
    --swap-bg-hover: #2F3543;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
  --warning-bg: #2A2518;
  --warning-border: #5C4A28;
  --warning-text: #D4B87A;
  --swap-bg: #262B35;
  --swap-bg-hover: #2F3543;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
  --warning-bg: #FFF8F0;
  --warning-border: #E8C88A;
  --warning-text: #8A6D3B;
  --swap-bg: #EBEEF3;
  --swap-bg-hover: #DDE2EA;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

.meta {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {
  margin: 0 0.4em;
  color: var(--text-faint);
}

.category-tag {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-right: 0.5em;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-wrap: balance;
  margin: 0.75rem 0 1.75rem;
  color: var(--text);
}

.feed-warning {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--warning-text);
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;
  padding: 0.6em 0.9em;
  margin-bottom: 1.75rem;
}

.swap-bar {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.75rem;
}

.swap-actions {
  display: flex;
  gap: 0.5rem;
}

.swap-btn {
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--swap-bg);
  border: none;
  border-radius: 5px;
  padding: 0.45em 0.9em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.01em;
}

.swap-btn:hover {
  background: var(--swap-bg-hover);
  color: var(--text);
}

.swap-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.swap-counter {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.article-body p {
  margin-bottom: 1.25em;
}

.article-body h2, .article-body h3, .article-body h4 {
  font-weight: 700;
  line-height: 1.35;
  margin: 2em 0 0.75em;
}

.article-body h2 { font-size: 1.375rem; }
.article-body h3 { font-size: 1.175rem; }
.article-body h4 { font-size: 1.05rem; }

.article-body blockquote {
  border-left: 3px solid var(--border);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-secondary);
  font-style: italic;
}

.article-body ul, .article-body ol {
  margin: 1em 0;
  padding-left: 1.5em;
}

.article-body li {
  margin-bottom: 0.4em;
}

.article-body a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

.article-body a:hover {
  text-decoration-thickness: 2px;
}

.article-body em { font-style: italic; }
.article-body strong { font-weight: 700; }

.footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.archive-link {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.8125rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 2rem;
}

.archive-link a {
  color: var(--accent);
  text-decoration: none;
}

.archive-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .container { padding: 2rem 0 3rem; }
}

<script>
var articles = [{"title":"No little kids allowed, and other new info about Tesla’s Cybercab","source":"TechCrunch","author":"Sean O'Kane","url":"https://techcrunch.com/2026/09/04/no-little-kids-allowed-and-other-new-info-about-teslas-cybercab/","category":"tech","categoryLabel":"Technology","wordCount":924,"readingTime":5,"content":"<p>Tesla’s private <a href=\"https://techcrunch.com/2026/09/03/the-cybercab-is-teslas-fork-in-the-road-moment/\" target=\"_blank\" rel=\"noopener\">Cybercab event</a> has come and gone, and it was very different from the large, loud, livestreamed events the company usually puts on — an odd choice for the launch of a product CEO Elon Musk has spent years building toward.  </p>\n<p>In fact, it doesn’t even appear that Musk spoke at the event, the keynote of which, by all accounts, only lasted around 15 minutes.</p>\n<p>The promise of the Cybercab is <a href=\"https://techcrunch.com/2026/09/03/the-cybercab-is-teslas-fork-in-the-road-moment/\" target=\"_blank\" rel=\"noopener\">massive</a>: a fully autonomous vehicle that uses only cameras and AI to drive itself, all for much less than a Waymo. But Tesla scattered a lot of the details. Some are in PDFs the company released on Thursday, as well as in updated terms of service in its “Robotaxi” app. The rest were left for a select few die-hard fans to disseminate online.  </p>\n<p>The company now has to prove that these vehicles are safe — to the public, to local governments, and to the National Highway Traffic Safety Administration, which has <a href=\"https://techcrunch.com/2026/09/04/feds-launch-investigation-into-teslas-cybercab-deployment/\" target=\"_blank\" rel=\"noopener\">already opened an investigation into Tesla’s Cybercab rollout</a>.  </p>\n<p>In the meantime, here are some of the most interesting new details that caught our attention: </p>\n<h2><strong>No Cybercab for kiddos</strong></h2>\n<p>One of the more interesting details in the Cybercab fine print is that Tesla does not allow minors under the age of 13 to ride in the vehicle “at this time.”  </p>\n<p>Minors between the ages of 8 and 17 are allowed to ride in Tesla’s <a href=\"https://techcrunch.com/2025/06/30/tesla-sends-driverless-model-y-from-factory-to-customer-to-promote-its-robotaxi-tech/\" target=\"_blank\" rel=\"noopener\">“Robotaxi” Model Y SUVs</a>, and Tesla does have guidelines on how to use child seats in both vehicles. </p>\n<p>Curiously, the Cybercab does not have the standard LATCH anchors for child seats. Instead, they can only be attached using the seat belt. Tesla executives, including Musk, have talked a lot about how much they focus on taking out unnecessary parts to cut down on costs, though I’ll admit I wasn’t expecting the company to ditch child seat anchors — especially given Musk’s obsession with making more babies. </p>\n<p>All children under 18 must be accompanied by an adult in both vehicles, according to Tesla. But something is making Tesla hesitate on allowing young children in the Cybercab for now. </p>\n<h2><strong>What happens in a crash?</strong> </h2>\n<p>While the goal of an autonomous vehicle is to avoid crashing, even the most capable ones on the road today do wind up in collisions. </p>\n<p>Here’s what happens when the Cybercab gets in a crash: The airbags will inflate, the doors will unlock, the hazard warning lights and interior lights will turn on, the high voltage battery is disabled, the windows go to the “vent” position, the Cybercab will apply the brakes to come to a stop and park, and the infotainment system will start up a two-way connection with Tesla’s rider support team. </p>\n<p>Unlocking the doors is notable because Tesla has come under fire for its reliance on electronic door latches, both in its home market of the United States and in its largest market, China. Just last month, Tesla agreed to recall 3 million cars in China, alongside a number of other automakers, as a result of an investigation into electronic door latches that could trap people following a crash.  </p>\n<h2><strong>Manual door releases</strong></h2>\n<p>Speaking of doors, another recent criticism of Tesla is that its interior manual door releases are too hard to find in an emergency. These are necessary because the electronic door latches are the main method of getting in and out of the company’s vehicles, activated either by pushing a button or using a smartphone.  </p>\n<p>The Cybercab uses electronic door latches, which allow the doors to open automatically at the start or end of a ride. There is also a small button on the exterior of the car that riders can use to open the doors. But inside, the manual release is thankfully in a very obvious spot on the armrest of each door.  </p>\n<h2><strong>Brake-by-wire</strong></h2>\n<p>Tesla is using a brake-by-wire system in the Cybercab, again largely (it seems) for the purposes of cutting costs. Instead of using a hydraulic system that pumps fluid through lines to control brake pressure, Tesla has electronic actuators controlling the brake calipers. </p>\n<p>“Having electric brakes avoids the complexity of a hydraulic system: no need to rout [sic] plumbing all around the car,” Musk wrote in a <a href=\"https://x.com/elonmusk/status/2095719587929039200\" target=\"_blank\" rel=\"noopener\">post</a>. </p>\n<p>The company was already the first major automaker to use steer-by-wire on its Cybertruck, severing the physical connection between the steering wheel and the front wheels.</p>\n<h2><strong>A little fresh air</strong></h2>\n<p>For some reason, the windows of the Cybercab “cannot be fully opened at this time.” Tesla doesn’t explain why in the documentation it released this week. </p>\n<h2><strong>USB-C power</strong></h2>\n<p>According to influencer <a href=\"https://x.com/jeremyjudkins_/status/2095588148721877380\" target=\"_blank\" rel=\"noopener\">Jeremy Judkins</a>, the USB-C outlets in the Cybercab put out 90W of power — roughly four times more than you’d typically find inside a car.  </p>\n<p><em>When you purchase through links in our articles, <a href=\"https://techcrunch.com/techcrunch-affiliate-monetization-standards/\" target=\"_blank\" rel=\"noopener\">we may earn a small commission</a>. This doesn’t affect our editorial independence.</em></p>\n\n\t\t<p>Sean O’Kane is a reporter who has spent a decade covering the rapidly-evolving business and technology of the transportation industry, including Tesla and the many startups chasing Elon Musk. Most recently, he was a reporter at Bloomberg News where he helped break stories about some of the most notorious EV SPAC flops. He previously worked at The Verge, where he also covered consumer technology, hosted many short- and long-form videos, performed product and editorial photography, and once nearly passed out in a Red Bull Air Race plane.</p>\r\n<p>You can contact or verify outreach from Sean by emailing <a href=\"mailto:sean.okane@techcrunch.com\" target=\"_blank\" rel=\"noopener\">sean.okane@techcrunch.com</a> or via encrypted message at okane.01 on Signal.</p>\t\n\t<p>\n\t\t<a href=\"https://techcrunch.com/author/sean-okane/\" target=\"_blank\" rel=\"noopener\">View Bio </a>\n\t</p>"},{"title":"The Scourge of A.1.","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/magazine/2026/09/14/the-scourge-of-a-1","category":"fun","categoryLabel":"Interesting Reads","wordCount":801,"readingTime":5,"content":"<p>Rather than devote this space to humor, as I sometimes do, this week I want to speak about a very serious subject: A.1. Wherever we turn nowadays, we hear about the supposedly frightening phenomenon of A.1. We’re told that A.1. is going to take our jobs, revolutionize our economy, drain our bank accounts, maybe change how our brains work, start wars, and even lead to the end of the world. All of these are real concerns. But let me add some perspective and demythologize the subject a bit. Yes, right now, A.1. may seem overwhelming and scary, but let’s everybody step back, take a deep breath, and remember—<em>it’s just a steak sauce!</em></p><p>For A.1. to cause such fear is understandable, because many of us are not comfortable with condiments. We see A.1. as belonging to the world of advanced, high-level condiments, and we run for cover. In my case, I struggled with condiments all the way through school. On the condiments SAT, I did so poorly that it almost kept me out of college. My aptitude for condiments is very low—nothing I can do about it—and I know millions are like me in that. But just because we’re not very good at condiments, that’s no reason to fear them.</p><p>Also, there is another threatening and somewhat embarrassing aspect to A.1., especially for young men. They are told that when they become sexually active, always use a condiment. They hear this over and over: Use a condiment! Use a condiment! They have that fixed in their minds, and they want to follow this sound advice from parents and teachers and public-health officials, and that’s all good. But nobody ever says <em>which</em> condiment. And there are a lot of condiments out there! What with all the uncertainty that surrounds intimacy when you’re young and inexperienced, not knowing the right condiment can be an anxiety-producing issue. When the experts say, “Use a condiment,” do they mean, “Use Louisiana Extra-Hot Iberian Hot Sauce?” Well, here’s a news flash: they don’t! (I learned that the hard way.) Each person must settle on the right condiment by trial and error, through an often painful process, and that’s a problem we tend not to talk about.</p><p>Now, I’m going to tell you a fact about A.1. that, once you hear it, you’ll never forget it. A.1. is basically <em>Worcestershire sauce</em>. Sure, some tweaks to the formula have been added, but in essence A.1. and Worcestershire sauce are one and the same. A.1. was invented because nobody knew how to pronounce “Wor-shest-er-sher-ster sauce.” A guy takes his family or some friends or clients out for a nice dinner, everybody orders big steaks, and then the guy tells the waiter, “Oh, and bring us a bottle of Wor-shers-ter-shuer-shest sauce,” and he looks and sounds like an idiot, and the evening is ruined. “A.1.,” on the other hand, is easy to say. Plus, everybody is now so terrified of A.1., it makes the waitstaff hop to.</p><p>How did such a hard-to-pronounce name as Wor-shest-et-cetera make it into the language in the first place? It turns out that the name goes back thousands of years and refers to a place in England. In the time of the Roman Empire, much of England was under occupation. The English had hundreds of different druidical religions, but only one sauce. In order to confuse the Romans, the local people gave their most strategic places names that were almost impossible to pronounce. One of these places was called, in Saxon, “Wor-shesht-yer-sher-ter-shest-sher,” which meant “The Place of Our Only Sauce, and We Have Just the One.” The Roman Army, which had recently come from Italy, naturally spoke Introductory Latin, then known as Italian. Try saying that name in Italian! It’s no snap for the Italians even today, after centuries of practice.</p><p>Recently, you may have noticed that your electricity bill has gone up. This is because A.1.-production centers bigger than any the world has ever seen are using billions of kilowatts to pump out the familiar steak sauce night and day. A study has shown that by early next year we will have enough A.1. not only to garnish all the beef cattle, milk cows, buffalo, beefalo, oxen, and musk oxen on the planet but enough to drown them in an A.1. tsunami seventy-five metres deep. What are the manufacturers’ plans for all this A.1.? Here is where the dangerous part comes in. Many experts say that all this A.1. has some connection to computers, and to something called “coding.” Following this theory, the code may be an ingenious and hard-to-crack cipher in which, perhaps, the letter “A” is represented by the numeral “1.” Talk about hiding in plain sight! But, for the moment, the rest of the code has yet to be solved. ♦</p>"},{"title":"Hong Kong court upholds conviction of pro-democracy humanitarian fund organizers","source":"Jurist","author":"","url":"https://www.jurist.org/news/2026/09/hong-kong-court-upholds-conviction-of-pro-democracy-humanitarian-fund-organizers/","category":"law","categoryLabel":"Law","wordCount":548,"readingTime":3,"content":"<p>\nNews</p>\n<strong>\n<a href=\"https://www.jurist.org/news/2026/09/hong-kong-court-upholds-conviction-of-pro-democracy-humanitarian-fund-organizers/#\" target=\"_blank\" rel=\"noopener\">Hong Kong court upholds conviction of pro-democracy humanitarian fund organizers</a>\n</strong><p>A Hong Kong appellate court on Thursday <a href=\"https://legalref.judiciary.hk/lrs/common/ju/ju_frame.jsp?DIS=184645&amp;currpage=T\" target=\"_blank\" rel=\"noopener\">upheld the conviction</a> of five pro-democracy activists for their failure to register the <a href=\"https://www.jurist.org/news/2023/08/hong-kong-police-arrest-10-for-conspiracy-to-collude-with-foreign-forces/\" target=\"_blank\" rel=\"noopener\">612 Humanitarian Relief Fund</a>, created to support detained or injured demonstrators during the 2019 <a href=\"https://www.jurist.org/news/2019/06/hong-kong-demonstrators-protest-against-proposed-extradition-bill/\" target=\"_blank\" rel=\"noopener\">Hong Kong protests</a>, under <a href=\"https://www.elegislation.gov.hk/hk/cap151\" target=\"_blank\" rel=\"noopener\">the Societies Ordinance</a> (Cap 151). The decision exemplifies concerns about the rule of law and growing restrictions on civil society in Hong Kong.</p><p>The fund’s trustees appealed their convictions to the Hong Kong Court of Appeal. The appellants were retired Roman Catholic Cardinal Joseph Zen, Lingnan University professor <a href=\"https://our-global-u.org/oguorg/en/hui-po-keung/\" target=\"_blank\" rel=\"noopener\">Hui Po Keung</a>, singer-activist <a href=\"https://hksar.org/denise-ho-hong-kong-has-reached-a-point-of-no-turning-back\" target=\"_blank\" rel=\"noopener\">Denise Ho</a>, and former Legislative Council members <a href=\"https://notablepeopleproject.org/margaret_ng\" target=\"_blank\" rel=\"noopener\">Margaret Ng</a> and <a href=\"https://notablepeopleproject.org/cyd_ho\" target=\"_blank\" rel=\"noopener\">Cyd Ho</a>.</p><p><a href=\"https://legalref.judiciary.hk/lrs/common/ju/ju_frame.jsp?DIS=184645&amp;currpage=T\" target=\"_blank\" rel=\"noopener\">The court</a> noted that the Fund was intended to provide support for protesters’ legal, living or medical expenses, or for the family members of deceased or injured protesters. It also supported public campaigns in opposition to the 2019 Extradition Bill, the focus of that year’s protest movement. The bill was <a href=\"https://www.jurist.org/news/2019/10/hong-kong-withdraws-extradition-bill-that-sparked-mass-protests/\" target=\"_blank\" rel=\"noopener\">formally withdrawn</a> after it triggered massive <a href=\"https://www.amnesty.org/en/latest/news/2019/09/hong-kongs-extradition-bill-final-straw/\" target=\"_blank\" rel=\"noopener\">city-wide demonstrations</a> amid fears that the legislation would compromise Hong Kong’s legal independence and allow citizens to be extradited to be tried under mainland China’s judicial system.</p><p>The court characterized the protests as having “plunged Hong Kong into serious social unrest, resulting in violent riots and unlawful assemblies…on an unprecedented scale.” It rejected the appellants’ arguments that the Fund was not a “society” within the meaning of the Ordinance, finding that the organization and management of the Fund were sufficient to constitute a governing body, with the defendants serving as its officers.</p><p>The Societies Ordinance regulates the registration and prohibition of civil societies, imposing <a href=\"https://www.elegislation.gov.hk/hk/cap151?xpid=ID_1438402725051_002\" target=\"_blank\" rel=\"noopener\">criminal liability for violations</a>. Originally enacted in 1901, the registration system was repealed in 1992 but <a href=\"https://www.legco.gov.hk/yr02-03/english/bc/bc55/papers/bc55-113-e.pdf#rpty-P5X1cAJ\" target=\"_blank\" rel=\"noopener\">reinstated</a> by the Standing Committee of the National People’s Congress after the 1997 handover of Hong Kong to China. The court said all the amendments were guided by the “prevailing and emerging security concerns” of the day.</p><p>Although the appellants were not sentenced to prison time, instead each being fined HKD$4,000 (USD$500), the ruling may deter future civil-society activity and legal-aid efforts by signaling that even minor administrative violations can result in criminal convictions.</p><p>Articles 19, 21 and 22 of the International Covenant on Civil and Political Rights <a href=\"https://www.ohchr.org/sites/default/files/ccpr.pdf\" target=\"_blank\" rel=\"noopener\">(ICCPR)</a> protect the rights to peaceful assembly, freedom of association, and freedom of expression. Although China has signed but not yet ratified the ICCPR, it remains part of <a href=\"https://www.mjilonline.org/the-diminishing-status-of-the-iccpr-in-hong-kong-following-the-promulgation-of-the-national-security-law/\" target=\"_blank\" rel=\"noopener\">Hong Kong law</a> through the territory’s Basic Law and the Hong Kong Bill of Rights Ordinance. The court asserted that there are “no restrictions on the right to freedom of association” except for when these restrictions are in the interest of national security or public safety.</p><p>However, the decision highlights concerns that recent legislation and court decisions in Hong Kong have increasingly narrowed the space for civil-society activity and undermined the rule of law. The Hong Kong protest movement, beginning in 2019 in opposition to a proposed Extradition Bill and continuing against the 2020 <a href=\"https://www.jurist.org/news/2020/07/china-passes-hong-kong-national-security-law/\" target=\"_blank\" rel=\"noopener\">National Security Law</a> and <a href=\"https://www.jurist.org/news/2026/06/hong-kong-proposes-new-law-empowering-chief-executive-to-certify-any-criminal-act-as-invoking-national-security-law/\" target=\"_blank\" rel=\"noopener\">subsequent legislation</a>, has led to <a href=\"https://www.jurist.org/news/2026/06/rights-watchdog-warns-hong-kong-governance-restructure-tightens-social-control/\" target=\"_blank\" rel=\"noopener\">tightening restrictions</a> and what critics call a <a href=\"https://www.jurist.org/news/2025/03/hong-kong-social-worker-who-mediated-2019-anti-government-protests-convicted-for-rioting/\" target=\"_blank\" rel=\"noopener\">criminalization of activism</a>. Hong Kong courts, giving judicial deference to broad security rationales in the law, continue to uphold <a href=\"https://www.jurist.org/news/2026/06/hong-kong-top-court-upholds-law-banning-election-boycott-campaigns/\" target=\"_blank\" rel=\"noopener\">laws</a> and <a href=\"https://www.jurist.org/news/2026/08/hong-kong-court-finds-tiananmen-crackdown-commemorators-guilty-of-subversion/\" target=\"_blank\" rel=\"noopener\">convictions</a> against pro-democracy advocates.</p>"},{"title":"\"I'm desperately looking for anybody who knows anybody at Valve\": open world satire Future? No Thanks! is still locked in Steam horny jail","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/im-desperately-looking-for-anybody-who-knows-anybody-at-valve-open-world-satire-future-no-thanks-is-still-locked-in-steam-horny-jail","category":"gaming","categoryLabel":"Gaming","wordCount":659,"readingTime":4,"content":"<p>Update: Valve change rating, lifting blocks on availability</p>\n    \n  \n  \n  \n\n            <p><strong>Update 28/8:</strong> Valve appear to have taken action, changing the game's rating - <a href=\"https://store.steampowered.com/app/3861870/Future_No_Thanks/\" target=\"_blank\" rel=\"noopener\">the storepage</a> can now be accessed in the UK. \"It looks like Steam re-reviewed Future? No Thanks! and removed the 'frequent nudity or adult content' reverting the Germany geo-ban and the age verification by credit card in the UK,\" Paolo Perdicini <a href=\"https://bsky.app/profile/molleindustria.org/post/3mu6c37xfds27\" target=\"_blank\" rel=\"noopener\">writes on Bluesky</a>. \"It officially has only 'some nudity or adult content' as every good game should.\"</p>\n<p>Our original story continues below.</p>\n\n<p>Even as <a href=\"https://www.rockpapershotgun.com/gta-6-everything-we-know\" target=\"_blank\" rel=\"noopener\">GTA 6</a> breaks the internet with its vistas of full frontal nudity, poledancers and endless, lustful twerking, another promising <a href=\"https://www.rockpapershotgun.com/the-best-open-world-games\" target=\"_blank\" rel=\"noopener\">open world</a> satire with \"mild nudity\" and some racey encounters has been rendered invisible to a whole swathe of Steam users thanks to Valve's squeamishness about adult games. This is despite its creator deleting the associated \"sex quest\".</p>\n<p>The game in question is Molleindustria's macabre yet upbeat ecosocialist comedy <a href=\"https://www.rockpapershotgun.com/games/future-no-thanks\" target=\"_blank\" rel=\"noopener\">Future? No Thanks!</a>, in which a grumpy old fart who's applying for state-supplied euthanasia attempts to polish off his bucket list. Following <a href=\"https://www.rockpapershotgun.com/enjoy-your-last-day-in-a-future-that-works-for-everyone-but-you-i-adore-the-demo-for-future-no-thanks-an-open-world-comedy-about-a-boomer-trapped-in-leftwing-paradise\" target=\"_blank\" rel=\"noopener\">a great demo</a>, it was <a href=\"https://www.rockpapershotgun.com/indie-open-worlder-future-no-thanks-gets-last-minute-delay-after-steam-content-mods-allegedly-demand-a-watch-the-sex-scene-button\" target=\"_blank\" rel=\"noopener\">delayed last minute</a> due to concerns about some cartoon boobs and bottoms (see above), with Valve's content moderators allegedly requesting that Molleindustria – aka, Paolo Pedercini - submit a build with a 'skip to sex scene button'.</p><p>Some weeks later, Future? No Thanks! is still locked in horny jail with a rating that doesn't allow me to open the Steam page without age verification, thanks to the UK's Online Safety Act. GTA games, though, with their <a href=\"https://www.esrb.org/ratings/38445/grand-theft-auto-v/\" target=\"_blank\" rel=\"noopener\">lapdances and blowjobs</a>? I can view those just fine on Steam. I guess it'll be interesting to see if GTA 6 has to bend for Valve and the <a href=\"https://www.rockpapershotgun.com/how-payment-networks-control-the-definition-of-acceptable-sex-in-videogames\" target=\"_blank\" rel=\"noopener\">payment networks</a>, as and when they date that PC version. I sense that Rockstar may have better luck with the approval process than Molleindustria.</p>\n<p>\"Even after we removed the entire sex quest, Steam mis-classifies Future? No Thanks! as pornography, making it invisible to most Steam users and completely geo-locked in Germany,\" Molleindustria <a href=\"https://bsky.app/profile/molleindustria.org/post/3mu363pkzzc2l\" target=\"_blank\" rel=\"noopener\">wrote in a Bluesky post this week</a>. \"We are currently at Gamescom in Cologne, everybody is asking us why they can't see the PAGE of a Teen rated game.\"</p>\n<p>According to Pedercini, Future? No Thanks! is currently filed on Steam under \"Frequent Nudity or Sexual Content\" - that's to say, \"primarily about explicit or frequent nudity, or sexual content that is not appropriate for all audiences\". Which certainly doesn't describe what I've played of the demo, though I can't double check - I'm no longer able to access the demo without handing over credit card details to verify my age. As Pedercini goes on, \"the game is rated USK 16, ERSB 12 and PEGI 12. But Steam prefers to preemptively ban rather than following the German law (USK).\"</p>\n<p>Further down the thread, Perdicini farcically includes a photo of Frank-Walter Steinmeier, current president of Germany, smiling for a photo op at a booth for Future? No Thanks! and some other games (shout out for the equally interesting city builder <a href=\"https://www.rockpapershotgun.com/games/microlandia\" target=\"_blank\" rel=\"noopener\">Microlandia</a>). \"We are here in a booth sponsored by the German government,\" he writes. \"Here's the PRESIDENT OF GERMANY this morning, posing in front of a game that Steam considers too pornographic for this whole country.</p>\n<p>\"This has been the most humiliating and surreal experience in 20+ years of game making,\" Perdicini concludes. \"I'm desperately looking for anybody who knows anybody at Valve that can at least tell me what's going on.\"</p>\n<p>I've requested comment from Valve, asking whether the game's current rating on Steam reflects an administrative delay of some kind. I'll end by again nudging you towards Jay Castello's <a href=\"https://aftermath.site/steam-censorship-future-no-thanks-perfect-tides/\" target=\"_blank\" rel=\"noopener\">recent Aftermath piece</a> on the absolute grind of getting Certain Kinds Of Game on Steam, which includes details of the approval process and more thoughts from Perdicini.</p>\n<p><em>This article has been updated with some bits from Perdicini's Bluesky thread, specifying the game's current classification on Steam.</em></p>"}];
var currentIndex = 0;

    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
