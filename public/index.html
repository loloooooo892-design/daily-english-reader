<script>
var articles = [{"title":"Chinese AI Researchers Are Finding Their Voice on X","source":"Wired","author":"@wired","url":"https://www.wired.com/story/chinese-ai-researchers-are-finding-their-voice-on-x/","category":"tech","categoryLabel":"Technology","wordCount":1194,"readingTime":6,"content":"<p>The prevailing narrative in Silicon Valley is that <a href=\"https://www.wired.com/story/the-white-house-is-trying-to-figure-out-what-to-do-about-chinese-ai/\" target=\"_blank\" rel=\"noopener\">Chinese AI models</a> like <a href=\"https://www.wired.com/story/uncanny-valley-podcast/\" target=\"_blank\" rel=\"noopener\">Kimi K3</a> and <a href=\"https://www.wired.com/story/deepseek-china-model-ai/\" target=\"_blank\" rel=\"noopener\">DeepSeek R1</a> came out of nowhere. But the truth is that even if you never travel to China, there’s an easy way to get a sense of what Chinese AI researchers are up to: log on to X.</p><p>In the past year, I’ve seen a steady increase of Chinese artificial intelligence researchers joining X and participating in the wider discourse about AI development and commercialization. Take Moonshot AI, the company behind Kimi K3, as an example. On Thursday, I was able to quickly find around 30 accounts on X run by people who claim to be currently affiliated with Moonshot, including two of the startup’s cofounders, as well as half a dozen former employees and collaborators. And these are not dormant accounts: They talk about Moonshot’s big releases and incremental research papers, make friends with Western researchers, and share details about their personal life and hobbies.</p><p>Moonshot is arguably the Chinese AI lab that’s most active on X, but you will easily find executives and technical staff from other leading Chinese startups, like Minimax and Z.ai. Even several employees at DeepSeek, who <a href=\"https://www.theinformation.com/articles/deepseek-national-treasure-china-now-closely-guarded\" target=\"_blank\" rel=\"noopener\">reportedly</a> are unable to leave China because the government confiscated their passports, regularly post on X about the latest AI news and share job listings to recruit new talent.</p><p>“X is the best community” for AI discussions right now, says Meng Fanqing, cofounder of the startup <a href=\"https://github.com/evolvent-ai/RSIBench-Data\" target=\"_blank\" rel=\"noopener\">Evolvent AI</a> and a former intern at Moonshot, where he worked on the Kimi K2.5 model. “There are both Chinese and overseas audiences, and the recommendation algorithm works pretty well for showing you content in the same circle that you are in,” he says. Compared with Chinese platforms, where it’s often hard to have serious technical discussions, Chinese researchers like Meng say they would rather spend their time on X.</p><p>Meng says he started actively posting on X in mid-2025. At the start of the year, DeepSeek’s R1 model went viral around the world, shining a bright spotlight on China’s AI industry. Many Chinese researchers seized the moment and joined X to start sharing their perspective. “Around that time, all the Chinese researchers are starting to think about branding on an international level,” Meng says.</p><p>Chinese AI researchers may also be helping fill a growing gap left by researchers at OpenAI and Anthropic, who have become more reluctant to share their thinking online as their employers have grown into behemoth companies, says Tiezhen Wang, an independent AI analyst and former researcher at Hugging Face. “I guess they feel that their model architecture and how they train the model is kind of a secret, so they're posting less,” Wang explains. As a result, Chinese researchers are getting more attention from audiences on X who are hungry to make sense of what’s happening in the fast-moving world of AI.</p><h2>Why Choose X?</h2><p>One reason X may have become popular among Chinese AI researchers is that there’s not really a comparable social platform in China for high-quality technical discussions about AI and other emerging technologies.</p><p>Some people say they used to post on Zhihu, a Quora-like platform that once branded itself as the premier destination for educated professionals to show and tell. But since 2020, Zhihu has increasingly pivoted to hosting fiction content, and expert contributors have gradually fallen off. For example, Deng Yu, a Chinese mathematician who was awarded a Fields Medal this year, publicly <a href=\"https://zhuanlan.zhihu.com/p/34682603\" target=\"_blank\" rel=\"noopener\">wrote on Zhihu</a> in 2018 that he decided to stop posting on the site due to the rise of low-quality content.</p><p>Xiaohongshu, or RedNote, is another social platform that has become increasingly popular among the young, urban, and educated classes in China. Some junior AI researchers have opened accounts on Xiaohongshu recently and use them to share details about their work, but the audience is less technical than what they might find on X.</p><p>When Moonshot published a new research paper in March, it caused quite a stir on both Chinese and Western social media, even attracting praise from <a href=\"https://x.com/elonmusk/status/2033528245464047805\" target=\"_blank\" rel=\"noopener\">Elon Musk</a>. But “almost everyone on Zhihu and Xiaohongshu were talking about the background and age of the authors—one of them is only 17—and who their parents are, things that I find very superficial and gossipy,” says a current researcher at Moonshot who requested anonymity because he was not authorized to speak to media. “It was the foreign readers who actually discussed technical details and praised its breakthroughs.” He says readers on Zhihu also tend to be more mean-spirited, and the platform is plagued by higher amounts of AI slop than X.</p><p>Moonshot did not immediately respond to a request for comment.</p><p>The Chinese newcomers have generally received a warm welcome from academics and researchers at Western AI companies who were already on X, many of whom have been eager for direct information about Chinese AI labs. “Before they all came to X, we already saw a lot of influential researchers translating Chinese [AI] blogs into English,” says Wang. He points to Su Jianlin, a well-respected AI researcher who <a href=\"https://kexue.fm/\" target=\"_blank\" rel=\"noopener\">keeps an active blog</a> in Chinese documenting his thoughts, as an example of the kind of voices that Western AI communities crave. Now, Su is working for Moonshot and has a public X account, too.</p><h2>Other Incentives</h2><p>Beyond the desire to participate in open discussions, Chinese AI companies are also finding that X is an effective place to market themselves and their products. “X is the platform with the highest traffic and exposure. To some extent, the AI industry works just like the finance industry now; each individual and company needs their own branding,” says Meng.</p><p>When AI researchers become minor social media celebrities, that helps boost the profile of their employers too. Wang says he personally advised Moonshot during a one-off consultation session for the company in 2025 to push more of its researchers to the front on social media. When a startup releases a new model or paper, “it’s more interesting to see what they as a person want to post, instead of the official announcement,” Wang says, “And this would definitely help them gather more feedback from the audience. And they can talk to other researchers and potentially trigger some collaboration.”</p><p>Moonshot has already proven that it has an ample supply of charismatic personalities. The company is often described in Chinese media as one of the AI labs with the most interesting internal cultures, where the CEO plastered his office with band posters and other souvenirs celebrating his love for rock music. The Chinese name of the company, 月之暗面, literally comes from Pink Floyd’s album <em>The Dark Side of the Moon</em>.</p><p>Having Chinese AI researchers explain their work in their own words on X is a net benefit for the United States, Wang says, because it reduces the need for blind speculation about what Chinese AI labs are doing. “People have a lot of wrong hallucinations about what China is doing. And now, X is the door for them to better understand China,” Wang says.</p><p><em>This is an edition of</em> <a href=\"https://www.wired.com/author/zeyi-yang/\" target=\"_blank\" rel=\"noopener\"><em><strong>Zeyi Yang</strong></em></a> <em>and</em> <em><strong><a href=\"https://www.wired.com/author/louise-matsakis/\" target=\"_blank\" rel=\"noopener\">Louise Matsakis</a>’</strong></em> <a href=\"https://www.wired.com/newsletter?sourceCode=editarticle\" target=\"_blank\" rel=\"noopener\"><em><strong>Made in China newsletter</strong></em></a>. <em>Read previous newsletters</em> <a href=\"https://www.wired.com/tag/made-in-china/\" target=\"_blank\" rel=\"noopener\"><em><strong>here.</strong></em></a></p>"},{"title":"“The Samurai and the Prisoner” Fits a War Epic Into an Elegant Puzzle Box","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/culture/the-current-cinema/the-samurai-and-the-prisoner-fits-a-war-epic-into-an-elegant-puzzle-box","category":"fun","categoryLabel":"Interesting Reads","wordCount":1352,"readingTime":7,"content":"<p>“The Samurai and the Prisoner,” the latest film by the Japanese director Kiyoshi Kurosawa, is a quadruple-decker historical mystery so fiendishly complicated that even its title constitutes something of a red herring. The picture begins in 1578, during Japan’s Sengoku (or “warring states”) period. One stronghold after another has fallen to the ruthless conqueror Nobunaga Oda—often celebrated as the first great unifier of Japan but here cast as a largely offscreen mega-villain. The wise and formidable warlord Murashige Araki (Masahiro Motoki), a former ally of Oda’s, has made the shocking, seemingly suicidal decision to turn against him. Now an Oda envoy and renowned strategist named Kanbei Kuroda (Masaki Suda) has come to Murashige’s fortress to convince him that resistance is futile. Refusing to surrender, Murashige has Kanbei thrown into a dungeon—a breach of the samurai code of honor, Kanbei protests, insisting on being either released or executed. With the castle surrounded by Oda’s forces, Murashige, too, can feel the walls closing in. For the rest of the movie, these two brilliant men will remain locked in together, samurai and prisoners both.</p><p>The film, which Kurosawa adapted from <a href=\"https://www.amazon.com/dp/1975360508\" target=\"_blank\" rel=\"noopener\">a 2021 novel by Honobu Yonezawa</a>, is both a methodically paced chronicle of a nearly yearlong siege and an elegantly constructed puzzle box, divided into four compartments, or acts. Each act unfolds over a season, and each season brings with it a devilish new conundrum. Corpses are not a rarity in civil war, but only a few of the bodies that turn up here have been cut down in the heat of battle; instead, in the manner of detective fiction, they are casualties of a sinister and calculating higher intelligence, which seems to be operating under the guises of multiple murderers. It’s winter when the story loses its first and most upsetting victim: the young son of a warlord who recently surrendered to Oda. Some call this divine punishment for his father’s treachery. The circumstances of the boy’s death—an arrow appears to have been shot through a narrow opening between latticed sliding doors—are indeed confounding enough to suggest supernatural intervention. (Yonezawa’s novel may be a Japanese feudal-era companion to Umberto Eco’s “<a href=\"https://www.amazon.com/Name-Rose-Umberto-Eco/dp/0544176561\" target=\"_blank\" rel=\"noopener\">The Name of the Rose</a>,” but the lethal logistics here also reminded me of “<a href=\"https://www.amazon.com/Judas-Window-Carter-Dickson/dp/0712355332/\" target=\"_blank\" rel=\"noopener\">The Judas Window</a>,” one of the greatest of John Dickson Carr’s celebrated locked-room whodunnits.)</p><p>Kurosawa’s film is awash in such grim mayhem, but the filmmaking itself feels serenely unbothered. The movie is, like any real investigation, a drawn-out and loquacious affair, with thickets of dialogue that—for all the historical and militaristic context that Kurosawa has deftly elided from Yonezawa’s novel—can be as dense as the plotting. With one notable exception, the murders are never depicted in progress; they’re revealed to us in the past tense, as seasonal problems waiting to be solved. In the spring, two rival clans, both fighting under Murashige’s command, try to claim credit for slaying and decapitating an enemy general—a riddle that becomes all the more perplexing when the trophy head is unexpectedly (magically?) disfigured. In the summer, the bodies of a prized warrior and a priest are found in close proximity—a double homicide that may also have been a robbery. The finale, set in autumn, concerns an accident of nature—a warrior is struck by lightning, in full view of Murashige and his other men—that turns out not to have been so accidental. At a certain point, the deadly seriousness of so many consecutive anti-miracles can’t help but turn faintly comical. How much divine punishment can one fortress take?</p><p>Murashige, though hardly a mental slouch, is stymied by these events, and with each new case he winds up turning to Kanbei’s superior tactical mind for help. The prisoner thus becomes the detective, albeit with shackles and a straw mat in lieu of an armchair, and Suda, the star of Kurosawa’s gripping recent thriller “<a href=\"https://www.newyorker.com/culture/the-current-cinema/cloud-is-a-cautionary-tale-of-e-commerce-and-the-summers-best-action-movie\" target=\"_blank\" rel=\"noopener\">Cloud</a>,” inflects his otherwise cool, clammy performance with wild flickers of genius and menace. Kanbei isn’t exactly Hannibal Lecter, and Murashige, whom Motoki lends immense stature, wisdom, and gravity, is no one’s idea of Clarice Starling. But Kurosawa, who came to international prominence in the late nineteen-nineties with the brilliantly unnerving serial-killer film “Cure,” nonetheless finds a sneaky “<a href=\"https://www.newyorker.com/magazine/1991/02/25/moth-and-flame\" target=\"_blank\" rel=\"noopener\">Silence of the Lambs</a>”-adjacent pleasure in his characters’ deductive rapport. Yonezawa’s novel gives him the chance to splice his procedural DNA into the unlikely host cell of the historical drama—the first historical drama, as it happens, that he has ever directed.</p><p>Did Kurosawa, who has made dozens of features in the past four decades, steer clear of Japan’s feudal era until now so as to avoid comparisons with <a href=\"https://www.newyorker.com/magazine/1981/12/21/kurosawa-frames\" target=\"_blank\" rel=\"noopener\">his more famous namesake</a>—the one who directed such samurai classics as “Throne of Blood,” “Yojimbo,” “The Hidden Fortress,” and, of course, “Seven Samurai”? It’s more likely, I think, that the younger Kurosawa was simply waiting for the ideal vehicle to come along, one that would allow him to slyly turn some of the conventions of the war picture inside out. Battlefield carnage is kept to a minimum, and the action unfolds, with almost perverse austerity, in private rooms, enclosed courtyards, and one dimly lit dungeon. Yonezawa’s novel allows Kurosawa to do what he has always done best: track down killers, investigate lovingly detailed crime scenes, and apply the mechanics of murder plots toward gravely existential ends.</p><p>In “Cure,” a hellish riff on <a href=\"https://www.newyorker.com/magazine/2010/08/16/queen-of-crime\" target=\"_blank\" rel=\"noopener\">Agatha Christie</a>’s “<a href=\"https://www.amazon.com/Curtain-Poirots-Hercule-Mystery-Mysteries/dp/0062074091\" target=\"_blank\" rel=\"noopener\">Curtain</a>,” Kurosawa concocted a gloomy tour de force of social alienation and spiritual dread, using a series of inexplicable killings to suggest a terrifying void in the fabric of modern life. “The Samurai and the Prisoner” may be set centuries earlier, but it’s a Kurosawa movie through and through. The talk is grave, the editing unhurried; the camera holds multiple characters in the frame and watches them from a sedate remove. The murders and their ensuing investigations have a genuine philosophical density, and Kurosawa uses them to interrogate the mores of the era: the implications of the samurai code, the horrors of war, the nature of individual will, the meaning of courage, and, perhaps most of all, the uses and abuses of religion.</p><p>Divine punishment can make for great spectacle, and spectacle, the film argues, can easily become an instrument of mass manipulation and mind control. One of its animating tensions is a clash between old traditions and beliefs and recent encroachments, including Christianity. (The first Jesuit missionary in Japan arrived in 1549.) This conflict erupts into the open when a local Christian church suddenly goes up in flames. The implications of this struggle seem to weigh with particular heaviness on Murashige’s wife, Chiyoho (Yuriko Yoshitaka), a devout Buddhist, who, in one mesmerizing sequence, deconstructs an oft-repeated aphorism: “Advance to Paradise, retreat to Hell.” What this means is open to interpretation, but it is wielded here primarily as a slogan of battlefield aggression—a rallying cry for soldiers who have been trained to abandon their fears, push bravely onward, and embrace a glorious death.</p><p>Murashige, who has killed many men in battle, no longer has much use for that glory. Among warlords, he has become an unfashionable pacifist, and his refusal to bend the knee to Oda, or to execute enemies in accordance with the samurai code of honor, springs from a profound moral conviction—a belief in a future liberated from the excesses of martial violence. In one gorgeously observed sequence, the film pauses in its torrents of verbiage, while Murashige serves tea to one of his men. The silent respite might seem inconsequential, but, in its focussed display of tenderness and beauty, it feels more like a dramatic culmination, a declaration of principles, a glimpse of a world that’s genuinely worth fighting for. Throughout, “The Samurai and the Prisoner” is fascinated by the significance of the seemingly insignificant. It’s limited to a tense interlude, a blip in the history of a large-scale conflict. But a blip can contain multitudes, and this one allows Murashige to question every aspect of the social order that has shaped him. The answers, he suspects, may well hold the key to his nation’s future. ♦</p>"},{"title":"Justices Kagan and Barrett on the SCOTUS Leaks","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/07/27/justices-kagan-and-barrett-on-the-scotus-leaks/","category":"law","categoryLabel":"Law","wordCount":740,"readingTime":4,"content":"<p>Over the past decade or so, I have written quite a bit about Supreme Court leaks. For a time, Joan Biskupic had the inside scoop. Indeed, Biskupic relayed in her books that she had private conversations with the Justices. I've heard that Chief Justice Roberts, in particular, felt burned that Biskupic published information that was supposed to be off-the-record. So it goes. But after Justice Ginsburg's death, Biskupic's information largely dried up. Of course, Josh Gerstein at Politico got the <em>Dobbs </em>leak, but that was a one-off. Gerstein has not published any more inside information. More recently, Jodi Kantor of the New York Times has published a regular stream of information from the Court.</p>\n<p>No matter how you slice it, the problem of leaks continues.</p>\n<p>Justices Kagan and Barrett addressed the issue of leaks at some length during their congressional testimony (which I am just now wrapping up).</p>\n<p>Kagan told the <a href=\"https://www.c-span.org/program/house-committee/justices-kagan-and-barrett-testify-on-2027-budget-request-security-and-operations/682868\" target=\"_blank\" rel=\"noopener\">House Committee</a>:</p>\n<blockquote><p>We can't engage do our business, we can't engage in confidential communication, which is the best way to operate is to be fully open with one's colleagues about one's views and if you think that those views are going to appear on the front page of the newspaper, you pull back, you don't have the kinds of conversations that I think the court really depends on to do great work. so this is something that has frustrated all of us and we are continuing to make efforts to resolve.</p></blockquote>\n<p>Kagan offered similar remarks to the <a href=\"https://www.c-span.org/program/senate-committee/justices-kagan-and-barrett-testify-before-senate-subcommittee-on-supreme-courts-2027-budget-request/682463\" target=\"_blank\" rel=\"noopener\">Senate Committee</a>:</p>\n<blockquote><p>The leaks \"dramatically change the way we do business internally or at least has the potential to do so. The way we relate to each other depends so much on honest communication among the nine of us. And if the nine of us do not have trust in one another and don't have trust in one another and all the people who work for us, then those kinds of honest conversations that we need to do our business are not going to take place. They are at least going to be frustrated, so I think it is a problem that has frustrated every single one of the justices because of the security issues, but because it is just not the way a court should operate and not the way a court can operate if it wants to have the kind of deliberations that are the backbone of what we do.\"</p></blockquote>\n<p>Justice Barrett volunteered some information about the Court's new NDAs.</p>\n<blockquote><p>We are doing our best. we have instituted protocols to keep better track of who has access to document, who has touched documents when printed. We have always required employees to sign a confidentially agreement but recently we begin requiring employees to sign a nondisclosure agreement, which we do have carveouts for whistleblowers and that sort of thing, and those carveouts go beyond what federal statutes require. but we are hoping that driving the need for confidentiality home with these NDAs will just be an additional check on employees who are sharing information inappropriately and often illegally.</p></blockquote>\n<p>The Supreme Court has never publicly acknowledged that clerks are required to sign NDAs. We learned of this news from, drumroll please, a <a href=\"https://www.nytimes.com/2026/02/02/us/supreme-court-nondisclosure-agreements.html\" target=\"_blank\" rel=\"noopener\">leak to the New York Times</a>. Indeed, the Court offered no comment to the Times:</p>\n<blockquote>\n<p>A spokeswoman for the court declined to comment about the nondisclosure agreements. She also did not respond to a question about whether the justices have been asked to sign the contracts.</p>\n<p>The people who described the agreements spoke on the condition of anonymity because they were not authorized to speak publicly about court matters.</p>\n</blockquote>\n<p>Judge Barrett has now confirmed the leak, perhaps without even realizing it. I wonder if anyone at the Court caught this.</p>\n<p>Over the years, I speculated that Justice Kagan was at least adjacent to some Supreme Court leaks. I take Kagan's congressional testimony to be truthful, so I'll admit I was wrong. And I'll take Kagan as speaking truthfully that none of her other eight colleagues would leak information. If that's the case, then how can the leaks be explained? Are there simply rogue law clerks who are acting ultra vires, without the knowledge of their boss? Or maybe there is something short of tacit approval?</p>\n<p>In any event, I appreciate that Kagan and Barrett have now locked in about leaks. Any clerk from their chambers would now be deluded to think their boss quietly supports a leak.</p>"},{"title":"Reported lead of Obsidian's new Fallout game wants you to feel a \"sense of agony\" when playing an RPG, rather than being an all-powerful god-splatterer","source":"Rock Paper Shotgun","author":"Mark Warren","url":"https://www.rockpapershotgun.com/reported-lead-of-obsidians-new-fallout-game-wants-you-to-feel-a-sense-of-agony-when-playing-an-rpg-rather-than-being-an-all-powerful-god-splatterer","category":"gaming","categoryLabel":"Gaming","wordCount":1028,"readingTime":6,"content":"<p>\"Mass starvation is not a thing that you punch your way out of\"</p>\n    \n  \n  \n  \n  \n            <p>Look at the nice fellow in the featured image of this article. Look into his eyes. Look at the slightly awkward grin plastered across his face at the moment in a YouTube video on his channel that I've chosen to pause and take a screenshot. This is a man who wants you to feel \"a sense of agony\". To be frustrated and perplexed as to which outcome to choose. This is a man who knows you can't feed the world with a set of laser eyeballs. This is <a href=\"https://www.rockpapershotgun.com/games/fallout-new-vegas\" target=\"_blank\" rel=\"noopener\">Fallout: New Vegas</a> director Josh Sawyer, who recently made some points about RPG building that are worth dissecting in light of his <a href=\"https://www.rockpapershotgun.com/new-vegas-devs-obsidian-are-reportedly-working-on-a-new-fallout-game-and-only-microsoft-could-make-news-ive-waited-half-my-life-for-taste-this-bitter\" target=\"_blank\" rel=\"noopener\">reported new gig</a> as head of Obsidian's upcoming Fallout game.</p>\n<p>\"Players are very conditioned by a lot of RPGs to expect like, 'Yeah, but [my character's] built different',\" Sawyer said during an interview with <a href=\"https://www.youtube.com/watch?v=LsEQ10eAheM\" target=\"_blank\" rel=\"noopener\">The Examined Game</a>. \"Like, 'I'm going to be able to take this guy out. Then, you can't. You can help sort of ameliorate damage and you can make a bunch of very important decisions that have truly huge impacts, but you can't stop him.\"</p>\n<p>The him Sawyer's talking about there is Eothas, the big god bloke from <a href=\"https://www.rockpapershotgun.com/games/pillars-of-eternity\" target=\"_blank\" rel=\"noopener\">Pillars of Eternity</a> 2: Deadfire who you can't squash under your boot. Sawyer's using Eothas as an example of a circumstance in an RPG the player can't overcome or otherwise wipe off the board to get whatever outcome they want, as might be the case in a power fantasy. Hence the \"sense of agony\", as you're presented with options or actions which feel imperfect, but still have enough pull to make it feel like you aren't just wasting your time choosing between them.</p>\n<p>It's one of the many things pointed to as a difference between how Obsidian and Sawyer handled building New Vegas and how Bethesda depict post-apocalyptic America in their mainline entries. The latter, under Todd Howard, have been open about their philosophy tending to embrace facilitating the player doing what they wish as a way to make the experience feel unique. \"What we like to do as much is possible is say 'Yes' to the player,\" his Toddliness <a href=\"https://www.youtube.com/watch?v=M1l54t9VcTM\" target=\"_blank\" rel=\"noopener\">told BAFTA</a> in 2024. \"'I wonder if I can do this?' 'Yes.' 'I wonder if I can do this...' And that when you have this curiosity for what's over that hill that the game rewards it. You know, the best part of what I get to do is when you see somebody else play the game and the way it affects them, the way they feel about it and the paths that they took. That they've kind of taken what we've made and they've made it their own.\"</p><p>So, now both Obsidian and Bethesda have new Fallout entries in their sights, these differing approaches will likely be something that'll set the two games apart, as was the case previously. People will take sides. You're a power fantasy Paul or an agonising box Alan, and there's little room for nuance between the two. On the one hand, the two studios' associations with these different approaches are well-earned. <a href=\"https://www.rockpapershotgun.com/games/fallout-3\" target=\"_blank\" rel=\"noopener\">Fallout 3</a>'s main quest is a straightforward good vs evil affair between the Brotherhood and Enclave, with the fact you get to look cool wearing whichever side's power armour a key draw. <a href=\"https://www.rockpapershotgun.com/games/fallout-4\" target=\"_blank\" rel=\"noopener\">Fallout 4</a>'s closer to New Vegas in terms of number of factions, but still, being a power-armoured saviour or conqueror of the wasteland via big boom is front and centre. The world feels like it bows to the player by the end, as when you're wandering <a href=\"https://www.rockpapershotgun.com/games/the-elder-scrolls-v-skyrim\" target=\"_blank\" rel=\"noopener\">Skyrim</a> being congratulated for preventing the apoclaypse or winning a civil war for whichever side you choose.</p>\n<p>Though, it would be reductive to paint Bethesda as being totally unable to present a story in which the player only has limited influence over the world around them. Oblivion, much as its tale very much ushers the Hero of Kvatch towards being a good boy and ending the Daedric invasion, positions them as but one powerful figure helping the person actually able to save the day to accomplish that task. Once that's done, the player is left to retire into madness, unable to do anything to heal the gaping wound Dagon's invasion has left in the Empire, planting the seeds for a great war that's <a href=\"https://en.uesp.net/wiki/Oblivion:Radiant_Conversations\" target=\"_blank\" rel=\"noopener\">already brewing</a> ahead of the credits rolling. The god might be defeated, but it's still an ending dripping with agonising imperfection and deeply foreboding vibes.</p>\n<p>The fly in my argument soup is that the player isn't presented with any alternative choices which might have a chance of cooling tensions between the Empire and Aldmeri Dominion or ending the crisis with the Empire in a stronger position, which would make Oblivion mesh more closely with what Sawyer outlines. I suppose there's also a question to be asked as to whether the \"sense of agony\" over the things the player has limited to no influence over is as acute if the full consequences of them aren't revealed within the confines of that individual game.</p>\n<p>It's easy to get into the frame of mind that one of these approaches is the right one and the other's wrong, that RPGs letting you 360 no-scope divine entities or become the perfect doer of all things is the end of the world. But, in my attempts to draw any kind of silver lining from both Obsidian and Bethesda being corporately ordered to <a href=\"https://www.rockpapershotgun.com/fallout-5-is-in-preproduction-alongside-the-elder-scrolls-6s-development-while-fallout-3-and-fallout-new-vegas-remasters-are-on-the-way-bethesda-confirm\" target=\"_blank\" rel=\"noopener\">Fallout like they've never Fallouted before</a> in the <a href=\"https://www.rockpapershotgun.com/xbox-are-parting-ways-with-double-fine-arkane-undead-labs-compulsion-and-ninja-theory-in-the-course-of-thousands-of-layoffs\" target=\"_blank\" rel=\"noopener\">wake of mass layoffs</a>, one of the few positives I can point to is being intrigued to see the two studios' RPG philosophies face off in the same series once more. Would I love New Vegas as much if it wasn't such a clear departure from brother from another mother Fallout 3 in terms of narrative and worldbuilding? Would I yearn for that \"sense of agony\" as much if I hadn't spent plenty of time feeling painlessly invincible? I don't know, man with a slightly awkward grin. But I think I'd like a bit of both in my Fallout.</p>"}];

}

function nextArticle() {

  render();
}
