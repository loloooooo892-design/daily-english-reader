*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.meta .sep {

}

}

  line-height: 1.5;

  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-radius: 4px;

}

<script>
var articles = [{"title":"MMO heads rejoice, Razer is bringing out the Naga V3 Pro with upgraded switches, loads of customizability and a ridiculous DPI","source":"PC Gamer","author":"James Bentley","url":"https://www.pcgamer.com/hardware/gaming-mice/mmo-heads-rejoice-razer-is-bringing-out-the-naga-v3-pro-with-upgraded-switches-loads-of-customizability-and-a-ridiculous-dpi/","category":"gaming","categoryLabel":"Gaming","wordCount":620,"readingTime":4,"content":"<p>MMO gaming mice look a bit funky. You probably knew that already. With sometimes dozens of buttons for all the different controls, they're niche by nature. Yet the newly unveiled Razer Naga V3 Pro looks to get around that, claiming to be both easy to use and button-heavy at the same time.</p><p>In a sense, it seems like a pretty safe upgrade from the <a href=\"https://www.pcgamer.com/our-favourite-mmo-mouse-just-got-better/\" target=\"_blank\" rel=\"noopener\">Naga V2 Pro</a> from back in 2022. Like that model, it ships with three swappable plates by your thumb. The standard layout has a dozen buttons, but you can replace them with a mere six (or just two) for ease of use. With two further buttons besides the left click, and two more under the scroll wheel, the Naga V3 Pro can have 23, 17 or 13 buttons total.</p><p>Razer says these plates snap into place in seconds without any tools. The idea being you can flip between them when you load up different games. It envisions players using the dozen buttons for MMOs, six buttons for MOBA and battle royales, then the two buttons for FPS games or everyday use.</p><p>Head of PC gaming at Razer, Barrie Ooi, says, “The Naga has led multi-button gaming for 17 years, and the V3 Pro is our answer to a community that wanted one mouse to adapt to every genre they play.”</p><p>Where it does differ from the Naga V2 Pro is the inclusion of Razer's Focus Pro 3rd generation optical sensor with 50,000 DPI, plus fourth generation optical switches. It's also a bit lighter, at 97 g without a plate installed, or around 112–117 grams with. At its lightest, the Naga V3 Pro is a whopping 112 g, which makes it a bit of a thicc boi.</p><p>If you are interested in the upgrade, you can <a href=\"https://razer.a9yw.net/c/221109/642901/10229?subId1=pcg-us-1149686119318718692&amp;sharedId=pcg-us&amp;u=https%3A%2F%2Frazer.com%2Fnaga-v3-pro\" target=\"_blank\" rel=\"noopener\">pick it up from Razer</a> right now for $180 / £180 / €200. That is a hefty 'ol fee that matches the MSRP of the Naga V2 Pro.</p><p>And if you're thinking of spending that amount of money on a gaming mouse, you should also consider the <a href=\"https://www.pcgamer.com/hardware/gaming-mice/razer-viper-v4-pro-review/\" target=\"_blank\" rel=\"noopener\">Razer Viper V4 Pro</a>, with its top-notch specs and low weight, or the <a href=\"https://www.pcgamer.com/hardware/gaming-mice/logitech-g-pro-x2-superstrike-review/\" target=\"_blank\" rel=\"noopener\">Logitech G Pro X2 Superstrike</a>, with its incredible click technology. Both of these are among the <a href=\"https://www.pcgamer.com/the-best-gaming-mouse/\" target=\"_blank\" rel=\"noopener\">best gaming mice</a> you can buy today. The Superstrike will fetch the same price as the Naga V3 Pro, but the Viper V4 Pro is cheaper. Either way, the competition is super fierce at this price point.</p><p>Keep up to date with the most important stories and the best deals, as picked by the PC Gamer team.</p><p>And that's before mentioning that the Naga V3 Pro only comes with a 1,000 Hz polling rate (though it can get up to 8,000 Hz with the Mouse Dock Pro or HyperPolling Wireless Dongle). Still, the Naga V3 Pro is unique with the sheer volume of buttons available, and it's a sweet upgrade on the Naga V2 Pro for the same base price. Whether or not it's actually worth all that cash will be largely dependent on how it feels in the hand or your actual need for all those buttons.</p><p>Luckily, one is on its way to the PC Gamer offices—so you can expect our full review soon.</p>\n\n<p>James is a more recent PC gaming convert, often admiring graphics cards, cases, and motherboards from afar. It was not until 2019, after just finishing a degree in law and media, that they decided to throw out the last few years of education, build their PC, and start writing about gaming instead. In that time, he has covered the latest doodads, contraptions, and gismos, and loved every second of it. Hey, it’s better than writing case briefs.</p>"},{"title":"The Rise of the 1 am Job Interview","source":"Wired","author":"@wired","url":"https://www.wired.com/story/the-rise-of-the-1-am-job-interview/","category":"tech","categoryLabel":"Technology","wordCount":858,"readingTime":5,"content":"<p>When Tim Millard received an email about interviewing for a media relations job in January, six months into his job hunt, he assumed he’d speak to a human. When he was instead instructed to record himself answering a series of questions on camera, he felt a familiar pang of resignation—one that had followed him throughout the <a href=\"https://www.wired.com/story/job-hunting-sucks-programmer-filled-out-250-applications/\" target=\"_blank\" rel=\"noopener\">job hunt</a>.</p><p>“I figured, I have to do this if I want to be considered for the job,” Millard tells WIRED. So, that evening, the Atlanta-based communications and marketing expert tidied his living room and set up his laptop. The email had left the timing for the interview open-ended, and he figured he might as well get it done as soon as possible. “What else was I going to do at 9:30 at night?”</p><p>The questions were pretty standard for the role. How would Millard pitch a story to the media? How would he cultivate relationships with local journalists? But the setup was bizarre. He sat in front of his laptop, watching as a question popped up on the screen. He had roughly half a minute to think about his response.</p><p>“Once the 30 seconds was up, ‘ding!’ Now you have two minutes to record your answer,” Millard said. “It felt so out of this world.”</p><p>Millard received an automated rejection email in March. But the experience unknowingly wedged him into a trend currently reshaping the <a href=\"https://www.wired.com/tag/future-of-work/\" target=\"_blank\" rel=\"noopener\">modern job search</a>. As automated video interviews and <a href=\"https://www.wired.com/tag/artificial-intelligence\" target=\"_blank\" rel=\"noopener\">AI</a> become a <a href=\"https://www.greenhouse.com/blog/2026-candidate-ai-interview-report\" target=\"_blank\" rel=\"noopener\">bigger part of the recruitment process</a>, so do late-night interviews.</p><p>Arsham Ghahramani said that he noticed the late-night interview trend almost immediately after he cofounded and launched Ribbon, a company that makes voice-AI recruitment software. Twenty-four percent of Ribbon’s AI interviews take place between 10 pm and 2 am local time, according to data from the more than 500 companies that use the service. For his manufacturing clients, that figure jumps to 35 percent.</p><p>“This is a genuinely new option for people,” Ghahramani says. Many parents can’t sacrifice 30 minutes until the clock strikes 10 pm. Same for employees paid hourly, or those who are tied up working their current jobs on a noisy factory floor or kitchen. “Some people are very constrained in their options of when they can interview and how they can interview.”</p><p>Ribbon isn’t the only platform charting the rise in late-night interviews. Hiring platform Greenhouse says that roughly 15 to 20 percent of candidates interviewed by its voice agent now schedule an interview at night.</p><p>Ophir Samson, who became head of Greenhouse’s voice AI division when the company acquired his startup <a href=\"https://www.greenhouse.com/newsroom/greenhouse-completes-acquisition-of-ezra-ai-labs-bringing-conversational-ai-to-the-hiring-process\" target=\"_blank\" rel=\"noopener\">in May,</a> tells WIRED that he doesn’t think artificial intelligence should replace human interviews. Which is good, because applicants are currently extremely skeptical of AI interviews.</p><p>While a Greenhouse survey in May found that <a href=\"https://www.greenhouse.com/blog/2026-candidate-ai-interview-report\" target=\"_blank\" rel=\"noopener\">nearly two-thirds of job applicants</a> have been interviewed by an AI agent, up 13 points over six months, most people aren’t particularly excited about this development. Thirty-eight percent of American candidates told Greenhouse that they had withdrawn from a hiring process rather than be interviewed by an AI. Another 12 percent said they’d drop out if an AI interview was required.</p><p>One of the major stressors for applicants is the lack of transparency on how the footage will be used. Can AI reject them outright because they fail to say a certain buzzword?</p><p>While different employers and services vary, the typical AI or automated video interview is evaluated using a rubric that varies from job to job. A welder might be asked about certain technical skills or certifications in a Ribbon interview, Ghahramani says, while a sales role might include an “enthusiasm” score. AI analyzes footage of the interview to evaluate how well the candidate fits the rubric, and assigns them a score. The score is passed along to the recruiter, along with footage of the interview—though, realistically, many of the interviews go unwatched by humans.</p><p>Samson describes Greenhouse’s approach to the AI interview as a sort of résumé add-on, a tool that can identify high-scoring candidates who would have otherwise been lost in the deluge of applications. He doesn’t see the AI interview as a choice between human and robot, but a choice between being ghosted and improving the chance of actually speaking to a human interviewer in the next round.</p><p>“It’s a shitty time to be a candidate,” Samson says. “Your résumé goes into a black hole. You’re competing with thousands of candidates that are all using AI to write their résumés. So, good candidates can’t stand out.”</p><p>That assessment seems to be in line with Millard’s experience. A year after losing his job, he’s still searching. The process has been so emotionally devastating that it inspired Millard to write a one-man show, <em>After Careful Consideration</em>, which debuted at the Atlanta Fringe Festival in May.</p><p>When Millard signed on for his late-night interview in January, he wasn’t marveling at the convenience. He just wanted to get “this godawful thing done.”</p><p>“In today's job market,” Millard says, “it feels like if you are going to scream, you're going to scream into the void. And nobody is going to hear you.”</p>"},{"title":"What Does the Humbling of Leopold Aschenbrenner Mean for the A.I. Bubble?","source":"The New Yorker","author":"@NewYorker","url":"https://www.newyorker.com/news/the-financial-page/what-does-the-humbling-of-leopold-aschenbrenner-mean-for-the-ai-bubble","category":"fun","categoryLabel":"Interesting Reads","wordCount":1474,"readingTime":8,"content":"<p>In the classic book “<a href=\"https://www.amazon.com/dp/0471467146\" target=\"_blank\" rel=\"noopener\">Manias, Panics, and Crashes: A History of Financial Crises</a>,” the economic historian Charles Kindleberger divided episodes of speculation into five stages. Citing the work of <a href=\"https://www.newyorker.com/magazine/2008/02/04/the-minsky-moment\" target=\"_blank\" rel=\"noopener\">Hyman Minsky</a>, the post-Keynesian theorist, Kindleberger writes that the process begins with a displacement, such as the emergence of an important new technology, or a major policy shift, that gets investors excited about the future. They start to bid up asset prices, and capital floods into the affected sector. As optimism spreads, an investment boom—the next stage—develops, much of it facilitated by credit expansion, and the repercussions are felt in the broader economy. A period that he calls “euphoria” ensues. Investors who missed out on the initial gains rush to catch up, prices rise exponentially, and skeptics get dismissed as dinosaurs. At some point, though, the divergence between valuations and economic fundamentals becomes increasingly hard to ignore. Some investors get nervous, and prices start to top out. Overextended individuals or institutions get into trouble. Kindleberger referred to this as the stage of distress. Finally, comes the revulsion, or the bust. Panicked investors try to exit the market. Prices collapse.</p><p>Judging by recent events, the A.I. bubble may be approaching the point when euphoria gives way to distress. On the one hand, there is still a great deal of optimism and <em>FOMO</em>. Last week, the Dow and the S. &amp; P. 500 both hit new highs. Purchases of call options, which enable investors to bet on the market going even higher, reached record levels. According to a <a href=\"https://www.bloomberg.com/news/articles/2026-08-05/some-64-of-young-men-who-trade-stocks-daily-feel-like-failures\" target=\"_blank\" rel=\"noopener\">recent survey</a>, about one in five men aged eighteen to twenty-nine are trading stocks on a daily basis. But some cracks have also started to appear, including a dive in semiconductor stocks that led to a crash in the South Korean market. And now we have before us the spectacle of Leopold Aschenbrenner, a twenty-four-year-old hedge-fund manager who, not so long ago, was hailed as the Nostradamus of A.I.</p><p>After graduating from Columbia at nineteen as the class valedictorian, Aschenbrenner worked for FTX, the defunct crypto exchange founded by <a href=\"https://www.newyorker.com/tag/sam-bankman-fried\" target=\"_blank\" rel=\"noopener\">Sam Bankman-Fried</a>, and at OpenAI, which dismissed him for allegedly leaking sensitive information. In June, 2024, he published a long essay titled “<a href=\"https://situational-awareness.ai/\" target=\"_blank\" rel=\"noopener\">Situational Awareness: The Decade Ahead</a>,” which argued that A.I. models would achieve human-level intelligence by 2027 and superintelligence by 2030. Exploiting a positive reception in Silicon Valley, Aschenbrenner launched a hedge fund, also called Situational Awareness, which loaded up on stocks of companies that stood to benefit from A.I., such as chipmakers and cloud-computing outfits. For a time, the fund proved incredibly successful. By this June, according to the <em>Wall Street Journal</em>, its value had risen more than a thousand per cent since its inception.</p><p>Last month, Aschenbrenner got caught out. As semiconductor stocks fell, some of his biggest holdings plunged in value, leaving him exposed. Wall Street banks that had lent Situational Awareness gobs of money to magnify its bets issued the fund margin calls—non-negotiable demands to stump up more cash. After trying fruitlessly to raise some money, Situational Awareness was forced to sell the bulk of its stock at a discount to Citadel, a more established hedge fund founded by the billionaire <a href=\"https://www.newyorker.com/magazine/2026/06/22/ken-griffins-billions-and-billions\" target=\"_blank\" rel=\"noopener\">Ken Griffin</a>. To add insult to injury, these events occurred days before Aschenbrenner was set to get <a href=\"https://www.wsj.com/finance/leopold-aschenbrenner-situational-awareness-ai-fund-597633d3\" target=\"_blank\" rel=\"noopener\">married</a>. The event went ahead, but Aschenbrenner and his wife, Avital Balwit, a high-ranking staffer at Anthropic, reportedly cancelled their honeymoon.</p><p>Unlike Long-Term Capital Management, Amaranth, and other big funds that collapsed after suffering big losses, Situational Awareness managed to survive that financial crisis, and Aschenbrenner vowed to “fight another day.” Apparently, his fund retains some very valuable investments in private A.I. companies that haven’t yet issued public stock, including <a href=\"https://www.newyorker.com/magazine/2026/02/16/what-is-claude-anthropic-doesnt-know-either\" target=\"_blank\" rel=\"noopener\">Anthropic</a>. But the market tremors that preceded Aschenbrenner’s humbling highlighted some larger questions about the tech-driven stock boom, one of which is the spectre of heightened competition in the A.I. sector.</p><p>The A.I.-to-the-sky narrative was built on the supposition that OpenAI, Anthropic, and other U.S. tech companies would dominate the industry, and their customers would happily pay high prices for access to proprietary, state-of-the-art models. Early last year, the Chinese A.I. company <a href=\"https://www.newyorker.com/news/the-financial-page/is-deepseek-chinas-sputnik-moment\" target=\"_blank\" rel=\"noopener\">DeepSeek</a> challenged this narrative by releasing a cheap open-source model with impressive capabilities. That was only the beginning. In the past few weeks, two more Chinese firms, Alibaba and Moonshot, have put out models that, based on some metrics, can match the latest and most powerful offerings from Anthropic and OpenAI. DeepSeek also launched a new model, V4 Flash, which, <a href=\"https://www.bloomberg.com/news/articles/2026-08-04/china-s-ai-blitz-creates-death-zone-for-rival-us-model-makers\" target=\"_blank\" rel=\"noopener\">according to</a> Bloomberg, can execute certain tasks for a cost of three cents, compared with $3.15 when using Anthropic’s Claude Fable 5 model. “When China asks for cents where American companies charge dollars, the contest between the two nations for A.I. customers . . . starts to look materially different,” Bloomberg reported.</p><p>Other potential sources of vulnerability include the vast sums of money that A.I. companies are spending on infrastructure, such as chips and data centers. A new <a href=\"https://finance.biggo.com/news/ad8c1626-1689-4379-9592-d03be83885fd\" target=\"_blank\" rel=\"noopener\">study</a> from Goldman Sachs predicts that global investment in A.I. will total more than a trillion dollars this year, with outlays in the U.S. making up nearly sixty per cent of the total. From one perspective, the financial system’s ability to fund this scale of spending is impressive, but so is the amount of debt and other liabilities that A.I. companies are taking on, both directly and indirectly, to finance their investments.</p><p>The dot-com bubble of the late nineteen-nineties and the real-estate bubble of the early two-thousands both saw the proliferation of financial-engineering techniques such as circular financing and offloading debts from corporate balance sheets to special-purpose vehicles. Both have been resurrected in the A.I. boom. The chipmaker Nvidia is famous for investing in companies that buy its chips, and there are many other interconnections. Microsoft owns twenty-seven per cent of OpenAI, which, according to Bloomberg, “accounted for more than half, and likely about 70%, of Microsoft’s actual AI sales during its most recent fiscal year.” Should anything bad happen to OpenAI, Microsoft would feel the pain. As the sums expended on A.I. investments get larger, the financing that underpins them is getting more complicated and opaque. According to a recent <a href=\"https://www.reddit.com/r/EconomyCharts/comments/1v2h8qg/a_nikkei_investigation_found_that_alphabet/#lightbox\" target=\"_blank\" rel=\"noopener\">report</a>, Alphabet, Amazon, Meta, Microsoft, and Oracle have a combined total of $1.65 trillion in debt and other obligations that don’t appear on their balance sheets.</p><p>To justify all these investments and financing schemes, A.I. will have to create a great deal of economic value. A couple of weeks ago, investors were reassured after Alphabet, Amazon, and Microsoft <a href=\"https://www.wsj.com/tech/ai/wall-street-thinks-it-knows-how-tech-giants-will-make-ai-pay-96f76438\" target=\"_blank\" rel=\"noopener\">reported</a> that their respective cloud divisions enjoyed strong revenue growth in the latest quarter. But if A.I. is really going to pay off, its financial benefits will have to show up on the books of its end users—not just A.I. labs, hyper-scalers, and equipment suppliers. A year ago, I incurred the wrath of some people in Silicon Valley by <a href=\"https://www.newyorker.com/news/the-financial-page/the-ai-profits-drought-and-the-lessons-of-history\" target=\"_blank\" rel=\"noopener\">discussing</a> a survey from M.I.T. which found that ninety-five per cent of companies using A.I. tools hadn’t seen any increase in their profits. Perhaps management failures and the novelty of the A.I. models were holding some companies back from finding profitable ways to adopt them, I suggested. But a year later the picture doesn’t seem to have changed dramatically. More recent surveys, including <a href=\"https://www.gartner.com/en/articles/ai-value-crisis\" target=\"_blank\" rel=\"noopener\">one</a> from the research firm Gartner, still show a surprising dearth of profits from A.I. investments.</p><p>What does all this add up to for the stock market? For the moment, A.I. optimism, <em>FOMO</em>, and trend-following are still in ascendancy. It’s hard to say what might change this, but one candidate is a tightening of monetary policy. The market crashes of 1987, 2000, and 2007 were all preceded by periods in which the Federal Reserve raised rates. Until Friday’s disappointing jobs report, which showed employers shedding twenty-three thousand jobs in July, many Wall Street analysts were expecting a rate hike next month because inflation is running above the Fed’s target. Now all bets are off.</p><p>Stocks rose again after the jobs report came out, which isn’t surprising. The U.S. market appears to have shrugged off the crash in South Korea and the troubles of Aschenbrenner, an attitude that is encouraging investors to double down on momentum trades that can generate further price appreciation. This type of self-reinforcing dynamic is a recurring feature of speculative booms, and it helps explain why they can last for longer than common sense, and the theory of mean reversion, might predict. And yet each leg up in the market heightens the risk of more Situational Awareness-like squeezes, and of individualized distress giving way to a broader bust. Kindleberger, who died in 2003, would have been an interested onlooker. Surveying the long history of boom and bust cycles, he wrote, “Investors seem not to have learned from experience.” ♦</p>"},{"title":"How Many More Jason Ardays Are There?","source":"The Volokh Conspiracy","author":"JoshMBlackman","url":"https://reason.com/volokh/2026/08/11/how-many-more-jason-ardays-are-there/","category":"law","categoryLabel":"Law","wordCount":1332,"readingTime":7,"content":"<p>I am intrigued by the story of Jason Arday, who recently resigned his professorship at Cambridge. Most of the press accounts focus on his serious fabulism. He boasted about feats of physical strength—like running six hundred miles in six days—that are nearly-physically impossible. Worse, these are stories that can easily be refuted. Apparently, no one in the ultra-marathon circles knew who he was. It is almost comical that a major publisher gave him a seven-figure book advance.</p>\n<p>The lies Arday told about his personal story are problematic, but the far more pressing issue is his academic record. For years, he faced significant charges of plagiarism and dishonesty in his dissertation and his thin scholarship record. Those who raised these charges were predictably dismissed as racists. Cambridge performed an investigation that now appears to have been a sham. Only now, when the entire story has fallen apart, people are comfortable speaking the truth.</p>\n<p>Arday resigned, but he is not alone. He can't be. If he was able to get away with flagrant violations of academic integrity for years, others have as well. And to the extent that fears of being called racist shielded Arday from rigorous scrutiny, other academics are in a similar position. Indeed, how many Ardays have been hired and promoted, in the face of doubts, as part of DEI initiatives? Arday was hired in 2023 at peak-wokeness.</p>\n<p>The UK Telegraph has a deep dive <a href=\"https://www.yahoo.com/news/us/articles/cambridge-diversity-scramble-led-arday-200714592.html?guccounter=1\" target=\"_blank\" rel=\"noopener\">titled</a>, \"The Cambridge diversity scramble that led to Arday fiasco.\" Read the entire thing, but here is an excerpt:</p>\n<blockquote><p>Put simply, did Cambridge University lower its own standards to hire a man of questionable merit simply because of his skin colour? And having done so, did one of the cornerstones of Britain's world-renowned education system prioritise its diversity, equity and inclusion (DEI) credentials over its hard-earned reputation? . . .</p>\n<p>The Telegraph has spoken to someone with first-hand knowledge of the interview process that Mr Arday passed through, who believes the university only \"went through the motions\" with other candidates because he was already the preferred choice.</p>\n<p>We have also spoken to students who complained about inadequate supervision by Mr Arday, <a href=\"https://www.telegraph.co.uk/news/2026/08/06/jason-arday-cambridge-university-plagiarism-row-polanski/\" target=\"_blank\" rel=\"noopener\">only to be told they were being racist</a>.</p>\n<p>John Preston, emeritus professor of sociology at the University of Essex, said: \"The appointment of Prof Arday certainly raised eyebrows at the time with people who work in this area because his publication record appeared rather thin. It raises questions about whether he was appointed for other parts of his CV.</p>\n<p>\"There were a lot more qualified people who would have been more suitable… they probably wanted to address their own failures in DEI in the past.\"</p>\n<p>When the job of professor of sociology of education was advertised, Cambridge told candidates that: \"The following groups are currently under-represented in our community: women, those with a Black, Asian and Minority Ethnic background and those with disabilities.\"</p>\n<p>Mr Arday, who had spoken many times about his childhood autism and learning difficulties, ticked two of those three boxes. . . .</p>\n<p>But the Arday affair will not quickly be forgotten, and the questions of whether Cambridge cherishes DEI more than its own reputation will persist.</p></blockquote>\n<p>Even the <a href=\"https://www.nytimes.com/2026/08/08/opinion/cambridge-plagiarism-arday-higher-education.html\" target=\"_blank\" rel=\"noopener\">New York Times</a> can state the obvious:</p>\n<blockquote><p>In 2023, The Times of London paraphrased comments from the head of Mr. Arday's academic department, writing that his hiring \"was proof of the university's commitment to tackling existing inequalities.\" \"To any students or prospective colleagues who are wondering if Cambridge is a place where they can belong, the answer is, emphatically, yes,\" she told the paper.</p>\n<p>If Mr. Arday isn't just a scholar, but a symbol of his university's commitment to social justice, perhaps that made it more difficult for Cambridge to examine its own role in his ascent—and to delay, by several damaging years, the full investigation Mr. Arday's case so obviously warranted.</p></blockquote>\n<p>Cambridge is an institution that dates back to 1209—before Magna Carta! Yet somehow, the DEI madness of the post-George Floyd era allowed them to look past all of the red flags. And if Cambridge succumbed to this mania, then far-less prestigious institutions likely made even worse errors.</p>\n<p>The academy cannot perform its function of pursuing truth and knowledge if certain groups are afforded preferential treatment at every stage of their careers, and then are shielded from criticism for fear of undermining the entire DEI process. Arday was caught. There are likely others who should be caught.</p>\n<p><strong>Update</strong>: John McWhorter has more at <a href=\"https://www.city-journal.org/article/cambridge-professor-jason-arday-plagiarism?utm_source=virtuous&amp;utm_medium=email&amp;utm_campaign=cjdaily&amp;vcrmeid=S5RRgTsZ0Em20OfbrGEs6w&amp;vcrmiid=x9TejgGmsEqeQWnbcaWT2Q\" target=\"_blank\" rel=\"noopener\">City Journal</a>:</p>\n<blockquote><p>Arday merely reinforced long-established and simplistic pieties. He became the equivalent of a full professor at Cambridge based on doing interviews with acquaintances about the racism they experienced, and then largely just presenting what they said. At its highest level, this could be good (but not great) journalism; it could not be academic work. On the level Arday worked, my 14-year-old could best him after some quick training in Latinate, Judith Butler-esque prose. . . .</p>\n<p>Even worse than Arday's work displaying no actual excellence is the consequence that characters like him wind up passing the torch to the next generation of black scholars. In a career spent in and around academia, I've seen this happen too many times. I refer to nothing like all black academics. But this is a vortex that young black scholars are sadly vulnerable to being pulled into, aided and abetted by white fellow travelers. . . .</p>\n<p>Arday had no original ideas. He can't teach someone how to write because his writing consists of, well, \"mimicry.\" (Even his resignation letter seems likely to have been <a href=\"https://www.thetimes.com/uk/education/article/jason-arday-resignation-letter-ai-generated-ztdxbqhc9\" target=\"_blank\" rel=\"noopener\">generated by AI</a>.) There are reports that—big surprise—Arday had no idea what actual teaching was and couldn't be bothered with supervising students' work, probably because he had never done any himself. People taught by versions of this type end up occupying an alternative academic universe, where cultural fellowship and advocacy are the North Star, and learning and curiosity get lip service but are beside the point. . . .</p>\n<p>The mentees, evangelized in the conviction that their blackness is what makes them matter rather than hard mental work, do not learn how to reason closely and clearly. And again, white academics make sure that they never have to. An eminent white academic once contacted me while on a committee evaluating a black scholar for a prestigious award, asking me what I thought of the person's work. The truth was that the scholar's writings and presentations were earnest but unstructured and unoriginal. From acquaintance, I knew that she could have done much better than this but simply had never been taught how. She was on the shortlist transparently because she was black. Many like her get the award nevertheless—and the torch passes on. . . .</p>\n<p>But if Stephen Hawking's work were mediocre, no one would have celebrated it. The intelligent take would be to pity that his physical misfortune had prevented him from achieving something on a meaningful level. Let us imagine a white version of Arday with long blond hair (not dreadlocks, because I suspect those would have a sirenic effect on many as signaling an allegiance to social justice). Even with the same claimed experiences as Arday, this man with long blonde locks would not be celebrated as brilliant—but as someone sadly denied the chance for brilliant achievement. . . .</p>\n<p>The only reason people would believe all this damnable foolishness—and remember, across the pond they're not wowed by his lovely accent the way Americans are—is that they see Arday as a Magic Negro. The kindly, antiracist white academics think suspending their judgment when it comes to a black man makes them good people. . . .</p>\n<p>The youngest-ever black professor at Cambridge properly should have been a physical education teacher who did some after-hours tutoring. A make-believe academic who misspelled paltry as poultry in the title slide of a keynote address instead scaled the heights of Britain's Harvard because of his skin color and his exceptionally long dreadlocks.</p></blockquote>"}];
var currentIndex = 0;

function render() {
  var a = articles[currentIndex];
  document.getElementById('category').textContent = a.categoryLabel;
  document.getElementById('source').textContent = a.source;
  document.getElementById('author-block').innerHTML = a.author
    ? '<span class="sep">·</span><span>' + esc(a.author) + '</span>'
    : '';
  document.getElementById('word-count').textContent = a.wordCount + ' words';
  document.getElementById('reading-time').textContent = a.readingTime + ' min read';
  document.getElementById('title').textContent = a.title;
  document.getElementById('article-body').innerHTML = a.content;
  document.getElementById('original-link').href = a.url;
  document.title = a.title + ' — Daily Reader';

  var hasMore = articles.length > 1;
  document.getElementById('swap-bar').style.display = hasMore ? 'flex' : 'none';
  if (hasMore) {
    document.getElementById('swap-counter').textContent = (currentIndex + 1) + ' / ' + articles.length;
    document.getElementById('swap-btn').disabled = (currentIndex >= articles.length - 1);
    document.getElementById('skip-btn').disabled = (articles.length <= 1);
  }
  window.scrollTo(0, 0);
}

function nextArticle() {
  if (currentIndex < articles.length - 1) {
    currentIndex++;
    render();
  }
}

function skipArticle() {
  if (articles.length <= 1) return;
  articles.splice(currentIndex, 1);
  if (currentIndex >= articles.length) currentIndex = articles.length - 1;
  render();
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
