*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

.article-body li {

.article-body a {

}

.article-body em { font-style: italic; }

<script>
var articles = [{"title":"Small Programming Tricks","source":"Hacker News Best","author":"","url":"https://will-keleher.com/posts/small-programming-tricks-matter/","category":"tech","categoryLabel":"Technology","wordCount":767,"readingTime":4,"content":"<p>Day to day, I think a surprising amount of engineering productivity comes from small nuggets of knowledge: being aware that a language feature exists; knowing that an unexplained tcp delay is probably related to the TCP_NO_DELAY setting and Nagle’s algorithm; knowing the right git incantation to get out of a pickle; or knowing a trick with sed to rewrite a file.</p>\n<p>In one sense, this is self-evident: anything you know is going to be made up of smaller pieces of knowledge. <em>Of course</em> those smaller pieces of knowledge matter.</p>\n<p>But I think there are some nuggets of knowledge that are particularly valuable and don’t require a lot of supporting mental infrastructure. You don’t need to know any python to use python3 -m http.server to start a simple server in a directory, but it might still make your work marginally easier. Let me share a few examples:</p>\n<ul>\n<li>You probably know that ctrl + r allows searching your terminal’s command history, but if you install <a href=\"https://github.com/junegunn/fzf\" target=\"_blank\" rel=\"noopener\">fzf</a>, you can set it up so that ctrl + r does a fuzzy search. If you want even more power, <a href=\"https://github.com/ellie/atuin\" target=\"_blank\" rel=\"noopener\">atuin</a> replaces your shell history with a searchable SQLite database. <a href=\"https://github.com/jimhester/per-directory-history\" target=\"_blank\" rel=\"noopener\">per-directory-history</a> lets you switch back and forth between searching for commands that have been run in a specific directory or searching all previous commands. Finally, you can configure how much history to store: <a href=\"https://unix.stackexchange.com/questions/273861/unlimited-history-in-zsh\" target=\"_blank\" rel=\"noopener\">stackoverflow question</a>.</li>\n<li>You can SELECT without a FROM. This can be useful for testing out how a function in your database actually works or reminding yourself how SELECT TRUE &lt;&gt; NULL works.<a href=\"https://will-keleher.com/posts/small-programming-tricks-matter/#fn:1\" target=\"_blank\" rel=\"noopener\">1</a></li>\n<li>PostgresSQL and MySQL both support explain analyze which will actually run the query you’re trying to optimize and give you a ton more information about its performance.</li>\n<li>In regular expressions, \\b, the <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Word_boundary_assertion\" target=\"_blank\" rel=\"noopener\">word boundary assertion</a>, makes it easy to look for the beginnings or ends of words.</li>\n<li>You can use logarithms with metrics to get a sense of the distribution of values for a field you’re interested in:\nconst bucket = Math.floor(Math.log10(userInGroupCount))\nmetrics.increment(\"my_metric\", { bucket });\n</li>\n<li>Modern JS now supports <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/flatMap\" target=\"_blank\" rel=\"noopener\">Array.flatMap</a>, <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/entries\" target=\"_blank\" rel=\"noopener\">Object.entries</a>, and <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/withResolvers\" target=\"_blank\" rel=\"noopener\">Promise.withResolvers</a>.</li>\n<li>In NodeJS, you can keep a connection open to an external resource by creating an <a href=\"https://nodejs.org/api/https.html#class-httpsagent\" target=\"_blank\" rel=\"noopener\">https.Agent</a> and then providing it to your http requests: fetch(url, {method, agent}). This can have a dramatic impact on latency.</li>\n<li>git log -S pattern (<a href=\"https://git-scm.com/book/en/v2/Git-Tools-Searching\" target=\"_blank\" rel=\"noopener\">”git pickaxe”</a>) can give you all commits that <em>added or removed</em> a string in a codebase. It’s amazingly useful especially with older codebases! (git log -G pattern is similar, but will also show when that line was moved)</li>\n<li>Similar to cd -, you can use git checkout - to check out your previous HEAD.</li>\n<li><a href=\"https://will-keleher.com/posts/you-probably-dont-need-find/\" target=\"_blank\" rel=\"noopener\">You probably don’t need find</a>. A lot of find commands can be replaced with globs like **/*.md. Most shells support this out of the box, but with bash, you need to turn this on with shopt -s globstar.</li>\n<li>In a similar vein, most folks will probably want to use rg (ripgrep) rather than grep, ack, or ag.</li>\n<li>zsh’s advanced autocompletion features aren’t turned on by default:\nif type brew &amp;&gt;/dev/null; then\n    FPATH=\"$(brew --prefix)/share/zsh/site-functions:${FPATH}\"\nfi\nautoload -Uz compinit\ncompinit\n</li>\n</ul>\n<p>You might have already known all of these things! Or you might work in a domain that makes all of these little tricks totally useless. Even if this particular set of tricks isn’t useful for you, I bet you have your own stash of tricks that you’ve accumulated over the years that makes your work easier.</p>\n<p>At a company, I think even more knowledge tends to be this sort of small high-leverage nugget:</p>\n<ul>\n<li>To debug $PROBLEM, use $DATA_SOURCE.</li>\n<li>$PERSON knows a ton about $AREA and they’re happy to help if you get stuck</li>\n<li>There are good docs about $HARD_THING $OVER_HERE.</li>\n<li>When $THING happens, it means we should manually scale out.</li>\n<li>To do a rolling restart of a service, run $THIS_COMMAND.</li>\n<li>This $UTIL makes $THAT_PROBLEM easy to script.</li>\n</ul>\n<p>At a previous company, I shared a trick on slack every day with the engineering team, both technical and company-specific, and folks found them pretty useful. Even if you knew 9/10 tricks, that 10th doc or technique might save you some time! And one trick per day was the right number to avoid overwhelming people with knowledge, and it could occasionally spark useful discussion. If you’re a more senior engineer at your company, you might think about doing something similar.</p>\n\n<ol>\n<li>\n<p>I think I first saw this technique on <a href=\"https://jvns.ca/\" target=\"_blank\" rel=\"noopener\">Julia Evan’s blog</a>, and I think her writing often perfectly encapsulates the idea behind this post: \"small bits of knowledge are powerful! and fun! and approachable!!\" <a href=\"https://will-keleher.com/posts/small-programming-tricks-matter/#fnref:1\" target=\"_blank\" rel=\"noopener\">↩︎</a></p>\n</li>\n</ol>"},{"title":"The King Is Watching devs are making The Crab is Walking, this journalist is writing","source":"Rock Paper Shotgun","author":"Edwin Evans-Thirlwell","url":"https://www.rockpapershotgun.com/the-king-is-watching-devs-are-making-the-crab-is-walking-this-journalist-is-writing","category":"gaming","categoryLabel":"Gaming","wordCount":548,"readingTime":3,"content":"<p>Although one of the crabs is a spider, actually</p>\n    \n  \n  \n  \n  \n            <p>\r\n<a href=\"https://www.rockpapershotgun.com/games/the-king-is-watching\" target=\"_blank\" rel=\"noopener\">The King Is Watching</a> developers Hypnohead have announced The Crab Is Walking, a roguelite city-builder in which you alternate between arranging tetromino-shaped city districts on the back of a colossal crustacean, and sending out armies of Mad Maxalots to slaughter wasteland insects. Unlike in The King Is Watching, you do not have to actively train your gaze on your crab metropolis to stop it slacking off.\r\n</p>\n<p>\r\nI am amusing myself imagining the cycles of brainstorming that led from one game's setup to the other. \"The King Is Wattling? The King is Swatching? The King Is Walking? Nonsense, Kings do not walk, they have sedan chairs. Hang on, what other things can be Kings? Lions? Ridiculous, you could never build a city on a lion – their spines are too narrow. Crabs though? Crabs have nice flat backs.\" I must point out that the developers appear to have already gotten bored with their own premise - one of the monstrous scuttling cities in the screenshots is actually a spider. Such a slap in the face for carcinologists! Here's a trailer.\r\n</p>\n\n<p>\r\nThey're promising \"deep strategy combined with short runs\". Each run you pick a different Ride to found a settlement on, and a different Rider to lead your folks into battle against the post-apocalyptic wildlife. Each Ride/Rider combo is productive of different playstyles. \"Play to your advantages, work with your weaknesses, and find the pair that works for you,\" the devs advise. \"The rabbit was fast. The turtle was persistent. You have a giant crab.\" OK, Hypnohead, are you referencing a proverb or can I build a city on a rabbit in this game? Because if that's the case, I'm going to report you for false advertising.\r\n</p><p>\r\nBetween battles with the chittering wretches of the vast sandy nothing, you'll arrange and combine districts on a grid to either increase production, fuel your Ride, or bolster your army. I'm not sure how the combat aspect works, exactly, but it looks like an autobattler in the trailer.\r\n</p>\n<p>\r\nIn a Steam blog post, Hypnohead address the question of why they aren't (currently) making The King Is Watching 2. \"We’re still working on The King is Watching and releasing new content for it, so this isn’t the time for a sequel,\" they comment. \"Our next update will focus more heavily on gameplay variety, and we already have a rather large folder full of ideas for where its central mechanic could go next. We also understand much better what players enjoy about the game, and we’ll be carrying those lessons into everything we make from here. So, who knows? Perhaps one day that folder will become something more…\"\r\n</p>\n<p>\r\nThey add that \"The Crab is Walking gives us room to attempt things that weren’t possible or practical in The King is Watching,\" which might sound farcical out of context, but is actually about how they've come along as artists and designers. \"We’re working with a different resolution, allowing for more detailed pixel art and more elaborate animations,\" the devs go on. \"We’re also introducing more sophisticated unit behaviour, combat statistics, and a more convenient, polished interface.\"\r\n</p>\n<p>\r\nThe Crab Is Walking has no release date yet, but playtests will begin in 2027. Clawsome! Read more on <a href=\"https://store.steampowered.com/app/5145940/The_Crab_is_Walking/\" target=\"_blank\" rel=\"noopener\">Steam</a>.\r\n</p>"},{"title":"The Violent Feud That Shocked the Horse World","source":"Longreads","author":"Carolyn Wells","url":"https://longreads.com/2026/09/16/the-violent-feud-that-shocked-the-horse-world/","category":"fun","categoryLabel":"Interesting Reads","wordCount":515,"readingTime":3,"content":"<p>Ian Parker does not hold back in painting the egos of the characters in this horse‑world scandal, clearly growing tired at times of the pomposity of Michael Barisone, a U.S. dressage trainer and former Olympian who shot his student, Lauren Kanarek, after an escalating feud. Claiming that Kanarek’s online taunts and complaints drove him insane, Barisone was eventually found not guilty, though later banned from his sport by the U.S. Center for SafeSport. Tread carefully as you enter this arena; narcissism lurks everywhere.</p>\n<blockquote>\n<p>The first time I called him, he said, of the case, “You’re going to find it is a John Grisham novel combined with ‘Fatal Attraction’ combined with ‘Yellowstone.’ ” Barisone’s story has its evident hero, and its villain is Kanarek, his victim. In this presentation of events—a “scum of the earth” client, in his words, and a terrific guy who snapped, as anyone would have—Barisone has enjoyed near-universal support from the dressage community, and beyond. In much of the online discussion about the case, including in the forums of <em>The Chronicle of the Horse</em>, a long-established magazine, commenters have identified two victims, not one, and have almost always found Barisone’s victimhood the more compelling. A woman was shot, but a man was driven to shoot her, because she was annoying, and at times belligerent, in person and on social media. Kanarek has been widely scorned as a dressage interloper and as an embodiment of contemporary ills: a bullshitter, an entitled troll.</p>\n</blockquote>\n\n\t\t\t\t\t\t\t<h2>\n\t\t\t\t\tMore horsey picks \n\t\t\t\t</h2>\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2025/07/11/cloning-came-to-polo-then-things-got-truly-uncivilized/\" target=\"_blank\" rel=\"noopener\">Cloning Came to Polo. Then Things Got Truly Uncivilized</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tMatt Reynolds | Wired | July 10 | 5,668 words \t\t\t\t</p>\n\t\t\t\t\t\t<p>“A polo legend and a businessman joined forces to copy the player’s greatest horse. But with a single clone worth $800,000, some technologies are a breeding ground for betrayal.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2024/11/20/he-thought-he-knew-horses-then-he-learned-to-really-listen/\" target=\"_blank\" rel=\"noopener\">He Thought He Knew Horses. Then He Learned to Really Listen.</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tSterry Butcher | New York Times Magazine | November 12, 2024 | 3,896 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Warwick Schiller made his name as an expert trainer. An enigmatic little horse completely changed his outlook.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/10/10/do-you-need-a-visit-to-the-confident-man-ranch/\" target=\"_blank\" rel=\"noopener\">Do You Need a Visit to the Confident Man Ranch?</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tRosecrans Baldwin | GQ | September 28, 2023 | 4,594 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“At the foot of the Rockies, the operators of a dude ranch retreat are blending cowboy culture and group therapy.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/07/11/ride-the-good-witches/\" target=\"_blank\" rel=\"noopener\">Ride the Good Witches</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tPam Houston | Outside | July 11, 2023 | 2,708 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“She threw herself into bonding with a breed of horse that seems touched by Viking spirit.”</p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2023/04/11/saving-the-horses-of-our-imagination/\" target=\"_blank\" rel=\"noopener\">Saving the Horses of Our Imagination</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tAshley Stimpson | Sunday Long Read | April 9, 2023 | 5,236 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“Creamer wasn’t just coming up against locals’ attachment to their horses, but a pernicious human tendency to confuse profound affection for animals with wisdom about what’s best for them.” </p>\n\t\t\t\t\t\n\t\n\t\n\t\t\n\t\t\t\t\t\t<h3><a href=\"https://longreads.com/2017/07/07/a-kingdom-for-a-horse-kokpar-and-the-future-of-kazakhstan/\" target=\"_blank\" rel=\"noopener\">A Kingdom for a Horse: Kokpar and the Future of Kazakhstan</a></h3>\t\t\t\t\t\t\t<p>\n\t\t\t\t\tWill Boast | Virgina Quarterly Review | July 3, 2017 | 5,100 words\t\t\t\t</p>\n\t\t\t\t\t\t<p>“[N]owhere in this region is the contrast between the contemporary and the ancient higher than in Kazakhstan. And nowhere is the interplay between the two more starkly embodied than in professional Kazakh kokpar.”</p>"},{"title":"Doctor/Political Candidate Has Standing to Sue Over Medical Board Investigations Related to His Public Comments about the COVID Pandemic","source":"The Volokh Conspiracy","author":"","url":"https://reason.com/volokh/2026/09/15/doctor-political-candidate-has-standing-to-sue-over-medical-board-investigations-related-to-his-public-comments-about-the-covid-pandemic/","category":"law","categoryLabel":"Law","wordCount":1352,"readingTime":7,"content":"<p>From today's decision in <em><a href=\"https://ecf.ca8.uscourts.gov/opndir/26/09/251812P.pdf\" target=\"_blank\" rel=\"noopener\">Jensen v. Minn. Bd. of Med. Practice</a></em>, written by Eighth Circuit Judge David Stras and joined by Judges James Loken and Lavenski Smith:</p>\n<blockquote><p>Years of investigations by the Minnesota Board of Medical Practice caused Dr. Scott Jensen to speak less and spend more. Either would be enough for a court to hear his case, so we reverse….</p>\n<p>Like the rest of the country, the COVID-19 pandemic divided Minnesotans. Some public officials, including Governor Tim Walz, pushed for aggressive measures to \"stop the spread\" of the virus. Others like Dr. Scott Jensen, then a state senator, had a different view. He opposed vaccine mandates and believed it was a mistake to close businesses and schools. He ran on that message as the Republican nominee for governor in the 2022 election.</p>\n<p>Not everyone liked what he had to say. So much so that, from the pandemic's start until mid-2022, the Minnesota Board of Medical Practice received 18 complaints about him. The objection was almost always the same: Dr. Jensen was \"spreading misinformation\" and posed a \"danger to public health.\" … [T]he 18 complaints led to four investigations. At the start of each one, the Board sent him a letter detailing the allegations. Two asked him to \"respond[ ] in writing[ ]\" and reminded him that, \"as a licensee of the Board,\" he was \"required to cooperate fully.\" When he replied to those, he provided the Board with hundreds of pages of information, including news stories about the pandemic, medical studies, and patient records.</p>\n<p>One, which lasted more than a year, took on a life of its own. Like the others, it began with a letter informing him that the Board was investigating an allegation that he had \"politiciz[ed] public health.\" He cooperated, but the Board waited until after the election to request an \"in-person conference.\" The notice listed multiple possible violations, including \"unethical or improper conduct\" and \"depart[ing] from or fail[ing] to conform to the minimal standards of acceptable and prevailing medical practice.\"</p>\n<p>The subject line underscored the high stakes involved: \"In the Matter of the Medical License of Scott M. Jensen, M.D.\" He hired a lawyer and spent countless hours preparing. After the conference ended, so did the investigation.</p></blockquote>\n<p>Jensen sued, claiming the investigations violated the First Amendment, and the court held that he had standing to raise this claim (even though he was challenging just the investigations, and not any actually implemented disciplinary measures):</p>\n<blockquote><p>Grounded in the case-or-controversy requirement of Article III, standing ensures that the person suing—here, Dr. Jensen—has the \"personal stake\" necessary for a federal court to intervene. Satisfying it requires \"(1) an injury in fact; (2) a causal connection between the injury and the challenged [action]; and (3) a likelihood of redressability.\" …</p>\n<p>At the motion-to-dismiss stage, \"we [must] assume the allegations in the complaint are true and view them in the light most favorable to [Dr. Jensen].\" Even \"general factual allegations of injury resulting from the defendant's conduct\" are enough because \"we presum[e] that [they] embrace those specific facts that are necessary to support the claim.\" They can—and often do—lead to plausible inferences that satisfy all three standing requirements.</p>\n<p>We have little doubt that Dr. Jensen's complaint clears these hurdles when it comes to causation and redressability. At a minimum, the alleged \"ever-present threat of further investigation,\" backed by a list of past investigations, adequately connects his chilled speech and time and money spent responding to what the Board <em>did.</em> Money damages would redress those injuries. And to the extent these past investigations affect his present and future willingness to speak, an injunction would remedy it.</p>\n<p>The real battle is over whether Dr. Jensen alleged a sufficiently \"concrete and particularized\" injury….</p>\n<p>A \"pocketbook\" harm is a \"classic\" Article III injury. In general, monetary harm is an injury precisely because it is both concrete and particularized. Concreteness comes from the fact that it is \"real\" and \"actually exist[s].\" And it is \"particularized\" because it affected Dr. Jensen \"in a personal and individual way.\" Once the Board opened the investigations, <em>he</em> had an obligation to \"cooperate fully,\" including \"fully and promptly\" answering any questions and \"providing copies of patient medical records.\"</p>\n<p>Even a minor expenditure of \"time and resources\" counts as an injury. Here, according to the amended complaint, Dr. Jensen did more, far more. For the first few investigations, he was \"forced to spend hours of his time\" responding. But for the last one, which went on for more than a year, he spent countless hours working on his responses, including compiling documents and eventually hiring a lawyer. These steps, arising out of his [statutory] obligation to \"cooperate fully,\" led to out-of-pocket expenses and resulted in \"lost revenue because he took on fewer patients.\" Regardless of whether the Board thinks Dr. Jensen <em>should</em> have taken those actions, they are \"classic pocketbook injur[ies].\"</p>\n<p>{The \"pocketbook injury\" supports his claim for damages under both the First and Fourteenth Amendments. Arguably so does the time he lost \"communicating with voters on the campaign trail\" during the 2022 election. But given the other particularized and concrete injuries he suffered, there is no need to decide whether the harm to his campaign adds another.} …</p>\n<p>According to the amended complaint, the investigations also caused Dr. Jensen to change his \"message to … constituents\" and \"decline invitations to public[-]speaking events.\" These general allegations are enough to create a plausible inference that his speech was chilled, something he allegedly told the Board in 2020, shortly after the first investigation began. As we have explained, \"one type of injury that confers Article III standing\" in First Amendment cases is \"when a plaintiff is chilled from exercising h[is] right to free expression.\" It happens when a \"government official's conduct would cause a person of ordinary firmness to self-censor.\" Exactly the situation we have here….</p>\n<p>In addition to general allegations that he changed his message and declined multiple invitations, the amended complaint mentioned that he \"took great care to make certain that people understood when he was speaking as a candidate and when he was speaking as a family doctor,\" something none of his opponents had to do. In the face of professional sanctions, Dr. Jensen believed the risk of speaking \"candidly and honestly\" about \"COVID-19 vaccines and other government interventions in personal-health care decisions\" presented too great a risk.</p>\n<p>A reasonable person in his position would have reacted the same way. After a steady stream of letters from the Board, anyone in Dr. Jensen's shoes would have been concerned about a looming and \"credible threat of enforcement.\" In fact, it would have been unreasonable to ignore the threat given the consequences, which included the potential loss of his medical license.</p>\n<p>It makes no difference that Dr. Jensen \"tailored his message\" rather than abandoned it. After all, changing the \"when, where, and how\" of speech is an injury. A chilling effect may not be as tangible as a pocketbook injury, but it is still a \"concrete and particularized\" harm….</p>\n<p>The chilling effect he continues to experience also qualifies as an \"ongoing\" injury supporting injunctive relief. Again a candidate for public office, Dr. Jensen continues to be \"active in the media\" and interact with \"members of the public\" with the goal of educating them about how current officeholders mismanaged the pandemic. In other words, he is in the same position as before, seeking to engage in \"substantially similar activity\" without having to worry about potentially losing his medical license.</p>\n<p>It is hard to imagine a situation in which the \"threat of future enforcement\" could be more credible. After 18 complaints and four investigations, pretty \"good evidence\" of \"past enforcement against the same conduct,\" the threat against Dr. Jensen is far from \"chimerical.\" And the fact that anyone can file a complaint turns him into an \"easy target[ ]\" for \"political opponents.\" …</p></blockquote>\n<p>The court sent the case back down to the district court to consider the merits: \"[O]ur usual approach in these circumstances is to let the district court have the first crack at them.\"</p>\n<p>Nicholas James Nelson, Douglas Seaton, and James Dickey represent plaintiffs.</p>"}];
