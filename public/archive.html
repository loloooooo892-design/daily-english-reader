<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive — Daily Reader</title>
<style>
:root {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191C22;
    --bg-card: #1F232B;
    --text: #CDD1DA;
    --text-secondary: #8890A0;
    --text-faint: #555D6E;
    --accent: #7BA0D0;
    --accent-light: #252D3A;
    --border: #2A2F3A;
  }
}

:root[data-theme="dark"] {
  --bg: #191C22;
  --bg-card: #1F232B;
  --text: #CDD1DA;
  --text-secondary: #8890A0;
  --text-faint: #555D6E;
  --accent: #7BA0D0;
  --accent-light: #252D3A;
  --border: #2A2F3A;
}

:root[data-theme="light"] {
  --bg: #F7F8FA;
  --bg-card: #FFFFFF;
  --text: #2B2F38;
  --text-secondary: #7E8594;
  --text-faint: #A3A9B5;
  --accent: #4B6B9A;
  --accent-light: #E8EDF4;
  --border: #E2E5EB;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: 0 1.25rem;
}

.container {
  max-width: 38em;
  margin: 0 auto;
  padding: 3rem 0 4rem;
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
}

.subtitle {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-bottom: 2.5rem;
}

.month-group {
  margin-bottom: 2rem;
}

.month-label {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem;
}

.entry {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.5rem 0;
  text-decoration: none;
  color: var(--text);
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}

.entry:hover {
  border-bottom-color: var(--border);
}

.entry-date {
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
  flex-shrink: 0;
  width: 3rem;
}

.entry-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.9375rem;
  flex: 1;
  min-width: 0;
}

.entry-category {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.1em 0.45em;
  border-radius: 2px;
  flex-shrink: 0;
}

.entry-source {
  font-size: 0.75rem;
  color: var(--text-faint);
  flex-shrink: 0;
  display: none;
}

.home-link {
  display: inline-block;
  margin-top: 2rem;
  font-size: 0.8125rem;
  color: var(--accent);
  text-decoration: none;
}

.home-link:hover {
  text-decoration: underline;
}

@media (min-width: 480px) {
  .entry-source { display: block; }
}

@media (max-width: 480px) {
  .container { padding: 2rem 0 3rem; }
  h1 { font-size: 1.3rem; }
}
</style>
</head>
<body>
<main class="container">
  <h1>Archive</h1>
  <p class="subtitle">All past readings</p>

  <div class="month-group">
  <div class="month-label">July 2026</div>
  <a href="archive/2026-07-27.html" class="entry">
    <span class="entry-date">27</span>
    <span class="entry-title">South Korea urged to extend protections for women after appeal decision in abortion case exposes legal vacuum</span>
    <span class="entry-category">Law</span>
    <span class="entry-source">Jurist</span>
  </a>
</div>


  <a href="index.html" class="home-link">← Today's read</a>
</main>
</body>
</html>
